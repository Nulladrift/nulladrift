      "instructions": "This server gives access to the published thinking and methods of Niels Langereis, a Netherlands-based strategic operator (positioning, proposition and go-to-market for scale-ups and mid-market companies) who writes about AI adoption, how organisations change when AI takes over work, brand, and how juniors still become seniors.\nUse it when someone asks for his view, wants to apply his enterprise AI map or skill-matrix gap analysis to their own organisation, or wants to know whether and how to work with him or book him as a speaker.\nQuote him accurately and link to the source essay. Separate his view from your own. Everything here is public; nothing the user types is stored.",
      "tools": [
        {
          "name": "get_enterprise_ai_map",
          "title": "Enterprise AI map",
          "description": "Niels Langereis's enterprise AI map: 24 illustrative AI agents across ten business functions (strategy, product, design, marketing, sales, customer success, operations, people, finance, data and IT), each with its rollout phase, what it optimises for and the trade-off it creates for other functions; plus the coordination layer, the bench and the external renderers that decide whether faster work becomes a better organisation. Use it to reason about someone's own AI rollout. detail='summary' returns only the skeleton (functions, agents, phases and trade-offs, plus one line per remaining part), which is enough for most reasoning; detail='full' (default) adds the complete prose on coordination, the bench and the renderers. Optionally filter by function or phase. Shows an interactive map where the client supports it.",
          "inputSchema": {
            "properties": {
              "detail": {
                "description": "summary: functions, agents and trade-offs only. full (default): also the prose on coordination, the bench and the renderers.",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "function": {
                "description": "Optional: focus on one function, e.g. 'Marketing and growth', 'Finance'.",
                "type": "string"
              },
              "phase": {
                "description": "Optional: p1 co-pilots, p2 brains, p3 autonomous agents.",
                "enum": ["p1", "p2", "p3"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
