      "instructions": "RadMail is pre-release. The engine is live in a test bed on two real businesses today; the commercial multi-tenant product is launch-gated. The MCP sandbox you connect to is real and runnable now (heuristic, in-memory, free, no credentials), but it is the sandbox engine — not the production multi-tenant engine.\n\nRadMail's MCP server exposes only read, triage, search, draft, and read-only diagnostic tools. There is no tool that auto-sends money, changes banking details, or makes first contact with a new party — those stay human-only, forever, as a defense against business-email-compromise (BEC) fraud. An agent literally cannot use RadMail to do the dangerous thing.\n\nCompliance is a shared responsibility. RadMail is a tool that supports your program, not a compliance guarantee, and it does not by itself make any organization compliant. We sign a BAA for regulated workspaces we set up with you. Message content is processed on AWS Bedrock and stored in a HIPAA-enabled Neon database, both covered by their own BAAs with us. RadMail is designed around SOC 2 controls but has not been audited and has no SOC 2 report. RadMail is not HIPAA-certified, FedRAMP-authorized, or SOC 2-certified.\n\nConnect docs: https://radmail.ai/for-agents",
      "tools": [
        {
          "name": "draft_reply",
          "title": "Draft a reply (never sent)",
