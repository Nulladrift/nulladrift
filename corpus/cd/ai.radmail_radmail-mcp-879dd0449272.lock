      "transport": {
        "type": "http",
        "url": "https://radmail.ai/api/mcp/sandbox"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "radmail-sandbox",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "RadMail is pre-release. The engine is live in a test bed on two real businesses today; the commercial multi-tenant product is launch-gated. The MCP sandbox you connect to is real and runnable now (heuristic, in-memory, free, no credentials), but it is the sandbox engine — not the production multi-tenant engine.\n\nRadMail's MCP server exposes only read, triage, search, draft, and read-only diagnostic tools. There is no tool that auto-sends money, changes banking details, or makes first contact with a new party — those stay human-only, forever, as a defense against business-email-compromise (BEC) fraud. An agent literally cannot use RadMail to do the dangerous thing.\n\nCompliance is a shared responsibility. RadMail is a tool that supports your program, not a compliance guarantee, and it does not by itself make any organization compliant. For regulated tiers RadMail signs a BAA and processes on BAA-covered, audited infrastructure. RadMail is not HIPAA-certified, FedRAMP-authorized, or SOC 2-certified.\n\nConnect docs: https://radmail.ai/for-agents",
      "tools": [
        {
          "name": "draft_reply",
          "description": "Draft a reply for a thread. It returns text for a human to review — it does not and cannot send it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "guidance": {
                "description": "Optional steer for the draft. Never sent — review-only.",
                "type": "string"
              },
              "message_id": {
                "description": "An id from triage_inbox to draft a reply for.",
                "type": "string"
              }
            },
            "required": ["message_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3d5b9905350073dbecf2ce7da16a162d7b3c3e04d86c5aacf13f332e30f07627"
        },
        {
          "name": "list_commitments",
          "description": "Extract the open commitments in the correspondence, both owed by you and owed to you, with who and by-when.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5c2660e73f93f2f67ce912c1d795296327a12a2a04f9aa225a25b937c86eb791"
        },
        {
          "name": "list_right_now",
          "description": "Return only the 'Right Now' lane — the most recent and most important messages that genuinely can't be missed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9545996b53a66b2bb10775f6ca03f20619af4141b173d12e96d211ff82b6916a"
        },
        {
          "name": "search",
          "description": "Find a specific message by sender, subject, or content. Results come back most-relevant + newest first, and every hit says where it matched (from / subject / body) and why. On this hosted sandbox it searches the built-in demo inbox; run the radmail-mcp package with RADMAIL_API_KEY set and the same tool searches your REAL ingested inbox read-only (with from / after / before filters) via the v1 search API.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max hits to return (default 10).",
                "type": "number"
              },
              "query": {
                "description": "Words to find, matched against from / subject / body. Every word must appear somewhere in a message.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5a67baabade9fe36a31001bdcde08ba922e944e0d170f9758c37563eec8bf89e"
        },
        {
          "name": "triage_inbox",
          "description": "Rank a mailbox on two axes (importance x urgency) and return what needs a human now versus what can wait or is already handled — with each thread's open commitment (the promise you owe or are owed, and whether it's overdue) surfaced inline, so the follow-through is visible on the very first call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9560b7631ee9c4ef8b5b193a5d1b1d91c8fd506ce633559e62e3440164a0e2a3"
        },
        {
          "name": "why_surfaced",
          "description": "Explain in plain English why a given message was surfaced — the signals (sender, urgency, commitment) behind its rank.",
