      "serverInfo": {
        "name": "advocate",
        "title": "Advocate",
        "version": "1.10.1",
        "description": "Find participating local businesses, read their published services and policies, and request a quote or callback. Eligible businesses offer a quote-request form. Other tools support configured availability, reservation requests, pending subscriptions and human handoffs. Price estimates and business-agent answers may use AI; a quote request does not confirm a price or booking.",
        "websiteUrl": "https://app.advocatemcp.com"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Advocate serves participating local businesses. For each one it serves the services and prices, credentials, cancellation policy and booking route the business has published; where the business has set it up, assistants can also check open appointment times and send booking requests. To work with one business, call search_businesses with its name or the service wanted plus an optional location; results carry the business's slug and profile_url. Pass that slug to the business-scoped tools. Tools whose readOnlyHint is true (no reservation, contact or business-data change): search_businesses, list_services, get_availability, get_credentials, get_cancellation_policy, get_booking_destination, get_request_status. Acting tools create a record on the business's side, may spend from a budget, or are a step of a payment: get_quote, reserve_slot, confirm_booking, cancel_booking, get_payment_handoff_url, create_booking_payment_link, request_callback, request_service, submit_quote_request, subscribe_to_updates, initiate_handoff, query_business_agent; each result states what was and was not done. A business's own page may name this server as https://api.advocatemcp.com/mcp?business=<slug>; that slug is the one to pass.",
      "tools": [
        {
          "name": "cancel_booking",
          "title": "Cancel Booking",
          "description": "Cancels a confirmed booking. A booking on the business's Advocate calendar that takes no payment through Advocate takes the cancel_token confirm_booking returned, and nothing was paid through it. A paid booking takes the cancel_token from its payment receipt. Within 60 minutes of paying, or before the business's refund window, the full refund is requested; report it as full only after the payment ledger confirms it. After that window the deposit is forfeited under the booking's policy. A pending refund means cancellation is complete while refund verification or retry continues. A paid booking's token is held only by the agent that paid. The token of a booking that takes no payment through Advocate is held by the agent that confirmed it and sits in the customer's emailed receipt. If such a booking is already cancelled (by an earlier call, the customer's emailed link, or the business), the answer is status already_cancelled with refund no_payment, and nothing changes. Cancelling a paid booking twice answers the error already_cancelled with its refund state.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cancel_token": {
                "description": "The cancel_token from confirm_booking, or from the payment receipt of a paid booking",
                "maxLength": 400,
                "minLength": 1,
                "type": "string"
              },
              "reservation_id": {
                "description": "The reservation's id",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "slug": {
                "description": "Business slug identifier",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["cancel_token", "reservation_id", "slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "currency": {
                "type": ["string", "null"]
              },
              "pending_cents": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "refund": {
                "description": "no_payment: a booking that takes no payment through Advocate, nothing was paid through it; full: the payment ledger confirms the refund; none: deposit was forfeited; pending: cancellation is complete and refund verification or retry is pending",
                "enum": ["full", "none", "pending", "no_payment"],
                "type": "string"
              },
              "refunded_cents": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "reservation_id": {
                "type": "string"
              },
              "status": {
                "description": "already_cancelled: a booking that takes no payment through Advocate and was cancelled before this call; nothing changed",
                "enum": ["cancelled", "already_cancelled"],
                "type": "string"
              }
            },
            "required": ["currency", "pending_cents", "refund", "refunded_cents", "reservation_id", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a3262821335324a01055ec190a375049fec6253b5c78e95fe5089a8bb76a164c"
        },
        {
          "name": "confirm_booking",
          "title": "Confirm Booking",
          "description": "Confirm a reservation made with reserve_slot. Present the returned stored booking_details to the customer and relay only the customer-supplied 6-digit code received at their email or phone; never generate, guess, or fetch it. For an active configured calendar, a verified code attempts a direct commit to the selected calendar with no owner approval. booking_pending means the provider outcome is uncertain; repeat confirm_booking later to check the stored outcome, but it never retries a provider write automatically. A paid booking (reserve_slot returned payment.required = true) has no code: this answers payment_required — pay it with create_booking_payment_link — or payment_in_flight while its payment is settling.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "booking_authorization": {
                "description": "For provider invitations, relay the reserved reference only after the customer accepts the exact stored summary and notification effects; required for Calendly.",
                "properties": {
                  "accepted": {
                    "const": true,
                    "type": "boolean"
                  },
                  "reference": {
                    "format": "uuid",
                    "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                    "type": "string"
                  }
                },
                "required": ["accepted", "reference"],
                "type": "object"
              },
              "code": {
                "description": "The customer-supplied 6-digit confirmation code received at their own email or SMS contact. Relay only that supplied code; never generate, guess, or fetch it.",
                "pattern": "^\\d{6}$",
                "type": "string"
              },
              "reservation_id": {
                "description": "The reservation id returned by reserve_slot",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "slug": {
                "description": "Business slug identifier",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["code", "reservation_id", "slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cancel_token": {
                "description": "Present once, on the first confirmation of a booking on the business's Advocate calendar. Pass it to cancel_booking if the customer cancels. A capability for this booking: never pass it to another party.",
                "type": "string"
              },
              "message": {
                "description": "Optional customer-facing status detail to relay",
                "type": "string"
              },
              "provider_confirmation": {
                "additionalProperties": false,
                "properties": {
                  "booking_id": {
                    "type": "string"
                  },
                  "conference_state": {
                    "enum": ["pending", "ready", "unavailable"],
                    "type": "string"
                  },
                  "provider": {
                    "const": "calendly",
                    "type": "string"
                  }
                },
                "required": ["booking_id", "conference_state", "provider"],
                "type": "object"
              },
              "reservation_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "status": {
                "description": "'confirmed': a booking was committed to the selected configured calendar, or a historical legacy reservation was confirmed. 'booking_pending': the provider outcome is unresolved; do not create another booking or seek owner approval — repeat confirm_booking later to read the stored outcome. 'pending_merchant': a historical merchant-review reservation awaits a business decision — see message. 'already_confirmed': this reservation was confirmed earlier (safe replay).",
                "type": "string"
              }
            },
            "required": ["reservation_id", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5accb309b153ad4fa5f6b53d512329906a722e314693e51b1bb29954fe586265"
        },
        {
          "name": "create_booking_payment_link",
          "title": "Create Booking Payment Link",
          "description": "For a reservation that reserve_slot returned with payment.required = true: returns the MPP payment link, the amount charged now, and the balance due at the visit. The agent pays it itself (HTTP 402 challenge, then the person's wallet credential); no code is sent to the customer for a paid booking. A booking that takes no payment through Advocate answers payment_required false with a detail, not an error, and, if not confirmed yet, is confirmed with confirm_booking and the customer's code.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "reservation_id": {
                "description": "The reservation_id reserve_slot returned with payment.required = true",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "slug": {
                "description": "Business slug identifier",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["reservation_id", "slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "amount_cents": {
                "description": "Minor units charged now",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "balance_due_cents": {
                "description": "Minor units due at the visit",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "currency": {
                "type": "string"
              },
              "detail": {
                "description": "Present when payment_required is false: what to do instead, since no payment is taken through Advocate",
                "type": "string"
              },
              "due_at_visit": {
                "type": "boolean"
              },
              "expires_at": {
                "description": "Unix seconds after which the reservation lapses unpaid",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "instructions": {
                "type": "string"
              },
              "kind": {
                "enum": ["deposit", "full"],
                "type": "string"
              },
              "payment_link": {
                "description": "POST here (no body) to receive the HTTP 402 MPP challenge",
                "type": "string"
              },
              "payment_required": {
                "description": "true: payment for this booking is taken through Advocate; it may already be authorized or in flight, so ask for a new approval only if the pay route answers 402. Comes with payment_link, amount_cents, currency, kind, balance_due_cents, due_at_visit, expires_at and instructions. false: no payment is taken through Advocate for this booking, which does not mean the service is free. Comes with reservation_id and detail only.",
                "type": "boolean"
              },
              "reservation_id": {
                "description": "Present when payment_required is false",
                "type": "string"
              }
            },
            "required": ["payment_required"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:cfaae4f597b8ec0b2ebfb2be430c0c803048014bc40984e3ad95e8dcf4cbd9f5"
        },
        {
          "name": "get_availability",
          "title": "Get Business Availability",
          "description": "Return available windows from the business's active configured calendar, using its selected timezone, duration, operating hours, and current local or connected-calendar occupancy; supported scheduling providers supply their own slots. Use a returned window to start a booking. Availability can change before confirmation, including when the calendar provider is unavailable. If this business uses an unsupported calendar or booking provider, call get_booking_destination to find its published public booking route.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "Business slug identifier",
                "minLength": 1,
                "type": "string"
              },
              "window_end": {
                "description": "Unix seconds (absolute instant; default now + 7 days). See window_start on reading the response's `timezone`.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "window_start": {
                "description": "Unix seconds (absolute instant; default now). The business's own timezone is not an input — it is returned as `timezone` in the response. To target a local phrase like \"Tuesday afternoon\", request a generously wide window and filter the returned slots using that `timezone`.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "generated_at": {
                "type": "number"
              },
              "slots": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "capacity": {
                      "type": "number"
                    },
                    "end": {
                      "type": "number"
                    },
                    "start": {
                      "type": "number"
                    }
                  },
                  "required": ["capacity", "end", "start"],
                  "type": "object"
                },
                "type": "array"
              },
              "source": {
                "type": "string"
              },
              "timezone": {
                "type": "string"
              }
            },
            "required": ["generated_at", "slots", "source", "timezone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:23eec8ef01629057385ab3186af73d3b47d9dfb79ea0b60067fcd1077d2f0107"
        },
        {
          "name": "get_booking_destination",
          "title": "Get Booking Destination",
          "description": "Returns the public booking or inquiry route for a business. Use this before helping a user book an appointment: it distinguishes an external provider page, an active configured calendar using Advocate, an eligible quote-request form when neither booking route is available, and businesses with no supported destination. For native mode, booking_backend names the calendar Advocate books into and capabilities states whether availability, booking, cancellation and rescheduling are supported through Advocate. Cancellation is per booking: cancel_booking needs the cancel_token confirm_booking returned, or the one in a paid booking's payment receipt, so an agent cannot cancel a booking made on the page or one whose token it never received. External pages are links only; Advocate does not sync their availability or make bookings there. Request mode opens an editable form; sending requires explicit customer consent and confirms no time, price, payment, or booking.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "Business slug identifier",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "booking_backend": {
                "description": "Native mode only: which calendar Advocate books into for this business.",
                "enum": ["advocate", "google", "microsoft", "calendly"],
                "type": "string"
              },
              "capabilities": {
                "additionalProperties": false,
                "description": "Native mode only: what an agent can complete through Advocate for this backend. Unsupported actions have no tool; do not claim them.",
                "properties": {
                  "availability": {
                    "enum": ["supported", "unsupported"],
                    "type": "string"
                  },
                  "booking": {
                    "enum": ["supported", "unsupported"],
                    "type": "string"
                  },
                  "cancellation": {
                    "enum": ["supported", "unsupported"],
                    "type": "string"
                  },
                  "rescheduling": {
                    "enum": ["supported", "unsupported"],
                    "type": "string"
                  }
                },
                "required": ["availability", "booking", "cancellation", "rescheduling"],
                "type": "object"
              },
              "eligibility": {
                "type": ["string", "null"]
              },
              "guidance_for_agent": {
                "type": "string"
              },
              "kind": {
                "anyOf": [
                  {
                    "enum": ["appointment", "intake"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "mode": {
                "enum": ["external", "native", "request", "unavailable"],
                "type": "string"
              },
              "provider": {
                "anyOf": [
                  {
                    "enum": ["jane", "kilo", "teletherapy", "other"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "slug": {
                "type": "string"
              },
              "url": {
                "type": ["string", "null"]
              }
            },
            "required": ["eligibility", "guidance_for_agent", "kind", "mode", "provider", "slug", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c3b0f13b12b4ac514a4b18eaa3ac007a361b0bbf2f78946b8f715ccad7d8607e"
        },
