          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "acknowledgment": {
                "description": "Customer-facing sentence to relay; null only on a replay caught while the original send is still in flight",
