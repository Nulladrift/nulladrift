        {
          "name": "reserve_slot",
          "title": "Reserve Time Slot",
          "description": "Reserve a time slot on an active configured calendar. Returns a pending_offer reservation and sends a 6-digit confirmation code to the customer's email or phone. The reservation expires in 15 minutes if not confirmed. Idempotent: re-using the same idempotency_key returns the original reservation without resending the code. At a business that takes a deposit for agent bookings, pass the offer_id from get_quote (without it the answer is quote_required); no code is sent and the result's payment block carries the amount to pay instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agent_id": {
                "description": "Optional agent identifier",
                "type": "string"
              },
              "customer_contact": {
                "anyOf": [
                  {
                    "required": ["email"]
                  },
                  {
                    "required": ["phone"]
                  }
                ],
                "description": "How to reach the customer. MUST include at least one of email or phone — the confirmation code is delivered there, and a hold nobody can confirm is unreachable from both sides. Email is used when both are present.",
                "properties": {
                  "email": {
                    "description": "Where the 6-digit confirmation code is sent, preferred over phone",
                    "format": "email",
                    "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                    "type": "string"
                  },
                  "name": {
                    "description": "Customer's name, if known",
                    "type": "string"
                  },
                  "phone": {
                    "description": "SMS fallback for the confirmation code when no email is given. Any common way of writing a number is accepted and reformatted for you: (512) 317-1992, 512-317-1992 and 5123171992 all work, and a bare national number is read as US. Only input that cannot be read as a number at all is refused, and then only when no email was supplied, since a hold nobody can confirm is worse than a refused call.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "idempotency_key": {
                "description": "Unique key for idempotent reservation",
                "minLength": 1,
                "type": "string"
              },
              "offer_id": {
                "description": "Optional id of a signed get_quote offer to redeem against this reservation. Omit for a business with no exact-priced service — authentication is a capability upgrade here, never a toll.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "slug": {
                "description": "Business slug identifier",
                "minLength": 1,
                "type": "string"
              },
              "window_end": {
                "description": "Slot end (Unix seconds, an absolute instant) — the matching get_availability slot's `end`; see window_start.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "window_start": {
                "description": "Slot start (Unix seconds, an absolute instant). Take it from a get_availability slot: that response carries the business's `timezone`, so request a wide availability window there and filter the returned slots locally rather than guessing the zone.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              }
            },
            "required": ["customer_contact", "idempotency_key", "slug", "window_end", "window_start"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "booking_authorization": {
                "additionalProperties": false,
                "description": "Present this summary and booking_details to the customer and obtain explicit agreement before passing its reference to confirm_booking.",
                "properties": {
                  "consent_version": {
                    "const": "calendar-booking-v2",
                    "type": "string"
                  },
                  "notifications": {
                    "type": "string"
                  },
                  "reference": {
                    "format": "uuid",
                    "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                    "type": "string"
                  }
                },
                "required": ["consent_version", "notifications", "reference"],
                "type": "object"
              },
              "booking_details": {
                "additionalProperties": false,
                "description": "For configured calendars: present these fixed booking details to the customer before confirming their code. No owner approval is required.",
                "properties": {
                  "business_name": {
                    "type": "string"
                  },
                  "calendar_name": {
                    "type": "string"
                  },
                  "end": {
                    "type": "string"
                  },
                  "reference": {
                    "type": "string"
                  },
                  "start": {
                    "type": "string"
                  },
                  "timezone": {
                    "type": "string"
                  }
                },
                "required": ["business_name", "calendar_name", "end", "reference", "start", "timezone"],
                "type": "object"
              },
              "confirmation": {
                "additionalProperties": false,
                "properties": {
                  "channel": {
                    "description": "Where the code went: 'email', 'sms', or 'none' if delivery was unavailable",
                    "type": "string"
                  },
                  "delivered": {
                    "description": "False means the hold exists but no code reached the customer — the booking cannot be confirmed until one does",
                    "type": "boolean"
                  },
                  "method": {
                    "description": "'otp': a 6-digit code was sent to the customer. 'payment': no code — this booking is confirmed by paying the deposit in `payment`",
                    "type": "string"
                  }
                },
                "required": ["channel", "delivered", "method"],
                "type": "object"
              },
              "expires_at": {
                "description": "ISO-8601. When this hold lapses if it is not confirmed (by code, or by payment when payment.required)",
                "type": "string"
              },
              "idempotent_replay": {
                "description": "Present and true when this idempotency_key already had a reservation; no new code was sent",
                "type": "boolean"
              },
              "payment": {
                "additionalProperties": false,
                "description": "Always present. required:false — confirm with the code (confirmation.method 'otp'). required:true — the customer pays amount_cents (currency) to confirm; balance_due_cents is paid at the visit.",
                "properties": {
                  "amount_cents": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "balance_due_cents": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "currency": {
                    "type": "string"
                  },
                  "kind": {
                    "enum": ["deposit", "full"],
                    "type": "string"
                  },
                  "required": {
                    "type": "boolean"
                  }
                },
                "required": ["required"],
                "type": "object"
              },
              "reservation_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "status": {
                "description": "Reservation state — 'pending_offer' on a fresh hold; a replay returns the existing row's state",
                "type": "string"
              }
            },
            "required": ["confirmation", "expires_at", "reservation_id", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a26734a1616b14856b0cd8b3fafb647285fa71f010526f19e9c1a1ad90563801"
        },
        {
          "name": "search_businesses",
          "title": "Search Businesses",
          "description": "Find registered businesses by search term and optional location; returns matches with their slugs. When no business matches every word, returns a few that match some of them, marked match: partial with matched_terms; check one fits before acting on it. Call it before the business-specific tools.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "location": {
                "description": "Optional location filter (city, state, or region). Narrows results geographically.",
                "type": "string"
              },
              "search": {
                "description": "Search term — matched against business name, description, services, and category",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["search"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "category": {
                      "type": ["string", "null"]
                    },
                    "location": {
                      "type": ["string", "null"]
                    },
                    "match": {
                      "const": "partial",
                      "description": "Present only when no business matched every word: this one matched some of them",
                      "type": "string"
                    },
                    "matched_terms": {
                      "description": "Which of the search words a partial match hit",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "name": {
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "summary": {
                      "type": ["string", "null"]
                    },
                    "summary_truncated": {
                      "type": "boolean"
                    },
                    "website": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["category", "location", "name", "slug", "summary", "summary_truncated", "website"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6c9bf1aa38005966cad8020f3e29e6735f31f9fa843988a70542be6993beb4c0"
        },
        {
          "name": "submit_quote_request",
          "title": "Send a quote request",
          "description": "After the customer explicitly agrees, save their service requirements and contact details and send a notification to the business's configured email or opted-in SMS destination. This requests a business response, not a price commitment, booking or payment. Use context from request_service. Reuse the same idempotency_key AND details to check an uncertain submission; never automatically start a new request. Exclude medical, payment-card and authentication information.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "business_id": {
                "description": "The exact provider_business_id (public business slug) returned by request_service",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "consent": {
                "const": true,
                "description": "True only after the customer explicitly agrees to send these contact details and this request to the named business",
                "type": "boolean"
              },
              "contact_email": {
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "contact_name": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "contact_phone": {
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "context_token": {
                "description": "Opaque business context from request_service; pass unchanged",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "details": {
                "description": "Brief service requirements; exclude sensitive medical, financial and authentication information",
                "maxLength": 600,
                "minLength": 1,
                "type": "string"
              },
              "idempotency_key": {
                "description": "A UUID for this request; reuse unchanged when checking or retrying an uncertain submission",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "preferred_window": {
                "description": "Customer's preferred day and time; this is a request, not a confirmed appointment",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "service": {
                "description": "Service the customer wants a quote for",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "service_address": {
                "description": "Address where the customer needs the service, if relevant",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["business_id", "consent", "context_token", "details", "idempotency_key", "service"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "replayed": {
                "type": "boolean"
              },
              "request_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "status": {
                "enum": ["submitted", "not_sent", "delivery_unknown", "rejected"],
                "type": "string"
              },
              "status_token": {
                "description": "Pass to get_request_status to read the business's answer. For this caller only.",
                "type": "string"
              }
            },
            "required": ["message", "request_id", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/widgetAccessible": true,
            "ui": {
              "visibility": ["model", "app"]
            }
          },
          "digest": "sha256:d0c44f1fae42a4b48fbd8114cfde44352e020e2f6b776c5d7965d0023e6a2b23"
        },
        {
          "name": "subscribe_to_updates",
          "title": "Subscribe to Updates",
          "description": "Start a pending email subscription to updates from a business. Returns a confirmation URL that only the user must click within 7 days; no subscription is active until that confirmation. Idempotent: re-using the same idempotency_key returns the original subscription.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agent_id": {
                "description": "Optional agent identifier",
                "type": "string"
              },
              "contact_email": {
                "description": "Email to subscribe — confirmed via returned token",
                "format": "email",
                "minLength": 1,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Idempotency key",
                "minLength": 1,
                "type": "string"
              },
              "slug": {
                "description": "Business slug identifier",
                "minLength": 1,
                "type": "string"
              },
              "topics": {
                "description": "Topic tags (e.g., ['deals', 'schedule_changes'])",
                "items": {
                  "maxLength": 40,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["contact_email", "idempotency_key", "slug", "topics"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "acknowledgment": {
                "description": "Customer-facing sentence to relay, including the confirmation link",
                "type": ["string", "null"]
              },
              "confirmation_token": {
                "description": "Capability token for this subscriber only — it is the proof of consent; never pass it to another tool or party",
                "type": "string"
              },
              "confirmation_url": {
                "description": "The link the user must open within 7 days to start receiving updates",
                "type": "string"
              },
              "expires_at": {
                "description": "Unix seconds when confirmation_url stops working",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "idempotent_replay": {
                "description": "Present and true when this idempotency_key already had a subscription; the stored token is returned, refreshed only if it had expired",
                "type": "boolean"
              },
              "status": {
                "description": "'pending' until the user opens confirmation_url; a replay returns the stored state (e.g. 'confirmed' once they have)",
                "type": ["string", "null"]
              },
              "subscription_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "topics": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Normalised topic tags: trimmed, lower-cased, de-duplicated"
              }
            },
            "required": ["acknowledgment", "confirmation_token", "confirmation_url", "expires_at", "status", "subscription_id", "topics"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
