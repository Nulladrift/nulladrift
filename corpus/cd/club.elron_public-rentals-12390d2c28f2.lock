      "instructions": "elron club offers furnished apartments for medium- and long-term stays in Switzerland. This server provides published rentals, availability and monthly CHF pricing, locations, regions, company and legal information, jobs, public help, contact forms and support photos, availability update preferences, portal access recovery, and a scoped inquiry-to-Request-to-contract journey. Public information reads do not require an account. Personal drafts, documents and viewing actions require the owning email-verified session; availability update management requires its email token. Use applications.get and viewings.get_details for current versions before changing state. Never expose these credentials. Rental information and quotes are not confirmed bookings, and inventory holds are time-limited. The human applicant completes contract review and legal signature; invoice issuance, payment receipt, and booking confirmation are separate milestones. Customer communications, consent, availability update enrollment, submissions and commitments require explicit customer confirmation. Describe applications as Requests (Anfragen in German). Identity verification, legal signature and authenticated resident operations remain human handoffs. Use tools/list as the authoritative capability and schema catalogue.",
