            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "pattern": "^spl_.*",
                "type": "string"
              },
              "quote_digest": {
                "pattern": "^sha256:[0-9a-f]{64}$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d76bdf8e6a652e951a580a060b27c1c00a6a0f6100d3051d328c6c3a0b04b202"
        },
        {
