                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "maxLength": 2000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "deterministic_check": {
                      "oneOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "checker": {
                              "const": "row_count",
                              "type": "string"
                            },
                            "expected": {
                              "maximum": 9007199254740991,
                              "minimum": 0,
                              "type": "integer"
                            }
                          },
                          "required": ["checker", "expected"],
                          "type": "object"
                        },
                        {
                          "additionalProperties": false,
                          "properties": {
                            "checker": {
                              "const": "completeness",
                              "type": "string"
                            },
                            "required_fields": {
                              "items": {
                                "minLength": 1,
                                "type": "string"
                              },
                              "minItems": 1,
                              "type": "array"
                            }
                          },
                          "required": ["checker", "required_fields"],
                          "type": "object"
                        },
                        {
                          "additionalProperties": false,
