        {
          "name": "abandon_spool",
          "title": "Spool abandonment",
          "description": "Abandon an active Spool (the agreement object) before payment is committed. Use when the initiator no longer wants to proceed; this ends the agreement and cannot verify work or settle value. Works in the no-key sandbox.",
