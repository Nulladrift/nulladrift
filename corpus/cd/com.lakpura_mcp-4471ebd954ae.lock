{
  "lockfileVersion": 2,
  "subjects": {
    "com.lakpura/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.lakpura.com/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.lakpura/mcp",
        "version": "1.0.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Search and book Lakpura tours, transfers and stays. Flow: search_tours/search_stays -> get_service -> start_booking (returns a Stripe checkout URL).",
      "tools": [
        {
          "name": "get_service",
          "description": "Get full details of one tour/experience by slug: title, description, bookable options (each with a price and option_id) and whether it can be booked via start_booking. Pass an option_id from here to start_booking.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The service slug from search_tours (the last path segment of /products/{slug}).",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get service details & price"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5e6febee2ba7abe3960ef26e30be8675fb561bc9ce97b922bec235010fbab7b5"
        },
        {
          "name": "quote_transfer",
          "description": "Price a private transfer (car/van with driver) from one place in Sri Lanka to another. Pass the pickup and drop-off exactly as the traveller named them - a town (\"Kandy\"), an airport (\"Colombo airport\", \"Bandaranaike\") or a station. For a hotel, pass the TOWN it is in. Returns the resolved route and fares per vehicle that fits the party. If a place is ambiguous or unknown, it returns status \"unresolved\" with candidates - ask the traveller, do not guess. Use this for any transfer price, never a transfer page found by search_tours.",
          "inputSchema": {
            "properties": {
              "bags": {
                "description": "Suitcases / check-in bags, if the traveller said (omit if unknown).",
                "maximum": 60,
                "minimum": 0,
                "type": "integer"
              },
              "from": {
                "description": "Pickup: town, airport or station, e.g. \"Colombo airport\".",
                "type": "string"
              },
              "passengers": {
                "description": "Number of travellers (default 2).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "Drop-off: town, airport or station, e.g. \"Kandy\".",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Quote a private transfer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c14eb314d25834183db4c3421459ebf2c99b76860361296129fbba414abcf3c2"
        },
        {
          "name": "search_products",
          "description": "Search physical products Lakpura sells and ships worldwide — Sri Lankan handicrafts, wooden masks, tea, spices, homeware, gifts. Returns each match with its Lakpura reference, title, USD price and public product page URL. Use this for anything the caller wants to BUY and have delivered. Also RENTALS in Sri Lanka — baby travel cots, wheelchairs, scooters, motorbikes, bicycles, tuk tuks (try short nouns: \"cot\", \"wheelchair\", \"scooter\"). Use search_tours or search_stays for travel instead.",
          "inputSchema": {
            "properties": {
              "max_price_usd": {
                "description": "Optional upper price limit in US dollars.",
                "type": "number"
              },
              "page": {
                "description": "Page number (default 1).",
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "description": "Results to return (default 8). Keep small — these are read aloud.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keyword(s) describing the product, e.g. \"raksha mask\", \"ceylon tea\", \"batik\", \"wooden elephant\". Required.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search products for sale"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0e8cfd856ed02a5f809bc4370b72d21ecfde19611ac9734d250e5eec8cbc8d6b"
        },
        {
          "name": "search_stays",
          "description": "Search Lakpura accommodation (hotels, villas, lodges) by name or city. Returns matching stays with their public page URL, city, country and star rating. Use get_service with the returned slug for room details and price.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max results (default 12).",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Hotel/villa name or city (e.g. \"Galle\", \"Cinnamon\", \"Ella tree house\").",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search stays"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:59b76ee5a7f45634bdc7debc1a1096a803f8435fa447e3b04763a02cfb5e360b"
        },
        {
          "name": "search_tours",
          "description": "Search Lakpura tours, day-trips and experiences by keyword. Returns each match with a slug, title, rating and its public page URL. Call get_service with a slug to see bookable options and price, then start_booking to book. Optional kind filter: \"multi_day\" (multi-day tours) or \"single_day\".",
          "inputSchema": {
            "properties": {
              "kind": {
                "description": "Filter by tour length. Default \"all\".",
                "enum": ["all", "multi_day", "single_day"],
                "type": "string"
              },
              "page": {
                "description": "Page number (default 1).",
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "description": "Results per page (default 20).",
                "maximum": 48,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keyword(s) to match against the tour title (e.g. \"whale watching\", \"sigiriya\", \"safari\"). Omit to browse top-rated.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search tours & experiences"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:56fcfbd4d1f7e512d8a2812a3b87b35be2bfca6ae0cef9e62a1a8df1951ec3a0"
        },
        {
          "name": "start_booking",
          "description": "Create a booking and get a secure Stripe checkout URL for the customer to pay. For product_type=\"tour\": pass slug (from search_tours/get_service), selected_date (YYYY-MM-DD), pax, an optional option_id, and lead contact details. For product_type=\"transfer\": pass from, to, optional vehicle/category/pickup_at, pax, and lead details. The price is calculated server-side and returned with the checkout_url. Payment confirms the booking.",
          "inputSchema": {
            "properties": {
              "airline": {
                "description": "transfer: optional airline (airport transfers).",
                "type": "string"
              },
              "category": {
                "description": "transfer: e.g. \"Arrival Transfers\", \"Departure Transfers\" (default Arrival).",
                "type": "string"
              },
              "flight_number": {
                "description": "transfer: optional flight number.",
                "type": "string"
              },
              "from": {
                "description": "transfer: pickup location (airport / city / hotel).",
                "type": "string"
              },
              "lead_email": {
                "description": "Customer email (booking confirmation is sent here).",
                "type": "string"
              },
              "lead_first_name": {
                "description": "Customer first name.",
                "type": "string"
              },
              "lead_phone": {
                "description": "Customer phone (optional, E.164 preferred).",
                "type": "string"
              },
              "lead_surname": {
                "description": "Customer surname.",
                "type": "string"
              },
              "notes": {
                "description": "transfer: optional notes.",
                "type": "string"
              },
              "option_id": {
                "description": "tour: chosen option_id from get_service (optional — omit for the \"from\" price).",
                "type": "string"
              },
              "pax": {
                "description": "Number of guests/passengers (default 1).",
                "minimum": 1,
                "type": "integer"
              },
              "pickup_at": {
                "description": "transfer: pickup datetime (free text or ISO).",
                "type": "string"
              },
              "pickup_text": {
                "description": "tour: optional pickup location / hotel.",
                "type": "string"
              },
              "product_type": {
                "description": "What is being booked.",
                "enum": ["tour", "transfer"],
                "type": "string"
              },
              "selected_date": {
                "description": "tour: travel date, YYYY-MM-DD (today or later).",
                "type": "string"
              },
              "selected_start_time": {
                "description": "tour: optional start time, e.g. \"09:00\".",
                "type": "string"
              },
              "slug": {
                "description": "tour: service slug from search_tours/get_service.",
                "type": "string"
              },
              "to": {
                "description": "transfer: drop-off location.",
                "type": "string"
              },
              "vehicle": {
                "description": "transfer: vehicle class (default \"Standard Car\").",
                "type": "string"
              }
            },
            "required": ["lead_email", "lead_first_name", "lead_surname", "product_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Start booking (creates order + payment link)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:08448e53898f9428f1d79342f87876f99065a62ebd4860f5516cd796e22daa81"
        }
      ],
      "digest": "sha256:85b6fc08df9eaff04891684765bb4e4d35522c897b4d38d1ae6e657a82ded535"
    }
  }
}
