            "readOnly": true
          },
          "digest": "sha256:3d431650490f4e97aa3b24e81ad565c35e474aef9a52787262d701ada0892b57"
        },
        {
          "name": "salary_stats",
          "title": "Salary statistics on Level",
          "description": "Salary statistics over the live Level listings that publish a yearly salary range: number of listings, median, 25th and 75th percentile of the middle of each range, in one currency at a time (default USD, currencies are never mixed). Hourly and monthly rates are excluded. Optional filters: keyword in the job title, AI level (1 = Little AI, 2 = Uses AI, 3 = Works on AI, 4 = Builds AI), remote. The response carries the date of the figures and the exact method. Computed directly from the database, not an estimate.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "ai_level": {
                "anyOf": [
                  {
                    "const": 1,
                    "type": "number"
                  },
                  {
                    "const": 2,
                    "type": "number"
                  },
                  {
                    "const": 3,
                    "type": "number"
                  },
                  {
                    "const": 4,
                    "type": "number"
                  }
                ],
                "description": "Keep only listings at exactly this AI level (1 to 4)."
              },
              "currency": {
                "description": "Three-letter currency code (default USD). Only listings in this currency are counted.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "query": {
                "description": "Keyword in the job title, e.g. \"machine learning\".",
                "minLength": 1,
                "type": "string"
              },
              "remote": {
                "description": "true to keep remote roles only.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c3f98fd65f6f021d3982acc2945ac5c875fe53acc39814fc0c1878fb6bf789ac"
        },
        {
          "name": "search_jobs",
          "title": "Search Level job listings",
          "description": "Search job listings published on Level (jobsbylevel.com), an AI job board that rates every listing by how central AI is to the role, from Little AI (AI Level 1) to Builds AI (AI Level 4). Filters: free-text query, AI level range, remote, city, company, posting age, visa sponsorship, minimum yearly salary in USD, seniority, job category. Returns at most 20 results per page. With `query`: whole-word search with stemming (\"engineer\" also matches \"engineering\", but a fragment like \"eng\" alone no longer matches), ranked by relevance, and `total` is capped at 1,000 (see `total_capped` in the response). Without `query`: ranked by AI rating and recency, `total` is exact. Every result links back to its canonical page on jobsbylevel.com. The response also carries `search_url`, the page on jobsbylevel.com that shows the same search as a full list: offer it to the user to browse beyond the first 20 (`search_url_omitted_filters` names any filter that page cannot apply). This tool never returns a direct link to the employer's ATS. Ranking never depends on payment: paid or boosted listings get no priority here.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "ai_level_max": {
                "anyOf": [
                  {
                    "const": 1,
                    "type": "number"
                  },
                  {
                    "const": 2,
                    "type": "number"
                  },
                  {
                    "const": 3,
                    "type": "number"
                  },
                  {
                    "const": 4,
                    "type": "number"
                  }
                ],
                "description": "Maximum AI level (1 to 4)."
              },
              "ai_level_min": {
                "anyOf": [
                  {
                    "const": 1,
                    "type": "number"
                  },
                  {
                    "const": 2,
                    "type": "number"
                  },
                  {
                    "const": 3,
                    "type": "number"
                  },
                  {
                    "const": 4,
                    "type": "number"
                  }
                ],
                "description": "Minimum AI level (1 to 4)."
              },
              "category": {
                "description": "Job category, one of: software-engineering, data, product, design, marketing, sales, customer-support, operations, finance, hr, legal, security, research, healthcare, education, content, data-annotation, other. Exact match on the category Level assigned to the listing.",
                "enum": ["software-engineering", "data", "product", "design", "marketing", "sales", "customer-support", "operations", "finance", "hr", "legal", "security", "research", "healthcare", "education", "content", "data-annotation", "other"],
                "type": "string"
              },
              "city": {
                "description": "City or location text, partial match against the listing's location.",
                "minLength": 1,
                "type": "string"
              },
              "company": {
                "description": "Company name, partial match.",
                "minLength": 1,
                "type": "string"
              },
              "min_salary_usd": {
                "description": "Minimum yearly salary in US dollars (1 to 1,000,000), e.g. 150000. Keeps listings whose published salary range tops out at or above this amount. Only listings with a yearly salary in USD are compared; listings paid in other currencies, hourly or monthly rates, and listings with no published salary are left out when this filter is set. Values under 15,000 are treated as 15,000.",
                "maximum": 1000000,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "description": "Page, starting at 1 (default 1).",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "posted_within_hours": {
                "description": "Only listings posted in the last N hours (1 to 168). 24 = posted today.",
                "maximum": 168,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free text: job title, tool or skill (also matches company name).",
                "minLength": 1,
                "type": "string"
              },
              "remote": {
                "description": "true to keep remote roles only.",
                "type": "boolean"
              },
              "seniority": {
                "description": "Seniority level of the role: intern, junior, mid, senior, lead or executive. Exact match on the level Level assigned to the listing; listings with no clear seniority are left out when this is set.",
                "enum": ["intern", "junior", "mid", "senior", "lead", "executive"],
                "type": "string"
              },
              "sort": {
                "description": "\"recent\" = newest first. Default: relevance with `query`, otherwise AI rating then recency.",
                "enum": ["default", "recent"],
                "type": "string"
              },
              "visa_sponsorship": {
                "description": "true to keep only listings whose text says the employer sponsors work visas (H-1B). Listings that only sponsor in some cases, refuse sponsorship or do not mention it are left out.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://level/job-cards-v4.html",
            "openai/toolInvocation/invoked": "Jobs from Level",
            "openai/toolInvocation/invoking": "Searching jobs on Level",
            "ui": {
              "resourceUri": "ui://level/job-cards-v4.html"
            }
          },
          "digest": "sha256:31176b775e2cb6db88671b729223850712ea1c29c197b00cc00aaab67a46e545"
        },
