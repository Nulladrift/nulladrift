            "readOnly": true
          },
          "digest": "sha256:6ee7c3b03453d4c4bfcb4efd8d9323d1e284b0dbbd06a33752a3a4268e13dfcb"
        },
        {
          "name": "latest_ai_jobs",
          "title": "Latest AI jobs on Level",
          "description": "The newest AI jobs published on Level (jobsbylevel.com): listings rated Works on AI (AI Level 3) or Builds AI (AI Level 4), posted in the last 24 hours by default, newest first. Level checks employer career sites every hour. Optional filters: free text, remote, visa sponsorship, minimum yearly salary in USD, seniority. Same data as the page https://jobsbylevel.com/new-ai-jobs. Every result links to its canonical page on jobsbylevel.com. The response also carries `search_url`, the page on jobsbylevel.com to browse the full list. Ranking never depends on payment: paid or boosted listings get no priority here.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "hours": {
                "description": "Posting age window in hours (default 24, max 168).",
                "maximum": 168,
                "minimum": 1,
                "type": "integer"
              },
              "min_salary_usd": {
                "description": "Minimum yearly salary in US dollars (1 to 1,000,000), e.g. 150000. Keeps listings whose published salary range tops out at or above this amount. Only listings with a yearly salary in USD are compared; listings paid in other currencies, hourly or monthly rates, and listings with no published salary are left out when this filter is set. Values under 15,000 are treated as 15,000.",
                "maximum": 1000000,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "description": "Page, starting at 1 (default 1).",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "query": {
                "description": "Optional free text: title, tool or skill.",
                "minLength": 1,
                "type": "string"
              },
              "remote": {
                "description": "true to keep remote roles only.",
                "type": "boolean"
              },
              "seniority": {
                "description": "Seniority level of the role: intern, junior, mid, senior, lead or executive. Exact match on the level Level assigned to the listing; listings with no clear seniority are left out when this is set.",
                "enum": ["intern", "junior", "mid", "senior", "lead", "executive"],
                "type": "string"
              },
              "visa_sponsorship": {
                "description": "true to keep only listings whose text says the employer sponsors work visas (H-1B). Listings that only sponsor in some cases, refuse sponsorship or do not mention it are left out.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://level/job-cards-v4.html",
            "openai/toolInvocation/invoked": "Latest AI jobs from Level",
            "openai/toolInvocation/invoking": "Loading the latest AI jobs on Level",
            "ui": {
              "resourceUri": "ui://level/job-cards-v4.html"
            }
          },
          "digest": "sha256:e095db98b037f75752f36cce423eb39f61df099de4f97d227add6f04f97299f5"
        },
        {
          "name": "list_companies_by_ai_level",
          "title": "Companies hiring on Level, by AI level",
          "description": "Ranks companies currently hiring on Level by how central AI is to their open roles: the average AI rating (0-100) of their live listings. This is a Level-specific aggregation, not a third-party ranking. See the returned `method` field for the exact rule. Companies with too few live listings, and known job-board republishers, are excluded.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Max rows to return (default 20).",
                "exclusiveMinimum": 0,
                "maximum": 50,
                "type": "integer"
              },
              "min_jobs": {
                "description": "Minimum number of live listings required to be ranked (default 10).",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5954337f5531da0a2368a7f16c1204385e584afd76cda67ae0966241cd07a9d2"
        },
        {
          "name": "market_stats",
          "title": "Level job market statistics",
          "description": "Aggregated statistics over currently published Level listings: distribution by AI level (AI Level 1 to AI Level 4), share of remote roles, and the most frequent tools and categories. Computed directly from the database, not an estimate.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "top_n": {
                "description": "Number of top tools/categories to return (default 10).",
                "exclusiveMinimum": 0,
                "maximum": 50,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
