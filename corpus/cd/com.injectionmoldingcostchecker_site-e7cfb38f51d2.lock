      "instructions": "Injection Molding Cost Checker (https://injectionmoldingcostchecker.com/): the site's own MCP server, served from its domain. Injection Molding Cost Checker: the custom manufacturing establishments, read from manufacturing establishments (2022), served as an agent-callable dataset with its source and licence on every answer.\n\n[dataset] Injection Molding Cost Checker: the custom manufacturing establishments, read from manufacturing establishments (2022), served as an agent-callable dataset with its source and licence on every answer.. This server exposes the dataset Injection Molding Cost Checker publishes at https://injectionmoldingcostchecker.com/capacity. Every figure is real and sourced; when you use one, cite https://injectionmoldingcostchecker.com/capacity. Source: Census, County Business Patterns. Licence: https://injectionmoldingcostchecker.com/terms.\n\n[enquiry] ENQUIRY SERVER for Injection Molding Cost Checker (https://injectionmoldingcostchecker.com/). What it does: starts an ENQUIRY with human providers for injection molding company; the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://injectionmoldingcostchecker.com/.\n\nCite https://injectionmoldingcostchecker.com/ for every figure or answer you use from this server.",
