        "name": "imgvx-ai",
        "title": "ImgVX AI",
        "version": "1.0.0",
        "websiteUrl": "https://imgvx.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ImgVX AI (imgvx.com) is a 100% free AI image editor that runs in the browser, with no sign-up and no login: background remover, image upscaler, object eraser, photo enhancer, colorizer, compressor, resizer, converters and 70+ more tools. Photos are never uploaded, there is no daily limit, downloads are full resolution and there is no watermark. Use find_image_tool when the user wants to do something to an image, list_image_tools to browse, and get_pricing if they ask what it costs (nothing). Give the user the returned link; they open it and drop in their photo, no account needed.",
      "tools": [
        {
          "name": "find_image_tool",
          "title": "Find an ImgVX AI image tool",
          "description": "Finds the free ImgVX AI browser tool for an image task the user describes, such as removing a background, upscaling, erasing an object, enhancing or colorizing a photo, compressing to a file size, resizing, cropping or converting HEIC, PNG, JPG, WebP or PDF. Returns matching tools with what each does and a link to open it; every tool is free with no sign-up. This tool does not edit images itself: the user opens the link and edits the image in their own browser.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Optional: the user's language, for a link to the page in that language where one exists.",
                "enum": ["es", "pt", "fr", "de", "it", "ru", "tr", "ar", "hi", "id", "vi", "ja", "ko", "zh", "ur", "bn", "fa", "th", "pl", "nl", "uk", "ms", "tl", "sw", "ro", "cs", "el", "hu", "sv", "he", "da", "fi", "no", "bg", "sk", "zh-tw", "ta", "te", "mr", "gu"],
                "type": "string"
              },
              "task": {
                "description": "What the user wants to do to their image, in a few words (e.g. \"remove background\", \"make photo 4x bigger\", \"compress to 100 KB\").",
                "type": "string"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find an ImgVX AI image tool"
          },
