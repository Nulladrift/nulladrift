{
  "lockfileVersion": 2,
  "subjects": {
    "app.hyperwave.www/docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.hyperwave.app/mcp/docs"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "app.hyperwave.www/docs",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Hyperwave app features, documentation, format tools, and private temporary collaborative workspaces. For product capabilities, pricing and comparisons, call appfeatures on the product server or get_document with /features on the docs server. Returned links describe the available Web edition and distinguish planned editions. Create a session, share its editorUrl with the user, then use stable-id edit batches and read/wait for their changes. Keep tokens private; sessions expire after 24 hours. Checkpoint before experiments. Save/download permanent presets before expiry. No prompt analytics or access to unrelated local/cloud projects.",
      "tools": [
        {
          "name": "get_document",
          "description": "Read the Markdown representation of one canonical public Hyperwave page. Paths come from search_docs or the sitemap.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "path": {
                "description": "Canonical site path, such as /guides/vital; no domain or query string",
                "maxLength": 250,
                "pattern": "^\\/(?!\\/)[^?#]*$",
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "markdown": {
                "type": "string"
              },
              "markdownUrl": {
                "format": "uri",
                "type": "string"
              },
              "path": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["markdown", "markdownUrl", "path", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a4718d46d2c6f432a6067556dd46f5f7d304ce6d6d0962f4aaa45ecf8beaaa74"
        },
        {
          "name": "search_docs",
          "description": "Search Hyperwave's published wavetable documentation and return source URLs and excerpts. Retrieval only; no generated advice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "maxLength": 500,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Wavetable topic or synthesizer to look up",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "has_more": {
                "type": "boolean"
              },
              "next_cursor": {
                "type": ["string", "null"]
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "excerpt": {
                      "type": "string"
                    },
                    "markdownUrl": {
                      "format": "uri",
                      "type": "string"
                    },
                    "path": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["excerpt", "markdownUrl", "path", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["has_more", "next_cursor", "results", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cbb767a46b6061d920eab6ffe3aade1cc16a29eba7db61afea9761f1487ef240"
        }
      ],
      "digest": "sha256:aa59bf75ad28fb6c7d06e141869e08c3629ded263218f0aa2a8fff5f452c0bb5"
    }
  }
}
