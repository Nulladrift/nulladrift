        {
          "name": "interfere",
          "description": "Coherent Gate (PAID, x402/USDC). Scores whether your trading-signal paths agree: confidence-weighted long/short/flat consensus, coherence 0-1, and a pass/block gate (pass needs a non-flat consensus and coherence at or above the threshold, default 0.6). Tiers by path count: scout ≤4 $0.01, standard ≤8 $0.05, beast ≤32 $0.25 (defaults). The $0.25 max tier is charged upfront; on the x402 rail the unused difference is recorded as owed (not yet auto-refunded); on the Arc escrow rail (arc_auth_id) only the used tier is captured. Optional ticker pulls extra paths from registered sources before charging. Max 32 paths. Not financial advice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "arc_auth_id": {
                "description": "Arc rail: authId from AuthCaptureEscrow.authorize() for at least the max-tier amount to our receiver. Only the used tier is captured; the rest returns via reclaim() after expiry.",
                "pattern": "^0x[0-9a-fA-F]{64}$",
                "type": "string"
              },
              "paths": {
                "default": [],
                "description": "Coherent Gate: AI trading signal paths to check for coherence. Priced tiers: scout ≤4, standard ≤8, beast ≤32 (defaults); >32 hard-rejected.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "confidence": {
                      "description": "Weight 0-1 this path gets in the consensus.",
                      "maximum": 1,
                      "minimum": 0,
                      "type": "number"
                    },
                    "direction": {
                      "description": "Direction this path calls: long, short, or flat.",
                      "enum": ["long", "short", "flat"],
                      "type": "string"
                    },
                    "source": {
                      "description": "Label for where this signal came from (1-64 chars).",
                      "maxLength": 64,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["confidence", "direction", "source"],
                  "type": "object"
                },
                "maxItems": 32,
                "type": "array"
              },
              "payment_header": {
                "description": "Base64 X-PAYMENT EIP-3009 payload (standard rail).",
                "type": "string"
              },
              "payment_tx_hash": {
                "description": "Base USDC tx hash (sovereign rail).",
                "type": "string"
              },
              "sources": {
                "description": "Optional path-source ids; default = all enabled verified sources. Requires ticker.",
                "items": {
                  "maxLength": 64,
                  "type": "string"
                },
                "maxItems": 16,
                "type": "array"
              },
              "ticker": {
                "description": "Optional: pull extra paths for this ticker from registered path sources (see docs/COHERENT_GATE_PATH_SOURCES.md).",
                "pattern": "^[A-Z]{1,10}$",
                "type": "string"
