        {
          "name": "omnigate_runtime_execute",
          "description": "OMNIGATE Runtime (PAID, USDC). Run ONE JavaScript script that calls many SML tools, in one round trip, instead of one model turn per tool call. The script is the body of an async function: `const r = await sml.call(\"<route-id>\", { query: {...} }); return r.data;`. Available inside: sml.call, sml.tools.search, sml.tools.get, sml.budget, sml.sleep, sml.log, sml.input. Every call is metered at its live registry price against budget_usdc, charged only on upstream 2xx, and tagged with source + response sha256; a failed upstream throws TruthError (nothing charged, nothing substituted). Unused budget is returned as credit. Returns result, per-call provenance, billing and an Ed25519-signed receipt id. Without payment it returns the x402 challenge (amount = budget). Pay with payment_header (Base USDC, x402 v2), credit_token (smlrt_…), or arc_auth_id (Arc escrow, when enabled). Sandbox: no network except sml.call, no fs, 32MB, 20s CPU, 120s wall (sync).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "arc_auth_id": {
                "description": "Arc AuthCaptureEscrow authorization id (maxAmount ≥ budget, expiry ≤ 24h).",
                "pattern": "^0x[0-9a-fA-F]{64}$",
                "type": "string"
              },
              "budget_usdc": {
                "default": "0.05",
                "description": "Hard spending cap for the whole run in USDC (min 0.01, max 25).",
                "pattern": "^\\d+(\\.\\d{1,6})?$",
                "type": "string"
              },
              "capsule_id": {
                "description": "Run a published capsule instead of a script (e.g. cap_name@1 or cap_name@latest).",
                "maxLength": 120,
                "type": "string"
              },
              "credit_token": {
                "description": "Runtime credit token (smlrt_…) returned by an earlier run.",
                "maxLength": 100,
                "type": "string"
              },
              "input": {
                "additionalProperties": {},
                "description": "JSON object exposed to the script as sml.input.",
                "type": "object"
              },
              "mode": {
                "default": "sync",
                "description": "sync waits for the result (120s wall); async returns run_id to poll /runtime/runs/{id}.",
                "enum": ["sync", "async"],
                "type": "string"
              },
              "payment_header": {
                "description": "Base64 x402 v2 payment payload for exactly budget_usdc USDC on Base (from the challenge).",
                "maxLength": 8192,
                "type": "string"
              },
              "script": {
                "description": "JavaScript async-function body. Use await; return the final result.",
                "maxLength": 65536,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Run a paid multi-tool script — OMNIGATE Runtime"
