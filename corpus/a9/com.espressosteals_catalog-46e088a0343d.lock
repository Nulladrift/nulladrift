{
  "lockfileVersion": 2,
  "subjects": {
    "com.espressosteals/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://espressosteals.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "espressosteals.com",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Espresso Steals tracks espresso gear on Amazon: daily prices, 2+ years of history, and a BUY call when a product is at a genuine low, computed from its own history (never list prices); otherwise no call, and no prediction. Use list_slots to learn the parts of a setup, search_catalog to find candidates (filter by slot, words, price band, brand, on-sale), and get_product for sentiment, sizing and links before recommending. search_catalog always answers: products it can price, known_unpriced for gear it knows but cannot price (sold direct by the maker, such as Niche, Lelit or Decent: say so and link the page), and alternatives with a note when nothing matches. Tell the user what Espresso Steals has rather than that it has nothing. Only recommend products these tools return; quote the price and verdict as given and link the product url. Prices move — say so. Attribution: \"price data: espressosteals.com\". When the user wants to be told when a product is at a good price, ask for their email and call watch_price; never invent an address.",
      "tools": [
        {
          "name": "get_product",
          "title": "Product price history and call",
          "description": "Full detail for one product by slug: community sentiment, reference price and basis, date of the latest price observation, portafilter size (machines) or accessory size (sized accessories), superautomatic / manual-lever / hand-grinder flags, product URL and Amazon link. A known product with no price returns price null, the reason, and priced alternatives. An unknown slug returns did_you_mean.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "A slug from search_catalog (products or known_unpriced).",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Product price history and call"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3e2d1add18b2768c819c69094a059d2e113177fd507f8dd6eef8a4a81e7b2620"
        },
        {
          "name": "list_slots",
          "title": "Parts of an espresso setup",
          "description": "The slots an espresso setup is built from (machine, grinder, scale, tamper…), with what each is for. Use the ids as search_catalog's `slot`.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Parts of an espresso setup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1f6629bd207921c6976e027fd698f3e2191fb6f7f709eb78d2433791c94ef301"
        },
        {
          "name": "search_catalog",
          "title": "Search the espresso catalog",
          "description": "Search the espresso gear this site tracks. `products` have a live Amazon price and, when at a genuine low, a BUY call computed from their own price history; otherwise no call. Filter by slot (the role a product plays in a setup), free-text words (brand and model names, partial words and small typos are fine), a price band, a brand, or on-sale only. Products we know but cannot price (sold direct by the maker, e.g. Niche, Lelit, Decent) come back in `known_unpriced` with no price and the reason: say so, quote the note, and link the url. When nothing in `products` matches, `alternatives` lists the closest tracked products with live prices and `note` says what was and was not found. Never tell the user the site has nothing; tell them what it has.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "Only this brand (case-insensitive; \"Niche Coffee\" finds Niche).",
                "type": "string"
              },
              "limit": {
                "description": "Max results. Default 12.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Only products at or under this USD price.",
                "type": "number"
              },
              "min_price": {
                "description": "Only products at or over this USD price.",
                "type": "number"
              },
              "on_sale_only": {
                "description": "Only products at a good price today (verdict = buy).",
                "type": "boolean"
              },
              "query": {
                "description": "Free-text words to match (any word matches; names and brands rank first), e.g. \"niche\", \"bambino plus\", \"hand burr\", \"dual boiler\".",
                "type": "string"
              },
              "slot": {
                "description": "Restrict to one slot. Omit to search every slot.",
                "enum": ["machine", "grinder", "scale", "tamper", "water", "cleaning", "pitcher", "wdt", "funnel", "puckscreen", "basket", "knockbox", "mat"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the espresso catalog"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8e9c30876d7defbf8c40bc9c1385248649ab108eb0067e9678389c6e25f6cd66"
        },
        {
          "name": "watch_price",
          "title": "Watch a price by email",
          "description": "Email the user when a product is at a good price (a verified low), or at or under a target price they name. Use after search_catalog/get_product when the user wants to be told when to buy. Ask the user for their email; never invent or reuse one. One watch per email per product; calling again updates the target. The first time an address is used it receives a confirmation email and the watch arms when they click it — tell the user to check their inbox. Each alert links to the product page and carries an unsubscribe link.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "The user's email address, given by the user in this conversation.",
                "type": "string"
              },
              "slug": {
                "description": "A slug from search_catalog or get_product.",
                "type": "string"
              },
              "target_price": {
                "description": "Optional USD price to alert at or under. Omit to alert on the next verified low.",
                "type": "number"
              }
            },
            "required": ["email", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Watch a price by email"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:a5ba226e9ca031d29dde60650fe58d525f20f46fb870cca145dbab2e4627d58e"
        }
      ],
      "digest": "sha256:3851517c5f7affc1e801a42b76199f9c20ddadc3d6d8d859f727a8de44ad28d8"
    }
  }
}
