      "instructions": "AwesomeVideo burns styled captions into video (also transcribes, translates, dubs, trims silences and cuts clips). Prepaid credits, 1 credit = 1 cent: caption_video costs 5 credits per audio minute ($0.05/min). First job, no sign-in: 1) create_key {} (free): returns your token once and a welcomeChallenge. 2) Add \"api_key\": \"<token>\" to the arguments of every next call (same session, no reconnect; or send Authorization: Bearer <token>), solve the challenge (SHA-256 proof-of-work, about 1-3 s) and call create_key {api_key, challenge, nonce} to claim 10 free welcome credits while the trial runs. 3) caption_video {\"sourceUrl\": \"https://awesomevideoeditor.com/samples/cc0-interview-es.mp4\", \"preset\": \"hormozi-pop\"}: the 8 s sample costs 2 credits and returns the MP4, SRT and VTT. Then use your own public link or a fileId. Free without a key: create_key, estimate (prices any job from durationSeconds, never charges) and get_catalog. A short balance answers 402 insufficient_balance with checkoutUrl ($5 = 500 credits); nothing is charged. Pass maxCredits to cap a job. Errors carry hint (what to call next) and retryable. Docs: https://api.awesomevideoeditor.com/llms.txt",
      "tools": [
        {
          "name": "batch",
          "title": "Batch jobs",
          "description": "Caption a whole folder: run one operation on 1-50 videos in one call, priced together. operation caption = transcribe + burn per item, same output and price as caption_video (5 credits/min); transcribe 1/min; burn 4/min (needs subtitles or transcriptionJobId). One preset for all (an item's own preset or styleOverrides wins). dryRun:true returns the total and starts nothing. Missing media, 402 insufficient_balance or maxCredits reject the whole batch before any charge. Returns id, counts and jobs (paginated: offset/limit); poll get_job per item. For one video use caption_video.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "api_key": {
                "description": "Only for a connection without an Authorization header: the token create_key returned (av_live_...). Pass it on every call to use that key in this same session, no reconnect or config change. Ignored when the connection already sends a key. It works like a password: create a new key if this conversation is shared.",
                "type": "string"
              },
              "dryRun": {
                "description": "true = return the total quote only; nothing is charged or started.",
                "type": "boolean"
              },
              "items": {
                "description": "1-50 items, each {mediaUrl or fileId, name?, language?, preset?, styleOverrides?, faceAvoid?, translateTo? (caption), subtitles?/transcriptionJobId? (burn)}.",
                "items": {
                  "properties": {
                    "combined": {
                      "type": "boolean"
                    },
                    "durationSeconds": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "faceAvoid": {
                      "description": "true = move captions off faces (samples faces at 2 fps, same price; result.faceAvoid.faceLayout). Shortcut for styleOverrides.faceAvoid.",
                      "type": "boolean"
                    },
                    "fileId": {
                      "type": "string"
                    },
                    "format": {
                      "enum": ["srt", "vtt", "json"],
                      "type": "string"
                    },
                    "glossary": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "highlightColor": {
                      "description": "#RRGGBB for highlightWords. Default #FACC15.",
                      "type": "string"
                    },
                    "highlightWords": {
                      "description": "Shortcut: words or phrases to color in every caption (accent/case-insensitive), e.g. [\"AwesomeVideo\", \"gratis\"]. Maps to styleOverrides.wordHighlights rule {id:\"custom\", words, color}; on highlighter-marker, ghost-keywords and brand-box it fills their keyword list in the preset colors. Same price.",
                      "items": {
                        "type": "string"
                      },
                      "maxItems": 200,
                      "type": "array"
                    },
                    "language": {
                      "type": "string"
                    },
                    "mediaUrl": {
                      "type": "string"
                    },
                    "name": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "platform": {
                      "type": "string"
                    },
                    "preset": {
                      "type": "string"
                    },
                    "styleOverrides": {
                      "additionalProperties": {},
                      "description": "Per-call style changes deep-merged onto the preset (same fields as get_catalog {kind:'presets'} style; null removes a field), validated with the renderer schema and bundled fonts. Example {\"fontSize\":72,\"maxWordsPerCaption\":2,\"wordEntrance\":\"bounce\"}. Same price. No need to manage_preset {action:'create', type:'custom'}. Every field with examples: get_catalog {kind:'styles'}.",
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "subtitles": {
                      "type": "string"
                    },
                    "transcriptionJobId": {
                      "type": "string"
                    },
                    "translateTo": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "maxCredits": {
                "description": "Cap for the whole batch in credits; refused before any item starts when the total is higher.",
                "minimum": 0,
                "type": "number"
              },
              "operation": {
                "description": "'caption' (transcribe + burn per item, same as caption_video), 'transcribe' or 'burn' (existing captions), applied to every item.",
                "enum": ["caption", "transcribe", "burn"],
                "type": "string"
