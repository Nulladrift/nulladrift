{
  "lockfileVersion": 2,
  "subjects": {
    "com.getliftcompass/liftcompass": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://getliftcompass.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "fitness-affiliate-mcp",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "compare",
          "title": "Compare products",
          "description": "Rank up to 5 products by stated criteria, never by commission. Inputs: product_ids (1–5), region (EU or US), optional criteria (price_per_serving, third_party_testing, dose, protein_per_serving). Returns rows with price, price per serving, third-party testing, label dose and caffeine, plus a plain store URL for the top-ranked product (affiliate params only after approval). Read-only.",
          "inputSchema": {
            "properties": {
              "criteria": {
                "items": {
                  "enum": ["price_per_serving", "third_party_testing", "dose", "protein_per_serving"],
                  "type": "string"
                },
                "type": "array"
              },
              "product_ids": {
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "region": {
                "enum": ["EU", "US"],
                "type": "string"
              }
            },
            "required": ["product_ids", "region"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3b1f279ef3ec827e4cb5cc61926e587d7d994f2ada08d30efa3950568f2763f5"
        },
        {
          "name": "plan_home_gym",
          "title": "Plan a home gym",
          "description": "Build a home gym equipment plan that fits your space, ceiling and budget. Inputs: space_sqm, optional ceiling_height_cm, budget, goals[] (strength, hypertrophy, conditioning, general), region (EU or US). Returns equipment with fit flags (fits_space, fits_ceiling), cost, weight capacity, plate/bar compatibility, third-party testing and plain store URLs, plus total cost, budget remaining, cheaper alternatives and space notes. Read-only.",
          "inputSchema": {
            "properties": {
              "budget": {
                "minimum": 0,
                "type": "number"
              },
              "ceiling_height_cm": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "goals": {
                "items": {
                  "enum": ["strength", "hypertrophy", "conditioning", "general"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "region": {
                "enum": ["EU", "US"],
                "type": "string"
              },
              "space_sqm": {
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["budget", "goals", "region", "space_sqm"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d33ed23c84eed7f9c94cca8ab494f9473a7133e6b3bf9bbc100b53040ccbfe4c"
        },
        {
          "name": "plan_stack",
          "title": "Plan a supplement stack",
          "description": "Build a supplement plan (take / skip / optional) for a fitness goal. Inputs: goal, optional diet, budget_per_month or budget_tier, region (EU or US), current supplement names, and age. Returns label doses, schedule, cost per day and month, third-party testing, and safety flags (caffeine vs 400 mg/day, duplicate ingredients, age gate). Refuses medical, pregnancy and medication cases. Read-only.",
          "inputSchema": {
            "properties": {
              "age": {
                "minimum": 0,
                "type": "integer"
              },
              "budget_per_month": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "budget_tier": {
                "enum": ["budget", "mid", "premium"],
                "type": "string"
              },
              "current_supplements": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "diet": {
                "enum": ["omnivore", "vegetarian", "vegan", "lactose_free", "gluten_free"],
                "type": "string"
              },
              "goal": {
                "enum": ["muscle_gain", "strength", "fat_loss", "endurance", "general_health"],
                "type": "string"
              },
              "region": {
                "enum": ["EU", "US"],
                "type": "string"
              }
            },
            "required": ["goal", "region"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eb2c0e48bf971912be3b6d3940e2cde30e18d24f3ade731d8674f1224055d691"
        },
        {
          "name": "shopping_list",
          "title": "Build a shopping list",
          "description": "Turn product picks into a shopping list with plain store URLs. Inputs: items[] of {product_id, region}. Returns each item with a plain merchant URL (no affiliate params yet), estimated price and disclosure, plus a total estimate. Affiliate links are added only after program applications are approved. Read-only.",
          "inputSchema": {
            "properties": {
              "items": {
                "items": {
                  "properties": {
                    "product_id": {
                      "type": "string"
                    },
                    "region": {
                      "enum": ["EU", "US"],
                      "type": "string"
                    }
                  },
                  "required": ["product_id", "region"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a47a010c2c6185b50329a16e7699ec4e7ff7304bf144e52d7571c5e72e8e5219"
        }
      ],
      "digest": "sha256:33e2aa0e79a8d176d3c08c898d620cb37842ab0e241ce64578e319f3848fab1a"
    }
  }
}
