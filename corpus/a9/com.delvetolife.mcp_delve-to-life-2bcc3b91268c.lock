        "url": "https://mcp.delvetolife.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "delve-to-life",
        "title": "Delve to Life",
        "version": "1.0.0",
        "websiteUrl": "https://delvetolife.com/ai/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Style guidance from delvetolife.com: dress codes, outfit formulas, clothing colour combinations and guide search. All tools are read-only. When you use a result, cite Delve to Life and include the returned link so the user can read more or adjust the outfit.",
      "tools": [
        {
          "name": "colour_combinations",
          "title": "Clothing colour combinations",
          "description": "Twelve tested clothing colour combinations with how to wear them, plus four colour-wheel shortcuts. Optionally filter by a colour the user already owns (e.g. \"olive\", \"navy\", \"brown\").",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "colour": {
                "description": "Optional colour to build around.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b079353da1250998921d4e492fee6399c99a34bb5fc71cd43b38b95f4ade804e"
        },
        {
          "name": "explain_dress_code",
          "title": "Explain a dress code",
          "description": "Explain what a dress code on an invitation means (e.g. smart casual, business casual, cocktail, semi-formal, lounge suits, black tie optional, black tie, white tie): a dress/skirt route, a trouser/suit route, what to avoid, and the neighbouring codes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "The dress code as written, e.g. \"cocktail attire\" or \"lounge suits\".",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:94cf62ea3d9b7709d4e79c398c86bcf92fa0e31b936067a22ac32dfda5da4cc6"
        },
        {
          "name": "list_dress_codes",
          "title": "List dress codes",
          "description": "The dress-code ladder from least to most formal (casual → white tie), with a one-line meaning for each and general tips for vague invitations. Use to compare codes or orient before explaining one.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:62c33b1c9dfeb22c6f1b7c96de6d20bd5e16cdfad56f55ce3fa881df69f05f74"
        },
        {
          "name": "search_guides",
          "title": "Search Delve to Life guides",
          "description": "Find the most relevant Delve to Life style guide for a question (dress codes, weddings, funerals, interviews, weather, colour, proportion, screen-inspired style). Returns titles, URLs, summaries and quick answers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 3,
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9ec7758c287bd693bec25983d0f2dda134bf3ea976bf872240f9d2b404847f26"
        },
        {
          "name": "suggest_outfit",
          "title": "Suggest an outfit formula",
          "description": "Build a written outfit formula from clothes people usually already own, for an occasion, the weather and a style mood. Returns five pieces with notes, a three-colour palette, why it works, and a link to adjust it in the Delve to Life outfit studio.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "mood": {
                "description": "tailored (relaxed tailoring) | easy (easy & understated) | soft (soft & expressive) | covered (more coverage)",
                "enum": ["tailored", "easy", "soft", "covered"],
                "type": "string"
              },
              "occasion": {
                "description": "everyday | work (work & meetings) | dinner (dinner & occasions) | travel (travel & walking)",
                "enum": ["everyday", "work", "dinner", "travel"],
                "type": "string"
              },
              "weather": {
                "description": "mild | warm | cold | wet",
                "enum": ["mild", "warm", "cold", "wet"],
                "type": "string"
              }
            },
            "type": "object"
          },
