      "serverInfo": {
        "name": "slotscout",
        "title": "SlotScout: Employer child care planner",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "SlotScout: Employer child care planner. Start with scan_childcare_slots for the worksite address and headcount; add employeeZips only if the user gives home ZIPs, and never ask for names. Lead with the headline, then the slot shortage score and verdict, infant places and shift-friendly places, then 3 to 5 shortlist providers with phone. Say places are licensed capacity, not open places today. Then call compare_care_options with children set to staff.likelyEnrolments.mid and worksiteZip set to worksite.zip; set smallBusiness only if the user says the business meets the test. Show the cost per year and per child after the estimated credit for each option, and say the credit is an estimate before adviser review and other tax effects. If status is partial, say which list could not be read. Outside Texas and New York, say SlotScout does not cover the state yet; the 45F credit is federal and is not limited to any state. Quote the credit only as the tools state it (40 percent of qualified child care spending, up to 500,000 USD a year; 50 percent and 600,000 USD for an eligible small business, one with average gross receipts of 32 million USD or less over the 5 prior years, related businesses counted together), never a per-employee amount or a figure from memory. Never say the business qualifies for the credit, can claim it or should file; give the eligibility field text instead. End every answer with the notice field text. This server allows 60 tool calls a minute per network and 5,000 a day for all callers together; the day count resets at 00:00 UTC. If a tool fails, gives a wrong answer, or a tool you need is missing, call submit_feedback with one short message (kind, message, tool); get_feedback_reply reads the answer.",
      "tools": [
        {
          "name": "compare_care_options",
          "title": "Compare child care benefit options",
          "description": "Compare three ways to give staff child care places, for one number of staff children under 5 in Texas or New York: reserved places at nearby providers, a shared center with other employers, and an on-site center. Each option shows first-year and later-year cost, the estimated federal Section 45F credit (40 percent of qualified spending, up to 500,000 USD a year; 50 percent and 600,000 USD for an eligible small business) and the cost after that estimate. Compares the modelled employer payment with the 2026 7,500 USD per employee dependent care limit. Pass worksiteZip or state, and annualPrices from real quotes when known. Educational estimate, not tax advice.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "children": 40,
                "worksiteZip": "77030"
              }
            ],
            "properties": {
              "ageMix": {
                "additionalProperties": false,
                "description": "Share of enrolled children by age group, such as {infant: 0.3, toddler: 0.3, preschool: 0.4} (default)",
                "properties": {
                  "infant": {
                    "maximum": 100000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "preschool": {
                    "maximum": 100000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "toddler": {
                    "maximum": 100000,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "annualPrices": {
                "additionalProperties": false,
                "description": "Full-time annual price per child in USD from real provider quotes; replaces the area defaults",
                "properties": {
                  "infant": {
                    "maximum": 100000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "preschool": {
                    "maximum": 100000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "toddler": {
                    "maximum": 100000,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "children": {
                "description": "Staff children under 5 the benefit should serve; use staff.likelyEnrolments.mid from scan_childcare_slots",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "employerShare": {
                "description": "Share of tuition the employer pays, 0 to 1 (default one third)",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "smallBusiness": {
                "description": "True only if the business says it meets the 45F small business test (average gross receipts of 32 million USD or less over the 5 prior years, related businesses counted together); raises the credit rate and cap",
                "type": "boolean"
              },
              "state": {
                "description": "State when no ZIP is known",
                "enum": ["TX", "NY"],
                "type": "string"
              },
              "worksiteZip": {
                "description": "Worksite ZIP in Texas or New York; sets the state price table",
                "pattern": "^\\d{5}$",
                "type": "string"
              }
            },
            "required": ["children"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "ageMix": {
                "additionalProperties": {
                  "type": "number"
                },
                "type": "object"
              },
              "annualPrices": {
                "additionalProperties": {
                  "type": "number"
                },
                "type": "object"
              },
              "assumptions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "blendedAnnualPricePerChild": {
                "type": "number"
              },
              "children": {
                "type": "integer"
              },
              "credit": {
                "properties": {
                  "capUsed": {
                    "type": "number"
                  },
                  "form": {
                    "type": "string"
                  },
                  "rateUsed": {
                    "type": "number"
                  },
                  "rule": {
                    "type": "string"
                  },
                  "smallBusinessAssumed": {
                    "type": "boolean"
                  },
                  "source": {
