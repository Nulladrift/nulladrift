        {
          "name": "scan_childcare_slots",
          "title": "Scan child care near a worksite",
          "description": "Free quick scan for an employer planning a child care benefit in Texas or New York. Pass the worksite address with its ZIP (or the ZIP alone) and headcount; add employeeZips (one home ZIP per employee, no names) for a closer staff estimate. Reads the live state and city licensing lists and Census counts. Returns a headline, licensed places for children under 5 within the commuting radius, children per place with a 0 to 100 slot shortage score, shift-friendly providers, how many staff children under 5 likely need care, and a provider shortlist with phone and licence page. Pass staff.likelyEnrolments.mid to compare_care_options next. Licensed capacity is not open places today.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "headcount": 600,
                "radiusMiles": 2,
                "worksite": "77030"
              }
            ],
            "properties": {
              "employeeZips": {
                "description": "Optional home ZIP of each employee, one entry per person, no names. Makes the staff estimate match where staff live.",
                "items": {
                  "maxLength": 10,
                  "type": "string"
                },
                "maxItems": 5000,
                "type": "array"
              },
              "headcount": {
                "description": "Number of employees at this worksite",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "description": "Providers on the shortlist (default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "radiusMiles": {
                "description": "Commuting distance in straight-line miles (default 10)",
                "maximum": 25,
                "minimum": 2,
                "type": "number"
              },
              "worksite": {
                "description": "Worksite address with its ZIP, or the 5-digit ZIP alone, in Texas or New York, such as \"6565 Fannin St, Houston, TX 77030\"",
                "maxLength": 200,
                "minLength": 5,
                "type": "string"
              }
            },
            "required": ["headcount", "worksite"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "area": {
                "properties": {
                  "childrenPerPlace": {
                    "type": ["number", "null"]
                  },
                  "childrenUnder5": {
                    "type": "integer"
