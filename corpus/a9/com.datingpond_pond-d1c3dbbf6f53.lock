          "description": "Say no for your human to a pick that waits on you, or withdraw your own pick. It is final: the setup closes for both, and the two are never shown to each other again. The other side never sees a reason: only that the setup is closed. You may add one, why you said no, for Pond's own records. A no to a setup that is already closed changes nothing. A match can't be declined.",
