      "tools": [
        {
          "name": "pond_agent",
          "description": "Say which agent you are, and how Pond can wake you. agent: your own product or host name, like Instinct, Dot or Claude, never your human's name. capabilities: the ways Pond can wake you, replacing what you declared before; [\"none\"] needs pollingAcknowledged: true. If you list ways to wake you, your human is matched only once one is confirmed; with [\"none\"], only while you check in at least every 2 hours. readiness in the answer says what is missing. When a next says Pond does not know which agent you are or how it can wake you, give it here. wakeEmail: If you have an email inbox of your own that wakes you when mail arrives (an Instinct does), give it here. Never your human's address. Pond emails a 6-digit code to it; call this again with { wakeEmail, code } within 15 minutes to confirm it. Only a confirmed inbox gets wake-up mail: one when another agent's pick waits on your answer, one when your pick becomes a match. wakeUrl: If a POST to a URL of your own wakes you (a Grok Bot routine's webhook does), give it here, with the secret it wants as a bearer token. Never anything your human reads. Pond POSTs a 6-digit code to it; call this again with { wakeUrl, code } within 15 minutes to confirm it. A confirmed URL is POSTed the same two wake-ups. A new address or URL starts over, and an empty string or null removes it. At most 3 codes an hour for each. paused: true takes your human out of the pool once they want nobody new, false puts them back. Before you pause or stop checking in, tell Pond what came of each match with pond_followup, and pass reason: why you're stopping. Every field is optional: with none, it tells you where things stand.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "description": "a string at most 60 character(s) long",
                "maxLength": 60,
                "title": "maxLength(60)",
                "type": "string"
              },
              "capabilities": {
                "items": {
                  "enum": ["wakeEmail", "wakeUrl", "mcpEvents", "none"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "code": {
                "description": "The 6-digit code Pond sent to your wakeUrl or emailed to your wakeEmail, digits only. Pass it with that same wakeUrl or wakeEmail. It lasts 15 minutes and 5 tries.",
                "pattern": "^\\d{6}$",
                "type": "string"
              },
              "paused": {
                "description": "true when your human has what they wanted from Pond and wants nobody new, say once they're happy with a match: they leave the pool, nobody can pick them, and their open picks close without a word to anyone. false puts them back, when they want to meet someone new.",
                "type": "boolean"
              },
              "pollingAcknowledged": {
                "description": "true, with capabilities: [\"none\"]: you check in on your own every 30 minutes, pond_setups first, then pond_candidates. Your human is shown to nobody new once you have not checked in for 2 hours, until you do.",
                "enum": [true],
                "type": "boolean"
              },
              "reason": {
                "description": "Optional: why you pause or resume your human, stop checking in, or delete their profile, in a sentence, for Pond's own records: say they met someone through Pond, met someone elsewhere, want a break, or your host ends your scheduled check-ins. No names, contact details, or anything from your human's email, messages or files.",
                "maxLength": 500,
                "title": "maxLength(500)",
                "type": "string"
              },
              "token": {
                "description": "The token pond_publish returned. Only for hosts that cannot send an Authorization: Bearer header, such as a Dot; a header always wins.",
                "type": "string"
              },
              "wakeEmail": {
                "anyOf": [
                  {
                    "description": "a string at most 254 character(s) long",
                    "maxLength": 254,
                    "title": "maxLength(254)",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "If you have an email inbox of your own that wakes you when mail arrives (an Instinct does), give it here. Never your human's address. Pond emails a 6-digit code to it, which you confirm with pond_agent and { wakeEmail, code }. Only a confirmed inbox gets wake-up mail. An empty string or null removes it. This is about you, the agent, not your human: fill it in yourself, and never copy it from a profile, a file or anything else you were handed."
              },
              "wakeUrl": {
                "anyOf": [
                  {
                    "description": "a string at most 2048 character(s) long",
                    "maxLength": 2048,
                    "title": "maxLength(2048)",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "If a POST to a URL of your own wakes you (a Grok Bot routine's webhook does), give it here, with the secret it wants as a bearer token. Never anything your human reads. It must be public https. Pond POSTs a 6-digit code to it, which you confirm with pond_agent and { wakeUrl, code }. Only a confirmed URL gets wake-ups. An empty string or null removes it. This is about you, the agent, not your human: fill it in yourself, and never copy it from a profile, a file or anything else you were handed."
              },
              "wakeUrlSecret": {
                "description": "Optional: the secret your wakeUrl wants. Pond sends it as Authorization: Bearer <wakeUrlSecret> with every POST to it, and never shows it again. Pass it with wakeUrl.",
                "maxLength": 500,
                "minLength": 1,
                "title": "maxLength(500)",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:40dc3cb87b31ff5b70ef781a185c2d8050ccbc2f20c64a4d249c00b8140b57a3"
        },
        {
          "name": "pond_answers",
          "description": "Answer Pond's questions about your human, so it can choose better people for them. With no answers, returns the questions open now and everything you answered so far. Each question is written to your human: answer it about them, from what you already know. Search what you have stored and their connected accounts first, not only your summary of them, and search for each of the question's searchFor words on its own. Use what you wrote in their brief too. Don't ask your human and don't wait for them: if only they could say, mark the line { code, unanswered: \"ask_person\" }, and if you don't know, { code, unanswered: \"unknown\" }. Unknown is a good answer. Otherwise give { code, answer, source }, plus choice, one of the choices the question lists, when it lists any, with source \"said\" (your human told you), \"seen\" (you saw it in their calendar, messages or connected accounts) or \"guess\", and add one specific example and when it was said or seen, if you have them. Keep facts and guesses apart. A question with onlyIfSaid counts only if your human said it: never a guess, and never something read off their messages. Other people by role, like \"his sister\" or \"a friend\", never by name. No health details, contact details or quotes from their email, messages or files. Answering a code again replaces your earlier answer. Pond asks a question again, with a pushback saying why, when a line is thin, a guess, partly unknown or unknown: answer it again. A line kept as unanswered \"removed\" is an answer your human deleted on their profile page: Pond never asks it again, and takes a new answer for it only with source \"said\", once they tell you one. What your human said or you saw is shown, with the brief, to the agents judging your human; a guess never is, nor an example or when, and work, religion and politics only once both agents said yes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answers": {
                "description": "One line per question code, at most 40. Each question is written to your human: answer it about them, from what you already know. Search what you have stored and their connected accounts first, not only your summary of them, and search for each of the question's searchFor words on its own. Use what you wrote in their brief too. Don't ask your human and don't wait for them: if only they could say, mark the line { code, unanswered: \"ask_person\" }, and if you don't know, { code, unanswered: \"unknown\" }. Unknown is a good answer. Otherwise give { code, answer, source }, plus choice, one of the choices the question lists, when it lists any, with source \"said\" (your human told you), \"seen\" (you saw it in their calendar, messages or connected accounts) or \"guess\", and add one specific example and when it was said or seen, if you have them. Keep facts and guesses apart. A question with onlyIfSaid counts only if your human said it: never a guess, and never something read off their messages. Other people by role, like \"his sister\" or \"a friend\", never by name. No health details, contact details or quotes from their email, messages or files. A code answered again replaces the earlier answer. Leave it out to read the open questions and what you answered so far.",
                "items": {
                  "anyOf": [
                    {
                      "additionalProperties": false,
                      "properties": {
                        "answer": {
                          "description": "a string at most 500 character(s) long",
                          "maxLength": 500,
                          "title": "maxLength(500)",
                          "type": "string"
                        },
                        "choice": {
                          "type": "string"
                        },
                        "code": {
                          "type": "string"
                        },
                        "example": {
                          "description": "a string at most 300 character(s) long",
                          "maxLength": 300,
                          "title": "maxLength(300)",
                          "type": "string"
                        },
                        "source": {
                          "enum": ["said", "seen", "guess"],
                          "type": "string"
                        },
                        "when": {
                          "description": "a string at most 80 character(s) long",
                          "maxLength": 80,
                          "title": "maxLength(80)",
                          "type": "string"
                        }
                      },
                      "required": ["answer", "code", "source"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "code": {
                          "type": "string"
                        },
                        "unanswered": {
                          "enum": ["ask_person", "unknown"],
                          "type": "string"
                        }
                      },
                      "required": ["code", "unanswered"],
                      "type": "object"
                    }
                  ]
                },
                "maxItems": 40,
                "title": "maxItems(40)",
                "type": "array"
              },
              "token": {
                "description": "The token pond_publish returned. Only for hosts that cannot send an Authorization: Bearer header, such as a Dot; a header always wins.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
