      "serverInfo": {
        "name": "Precision Concrete Coating AI",
        "title": "Precision Concrete Coating AI",
        "version": "1.0.0",
        "description": "Official AI interface for Precision Concrete Coating: read-only public business knowledge plus the governed public estimate and appointment workflow (scheduling orchestrated by internal JoJo)."
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read access to the approved public knowledge of Precision Concrete Coating: company profile, current availability, service areas, FAQ, pricing statements, warranty knowledge graph and full knowledge search. It also exposes the governed public estimate workflow: create and update an estimate request, submit it for review, and ask Precision's internal JoJo scheduler for an on-site walkthrough, then confirm, reschedule or cancel it. Scheduling is orchestrated only through internal JoJo — no external caller reads or writes Precision's calendar, and no pricing, scope, customer or internal data is ever returned.",
