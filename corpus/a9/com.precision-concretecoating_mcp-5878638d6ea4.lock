          "name": "analyze_estimate_photos",
          "title": "Observe attached photos",
          "description": "Runs visual observation over any unreviewed photos. Returns non-diagnostic observations from a fixed vocabulary with confidence values. Observations are impressions only and are always marked as requiring field verification.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "customer_access_token": {
                "description": "The one-time customer_access_token returned by create_estimate_request. Required with request_id for every follow-up call. Stored hashed at rest and never re-issued.",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional client-supplied key. Repeating a call with the same key never duplicates work.",
                "type": "string"
              },
              "request_id": {
                "description": "The request_id returned by create_estimate_request.",
                "type": "string"
              }
            },
            "required": ["customer_access_token", "request_id"],
            "type": "object"
          },
