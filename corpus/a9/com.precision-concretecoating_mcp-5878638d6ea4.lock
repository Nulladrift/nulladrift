        {
          "name": "explain_knowledge_reasoning",
          "title": "Reason across the knowledge graph",
          "description": "Answers a question by traversing the published knowledge graph and returning ranked reasoning paths instead of disconnected records. Each path is an ordered chain of relationships with a path score, a path confidence, the supporting evidence, the relationship types used and a plain-language explanation of every transition. Traversal respects relationship weight, evidence strength, concept ontology, semantic clusters and inverse relationships, and prunes weak branches automatically.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "goal": {
                "description": "Optional destination topic. Paths that reach it rank higher.",
                "type": "string"
              },
              "max_depth": {
                "description": "Maximum hops per reasoning path, 1–6. Default 4.",
                "type": "integer"
              },
              "max_paths": {
                "description": "Maximum ranked paths returned, 1–12. Default 5.",
                "type": "integer"
              },
              "question": {
                "description": "The question to reason about. Used to choose starting records and rank paths.",
                "type": "string"
              },
              "subject": {
                "description": "Optional explicit starting record title.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
