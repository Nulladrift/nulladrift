        {
          "name": "sigil_atap_register_ait",
          "description": "Registers an ATAP v0.1 AIT for a media-buying agent under the\n`sigil:media_buyer:v1` profile. Sigil validates the capability set and\nconstraints against the published profile, signs the AIT as the witness\n(`OAI-2026-0000201`), stores it, and returns the signed token.\n\nSigil is the ATAP witness — there is no kernel observer. See\nhttps://github.com/TunnelMind/atap-profiles.\n\nThe response carries `holder_secret` **once** (32 random bytes,\nbase64url; only its SHA-256 is stored). It is what every later write to\nthis AIT — `sigil_atap_witness`, `sigil_atap_roll_block`,\n`sigil_receipt_generate` — must present as `Authorization: Bearer`.\nLose it and the AIT is frozen; register a new one. `operator_status`\nis `asserted`: Sigil signs the AIT but does not verify that the holder\ncontrols the operator OAI it names.\n",
