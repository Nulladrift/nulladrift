        {
          "name": "sigil_verify_ads_txt",
          "description": "Confirms whether an SSP/exchange is authorized to sell a publisher's\ninventory according to that publisher's ads.txt. This is a cache lookup\nagainst ads.txt files crawled daily across the top 10,000 publisher\ndomains — it does NOT fetch the publisher's ads.txt live, so it is fast\nand adds no latency to a real-time bidding decision.\n\nUse this tool when:\n- You are an ad-buying agent and want to confirm, pre-bid, that a supply\n  path (publisher → exchange → seller_id) is legitimate.\n- You are detecting domain spoofing or unauthorized resale in a bid stream.\n- You want to check whether a seller is listed DIRECT or RESELLER.\n\nDo NOT use this tool when:\n- You want a full supply-path trust score — that endpoint is Sigil P31.\n- You want surveillance tracker data for the domain — use `get_domain`.\n\nInputs:\n- `publisher_domain` (body, required): Publisher domain, e.g. `nytimes.com`.\n  A `www.` prefix and scheme/path are stripped automatically.\n- `exchange_domain` (body, required): The exchange/SSP domain as it appears\n  in ads.txt, e.g. `google.com`, `amazon-adsystem.com`.\n- `seller_id` (body, required): The publisher's seller/account ID at that\n  exchange, e.g. `pub-4177862836555934`. Matched exactly.\n- `seller_type` (body, optional): `DIRECT` or `RESELLER`. When supplied it\n  is checked against the ads.txt entry; a mismatch is reported as a warning.\n- `resolve_chain` (body, optional): When true, a matched RESELLER entry is\n  cross-checked against the exchange's sellers.json (one authoritative hop).\n\nReturns:\n- `verified`: true (entry found), false (confidently not listed), or null\n  (ads.txt could not be retrieved — indeterminate).\n- `confidence`: `high` | `degraded` | `low` | `unknown`.\n- `seller_entry`: the matched ads.txt line (line number, raw text, parsed\n  fields) when `verified` is true; otherwise null.\n- `ads_txt_parse_status`, `ads_txt_last_parsed`, `stale`: provenance of the\n  cached crawl this answer is derived from.\n- `reseller_chain`: empty unless `resolve_chain: true` and the matched entry\n  is RESELLER — then it carries the sellers.json cross-check for the seller.\n- `warnings`: actionable flags, e.g. `publisher_not_in_corpus`,\n  `publisher_has_no_ads_txt`, `seller_type_mismatch`, `ads_txt_cache_stale`.\n\nCost:\n- Counts as one request against the daily rate limit.\n\nLatency:\n- Typical: <50ms (single cache lookup, no outbound fetch). p99: <120ms.\n",
          "inputSchema": {
            "properties": {
              "exchange_domain": {
                "description": "Exchange/SSP domain as listed in ads.txt",
                "example": "amazon-adsystem.com",
                "type": "string"
              },
              "publisher_domain": {
                "description": "Publisher domain (www. prefix and scheme stripped)",
                "example": "nytimes.com",
                "type": "string"
              },
              "receipt": {
                "default": false,
                "description": "When true, attach a signed Receipt v1.0 committed to the transparency log. Additive — the response shape is otherwise unchanged, and a signing failure never costs you the verdict (ADR-014).",
                "type": "boolean"
              },
              "resolve_chain": {
                "default": false,
                "description": "When true, a matched RESELLER entry is cross-checked against the exchange's sellers.json",
                "type": "boolean"
              },
              "seller_id": {
                "description": "Publisher's seller/account ID at the exchange",
                "example": "3030",
                "maxLength": 128,
                "type": "string"
              },
              "seller_type": {
                "description": "Optional — checked against the ads.txt entry",
                "enum": ["DIRECT", "RESELLER"],
                "type": "string"
              }
            },
            "required": ["exchange_domain", "publisher_domain", "seller_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
