        {
          "name": "get_demand_aggregate",
          "description": "Weekly public aggregate of demand: what callers asked this API for that it\ndid not have or rejected (ghost routes, rejected arguments, ghost MCP tools, tools/list counts). One ISO week, Monday 00:00 UTC to the next Monday\n00:00 UTC (`?week=` picks the week containing a date; default is the current\nweek). Aggregate rows only: a row is published only when at least\n`n_threshold` (3) distinct actors produced it in the window. Rows below that\nare omitted, and their count is published in `suppressed` ({rows, events}).\nNo actor identifier, IP, raw path, query string, timestamp or per-row user\nagent is ever returned. `name` and `path_shape` are caller-supplied request\ntext, marked `caller_supplied: true`; they are not TunnelMind statements.\n`valid_until` equals `window_end`. Add `?receipt=true` for a signed Receipt\nv1.0 over the same payload.\nTotals cover published rows only. `ghost_tool_per_list_ratio` is ghost tool\nasks per tools/list, because only unknown-tool calls are recorded.\n",
