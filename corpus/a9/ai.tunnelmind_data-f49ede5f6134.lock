            "readOnly": false
          },
          "digest": "sha256:6413e610ee12827294b903b8f86a3f1c1e0b6a8e3ffa3efb02e99201f85e2acc"
        },
        {
          "name": "attributes_lookup",
          "description": "P73 fast attributes endpoint (PIP-PLAN P3): a full `POST /v1/verify`\nresolve fans out across four lenses (~2s) — fine for preflight, fatal\ninside a per-request authorization loop. This endpoint serves the\nlast-known signed bundle from a single KV read, with the P69 freshness\ncontract deciding how much to trust it.\n\nUse this tool when:\n- A policy decision point (OPA, Cerbos, Cedar) needs node attributes\n  on its hot path and can tolerate `valid_until`-bounded staleness.\n- An agent re-checks a node it (or anyone) verified recently.\n\nInputs:\n- `node` (path, required): IPv4/IPv6 address, domain, ASN (`AS64500`), or\n  entity_slug — same grammar as /v1/verify.\n\nReturns:\n- The exact verify bundle last cached for the node (lens blocks,\n  `cross_lens` verdict, `coverage` with `valid_until` /\n  `stale_if_error`, signed `receipt`), plus `attributes_meta`:\n  `cached_at` and `freshness` — `fresh` (inside `valid_until`) or\n  `stale` (past it, still inside the `stale_if_error` window; the\n  contract says a consumer may use it rather than fail closed).\n- `404` when nothing is cached — the node was never verified, or its\n  bundle aged past `stale_if_error`. POST /v1/verify to (re)observe.\n- The short-lived `sigil_token` from the original verify is never\n  included: bearer capabilities are not re-served.\n\nCost:\n- Counts as one request against the daily rate limit.\n\nLatency:\n- Typical: <100ms (one KV read, no lens fan-out).\n",
          "inputSchema": {
            "properties": {
              "node": {
                "type": "string"
              }
            },
            "required": ["node"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eebbdf92f2790ec0d7739db705df4e4bdf1a4852e70f7840a842999ea7d38815"
        },
        {
          "name": "audit_export",
          "description": "Returns NDJSON (one JSON object per line) of audit log entries. Each entry records\nthe operation called, the identity, hashes of the request and response, duration,\nand an Ed25519 signature over the canonical entry JSON. Entries are hash-chained:\neach entry's `prev_entry_hash` is SHA-256 of the previous entry's signature,\nmaking deletion of any entry detectable offline.\n\nAuthenticated callers receive only their own entries (`identity_sub` match).\nAdmin key holders receive all entries.\n\nUse this tool when:\n- You want a tamper-evident record of your own API calls.\n- You are auditing a sequence of requests for compliance or debugging.\n- You want to verify the audit chain integrity offline.\n\nDo NOT use this tool when:\n- You are anonymous — authentication is required.\n- You want task status — use `get_task` instead.\n\nInputs:\n- `from` (query, optional): ISO 8601 start datetime. Default: 7 days ago.\n- `to` (query, optional): ISO 8601 end datetime. Default: now.\n- `limit` (query, optional): Max entries. 1–5000, default 1000.\n\nReturns:\n- NDJSON stream, one `AuditEntry` per line.\n- `X-Total-Count` response header with entry count.\n- `X-Took-Ms` response header.\n\nVerify the chain offline:\n- For each consecutive pair (A, B): `SHA-256(A.signature) == B.prev_entry_hash`.\n- For each entry: verify Ed25519 signature against public key in `/.well-known/atap.json`.\n\nCost:\n- Counts as one request against the daily limit.\n\nLatency:\n- Typical: <300ms for 1000 entries, p99: <1s.\n",
          "inputSchema": {
            "properties": {
              "from": {
                "example": "2026-04-17T00:00:00Z",
                "format": "date-time",
                "type": "string"
              },
              "limit": {
                "default": 1000,
                "maximum": 5000,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "format": "date-time",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2350e1b8461d9da9a350f5e0c86785880c00ea531f0a123e6ca086e3da7c38fd"
        },
        {
          "name": "cancel_task",
          "description": "Marks the task as `cancelled`. If the task is already in a terminal state\n(`complete`, `failed`, `expired`), returns 409 Conflict. Only the identity\nthat created the task may cancel it.\n\nUse this tool when:\n- You submitted a probe with `?async=true` and no longer need the result.\n- You want to free up a pending task before it expires.\n\nDo NOT use this tool when:\n- The task is already complete — cancellation is not possible.\n\nInputs:\n- `task_id` (path, required): 26-char ULID.\n\nReturns:\n- `task_id` and `status: cancelled`.\n\nCost:\n- Free.\n\nLatency:\n- Typical: <150ms.\n",
