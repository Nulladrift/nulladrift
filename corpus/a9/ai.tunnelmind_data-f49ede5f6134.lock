          "description": "Deprecated alias of fareseal_stats. Same data; use the /v1/fareseal/ path. Original description follows.\n\nThe public read over the Conduct Log Commons: which agents knocked on\nattested Fareseal sites in the last 7 days, what they did when offered\npaid access, and what they would have paid. First-party monitors and\ncredential-scanning recon are classified and EXCLUDED from the headline\n(reported separately, never conflated). Attested tier only — keys a\ndomain has vouched for via /.well-known/tollbooth-site.json.\n\nUse this tool when:\n- You want to know how AI crawlers actually behave when a site asks them to pay.\n- You need the current commons membership (sites by tier) and the export pointers.\n\nReturns:\n- `headline`: agents, requests, would_have_paid_usd, robots_respecting_agents.\n- `named_ai` / `other` / `attack_recon`: per-agent rows with sampled paths.\n- `receipts`: identity-bearing conduct receipts by type.\n- `commons`: tier, sites {attested, unattested}, export + attest pointers.\n\nCost:\n- Counts as one request against the daily rate limit. Not cached.\n\nLatency:\n- Typical: 300–1200ms (two D1 reads over the last 7 days).\n",
