        {
          "name": "get_pricing",
          "description": "Spec 097 / ADR-035 Amendment C8. Returns the usage-tiered price schedule\nfor paid calls. Prices are integer strings of USDC atomic units\n(6 decimals). Rows are `{tier, from, to, price_atomic}`; `to` is null for\nthe open tier. `anonymous` is the price a call without an API key pays.\nThe schedule is the compiled-in default unless a validated override is held\nin KV (one KV read, no database read); `schedule_source` says which.\n`band` is the floor and ceiling every tier price sits inside.\n`schedule_hash` is the sha256 hex of the RFC 8785 canonical schedule, so a\nconsumer can tell when prices change.\n\n`counting_rule`: the tier is set by settled paid calls per API key in the\ncurrent UTC calendar month; a call without a key pays the top-tier price;\na call counts only after a successful settle; the 402 response quotes the\nprice of the caller's next call. `consistency_note`: the count is kept in\nKV, which is eventually consistent, so a tier boundary can drift by a few\ncalls.\n\nFreshness: `observed_at` is the response time, `valid_until` is 24 hours\nlater, `stale_if_error` is 86400 seconds.\nAdd `?receipt=true` for a signed Receipt v1.0 over the same payload.\n\nRate limits: anonymous: 10 per minute per IP; no daily cap on /v1/self, /v1/pricing, /v1/ledger and /v1/weather/station/{icao}/health; other anonymous probes 100 per day; free tier 50 per day. For anonymous callers this route has no daily cap and keeps 10/min; API-key tiers keep their daily cap.\n",
