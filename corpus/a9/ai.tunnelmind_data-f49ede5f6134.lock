              "version": {
                "description": "Pin a specific bundle version. Omit for latest.",
                "example": "1.0.0",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
