          "description": "Deprecated alias of fareseal_export. Same data; use the /v1/fareseal/ path. Original description follows.\n\nFree bulk read of the commons — the raw record is never paywalled. Every\nrow carries a Fareseal document exactly as its site signed it — the\n`receipt` (kind=receipts) or `snapshot` (kind=reports) object, Ed25519\nover RFC 8785 JCS of that document minus `sig`, key = its own `site` —\nbeside a `_commons` envelope naming the tier and vouching domain (the\nenvelope is not signed). Nothing in a row requires trusting TunnelMind.\n\nUse this tool when:\n- You want the raw record behind the stats, or to verify it yourself.\n- You are building your own exhibit or comparison over attested sites.\n\nReturns:\n- `rows[]`: `{_commons: {tier, domain, received_at}, receipt | snapshot}`.\n- `rows_returned`, `limit`, `capped` (true when more rows follow this\n  page, not merely when the page is full), `next_after` (id of the last\n  row emitted; null when this page is the last).\n- Paging: follow `next_after` as `after=` until `capped` is false. The\n  NDJSON download carries the same as `x-commons-capped` and\n  `x-commons-next-after` headers.\n\nCost:\n- Counts as one request against the daily rate limit. Past days cached 1h.\n\nLatency:\n- Typical: <200ms cached; up to ~1s on a cache miss for a busy day.\n",
