        },
        {
          "name": "profile_entity",
          "description": "At least one of `ip`, `domain` or `entity` is required.\n\nCall this before routing traffic, bidding on inventory, or trusting a\ncounterparty. It fuses ALL THREE TunnelMind lenses for one subject —\nScry (attacker intelligence + threat feeds + open ports), Sigil\n(ad-supply-chain position + trust score + ATAP witness count), and\nTracker (DDG/IAB catalog + prevalence + categories) — into a single\nconfidence-scored profile plus a signed P38 receipt.\n\nThe `cross_lens.hits` field tells you if the same infrastructure\nappears in attack data AND supply-chain data — that's your\nhighest-confidence signal, and the one no siloed competitor can give\nyou. `cross_lens.flags` surfaces the actionable highlights\n(`cross_lens_overlap:scry+sigil`, `in_threat_intel:...`,\n`high_prevalence_tracker`, `corroborated_by_N_lenses`).\n\nConfidence weighting: each lens contributes a base score; a 1.5×\nmultiplier applies when ≥2 lenses corroborate the same subject; and the\nScry contribution is weighted by the attestation tier of the sensors\nthat observed it (silicon_root 1.0 → self_asserted 0.5). Bounded [0,1]\nand carried into the receipt.\n\nUnlike `cross_lens_verify` (one node → one verdict) and\n`cross_lens_lookup` (one node → raw three-lens view), profile_entity\ntakes the SUBJECT as any combination of ip / domain / entity and returns\nthe richest fused detail for a pre-transaction decision. At least one of\nip / domain / entity is required.\n",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Domain of the subject (Sigil + Tracker lenses).",
                "example": "pubmatic.com",
                "type": "string"
              },
              "entity": {
                "description": "entity_slug of the subject (Sigil + Tracker lenses).",
                "example": "google-doubleclick",
                "type": "string"
              },
              "ip": {
                "description": "IPv4 or IPv6 address of the subject (Scry lens).",
                "example": "8.8.8.8",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
