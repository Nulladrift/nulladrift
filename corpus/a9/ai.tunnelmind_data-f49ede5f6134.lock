          "description": "Batch form of `ghostroute_check`: one verdict per subject, aligned to\ninput order. The batch is validated whole before anything is charged,\nrun or signed: an empty or non-array `subjects`, or any invalid subject,\nfails the entire batch with 400 `invalid_request` (the message names\n`subjects[i]`), and more than 50 subjects fails it with 413\n`payload_too_large`. A `{ok:false, error}` entry appears inline only\nwhen the check for an already-valid subject fails at runtime; the other\nsubjects still return their verdicts.\n\nUse this tool when:\n- You need routing-integrity / sovereignty verdicts for many endpoints at once.\n\nInputs:\n- `subjects` (body, required): 1-50 IPs, domains, ASNs (AS####) or cert hashes.\n- `receipt` (body, optional): when `true`, each verdict is a signed, persisted GhostRoute receipt.\n\nReturns:\n- `count`, `results[]` — each `{ok, subject, ...verdict}` (plus `receipt_id`, `signature` when receipts were requested).\n\nCost:\n- Each subject costs one rate-limit unit (the first is the request itself).\n  A batch larger than the remaining budget is refused whole with 429 and\n  charges nothing beyond that first unit, so the effective maximum per call\n  is min(50, remaining + 1): anonymous 10/min, free 50/day, supporter\n  500/day, pro 5,000/day, enterprise unlimited.\n\nLatency:\n- Subjects run in parallel; roughly the slowest single check (300-900ms cold).\n",
