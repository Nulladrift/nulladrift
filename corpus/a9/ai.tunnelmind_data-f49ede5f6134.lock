        {
          "name": "ledger_search",
          "description": "One public search over the receipt sources, newest first. Not `/v1/search`\n(that is the domain search).\n\nUse this tool when:\n- you want to find a TunnelMind change by ref, kind or summary.\n- you want one newest-first view of TunnelMind's changes and the attested Fareseal commons.\n- you want a past day's signed station-health rows (`source=weather-health`).\n- you want the roster of attested agent keys (`source=agents`).\n\nFour public sources, and only these:\n- `changes` — the receipts ledger, lens `config` with `change:*` and\n  `toolset:*` subjects (the same set as `GET /v1/changes`; a `kind` narrows\n  it to one), mapped like `GET /v1/changes`\n  so a row reads as a change, not a hash. With `q`, changes are also\n  searched in the receipt index (D1 full-text search over each\n  sequenced receipt's subject, source endpoint and allow-listed payload\n  fields, such as `ref`), public rows only; every index hit is re-read\n  from the receipts ledger under the same pin, so the index can narrow\n  a search but never widen it. Each changes row then carries `matched`:\n  `[\"substring\"]`, `[\"index\"]` or `[\"substring\",\"index\"]`, for which\n  search found it. `sources.changes.index.coverage` says whether the\n  index was read (`observed_clean`), or `degraded` with a `reason`, in\n  which case the substring matches still answer.\n- `commons` — Fareseal receipts from attested sites only.\n- `weather-health` — the signed station-health rows (lens `wx-health`),\n  read from the public weather relay one CLOSED UTC day at a time. Every\n  row is verified under the pinned weather key; a day that fails\n  verification degrades the whole source. No row from the open (current)\n  UTC day enters: the live 5-minute answer is `station_health`\n  (`GET /v1/weather/station/{icao}/health`).\n- `agents` — the attested agent-key roster (`tollbooth_agent_facts`,\n  attested sites only): one row per verified agent key, summed over its\n  isolates and placed at the key's newest snapshot. A roster of keys, not\n  receipts: each row points at the per-key record\n  `GET /v1/tollbooth/agents/{key}` (the row's `id`), which names the\n  signed snapshots behind the sums.\n\nThe default view (no `source`) is `changes` + `commons` only and makes no\nrelay call; weather-health rows appear only with `source=weather-health`,\nagents rows only with `source=agents`.\n\nAPI-verdict receipts (cross_lens, preflight, scry, self, …) are NOT public:\nADR-010 keeps them hashes-only, so they are not in this ledger. The\nweather-health rows are not API-verdict receipts: they are TunnelMind's own\njudgements over public NWS observations, already public on the relay.\n\nSearchable, NOT downloadable: `limit` is at most 100, there is no NDJSON,\nno `format=` and no day dump. Bulk goes through the Fareseal export.\nChanges rows carry public fields only — no receipt body, no\n`customer_id`. Commons rows carry the signed Fareseal document\nverbatim (`receipt`, or `receipt_unreadable: true` when the stored\ndocument does not parse). Weather-health rows carry the signed health\nreceipt verbatim (`receipt`) with its `day`, `station`, `verdict`,\n`rules_version` and chain `sequence`. Agents rows carry the key (`id`),\nits newest `ua`, and the summed `requests` and `isolates` counts.\n\nEach source is read and degraded on its own: `sources.<name>.coverage` is\n`observed_clean`, `never_observed` (an honest absence, e.g. `day=` the open\nday, or no closed day published yet; with a `reason`) or `degraded` with a\n`reason`. A degraded source contributes no\nrows; the response is still 200, never a crash and never an empty list\npassed off as clean. Only the sources the filters can match are listed.\n\nPaging: `truncated` is true when more rows exist; pass `next_cursor` as\n`cursor` for the next page. Rows are ordered by issued_at (newest first),\nthen source (`changes`, then `commons`, then `weather-health`, then `agents`), then id, and the cursor marks the\nlast row returned, so rows sharing a timestamp are never skipped or repeated.\n\n400 `invalid_request` on a malformed `q`, `source`, `kind`, `day`,\n`before`, `cursor` or `limit` (including `source=receipts`), on `cursor`\nwith `before`, and on `kind` with `source=commons`, `source=weather-health` or `source=agents`.\n\n`?receipt=true` attaches a signed Receipt v1.0 over the result. It is\nnot written to the receipts ledger (`receipt_logged: false`): the rows\nare already signed at source, and logging each search would feed the\n`changes` source.\n\nRate limits: anonymous: 10 per minute per IP; no daily cap on /v1/self, /v1/pricing, /v1/ledger and /v1/weather/station/{icao}/health; other anonymous probes 100 per day; free tier 50 per day. For anonymous callers this route has no daily cap and keeps 10/min; API-key tiers keep their daily cap.\n",
          "inputSchema": {
            "properties": {
              "before": {
                "description": "Only rows strictly older than this ISO 8601 instant (timezone required). A time filter, not a paging cursor; cannot be combined with `cursor`.",
                "format": "date-time",
                "type": "string"
              },
              "cursor": {
                "description": "Opaque paging cursor: pass `next_cursor` from the previous page, unchanged, with the same other filters. 1-256 base64url characters encoding JSON `{t, s, i}` (the last row's issued_at, source and id); anything else, or `cursor` with `before`, is a 400.",
                "maxLength": 256,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]{1,256}$",
                "type": "string"
              },
              "day": {
                "description": "Only rows issued on this UTC day (YYYY-MM-DD). Not in the future.",
                "format": "date",
                "type": "string"
              },
              "kind": {
                "description": "Only changes of this kind. Applies to the `changes` source only.",
                "enum": ["site_change", "price_change", "retirement", "ratified_op", "code_merge", "toolset_change"],
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "Maximum rows returned, 1-100.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Substring to match (changes — subject or summary, plus a full-text phrase over the public receipt index; commons — path class; weather-health — station or flag id; agents — the ua, any case, or a key prefix, exact case). 0-100 chars of letters, digits, space and `._:/#@-`.",
                "maxLength": 100,
                "pattern": "^[A-Za-z0-9 ._:/#@-]{0,100}$",
                "type": "string"
              },
              "receipt": {
                "default": false,
                "description": "When true, attach a signed Receipt v1.0 over the result (not logged to the receipts ledger). Additive — a signing failure never costs you the observation (ADR-014).",
                "type": "boolean"
              },
              "source": {
                "description": "Only this source. Omit for the default view, `changes` + `commons` (weather-health and agents only when asked for).",
                "enum": ["changes", "commons", "weather-health", "agents"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:37b233aa2f2e5909a893672e706e690b48a8207120b7723ae4ab65b370e19231"
        },
        {
          "name": "list_domains",
          "description": "Returns a paginated list of domains from the tracker database. Results are ordered\nalphabetically by domain name and support cursor-based pagination for full traversal.\nFiltering by category and minimum score allows targeted data extraction.\n\nUse this tool when:\n- You want to enumerate all known ad-tech or analytics domains above a risk threshold.\n- You need a dataset of tracker domains for offline analysis.\n- You are paginating through a category to build a block list.\n\nDo NOT use this tool when:\n- You need data for a specific domain — use `get_domain` instead.\n- You are searching by keyword — use `search` instead.\n- You want domains belonging to a specific company — use `get_entity` instead.\n\nInputs:\n- `category` (query, optional): Filter by surveillance category. One of: `ad_tech`,\n  `analytics`, `social`, `fingerprinting`, `content`, `cdn`, `other`.\n- `min_score` (query, optional): Integer 0-100. Exclude domains scoring below this value.\n- `limit` (query, optional): Number of results per page. Max 100 (paid), 20 (free). Default 50.\n- `cursor` (query, optional): Pagination cursor from the previous response's `next_cursor` field.\n\nReturns:\n- Array of domain list items (domain, category, score, prevalence, entity summary).\n- `meta.has_more`: true if more pages exist.\n- `meta.next_cursor`: pass as `cursor` to get the next page.\n- `meta.count`: number of results in this page.\n\nCost:\n- Free tier: up to 20 results/page. Anonymous (no key): 10/min, 100/day. Free key: 50/day.\n  Pro/enterprise: up to 100 results/page, included in plan.\n\nLatency:\n- Typical: <200ms, p99: <500ms.\n",
