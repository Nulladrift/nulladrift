        {
          "name": "receipt_with_proof",
          "description": "Spec 003 / ADR-044 decision 3. Returns the RFC 6962 inclusion proof\nfor one sequenced receipt against the latest Signed Tree Head, plus\nthe receipt itself where it may be shown.\n\nUse this tool when:\n- An agent found a receipt with `ledger_search` and wants to verify\n  it offline. The 2-call path: `ledger_search` (find the hit), then\n  `receipt_with_proof` (the receipt + inclusion proof + STH), then\n  `scripts/verify-log.mjs inclusion proof.json --key <log key>\n  --receipt receipt.json` with no further calls.\n\nInputs:\n- `id` (path, required): the unified `receipt_id` or a lens alias.\n\nReturns:\n- Always: `leaf_index`, `tree_size`, `leaf_hash`, `audit_path`,\n  `root_hash`, `sth` (the same fields as\n  `receipt_log_inclusion_proof`), `receipt_id` and `lens`.\n- `receipt`: the exact stored document for public rows (lens `config`\n  with a `change:` or `toolset:` subject, already public through\n  `/v1/changes` and `/v1/ledger`) and for the owning customer.\n  Otherwise `receipt: null` and `receipt_withheld: \"private\"`.\n\nWhat this proves: the receipt is byte-identical to the one sequenced\ninto the log — not that the observation inside it was correct.\n\nCost:\n- Counts as one request against the daily rate limit.\n",
