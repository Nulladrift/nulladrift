        {
          "name": "receipt_log_consistency_proof",
          "description": "Proves the log at size `second` is an append-only extension of the log\nat size `first` — history was never rewritten. Returns both roots and\nthe proof path. Verify offline with\n`scripts/verify-log.mjs consistency <proof.json>`.\n\nWhere a signed tree head is stored at `first` or `second`, that root\nis checked against the current leaves; a mismatch (history rewritten\nsince the head was signed) answers 409 with no proof.\n",
