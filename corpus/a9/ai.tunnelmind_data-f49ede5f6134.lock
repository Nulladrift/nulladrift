          "description": "For a capability TunnelMind does not provide itself, returns the destination's\nendpoint and schema URL from a reviewed catalog, plus facts TunnelMind\nitself observed: when its own probe last reached the destination, whether the\ndestination advertises x402 or Web Bot Auth, and the origin ASN and RPKI state\nof the host. Every fact carries `{value, tier, source}` and a coverage state.\nThe response carries a signed Receipt v1.0.\nThe signature attests what TunnelMind recorded, not that the destination's\nclaims are true. TunnelMind never calls the destination on your behalf and\nnever carries your traffic or data to it. Payment always goes to\nTunnelMind's own x402 address and nothing the destination says can change that.\nPriced per call in x402 USDC by the caller's monthly tier (anonymous callers\npay the base price); the 402 challenge quotes the price for this call. Demo\npayments are refused. When the paid tools flag is off the route answers 503\nand issues no challenge. Unknown capabilities answer 404 with no charge.\n",
