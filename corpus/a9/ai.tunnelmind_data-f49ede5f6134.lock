          "description": "Scores up to 200 entities in one round-trip — built for agents\nevaluating many supply sources during campaign setup. Per-item parse\nfailures (e.g. a bad domain) are returned inline, with one exception:\na malformed `app_bundle` id rejects the whole batch with 400.\n\nAn optional `weights` object re-weights every entity in the call.\n\nCost:\n- Each entity costs one rate-limit unit (the first is the request itself).\n  A batch larger than the remaining budget is refused whole with 429 and\n  charges nothing beyond that first unit, so the effective maximum per call\n  is min(200, remaining + 1): anonymous 10/min, free 50/day, supporter\n  500/day, pro 5,000/day, enterprise unlimited.\n",
