        {
          "name": "sigil_verify_app_bundle",
          "description": "Verifies that a mobile or CTV app bundle ID actually exists in the\nrelevant app store — used to detect bundle spoofing in bid requests.\n\nPlatform support (v1):\n- `ios`: verified live via Apple's iTunes Lookup API.\n- `android`: verified live via the Google Play store listing page.\n- `ctv_*` / `web`: no public store API — returns verified=null.\n\nInputs:\n- `bundle_id` (body, required): e.g. `com.nytimes.NYTimes`.\n- `platform` (body, required): ios | android | ctv_roku | ctv_fire |\n  ctv_samsung | ctv_lg | ctv_vizio | web.\n- `claimed_developer` (body, optional): checked against the store listing.\n\nReturns:\n- `verified`: true | false | null. null means one of two things: the\n  platform has no store API (confidence `low`, warning\n  `no_store_api_available`), or the store lookup failed (confidence\n  `degraded`, warning `store_api_unavailable`, with `reason`).\n- `reason`: why the store lookup failed — http_<status> | timeout |\n  network_<error name> | bad_response. Present only on the degraded path.\n  When the relay was also tried and failed it is\n  `<worker reason>+relay_<relay reason>`, e.g. `http_403+relay_timeout`.\n- `source` (iOS only): `worker` | `relay`. When the Worker's own iTunes\n  lookup ends in http_403, http_429 or network_* and the relay is\n  configured, the lookup is retried once through TunnelMind's relay;\n  `relay` means the relay was consulted (success or failure).\n- `store_listing`: name, developer, developer_match, store_url.\n",
