      "instructions": "TunnelMind Data API — surveillance intelligence. Use search() to find domains/entities, get_domain() for full records, intel_* for live probes. Pass Authorization: Bearer <key> for authenticated access. The tunnelmind_analyst prompt (prompts/get) returns the full BYOM config bundle to configure any LLM as a TunnelMind analyst.",
      "tools": [
        {
          "name": "agent_record",
          "description": "Spec 125. One agent public key's record across attested Fareseal\nsites: summed requests, a sample of paths, whether robots.txt was\nfetched, the signed snapshots each figure comes from (`sources[]`),\nand the newest 100 receipts naming the key, verbatim. Free, no auth.\nFacts, not verdicts: no score, no tier, no IP. Counts are a LOWER\nBOUND. The cache is not the record — `verify` says how to recompute\nevery sum from `fareseal_export` and check each source's sig.\n\nUse this tool when:\n- You want what the commons has observed of a specific agent key.\n- You are auditing an agent's conduct and want to check it yourself.\n\nReturns:\n- `key`, `ua`, `requests`, `isolates`, `first_seen`, `last_seen`, `paths[]` (capped), `robots_txt_fetched`.\n- `sources[]`: `{site, isolate_id, seq, taken_at, sig}`.\n- `paid`, `receipts_total`, `receipts[]` (each `receipt` verbatim as signed), plus the honesty fields.\n- 404 for a key with nothing attested: the same record, empty, in `error.record`.\n\nCost:\n- Free. Anonymous 10/min per IP, no daily cap.\n\nLatency:\n- Typical: <150ms.\n",
          "inputSchema": {
            "properties": {
              "key": {
                "description": "Agent Ed25519 public key, 43-character base64url (no padding).",
                "pattern": "^[A-Za-z0-9_-]{43}$",
                "type": "string"
              }
            },
            "required": ["key"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6d2c7fd2da743cd872508698277bcf5fe4376bf3360d0e419dc15540ec883623"
        },
        {
          "name": "agent_registries_lookup",
          "description": "P75 registry aggregation: the cross-lens join applied to agent identity.\nIncumbent providers each consult only their own registry; this endpoint\nchecks every registry TunnelMind can reach and labels each answer with\nan explicit state, so a gap can never be mistaken for a clean result:\n\n- `observed` — the subject IS in this registry (record attached)\n- `not_present` — checked, and it isn't (an observation, not a gap)\n- `not_applicable` — the registry doesn't key on this subject type\n- `degraded` — the check failed (timeout, upstream error)\n- `unavailable` — the registry is not publicly consultable (closed /\n  platform-scoped); stated in-band because silence would read as clean\n\nRegistries (v0): `crawler_ranges` (operator-published IP feeds —\nGooglebot, GPTBot, PerplexityBot…), `wba_directory` (RFC 9421\nSignature-Agent JWKS at the subject domain), `mcp_registry`\n(registry.modelcontextprotocol.io), `tunnelmind_known_agents` (curated\nverifiable/claim-only set), plus honest `unavailable` rows for Visa TAP,\nMastercard Agent Pay, and Cloudflare Verified Bots.\n\nUse this tool when:\n- You are deciding whether an agent, bot, or MCP server is registered\n  anywhere that vouches for it — in one call instead of five.\n- You need the blind spots stated: which registries could NOT be\n  consulted for this subject, and why.\n\nInputs: subject — an IP (registry membership by published ranges), a\ndomain (WBA directory + MCP registry), or an agent name/UA fragment\n(e.g. `gptbot`, `claudebot`). `?receipt=true` attaches a signed\nReceipt v1.0 committed to the transparency log.\n\nLatency: remote registry checks are KV-cached for 1h; a warm call is\nedge-fast, a cold one bounded by 5s per-registry timeouts.\n",
          "inputSchema": {
            "properties": {
              "receipt": {
                "description": "Attach a signed TunnelMind Receipt v1.0 over the aggregation.",
                "enum": ["true"],
                "type": "string"
