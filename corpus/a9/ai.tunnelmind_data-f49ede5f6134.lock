        {
          "name": "verify_agent_signature",
          "description": "Neutral third-party Web Bot Auth verification. An origin — or the PDP\ndeciding for it — received a request from a claimed agent carrying the\nWeb Bot Auth headers (Signature, Signature-Input, Signature-Agent).\nRelay those headers here, plus the authority the request was addressed\nto, and TunnelMind verifies the Ed25519 signature against the agent's\nown published key directory\n(https://<agent>/.well-known/http-message-signatures-directory).\n\nFacts, not a verdict: `state: verified` means \"this signature\ncryptographically verifies against that directory\" — whether to trust\nthe agent behind it is your policy engine's call.\n\nUse this tool when:\n- A request claims a cryptographic agent identity (Signature-Agent\n  header present) and you must check the claim before serving it.\n- You want signature verification independent of your CDN — or you are\n  not behind a CDN that implements Web Bot Auth at all.\n\nInputs (JSON body):\n- `signature` (required): the received Signature header value.\n- `signature_input` (required): the received Signature-Input header value.\n- `signature_agent` (required): the received Signature-Agent header\n  value (quoted https origin).\n- `authority` (required): the host the request was addressed to.\n- `method`, `path`, `scheme` (optional): only needed if the signature's\n  covered components include them.\n\nReturns:\n- `state`: one of\n  - `verified` — Ed25519 signature verifies against a key in the\n    agent's published directory.\n  - `invalid_signature` — key found, signature does not verify\n    (tampered or forged).\n  - `unknown_key` — directory reachable but contains no key with the\n    claimed thumbprint.\n  - `directory_unreachable` — the claimed key directory did not answer;\n    an honest degraded state, not evidence of forgery.\n  - `expired` — the signature's `expires` timestamp has passed.\n  - `malformed` — headers do not parse as a Web Bot Auth signature,\n    or the signature does not cover `@authority` and `signature-agent`,\n    lacks `created`/`expires`, has a validity window over 300 s, or\n    has a `created` more than 60 s in the future.\n  - `replayed` — the signature verifies but was already seen\n    (same keyid + nonce, or same signature) within its validity window.\n- `key_id`: the claimed RFC 7638 JWK thumbprint.\n- `directory_url`: the resolved well-known directory URL.\n- `params`: created/expires/alg/tag as sent.\n- `checks[]`: per-check {name, pass, detail} facts a PDP can gate on.\n\nCost:\n- Counts as one request against the daily rate limit.\n\nLatency:\n- Typical: <100ms when the agent's directory is KV-cached (1h TTL);\n  up to ~5s on first sight of a new directory.\n",
          "inputSchema": {
            "properties": {
              "authority": {
                "example": "example.com",
                "type": "string"
              },
              "method": {
                "type": "string"
              },
              "path": {
                "type": "string"
              },
              "scheme": {
                "type": "string"
              },
              "signature": {
                "example": "sig2=:jdq0SqOwHdyHr9+r5jw3iYZH6aNGKijYp/EstF4RQTQdi5N5YYKrD+mCT1HA1nZDsi6nJKuHxUi/5Syp3rLWBA==:",
                "type": "string"
              },
              "signature_agent": {
                "example": "\"https://signature-agent.test\"",
                "type": "string"
              },
              "signature_input": {
                "example": "sig2=(\"@authority\" \"signature-agent\");created=1735689600;keyid=\"poqkLGiymh_W0uP6PZFw-dvez3QJT5SolqXBCW38r0U\";alg=\"ed25519\";expires=1735689900;tag=\"web-bot-auth\"",
                "type": "string"
              }
            },
            "required": ["authority", "signature", "signature_agent", "signature_input"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f34121eac74e8b35ef882700f60032727698820b7fe5356d248f7044e5c9f854"
        },
        {
          "name": "verify_receipt",
          "description": "Tamper-detection verification for TunnelMind surveillance receipts. Submit the\nreceipt ID, the SHA-256 content hash, and the Ed25519 signature from the receipt\ndocument. The registry compares these against what was recorded at issuance time.\nReturns VALID if both match exactly, INVALID with a specific mismatch reason otherwise.\n\nUse this tool when:\n- You received a surveillance receipt document and want to verify it hasn't been altered.\n- You are programmatically checking receipt authenticity in an agent workflow.\n- You want to prove to a third party that a receipt is genuine.\n\nDo NOT use this tool when:\n- You only want to check existence — use `get_receipt` instead (no body required).\n\nInputs:\n- `receipt_id` (body, required): The receipt's ID field from the document.\n- `content_hash` (body, required): SHA-256 hex hash of the receipt JSON. Max 256 chars.\n- `signature` (body, required): Ed25519 signature from the receipt document. Max 512 chars.\n\nReturns:\n- `valid`: boolean. True only if both hash and signature match exactly.\n- `status`: `VALID` or `INVALID`.\n- `message`: human-readable explanation. On INVALID, specifies whether the hash\n  mismatched, the signature mismatched, or both.\n\nCost:\n- Free. No API key required.\n\nLatency:\n- Typical: <100ms, p99: <300ms.\n",
          "inputSchema": {
            "properties": {
              "content_hash": {
                "description": "SHA-256 hex hash of the receipt JSON content",
