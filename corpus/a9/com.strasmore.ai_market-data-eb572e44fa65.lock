      "serverInfo": {
        "name": "strasmore",
        "title": "Strasmore market data",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Strasmore is a US market-data warehouse queried with ClickHouse SQL: equity minute and daily bars, trades and NBBO quotes, options trades/quotes/greeks, dividends, splits, fundamentals, SEC filings, insider and 13F holdings, news, and macro series. Start with list_tables, then describe_table, then run_sql. Qualify tables as global_markets.<table>. This access needs no key; its limits are stated in every result, and get_plans lists what each plan adds. Send an API key as 'Authorization: Bearer <key>' on the connection to query at that key's plan.",
      "tools": [
        {
          "name": "describe_table",
          "title": "Describe a table",
          "description": "Columns of one table with their ClickHouse types, plus notes on columns whose meaning is not obvious from the name and known data caveats. Call before writing SQL against a table.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "table": {
                "description": "Table name, e.g. stocks_daily_aggs",
                "type": "string"
              }
            },
            "required": ["table"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c2fc686641c13b70f0c10e0c1db380094712b08ea91ce83230d42c2013c6d1c8"
        },
        {
          "name": "get_plans",
          "title": "Plans and limits",
          "description": "What this no-key access includes, what a free account and each paid plan add (history depth, datasets, row limits, price), and the link to start each one.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:29ce81b8b2e6596018ba825675d92c572cb4a07c9c2e76288bac1b8a250e228e"
        },
        {
          "name": "list_tables",
          "title": "List tables",
          "description": "List every table in the Strasmore US market-data warehouse (equities, options, corporate actions, fundamentals, SEC filings, news, macro) with a one-line description, the column its history window filters on, and whether this no-key access can read it. Call this first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c6dea31cb4c18f86c06b2a500539a7b705d0b4d2e7f1c96349855aaeb7896147"
        },
        {
          "name": "run_sql",
          "title": "Run SQL",
          "description": "Run one read-only ClickHouse SELECT against the global_markets database and get the rows back. No key needed. Limits on this access: 500 rows and 20 seconds per query, history from 2025-01-01, and some tick-level tables excluded — each result states which limit, if any, it ran into. Connected with an API key, it runs at that key's plan instead. Docs: https://ai.strasmore.com/llms.txt (tables and limits), https://api.strasmore.com/docs (API reference).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "sql": {
                "description": "A single SELECT statement.",
                "type": "string"
              }
            },
            "required": ["sql"],
            "type": "object"
          },
