        {
          "name": "forms_create",
          "title": "Create a form",
          "description": "Create a form or survey with its own public page at https://cncto.co/f/<slug>, which anyone can open and answer; share that link. Field types: short_text, long_text, email, phone (default_country), url, number (min, max, integer), choice and multi_choice (options; multi_choice also min_selections, max_selections), rating (scale 3 to 10, default 5; low_label, high_label), nps (0 to 10; low_label, high_label), date (include_time for a time too, range for a first and a last day, earliest and latest as \"2026-11-01\" or \"today\", \"today+7\", \"today-30\"; answers read 2026-11-03, 2026-11-03T09:30, 2026-11-03/2026-11-07), yes_no, consent (a checkbox; its label may hold one link written [text](https://...)), statement (text only, no answer). Every field takes type, label, help, required, an id (generated from the label when left out; answers are keyed by it) and show_if {\"field\": \"<an earlier field's id>\", \"equals\": <answer>} to show it only when that answer was given. Each response received costs $0.01, up to 10,000 a month per account. Costs $0.01 per call; nothing if it fails.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "close_at": {
                "description": "Stop taking responses at this time (ISO 8601, like 2026-12-31T23:59:00Z; UTC when no offset is given). Empty or null: never.",
                "maxLength": 40,
                "type": ["string", "null"]
              },
              "confirm_to_respondent": {
                "description": "Email each respondent their answers in the brand kit (form_confirmation wording), to the address they typed in the first email field. $0.002 each; paid accounts only; at most three a day to one address.",
                "type": "boolean"
              },
              "description": {
                "description": "Shown under the title.",
                "maxLength": 2000,
                "type": "string"
              },
              "fields": {
                "description": "The questions in order. When changing a form, this replaces the whole list.",
                "items": {
                  "properties": {
                    "default_country": {
                      "description": "phone: the country of numbers typed without a +, like \"US\".",
                      "maxLength": 2,
                      "minLength": 2,
                      "type": ["string", "null"]
                    },
                    "earliest": {
                      "description": "date: the first day that can be picked: \"2026-11-01\", \"today\", \"today+1\".",
                      "maxLength": 20,
                      "type": ["string", "null"]
                    },
                    "help": {
                      "description": "Smaller text under the question.",
                      "maxLength": 2000,
                      "type": "string"
                    },
                    "high_label": {
                      "description": "rating and nps: words under the top score.",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "id": {
                      "description": "Stable id; answers are keyed by it. Generated from the label when left out. Pass it back when you change the form, or a renamed field becomes a new one.",
                      "pattern": "^[a-z0-9_]{1,40}$",
                      "type": "string"
                    },
                    "include_time": {
                      "description": "date: a time too (answers like 2026-11-03T09:30).",
                      "type": "boolean"
                    },
                    "integer": {
                      "description": "number: whole numbers only.",
                      "type": "boolean"
                    },
                    "label": {
                      "description": "The question. A statement's label is the text it shows. A consent label may hold one link: \"I agree to the [terms](https://acme.com/terms)\".",
                      "maxLength": 1000,
                      "type": "string"
                    },
                    "latest": {
                      "description": "date: the last day that can be picked: \"2026-12-31\", \"today+60\", \"today\".",
                      "maxLength": 20,
                      "type": ["string", "null"]
                    },
                    "low_label": {
                      "description": "rating and nps: words under the lowest score.",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "max": {
                      "description": "number: the largest answer.",
                      "type": ["number", "null"]
                    },
                    "max_selections": {
                      "description": "multi_choice: the most options.",
                      "minimum": 1,
                      "type": ["integer", "null"]
                    },
                    "min": {
                      "description": "number: the smallest answer.",
                      "type": ["number", "null"]
                    },
                    "min_selections": {
