        {
          "name": "calculate_google_ads_budget_pacing",
          "title": "Google Ads 30.4x Budget Pacing Calculator",
          "description": "Calculate Google Ads 2x daily spending limits, 30.4x monthly charging limits, month-to-date pacing variance, remaining headroom, and mid-month budget edit ceilings using deterministic billing math.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asOfDay": {
                "description": "Current day of the month (1-31).",
                "maximum": 31,
                "minimum": 1,
                "type": "integer"
              },
              "change": {
                "additionalProperties": false,
                "description": "Optional mid-month daily budget edit to compute remaining-month charging ceilings.",
                "properties": {
                  "day": {
                    "description": "Day of month when the daily budget changes.",
                    "maximum": 31,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "newDailyBudget": {
                    "description": "New average daily budget effective on change.day.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  }
                },
                "required": ["day", "newDailyBudget"],
                "type": "object"
              },
              "currency": {
                "default": "USD",
                "description": "ISO currency code (default 'USD').",
                "type": "string"
              },
              "dailyBudget": {
                "description": "Current average daily budget amount.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "month": {
                "description": "Calendar month in YYYY-MM format (e.g. '2026-11').",
                "pattern": "^\\d{4}-\\d{2}$",
                "type": "string"
              },
              "monthlyPlan": {
                "description": "Optional target monthly spend plan to compute the daily budget needed to land on target.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "spentToDate": {
                "description": "Cumulative spend recorded month-to-date.",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["asOfDay", "dailyBudget", "month", "spentToDate"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Google Ads 30.4x Budget Pacing Calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f1c632eb980c42a73a446f766926168d1107d3cc414150de4b6ff1759e79541d"
        },
        {
          "name": "check_google_ads_negative_collisions",
          "title": "Google Ads Negative Keyword Collision Checker",
          "description": "Test proposed [exact], \"phrase\", and broad Google Ads negative keywords against active keywords and search terms. Flags collisions blocking active keywords or converting queries and catches singular/plural close-variant misses.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "keywords": {
                "description": "Active positive keywords in Google Ads notation (e.g. '[plumbing repair]', '\"emergency plumber\"', 'plumber near me') or structured objects.",
                "items": {
                  "oneOf": [
                    {
                      "type": "string"
                    },
                    {
                      "properties": {
                        "adGroup": {
                          "type": "string"
                        },
                        "campaign": {
                          "type": "string"
                        },
                        "matchType": {
                          "enum": ["EXACT", "PHRASE", "BROAD"],
                          "type": "string"
                        },
                        "text": {
                          "type": "string"
                        }
                      },
                      "required": ["matchType", "text"],
                      "type": "object"
                    }
                  ]
                },
                "type": "array"
              },
              "negatives": {
                "description": "Candidate negative keywords in Google Ads notation (e.g. '[free]', '\"jobs\"', 'diy') or structured objects.",
                "items": {
                  "oneOf": [
                    {
                      "type": "string"
                    },
                    {
                      "properties": {
                        "adGroup": {
                          "type": "string"
                        },
                        "campaign": {
                          "type": "string"
                        },
                        "level": {
                          "enum": ["ACCOUNT", "CAMPAIGN", "AD_GROUP", "LIST"],
                          "type": "string"
                        },
                        "listName": {
                          "type": "string"
                        },
                        "matchType": {
                          "enum": ["EXACT", "PHRASE", "BROAD"],
                          "type": "string"
                        },
                        "text": {
                          "type": "string"
                        }
                      },
                      "required": ["matchType", "text"],
                      "type": "object"
                    }
                  ]
                },
                "minItems": 1,
                "type": "array"
              },
              "scope": {
                "default": "ALL",
                "description": "Whether to evaluate collisions across all campaigns ('ALL') or strictly matching campaign names ('SAME_CAMPAIGN').",
                "enum": ["SAME_CAMPAIGN", "ALL"],
                "type": "string"
              },
              "searchTerms": {
                "description": "Optional search term performance rows to calculate conversions and spend at risk of being blocked.",
                "items": {
                  "properties": {
                    "adGroup": {
                      "type": "string"
                    },
                    "campaign": {
                      "type": "string"
                    },
                    "clicks": {
                      "minimum": 0,
                      "type": "number"
                    },
                    "conversions": {
                      "minimum": 0,
                      "type": "number"
                    },
                    "cost": {
                      "minimum": 0,
                      "type": "number"
                    },
                    "searchTerm": {
                      "type": "string"
                    }
                  },
                  "required": ["searchTerm"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["negatives"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Google Ads Negative Keyword Collision Checker"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6f325150772a0ab986600a1096dc051ad2c9a290534b6d47946632945902088c"
        },
        {
          "name": "debug_ga4_vs_google_ads_conversions",
          "title": "GA4 vs Google Ads Conversion Discrepancy Debugger",
          "description": "Diagnose why GA4 key events and Google Ads conversions disagree across click-date vs. event-date reporting, attribution models, counting modes, lookback windows, consent modeling, auto-tagging, and time zones.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ads": {
                "properties": {
                  "attribution": {
                    "default": "DATA_DRIVEN",
                    "enum": ["DATA_DRIVEN", "LAST_CLICK"],
                    "type": "string"
                  },
                  "clickWindowDays": {
                    "default": 30,
                    "maximum": 90,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "conversions": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "count": {
                    "default": "ONE",
                    "enum": ["ONE", "EVERY"],
                    "type": "string"
                  },
                  "source": {
                    "default": "ADS_TAG",
                    "enum": ["ADS_TAG", "GA4_IMPORT"],
                    "type": "string"
                  },
                  "timeZone": {
                    "default": "America/New_York",
                    "type": "string"
                  }
                },
                "required": ["conversions"],
                "type": "object"
              },
              "ga4": {
                "properties": {
                  "attribution": {
                    "default": "DATA_DRIVEN",
                    "enum": ["DATA_DRIVEN", "PAID_AND_ORGANIC_LAST_CLICK", "GOOGLE_PAID_LAST_CLICK"],
                    "type": "string"
                  },
                  "count": {
                    "default": "ONCE_PER_EVENT",
                    "enum": ["ONCE_PER_EVENT", "ONCE_PER_SESSION"],
                    "type": "string"
                  },
                  "keyEvents": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "lookbackDays": {
                    "default": 90,
                    "enum": [30, 60, 90],
                    "type": "integer"
                  },
                  "scope": {
                    "default": "GOOGLE_CPC",
                    "enum": ["GOOGLE_CPC", "GOOGLE_ADS_CHANNEL", "ALL_TRAFFIC"],
                    "type": "string"
                  },
                  "timeZone": {
                    "default": "America/New_York",
                    "type": "string"
                  }
                },
                "required": ["keyEvents"],
                "type": "object"
              },
              "range": {
                "properties": {
                  "end": {
                    "description": "End date YYYY-MM-DD.",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "start": {
                    "description": "Start date YYYY-MM-DD.",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  }
                },
                "required": ["end", "start"],
                "type": "object"
              },
              "site": {
                "properties": {
                  "autoTagging": {
                    "default": true,
                    "type": "boolean"
                  },
                  "consentMode": {
                    "default": "NONE",
                    "enum": ["NONE", "BASIC", "ADVANCED"],
                    "type": "string"
                  },
                  "consentRate": {
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "medianLagDays": {
                    "default": 3,
                    "maximum": 45,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              }
            },
            "required": ["ads", "ga4", "range", "site"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "GA4 vs Google Ads Conversion Discrepancy Debugger"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b0291554fb927b25a823ca06569d43fbbcd70daf89b099e35a32f46a62c817c0"
        },
