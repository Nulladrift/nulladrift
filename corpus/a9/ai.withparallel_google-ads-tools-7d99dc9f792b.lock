      "instructions": "Read-only, zero-OAuth deterministic Google Ads analysis tools, 2026 platform mechanics reference, and read-only MIT Google Ads Script generator from Parallel AI (withparallel.ai). Use these tools for exact 30.4x monthly budget pacing math, Search Terms CSV waste and N-gram audits, negative keyword collision testing, GA4 vs. Google Ads conversion reconciliation, Performance Max placement/search waste estimation, Google Ads API v26 GAQL validation, curated 2026 Google Ads platform changes & mechanics, and copy-paste read-only MIT Google Ads Scripts. None of these tools connect to, read from, or modify live Google Ads accounts.",
      "tools": [
        {
          "name": "audit_google_ads_search_terms_csv",
          "title": "Google Ads Search Terms CSV Waste & N-Gram Auditor",
          "description": "Deterministically audit a pasted Google Ads Search Terms CSV/TSV export (or structured rows) for zero-conversion wasted spend, high-CPA outliers, brand vs. non-brand mix, top converting terms, and 1-gram/2-gram negative keyword candidates—zero OAuth required.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brandTerms": {
                "description": "Optional list of brand names/tokens to compute brand vs. non-brand spend and CPA split.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "csv": {
                "description": "Raw Google Ads Search Terms report CSV or TSV text (headers such as Search term, Campaign, Ad group, Clicks, Cost, Conversions).",
                "type": "string"
              },
              "currency": {
                "default": "USD",
                "type": "string"
              },
              "minWasteClicks": {
                "default": 1,
                "description": "Minimum clicks to surface in top wasted terms.",
                "type": "integer"
              },
              "minWasteSpend": {
                "default": 0,
                "description": "Minimum zero-conversion spend to surface in top wasted terms.",
                "type": "number"
              },
              "rows": {
                "description": "Optional pre-parsed search term rows instead of raw CSV text.",
                "items": {
                  "properties": {
                    "adGroup": {
                      "type": "string"
                    },
                    "campaign": {
                      "type": "string"
                    },
                    "clicks": {
                      "type": "number"
                    },
                    "conversions": {
                      "type": "number"
                    },
                    "cost": {
                      "type": "number"
                    },
                    "searchTerm": {
                      "type": "string"
                    }
                  },
                  "required": ["searchTerm"],
                  "type": "object"
                },
                "type": "array"
              },
              "targetCpa": {
                "description": "Optional target CPA/CPL threshold used to flag high-CPA outliers (>1.5x target).",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Google Ads Search Terms CSV Waste & N-Gram Auditor"
          },
          "behavior": {
