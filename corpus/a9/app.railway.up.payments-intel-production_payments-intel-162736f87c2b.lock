{
  "lockfileVersion": 2,
  "subjects": {
    "app.railway.up.payments-intel-production/payments-intel": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://payments-intel-production.up.railway.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "payments-intel",
        "version": "0.1.2"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Cited data on stablecoin rails, on/off-ramps, corridors and payment providers. Free tools: search_providers, get_examples, check_address_format, check_rail_calendar, check_regulator. Paid per call via x402/MPP (you pay): get_provider, stablecoin_rails, find_corridor, get_chain, get_token, get_base_pack. Paid routes also accept POST. Every fact carries source URL, date and confidence. Information, not financial advice.",
      "tools": [
        {
          "name": "check_address_format",
          "description": "Is this address well formed for this chain, and what is its EIP-55 checksummed form? Free: deterministic address format check for EVM chains (EIP-55 checksum: valid, checksummed form, whether the input checksum was correct, all lowercase or all uppercase) and Solana (base58, 32 bytes). No external calls. 60 calls/min per client. Format only; says nothing about who controls an address.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Address to check",
                "type": "string"
              },
              "chain": {
                "description": "Chain id or name: an EVM chain (e.g. base, ethereum, eip155:8453) or solana",
                "type": "string"
              }
            },
            "required": ["address", "chain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:43f680e864e35cf3568918cd9f9e1fc84dc8a28ba4881edca05837824fbe6a04"
        },
        {
          "name": "check_rail_calendar",
          "description": "Is this payment rail closed on this date, or on which days is it closed this year? Free: rule-based closing days for TARGET (ECB T2), Ireland and UK bank holiday calendars (England and Wales, Scotland, Northern Ireland). Give date=YYYY-MM-DD for closed true/false with reason, or year=YYYY for the list of closures. TARGET also closes on weekends; IE and UK calendars list holidays only. IE weekend substitution days are not modelled. 60 calls/min per client.",
          "inputSchema": {
            "properties": {
              "calendar": {
                "description": "One of target, ie, uk-ew, uk-sco, uk-ni",
                "type": "string"
              },
              "date": {
                "description": "Date YYYY-MM-DD (give date or year)",
                "type": "string"
              },
              "year": {
                "description": "Year YYYY, returns all closures (give year or date)",
                "type": "string"
              }
            },
            "required": ["calendar"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9a8f26aec9ddad18bd64c8a1187139fca33e20d4089b792ad6dddba07f57e00c"
        },
        {
          "name": "check_regulator",
          "description": "Is this firm on the ESMA MiCA register (CASP, e-money token issuer, white paper, or non-compliant warning list)? Free: look up a firm in the ESMA interim MiCA register by name (exact or fuzzy) or LEI, optionally narrowed by country. Returns match_quality, an ambiguous flag, candidate records with status, competent authority and source URL, plus ESMA attribution and register links. Absence from the register is not clearance. 60 calls/min per client.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Optional 2-letter ISO country / home member state filter for name matches",
                "type": "string"
              },
              "name": {
                "description": "Firm name (give name or ref)",
                "type": "string"
              },
              "ref": {
                "description": "LEI (give name or ref)",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f1242d46c39fb8c575cf900c46ba2e9dc39b3cfbaaf110d2942d4a795724415a"
        },
        {
          "name": "find_corridor",
          "description": "Who can move money from this currency or stablecoin to that one, in this country, over which rails? Paid ($0.03 USDC): Money-movement routes from one currency or stablecoin to another: corridors providers publish (rails, speed, fee notes, cited), plus on/off-ramp routes inferred from ramp coverage, labelled as inferred. This server holds no wallet and never pays: it returns the HTTP 402 payment requirements (x402 on Base, MPP on Tempo) and the URL https://payments-intel-production.up.railway.app/v1/corridor. Pay with your own x402/MPP client and retry that URL. Paid: $0.03 per call (x402/MPP).",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Destination ISO alpha-2 country, e.g. MX",
                "type": "string"
              },
              "from": {
                "description": "Currency or stablecoin sent, e.g. USDC or USD",
                "type": "string"
              },
              "to": {
                "description": "Currency or stablecoin received, e.g. MXN",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a5155792f852fffeeff7188b5916cb59398b9eb093600211eb7f7ffd0e2ba20f"
        },
        {
          "name": "get_base_pack",
          "description": "What do I need to know to move USDC on Base: chain facts, USDC token facts and which providers on-ramp or off-ramp there? Paid ($0.01 USDC): One call, three cited datasets for Base: the /v1/chain record, the /v1/token record for USDC on Base, and every dataset provider that lists Base and on-ramp and/or off-ramp (id, name, onramp/offramp flags, source_url, retrieved_at, quote, confidence). Includes as_of and a sources list. No parameters. This server holds no wallet and never pays: it returns the HTTP 402 payment requirements (x402 on Base, MPP on Tempo) and the URL https://payments-intel-production.up.railway.app/v1/pack/base. Pay with your own x402/MPP client and retry that URL. Paid: $0.01 per call (x402/MPP).",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f2e9bf3312450b16ef225f2d7c266de9b389de6d0e61fcb911e41bd1366b5f3a"
        },
        {
          "name": "get_chain",
          "description": "What are the basic facts of this chain (CAIP-2 id, gas token, explorer, x402/MPP settlement, stablecoins)? Paid ($0.001 USDC): Cited chain facts from a prepared dataset: CAIP-2 chain id, gas token, finality class, block explorer, whether x402 and MPP settle there, and stablecoins. Fields not established from a source are the string \"unknown\". Unknown chains and malformed input return 404/400 and are never charged. This server holds no wallet and never pays: it returns the HTTP 402 payment requirements (x402 on Base, MPP on Tempo) and the URL https://payments-intel-production.up.railway.app/v1/chain. Pay with your own x402/MPP client and retry that URL. Paid: $0.001 per call (x402/MPP).",
          "inputSchema": {
            "properties": {
              "chain": {
                "description": "Chain slug, name or CAIP-2 id, e.g. base, solana, eip155:8453",
                "type": "string"
              }
            },
            "required": ["chain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8a0628c299bbb6807311b95f64ecae5996c4e7b55dd27c801b491346e57c297d"
        },
        {
          "name": "get_examples",
          "description": "What do the paid endpoints return, and what do they cost? Free: prices and paths of every paid endpoint, plus a full example response for GET /v1/provider taken verbatim from a real record, labelled as an example with its last-verified date. Use it to see the shape and depth of paid data before paying.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a503f7ab5e0a3131ccaa0a1c27f612618db1a3a9a7447c03214220f5126d524b"
        },
        {
          "name": "get_provider",
          "description": "What exactly does this provider support, where is it licensed and what does it charge? Paid ($0.01 USDC): Full cited record for one provider: stablecoin rails, corridors, licences, published fees, coverage, developer and agent-payment support. Every fact has source URL, retrieval date, quote and confidence. This server holds no wallet and never pays: it returns the HTTP 402 payment requirements (x402 on Base, MPP on Tempo) and the URL https://payments-intel-production.up.railway.app/v1/provider. Pay with your own x402/MPP client and retry that URL. Paid: $0.01 per call (x402/MPP).",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Provider id from search_providers, e.g. circle",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bdc9a6d72af661b1b0a448c0ba8cd6e6688a0a4b583f2041784cfaf094a7d11d"
        },
        {
          "name": "get_token",
          "description": "What are the symbol, name, decimals, contract address and issuer of this stablecoin on this chain? Paid ($0.001 USDC): Cited stablecoin token facts from a prepared dataset (USDC, EURC, USDT, PYUSD, DAI on the chains /v1/chain covers, where a permissively licensed source lists them): symbol, name, decimals, contract address, chain, issuer, each with a source citation and license. Fields not established from a source are the string \"unknown\". Malformed input and tokens not in the dataset return 400/404 and are never charged. This server holds no wallet and never pays: it returns the HTTP 402 payment requirements (x402 on Base, MPP on Tempo) and the URL https://payments-intel-production.up.railway.app/v1/token. Pay with your own x402/MPP client and retry that URL. Paid: $0.001 per call (x402/MPP).",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Token contract / mint address (give address or symbol)",
                "type": "string"
              },
              "chain": {
                "description": "Chain slug, name or CAIP-2 id, e.g. base, solana, eip155:8453",
                "type": "string"
              },
              "symbol": {
                "description": "Stablecoin ticker, e.g. USDC (give symbol or address)",
                "type": "string"
              }
            },
            "required": ["chain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b06357cb7287656330c72fbcc0a2345d66435df7c83486bd2750cfc6d3586e91"
        },
        {
          "name": "search_providers",
          "description": "Which payment or stablecoin providers support this asset, chain, country or service? Free: search payment and stablecoin providers by category, asset, chain, ramp country or service. Returns compact cards (no citations); use get_provider for the full cited record. 50 calls/day per client.",
          "inputSchema": {
            "properties": {
              "asset": {
                "description": "Stablecoin ticker, e.g. USDC, EURC, USDT, PYUSD",
                "type": "string"
              },
              "category": {
                "description": "card_acquiring, orchestration, merchant_of_record, payouts, fx, baas_issuing, open_banking, stablecoin_issuer, stablecoin_infra, onoff_ramp, custody_wallets, agentic_payments",
                "type": "string"
              },
              "chain": {
                "description": "Chain, e.g. base, ethereum, solana, tron, polygon",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 country for on/off-ramp coverage, e.g. MX",
                "type": "string"
              },
              "q": {
                "description": "Name search, e.g. 'bridge'",
                "type": "string"
              },
              "service": {
                "description": "issuance, mint_redeem, on_ramp, off_ramp, payouts, acceptance, settlement, custody, wallets, orchestration, fx, cards",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fc6b864ee50c90d11fe7f8d7928a71918fc8f59298ef6d3498536db085bf8305"
        },
        {
          "name": "stablecoin_rails",
          "description": "Who can on-ramp, off-ramp, issue or settle this stablecoin, on which chain, in which country? Paid ($0.01 USDC): Stablecoin rails by asset, chain, country and service, with the cited stablecoin block for each matching provider (assets, chains, ramp countries, fiat rails, custody model). Country matches say whether the country is listed or only covered by a 'global' claim. This server holds no wallet and never pays: it returns the HTTP 402 payment requirements (x402 on Base, MPP on Tempo) and the URL https://payments-intel-production.up.railway.app/v1/stablecoin-rails. Pay with your own x402/MPP client and retry that URL. Paid: $0.01 per call (x402/MPP).",
          "inputSchema": {
            "properties": {
              "asset": {
                "description": "Stablecoin ticker, e.g. USDC, EURC, USDT, PYUSD",
                "type": "string"
              },
              "chain": {
                "description": "Chain, e.g. base, ethereum, solana, tron, polygon",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 country for on/off-ramp coverage, e.g. MX",
                "type": "string"
              },
              "service": {
                "description": "issuance, mint_redeem, on_ramp, off_ramp, payouts, acceptance, settlement, custody, wallets, orchestration, fx, cards",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b5fc052b390f8262534d6a1a555d6dd9c3d83777f058de9b2cf1354ed839a05b"
        }
      ],
