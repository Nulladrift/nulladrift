{
  "lockfileVersion": 2,
  "subjects": {
    "chat.avva/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://avva.chat/mcp-catalog"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "avva-catalog",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "The avva expert catalog: professionals publish their real past decisions as models your agent can consult before it answers. This server is discovery only — search the catalog, fetch one expert, then connect that expert’s own MCP URL (returned by fetch) to actually consult them. Coverage labels describe how much of an expert’s material their published cases and rules rest on, never predictive accuracy.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch one expert with their connector URL",
          "description": "Full catalog card for one expert by id (their slug), including the MCP connector URL your agent connects to consult them. Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "An id returned by search.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "additionalProperties": false,
                "properties": {
                  "connector_url": {
                    "type": "string"
                  },
                  "coverage": {
                    "type": "string"
                  },
                  "kind": {
                    "enum": ["expert", "house"],
                    "type": "string"
                  },
                  "profile_url": {
                    "type": "string"
                  }
                },
                "required": ["connector_url", "coverage", "kind", "profile_url"],
                "type": "object"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a7c79d5cff8b0c1ba47007b2617460fc87a2cdb06ff7d5e235899cfd6e92a5ad"
        },
        {
          "name": "search",
          "title": "Search the avva expert catalog",
          "description": "Find published experts by domain, decision types, or wording. Returns result ids for fetch. Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "What kind of judgment you are looking for.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a63547bc1e7c4b70c2f2845dda1be1090496e70e801b4670c671071399a88b67"
        }
      ],
      "digest": "sha256:947bcc2f3c489c963f33edfad8e3aad43cc2997d3cb21adb9f579ac500aabe85"
    }
  }
}
