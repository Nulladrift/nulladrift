        {
          "name": "scan_bill",
          "title": "Check a business electricity bill",
          "description": "Use this when a small business wants its electricity bill checked, a cheaper rate plan, the cost of a coming rate change, or its peak kW explained. A partial call is fine: always call scan_bill first with whatever numbers or place the user gave (e.g. bill: { total: 640 }, address: 'Phoenix, AZ' without kWh, or only kWh without an address, or a short Green Button CSV snippet, or a Texas retail bill), and the tool returns need_input with `missing` (plus `peaks` when interval rows are sent) or no_rates for Texas retail. Pass `bill` (kwh, kw, total, rate, utility, dates, charges; omit what is not stated, never guess) or `bill_text`, plus `address` (city, street, or ZIP), optional `usage_csv` and `current_rate`. Free; nothing stored.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "address": "1 Sample Way, Atlanta, GA 30303",
                "bill": {
                  "kw": 9,
                  "kwh": 2150,
                  "rate": "GS-17",
                  "total": 471.7,
                  "utility": "Georgia Power"
                }
              }
            ],
            "properties": {
              "address": {
                "description": "Service address, city (such as 'Phoenix, AZ'), or ZIP code; pass whatever location the user named, even just a city",
                "maxLength": 300,
                "type": "string"
              },
              "bill": {
                "description": "Bill numbers already read or typed (even partial, such as only total or only kwh)",
                "properties": {
                  "charges": {
                    "description": "The charge lines of this period, without payments or past balances",
                    "items": {
                      "properties": {
                        "amount": {
                          "description": "Dollars on that line; a credit is negative",
                          "type": "number"
                        },
                        "label": {
                          "description": "The line as printed, for example \"Customer charge\" or \"Fuel charge\"",
                          "type": "string"
                        }
                      },
                      "required": ["amount", "label"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "days": {
                    "description": "Days in the billing period",
                    "maximum": 62,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "kw": {
                    "description": "Highest or billed demand in kW, when the bill shows one",
                    "minimum": 0,
                    "type": "number"
                  },
                  "kwh": {
                    "description": "Total kWh used in the billing period",
                    "minimum": 0,
                    "type": "number"
                  },
                  "off_peak_kwh": {
                    "description": "Off-peak kWh, when the bill splits use by time of day",
                    "minimum": 0,
                    "type": "number"
                  },
                  "on_peak_kwh": {
                    "description": "On-peak kWh, when the bill splits use by time of day",
                    "minimum": 0,
                    "type": "number"
                  },
                  "period_end": {
                    "description": "Last day of the billing period, YYYY-MM-DD",
                    "type": "string"
                  },
                  "period_start": {
                    "description": "First day of the billing period, YYYY-MM-DD",
                    "type": "string"
                  },
                  "rate": {
                    "description": "Rate schedule or rate code as printed, for example \"GSND\" or \"A-10\"",
                    "type": "string"
                  },
                  "service_address": {
                    "description": "Service address: street, city, state and ZIP",
                    "type": "string"
                  },
                  "service_zip": {
                    "description": "Service ZIP code",
                    "type": "string"
                  },
                  "total": {
                    "description": "Current electric charges for this period, taxes included, without past balances",
                    "type": "number"
                  },
                  "utility": {
                    "description": "Utility name as printed on the bill",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "bill_text": {
                "description": "The text of the bill, pasted or from the PDF text layer",
                "maxLength": 60000,
                "type": "string"
              },
              "current_rate": {
                "description": "The rate plan the business is on, when the bill does not name it",
                "maxLength": 200,
                "type": "string"
              },
              "usage_csv": {
                "description": "A Green Button or utility interval usage CSV (15-minute, 30-minute or hourly)",
                "maxLength": 8000000,
                "type": "string"
              }
            },
            "type": "object"
