{
  "lockfileVersion": 2,
  "subjects": {
    "ai.pickskill/pickskill": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pickskill.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "pickskill",
        "title": "PickSkill",
        "version": "1.0.0",
        "websiteUrl": "https://pickskill.ai/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PickSkill tools for stock research: technical signals (MACD, MA, RSI, KDJ, Bollinger, ADX, volume, money flow) for US, Hong Kong and China A-share stocks, screening by those signals, your saved PickSkill portfolios with per-holding signals, and earnings highlights. Every result is for research only, not investment advice. Each tool call counts as one conversation against your PickSkill plan.",
      "tools": [
        {
          "name": "get_earnings_highlights",
          "title": "Earnings highlights",
          "description": "A company's latest earnings release (report date, actual vs. estimated EPS, surprise) plus its key financial ratios (valuation, margins, ROE, leverage, growth). Best for US-listed stocks. Counts as one conversation against your PickSkill plan.",
          "inputSchema": {
            "properties": {
              "ticker": {
                "description": "Yahoo Finance ticker: US 'NVDA', 'BRK-B'; Hong Kong '0700.HK'; Shanghai '600519.SS'; Shenzhen '300750.SZ'.",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c86481dd6f1327c3f473ce79cf846a7884ebf13c2c1a373f7a7bb849813e5f5c"
        },
        {
          "name": "get_my_portfolio",
          "title": "My portfolio health check",
          "description": "Your saved PickSkill portfolios (pickskill.ai/portfolios): holdings and weights, plus each holding's latest price change and its 8 indicator signals, with bullish/bearish counts per holding for a quick health check. Counts as one conversation against your PickSkill plan.",
          "inputSchema": {
            "properties": {
              "include_signals": {
                "default": true,
                "description": "Include per-holding price change and indicator signals.",
                "type": "boolean"
              },
              "portfolio": {
                "description": "Portfolio name or id. Omit to read all portfolios.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b193fa4cd438045003f3ef405ebc294888763d9f07392f5632b3f042f4b1ab0d"
        },
        {
          "name": "get_stock_signals",
          "title": "Stock technical signals",
          "description": "Technical signals for up to 10 US, Hong Kong or China A-share stocks: latest close, 1-day and 5-day change, and 8 indicator dimensions (MACD, MA, RSI, KDJ, Bollinger, ADX, volume, money flow), each bullish / bearish / neutral with a 5-day trail and the latest values (e.g. RSI, KDJ K/D/J, MACD DIF/DEA). Counts as one conversation against your PickSkill plan.",
          "inputSchema": {
            "properties": {
              "tickers": {
                "description": "Yahoo Finance ticker: US 'NVDA', 'BRK-B'; Hong Kong '0700.HK'; Shanghai '600519.SS'; Shenzhen '300750.SZ'.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["tickers"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3e128f0691a38a978e756a0a8e39a41a22964b741e97515d52542b4b9948045a"
        },
        {
          "name": "screen_stocks",
          "title": "Screen stocks by technical signals",
          "description": "Screen PickSkill's US / Hong Kong / China A-share stock universe (the stocks with pickskill.ai/stocks pages) by technical conditions, ANDed: a dimension's reading held for N days (type 'signal'), an indicator value such as rsi.rsi < 35 or kdj.j (type 'value'), or a MACD / MA5-MA20 golden or death cross or a signal flip within N days (type 'event'). Returns each match with evidence for every condition. RSI/KDJ 'bullish' means oversold. Counts as one conversation against your PickSkill plan.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "conditions": {
                "description": "All conditions must match (AND).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "days": {
                      "description": "For 'signal': the reading must hold on each of the last N trading days (default 1 = today).",
                      "maximum": 5,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "dimension": {
                      "description": "For 'signal' and for the 'turned_bullish' / 'turned_bearish' events.",
                      "enum": ["macd", "ma", "rsi", "kdj", "boll", "adx", "volume", "flow"],
                      "type": "string"
                    },
                    "event": {
                      "description": "For 'event'.",
                      "enum": ["macd_golden_cross", "macd_death_cross", "ma5_ma20_golden_cross", "ma5_ma20_death_cross", "turned_bullish", "turned_bearish"],
                      "type": "string"
                    },
                    "field": {
                      "description": "For 'value': the indicator value to compare.",
                      "enum": ["price.changePct", "price.fiveDayChangePct", "rsi.rsi", "kdj.k", "kdj.d", "kdj.j", "macd.dif", "macd.dea", "macd.hist", "ma.ma5", "ma.ma20", "ma.ma60", "boll.bandwidth", "adx.adx", "adx.plusDi", "adx.minusDi", "volume.volRatio", "flow.cum5", "flow.cum20"],
                      "type": "string"
                    },
                    "is": {
                      "description": "For 'signal': the required reading.",
                      "enum": ["bullish", "bearish", "neutral"],
                      "type": "string"
                    },
                    "op": {
                      "description": "For 'value'.",
                      "enum": ["<", "<=", ">", ">="],
                      "type": "string"
                    },
                    "type": {
                      "description": "'signal' = a dimension's bullish/bearish/neutral reading; 'value' = compare a numeric indicator value; 'event' = a cross or signal flip within the last N trading days.",
                      "enum": ["signal", "value", "event"],
                      "type": "string"
                    },
                    "value": {
                      "description": "For 'value'.",
                      "type": "number"
                    },
                    "within_days": {
                      "description": "For 'event': the event happened within the last N trading days (default 3).",
                      "maximum": 5,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["type"],
                  "type": "object"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              },
              "limit": {
                "description": "Maximum matches to return (default 15).",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "markets": {
                "description": "Markets to screen: 'us' US stocks, 'hk' Hong Kong, 'cn' China A-shares (Shanghai/Shenzhen). Omit for all.",
                "items": {
                  "enum": ["us", "hk", "cn"],
                  "type": "string"
                },
                "type": "array"
              },
              "sort_by": {
                "description": "Ordering of matches (default bullish_count, highest first; rsi sorts lowest first).",
                "enum": ["bullish_count", "change_pct", "five_day_change_pct", "rsi"],
                "type": "string"
              }
            },
            "required": ["conditions"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f4d0c8d78b7a7cd33a8d40d3a182c77357ee478898586278ae6645bea70a4636"
        }
      ],
      "digest": "sha256:72b06b4f0be7f0a94e645c27dd3f45b82fb75fd694e71d662cee0250fcda845b"
    }
  }
}
