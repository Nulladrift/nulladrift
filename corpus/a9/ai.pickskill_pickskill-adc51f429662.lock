{
  "lockfileVersion": 2,
  "subjects": {
    "ai.pickskill/pickskill": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pickskill.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "pickskill",
        "title": "PickSkill",
        "version": "1.0.0",
        "websiteUrl": "https://pickskill.ai/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PickSkill tools for stock research: technical signals (MACD, MA, RSI, KDJ, Bollinger, ADX, volume, money flow) for US, Hong Kong and China A-share stocks, screening by those signals, your saved PickSkill portfolios with per-holding signals, and earnings highlights. Every result is for research only, not investment advice. Each successful tool call spends PickSkill API credits (1 for signals or portfolios, 2 for earnings, 3 for a screen); failed calls are refunded. Credits and keys: https://pickskill.ai/account/api",
      "tools": [
        {
          "name": "get_earnings_highlights",
          "title": "Earnings highlights",
          "description": "A company's latest earnings release (report date, actual vs. estimated EPS, surprise) plus its key financial ratios (valuation, margins, ROE, leverage, growth). Best for US-listed stocks. Costs 2 PickSkill API credits; failed calls are refunded.",
          "inputSchema": {
            "properties": {
              "ticker": {
                "description": "Yahoo Finance ticker: US 'NVDA', 'BRK-B'; Hong Kong '0700.HK'; Shanghai '600519.SS'; Shenzhen '300750.SZ'.",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a4807cc3e78b440e793af94b5a2ef1a5b096f7926e3ccd6c7493a5af5c7ca910"
        },
        {
          "name": "get_my_portfolio",
          "title": "My portfolio health check",
          "description": "Your saved PickSkill portfolios (pickskill.ai/portfolios): holdings and weights, plus each holding's latest price change and its 8 indicator signals, with bullish/bearish counts per holding for a quick health check. Costs 1 PickSkill API credit; failed calls are refunded.",
          "inputSchema": {
            "properties": {
              "include_signals": {
                "default": true,
                "description": "Include per-holding price change and indicator signals.",
                "type": "boolean"
              },
              "portfolio": {
                "description": "Portfolio name or id. Omit to read all portfolios.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fd7fd8442f85f3c07ea9d36935289b8c8ee3aa69f2dc986a52c2315493e1ef9b"
        },
        {
          "name": "get_stock_signals",
          "title": "Stock technical signals",
          "description": "Technical signals for up to 10 US, Hong Kong or China A-share stocks: latest close, 1-day and 5-day change, and 8 indicator dimensions (MACD, MA, RSI, KDJ, Bollinger, ADX, volume, money flow), each bullish / bearish / neutral with a 5-day trail and the latest values (e.g. RSI, KDJ K/D/J, MACD DIF/DEA). Costs 1 PickSkill API credit; failed calls are refunded.",
          "inputSchema": {
            "properties": {
              "tickers": {
                "description": "Yahoo Finance ticker: US 'NVDA', 'BRK-B'; Hong Kong '0700.HK'; Shanghai '600519.SS'; Shenzhen '300750.SZ'.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["tickers"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bb6a5a660c0bf840a833836fd010372928b1ca99e75a41bbee41d5d0dae8eb26"
        },
        {
          "name": "screen_stocks",
          "title": "Screen stocks by technical signals",
          "description": "Screen about 950 US / Hong Kong / China A-share stocks (the members of the S&P 500, Nasdaq-100, Hang Seng Index and CSI 300, plus any stock with a pickskill.ai/stocks page; optionally restricted to one or more of those indexes) by technical conditions, ANDed: a dimension's reading held for N days (type 'signal'), an indicator value such as rsi.rsi < 35 or kdj.j (type 'value'), or a MACD / MA5-MA20 golden or death cross or a signal flip within N days (type 'event'). Returns each match with evidence for every condition. RSI/KDJ 'bullish' means oversold. Requires a paid PickSkill plan (not available on Free). Costs 3 PickSkill API credits; failed calls are refunded.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "conditions": {
                "description": "All conditions must match (AND).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "days": {
                      "description": "For 'signal': the reading must hold on each of the last N trading days (default 1 = today).",
                      "maximum": 5,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "dimension": {
                      "description": "For 'signal' and for the 'turned_bullish' / 'turned_bearish' events.",
                      "enum": ["macd", "ma", "rsi", "kdj", "boll", "adx", "volume", "flow"],
                      "type": "string"
                    },
                    "event": {
                      "description": "For 'event'.",
                      "enum": ["macd_golden_cross", "macd_death_cross", "ma5_ma20_golden_cross", "ma5_ma20_death_cross", "turned_bullish", "turned_bearish"],
                      "type": "string"
                    },
                    "field": {
                      "description": "For 'value': the indicator value to compare.",
                      "enum": ["price.changePct", "price.fiveDayChangePct", "rsi.rsi", "kdj.k", "kdj.d", "kdj.j", "macd.dif", "macd.dea", "macd.hist", "ma.ma5", "ma.ma20", "ma.ma60", "boll.bandwidth", "adx.adx", "adx.plusDi", "adx.minusDi", "volume.volRatio", "flow.cum5", "flow.cum20"],
                      "type": "string"
                    },
                    "is": {
                      "description": "For 'signal': the required reading.",
                      "enum": ["bullish", "bearish", "neutral"],
                      "type": "string"
                    },
                    "op": {
                      "description": "For 'value'.",
                      "enum": ["<", "<=", ">", ">="],
                      "type": "string"
                    },
                    "type": {
                      "description": "'signal' = a dimension's bullish/bearish/neutral reading; 'value' = compare a numeric indicator value; 'event' = a cross or signal flip within the last N trading days.",
                      "enum": ["signal", "value", "event"],
                      "type": "string"
                    },
                    "value": {
                      "description": "For 'value'.",
                      "type": "number"
                    },
                    "within_days": {
                      "description": "For 'event': the event happened within the last N trading days (default 3).",
                      "maximum": 5,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["type"],
                  "type": "object"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              },
              "indices": {
                "description": "Restrict to index members: 'sp500' S&P 500, 'ndx' Nasdaq-100, 'hsi' Hang Seng Index, 'csi300' CSI 300 (沪深300). Several = members of any. Omit for the whole universe.",
                "items": {
                  "enum": ["sp500", "ndx", "hsi", "csi300"],
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "description": "Maximum matches to return (default 15).",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "markets": {
                "description": "Markets to screen: 'us' US stocks, 'hk' Hong Kong, 'cn' China A-shares (Shanghai/Shenzhen). Omit for all.",
                "items": {
                  "enum": ["us", "hk", "cn"],
                  "type": "string"
                },
                "type": "array"
              },
              "sort_by": {
                "description": "Ordering of matches (default bullish_count, highest first; rsi sorts lowest first).",
                "enum": ["bullish_count", "change_pct", "five_day_change_pct", "rsi"],
                "type": "string"
              }
            },
            "required": ["conditions"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fa46e32a8c0be39c117c6031fb7a310e568ae684e3556f55556a90097be7d439"
        }
      ],
      "digest": "sha256:c46d9cc3b84e9e5d125b0838a2b0f039821a6d5be3c0d22d4923e6316275d1ba"
    }
  }
}
