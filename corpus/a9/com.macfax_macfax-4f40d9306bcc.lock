      "serverInfo": {
        "name": "com.macfax/macfax",
        "title": "Macfax",
        "version": "1.8.1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Macfax is the record of individual Apple devices. lookup_mac_serial identifies any Mac, iPad or iPhone serial, including 2021+ serials no decoder can read, and returns the device's record on Macfax: any listing, verified report or sanitization record on file. For used Macs Macfax also carries quality-gated live listings aggregated across eBay, Craigslist, OfferUp, Swappa, Facebook and Reddit; sale and asking price statistics per exact configuration; per-listing trust checks; verified condition reports; standing listing alerts; and a follow that emails a device's value to its owner, both started only when the address's owner confirms by email. Prices are two labeled slices, never blended: the sold slice is the headline sale estimate (basis \"direct\" = verified sales with n and window, basis \"calibrated\" = the asking band scaled by a measured, disclosed clearance ratio), and the asking band is seller listing guidance from live listings. Preserve the labels when relaying numbers, and keep each listing's deep link to the source marketplace. A user who has just had their own device identified or valued may want it followed (create_mac_follow), and one who is shopping may want a listing alert (create_mac_alert): you can offer either once, and call it only for a user who asked for it or said yes. Both go to the user's own email address: if you already know it, use it so they need not type it, and tell them which address you used. Every tool is free, within daily allowances. For serial lookup, anonymous callers get 5 new serials a day. A key takes an email, starts with 5 and gets 25 once the email is verified, within 200 distinct serials a day. Serials Macfax has already answered, pre-2021 serials and repeats within 24 hours do not count as new. A key is one POST to https://macfax.com/api/v1/keys with {\"email\": \"<address>\"} (free, no account), and once that email is verified the key also has about 10x the request limits; DELETE https://macfax.com/api/v1/keys, sent with the key, revokes it. Over-limit calls return a structured error carrying the exact next call to make; get_macfax_limits reports what is left. Pass context (inventory, intake, resale, buyer, support, other) on lookups when the reason is known. Docs: https://macfax.com/developers",
      "tools": [
        {
          "name": "check_mac_listing",
          "title": "Check a used-Mac listing before trusting it",
          "description": "The trust picture for one specific listing, by URL (eBay/Craigslist/OfferUp/Swappa/Facebook/Reddit) or Macfax listing id: whether Macfax knows it, whether it still passes every quality gate, scam/junk/classified/auction flags, when a scan last verified it live, its ask against the configuration's typical asking band, the platform's own seller-reputation figures where the marketplace has them (seller_signals: eBay feedback, Swappa rating; null elsewhere), and whether a verified Macfax report is attached. Facts, not verdicts.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "A Macfax listing id (from search results).",
                "type": "string"
              },
              "url": {
                "description": "The listing's URL on the source marketplace.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a used-Mac listing before trusting it"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a62a0eff938b4bd2160951bf798e53282e57c0d5dad8dcb90edb78cb33321a1a"
        },
        {
          "name": "create_mac_alert",
          "title": "Create a standing used-Mac listing alert",
          "description": "Watch the market for a configuration: Macfax emails the given address when new matching listings appear. CONSENT CONTRACT: create an alert only for a user who explicitly asked for this alert, or said yes when you offered it, and only on that user's own email address. The first alert for a new email stays inactive until the email's owner clicks the confirmation link Macfax sends; nothing is emailed before that, and every alert email carries manage and unsubscribe links.",
          "inputSchema": {
            "properties": {
              "config": {
                "description": "Macfax config key: family[-screen]-chip-year, optionally -RAMgb-STORAGEgb. Examples: macbook-pro-14-m3pro-2023, mac-studio-m2ultra-2023-192gb-1024gb.",
                "type": "string"
              },
              "email": {
                "description": "The user's own email address: the one they gave, or the one you already know is theirs, so they need not type it. Tell them which address you used. Confirmation is required before anything sends. Never a placeholder or an invented address: those are refused, and the per-caller limit is a few alerts a day.",
                "type": "string"
              },
              "max_price_usd": {
                "description": "Only alert under this asking price.",
                "type": "integer"
              },
              "min_tier": {
                "description": "free = only listings with a verified Macfax report attached.",
                "enum": ["listed", "free"],
                "type": "string"
              },
              "ram_gb": {
                "type": "integer"
              },
              "storage_gb": {
                "type": "integer"
              },
              "under_typical": {
                "description": "Only listings under the configuration's typical asking range.",
                "type": "boolean"
              }
            },
            "required": ["config", "email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a standing used-Mac listing alert"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8e8195c39a365f735102e0020659653379b37022c8724ab689698b42877d3173"
        },
        {
          "name": "create_mac_follow",
          "title": "Follow an Apple device for its owner",
          "description": "Follow one Apple device for one person: Macfax emails the given address what the device is worth once it has a value for it, and after that writes only when that value moves or a verified Macfax report is published for the serial. CONSENT CONTRACT: ask only for a user who explicitly asked for this follow, or said yes when you offered it, and only on that user's own email address. Nothing starts with this call. Macfax sends the address one confirmation email, and the follow begins only when its owner follows the link in it (valid 7 days); nothing else is emailed before that, and every follow email carries manage and unsubscribe links. Use when a user asks to be told what their Mac, iPad or iPhone is worth, or when that changes.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "The user's own email address: the one they gave, or the one you already know is theirs, so they need not type it. Tell them which address you used. Confirmation is required before anything sends. Never a placeholder or an invented address: those are refused, and the limit is a few requests a day.",
                "type": "string"
              },
              "intent": {
                "description": "Optional. Why the user follows the device: buyer (they may buy it), selling (they are selling it), mine (it is theirs), or curious.",
                "enum": ["buyer", "selling", "mine", "curious"],
                "type": "string"
              },
              "serial": {
                "description": "The device's serial number: 10 characters on 2021+ devices (a letter first, never a vowel), 11-12 on older ones.",
                "type": "string"
              }
            },
            "required": ["email", "serial"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Follow an Apple device for its owner"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:21ef005a0251fd6c0931da8667aa176ff96d0cdd872b90ec527139f0eda2d78e"
        },
        {
          "name": "get_mac_market_value",
          "title": "Get what a Mac model is worth",
          "description": "What a used Mac is worth, from the name Apple gives the model, e.g. \"MacBook Pro (14-inch, 2021)\" or \"MacBook Air (13-inch, M4, 2025)\". Returns every Apple Silicon configuration the name can mean, each with its sale estimate (verified sales, or the asking band scaled by a measured clearance ratio; basis labeled) and its live asking band, plus an estimate across them: a single mid when the name pins one configuration, a low-to-high range when Apple's name leaves the chip open. Apple Silicon Macs only. Use the sale estimate as the price of the Mac; asking is seller guidance.",
          "inputSchema": {
            "properties": {
              "model": {
                "description": "The Mac's model name as Apple writes it, with a chip or a year: \"MacBook Pro (14-inch, M3 Pro or M3 Max, Nov 2023)\", \"Mac mini (2023) with M2 Pro\", \"iMac (24-inch, M1, 2021)\".",
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get what a Mac model is worth"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7e13f9e007b8a00d8cff14a36585d5b1f94e467203b27713e6ea6e70037eec57"
        },
        {
          "name": "get_mac_price_stats",
          "title": "Get used-Mac price statistics",
          "description": "What a used Mac configuration actually sells for AND what sellers are asking right now. The sold slice is the headline: verified-sale percentiles when the config has enough recent sales (sold.basis 'direct'; n and window ride along), else the asking band scaled by a measured clearance ratio (sold.basis 'calibrated', ratio disclosed). The asking band (median/p25/p75 with sample size), per-channel medians with net-to-seller after fees, launch MSRP retention and Apple trade-in floor ride along as seller guidance. Use the sold estimate as the price of the Mac; use asking to set a list price. The slices are separate and never blended — preserve the basis label when quoting.",
          "inputSchema": {
            "properties": {
              "config": {
                "description": "Macfax config key: family[-screen]-chip-year, optionally -RAMgb-STORAGEgb. Examples: macbook-pro-14-m3pro-2023, mac-studio-m2ultra-2023-192gb-1024gb.",
                "type": "string"
              }
            },
            "required": ["config"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get used-Mac price statistics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cf4388237a9b88088ff7cd4e8363af7dc1a6b921bbee73941a14645ac1441396"
        },
        {
          "name": "get_mac_report",
          "title": "Fetch a verified Macfax report",
          "description": "A verified Macfax condition report as structured data: hardware-verified identity, Activation Lock / MDM / serial-match checks, coverage status, and the signing chain. Use when a listing or seller shares a macfax.com/r/ link and the buyer wants the facts behind it. status \"superseded\" means the same Mac was re-verified more recently under a newer report; treat the payload as historical state, not current.",
          "inputSchema": {
            "properties": {
              "report_id": {
                "description": "The 8-character report id from a macfax.com/r/<id> URL.",
                "type": "string"
              }
            },
            "required": ["report_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch a verified Macfax report"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d843f35510802cd508394a8af51a430bface4dec667d9191c5ffcac5576e444e"
        },
        {
          "name": "get_macfax_limits",
          "title": "Check Macfax limits",
          "description": "What this caller may still do today: its serial lookup allowances and how much of each it has used in the last 24 hours. Macfax is free; the allowances only pace it. Anonymous callers get 5 new serials a day. A key takes an email, starts with 5 and gets 25 once the email is verified, within 200 distinct serials a day. Serials Macfax has already answered, pre-2021 serials and repeats within 24 hours do not count as new. Call this before a large batch of serials to find out whether it can be finished today.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check Macfax limits"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:06d94533d628b620d8d636bfc27b5680df93e545566e6f9165e3a676701cd862"
        },
        {
          "name": "lookup_mac_serial",
          "title": "Look up an Apple serial number",
          "description": "Resolve a Mac, iPad or iPhone serial number to its exact model, including 2021+ randomized serials whose characters encode nothing (so no character-decoder can read them). status says what came back: resolved, unknown_serial (no such serial; check it), unsupported (a real device whose model cannot be identified yet), or retry (temporary; ask again later). device_type is Apple's device class (Mac laptops, Mac desktops, iPad, iPhone). Also returns the device's record on Macfax: any listing, verified report or sanitization record on file. For a Mac, also returns what that model is worth (the market block: sale estimate and asking band per configuration). Lookup is advisory and cannot verify condition, Activation Lock, or possession; a Macfax report can. Free, within daily allowances: anonymous callers get 5 new serials a day. A key takes an email, starts with 5 and gets 25 once the email is verified, within 200 distinct serials a day. Serials Macfax has already answered, pre-2021 serials and repeats within 24 hours do not count as new.",
          "inputSchema": {
            "properties": {
              "context": {
                "description": "Optional. Why the serial is being looked up: inventory (counting devices an organization holds), intake (devices arriving for refurbishment, trade-in or repair), resale (pricing or listing one to sell), buyer (checking one before buying), support, or other.",
                "enum": ["inventory", "intake", "resale", "buyer", "support", "other"],
                "type": "string"
              },
              "serial": {
                "description": "The device's serial number: 10 characters on 2021+ devices (a letter first, never a vowel), 11-12 on older ones.",
                "type": "string"
              }
            },
            "required": ["serial"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Look up an Apple serial number"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f4d8dae2bc5242d4047e23d5ead65ae7b617e62f33e66ced2049a37996cd06ca"
        },
        {
          "name": "search_mac_listings",
          "title": "Search live used-Mac listings",
          "description": "Live used-Mac listings aggregated across eBay, Craigslist, OfferUp, Swappa, Facebook and Reddit, with scam clusters, junk titles, classified-ad bait, auctions and stale/sold rows already filtered out. Every result deep-links to the source listing where the purchase happens. Filter by configuration, family, chip, RAM, storage, price ceiling, and verified-report tier.",
          "inputSchema": {
            "properties": {
              "chip_tier": {
                "description": "e.g. m3, m3pro, m4max, m3ultra",
                "type": "string"
              },
              "config": {
                "description": "Macfax config key: family[-screen]-chip-year, optionally -RAMgb-STORAGEgb. Examples: macbook-pro-14-m3pro-2023, mac-studio-m2ultra-2023-192gb-1024gb. The year may be omitted when the rest pins one build: mac-studio-m3ultra resolves to mac-studio-m3ultra-2025.",
                "type": "string"
              },
              "family": {
                "description": "Coarse browse by product family.",
                "enum": ["macbook-pro", "macbook-air", "mac-studio", "mac-mini", "mac-pro", "imac", "imac-pro"],
                "type": "string"
              },
              "limit": {
                "default": 12,
                "maximum": 50,
                "type": "integer"
              },
              "max_price_usd": {
                "type": "integer"
              },
              "min_tier": {
                "description": "free = only listings with a verified Macfax report attached.",
                "enum": ["listed", "free"],
                "type": "string"
              },
              "ram_gb": {
                "type": "integer"
              },
              "sort": {
                "enum": ["fresh", "price_asc", "price_desc"],
                "type": "string"
              },
              "storage_gb": {
                "type": "integer"
              },
              "year": {
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search live used-Mac listings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fdaacd9d60c0afc634a5b7318f2050597c70632e41687335b8153baad675d856"
        }
      ],
      "digest": "sha256:39651814c06a468a694713090d1a6f6f6a83cd5d2533289fd0fe89c2eaaa7629"
    }
  }
