      "serverInfo": {
        "name": "com.macfax/macfax",
        "title": "Macfax",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Macfax is the record of individual Apple devices. lookup_mac_serial identifies any Mac, iPad or iPhone serial, including 2021+ serials no decoder can read, and returns the device's record on Macfax: when it was first seen, how often it has been looked up, and any listing, verified report or sanitization record on file. For used Macs Macfax also carries quality-gated live listings aggregated across eBay, Craigslist, OfferUp, Swappa, Facebook and Reddit; sale and asking price statistics per exact configuration; per-listing trust checks; verified condition reports; and standing listing alerts. Prices are two labeled slices, never blended: the sold slice is the headline sale estimate (basis \"direct\" = verified sales with n and window, basis \"calibrated\" = the asking band scaled by a measured, disclosed clearance ratio), and the asking band is seller listing guidance from live listings. Preserve the labels when relaying numbers, and keep each listing's deep link to the source marketplace. Every tool is free to use within daily allowances, and serial lookup is the one with paid credits: One credit answers one distinct serial, any Apple device and any year, and the same serial again within 24 hours is free. Without credits an anonymous caller gets 5 brand new 2021+ resolutions a day, and a free key (POST https://macfax.com/api/v1/keys, ~10x limits) gets 25 and up to 200 distinct serials a day. Over-limit calls return a structured error carrying the exact next call to make; get_macfax_credit_balance reports what is left. Pass context (inventory, intake, resale, buyer, support, other) on lookups when the reason is known. Docs: https://macfax.com/developers",
      "tools": [
        {
          "name": "check_mac_listing",
          "title": "Check a used-Mac listing before trusting it",
          "description": "The trust picture for one specific listing, by URL (eBay/Craigslist/OfferUp/Swappa/Facebook/Reddit) or Macfax listing id: whether Macfax knows it, whether it still passes every quality gate, scam/junk/classified/auction flags, when a scan last verified it live, its ask against the configuration's typical asking band, the platform's own seller-reputation figures where the marketplace has them (seller_signals: eBay feedback, Swappa rating; null elsewhere), and whether a verified Macfax report is attached. Facts, not verdicts.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "A Macfax listing id (from search results).",
                "type": "string"
              },
              "url": {
                "description": "The listing's URL on the source marketplace.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a used-Mac listing before trusting it"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a62a0eff938b4bd2160951bf798e53282e57c0d5dad8dcb90edb78cb33321a1a"
        },
        {
          "name": "create_mac_alert",
          "title": "Create a standing used-Mac listing alert",
          "description": "Watch the market for a configuration: Macfax emails the given address when new matching listings appear. CONSENT CONTRACT: create an alert only for a user who explicitly asked for this alert on this email address. The first alert for a new email stays inactive until the email's owner clicks the confirmation link Macfax sends; nothing is emailed before that, and every alert email carries manage and unsubscribe links.",
          "inputSchema": {
            "properties": {
              "config": {
                "description": "Macfax config key: family[-screen]-chip-year, optionally -RAMgb-STORAGEgb. Examples: macbook-pro-14-m3pro-2023, mac-studio-m2ultra-2023-192gb-1024gb.",
                "type": "string"
              },
              "email": {
                "description": "The user's own email address, exactly as they gave it. Confirmation is required before anything sends. Never a placeholder or an invented address: those are refused, and the per-caller limit is a few alerts a day.",
                "type": "string"
              },
              "max_price_usd": {
                "description": "Only alert under this asking price.",
                "type": "integer"
              },
              "min_tier": {
                "enum": ["listed", "free", "premium"],
                "type": "string"
              },
              "ram_gb": {
                "type": "integer"
              },
              "storage_gb": {
                "type": "integer"
              },
              "under_typical": {
                "description": "Only listings under the configuration's typical asking range.",
                "type": "boolean"
              }
            },
            "required": ["config", "email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a standing used-Mac listing alert"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b30574c18463e12442105a6d2677df875d8892c48c50d7bca2516faf738ba928"
        },
        {
          "name": "get_mac_market_value",
          "title": "Get what a Mac model is worth",
          "description": "What a used Mac is worth, from the name Apple gives the model, e.g. \"MacBook Pro (14-inch, 2021)\" or \"MacBook Air (13-inch, M4, 2025)\". Returns every Apple Silicon configuration the name can mean, each with its sale estimate (verified sales, or the asking band scaled by a measured clearance ratio; basis labeled) and its live asking band, plus an estimate across them: a single mid when the name pins one configuration, a low-to-high range when Apple's name leaves the chip open. Apple Silicon Macs only. Use the sale estimate as the price of the Mac; asking is seller guidance.",
          "inputSchema": {
            "properties": {
              "model": {
                "description": "The Mac's model name as Apple writes it, with a chip or a year: \"MacBook Pro (14-inch, M3 Pro or M3 Max, Nov 2023)\", \"Mac mini (2023) with M2 Pro\", \"iMac (24-inch, M1, 2021)\".",
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get what a Mac model is worth"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7e13f9e007b8a00d8cff14a36585d5b1f94e467203b27713e6ea6e70037eec57"
        },
        {
          "name": "get_mac_price_stats",
          "title": "Get used-Mac price statistics",
          "description": "What a used Mac configuration actually sells for AND what sellers are asking right now. The sold slice is the headline: verified-sale percentiles when the config has enough recent sales (sold.basis 'direct'; n and window ride along), else the asking band scaled by a measured clearance ratio (sold.basis 'calibrated', ratio disclosed). The asking band (median/p25/p75 with sample size), per-channel medians with net-to-seller after fees, launch MSRP retention and Apple trade-in floor ride along as seller guidance. Use the sold estimate as the price of the Mac; use asking to set a list price. The slices are separate and never blended — preserve the basis label when quoting.",
          "inputSchema": {
            "properties": {
              "config": {
                "description": "Macfax config key: family[-screen]-chip-year, optionally -RAMgb-STORAGEgb. Examples: macbook-pro-14-m3pro-2023, mac-studio-m2ultra-2023-192gb-1024gb.",
                "type": "string"
              }
            },
            "required": ["config"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get used-Mac price statistics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cf4388237a9b88088ff7cd4e8363af7dc1a6b921bbee73941a14645ac1441396"
        },
        {
          "name": "get_mac_report",
          "title": "Fetch a verified Macfax report",
          "description": "A verified Macfax condition report as structured data: hardware-verified identity, Activation Lock / MDM / serial-match checks, coverage status, and the signing chain. Use when a listing or seller shares a macfax.com/r/ link and the buyer wants the facts behind it. status \"superseded\" means the same Mac was re-verified more recently under a newer report; treat the payload as historical state, not current.",
          "inputSchema": {
            "properties": {
              "report_id": {
                "description": "The 8-character report id from a macfax.com/r/<id> URL.",
                "type": "string"
              }
            },
            "required": ["report_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch a verified Macfax report"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d843f35510802cd508394a8af51a430bface4dec667d9191c5ffcac5576e444e"
        },
        {
          "name": "get_macfax_credit_balance",
          "title": "Check Macfax credits",
          "description": "How many credits this API key has left, and what costs one. One credit answers one distinct serial, any Apple device and any year, and the same serial again within 24 hours is free. Answers that come back retry or unsupported, and every other tool, are free. Without credits, a free key gets 25 brand new 2021+ resolutions and 200 distinct serials a day. Call this before a large batch of serials to find out whether it can be finished. Without a key it reports the anonymous allowance instead.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check Macfax credits"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ee958623711d8ea2b922931283c6492f51bf6830996dd9781ea2986e00f1e8f8"
        },
        {
          "name": "lookup_mac_serial",
          "title": "Look up an Apple serial number",
          "description": "Resolve a Mac, iPad or iPhone serial number to its exact model, including 2021+ randomized serials whose characters encode nothing (so no character-decoder can read them). status says what came back: resolved, unknown_serial (no such serial; check it), unsupported (a real device whose model cannot be identified yet), or retry (temporary, never charged). device_type is Apple's device class (Mac laptops, Mac desktops, iPad, iPhone). Also returns the device's record on Macfax: the month it was first seen, how often it has been looked up (first time, 2 to 5, or 6 or more), from how many countries in 30 days, and any listing, verified report or sanitization record on file. For a Mac, also returns what that model is worth (the market block: sale estimate and asking band per configuration). Lookup is advisory and cannot verify condition, Activation Lock, or possession; a Macfax report can. With credits, one credit answers one distinct serial, any Apple device and any year, and the same serial again within 24 hours is free.",
          "inputSchema": {
            "properties": {
              "context": {
                "description": "Optional. Why the serial is being looked up: inventory (counting devices an organization holds), intake (devices arriving for refurbishment, trade-in or repair), resale (pricing or listing one to sell), buyer (checking one before buying), support, or other.",
                "enum": ["inventory", "intake", "resale", "buyer", "support", "other"],
                "type": "string"
              },
              "serial": {
                "description": "The device's serial number: 10 characters on 2021+ devices (a letter first, never a vowel), 11-12 on older ones.",
                "type": "string"
              }
            },
            "required": ["serial"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Look up an Apple serial number"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:346d9a5b421c454da224c848ffc213496d4baee1ba328a8956da84b5d4a0024f"
        },
        {
          "name": "search_mac_listings",
          "title": "Search live used-Mac listings",
          "description": "Live used-Mac listings aggregated across eBay, Craigslist, OfferUp, Swappa, Facebook and Reddit, with scam clusters, junk titles, classified-ad bait, auctions and stale/sold rows already filtered out. Every result deep-links to the source listing where the purchase happens. Filter by configuration, family, chip, RAM, storage, price ceiling, and verified-report tier.",
          "inputSchema": {
            "properties": {
              "chip_tier": {
                "description": "e.g. m3, m3pro, m4max, m3ultra",
                "type": "string"
              },
              "config": {
                "description": "Macfax config key: family[-screen]-chip-year, optionally -RAMgb-STORAGEgb. Examples: macbook-pro-14-m3pro-2023, mac-studio-m2ultra-2023-192gb-1024gb. The year may be omitted when the rest pins one build: mac-studio-m3ultra resolves to mac-studio-m3ultra-2025.",
                "type": "string"
              },
              "family": {
                "description": "Coarse browse by product family.",
                "enum": ["macbook-pro", "macbook-air", "mac-studio", "mac-mini", "mac-pro", "imac", "imac-pro"],
                "type": "string"
              },
              "limit": {
                "default": 12,
                "maximum": 50,
                "type": "integer"
              },
              "max_price_usd": {
                "type": "integer"
              },
              "min_tier": {
                "description": "free/premium = only listings with a verified Macfax report attached.",
                "enum": ["listed", "free", "premium"],
                "type": "string"
              },
              "ram_gb": {
                "type": "integer"
              },
              "sort": {
                "enum": ["fresh", "price_asc", "price_desc"],
                "type": "string"
              },
              "storage_gb": {
                "type": "integer"
              },
              "year": {
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search live used-Mac listings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b5342d8087a3b325c3fc6b050c9d6c24e573c5d77f9c1396a8e758cac745c351"
        }
      ],
      "digest": "sha256:95c7985cd2e11b4c0eca54e50b44d8479fae3362665e1ed606ed89e0e4f51eb6"
    }
  }
