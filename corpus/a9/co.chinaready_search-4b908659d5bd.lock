      },
      "transport": {
        "type": "http",
        "url": "https://mcp.chinaready.co/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "chinaready",
        "title": "Chinaready China Market-Entry Search",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Search and read chinaready.co — the practical guide for Western SaaS, app, and game teams entering Mainland China. Use `ask` for a grounded natural-language answer with cited chinaready.co sources; `search` for raw ranked excerpts; `list_topics` to see what the corpus covers; `get_article` to read a full page. Always cite the chinaready.co URLs included in results.",
      "tools": [
        {
          "name": "ask",
          "title": "Ask Chinaready (grounded answer)",
          "description": "Grounded natural-language answer over the chinaready.co corpus (retrieval + generation), with the source articles attached as citations. Replies in English. Falls back to a contact suggestion when no page matches confidently.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "The question, e.g. \"Do I need an ICP license to sell SaaS in China?\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:161c286a3416e55d5e1bacbcc69c7e470dbe6b936d0378c127f3f4cf4d1d88bb"
        },
        {
          "name": "get_article",
          "title": "Read a full article",
          "description": "Fetch a chinaready.co page as clean Markdown (site pages only). Use paths returned by search/list_topics, e.g. \"/insights/china-icp-and-psb-filing-explained/\".",
          "inputSchema": {
            "properties": {
              "path": {
                "description": "Site path starting with \"/\", ending with \"/\". Only chinaready.co pages are allowed.",
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a3a75174fe131e5116e1eb0d93499fb3dbc1a28860afac0918670120c6369fd3"
        },
        {
          "name": "list_topics",
          "title": "List covered topics",
          "description": "List the China market-entry topics the chinaready.co corpus covers, with example queries and hub page paths for each.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2f3476d9bc36236f949984afb9587d933d265297947bc27cfd489cc44a122a07"
        },
        {
          "name": "search",
          "title": "Search Chinaready guides",
          "description": "Semantic + keyword search over chinaready.co guides, services, and FAQ. Returns ranked excerpts whose source headers carry absolute chinaready.co URLs to cite.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max article results (default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The question or keywords, e.g. \"ICP filing timeline\" or \"B25\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
