  "subjects": {
    "com.madebydevx.agentgas/agentgas": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentgas.madebydevx.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "agentgas",
        "title": "AgentGas by DevX",
        "version": "1.6.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only helper for AgentGas. Start with agentgas_ensure_gas before on-chain actions: it says whether you need gas and gives the exact URL to pay. Payment itself is an x402 call to /v1/gas (USDC on Base) or a signed prepaid-credit message. Returning wallets pay a lower flat fee automatically ($0.05 after 3 orders, $0.02 after 10).",
      "tools": [
        {
          "name": "agentgas_credit_message",
          "title": "Credit top-up message",
          "description": "Free. Returns the exact EIP-191 message to sign with the payer wallet to spend prepaid credit on a top-up (no x402 payment). Then POST /v1/gas {credit:{message,signature}}. Credit: start with a 0.09 USDC pack (fits the $0.10 x402 cap, 0.099 credit) or 5/10/20 USDC packs, all with +10% bonus, at /v1/credit?pack=0.09.",
          "inputSchema": {
            "properties": {
              "amount": {
                "type": "string"
              },
              "chain": {
                "description": "Destination chain for the native gas",
                "enum": ["base", "arbitrum", "optimism", "polygon"],
                "type": "string"
              },
              "payer": {
                "type": "string"
              },
              "to": {
                "type": "string"
              },
              "usd": {
                "type": "string"
              }
            },
            "required": ["chain", "payer"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ed785674855624c878c97276d451503f388c359469d727f296b10747879c329d"
        },
        {
          "name": "agentgas_ensure_gas",
          "title": "Ensure gas",
          "description": "Free. Checks a wallet's native gas balance on base/arbitrum/optimism/polygon. If it is at least min, returns needed:false (nothing to pay). Otherwise returns the exact top-up to reach target (default 2 x min), the price with your loyalty fee, an x402 URL to pay (pay_with_x402.url) and, if you hold AgentGas credit, a ready-to-sign credit message (pay_with_credit). Call before each on-chain action.",
          "inputSchema": {
            "properties": {
              "chain": {
                "description": "Destination chain for the native gas",
                "enum": ["base", "arbitrum", "optimism", "polygon"],
                "type": "string"
              },
              "min": {
                "description": "Minimum native balance needed, e.g. 0.00002",
                "type": "string"
              },
              "payer": {
                "description": "Paying wallet (loyalty fee, credit). Defaults to to.",
                "type": "string"
              },
              "target": {
                "description": "Balance to top up to (default 2 x min)",
                "type": "string"
              },
              "to": {
                "description": "Wallet to check / top up",
                "type": "string"
              }
            },
            "required": ["min", "to"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:08e5f94e7e044ffad90d094e8acd6556acb360c6385603e2e61fa34aa277e0fa"
        },
        {
          "name": "agentgas_how_to_buy",
          "title": "How to buy gas",
          "description": "Pay USDC via x402 at /v1/gas; starter fills under $0.10; MCP tools are free helpers—use an x402 client to pay. Step-by-step instructions plus the exact x402 payment URL. This MCP server cannot sign payments; your x402 client (e.g. @x402/fetch) pays the URL with USDC on Base, gasless (EIP-3009 signature, no ETH needed).",
          "inputSchema": {
            "properties": {
              "amount": {
                "type": "string"
              },
              "chain": {
                "description": "Destination chain for the native gas",
                "enum": ["base", "arbitrum", "optimism", "polygon"],
                "type": "string"
              },
              "to": {
                "description": "Recipient 0x address; omit to deliver to the payer",
                "type": "string"
              },
              "usd": {
                "type": "string"
              }
            },
            "required": ["chain"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:139f29be1d88d05d04ad9f8682dc49eb78ca92ac4c6933d6adc9d0a57fb845d3"
        },
        {
          "name": "agentgas_order",
          "title": "Order status",
          "description": "Status of an AgentGas order by order_id: pending, processing, delivered (with payout_tx on the destination chain) or refunded (with refund_tx on Base).",
          "inputSchema": {
            "properties": {
              "order_id": {
                "type": "string"
              }
            },
            "required": ["order_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0b9ab2adffb8fa1c98fb303969ba3d6ce2d2e0f5b8b0789a18da5beedfe34179"
        },
        {
          "name": "agentgas_quote",
          "title": "Quote native gas",
          "description": "Free price quote: how much USDC (on Base, paid via gasless x402) buys a given amount of native gas (ETH on base/arbitrum/optimism, POL on polygon). Returns price_usdc, breakdown and the exact x402 URL to pay. Rejects bad input or over-capacity before any payment.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Native amount, e.g. 0.000025 (ETH default) or 0.5 (POL). Use amount or usd.",
                "type": "string"
              },
              "chain": {
                "description": "Destination chain for the native gas",
                "enum": ["base", "arbitrum", "optimism", "polygon"],
                "type": "string"
              },
              "payer": {
                "description": "Your paying wallet, to quote your loyalty fee",
                "type": "string"
              },
              "to": {
                "description": "Recipient 0x address (optional for a quote)",
                "type": "string"
              },
              "usd": {
                "description": "Alternatively, a USD budget for the gas value, e.g. 0.25",
                "type": "string"
              }
            },
            "required": ["chain"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0056f5b5122cb39de858e937bab96ddfc7317954681105ebe8642f3f93bc8590"
