      "serverInfo": {
        "name": "agentgas",
        "title": "AgentGas by DevX",
        "version": "1.2.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only helper for AgentGas: quote, live capacity, order status and how-to-buy. Payment itself is an x402 call to /v1/gas (USDC on Base).",
      "tools": [
        {
          "name": "agentgas_how_to_buy",
          "title": "How to buy gas",
          "description": "Step-by-step instructions plus the exact x402 payment URL for buying native gas for an address. This MCP server cannot sign payments; your x402 client (e.g. @x402/fetch) pays the URL with USDC on Base, gasless (EIP-3009 signature, no ETH needed).",
          "inputSchema": {
            "properties": {
              "amount": {
                "type": "string"
              },
              "chain": {
                "description": "Destination chain for the native gas",
                "enum": ["base", "arbitrum", "optimism", "polygon"],
                "type": "string"
              },
              "to": {
                "description": "Recipient 0x address; omit to deliver to the payer",
                "type": "string"
              },
              "usd": {
                "type": "string"
              }
            },
            "required": ["chain"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f318816a095bedd2a84b4ef3d08226199c6cc2d464c355517be82f9d0960f107"
        },
        {
          "name": "agentgas_order",
          "title": "Order status",
          "description": "Status of an AgentGas order by order_id: pending, processing, delivered (with payout_tx on the destination chain) or refunded (with refund_tx on Base).",
          "inputSchema": {
            "properties": {
              "order_id": {
                "type": "string"
              }
            },
            "required": ["order_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0b9ab2adffb8fa1c98fb303969ba3d6ce2d2e0f5b8b0789a18da5beedfe34179"
        },
        {
          "name": "agentgas_quote",
          "title": "Quote native gas",
          "description": "Free price quote: how much USDC (on Base, paid via gasless x402) buys a given amount of native gas (ETH on base/arbitrum/optimism, POL on polygon). Returns price_usdc, breakdown and the exact x402 URL to pay. Rejects bad input or over-capacity before any payment.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Native amount, e.g. 0.000025 (ETH default) or 0.5 (POL). Use amount or usd.",
                "type": "string"
              },
              "chain": {
                "description": "Destination chain for the native gas",
                "enum": ["base", "arbitrum", "optimism", "polygon"],
                "type": "string"
              },
              "to": {
                "description": "Recipient 0x address (optional for a quote)",
                "type": "string"
              },
              "usd": {
                "description": "Alternatively, a USD budget for the gas value, e.g. 0.25",
                "type": "string"
              }
            },
            "required": ["chain"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ab19acb27b4dd84eb099b9d1483f40cd636c2d214e60cd945c1e1ff8cff4ddad"
        },
