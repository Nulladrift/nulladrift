          "title": "Loyalty tier and credit balance",
          "description": "Free. Delivered orders, current flat fee ($0.10 / $0.05 after 3 / $0.02 after 10), orders to the next tier, and prepaid credit balance for a wallet.",
          "inputSchema": {
