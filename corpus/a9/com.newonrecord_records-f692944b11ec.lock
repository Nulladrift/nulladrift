        {
          "name": "list_offices",
          "description": "Which offices keep a kind of record for a place, and for each whether its records are served, or why not: not looked at by research, not online, kept by another office, not read, kept and held from serving, checked with nothing kept, a list of minutes alone, served with none of the kind yet, or holding records held until the privacy reader has read them all for private people's names. Each carries the ask_for_data call that asks for it, unless its source is served for that kind (holding records or not yet), its terms bar commercial use, or asking can't change what the directory knows. Says what the directory holds, so a place it holds no file for reads as unknown, never as none. Each office's `outcome`: `not-looked`: Research hasn't looked yet for what the office posts of this kind, so what it keeps is unknown. `not-online`: The office posts none online (`instead` says what it does). `kept-elsewhere`: It says another office keeps them (`kept_by`). `not-read`: A source the checker doesn't read, holding no records of this kind (`not_read` says why). `held`: Its records of this kind are kept and not served (`not_read` says why). Where its terms bar us, `asked_on` is the day the registry records asking its office, or the company whose site it is, to allow them; it is null until then. `status-only`: Checked, with no record kept (`basis` says why). `minutes-only`: A list of its meetings' minutes alone, read for them (their kind is meeting.minutes) and holding none of this kind. `none-yet`: Its source is served and holds no records of this kind yet; the source's `status` and `cause` say why and what comes next. `waiting`: Its source is served and holds records of this kind, none of which is listed yet: they are held until the privacy reader has read them all for private people's names. Where `not_read` is given, the checker no longer reads the source (since `since`), and what it read before is held the same way. `served`: Its records are served. Where `not_read` is given, the checker no longer reads the source (since `since`) and serves what it read before. `no-source`: A keeper with no source of this kind in the directory. Beside it: `kept`, why it is in the answer: here (the place's own, or a place inside it), district (the place's health district, for a kind districts keep), body (an office another place says keeps its records), statewide (the state's or a federal office, for a kind no place keeps: search it with `source`). `named_by`, for `body`: the place whose entry names this office as its keeper. `instead`, for not-online and kept-elsewhere, what the office does instead (not-published, pdf-forms, request, another-body, …). For not-read and held, what would make the source readable. `via`, for a source whose records come through another: that source's id. `asked_on`, for held: the day the registry records its office, or the company whose site it is, was asked to allow it, as recorded once a send is; null until then, and for a source held for privacy. Not counted toward the daily limit.",
