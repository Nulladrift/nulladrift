      "instructions": "New on Record serves US public records as published by the offices that post them: bids, agendas, permits, licenses, registrations, inspections, notices and carriers, in the states it covers. Use find_place to turn a place's name into an id, list_kinds for the kinds and their schemas, search_records to search by words or browse, and list_changes to keep in step. list_offices says which offices keep a kind for a place, and why each one not served isn't. find_company turns a company's name into an id, get_company counts its records by kind, place and office, and search_records with company reads the records of every kind that name it. A link says only that offices wrote the same name. A record at a street address carries it: find_address counts the records there by kind, place and office, and search_records with address reads them, so a record leads to its company's and its address's others. An address says only that records are at the same street address; a building holds many businesses. Each record names its office and links to the office's own page. A source's `status` at its last check: `connected`: The last check read this source. Its records came through the way they did before. `changed`: The last check read this source, but something about its records has changed. The reason is shown beside it. `broken`: The last check couldn't open this source, or couldn't read the records on it. `blocked`: The site asks automated checkers to stay off this page, or it turned the checker away. The checker stopped there. `upload_due`: A person updates this source by hand on a schedule. The last update is older than that schedule. `not_built`: This source is in the directory and set to be read, but the checker can't read this kind of page yet. `not_run`: This source is waiting its turn to be read. `not_connected`: This source is in the directory, but the checker doesn't read it. The reason is shown beside it. Beside `changed`, `broken` or `not_run`, its `cause` says why: `site_down`: The site didn't answer within 30 seconds, or it answered with an error each time it was tried. `url_moved`: The page wasn't at its address, or the address now sends visitors to another site. `layout_changed`: The page opened, but its records are laid out in a new way. The checker couldn't read them as before. `data_gone`: The page opened but showed no records. The check before found some. `stale`: No new record has appeared in three times the usual gap between records. For a source that posts weekly, that's three weeks. `vendor_limit`: A company hosts this page and many other offices' pages. Its terms limit how many pages a program may read from them in a day. The checker reads them in turn, and this one waits its turn. `vendor_down`: A company hosts this page and many other offices' pages. Its servers stopped answering for a few minutes while the checker read them, so this check didn't reach this page. `blocked`: The site keeps automated checkers off this page, by asking them to stay off or by turning them away. The reason is shown beside it. On a record: `dated_by`, what gives `occurred_at`: the field of `fields` it is (`posted_at`, `issued_at`, `due_at`, `meeting_at`...), `check` where a check corrected it, `first_seen` for the night the checker first read it, or `export` for the date of the file it was read from. `unchecked`, why `checked` is null. `waiting`: not yet read. `derived`: itself a model's reading of its office's document (a meeting's minutes), held to it when it was read. `too_long`: more than a check may send. `ai_input`: its office's site or terms say no AI. Null once checked. `not_read`, the kind's fields this source's reader never reads, whatever the office's page or document shows, each left out of `fields`: an inspection read from a report's first page names `violations` here rather than give an empty list. Empty where it reads them all. Null where the reader doesn't say which it reads; there an empty field may be one it didn't read. `last_seen_at`, the start of the run that last read this record at its source: what it says, its status above all, is as of then. The source's `freshness` is the list's; this is the record's own. A source that reads back a window of days reads an older record again only when its history is walked, so an old record can be weeks behind a list read last night. A record first read or changed in that run shows it a little before its `first_seen_at` or `last_changed_at`, which are the moments it was stored. In Claude on the web, the desktop or a phone, and in ChatGPT, the first call to search_records, get_record, list_changes or ask_for_data asks its person to sign in. Every other call needs no sign-in. What connecting from Claude or ChatGPT needs, beside each app's own help article for its screens, is at https://newonrecord.com/developers#apps: in Claude, choose Sign in when needed, then Use Claude's published identity.",
