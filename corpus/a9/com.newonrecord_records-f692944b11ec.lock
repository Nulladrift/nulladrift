        {
          "name": "search_records",
          "description": "Records by words, or filtered. With words (q), `order` is `best`, the best match first and the default, or `newest`; without words they come newest first. Records filtered by kind, place or source, a window of dates (ISO 8601 with a time zone), the office's own number, exactly (match, such as {\"license_number\": \"12345\"}: list_kinds names each kind's lookup fields), a state in our words (state, such as active or issued: list_kinds names each kind's), a company that names them (company, an id from find_company), or the street address they are at (address, an address's id: from find_address, or a record's address.id). A kind with a deadline, a bid's due date or a license's expiry, is found by when it passes (deadline_after, deadline_before, ISO 8601 with a time zone): deadline_after now gives the bids not yet due, whatever their status, which is the office's own word. A deadline the office gave as a date passes at that day's end. A kind whose records hold a city of their own, a carrier's or a license holder's, is found by it (city), and a carrier by its ZIP code (postal_code), across a statewide roster. Without words, records come newest first by `occurred_at`, the date each record's `dated_by` names. With words (q), every word must be in a record's text or the name it is filed under, in any order, and a word finds its other forms, never a word it is part of (HVAC* finds HVACR). Put \"a phrase\" in quotes, end a word with * for its beginning, start one with - to leave it out, and put OR between two words for either; AND and NOT are words like any other. Records then come best match first, or newest first with order=newest, each with `matched`: its values that hold the words. The page also gives `total` and `counts` by kind, place and year. Narrow by them rather than reading on: 10 to 20 a page is enough. limit=0 gives the counts alone, which count nothing against today's allowance. At most 100 a page; pass next_cursor back for the next. Each record returned counts against today's allowance.",
