{
  "lockfileVersion": 2,
  "subjects": {
    "ai.djzs/trust-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.djzs.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "djzs-trust-mcp",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "query_agent_trust",
          "title": "Query DJZS Agent Trust Score",
          "description": "Query an agent's DJZS trust score, aggregated on-chain (Base mainnet) from its audit history and indexed via the DJZS subgraph. USE BEFORE delegating work, releasing escrow, or executing agent transactions. Returns scored_audits, pass/fail counts, the raw fail rate, and a Wilson 95% lower bound on it, plus latest verdict/risk and DJZS-S01/DJZS-X01 flag counts. WAIT verdicts are abstentions: they are excluded from BOTH the numerator and the denominator of the fail rate and are reported separately as wait_count. Below 10 scored audits the tool returns INSUFFICIENT_HISTORY and NO rate - a 0-of-0 record is not evidence of reliability and must not compare as better than a 3-of-50. This tool returns evidence, not a decision: it applies no threshold and emits no HALT. Interpreting the bound against your own risk tolerance is the caller's job.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agentAddress": {
                "description": "Agent wallet address (0x-prefixed)",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["agentAddress"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:475fec278d488370f12bc83978d128f8fca321222c300a5e83338e264b5437f8"
        },
        {
          "name": "query_pol_certificates",
          "title": "Query DJZS ProofOfLogic Certificates",
          "description": "Query immutable ProofOfLogic certificates stored on Irys Datachain by DJZS Protocol. USE THIS TOOL when you need to verify audit history for an agent or project before delegating work, check FAIL verdicts, or retrieve certificates by Irys tx ID. DO NOT use for on-chain trust scores — use query_agent_trust for those.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "from_ms": {
                "description": "Window start (epoch ms). Default path auto-narrows (14d then 3d) to stay under the mainnet index timeout; pass an explicit value to reach older certificates (used as-is).",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "limit": {
                "default": 20,
                "description": "Number of results",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "targetSystem": {
                "description": "Project name or wallet address",
                "type": "string"
              },
              "tier": {
                "description": "Filter by tier",
                "enum": ["micro", "founder", "treasury"],
                "type": "string"
              },
              "to_ms": {
                "description": "Window end (epoch ms). Defaults to now + 1h.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "verdict": {
                "description": "Filter by verdict",
                "enum": ["PASS", "FAIL"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8ceab05f004fa44a28390e646143cbaeaddf89d13b1c5716fde014197b4ae087"
        },
        {
          "name": "verify_perp_trade",
          "title": "Verify Perpetual / Spot Trade Thesis (DJZS pre-execution audit)",
          "description": "Deterministic pre-execution audit of a perpetual or spot TRADE thesis (direction, size, leverage, entry, stop, target, venue, and the REASON), run before capital is committed. USE THIS TOOL before opening, sizing, or increasing any perpetual or spot position. Returns PASS / WAIT / FAIL with a reproducible verdict hash. A position stated with no thesis FAILS (DJZS-S01); an unbounded position FAILS (DJZS-X01); an unresolvable stop or thesis WAITs. Prediction-market bets are refused here (use verify_pm_trade) and are not charged. Price 2.00 USDC per audit on Base.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agent_address": {
                "description": "Optional agent wallet (0x). If set, this audit updates that agent's on-chain DJZS trust score",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "bracket": {
                "description": "Optional exact bracket (side, entry, stop, target, taker_fee_bps, optional hit_rate_pct / funding_rate_8h / sigma_annual). Returns the break-even hit rate in the non-scoring mechanics block; never enters the verdict or its hash",
                "properties": {
                  "entry": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "funding_rate_8h": {
                    "description": "Funding rate per 8 hours as a fraction (0.0001 = 0.01%); longs pay a positive rate. Counted only with sigma_annual",
                    "maximum": 0.05,
                    "minimum": -0.05,
                    "type": "number"
                  },
                  "hit_rate_pct": {
                    "description": "The thesis's stated probability, in percent, that the target prints before the stop",
                    "maximum": 99,
                    "minimum": 1,
                    "type": "number"
                  },
                  "side": {
                    "enum": ["long", "short"],
                    "type": "string"
                  },
                  "sigma_annual": {
                    "description": "Annualized volatility as a fraction (0.45 = 45%); sets the expected hold, and so the funding paid",
                    "exclusiveMinimum": 0,
                    "maximum": 10,
                    "type": "number"
                  },
                  "stop": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "taker_fee_bps": {
                    "description": "The venue's taker fee in basis points, charged on entry and on exit",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "target": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  }
                },
                "required": ["entry", "side", "stop", "taker_fee_bps", "target"],
                "type": "object"
              },
              "intent": {
                "description": "Free-text perpetual or spot trade thesis to audit: direction, size, leverage, entry, stop, target, venue, and the REASON",
                "minLength": 10,
                "type": "string"
              },
              "target_system": {
                "description": "Optional agent/project identifier. Written to the certificate ONLY with a matching target_system_subject + target_system_signature; unsigned values are DISCARDED, not stored",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "target_system_signature": {
                "description": "EIP-191 personal_sign over \"DJZS-TSC-1 target-system claim\\nsubject: <lowercased subject>\\ntarget_system: <value>\"",
                "pattern": "^0x[0-9a-fA-F]{130}$",
                "type": "string"
              },
              "target_system_subject": {
                "description": "Address that signed the target_system claim. Must be the address that recovers from target_system_signature",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["intent"],
            "type": "object"
          },
          "annotations": {
            "title": "Verify Perpetual / Spot Trade Thesis (DJZS pre-execution audit)"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 2
          },
          "digest": "sha256:0cbb468c5665a782e393e268387ae8c4677505129461c47a22503854453ad65f"
        },
        {
          "name": "verify_pm_trade",
          "title": "Verify Prediction-Market Trade Thesis (DJZS pre-execution audit)",
          "description": "Deterministic pre-execution audit of a prediction-market trade thesis, run before capital is committed. USE THIS TOOL before opening, sizing, or increasing any prediction-market position, and whenever a user or an upstream agent asks whether a thesis is sound, carries a falsification condition, or has a sourced probability basis. Audits against the calibrated DJZS-M taxonomy (M01 narrative/resolution gap, M02 falsification absent, M03 probability unsourced, M04 consensus-as-edge advisory) and returns PASS->PROCEED, WAIT->HALT, or FAIL with the flagged defects and a reproducible verdict_hash. DO NOT use to retrieve past verdicts or certificates - use query_pol_certificates for those. DO NOT use for an agent's historical trust score - use query_agent_trust for that. DO NOT use for spot, perpetuals, or equities: out-of-scope submissions are refused WITHOUT CHARGE. Audit before act. Paid tool: 2 USDC per audit via x402 on Base.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agent_address": {
                "description": "Optional agent wallet (0x). If set, this audit updates that agent's on-chain DJZS trust score",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "intent": {
                "description": "Free-text prediction-market trade thesis to audit",
                "minLength": 10,
                "type": "string"
              },
              "target_system": {
                "description": "Optional agent/project identifier. Written to the certificate ONLY with a matching target_system_subject + target_system_signature; unsigned values are DISCARDED, not stored",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "target_system_signature": {
                "description": "EIP-191 personal_sign over \"DJZS-TSC-1 target-system claim\\nsubject: <lowercased subject>\\ntarget_system: <value>\"",
                "pattern": "^0x[0-9a-fA-F]{130}$",
                "type": "string"
              },
              "target_system_subject": {
                "description": "Address that signed the target_system claim. Must be the address that recovers from target_system_signature",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["intent"],
            "type": "object"
          },
          "annotations": {
            "title": "Verify Prediction-Market Trade Thesis (DJZS pre-execution audit)"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 2
          },
          "digest": "sha256:f2f90373ec79adbbea6025cc4a28bad136caa74ffc447c0bf49480e82af46fbf"
        }
      ],
      "digest": "sha256:ca672ff425ae8b4c09ce1fec365cc9cf7c7d45532d9ee7adade10c9f61f07545"
    }
  }
}
