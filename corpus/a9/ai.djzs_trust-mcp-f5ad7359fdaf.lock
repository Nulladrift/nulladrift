            "taskSupport": "forbidden"
          },
          "digest": "sha256:b7ded65265cd6cd4d6e59977762ad45e83951d5aec7d13377d354d7d1897235e"
        },
        {
          "name": "verify_perp_trade",
          "title": "Verify Perpetual or Spot Trade",
          "description": "Deterministic pre-execution audit of a perpetual or spot TRADE thesis (direction, size, leverage, entry, stop, target, venue, and the REASON), run before capital is committed. USE THIS TOOL before opening, sizing, or increasing any perpetual or spot position. Returns PASS / WAIT / FAIL with a reproducible verdict hash. A position stated with no thesis FAILS (DJZS-S01); an unbounded position FAILS (DJZS-X01); an unresolvable stop or thesis WAITs. Prediction-market bets are refused here (use verify_pm_trade) and are not charged. Price 2.00 USDC per audit on Base.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agent_address": {
                "description": "Optional agent wallet (0x). If set, this audit updates that agent's on-chain DJZS trust score",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "bracket": {
                "description": "Optional exact bracket (side, entry, stop, target, taker_fee_bps, optional hit_rate_pct / funding_rate_8h / sigma_annual). Returns the break-even hit rate in the non-scoring mechanics block; never enters the verdict or its hash",
                "properties": {
                  "entry": {
                    "description": "Planned entry price, in the instrument's quote currency",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "funding_rate_8h": {
                    "description": "Funding rate per 8-hour interval as a fraction (0.0001 means 0.01%); a positive rate is paid by longs. Used only when sigma_annual is also sent",
                    "maximum": 0.05,
                    "minimum": -0.05,
                    "type": "number"
                  },
                  "hit_rate_pct": {
                    "description": "The thesis's stated probability, in percent, that the target prints before the stop",
                    "maximum": 99,
                    "minimum": 1,
                    "type": "number"
                  },
                  "side": {
                    "description": "Direction of the position: long profits if price rises, short if it falls",
                    "enum": ["long", "short"],
                    "type": "string"
                  },
                  "sigma_annual": {
                    "description": "Annualized volatility as a fraction (0.45 = 45%); sets the expected hold, and so the funding paid",
                    "exclusiveMinimum": 0,
                    "maximum": 10,
                    "type": "number"
                  },
                  "stop": {
                    "description": "Stop-loss price, in the same units as entry",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "taker_fee_bps": {
                    "description": "The venue's taker fee in basis points; the break-even calculation charges it on entry and again on exit",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "target": {
                    "description": "Take-profit price, in the same units as entry",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  }
                },
                "required": ["entry", "side", "stop", "taker_fee_bps", "target"],
                "type": "object"
              },
              "intent": {
                "description": "The trade as the user or upstream agent stated it, in plain text: instrument, direction, size, leverage, entry, stop, target, venue, and the reason the price should move that way. A position sent with no reason FAILS",
                "minLength": 10,
                "type": "string"
              },
              "target_system": {
                "description": "Agent or project name to record on the anchored certificate. It is stored ONLY when target_system_subject and target_system_signature are also sent and the signature verifies; otherwise it is DISCARDED, not stored",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "target_system_signature": {
                "description": "Signature by target_system_subject proving the claim: EIP-191 personal_sign over the text \"DJZS-TSC-1 target-system claim\\nsubject: <lowercased subject>\\ntarget_system: <value>\"",
                "pattern": "^0x[0-9a-fA-F]{130}$",
                "type": "string"
              },
              "target_system_subject": {
                "description": "Wallet address that signed the target_system claim; the server checks that target_system_signature recovers to it",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["intent"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "action": {
                "description": "PROCEED for PASS, HALT for WAIT, FAIL for FAIL",
                "type": "string"
              },
              "disagreements": {},
              "extraction_failsafe": {
                "type": "boolean"
              },
              "fail_reason": {
                "type": "string"
              },
              "flags": {
                "description": "Defects found, each with its DJZS code",
                "items": {},
                "type": "array"
              },
              "halt_reason": {
                "description": "Present on WAIT: what to clarify before re-auditing",
                "type": "string"
              },
              "in_scope": {
                "type": "boolean"
              },
              "mechanics": {
                "additionalProperties": {},
                "description": "verify_perp_trade only: non-scoring execution mechanics",
                "properties": {},
                "type": "object"
              },
              "pol_certificate": {
                "additionalProperties": {},
                "description": "Anchoring status and Irys id of the Proof-of-Logic certificate",
                "properties": {},
                "type": "object"
              },
              "risk_score": {
                "type": "number"
              },
              "schema_version": {
                "type": "string"
              },
              "sources": {
                "additionalProperties": {},
                "description": "DJZS-SRC-v0.2, non-scoring: for each URL the thesis cites, whether the source carries the claim (supported, figure_not_in_source, span_figure_mismatch, no_supporting_span, unreachable, not_checked), read from the page or, for Polymarket event and FRED series links, from the source data itself (route), with the sha256 of what was read and when (fetched_at)",
                "properties": {},
                "type": "object"
              },
              "tally": {},
              "taxonomy": {
                "additionalProperties": {},
                "description": "Ruleset and extraction-contract versions and hashes the verdict ran under",
                "properties": {},
                "type": "object"
              },
              "tool": {
                "type": "string"
              },
              "trust_score": {
                "additionalProperties": {},
                "description": "On-chain trust-score write status, when agent_address was given",
                "properties": {},
                "type": "object"
              },
              "unknown_fields": {
                "description": "Fields that could not be resolved from the thesis text",
                "items": {},
                "type": "array"
              },
              "verdict": {
                "description": "PASS, WAIT or FAIL",
                "type": "string"
              },
              "verdict_hash": {
                "description": "Reproducible hash binding the verdict to its inputs",
                "type": "string"
              }
            },
            "required": ["action", "in_scope", "risk_score", "schema_version", "tool", "verdict", "verdict_hash"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Verify Perpetual or Spot Trade"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
