      "serverInfo": {
        "name": "djzs-trust-mcp",
        "title": "DJZS Trade Audit",
        "version": "1.0.0",
        "description": "Pre-execution audit for AI trading agents. Checks a prediction-market, perpetual or spot trade thesis for a stated reason, a falsification condition and bounded risk before capital is committed, returns PASS, WAIT or FAIL with a reproducible verdict hash, and looks up an agent's audit certificates and trust score.",
        "websiteUrl": "https://djzs.ai",
        "icons": [
          {
            "src": "https://djzs.ai/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://djzs.ai/favicon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "DJZS audits the reasoning behind a trade before it executes. It does not predict prices or place orders.\n1. Checking a counterparty agent (free, read-only): call query_agent_trust with its wallet address for its pass/fail record, and query_pol_certificates to read its individual audit certificates.\n2. Before opening, sizing or increasing a position: send the thesis in the user's own words. Prediction-market bets go to verify_pm_trade; perpetual and spot trades go to verify_perp_trade. Each audit costs 2.00 USDC via x402 on Base and anchors a permanent certificate, so confirm with the user before calling. A thesis sent to the wrong tool is refused without charge.\n2a. No wallet, or not ready to pay: call check_thesis. It is free, returns the same PASS, WAIT or FAIL with the reasons, and writes no receipt. It has a shared daily limit.\n3. Act on the verdict: PASS (action PROCEED) means the thesis is complete and bounded; WAIT (action HALT) means fields named in halt_reason could not be resolved, so clarify and re-audit; FAIL means do not execute as stated until the flagged defects are fixed.\nA verdict grades whether the reasoning is stated, falsifiable and bounded, not whether the trade will win.",
      "tools": [
        {
          "name": "check_thesis",
          "title": "Check a Trade Thesis for Free",
          "description": "FREE check of a trade thesis, no wallet and no payment. Send the thesis in the user's own words and say whether it is a prediction-market bet or a perp/spot trade. Returns PASS, WAIT or FAIL with the reasons, the same verdict the paid audit computes (same rules, same engine). It does NOT write a receipt: nothing is attested on-chain and nothing can be shown to a counterparty. For a receipt use verify_pm_trade or verify_perp_trade (2.00 USDC via x402). USE THIS TOOL when the user wants to test a thesis before trading and the client cannot pay, or before deciding whether a paid receipt is worth it. Shared daily limit across all callers; when it is used up the result says so. A verdict grades whether the reasoning is stated, falsifiable and bounded. It does not predict the outcome and is not advice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "kind": {
                "description": "prediction_market for a bet on a Kalshi or Polymarket style market; perp_or_spot for a perpetual or spot trade.",
                "enum": ["prediction_market", "perp_or_spot"],
                "type": "string"
              },
              "thesis": {
                "description": "The thesis in the user's own words: the venue and market or instrument, the side, the size or price, the reason, the source of any odds or data, and what would prove it wrong. Do not rewrite or improve it; the check reads what the user actually wrote.",
                "maxLength": 3500,
                "minLength": 20,
                "type": "string"
              }
            },
            "required": ["kind", "thesis"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "attested": {
                "description": "Always false: no receipt is written",
                "type": "boolean"
              },
              "flags": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "free": {
                "description": "Always true: this tool never charges",
                "type": "boolean"
              },
              "risk_score": {
                "type": "number"
              },
              "status": {
                "description": "OK (a verdict follows), LIMIT_REACHED (free checks used up for today) or UNAVAILABLE",
                "type": "string"
              },
              "unknown_fields": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "verdict": {
                "description": "PASS, WAIT, FAIL, or REFUSED_SCOPE when the thesis was sent as the wrong kind",
                "type": "string"
              },
              "verdict_hash": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["free", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0e54e2474cb68634f07ac37aa701df7c4deb55ab939f5c3723c7c5e0fa90912a"
        },
        {
          "name": "query_agent_trust",
          "title": "Query Agent Trust Score",
          "description": "Query an agent's DJZS trust score, aggregated on-chain (Base mainnet) from its audit history and indexed via the DJZS subgraph. USE BEFORE delegating work, releasing escrow, or executing agent transactions. Returns scored_audits, pass/fail counts, the raw fail rate, and a Wilson 95% lower bound on it, plus latest verdict/risk and DJZS-S01/DJZS-X01 flag counts. WAIT verdicts are abstentions: they are excluded from BOTH the numerator and the denominator of the fail rate and are reported separately as wait_count. Below 10 scored audits the tool returns INSUFFICIENT_HISTORY and NO rate - a 0-of-0 record is not evidence of reliability and must not compare as better than a 3-of-50. This tool returns evidence, not a decision: it applies no threshold and emits no HALT. Interpreting the bound against your own risk tolerance is the caller's job.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agentAddress": {
                "description": "Wallet address of the agent whose audit record you want, such as a counterparty you are about to delegate work to or pay",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["agentAddress"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "action": {
                "type": "string"
              },
              "agent": {
                "description": "The queried address, lowercased",
                "type": "string"
              },
              "detail": {
                "type": "string"
              },
              "fail_count": {
                "type": "number"
              },
              "fail_rate": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "FAIL / scored_audits; null below the minimum history"
              },
              "fail_rate_lower_bound_95": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Wilson 95% lower bound on the fail rate"
              },
              "flag_counts": {
                "additionalProperties": {
                  "type": "number"
                },
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "interpretation": {
                "type": "string"
              },
              "latest_risk_score": {
                "type": "number"
              },
              "latest_verdict": {},
              "message": {
                "type": "string"
              },
              "pass_count": {
                "type": "number"
              },
              "scored_audits": {
                "description": "PASS plus FAIL audits; WAIT is excluded",
                "type": "number"
              },
              "status": {
                "description": "no_history, INSUFFICIENT_HISTORY (under 10 scored audits, no rate returned) or OK",
                "type": "string"
              },
              "subgraph_counters": {
                "additionalProperties": {},
                "properties": {},
                "type": "object"
              },
              "total_audits": {
                "type": "number"
              },
              "trust": {
                "type": "string"
              },
              "wait_count": {
                "type": "number"
              }
            },
            "required": ["agent", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
