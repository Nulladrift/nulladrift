        {
          "name": "query_pol_certificates",
          "title": "Query DJZS ProofOfLogic Certificates",
          "description": "Query immutable ProofOfLogic certificates stored on Irys Datachain by DJZS Protocol. USE THIS TOOL when you need to verify audit history for an agent or project before delegating work, check FAIL verdicts, or retrieve certificates by Irys tx ID. DO NOT use for on-chain trust scores — use query_agent_trust for those.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "from_ms": {
                "description": "Start of the search window, as Unix time in milliseconds. When omitted the server searches the last 14 days, then the last 3 days if the wider search fails; set it to reach older certificates, and it is used as given",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "limit": {
                "default": 20,
                "description": "Maximum number of certificates to return, newest first",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "targetSystem": {
                "description": "Return only certificates whose Target-System tag equals this agent or project identifier (a project name or wallet address), matched exactly as written on the certificate",
                "type": "string"
              },
              "tier": {
                "description": "Return only certificates carrying this tier tag",
                "enum": ["micro", "founder", "treasury"],
                "type": "string"
              },
              "to_ms": {
                "description": "End of the search window, as Unix time in milliseconds. When omitted it is one hour after the current time",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "verdict": {
                "description": "Return only certificates with this audit outcome",
                "enum": ["PASS", "FAIL"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "certificates": {
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "audit_id": {
                      "type": "string"
                    },
                    "corrections": {
                      "description": "Correction Records anchored against this certificate",
                      "items": {},
                      "type": "array"
                    },
                    "irys_id": {
                      "description": "Irys transaction id of the certificate",
                      "type": "string"
                    },
                    "irys_url": {
                      "description": "Gateway URL to fetch the full certificate",
                      "type": "string"
                    },
                    "target_system": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Signed identifier, unverified:<value>, or null"
                    },
                    "target_system_verified": {
                      "type": "boolean"
                    },
                    "tier": {
                      "type": "string"
                    },
                    "timestamp": {
                      "description": "Index timestamp as returned by Irys"
                    },
                    "verdict": {
                      "description": "PASS, FAIL, WAIT, or unknown",
                      "type": "string"
                    }
                  },
                  "required": ["audit_id", "corrections", "irys_id", "irys_url", "target_system", "target_system_verified", "tier", "timestamp", "verdict"],
                  "type": "object"
                },
                "type": "array"
              },
              "fail_count": {
                "type": "number"
              },
              "notes": {
                "additionalProperties": {
                  "type": "string"
                },
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "other_verdict_count": {
                "description": "Certificates whose verdict is none of PASS, FAIL, WAIT",
                "type": "number"
              },
              "pass_count": {
                "type": "number"
              },
              "target_system_unverified_count": {
                "description": "Certificates whose target_system carries the unverified: prefix",
                "type": "number"
              },
              "total_returned": {
                "description": "Number of certificates in this response",
                "type": "number"
              },
              "wait_count": {
                "type": "number"
              },
              "window": {
                "additionalProperties": {},
                "properties": {
                  "from_ms": {
                    "description": "Window start actually searched, Unix ms",
                    "type": "number"
                  },
                  "note": {
                    "type": "string"
                  },
                  "to_ms": {
                    "description": "Window end, Unix ms",
                    "type": "number"
                  }
                },
                "required": ["from_ms", "to_ms"],
                "type": "object"
              }
            },
            "required": ["certificates", "fail_count", "other_verdict_count", "pass_count", "target_system_unverified_count", "total_returned", "wait_count", "window"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
