        {
          "name": "verify_pm_trade",
          "title": "Verify Prediction-Market Trade",
          "description": "Deterministic pre-execution audit of a prediction-market trade thesis, run before capital is committed. USE THIS TOOL before opening, sizing, or increasing any prediction-market position, and whenever a user or an upstream agent asks whether a thesis is sound, carries a falsification condition, or has a sourced probability basis. Audits against the calibrated DJZS-M taxonomy (M01 narrative/resolution gap, M02 falsification absent, M03 probability unsourced, M04 consensus-as-edge advisory) and returns PASS->PROCEED, WAIT->HALT, or FAIL with the flagged defects and a reproducible verdict_hash. DO NOT use to retrieve past verdicts or certificates - use query_pol_certificates for those. DO NOT use for an agent's historical trust score - use query_agent_trust for that. DO NOT use for spot, perpetuals, or equities: out-of-scope submissions are refused WITHOUT CHARGE. Audit before act. Paid tool: 2 USDC per audit via x402 on Base.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agent_address": {
                "description": "Optional agent wallet (0x). If set, this audit updates that agent's on-chain DJZS trust score",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "intent": {
                "description": "The prediction-market bet as the user or upstream agent stated it, in plain text: the market, the side, the reason, the probability and where it comes from, the size, and what would prove the bet wrong. Send the original wording; the audit judges only what is written",
                "minLength": 10,
                "type": "string"
              },
              "target_system": {
                "description": "Agent or project name to record on the anchored certificate. It is stored ONLY when target_system_subject and target_system_signature are also sent and the signature verifies; otherwise it is DISCARDED, not stored",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "target_system_signature": {
                "description": "Signature by target_system_subject proving the claim: EIP-191 personal_sign over the text \"DJZS-TSC-1 target-system claim\\nsubject: <lowercased subject>\\ntarget_system: <value>\"",
                "pattern": "^0x[0-9a-fA-F]{130}$",
                "type": "string"
              },
              "target_system_subject": {
                "description": "Wallet address that signed the target_system claim; the server checks that target_system_signature recovers to it",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["intent"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "action": {
                "description": "PROCEED for PASS, HALT for WAIT, FAIL for FAIL",
                "type": "string"
              },
              "disagreements": {},
              "extraction_failsafe": {
                "type": "boolean"
              },
              "fail_reason": {
                "type": "string"
