      "serverInfo": {
        "name": "fenlight",
        "title": "Fenlight",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Fenlight returns Google search results, forum discussions, local and shopping data, keyword ideas, brand footprints and what AI assistants answer about a brand, with the engine named on every result. initialize and tools/list are open; tools/call needs a Vera API key sent as 'Authorization: Bearer <key>', and each call is charged in credits for what it returned. New accounts get 3,000 free credits at vera.waggle.ae.",
      "tools": [
        {
          "name": "ai_answers",
          "title": "AI Answers and Brand Visibility",
          "description": "Put a buyer's question to an AI assistant that searches the live web, and see whether a brand and its competitors are named in the answer, in what rank, with the citations and cited domains behind it. The assistant is ChatGPT unless `engine` names claude, perplexity or gemini; an assistant the server has no key for answers not_configured and costs nothing. `samples` (1 to 5, default 1) asks the same question more than once, for a mention rate. Returns metrics per assistant, not the raw answers. Charged per call to the assistant at the price list in credits (see llms.txt), the same as POST /v1/ai/answers: the worst case is held first, only the calls made are charged, and a call where the assistant failed is charged nothing. Gemini, when it searches Google, is a base price plus a price for each distinct search query it runs (the model decides how many; up to 10 a call are held for, and a call is only made when that worst case fits in what is held): you are charged for the queries that ran.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "Brand name to look for in the answer",
                "title": "Brand",
                "type": "string"
              },
              "brand_domain": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The brand's domain, for example roasters.ae",
                "title": "Brand Domain"
              },
              "competitors": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Competitor names or domains to track",
                "title": "Competitors"
              },
              "country": {
                "default": "ae",
                "description": "Two-letter ISO country code of the market",
                "title": "Country",
                "type": "string"
              },
              "engine": {
                "default": "chatgpt",
                "description": "The assistant to ask",
                "enum": ["chatgpt", "claude", "perplexity", "gemini"],
                "title": "Engine",
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language tag of the market, for example en or ar",
                "title": "Language",
                "type": "string"
              },
              "prompt": {
                "description": "The question to put to the assistant, as a buyer would ask it",
                "title": "Prompt",
                "type": "string"
              },
              "samples": {
                "default": 1,
                "description": "Times the question is asked of the assistant",
                "maximum": 5,
                "minimum": 1,
                "title": "Samples",
                "type": "integer"
              }
            },
            "required": ["brand", "prompt"],
            "title": "ai_answersArguments",
            "type": "object"
