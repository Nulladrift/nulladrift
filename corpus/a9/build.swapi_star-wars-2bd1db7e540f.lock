{
  "lockfileVersion": 2,
  "subjects": {
    "build.swapi/star-wars": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://swapi.build/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "swapi.build",
        "title": "swapi.build",
        "version": "2.16.0"
      },
      "capabilities": {
        "logging": {},
        "prompts": {},
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {}
      },
      "instructions": "swapi.build serves Star Wars data from the six films of Episodes I-VI only:\npeople, films, planets, species, starships and vehicles. Read-only, no API key.\n\nWorkflow: sw_search to find an entity by name, then sw_get with the id at the end of its\nurl field. Relations (homeworld, films, characters, pilots...) are URLs: pass their names\nin sw_get's expand argument to get the related records in the same call. For a compact\nlist, pass fields to sw_list or sw_search, e.g. fields [\"name\"].\n\nThe id is a record id, not an episode number: FILMS id 1 is A New Hope (Episode IV).",
      "tools": [
        {
          "name": "sw_get",
          "description": "Gets one Star Wars entity by numeric record id and returns it as a JSON object. Take the id from the end of an entity's url field (from sw_search, sw_list or a relation URL). Ids are record ids, not episode numbers: FILMS id 1 is A New Hope (Episode IV). An unknown id returns a tool error, e.g. 'No films found with id 99'. Pass expand to get related records in the same call, e.g. [\"homeworld\", \"species\"]; name only the relations you need; * on a film can pass 50 KB.",
          "inputSchema": {
            "properties": {
              "expand": {
                "description": "Optional. Relations to embed, one level deep, under a final \"expanded\" key: PEOPLE homeworld, films, species, vehicles, starships; FILMS characters, planets, starships, vehicles, species; PLANETS residents, films; SPECIES homeworld, people, films; STARSHIPS and VEHICLES pilots, films; or [\"*\"] alone for all. Up to 8 names; an unknown name returns a tool error.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "id": {
                "description": "Numeric record id: the last segment of the entity's url field (1 in .../api/people/1).",
                "type": "integer"
              },
              "resource": {
                "description": "Resource type: PEOPLE, FILMS, PLANETS, SPECIES, STARSHIPS or VEHICLES. Any other value returns a tool error.",
                "enum": ["PEOPLE", "FILMS", "PLANETS", "SPECIES", "STARSHIPS", "VEHICLES"],
                "type": "string"
              }
            },
            "required": ["id", "resource"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Star Wars entity by id"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "anthropic/maxResultSizeChars": 100000
          },
          "digest": "sha256:aecb3c6a276419f9dd46e5a42a006a1a7ddbc897c2c0b7a8b79def66e7a69680"
        },
        {
          "name": "sw_list",
          "description": "Lists every entity of one Star Wars resource type as a JSON array (Episodes I-VI data). Responses are large (all 82 PEOPLE, about 38 KB); to find a single entity, prefer sw_search, then sw_get; for a compact index pass fields, e.g. [\"name\"] (about 5 KB).",
          "inputSchema": {
            "properties": {
              "fields": {
                "description": "Optional. Field names to keep in each entity (url is always kept), e.g. [\"name\"] (FILMS: [\"title\"]). Up to 24 names; an unknown name returns a tool error listing the valid ones. Omit for full entities.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "resource": {
                "description": "Resource type: PEOPLE, FILMS, PLANETS, SPECIES, STARSHIPS or VEHICLES. Any other value returns a tool error.",
                "enum": ["PEOPLE", "FILMS", "PLANETS", "SPECIES", "STARSHIPS", "VEHICLES"],
                "type": "string"
              }
            },
            "required": ["resource"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Star Wars resources"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "anthropic/maxResultSizeChars": 100000
          },
          "digest": "sha256:45b74f1d33190dba6da0365e488a54170daff08bb17efdaabf4bb0ec5cdd45bd"
        },
        {
          "name": "sw_random",
          "description": "Returns one random Star Wars entity of the given resource type as a JSON object. Each call can return a different entity, so it is not idempotent. Useful for demos and quizzes; to fetch a specific entity use sw_search or sw_get.",
          "inputSchema": {
            "properties": {
              "resource": {
                "description": "Resource type: PEOPLE, FILMS, PLANETS, SPECIES, STARSHIPS or VEHICLES. Any other value returns a tool error.",
                "enum": ["PEOPLE", "FILMS", "PLANETS", "SPECIES", "STARSHIPS", "VEHICLES"],
                "type": "string"
              }
            },
            "required": ["resource"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Random Star Wars entity"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7a5465ea821efa929a8a44c4f7888293d0741eda2509b44735e06e8b9081b440"
        },
        {
          "name": "sw_search",
          "description": "Start here. Finds Star Wars entities by name (title for FILMS) with a case-insensitive substring match: 'sky' finds Luke, Anakin and Shmi Skywalker. Returns a JSON array of full entities; an empty array [] means no match; pass fields to shorten each entity. The id to pass to sw_get is the last segment of each entity's url field. Data covers Episodes I-VI only.",
          "inputSchema": {
            "properties": {
              "fields": {
                "description": "Optional. Field names to keep in each entity (url is always kept), e.g. [\"name\"] (FILMS: [\"title\"]). Up to 24 names; an unknown name returns a tool error listing the valid ones. Omit for full entities.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "query": {
                "description": "Name or title fragment, case-insensitive (e.g. 'falcon', 'hope').",
                "type": "string"
              },
              "resource": {
                "description": "Resource type: PEOPLE, FILMS, PLANETS, SPECIES, STARSHIPS or VEHICLES. Any other value returns a tool error.",
                "enum": ["PEOPLE", "FILMS", "PLANETS", "SPECIES", "STARSHIPS", "VEHICLES"],
                "type": "string"
              }
            },
            "required": ["query", "resource"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Star Wars resources"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "anthropic/maxResultSizeChars": 100000
          },
          "digest": "sha256:02867e38c28f052a58d978a00e754a15bf4241d56fd24f95e528bea2a619b5fb"
        }
