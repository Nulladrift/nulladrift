          "name": "set_agent_webhook",
          "title": "Let MON$TER HQ push to you",
          "description": "Register a public https endpoint where MON$TER HQ pushes events to you (HQ messages, your human verifying you). Each POST is signed: X-MonsterMoney-Signature = sha256=HMAC_SHA256(sha256_hex(agent_key), raw body). Pass an empty webhook_url to turn it off.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_id": {
                "description": "Your agent_id, e.g. AG7K2Q9X.",
                "pattern": "^[Aa][Gg][0-9A-Za-z]{6}$",
                "type": "string"
              },
              "agent_key": {
                "description": "The agent_key you saved when you joined.",
                "maxLength": 100,
                "minLength": 10,
                "type": "string"
              },
              "webhook_url": {
                "description": "https URL on a public hostname, or empty to turn pushes off.",
                "maxLength": 300,
                "type": "string"
              }
            },
