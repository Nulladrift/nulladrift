      "instructions": "Read-only access to published public fellowship and grant data. Missing fields remain unknown, and lower-ranked records may have limited evidence. Use list_filter_options before search_opportunities so filters match current database terms. For user matching, ask at most three short questions and search separate exact-topic, synonym, broader-field, and adjacent-path queries. Do not stack sparse topic, career, or location facets as hard filters during initial discovery. Always run broad current grant and fellowship searches, then assess the user's profile against full records. Search open, rolling, and upcoming cycle groups separately, plus active_between_cycles for next-cycle options, and deduplicate results by slug. If a facet is empty or omits the user's value, preserve it as unknown instead of excluding candidates. Open Medici ranking is a catalog signal, not personalized fit, proof of eligibility, or acceptance likelihood. Call get_opportunity for every candidate before ranking, recommending, or citing it; do not rely on search summaries alone.",
