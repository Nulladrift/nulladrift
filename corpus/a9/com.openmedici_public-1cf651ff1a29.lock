        {
          "name": "list_filter_options",
          "title": "List filter options",
          "description": "List current database-backed values for one public search facet. Use this before search_opportunities instead of guessing taxonomy terms. An empty facet or absent user value means public coverage is missing; it is not evidence that the user is ineligible, so do not turn it into a hard exclusion. Map filters to facets as follows: type→types, topic→topics, applicant→applicants, career→careers, audience→audiences, education→education, enrollment→enrollments, citizenship→citizenships, residence→residences, country→countries, destination→destinations, benefit→benefits, fundingShape→fundingShapes, durationUnit→durationUnits, openState→openStates, lifecycle→lifecycles.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "facet": {
                "description": "Plural facet catalog name corresponding to a search filter; see this tool's description for the exact mapping.",
                "enum": ["types", "lifecycles", "fields", "countries", "destinations", "careers", "topics", "applicants", "audiences", "benefits", "citizenships", "residences", "education", "enrollments", "fundingShapes", "durationUnits", "openStates"],
                "type": "string"
              },
              "limit": {
                "default": 50,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["facet"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "data": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "count": {
                      "type": "integer"
                    },
                    "label": {
                      "type": "string"
                    },
                    "value": {
                      "type": "string"
