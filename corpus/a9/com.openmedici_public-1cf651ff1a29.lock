        {
          "name": "search_opportunities",
          "title": "Search opportunities",
          "description": "Search published public fellowships, grants, scholarships, prizes, and funded residencies. For matching, start with separate broad calls for the exact topic, synonyms, broader fields, and type-only grants and fellowships. Do not stack sparse topic, career, and location filters during initial discovery. Array values are OR alternatives within one filter; separate filter fields are combined with AND. Search results are candidates only: call get_opportunity before ranking or citing each one.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ageMax": {
                "maximum": 150,
                "minimum": 0,
                "type": "number"
              },
              "ageMin": {
                "maximum": 150,
                "minimum": 0,
                "type": "number"
              },
              "applicant": {
                "description": "Use exact values returned by list_filter_options with facet=\"applicants\". Multiple values are OR alternatives within this filter; different filter fields are combined with AND.",
                "items": {
