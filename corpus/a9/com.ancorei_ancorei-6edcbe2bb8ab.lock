          },
          "digest": "sha256:3afaea08cfac9472924e4bfbdd69f33bd5de77ac4a8958f6ec04b2ff9b88944b"
        },
        {
          "name": "listar_cidades",
          "title": "Cidades com marinas",
          "description": "Lista as cidades com marinas na Ancorei, quantas há em cada uma e o link da página da cidade. Pode filtrar por UF.",
          "inputSchema": {
            "properties": {
              "uf": {
                "description": "Sigla do estado (opcional), ex.: SC",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cidades com marinas"
          },
