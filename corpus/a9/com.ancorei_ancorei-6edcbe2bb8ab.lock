      "serverInfo": {
        "name": "ancorei-marinas",
        "title": "Ancorei: guia de marinas do Brasil",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "A Ancorei (ancorei.com) é um guia brasileiro de marinas, iates clubes e garagens náuticas do litoral. Use buscar_marinas para achar marinas por cidade, UF, serviço ou texto, ficha_marina para os detalhes e listar_cidades para ver onde há marinas. Os dados são públicos e podem estar desatualizados: a reserva de vaga é feita falando direto com a marina (WhatsApp ou telefone), dizendo que viu na Ancorei. Ao responder, cite sempre o link da página da marina na Ancorei. Para passeio de barco (escuna, lancha, catamarã, veleiro) com reserva online, use passeios_de_barco.",
      "tools": [
        {
          "name": "buscar_marinas",
          "title": "Buscar marinas",
          "description": "Busca marinas, iates clubes e garagens náuticas do litoral brasileiro por cidade, UF, serviço, texto livre, se aceitam barco visitante e se têm WhatsApp. Devolve nome, tipo, cidade/UF, telefone, link de WhatsApp e a página da marina na Ancorei.",
          "inputSchema": {
            "properties": {
              "aceita_visitante": {
                "description": "true para só as marinas que recebem barco visitante",
                "type": "boolean"
              },
              "cidade": {
                "description": "Cidade, ex.: Florianópolis, Angra dos Reis, Búzios",
                "type": "string"
              },
              "com_whatsapp": {
                "description": "true para só as que têm WhatsApp confirmado",
                "type": "boolean"
              },
              "limite": {
                "description": "Quantos resultados (1 a 30, padrão 10)",
                "type": "integer"
              },
              "servico": {
                "description": "Combustível, restaurante, vestiários, segurança, rampa, guincho, Wi-Fi, energia, água, travel lift ou oficina",
                "type": "string"
              },
              "texto": {
                "description": "Nome, bairro, rua ou palavra livre, ex.: iate clube, Itajaí",
                "type": "string"
              },
              "uf": {
                "description": "Sigla do estado, ex.: SC, RJ, SP, BA",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Buscar marinas"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1a4114d07c91120e6a5e03823a3e30d912e1a743d9827d595daec3041e064b14"
        },
        {
          "name": "ficha_marina",
          "title": "Ficha de uma marina",
          "description": "Todos os dados públicos de uma marina a partir do id devolvido por buscar_marinas: endereço, coordenadas, serviços, canal VHF, telefone, WhatsApp, site, Instagram, página na Ancorei e como reservar.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "id da marina (slug), ex.: marina-laguna-marechal-deodoro",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Ficha da marina"
          },
          "behavior": {
            "destructive": false,
