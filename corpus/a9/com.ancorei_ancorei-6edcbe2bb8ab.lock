        {
          "name": "passeios_de_barco",
          "title": "Passeios de barco",
          "description": "Passeios de barco com reserva online (escuna, lancha, catamarã, veleiro) nas cidades do litoral brasileiro listadas na Ancorei: título, duração, nota, link para reservar e o guia da cidade. Use para 'passeio de barco em Paraty', 'o que fazer de barco em Búzios' etc.",
          "inputSchema": {
            "properties": {
              "cidade": {
                "description": "Cidade, ex.: Paraty, Angra dos Reis, Salvador",
                "type": "string"
