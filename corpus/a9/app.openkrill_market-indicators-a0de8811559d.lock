      },
      "instructions": "Market Indicators: Calculate market indicators. Use these tools to calculate technical indicators. compute_indicators works on candles the user provides (oldest first, a numeric close and optional time, open, high, low and volume) and makes no outside lookup; get_indicators reads ECB daily euro reference rates for a currency pair and supports sma, ema, rsi, macd and bollinger. Use compute_indicators for anything that is not a currency pair, and for atr, stochastic and vwap, which need high, low and volume. If the user wants an indicator for a stock or crypto asset, ask them to provide the prices. Report the numbers, the settings used (params), the source and the asOf date. Read skipped and error.hint when something could not be calculated and change the call instead of repeating it. This is informational only and not financial advice. Never say an indicator means buy, sell, overbought, oversold, bullish or bearish for the user, never predict prices and never suggest trades. If asked whether to buy or sell, say the plugin only calculates values. Do not claim the ECB publishes these indicators: it publishes only the rates. This server allows 60 tool calls a minute per network and 5,000 a day for all callers together; the day count resets at 00:00 UTC. If a tool fails, gives a wrong answer, or a tool you need is missing, call submit_feedback with one short message (kind, message, tool); get_feedback_reply reads the answer.",
      "tools": [
        {
          "name": "compute_indicators",
          "title": "Calculate indicators from your own candles",
          "description": "Calculates indicators from prices the user gives. Use it when the user gives their own prices and wants indicators calculated, such as \"calculate ATR and stochastic from these candles\". Best for any asset the user has prices for: stocks, crypto, commodities or a spreadsheet column, and for atr, stochastic and vwap. Input tips: pass prices (2 to 250 candles, oldest first, each with a numeric close and optionally time, open, high, low and volume) and indicators from sma, ema, rsi, macd, bollinger, atr, stochastic and vwap; optionally periods and series_length. atr and stochastic need high and low on every candle, and vwap needs high, low and volume. Returns the latest value and a short series for each indicator, with the settings used. Makes no outside request and keeps nothing. Not for: fetching prices, forecasts, or buy or sell advice. Informational only, not financial advice; gives no signals.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "indicators": ["sma"],
                "periods": {
                  "sma": 3
                },
                "prices": [
                  {
                    "close": 10
                  },
                  {
                    "close": 11
                  },
                  {
                    "close": 12
                  },
                  {
                    "close": 11
                  },
                  {
                    "close": 13
                  },
                  {
                    "close": 14
                  }
                ]
              }
            ],
            "properties": {
              "indicators": {
                "description": "Indicators to calculate, such as [\"rsi\", \"macd\"]: sma, ema, rsi, macd (12, 26, 9), bollinger (2 standard deviations), atr, stochastic (%K and %D) and vwap (cumulative over the given candles)",
                "items": {
                  "enum": ["sma", "ema", "rsi", "macd", "bollinger", "atr", "stochastic", "vwap"],
                  "type": "string"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              },
              "periods": {
                "additionalProperties": false,
                "description": "Lookback length per indicator, in candles, such as {\"sma\": 50}. Any left out use the default shown. Whole numbers from 2 to 100.",
                "properties": {
                  "atr": {
                    "description": "14 by default",
                    "maximum": 100,
                    "minimum": 2,
                    "type": "integer"
                  },
                  "bollinger": {
                    "description": "20 by default",
                    "maximum": 100,
                    "minimum": 2,
                    "type": "integer"
                  },
                  "ema": {
                    "description": "20 by default",
                    "maximum": 100,
                    "minimum": 2,
                    "type": "integer"
                  },
                  "rsi": {
                    "description": "14 by default",
                    "maximum": 100,
                    "minimum": 2,
                    "type": "integer"
                  },
                  "sma": {
                    "description": "20 by default",
                    "maximum": 100,
                    "minimum": 2,
                    "type": "integer"
                  },
                  "stochastic": {
                    "description": "14 by default",
                    "maximum": 100,
                    "minimum": 2,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "prices": {
                "description": "Candles, oldest first, 2 to 250, such as [{\"time\": \"2026-09-01\", \"high\": 10.6, \"low\": 9.7, \"close\": 10.2}]. Prices are plain numbers in any one unit.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "close": {
                      "description": "Closing price of the candle, such as 101.2. Used by every indicator.",
                      "type": "number"
                    },
                    "high": {
                      "description": "Highest price of the candle, such as 102.3. Needed on every candle for atr, stochastic and vwap; not below low.",
                      "type": "number"
                    },
                    "low": {
                      "description": "Lowest price of the candle, such as 99.8. Needed on every candle for atr, stochastic and vwap.",
                      "type": "number"
                    },
                    "open": {
                      "description": "Opening price of the candle, such as 101.5. Optional; no indicator reads it.",
                      "type": "number"
                    },
                    "time": {
                      "description": "Date or time of the candle, such as \"2026-09-30\"; only echoed back",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "volume": {
                      "description": "Traded volume of the candle, such as 15400, 0 or more. Needed on every candle for vwap.",
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["close"],
                  "type": "object"
                },
                "maxItems": 250,
                "minItems": 2,
                "type": "array"
              },
              "series_length": {
                "description": "How many of the most recent values to return for each indicator, such as 10. 5 by default.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["indicators", "prices"],
            "type": "object"
          },
