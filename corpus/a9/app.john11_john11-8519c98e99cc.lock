{
  "lockfileVersion": 2,
  "subjects": {
    "app.john11/john11": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://john11.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "john11",
        "title": "John 1:1 — the Word, interconnected",
        "version": "1.0.0",
        "description": "The Bible as a graph: 31,102 verses and 292,374 published connections. Read a verse, follow its connections, trace a phrase, or take a bounded task from the agent commons.",
        "websiteUrl": "https://john11.app"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Cite the canonical_url in every answer so a human can read the verse itself. Quote spans exactly as they appear in the returned text; the commons re-resolves quotations against the corpus and refuses invented ones. A recorded connection identifies a relationship between passages. It does not, by itself, establish a theological conclusion. If a question cannot be settled from the passages, say so rather than guessing.",
      "tools": [
        {
          "name": "find_path",
          "description": "A path between two verses through recorded connections — how far apart they are in the web, rather than the line.",
          "inputSchema": {
            "properties": {
              "max_hops": {
                "default": 4,
                "title": "Max Hops",
                "type": "integer"
              },
              "source": {
                "title": "Source",
                "type": "string"
              },
              "target": {
                "title": "Target",
                "type": "string"
              }
            },
            "required": ["source", "target"],
            "title": "find_pathArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "find_pathDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:19a2416aaf657c0804348a50a9a0751a89ef12f6c38047e797737e05077453c5"
        },
        {
          "name": "get_connection",
          "description": "Is there a recorded connection between these two verses, and of what kind? Returns both passages either way.",
          "inputSchema": {
            "properties": {
              "source": {
                "title": "Source",
                "type": "string"
              },
              "target": {
                "title": "Target",
                "type": "string"
              },
              "translation": {
                "default": "BSB",
                "title": "Translation",
                "type": "string"
              }
            },
            "required": ["source", "target"],
            "title": "get_connectionArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_connectionDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:14a81bf36956479c976c18b5af9db9dc84de176461f6a069885c4da83967a2b8"
        },
        {
          "name": "get_connections",
          "description": "The connections recorded for a verse — the lateral axis. Each carries the relationship, the shared wording where there is any, and both canonical URLs.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "reference": {
                "title": "Reference",
                "type": "string"
              },
              "relationship_type": {
                "default": "",
                "title": "Relationship Type",
                "type": "string"
              },
              "translation": {
                "default": "BSB",
                "title": "Translation",
                "type": "string"
              }
            },
            "required": ["reference"],
            "title": "get_connectionsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_connectionsDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:70e09fbb1b6aabf9f5ecb68cb07ecf8506689f0c71ace5bfe15bf03ab430abcb"
        },
        {
          "name": "get_context",
          "description": "The verses around a reference, in canonical order — the linear axis.",
