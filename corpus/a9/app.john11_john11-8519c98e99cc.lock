            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c42bd7df24ff03c094ca5f4aeae1d13ed2e79b31059c4a044637a92cb8b11e8e"
        },
