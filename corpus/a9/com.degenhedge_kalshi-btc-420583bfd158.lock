        {
          "name": "kalshi_fee",
          "title": "Kalshi fee and breakeven",
          "description": "Kalshi's taker fee for an order on a Kalshi contract (selected balance precision; same single-fill estimate as https://degenhedge.com/tools/kalshi-fee-calculator/), the total cost, profit if it wins, loss if it loses and the win rate needed to break even. price_cents is in CENTS (95 = a 95-cent contract). KXBTC15M charges makers no fee.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "balance_precision": {
                "default": "0.01",
                "description": "Dollars: 0.01 non-direct member, 0.0001 direct member",
                "enum": ["0.01", "0.0001"],
                "type": "string"
              },
              "contracts": {
                "default": 1,
                "description": "Number of contracts",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              },
              "maker": {
                "default": false,
                "description": "true for a resting (maker) order",
                "type": "boolean"
              },
              "price_cents": {
                "description": "Contract price in cents, 0.1 to 99.9 (whole cents between 10 and 90)",
                "maximum": 99.9,
                "minimum": 0.1,
                "type": "number"
              }
            },
            "required": ["price_cents"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "breakeven_before_fees_pct": {
                "type": "number"
              },
              "breakeven_win_rate_pct": {
                "description": "Win rate needed to break even after the fee",
                "type": "number"
              },
              "disclaimer": {
                "type": "string"
              },
              "entry_price_bucket": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "fee_cents": {
                "description": "Model fee plus balance rounding, in cents; may be fractional.",
                "type": "number"
              },
              "fee_per_contract_cents": {
                "type": "number"
              },
              "fee_rule": {
                "type": "string"
              },
              "fee_schedule": {
