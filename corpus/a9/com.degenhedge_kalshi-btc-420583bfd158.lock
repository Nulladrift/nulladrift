                      {
                        "type": "number"
                      },
                      {
                        "type": "string"
                      }
                    ]
                  },
                  "fee_type": {
                    "type": "string"
                  },
                  "live": {
                    "type": "boolean"
                  },
                  "source": {
                    "type": "string"
                  },
                  "stale": {
                    "type": "boolean"
                  }
                },
                "required": ["fee_multiplier", "fee_type", "live"],
                "type": "object"
              },
              "input": {
                "properties": {
                  "balance_precision_dollars": {
                    "enum": ["0.01", "0.0001"],
                    "type": "string"
                  },
                  "contracts": {
                    "type": "integer"
                  },
                  "order": {
                    "enum": ["taker", "maker"],
                    "type": "string"
                  },
                  "price_cents": {
                    "description": "Normalised price (tenths of a cent; whole cents between 10 and 90)",
                    "type": "number"
                  }
                },
                "required": ["contracts", "order", "price_cents"],
                "type": "object"
              },
              "loss_if_lose_cents": {
                "type": "number"
              },
              "matches": {
