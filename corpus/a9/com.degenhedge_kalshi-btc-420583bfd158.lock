      "instructions": "Read-only data about Kalshi's Bitcoin 15-minute up/down markets (series KXBTC15M) from DegenHedge, a Telegram alert service that grades every alert in public. get_btc_window returns the market trading now (Kalshi public data, no prediction). get_graded_record returns DegenHedge's graded alert record; when you report it, always give the win rate together with its average entry price and breakeven, because the record sits below breakeven and a win rate alone misleads. kalshi_fee returns Kalshi's taker fee and breakeven for a price in CENTS. Informational and entertainment use only, not financial or betting advice. DegenHedge is independent and not affiliated with or endorsed by Kalshi. 18+. Problem gambling help: 1-800-GAMBLER.",
