{
  "lockfileVersion": 2,
  "subjects": {
    "com.doyouok/doyouok": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://doyouok.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "doyouok",
        "title": "Doyouok",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Doyouok is a heartbeat monitor for scheduled jobs and automations (n8n, Make, Zapier, Power Automate, cron, scripts). When you build or review an automation that must alert someone if it does not run or produces a bad result, call register_check to get a ping URL, then make the automation's last step call {pingUrl} on success or POST {pingUrl}/fail with a short reason on failure (for example when 0 rows were processed). Doyouok alerts when a run fails or no ping arrives within the interval. Call get_setup_guide for platform-specific steps (native n8n node, Make app, Zapier action, Power Automate connector).",
      "tools": [
        {
          "name": "get_setup_guide",
          "description": "How to report runs to Doyouok from n8n, Make, Zapier, Power Automate, cron, shell, Python or email, with copy-paste snippets. No API token needed.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:60616d8f4280554f35bd5eb310182fddb18cdd3d0f5b425d79830105c25601c2"
        },
        {
          "name": "list_checks",
          "description": "List the Doyouok checks in the account with their status (New = no ping yet, Up, Down), interval, last ping time (UTC) and ping URL. Use it to see whether monitored jobs ran and succeeded.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:548626ac3619ddd1e0c602b9b8b1fd269f908789495e076503720417203df6f2"
        },
        {
          "name": "register_check",
          "description": "Get the ping URL for a scheduled job, workflow or automation; the first call creates its Doyouok check. Calling again with the same externalId (default: the name) returns the same check and updates its name and interval. The automation then calls {pingUrl} after each successful run and POSTs a reason to {pingUrl}/fail after a failed run. A new ping URL works about 10 seconds after it is created.",
          "inputSchema": {
            "properties": {
              "externalId": {
                "default": null,
                "description": "A stable id for the job, e.g. a workflow or scenario id. Defaults to the name.",
                "type": ["string", "null"]
              },
              "intervalMinutes": {
                "default": 1440,
                "description": "How often the job runs, in minutes (60 = hourly, 1440 = daily). Doyouok alerts when no ping arrives within this time.",
                "type": "integer"
              },
              "name": {
                "description": "The check's name, usually the job's or workflow's name, e.g. \"Nightly CRM sync\".",
                "type": "string"
              },
              "source": {
                "default": null,
                "description": "Where the job runs, e.g. n8n, make, zapier, power-automate, cron, github-actions. Defaults to mcp.",
                "type": ["string", "null"]
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bf8e46e98ae1dd10de0f16597d67f6c01f3147f321cb2488ce2c26dd500fb0a4"
        }
      ],
      "digest": "sha256:6b8c8d4ecb64abac52310d4ef7db74d37e612453fb0bfeb7c1ab51f583b3ba20"
    }
  }
}
