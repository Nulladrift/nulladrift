        {
          "name": "search_homes",
          "title": "Search homes",
          "description": "Use this when the user wants to find homes for sale or to rent in the UK. Give a place (town, area, street or postcode) and any budget, bedrooms or type they mention. Put what they want from the home or area in their own words in `wishes` (for example \"a garden\", \"walk to a station\", \"good primary schools nearby\", \"within 45 minutes of King's Cross\"); homes are then ranked by fit, each with a 0-100 match score and the evidence behind it (station and school distances, advertised features). Put a physical feature they insist on and an advert would state (\"garage\", \"annexe\") in `must_haves`; anything about lifestyle or the area (\"near the sea\", \"wild swimming\", \"good schools\") always goes in `wishes`. Returns up to 10 homes with price, bedrooms, agent and a link, and for each home what is nearby: the nearest primary and secondary schools with their Ofsted grade, station, park, GP surgery, supermarket and broadband.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "buy_or_rent": {
                "description": "Default buy.",
                "enum": ["buy", "rent"],
                "type": "string"
              },
              "limit": {
                "description": "Default 6.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "max_beds": {
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "max_price": {
                "description": "Pounds. For rent, per calendar month.",
                "type": "number"
              },
              "min_beds": {
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "min_price": {
                "description": "Pounds. For rent, per calendar month.",
                "type": "number"
              },
              "must_haves": {
                "description": "A physical feature the advert must state word for word, e.g. \"garage\". Never lifestyle or area wishes: those go in wishes.",
                "items": {
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "place": {
                "description": "One UK place: a town, city, district, county, region, national park, National Landscape, named coast, island or postcode, e.g. \"Harrogate\", \"Dorset\", \"the Lake District\", \"the South West\", \"the south coast\", \"Jersey\", \"LS6\", or a street with its town, e.g. \"Mill Road, Cambridge\". Each is searched as one whole area; a street shows the homes on it first, then those near it. \"near Totnes\" takes in about 3 miles around it.",
                "type": "string"
              },
              "property_type": {
                "enum": ["house", "flat", "bungalow", "land", "park home", "room"],
                "type": "string"
              },
              "sort": {
                "enum": ["best_match", "newest", "price_low", "price_high"],
                "type": "string"
              },
              "wishes": {
                "description": "What the user wants, in their words. Homes are ranked by how well they match.",
                "items": {
                  "maxLength": 200,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              }
            },
            "required": ["place"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "homes": {
                "items": {
                  "properties": {
                    "agent": {
