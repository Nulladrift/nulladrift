      "instructions": "MyPorta searches homes for sale and to rent across the UK and has Area Overviews for UK towns and villages. Prices are as advertised; a rent shows its period only when the advert states it. Homes found on an agent's own website link to that agent.",
      "tools": [
        {
          "name": "compare_homes",
          "title": "Compare homes",
          "description": "Use this when the user wants to compare two to four homes from search_homes results side by side: price, rooms, key facts, nearby schools with their Ofsted grade, station, park, GP surgery, supermarket, broadband and agent. Takes the homes' ids.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "home_ids": {
                "description": "Ids from search_homes.",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["home_ids"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "homes": {
                "items": {
                  "properties": {
                    "agent": {
                      "type": "string"
                    },
                    "also_listed_by": {
                      "description": "Other agents advertising the same home (same address, price and bedrooms), shown once.",
                      "items": {
                        "properties": {
                          "agent": {
                            "type": "string"
                          },
                          "url": {
                            "type": "string"
                          }
                        },
                        "required": ["agent", "url"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "area": {
                      "type": "string"
                    },
                    "baths": {
                      "type": "number"
                    },
                    "beds": {
                      "type": "number"
                    },
                    "facts": {
                      "description": "Key facts from the advert (compare_homes): tenure, council tax band, EPC rating, service charge, parking.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "id": {
                      "type": "string"
                    },
                    "image_url": {
                      "type": "string"
                    },
                    "local": {
                      "description": "What is near the home, measured by MyPorta: the nearest primary and secondary schools with their Ofsted grade when known, the nearest station, bus stop, park, GP surgery, pharmacy, supermarket and place of worship, and broadband. Distances are straight-line, in miles.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "local_note": {
                      "description": "Present when the distances in `local` were measured from the home's area, not its exact address.",
                      "type": "string"
                    },
                    "lookalike_note": {
                      "description": "When another home in these results has the same address line: what tells this one apart.",
                      "type": "string"
                    },
                    "match_score": {
                      "description": "0-100: how well the home fits the wishes given. Only when wishes were given.",
                      "type": "number"
                    },
                    "on_myporta": {
                      "description": "True when the full details are on MyPorta; false when the link goes to the agent.",
                      "type": "boolean"
                    },
                    "on_street": {
                      "description": "Street searches only: true for a home on the street asked for, false for one near it (listed after them).",
                      "type": "boolean"
                    },
                    "price": {
                      "description": "As advertised; a rent carries its period only when the advert states one.",
                      "type": "string"
                    },
                    "reasons": {
                      "description": "Evidence for the match, worded and measured as in `local`, e.g. \"Nearest primary school: Western Primary School, 0.1 miles (Ofsted: Outstanding)\", \"Garden · advertised\". A line ending \"area-level estimate\" was measured from the home's area.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "status": {
                      "description": "\"Available\", or what the agent says has happened: \"Sold STC\", \"Under offer\", \"Let agreed\". Homes no longer available are still shown, after the available ones.",
                      "type": "string"
                    },
                    "summary": {
                      "description": "The opening of the agent's advert, in the agent's words (compare_homes).",
                      "type": "string"
                    },
                    "title": {
                      "description": "Street and area, as the advert gives it.",
                      "type": "string"
                    },
                    "type": {
                      "description": "In plain words: house, detached house, flat, studio flat, maisonette, bungalow, land, park home or room. On a search for one type, the home is that type.",
                      "type": "string"
                    },
                    "url": {
                      "description": "The home's MyPorta page, or the agent's own page for a home found on the agent's website.",
                      "type": "string"
                    },
                    "why": {
                      "description": "The main reason this home matches the request, when a match was asked for.",
                      "type": "string"
                    }
                  },
                  "required": ["agent", "id", "on_myporta", "price", "title", "url"],
                  "type": "object"
                },
