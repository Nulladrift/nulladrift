                      "type": "object"
                    },
                    "reactionPath": {
                      "enum": ["IMMEDIATE_CONTINUATION", "INITIAL_REVERSAL", "FADE", "DELAYED_REACTION", "WHIPSAW", "NO_CLEAR_PATTERN"],
                      "type": "string"
                    },
                    "referencePeriod": {
                      "type": "string"
                    },
                    "releasedAt": {
                      "format": "date-time",
                      "type": "string"
                    },
                    "similarityQuality": {
                      "enum": ["EXACT_PATTERN", "STRONG", "PARTIAL"],
                      "type": "string"
                    },
                    "surpriseProfile": {},
                    "totalSurpriseDistance": {
                      "type": "number"
                    }
                  },
                  "required": ["directionMatchCount", "eventId", "reaction", "reactionPath", "referencePeriod", "releasedAt", "similarityQuality", "surpriseProfile", "totalSurpriseDistance"],
                  "type": "object"
                },
                "type": "array"
              },
              "coverage": {
                "properties": {
                  "analogEligibleEvents": {
                    "format": "int32",
                    "type": "integer"
                  },
                  "candidateHistoricalEvents": {
                    "format": "int32",
                    "type": "integer"
                  },
                  "candidateRange": {
                    "$ref": "#/$defs/CoveragePeriodRange"
                  },
                  "continuousCoverage": {
                    "$ref": "#/$defs/CoveragePeriodRange"
                  },
                  "eligibleRange": {
                    "$ref": "#/$defs/CoveragePeriodRange"
                  },
                  "eventsWithActuals": {
                    "format": "int32",
