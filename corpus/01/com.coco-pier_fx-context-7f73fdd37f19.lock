        {
          "name": "get_market_reaction",
          "title": "get_market_reaction",
          "description": "Retrieve deterministic post-event market reaction metrics for an economic release or monetary policy statement.\n\nSpecify the targetType, such as US_CPI, US_PCE (alias PCE), US_NONFARM_PAYROLLS (alias NFP), US_ISM_MANUFACTURING (alias ISM_MANUFACTURING), US_ISM_SERVICES (alias ISM_SERVICES), FEDERAL_RESERVE, ECB, BANK_OF_ENGLAND (alias BOE), or BANK_OF_JAPAN (alias BOJ).\n\nOptionally specify dateOrPeriod:\n- For US_CPI, US_PCE, US_NONFARM_PAYROLLS, and the ISM PMIs: reference period in YYYY-MM format (e.g. 2024-07). If omitted, the latest event is resolved.\n- For FEDERAL_RESERVE, ECB, BANK_OF_ENGLAND, or BANK_OF_JAPAN: statement date in YYYY-MM-DD format (e.g. 2024-08-01). If omitted, the latest statement is resolved.\n\nOptionally specify instrument: EURUSD, GBPUSD, or USDJPY (defaults to EURUSD).\n\nReturns deterministic price action metrics across 5 standardized post-event windows (M5, M15, H1, H4, H24) including startPrice, endPrice, returnPct, high, low, maxUpMovePct, maxDownMovePct, and rangePct.\n\nAll calculations are strictly deterministic and mathematical. This tool does not provide trading recommendations or predictive signals.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "dateOrPeriod": {
                "description": "Optional reference period (YYYY-MM for US_CPI, US_PCE, US_NONFARM_PAYROLLS, and the ISM PMIs) or statement date (YYYY-MM-DD for central banks). If omitted, the latest event is returned.",
                "type": "string"
              },
              "instrument": {
                "description": "Optional trading instrument: EURUSD, GBPUSD, or USDJPY. Defaults to EURUSD.",
                "type": "string"
              },
              "targetType": {
                "description": "Canonical target event type: US_CPI, US_PCE (alias PCE), US_NONFARM_PAYROLLS (alias NFP), US_ISM_MANUFACTURING (alias ISM_MANUFACTURING), US_ISM_SERVICES (alias ISM_SERVICES), FEDERAL_RESERVE, ECB, BANK_OF_ENGLAND (alias BOE), or BANK_OF_JAPAN (alias BOJ).",
                "type": "string"
              }
            },
            "required": ["targetType"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "calculatedAt": {
                "format": "date-time",
                "type": "string"
              },
              "coverageStatus": {
                "type": "string"
              },
              "eventTime": {
                "format": "date-time",
                "type": "string"
              },
              "freshness": {
                "properties": {
                  "latestAvailableEvent": {
                    "format": "date-time",
                    "type": "string"
                  },
                  "latestExpectedEvent": {
                    "format": "date-time",
                    "type": "string"
                  },
                  "missingExpectedStatement": {
                    "type": "boolean"
                  },
                  "status": {
                    "enum": ["CURRENT", "PENDING", "STALE", "UNKNOWN"],
                    "type": "string"
                  }
                },
                "required": ["missingExpectedStatement", "status"],
                "type": "object"
              },
              "instrument": {
                "type": "string"
              },
              "isComplete": {
                "type": "boolean"
              },
              "isSettled": {
                "type": "boolean"
              },
              "marketDataSource": {
                "type": "string"
              },
              "reactionCoverage": {
                "properties": {
                  "availableWindows": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "isSettled": {
                    "type": "boolean"
                  },
                  "status": {
                    "type": "string"
                  },
                  "unavailableWindows": {
                    "items": {
                      "properties": {
                        "boundary": {
                          "format": "date-time",
