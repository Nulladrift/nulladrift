                    "type": "integer"
                  }
                },
                "required": ["candidateEventsScanned", "eligibleHistoricalEvents", "historyComplete", "returnedAnalogs", "withMinimumSurpriseMetrics", "withReaction", "withValidConsensus"],
                "type": "object"
              },
              "eventType": {
                "type": "string"
              },
