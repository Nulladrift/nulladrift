        {
          "name": "get_event_context",
          "title": "get_event_context",
          "description": "Get the official actual values, pre-release market consensus, and surprise for a specific U.S. macro data release: CPI (US_CPI), Nonfarm Payrolls / jobs report (US_NONFARM_PAYROLLS), PCE inflation (US_PCE), or the ISM Manufacturing / Services PMI (US_ISM_MANUFACTURING / US_ISM_SERVICES).\n\nWHEN TO CALL: whenever the user asks what a release printed or how it compared with expectations, even if they do not mention FX Context. Do not answer these from memory; recent releases are not in your training data. Examples:\n- \"What's the latest US PCE?\" -> US_PCE\n- \"Was core PCE hotter than expected?\" -> US_PCE\n- \"Did CPI beat expectations?\" -> US_CPI\n- \"What was the latest NFP?\" / \"How many jobs were added last month?\" -> US_NONFARM_PAYROLLS\n- \"Give me the latest US inflation release.\" -> US_CPI and/or US_PCE\n- \"What's the latest ISM Manufacturing PMI?\" -> US_ISM_MANUFACTURING\n- \"Did ISM Services beat expectations?\" -> US_ISM_SERVICES\n- \"What were the actual and consensus values?\" / \"What was the surprise?\" -> the release under discussion\nOmit referencePeriod for the latest release. For a specific release, pass the month the data covers (YYYY-MM), not the month it was published.\n\nWHEN NOT TO CALL: general or educational questions that need no specific release data, e.g. \"What is PCE?\", \"What does NFP stand for?\", \"Why does CPI matter for FX?\", \"Explain inflation.\", \"What is the difference between CPI and PCE?\". Use get_upcoming_risks for upcoming release dates, get_market_reaction for price moves after a release, and get_central_bank_changes for central-bank decisions.\n\nRESULT: per-metric official actuals (headline/core, MoM/YoY; ISM: headline PMI index) with publisher provenance; when valid, pre-release consensus and a deterministic actual-minus-consensus surprise. Each observation has consensusStatus (AVAILABLE, NOT_FOUND, NOT_CAPTURED, NOT_AVAILABLE, EXCLUDED_POST_RELEASE, NOT_APPLICABLE) explaining any missing consensus, and revisionStatus (REVISED, UNCHANGED, NOT_CAPTURED). Consensus is valid only when capturedAt is before releaseCutoffAt. ISM (US_ISM_MANUFACTURING, US_ISM_SERVICES) currently returns official actuals only: consensusStatus is NOT_CAPTURED and no surprise is computed, so an ISM beat/miss question cannot be answered from this tool yet. Never treat missing consensus or surprise as zero. Official actuals and third-party consensus keep separate source provenance. No trading recommendations or market-direction predictions.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "eventType": {
                "description": "Canonical financial event type.\n\nSupported values:\nUS_CPI (Consumer Price Index; headline and core CPI)\nUS_NONFARM_PAYROLLS (NFP / jobs report; payrolls, unemployment rate, average hourly earnings)\nUS_PCE (PCE / core PCE price index)\nUS_ISM_MANUFACTURING (ISM Manufacturing PMI, headline index)\nUS_ISM_SERVICES (ISM Services PMI, headline index)\n\nUse these values exactly.",
                "type": "string"
              },
              "referencePeriod": {
                "description": "Optional reference period in YYYY-MM format (e.g. 2026-08). If omitted, the latest available event of that type is returned.",
                "type": "string"
              }
            },
            "required": ["eventType"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "SourceContextResponse": {
                "properties": {
                  "externalId": {
                    "type": "string"
                  },
                  "provider": {
                    "type": "string"
                  },
                  "retrievedAt": {
                    "format": "date-time",
                    "type": "string"
                  },
                  "uri": {
                    "type": "string"
                  }
                },
                "required": ["provider", "retrievedAt"],
                "type": "object"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "affectedCurrencies": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "category": {
                "type": "string"
              },
              "eventId": {
                "type": "string"
              },
              "eventType": {
                "type": "string"
              },
              "jurisdiction": {
                "type": "string"
              },
              "observations": {
                "items": {
                  "properties": {
                    "consensusStatus": {
                      "description": "Why the expectation block is present or absent: AVAILABLE, NOT_AVAILABLE, NOT_FOUND, NOT_CAPTURED, EXCLUDED_POST_RELEASE or NOT_APPLICABLE.",
                      "enum": ["AVAILABLE", "NOT_AVAILABLE", "NOT_FOUND", "NOT_CAPTURED", "EXCLUDED_POST_RELEASE", "NOT_APPLICABLE"],
                      "type": "string"
                    },
                    "consensusStatusDetail": {
                      "description": "Human-readable explanation of consensusStatus.",
                      "type": "string"
                    },
                    "derivationMethod": {
                      "type": "string"
                    },
                    "derivedActual": {
                      "type": "string"
                    },
                    "expectation": {
                      "properties": {
                        "capturedAt": {
                          "description": "When the consensus snapshot was captured; always before releaseCutoffAt.",
                          "format": "date-time",
                          "type": "string"
                        },
                        "consensus": {
                          "type": "string"
                        },
                        "releaseCutoffAt": {
                          "description": "Instant the consensus was validated against (capturedAt must be strictly earlier).",
                          "format": "date-time",
                          "type": "string"
                        },
                        "releaseCutoffBasis": {
                          "description": "Which event timestamp the cutoff came from: RELEASED_AT, or SCHEDULED_AT when the actual release time is not yet recorded.",
                          "type": "string"
                        },
                        "source": {
                          "$ref": "#/$defs/SourceContextResponse"
                        }
                      },
                      "required": ["capturedAt", "consensus", "source"],
                      "type": "object"
                    },
                    "metric": {
                      "type": "string"
                    },
                    "publishedAt": {
                      "format": "date-time",
                      "type": "string"
                    },
                    "reportedActual": {
                      "type": "string"
                    },
                    "revised": {
                      "type": "boolean"
                    },
                    "revisionStatus": {
                      "description": "Revision state supported by stored vintages: REVISED, UNCHANGED, or NOT_CAPTURED (only the initial vintage is stored; revision state unknown).",
                      "enum": ["REVISED", "UNCHANGED", "NOT_CAPTURED"],
                      "type": "string"
                    },
                    "surprise": {
                      "properties": {
                        "basis": {
                          "type": "string"
                        },
                        "derivedActual": {
                          "type": "string"
                        },
                        "direction": {
                          "type": "string"
                        },
                        "reportedActual": {
                          "type": "string"
                        },
                        "unit": {
                          "type": "string"
                        },
                        "value": {
                          "type": "string"
                        }
                      },
                      "required": ["direction", "unit", "value"],
                      "type": "object"
                    },
                    "unit": {
                      "type": "string"
                    },
                    "value": {
                      "type": "string"
                    },
                    "valueType": {
                      "type": "string"
                    },
                    "versionCount": {
                      "format": "int32",
                      "type": "integer"
                    }
                  },
                  "required": ["metric", "publishedAt", "revised", "unit", "value", "versionCount"],
                  "type": "object"
                },
                "type": "array"
              },
              "referencePeriod": {
                "type": "string"
              },
              "releasedAt": {
                "format": "date-time",
                "type": "string"
              },
              "scheduledAt": {
                "format": "date-time",
                "type": "string"
              },
              "source": {
                "$ref": "#/$defs/SourceContextResponse"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["affectedCurrencies", "category", "eventId", "eventType", "jurisdiction", "observations", "scheduledAt", "source", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": ""
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:93323f17a93480efd7a87a2e902ed4632287b26f051543931bf736ea6da5818b"
        },
        {
          "name": "get_historical_analogs",
          "title": "get_historical_analogs",
          "description": "Find and return individual historical macroeconomic releases whose surprise profiles are most similar to a selected target event.\n\nUse this CASE-RETRIEVAL tool when the user wants to identify, rank, inspect, or compare specific historical analog events.\n\nIt returns the matched events themselves, including event identity, similarity characteristics, surprise profile, and each event's observed post-release reaction.\n\nSupported event types: US_CPI and US_NONFARM_PAYROLLS across EURUSD, GBPUSD, and USDJPY. US_PCE is recognized but not yet publicly available: the historical PCE calibration corpus currently has too few usable periods, and a request for US_PCE returns a structured INSUFFICIENT_HISTORICAL_CALIBRATION error (with usable/required event counts) instead of analog results until the corpus grows.\n\nISM is not currently available here: US_ISM_MANUFACTURING and US_ISM_SERVICES have no verified pre-release consensus yet, so they return INSUFFICIENT_HISTORICAL_CALIBRATION rather than analogs. For ISM, use get_event_context for actuals and get_market_reaction for price moves.\n\nSimilarity methodology is event-specific: US_CPI uses headline/core surprise distance; US_NONFARM_PAYROLLS uses target-relative robust scale normalization (nfp-historical-analog-v1); US_PCE (once activated) uses the same raw surprise -distance approach as US_CPI (pce-historical-analog-v1).\n\nTarget period: if referencePeriod is omitted, the target is the most recent event of the requested type. Surprises are never estimated, so if that event has no verified pre-release consensus (common right after a new NFP release) the tool fails with NO_VERIFIED_PRE_RELEASE_EXPECTATION. The error details include targetReferencePeriod, latestReleasedPeriod, latestPeriodWithVerifiedExpectation and a hint; to analyze that prior period, retry with referencePeriod=YYYY-MM. Tell the user the newest release could not be analyzed rather than presenting the prior period as the latest.\n\nEvery \"cannot compute\" error has the same shape: \"CODE: reason [hint] details={json}\", where the JSON always contains code, eventType and hint.\n\nDo NOT use this tool when the user's primary question is about aggregate behavior across the analog sample; use get_historical_reaction_context instead.\n\nThe results are historical observations only and do not predict future price direction or provide trading recommendations.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "eventType": {
                "description": "Canonical target event type: US_CPI, US_NONFARM_PAYROLLS, US_PCE, US_ISM_MANUFACTURING, or US_ISM_SERVICES.",
                "type": "string"
              },
              "instrument": {
                "description": "Optional trading instrument: EURUSD, GBPUSD, or USDJPY. Defaults to EURUSD.",
                "type": "string"
              },
              "maxAnalogs": {
                "description": "Optional maximum number of individual analogs to return (range 3 to 30, default 10).",
                "format": "int32",
                "type": "integer"
              },
              "referencePeriod": {
                "description": "Optional reference period in YYYY-MM format (e.g. 2024-06 or 2026-08). If omitted, the most recent event is the target. Use it to analyze a prior period when the latest event has no verified pre-release expectation.",
                "type": "string"
              }
            },
            "required": ["eventType"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "CoveragePeriodRange": {
                "properties": {
                  "from": {
                    "type": "string"
                  },
                  "to": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "ReactionWindowType": {
                "enum": ["M5", "M15", "H1", "H4", "H24"],
                "type": "string"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "analogs": {
                "items": {
                  "properties": {
                    "comparableMetricCount": {
                      "format": "int32",
                      "type": "integer"
                    },
                    "directionMatchCount": {
                      "format": "int32",
                      "type": "integer"
                    },
                    "eventId": {
                      "type": "string"
                    },
                    "m5ToH1Persistence": {
                      "enum": ["PERSISTED", "REVERSED", "FADED", "UNCHANGED"],
                      "type": "string"
                    },
                    "reaction": {
                      "type": "object"
                    },
                    "reactionWindowStates": {
                      "items": {
                        "properties": {
                          "assessedAt": {
                            "format": "date-time",
                            "type": "string"
                          },
                          "boundary": {
                            "format": "date-time",
                            "type": "string"
                          },
                          "reason": {
                            "enum": ["MARKET_CLOSED", "MARKET_DATA_UNAVAILABLE", "PROVIDER_FAILURE"],
                            "type": "string"
                          },
                          "status": {
                            "enum": ["CALCULATED", "PENDING", "RETRYABLE", "TERMINAL_UNAVAILABLE"],
                            "type": "string"
                          },
                          "window": {
                            "$ref": "#/$defs/ReactionWindowType"
                          }
                        },
                        "required": ["assessedAt", "boundary", "status", "window"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "referencePeriod": {
                      "type": "string"
                    },
                    "releasedAt": {
                      "format": "date-time",
                      "type": "string"
                    },
                    "similarityQuality": {
                      "enum": ["EXACT_PATTERN", "STRONG", "PARTIAL"],
                      "type": "string"
                    },
                    "surpriseProfile": {},
                    "totalSurpriseDistance": {
                      "type": "number"
                    }
                  },
                  "required": ["comparableMetricCount", "directionMatchCount", "eventId", "reaction", "reactionWindowStates", "referencePeriod", "releasedAt", "similarityQuality", "surpriseProfile", "totalSurpriseDistance"],
                  "type": "object"
                },
                "type": "array"
