                  "missingExpectationPeriods": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "returnedAnalogs": {
                    "format": "int32",
                    "type": "integer"
                  }
                },
                "required": ["analogEligibleEvents", "candidateHistoricalEvents", "eventsWithActuals", "eventsWithMarketReaction", "eventsWithValidExpectations", "historyComplete", "returnedAnalogs"],
                "type": "object"
              },
              "eventType": {
                "type": "string"
              },
              "instrument": {
                "type": "string"
              },
              "reactionStatistics": {
                "type": "object"
              },
              "referencePeriod": {
                "type": "string"
              },
              "targetSurpriseProfile": {}
            },
            "required": ["aggregatePattern", "analogs", "coverage", "eventType", "instrument", "reactionStatistics", "referencePeriod", "targetSurpriseProfile"],
            "type": "object"
          },
