        {
          "name": "get_historical_reaction_context",
          "title": "get_historical_reaction_context",
          "description": "Summarize the aggregate post-event reaction pattern across historical macroeconomic events similar to a selected target release.\n\nUse this AGGREGATE-PATTERN tool when the user wants to understand what the historical analog sample collectively showed rather than inspect individual analog events.\n\nIt summarizes historical outcomes using statistics and behavioral patterns across standardized post-event windows (M5, M15, H1, H4, H24) such as mean, median, quantiles, directional consistency, reaction-path classification (e.g. IMMEDIATE_CONTINUATION, INITIAL_REVERSAL, FADE, DELAYED_REACTION), persistence, and sample-size-based confidence.\n\nSupported event types: US_CPI and US_NONFARM_PAYROLLS across EURUSD, GBPUSD, and USDJPY. ISM is not currently available here: US_ISM_MANUFACTURING and US_ISM_SERVICES have no verified pre-release consensus yet, so they return a structured INSUFFICIENT_HISTORICAL_CALIBRATION error rather than aggregate statistics.\n\nSimilarity methodology is event-specific: US_CPI uses headline/core surprise distance; US_NONFARM_PAYROLLS uses target-relative robust scale normalization (nfp-historical-analog-v1).\n\nTarget period: if referencePeriod is omitted, the target is the most recent event of the requested type. Surprises are never estimated, so if that event has no verified pre-release consensus (common right after a new NFP release) the tool fails with NO_VERIFIED_PRE_RELEASE_EXPECTATION. The error details include targetReferencePeriod, latestReleasedPeriod, latestPeriodWithVerifiedExpectation and a hint; to analyze that prior period, retry with referencePeriod=YYYY-MM. Tell the user the newest release could not be analyzed rather than presenting the prior period as the latest.\n\nEvery \"cannot compute\" error has the same shape: \"CODE: reason [hint] details={json}\", where the JSON always contains code, eventType and hint.\n\nDo NOT use this tool when the user's primary goal is to identify, rank, enumerate, or inspect specific historical analog events. For individual historical cases, use get_historical_analogs. When the user asks for both specific cases and collective pattern analysis, invoke both tools.\n\nThe results are deterministic empirical observations only and do not predict future prices or provide trading recommendations.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "eventType": {
                "description": "Canonical target event type: US_CPI, US_NONFARM_PAYROLLS, US_ISM_MANUFACTURING, or US_ISM_SERVICES.",
                "type": "string"
              },
              "instrument": {
                "description": "Optional trading instrument: EURUSD, GBPUSD, or USDJPY. Defaults to EURUSD.",
                "type": "string"
              },
              "limit": {
                "description": "Optional maximum number of similar historical events to include in aggregate analysis (range 3 to 30, default 10).",
                "format": "int32",
                "type": "integer"
              },
              "referencePeriod": {
                "description": "Optional reference period in YYYY-MM format (e.g. 2024-06 or 2026-08). If omitted, the most recent event is the target. Use it to analyze a prior period when the latest event has no verified pre-release expectation.",
                "type": "string"
              }
            },
            "required": ["eventType"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "CoveragePeriodRange": {
                "properties": {
                  "from": {
                    "type": "string"
                  },
                  "to": {
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "aggregatePattern": {
                "properties": {
                  "confidence": {
                    "enum": ["VERY_LOW", "LOW", "MODERATE", "HIGH"],
                    "type": "string"
                  },
                  "dominantWindow": {
                    "enum": ["M5", "M15", "H1", "H4", "H24"],
                    "type": "string"
                  },
                  "persistence": {
                    "type": "string"
                  },
                  "rationale": {
                    "type": "string"
                  },
                  "shortTermBias": {
                    "enum": ["POSITIVE", "NEGATIVE", "MIXED", "NEUTRAL"],
                    "type": "string"
                  }
                },
                "required": ["confidence", "persistence", "rationale", "shortTermBias"],
                "type": "object"
              },
              "analogs": {
                "items": {
                  "properties": {
                    "directionMatchCount": {
                      "format": "int32",
                      "type": "integer"
                    },
                    "eventId": {
                      "type": "string"
                    },
                    "persistence": {
                      "enum": ["PERSISTED", "REVERSED", "FADED", "UNCHANGED"],
                      "type": "string"
                    },
