        },
        {
          "name": "get_upcoming_risks",
          "title": "get_upcoming_risks",
          "description": "Retrieve known scheduled macroeconomic and central-bank risks that may affect a supported FX instrument within a future time window.\n\nUse this tool when the user asks what could move EURUSD, GBPUSD, or USDJPY, what macro risks are coming up, what is happening in the next 24 hours, this week, or over the next month, what upcoming macro risks or scheduled events exist, or when the next CPI, next NFP, next PCE, next ISM, next Fed, next ECB, next BoE, or next BoJ event occurs.\n\nThe supported risks are U.S. CPI releases, U.S. Nonfarm Payrolls releases, U.S. PCE inflation releases, ISM Manufacturing and Services PMI releases, Federal Reserve monetary-policy decisions, ECB monetary-policy decisions, Bank of England monetary-policy decisions, and Bank of Japan monetary-policy decisions.\n\nThe horizon can extend up to 720 hours (30 days). scheduleCoverage reports, for each supported event type, the latest known scheduled date and whether the known calendar covers the whole window. If scheduleCoverageComplete is false, some event types may have additional events in the window that are not yet known; say so instead of treating the list as complete.\n\nResults are based on official release calendars and contain scheduled events only. This tool does not predict market direction, include unscheduled news, or provide trading recommendations.\n\nIf no supported scheduled event exists within the requested horizon, an empty risk list is returned.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "horizonHours": {
                "description": "Future time window in hours. Defaults to 24. Maximum is 720 (30 days).",
                "format": "int32",
                "type": "integer"
              },
              "instrument": {
                "description": "FX instrument: EURUSD, GBPUSD, or USDJPY. Defaults to EURUSD.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "ScheduledEventType": {
                "enum": ["US_CPI", "US_NONFARM_PAYROLLS", "US_PCE", "US_ISM_MANUFACTURING", "US_ISM_SERVICES", "FEDERAL_RESERVE", "ECB", "BANK_OF_ENGLAND", "BANK_OF_JAPAN"],
                "type": "string"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "asOf": {
                "format": "date-time",
                "type": "string"
              },
              "horizonHours": {
                "format": "int32",
                "type": "integer"
              },
              "instrument": {
                "type": "string"
              },
              "risks": {
                "items": {
                  "properties": {
                    "affectedCurrencies": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "eventType": {
                      "$ref": "#/$defs/ScheduledEventType"
                    },
                    "importance": {
                      "enum": ["HIGH", "MEDIUM", "LOW"],
                      "type": "string"
                    },
                    "jurisdiction": {
                      "type": "string"
                    },
                    "minutesUntil": {
                      "format": "int64",
                      "type": "integer"
                    },
                    "reason": {
                      "type": "string"
                    },
                    "scheduledAt": {
                      "format": "date-time",
                      "type": "string"
                    },
                    "source": {
                      "properties": {
                        "externalId": {
                          "type": "string"
                        },
                        "provider": {
                          "type": "string"
                        },
                        "retrievedAt": {
                          "format": "date-time",
                          "type": "string"
                        },
                        "uri": {
                          "format": "uri",
                          "type": "string"
                        }
                      },
                      "required": ["externalId", "provider", "retrievedAt", "uri"],
                      "type": "object"
                    }
                  },
                  "required": ["affectedCurrencies", "eventType", "importance", "jurisdiction", "minutesUntil", "reason", "scheduledAt", "source"],
                  "type": "object"
                },
                "type": "array"
              },
              "scheduleCoverage": {
                "items": {
                  "properties": {
                    "coversWindow": {
                      "type": "boolean"
                    },
                    "eventType": {
                      "$ref": "#/$defs/ScheduledEventType"
                    },
                    "latestKnownScheduledAt": {
                      "format": "date-time",
                      "type": "string"
                    }
                  },
                  "required": ["coversWindow", "eventType"],
                  "type": "object"
                },
                "type": "array"
              },
              "scheduleCoverageComplete": {
                "type": "boolean"
              },
              "windowEnd": {
                "format": "date-time",
                "type": "string"
              }
            },
            "required": ["asOf", "horizonHours", "instrument", "risks", "scheduleCoverage", "scheduleCoverageComplete", "windowEnd"],
            "type": "object"
          },
