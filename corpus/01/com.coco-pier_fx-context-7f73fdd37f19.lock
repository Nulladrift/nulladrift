        {
          "name": "get_central_bank_changes",
          "title": "get_central_bank_changes",
          "description": "Compare a central bank monetary-policy statement with its immediately preceding comparable statement and return the material changes in policy language, economic assessment, risk balance, and forward guidance.\n\nSpecify a central bank such as FEDERAL_RESERVE, ECB, BANK_OF_ENGLAND (alias BOE), or BANK_OF_JAPAN (alias BOJ).\n\nOptionally specify currentStatementDate in YYYY-MM-DD format to compare a historical statement. If the date is omitted, the latest available statement is compared with the previous one.\n\nReturns structured, source-grounded policy changes including direction, materiality, and previous/current evidence.\n\nThis tool does not provide trading recommendations or predict market movements.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "centralBank": {
                "description": "Canonical central bank identifier: FEDERAL_RESERVE, ECB, BANK_OF_ENGLAND (alias BOE), or BANK_OF_JAPAN (alias BOJ).",
                "type": "string"
              },
              "currentStatementDate": {
                "description": "Optional publication date in YYYY-MM-DD format (e.g. 2024-07-31). If omitted, the latest available statement is compared with the previous one.",
                "type": "string"
              }
            },
            "required": ["centralBank"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "centralBank": {
                "type": "string"
              },
              "changes": {
                "items": {
                  "properties": {
                    "changeType": {
                      "enum": ["ADDED", "REMOVED", "STRENGTHENED", "SOFTENED", "REFRAMED", "UNCHANGED"],
                      "type": "string"
                    },
                    "currentQuote": {
                      "type": "string"
                    },
                    "direction": {
                      "enum": ["HAWKISH", "DOVISH", "NEUTRAL", "UNCHANGED", "UNCLEAR", "MIXED"],
                      "type": "string"
                    },
                    "materiality": {
                      "enum": ["HIGH", "MEDIUM", "LOW"],
                      "type": "string"
                    },
                    "previousQuote": {
                      "type": "string"
                    },
                    "summary": {
                      "type": "string"
                    },
                    "topic": {
                      "enum": ["POLICY_ACTION", "INFLATION", "GROWTH", "LABOR_MARKET", "FORWARD_GUIDANCE", "RISK_BALANCE", "POLICY_BIAS", "OTHER"],
                      "type": "string"
                    }
                  },
                  "required": ["changeType", "direction", "materiality", "summary", "topic"],
                  "type": "object"
                },
                "type": "array"
              },
              "currentPolicyAction": {
                "enum": ["HIKE", "CUT", "HOLD", "OTHER", "UNCLEAR"],
                "type": "string"
              },
              "currentPolicyBias": {
                "enum": ["HAWKISH", "DOVISH", "NEUTRAL", "MIXED", "UNCLEAR"],
                "type": "string"
              },
              "currentSourceUri": {
                "format": "uri",
                "type": "string"
              },
              "currentStatementDate": {
                "format": "date",
                "type": "string"
              },
              "currentStatementId": {
                "type": "string"
              },
              "degraded": {
                "type": "boolean"
              },
              "discardedChangeCount": {
                "format": "int32",
                "type": "integer"
              },
              "freshness": {
                "properties": {
                  "latestAvailableEvent": {
                    "format": "date-time",
                    "type": "string"
                  },
                  "latestExpectedEvent": {
                    "format": "date-time",
                    "type": "string"
                  },
                  "missingExpectedStatement": {
                    "type": "boolean"
                  },
                  "status": {
                    "enum": ["CURRENT", "PENDING", "STALE", "UNKNOWN"],
                    "type": "string"
                  }
                },
                "required": ["missingExpectedStatement", "status"],
                "type": "object"
              },
              "overallShift": {
                "enum": ["HAWKISH", "DOVISH", "MIXED", "UNCHANGED", "UNCLEAR"],
                "type": "string"
              },
              "previousSourceUri": {
                "format": "uri",
                "type": "string"
              },
              "previousStatementDate": {
                "format": "date",
                "type": "string"
              },
              "previousStatementId": {
                "type": "string"
              }
            },
            "required": ["centralBank", "changes", "currentPolicyAction", "currentPolicyBias", "currentSourceUri", "currentStatementDate", "currentStatementId", "overallShift", "previousSourceUri", "previousStatementDate", "previousStatementId"],
            "type": "object"
          },
