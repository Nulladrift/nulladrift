        },
        {
          "name": "search_opportunities",
          "title": "Search Federal Construction Opportunities",
          "description": "Search active federal construction and renovation contract opportunities from SAM.gov. Filter by US state, NAICS code, keyword, or contract value tier. Returns up to 50 results ordered by most recently published. This is a per-query search, not a bulk export.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "keyword": {
                "description": "Keyword or phrase to search in title and description, e.g. \"HVAC\", \"roofing\", \"design-build\"",
                "maxLength": 200,
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "Number of results to return (max 50)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "naics": {
                "description": "NAICS code, e.g. \"238220\" for plumbing",
                "maxLength": 20,
                "type": "string"
              },
              "state": {
                "description": "2-letter US state code, e.g. \"VA\", \"TX\", \"MI\"",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "tier": {
                "description": "Contract value tier: micro (<$50k), small ($50k-$250k), mid ($250k-$1M), large ($1M-$10M), major (>$10M)",
                "enum": ["micro", "small", "mid", "large", "major"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
