        },
        {
          "name": "list_states",
          "title": "Top States by Opportunity Volume",
          "description": "List the US states with the most active federal construction opportunities on RenovationRoute, ranked by volume, with the count per state. Returns the top states, not an exhaustive list of all 50.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
