      "tools": [
        {
          "name": "get_opportunity",
          "title": "Get Federal Opportunity Details",
          "description": "Get details for a specific federal opportunity by its SAM.gov notice ID: scope summary, deadline, location, agency, NAICS, set-aside, and value. Incumbent contractor, past-offer counts, contract ceiling, and win-probability scoring require a RenovationRoute account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "SAM.gov external notice ID (e.g. \"508-26-152\") or RenovationRoute UUID",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e057f563dc3c192cdd38899c218e667142220de9025f504f80a7c7daabaac93e"
        },
        {
          "name": "get_stats",
          "title": "Federal Opportunity Live Stats",
          "description": "Get a real-time snapshot of active federal construction opportunities tracked by RenovationRoute. Returns total count, top states by volume, and breakdown by contract value tier.",
