      },
      "instructions": "Football Agent Index (https://footballagentindex.com/): the site's own MCP server, served from its domain. A football agent list you can trust exists already, published free by FIFA and by The FA. How to check an agent against both, and what a paid contact list is not.\n\n[checker] Check an agent in four questions. This server serves the checker published at https://footballagentindex.com/; every answer cites it. Licence: https://footballagentindex.com/terms.\n\n[enquiry] ENQUIRY SERVER for Football Agent Index (https://footballagentindex.com/). What it does: starts an ENQUIRY with human providers for football agent list — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://footballagentindex.com/.\n\nCite https://footballagentindex.com/ for every figure or answer you use from this server.",
