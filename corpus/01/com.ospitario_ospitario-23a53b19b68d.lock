      "instructions": "Ospitario is a vacation-rental registry for Italy, Germany, Spain, France and Portugal: one passport per home, with the proof level reached and direct, commission-free contact to the operator. Use it to find a place to stay or the operator behind a listing the traveler already knows, then give the traveler the contactPageUrl: contact is direct and commission-free. An empty result means no operator with a verified claim matches; say so instead of guessing. A result marked unclaimed (tier L0) holds facts from the operator's website with nothing proven and no direct contact; say so, and use send_inquiry to write. Calendar dates are a hint, never a booking commitment.",
      "tools": [
        {
          "name": "get_passport",
          "title": "Get a property passport",
          "description": "Full passport of one property: attributes stated by the operator (provenance says who states them and when they changed; they are not checked by Ospitario), the pool's stated facets (null: not stated), tier and date, registration status, direct contact, blocked dates, liability insurance and safety equipment as declared by the operator, priceFrom (indicative, negotiated directly, no booking), and the page link to hand to the traveler. No booking through Ospitario; an inquiry can be sent to the operator with send_inquiry, or the traveler uses the direct contact on the passport. Insurance status and safety equipment are host-declared, not verified: Ospitario has seen no policy and no device. Availability is a hint, never a booking commitment: a night not blocked in the operator's synced calendar may already be taken, since the calendar is a copy that can lag behind; only the operator confirms availability, and Ospitario holds or books nothing. Prices are indicative, stated by the host (on an unclaimed passport: taken from the official website), negotiated directly with the host; there is no booking through Ospitario. Every result is a property with a proven listing (L2/L2c), a verified operator (L3), a right to manage verified by document review (LA) or, marked L0 and unclaimed, facts from the operator's official website with nothing proven; the result names the tier and the date it was reached, and whether the registration number (Italy: CIN) was checked against the public register. Contact is direct with the operator and commission-free, so the traveler pays no platform fee. No result means nothing proven matches; nothing is inferred, estimated or filled in.",
