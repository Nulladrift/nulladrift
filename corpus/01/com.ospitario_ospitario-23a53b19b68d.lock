                "type": "boolean"
              },
              "placeKind": {
                "description": "entire, private_room or shared_room; properties that did not state it are left out",
                "enum": ["entire", "private_room", "shared_room"],
                "type": "string"
              },
              "propertyKind": {
                "description": "Kind of building: apartment, house, villa, farmhouse, trullo, cottage, chalet, other; a property that did not state it is open (unknown: propertyKind), another kind leaves it out",
