                "type": "string"
              },
              "province": {
                "description": "Region code within the country, ISO 3166-2 without the prefix: IT/ES province (LE), FR département (75), DE Land (HH), PT distrito (11)",
                "maxLength": 3,
                "minLength": 1,
                "type": "string"
              },
              "radiusKm": {
                "description": "Radius around near or latitude/longitude in km, straight line, default 20. A passport counts at its published exact location, else at its municipality's centre (computed from Istat's boundaries), so a home just inside a municipality can lie a few km off; every hit names its distance and basis. Municipality centres computed by Ospitario from Istat, Confini delle unità amministrative a fini statistici al 1° gennaio 2026 (CC BY 4.0)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "region": {
                "description": "Italian region, by its Italian name or slug (Abruzzo, Basilicata, Calabria, Campania, Emilia-Romagna, Friuli-Venezia Giulia, Lazio, Liguria, Lombardia, Marche, Molise, Piemonte, Puglia, Sardegna, Sicilia, Toscana, Trentino-Alto Adige, Umbria, Valle d’Aosta, Veneto); the usual English, German, French, Spanish and Portuguese names are understood too (Apulia, Toskana). Italy only; matches the passport's province",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "stepFree": {
                "const": true,
                "description": "true: only properties whose operator states step-free access",
                "type": "boolean"
              },
              "to": {
                "description": "Checkout date YYYY-MM-DD; requires from",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["guests"],
            "type": "object"
          },
