        {
          "name": "search_properties",
          "title": "Search vacation rentals",
          "description": "Find vacation rentals in a municipality or region (Italy, Germany, Spain, France, Portugal) for a number of guests. Where: municipality, province, (Italy) region, or a radius around an Italian municipality (near) or a point (latitude/longitude), each hit with its straight-line distance; the order stays tier, then name, sort by distance yourself. Criteria: capacity, bedrooms, bathrooms, amenities (a fixed table of names incl. pool facets such as private or heated, otherwise exact), what is rented, pets allowed, highest indicative price and, with from/to, dates not blocked in the operator's synced calendar. A stated fact that contradicts a criterion always leaves the property out. Each hit lists the criteria a stated fact meets in matched and says match (every criterion met) or possible, with the open points in unknown: by default only availability on request and a heated pool's heating on the requested dates; with include_possible also any fact the operator did not state (no current calendar is never read as free). Ask the operator about every point in unknown before relying on it. At most 20 results, ordered by the strongest free tier, then name (with include_possible matches first); the paid tier L5 does not change the order. No ranking by anything else, no fuzzy matching. Each result has priceFrom (indicative, negotiated directly, no booking) and the next window not blocked in the operator's calendar. Availability is a hint, never a booking commitment: a night not blocked in the operator's synced calendar may already be taken, since the calendar is a copy that can lag behind; only the operator confirms availability, and Ospitario holds or books nothing. Prices are indicative, stated by the host (on an unclaimed passport: taken from the official website), negotiated directly with the host; there is no booking through Ospitario. Every result is a property with a proven listing (L2/L2c), a verified operator (L3), a right to manage verified by document review (LA) or, marked L0 and unclaimed, facts from the operator's official website with nothing proven; the result names the tier and the date it was reached, and whether the registration number (Italy: CIN) was checked against the public register. Contact is direct with the operator and commission-free, so the traveler pays no platform fee. No result means nothing proven matches; nothing is inferred, estimated or filled in.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amenities": {
                "description": "Every listed amenity must be present. These names match the operator's wording in any of the six languages through a fixed table: pool, wifi, parking, airConditioning (ac), garden, seaView, terrace, kitchen, washingMachine (washerDryer), bbq (outdoorGrill), heating, fireplace, balcony, tv, hotTub, elevator, crib, microwave, workspace. A pool can be asked with its facets: \"private pool\", \"shared pool\", \"heated pool\", \"indoor pool\", \"outdoor pool\" (or the same words in Italian, German, Spanish, Portuguese, French); a facet the operator did not state is unknown, not a match. Any other word must match an amenity exactly (case-insensitive).",
                "items": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "bathrooms": {
                "description": "Minimum number of bathrooms; a half bath counts 0.5",
                "maximum": 20,
                "minimum": 0,
                "multipleOf": 0.5,
                "type": "number"
              },
              "bedrooms": {
                "description": "Minimum number of bedrooms",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "children": {
                "const": true,
                "description": "true: only properties whose operator states that children are welcome",
                "type": "boolean"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 country code: IT, DE, ES, FR or PT",
                "enum": ["IT", "DE", "ES", "FR", "PT"],
                "type": "string"
              },
              "from": {
                "description": "Check-in date YYYY-MM-DD; requires to",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "guests": {
                "description": "Number of guests; properties with a lower capacity are left out",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "include_possible": {
                "description": "true: also return possible matches, where a requested fact is not stated (capacity, bedrooms, an amenity or pool facet, pets, price, current calendar) and nothing stated contradicts the request; each hit names the open points in unknown. Default false: only hits that meet every criterion, plus availability on request.",
                "type": "boolean"
              },
              "lang": {
                "description": "Language of labels in the result; defaults to en",
                "enum": ["it", "de", "en", "es", "pt", "fr"],
