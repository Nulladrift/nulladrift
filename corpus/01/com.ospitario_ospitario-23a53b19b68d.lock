        {
          "name": "send_inquiry",
          "title": "Send an inquiry to the operator",
          "description": "Send one inquiry from a traveler to the operator of a passport, by email through Ospitario (no booking, no payment, no commission). Two steps, and only with the traveler's consent: first call without code; Ospitario mails a six-digit code and a confirmation link to guest_email. Ask the traveler for the code, then call again with challengeId and code; if the traveler confirmed with the link instead, the inquiry is already sent and that call answers refused with reason used. The operator replies to the traveler's address directly. For an unclaimed passport (L0) this is the only way to write. Limits: 3 per traveler email and day, 10 per operator and day, identical messages once. When sent, the answer carries a reference that the operator's mail names too; give it to the traveler.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "challengeId": {
                "description": "From step 1; send it with code in step 2",
                "maxLength": 40,
                "minLength": 10,
                "type": "string"
              },
              "code": {
                "description": "The six-digit code the traveler received by email, for step 2",
                "pattern": "^\\d{6}$",
                "type": "string"
              },
              "from": {
                "description": "Check-in date YYYY-MM-DD; requires to",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "guest_email": {
                "description": "The traveler's email address; the operator replies there",
                "format": "email",
                "maxLength": 200,
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "guests": {
                "description": "Number of guests",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "lang": {
                "description": "Language of labels in the result; defaults to en",
                "enum": ["it", "de", "en", "es", "pt", "fr"],
                "type": "string"
              },
              "message": {
                "description": "The traveler's message to the operator, in the traveler's words",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              },
              "slug": {
                "description": "Passport slug from a search or lookup result",
                "pattern": "^[a-z0-9][a-z0-9-]{0,79}$",
                "type": "string"
              },
              "to": {
                "description": "Checkout date YYYY-MM-DD; requires from",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["guest_email", "guests", "message", "slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "challengeId": {
                "type": "string"
              },
              "reason": {
                "description": "Why nothing was sent: limits (3 per traveler and day, 10 per operator and day), the operator opted out, a repeated identical message, a wrong or expired code, used: already sent through the mail's confirmation link, delivery_failed: the mail server refused the mail (step 1: no code went out; step 2: the inquiry is recorded under reference but did not go out, the traveler may send it again), rate_limited: too many calls, try again in a minute",
                "enum": ["not_found", "opted_out", "guest_daily", "recipient_daily", "global_daily", "duplicate", "codes_daily", "no_recipient", "expired", "used", "too_many", "wrong", "invalid", "delivery_failed", "rate_limited"],
                "type": "string"
              },
              "reference": {
                "description": "With sent, or refused for delivery_failed: the inquiry's reference, also named in the operator's mail; quote it to the traveler and in any follow-up. Opaque, carries no personal data.",
                "type": "string"
              },
              "status": {
                "description": "code_sent: the code was handed to the mail server for guest_email; ask the traveler for it, then call again with challengeId and code (the traveler may confirm with the mail's link instead). sent: the inquiry was handed to the mail server for the operator, Reply-To the traveler; it is not a sign the operator read or answered it, and answers go to guest_email, not to Ospitario. Calling step 2 again with the same challengeId and code returns the same reference. refused: see reason",
                "enum": ["code_sent", "sent", "refused"],
                "type": "string"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
