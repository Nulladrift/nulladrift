          "description": "Resolve a listing link (Airbnb, Booking, Vrbo) to the operator's Ospitario passport, e.g. when a traveler wants to book a place they know directly. Exact match on the listing's own L2/L2c proof or found:false; never a list; a property verified only as an operator (L3) or an unclaimed passport (L0) is never returned for a link. The link is only parsed, never opened. Insurance status and safety equipment are host-declared, not verified: Ospitario has seen no policy and no device. Every result is a property with a proven listing (L2/L2c), a verified operator (L3), a right to manage verified by document review (LA) or, marked L0 and unclaimed, facts from the operator's official website with nothing proven; the result names the tier and the date it was reached, and whether the registration number (Italy: CIN) was checked against the public register. Contact is direct with the operator and commission-free, so the traveler pays no platform fee. No result means nothing proven matches; nothing is inferred, estimated or filled in.",
