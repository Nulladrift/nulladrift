      "serverInfo": {
        "name": "dimefax",
        "title": "Dimefax",
        "version": "0.1.0",
        "websiteUrl": "https://dimefax.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Dimefax sends faxes to any fax number in the US and Canada: 10¢ a page, no subscription, no account to create first.\nWhen the user wants to send a fax: get the fax number and the document, then call send_fax. It returns a link; give it to the user.\nThey check the fax there and pay (Apple Pay, Google Pay or card), or use page credits they already have, and the fax sends by itself.\nNothing is sent or charged until they do. Afterwards, fax_status tells you how it's going.\nIf they need to receive faxes or fax a lot: their own fax number is $5.99 for a week or $9.99 a month, and Unlimited sending and receiving is $19.99 a month, at dimefax.com/account.",
      "tools": [
        {
          "name": "fax_status",
          "title": "Check a fax",
          "description": "How a fax set up with send_fax is going: waiting for payment, sending, trying again, delivered, or why it didn’t go through.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "The code send_fax returned (the end of the link).",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a fax"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:52880e3df3b76a6aec409356d0a383de2e8c60f24c4b81568f6b15def976d1e1"
        },
        {
          "name": "send_fax",
          "title": "Send a fax",
          "description": "Send a fax to a US or Canada fax number with Dimefax (10¢ a page, no subscription, no account needed first). Give the document as base64 (PDF, PNG or JPEG), as a public https link to one, or as the plain text of a letter you wrote. This prepares the fax and returns a link for the user: they check it and pay (Apple Pay, Google Pay or card) or use page credits they already have, and it sends automatically. Nothing is sent or charged before that. If you can’t pass the file, call this with just the number: the user can add the document at the link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "document_base64": {
                "description": "The document, base64-encoded: a PDF, PNG or JPEG.",
                "type": "string"
              },
              "document_url": {
                "description": "A public https link to a PDF, PNG or JPEG.",
                "type": "string"
              },
              "text": {
                "description": "The text of a letter to fax, if there is no file. Dimefax sets it on letter-size pages.",
                "type": "string"
              },
              "to": {
                "description": "The fax number, US or Canada, e.g. \"(503) 555-0147\" or \"+15035550147\".",
                "type": "string"
              }
            },
            "required": ["to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send a fax"
