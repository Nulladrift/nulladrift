        {
          "name": "product_exposure",
          "title": "Product Exposure",
          "description": "CVE exposure of one vendor and product: severity, KEV and PoC counts, CVSS, EPSS, the worst risk score, the top CVEs and the endoflife.date support dates. To find the names, call the cpe_search tool.",
