        {
          "name": "password_check",
          "title": "Breached Password Check",
          "description": "Check a password's SHA-1 against Have I Been Pwned's Pwned Passwords list. It takes the full SHA-1, never the password. Only its first 5 hex digits leave this server.",
          "inputSchema": {
            "additionalProperties": false,
