              "vendor": {
                "description": "Exact vendor name as cpe_search lists it, e.g. apache",
                "maxLength": 128,
                "type": "string"
              },
              "version": {
                "description": "Product version, e.g. 22.21.1 or 11-24h2; picks the release cycle of eol",
