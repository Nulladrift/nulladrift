        },
        {
          "name": "package_check",
          "title": "Package Vulnerability Check",
          "description": "Check a package against the OSV.dev advisories (GitHub, Go, PyPA, RustSec) and the OpenSSF malicious package list, with the fixed version and endoflife.date dates. For severity, pass the CVE aliases to the cve_triage_bulk tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ecosystem": {
                "description": "npm, PyPI, Maven, Go, NuGet, RubyGems, crates.io, Packagist or SwiftURL. Case does not matter.",
                "maxLength": 16,
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Results per page",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Package name as the dependency file writes it, e.g. lodash, @babel/core, org.apache.logging.log4j:log4j-core, golang.org/x/net",
                "maxLength": 256,
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Results to skip; pass next_offset of the previous page",
                "minimum": 0,
                "type": "integer"
              },
              "version": {
                "description": "Exact version, e.g. 4.17.20; without it every result is listed",
                "maxLength": 128,
                "type": "string"
              }
            },
            "required": ["ecosystem", "name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attribution": {
                "description": "Each source and license of the listed results, of malicious and of eol, once.",
                "items": {
                  "properties": {
                    "license": {
                      "type": "string"
                    },
                    "notice": {
                      "description": "What ContrastAPI changed. Keep it with the data.",
                      "type": "string"
                    },
                    "source": {
                      "description": "ghsa, go, pysec, rustsec, mal or endoflife.date.",
                      "type": "string"
                    },
                    "url": {
                      "description": "The link of the source. null for a source with no known link.",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["license", "notice", "source", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "credits": {
                "properties": {
                  "charged": {
                    "description": "Credits this call cost; 0 for a free tool.",
                    "type": "integer"
                  },
                  "remaining": {
                    "description": "Credits left in the budget window. Absent when not paid from a credit budget.",
                    "type": "integer"
                  }
                },
                "required": ["charged"],
                "type": "object"
              },
              "data_source": {
                "properties": {
                  "available": {
                    "description": "false while the advisory copy is not loaded.",
                    "type": "boolean"
                  },
                  "reason": {
                    "description": "not_synced. Present only when available is false.",
                    "type": "string"
                  },
                  "source": {
                    "description": "Always osv.",
                    "type": "string"
                  }
                },
                "required": ["available", "source"],
                "type": "object"
              },
              "eol": {
                "description": "Support dates from endoflife.date. null when the package maps to no endoflife.date product. Then the dates are unknown.",
                "properties": {
                  "cycle": {
                    "description": "The one release cycle that the version argument picks. null without a version, or when none or more than one is picked.",
                    "properties": {
                      "eol_date": {
                        "description": "YYYY-MM-DD. null if the cycle has no date.",
                        "type": ["string", "null"]
                      },
                      "is_eol": {
                        "description": "true when eol_date is today or earlier. Without an eol_date, endoflife.date's own flag.",
                        "type": "boolean"
                      },
                      "is_lts": {
                        "type": "boolean"
                      },
                      "is_maintained": {
                        "type": "boolean"
                      },
                      "latest_version": {
                        "description": "null if endoflife.date gives none.",
                        "type": ["string", "null"]
                      },
                      "name": {
                        "type": "string"
                      }
                    },
                    "required": ["eol_date", "is_eol", "is_lts", "is_maintained", "latest_version", "name"],
                    "type": ["object", "null"]
                  },
                  "cycle_variants": {
                    "description": "The release cycles picked when there are two or more, such as the editions of one release. null otherwise.",
                    "items": {
                      "properties": {
                        "eol_date": {
                          "description": "YYYY-MM-DD. null if the cycle has no date.",
                          "type": ["string", "null"]
                        },
                        "is_eol": {
                          "description": "true when eol_date is today or earlier. Without an eol_date, endoflife.date's own flag.",
                          "type": "boolean"
                        },
                        "is_maintained": {
                          "type": "boolean"
                        },
                        "name": {
                          "type": "string"
                        }
                      },
                      "required": ["eol_date", "is_eol", "is_maintained", "name"],
                      "type": "object"
                    },
                    "type": ["array", "null"]
                  },
                  "maintained_cycles": {
                    "description": "At most 10 cycles endoflife.date marks maintained, newest release first.",
                    "items": {
                      "properties": {
                        "eol_date": {
                          "description": "YYYY-MM-DD. null if the cycle has no date.",
                          "type": ["string", "null"]
                        },
                        "is_lts": {
                          "type": "boolean"
                        },
                        "name": {
                          "type": "string"
                        }
                      },
                      "required": ["eol_date", "is_lts", "name"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "maintained_cycles_truncated": {
                    "description": "true when more cycles are maintained than listed.",
                    "type": "boolean"
                  },
                  "product": {
                    "description": "The endoflife.date name of the product.",
                    "type": "string"
                  },
                  "source": {
                    "description": "Always endoflife.date.",
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["cycle", "cycle_variants", "maintained_cycles", "maintained_cycles_truncated", "product", "source", "url"],
                "type": ["object", "null"]
              },
              "fixed_version": {
                "description": "Present only with a version. The upgrade target: the highest fixed version of the listed results, so no listed result affects it. null when a listed result has no fixed version, no result is listed, or an advisory still affects or may affect that version.",
                "type": ["string", "null"]
              },
              "has_advisory_data": {
                "description": "true when an advisory of any source names the package. false does not mean that the package does not exist.",
                "type": "boolean"
              },
              "limit": {
                "description": "Most items in results: the limit argument, 20 by default.",
                "type": "integer"
              },
              "malicious": {
                "description": "The OpenSSF report that the package is malware. null when there is none, or none that may affect the version.",
                "properties": {
                  "affects_version": {
                    "description": "Present only with a version. true when the version is affected, null when the server cannot tell.",
                    "type": ["boolean", "null"]
                  },
                  "id": {
                    "type": "string"
                  },
                  "published_time": {
                    "description": "UTC YYYY-MM-DDTHH:MM:SSZ.",
                    "type": "string"
                  },
                  "summary": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["id", "published_time", "summary"],
                "type": ["object", "null"]
              },
              "next_offset": {
                "description": "offset plus this page's items; total on the last page.",
                "type": "integer"
              },
              "offset": {
                "description": "Items skipped: the offset argument, 0 by default.",
                "type": "integer"
              },
              "results": {
                "description": "One vulnerability each, newest first.",
                "items": {
                  "properties": {
                    "affects_version": {
                      "description": "Present only with a version. true when the version is affected, null when the server cannot tell. A result that does not affect the version is not listed, so it is never false.",
                      "type": ["boolean", "null"]
                    },
                    "aliases": {
                      "description": "Ids that the result's advisories list as aliases, such as CVE ids, and the ids of the advisories folded into this result.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "fixed": {
                      "description": "Each fixed version of the ranges, in version order.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "fixed_version": {
                      "description": "Present only with a version. The version that ends the ranges holding the version. null when there is none or affects_version is null.",
                      "type": ["string", "null"]
                    },
                    "id": {
                      "type": "string"
                    },
                    "published_time": {
                      "description": "UTC YYYY-MM-DDTHH:MM:SSZ.",
                      "type": "string"
                    },
                    "ranges": {
                      "description": "The advisory's version ranges for the package, as OSV writes them.",
                      "items": {
                        "additionalProperties": {
                          "additionalProperties": {
                            "additionalProperties": {
                              "type": ["string", "number", "boolean", "null", "object"]
                            },
                            "items": {
                              "type": ["string", "number", "boolean", "null", "object"]
                            },
                            "type": ["string", "number", "boolean", "null", "object", "array"]
                          },
                          "items": {
                            "additionalProperties": {
                              "type": ["string", "number", "boolean", "null", "object"]
                            },
                            "items": {
                              "type": ["string", "number", "boolean", "null", "object"]
                            },
                            "type": ["string", "number", "boolean", "null", "object", "array"]
                          },
                          "type": ["string", "number", "boolean", "null", "object", "array"]
                        },
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "source": {
                      "description": "ghsa, go, pysec or rustsec.",
                      "type": "string"
                    },
                    "summary": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["aliases", "fixed", "id", "published_time", "ranges", "source", "summary"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "description": "Listed results, before paging. malicious is not counted.",
                "type": "integer"
              }
            },
            "required": ["attribution", "credits", "data_source", "eol", "has_advisory_data", "limit", "malicious", "next_offset", "offset", "results", "total"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.contrastcyber/category": "Package Vulnerabilities (SBOM)",
            "com.contrastcyber/credits": {
              "per_call": 1
            }
          },
          "digest": "sha256:caf7288780c904cc8cb15d13c02a76735fcc7a553c49ff3160ea54824f571875"
        },
        {
          "name": "package_check_bulk",
          "title": "Bulk Package Check (SBOM)",
          "description": "Check many packages at once, each an ecosystem, a name and an exact version, against the advisories package_check reads. For the summary and ranges of an advisory, call the package_check tool. Costs 1 credit per package checked, at least 1.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "items": {
                "description": "Packages, each with its ecosystem, name and exact version",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "ecosystem": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "version": {
                      "type": "string"
                    }
                  },
                  "required": ["ecosystem", "name", "version"],
                  "type": "object"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "outputSchema": {
