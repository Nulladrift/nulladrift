                  "required": ["attack_technique_ids", "catalog_added", "category", "command", "cve_ids", "description", "detection_rules", "driver_id", "matched_driver_file", "matched_on", "operating_system", "privileges", "references", "source_url", "tags", "use_case", "verified"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["credits", "data_source", "found", "hash", "hash_type", "match_count", "matches"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.contrastcyber/category": "Threat Defense",
            "com.contrastcyber/credits": {
              "per_call": 1
            }
