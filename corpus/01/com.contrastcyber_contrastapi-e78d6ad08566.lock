        {
          "name": "watchlist_events",
          "title": "Monitoring Events",
          "description": "Report what changed on the items this API key watches, such as a new advisory for a package or a certificate about to expire, oldest first. A plain call continues where the last one stopped. Requires a Pro API key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "next_cursor of an earlier answer; reads after it and keeps the position",
                "maxLength": 18,
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Most events per call; a shorter page with has_more true is not the end; repeat=true answers the whole last batch",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "repeat": {
                "const": true,
                "description": "Answers the last batch again; cannot be combined with cursor",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "description": "It reports the changes on this key's watched items, oldest first, grouped by item. A plain call moves the key's position past the page. A cursor call reads on from the cursor, and a repeat call answers the last batch again. Neither moves the position.",
            "properties": {
              "advisories": {
                "additionalProperties": {
                  "properties": {
                    "aliases": {
                      "description": "It lists the other ids of the advisory, such as CVE ids. [] when the server no longer holds it.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "source": {
                      "description": "It is ghsa, go, pysec, rustsec or mal. null when the server no longer holds the advisory.",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["aliases", "source"],
                  "type": "object"
                },
                "description": "It holds each advisory of the page's package events, keyed by advisory id.",
                "type": "object"
              },
              "attribution": {
                "description": "It lists each source of the page's package and end-of-life events, with its license and notice. [] without such events.",
                "items": {
                  "properties": {
                    "license": {
                      "type": "string"
                    },
                    "notice": {
                      "type": "string"
                    },
                    "source": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["license", "notice", "source", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "credits": {
                "properties": {
                  "charged": {
                    "description": "Credits this call cost; 0 for a free tool.",
                    "type": "integer"
                  },
                  "remaining": {
                    "description": "Credits left in the budget window. Absent when not paid from a credit budget.",
                    "type": "integer"
                  }
                },
                "required": ["charged"],
                "type": "object"
              },
              "cursor": {
                "description": "It repeats the cursor argument, and is null when the call sent none.",
                "type": ["string", "null"]
              },
              "cves": {
                "additionalProperties": {
                  "properties": {
                    "has_metasploit": {
                      "description": "true when a Metasploit module targets the CVE.",
                      "type": "boolean"
                    },
                    "in_kev": {
                      "description": "true when CISA KEV lists the CVE now.",
                      "type": "boolean"
                    },
                    "kev_patch_deadline": {
                      "description": "It is the YYYY-MM-DD by which US federal agencies must patch. It is \"\" when the KEV entry gives no valid date. null when CISA KEV holds no entry for the CVE.",
                      "type": ["string", "null"]
                    },
                    "known_ransomware": {
                      "description": "true when the KEV entry records ransomware use, and false without an entry.",
                      "type": "boolean"
                    },
                    "label": {
                      "description": "CRITICAL at 90+, HIGH at 70+, MEDIUM at 40+, else LOW.",
                      "type": "string"
                    },
                    "poc_count": {
                      "description": "It counts the references that NVD or the CNA tag Exploit.",
                      "type": "integer"
                    },
                    "risk_score": {
                      "description": "0-100, from CVSS, EPSS, CISA KEV and public exploit signals.",
                      "type": "number"
                    }
                  },
                  "required": ["has_metasploit", "in_kev", "kev_patch_deadline", "known_ransomware", "label", "poc_count", "risk_score"],
                  "type": "object"
                },
                "description": "It holds the facts of each CVE the page names, keyed by CVE id, as they are now. The CVE aliases of the advisories are here too. Use them to pick the next step without another call. in_kev and kev_patch_deadline say whether CISA KEV lists the CVE and by when to patch. known_ransomware, has_metasploit and poc_count say how it is exploited, and risk_score ranks it.",
                "type": "object"
              },
              "domains": {
                "additionalProperties": {
                  "properties": {
                    "cname_takeover": {
                      "description": "It is none, or vulnerable and the provider.",
                      "type": ["string", "null"]
                    },
                    "dns_presence": {
                      "description": "It is found or not_found.",
                      "type": ["string", "null"]
                    },
                    "email_auth_failing": {
                      "additionalProperties": {
                        "type": "string"
                      },
                      "description": "It maps each e-mail check that does not pass, by its email_auth_check id, to warn or fail. {} when every check passes, and null when no result can be read.",
                      "type": ["object", "null"]
                    },
                    "ip_address_reachability": {
                      "description": "It is public, not_public or empty.",
                      "type": ["string", "null"]
                    },
                    "mx": {
                      "description": "It holds MX lines, as previous gives them.",
                      "items": {
                        "type": "string"
                      },
                      "type": ["array", "null"]
                    },
                    "ns": {
                      "items": {
                        "type": "string"
                      },
                      "type": ["array", "null"]
                    },
                    "registered_domain": {
                      "description": "The registrable domain of the name: its public suffix and one label more.",
                      "type": "string"
                    }
                  },
                  "required": ["cname_takeover", "dns_presence", "email_auth_failing", "ip_address_reachability", "mx", "ns", "registered_domain"],
                  "type": "object"
                },
                "description": "It holds the current DNS facts of each domain name the page names, keyed by name. The DNS members are null unless a dns_lookup item of this key watches the name. Each is also null until a check has stored its first value.",
                "type": "object"
              },
              "has_more": {
                "description": "true when another call may answer more. A short page with has_more true is not the end.",
                "type": "boolean"
              },
              "items": {
                "description": "It lists each item with an event in this page, in the order the items were added. An event that matches two items stands under each.",
                "items": {
                  "properties": {
                    "events": {
                      "description": "It lists the item's events in this page, oldest first.",
                      "items": {
                        "properties": {
                          "advisory_id": {
                            "description": "Present only on package events. advisories holds its source and aliases.",
                            "type": "string"
                          },
                          "affects_version": {
                            "description": "Present only on package events. true when the advisory affects the item's version. null when the item has no version or it cannot be told. An advisory that does not affect the version is not reported.",
                            "type": ["boolean", "null"]
                          },
                          "changed_at": {
                            "description": "It is UTC, YYYY-MM-DDTHH:MM:SSZ. It tells when the server wrote the event, at the sync or check that saw the change. For a domain event, that is when the change was confirmed.",
                            "type": "string"
                          },
                          "check": {
                            "description": "Present only on email_auth_degraded. It is the id of the check that got worse, as email_auth_check names it.",
                            "type": "string"
                          },
                          "copyright": {
                            "description": "Present only on drop_listed and drop_unlisted.",
                            "type": "string"
                          },
                          "current": {
                            "description": "It is the value after the change, in the form previous gives. On cert_listed, it is the listing reason abuse.ch gives. Absent on package and end-of-life events.",
                            "items": {
                              "properties": {
                                "listing_id": {
                                  "type": "string"
                                },
                                "prefix": {
                                  "type": "string"
                                }
                              },
                              "required": ["listing_id", "prefix"],
                              "type": ["string", "integer", "object", "null"]
                            },
                            "type": ["number", "integer", "string", "array", "null"]
                          },
                          "cve_id": {
                            "description": "It names the CVE of a CVE event, and cves holds its facts. A package item's kev_added and ransomware_linked are CVE events too. The package events are advisory_added, fix_available and malware_added. null on them and on end-of-life events. Absent on domain and IP events.",
                            "type": ["string", "null"]
                          },
                          "detail": {
                            "description": "Present only on email_auth_degraded. It is the email_auth_check text of the current result, or null.",
                            "type": ["string", "null"]
                          },
                          "eol": {
                            "description": "Present only on end-of-life events.",
                            "properties": {
                              "cycle": {
                                "type": "string"
                              },
                              "eol_date": {
                                "description": "It is the YYYY-MM-DD the cycle ends. null on eol_reached of a cycle with no date.",
                                "type": ["string", "null"]
                              },
                              "previous_eol_date": {
                                "description": "It holds the date before an eol_date_changed event. null on the other types.",
                                "type": ["string", "null"]
                              },
                              "product": {
                                "description": "It is the endoflife.date name of the product.",
                                "type": "string"
                              }
                            },
                            "required": ["cycle", "eol_date", "previous_eol_date", "product"],
                            "type": "object"
                          },
                          "event": {
                            "description": "It names the change. Each item kind hears its own types. The CVE types report a change to a CVE's record, scores, KEV entry, exploits or fixes: cve_added, cve_rejected, cve_disputed, description_changed, cwe_changed, product_added, product_removed, cvss_added, cvss_score_changed, cvss_risk_band_changed, epss_level_up, epss_level_down, kev_added, kev_removed, kev_updated, ransomware_linked, exploit_published, metasploit_added, exploitdb_added, nuclei_template_added, github_poc_added, vendor_advisory_published, patch_published, ssvc_added, ssvc_changed and ghsa_linked. A cve_lookup, product_exposure or cve_search item hears them all. A kev_lookup item hears only kev_added, kev_removed, kev_updated and ransomware_linked. A cve_exploit item hears only exploit_published, metasploit_added, exploitdb_added and github_poc_added. A cve_search item with min_epss also hears epss_above_min and epss_below_min when the score crosses min_epss. epss_level_up comes when the score reaches a higher level of 0.05, 0.1, 0.2, 0.3, 0.5, 0.7 and 0.9, and epss_level_down when it falls under 0.8 times a level the CVE held. A package_check item hears advisory_added, fix_available and malware_added for its package. It also hears kev_added and ransomware_linked of a CVE that an advisory of the package names. A product_exposure or package_check item hears eol_approaching, eol_reached and eol_date_changed. eol_approaching comes 90 days or fewer before the end. The domain types report a change that the server's recurring check of the name saw. A dns_lookup item hears domain_not_found, domain_found, ns_changed, mx_changed, ip_address_not_public, ip_address_lost, ip_address_restored, cname_takeover_detected, cname_takeover_resolved, email_auth_degraded and hosting_changed. An ssl_check item hears cert_expiring, cert_invalid, cert_listed and tls_downgraded. A whois_lookup item hears domain_expiring, registrar_changed, transfer_lock_removed and dnssec_disabled. A headers_check item hears security_header_removed. A cert_search item hears cert_unexpected: a certificate for the name came from an issuer the item had not seen. An ip_lookup item hears drop_listed and drop_unlisted when the address enters or leaves the Spamhaus DROP list, and hosting_changed.",
                            "type": "string"
                          },
                          "expires_at": {
                            "description": "Present only on domain_expiring. It tells when the registration ends, as the registry wrote it.",
                            "type": ["string", "null"]
                          },
                          "fixed_version": {
                            "description": "Present only on package events. It is the fixed version on fix_available, and null on the others.",
                            "type": ["string", "null"]
                          },
                          "list_time": {
                            "description": "Present only on drop_listed and drop_unlisted. It is the date of the DROP list. The DROP terms ask that list_time and copyright stay with the data.",
                            "type": "string"
                          },
                          "new_issuers": {
                            "description": "Present only on cert_unexpected. It lists each issuer the item had not seen.",
                            "items": {
                              "properties": {
                                "issuer": {
                                  "type": "string"
                                },
                                "reason": {
                                  "description": "It is caa_mismatch when the CAA records of the name do not permit the issuer, else new_issuer.",
                                  "type": "string"
                                }
                              },
                              "required": ["issuer", "reason"],
                              "type": "object"
                            },
                            "type": "array"
                          },
                          "previous": {
                            "description": "It is the value before the change. null means no value on that side, so the first value of a domain or IP item has previous null. The form depends on the event. A CVE event carries a score or null. epss_level_up, epss_level_down, epss_above_min and epss_below_min carry EPSS scores, 0-1. cvss_score_changed and cvss_risk_band_changed carry CVSS base scores, 0-10. cvss_added has previous null. The other CVE events carry null. email_auth_degraded carries the check's result: pass, warn or fail. ns_changed, mx_changed, hosting_changed and transfer_lock_removed carry an array of NS names, of MX lines (priority and host, the null MX as \"0 .\"), of hosting classes such as aws/ec2 or AS64500, or of transfer lock statuses. cert_invalid carries an array of certificate problem names, as ssl_check writes them, and [] for a valid certificate. security_header_removed carries an array of header names, and cert_unexpected an array of issuers. cert_expiring and domain_expiring carry the bucket of days left: 7 or 1 for a certificate, and 30, 7 or 1 for a registration. A side outside every bucket is null. registrar_changed carries [IANA id, name], with null for a part the registry does not give. cert_listed always has previous null. drop_listed and drop_unlisted carry an array of DROP listings, [] for none. The item's first drop_listed has previous null, not []. The other domain events carry a state, such as found or not_found, public, not_public or empty, none or vulnerable and the provider, signed or unsigned, or a TLS version. Absent on package and end-of-life events.",
                            "items": {
                              "properties": {
                                "listing_id": {
                                  "type": "string"
                                },
                                "prefix": {
                                  "type": "string"
                                }
                              },
                              "required": ["listing_id", "prefix"],
                              "type": ["string", "integer", "object", "null"]
                            },
                            "type": ["number", "integer", "string", "array", "null"]
                          },
                          "product": {
                            "description": "Present only on CVE events. It pairs with vendor.",
                            "type": ["string", "null"]
                          },
                          "removed": {
                            "description": "Present only on security_header_removed. It lists the header names the current value lacks.",
                            "items": {
                              "type": "string"
                            },
                            "type": "array"
                          },
                          "url": {
                            "description": "Present only on security_header_removed. It is the page both values were read from.",
                            "type": ["string", "null"]
                          },
                          "valid_until": {
                            "description": "Present only on cert_expiring. It tells when the certificate ends.",
                            "type": ["string", "null"]
