            "required": ["sha1_hash"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "breach_count": {
                "description": "Times the password was seen in breach data. It does not count breaches. 0 when not found.",
                "type": "integer"
              },
              "credits": {
                "properties": {
                  "charged": {
                    "description": "Credits this call cost; 0 for a free tool.",
                    "type": "integer"
                  },
                  "remaining": {
                    "description": "Credits left in the budget window. Absent when not paid from a credit budget.",
                    "type": "integer"
                  }
                },
                "required": ["charged"],
                "type": "object"
              },
              "found": {
                "description": "true when breach_count is above 0.",
                "type": "boolean"
              },
              "hash_prefix": {
                "description": "The first 5 hex digits of the hash, in upper case. Only they are sent to Have I Been Pwned.",
                "type": "string"
