        {
          "name": "cve_products",
          "title": "CVE Affected Products",
          "description": "The products a CVE affects, one page at a time, with the vulnerable products first. The vendor and product arguments keep only the products with that exact name. For the CVEs of one product, call cve_search.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cve_id": {
                "description": "CVE ID, e.g. CVE-2021-44228",
                "maxLength": 24,
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Products per page",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Products to skip; pass next_offset of the previous page",
                "minimum": 0,
                "type": "integer"
              },
              "product": {
                "description": "Exact product name, as affected_products writes it",
                "maxLength": 128,
                "type": "string"
              },
              "vendor": {
                "description": "Exact vendor name, as affected_products writes it",
                "maxLength": 128,
                "type": "string"
              }
            },
            "required": ["cve_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "credits": {
                "properties": {
                  "charged": {
                    "description": "Credits this call cost; 0 for a free tool.",
                    "type": "integer"
                  },
                  "remaining": {
                    "description": "Credits left in the budget window. Absent when not paid from a credit budget.",
                    "type": "integer"
                  }
                },
                "required": ["charged"],
                "type": "object"
              },
              "cve_id": {
                "type": "string"
              },
              "limit": {
                "description": "Most items in results: the limit argument, 20 by default.",
                "type": "integer"
              },
              "next_offset": {
                "description": "offset plus this page's items; total on the last page.",
                "type": "integer"
              },
              "offset": {
                "description": "Items skipped: the offset argument, 0 by default.",
                "type": "integer"
              },
              "results": {
                "description": "Vulnerable products first, then by vendor and product.",
                "items": {
                  "properties": {
                    "cpe_part": {
                      "description": "a, o or h from the CPE name: application, operating system or hardware. Absent on a cna element.",
                      "type": ["string", "null"]
                    },
                    "default_status": {
                      "description": "affected, unaffected or unknown from the CNA; null if none. Absent on an nvd element.",
                      "type": ["string", "null"]
                    },
                    "is_vulnerable": {
                      "type": "boolean"
                    },
                    "product": {
                      "description": "null when the CPE name leaves the product open.",
                      "type": ["string", "null"]
                    },
                    "product_source": {
                      "description": "nvd, cna_cpe or cna.",
                      "type": "string"
                    },
                    "vendor": {
                      "description": "null when the CPE name leaves the vendor open.",
                      "type": ["string", "null"]
                    },
                    "version_end_excluding": {
                      "type": "string"
                    },
                    "version_end_including": {
                      "type": "string"
                    },
                    "version_start_excluding": {
                      "type": "string"
                    },
                    "version_start_including": {
                      "description": "Absent when the range has no such bound. The same holds for each other version_* member.",
                      "type": "string"
                    },
                    "versions": {
                      "description": "The CNA's version entries as written; null if none. Only on a cna element.",
                      "items": {
                        "additionalProperties": {
                          "additionalProperties": {
                            "additionalProperties": {
                              "type": ["string", "number", "boolean", "null", "object"]
                            },
                            "items": {
                              "type": ["string", "number", "boolean", "null", "object"]
                            },
                            "type": ["string", "number", "boolean", "null", "object", "array"]
                          },
                          "items": {
                            "additionalProperties": {
                              "type": ["string", "number", "boolean", "null", "object"]
                            },
                            "items": {
                              "type": ["string", "number", "boolean", "null", "object"]
                            },
                            "type": ["string", "number", "boolean", "null", "object", "array"]
                          },
                          "type": ["string", "number", "boolean", "null", "object", "array"]
                        },
                        "type": "object"
                      },
                      "type": ["array", "null"]
                    }
                  },
                  "required": ["is_vulnerable", "product", "product_source", "vendor"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "description": "Products that match the filters, before paging.",
                "type": "integer"
              }
            },
            "required": ["credits", "cve_id", "limit", "next_offset", "offset", "results", "total"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.contrastcyber/category": "CVE Intelligence",
            "com.contrastcyber/credits": {
              "per_call": 1
            }
          },
          "digest": "sha256:828ee20bb6c023a56a53e78f5af4cbb15801645d50342589e2605bd20b5734b0"
        },
        {
          "name": "cve_risk_score",
          "title": "CVE Risk Score",
          "description": "Composite risk score of a CVE, 0-100, for patch priority. It reads EPSS, CISA KEV, Metasploit, CVSS, NVD and CNA exploit references, and ExploitDB. has_public_poc is null when no source names an exploit. For many CVEs, call cve_triage_bulk.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cve_id": {
                "description": "CVE ID",
                "maxLength": 24,
                "type": "string"
              }
            },
            "required": ["cve_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "components": {
                "properties": {
                  "evidence": {
                    "description": "From the count of exploit references in the NVD and CNA records, or 1 when there is none and ExploitDB lists the CVE. max is 10.",
                    "properties": {
                      "max": {
                        "type": "number"
                      },
                      "score": {
                        "type": "number"
                      }
                    },
                    "required": ["max", "score"],
                    "type": "object"
                  },
                  "exploitability": {
                    "description": "From EPSS, CISA KEV and a Metasploit module. max is 60.",
                    "properties": {
                      "max": {
                        "type": "number"
                      },
                      "score": {
                        "type": "number"
                      }
                    },
                    "required": ["max", "score"],
                    "type": "object"
                  },
                  "impact": {
                    "description": "From the CVSS base score, v3 or else v4. max is 30.",
                    "properties": {
                      "max": {
                        "type": "number"
                      },
                      "score": {
                        "type": "number"
                      }
                    },
                    "required": ["max", "score"],
                    "type": "object"
                  }
                },
                "required": ["evidence", "exploitability", "impact"],
                "type": "object"
              },
              "credits": {
                "properties": {
                  "charged": {
                    "description": "Credits this call cost; 0 for a free tool.",
                    "type": "integer"
                  },
                  "remaining": {
                    "description": "Credits left in the budget window. Absent when not paid from a credit budget.",
                    "type": "integer"
                  }
                },
                "required": ["charged"],
                "type": "object"
              },
              "has_public_poc": {
                "description": "true when an NVD or CNA exploit reference, a Metasploit module or an ExploitDB entry is found. Never false: null means none of these sources names one.",
                "type": ["boolean", "null"]
              },
              "label": {
                "description": "CRITICAL at 90+, HIGH at 70+, MEDIUM at 40+, else LOW.",
                "type": "string"
              },
              "score": {
                "description": "0-100: the three component scores added up, rounded to 0.1.",
                "type": "number"
              }
            },
            "required": ["components", "credits", "has_public_poc", "label", "score"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.contrastcyber/category": "CVE Intelligence",
            "com.contrastcyber/credits": {
              "per_call": 1
            }
          },
          "digest": "sha256:ca1b802a3608976ae9888ade35a319c0367e145c5b5f0ae3eb33ee83add49b6c"
        },
        {
          "name": "cve_search",
          "title": "CVE Search",
          "description": "Search CVEs by severity, CWE, CVSS, EPSS, CISA KEV, ransomware use, Nuclei template, vendor, product and publish date, one page at a time. Call the cve_lookup tool for a full record, and the cpe_search tool to find the names.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cwe_id": {
                "description": "e.g. CWE-79",
                "maxLength": 16,
                "type": "string"
              },
              "has_nuclei_template": {
                "const": true,
                "description": "Only CVEs with a Nuclei detection template",
                "type": "boolean"
              },
              "in_kev": {
                "description": "true lists only CVEs in CISA KEV, false only CVEs not in it",
                "type": "boolean"
              },
              "include_rejected": {
                "description": "Also list the CVEs that NVD marks Rejected",
                "type": "boolean"
              },
              "kev_added_after": {
                "description": "YYYY-MM-DD; only CVEs added to CISA KEV on or after this date and still in it",
                "maxLength": 31,
                "type": "string"
              },
              "known_ransomware": {
                "const": true,
                "description": "Only CVEs whose CISA KEV entry notes known ransomware use",
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "description": "CVEs per page",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "min_cvss": {
                "description": "CVSS v3, or v4 when a CVE has no v3",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "min_epss": {
                "description": "Lowest EPSS score, a probability from 0 to 1, e.g. 0.1",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "offset": {
                "default": 0,
                "description": "CVEs to skip; pass next_offset of the previous page",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "product": {
                "description": "Exact product name as cpe_search lists it, e.g. log4j",
                "maxLength": 128,
                "type": "string"
              },
              "published_after": {
                "description": "YYYY-MM-DD",
                "maxLength": 31,
                "type": "string"
              },
              "published_before": {
                "description": "YYYY-MM-DD",
                "maxLength": 31,
                "type": "string"
              },
              "severity": {
                "description": "CVSS severity: CRITICAL, HIGH, MEDIUM, LOW or NONE, from the v3 rating when the CVE has one",
                "enum": ["CRITICAL", "HIGH", "MEDIUM", "LOW", "NONE"],
                "maxLength": 16,
                "type": "string"
              },
              "sort": {
                "description": "kev_date_added needs in_kev=true or kev_added_after",
                "enum": ["published_time", "epss", "cvss", "kev_date_added"],
                "maxLength": 15,
                "type": "string"
              },
              "vendor": {
                "description": "Exact vendor name as cpe_search lists it, e.g. apache",
                "maxLength": 128,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "credits": {
                "properties": {
                  "charged": {
                    "description": "Credits this call cost; 0 for a free tool.",
                    "type": "integer"
                  },
                  "remaining": {
                    "description": "Credits left in the budget window. Absent when not paid from a credit budget.",
                    "type": "integer"
                  }
                },
                "required": ["charged"],
                "type": "object"
              },
              "limit": {
                "description": "Most items in results: the limit argument, 20 by default.",
                "type": "integer"
              },
              "next_offset": {
                "description": "offset plus this page's items; total on the last page.",
                "type": "integer"
              },
              "offset": {
                "description": "Items skipped: the offset argument, 0 by default.",
                "type": "integer"
              },
              "product_filter_note": {
                "description": "Present only with a vendor or product filter: such a filter can miss CVEs.",
                "type": "string"
              },
              "results": {
                "items": {
                  "properties": {
                    "cve_id": {
                      "type": "string"
                    },
                    "cvss_v3": {
                      "description": "Base score, 0-10. null without a v3 vector.",
                      "type": ["number", "null"]
                    },
                    "cvss_v3_source": {
                      "description": "Source: nvd, cna (the CVE's CNA), adp (CISA's ADP) or other (any other source). null if none recorded.",
                      "type": ["string", "null"]
                    },
                    "cvss_v4": {
                      "description": "Base score, 0-10. null without a v4 vector.",
                      "type": ["number", "null"]
                    },
                    "cvss_v4_source": {
                      "description": "Coded as cvss_v3_source; chosen apart from it.",
                      "type": ["string", "null"]
                    },
                    "cwe_id": {
                      "description": "Main CWE, such as CWE-79. Empty when none is known.",
                      "type": "string"
                    },
                    "cwe_source": {
                      "description": "Source of cwe_id, coded as cvss_v3_source; null if none recorded.",
                      "type": ["string", "null"]
                    },
                    "epss_percentile": {
                      "description": "Share of scored CVEs with an equal or lower EPSS score, 0-1. null with epss_score.",
                      "type": ["number", "null"]
                    },
                    "epss_score": {
                      "description": "EPSS probability, 0-1, of exploitation in the next 30 days. null if unscored.",
                      "type": ["number", "null"]
                    },
                    "in_kev": {
                      "type": "boolean"
                    },
                    "kev_date_added": {
                      "description": "YYYY-MM-DD it entered CISA KEV. null if not in KEV or undated.",
                      "type": ["string", "null"]
                    },
                    "published_time": {
                      "description": "YYYY-MM-DD.",
                      "type": "string"
                    },
                    "severity": {
                      "description": "From CVSS v3, else v4, else v2: CRITICAL, HIGH, MEDIUM, LOW, NONE (score 0.0), or UNKNOWN (no CVSS).",
                      "type": "string"
                    }
                  },
                  "required": ["cve_id", "cvss_v3", "cvss_v3_source", "cvss_v4", "cvss_v4_source", "cwe_id", "cwe_source", "epss_percentile", "epss_score", "in_kev", "kev_date_added", "published_time", "severity"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "description": "CVEs that match the filters, before paging.",
                "type": "integer"
              }
            },
            "required": ["credits", "limit", "next_offset", "offset", "results", "total"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.contrastcyber/category": "CVE Intelligence",
            "com.contrastcyber/credits": {
              "per_call": 1
            }
          },
          "digest": "sha256:3e14aa5e6e92b0b8cd05016b3264825959ecb393c92777f120bbc7bd3fa0d0d1"
        },
        {
          "name": "cve_triage",
          "title": "CVE Triage",
          "description": "Rank the CVEs of a vendor or product by composite risk score, at or above the optional min_risk_score argument, as lean rows (cve_id, risk_score, label). Call the cve_lookup tool for detail, and the cpe_search tool to find the names.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_rejected": {
                "description": "Also list the CVEs that NVD marks Rejected",
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "description": "CVEs per page",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "min_risk_score": {
                "description": "Composite risk-score threshold",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "offset": {
                "default": 0,
                "description": "CVEs to skip; pass next_offset of the previous page",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "product": {
                "description": "Exact product name as cpe_search lists it, e.g. log4j",
                "maxLength": 128,
                "type": "string"
              },
              "vendor": {
                "description": "Exact vendor name as cpe_search lists it, e.g. apache",
                "maxLength": 128,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "credits": {
                "properties": {
                  "charged": {
                    "description": "Credits this call cost; 0 for a free tool.",
                    "type": "integer"
                  },
                  "remaining": {
                    "description": "Credits left in the budget window. Absent when not paid from a credit budget.",
                    "type": "integer"
                  }
                },
                "required": ["charged"],
                "type": "object"
              },
              "limit": {
                "description": "Most items in results: the limit argument, 20 by default.",
                "type": "integer"
              },
              "next_offset": {
                "description": "offset plus this page's items; total on the last page.",
                "type": "integer"
              },
              "offset": {
                "description": "Items skipped: the offset argument, 0 by default.",
                "type": "integer"
              },
              "product_filter_note": {
                "description": "Present only with a vendor or product filter: such a filter can miss CVEs.",
                "type": "string"
              },
              "results": {
                "items": {
                  "properties": {
                    "cve_id": {
                      "type": "string"
                    },
                    "label": {
                      "description": "CRITICAL at 90+, HIGH at 70+, MEDIUM at 40+, else LOW.",
                      "type": "string"
                    },
                    "risk_score": {
                      "description": "0-100, from CVSS, EPSS, CISA KEV and public exploit signals.",
                      "type": "number"
                    }
                  },
                  "required": ["cve_id", "label", "risk_score"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "description": "CVEs that match the filters, before paging.",
                "type": "integer"
              }
            },
            "required": ["credits", "limit", "next_offset", "offset", "results", "total"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.contrastcyber/category": "CVE Intelligence",
            "com.contrastcyber/credits": {
              "per_call": 1
            }
