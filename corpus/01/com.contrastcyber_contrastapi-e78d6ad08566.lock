        {
          "name": "wayback_lookup",
          "title": "Wayback Machine Lookup",
          "description": "List when the Wayback Machine captured a host's home page: the first and last capture, the years between them (archive span, not domain age) and the latest 10 captures with links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Host name, such as example.com",
                "maxLength": 253,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "archive_url": {
                "description": "It links to the host's page on the Wayback Machine.",
                "type": "string"
              },
              "available": {
                "description": "false when the server could not fetch the list. Then only reason and retry_after_seconds follow. It is true for a host without a capture too.",
                "type": "boolean"
              },
              "credits": {
                "properties": {
                  "charged": {
                    "description": "Credits this call cost; 0 for a free tool.",
                    "type": "integer"
                  },
                  "remaining": {
                    "description": "Credits left in the budget window. Absent when not paid from a credit budget.",
                    "type": "integer"
                  }
                },
                "required": ["charged"],
                "type": "object"
              },
              "domain": {
                "description": "The host name the server asked about.",
                "type": "string"
              },
              "first_seen": {
                "description": "It is the day of the earliest capture, as YYYY-MM-DD. null when the host has no capture.",
                "type": ["string", "null"]
              },
              "last_seen": {
                "description": "It is the day of the latest capture, as YYYY-MM-DD. null when the host has no capture.",
                "type": ["string", "null"]
              },
              "latest_captures": {
                "description": "It lists the latest days with a capture, at most 10, the latest first. Each day shows one capture of it.",
                "items": {
                  "properties": {
                    "captured_at": {
                      "description": "It is a UTC time, as YYYY-MM-DDTHH:MM:SSZ.",
                      "type": "string"
                    },
                    "http_status": {
                      "description": "null when the archive lists no status.",
                      "type": ["integer", "null"]
                    },
                    "media_type": {
                      "type": ["string", "null"]
                    },
                    "url": {
                      "description": "It links to the capture.",
                      "type": "string"
                    }
                  },
                  "required": ["captured_at", "http_status", "media_type", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "reason": {
                "description": "Present only when available is false. It is quota_exhausted: the server reached its request limit for the source.",
                "type": "string"
              },
              "retry_after_seconds": {
                "description": "Seconds to wait before the server sends that request again. Present only when available is false.",
                "type": "integer"
              },
              "years_online": {
                "description": "It is the year of last_seen minus the year of first_seen, and 1 when that difference is 0. It spans the archive's captures, not the domain's age. null when the host has no capture.",
                "type": ["integer", "null"]
              }
            },
            "required": ["available", "credits", "domain"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
