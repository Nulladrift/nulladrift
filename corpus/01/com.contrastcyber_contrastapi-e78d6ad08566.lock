{
  "lockfileVersion": 2,
  "subjects": {
    "com.contrastcyber/contrastapi": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.contrastcyber.com/mcp/"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "ContrastAPI is a security data and monitoring server, with watchlists of CVEs, packages, domains and IP addresses. Call cve_lookup for a CVE, package_check for a package, dns_lookup for a domain and ip_lookup for an IP address. Call watchlist_edit and watchlist_events for monitoring, which needs an API key. A Pro API key is sold at https://api.contrastcyber.com/pricing. It looks up, searches and scores CVE, KEV and CWE records. It gives public exploit intelligence. It decodes and scores a CVSS v3 vector. It checks a password's SHA-1 against Have I Been Pwned. It reads a domain's DNS records and checks a host name for a dangling CNAME. It checks a domain's SPF, DMARC, DKIM and MTA-STS records. It checks whether an e-mail address's domain takes mail and whether the address is disposable. It checks the TLS certificate and settings of a host name and rates the security headers of a web site. It reads the robots.txt and the security.txt of a web site. It looks up the registration of a domain name over RDAP or WHOIS. It lists the Wayback Machine captures of a host name. It lists the unexpired certificates that Certificate Transparency logs hold for a host name. It lists the subdomains of a registrable domain from Certificate Transparency and DNS. It names the MITRE D3FEND defenses that counter a MITRE ATT&CK technique. It finds a driver file hash in the LOLDrivers catalog. It looks up the AS, the country, the cloud range, the Tor exit, the crawler range and the DROP listing of a public IP address. It looks up an AS by its number or by an address it holds. It checks a package or a list of packages of nine ecosystems against OSV.dev advisories and malicious packages. It gives the end-of-life dates of a product or a package from endoflife.date. The watchlist keeps CVE, package, domain and IP items for an API key, and watchlist_events reads their change events. A Pro API key can save its own Shodan and AbuseIPDB keys with vendor_key_edit, and ip_lookup then adds their answers. It says what it keeps about the caller. It follows the redirect chain of a URL and lists each hop. A call with no API key and no credits left can pay per call with x402 in USDC on Solana.",
      "tools": [
        {
          "name": "asn_lookup",
          "title": "ASN Lookup",
          "description": "Look up an autonomous system by number, such as AS15169, or by an IP address it holds: name, country and one page of its IPv4 and IPv6 prefixes, derived from IPtoASN.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 50,
                "description": "Prefixes per page, in each address family",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Prefixes to skip in each family; pass next_offset of the previous page",
                "minimum": 0,
                "type": "integer"
              },
              "target": {
                "description": "AS number, such as AS15169 or 15169, or a public IPv4 or IPv6 address, such as 8.8.8.8",
                "maxLength": 45,
                "type": "string"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "asn": {
                "type": "integer"
              },
              "asn_country": {
                "description": "The two-letter country where the AS is registered. null when IPtoASN names none.",
                "type": ["string", "null"]
              },
              "asn_name": {
                "description": "The name IPtoASN gives the AS.",
                "type": ["string", "null"]
              },
              "credits": {
                "properties": {
                  "charged": {
                    "description": "Credits this call cost; 0 for a free tool.",
                    "type": "integer"
                  },
                  "remaining": {
                    "description": "Credits left in the budget window. Absent when not paid from a credit budget.",
                    "type": "integer"
                  }
                },
                "required": ["charged"],
                "type": "object"
              },
              "ipv4_prefix_count": {
                "description": "All IPv4 prefixes of the AS, before paging.",
                "type": "integer"
              },
              "ipv4_prefixes": {
                "description": "This page of IPv4 prefixes in CIDR form, in address order.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "ipv6_prefix_count": {
                "description": "All IPv6 prefixes of the AS, before paging.",
                "type": "integer"
              },
              "ipv6_prefixes": {
                "description": "This page of IPv6 prefixes in CIDR form, in address order.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "description": "Most prefixes of each family on this page: the limit argument, 50 by default.",
                "type": "integer"
              },
              "next_offset": {
                "description": "offset plus the length of the longer list on this page. The next page starts there. When it is not below the larger of ipv4_prefix_count and ipv6_prefix_count, this page is the last.",
                "type": "integer"
              },
              "offset": {
                "description": "Items skipped: the offset argument, 0 by default.",
                "type": "integer"
              },
              "prefix": {
                "description": "The IPtoASN prefix that holds the address. null for an AS target.",
                "type": ["string", "null"]
              },
              "target": {
                "description": "The target in canonical form: the address, or AS and the number.",
                "type": "string"
              }
            },
            "required": ["asn", "asn_country", "asn_name", "credits", "ipv4_prefix_count", "ipv4_prefixes", "ipv6_prefix_count", "ipv6_prefixes", "limit", "next_offset", "offset", "prefix", "target"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.contrastcyber/category": "IP Intelligence",
            "com.contrastcyber/credits": {
              "per_call": 1
            }
          },
          "digest": "sha256:59d90e8fb9f49cb36117728edf5a426de3c1cf47362dcb118bc41d64806d5608"
        },
        {
          "name": "cert_search",
          "title": "Certificate Transparency Search",
          "description": "List the unexpired certificates that Certificate Transparency logs hold for a host name, wildcards included, from SSLMate's Cert Spotter: the 10 newest, with issuer, validity and DNS names. Costs 2 credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Host name, such as example.com or www.example.com",
                "maxLength": 253,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "available": {
                "description": "false when the server could not fetch the list. Then only reason and retry_after_seconds follow. It is true for a host without a certificate too.",
                "type": "boolean"
              },
              "certificate_count": {
                "description": "It counts the certificates read, over all the pages read.",
                "type": "integer"
              },
              "certificates": {
                "description": "At most 10 of the certificates read, those whose validity starts last, the latest first.",
                "items": {
                  "properties": {
                    "dns_name_count": {
                      "description": "It counts every DNS name, past the first 20 too.",
                      "type": "integer"
                    },
                    "dns_names": {
                      "description": "It lists the first 20 DNS names.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "issuer": {
                      "description": "The issuer name Cert Spotter gives. null when it gives none that fits.",
                      "type": ["string", "null"]
                    },
                    "issuer_caa_domains": {
                      "description": "The domains a CAA record can name to allow the issuer. null when the list is unknown.",
                      "items": {
                        "type": "string"
                      },
                      "type": ["array", "null"]
                    },
                    "revoked": {
                      "description": "null when Cert Spotter does not know.",
                      "type": ["boolean", "null"]
                    },
                    "sha256_fingerprint": {
                      "description": "It is lower-case hex. For a precertificate it does not match the fingerprint of ssl_check.",
                      "type": "string"
                    },
                    "valid_from": {
                      "description": "It is a UTC time, as YYYY-MM-DDTHH:MM:SSZ.",
                      "type": "string"
                    },
                    "valid_until": {
                      "description": "It is a UTC time, as YYYY-MM-DDTHH:MM:SSZ.",
                      "type": "string"
                    }
                  },
                  "required": ["dns_name_count", "dns_names", "issuer", "issuer_caa_domains", "revoked", "sha256_fingerprint", "valid_from", "valid_until"],
                  "type": "object"
                },
                "type": "array"
              },
              "complete": {
                "description": "true when the walk read every page. false when the page cap stopped it. A certificate on an unread page is then left out, a newer one too.",
                "type": "boolean"
              },
              "credits": {
                "properties": {
                  "charged": {
                    "description": "Credits this call cost; 0 for a free tool.",
                    "type": "integer"
                  },
                  "remaining": {
                    "description": "Credits left in the budget window. Absent when not paid from a credit budget.",
                    "type": "integer"
                  }
                },
                "required": ["charged"],
                "type": "object"
              },
              "domain": {
                "description": "The host name the server asked about.",
                "type": "string"
              },
              "reason": {
                "description": "Present only when available is false. It is quota_exhausted: the server reached its request limit for the source.",
                "type": "string"
              },
              "retry_after_seconds": {
                "description": "Seconds to wait before the server sends that request again. Present only when available is false.",
                "type": "integer"
              }
            },
            "required": ["available", "credits", "domain"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "com.contrastcyber/category": "Domain Intelligence",
            "com.contrastcyber/credits": {
              "per_call": 2
            }
          },
          "digest": "sha256:656dfd501ec7a1b59cb5e44a8a95eaee4f1a26191bacc263e3edfcab418db804"
        },
        {
          "name": "cpe_search",
          "title": "CPE Search",
          "description": "Find the CPE vendor and product names that hold a text, ranked by vulnerable CVE count. Pass a name with no % as it is to the vendor and product arguments of the cve_search, cve_triage, cve_leading, product_exposure and epss_risers tools.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 20,
                "description": "Vendor and product pairs per page",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Pairs to skip; pass next_offset of the previous page",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "search": {
                "description": "Text in vendor or product names, at least 3 bytes; case does not matter, and _ matches a space",
                "maxLength": 128,
                "type": "string"
              }
            },
            "required": ["search"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "credits": {
                "properties": {
                  "charged": {
                    "description": "Credits this call cost; 0 for a free tool.",
                    "type": "integer"
                  },
                  "remaining": {
                    "description": "Credits left in the budget window. Absent when not paid from a credit budget.",
                    "type": "integer"
                  }
                },
                "required": ["charged"],
                "type": "object"
              },
              "limit": {
                "description": "Most items in results: the limit argument, 20 by default.",
                "type": "integer"
              },
              "next_offset": {
                "description": "offset plus this page's items; total on the last page.",
                "type": "integer"
              },
              "offset": {
                "description": "Items skipped: the offset argument, 0 by default.",
                "type": "integer"
              },
              "results": {
                "description": "Highest vulnerable_cve_count first. Pass vendor and product as they are, escapes included, to the vendor and product arguments of other tools.",
                "items": {
                  "properties": {
                    "product": {
                      "description": "CPE escapes kept, such as notepad\\+\\+.",
                      "type": "string"
                    },
                    "product_named_by": {
                      "description": "Who named the pair: nvd (an NVD CPE configuration), cna_cpe (a CPE name the CNA gave) or cna (the CNA's free text), each at most once.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "vendor": {
                      "type": "string"
                    },
                    "vulnerable_cve_count": {
                      "description": "CVEs that mark the pair vulnerable. 0 when CVEs name the pair only as not vulnerable: a vendor or product filter then finds no CVE.",
                      "type": "integer"
                    }
                  },
                  "required": ["product", "product_named_by", "vendor", "vulnerable_cve_count"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "description": "Vendor and product pairs that hold the search text, before paging.",
                "type": "integer"
              }
            },
            "required": ["credits", "limit", "next_offset", "offset", "results", "total"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.contrastcyber/category": "CVE Intelligence",
            "com.contrastcyber/credits": {
              "per_call": 1
            }
          },
          "digest": "sha256:d867ce70c5d0513abbb35ea3cbe13ad6f46567720b665909af036c281aef824d"
        },
        {
          "name": "cve_exploit",
          "title": "CVE Exploit Intelligence",
          "description": "Public exploit intelligence (GitHub PoCs, Metasploit, NVD and CNA exploit references, ExploitDB). GitHub PoC repositories are listed but not counted as proof of a public exploit. For a single patch-priority score, call cve_risk_score.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cve_id": {
                "description": "CVE ID",
                "maxLength": 24,
                "type": "string"
              }
            },
            "required": ["cve_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "credits": {
                "properties": {
                  "charged": {
                    "description": "Credits this call cost; 0 for a free tool.",
                    "type": "integer"
                  },
                  "remaining": {
                    "description": "Credits left in the budget window. Absent when not paid from a credit budget.",
                    "type": "integer"
                  }
                },
                "required": ["charged"],
                "type": "object"
              },
              "cve_id": {
                "type": "string"
              },
              "exploits_found": {
                "description": "GitHub repositories the PoC-in-GitHub list names for the CVE, the github count. null when the github source is unavailable. It does not decide has_public_exploit.",
                "type": ["integer", "null"]
              },
              "has_public_exploit": {
                "description": "true when an available metasploit, nvd or exploitdb source names an exploit. Never false: null means none of them names one.",
                "type": ["boolean", "null"]
              },
              "in_kev": {
                "description": "In CISA KEV, read from the CVE's own record. null when the nvd source is unavailable, as that record was not read.",
                "type": ["boolean", "null"]
              },
              "sources": {
                "description": "Four entries: github, metasploit, nvd and exploitdb, in that order.",
                "items": {
                  "properties": {
                    "available": {
                      "description": "false when the source could not be read. Then count is 0, top_results is empty and has_module is false, which tell nothing.",
                      "type": "boolean"
                    },
                    "count": {
                      "description": "All entries this source has for the CVE. top_results lists the first of them.",
                      "type": "integer"
                    },
                    "has_module": {
                      "description": "metasploit only: true when a module targets the CVE.",
                      "type": "boolean"
                    },
                    "license": {
                      "description": "exploitdb only: GPL-2.0-only, the license of the list.",
                      "type": "string"
                    },
                    "reason": {
                      "description": "Present only when available is false. github, metasploit and exploitdb: database_error or not_synced (the list is not loaded). nvd: database_error or cve_not_in_database.",
                      "type": "string"
                    },
                    "source": {
                      "description": "github, metasploit, nvd or exploitdb.",
                      "type": "string"
                    },
                    "top_results": {
                      "description": "The first entries: 3 for github, 5 for the others. github items hold url, name and stars; metasploit name and type; nvd url; exploitdb edb_id, url, type, platform, date_published and verified.",
                      "items": {
                        "properties": {
                          "date_published": {
                            "description": "exploitdb: YYYY-MM-DD. null if the entry has no date.",
                            "type": ["string", "null"]
                          },
                          "edb_id": {
                            "description": "exploitdb: the Exploit Database number.",
                            "type": "integer"
                          },
                          "name": {
                            "description": "github: owner/repo. metasploit: the module type, an underscore and the module path.",
                            "type": "string"
                          },
                          "platform": {
                            "description": "exploitdb: such as linux_x86-64, php or multiple. Empty if not recorded.",
                            "type": "string"
                          },
                          "stars": {
                            "description": "github: stars as the PoC-in-GitHub list recorded them.",
                            "type": "integer"
                          },
                          "type": {
                            "description": "metasploit: exploit, auxiliary or post. exploitdb: such as remote, local, webapps or dos. Empty if not recorded.",
                            "type": "string"
                          },
                          "url": {
                            "description": "github, nvd and exploitdb; absent on metasploit.",
                            "type": "string"
                          },
                          "verified": {
                            "description": "exploitdb: the Exploit Database marks it verified.",
                            "type": "boolean"
                          }
                        },
                        "required": [],
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["available", "count", "source", "top_results"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["credits", "cve_id", "exploits_found", "has_public_exploit", "in_kev", "sources"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.contrastcyber/category": "CVE Intelligence",
            "com.contrastcyber/credits": {
              "per_call": 1
            }
          },
          "digest": "sha256:5885072d16c88b8a096bbfa9928a3b55c42941b048135b8b87ea120142ffefb6"
        },
        {
          "name": "cve_leading",
          "title": "Leading CVEs by EPSS",
          "description": "List the CVEs most likely to be exploited, by EPSS score (the probability of exploitation in the next 30 days), with a verdict on the top score. To rank by composite risk score, call the cve_triage tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "has_nuclei_template": {
                "const": true,
                "description": "Only CVEs with a Nuclei detection template",
                "type": "boolean"
              },
              "in_kev": {
                "description": "true lists only CVEs in CISA KEV, false only CVEs not in it",
                "type": "boolean"
              },
              "include_rejected": {
                "description": "Also list the CVEs that NVD marks Rejected",
                "type": "boolean"
              },
              "known_ransomware": {
                "const": true,
                "description": "Only CVEs whose CISA KEV entry notes known ransomware use",
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "description": "How many CVEs to list, highest EPSS first",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "min_epss": {
                "description": "Lowest EPSS score, a probability from 0 to 1, e.g. 0.1",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "product": {
                "description": "Exact product name as cpe_search lists it, e.g. log4j",
                "maxLength": 128,
                "type": "string"
              },
              "vendor": {
                "description": "Exact vendor name as cpe_search lists it, e.g. apache",
                "maxLength": 128,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "description": "Items in results.",
                "type": "integer"
              },
              "credits": {
                "properties": {
                  "charged": {
                    "description": "Credits this call cost; 0 for a free tool.",
                    "type": "integer"
                  },
                  "remaining": {
                    "description": "Credits left in the budget window. Absent when not paid from a credit budget.",
                    "type": "integer"
                  }
                },
                "required": ["charged"],
                "type": "object"
              },
              "limit": {
                "description": "Most items in results: the limit argument, 20 by default.",
                "type": "integer"
              },
              "product_filter_note": {
                "description": "Present only with a vendor or product filter: such a filter can miss CVEs.",
                "type": "string"
              },
              "results": {
                "items": {
                  "properties": {
                    "cve_id": {
                      "type": "string"
                    },
                    "cvss_v3": {
                      "description": "Base score, 0-10. null without a v3 vector.",
                      "type": ["number", "null"]
                    },
                    "cvss_v3_source": {
                      "description": "Source: nvd, cna (the CVE's CNA), adp (CISA's ADP) or other (any other source). null if none recorded.",
                      "type": ["string", "null"]
                    },
                    "cvss_v4": {
                      "description": "Base score, 0-10. null without a v4 vector.",
                      "type": ["number", "null"]
                    },
                    "cvss_v4_source": {
                      "description": "Coded as cvss_v3_source; chosen apart from it.",
                      "type": ["string", "null"]
                    },
                    "cwe_id": {
                      "description": "Main CWE, such as CWE-79. Empty when none is known.",
                      "type": "string"
                    },
                    "cwe_source": {
                      "description": "Source of cwe_id, coded as cvss_v3_source; null if none recorded.",
                      "type": ["string", "null"]
                    },
                    "epss_percentile": {
                      "description": "Share of scored CVEs with an equal or lower EPSS score, 0-1. null with epss_score.",
                      "type": ["number", "null"]
                    },
                    "epss_score": {
                      "description": "EPSS probability, 0-1, of exploitation in the next 30 days. null if unscored.",
                      "type": ["number", "null"]
                    },
                    "in_kev": {
                      "type": "boolean"
                    },
                    "kev_date_added": {
                      "description": "YYYY-MM-DD it entered CISA KEV. null if not in KEV or undated.",
                      "type": ["string", "null"]
                    },
                    "published_time": {
                      "description": "YYYY-MM-DD.",
                      "type": "string"
                    },
                    "severity": {
                      "description": "From CVSS v3, else v4, else v2: CRITICAL, HIGH, MEDIUM, LOW, NONE (score 0.0), or UNKNOWN (no CVSS).",
                      "type": "string"
                    }
                  },
                  "required": ["cve_id", "cvss_v3", "cvss_v3_source", "cvss_v4", "cvss_v4_source", "cwe_id", "cwe_source", "epss_percentile", "epss_score", "in_kev", "kev_date_added", "published_time", "severity"],
                  "type": "object"
                },
                "type": "array"
              },
              "summary": {
                "description": "One sentence: the count, the leading CVE and its EPSS score if any, and how many are in CISA KEV; a fixed no-match sentence when results is empty.",
                "type": "string"
              },
              "total": {
                "description": "CVEs that match. Can exceed count: no offset here, so raise limit (max 50) or page with cve_search sort=epss.",
                "type": "integer"
              },
              "verdict": {
