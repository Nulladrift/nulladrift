        {
          "name": "cve_triage_bulk",
          "title": "Bulk CVE Triage",
          "description": "Triage many CVEs at once, ranked by composite risk score. Ids beyond the remaining credits come back in not_processed. Costs 1 credit per CVE ID triaged, at least 1.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cve_ids": {
                "description": "CVE IDs",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["cve_ids"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "credits": {
                "properties": {
                  "charged": {
                    "description": "Credits this call cost; 0 for a free tool.",
                    "type": "integer"
                  },
                  "remaining": {
                    "description": "Credits left in the budget window. Absent when not paid from a credit budget.",
                    "type": "integer"
                  }
                },
                "required": ["charged"],
                "type": "object"
              },
              "failed": {
                "description": "Well-formed IDs not in the database or unreadable. Counted only here, not in results.",
                "type": "integer"
              },
              "not_processed": {
                "description": "Well-formed IDs the credit budget did not cover. They were not looked up.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "processed": {
                "description": "Well-formed IDs that were looked up. Equals successful + failed.",
                "type": "integer"
              },
              "results": {
                "items": {
                  "properties": {
                    "cve_id": {
                      "type": "string"
                    },
                    "label": {
                      "description": "CRITICAL at 90+, HIGH at 70+, MEDIUM at 40+, else LOW.",
                      "type": "string"
                    },
                    "risk_score": {
                      "description": "0-100, from CVSS, EPSS, CISA KEV and public exploit signals.",
                      "type": "number"
                    }
                  },
                  "required": ["cve_id", "label", "risk_score"],
                  "type": "object"
                },
                "type": "array"
              },
              "skipped": {
                "description": "Elements that are not a well-formed CVE ID.",
                "type": "integer"
              },
              "successful": {
                "description": "IDs found; results holds their scores.",
                "type": "integer"
              },
              "total": {
                "description": "Elements submitted. Equals processed + skipped + the length of not_processed.",
                "type": "integer"
              }
            },
            "required": ["credits", "failed", "not_processed", "processed", "results", "skipped", "successful", "total"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.contrastcyber/category": "CVE Intelligence",
            "com.contrastcyber/credits": {
              "min": 1,
              "per_item": 1
            }
          },
          "digest": "sha256:44005f8f3fdf83f7ef4a9b8df58cf24c52d6ce6467028f9bdf4e0a66aeaae595"
        },
        {
          "name": "cvss_calculator",
          "title": "CVSS Calculator",
          "description": "Decode a CVSS v3.0/v3.1 vector into its base metrics and recompute its base, temporal and environmental scores. Use it on a vector you hold; cve_lookup already gives the scores of a CVE. v2 and v4 are refused.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "vector": {
                "description": "CVSS:3.0/ or CVSS:3.1/ vector with all eight base metrics; temporal and environmental metrics are optional, e.g. CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H",
                "maxLength": 127,
                "type": "string"
              }
            },
            "required": ["vector"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "base_score": {
                "description": "0-10.",
                "type": "number"
              },
              "base_severity": {
                "description": "NONE at 0.0, LOW below 4.0, MEDIUM below 7.0, HIGH below 9.0, else CRITICAL.",
                "type": "string"
              },
              "credits": {
                "properties": {
                  "charged": {
                    "description": "Credits this call cost; 0 for a free tool.",
                    "type": "integer"
                  },
                  "remaining": {
                    "description": "Credits left in the budget window. Absent when not paid from a credit budget.",
                    "type": "integer"
                  }
                },
                "required": ["charged"],
                "type": "object"
              },
              "environmental_score": {
                "description": "0-10, with the environmental metrics of the vector. A metric it leaves out counts as Not Defined. With none, it usually equals base_score, but CVSS 3.1 can give another value.",
                "type": "number"
              },
              "metrics": {
                "description": "The eight base metrics, spelled out.",
                "properties": {
                  "attack_complexity": {
                    "description": "LOW or HIGH.",
                    "type": "string"
                  },
                  "attack_vector": {
                    "description": "NETWORK, ADJACENT_NETWORK, LOCAL or PHYSICAL.",
                    "type": "string"
                  },
                  "availability_impact": {
                    "description": "HIGH, LOW or NONE.",
                    "type": "string"
                  },
                  "confidentiality_impact": {
                    "description": "HIGH, LOW or NONE.",
                    "type": "string"
                  },
                  "integrity_impact": {
                    "description": "HIGH, LOW or NONE.",
                    "type": "string"
                  },
                  "privileges_required": {
                    "description": "NONE, LOW or HIGH.",
                    "type": "string"
                  },
                  "scope": {
                    "description": "UNCHANGED or CHANGED.",
                    "type": "string"
                  },
                  "user_interaction": {
                    "description": "NONE or REQUIRED.",
                    "type": "string"
                  }
                },
                "required": ["attack_complexity", "attack_vector", "availability_impact", "confidentiality_impact", "integrity_impact", "privileges_required", "scope", "user_interaction"],
                "type": "object"
              },
              "summary": {
                "description": "One sentence: version, severity, base score, and AV, AC, PR, UI and Scope.",
                "type": "string"
              },
              "temporal_score": {
                "description": "0-10, with the temporal metrics of the vector. A metric it leaves out counts as Not Defined. With none, it equals base_score.",
                "type": "number"
              },
              "vector": {
                "description": "The vector as sent.",
                "type": "string"
              },
              "version": {
                "description": "3.0 or 3.1.",
                "type": "string"
              }
            },
            "required": ["base_score", "base_severity", "credits", "environmental_score", "metrics", "summary", "temporal_score", "vector", "version"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.contrastcyber/category": "CVE Intelligence",
            "com.contrastcyber/credits": {
              "per_call": 1
            }
          },
          "digest": "sha256:9046e1d8b1377933bd28f5294d829ba1ca1b3f74d089b86cfa6cedf013f3bfd7"
        },
        {
          "name": "cwe_lookup",
          "title": "CWE Lookup",
          "description": "CWE weakness details (description, mitigations, examples, OWASP Top 10 category in 2021 and 2025), with how many CVEs and CISA KEV entries name it. To list them, call the cve_search tool with its cwe_id argument.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cwe_id": {
                "description": "CWE ID, e.g. CWE-79",
                "maxLength": 16,
                "type": "string"
              }
            },
            "required": ["cwe_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "abstraction": {
                "description": "MITRE's level of the entry, such as Pillar, Class, Base or Variant. May be empty.",
                "type": "string"
              },
              "avg_cvss": {
                "description": "Mean CVSS v3 score of the CVEs with this CWE that have one. null when none has one.",
                "type": ["number", "null"]
              },
              "avg_epss": {
                "description": "Mean EPSS of its scored CVEs. null if none is scored or the mean rounds to 0.0000.",
                "type": ["number", "null"]
              },
              "credits": {
                "properties": {
                  "charged": {
                    "description": "Credits this call cost; 0 for a free tool.",
                    "type": "integer"
                  },
                  "remaining": {
                    "description": "Credits left in the budget window. Absent when not paid from a credit budget.",
                    "type": "integer"
                  }
                },
                "required": ["charged"],
                "type": "object"
              },
              "cve_count": {
                "description": "CVEs with this CWE, rejected ones included.",
                "type": "integer"
              },
              "cwe_id": {
                "type": "string"
              },
              "description": {
                "type": "string"
              },
              "examples": {
                "description": "Each is a reference, usually a CVE ID, then \": \" and a note when MITRE gives one.",
                "items": {
                  "type": "string"
                },
                "type": ["array", "null"]
              },
              "extended_description": {
                "type": ["string", "null"]
              },
              "kev_count": {
                "description": "CVEs with this CWE that are in CISA KEV, rejected ones included.",
                "type": "integer"
              },
              "likelihood_of_exploit": {
                "description": "High, Medium, Low or Unknown. Empty when MITRE gives none.",
                "type": "string"
              },
              "mitigations": {
                "items": {
                  "type": "string"
                },
                "type": ["array", "null"]
              },
              "name": {
                "type": "string"
              },
              "owasp_top10": {
                "description": "OWASP Top 10 categories naming this CWE, oldest edition first. Empty: none. null: mapping not loaded.",
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "year": {
                      "type": "integer"
                    }
                  },
                  "required": ["id", "name", "year"],
                  "type": "object"
                },
                "type": ["array", "null"]
              },
              "parent_cwe": {
                "description": "Empty when the CWE has no parent.",
                "type": "string"
              },
              "status": {
                "description": "MITRE's status of the entry, such as Stable, Draft or Incomplete. May be empty.",
                "type": "string"
              },
              "updated_at": {
                "description": "UTC YYYY-MM-DDTHH:MM:SSZ when the CWE sync last wrote this record. Empty when unknown.",
                "type": "string"
              }
            },
            "required": ["abstraction", "avg_cvss", "avg_epss", "credits", "cve_count", "cwe_id", "description", "examples", "extended_description", "kev_count", "likelihood_of_exploit", "mitigations", "name", "owasp_top10", "parent_cwe", "status", "updated_at"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.contrastcyber/category": "CVE Intelligence",
            "com.contrastcyber/credits": {
              "per_call": 1
            }
          },
          "digest": "sha256:e9fe93e9d17d2660fd0ecf772766f1d9021a95f4fe0b72dc415c240b38e42ebd"
        },
        {
          "name": "d3fend_for_attack",
          "title": "D3FEND Defenses for ATT&CK",
          "description": "MITRE D3FEND defenses that counter a MITRE ATT&CK technique. A technique id such as T1055 also matches its sub-techniques. Source: MITRE D3FEND (MIT license).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "attack_technique_id": {
                "description": "MITRE ATT&CK technique id in upper case, e.g. T1055 or T1055.012",
                "maxLength": 9,
                "type": "string"
              }
            },
            "required": ["attack_technique_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attack_technique_id": {
                "description": "The id as sent.",
                "type": "string"
              },
              "attack_techniques": {
                "description": "Each technique id that matched, once, in id order. A technique id also matches its sub-techniques. [] when no D3FEND defense counters the id. defenses is then [] too.",
                "items": {
                  "properties": {
                    "attack_label": {
                      "description": "The ATT&CK name of the id. null when the catalog gives none.",
                      "type": ["string", "null"]
                    },
                    "attack_technique_id": {
                      "type": "string"
                    },
                    "subtechnique_of": {
                      "description": "The parent technique of a sub-technique, such as T1055. null for a technique.",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["attack_label", "attack_technique_id", "subtechnique_of"],
                  "type": "object"
                },
                "type": "array"
              },
              "credits": {
                "properties": {
                  "charged": {
                    "description": "Credits this call cost; 0 for a free tool.",
                    "type": "integer"
                  },
                  "remaining": {
                    "description": "Credits left in the budget window. Absent when not paid from a credit budget.",
                    "type": "integer"
                  }
                },
                "required": ["charged"],
                "type": "object"
              },
              "defense_count_by_defense_tactic": {
                "description": "Defenses per D3FEND tactic. Each of the seven tactics has a key, also with a count of 0.",
                "properties": {
                  "Deceive": {
                    "type": "integer"
                  },
                  "Detect": {
                    "type": "integer"
                  },
                  "Evict": {
                    "type": "integer"
                  },
                  "Harden": {
                    "type": "integer"
                  },
                  "Isolate": {
                    "type": "integer"
                  },
                  "Model": {
                    "type": "integer"
                  },
                  "Restore": {
                    "type": "integer"
                  }
                },
                "required": ["Deceive", "Detect", "Evict", "Harden", "Isolate", "Model", "Restore"],
                "type": "object"
              },
              "defenses": {
                "description": "In defense_label order.",
                "items": {
                  "properties": {
                    "attack_technique_ids": {
                      "description": "The matched ids this defense counters, in id order.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "defense_id": {
                      "type": "string"
                    },
                    "defense_label": {
                      "type": "string"
                    },
                    "defense_tactic": {
                      "description": "One of the seven keys of defense_count_by_defense_tactic.",
                      "type": "string"
                    },
                    "digital_artifact": {
                      "description": "A D3FEND digital artifact of the defense. null when the catalog gives none.",
                      "type": ["string", "null"]
                    },
                    "parent_defense_labels": {
                      "description": "Parents in the D3FEND tree, the nearest first. [] for a top-level defense.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "uri": {
                      "description": "The defense's IRI in the D3FEND ontology.",
                      "type": "string"
                    }
                  },
                  "required": ["attack_technique_ids", "defense_id", "defense_label", "defense_tactic", "digital_artifact", "parent_defense_labels", "uri"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["attack_technique_id", "attack_techniques", "credits", "defense_count_by_defense_tactic", "defenses"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.contrastcyber/category": "Threat Defense",
            "com.contrastcyber/credits": {
              "per_call": 1
            }
          },
          "digest": "sha256:ece4589a9992cd83c9dc13c9609adbc927b93f3098243846a8e85f5c10443077"
        },
        {
          "name": "dns_lookup",
          "title": "DNS Lookup",
          "description": "Look up a domain's DNS records: A, AAAA, MX, NS, TXT, CNAME, SOA and CAA. A record type the resolver could not answer is listed under unavailable.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Domain name, such as example.com",
                "maxLength": 253,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "credits": {
                "properties": {
                  "charged": {
                    "description": "Credits this call cost; 0 for a free tool.",
                    "type": "integer"
                  },
                  "remaining": {
                    "description": "Credits left in the budget window. Absent when not paid from a credit budget.",
                    "type": "integer"
                  }
                },
                "required": ["charged"],
                "type": "object"
              },
              "domain": {
                "type": "string"
              },
              "non_public_addresses": {
                "description": "The A and AAAA addresses that are not globally reachable.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "records": {
                "description": "It holds one member for each record type. [] means the domain has no record of that type. null means the question failed, and unavailable says why. soa is also null when the domain has no SOA record. Then unavailable has no soa member.",
                "properties": {
                  "a": {
                    "items": {
                      "type": "string"
                    },
                    "type": ["array", "null"]
                  },
                  "aaaa": {
                    "items": {
                      "type": "string"
                    },
                    "type": ["array", "null"]
                  },
                  "caa": {
                    "items": {
                      "properties": {
                        "flags": {
                          "description": "128 marks a critical record.",
                          "type": "integer"
                        },
                        "tag": {
                          "type": "string"
                        },
                        "value": {
                          "type": "string"
                        }
                      },
                      "required": ["flags", "tag", "value"],
                      "type": "object"
                    },
                    "type": ["array", "null"]
                  },
                  "cname": {
                    "items": {
                      "type": "string"
                    },
                    "type": ["array", "null"]
                  },
                  "mx": {
                    "items": {
                      "properties": {
                        "host": {
                          "type": "string"
                        },
                        "priority": {
                          "type": "integer"
                        }
                      },
                      "required": ["host", "priority"],
                      "type": "object"
                    },
                    "type": ["array", "null"]
                  },
                  "ns": {
                    "items": {
                      "type": "string"
                    },
                    "type": ["array", "null"]
                  },
                  "soa": {
                    "properties": {
                      "mname": {
                        "type": "string"
                      },
                      "rname": {
                        "description": "It is the mailbox of the zone's administrator, written as a DNS name.",
                        "type": "string"
                      },
                      "serial": {
                        "type": "integer"
                      }
                    },
                    "required": ["mname", "rname", "serial"],
                    "type": ["object", "null"]
                  },
                  "total_txt_records": {
                    "description": "null when txt is null.",
                    "type": ["integer", "null"]
                  },
                  "txt": {
                    "items": {
                      "type": "string"
                    },
                    "type": ["array", "null"]
                  }
                },
                "required": ["a", "aaaa", "caa", "cname", "mx", "ns", "soa", "total_txt_records", "txt"],
                "type": "object"
              },
              "services": {
                "description": "The services a TXT record names. evidence is the word the service asks its customers to publish. A listed service is not proof that the domain uses it.",
                "items": {
                  "properties": {
                    "evidence": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["evidence", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "summary": {
                "type": "string"
              },
              "unavailable": {
                "description": "It names each record type whose question failed, with its reason code. It is {} when every question was answered. The code says why the DNS question failed. It is nxdomain, server_error, truncated, malformed_answer, timeout or not_public_name.",
                "properties": {
                  "a": {
                    "type": "string"
                  },
                  "aaaa": {
                    "type": "string"
                  },
                  "caa": {
                    "type": "string"
                  },
                  "cname": {
                    "type": "string"
                  },
                  "mx": {
                    "type": "string"
                  },
                  "ns": {
                    "type": "string"
                  },
                  "soa": {
                    "type": "string"
                  },
                  "txt": {
                    "type": "string"
                  }
                },
                "required": [],
                "type": "object"
              }
            },
            "required": ["credits", "domain", "non_public_addresses", "records", "services", "summary", "unavailable"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "com.contrastcyber/category": "Domain Intelligence",
            "com.contrastcyber/credits": {
              "per_call": 1
            }
          },
          "digest": "sha256:a3fadd0f79fe7cad4221915b69091f35814fc8958cc632ac6af833e8db8181d9"
        },
        {
          "name": "dns_takeover_check",
          "title": "Subdomain Takeover Check",
          "description": "Check a host name for subdomain takeover through a dangling CNAME. takeover_possible is null when the CNAME points to a service whose DNS does not show whether the name can be claimed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Host name, such as shop.example.com",
                "maxLength": 253,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "chain": {
                "description": "It lists every target of the CNAME chain in order, cname first. The check judges the last name. [] without a CNAME.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "cname": {
                "description": "It is the target of the host name's first CNAME. null when the host name has none.",
                "type": ["string", "null"]
              },
              "credits": {
                "properties": {
                  "charged": {
                    "description": "Credits this call cost; 0 for a free tool.",
                    "type": "integer"
                  },
                  "remaining": {
                    "description": "Credits left in the budget window. Absent when not paid from a credit budget.",
                    "type": "integer"
                  }
                },
                "required": ["charged"],
                "type": "object"
              },
              "dangling": {
                "description": "true when the host name has a CNAME and the last name of chain does not exist.",
                "type": "boolean"
              },
              "hostname": {
                "type": "string"
              },
              "provider": {
                "description": "The service whose name suffix ends the last name of chain. null when the check knows no such suffix.",
                "type": ["string", "null"]
              },
              "summary": {
                "type": "string"
              },
              "takeover_possible": {
                "description": "false without a CNAME. With a provider, true when dangling is true and false otherwise. null when the host name has a CNAME and provider is null, even when the last name exists. DNS alone cannot tell then.",
                "type": ["boolean", "null"]
              },
              "target_exists": {
                "description": "Whether the last name of chain exists. null without a CNAME.",
                "type": ["boolean", "null"]
              }
            },
            "required": ["chain", "cname", "credits", "dangling", "hostname", "provider", "summary", "takeover_possible", "target_exists"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
