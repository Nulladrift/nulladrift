              },
              "patch_deadline": {
                "description": "YYYY-MM-DD by which US federal agencies must patch, or empty.",
                "type": "string"
              },
              "product": {
                "type": "string"
              },
              "required_action": {
                "type": "string"
              },
              "short_description": {
                "type": "string"
              },
              "vendor_project": {
                "type": "string"
              },
              "vulnerability_name": {
                "type": "string"
              }
            },
            "required": ["credits", "cve_id", "cwes", "date_added", "date_removed", "in_kev", "known_ransomware_use", "notes", "patch_deadline", "product", "required_action", "short_description", "vendor_project", "vulnerability_name"],
            "type": "object"
          },
          "annotations": {
