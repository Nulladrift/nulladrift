        {
          "name": "epss_risers",
          "title": "EPSS Risers",
          "description": "List the CVEs whose EPSS score rose most over the last 7 or 30 days, with the old and the new score. Filter by vendor, product, KEV state or a minimum score. Call the cve_lookup tool for the details of a CVE.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "in_kev": {
                "description": "true lists only CVEs in CISA KEV, false only CVEs not in it",
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "description": "CVEs per page",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "min_epss": {
                "description": "Lowest current EPSS score to list, 0.0 to 1.0.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "offset": {
                "default": 0,
                "description": "CVEs to skip; pass next_offset of the previous page",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "product": {
                "description": "Exact product name as cpe_search lists it, e.g. log4j",
                "maxLength": 128,
                "type": "string"
              },
              "vendor": {
                "description": "Exact vendor name as cpe_search lists it, e.g. apache",
                "maxLength": 128,
                "type": "string"
              },
              "window_days": {
                "default": 7,
                "description": "Days to look back: 7 or 30. Default 7.",
                "maximum": 30,
                "minimum": 7,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "credits": {
                "properties": {
                  "charged": {
                    "description": "Credits this call cost; 0 for a free tool.",
                    "type": "integer"
                  },
                  "remaining": {
                    "description": "Credits left in the budget window. Absent when not paid from a credit budget.",
                    "type": "integer"
                  }
                },
                "required": ["charged"],
                "type": "object"
              },
              "from_date": {
                "description": "Older day, YYYY-MM-DD. null if EPSS history is too short to start the window; total is then 0.",
                "type": ["string", "null"]
              },
              "limit": {
                "description": "Most items in results: the limit argument, 20 by default.",
                "type": "integer"
              },
              "next_offset": {
                "description": "offset plus this page's items; total on the last page.",
                "type": "integer"
              },
              "offset": {
                "description": "Items skipped: the offset argument, 0 by default.",
                "type": "integer"
              },
              "product_filter_note": {
                "description": "Present only with a vendor or product filter: such a filter can miss CVEs.",
                "type": "string"
              },
              "results": {
                "items": {
                  "properties": {
                    "cve_id": {
                      "type": "string"
                    },
                    "epss_delta": {
                      "description": "epss_score less epss_previous_score, 0-1. Always above 0: a CVE is listed only when its score rose.",
                      "type": "number"
                    },
                    "epss_percentile": {
                      "description": "Share of all scored CVEs whose EPSS score on to_date is the same or lower, 0-1.",
                      "type": "number"
                    },
                    "epss_previous_score": {
                      "description": "EPSS score on from_date, 0-1.",
                      "type": "number"
                    },
                    "epss_score": {
                      "description": "EPSS score on to_date, 0-1.",
                      "type": "number"
                    },
                    "in_kev": {
                      "type": "boolean"
                    }
                  },
                  "required": ["cve_id", "epss_delta", "epss_percentile", "epss_previous_score", "epss_score", "in_kev"],
                  "type": "object"
                },
                "type": "array"
              },
              "to_date": {
                "description": "Newer day, YYYY-MM-DD. null only if EPSS history is empty; from_date is then null too.",
                "type": ["string", "null"]
              },
              "total": {
                "description": "CVEs that rose over the window and match the filters, before paging.",
                "type": "integer"
              },
              "window_days": {
                "description": "7 or 30.",
                "type": "integer"
              },
              "window_note": {
                "description": "Present only when from_date is null: a fixed sentence that the EPSS history cannot start the window yet.",
                "type": "string"
              }
            },
            "required": ["credits", "from_date", "limit", "next_offset", "offset", "results", "to_date", "total", "window_days"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.contrastcyber/category": "CVE Intelligence",
            "com.contrastcyber/credits": {
              "per_call": 1
            }
          },
          "digest": "sha256:1f51a6faf5f7659aa9070e3c63ccdd1f2ed36371791f7995e7b023f125a00708"
        },
        {
          "name": "headers_check",
          "title": "Security Headers Check",
          "description": "Rate nine security headers of a web site, such as CSP, HSTS and Set-Cookie, from one GET to https://<domain>/ that follows up to 5 redirects on the same host or its www pair. Each finding that does not pass has a remediation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Host name of the site, such as www.example.com",
                "maxLength": 253,
                "type": "string"
              },
              "include_full_header_values": {
                "description": "true sends each header value and URL whole, instead of cutting it after 500 code points",
                "type": "boolean"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "checked_at": {
                "description": "When the check ran, in UTC, as YYYY-MM-DDTHH:MM:SSZ. A cached answer keeps the time of its own check, up to an hour old.",
                "type": "string"
              },
              "credits": {
                "properties": {
                  "charged": {
                    "description": "Credits this call cost; 0 for a free tool.",
                    "type": "integer"
                  },
                  "remaining": {
                    "description": "Credits left in the budget window. Absent when not paid from a credit budget.",
                    "type": "integer"
                  }
                },
                "required": ["charged"],
                "type": "object"
              },
              "findings": {
                "description": "It holds one finding for each of the 9 rules, in a fixed order.",
                "items": {
                  "properties": {
                    "cookie_count": {
                      "description": "Present only in the Set-Cookie finding, and always there. It counts the cookies the answer set, 0 when it set none.",
                      "type": "integer"
                    },
                    "header": {
                      "description": "It is Content-Security-Policy, Strict-Transport-Security, X-Content-Type-Options, X-Frame-Options, Referrer-Policy, Permissions-Policy, X-XSS-Protection, Set-Cookie or Access-Control-Allow-Origin.",
                      "type": "string"
                    },
                    "issues": {
                      "description": "It lists what the rule found.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "remediation": {
                      "description": "Present only when result is not pass. It is a fixed text for the rule.",
                      "type": "string"
                    },
                    "result": {
                      "description": "It is pass, warn, fail, or missing when the header is absent. An absent X-XSS-Protection, Set-Cookie or Access-Control-Allow-Origin passes instead.",
                      "type": "string"
                    },
                    "severity": {
                      "description": "It is high, medium or low, fixed for each rule.",
                      "type": "string"
                    },
                    "total_value_length": {
                      "description": "Present only when value was cut. It gives the whole length in code points.",
                      "type": "integer"
                    },
                    "value": {
                      "description": "The header's value as the site sent it, cut as url is. null when the header is absent, and always null for Set-Cookie.",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["header", "issues", "result", "severity", "value"],
                  "type": "object"
                },
                "type": "array"
              },
              "redirect_count": {
                "description": "How many redirects the fetch followed, at most 5.",
                "type": "integer"
              },
              "redirect_limit_reached": {
                "description": "Present only when the redirect limit stopped the fetch on the site. It is then true.",
                "type": "boolean"
              },
              "redirect_to": {
                "description": "Present only when the last answer is a redirect the fetch did not follow and it names a target. It holds that target, cut as url is.",
                "type": "string"
              },
              "status_code": {
                "description": "It is the status of the last answer. A 4xx or 5xx answer is rated too.",
                "type": "integer"
              },
              "total_redirect_to_length": {
                "description": "Present only when redirect_to was cut. It gives the whole length in code points.",
                "type": "integer"
              },
              "total_url_length": {
                "description": "Present only when url was cut. It gives the whole length in code points.",
                "type": "integer"
              },
              "url": {
                "description": "It is the URL of the last request, without its query. A value longer than 500 code points is cut there, unless include_full_header_values is true.",
                "type": "string"
              }
            },
            "required": ["checked_at", "credits", "findings", "redirect_count", "status_code", "url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "com.contrastcyber/category": "Domain Intelligence",
            "com.contrastcyber/credits": {
              "per_call": 1
            }
          },
          "digest": "sha256:b088e73982ad9672476b7ebc305e3a9cac6e81e084aa0f79317fb06784c6249a"
        },
        {
          "name": "health",
          "title": "Health and Data Freshness",
          "description": "Database freshness: CVE/KEV/CWE counts and latest entries, and the sync state of each upstream feed. last_synced is when a feed's state was last written; read it with last_status. Costs no credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "credits": {
                "properties": {
                  "charged": {
                    "description": "Credits this call cost; 0 for a free tool.",
                    "type": "integer"
                  },
                  "remaining": {
                    "description": "Credits left in the budget window. Absent when not paid from a credit budget.",
                    "type": "integer"
                  }
                },
                "required": ["charged"],
                "type": "object"
              },
              "db": {
                "properties": {
                  "cwe": {
                    "properties": {
                      "entry_count": {
                        "type": "integer"
                      },
                      "last_updated": {
                        "properties": {
                          "cwe_id": {
                            "type": "string"
                          },
                          "updated_at": {
                            "description": "UTC YYYY-MM-DDTHH:MM:SSZ. Empty when unknown.",
                            "type": "string"
                          }
                        },
                        "required": ["cwe_id", "updated_at"],
                        "type": "object"
                      }
                    },
                    "required": ["entry_count", "last_updated"],
                    "type": "object"
                  },
                  "feeds": {
                    "items": {
                      "properties": {
                        "last_status": {
                          "description": "ok, error or in_progress. May be empty.",
                          "type": "string"
                        },
                        "last_synced": {
                          "description": "UTC YYYY-MM-DDTHH:MM:SSZ when the feed's state was last written, not its last success. May be null.",
                          "type": ["string", "null"]
                        },
                        "name": {
                          "type": "string"
                        },
                        "records_updated": {
                          "description": "The count that the feed's last run recorded with last_status. Each feed counts its own unit.",
                          "type": "integer"
                        }
                      },
                      "required": ["last_status", "last_synced", "name", "records_updated"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "kev": {
                    "properties": {
                      "entry_count": {
                        "type": "integer"
                      },
                      "last_added": {
                        "properties": {
                          "cve_id": {
                            "type": "string"
                          },
                          "date_added": {
                            "description": "YYYY-MM-DD. Empty when the table is empty.",
                            "type": "string"
                          }
                        },
                        "required": ["cve_id", "date_added"],
                        "type": "object"
                      }
                    },
                    "required": ["entry_count", "last_added"],
                    "type": "object"
                  },
                  "nvd": {
                    "properties": {
                      "cve_count": {
                        "type": "integer"
                      },
                      "last_added": {
                        "properties": {
                          "cve_id": {
                            "type": "string"
                          },
                          "published_time": {
                            "description": "YYYY-MM-DD. Empty when the table is empty.",
                            "type": "string"
                          }
                        },
                        "required": ["cve_id", "published_time"],
                        "type": "object"
                      }
                    },
                    "required": ["cve_count", "last_added"],
                    "type": "object"
                  }
                },
                "required": ["cwe", "feeds", "kev", "nvd"],
                "type": "object"
              },
              "status": {
                "description": "Always ok in a result. A database the server cannot read gives a protocol error instead.",
                "type": "string"
              },
              "version": {
                "description": "Server version, such as 2.3.1.",
                "type": "string"
              }
            },
            "required": ["credits", "db", "status", "version"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.contrastcyber/category": "Operations",
            "com.contrastcyber/credits": {
              "per_call": 0
            }
          },
          "digest": "sha256:1da2a771ee3ea170e3758949417ab3689d043b6af7387a075514f604ee13da72"
        },
        {
          "name": "ip_lookup",
          "title": "IP Lookup",
          "description": "Look up a public IP: AS, country, cloud provider, CDN, datacenter, Tor exit, crawler, DROP listing and PTR name. A Pro key with its own Shodan or AbuseIPDB key adds exposure and reputation. For every prefix of the AS, call asn_lookup.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ip_address": {
                "description": "Public IPv4 or IPv6 address, such as 8.8.8.8 or 2001:4860:4860::8888",
                "maxLength": 45,
                "type": "string"
              }
            },
            "required": ["ip_address"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "asn": {
                "description": "The AS of the IPtoASN prefix that holds the address. null when no prefix holds it or the list is not loaded. asn_name and asn_country are then null too.",
                "type": ["integer", "null"]
              },
              "asn_country": {
                "description": "The two-letter country where the AS is registered. null when IPtoASN names none.",
                "type": ["string", "null"]
              },
              "asn_name": {
                "description": "The name IPtoASN gives the AS.",
                "type": ["string", "null"]
              },
              "cloud_provider": {
                "description": "The cloud or CDN provider whose published range holds the address, such as aws. null when no range holds it or the ranges are not loaded.",
                "type": ["string", "null"]
              },
              "cloud_service": {
                "description": "The service of that range, such as ec2 or cloudfront.",
                "type": ["string", "null"]
              },
              "crawler": {
                "description": "The crawler list whose range holds the address, such as googlebot. null when no list holds it or the lists are not loaded.",
                "type": ["string", "null"]
              },
              "credits": {
                "properties": {
                  "charged": {
                    "description": "Credits this call cost; 0 for a free tool.",
                    "type": "integer"
                  },
                  "remaining": {
                    "description": "Credits left in the budget window. Absent when not paid from a credit budget.",
                    "type": "integer"
                  }
                },
                "required": ["charged"],
                "type": "object"
              },
              "geo_country": {
                "description": "The two-letter country of the address, from DB-IP Lite. null when no prefix holds the address or the list is not loaded.",
                "type": ["string", "null"]
              },
              "internet_exposure": {
                "description": "The Shodan slot, filled with the caller's own stored key. Its forms are as in reputation. available true adds source and the members from ports to last_update.",
                "properties": {
                  "action_tool": {
                    "description": "As in reputation.",
                    "type": "string"
                  },
                  "action_url": {
                    "description": "As in reputation.",
                    "type": "string"
                  },
                  "available": {
                    "description": "As in reputation.",
                    "type": "boolean"
                  },
                  "hostnames": {
                    "description": "Always [] for shodan_facets.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "last_update": {
                    "description": "When Shodan last updated the host. null when it gives none, and always for shodan_facets.",
                    "type": ["string", "null"]
                  },
                  "ports": {
                    "description": "The ports Shodan saw open.",
                    "items": {
                      "type": "integer"
                    },
                    "type": "array"
                  },
                  "reason": {
                    "description": "As in reputation.",
                    "type": "string"
                  },
                  "retry_after_seconds": {
                    "description": "As in reputation.",
                    "type": "integer"
                  },
                  "source": {
                    "description": "shodan for the host query. shodan_facets for the count query that a free Shodan key gets.",
                    "type": "string"
                  },
                  "tags": {
                    "description": "The labels Shodan gives the host.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "vulns": {
                    "description": "CVE ids Shodan lists.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "vulns_truncated": {
                    "description": "true when shodan_facets cut the CVE list at its limit, so Shodan may hold more. Always false for shodan.",
                    "type": "boolean"
                  }
                },
                "required": ["available"],
                "type": "object"
              },
              "ip_address": {
                "description": "The address in canonical form.",
                "type": "string"
              },
              "is_cdn": {
                "description": "true when the cloud range that holds the address belongs to a CDN, false when it does not. null when no range holds it or the ranges are not loaded. An address of no range can still be a CDN edge.",
                "type": ["boolean", "null"]
              },
              "is_datacenter": {
                "description": "true when a cloud range or a datacenter AS holds the address. false only when IPtoASN and the cloud ranges are both loaded and neither matches. null when it is not true and either is not loaded.",
                "type": ["boolean", "null"]
              },
              "is_ptr_forward_confirmed": {
                "description": "true when an A or AAAA record of ptr holds the address. false when every forward question was answered and none of the first 10 PTR names maps back. null when ptr is null or a forward question failed.",
                "type": ["boolean", "null"]
              },
              "is_tor_exit": {
                "description": "true when the Tor Project's exit list holds the address, false when it does not. null while the list is not loaded.",
                "type": ["boolean", "null"]
              },
              "listed_on": {
                "description": "DROP prefixes that hold the address, the longest first. [] when none holds it. null while the list is not loaded.",
                "items": {
                  "properties": {
                    "copyright": {
                      "description": "The copy text of that file. The list asks that it stays with the data.",
                      "type": "string"
                    },
                    "list_time": {
                      "description": "UTC YYYY-MM-DDTHH:MM:SSZ of the file that listed the prefix.",
                      "type": "string"
                    },
                    "listing_id": {
                      "description": "The id of the prefix's record in the list.",
                      "type": "string"
                    },
                    "prefix": {
                      "description": "The listed prefix in CIDR form.",
                      "type": "string"
                    },
                    "source": {
                      "description": "Always drop, the DROP list.",
                      "type": "string"
                    }
                  },
                  "required": ["copyright", "list_time", "listing_id", "prefix", "source"],
                  "type": "object"
                },
                "type": ["array", "null"]
              },
              "ptr": {
                "description": "A PTR name of the address. It is the first of the first 10 names whose A or AAAA record holds the address. When none does, it is the first name. null when there is none or the question failed.",
                "type": ["string", "null"]
              },
              "reputation": {
                "description": "The AbuseIPDB slot, filled with the caller's own stored key. available true adds source and the report members. available false adds reason and the members that reason names.",
                "properties": {
                  "abuse_confidence_score": {
                    "description": "AbuseIPDB's confidence that the address is abusive, from 0 to 100.",
                    "type": "integer"
                  },
                  "action_tool": {
                    "description": "privacy_my_data, the tool whose answer holds the link that saves vendor keys. Present for vendor_key_missing and vendor_key_rejected.",
                    "type": "string"
                  },
                  "action_url": {
                    "description": "The page that fixes the reason. Present for pro_key_required, vendor_key_missing and vendor_key_rejected.",
                    "type": "string"
                  },
                  "available": {
                    "description": "true when the slot holds the vendor's answer.",
                    "type": "boolean"
                  },
                  "distinct_reporter_count": {
                    "description": "Different reporters that sent those reports.",
                    "type": "integer"
                  },
                  "is_whitelisted": {
                    "description": "null when AbuseIPDB does not say.",
                    "type": ["boolean", "null"]
                  },
                  "last_reported_at": {
                    "description": "When the last report came, as AbuseIPDB writes it. null when it gives none.",
                    "type": ["string", "null"]
                  },
                  "reason": {
                    "description": "Why the slot is empty: pro_key_required (no Pro API key), vendor_key_missing (no stored key for this vendor), vendor_key_rejected (the vendor refused it), vendor_unavailable or database_error.",
                    "type": "string"
                  },
                  "retry_after_seconds": {
                    "description": "Seconds the vendor asked to wait. Present only for vendor_unavailable when the vendor gave a wait.",
                    "type": "integer"
                  },
                  "source": {
                    "description": "Always abuseipdb.",
                    "type": "string"
                  },
                  "total_reports": {
                    "description": "Reports AbuseIPDB holds for the address.",
                    "type": "integer"
                  },
                  "usage_type": {
                    "description": "The usage type AbuseIPDB gives, such as Data Center/Web Hosting/Transit. null when it gives none.",
                    "type": ["string", "null"]
                  }
                },
                "required": ["available"],
                "type": "object"
              },
              "unavailable": {
                "description": "Each key names a part that could not be answered. A list that is not loaded gets not_synced under the first field of its group. asn also stands for asn_name and asn_country, and cloud_provider for cloud_service and is_cdn. {} when every part answered.",
                "properties": {
                  "asn": {
                    "type": "string"
                  },
                  "cloud_provider": {
                    "type": "string"
                  },
                  "crawler": {
                    "type": "string"
                  },
                  "geo_country": {
                    "type": "string"
                  },
                  "is_ptr_forward_confirmed": {
                    "description": "Present when ptr has a name, no name maps back and a forward question failed. The code says why the first failed one failed. It is server_error, truncated, malformed_answer, no_memory, timeout or no_resolver.",
                    "type": "string"
                  },
                  "is_tor_exit": {
                    "type": "string"
                  },
                  "listed_on": {
                    "type": "string"
                  },
                  "ptr": {
                    "description": "Present when the PTR question failed. The code says why. It is server_error, truncated, malformed_answer, no_memory, timeout, no_resolver or not_public_name. A name that does not exist is no failure.",
                    "type": "string"
                  }
                },
                "required": [],
                "type": "object"
              }
            },
            "required": ["asn", "asn_country", "asn_name", "cloud_provider", "cloud_service", "crawler", "credits", "geo_country", "internet_exposure", "ip_address", "is_cdn", "is_datacenter", "is_ptr_forward_confirmed", "is_tor_exit", "listed_on", "ptr", "reputation", "unavailable"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "com.contrastcyber/category": "IP Intelligence",
            "com.contrastcyber/credits": {
              "per_call": 1
            }
          },
          "digest": "sha256:93b37053660d85069e33dc57dc83d6506627f301d81b0238f764eaf0d198b7ee"
        },
        {
          "name": "kev_lookup",
          "title": "CISA KEV Lookup",
          "description": "CISA KEV entry of a CVE: required action, patch deadline, ransomware use. A removed CVE gives in_kev false, a never-listed one the tool error \"KEV entry not found\". Full CVE record: cve_lookup. CVEs in KEV now: cve_search with in_kev=true.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cve_id": {
                "description": "CVE ID",
                "maxLength": 24,
                "type": "string"
              }
            },
            "required": ["cve_id"],
            "type": "object"
          },
          "outputSchema": {
            "description": "A CVE in CISA KEV now or removed from it. A CVE never listed gets the tool error KEV entry not found.",
            "properties": {
              "credits": {
                "properties": {
                  "charged": {
                    "description": "Credits this call cost; 0 for a free tool.",
                    "type": "integer"
                  },
                  "remaining": {
                    "description": "Credits left in the budget window. Absent when not paid from a credit budget.",
                    "type": "integer"
                  }
                },
                "required": ["charged"],
                "type": "object"
              },
              "cve_id": {
                "type": "string"
              },
              "cwes": {
                "items": {
                  "type": "string"
                },
                "type": ["array", "null"]
              },
              "date_added": {
                "description": "YYYY-MM-DD, or empty.",
                "type": "string"
              },
              "date_removed": {
                "description": "UTC YYYY-MM-DDTHH:MM:SSZ the KEV sync found it gone from CISA's feed. Empty while listed.",
                "type": "string"
              },
              "in_kev": {
                "description": "false for an entry CISA removed from the catalog.",
                "type": "boolean"
              },
              "known_ransomware_use": {
                "type": "boolean"
              },
              "notes": {
                "description": "CISA's free text, often URLs, or empty.",
