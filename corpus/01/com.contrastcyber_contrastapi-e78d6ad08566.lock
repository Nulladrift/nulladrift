        {
          "name": "well_known",
          "title": "Robots.txt and security.txt Check",
          "description": "Read robots.txt of https://<domain> and, if it allows us, /.well-known/security.txt, with up to 5 redirects on the host or its www pair. Gives the rules that bind us, sitemaps, fields such as Contact and Expires, and RFC 9309/9116 issues.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Host name of the site, such as www.example.com",
                "maxLength": 253,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "checked_at": {
                "description": "When the check ran, in UTC, as YYYY-MM-DDTHH:MM:SSZ. A cached answer keeps the time of its own check, up to an hour old.",
                "type": "string"
              },
              "credits": {
                "properties": {
                  "charged": {
                    "description": "Credits this call cost; 0 for a free tool.",
                    "type": "integer"
                  },
                  "remaining": {
                    "description": "Credits left in the budget window. Absent when not paid from a credit budget.",
                    "type": "integer"
                  }
                },
                "required": ["charged"],
                "type": "object"
              },
              "reason": {
                "description": "Present only when the throttle refused the fetch. It is then quota_exhausted, and robots_txt and security_txt are null.",
                "type": "string"
              },
              "retry_after_seconds": {
                "description": "Seconds to wait before the server sends that request again. Present only when reason is quota_exhausted.",
                "type": "integer"
              },
              "robots_txt": {
                "description": "null only when reason is quota_exhausted.",
                "properties": {
                  "by_severity": {
                    "description": "It counts every issue the file raised, dropped ones too.",
                    "properties": {
                      "info": {
                        "type": "integer"
                      },
                      "warning": {
                        "type": "integer"
                      }
                    },
                    "required": ["info", "warning"],
                    "type": "object"
                  },
                  "groups": {
                    "description": "The groups that bind ContrastAPI, its own and those of *, in file order. [] when no file was read. A file is read only when status_code is 2xx and issues lacks content_encoded. [] also when no group binds ContrastAPI or *.",
                    "items": {
                      "properties": {
                        "allow": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "crawl_delay": {
                          "description": "It is in seconds. null when the group has no valid Crawl-delay.",
                          "type": ["number", "null"]
                        },
                        "disallow": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "line": {
                          "description": "The line where the group starts.",
                          "type": "integer"
                        },
                        "user_agents": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        }
                      },
                      "required": ["allow", "crawl_delay", "disallow", "line", "user_agents"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "issues": {
                    "description": "It lists at most 50 parser issues, then the server's own warnings. code is a fixed snake_case name of what the parser found, such as line_syntax_invalid. The server adds redirect_limit_reached when the fetch stopped at its redirect limit, and content_encoded when the body came encoded and was not read. severity is warning or info.",
                    "items": {
                      "properties": {
                        "code": {
                          "type": "string"
                        },
                        "field": {
                          "description": "The directive or field the issue is about, or null.",
                          "type": ["string", "null"]
                        },
                        "line": {
                          "description": "It is the line, from 1, or null.",
                          "type": ["integer", "null"]
                        },
                        "severity": {
                          "type": "string"
                        }
                      },
                      "required": ["code", "field", "line", "severity"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "redirect_count": {
                    "description": "How many redirects came before the last request.",
                    "type": "integer"
                  },
                  "redirect_to": {
                    "description": "Present only when a redirect was left unfollowed. It holds its target, cut as url is.",
                    "type": "string"
                  },
                  "sitemaps": {
                    "description": "It lists the Sitemap values, at most 100. [] when no file was read, as for groups.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "status_code": {
                    "description": "It is the status of the last answer.",
                    "type": "integer"
                  },
                  "total_groups": {
                    "description": "Present only when groups dropped items. It counts them all.",
                    "type": "integer"
                  },
                  "total_issues": {
                    "description": "Present only when issues dropped items. It counts them all.",
                    "type": "integer"
                  },
                  "total_redirect_to_length": {
                    "description": "Present only when redirect_to was cut. It gives the whole length in code points.",
                    "type": "integer"
                  },
                  "total_rules": {
                    "description": "Present only when a rule of those groups was dropped. It counts them all.",
                    "type": "integer"
                  },
                  "total_sitemaps": {
                    "description": "Present only when sitemaps dropped items. It counts them all.",
                    "type": "integer"
                  },
                  "total_url_length": {
                    "description": "Present only when url was cut. It gives the whole length in code points.",
                    "type": "integer"
                  },
                  "url": {
                    "description": "It is the URL of the last request, without its query. A value longer than 500 code points is cut there. Absent, with status_code and redirect_count, when no request was sent.",
                    "type": "string"
                  }
                },
                "required": ["by_severity", "groups", "issues", "sitemaps"],
                "type": ["object", "null"]
              },
              "security_txt": {
                "description": "null only when reason is quota_exhausted. The members from content_type to by_severity are present only when status is found. Each field list holds at most 20 values.",
                "properties": {
                  "acknowledgments": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "by_severity": {
                    "description": "It counts every issue the file raised, dropped ones too.",
                    "properties": {
                      "error": {
                        "type": "integer"
                      },
                      "info": {
                        "type": "integer"
                      },
                      "warning": {
                        "type": "integer"
                      }
                    },
                    "required": ["error", "info", "warning"],
                    "type": "object"
                  },
                  "canonical": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "contact": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "content_type": {
                    "description": "It is the Content-Type of the answer, or null without one.",
                    "type": ["string", "null"]
                  },
                  "csaf": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "deciding_rule": {
                    "description": "Present only when status is robots_disallowed. The robots.txt rule that decided, or null when no single rule did.",
                    "properties": {
                      "kind": {
                        "description": "It is allow or disallow.",
                        "type": "string"
                      },
                      "line": {
                        "type": "integer"
                      },
                      "path": {
                        "type": "string"
                      }
                    },
                    "required": ["kind", "line", "path"],
                    "type": ["object", "null"]
                  },
                  "encryption": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "expires": {
                    "description": "The first Expires value as the file writes it, or null.",
                    "type": ["string", "null"]
                  },
                  "hiring": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "issues": {
                    "description": "It lists at most 50 parser issues, then content_encoded when the body came encoded. Their codes work as in robots_txt, such as contact_missing. severity is error, warning or info.",
                    "items": {
                      "properties": {
                        "code": {
                          "type": "string"
                        },
                        "field": {
                          "description": "The directive or field the issue is about, or null.",
                          "type": ["string", "null"]
                        },
                        "line": {
                          "description": "It is the line, from 1, or null.",
                          "type": ["integer", "null"]
                        },
                        "severity": {
                          "type": "string"
                        }
                      },
                      "required": ["code", "field", "line", "severity"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "openpgp_signed": {
                    "description": "true when the file is a whole OpenPGP signed message. The signature is not verified.",
                    "type": "boolean"
                  },
                  "policy": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "preferred_languages": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "redirect_count": {
                    "description": "As in robots_txt.",
                    "type": "integer"
                  },
                  "redirect_to": {
                    "description": "As in robots_txt.",
                    "type": "string"
                  },
                  "status": {
                    "description": "found: a file came back with a 2xx status. not_found: the site answered an error status such as 404, so there is no file. too_large: the file passed the size limit. robots_disallowed: robots.txt forbids the fetch. robots_unknown: robots.txt could not be read, so no fetch was sent. not_fetched: no answer was read, such as when time ran out.",
                    "type": "string"
                  },
                  "status_code": {
                    "description": "As in robots_txt.",
                    "type": "integer"
                  },
                  "total_acknowledgments": {
                    "description": "Present only when acknowledgments dropped items. It counts them all.",
                    "type": "integer"
                  },
                  "total_canonical": {
                    "description": "Present only when canonical dropped items. It counts them all.",
                    "type": "integer"
                  },
                  "total_contact": {
                    "description": "Present only when contact dropped items. It counts them all.",
                    "type": "integer"
                  },
                  "total_csaf": {
                    "description": "Present only when csaf dropped items. It counts them all.",
                    "type": "integer"
                  },
                  "total_encryption": {
                    "description": "Present only when encryption dropped items. It counts them all.",
                    "type": "integer"
                  },
                  "total_hiring": {
                    "description": "Present only when hiring dropped items. It counts them all.",
                    "type": "integer"
                  },
                  "total_issues": {
                    "description": "Present only when issues dropped items. It counts them all.",
                    "type": "integer"
                  },
                  "total_policy": {
                    "description": "Present only when policy dropped items. It counts them all.",
                    "type": "integer"
                  },
                  "total_preferred_languages": {
                    "description": "Present only when preferred_languages dropped items. It counts them all.",
                    "type": "integer"
                  },
                  "total_redirect_to_length": {
                    "description": "As in robots_txt.",
                    "type": "integer"
                  },
                  "total_url_length": {
                    "description": "As in robots_txt.",
                    "type": "integer"
                  },
                  "unknown_field_count": {
                    "description": "It counts the lines whose field name is not known.",
                    "type": "integer"
                  },
                  "url": {
                    "description": "As in robots_txt.",
                    "type": "string"
                  }
                },
                "required": ["status"],
                "type": ["object", "null"]
              }
            },
            "required": ["checked_at", "credits", "robots_txt", "security_txt"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "com.contrastcyber/category": "Domain Intelligence",
            "com.contrastcyber/credits": {
              "per_call": 1
            }
          },
          "digest": "sha256:6d5e0f40fcea11ccd6cf6befe7e37184eff7cd535d9ea8136f1f294c937299dc"
        },
        {
          "name": "whois_lookup",
          "title": "WHOIS / RDAP Lookup",
          "description": "Look up a domain's registration over RDAP, or WHOIS where allowed: registrar, dates, status, name servers and DNSSEC. A name under a registered domain asks about that domain. No registrant data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Domain name, such as example.com; www.example.com asks about example.com",
                "maxLength": 253,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "available": {
                "description": "false when the registry could not be asked. Then registered is null, and only reason and retry_after_seconds follow. It does not tell whether the domain is free to register.",
                "type": "boolean"
              },
              "created_at": {
                "description": "An RDAP date as the server wrote it. A WHOIS date is YYYY-MM-DD or a UTC time. null when none can be read.",
                "type": ["string", "null"]
              },
              "credits": {
                "properties": {
                  "charged": {
                    "description": "Credits this call cost; 0 for a free tool.",
                    "type": "integer"
                  },
                  "remaining": {
                    "description": "Credits left in the budget window. Absent when not paid from a credit budget.",
                    "type": "integer"
                  }
                },
                "required": ["charged"],
                "type": "object"
              },
              "dnssec_signed": {
                "description": "Whether the delegation is signed with DNSSEC. null when the answer does not say.",
                "type": ["boolean", "null"]
              },
              "domain": {
                "description": "The registrable domain the server asked about.",
                "type": "string"
              },
              "expires_at": {
                "description": "As created_at.",
                "type": ["string", "null"]
              },
              "name_server_count": {
                "description": "It counts every name server, past the first 16 too.",
                "type": "integer"
              },
              "name_servers": {
                "description": "It lists the first 16 name servers.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "rdap_server": {
                "description": "It is the base URL of the RDAP server that was asked. null when a WHOIS server was asked.",
                "type": ["string", "null"]
              },
              "reason": {
                "description": "Present only when available is false. It is no_registry_server when no registry server is known for the TLD, or quota_exhausted when the server reached its request limit for the registry server.",
                "type": "string"
              },
              "registered": {
                "description": "true when the answer holds the registration. null when available is false. A domain that is not registered is an error, so it is never false.",
                "type": ["boolean", "null"]
              },
              "registrar_iana_id": {
                "description": "null when the registration names none.",
                "type": ["integer", "null"]
              },
              "registrar_name": {
                "type": ["string", "null"]
              },
              "retry_after_seconds": {
                "description": "Seconds to wait before the server sends that request again. Present only when available is false. null unless reason is quota_exhausted.",
                "type": ["integer", "null"]
              },
              "status": {
                "description": "It lists the first 16 status values.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "status_count": {
                "description": "It counts every status value, past the first 16 too.",
                "type": "integer"
              },
              "updated_at": {
                "description": "As created_at.",
                "type": ["string", "null"]
              },
              "whois_server": {
                "description": "It is the host of the WHOIS server that was asked. null when an RDAP server was asked.",
                "type": ["string", "null"]
              }
            },
            "required": ["available", "credits", "domain", "registered"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "com.contrastcyber/category": "Domain Intelligence",
            "com.contrastcyber/credits": {
              "per_call": 1
            }
          },
          "digest": "sha256:2e3a2db12c731d284065af5d5a283806af648527154c72a05355c1202e86665d"
        }
      ],
      "digest": "sha256:e368f9b7aedad90698142ac351cb8ae2ca74d665590a20b6ed894e9f981db280"
    }
  }
