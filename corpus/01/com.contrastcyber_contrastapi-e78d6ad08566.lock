                            "items": {
                              "type": "string"
                            },
                            "type": "array"
                          },
                          "url": {
                            "type": "string"
                          }
                        },
                        "required": ["tags", "url"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "severity": {
                      "description": "From CVSS v3, else v4, else v2: CRITICAL, HIGH, MEDIUM, LOW, NONE (score 0.0), or UNKNOWN (no CVSS).",
                      "type": "string"
                    },
                    "ssvc": {
                      "description": "CISA's SSVC assessment. null when CISA has not assessed the CVE.",
                      "properties": {
                        "automatable": {
                          "description": "yes or no.",
                          "type": "string"
                        },
                        "exploitation": {
                          "description": "none, poc or active.",
                          "type": "string"
                        },
                        "mission_wellbeing": {
                          "description": "CISA's decision per mission and well-being impact level of the system's operator. Read high if the level is unknown. Members are described under low.",
                          "properties": {
                            "high": {
                              "properties": {
                                "decision": {
                                  "type": "string"
                                },
                                "remediation_advice": {
                                  "type": "string"
                                }
                              },
                              "required": ["decision", "remediation_advice"],
                              "type": "object"
                            },
                            "low": {
                              "properties": {
                                "decision": {
                                  "description": "Track, Track* (Track, watched closer), Attend or Act, least to most urgent.",
                                  "type": "string"
                                },
                                "remediation_advice": {
                                  "description": "CISA's timeline: standard updates for Track and Track*, sooner for Attend, as soon as possible for Act.",
                                  "type": "string"
                                }
                              },
                              "required": ["decision", "remediation_advice"],
                              "type": "object"
                            },
                            "medium": {
                              "properties": {
                                "decision": {
                                  "type": "string"
                                },
                                "remediation_advice": {
                                  "type": "string"
                                }
                              },
                              "required": ["decision", "remediation_advice"],
                              "type": "object"
                            }
                          },
                          "required": ["high", "low", "medium"],
                          "type": "object"
                        },
                        "scored_at": {
                          "description": "UTC YYYY-MM-DDTHH:MM:SSZ. null when the time is not known.",
                          "type": ["string", "null"]
                        },
                        "technical_impact": {
                          "description": "partial or total.",
                          "type": "string"
                        },
                        "version": {
                          "type": "string"
                        }
                      },
                      "required": ["automatable", "exploitation", "mission_wellbeing", "scored_at", "technical_impact", "version"],
                      "type": ["object", "null"]
                    },
                    "vendor_advisory_count": {
                      "description": "References tagged Vendor Advisory.",
                      "type": "integer"
                    },
                    "vulnerability_status": {
                      "description": "NVD status, such as Analyzed, Modified, Deferred or Rejected. May be empty.",
                      "type": "string"
                    }
                  },
                  "required": ["affected_product_count", "affected_products", "cve_id", "cve_tags", "cvss_v3", "cvss_v3_source", "cvss_v3_vector", "cvss_v4", "cvss_v4_source", "cvss_v4_vector", "cwe_id", "cwe_source", "cwes", "description", "epss_percentile", "epss_score", "epss_trend", "ghsa", "has_metasploit_module", "in_kev", "kev_date_added", "metasploit_module_count", "nuclei_templates", "poc_count", "product_count_by_vendor", "published_time", "ransomware_campaign", "ref_count", "refs", "severity", "ssvc", "vendor_advisory_count", "vulnerability_status"],
                  "type": "object"
                },
                "type": "array"
              },
              "skipped": {
                "description": "Elements that are not a well-formed CVE ID.",
                "type": "integer"
              },
              "successful": {
                "description": "IDs found; results holds their records.",
                "type": "integer"
              },
              "total": {
                "description": "Elements submitted. Equals processed + skipped + the length of not_processed.",
                "type": "integer"
              }
            },
            "required": ["credits", "failed", "not_processed", "processed", "results", "skipped", "successful", "total"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.contrastcyber/category": "CVE Intelligence",
            "com.contrastcyber/credits": {
              "min": 1,
