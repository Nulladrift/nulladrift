        {
          "name": "email_auth_check",
          "title": "Email Authentication Check (SPF, DMARC, DKIM)",
          "description": "Check a domain's mail authentication: SPF, DMARC (from a parent domain when the domain has no record of its own), DKIM, MX and MTA-STS, each check with pass, warn or fail and a severity.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dkim_selector": {
                "description": "DKIM selector, such as google; without it the check tries the selectors of the domain's mail providers",
                "maxLength": 238,
                "type": "string"
              },
              "domain": {
                "description": "Domain name, such as example.com",
                "maxLength": 253,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "check_counts": {
                "properties": {
                  "fail": {
                    "type": "integer"
                  },
                  "pass": {
                    "type": "integer"
                  },
                  "warn": {
                    "type": "integer"
                  }
                },
                "required": ["fail", "pass", "warn"],
                "type": "object"
              },
              "checks": {
                "description": "The checks the answers allow, in a fixed order.",
                "items": {
                  "properties": {
                    "detail": {
                      "description": "It is a fixed sentence for the check and its result.",
                      "type": "string"
                    },
                    "id": {
                      "description": "It is spf_record, spf_syntax, spf_lookup_limit, spf_all, spf_ignored_terms, spf_ptr, spf_wide_range, spf_record_size, dmarc_record, dmarc_policy, dmarc_test_mode, dmarc_reporting, dkim_key_found, dkim_key_usable, dkim_key_size, dkim_key_format, dkim_test_mode, dkim_key_restricted, dkim_multiple_keys, mx or mta_sts.",
                      "type": "string"
                    },
                    "result": {
                      "description": "It is pass, warn or fail.",
                      "type": "string"
                    },
                    "severity": {
                      "description": "It is high, medium or low, fixed for each check.",
                      "type": "string"
                    }
                  },
                  "required": ["detail", "id", "result", "severity"],
                  "type": "object"
                },
                "type": "array"
              },
              "credits": {
                "properties": {
                  "charged": {
                    "description": "Credits this call cost; 0 for a free tool.",
                    "type": "integer"
                  },
                  "remaining": {
                    "description": "Credits left in the budget window. Absent when not paid from a credit budget.",
                    "type": "integer"
                  }
                },
                "required": ["charged"],
                "type": "object"
              },
              "dkim": {
                "description": "Its forms are as in spf.",
                "properties": {
                  "available": {
                    "type": "boolean"
                  },
                  "key_status": {
                    "description": "It is found when a tested selector holds a key. not_found means the selector the caller gave holds none. unknown means none of the selectors the server picked holds one, so the domain may sign with another.",
                    "type": "string"
                  },
                  "keys": {
                    "description": "The best key record of each selector that holds one.",
                    "items": {
                      "properties": {
                        "key_bits": {
                          "description": "null unless state is present.",
                          "type": ["integer", "null"]
                        },
                        "key_type": {
                          "description": "The k tag, or rsa when the record has none.",
                          "type": "string"
                        },
                        "selector": {
                          "type": "string"
                        },
                        "state": {
                          "description": "It is present, revoked, unreadable or unknown_type.",
                          "type": "string"
                        },
                        "test_mode": {
                          "description": "true when the key has t=y.",
                          "type": "boolean"
                        }
                      },
                      "required": ["key_bits", "key_type", "selector", "state", "test_mode"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "reason": {
                    "description": "The code says why the DNS question failed. It is server_error, truncated, malformed_answer, timeout, no_resolver, bad_question or not_public_name.",
                    "type": "string"
                  },
                  "selector_source": {
                    "description": "It is given, provider or common. It says where the tested selectors come from.",
                    "type": "string"
                  },
                  "tested_selectors": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "usable_key_count": {
                    "description": "It counts the selectors whose key state is present.",
                    "type": "integer"
                  }
                },
                "required": ["available"],
                "type": "object"
              },
              "dmarc": {
                "description": "Its forms are as in spf.",
                "properties": {
                  "aggregate_report_uris": {
                    "description": "It lists the first 8 addresses of the rua tag.",
                    "items": {
                      "type": "string"
                    },
                    "type": ["array", "null"]
                  },
                  "applied_policy": {
                    "description": "The policy a receiver applies to the domain's mail. null when no record applies. Also null when a policy tag is invalid and rua holds no valid address, since receivers then ignore the record.",
                    "type": ["string", "null"]
                  },
                  "available": {
                    "type": "boolean"
                  },
                  "domain_role": {
                    "description": "It is public_suffix, organizational, not_public_suffix or invalid, from the psd tag. null when the record lacks the tag.",
                    "type": ["string", "null"]
                  },
                  "failure_report_uris": {
                    "description": "It lists the first 8 addresses of the ruf tag.",
                    "items": {
                      "type": "string"
                    },
                    "type": ["array", "null"]
                  },
                  "nonexistent_subdomain_policy": {
                    "description": "It is none, quarantine, reject or invalid. null when the record lacks the tag.",
                    "type": ["string", "null"]
                  },
                  "policy": {
                    "description": "It is none, quarantine, reject or invalid. null when the record lacks the tag.",
                    "type": ["string", "null"]
                  },
                  "reason": {
                    "description": "The code says why the DNS question failed. It is server_error, truncated, malformed_answer, timeout, no_resolver, bad_question or not_public_name.",
                    "type": "string"
                  },
                  "record": {
                    "type": ["string", "null"]
                  },
                  "record_name": {
                    "description": "The DNS name of the record that applies. null when no record applies, and then every member below is null.",
                    "type": ["string", "null"]
                  },
                  "source": {
                    "description": "It is domain, organizational or public_suffix: whose record applies.",
                    "type": ["string", "null"]
                  },
                  "subdomain_policy": {
                    "description": "It is none, quarantine, reject or invalid. null when the record lacks the tag.",
                    "type": ["string", "null"]
                  },
                  "test_mode": {
                    "description": "true when the record has t=y.",
                    "type": ["boolean", "null"]
                  }
                },
                "required": ["available"],
                "type": "object"
              },
              "domain": {
                "type": "string"
              },
              "mail_providers": {
                "description": "The mail providers that the MX hosts and the SPF record name, each once.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "mta_sts": {
                "description": "Its forms are as in spf.",
                "properties": {
                  "available": {
                    "type": "boolean"
                  },
                  "reason": {
                    "description": "The code says why the DNS question failed. It is server_error, truncated, malformed_answer, timeout, bad_question or not_public_name.",
                    "type": "string"
                  },
                  "record_found": {
                    "description": "true when the MTA-STS name holds exactly one MTA-STS record.",
                    "type": "boolean"
                  }
                },
                "required": ["available"],
                "type": "object"
              },
              "mx": {
                "description": "Its forms are as in spf.",
                "properties": {
                  "available": {
                    "type": "boolean"
                  },
                  "hosts": {
                    "description": "It lists every other MX record.",
                    "items": {
                      "properties": {
                        "host": {
                          "type": "string"
                        },
                        "priority": {
                          "type": "integer"
                        }
                      },
                      "required": ["host", "priority"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "null_mx": {
                    "description": "true when an MX record is a null MX, which says the domain takes no mail.",
                    "type": "boolean"
                  },
                  "reason": {
                    "description": "The code says why the DNS question failed. It is server_error, truncated, malformed_answer, timeout or not_public_name.",
                    "type": "string"
                  }
                },
                "required": ["available"],
                "type": "object"
              },
              "no_mail_domain": {
                "description": "true when the domain says it takes and sends no mail.",
                "type": "boolean"
              },
              "spf": {
                "description": "available is false when the DNS question failed. Then only reason follows.",
                "properties": {
                  "available": {
                    "type": "boolean"
                  },
                  "dns_lookup_term_count": {
                    "description": "It counts the terms that make a DNS lookup, as a receiver counts them. It covers this record only.",
                    "type": ["integer", "null"]
                  },
                  "invalid_term_count": {
                    "type": ["integer", "null"]
                  },
                  "reason": {
                    "description": "The code says why the DNS question failed. It is server_error, truncated, malformed_answer, timeout or not_public_name.",
                    "type": "string"
                  },
                  "record": {
                    "description": "null unless record_count is 1. terms and the three counts are then null too.",
                    "type": ["string", "null"]
                  },
                  "record_count": {
                    "description": "It counts the SPF records among the domain's TXT records.",
                    "type": "integer"
                  },
                  "terms": {
                    "description": "It holds the first 64 terms of the record.",
                    "items": {
                      "properties": {
                        "kind": {
                          "description": "It is all, include, a, mx, ptr, ip4, ip6, exists, redirect, exp, unknown_modifier or invalid.",
                          "type": "string"
                        },
                        "qualifier": {
                          "description": "It is pass, fail, softfail or neutral. null for a modifier and for an invalid term.",
                          "type": ["string", "null"]
                        },
                        "value": {
                          "description": "It is the text after the term's name. null when the term has none, such as -all.",
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["kind", "qualifier", "value"],
                      "type": "object"
                    },
                    "type": ["array", "null"]
                  },
                  "unread_term_count": {
                    "description": "It counts the terms after the first 64, which terms leaves out.",
                    "type": ["integer", "null"]
                  }
                },
                "required": ["available"],
                "type": "object"
              }
            },
            "required": ["check_counts", "checks", "credits", "dkim", "dmarc", "domain", "mail_providers", "mta_sts", "mx", "no_mail_domain", "spf"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
