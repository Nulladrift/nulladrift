        {
          "name": "email_address_check",
          "title": "Email Address Check",
          "description": "Check an e-mail address without sending mail: whether its domain exists and takes mail, and whether a disposable domain list names it. It cannot tell whether the mailbox exists.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "E-mail address, such as name@example.com",
                "maxLength": 254,
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "accepts_mail": {
                "description": "true when mail_route is mx or implicit_mx.",
                "type": "boolean"
              },
              "credits": {
                "properties": {
                  "charged": {
                    "description": "Credits this call cost; 0 for a free tool.",
                    "type": "integer"
                  },
                  "remaining": {
                    "description": "Credits left in the budget window. Absent when not paid from a credit budget.",
                    "type": "integer"
                  }
                },
                "required": ["charged"],
                "type": "object"
              },
              "disposable": {
                "description": "true when the disposable domain list names the domain or a parent of it. null while the list is not loaded.",
                "type": ["boolean", "null"]
              },
              "disposable_listed_domain": {
                "description": "The name the list holds: the domain or a parent of it. null unless disposable is true.",
                "type": ["string", "null"]
              },
              "domain": {
                "type": "string"
              },
              "domain_exists": {
                "description": "false when the resolver said the domain does not exist.",
                "type": "boolean"
              },
              "email": {
                "description": "It is the address, with its domain in lower case.",
                "type": "string"
              },
              "mail_route": {
                "description": "It is mx when MX hosts take the mail, implicit_mx when the domain has no MX and its own address takes it, null_mx when it takes no mail, or none when it has no MX, A or AAAA record. null when the domain does not exist.",
                "type": ["string", "null"]
              },
              "mx_hosts": {
                "description": "The MX records, as dns_lookup writes them.",
                "items": {
                  "properties": {
                    "host": {
                      "type": "string"
                    },
                    "priority": {
                      "type": "integer"
                    }
                  },
                  "required": ["host", "priority"],
                  "type": "object"
                },
                "type": "array"
              },
              "unavailable": {
                "description": "It holds disposable_listed_domain with not_synced while the disposable domain list is not loaded. It is {} otherwise.",
                "properties": {
                  "disposable_listed_domain": {
                    "type": "string"
                  }
                },
                "required": [],
                "type": "object"
              }
            },
            "required": ["accepts_mail", "credits", "disposable", "disposable_listed_domain", "domain", "domain_exists", "email", "mail_route", "mx_hosts", "unavailable"],
