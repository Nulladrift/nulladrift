{
  "lockfileVersion": 2,
  "subjects": {
    "com.getscreenshotapi/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.getscreenshotapi.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "getscreenshot",
        "title": "GetScreenshot",
        "version": "0.1.0",
        "websiteUrl": "https://www.getscreenshotapi.com/agents/"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "GetScreenshot captures public web pages with a hosted headless browser and returns images sized for vision models. Use capture_screenshot to look at a live URL; pass `element` to look at one part of a page cheaply, and `full_page` only when you need the whole page. Use render_html to see HTML you have as a string (a component or page you just wrote); this is also the way to check local work, because the service cannot reach localhost or private networks. Use compare_screenshots to verify a visual change (before/after, staging vs production), capture_pdf for an A4 PDF link, and get_usage to check the remaining quota. Every capture uses one screenshot of the monthly quota, failed captures included, and takes about 9-25 seconds, so fix the input instead of retrying a failure unchanged. If a page fails to load, retry once with wait_until: \"domcontentloaded\". Captures are single shots of a page: there is no session, login flow or multi-step interaction.",
      "tools": [
        {
          "name": "capture_pdf",
          "title": "Capture PDF",
          "description": "Save a public web page as an A4 PDF and return a link to the file. Use it when the user wants a document to keep, share or archive. The PDF is not shown to you; to look at a page use capture_screenshot. Costs 1 screenshot of the monthly quota per call, failed captures included. Takes about 9-25 seconds. The link is public to anyone who has it and expires in 30 days. Limits: the page must be reachable from the public internet (no localhost or private networks).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "custom_css": {
                "description": "CSS injected before the PDF is made, for example print tweaks.",
                "maxLength": 20000,
                "minLength": 1,
                "type": "string"
              },
              "hide_selectors": {
                "description": "CSS selector(s) to hide (display:none) before capture, comma-separated, for example \".newsletter-popup, #ad-banner\".",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "url": {
                "description": "Absolute http(s) URL of the page, reachable from the public internet. localhost and private-network addresses cannot be captured; use render_html for local HTML.",
                "maxLength": 8192,
                "minLength": 1,
                "type": "string"
              },
              "wait_ms": {
                "description": "Extra wait in milliseconds after load, before the capture. API default 2000. Raise it for late animations or client-side rendering.",
                "maximum": 20000,
                "minimum": 0,
                "type": "integer"
              },
              "wait_until": {
                "description": "When the page counts as loaded. API default \"networkidle2\". Use \"domcontentloaded\" for heavy or slow sites (fastest, most reliable); \"networkidle0\" waits for all network activity to stop.",
                "enum": ["load", "domcontentloaded", "networkidle0", "networkidle2"],
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "captured_at": {
                "type": ["string", "null"]
              },
              "expires_in_days": {
                "type": "number"
              },
              "origin_url": {
                "type": "string"
              },
              "page_status": {
                "type": ["number", "null"]
              },
              "pdf_url": {
                "description": "The PDF file. Public to anyone who has the link.",
                "type": "string"
              },
              "warnings": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["captured_at", "expires_in_days", "origin_url", "page_status", "pdf_url", "warnings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Capture PDF"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:899f15e80ac88f4030e66b1c1b03cb3af61fb6df45b46ba537bd1199219e82a1"
        },
        {
          "name": "capture_screenshot",
          "title": "Capture screenshot",
          "description": "Capture a public web page as an image you can see. Renders the URL in a hosted headless Chromium and returns a link to the full-resolution image plus inline JPEG images sized for vision models. Use it to look at a live page, verify a deployed change, check a design on a phone preset, or read content that needs JavaScript to render. By default it captures the 1280x800 viewport (one image, about 1,300 image tokens). Pass `element` to capture one part of the page, or `full_page: true` for the whole page; tall captures come back as up to `max_slices` slices from the top. Costs 1 screenshot of the monthly quota per call, failed captures included. Takes about 9-25 seconds. Limits: the page must be reachable from the public internet (no localhost or private networks: use render_html for local HTML). One shot per call, no login flows or multi-step interaction. Sites with aggressive bot protection may refuse headless browsers.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "click": {
                "description": "CSS selector of an element to click once before the capture, for example to open a menu or dismiss a dialog. A selector that matches nothing makes the capture fail.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "cookie": {
                "additionalProperties": false,
                "description": "One cookie to set for the target host before loading, for example a feature flag or locale. Do not pass credentials or session tokens.",
                "properties": {
                  "name": {
                    "maxLength": 256,
                    "minLength": 1,
                    "pattern": "^[^,;=\\s]+$",
                    "type": "string"
                  },
                  "value": {
                    "maxLength": 4096,
                    "pattern": "^[^,;\\s]*$",
                    "type": "string"
                  }
                },
                "required": ["name", "value"],
                "type": "object"
              },
              "custom_css": {
                "description": "CSS injected into the page before capture.",
                "maxLength": 20000,
                "minLength": 1,
                "type": "string"
              },
              "custom_js": {
                "description": "JavaScript run in the page before capture.",
                "maxLength": 20000,
                "minLength": 1,
                "type": "string"
              },
              "detail": {
                "default": "standard",
                "description": "Size of the inline images. \"standard\": at most 1280 px wide, about 1,568 tokens per image. \"high\": at most 1920 px wide, about 4,784 tokens per image; use it only to read small text.",
                "enum": ["standard", "high"],
                "type": "string"
              },
              "device": {
                "description": "Device preset: sets the viewport and, for phones, a mobile user agent. Overrides width and height. iphone* and pixel* are phones, ipad* are tablets, the rest are fixed desktop sizes.",
                "enum": ["iphone5", "iphone678", "iphone678_plus", "iphonex", "iphone12", "pixel2", "pixel2_xl", "ipad", "ipadpro", "hvga", "wvga", "dvga", "wxga_v", "xga", "wxga_s", "wxga_l", "sxga", "wsxga_plus"],
                "type": "string"
              },
              "element": {
                "description": "CSS selector of one element to capture, for example \"#pricing\" or \"main .hero\". Cheapest way to look at one part of a page. A selector that matches nothing makes the capture fail (and still uses quota).",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "format": {
                "default": "png",
                "description": "Format of the stored file at screenshot_url. Inline images are always JPEG.",
                "enum": ["png", "jpeg"],
                "type": "string"
              },
              "full_page": {
                "default": false,
                "description": "Capture the whole scrollable page instead of just the viewport. Tall pages are returned as several image slices and cost more tokens.",
                "type": "boolean"
              },
              "full_page_strategy": {
                "description": "Full-page capture strategy 0-3 (default 0). Try another value if a full_page capture renders badly (missing sections, repeated headers).",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "height": {
                "description": "Viewport height in CSS pixels. API default 800. Ignored when device is set.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "hide_chat_widgets": {
                "default": false,
                "description": "Hide common chat widgets (Intercom, Drift and similar).",
                "type": "boolean"
              },
              "hide_cookie_banners": {
                "default": true,
                "description": "Hide common cookie-consent banners. Set false to keep them in the picture.",
                "type": "boolean"
              },
              "hide_selectors": {
                "description": "CSS selector(s) to hide (display:none) before capture, comma-separated, for example \".newsletter-popup, #ad-banner\".",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "highlight": {
                "description": "Keyword(s) to highlight on the page.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "lang": {
                "description": "Browser language / Accept-Language, for example \"de-DE\". API default \"en-US\".",
                "maxLength": 35,
                "minLength": 2,
                "type": "string"
              },
              "max_slices": {
                "default": 4,
                "description": "Maximum number of inline images. A tall capture is cut into slices from the top; slices beyond this are left out and reported as truncated. Slices are also left out if the inline images would exceed about 1.5 MB in total (4 MB at high detail).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "return": {
                "default": "image_and_url",
                "description": "\"image_and_url\" attaches the images. \"url_only\" returns just the link and sizes, for when you need the file but do not need to look at it (uses no image tokens).",
                "enum": ["image_and_url", "url_only"],
                "type": "string"
              },
              "scale": {
                "description": "Device pixel ratio of the stored image: 1 (default), 2 (retina) or 3. Affects the file at screenshot_url; inline images are downscaled either way.",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "transparent_background": {
                "default": false,
                "description": "Keep the background transparent where the page sets none (PNG only). Inline images are flattened onto white.",
                "type": "boolean"
              },
              "url": {
                "description": "Absolute http(s) URL of the page, reachable from the public internet. localhost and private-network addresses cannot be captured; use render_html for local HTML.",
                "maxLength": 8192,
                "minLength": 1,
                "type": "string"
              },
              "wait_ms": {
                "description": "Extra wait in milliseconds after load, before the capture. API default 2000. Raise it for late animations or client-side rendering.",
                "maximum": 20000,
                "minimum": 0,
                "type": "integer"
              },
              "wait_until": {
                "description": "When the page counts as loaded. API default \"networkidle2\". Use \"domcontentloaded\" for heavy or slow sites (fastest, most reliable); \"networkidle0\" waits for all network activity to stop.",
                "enum": ["load", "domcontentloaded", "networkidle0", "networkidle2"],
                "type": "string"
              },
              "width": {
                "description": "Viewport width in CSS pixels. API default 1280. Ignored when device is set.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "captured_at": {
                "description": "ISO 8601 UTC time of the capture.",
                "type": ["string", "null"]
              },
              "estimated_image_tokens": {
                "description": "Approximate total vision tokens of the inline images.",
                "type": "number"
              },
              "expires_in_days": {
                "description": "Stored files are deleted after this many days.",
                "type": "number"
              },
              "format": {
                "description": "Format of the stored file at screenshot_url.",
                "enum": ["png", "jpeg"],
                "type": "string"
              },
              "images": {
                "description": "One entry per inline image, in the same order as the image blocks.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "estimated_tokens": {
                      "description": "Approximate vision tokens: ceil(width/28) * ceil(height/28).",
                      "type": "number"
                    },
                    "height": {
                      "type": "number"
                    },
                    "index": {
                      "description": "0-based position of the slice, top to bottom.",
                      "type": "number"
                    },
                    "width": {
                      "type": "number"
                    },
                    "y": {
                      "description": "Top offset of this image within the downscaled capture, in the same pixels as width/height.",
                      "type": "number"
                    }
                  },
                  "required": ["estimated_tokens", "height", "index", "width", "y"],
                  "type": "object"
                },
                "type": "array"
              },
              "origin_url": {
                "type": "string"
              },
              "original": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "height": {
                        "type": "number"
                      },
                      "width": {
                        "type": "number"
                      }
                    },
                    "required": ["height", "width"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Pixel size of the stored image. Null if it could not be read."
              },
              "page_status": {
                "description": "HTTP status the page answered with. 400 or above usually means an error page was captured.",
                "type": ["number", "null"]
              },
              "screenshot_url": {
                "description": "Full-resolution image. Public to anyone who has the link.",
                "type": "string"
              },
              "total_slices": {
                "description": "How many slices the whole image needs at this detail level, whether or not they are attached. With return: \"url_only\" this is how many a normal call would produce.",
                "type": "number"
              },
              "truncated": {
                "description": "True when images were requested and some slices were left out, because of max_slices or the inline size limit. Always false with return: \"url_only\", where no image is attached by request.",
                "type": "boolean"
              },
              "warnings": {
                "description": "Things worth knowing about this result, for example an error status from the page.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["captured_at", "estimated_image_tokens", "expires_in_days", "format", "images", "origin_url", "original", "page_status", "screenshot_url", "total_slices", "truncated", "warnings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Capture screenshot"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4116d8daa4e1aec85385fd35ad70f6e903f6566dfe6682b1704968b85011266f"
        },
        {
          "name": "compare_screenshots",
          "title": "Compare screenshots",
          "description": "Visual diff of two pages or two existing screenshots. Use it to verify a change did what you intended and nothing else moved: before/after a deploy, staging vs production, or one page at two points in time. Each side is either `{url}` (captured now) or `{screenshot_url}` (an earlier GetScreenshot result, reused at no cost; it is checked before any capture is spent). To compare a page across a change, capture it first, make the change, then pass the earlier screenshot_url as `before` and the page url as `after`. Returns the percentage of changed pixels, the bounding box of the changed area, and a diff image: the after image dimmed, changed pixels in magenta, a red rectangle around the changed area. When nothing changed no image is attached. Costs 1 screenshot of the monthly quota per side given as `url` (0 to 2 per call). Both sides are captured with the same viewport options. Takes about 9-25 seconds when it captures. Limits: pages must be publicly reachable. At most the top 2,400 px are compared (at up to 1280 px wide); for a lower part of a long page, capture that part of both versions with capture_screenshot and `element`, then compare the two screenshot_url values. Animations, ads and rotating content show up as differences; hide them with hide_selectors.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "after": {
                "additionalProperties": false,
                "description": "The \"after\" image. Provide exactly one of url or screenshot_url.",
                "properties": {
                  "screenshot_url": {
                    "description": "The screenshot_url of an earlier GetScreenshot capture (uses no quota). Only GetScreenshot storage URLs are accepted.",
                    "maxLength": 2048,
                    "minLength": 1,
                    "type": "string"
                  },
                  "url": {
                    "description": "A public page URL to capture now (uses 1 screenshot of quota).",
                    "maxLength": 8192,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "before": {
                "additionalProperties": false,
                "description": "The \"before\" image. Provide exactly one of url or screenshot_url.",
                "properties": {
                  "screenshot_url": {
                    "description": "The screenshot_url of an earlier GetScreenshot capture (uses no quota). Only GetScreenshot storage URLs are accepted.",
                    "maxLength": 2048,
                    "minLength": 1,
                    "type": "string"
                  },
                  "url": {
                    "description": "A public page URL to capture now (uses 1 screenshot of quota).",
                    "maxLength": 8192,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "device": {
                "description": "Device preset: sets the viewport and, for phones, a mobile user agent. Overrides width and height. iphone* and pixel* are phones, ipad* are tablets, the rest are fixed desktop sizes.",
                "enum": ["iphone5", "iphone678", "iphone678_plus", "iphonex", "iphone12", "pixel2", "pixel2_xl", "ipad", "ipadpro", "hvga", "wvga", "dvga", "wxga_v", "xga", "wxga_s", "wxga_l", "sxga", "wsxga_plus"],
                "type": "string"
              },
              "full_page": {
                "default": false,
                "description": "Capture whole pages instead of the viewport. Applies to sides given as url.",
                "type": "boolean"
              },
              "height": {
                "description": "Viewport height in CSS pixels. API default 800. Ignored when device is set.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "hide_selectors": {
                "description": "CSS selector(s) to hide in both captures. Use it to remove things that change on every load (ads, carousels, timestamps) so they do not show up as differences.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "threshold": {
                "default": 0.1,
                "description": "Per-pixel colour tolerance from 0 (any difference counts) to 1 (nothing counts). Default 0.1 ignores anti-aliasing noise.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "wait_ms": {
                "description": "Extra wait in milliseconds after load, before the capture. API default 2000. Raise it for late animations or client-side rendering.",
                "maximum": 20000,
                "minimum": 0,
                "type": "integer"
              },
              "wait_until": {
                "description": "When the page counts as loaded. API default \"networkidle2\". Use \"domcontentloaded\" for heavy or slow sites (fastest, most reliable); \"networkidle0\" waits for all network activity to stop.",
                "enum": ["load", "domcontentloaded", "networkidle0", "networkidle2"],
                "type": "string"
              },
              "width": {
                "description": "Viewport width in CSS pixels. API default 1280. Ignored when device is set.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["after", "before"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "after": {
                "additionalProperties": false,
                "properties": {
                  "height": {
                    "type": "number"
                  },
                  "origin_url": {
                    "description": "Page that was captured; null when an existing screenshot was supplied.",
                    "type": ["string", "null"]
                  },
                  "page_status": {
                    "type": ["number", "null"]
                  },
                  "screenshot_url": {
                    "type": "string"
                  },
                  "width": {
                    "type": "number"
                  }
                },
                "required": ["height", "origin_url", "page_status", "screenshot_url", "width"],
                "type": "object"
              },
              "before": {
                "additionalProperties": false,
                "properties": {
                  "height": {
                    "type": "number"
                  },
                  "origin_url": {
                    "description": "Page that was captured; null when an existing screenshot was supplied.",
                    "type": ["string", "null"]
                  },
                  "page_status": {
                    "type": ["number", "null"]
                  },
                  "screenshot_url": {
                    "type": "string"
                  },
                  "width": {
                    "type": "number"
                  }
                },
                "required": ["height", "origin_url", "page_status", "screenshot_url", "width"],
                "type": "object"
              },
              "bounding_box": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "height": {
                        "type": "number"
                      },
                      "width": {
                        "type": "number"
                      },
                      "x": {
                        "type": "number"
                      },
                      "y": {
                        "type": "number"
                      }
                    },
                    "required": ["height", "width", "x", "y"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Smallest rectangle containing all changed pixels, in comparison-image pixels. Null when nothing changed."
              },
              "changed_percent": {
                "description": "Share of compared pixels that differ, 0-100.",
                "type": "number"
              },
              "changed_pixels": {
                "type": "number"
              },
              "compared": {
                "additionalProperties": false,
                "description": "Size both images were normalised to before comparing.",
                "properties": {
                  "height": {
                    "type": "number"
                  },
                  "width": {
                    "type": "number"
                  }
                },
                "required": ["height", "width"],
                "type": "object"
              },
              "estimated_image_tokens": {
                "description": "Approximate total vision tokens of the inline images.",
                "type": "number"
              },
              "expires_in_days": {
                "description": "Stored files are deleted after this many days.",
                "type": "number"
              },
              "identical": {
                "description": "True when no compared pixel differs and both images have exactly the same width and height.",
                "type": "boolean"
              },
              "images": {
                "description": "One entry per inline image, in the same order as the image blocks.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "estimated_tokens": {
                      "description": "Approximate vision tokens: ceil(width/28) * ceil(height/28).",
                      "type": "number"
                    },
                    "height": {
                      "type": "number"
                    },
                    "index": {
                      "description": "0-based position of the slice, top to bottom.",
                      "type": "number"
                    },
                    "width": {
                      "type": "number"
                    },
                    "y": {
                      "description": "Top offset of this image within the downscaled capture, in the same pixels as width/height.",
                      "type": "number"
                    }
                  },
                  "required": ["estimated_tokens", "height", "index", "width", "y"],
                  "type": "object"
                },
                "type": "array"
              },
              "size_changed": {
                "description": "True when the two images differ in size, for example the page got taller.",
                "type": "boolean"
              },
              "threshold": {
                "type": "number"
              },
              "total_pixels": {
                "type": "number"
              },
              "total_slices": {
                "description": "How many slices the whole image needs at this detail level, whether or not they are attached. With return: \"url_only\" this is how many a normal call would produce.",
                "type": "number"
              },
              "truncated": {
                "description": "True when images were requested and some slices were left out, because of max_slices or the inline size limit. Always false with return: \"url_only\", where no image is attached by request.",
                "type": "boolean"
              },
              "warnings": {
                "description": "Things worth knowing about this result, for example an error status from the page.",
                "items": {
