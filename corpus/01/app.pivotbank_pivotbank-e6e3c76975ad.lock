        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Convert bank statement PDFs to Excel, CSV, QuickBooks or Xero with every row checked against the balances, check that a statement adds up, and summarise spending. Docs: https://pivotbank.app/llms.txt",
      "tools": [
        {
          "name": "check_statement_balances",
          "title": "Check that a bank statement adds up",
          "description": "Use this when the user asks whether a bank statement is complete, correct or genuine, or why its numbers do not add up. Reads the PDF and checks every row against the statement's own running balances: opening plus money in minus money out must land on the closing balance to the cent. Says whether it does, and names the rows where it breaks. Free with a PivotBank account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "pdf_base64": {
                "description": "For clients without file attachments: the PDF, base64-encoded.",
                "type": "string"
              },
              "statement": {
                "description": "The bank statement PDF the user shared.",
                "properties": {
                  "download_url": {
                    "type": "string"
                  },
                  "file_id": {
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/fileParams": ["statement"]
          },
          "digest": "sha256:1b6596b4a28676c0cb92d0fe404adecec24a527ef7eb7395972959d09bf75fc4"
        },
        {
          "name": "convert_statement",
          "title": "Convert a bank statement PDF to Excel, CSV, QuickBooks or Xero",
          "description": "Use this when the user wants a bank statement or credit card statement PDF turned into a spreadsheet: Excel (xlsx), CSV, QuickBooks (QBO), Xero (OFX), Quicken (QIF) or JSON. Reads every transaction (date, description, money in, money out, balance) and checks them against the statement's own running balances, so the reading is proved rather than guessed. Saves the statement to the user's PivotBank account and returns a link to download it in any of those formats. Needs the user to sign in to PivotBank; agents may instead send a Pro API key as 'Authorization: Bearer pvb_live_...'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filename": {
                "description": "The file name, for your own records.",
                "type": "string"
              },
              "pdf_base64": {
                "description": "For clients without file attachments: the statement PDF, base64-encoded. 15 MB before encoding at most.",
                "type": "string"
              },
              "statement": {
                "description": "The bank statement PDF the user shared.",
                "properties": {
                  "download_url": {
                    "type": "string"
                  },
                  "file_id": {
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
