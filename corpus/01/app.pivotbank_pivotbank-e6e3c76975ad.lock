        {
          "name": "summarise_spending",
          "title": "Summarise spending on a bank statement",
          "description": "Use this when the user wants to know where their money went from a bank statement PDF: money in and out, spending by category, top merchants and repeating payments such as subscriptions. Free with a PivotBank account.",
