          },
          "digest": "sha256:a8d52d0a135a534d494600c10f189c4337f484640be151c81ece2d943f65e9ee"
        },
        {
          "name": "list_supported_banks",
          "title": "Banks recognised by name",
          "description": "Lists the banks PivotBank recognises by name, for one country (ISO 3166 alpha-2, e.g. GB, US, ZA) or for all. A statement from a bank not listed still converts: the reader works from the layout, not a per-bank template.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
