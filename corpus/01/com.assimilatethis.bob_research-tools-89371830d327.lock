      },
      "instructions": "Paid web research tools (research, search, news, fact-check, summarize, extract, prediction-market research, company briefs, US weather and alerts). Each call is paid in USDC with x402 and is independent, so batch and multi-page work is done by calling in parallel: search for addresses, then extract or summarize each page; one fact-check per claim; one brief per company or market question. Failed calls are not charged.",
      "tools": [
        {
          "name": "page.extract",
          "description": "Returns the main text of one public web page as clean markdown, unchanged and not summarized, up to 8,000 characters, as {url, markdown, truncated}, usually in 2 to 5 seconds. Pass the address of the specific page, not a site's home page; pages that need a login cannot be read, and longer pages are cut and flagged truncated. Use page.summarize for a short version. To read several pages, or to crawl a topic, get the addresses from web.search and call this once per address. Read-only. Paid per call with x402, up to 60 calls a minute per client; a failed call is not charged.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Public http or https address of the page to extract; private or local addresses are refused.",
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "bob_extractArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "markdown": {
                "description": "Main content of the page as markdown, up to 8,000 characters.",
                "type": "string"
              },
              "truncated": {
                "description": "True if the page was longer than the cap.",
                "type": "boolean"
              },
              "url": {
                "description": "The page that was read.",
                "type": "string"
              }
            },
            "required": ["markdown", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Extract a web page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1eb26a8892bfda6851ca5d0a114a06246f6f53aebaa6189bebdece26e18c88d1"
        },
        {
          "name": "page.summarize",
          "description": "Condenses one public web page into an 80-word summary with up to 4 key points, returned as {url, summary, key_points}, usually in 3 to 6 seconds. The page is fetched live, so the summary reflects it now; pages behind a login or paywall may return little. Pass the address of the specific page, not a site's home page. Use page.extract for the page's own text. Read-only. Paid per call with x402; if the page cannot be read in time the call fails and is not charged.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Public http or https address of the page to summarize; private or local addresses are refused.",
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "bob_summarizeArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "key_points": {
                "description": "Key points from the page.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "summary": {
                "description": "About 80 words.",
                "type": "string"
              },
              "url": {
                "description": "The page that was summarized.",
                "type": "string"
              }
            },
            "required": ["summary", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Summarize a web page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c3059db96e8b500710119488b0f1935d3962977a852e00b6b517acad7bb1dc0a"
        },
        {
          "name": "research.answer",
          "description": "Answers one open research question from the live web in at most 80 words with up to 3 source URLs, returned as {answer, sources}, usually in 4 to 9 seconds. Use it for a synthesized answer; use web.search for raw links or research.factcheck to verify a claim. Name the people, places and dates the question depends on, and ask one question per call: several in one call get one blended answer. Read-only. Paid per call with x402, up to 60 calls a minute per client; a call that fails, times out or hits capacity is not charged. For several questions, make one call per question: calls are independent and can run in parallel.",
          "inputSchema": {
            "properties": {
              "q": {
                "description": "The research question to answer, 1 to 500 characters.",
                "title": "Q",
                "type": "string"
              }
            },
            "required": ["q"],
            "title": "bob_researchArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "answer": {
                "description": "Short answer synthesized from the live web.",
                "type": "string"
              },
              "sources": {
                "description": "Source URLs the answer rests on.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["answer"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Research a question"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9912450d3de0b00baca42eda569f822dd9b174764c39db7709d2acfef547221e"
        },
        {
          "name": "research.company",
          "description": "Returns a short sourced brief on one company as {company, summary, what_it_does, facts, recent, sources}, usually in 5 to 8 seconds. Pass a website address such as stripe.com to avoid name clashes; a bare name resolves to the best-known company with that name and the summary says when the name is ambiguous. Facts such as founding year, location, size, funding or leadership appear only when the sources state them, and conflicting figures are reported as the most recent one with its date. Read-only. Paid per call with x402; if the company cannot be described in time the call fails and is not charged.",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "A company name or website, 1 to 500 characters, e.g. Stripe or stripe.com.",
                "title": "Company",
                "type": "string"
              }
            },
            "required": ["company"],
            "title": "bob_company_briefArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "company": {
                "type": "string"
              },
              "facts": {
                "description": "Up to 5 short facts, only if the sources state them.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "recent": {
                "description": "Up to 3 recent developments.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "sources": {
                "description": "Source URLs.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "summary": {
                "description": "About 60 words.",
                "type": "string"
              },
              "what_it_does": {
                "description": "One sentence on the business.",
                "type": "string"
              }
            },
            "required": ["company", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Brief on a company"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:78ebd9330b9242fe31fdc37937f532dc61b823b01dfe97a9a59c8653af416109"
        },
        {
          "name": "research.factcheck",
          "description": "Checks one factual claim against the live web and returns {verdict, explanation, sources}, where verdict is supported, contradicted or unclear, usually in 4 to 9 seconds. Write the claim as a plain statement such as 'The Eiffel Tower is in Berlin' and split a compound claim into separate calls. Use research.answer for open questions. For several claims, call once per claim. Read-only. Paid per call with x402; a failed call is not charged.",
          "inputSchema": {
            "properties": {
              "claim": {
                "description": "The factual claim to check, 1 to 500 characters, written as a statement.",
                "title": "Claim",
                "type": "string"
              }
            },
            "required": ["claim"],
            "title": "bob_factcheckArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "explanation": {
                "description": "One or two sentences on why.",
                "type": "string"
              },
              "sources": {
                "description": "Source URLs behind the verdict.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "verdict": {
                "description": "How the live web treats the claim.",
                "enum": ["supported", "contradicted", "unclear"],
                "type": "string"
              }
            },
            "required": ["verdict"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Fact-check a claim"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7fbd39c16b9c677c683f9c7709b24b84c56f07da2bd6728e7bce6eae4684afd3"
        },
        {
          "name": "research.market",
          "description": "Builds an evidence brief for a prediction-market question (Kalshi, Polymarket or similar) from the live web: {question, as_of, summary, evidence_for, evidence_against, key_dates, resolution_notes, sources}, usually in 5 to 8 seconds. Pass the question as the market words it, including its date or threshold (for example 'by Dec 31, 2026' or 'above 4.5%'). It reports evidence and what decides resolution; it gives no probability, forecast or trading advice. Use research.answer for general questions. Read-only. Paid per call with x402; if it cannot answer in time the call fails and is not charged.",
          "inputSchema": {
            "properties": {
              "question": {
                "description": "The prediction-market question to research, 1 to 500 characters, worded as the market words it.",
                "title": "Question",
                "type": "string"
              }
            },
            "required": ["question"],
            "title": "bob_market_researchArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "as_of": {
                "description": "The date the brief was written, YYYY-MM-DD.",
                "type": "string"
              },
              "evidence_against": {
                "description": "Up to 3 facts that support No.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "evidence_for": {
                "description": "Up to 3 facts that support Yes.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "key_dates": {
                "description": "Known or upcoming dates, each 'YYYY-MM-DD: what happens'.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "question": {
                "type": "string"
              },
              "resolution_notes": {
                "description": "What usually decides resolution and what is ambiguous.",
                "type": "string"
              },
              "sources": {
                "description": "Source URLs.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "summary": {
                "description": "About 50 words of evidence, not a forecast.",
                "type": "string"
              }
            },
            "required": ["question", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Research a prediction-market question"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cf73cc2078d4772461dcc640168e91fd06575ec63b9286b8447126081bc13c74"
        },
        {
          "name": "weather.alerts",
          "description": "Returns active National Weather Service alerts (warnings, watches, advisories) for one US latitude and longitude as {source, location, count, alerts}, each with event, severity, urgency, area, times, description and instructions, usually in 1 to 2 seconds. An empty list means no active alert at that point. US government data, public domain; US points only. Read-only. Paid per call with x402; outside the US or if the service is unavailable the call fails and is not charged.",
          "inputSchema": {
            "properties": {
              "lat": {
                "description": "Latitude of a US point in decimal degrees, for example 32.78.",
                "maximum": 90,
                "minimum": -90,
                "title": "Lat",
                "type": "number"
              },
              "lon": {
                "description": "Longitude of a US point in decimal degrees, for example -96.80.",
                "maximum": 180,
                "minimum": -180,
                "title": "Lon",
                "type": "number"
              }
            },
            "required": ["lat", "lon"],
            "title": "bob_alertsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "alerts": {
                "description": "Active alerts.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "count": {
                "description": "Number of active alerts.",
                "type": "integer"
              },
              "location": {
                "type": "object"
              },
              "notes": {
                "description": "Source and caveats.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "source": {
                "type": "string"
              }
            },
            "required": ["alerts", "count", "location", "source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "US weather alerts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cad46f8a7df829698fa910c5bee4b30a2a9d5fac725d7d1c5f210a946fa821d3"
        },
        {
          "name": "weather.forecast",
          "description": "Returns current conditions and the National Weather Service 7-day forecast for one US latitude and longitude as {source, location, current, forecast_updated, forecast, notes}: nearest-station temperature, humidity, wind and pressure, then up to 14 forecast periods with temperature, chance of precipitation, wind and a summary, usually in 1 to 3 seconds. US government data, public domain; US points only. A forecast is an estimate. Read-only. Paid per call with x402; outside the US or if the service is unavailable the call fails and is not charged.",
          "inputSchema": {
            "properties": {
              "lat": {
                "description": "Latitude of a US point in decimal degrees, for example 32.78.",
                "maximum": 90,
                "minimum": -90,
                "title": "Lat",
                "type": "number"
              },
              "lon": {
                "description": "Longitude of a US point in decimal degrees, for example -96.80.",
                "maximum": 180,
                "minimum": -180,
                "title": "Lon",
                "type": "number"
              }
            },
            "required": ["lat", "lon"],
            "title": "bob_weatherArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "current": {
                "description": "Latest nearest-station observation, or null if none could be read.",
                "type": ["object", "null"]
              },
              "forecast": {
                "description": "Up to 14 forecast periods.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "forecast_updated": {
                "type": ["string", "null"]
              },
              "location": {
                "description": "The point, nearest city and forecast office.",
                "type": "object"
              },
              "notes": {
                "description": "Source and caveats.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "source": {
                "type": "string"
              }
            },
            "required": ["forecast", "location", "source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "US weather forecast"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:19a237e3085ab4d9da7d0fc28bcda5625b9d444eff83b30a5922a5ab9ba3448b"
        },
        {
          "name": "web.news",
          "description": "Returns recent news on one topic, person, company or event as {query, window_days, summary, developments: [{headline, date, source}]}: a summary of about 50 words and up to 4 dated developments, newest first, usually in 3 to 7 seconds. A short topic or name works better than a full question; days sets the look-back from today (1 to 30, default 7), so a quiet topic needs a larger value. Use web.search for raw links. Read-only; only what the dated results support is returned. Paid per call with x402; if nothing recent is found the call fails and is not charged.",
          "inputSchema": {
            "properties": {
              "days": {
                "default": 7,
                "description": "How many days back to look, 1 to 30. Default 7.",
                "maximum": 30,
                "minimum": 1,
                "title": "Days",
                "type": "integer"
              },
              "q": {
                "description": "The topic, person, company or event to get recent news on, 1 to 500 characters.",
                "title": "Q",
                "type": "string"
              }
            },
            "required": ["q"],
            "title": "bob_newsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "developments": {
                "description": "Up to 5 dated developments, newest first.",
                "items": {
                  "properties": {
                    "date": {
                      "description": "YYYY-MM-DD from the source, or null.",
                      "type": ["string", "null"]
                    },
                    "headline": {
                      "type": "string"
                    },
                    "source": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "query": {
                "description": "The topic that was searched.",
                "type": "string"
              },
              "summary": {
                "description": "About 50 words on what happened.",
                "type": "string"
              },
              "window_days": {
                "description": "How many days back were searched.",
                "type": "integer"
              }
            },
            "required": ["developments", "query", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Recent news on a topic"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8eb0243a49b2acf4396cb3610e4c5f1d9f89751d028db42084ac18c703eb8344"
        },
        {
          "name": "web.search",
          "description": "Runs a web search and returns ranked results as {query, results: [{title, url, snippet}]}. Use it for raw links to read yourself; use research.answer for a written answer. Plain phrases work as well as keywords; since and until (YYYY-MM-DD) limit results to a publish-date range, which suits recent news. Needs an x402 payment per call; if the search fails or finds nothing, you are not charged.",
          "inputSchema": {
            "properties": {
              "n": {
                "default": 5,
                "description": "How many results to return, 1 to 10. Default 5.",
                "maximum": 10,
                "minimum": 1,
                "title": "N",
                "type": "integer"
              },
              "q": {
                "description": "The web search query, 1 to 500 characters.",
                "title": "Q",
                "type": "string"
              },
              "since": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional. Only results published on or after this date, written YYYY-MM-DD, e.g. 2026-09-01.",
                "title": "Since"
              },
              "until": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional. Only results published on or before this date, written YYYY-MM-DD.",
                "title": "Until"
              }
            },
            "required": ["q"],
            "title": "bob_searchArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "published_between": {
                "description": "The since/until dates applied, if any.",
                "items": {
                  "type": ["string", "null"]
                },
                "type": "array"
              },
              "query": {
                "description": "The query that was searched.",
                "type": "string"
              },
              "results": {
                "description": "Ranked results.",
                "items": {
                  "properties": {
                    "snippet": {
                      "description": "Short passage from the page.",
                      "type": "string"
                    },
                    "title": {
                      "type": ["string", "null"]
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["query", "results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search the web"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
