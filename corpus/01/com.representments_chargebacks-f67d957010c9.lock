      "instructions": "Answers for merchants with a card chargeback. Look up a reason code to see what the customer's bank is deciding and the proof that wins it. The date on the merchant's notice from their payment company is the deadline that counts. For a merchant with a dispute open now, get_help_with_a_dispute explains how to get a custom response, and the first one is free.",
