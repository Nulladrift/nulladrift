      "tools": [
        {
          "name": "get_disease_surveillance",
          "description": "Get current surveillance data for a notifiable disease from MMWR/CDC.\n\n    Searches recent MMWR articles for surveillance reports and case counts\n    related to a specific notifiable disease. Useful for tracking disease\n    trends, outbreak reports, and current epidemiological data.\n\n    Args:\n        disease: Name of the disease (e.g. 'measles', 'tuberculosis',\n            'salmonella', 'pertussis', 'hepatitis A').\n    ",
          "inputSchema": {
            "properties": {
              "disease": {
                "title": "Disease",
                "type": "string"
              }
            },
            "required": ["disease"],
            "title": "get_disease_surveillanceArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_disease_surveillanceOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cc030f265f02937a06be3cd1d34bb4043b99dec7980b42d4573135bbc98bc5b4"
        },
        {
          "name": "get_recent_reports",
          "description": "Get recent MMWR weekly reports and recommendations from CDC.\n\n    Returns the most recent Morbidity and Mortality Weekly Report articles\n    published by the CDC, including titles, publication dates, and PubMed IDs.\n    MMWR is the CDC's primary vehicle for scientific publication of timely,\n    reliable, and authoritative public health information.\n\n    Args:\n        limit: Maximum number of reports to return (default 20, max 50).\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "title": "Limit",
                "type": "integer"
              }
            },
            "title": "get_recent_reportsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_recent_reportsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:43d9155988e0c380314bd52ad58d3ed96b89f3438866c7d6f6f5ab3fd4214ae0"
        },
        {
          "name": "get_report_detail",
          "description": "Get the full abstract and metadata of an MMWR article by PubMed ID.\n\n    Returns the complete abstract, authors, publication date, volume/issue,\n    and any MeSH subject headings. Use PMIDs from search_mmwr or\n    get_recent_reports results.\n\n    Args:\n        pmid: PubMed ID of the MMWR article (e.g. '38271059').\n    ",
          "inputSchema": {
            "properties": {
              "pmid": {
                "title": "Pmid",
                "type": "string"
              }
            },
            "required": ["pmid"],
            "title": "get_report_detailArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_report_detailOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e403877e0fa1367bf187109e8c4f1b563cee5f0e517b88b749a00a0b8b9dc724"
        },
        {
          "name": "search_mmwr",
          "description": "Search MMWR articles by topic via PubMed.\n\n    Searches the Morbidity and Mortality Weekly Report journal for articles\n    matching your query. Use for finding CDC guidance, outbreak reports,\n    surveillance summaries, and public health recommendations.\n\n    Args:\n        query: Search terms (e.g. 'COVID-19 vaccine effectiveness',\n            'influenza surveillance', 'measles outbreak 2024').\n        limit: Maximum number of results to return (default 20, max 100).\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "search_mmwrArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "search_mmwrOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e2545f12f82ed1eea40339e2c8585fce418e85647ccf1880b8a75edd08728727"
        }
      ],
      "digest": "sha256:e8968d44a34f0ed3c7d54e9dd99d6c84e7920509b811b29d88e943f3d71c7227"
    }
  }
