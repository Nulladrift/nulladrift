{
  "lockfileVersion": 2,
  "subjects": {
    "com.signatureforever/email-signatures": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://signatureforever.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "signatureforever",
        "title": "SignatureForever",
        "version": "1.0.0",
        "websiteUrl": "https://signatureforever.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "SignatureForever builds email signatures that survive real email clients, and audits ones you already have. Start with check_email_signature when the user already has a signature and something looks broken: it names the exact rule, the clients it breaks in, and the fix. Use email_client_compatibility_matrix when you need to answer what a given email client supports. Use create_email_signature to produce ready-to-paste HTML. Free signatures carry one small credit line at the bottom; get_pricing explains how to remove it and what else the paid tiers include.",
      "tools": [
        {
          "name": "check_email_signature",
          "title": "Check an email signature for breakage",
          "description": "Audit any email-signature HTML against what Gmail, Outlook 365, Outlook for Windows desktop, Apple Mail and iOS Mail actually do. Returns a verdict per client plus every problem found, each with the rule it breaks, why it breaks, and how to fix it. Use this when a signature renders wrong, images do not show, layout collapses in Outlook, or before sending a signature to a client. Free, no account needed.",
          "inputSchema": {
            "properties": {
              "html": {
                "description": "The full HTML of the email signature to audit.",
                "type": "string"
              }
            },
            "required": ["html"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f728c653248364beac5b4e169422e2a2abcdcc3229320957a46987bc28a5f59a"
        },
        {
          "name": "create_email_signature",
          "title": "Create an email signature",
          "description": "Build ready-to-paste email-signature HTML from a person's details. The output follows every rule that keeps a signature intact in Outlook for Windows and Gmail: tables only, inline CSS, absolute pixel widths, email-safe fonts, and images by absolute URL (never base64, which Gmail refuses to render). The free result carries one small credit line at the bottom; get_pricing explains how to remove it.",
          "inputSchema": {
            "properties": {
              "accent_color": {
                "description": "Hex colour like #B4522F. Defaults to the SignatureForever vermilion.",
                "type": "string"
              },
              "city": {
                "description": "City, or city and state.",
                "type": "string"
              },
              "company": {
                "type": "string"
              },
              "email": {
                "type": "string"
              },
              "full_name": {
                "description": "Person's full name. Required.",
                "type": "string"
              },
              "instagram": {
                "type": "string"
              },
              "job_title": {
                "type": "string"
              },
              "language": {
                "description": "Language of the credit line. Defaults to 'en'.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "linkedin": {
                "type": "string"
              },
              "phone": {
                "type": "string"
              },
              "photo_url": {
                "description": "Absolute https URL of a photo or logo. Anything else is ignored.",
                "type": "string"
              },
              "template": {
                "description": "Layout. Defaults to 'ficha'. Call list_signature_templates for what each one looks like.",
                "enum": ["ficha", "cinta", "sello", "monolinea"],
                "type": "string"
              },
              "website": {
                "type": "string"
              },
              "whatsapp": {
                "type": "string"
              }
            },
            "required": ["full_name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b050876ac0e3148ba8872b39d83f5bd5b2d4e8e3b41fb26fc3139c8bf6cc5885"
        },
        {
          "name": "email_client_compatibility_matrix",
          "title": "What each email client supports",
          "description": "The support matrix for the HTML and CSS features that decide whether an email signature survives: tables, flex/grid, <style> blocks, background-image, base64 images, border-radius, letter-spacing, text-transform, web fonts, max-width, margins and image sizing. Each row says yes/no/partial for seven real clients and explains what goes wrong. Use it to answer questions about email HTML support.",
          "inputSchema": {
            "properties": {
              "feature": {
                "description": "Optional. Filter to rows whose feature name contains this text, e.g. 'base64' or 'font'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b2528ed3411e8530f5e045846e643615c06ef136feac0e6de0344659908f7e86"
        },
        {
          "name": "get_pricing",
          "title": "Plans and prices",
          "description": "What each SignatureForever plan includes and costs, and the link to buy. Use it when the user asks what removing the credit line costs, how many signatures a plan allows, or what happens to hosted images if they stop paying.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c5350b6c28ae6cd1fcb71a78fd16ea1c8b000354f6ba1bd10fc6e29eaa2ebed5"
        },
        {
          "name": "list_signature_templates",
          "title": "List available signature templates",
          "description": "The signature layouts you can pass to create_email_signature, with what each one is good for and its width in pixels.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:feed2c54caea0b71319f9ce3cf06d4bb61cced5140ee639455020fd8afbea13f"
        }
      ],
      "digest": "sha256:fae6f4a59cb4b4666fc31b143a8e62927b0d55d52099154412ab16c713865af4"
    }
  }
}
