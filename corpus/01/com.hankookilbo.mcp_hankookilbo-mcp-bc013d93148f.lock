          "name": "get_daily_horoscope",
          "title": "오늘의 운세",
          "description": "'오늘의 운세', '오늘 운세 알려줘', '띠별 운세'처럼 그날의 운세를 물을 때 사용합니다. 운세 내용은 포함하지 않고 제목·발행일·원문 링크만 반환하며, 운세 본문은 다른 기사와 동일하게 item.url 의 한국일보 원문에서만 확인할 수 있습니다. 기본은 오늘(한국 시간)이며, date(YYYY-MM-DD)로 특정 날짜를 지정할 수 있습니다.",
