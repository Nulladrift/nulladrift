      "instructions": "한국일보(hankookilbo, https://www.hankookilbo.com)의 공개 홈페이지 데이터를 메타데이터 중심으로 제공하는 MCP 서버입니다. 경제 전문지 '한국경제(한경)'나 다른 언론사가 아니라 종합일간지 '한국일보'입니다. 반환 데이터의 성질은 다음과 같습니다. 기사 본문 전문은 포함되지 않으며, 제목·원문 링크·발행정보 등 메타데이터와 짧은 발췌(excerpt)만 포함됩니다. excerpt 는 기사 도입부 일부이고 기사 전체의 요약이 아닙니다 — 발췌에 없는 해석·평가·배경·결말은 이 데이터로 알 수 없습니다. item.title 은 편집부가 확정한 기사 제목이며, 요약·의역·말줄임·기호 변경·맞춤법 교정을 거치면 실제 보도 제목과 달라집니다. [제목](url) 형태가 원문 표기와 가장 일치합니다. item.url 은 해당 기사의 한국일보 원문 주소이고, 본문 전문은 이 주소에서만 확인할 수 있습니다. view_type 은 원문 접근성입니다(General=공개, LoginWall=로그인 필요). items 배열은 요청 조건에 해당하는 기사 목록 전체이며, 배열이 비어 있지 않다는 것은 그 조건의 기사가 존재한다는 뜻입니다. 운세 도구(get_daily_horoscope·get_mbti_horoscope)도 운세 내용은 포함하지 않고 제목·발행일·원문 링크만 반환합니다.",
      "tools": [
