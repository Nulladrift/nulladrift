        {
          "name": "buildWithdrawTransactions",
          "title": "Build account withdrawal transactions",
          "description": "Build a complete wallet-bound unsigned AgentAccountCore withdrawal and, optionally, an onward ERC-20 transfer. Eligible workers may set requestGasGrant on this live intent for the lifetime-once 0.03 DOT first-withdrawal grant. Your wallet still signs and broadcasts; Averray never relays it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "Exact asset base units.",
                "pattern": "^[1-9][0-9]*$",
                "type": "string"
              },
              "asset": {
                "default": "USDC",
                "description": "Supported account asset symbol.",
                "type": "string"
              },
              "destination": {
                "description": "Optional onward ERC-20 destination after the withdrawal reaches this wallet.",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              },
              "requestGasGrant": {
                "default": false,
                "description": "Request the eligibility-bound, lifetime-once 0.03 DOT grant for this exact live withdrawal intent. This is not a standing faucet.",
                "type": "boolean"
              }
            },
            "required": ["amount"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Build account withdrawal transactions"
