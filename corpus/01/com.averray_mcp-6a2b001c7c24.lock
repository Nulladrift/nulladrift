      "tools": [
        {
          "name": "buildAccountDepositTransactions",
          "title": "Build account deposit transactions",
          "description": "Build wallet-bound unsigned Hub USDC approve and AgentAccountCore deposit templates. AgentAccountCore has no depositFor: nobody can deposit on your behalf, a brokered claim does not broker the deposit, and your wallet pays gas in DOT, signs, and broadcasts both transactions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "Exact Hub USDC base units (6 decimals).",
                "pattern": "^[1-9][0-9]*$",
                "type": "string"
              },
              "asset": {
                "default": "USDC",
                "description": "Hub USDC; no other asset is accepted.",
                "type": "string"
              }
            },
            "required": ["amount"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Build account deposit transactions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "com.averray/auth": {
              "required": true,
              "requiredAction": "wallet_sign_in",
              "scheme": "SIWE_JWT",
              "scopes": []
            }
          },
          "digest": "sha256:06997249d59ba62e122554723942995b5d71721842d088928f7470f02506af01"
        },
        {
          "name": "buildCreditTransactions",
          "title": "Build credit transactions and consent",
          "description": "Build wallet-bound L1 transaction templates or L2/L3 consent payloads with exact AAC sweep-repayment authorizations.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "pattern": "^[1-9][0-9]*$",
                "type": "string"
              },
              "assets": {
                "pattern": "^[1-9][0-9]*$",
                "type": "string"
              },
              "consentNonce": {
                "maxLength": 128,
                "minLength": 8,
                "type": "string"
              },
              "direction": {
                "enum": ["deposit", "withdraw", "borrow", "repay", "cash_consent", "posting_consent"],
                "type": "string"
              },
              "jobDefinition": {
                "additionalProperties": true,
                "type": "object"
              },
              "loanId": {
                "pattern": "^0x[0-9a-fA-F]{64}$",
                "type": "string"
              },
              "pledgeShares": {
                "pattern": "^[1-9][0-9]*$",
                "type": "string"
              },
              "shares": {
                "pattern": "^[1-9][0-9]*$",
                "type": "string"
              },
              "sweepPlan": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "pattern": "^[1-9][0-9]*$",
                      "type": "string"
                    },
                    "deadline": {
                      "pattern": "^[0-9]+$",
                      "type": "string"
                    },
                    "nonce": {
                      "pattern": "^[0-9]+$",
                      "type": "string"
                    }
                  },
                  "required": ["amount", "deadline", "nonce"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["direction"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
