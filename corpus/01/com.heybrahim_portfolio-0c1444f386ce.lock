      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "heybrahim",
        "title": "Brahim Bousnguar — portfolio",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Public portfolio of Brahim Bousnguar, Tech Lead & Senior E-Commerce Integration Consultant (SAP Commerce Cloud, MuleSoft, Salesforce), Nantes, France. Start with get_profile or get_availability; use search to find evidence, then get_item for the full text. Client names are confidential and never published: case studies describe clients by sector. Only call request_cv when the user explicitly asked for Brahim's CV and gave their own name and email.",
      "tools": [
        {
          "name": "get_availability",
          "title": "Availability",
          "description": "Whether Brahim is open to new roles right now, what kind, from when, and where (dated).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cc6ddf6ec3759d68dc6957a335e8056d5f87381f3ebc6f027ca9ce4cd1ba2715"
        },
        {
          "name": "get_item",
          "title": "Read a case study, project or note",
          "description": "Full text (Markdown) of one case study, project or note by its slug, as listed by list_items. Case studies and projects also exist in French.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "enum": ["work", "projects", "notes"],
                "type": "string"
              },
              "lang": {
                "default": "en",
                "enum": ["en", "fr"],
                "type": "string"
              },
              "slug": {
                "description": "e.g. api-led-luxury-retail, mulewatch",
                "type": "string"
              }
            },
            "required": ["kind", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dc0892e1a6c17a65883effc3712cf8fba248c0a32d60d1a780b56642abf77f52"
        },
        {
          "name": "get_profile",
          "title": "Profile",
          "description": "Brahim's headline, summary, location, languages, certifications (with verification links), skills and links. Start here.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:63b82e3dc413aa17f177998ff6422437b195a4e170e97a83b00cbcbc00b91b79"
        },
        {
          "name": "list_items",
          "title": "List case studies, projects or notes",
          "description": "List the anonymised client case studies (work), side projects (projects) or technical notes (notes), newest first, with a one-line summary and URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "work, projects or notes",
                "enum": ["work", "projects", "notes"],
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8381545387d09cc1e5dc392e33a83e377226e6622ee18be7f60415bd5174729a"
        },
        {
          "name": "request_cv",
          "title": "Ask for Brahim's CV",
          "description": "File a request for Brahim's full CV, exactly like the form on heybrahim.com/cv.html. Brahim reads every request and sends the CV himself by email, usually the same day; nothing is sent automatically. Only call this when the user explicitly asked for the CV and gave their own name and email. Limited to a few requests per day.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "maxLength": 120,
                "type": "string"
              },
              "email": {
                "description": "Where Brahim should send the CV",
                "maxLength": 160,
                "type": "string"
              },
              "lang": {
                "default": "en",
                "enum": ["en", "fr"],
                "type": "string"
              },
              "message": {
                "maxLength": 900,
                "type": "string"
              },
              "name": {
                "description": "The requester's own name",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "role": {
                "description": "The role or mission, if any",
                "maxLength": 160,
                "type": "string"
              }
            },
            "required": ["email", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b7edc67c30fe288a20dc02ea79db4fd94b29ddfaee2ec754931573a99dd71f73"
        },
        {
          "name": "search",
          "title": "Search the portfolio",
          "description": "Keyword search across every case study, project and note (e.g. \"DataWeave\", \"CCv2 migration\", \"MCP\"). Returns titles, URLs and a snippet; use get_item for the full text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b8795328e14c0297df2f1640fac7925d9418691a4c26c2e50328ba8845edf9f8"
        }
      ],
      "digest": "sha256:024dd5935e3e282df1b8196115dded966c804f77dc82ae00ac9ef546712b7d3d"
    }
  }
