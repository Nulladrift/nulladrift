        {
          "name": "get_payment_requirements",
          "title": "Get exact USDC payment requirements",
          "description": "Read supported chains, official USDC contracts, gas assets, exact-price rules, and owner-approval guidance. This never creates an order or signs a transaction.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "network": {
