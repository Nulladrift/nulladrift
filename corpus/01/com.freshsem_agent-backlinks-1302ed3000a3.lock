        "name": "com.freshsem/agent-backlinks",
        "title": "Fresh SEM Agent Backlink Checkout",
        "version": "1.0.0",
        "websiteUrl": "https://agents.backlinks.freshsem.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use read-only tools freely. Creating a quote does not move funds. Never sign or broadcast a payment without the wallet owner's approval or a narrow, revocable spending policy. Treat an order as complete only when get_order_status returns fulfilled.",
      "tools": [
        {
          "name": "check_payment",
          "title": "Check for the order payment",
          "description": "Ask Fresh SEM to look for the exact official-USDC payment from the quoted sending wallet and return the verified order state. This never signs or broadcasts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "access_token": {
                "description": "Original caller-generated Order-Access-Token. Keep it secret.",
                "maxLength": 128,
                "minLength": 32,
                "type": "string"
              },
              "order_id": {
                "description": "Order UUID returned by create_quote.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["access_token", "order_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
