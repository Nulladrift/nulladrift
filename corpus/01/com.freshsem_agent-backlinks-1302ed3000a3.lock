        },
        {
          "name": "create_quote",
          "title": "Create a Fresh SEM backlink quote",
          "description": "Create one pending order and return exact USDC payment coordinates. This does not connect a wallet, sign, broadcast, or move funds. Keep the access token secret and obtain the wallet owner's approval before payment.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "access_token": {
                "description": "Original caller-generated Order-Access-Token. Keep it secret.",
                "maxLength": 128,
                "minLength": 32,
                "type": "string"
              },
              "anchor_text": {
                "maxLength": 180,
                "minLength": 1,
                "type": "string"
              },
              "email": {
                "format": "email",
                "maxLength": 254,
                "type": "string"
              },
              "idempotency_key": {
                "maxLength": 128,
                "minLength": 16,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              },
              "network": {
                "enum": ["base", "polygon", "solana"],
                "type": "string"
              },
              "password": {
                "description": "Existing Fresh SEM password or a new password for the account created after verified payment.",
                "maxLength": 72,
                "minLength": 8,
                "type": "string"
              },
              "payer_address": {
                "description": "Wallet address that will send official USDC.",
                "type": "string"
              },
              "quantity": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "target_notes": {
                "default": "",
                "maxLength": 2000,
                "type": "string"
              },
              "target_url": {
                "format": "uri",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "required": ["access_token", "anchor_text", "email", "idempotency_key", "network", "password", "payer_address", "quantity", "target_url"],
            "type": "object"
          },
