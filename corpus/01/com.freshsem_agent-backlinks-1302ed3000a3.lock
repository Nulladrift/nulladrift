          "title": "Check Fresh SEM agent checkout health",
          "description": "Read public endpoint availability and current MCP server information. This does not create an order or move funds.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
