      "instructions": "Whether an image you return actually renders on screen is outside your knowledge — some clients show it, some don't. Describe the result in words and always give both links a result carries, they're different things: the public one (`share_url` / `short_url` / `shortlink_url` — where scanning or visiting takes someone) and the QR code's own one (the `/download/` link, or `download_qr` for print files — the code image itself, for printing or sharing as a picture). Treat these as the deliverable, not captions under a picture the user may not be able to see. Every call that returns them carries the current, correct ones — restate them every time, not just the first time you made the thing, and not just from memory of an earlier turn. Hovercode manages QR codes, short links, landing pages, and forms. Every dynamic QR code has its own short link, and every short link, page, and form comes with its own QR code (its `qr_id`, or the short link's `id`). Never create a second QR code or short link for one of them: use download_qr for the image or print files, update_qr_code to restyle, and update_form / update_page / update_short_link to change where it goes. For 'make me a page' use build_page; for 'make me a form' use create_form — each returns the live link and QR in one step.",
      "tools": [
        {
          "name": "build_page",
          "description": "Build a rich, on-brand landing page from an ordered list of typed blocks, publish it, and return its live URL + its own QR code (`qr_id`; style it with the QR design args here, restyle later with update_qr_code — don't create another). This is the 'make me a page for X' tool — e.g. an event, product, restaurant, link-in-bio, or a scan-to-enter sweepstakes. Each block is {type, content}; call list_block_types first to see every type and its content shape. Blocks render in order in a centered column; a 'header' block (logo, title and description; fields name/bio/avatar_url) sits at the top.",
          "inputSchema": {
            "properties": {
              "background_color": {
                "description": "For the QR code this mints: Hex background color, or 'transparent'.",
                "type": "string"
              },
              "bg_color": {
                "description": "Hex page background color.",
                "type": "string"
              },
              "blocks": {
                "description": "Ordered page blocks. Each is {type, content}. See list_block_types.",
                "items": {
                  "properties": {
                    "content": {
                      "description": "The block's content, matching that type's schema.",
                      "type": "object"
                    },
                    "form": {
                      "description": "For a 'form' block: the form id to embed.",
                      "type": "string"
                    },
                    "full_width": {
                      "description": "image/gallery/video/embed only: stretch to the screen edges.",
                      "type": "boolean"
                    },
                    "hidden": {
                      "description": "Hide this block from the live page.",
                      "type": "boolean"
                    },
                    "type": {
                      "description": "Block type, e.g. header, link, text, video, faq, countdown.",
                      "type": "string"
                    },
                    "visible_from": {
                      "description": "Optional ISO date-time the block starts showing, e.g. 2030-05-01T09:00:00Z.",
                      "type": "string"
                    },
                    "visible_until": {
                      "description": "Optional ISO date-time the block stops showing.",
                      "type": "string"
                    }
                  },
                  "required": ["type"],
                  "type": "object"
                },
                "type": "array"
              },
              "color_scope": {
                "description": "For the QR code this mints: 'whole' (default) or 'pattern_only', as in create_qr_code.",
                "enum": ["whole", "pattern_only"],
                "type": "string"
              },
              "description": {
                "description": "Optional SEO/description text.",
                "type": "string"
              },
              "domain": {
                "description": "Custom domain (else a default is used).",
                "type": "string"
              },
              "error_correction": {
                "description": "For the QR code this mints: QR error correction level (L, M, Q, H). Leave unset: it is chosen automatically (H with a logo, Q otherwise).",
                "type": "string"
              },
              "eye_color": {
                "description": "For the QR code this mints: Hex color for the corner eyes, only if different from `primary_color`.",
                "type": "string"
              },
              "eye_style": {
                "description": "For the QR code this mints: Corner eye shape.",
                "enum": ["Square", "Rounded", "Drop", "Leaf"],
                "type": "string"
              },
              "frame": {
                "description": "For the QR code this mints: Frame slug, as in create_qr_code. Set `text` without a `frame` and one that can show it is chosen automatically.",
                "type": "string"
              },
              "frame_color": {
                "description": "For the QR code this mints: Hex color for the frame, only if different from `primary_color`.",
                "type": "string"
              },
              "has_border": {
                "description": "For the QR code this mints: Draw a border around the code.",
                "type": "boolean"
              },
              "link_align": {
                "description": "Where text sits inside link buttons, page-wide. Default center.",
                "enum": ["left", "center", "right"],
                "type": "string"
              },
              "logo_url": {
                "description": "For the QR code this mints: URL of a logo image to place in the center.",
                "type": "string"
              },
              "pattern": {
                "description": "For the QR code this mints: Module pattern style.",
                "enum": ["Original", "Squares", "Circles", "Lines", "Triangles", "Diamonds"],
                "type": "string"
              },
              "primary_color": {
                "description": "For the QR code this mints: Hex color for the QR pattern, e.g. #111111. Eyes and frame follow it automatically (rules as in create_qr_code).",
                "type": "string"
              },
              "publish": {
                "description": "Publish immediately (default true). false leaves it a draft.",
                "type": "boolean"
              },
              "slug": {
                "description": "Custom URL slug (else auto-generated).",
                "type": "string"
              },
              "text": {
                "description": "For the QR code this mints: Caption text; a frame that can show it is chosen automatically.",
                "type": "string"
              },
              "text_align": {
                "description": "Alignment of text blocks, page-wide. Default left.",
                "enum": ["left", "center", "right"],
                "type": "string"
              },
              "text_color": {
                "description": "Hex text color.",
                "type": "string"
              },
              "text_secondary": {
                "description": "For the QR code this mints: Secondary caption line, where the frame supports it.",
                "type": "string"
              },
              "title": {
                "description": "The page title (browser tab + SEO).",
                "type": "string"
              },
              "workspace": {
                "description": "Workspace id. Optional when the account has one workspace; use list_workspaces to resolve otherwise.",
                "type": "string"
              }
            },
            "required": ["blocks", "title"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "blocks": {
                "description": "Number of blocks on the page.",
                "type": "integer"
              },
              "error": {
                "description": "Present only when the tool failed (isError): cause, retryable, message.",
                "type": "object"
              },
              "id": {
                "type": "string"
              },
              "published": {
                "type": "boolean"
              },
              "qr_id": {
                "type": ["string", "null"]
              },
              "share_url": {
                "type": ["string", "null"]
              },
              "slug": {
                "type": ["string", "null"]
              },
              "workspace": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
