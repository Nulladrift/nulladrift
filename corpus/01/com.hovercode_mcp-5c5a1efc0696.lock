                "type": "object"
              },
              "error_correction": {
                "type": ["string", "null"]
              },
              "eye_color": {
                "type": ["string", "null"]
              },
              "eye_style": {
                "type": ["string", "null"]
              },
              "folder": {
                "type": ["object", "null"]
              },
              "frame": {
                "type": ["string", "null"]
              },
