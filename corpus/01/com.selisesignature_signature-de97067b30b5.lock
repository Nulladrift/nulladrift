{
  "lockfileVersion": 2,
  "subjects": {
    "com.selisesignature/signature": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://signaturemcp.selise.biz/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "selise-free-signature",
        "version": "0.4.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "This server prepares and sends PDFs through SELISE's free-signature workflow; it does not itself sign documents. For a new document, use prepare_free_signature_document when preparation alone is requested, or prepare_and_send_free_signature_document when sending is requested and all participants and verified PDF placements are known. For an existing prepared document, reuse its documentId and fileId with send_prepared_signature_document after preparation is confirmed. Obtain missing participant details and intended field placements before sending; never invent PDF content, identifiers, or coordinates. Follow each tool's schema and file-source requirements. Retain returned documentId, fileId, operationId, and trackingId. If an operation is pending, times out, or returns UNKNOWN_OUTCOME, it may already have succeeded: use get_signature_document_status when a documentId is available and do not automatically repeat preparation or sending. An empty status list does not make a retry safe. Prepared does not mean sent; sent or sending_success means dispatched, not completed signing. Report completed signing only when completed is observed. Space repeated status checks by at least 3 seconds and avoid concurrent checks for the same document.",
      "tools": [
        {
          "name": "get_signature_document_status",
          "title": "Get signature document status",
          "description": "Read document status events once using an actual documentId UUID. Use to check progress after preparation/sending, especially pending or UNKNOWN_OUTCOME. Does not upload, prepare, send, sign, or continuously poll. Returns {statuses: [...]} containing only distinct observed values: preparation_success (preparation succeeded), preparation_failed (preparation failed), sending_success (dispatch succeeded, not completed signing), sending_failed (dispatch failed), completed (document completion recorded). These are historical observations, not one current state. Success and failure can both appear; array order does not establish chronology. An empty list means no recognized events were returned: it does not prove existence, failure, completion, or that resubmission is safe. Other events, including cancellation, expiration, and individual-signer progress, are omitted; this is not a complete lifecycle report. Returns no timestamps, signer details, download URLs, or signing links. Request/authentication failures return an error, not an empty status list. If polling is needed, space checks by at least 3 seconds and avoid concurrent polling of the same document. A status check does not authorize retrying a state-changing tool. Use only the declared fields. Ask for missing facts instead of inventing values. Service credentials are configured on the server and must not be included in tool arguments.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "description": "Read observed status events once for a document UUID; does not upload, prepare, send, or poll repeatedly.",
            "properties": {
              "documentId": {
                "description": "Document UUID returned by a previous preparation/submission or supplied from a trusted source. Use the exact documentId, not fileId, trackingId, or operationId. Do not generate a placeholder UUID; format validity does not prove the document exists.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["documentId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "anyOf": [
              {
                "additionalProperties": false,
                "description": "One status lookup. Only statuses are returned; no signer details, links, raw events, or timestamps.",
                "properties": {
                  "statuses": {
                    "description": "Distinct observed statuses, not a single current state or a chronological list. Success and failure may coexist. Empty means no recognized events were returned, not proof of existence, failure, completion, or safety to retry. Other lifecycle events are omitted.",
                    "items": {
                      "description": "preparation_success/preparation_failed: preparation outcome; sending_success/sending_failed: dispatch outcome; completed: document completion recorded. sending_success does not mean completed signing.",
                      "enum": ["preparation_success", "preparation_failed", "sending_success", "sending_failed", "completed"],
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["statuses"],
                "type": "object"
              },
              {
                "additionalProperties": false,
                "description": "Error payload returned with the MCP result's isError flag set to true. Known IDs are optional and may be provisional; do not assume an error makes resubmission safe.",
                "properties": {
                  "code": {
                    "description": "INVALID_REQUEST: input validation failed. SIGNATURE_LIMIT_REACHED: signature quota exhausted; explain the message and do not retry sending until quota is available. REQUEST_FAILED: operation failed; use referenceId for diagnosis. UNKNOWN_OUTCOME: an action may have succeeded despite the error; inspect document status before considering a retry.",
                    "enum": ["INVALID_REQUEST", "REQUEST_FAILED", "UNKNOWN_OUTCOME", "SIGNATURE_LIMIT_REACHED"],
                    "type": "string"
                  },
                  "documentId": {
                    "description": "Document identifier. Reuse as documentId in subsequent calls; an ID in an error response may be provisional and does not prove the document was created or the command accepted.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "fileId": {
                    "description": "Storage identifier of the PDF. Reuse with its matching documentId when sending; not a download URL.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "message": {
                    "description": "Safe error explanation or recovery guidance; no private upstream diagnostics.",
                    "type": "string"
                  },
                  "operationId": {
                    "description": "Identifier for tracing this tool operation. Not a document ID or proof of completion.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "referenceId": {
                    "description": "Sentry error reference for support and diagnostics. Not a documentId or trackingId.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "trackingId": {
                    "description": "Backend command correlation identifier, when available. Not a document ID or proof of completion.",
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["code", "message", "referenceId"],
                "type": "object"
              }
            ],
            "description": "Structured result: either the tool's success/progress payload or an error payload with code, message, and referenceId. Errors also set isError on the enclosing MCP result.",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c1d6a847b0d4437c4989bc1b8abfcd6ce1d66df786bcd7a011244beac67adfe8"
        },
        {
          "name": "prepare_and_send_free_signature_document",
          "title": "Prepare and send free signature document",
          "description": "Prepare a NEW free-signature document from one PDF, add placements, and send it in one workflow. Accept Base64, a public HTTPS download URL, an existing SELISE storage file ID, a reference from the binary upload endpoint, or a ChatGPT attachment through chatgptFile. Uploads new bytes or reuses the existing storage file. Use only when sending is requested and all participant details and actual PDF placements are known. For an already prepared document, use send_prepared_signature_document instead. This tool does not itself sign the PDF. Provide exactly ONE file source: documentBase64 (raw standard Base64), documentUrl (public HTTPS PDF download URL, including a temporary signed URL), storageFileId (an existing SELISE storage PDF accessible to this server), uploadId (the exact short-lived reference returned by this server's HTTP POST /uploads), or chatgptFile (the host-provided file object for a PDF attached in ChatGPT). chatgptFile is exclusively for ChatGPT's attachment integration. Use it only when ChatGPT supplies the attachment object through openai/fileParams, including its download_url and file_id. Other clients, including Claude and Gemini, must not use this field or construct an equivalent object. They must use documentBase64, documentUrl, storageFileId, or uploadId, according to the file access available to them. If no supported source is available, ask the user for one; never fabricate file content, URLs, or identifiers. Do not combine sources, invent file content or IDs, or pass local paths to the server. A bare ChatGPT attachment ID is not a documentUrl or storageFileId. For binary upload, POST multipart/form-data with one file part named file to /uploads on this server's HTTP deployment, then use the returned uploadId before expiresAt; uploading does not prepare or send a document. Raw application/pdf uploads with a fileName query parameter are also accepted. The uploadId is valid for one hour; keep it private. Source PDFs are validated consistently. documentUrl must return PDF bytes without additional authentication headers; the server does not use browser cookies, login pages, or private-network URLs. It follows at most three public HTTPS redirects. Storage files and upload references are reused without a second upload. Supply fileName ending in .pdf and the normal preparation fields for every method. A file reference is not a documentId and does not mean preparation has completed. Maximum actual PDF size for every source on this server: 26214400 bytes, excluding Base64 encoding or multipart overhead. PDFs must be readable, unencrypted, and have supported page geometry. File-source retrieval and validation happen before preparation. Never fabricate file content. ownerEmail must match one of the signatories' emails. Signatory emails must be unique (case-insensitive). Provide a positive integer signingOrder for every signatory or omit it for all; role defaults to signer. Ask for missing participant details; do not invent people or change their intended roles to satisfy validation. Role values and behavior: signer signs the contract; reviewer is a view-only participant who can see the contract but has no action to perform; approver reviews and approves the contract without signing. Map a requested viewer to reviewer, and a requested reviewer who must approve to approver. The literal value viewer is not accepted. If the intended action is unclear, ask before choosing a role. Set coordinateSystem to page_percent. ALL field types use the same page-relative percentages: (0,0) is the top-left of the visible page, x increases rightward, y increases downward; 100 is the full page width or height, not 1. pageNumber is zero-based (0 is the first page). x/width are percentages of page width; y/height are percentages of page height. Positions must be >= 0, sizes > 0, x + width <= 100 and y + height <= 100. Example: x=10,y=80,width=30,height=10 starts 10% from the left and 80% from the top, covering 30% of page width and 10% of its height. The server reads each PDF page and handles backend units and field-specific conversions. Do not supply pixels, PDF points, or backend coordinates, or guess a placement from an unrelated image. Use the actual visible page and the user's intended field location. Unrepresentable placements, unreadable PDFs, 180-degree rotated placement pages, and text fields on rotated/cropped pages are rejected before sending; provide a flattened PDF if requested by the error. Provide at least one signatureCoordinates entry; optional coordinate arrays default to empty. Every coordinate's signatoryEmail must identify a participant in this document. Every signatory with role signer (including the default role) must have at least one signatureCoordinates entry, and every signature coordinate email must appear in signatories. The reviewer (view-only) and approver (approval without signing) roles do not sign and are not subject to this MCP signer-coverage check; do not invent signature placements for them. Every coordinate array applies to the selected source PDF. If placements are missing, obtain them; use prepare_free_signature_document only when preparation alone is intended. Returns sent when rollout succeeds, or pending when accepted but unconfirmed. sent does not mean completed signing. A failed combined workflow may already have uploaded or prepared a document; inspect its status before choosing a follow-up action. Keep returned documentId, fileId, operationId, and trackingId when present. pending means accepted but completion is unconfirmed: check get_signature_document_status with documentId instead of resubmitting. UNKNOWN_OUTCOME, a timeout, or a lost response may follow a successful submission; do not automatically repeat a preparation or send call. Inspect status when an ID is available; an empty status list does not make a retry safe. SIGNATURE_LIMIT_REACHED means the backend rejected sending because the signature quota is exhausted: explain the returned message to the user and do not retry sending or create another document to bypass the limit. INVALID_REQUEST means inputs need correction; REQUEST_FAILED gives a referenceId for diagnosis. If the cause is unclear, ask for clarification or use the referenceId rather than guessing. Repeating a preparation can create another document. Use only the declared fields. Ask for missing facts instead of inventing values. Service credentials are configured on the server and must not be included in tool arguments.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "description": "Prepare and send one new PDF. Provide exactly ONE file source: documentBase64 (raw standard Base64), documentUrl (public HTTPS PDF download URL, including a temporary signed URL), storageFileId (an existing SELISE storage PDF accessible to this server), uploadId (the exact short-lived reference returned by this server's HTTP POST /uploads), or chatgptFile (the host-provided file object for a PDF attached in ChatGPT). chatgptFile is exclusively for ChatGPT's attachment integration. Use it only when ChatGPT supplies the attachment object through openai/fileParams, including its download_url and file_id. Other clients, including Claude and Gemini, must not use this field or construct an equivalent object. They must use documentBase64, documentUrl, storageFileId, or uploadId, according to the file access available to them. If no supported source is available, ask the user for one; never fabricate file content, URLs, or identifiers. Do not combine sources, invent file content or IDs, or pass local paths to the server. A bare ChatGPT attachment ID is not a documentUrl or storageFileId. For binary upload, POST multipart/form-data with one file part named file to /uploads on this server's HTTP deployment, then use the returned uploadId before expiresAt; uploading does not prepare or send a document. Raw application/pdf uploads with a fileName query parameter are also accepted. The uploadId is valid for one hour; keep it private. Source PDFs are validated consistently. documentUrl must return PDF bytes without additional authentication headers; the server does not use browser cookies, login pages, or private-network URLs. It follows at most three public HTTPS redirects. Storage files and upload references are reused without a second upload. Supply fileName ending in .pdf and the normal preparation fields for every method. A file reference is not a documentId and does not mean preparation has completed. ownerEmail must match one of the signatories' emails. Signatory emails must be unique (case-insensitive). Provide a positive integer signingOrder for every signatory or omit it for all; role defaults to signer. Ask for missing participant details; do not invent people or change their intended roles to satisfy validation. Role values and behavior: signer signs the contract; reviewer is a view-only participant who can see the contract but has no action to perform; approver reviews and approves the contract without signing. Map a requested viewer to reviewer, and a requested reviewer who must approve to approver. The literal value viewer is not accepted. If the intended action is unclear, ask before choosing a role. Set coordinateSystem to page_percent. ALL field types use the same page-relative percentages: (0,0) is the top-left of the visible page, x increases rightward, y increases downward; 100 is the full page width or height, not 1. pageNumber is zero-based (0 is the first page). x/width are percentages of page width; y/height are percentages of page height. Positions must be >= 0, sizes > 0, x + width <= 100 and y + height <= 100. Example: x=10,y=80,width=30,height=10 starts 10% from the left and 80% from the top, covering 30% of page width and 10% of its height. The server reads each PDF page and handles backend units and field-specific conversions. Do not supply pixels, PDF points, or backend coordinates, or guess a placement from an unrelated image. Use the actual visible page and the user's intended field location. Unrepresentable placements, unreadable PDFs, 180-degree rotated placement pages, and text fields on rotated/cropped pages are rejected before sending; provide a flattened PDF if requested by the error. Provide at least one signatureCoordinates entry; optional coordinate arrays default to empty. Every coordinate's signatoryEmail must identify a participant in this document. Every signatory with role signer (including the default role) must have at least one signatureCoordinates entry, and every signature coordinate email must appear in signatories. The reviewer (view-only) and approver (approval without signing) roles do not sign and are not subject to this MCP signer-coverage check; do not invent signature placements for them.",
            "oneOf": [
              {
                "required": ["documentBase64"]
              },
              {
                "required": ["documentUrl"]
              },
              {
                "required": ["storageFileId"]
              },
              {
                "required": ["uploadId"]
              },
              {
                "required": ["chatgptFile"]
              }
            ],
            "properties": {
              "chatgptFile": {
                "description": "File source option 5 - ChatGPT only. Claude, Gemini, and other MCP clients must omit this field and use documentBase64, documentUrl, storageFileId, or uploadId instead. Requires the actual user-attached PDF object supplied by ChatGPT's file-input integration through openai/fileParams, including download_url and file_id; do not construct an equivalent object. Omit all other file sources; do not copy a /mnt/data path into documentUrl or invent file metadata. Supply the separate fileName and normal contract fields. The server downloads and validates the PDF; expired URLs require a fresh host-provided file reference.",
                "properties": {
                  "download_url": {
                    "description": "Host-provided temporary HTTPS download URL for the attached PDF. Use the exact URL; never substitute a local path.",
                    "format": "uri",
                    "maxLength": 8192,
                    "type": "string"
                  },
                  "file_id": {
                    "description": "Host-provided OpenAI file identifier. Not a SELISE storage file ID or document ID; not used to fetch the file.",
                    "maxLength": 512,
                    "minLength": 1,
                    "type": "string"
                  },
                  "file_name": {
                    "description": "Optional host-provided filename metadata. The separate top-level fileName remains required.",
                    "maxLength": 1024,
                    "type": "string"
                  },
                  "mime_type": {
                    "description": "Optional host-provided MIME type. Actual downloaded bytes determine whether the file is a valid PDF.",
                    "maxLength": 255,
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "coordinateSystem": {
                "const": "page_percent",
                "description": "Required: page_percent. All positions and sizes use 0-100 percentages of the visible PDF page, from its top-left. This explicit marker prevents old pixel/backend coordinates from being misinterpreted. Do not relabel old values; calculate their page percentages first.",
                "type": "string"
              },
              "documentBase64": {
                "description": "File source option 1: actual PDF bytes encoded as raw standard Base64. Whitespace is ignored; no data URL, placeholder, local path, or fabricated content. Omit all other file sources when using this option.",
                "minLength": 1,
                "type": "string"
              },
              "documentUrl": {
                "description": "File source option 2: public HTTPS link that returns the actual PDF, optionally with a short-lived signed query string. No login page, browser cookies, custom authentication headers, local/private address, or data/file URL. Omit all other file sources. The server downloads and size-checks the file. For a ChatGPT attachment, use chatgptFile through the host file-input integration.",
                "format": "uri",
                "maxLength": 8192,
                "type": "string"
              },
              "fileName": {
                "description": "PDF filename, 1-255 characters, ending in .pdf (case-insensitive). Required for every source. Use a filename, not a path or URL.",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              },
              "language": {
                "default": "en-US",
                "description": "Document workflow language. Supported values: en, en-US, de, de-DE. Defaults to en-US; this does not translate the uploaded PDF.",
                "enum": ["en", "en-US", "de", "de-DE"],
                "type": "string"
              },
              "ownerEmail": {
                "description": "Document owner's valid email, without surrounding whitespace. Must match an email in signatories after lowercase normalization. Being the owner does not automatically make someone a signer; preserve their intended role.",
                "format": "email",
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "receiveRolloutEmail": {
                "default": true,
                "description": "Whether the document owner should receive the rollout email when the document is sent. Defaults to true. Setting this during preparation does not send the document.",
                "type": "boolean"
              },
              "signatories": {
                "description": "Complete participant list, including the owner; at least one entry. ownerEmail must match one of the signatories' emails. Signatory emails must be unique (case-insensitive). Provide a positive integer signingOrder for every signatory or omit it for all; role defaults to signer. Ask for missing participant details; do not invent people or change their intended roles to satisfy validation. Role values and behavior: signer signs the contract; reviewer is a view-only participant who can see the contract but has no action to perform; approver reviews and approves the contract without signing. Map a requested viewer to reviewer, and a requested reviewer who must approve to approver. The literal value viewer is not accepted. If the intended action is unclear, ask before choosing a role.",
                "items": {
                  "description": "One document participant, with a unique email, real first and last names, and the intended role.",
                  "properties": {
                    "email": {
                      "description": "Participant's valid email address, without surrounding whitespace. Normalized to lowercase; must be unique within signatories.",
                      "format": "email",
                      "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                      "type": "string"
                    },
                    "firstName": {
                      "description": "Participant's first name; required and nonempty after trimming. Obtain it from the user or a trusted source.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "lastName": {
                      "description": "Participant's last name; required and nonempty after trimming. Obtain it from the user or a trusted source.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "role": {
                      "default": "signer",
                      "description": "Role values and behavior: signer signs the contract; reviewer is a view-only participant who can see the contract but has no action to perform; approver reviews and approves the contract without signing. Map a requested viewer to reviewer, and a requested reviewer who must approve to approver. The literal value viewer is not accepted. If the intended action is unclear, ask before choosing a role. Defaults to signer when omitted; set reviewer or approver explicitly for participants who must not sign. In the combined tool, every signer needs a signature coordinate; the owner need not have role signer.",
                      "enum": ["signer", "reviewer", "approver"],
                      "type": "string"
                    },
                    "signingOrder": {
                      "description": "Optional positive integer signing sequence. Supply for every participant or omit for every participant. Do not infer sequence from array position; preserve the requested order.",
                      "exclusiveMinimum": 0,
                      "maximum": 9007199254740991,
                      "type": "integer"
                    }
                  },
                  "required": ["email", "firstName", "lastName"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "signatureCoordinates": {
                "description": "Required nonempty signature-placement list for this PDF. In the combined tool, every signer needs at least one entry and every entry must refer to a supplied participant. For send-only, use the prepared document's participants and placements.",
                "items": {
                  "description": "A signature placement for a document participant. Set coordinateSystem to page_percent. ALL field types use the same page-relative percentages: (0,0) is the top-left of the visible page, x increases rightward, y increases downward; 100 is the full page width or height, not 1. pageNumber is zero-based (0 is the first page). x/width are percentages of page width; y/height are percentages of page height. Positions must be >= 0, sizes > 0, x + width <= 100 and y + height <= 100. Example: x=10,y=80,width=30,height=10 starts 10% from the left and 80% from the top, covering 30% of page width and 10% of its height. The server reads each PDF page and handles backend units and field-specific conversions. Do not supply pixels, PDF points, or backend coordinates, or guess a placement from an unrelated image. Use the actual visible page and the user's intended field location. Unrepresentable placements, unreadable PDFs, 180-degree rotated placement pages, and text fields on rotated/cropped pages are rejected before sending; provide a flattened PDF if requested by the error. Provide at least one signatureCoordinates entry; optional coordinate arrays default to empty. Every coordinate's signatoryEmail must identify a participant in this document.",
                  "properties": {
                    "height": {
                      "description": "Field height as a percentage of visible page height; > 0, and y + height <= 100. Same units for every field type.",
                      "exclusiveMinimum": 0,
                      "maximum": 100,
                      "type": "number"
                    },
                    "pageNumber": {
                      "description": "Zero-based PDF page number: 0 is the first page, 1 the second. Use an existing page in the actual PDF.",
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "signatoryEmail": {
                      "description": "Valid email of the participant assigned to this field, without surrounding whitespace. Must match a participant in this document; normalized to lowercase. Use an email, not a signatory ID.",
                      "format": "email",
                      "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                      "type": "string"
                    },
                    "signatureImageFileId": {
                      "description": "Optional existing signature-image storage ID; nonempty when supplied. Never supply image bytes or a URL here. Omit unless required by a verified workflow; this field does not itself sign the document.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "type": {
                      "description": "Optional SELISE field-type identifier; nonempty when supplied. Preserve a known value for this coordinate kind, or omit it. This is not a MIME type; no type catalog is provided by this tool.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "width": {
                      "description": "Field width as a percentage of visible page width; > 0, and x + width <= 100. Same units for every field type.",
                      "exclusiveMinimum": 0,
                      "maximum": 100,
                      "type": "number"
                    },
                    "x": {
                      "description": "Left edge as a percentage of visible page width, measured rightward from the top-left. 10 means 10%, not pixels or points. x + width must be <= 100.",
                      "maximum": 100,
                      "minimum": 0,
                      "type": "number"
                    },
                    "y": {
                      "description": "Top edge as a percentage of visible page height, measured downward from the top-left. 80 means 80%. y + height must be <= 100.",
                      "maximum": 100,
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["height", "pageNumber", "signatoryEmail", "width", "x", "y"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "simpleImageCoordinates": {
                "description": "Optional simple-image placements for this PDF; defaults to []. Each entry requires a verified type and participant/page/position/size fields.",
                "items": {
                  "description": "Optional simple-image placement in page percentages assigned to a participant. Requires type and all base coordinate fields; does not upload an image.",
                  "properties": {
                    "height": {
                      "description": "Field height as a percentage of visible page height; > 0, and y + height <= 100. Same units for every field type.",
                      "exclusiveMinimum": 0,
                      "maximum": 100,
                      "type": "number"
                    },
                    "pageNumber": {
                      "description": "Zero-based PDF page number: 0 is the first page, 1 the second. Use an existing page in the actual PDF.",
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "signatoryEmail": {
                      "description": "Valid email of the participant assigned to this field, without surrounding whitespace. Must match a participant in this document; normalized to lowercase. Use an email, not a signatory ID.",
                      "format": "email",
                      "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                      "type": "string"
