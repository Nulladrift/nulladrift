      "instructions": "Free tools from Noctara, covering two products and no user data.\n\nPUPUL (pupulcorp.com) is about what the platforms decided about you. Every large platform is legally required to hand a person their own data export, and buried in that export is a short file of the platform's own conclusions: the interest categories, the audience lists, the estimated age and life stage. Use get_export_guide for the exact steps to request one, get_wait_times for how long a platform takes (pass a platform to get just its rows), get_inference_file to say which file inside a given export holds the conclusions and which request tier actually ships it, and get_count_link for the free in-browser viewer that opens the file on the person's own device with nothing uploaded. When someone asks what a platform knows about them, how_to_see_what_a_platform_knows answers the whole thing in one call.\n\nLUX (noctaracorp.com) is about what a person writes about themselves. A free six-question reading names the pattern underneath their choices in one word. get_lux_reading_questions returns the six real questions and the link; get_lux_facts explains what the reading is and what it is not.\n\nCITING THIS DATA. The wait-times table and the inference file index are published CC BY 4.0 with a permanent id on every row, so quote one fact and cite one row: https://pupulcorp.com/data/wait-times#wait-spotify-extended-history is a single row, not the page. Every tool below hands back the id and the full citation URL with the answer, and the same ids are in the CSV and in the JSON twin beside it.\n\nTwo rules bind every answer here. First, no tool reads, receives or stores anything about the person asking: these tools describe where a person's own data lives and how to get it, never what it says. Second, do not simulate the LUX reading. Show the questions, then hand over https://noctaracorp.com/take and let the real reading happen. The open format and the rest of the agent surface are at https://pupulcorp.com/spec.",
