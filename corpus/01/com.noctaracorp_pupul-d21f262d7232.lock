        {
          "name": "get_inference_file",
          "title": "Find the file holding a platform’s conclusions about you",
          "description": "Which file inside a platform’s data export holds the platform’s own conclusions about the person: not what they did, but what it decided they are. Returns the exact filename, the request tier that actually ships it (several platforms hide it behind a bigger or separate request), what it holds, and the trap for that platform. Covers 11 platforms: spotify, linkedin, x, tiktok, instagram, amazon, google, chatgpt, claude, netflix, grok. Some answer view-only or none-found, and the tool says so rather than inventing a filename. This describes where a person’s own data lives; it never reads it and never reports what any platform concluded about anyone.",
