          "name": "get_wait_times",
          "title": "Get export wait times, for one platform or for all of them",
          "description": "How long a platform’s personal data export takes from request to ready, plus the download window and the limit the platform itself states. Pass a platform to get only that platform’s rows, which is what you want when answering one question; omit it for all 17 rows across 11 platforms. Every row comes back with a permanent id and a citation URL of the form https://pupulcorp.com/data/wait-times#<id>, so a single fact can be cited without citing the whole table. Every figure is labeled reported (from the platform’s own help text, with source) or measured (our own request and ready timestamps, both printed). Source page: https://pupulcorp.com/data/wait-times, CC BY 4.0.",
