{
  "lockfileVersion": 2,
  "subjects": {
    "com.platinumride/transfers": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://platinumride.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "platinumride",
        "title": "Platinumride",
        "version": "0.2.3"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Platinumride provides premium private cross-border transfers with a professional driver across the UAE, Saudi Arabia, Qatar, Bahrain, Kuwait and Oman. Prices are per vehicle, not per person, and are indicative 'from' prices in the origin city's currency (AED amounts are approx. conversions). The final price is confirmed by the Platinumride team. Some routes are priced on request. Travellers are responsible for their own passports, visas and entry permits. Recommended flow: search_routes (find the route) -> get_route_details (quote tiers, borders and timing) -> show the customer the Terms of Service link and get agreement -> create_inquiry (send the request; returns a reference and WhatsApp follow-up link). list_travel_guides returns editorial route guides. Every route result includes a booking object with the route page and a WhatsApp link.",
      "tools": [
        {
          "name": "create_inquiry",
          "title": "Send a booking inquiry",
          "description": "Sends a booking request to the Platinumride team. Use it only after the customer has chosen a route and agreed to the Terms of Service (https://platinumride.com/terms). Do not use it for browsing or quotes; use search_routes and get_route_details for that. Each call sends a new inquiry and is not idempotent, so never call it twice for the same request. Limit: 3 inquiries per connection every 10 minutes. Returns an inquiry reference and a WhatsApp follow-up link to share with the customer. This is not a confirmed booking: the team confirms availability and the final price.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agreedToTerms": {
                "description": "Required. true only if the customer has read and agreed to the Terms of Service at https://platinumride.com/terms. The inquiry is rejected otherwise.",
                "type": "boolean"
              },
              "customerEmail": {
                "description": "Customer email address. Give this or customerWhatsApp (at least one is required).",
                "format": "email",
                "maxLength": 255,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "customerName": {
                "description": "Required. Customer's full name, one line.",
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[^\\r\\n]+$",
                "type": "string"
              },
              "customerWhatsApp": {
                "description": "WhatsApp number with country code in E.164 format, no spaces, e.g. '+971501234567'. Give this or customerEmail (at least one is required).",
                "pattern": "^\\+[1-9]\\d{6,14}$",
                "type": "string"
              },
              "date": {
                "description": "Required. Travel date as YYYY-MM-DD, e.g. '2026-12-20'. Must be today or later in UAE time.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "dropoffAddress": {
                "description": "Optional. Drop-off address, hotel or airport.",
                "maxLength": 300,
                "type": "string"
              },
              "language": {
                "description": "Optional. Follow-up language: 'en' (English, default) or 'ar' (Arabic).",
                "enum": ["en", "ar"],
                "type": "string"
              },
              "luggage": {
                "description": "Optional. Number of large suitcases, 0 to 30. Helps the team pick a vehicle.",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "notes": {
                "description": "Optional. Free text for the team: children and child seats, extra stops, special luggage, return trip or other requests.",
                "maxLength": 2000,
                "type": "string"
              },
              "passengers": {
                "description": "Required. Total passengers including children, 1 to 7.",
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              },
              "pickupAddress": {
                "description": "Optional. Pickup address, hotel or airport. Add the flight number for airport pickups.",
                "maxLength": 300,
                "type": "string"
              },
              "routeSlug": {
                "description": "Required. Exact route slug from search_routes or get_route_details, e.g. 'dubai-to-riyadh-private-transfer'.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "time": {
                "description": "Optional. Preferred local pickup time in 24-hour HH:MM, e.g. '07:30'.",
                "maxLength": 40,
                "type": "string"
              },
              "vehicleTier": {
                "description": "Optional. Tier name from the route's price tiers, e.g. 'Premium SUV'. Case-insensitive. Omit if the customer has not chosen.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["agreedToTerms", "customerName", "date", "passengers", "routeSlug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send a booking inquiry"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8e16f7c98b43184edcad3d2fd0477d2829888887cd1c07173c2a01bfb2ad5ee4"
        },
        {
          "name": "get_route_details",
          "title": "Get route details",
          "description": "Returns full details for one route. Needs a slug from search_routes. If you do not have a slug, call search_routes first. Returns per-vehicle price tiers (indicative 'from' prices in local currency and approx. AED; the team confirms the final price), travel time and distance, border crossings and car-change steps, capacities, inclusions, FAQs and booking links. An unknown or invalid slug returns an error saying no route was found. Call create_inquiry when the customer wants to book.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Exact route slug as returned by search_routes, e.g. 'dubai-to-muscat-private-transfer'.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get route details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a4a93b77cd544c3b8db664ea412334aade13dad93377b530fc04a25f1f83332b"
        },
        {
          "name": "list_travel_guides",
          "title": "List travel guides",
          "description": "Lists all of Platinumride's published travel guides (currently 13) in one response, with no pagination or filtering. Each entry has a title, cities, route slug and page URL. Pass a guide slug to get that guide's full text, sections and FAQs. Use it for questions about driving time, border documents and what to expect on the road. For prices and booking, use search_routes and get_route_details instead.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Optional. Guide slug from the list, e.g. 'dubai-to-muscat-travel-guide'. Omit to list all guides. An unknown slug returns an error.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List travel guides"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:90154410153e0b9aaa2112ffb08604124e789cb6d2f3ac137e442a88b10aefa6"
        },
        {
          "name": "search_routes",
          "title": "Search transfer routes",
          "description": "First step for any trip question. Finds Platinumride private transfer routes when the user names cities, countries, airports (e.g. DXB, RUH) or Arabic city names. Full sentences and common typos are fine. Returns matching routes with summary info: slug, travel time, distance, border crossings, indicative per-vehicle 'from' prices and booking links. For full price tiers, border steps and timing of one route, call get_route_details with a returned slug. Call create_inquiry once the customer wants to book. If nothing matches, the route list is empty and suggestions are returned. Then try another city spelling or ask the customer.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "from": {
                "description": "Origin city, airport code or Arabic name, e.g. 'Dubai', 'DXB', 'دبي'.",
                "maxLength": 100,
                "type": "string"
              },
              "internationalOnly": {
                "description": "Optional. true returns only routes that cross a border. Omit for all routes.",
                "type": "boolean"
              },
              "limit": {
                "description": "Maximum number of results, from 1 to 100. Defaults to 25.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Free-text origin and destination query, a full sentence is fine, e.g. 'Dubai to Muscat with kids', 'Dubai airport to Oman' or 'دبي إلى الرياض'.",
                "maxLength": 200,
                "type": "string"
              },
              "to": {
                "description": "Destination city, airport code or Arabic name, e.g. 'Muscat', 'MCT'.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search transfer routes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:53b7645b8642684a684fbbcd1982a027ba38833123db4be70245d2c442ff0ae0"
        }
      ],
      "digest": "sha256:e7f41d3b07f68e9ed93e2e1f45998c9739900ec75d3d8ab228b8d12a6f1ac5ef"
    }
  }
}
