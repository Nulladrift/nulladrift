        {
          "name": "analysis_prepare",
          "description": "Prepare a PRIVATE sharing package of the current chart image, editable analysis and social caption. Only use when asked for something shareable. Returns a private review link, NOT a public link. The person must open it, edit/review and explicitly publish; you cannot publish or post on their behalf. Chart annotations are included. Do not include private account information.",
          "inputSchema": {
            "properties": {
              "body": {
                "description": "Plain-text analysis: evidence, timeframe, venue, data timestamp, alternative scenario and invalidation. Only use verified tool results. Never include account balances, keys or private notes.",
                "maxLength": 4000,
                "type": "string"
              },
              "caption": {
                "description": "Editable social caption in the user’s language, ideally under 220 characters for X. Invite discussion, not a trade. Do not add a URL; the review page adds the public link after approval.",
                "maxLength": 1000,
                "type": "string"
              },
              "exchange": {
                "enum": ["binance", "bybit", "okx", "hyperliquid"],
                "type": "string"
              },
              "indicators": {
                "description": "Ids or common names (\"ema50\", \"rsi\", \"bollinger\"), or {studyId, params}.",
                "items": {
                  "anyOf": [
                    {
                      "type": "string"
                    },
                    {
                      "type": "object"
                    }
                  ]
                },
                "type": "array"
              },
              "levels": {
                "description": "Prices to mark as horizontal lines, or {price, label, color}.",
                "items": {
                  "anyOf": [
                    {
                      "type": "number"
                    },
                    {
                      "type": "object"
                    }
                  ]
                },
                "type": "array"
              },
              "market": {
                "enum": ["spot", "futures"],
                "type": "string"
              },
              "symbol": {
                "description": "Optional: set the instrument in this call.",
                "type": "string"
              },
              "timeframe": {
                "description": "Optional, e.g. 15m, 4h, 1d.",
                "type": "string"
              },
              "title": {
                "description": "A specific, factual title. No return promises.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["body", "caption", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
