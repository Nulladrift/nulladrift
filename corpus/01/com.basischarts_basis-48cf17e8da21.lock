                        "studyId": {
                          "description": "Indicator id, e.g. rsi or ema.",
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "operator": {
                      "enum": ["above", "atOrAbove", "below", "atOrBelow", "equal", "notEqual", "crossesAbove", "crossesBelow", "rising", "falling"],
                      "type": "string"
                    },
                    "right": {
