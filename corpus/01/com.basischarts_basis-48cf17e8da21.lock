        {
          "name": "screener_backtest",
          "description": "Historically replay a cross-sectional screen at every bar. Matching instruments form an equal-weight long or short portfolio, entered at the next bar open and held to the following bar open, then re-screened. Use this when the question is whether repeatedly trading screener matches worked — a single-symbol backtest of coins that match today is not a substitute. Costs follow actual portfolio turnover, so an unchanged holding is not charged as a fresh round trip.",
          "inputSchema": {
            "properties": {
              "direction": {
                "description": "Default long.",
                "enum": ["long", "short"],
