        {
          "name": "chart_link",
          "description": "Publish the chart and get a URL the person can open in Basis. Call it at the end of any answer about a market: the chart is half the answer. Either build first with the chart tools, or pass symbol, timeframe, indicators and levels here to build and publish in one call. Give the URL as a link and say in one line what it shows. No account needed; the link lasts seven days.",
          "inputSchema": {
            "properties": {
              "exchange": {
                "enum": ["binance", "bybit", "okx", "hyperliquid"],
                "type": "string"
              },
              "indicators": {
                "description": "Ids or common names (\"ema50\", \"rsi\", \"bollinger\"), or {studyId, params}.",
