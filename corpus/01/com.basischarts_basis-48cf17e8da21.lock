        {
          "name": "drawing_add",
          "description": "Draw measured geometry or explain it with text, note, callout or emoji. Points are {time, price} in chart coordinates — time in seconds, matching the candle timestamps a data handle reports. A horizontal line needs one point; a trendline or box needs two. Measured anchors must be copied from a tool result — a summary's max with its maxAt, a crossing with its time — never read off your own prose or carried over from a different computation. A note/text position or callout second anchor is layout, not a measured price; place it in spare chart space. The result echoes back what was drawn: check it against the figures you are about to quote, because a line that disagrees with the paragraph beside it is worse than no line. Changes the chart you are building; finish with chart_link, or analysis_prepare for a sharing draft that needs human review.",
          "inputSchema": {
            "properties": {
              "arrowEnd": {
                "type": "boolean"
              },
              "arrowStart": {
                "type": "boolean"
              },
              "color": {
                "description": "A palette name. “up” and “down” are the reserved green and red — they assert a bullish or bearish claim, so use them for position zones and not for a measurement.",
                "enum": ["blue", "orange", "violet", "aqua", "yellow", "magenta", "neutral", "white", "up", "down"],
                "type": "string"
              },
              "extendLeft": {
                "type": "boolean"
              },
              "extendRight": {
                "type": "boolean"
              },
              "fill": {
                "description": "Palette fill colour, or “none”.",
                "type": "string"
              },
              "fillOpacity": {
                "description": "Shape fill opacity from 0 to 1.",
                "type": "number"
              },
              "fontSize": {
                "description": "Size 9–160px, normally 12–16 for readable text. Emoji render at twice this size.",
                "type": "number"
              },
              "labelPosition": {
                "enum": ["left", "center", "right"],
                "type": "string"
              },
              "labelVertical": {
                "enum": ["above", "middle", "below"],
