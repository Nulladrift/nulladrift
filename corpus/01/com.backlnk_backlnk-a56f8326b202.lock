      "serverInfo": {
        "name": "backlnk",
        "title": "BACKLNK",
        "version": "1.2.0",
        "websiteUrl": "https://backlnk.com/developers",
        "icons": [
          {
            "src": "https://backlnk.com/icon.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://backlnk.com/icon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "BACKLNK runs evidence-based technical SEO and AI-visibility checks on public web pages and reports what it measured.\nWork in a loop: (1) run_checks on the page's public URL: you get the issues and warnings, most important first, each with evidence and a recommendation. (2) Fix them in the codebase, starting with the first findings. Changes are only visible to the checks once they are deployed to that public URL. (3) verify_fixes with each audit_id: it re-runs the same check fresh and reports what is fixed, new, still open or not re-checked.\nUse get_report for the report of an earlier check (detail: \"all\" for every finding), list_checks for all check ids, ai_crawler_policy for robots.txt rules for AI crawlers and usage for the checks left (the API key's quota, or without a key the shared limit). When the user asks to fix the BACKLNK queue, call get_fix_queue, make each change and mark it with update_fix_item.\nStatus NotAssessed means the check could not determine the result: do not treat it as a pass. Only Issue and Warning findings need action.",
      "tools": [
        {
          "name": "ai_crawler_policy",
          "title": "AI crawler robots.txt rules",
          "description": "Builds robots.txt lines that allow or block AI crawlers from BACKLNK's reviewed crawler catalog, with what each line does and warnings. Use a preset (block-training: Block AI training, stay in AI search; block-ai: Block AI crawlers, keep search engines; allow-all: Allow every crawler) or decide per purpose and per crawler token.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "crawlers": {
                "additionalProperties": {
                  "enum": ["allow", "block"],
                  "type": "string"
                },
                "description": "Per-crawler overrides by token, e.g. { \"GPTBot\": \"allow\" }.",
                "type": "object"
              },
              "language": {
                "description": "Language of the human-readable texts in the answer (summaries, findings, messages): one of en. Ids, codes and field names stay English. Default en.",
                "type": "string"
              },
              "preset": {
                "enum": ["block-training", "block-ai", "allow-all"],
                "type": "string"
              },
              "purposes": {
                "additionalProperties": false,
                "description": "Decision per purpose; purposes not named stay allowed when no preset is given.",
                "properties": {
                  "ai-search": {
                    "description": "Crawlers that let AI assistants and AI search find, cite and link your pages.",
                    "enum": ["allow", "block"],
                    "type": "string"
                  },
                  "ai-training": {
                    "description": "Crawlers and control tokens that decide whether your content may be used to train AI models.",
                    "enum": ["allow", "block"],
                    "type": "string"
                  },
                  "dataset": {
                    "description": "Open crawl archives that anyone, including AI developers, can download and analyse.",
                    "enum": ["allow", "block"],
                    "type": "string"
                  },
                  "search-engine": {
                    "description": "Classic web search crawlers. Blocking one takes your site out of that search engine.",
                    "enum": ["allow", "block"],
                    "type": "string"
                  },
                  "user-fetch": {
                    "description": "Visits made when a person asks an assistant about a page or shares a link.",
                    "enum": ["allow", "block"],
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "AI crawler robots.txt rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:32266e8c7e75d53cf84e046d2ad234bc1c0e049f493905fb69b1bc29fd683a1a"
        },
        {
          "name": "get_report",
          "title": "Get a check's report",
          "description": "Returns the compact report of an earlier check: state, summary, counts and findings (detail \"actions\": issues and warnings only, the default; \"all\": every finding).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audit_id": {
                "description": "Audit id returned by run_checks (a UUID).",
                "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$",
                "type": "string"
              },
              "detail": {
                "description": "Default \"actions\".",
                "enum": ["actions", "all"],
                "type": "string"
              },
              "language": {
                "description": "Language of the human-readable texts in the answer (summaries, findings, messages): one of en. Ids, codes and field names stay English. Default en.",
                "type": "string"
              }
            },
            "required": ["audit_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a check's report"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f93be7175c81a19a341abd8be4ae05583c0b2850093daa65d64f5f7799fb9b62"
        },
        {
          "name": "list_checks",
          "title": "List BACKLNK checks",
          "description": "Lists every check BACKLNK can run (id, what it looks at, its scope and limits). Use the ids with run_checks.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the human-readable texts in the answer (summaries, findings, messages): one of en. Ids, codes and field names stay English. Default en.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List BACKLNK checks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e8b967a2c55bc77547749050e252f7a9463b408a33a99d42b7eb0a163ad58b5a"
        },
        {
          "name": "run_checks",
          "title": "Check a page",
          "description": "Runs BACKLNK checks on one public URL and waits up to about 40 seconds. Returns, per check, its state, summary, counts and the issues and warnings to fix (most important first, with evidence and a recommendation), plus the audit ids for get_report and verify_fixes. Default checks: meta-tags, page-structure, ai-crawler-access, redirects-headers, entity-schema.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "checks": {
                "description": "Check ids (see list_checks). Omit for the quick default set.",
                "items": {
                  "enum": ["llms-txt-generate", "llms-txt-validate", "entity-schema", "sitemap-hygiene", "internal-links", "page-structure", "ai-crawler-access", "meta-tags", "redirects-headers", "indexability", "hreflang", "duplicate-content", "image-seo", "page-speed"],
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "fresh": {
                "description": "Re-run even if the same check ran on this URL very recently (default false).",
                "type": "boolean"
              },
              "language": {
                "description": "Language of the human-readable texts in the answer (summaries, findings, messages): one of en. Ids, codes and field names stay English. Default en.",
                "type": "string"
              },
              "mode": {
                "description": "Source reads the HTML as served; Rendered runs JavaScript first; Auto decides per page.",
                "enum": ["Source", "Rendered", "Auto"],
                "type": "string"
              },
              "url": {
                "description": "Public page or website URL, e.g. https://example.com/pricing",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:12a17c65197893c0385c504fb76ab46bdba121a8259a7498fa1b0df1c043d5b1"
        },
        {
          "name": "usage",
          "title": "Usage and limits",
          "description": "How many checks have been used and are left today and this hour: the API key's own quota, or without a key the limit shared by every call from the same app or address.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the human-readable texts in the answer (summaries, findings, messages): one of en. Ids, codes and field names stay English. Default en.",
                "type": "string"
