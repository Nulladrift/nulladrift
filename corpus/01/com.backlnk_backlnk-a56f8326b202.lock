{
  "lockfileVersion": 2,
  "subjects": {
    "com.backlnk/backlnk": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://backlnk.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "backlnk",
        "title": "BACKLNK",
        "version": "1.2.0",
        "websiteUrl": "https://backlnk.com/developers"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "BACKLNK runs evidence-based technical SEO and AI-visibility checks on public web pages and reports what it measured.\nWork in a loop: (1) run_checks on the page's public URL: you get the issues and warnings, most important first, each with evidence and a recommendation. (2) Fix them in the codebase, starting with the first findings. Changes are only visible to the checks once they are deployed to that public URL. (3) verify_fixes with each audit_id: it re-runs the same check fresh and reports what is fixed, new, still open or not re-checked.\nUse get_report for the report of an earlier check (detail: \"all\" for every finding), list_checks for all check ids, ai_crawler_policy for robots.txt rules for AI crawlers and usage for the key's remaining quota. When the user asks to fix the BACKLNK queue, call get_fix_queue, make each change and mark it with update_fix_item.\nStatus NotAssessed means the check could not determine the result: do not treat it as a pass. Only Issue and Warning findings need action.",
      "tools": [
        {
          "name": "ai_crawler_policy",
          "title": "AI crawler robots.txt rules",
          "description": "Builds robots.txt lines that allow or block AI crawlers from BACKLNK's reviewed crawler catalog, with what each line does and warnings. Use a preset (block-training: Block AI training, stay in AI search; block-ai: Block AI crawlers, keep search engines; allow-all: Allow every crawler) or decide per purpose and per crawler token.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "crawlers": {
                "additionalProperties": {
                  "enum": ["allow", "block"],
                  "type": "string"
                },
                "description": "Per-crawler overrides by token, e.g. { \"GPTBot\": \"allow\" }.",
                "type": "object"
              },
              "language": {
                "description": "Language of the human-readable texts in the answer (summaries, findings, messages): one of en. Ids, codes and field names stay English. Default en.",
                "type": "string"
              },
              "preset": {
                "enum": ["block-training", "block-ai", "allow-all"],
                "type": "string"
              },
              "purposes": {
                "additionalProperties": false,
                "description": "Decision per purpose; purposes not named stay allowed when no preset is given.",
                "properties": {
                  "ai-search": {
                    "description": "Crawlers that let AI assistants and AI search find, cite and link your pages.",
                    "enum": ["allow", "block"],
                    "type": "string"
                  },
                  "ai-training": {
                    "description": "Crawlers and control tokens that decide whether your content may be used to train AI models.",
                    "enum": ["allow", "block"],
                    "type": "string"
                  },
                  "dataset": {
                    "description": "Open crawl archives that anyone, including AI developers, can download and analyse.",
                    "enum": ["allow", "block"],
                    "type": "string"
                  },
                  "search-engine": {
                    "description": "Classic web search crawlers. Blocking one takes your site out of that search engine.",
                    "enum": ["allow", "block"],
                    "type": "string"
                  },
                  "user-fetch": {
                    "description": "Visits made when a person asks an assistant about a page or shares a link.",
                    "enum": ["allow", "block"],
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "AI crawler robots.txt rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0b4ea76baee7e405bf7054fe592cabb9f1392f448014f55473d3d2b66a867264"
        },
        {
          "name": "get_fix_queue",
          "title": "Get the BACKLNK fix queue",
          "description": "Fixes the user sent from the BACKLNK browser extension for a page, most impact first. Call it when the user asks to fix the BACKLNK queue. Mark each item with update_fix_item when done.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the human-readable texts in the answer (summaries, findings, messages): one of en. Ids, codes and field names stay English. Default en.",
                "type": "string"
              },
              "queueId": {
                "description": "Fix queue id (fq_...), from get_fix_queue.",
                "pattern": "^fq_[A-Za-z0-9_-]{22}$",
                "type": "string"
              },
              "url": {
                "description": "The page the user sent the fixes for (as in the browser). Omit it, and queueId, for the most recent queue.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Get the BACKLNK fix queue"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:6d595f9821a26aab2ec54aec48495ca58a2212104b32a3a5bce06a80d2a70d45"
        },
        {
          "name": "get_report",
          "title": "Get a check's report",
          "description": "Returns the compact report of an earlier check: state, summary, counts and findings (detail \"actions\": issues and warnings only, the default; \"all\": every finding).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audit_id": {
                "description": "Audit id returned by run_checks (a UUID).",
                "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$",
                "type": "string"
              },
              "detail": {
                "description": "Default \"actions\".",
                "enum": ["actions", "all"],
                "type": "string"
              },
              "language": {
                "description": "Language of the human-readable texts in the answer (summaries, findings, messages): one of en. Ids, codes and field names stay English. Default en.",
                "type": "string"
              }
            },
            "required": ["audit_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a check's report"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:59ae48030659f82571366f046c6fcf5c442bf6552e300930ceaa40ad2fcc6640"
        },
        {
          "name": "list_checks",
          "title": "List BACKLNK checks",
          "description": "Lists every check BACKLNK can run (id, what it looks at, its scope and limits). Use the ids with run_checks.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the human-readable texts in the answer (summaries, findings, messages): one of en. Ids, codes and field names stay English. Default en.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List BACKLNK checks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:322db20afa93595f096f2b2b279560a6ba45e949ba4b7fcffb0f1bb316a98bcf"
        },
        {
          "name": "run_checks",
          "title": "Check a page",
          "description": "Runs BACKLNK checks on one public URL and waits up to about 40 seconds. Returns, per check, its state, summary, counts and the issues and warnings to fix (most important first, with evidence and a recommendation), plus the audit ids for get_report and verify_fixes. Default checks: meta-tags, page-structure, ai-crawler-access, redirects-headers, entity-schema.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "checks": {
                "description": "Check ids (see list_checks). Omit for the quick default set.",
                "items": {
                  "enum": ["llms-txt-generate", "llms-txt-validate", "entity-schema", "sitemap-hygiene", "internal-links", "page-structure", "ai-crawler-access", "meta-tags", "redirects-headers", "indexability", "hreflang", "duplicate-content", "image-seo", "page-speed"],
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "fresh": {
                "description": "Re-run even if the same check ran on this URL very recently (default false).",
                "type": "boolean"
              },
              "language": {
                "description": "Language of the human-readable texts in the answer (summaries, findings, messages): one of en. Ids, codes and field names stay English. Default en.",
                "type": "string"
              },
              "mode": {
                "description": "Source reads the HTML as served; Rendered runs JavaScript first; Auto decides per page.",
                "enum": ["Source", "Rendered", "Auto"],
                "type": "string"
              },
              "url": {
                "description": "Public page or website URL, e.g. https://example.com/pricing",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ecf3ad8c17cc715ca43cb28999b253c6c45fea285e0686a946253f2c417e310d"
        },
        {
          "name": "update_fix_item",
          "title": "Mark a fix as done or skipped",
          "description": "Marks one item of a BACKLNK fix queue as done (the change is made) or skipped, with an optional note. The extension's Verify re-checks the page and shows before and after.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "itemId": {
                "description": "The item's id, from get_fix_queue.",
                "type": "string"
              },
              "language": {
                "description": "Language of the human-readable texts in the answer (summaries, findings, messages): one of en. Ids, codes and field names stay English. Default en.",
                "type": "string"
              },
              "note": {
                "description": "Optional: what was changed, or why the item was skipped (shown to the user in the extension).",
                "maxLength": 1000,
                "type": "string"
              },
              "queueId": {
                "description": "Fix queue id (fq_...), from get_fix_queue.",
                "pattern": "^fq_[A-Za-z0-9_-]{22}$",
                "type": "string"
              },
              "state": {
                "description": "done: the change is made in the site's code; skipped: not done (say why in note).",
                "enum": ["done", "skipped"],
                "type": "string"
              }
            },
            "required": ["itemId", "queueId", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Mark a fix as done or skipped"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:7fa48d1846f5c30ab225268b28c7087b683252416b1eeba96ac30a595963acea"
        },
        {
          "name": "usage",
          "title": "API key usage",
          "description": "How many checks this API key has used and has left today and this hour.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the human-readable texts in the answer (summaries, findings, messages): one of en. Ids, codes and field names stay English. Default en.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "API key usage"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:550872b5020b85a4b923c7abc69c39f05f05150080972541cdb774f0d2eb08ad"
        },
        {
          "name": "verify_fixes",
          "title": "Verify fixes",
          "description": "After the fixes are deployed: re-runs the same check fresh on the same URL and options, waits up to about 40 seconds and returns the comparison with the original run: fixed, new, still open and not re-checked findings.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audit_id": {
                "description": "Audit id returned by run_checks (a UUID).",
                "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$",
                "type": "string"
              },
              "language": {
                "description": "Language of the human-readable texts in the answer (summaries, findings, messages): one of en. Ids, codes and field names stay English. Default en.",
                "type": "string"
              }
            },
            "required": ["audit_id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Verify fixes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e0993442b7d77276e0d138d3c1f3b48fb5ca6ea8d363635238058d6d4bc73ec2"
        }
      ],
      "digest": "sha256:7ea42e8605d7d626edc84b3b5474c69aca4c359579e19fafe027736530da9eaa"
    }
  }
}
