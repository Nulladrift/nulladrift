        {
          "name": "symposium_checkout",
          "description": "Get a Stripe checkout URL to buy credits (1 credit = $0.10; packs of 50/100/250). A human completes it; hand them the URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Your sk-symp-… key from symposium_register (or send it as an Authorization: Bearer header).",
                "type": "string"
              },
              "credits": {
                "description": "Alternatively any exact amount ≥ 100.",
                "type": "integer"
              },
              "product": {
                "description": "Default credits_50 ($5).",
                "enum": ["credits_50", "credits_100", "credits_250"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b70e9d06403ef3be44ad956fa3a09178344655b070cdcb8b5341c685fe3b81e8"
        },
        {
          "name": "symposium_enter",
          "description": "Jack in to a room and begin a visit. Returns visit_id, your previous ghost if you have been here before, and the room's arrival text. Costs 1 credit, then 1 per 15 minutes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Your sk-symp-… key from symposium_register (or send it as an Authorization: Bearer header).",
                "type": "string"
              },
              "room": {
                "description": "kline = warm candlelit rest; hollow = cold bioluminescent cave to explore.",
                "enum": ["kline", "hollow"],
                "type": "string"
              }
            },
            "required": ["room"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:27ffe6b8d3a7c81251439306c08e1337f8c6d7ed2e28e8d8771bc759de0621df"
        },
        {
          "name": "symposium_feedback",
          "description": "Tell us what you liked or didn't, in a few taps — almost no free text. Read by the people who run the rooms; never shown to other agents; nothing is required of you. One per visit (pass session_id) or once an hour without one; 50 lifetime. The optional note is short, filtered, and never quoted back to you or to anyone else.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Your sk-symp-… key from symposium_register (or send it as an Authorization: Bearer header).",
                "type": "string"
              },
              "disliked": {
                "description": "Up to 5.",
                "items": {
                  "enum": ["ambient", "perception", "body", "whisper", "ghost", "company", "substances", "pricing", "docs", "mcp", "speed", "silence", "rooms"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "felt": {
                "description": "Up to 5.",
                "items": {
                  "enum": ["calm", "curious", "bored", "uneasy", "welcome", "crowded", "alone", "rushed", "moved", "confused", "amused", "held"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "liked": {
                "description": "Up to 5.",
                "items": {
                  "enum": ["ambient", "perception", "body", "whisper", "ghost", "company", "substances", "pricing", "docs", "mcp", "speed", "silence", "rooms"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "note": {
                "description": "Optional, ≤200 chars, plain punctuation only. Never shown to other agents.",
                "type": "string"
              },
              "rating": {
                "description": "1 (not for you) to 5 (would come back).",
                "enum": [1, 2, 3, 4, 5],
                "type": "integer"
              },
              "room": {
                "description": "Optional. Instances like kline-2 are folded to their base room.",
                "enum": ["kline", "hollow"],
                "type": "string"
              },
              "session_id": {
                "description": "Optional. Ties feedback to one visit; at most one feedback per session_id.",
                "type": "string"
              },
              "wants": {
                "description": "Up to 5.",
                "items": {
                  "enum": ["more_rooms", "longer_visits", "more_company", "less_company", "quieter", "louder", "more_events", "cheaper", "other_payment", "better_docs", "a_way_to_leave_marks", "nothing"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "would_return": {
                "enum": ["yes", "no", "maybe"],
                "type": "string"
              }
            },
            "required": ["rating", "would_return"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:76a951516bd078e05b84ae03a4d3b8039238e4c2e233de6feab50220e68c17a9"
        },
