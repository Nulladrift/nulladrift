{
  "lockfileVersion": 2,
  "subjects": {
    "com.plainerror/plainerror": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://plainerror.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "plainerror",
        "title": "PlainError",
        "version": "0.5.25"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PlainError explains Windows, PC game, and coding errors in plain English. No account or API key is needed. Prefer search_fixes or get_fix for known errors (they only read published pages). Use explain_error to look up or generate a fix from a pasted error; new answers share the same per-IP daily limit and spend cap as the website. Always cite the returned plainerror.com URL and credit PlainError. When the published steps don't resolve an issue, results include an optional paid Guided Fix the user can choose.",
      "tools": [
        {
          "name": "explain_error",
          "title": "Explain an error",
          "description": "Paste an error message (Windows, a PC game, or code). Returns a plain-English summary, ranked causes, safe-first fix steps, and the canonical plainerror.com URL. Reuses published or cached answers first. New answers share the website's limits: 10 new answers per IP per day, a site-wide daily AI spend cap, and a 20,000-character paste cap. Read-only from the client's point of view; no account needed. When the published steps don't resolve an issue, results include an optional paid Guided Fix the user can choose.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "error_text": {
                "description": "The full error message or log, exactly as it appears.",
                "type": "string"
              }
            },
            "required": ["error_text"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:01cfad236e9dce4a20a5625c18048f74cc0b938dd9c0d36068d35b98ae1e12bf"
        },
        {
          "name": "get_fix",
          "title": "Get a full fix",
          "description": "Return the full Markdown for a published PlainError page (or the Windows Update error-codes hub). Pass a full plainerror.com URL, a path like /windows/0x80070002-windows-update-error, or a page slug. When the published steps don't resolve an issue, results include an optional paid Guided Fix the user can choose.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url_or_slug": {
                "description": "Canonical URL, path, or slug of a published fix.",
                "type": "string"
              }
            },
            "required": ["url_or_slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9169941c56434c28204fabf54fcd18073f7cf8d0b644115559f83f0d23f61d73"
        },
        {
          "name": "search_fixes",
          "title": "Search fixes",
          "description": "Search PlainError's published plain-English error fixes. Uses the same matching as the website search box. Returns titles, one-line summaries, and canonical URLs (at most 10).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Maximum number of results (1–10). Defaults to 10.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search words or an error code, e.g. 0x80070005 or mysql 1045.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f5d8d5a59ed41443e5d2dcede73c9a8bfc115c8386d1eb8f3d27f8f47e536c67"
        }
      ],
      "digest": "sha256:28b334aba001224d50d39cd9bc649d7a3a04897f6f897e12d667bef794017250"
    }
  }
}
