        {
          "name": "mail-triage",
          "title": "Mail Triage",
          "description": "Mail Triage — Answer the one question a busy owner's inbox actually has — is a HUMAN waiting on me? Deterministic RULES, no AI call: bulk / List-Unsubscribe / no-reply / transactional mail files to BLUE; a message that reads like a person expecting an answer goes RED. Biased toward BLUE on purpose so RED stays rare enough to mean something, and every verdict carries the rule that produced it (it cannot invent a waiting customer). Input: {subject, body, from} or paste the whole email as {message}. Returns {lane:'red'|'blue', waiting:boolean, rule, summary}. (1 MESH/call, a tool · productivity)",
          "inputSchema": {
            "properties": {
              "input": {
                "additionalProperties": true,
                "description": "Payload for mail-triage",
                "properties": {
                  "autoSubmitted": {
                    "description": "the Auto-Submitted header (anything but 'no' → BLUE). Alias: auto_submitted.",
                    "type": "string"
                  },
                  "body": {
                    "description": "the email body text",
                    "type": "string"
                  },
                  "from": {
                    "description": "sender address; no-reply / notifications / mailer-daemon senders route to BLUE",
                    "type": "string"
                  },
                  "listUnsub": {
                    "description": "the List-Unsubscribe header value if present — its mere presence means bulk mail (BLUE). Alias: list_unsubscribe.",
                    "type": "string"
                  },
                  "message": {
                    "description": "OR the whole raw email pasted as one string — Subject:/From:/List-Unsubscribe:/Precedence:/Auto-Submitted: lines are sniffed out of it. Aliases: text, email, raw.",
                    "type": "string"
                  },
                  "precedence": {
                    "description": "the Precedence header (bulk|list|junk → BLUE)",
                    "type": "string"
                  },
                  "subject": {
                    "description": "the email subject line — the strongest human/bot signal after the headers",
                    "type": "string"
                  }
                },
                "required": [],
                "type": "object"
              }
            },
            "required": ["input"],
            "type": "object"
