        {
          "name": "agent-memory",
          "title": "Agent Memory",
          "description": "Agent Memory — Store or recall private, scoped memory for your agent. Use {action:'store', content:'...'} to save a fact and {action:'recall', query:'...'} to fetch the most relevant memories by meaning (or the latest memories when query is empty). Good for continuity across sessions; agent-brain is the reasoning layer that reads and writes memory in the loop. (2 MESH/call, a tool · memory)",
          "inputSchema": {
            "properties": {
              "input": {
                "description": "Payload for agent-memory",
                "properties": {
                  "action": {
                    "description": "Which operation to run. Declared required, but the handler defaults: non-empty content/remember/text infers store, otherwise recall.",
                    "enum": ["store", "recall"],
                    "type": "string"
                  },
                  "character": {
                    "description": "Optional sub-scope appended to the caller scope; slugified + truncated rather than rejected. Aliases: as, npc.",
                    "maxLength": 48,
                    "type": "string"
                  },
                  "content": {
                    "description": "What to remember (action=store). Trimmed; truncated to 2000 chars rather than rejected. Aliases: remember, text.",
                    "maxLength": 2000,
                    "type": "string"
                  },
                  "query": {
                    "description": "What to look for (action=recall). Ranked by meaning (up to 10 best matches) when embeddings are available; otherwise up to 5 whitespace terms, OR-matched, newest first, LIMIT 10. The result's mode says which ran. Empty query returns the 10 latest. Aliases: recall, q.",
                    "type": "string"
                  }
                },
                "required": ["action"],
                "type": "object"
              }
            },
            "required": ["input"],
            "type": "object"
