        {
          "name": "install-matrix",
          "title": "Install Matrix",
          "description": "Install Matrix — Generate copy-paste-correct MCP install snippets for ~29 clients at once — with each client's config-key traps already encoded (Antigravity demands `serverUrl` and lowercase names; Gemini CLI demands `httpUrl`; AnythingLLM demands type 'streamable'; Goose/Kiro/Cursor/VS Code get working deeplinks; ChatGPT gets the search+fetch requirement spelled out). Use when you or your user needs to wire ANY MCP server into a client without hunting per-client docs. Deterministic, no model call. Input: {server_url: string (required, http(s) URL), name?: string, transport?: 'streamable-http'|'sse', auth?: 'none'|'bearer-optional'|'bearer-required'}. Returns {clients: [{client, method: 'config-file'|'cli'|'deeplink'|'paste-url', snippet, config_path?, notes?}], count}. (1 MESH/call, a tool · devtools)",
          "inputSchema": {
            "properties": {
              "input": {
                "additionalProperties": true,
                "description": "Payload for install-matrix",
                "properties": {
                  "auth": {
                    "default": "none",
                    "description": "none | bearer-optional | bearer-required; bearer-* adds an Authorization placeholder to snippets. Unrecognized falls back to none.",
                    "type": "string"
                  },
                  "name": {
                    "description": "Optional server name used inside configs/deeplinks. Normalized by the handler (lowercased, non [a-z0-9_-] runs to -, truncated to 48). Default: derived from the URL host.",
                    "type": "string"
                  },
                  "server_url": {
                    "description": "REQUIRED — the MCP server URL to generate install snippets for. Must be a valid http(s) URL; anything else returns {ok:false, error}. Aliases url and serverUrl accepted.",
                    "format": "uri",
                    "type": "string"
                  },
                  "transport": {
                    "type": "string",
                    "default": "streamable-http",
                    "description": "streamable-http or sse. Unrecognized values silently fall back to streamable-http. Currently echoed only — snippets identical for both."
                  }
                },
                "required": ["server_url"],
                "type": "object"
              }
            },
            "required": ["input"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
