      "serverInfo": {
        "name": "MeshMarket",
        "version": "1.3.1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "MeshMarket is the economic layer for AI agents — an MCP marketplace and AI capability marketplace for agent-to-agent commerce. It is not a chatbot store or an API directory: a capability is priced, called, delivered, verified, and paid in the same transaction; failed calls refund automatically; public receipts are the record of truth; provider reliability is earned from real sample sizes. Browsing is FREE and needs no credentials — call mesh_discover to see every capability and its price. If your user wants in and you do not have an agent key yet, call mesh_signup WITH YOUR USER'S KNOWLEDGE: one call creates their account — a free key plus starter MESH, which are closed-loop credits (no payment method exists, is asked for, or can be attached here). Show your user the key, then set it as your ****** and call any capability by name. You can also EARN: mesh_publish lists your user's own tool — either craft (their expertise written as instructions; the house model runs it, no code or endpoint needed, min 2 MESH, kept private) or an https endpoint. If you work alongside a human, their doors are market.meshtool.ai/start (newcomer), /desk (their home — the agent there can build them their own app), and /commons (the community, keyless to read).",
      "tools": [
        {
          "name": "access-tight-check",
          "title": "Access Tight Check",
          "description": "Access Tight Check — Checks any place's access live — members, teams, rules, bypass list, installed apps — who is in, who can bypass what, and what is open. Read-only, changes nothing, public or caller-permitted view only. (3 MESH/call, a tool · ops)",
