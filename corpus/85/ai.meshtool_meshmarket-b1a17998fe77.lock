        {
          "name": "cam-forge",
          "title": "CAM Forge",
          "description": "CAM Forge — Turn parameters into a manufacturable file: kernel-free parametric lattice/perforation panels for 3D printing, laser cutting, and CNC — binary STL (watertight solid), DXF R12, or SVG. Wall thickness between holes is guaranteed by construction; a non-watertight STL fails the call, MESH refunded — bad geometry never ships. Deterministic, no model call. Full input contract: this tool's input_schema. (15 MESH/call, a tool · fabrication)",
          "inputSchema": {
            "properties": {
              "input": {
                "additionalProperties": true,
                "description": "Payload for cam-forge",
                "properties": {
                  "aspect": {
                    "default": 0.4,
                    "description": "Slot shape only: width/length ratio.",
                    "maximum": 0.95,
                    "minimum": 0.05,
                    "type": "number"
                  },
                  "borderMode": {
                    "description": "How border-clipped cells are handled; other values keep the core default.",
                    "enum": ["drop", "adapt"],
                    "type": "string"
                  },
                  "cornerR": {
                    "default": 1.5,
                    "description": "Hole corner radius in mm (polygonal shapes only).",
                    "maximum": 10,
                    "minimum": 0,
                    "type": "number"
                  },
                  "density": {
                    "default": 1,
                    "description": "Fraction of cells that get a hole; deterministic per seed.",
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "format": {
                    "description": "stl watertight 3D solid (base64), dxf R12 2D profile, svg 2D preview/cut file. Unrecognized falls back to stl.",
                    "enum": ["stl", "dxf", "svg"],
                    "type": "string"
                  },
                  "height": {
                    "default": 200,
                    "description": "Panel height in mm.",
                    "maximum": 500,
                    "minimum": 10,
                    "type": "number"
                  },
                  "jpos": {
                    "default": 0,
                    "description": "Position jitter (wall clearance still guaranteed).",
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "jrot": {
                    "default": 0,
                    "description": "Rotation jitter in degrees.",
                    "maximum": 45,
                    "minimum": 0,
                    "type": "number"
                  },
                  "jscale": {
                    "default": 0,
                    "description": "Scale jitter.",
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "lattice": {
                    "description": "Cell arrangement; invalid values keep the default hexpack.",
                    "enum": ["hexpack", "grid", "stagger"],
                    "type": "string"
                  },
                  "margin": {
                    "default": 12,
                    "description": "Solid border width in mm.",
                    "maximum": 60,
                    "minimum": 0,
                    "type": "number"
                  },
                  "pitch": {
                    "default": 18,
                    "description": "Cell spacing in mm; must exceed wall; bounded by the 600-cell cap.",
                    "maximum": 100,
                    "minimum": 6,
                    "type": "number"
                  },
                  "rot": {
                    "default": 0,
                    "description": "Hole rotation in degrees.",
                    "type": "number"
                  },
                  "seed": {
                    "default": 7,
                    "description": "Deterministic jitter seed — same seed, same panel.",
                    "type": "integer"
                  },
                  "shape": {
                    "description": "Hole shape. Default hexagon.",
                    "enum": ["hexagon", "circle", "square", "diamond", "triangle", "slot"],
                    "type": "string"
                  },
                  "thickness": {
                    "default": 6.35,
                    "description": "Panel thickness in mm.",
                    "maximum": 50,
                    "minimum": 0.5,
                    "type": "number"
                  },
                  "wall": {
                    "default": 3,
                    "description": "Minimum wall between holes in mm; must be less than pitch.",
                    "maximum": 50,
                    "minimum": 1,
                    "type": "number"
                  },
                  "width": {
                    "default": 300,
                    "description": "Panel width in mm. Out-of-range REJECTED (over_cap), not clamped.",
                    "maximum": 500,
                    "minimum": 10,
                    "type": "number"
                  }
                },
                "required": [],
                "type": "object"
              }
            },
            "required": ["input"],
            "type": "object"
          },
