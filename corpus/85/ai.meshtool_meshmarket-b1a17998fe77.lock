        {
          "name": "industry-vocabulary",
          "title": "Industry Vocabulary",
          "description": "Industry Vocabulary — Hand it a trade or industry in plain words and get back the language that industry actually uses: what a caller is called, what the appointment is called, what the provider is called, and the questions that qualify a job. Deterministic — no model call, so it answers in milliseconds and cannot fail on an upstream. Says plainly whether it matched a real vertical or fell back to generic. (1 MESH/call, a tool · business)",
          "inputSchema": {
            "properties": {
              "input": {
                "anyOf": [
                  {
                    "required": ["trade"]
                  },
                  {
                    "required": ["industry"]
                  },
                  {
                    "required": ["business"]
                  },
                  {
                    "required": ["query"]
                  },
                  {
                    "required": ["text"]
                  },
                  {
                    "required": ["input"]
                  }
                ],
                "description": "Plain JSON POST body (not MCP). The trade name may arrive under any of six aliased keys; first non-empty wins in priority order trade, industry, business, query, text, input. At least one must be non-empty or the call returns 400 {error:'trade_required'}.",
                "properties": {
                  "business": {
                    "description": "Alias for trade (checked 3rd).",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "industry": {
                    "description": "Alias for trade (checked 2nd).",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "input": {
                    "description": "Alias for trade (checked 6th).",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "query": {
                    "description": "Alias for trade (checked 4th).",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "text": {
                    "description": "Alias for trade (checked 5th).",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "trade": {
                    "description": "The trade or industry in plain words, e.g. roofing. Preferred key. Trimmed; truncated to 200 chars.",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["input"],
            "type": "object"
