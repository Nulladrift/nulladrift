        {
          "name": "search_certificates",
          "title": "Search occupancy certificates",
          "description": "Search certificates of occupancy or completion. Defaults exclude renewals; co_date_basis states what each date means. Completion certificates do not establish occupancy, and pending applications are not issued certificates. Coverage varies by source and place; an empty result does not establish that no record exists. Up to 25 results per call. total_capped marks a lower bound; total_unknown means the total is unknown. Pagination guidance is in _notes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Street address, partial, case-insensitive",
                "maxLength": 500,
                "type": "string"
              },
              "certificate_status": {
                "description": "Default: issued + expired (both were issued). 'pending' = CO applications not yet issued.",
                "enum": ["issued", "expired", "pending", "void", "unknown", "all"],
                "maxLength": 500,
                "type": "string"
              },
              "city": {
                "description": "City name (matches the address city or the issuing jurisdiction)",
                "maxLength": 500,
                "type": "string"
              },
              "co_number": {
                "maxLength": 500,
                "type": "string"
              },
              "co_type": {
                "description": "'change' = re-issued for an existing building's new owner, use or occupant load; 'revision' = a revised certificate. Neither certifies new units: their dwelling units are in units_existing, so min_units counts newly certified units.",
                "enum": ["final", "temporary", "partial", "unknown", "change", "revision"],
                "maxLength": 500,
                "type": "string"
              },
              "issued_after": {
                "description": "CO date on or after (undated certificates never match)",
                "format": "date",
                "maxLength": 500,
                "type": "string"
              },
              "issued_before": {
                "description": "CO date on or before",
                "format": "date",
                "maxLength": 500,
                "type": "string"
              },
              "jurisdiction_id": {
                "description": "A jurisdiction id from /v1/jurisdictions",
                "format": "uuid",
                "maxLength": 500,
                "type": "string"
              },
              "kind": {
                "default": "occupancy",
                "description": "'occupancy' (default), 'completion' (certificates of completion: close-outs of work that creates no occupancy, e.g. roofs, pools), or 'all'",
                "enum": ["occupancy", "completion", "all"],
                "maxLength": 500,
                "type": "string"
              },
              "lat": {
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lng": {
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "min_units": {
                "description": "Newly certified dwelling units on or above (units_existing is not counted)",
                "minimum": 0,
                "type": "integer"
              },
              "occupancy_class": {
                "description": "Building-code occupancy group as published, e.g. R-3, B",
                "maxLength": 500,
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Page number, 1-based (default 1)",
                "minimum": 1,
                "type": "integer"
              },
              "parcel": {
                "description": "Parcel / APN / folio / BBL (formatting ignored)",
                "maxLength": 500,
                "type": "string"
              },
              "per_page": {
                "default": 25,
                "description": "Results per page (default 25, max 25)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "permit_number": {
                "description": "The building permit the certificate was issued on",
                "maxLength": 500,
                "type": "string"
              },
              "radius_miles": {
                "description": "Radius in miles around lat/lng (default 1)",
                "exclusiveMinimum": 0,
                "maximum": 50,
                "type": "number"
              },
              "renewals": {
                "default": "exclude",
                "description": "Temporary-certificate RENEWALS (NYC re-issues a TCO every 90 days). Default 'exclude': finals and first-time TCOs only.",
                "enum": ["exclude", "include", "only"],
                "maxLength": 500,
                "type": "string"
              },
              "start": {
                "description": "Instead of page: 1-based position of the first result to return, e.g. start=24 continues after result 23 (as named in `_notes`)",
                "minimum": 1,
                "type": "integer"
              },
              "state": {
                "description": "2-letter state code",
                "maxLength": 500,
                "type": "string"
              },
              "zip_code": {
                "description": "5-digit ZIP",
                "maxLength": 500,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search occupancy certificates"
          },
          "behavior": {
