        {
          "name": "get_permit",
          "title": "Look up a permit by number",
          "description": "Look up a permit by the permit number assigned by the issuing jurisdiction, optionally narrowed by city and state. The number is matched exactly (ignoring case), and the same number can exist in several jurisdictions, so up to 5 matching permits are returned; give the city or state to tell them apart. If nothing matches exactly and a city or state was given, permits in that place whose number contains the text are returned instead, and `match` says \"partial\". When the connected account covers a limited date range, `account_window_from` is set and only permits from that date onward are searched. Results carry no property owner name, owner mailing address or permit applicant name fields.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City where the permit was issued (optional, narrows the match)",
                "type": "string"
              },
              "permit_number": {
                "description": "The permit number from the issuing jurisdiction",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code (optional, narrows the match)",
                "type": "string"
              }
            },
            "required": ["permit_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a permit by number"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["permits:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:3915c4915f19f88ed00c770291f2672306e15056f40afa30cbd5b1a946469b27"
        },
        {
          "name": "get_permit_inspections",
          "title": "Permit inspections",
          "description": "List inspections linked to a permit UUID. Future scheduled inspections are excluded by default unless result=SCHEDULED or upcoming opts in. An empty list means no linked inspection is held. Coverage varies by source and place; an empty result does not establish that no record exists. Up to 25 results per call. total_capped marks a lower bound; total_unknown means the total is unknown. Pagination guidance is in _notes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "page": {
                "default": 1,
                "description": "Page number, 1-based (default 1)",
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "default": 25,
                "description": "Results per page (default 25, max 25)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "permit_id": {
                "format": "uuid",
                "maxLength": 500,
                "type": "string"
              },
              "result": {
                "enum": ["PASS", "FAIL", "PARTIAL", "CANCELLED", "SCHEDULED", "OTHER"],
                "maxLength": 500,
                "type": "string"
              },
              "start": {
                "description": "Instead of page: 1-based position of the first result to return, e.g. start=24 continues after result 23 (as named in `_notes`)",
                "minimum": 1,
                "type": "integer"
              },
              "summaries": {
                "default": "exclude",
                "enum": ["exclude", "include", "only"],
                "maxLength": 500,
                "type": "string"
              },
              "upcoming": {
                "description": "Future-dated (still scheduled) inspections: exclude (the default, except with result=SCHEDULED), include, or only (soonest first).",
                "enum": ["exclude", "include", "only"],
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["permit_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Permit inspections"
