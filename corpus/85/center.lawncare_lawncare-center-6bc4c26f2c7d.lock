              },
              "documentCount": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "facet": {
                "enum": ["topics", "tags", "seasons", "kinds", "states", "cities"],
                "type": "string"
              },
              "values": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "count": {
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "id": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    }
                  },
                  "required": ["count", "id", "label"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["catalogVersion", "documentCount", "facet", "values"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:404044d151b5fcbd55dda77fa4ad3d62b17ee8a8ac992625c924ba4c7f64d080"
        },
        {
          "name": "search_lawn_care",
          "title": "Search lawn-care guidance",
          "description": "Search published Lawn Care Center guides. Use filters when location, season, topic, or content kind is known. Results include MCP resource links for full Markdown.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "city": {
                "maxLength": 120,
                "minLength": 1,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              },
              "cursor": {
                "maxLength": 200,
                "type": "string"
              },
              "kind": {
                "enum": ["article", "state", "city"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "default": "",
                "maxLength": 200,
                "type": "string"
              },
              "season": {
                "enum": ["spring", "summer", "fall", "winter", "year-round"],
                "type": "string"
              },
              "state": {
                "maxLength": 120,
                "minLength": 1,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              },
              "tag": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "topic": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "catalogVersion": {
                "type": "string"
              },
              "nextCursor": {
                "type": "string"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "answer": {
                      "type": "string"
                    },
                    "canonicalUrl": {
                      "format": "uri",
                      "type": "string"
                    },
                    "path": {
                      "maxLength": 370,
                      "minLength": 1,
                      "pattern": "^(?:articles\\/[a-z0-9]+(?:-[a-z0-9]+)*|states\\/[a-z0-9]+(?:-[a-z0-9]+)*\\/[a-z0-9]+(?:-[a-z0-9]+)*|cities\\/[a-z0-9]+(?:-[a-z0-9]+)*\\/[a-z0-9]+(?:-[a-z0-9]+)*)$",
                      "type": "string"
                    },
                    "resourceUri": {
                      "type": "string"
                    },
                    "score": {
                      "type": "number"
                    },
                    "season": {
                      "enum": ["spring", "summer", "fall", "winter", "year-round"],
                      "type": "string"
                    },
                    "summary": {
                      "type": "string"
                    },
                    "tags": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "title": {
                      "type": "string"
                    },
                    "topic": {
                      "type": "string"
                    }
                  },
                  "required": ["answer", "canonicalUrl", "path", "resourceUri", "score", "season", "summary", "tags", "title", "topic"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["catalogVersion", "results", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:56d8c4d45f1efbcaba8571b12a0264d3a2cca786dcd6e040e900f1ba804348f2"
        }
