{
  "lockfileVersion": 2,
  "subjects": {
    "com.appboxapp/appbox": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.appboxapp.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "appbox",
        "version": "1.1.0"
      },
      "capabilities": {
        "prompts": {},
        "tools": {}
      },
      "instructions": "앱박스(웹사이트를 앱으로 만들고 푸시, 인앱 메시지를 보내는 서비스) MCP 입니다. 사용자가 연결을 막 마쳤다고 하거나 앱박스로 무엇을 할 수 있는지 물으면 appbox_get_onboarding_status 를 한 번 불러 결과의 tryAsking 예시 3개를 사용자에게 그대로 보여 주세요(로그인 전이면 AI 앱이 로그인 창을 띄웁니다. 로그인 없이 소개만 하려면 appbox_get_capabilities). 결과에 blockers(지금 막힐 것)가 있으면 그 일을 시작하기 전에 먼저 알리세요. 빌드, 발송처럼 실제로 무언가를 하는 도구는 사용자가 분명히 요청했을 때만 부르세요.",
      "tools": [
        {
          "name": "appbox_check_app_setup",
          "title": "앱 연동 점검",
          "description": "푸시가 동작하는 데 필요한 설정이 갖춰졌는지 점검합니다. FCM 등록 여부, OS별 등록 기기 수, 최근 기기 활동 시각, 서버 API 키 발급 여부, 가장 최근 iOS 발송의 APNs 인증 결과(iosPush)를 알려 줍니다. 푸시가 오지 않는다는 문의를 받으면 먼저 사용하세요. iOS 만 안 오면 iosPush 를 보고, 판단할 발송이 없으면 테스트 푸시 뒤 다시 점검하세요.",
          "inputSchema": {
            "properties": {
              "app": {
                "description": "앱 코드(project_code, 예: REH-041770). appbox_list_apps 결과의 app 값. 콘솔 주소의 앱 식별값(예: reh041770)도 받는다",
                "maxLength": 10,
                "minLength": 1,
                "pattern": "^[a-zA-Z0-9-]+$",
                "type": "string"
              }
            },
            "required": ["app"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "app": {
                "type": "string"
              },
              "blockers": {
                "description": "지금 상태로 부르면 정책대로 막히는 일(한 줄씩, 예: FCM 미등록, 테스터 기기 없음, 통계 미사용). 그 일을 시작하기 전에 사용자에게 먼저 알리세요",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "checks": {
                "items": {
                  "properties": {
                    "item": {
                      "enum": ["FCM", "DEVICES", "API_KEY"],
                      "type": "string"
                    },
                    "note": {
                      "type": "string"
                    },
                    "status": {
                      "enum": ["OK", "MISSING", "WARN"],
                      "type": "string"
                    }
                  },
                  "required": ["item", "note", "status"],
                  "type": "object"
                },
                "type": "array"
              },
              "devices": {
                "properties": {
                  "android": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "ios": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "testers": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["android", "ios", "testers"],
                "type": "object"
              },
              "fcmRegistered": {
                "type": "boolean"
              },
              "iosPush": {
                "properties": {
                  "accepted": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "apnsAuthFailed": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "lastApnsAuthFailedAt": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "lastSentAt": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "note": {
                    "type": "string"
                  },
                  "otherFailed": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "status": {
                    "enum": ["OK", "MISSING", "WARN"],
                    "type": "string"
                  }
                },
                "required": ["accepted", "apnsAuthFailed", "lastApnsAuthFailedAt", "lastSentAt", "note", "otherFailed", "status"],
                "type": "object"
              },
              "lastDeviceActivityAt": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "serverApiKeyIssued": {
                "type": "boolean"
              }
            },
            "required": ["app", "checks", "devices", "fcmRegistered", "iosPush", "lastDeviceActivityAt", "serverApiKeyIssued"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "앱 연동 점검"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d3aa37788819862437d48828ea19dd00e0ed5b929977052c3ef3250dc2b992aa"
        },
        {
          "name": "appbox_find_device",
          "title": "기기 찾기",
          "description": "기기 식별자 또는 고객사 회원 ID 로 앱에 등록된 기기를 찾아 OS · 수신 허용 여부 · 푸시 토큰 등록 여부 · 테스터 여부 · 구독 그룹 · 마지막 활동 시각을 알려 줍니다. \"이 사용자에게 푸시가 안 가요\" 같은 문의에서 특정 기기의 상태를 볼 때 사용하세요. deviceId 와 memberId 중 하나만 넣습니다. 사용자가 기기 식별자를 모르면 콘솔 사용자 관리 › 토큰 메뉴 목록의 디바이스 ID 칸에서 찾으라고 안내하세요. 푸시 토큰 값·전화번호는 돌려주지 않습니다.",
          "inputSchema": {
            "properties": {
              "app": {
                "description": "앱 코드(project_code, 예: REH-041770). appbox_list_apps 결과의 app 값. 콘솔 주소의 앱 식별값(예: reh041770)도 받는다",
                "maxLength": 10,
                "minLength": 1,
                "pattern": "^[a-zA-Z0-9-]+$",
                "type": "string"
              },
              "deviceId": {
                "description": "기기 식별자(SDK 가 만든 deviceUserId). 콘솔 › 사용자 관리 › 토큰 화면의 식별값",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "memberId": {
                "description": "고객사 회원 ID — 앱이 SDK 로 보낸 memberId 세그먼트 값과 정확히 일치해야 한다",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["app"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "app": {
                "type": "string"
              },
              "devices": {
                "items": {
                  "properties": {
                    "deviceId": {
                      "type": "string"
                    },
                    "hasPushToken": {
                      "description": "푸시 토큰이 등록돼 있는지. false 면 이 기기로는 푸시가 가지 않는다",
                      "type": "boolean"
                    },
                    "isTester": {
                      "description": "테스트 발송 대상(테스터)으로 지정됐는지",
                      "type": "boolean"
                    },
                    "lastActiveAt": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "os": {
                      "enum": ["ANDROID", "IOS"],
                      "type": "string"
                    },
                    "receiveEnabled": {
                      "description": "수신 허용 여부. false 면 일반 발송 대상에서 빠진다",
                      "type": "boolean"
                    },
                    "registeredAt": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "topicNames": {
                      "description": "topics 와 같은 순서의 구독 그룹 이름(콘솔에 보이는 이름, 이름이 없거나 시스템 토픽이면 키 그대로) — 사용자에게는 이 이름으로 말하세요",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "topics": {
                      "description": "구독 중인 구독 그룹(변수)",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["deviceId", "hasPushToken", "isTester", "lastActiveAt", "os", "receiveEnabled", "registeredAt", "topicNames", "topics"],
                  "type": "object"
                },
                "type": "array"
              },
              "matchedBy": {
                "enum": ["deviceId", "memberId"],
                "type": "string"
              },
              "notFound": {
                "description": "찾은 기기가 0대일 때만 — 앱에 기기가 없는지, 이 ID 만 없는지",
                "properties": {
                  "appDeviceTotal": {
                    "description": "이 앱에 등록된 기기 수(Android + iOS)",
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "next": {
                    "description": "사용자에게 안내할 다음 할 일",
                    "type": "string"
                  }
                },
                "required": ["appDeviceTotal", "next"],
                "type": "object"
              },
              "truncated": {
                "description": "true 면 기기가 10대를 넘어 일부만 실었다",
                "type": "boolean"
              }
            },
            "required": ["app", "devices", "matchedBy", "truncated"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "기기 찾기"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:567555dcc32bf4856bda007f8a111c21cb0e3f4af4d3ba89759ad9915a7df96d"
        },
        {
          "name": "appbox_get_api_spec",
          "title": "서버 API 명세",
          "description": "고객사 서버에서 호출하는 앱박스 서버 API(개별 푸시 · 그룹 푸시 · 세그먼트 등록 · 구독 그룹 등록 · 여정 이벤트)의 명세를 돌려줍니다. 로그인 없이 쓸 수 있습니다. endpoint 없이 호출하면 인증 방법·서버 IP 등록·응답 읽는 법·호출 한도와 목록을, endpoint 를 주면 그 API 의 요청 항목·응답·오류를 돌려줍니다. 서버 연동 코드를 만들기 전에 공통 사항부터 읽으세요.",
          "inputSchema": {
            "properties": {
              "endpoint": {
                "description": "엔드포인트 id. 생략하면 공통 사항(인증·IP 등록·응답 읽는 법·호출 한도)과 엔드포인트 목록",
                "enum": ["push-individual", "push-group", "segment", "topic", "journey-event"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "baseUrl": {
                "type": "string"
              },
              "endpoint": {
                "anyOf": [
                  {
                    "enum": ["push-individual", "push-group", "segment", "topic", "journey-event"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "endpoints": {
                "items": {
                  "properties": {
                    "id": {
                      "enum": ["push-individual", "push-group", "segment", "topic", "journey-event"],
                      "type": "string"
                    },
                    "method": {
                      "type": "string"
                    },
                    "path": {
                      "type": "string"
                    },
                    "summary": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "method", "path", "summary"],
                  "type": "object"
                },
                "type": "array"
              },
              "markdown": {
                "type": "string"
              },
              "verifiedAt": {
                "description": "이 명세를 API 서버 코드와 대조한 날짜(YYYY-MM-DD)",
                "type": "string"
              }
            },
            "required": ["baseUrl", "endpoint", "endpoints", "markdown", "verifiedAt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "서버 API 명세"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c5311f575e520e6bfd6cf38c73320b2d1e31eb3b4d52452a5c3c7fc3e0dd6d85"
        },
        {
          "name": "appbox_get_build_status",
          "title": "빌드 상태",
          "description": "진행 중인 빌드와 최근 빌드 결과(최대 5건)를 보여줍니다. 실패한 빌드는 오류 코드와, 앱박스가 아는 사유면 설명과 조치(failure)를 함께 알려 줍니다. 성공한 Android 빌드는 설치 QR 을 결과에 그림으로 붙입니다. 그 그림은 대부분의 AI 앱 화면에 바로 보이니 다시 만들거나 보내지 말고 「위 QR 을 휴대폰 카메라로 스캔하세요」라고 안내하세요(사용자가 그림이 안 보인다고 하면 install.consoleUrl 의 콘솔 빌드 이력). 상태 코드의 뜻은 출력 스키마의 status 설명을 따르세요(TF_* 는 iOS TestFlight 업로드 단계). 데모 앱은 빌드 이력이 비어 있습니다.",
          "inputSchema": {
            "properties": {
              "app": {
                "description": "앱 코드(project_code, 예: REH-041770). appbox_list_apps 결과의 app 값. 콘솔 주소의 앱 식별값(예: reh041770)도 받는다",
                "maxLength": 10,
                "minLength": 1,
                "pattern": "^[a-zA-Z0-9-]+$",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "최근 빌드 건수(1~5, 기본 5)",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["app"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "active": {
                "anyOf": [
                  {
                    "properties": {
                      "historyId": {
                        "description": "빌드 이력 번호. appbox_build_android, appbox_build_ios 결과의 historyId 와 같아 요청한 빌드의 결과를 이 값으로 맞춘다. appbox_upload_testflight 의 historyId 로도 쓴다",
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      "os": {
                        "enum": ["ANDROID", "IOS"],
                        "type": "string"
                      },
                      "stage": {
                        "description": "진행 단계. BUILD=앱 빌드 · TESTFLIGHT=iOS TestFlight 업로드",
                        "type": "string"
                      },
                      "startedAt": {
                        "minLength": 1,
                        "type": "string"
                      },
                      "status": {
                        "description": "QUEUED=빌드 서버 대기 중 · BUILDING=진행 중(앱 빌드인지 TestFlight 업로드인지는 stage). stage 가 TESTFLIGHT 인 BUILDING 은 recent 의 TF_UPLOADING 과 같은 상태다",
                        "enum": ["QUEUED", "BUILDING"],
                        "type": "string"
                      }
                    },
                    "required": ["historyId", "os", "stage", "startedAt", "status"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "app": {
                "type": "string"
              },
              "recent": {
                "items": {
                  "properties": {
                    "errorCode": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "status 가 FAILED·TF_FAILED 일 때만 값이 올 수 있다. 취소됐거나 코드가 기록되지 않은 실패는 null. 그 밖의 상태는 항상 null. REQUEST_ 로 시작하는 코드는 빌드가 아니라 요청 단계 결과다 — REQUEST_UNKNOWN 은 빌드 서버 응답을 확인하지 못함(빌드가 실제로 진행됐더라도 결과는 이 이력에 반영되지 않는다. 다시 빌드하라고 하지 말고, 15분이 지나 사용자가 원할 때만), REQUEST_DUPLICATE 는 같은 앱 빌드가 빌드 서버에서 이미 진행 중이라 새로 시작하지 않음(다시 빌드하지 말 것), REQUEST_QUEUE_FULL 은 빌드 서버 대기열이 가득 차 시작하지 않음, REQUEST_SERVER_ERROR 는 빌드 서버 내부 오류로 시작하지 않음"
                    },
                    "failure": {
                      "description": "실패한 빌드(FAILED, TF_FAILED)의 사유 — 앱박스가 아는 사유일 때만 있다. 있으면 summary 와 action 을 사용자에게 그대로 안내하고, 없으면 errorCode 만으로 원인을 추측하지 말고 콘솔 빌드 이력 화면에서 확인하라고 안내하세요",
                      "properties": {
                        "action": {
                          "description": "사용자가 할 일",
                          "type": "string"
                        },
                        "doc": {
                          "description": "막히면 appbox_get_doc 으로 읽을 가이드 문서",
                          "properties": {
                            "id": {
                              "type": "string"
                            },
                            "title": {
                              "type": "string"
                            }
                          },
                          "required": ["id", "title"],
                          "type": "object"
                        },
                        "reason": {
                          "description": "실패 사유 코드(영문, 바뀌지 않음). 예: IOS_BUILD_NUMBER_USED, IOS_P8_PERMISSION, KEYSTORE_MISMATCH, BUILD_SERVER_ENV",
                          "type": "string"
                        },
                        "summary": {
                          "description": "무엇이 실패했는지 한 줄",
                          "type": "string"
                        },
                        "tip": {
                          "description": "action 에 더해 사용자에게 알릴 한 줄(일부 사유만)",
                          "type": "string"
                        },
                        "tryAsking": {
                          "description": "고친 뒤 사용자가 할 말 — '이렇게 말해 보세요' 예시 하나(서명, TestFlight 처럼 사용자가 고칠 사유만)",
                          "type": "string"
                        }
                      },
                      "required": ["action", "reason", "summary"],
                      "type": "object"
                    },
                    "finishedAt": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
