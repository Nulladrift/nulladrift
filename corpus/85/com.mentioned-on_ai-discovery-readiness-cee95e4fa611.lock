                        "businessCitationUrls": {
                          "default": [],
                          "description": "URLs that the caller identified as citations specifically for the named business.",
                          "items": {
                            "format": "uri",
                            "maxLength": 2048,
                            "type": "string"
                          },
                          "maxItems": 10,
                          "type": "array"
                        },
                        "businessMentioned": {
                          "type": "boolean"
                        },
                        "observedAt": {
                          "description": "ISO 8601 timestamp for the supplied capture.",
                          "format": "date-time",
                          "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                          "type": "string"
                        },
                        "position": {
                          "maximum": 100,
                          "minimum": 1,
                          "type": "integer"
                        },
                        "prompt": {
                          "maxLength": 1000,
                          "minLength": 3,
                          "type": "string"
                        },
                        "sentiment": {
                          "enum": ["positive", "neutral", "negative", "mixed", "not_scored"],
                          "type": "string"
                        },
                        "sourceLabel": {
                          "description": "Caller-supplied label for the model, product, or source.",
