      "serverInfo": {
        "name": "mentionedon-discovery-evidence",
        "title": "MentionedOn",
        "version": "2.0.0",
        "description": "See how AI assistants mention a local business. 3 public tools need no account. 10 tools need a connected MentionedOn account to read a business's saved AI answers, competitors and changes, and to prepare and verify website fixes.",
        "websiteUrl": "https://mentioned-on.com/developers/mcp",
        "icons": [
          {
            "src": "https://mentioned-on.com/icon",
            "mimeType": "image/png",
            "sizes": ["32x32"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Start with list_monitored_businesses and get_visibility_report for the connected account. Read saved capture dates, gaps, competitors and comparable history. Use get_share_of_voice for rank among the businesses AI names and the kinds of sites it cites, get_improvement_results to see whether a published page changed answers, AI Overview citations or AI-referred visits, list_articles for drafted buyer-question articles, and get_ai_referrals for visitors arriving from assistants. Use get_website_fixes, inspect_business_website, draft_website_fixes and verify_website_fixes to prepare and check reviewed business facts. Ask before saving a fix and preserve the exact revision; never infer owner confirmation or publish a site. The 10 business tools need a connected MentionedOn account (OAuth) and current ownership; the website-fix tools that save changes also need a paid or 7-day trial monitoring slot. No tool triggers a paid model scan. The three public tools need no account, are stateless and use only supplied observations.",
      "tools": [
        {
          "name": "analyze_discovery_readiness",
          "title": "Analyze AI Discovery Readiness",
          "description": "Use when the user has no account: scores signals you collect yourself (schema present, name/address/phone consistency, profiles, reviews) for AI discovery readiness. Returns a score, the gaps in priority order and what still needs verifying. Free; it does not fetch the website, run a scan, store anything or confirm inclusion in any AI product.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "businessName": {
                "description": "The business name used only to label this assessment.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "signals": {
                "description": "Caller-supplied signal observations. Omitted signals are treated as unknown.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "evidence": {
                      "description": "Concise caller-supplied evidence supporting the stated status.",
                      "maxLength": 500,
                      "minLength": 3,
                      "type": "string"
                    },
                    "signal": {
                      "description": "The discovery-readiness signal being assessed.",
                      "enum": ["business_identity", "service_location", "page_description", "contact_details", "structured_data", "corroborating_profiles", "crawlability", "buyer_faq", "first_party_evidence", "machine_summary"],
                      "type": "string"
                    },
                    "status": {
                      "description": "Observed status. Use unknown when the caller has no evidence.",
                      "enum": ["present", "partial", "missing", "unknown"],
                      "type": "string"
                    }
                  },
                  "required": ["signal", "status"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "websiteUrl": {
                "description": "Optional page URL used only as a label. The tool will not fetch this URL.",
                "format": "uri",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "required": ["businessName", "signals"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "assessment": {
                "enum": ["strong_observed", "developing_observed", "limited_observed", "weak_observed", "insufficient_evidence"],
                "type": "string"
              },
              "businessName": {
                "type": "string"
              },
              "evaluatedSignals": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "evidence": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "signal": {
                      "enum": ["business_identity", "service_location", "page_description", "contact_details", "structured_data", "corroborating_profiles", "crawlability", "buyer_faq", "first_party_evidence", "machine_summary"],
                      "type": "string"
                    },
                    "status": {
                      "enum": ["present", "partial", "missing", "unknown"],
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "weight": {
                      "maximum": 100,
                      "minimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["evidence", "signal", "status", "title", "weight"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 10,
                "type": "array"
              },
              "evidenceCoveragePercent": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "limitations": {
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "minimumCoveragePercent": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "priorities": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "action": {
                      "type": "string"
                    },
                    "impactWeight": {
                      "maximum": 100,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "signal": {
                      "enum": ["business_identity", "service_location", "page_description", "contact_details", "structured_data", "corroborating_profiles", "crawlability", "buyer_faq", "first_party_evidence", "machine_summary"],
                      "type": "string"
                    },
                    "status": {
                      "enum": ["partial", "missing"],
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "verification": {
                      "type": "string"
                    }
                  },
                  "required": ["action", "impactWeight", "signal", "status", "title", "verification"],
                  "type": "object"
                },
                "maxItems": 5,
                "type": "array"
              },
              "readinessScore": {
                "anyOf": [
                  {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Weighted score over observed signals only. Null when no signal was observed or evidence coverage is below minimumCoveragePercent."
              },
              "scope": {
                "const": "caller_supplied_signals_only",
                "type": "string"
              },
              "scoreBasis": {
                "const": "observed_signals_only",
                "type": "string"
              },
              "scoreStatus": {
                "enum": ["reported", "withheld_insufficient_coverage", "no_observed_signals"],
                "type": "string"
              },
              "verificationNeeded": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "signal": {
                      "enum": ["business_identity", "service_location", "page_description", "contact_details", "structured_data", "corroborating_profiles", "crawlability", "buyer_faq", "first_party_evidence", "machine_summary"],
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "verification": {
                      "type": "string"
                    }
                  },
                  "required": ["signal", "title", "verification"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              },
              "websiteUrl": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["assessment", "businessName", "evaluatedSignals", "evidenceCoveragePercent", "limitations", "minimumCoveragePercent", "priorities", "readinessScore", "scope", "scoreBasis", "scoreStatus", "verificationNeeded", "websiteUrl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Analyze AI Discovery Readiness"
          },
          "behavior": {
            "destructive": false,
