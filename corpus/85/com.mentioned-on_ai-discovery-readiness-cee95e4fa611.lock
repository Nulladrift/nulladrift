        {
          "name": "draft_website_fixes",
          "title": "Prepare confirmed website fixes",
          "description": "Needs a connected MentionedOn account with a paid or 7-day trial monitoring slot (Local is $99/month). Use after the user confirms the facts from inspect_business_website: generates and saves business schema, website copy and a business-profile description from those facts only. Pass the current revision and confirmed: true; never invent missing facts. Saves a new revision; no AI model cost, nothing is published or sent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "businessId": {
                "description": "Business id returned by list_monitored_businesses.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "businessType": {
                "description": "schema.org business type for the generated schema.",
                "enum": ["LocalBusiness", "ProfessionalService", "HomeAndConstructionBusiness", "Plumber", "Electrician", "HVACBusiness", "RoofingContractor", "Dentist", "MedicalBusiness", "LegalService", "RealEstateAgent", "Restaurant", "LodgingBusiness", "Store", "AutoRepair", "BeautySalon"],
                "type": "string"
              },
              "confirmed": {
                "const": true,
                "description": "true once the user has reviewed and confirmed these facts.",
                "type": "boolean"
              },
              "facts": {
                "additionalProperties": false,
                "description": "Business facts the user confirmed, from the inspection.",
                "properties": {
                  "addressCountry": {
                    "maxLength": 300,
                    "type": "string"
                  },
                  "addressLocality": {
                    "maxLength": 300,
                    "type": "string"
                  },
                  "addressRegion": {
                    "maxLength": 300,
                    "type": "string"
                  },
                  "description": {
                    "maxLength": 700,
                    "type": "string"
                  },
                  "email": {
                    "maxLength": 300,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 300,
                    "type": "string"
                  },
                  "openingHours": {
                    "maxLength": 300,
                    "type": "string"
                  },
                  "postalCode": {
                    "maxLength": 300,
                    "type": "string"
                  },
                  "services": {
                    "maxLength": 1000,
                    "type": "string"
                  },
                  "streetAddress": {
                    "maxLength": 300,
                    "type": "string"
                  },
                  "telephone": {
                    "maxLength": 300,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "revision": {
                "description": "Integer from get_website_fixes (the current saved revision); use 0 when no record exists.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["businessId", "businessType", "confirmed", "facts", "revision"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "businessId": {
                "type": "string"
              },
              "limitations": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "nextStep": {
                "type": "string"
              },
              "record": {
                "anyOf": [
                  {
                    "additionalProperties": {},
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["businessId", "limitations", "nextStep", "record"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
