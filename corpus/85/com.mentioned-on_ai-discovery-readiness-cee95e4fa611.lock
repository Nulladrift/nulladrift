        {
          "name": "build_visibility_action_plan",
          "title": "Build an AI Visibility Action Plan",
          "description": "Use after analyze_discovery_readiness, or with findings you already have: turns them into a short ordered list of fixes for one goal and effort budget, with the reason and a check for each. Free; it does not edit a website, contact anyone, store data or promise rankings or mentions.",
