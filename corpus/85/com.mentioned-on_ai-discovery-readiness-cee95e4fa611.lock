          "title": "Summarize AI Scan Evidence",
          "description": "Use when you captured AI answers yourself: calculates how often the business is mentioned and how often its own site is cited, overall and per assistant, with the statements that support each number. Free; it does not call AI providers, fetch URLs or store anything, and it says nothing beyond the answers supplied.",
