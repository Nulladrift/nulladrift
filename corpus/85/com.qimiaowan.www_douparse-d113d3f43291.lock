      "instructions": "抖解 DouParse 视频解析工具。支持抖音、快手、小红书、哔哩哔哩、微信视频号、微博、知乎等 10+ 平台：把用户给的分享链接/分享文本交给 parse_video，即可拿到无水印视频直链、图集图片直链、抖音原声 MP3 直链与文案。需要 API Key（在 https://www.qimiaowan.com/account 注册领取），配置在 MCP 客户端的 Authorization: Bearer 头里。仅真实解析成功扣 1 次，缓存命中/失败不扣。",
      "tools": [
        {
          "name": "get_balance",
          "description": "Return the API key's remaining quota, per-minute limit, today's usage and status.\n\n    查询当前 API Key 的剩余调用次数、每分钟限频、今日已用次数与状态。\n    ",
          "inputSchema": {
            "properties": {},
            "title": "get_balanceArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_balanceDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7958c0f5fb4f46bd678e2042b29ce6404c8a86e5bcc03841cd41b5d750392d8c"
        },
        {
          "name": "parse_video",
          "description": "Parse a short-video or image-post share link and return watermark-free direct URLs.\n\n    解析短视频/图文分享链接，返回无水印直链。\n\n    支持平台：抖音、快手、小红书、哔哩哔哩、微信视频号、微博、知乎等。\n    参数 url 可以是分享文本（含口令的整段文字）、短链（如 https://v.douyin.com/xxx/）\n    或完整链接。返回字段见下：视频类看 video_url / qualities，图集类看 images，\n    背景音乐看 music_url：抖音原声 MP3 直链，服务端在解析时已用 music_mid 换好并\n    回填，可直接下载；music_url 为空说明该平台没有独立音频文件或版权受限。\n    视频 / 图片直链有时效，过期重解析；音频是静态 MP3，通常长期有效。\n\n    Args:\n        url: 分享文本、短链或完整视频/图文链接。\n    ",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "分享文本、短链或完整视频/图文链接。Share text, a short link, or a full post URL.",
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "parse_videoArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "parse_videoDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e2b90f3a8eabde68a62628f5ca066fd693f77de6ab87386f2d22ad3ec3beae10"
        },
        {
          "name": "redeem_code",
          "description": "Redeem a one-time code to add API call quota to the current account.\n\n    用充值码给账号加调用次数（一码一用）。\n\n    Args:\n        code: 后台/发卡平台发放的充值码。\n    ",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "后台/发卡平台发放的充值码，一码一用。A one-time redeem code issued by the site.",
                "title": "Code",
                "type": "string"
              }
            },
            "required": ["code"],
            "title": "redeem_codeArguments",
            "type": "object"
          },
          "outputSchema": {
