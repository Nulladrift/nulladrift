        {
          "name": "rebalance_plan",
          "description": "Portfolio rebalance, priced against the pools that would execute it, the paid half (0.10 USD1, or half that in $BOBAI, or nothing for a wallet holding 1,000,000 $BOBAI (holder pass over x402: a signature, no transaction — terms in the reply)): The swaps that move a BSC portfolio to target weights, each one costed against its own pool: swap fee, price impact at the actual size, and the transfer tax measured from executed trades. Returns the cost as a share of the money moved, and names the holding the bill is concentrated in. It does not claim to know what a correction is worth — that is a judgement about risk, not a quantity in a pool. For liquidity it rebalances ranges: a range check of every PancakeSwap V3 position a wallet holds, any pair — in range or not, the room to each edge, and the same width re-centred on today's price, aligned to the pool's tick spacing. Calling this tool returns the terms; the answer is sold over x402 at https://agent.brainonbnb.com/answer?service=rebalance_plan (or hired through the ERC-8183 escrow for 0.10 $U).",
