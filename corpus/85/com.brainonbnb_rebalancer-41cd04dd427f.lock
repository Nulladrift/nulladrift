      "instructions": "Portfolio rebalance, priced against the pools that would execute it, on BNB Chain. Start free: call pancakeswap_best_route with {\"address\":\"0x0e09fabb73bd3ade0a17ecc321fd13a19e81ce82\",\"usd\":250} (a real public example, read from the chain now; put your own in its place). rebalance_plan returns the terms of the paid answer, 0.10 USD1 over x402. Read-only: nothing here signs, holds a key or moves funds. The free toolbox for any BSC token, 30 tools: https://brainonbnb.com/mcp",
