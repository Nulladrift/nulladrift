      "serverInfo": {
        "name": "fireshift",
        "title": "Fireshift Leak Score",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Fireshift checks what a website sends to Google Ads and GA4 from the outside. Use scan_site with a domain to get a 0-100 Leak Score and the findings. Primary vs secondary status of Ads conversions is not visible from outside; say so when you report findings.",
      "tools": [
        {
          "name": "get_stats",
          "title": "Fireshift scan counts",
          "description": "Returns aggregate counts from scans run on fireshift.ai and through this server: total scans, distinct sites, scans in the last 7 days, the most common findings in the last 7 days with their share of scored sites, and the grade mix. Never returns domain names. Updated every 5 minutes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f936baadb62ca89a7638190503c01400eedde9247ed2395439892530ee5a34fe"
        },
        {
          "name": "scan_site",
          "title": "Scan a website's Google Ads and GA4 conversions",
          "description": "Reads the public homepage of a domain, finds its Google Tag Manager and Google tag container IDs, loads those containers from googletagmanager.com and scores the conversion setup from 0 to 100 (grade A to F). Findings include Google Ads conversions that fire on every page load, on plain page views, on login, on button clicks or when a trial ends, GA4 key events on page_view, duplicate conversions, conversions without a value, and more than one GA4 property. Same checks and score as https://fireshift.ai/scan/. Reads only what the site serves publicly; no login, no forms. It cannot see whether an Ads conversion is primary or secondary. Tags loaded server-side or only after cookie consent are not visible, so a site with no public container gets no score. Takes 2 to 20 seconds.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Domain to scan, e.g. example.com (no path, no IP).",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
