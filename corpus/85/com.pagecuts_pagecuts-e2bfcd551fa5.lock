{
  "lockfileVersion": 2,
  "subjects": {
    "com.pagecuts/pagecuts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pagecuts.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "pagecuts",
        "title": "Pagecuts",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Pagecuts makes a 15-second video ad kit from a business's web page. make_ad needs the user's email address: the first call emails them a code, and the second, with that code, starts the build, which takes about five minutes, and returns a page the user can watch it on. They are emailed when it is ready. get_ad reports progress and, once ready, the preview video, two still images and sample ad copy. The preview is free and carries a mark; the clean kit costs US$19 once, which the user pays at checkout. Only make ads for pages the user has the right to advertise.",
      "tools": [
        {
          "name": "get_ad",
          "title": "Check on an ad",
          "description": "The state of an ad made with make_ad: its status (queued, running, preview_ready, done or failed) and current step, then the marked preview video, two still images, sample ad copy and the checkout link; once the user has paid, the full kit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The id make_ad returned.",
                "type": "string"
              },
              "key": {
                "description": "The key make_ad returned. With it, and once the user has paid, the answer includes the kit's files.",
                "type": "string"
              },
              "wait": {
                "description": "Seconds to wait for the preview before answering. Default 0.",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:161bb5b746aae6599ab128e92146e4ba7f20d88c2732f9c85457c1be2556f1f6"
        },
        {
          "name": "make_ad",
          "title": "Make an ad from a web page",
          "description": "Build a 15-second video ad kit from a business's web page: its homepage, a product page, a restaurant's site. It takes two calls, because the user's email address has to be proved first. Call it with url and email: a code is emailed to the user. Ask them for the code, then call it again with url, email and code: that returns an id and a page the user can open to watch the build. The ad takes about five minutes, so follow it with get_ad; the user is also emailed when it is ready.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "The code Pagecuts emailed to that address. Leave it out on the first call.",
                "type": "string"
              },
              "email": {
                "description": "The user's own email address. Ask for it; never guess it.",
                "type": "string"
              },
              "instructions": {
                "description": "Optional. What this ad should push, in the user's words: an offer, a product, an event, who it is for. Up to 2,000 characters.",
                "type": "string"
              },
              "url": {
                "description": "The page the ad should send people to.",
                "type": "string"
              }
            },
            "required": ["email", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9544ce104b4020765f8b5c2d2dc249f05ebd7a10fba0f418e1ecec9a1590798e"
        }
      ],
      "digest": "sha256:45f315efaec440a6fff26ebcf6763a36c4cac886849e1270deb1ae93c3aee4bb"
    }
  }
