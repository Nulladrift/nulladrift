                "description": "Required certifications, comma-separated. Valid: gluten_free, non_gmo, vegan_action, usda_organic, nsf_sport, usp_verified, informed_sport, informed_choice, tested_by_suppco.",
                "type": "string"
              },
              "form": {
                "description": "Comma-separated product forms. Valid: capsule, tablet, softgel, gummy, powder, liquid, other.",
                "type": "string"
              },
              "max_price": {
                "description": "Maximum price in dollars.",
                "type": "number"
              },
              "priority": {
                "description": "How to rank alternatives. Valid: best_value, most_trusted, most_popular, most_expensive. Defaults to most_trusted.",
                "enum": ["best_value", "most_trusted", "most_popular", "most_expensive"],
                "type": "string"
              },
              "product_id_or_slug": {
                "description": "The product to compare against the Buying Club — usually one the user already takes (e.g. from suppco_get_my_stack). A UUID, slug, or product name.",
