        {
          "name": "suppco_update_cart_item",
          "title": "Update cart item",
          "description": "Set the quantity of a product that is already in the signed-in user's cart. quantity is the new total, not an amount to add, so repeating the call is safe; 0 removes the item. If the product is in the cart as both a one-time purchase and a subscription, set subscription to choose which one to change. Returns the updated cart.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "product_id_or_slug": {
                "description": "SuppCo product ID (UUID) or slug of a product in the cart, as shown by suppco_get_my_cart.",
                "type": "string"
              },
              "quantity": {
                "description": "New total number of units for this item. 0 removes it.",
                "minimum": 0,
                "type": "integer"
              },
              "subscription": {
                "description": "true to change the subscription item, false for the one-time item. Only needed when the product is in the cart as both.",
                "type": "boolean"
              }
            },
            "required": ["product_id_or_slug", "quantity"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cart": {
                "properties": {
                  "cart_id": {
                    "type": ["string", "null"]
                  },
                  "cashback": {
                    "type": ["object", "null"]
                  },
                  "checkout_url": {
                    "description": "Plain Shopify cart link; use suppco_get_checkout_url for the signed-in checkout link.",
                    "type": ["string", "null"]
                  },
                  "cost": {
                    "properties": {
                      "currency": {
                        "type": ["string", "null"]
                      },
                      "subtotal": {
                        "type": ["number", "string", "null"]
                      },
                      "total": {
                        "type": ["string", "number", "null"]
                      }
                    },
                    "type": "object"
                  },
                  "has_stale_items": {
                    "type": "boolean"
                  },
                  "items": {
                    "items": {
                      "properties": {
                        "id": {
                          "description": "Cart line ID",
                          "type": "string"
                        },
                        "merchandise": {
                          "properties": {
                            "id": {
                              "type": "string"
                            },
                            "price": {
                              "type": "object"
                            },
                            "slug": {
                              "description": "SuppCo product slug for cart tools",
                              "type": ["string", "null"]
                            },
                            "title": {
                              "type": ["string", "null"]
                            }
                          },
                          "type": "object"
                        },
                        "quantity": {
                          "type": "integer"
                        },
                        "selling_plan": {
                          "description": "Present when the item is a subscription",
                          "type": ["object", "null"]
                        }
                      },
                      "required": ["id", "merchandise", "quantity"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "items_count": {
                    "type": "integer"
                  },
                  "stale_items": {
                    "items": {
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "wallet": {
                    "type": ["object", "null"]
                  }
                },
                "required": ["cost", "items", "items_count"],
                "type": "object"
              }
            },
            "required": ["cart"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Update cart item"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Cart updated",
            "openai/toolInvocation/invoking": "Updating your cart...",
            "securitySchemes": [
              {
                "scopes": ["mcp"],
                "type": "oauth2"
              }
            ]
          },
