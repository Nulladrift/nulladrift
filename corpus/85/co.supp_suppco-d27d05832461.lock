        {
          "name": "suppco_find_buying_club_products",
          "title": "Find Buying Club products",
          "description": "Open-ended search/browse of the SuppCo buying club catalog: free-text lookups (\"Thorne Magnesium\") or filtered browsing by category, trust, price, form, certifications, and brand. Every result is a buying-club product with member pricing and earnings credit (cashback). Use this when the user is exploring a category with no specific current product in play. For finding an alternative to a product the user already takes, use suppco_compare_to_buying_club instead (it returns their current product as the anchor).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "brand": {
                "description": "Restrict to a specific brand.",
                "type": "string"
              },
              "certifications": {
                "description": "Required certifications, comma-separated. Valid: gluten_free, non_gmo, vegan_action, usda_organic, nsf_sport, usp_verified, informed_sport, informed_choice, tested_by_suppco.",
                "type": "string"
              },
              "form": {
                "description": "Comma-separated product forms. Valid: capsule, tablet, softgel, gummy, powder, liquid, other.",
                "type": "string"
              },
              "limit": {
                "description": "Max products to return (default: 5, max: 24).",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum price in dollars (e.g., 50.00).",
                "type": "number"
              },
              "offset": {
                "description": "Number of products to skip for pagination (default: 0).",
                "minimum": 0,
                "type": "integer"
              },
              "priority": {
                "description": "How to rank results. Valid: best_value, most_trusted, most_popular, most_expensive. Defaults to most_trusted.",
                "enum": ["best_value", "most_trusted", "most_popular", "most_expensive"],
                "type": "string"
              },
              "product_category_name": {
                "description": "The supplement category to browse (e.g., 'Vitamin D', 'Magnesium', 'Creatine'). Required for any filtered search. When the user names a supplement like 'magnesium', that IS the category.",
                "type": "string"
              },
              "query": {
                "description": "Free-text search for a specific product by name (e.g., \"Thorne Creatine\"). Use alone, without filters. For filtered searches use product_category_name instead.",
                "type": "string"
              },
              "servings": {
                "description": "Comma-separated serving counts (e.g., '30,60,90').",
