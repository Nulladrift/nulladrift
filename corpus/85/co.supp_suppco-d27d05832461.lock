        },
        {
          "name": "suppco_update_my_profile",
          "title": "Update my profile",
          "description": "Use this when the user gives profile details they want saved: age, sex, health goals, dietary preferences, experience level, buying preference, preferred form or biggest challenge. Only the fields you pass are changed, and each one replaces the stored value. Saved preferences change the defaults other SuppCo tools use, such as product search ranking.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "age": {
                "description": "User's age in years (integer between 13 and 150)",
                "maximum": 150,
                "minimum": 13,
                "type": "integer"
              },
              "biggest_challenge": {
                "description": "User's biggest challenge with supplements (free text)",
                "type": "string"
              },
              "buying_preference": {
                "description": "User's supplement buying preference (valid options: Highest quality available, Best value, Most affordable)",
                "enum": ["Highest quality available", "Best value", "Most affordable"],
                "type": "string"
              },
              "dietary_preferences": {
                "description": "User's dietary preferences as an array",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "expertise": {
                "description": "User's experience level with supplements (valid options: Beginner, Routine, SuperUser)",
                "enum": ["Beginner", "Routine", "SuperUser"],
                "type": "string"
              },
              "health_goals": {
                "description": "User's health goals as an array, CSV string, or single string (valid options: Bone & Joint, Cardiovascular, Cognition, Detox, Energy, Essential Health, Fertility, Fitness, Gut Health, Hair & Skin, Immune Support, Inflammation, Longevity, Men's Hormones, Organ Function, Sexual Health, Sleep, Stress & Mood, Weight Management, Women's Hormones)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "preferred_form": {
                "description": "User's preferred supplement form (valid options: Single Ingredient, Blends, Both)",
                "enum": ["Single Ingredient", "Blends", "Both"],
                "type": "string"
              },
              "sex": {
                "description": "User's biological sex (valid options: male, female, intersex, not_specified)",
                "enum": ["male", "female", "intersex", "not_specified"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Update my profile"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:23e29752d7f945a5d7a0ec9f4a30a7db1cfb59acb5e3db4f5ee0452e53624ab0"
        },
        {
          "name": "suppco_update_product_schedule",
          "title": "Update product schedule",
          "description": "Use this when the user wants to change when or how they take a product that is already in their stack. Replaces that product's schedule: time-of-day amounts, daily, specific-days or every-other-day timing, as-needed, with food, and timing notes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "as_needed": {
                "description": "Whether the product is taken as needed (true/false). Omit to keep the current value.",
                "type": "string"
              },
              "attribute_change_requested": {
                "description": "Set true ONLY when the user asked to change with_food or as_needed. Without it, a with_food/as_needed value that differs from the current one is rejected.",
                "type": "string"
              },
              "every_other_day_start": {
                "description": "When to start every_other_day schedule: \"today\" or \"tomorrow\"",
                "type": "string"
              },
              "new_daily_amount": {
                "description": "ONLY when the user explicitly asked to take a different amount per day: the new daily total they asked for, in the same units as the schedule. Must equal the schedule total. Omit for timing changes — a schedule whose total differs from the current daily amount is rejected without it.",
                "type": "string"
              },
              "product_id": {
                "description": "Product slug or UUID",
                "type": "string"
              },
              "schedule": {
                "description": "JSON array of time-slot assignments, e.g. [{\"activity\":\"morning\",\"units\":2},{\"activity\":\"bedtime\",\"units\":1}]. \"units\" is in the product's serving unit as user_schedule shows it (capsules, tablets, scoops, mL, ...) — NOT servings. For a tincture whose serving_size is 0.7 mL, one serving is 0.7, not 1. Valid activities: morning, midday, evening, bedtime, workout, unscheduled.",
                "type": "string"
              },
              "schedule_days": {
                "description": "Array of day names (e.g. [\"monday\",\"wednesday\",\"friday\"]) for specific_days schedule_type",
                "type": "string"
              },
              "schedule_notes": {
                "description": "Brief timing instructions that the schedule cannot capture (e.g., \"take 2 hours apart from calcium\", \"take on empty stomach 30 min before bed\"). Set to empty string to clear.",
                "type": "string"
              },
              "schedule_type": {
                "description": "Schedule type: daily, specific_days, or every_other_day",
                "type": "string"
              },
              "with_food": {
                "description": "Whether the product should be taken with food (true/false). Omit to keep the current value.",
                "type": "string"
              }
            },
            "required": ["product_id", "schedule"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Update product schedule"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:ae6f736d55b59d90a23cd2bb43b0971bcfd74b70bf4a75eadf0128eb56d71f03"
        }
