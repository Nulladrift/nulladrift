        {
          "name": "suppco_find_products",
          "title": "Find products",
          "description": "Find products based on user query - handles search, browsing, and recommendations. Use this whenever the user wants to discover or find products.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "brand": {
                "description": "The brand a user prefers",
                "type": "string"
              },
              "certifications": {
                "description": "Required certifications, comma-separated. Valid: gluten_free, non_gmo, vegan_action, usda_organic, nsf_sport, usp_verified, informed_sport, informed_choice, tested_by_suppco. Omit (or leave blank) to apply the user's profile dietary preferences (vegan, gluten-free) automatically; pass an explicit list to override.",
                "type": "string"
              },
              "exclude_ingredients": {
                "description": "Comma-separated list of ingredients the product must NOT contain (e.g., 'stevia,sucralose'). Matches against both active ingredients (supplements) and inactive ingredients (excipients).",
                "type": "string"
              },
              "form": {
                "description": "Comma-separated list of product forms. Valid forms are: capsule, tablet, softgel, gummy, powder, liquid, other (e.g., 'capsule,tablet')",
                "type": "string"
              },
              "include_ingredients": {
                "description": "Comma-separated list of ADDITIONAL ingredients the product must also contain beyond its category (e.g., for 'collagen with hyaluronic acid', set product_category_name='Collagen' and include_ingredients='hyaluronic acid'). Do NOT put the primary supplement here — use product_category_name for that.",
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of products to return (default: 5, max: 50)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum price in dollars (e.g., 50.00)",
                "type": "number"
              },
              "offset": {
                "description": "Number of products to skip for pagination (default: 0)",
                "minimum": 0,
                "type": "integer"
              },
              "priority": {
                "description": "How to rank results. Valid: best_value, most_trusted, most_popular, most_expensive. Omit (or leave blank) to apply the user's profile buying preference automatically; pass a value to override.",
                "enum": ["best_value", "most_trusted", "most_popular", "most_expensive"],
                "type": "string"
              },
              "product_category_name": {
                "description": "REQUIRED for all non-query searches. The supplement category (e.g., 'Vitamin D', 'Magnesium', 'Ashwagandha', 'Collagen'). ALWAYS provide this when using any filter params (priority, brand, certifications, form, max_price, servings, include_ingredients, exclude_ingredients). When the user asks for a supplement by name like 'ashwagandha' or 'magnesium', that IS the category.",
                "type": "string"
              },
              "query": {
                "description": "Free text search for a specific product by name (e.g., \"Thorne Creatine\", \"AG1 Greens\"). Only use this when searching for a specific brand + product name with no filters. Do NOT use query together with other params — use product_category_name instead when filters like priority, brand, certifications, form, max_price, or servings are needed.",
                "type": "string"
              },
              "servings": {
                "description": "Comma-separated list of serving counts (e.g., '30,60,90')",
                "type": "string"
              },
              "tested": {
                "description": "When true, only return products that have been TESTED by SuppCo (identity, potency, and/or heavy metals testing performed by SuppCo's lab)",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
