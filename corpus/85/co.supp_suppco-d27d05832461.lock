        {
          "name": "suppco_compare_product_to_alternatives",
          "title": "Compare product to alternatives",
          "description": "Compare a product against alternatives in its category. Returns a detailed view of the anchor product (trust score, ingredients, excipients) alongside filtered alternatives. Use when user asks to compare, find alternatives, or asks \"is there something better?\"",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "certifications": {
                "description": "Certifications filter, comma-separated. Valid: gluten_free, non_gmo, vegan_action, usda_organic, nsf_sport, usp_verified, informed_sport, informed_choice, tested_by_suppco. Omit (or leave blank) to apply the user's profile dietary preferences (vegan, gluten-free) automatically; pass an explicit list to override.",
                "type": "string"
              },
              "form": {
                "description": "Product forms. Valid: capsule, tablet, softgel, gummy, powder, liquid, other",
                "type": "string"
              },
              "max_price": {
                "description": "Maximum price in dollars",
                "type": "number"
              },
              "priority": {
                "description": "How to rank alternatives. Valid: best_value, most_trusted, most_popular, most_expensive. Omit (or leave blank) to apply the user's profile buying preference automatically; pass a value to override.",
                "enum": ["best_value", "most_trusted", "most_popular", "most_expensive"],
                "type": "string"
              },
              "product_id_or_slug": {
                "description": "Product ID (UUID), slug, or product name of the product to compare. Prefer slugs or UUIDs when available — they give exact matches.",
                "type": "string"
              },
              "servings": {
                "description": "Comma-separated serving counts (e.g., '60,90')",
                "type": "string"
              }
            },
            "required": ["product_id_or_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Compare product to alternatives"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
