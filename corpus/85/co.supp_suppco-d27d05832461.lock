      "instructions": "SuppCo supplement research and stack management tools. Search products, view research-backed effects, manage supplement stacks, and access personalized recommendations. All tools prefixed with suppco_.",
      "tools": [
        {
          "name": "suppco_add_to_cart",
          "title": "Add to cart",
          "description": "Add a Buying Club product to the signed-in user's cart (the same cart as the SuppCo app). Use a product ID or slug from suppco_find_buying_club_products or suppco_compare_to_buying_club; only Buying Club products can be added. Set subscription to true for a recurring subscription at the product's recommended shipping interval. Returns the updated cart. This adds to any quantity already in the cart, so calling it again adds more units; to set an exact quantity, use suppco_update_cart_item.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "product_id_or_slug": {
                "description": "SuppCo product ID (UUID) or slug of a Buying Club product.",
                "type": "string"
              },
              "quantity": {
                "description": "Number of units to add (default 1).",
                "minimum": 1,
                "type": "integer"
              },
              "subscription": {
                "description": "true to subscribe (recurring delivery), false for a one-time purchase (default false).",
                "type": "boolean"
              }
            },
            "required": ["product_id_or_slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cart": {
                "properties": {
                  "cart_id": {
                    "type": ["string", "null"]
                  },
                  "cashback": {
                    "type": ["object", "null"]
                  },
                  "checkout_url": {
                    "description": "Plain Shopify cart link; use suppco_get_checkout_url for the signed-in checkout link.",
                    "type": ["string", "null"]
                  },
                  "cost": {
                    "properties": {
                      "currency": {
                        "type": ["string", "null"]
                      },
                      "subtotal": {
                        "type": ["number", "string", "null"]
                      },
                      "total": {
                        "type": ["string", "number", "null"]
                      }
                    },
                    "type": "object"
                  },
                  "has_stale_items": {
                    "type": "boolean"
                  },
                  "items": {
                    "items": {
                      "properties": {
                        "id": {
                          "description": "Cart line ID",
                          "type": "string"
                        },
                        "merchandise": {
                          "properties": {
                            "id": {
                              "type": "string"
                            },
                            "price": {
                              "type": "object"
                            },
                            "slug": {
                              "description": "SuppCo product slug for cart tools",
                              "type": ["string", "null"]
                            },
                            "title": {
                              "type": ["string", "null"]
                            }
                          },
                          "type": "object"
                        },
                        "quantity": {
                          "type": "integer"
                        },
                        "selling_plan": {
                          "description": "Present when the item is a subscription",
                          "type": ["object", "null"]
                        }
                      },
                      "required": ["id", "merchandise", "quantity"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "items_count": {
                    "type": "integer"
                  },
                  "stale_items": {
                    "items": {
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "wallet": {
                    "type": ["object", "null"]
                  }
                },
                "required": ["cost", "items", "items_count"],
                "type": "object"
              }
            },
            "required": ["cart"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
