    "ai.pickbench/pickbench": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pickbench.ai/mcp/v3"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "pickbench",
        "title": "Pickbench",
        "version": "3.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only Pickbench data from verified, production-signed snapshots: brand boards (AI model choice share by category, with confidence intervals and tiers), battles between two options, and Pick Drift from the Pickbench benchmark. Every result names the API models, the panel and the conditions, and carries the snapshot hash and URL for verification and a cite_as line. search_categories finds a category code; ai_pick_share and compare_brands read its board; list_battles and battle_result read battles; pick_drift reads the benchmark; get_methodology explains the method. Terms of use: https://pickbench.ai/en/legal/terms/",
      "tools": [
        {
          "name": "ai_pick_share",
          "title": "AI model choice share in a category",
          "description": "Returns the published brand board of a category: for each brand, its AI model choice share (how often the named API models chose it in buyer scenarios) with its confidence interval and tier, the headline claims, the panel of API models and the conditions (closed-book, via OpenRouter). Optionally one brand only. Shares are measurements under the stated conditions, not ranks; compare intervals, not point values. Includes the signed snapshot hash and URL for verification. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "A brand name as shown on the board, e.g. Michelin.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "category_id": {
                "description": "A category code from search_categories, e.g. auto.tires.",
                "maxLength": 120,
                "pattern": "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)*$",
                "type": "string"
              },
              "locale": {
                "description": "Language of the human-readable text: en, ru or es (default en). Codes, names and ids stay untranslated.",
                "enum": ["en", "ru", "es"],
                "type": "string"
              }
            },
            "required": ["category_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "category_id": {
                "type": "string"
              },
              "ci_level": {
                "type": "number"
              },
              "claims": {
                "description": "Headline claims of the claims engine: a stable code, its parameters and the only number renderings it allows.",
                "items": {
                  "properties": {
                    "claim_id": {
                      "type": "string"
                    },
                    "code": {
                      "type": "string"
                    },
                    "numbers": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "params": {
                      "type": "object"
                    }
                  },
                  "required": ["claim_id", "code", "numbers", "params"],
                  "type": "object"
                },
                "type": "array"
              },
              "models": {
                "description": "The API models of the panel (display id without the version date; the dated id is in model_id and the snapshot).",
                "items": {
                  "properties": {
                    "model": {
                      "type": "string"
                    },
                    "model_id": {
                      "type": "string"
                    }
                  },
                  "required": ["model", "model_id"],
                  "type": "object"
                },
                "type": "array"
              },
              "rows": {
                "items": {
                  "properties": {
                    "brand": {
                      "type": "string"
                    },
                    "ci_high": {
                      "type": "number"
                    },
                    "ci_low": {
                      "type": "number"
                    },
                    "display": {
                      "properties": {
                        "ci_high": {
                          "type": "string"
                        },
                        "ci_low": {
                          "type": "string"
                        },
                        "share": {
                          "type": "string"
                        }
                      },
                      "required": ["ci_high", "ci_low", "share"],
                      "type": "object"
                    },
                    "scenarios_n": {
                      "type": "integer"
                    },
                    "share": {
                      "type": "number"
                    },
                    "tier": {
                      "type": "integer"
                    }
                  },
                  "required": ["brand", "ci_high", "ci_low", "display", "scenarios_n", "share", "tier"],
                  "type": "object"
                },
                "type": "array"
              },
              "source": {
                "properties": {
                  "cite_as": {
                    "type": "string"
                  },
                  "envelope_url": {
                    "type": "string"
                  },
                  "how_to_verify_url": {
                    "type": "string"
                  },
                  "id": {
                    "type": "string"
                  },
                  "key_class": {
                    "enum": ["production"],
                    "type": "string"
                  },
                  "keys_url": {
                    "type": "string"
