                    "type": "string"
                  },
                  "signed": {
                    "type": "boolean"
                  }
                },
                "required": ["cite_as", "id", "kind", "page_url", "payload_sha256", "prereg_hash", "ruleset_sha256", "signed"],
                "type": "object"
              },
              "withheld": {
