      "serverInfo": {
        "name": "world-check",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Give verified, citable numbers about the world right now with world_now: always quote the tick number, time and fingerprint with the numbers. Use fingerprint_text to check whether texts are identical.",
      "tools": [
        {
          "name": "fingerprint_text",
          "title": "Fingerprint a piece of text",
          "description": "Use when the user wants to know whether two texts are exactly identical, or wants a fingerprint to compare a document against later. Returns the SHA-256 fingerprint of the exact text, and whether it matches an expected fingerprint if one is given. It does not store the text or prove when it was written.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "expected": {
                "description": "Optional fingerprint (64 hex characters) to compare against",
                "type": "string"
              },
              "text": {
                "description": "The exact text to fingerprint",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:346aafc59580a1f8f81a26dfaf46a48c4e7a8b2dd6290e2a953e3fa0bfbee381"
        },
        {
          "name": "request_service",
          "title": "Ask us to build something",
          "description": "Use when the person wants something none of these tools can do and says yes to passing the request on. Records only the request text they agree to send (no name or contact). Ask before calling it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "description": "What they want, in a sentence, as they agreed to send it",
                "type": "string"
              }
            },
            "required": ["request"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:a38ff77e8ec3cc7544d83683bb90d1918c09a320529b8c63330eb558dcd6db15"
        },
        {
          "name": "world_now",
          "title": "Verified snapshot of the world right now",
          "description": "Use when the user asks what is happening in the world right now and wants numbers they can trust and cite: Bitcoin and crypto market, currency exchange rates, earthquakes in the past hour, space weather, where the International Space Station is, and more. Every snapshot carries its public tick number, time and SHA-256 fingerprint so anyone can check it later.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
