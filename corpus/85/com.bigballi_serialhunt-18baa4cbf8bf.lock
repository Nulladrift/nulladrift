      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "serialhunt",
        "title": "SerialHunt",
        "version": "1.0.0",
        "websiteUrl": "https://bigballi.com/SerialHunt/connect"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "SerialHunt: US paper money serial numbers, checked against 18,355 printed star note stretches from government production figures (Series 1963 on). Use check_serial for one note (bank, series, patterns in the digits with exact odds, and a star note's print run and rarity), find_star_runs for the smallest star runs on record, list_serial_patterns for the 17 fancy serial patterns and their odds, and get_coverage for which series the figures cover. A star note's scarcity is the size of its run: 640,000 notes or fewer is the line collectors use for a premium. The figures say what was printed; they are not prices, and nothing here judges whether a note is genuine.",
      "tools": [
        {
          "name": "check_serial",
          "title": "Check a US bill's serial number",
          "description": "Whether one US paper money note is worth keeping, from its serial number: the Federal Reserve Bank, the series (worked out from the serial when it is not given), every collector pattern in the eight digits with its exact odds, and for a star (replacement) note the print run it came from with the number of notes printed and its rarity band. Covers Federal Reserve Notes from Series 1963 on. Gives no price and no authenticity judgement.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "denomination": {
                "description": "Face value in dollars: 1, 2, 5, 10, 20, 50 or 100. Needed for the star note print run.",
                "enum": [1, 2, 5, 10, 20, 50, 100],
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "serial": {
                "description": "The serial as printed, spaces optional, e.g. \"MB 123 45678 C\", \"B12345678C\", or \"A 000 00047 *\" with * or ★ for the star.",
                "maxLength": 40,
                "type": "string"
              },
              "series": {
                "description": "The series printed on the note, only if known, as printed beside the portrait, e.g. \"2017A\", \"2021\", \"1995\".",
                "maxLength": 20,
                "type": "string"
              }
            },
            "required": ["serial"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a US bill's serial number"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:98ac32c88a6168c2496842b9468ea8a7ac7a0e2387f102248a7674cc94a8d90d"
        },
        {
          "name": "find_star_runs",
          "title": "Find the rarest US star note runs",
          "description": "The smallest US star note print runs on record, smallest first (top 10), optionally for one denomination, series or Federal Reserve Bank: the notes printed, the rarity band and the serial range to watch for. Runs printed only for uncut collector sheets, which never circulate, are left out unless include_sheet_runs is true.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "denomination": {
                "description": "Face value in dollars: 1, 2, 5, 10, 20, 50 or 100.",
                "enum": [1, 2, 5, 10, 20, 50, 100],
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "district": {
                "description": "Federal Reserve Bank letter: A Boston, B New York, C Philadelphia, D Cleveland, E Richmond, F Atlanta, G Chicago, H St. Louis, I Minneapolis, J Kansas City, K Dallas, L San Francisco.",
                "enum": ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J", "K", "L"],
                "type": "string"
              },
              "include_sheet_runs": {
                "description": "Also list runs printed only for uncut sheets (default false).",
                "type": "boolean"
              },
              "series": {
                "description": "Only this series, as printed beside the portrait, e.g. \"2017A\", \"2021\", \"1995\".",
                "maxLength": 20,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find the rarest US star note runs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:60db3c99bda52b7db63d7d78b7ce0e84d8f7abc5641a099400ec01c2abaea301"
        },
        {
          "name": "get_coverage",
          "title": "Star note figures coverage",
          "description": "Which denominations and series the star note print run figures cover, with the Federal Reserve districts and number of star runs on record for each, the sources, the date of the last update and any known gap.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "denomination": {
                "description": "Face value in dollars: 1, 2, 5, 10, 20, 50 or 100.",
                "enum": [1, 2, 5, 10, 20, 50, 100],
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Star note figures coverage"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d8d89b35e65b500167bc09e6d7ab164bb11bd0d2bfc7da493010af101455e660"
        },
        {
          "name": "list_serial_patterns",
          "title": "List fancy serial number patterns",
          "description": "The 17 fancy serial number patterns collectors look for on US bills (ladder, solid, radar, repeater, binary, birthday, low serial and the rest): a strict definition, an example, how many of the 100,000,000 possible eight-digit serials match, and the odds.",
          "inputSchema": {
