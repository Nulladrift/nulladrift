          },
          "digest": "sha256:734b1bf6431d4cb28ea4e99bb730b3f0a39fa5f66dd8e6aa63913ac894ca9ed9"
        },
        {
          "name": "submit_listing",
          "title": "Submit a listing",
          "description": "Submit a ticketing platform to Box Office Fees: the url alone; we write its name and description from its own pages. Requires an existing signed-in account with verified email; send its session Cookie header on the MCP request, or an agent key the account made at https://boxofficefees.com/dashboard/agents as Authorization: Bearer. Identity and email come only from that session or key. Sign in or explicitly create an account at https://boxofficefees.com/login?next=%2Fsubmit and verify its email before retrying. This tool creates no account and sends no verification email. Returns {httpStatus:201, id, slug, status:'Draft'}; research + the quality gate decide publication. Your own (url, session email) replay within 24h returns httpStatus:200. The fit check starts at once and usually answers within a minute: poll GET https://boxofficefees.com/api/submissions/{id} and wait the Retry-After seconds it sends while fit is \"checking\". fit then reads \"accepted\" (it goes live, and the account is mailed), \"rejected\" (mailed with the reason) or \"undecided\" (a person looks within 2 days). No session: {httpStatus:401, error:'sign_in_required', message, loginUrl}. Unverified session: {httpStatus:403, error:'email_unverified', message, email, remediation}. The owner must prove the site before anything is listed: the account's address, or an address it proved with a code, must be on the submitted website's domain. Otherwise the answer is the pending state {httpStatus:403, error:'domain_unverified', status:'awaiting_owner_proof', listed:false, message, domain, proveWith, ownerUrl, ownerStep, remediation}: nothing is listed or queued. proveWith names who can receive the 6-digit code (any address at the domain; for a GitHub or other shared-host project, its listed addresses or a one-line file). Submitting for someone else? Give the owner ownerUrl (the submit page with the site filled in): they enter the code there and the listing goes in once proven. With a mailbox at the domain yourself: POST /api/domain-proof/start {url, email}, POST /api/domain-proof/verify {proofId, code}, then submit again. Personal mailboxes (gmail, outlook…) never prove a domain. No refusal creates a listing. Validation returns 400; duplicate/claim responses return 409. Read tools remain keyless.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "The website being submitted (https).",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
