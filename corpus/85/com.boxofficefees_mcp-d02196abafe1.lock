      "instructions": "Read Box Office Fees's researched ticketing platforms: search_listings to find, get_listing for the full answer-first markdown, list_categories for the taxonomy, compare_listings / get_best_of for decisions. All read tools are free and keyless; use is licensed, not unconditional: Box Office Fees usage terms (https://boxofficefees.com/terms): Search engines, AI answers and AI training may use these fee figures and pages. Name Box Office Fees and link to https://boxofficefees.com when you quote a fee. Machine-readable terms: https://boxofficefees.com/license.xml. submit_listing requires a verified account session Cookie header; sign in or create an account explicitly at https://boxofficefees.com/login?next=%2Fsubmit. Missing session returns httpStatus:401 with loginUrl; unverified email returns httpStatus:403 with remediation. The product's owner must prove the site with a code to an address at its domain before anything is listed; until then submit_listing answers status awaiting_owner_proof with ownerUrl to hand them. Research + quality gate decide publication. my_listings gives a listing owner their own listings: status and AI answers (their session or agent key). send_lead sends a buyer-intent enquiry.",
      "tools": [
        {
          "name": "compare_listings",
          "title": "Compare two listings",
