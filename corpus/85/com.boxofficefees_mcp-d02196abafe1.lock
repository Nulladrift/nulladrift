        {
          "name": "send_lead",
          "title": "Send a lead",
          "description": "Send a buyer-intent enquiry (lead) to a ticketing platform or a whole category on Box Office Fees. Keyless. Requires consent:true, a real name, a permanent (non-disposable) email, a message of at least 20 chars, and a target (listingSlug OR categorySlug). Returns { ok, delivered }. Idempotent by (email, target) within 7 days. Nothing here changes a listing's rank, tier or copy.",
          "inputSchema": {
            "properties": {
              "categorySlug": {
                "description": "Target category slug (this OR listingSlug).",
                "type": "string"
              },
              "company": {
                "description": "Optional company name.",
                "type": "string"
              },
              "consent": {
                "description": "Must be true — you agree your details go to the provider(s).",
                "type": "boolean"
              },
              "email": {
                "description": "A permanent contact email (non-disposable).",
                "type": "string"
              },
              "listingSlug": {
                "description": "Target listing slug (this OR categorySlug).",
                "type": "string"
              },
              "message": {
                "description": "The enquiry — real demand, at least 20 chars.",
                "type": "string"
              },
              "name": {
                "description": "Your name.",
                "type": "string"
              }
            },
            "required": ["consent", "email", "message", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send a lead"
          },
          "behavior": {
