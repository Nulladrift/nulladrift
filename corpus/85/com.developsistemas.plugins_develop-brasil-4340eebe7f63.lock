          "title": "Pró-labore do sócio",
          "description": "Calcula o pró-labore do sócio em 2026: INSS de 11% até o teto, imposto de renda com a redução da Lei 15.270, o líquido e o INSS patronal de 20% quando o regime cobra (fora do Simples ou no Anexo IV), com a regra dos lucros distribuídos. Use quando a pessoa pergunta \"quanto tirar de pró-labore\", \"quanto de imposto no pró-labore\" ou \"pró-labore ou distribuição de lucros\".",
