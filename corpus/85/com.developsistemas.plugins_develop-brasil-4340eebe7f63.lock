                "type": "number"
              },
              "icms_iss": {
                "description": "% de ICMS (produto) ou ISS (serviço) sobre o preço hoje. Padrão: 18% produto, 5% serviço.",
                "type": "number"
              },
              "ipi": {
                "description": "% de IPI sobre o preço hoje, se tiver (zera em 2027 fora da Zona Franca).",
                "type": "number"
              },
              "ncm": {
                "description": "NCM do produto, para aplicar redução de alíquota da lei se houver.",
                "type": "string"
              },
              "preco_atual": {
                "description": "Preço de venda de hoje, em reais (com os impostos de hoje embutidos).",
                "type": "number"
              },
              "regime": {
                "description": "Lucro Presumido (PIS/Cofins 3,65% sem crédito) ou Lucro Real (9,25% com crédito).",
