                "description": "Só se souber: IBS do estado em %.",
                "type": "number"
              },
              "aliquota_ibs_municipal": {
                "description": "Só se souber: IBS do município em %.",
                "type": "number"
              },
              "ano": {
                "description": "Ano da simulação (padrão 2027).",
                "maximum": 2033,
                "minimum": 2027,
                "type": "integer"
              },
              "cclasstrib": {
                "description": "Ou o cClassTrib, se já souber.",
                "type": "string"
