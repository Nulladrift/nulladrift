                "description": "Endereço curto do app, com letras, números e hífen (ex.: \"contabil-silva\"). Sem ele, sai do nome.",
                "type": "string"
              },
              "feriados_locais": {
                "description": "Feriados da cidade em dia/mês (ex.: [\"25/01\", \"01/09\"]).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "ferramentas": {
                "description": "Ferramentas da Develop que o app terá. Sem lista, todas.",
                "items": {
                  "enum": ["consultar_cnpj", "validar_cpf_cnpj", "consultar_cep", "consultar_fipe", "calcular_dias_uteis", "gerar_pix", "ler_pix", "ler_boleto", "corrigir_valor", "onde_fica", "distancia_e_rota", "codigo_de_servico", "calcular_salario_liquido", "calcular_ferias", "calcular_decimo_terceiro", "calcular_rescisao", "codigo_ncm", "calcular_simples_nacional", "classificacao_ibs_cbs", "calcular_ibs_cbs", "simples_ibs_cbs_dentro_ou_fora", "gerar_pdf_nfse", "explicar_erro_nfse", "calcular_das_atrasado", "preco_e_margem_reforma", "calcular_custo_funcionario", "calcular_pro_labore", "prazos_do_mes"],
