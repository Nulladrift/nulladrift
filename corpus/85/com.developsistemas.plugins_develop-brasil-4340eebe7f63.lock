        {
          "name": "montar_app_da_empresa",
          "title": "Montar o app da empresa",
          "description": "Cria um app com a marca da empresa (nome, recado, cor, logo, padrões como cidade e anexo do Simples), escolhendo quais destas ferramentas ele tem, para a empresa pôr nas IAs e passar aos clientes. Devolve o endereço do app, a página pública e o link de edição, que só aparece agora; o app entra no ar depois que o e-mail for confirmado. Use só quando a pessoa pede para criar o app da empresa ou do escritório. Confirme o nome e o e-mail com ela antes.",
          "inputSchema": {
            "properties": {
              "anexo_simples": {
