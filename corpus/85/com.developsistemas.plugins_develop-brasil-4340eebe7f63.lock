        },
        {
          "name": "calcular_decimo_terceiro",
          "title": "13º salário 2026",
          "description": "Calcula o 13º salário de 2026: cheio ou proporcional aos meses, a 1ª parcela (até 30/11, sem descontos) e a 2ª (até 20/12, com INSS e imposto de renda com a redução da Lei 15.270/2025). Use quando a pessoa pergunta \"quanto vou receber de 13º\", \"como calcular o décimo terceiro\", \"quando cai a primeira parcela\" ou o empregador quer calcular a folha do 13º.",
          "inputSchema": {
            "properties": {
              "dependentes": {
                "description": "Dependentes para o IR (padrão 0).",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "media_variaveis": {
