        {
          "name": "calcular_rescisao",
          "title": "Rescisão CLT 2026",
          "description": "Estima a rescisão CLT pelas regras de 2026: saldo de salário, aviso prévio (30 dias + 3 por ano, até 90), 13º e férias proporcionais com a projeção do aviso, férias vencidas, INSS, IR, multa e saque do FGTS, seguro-desemprego e o prazo de pagamento (10 dias). Motivos: sem justa causa, pedido de demissão, acordo, justa causa, fim de contrato. Use quando a pessoa pergunta \"quanto recebo se for mandado embora\", \"quanto custa demitir\", \"pedi demissão, o que recebo\" ou quer conferir o termo de rescisão.",
          "inputSchema": {
            "properties": {
              "aviso": {
                "description": "Aviso prévio: indenizado (padrão na demissão sem justa causa e no acordo), trabalhado (padrão no pedido de demissão) ou não cumprido pelo empregado que pediu demissão.",
                "enum": ["indenizado", "trabalhado", "nao_cumprido"],
                "type": "string"
              },
              "data_admissao": {
                "description": "dd/mm/aaaa.",
                "type": "string"
              },
              "data_saida": {
                "description": "Último dia de trabalho, dd/mm/aaaa.",
                "type": "string"
              },
              "dependentes": {
                "description": "Dependentes para o IR (padrão 0).",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "media_variaveis": {
                "description": "Média mensal de horas extras, comissões e adicionais que entram na conta (padrão 0).",
                "type": "number"
              },
              "motivo": {
                "description": "Por que o contrato acabou.",
                "enum": ["sem_justa_causa", "pedido_demissao", "acordo", "justa_causa", "fim_contrato"],
                "type": "string"
              },
              "periodos_ferias_vencidas": {
                "description": "Períodos de férias vencidas e não tiradas (padrão 0).",
                "maximum": 2,
                "minimum": 0,
                "type": "integer"
              },
              "salario_bruto": {
                "description": "Salário bruto mensal em reais (ex.: 3500).",
                "type": "number"
              },
              "saldo_fgts": {
                "description": "Saldo da conta do FGTS deste emprego, para calcular a multa (opcional).",
                "type": "number"
              }
            },
            "required": ["data_admissao", "data_saida", "motivo", "salario_bruto"],
            "type": "object"
          },
