        {
          "name": "calcular_ibs_cbs",
          "title": "Calcular IBS e CBS (Reforma Tributária)",
          "description": "Calcula o IBS e a CBS de uma venda no regime regular (Lucro Real ou Presumido), item a item, pela calculadora oficial de código aberto da Receita Federal, com a classificação e as reduções da LC 214/2025. 2026 com as alíquotas de teste; de 2027 em diante com a estimativa da Fazenda ou as alíquotas informadas. Use quando a pessoa pergunta \"quanto dá de IBS e CBS\", \"quanto vai custar a reforma na minha venda\" ou quer conferir o destaque na nota. Não é para empresa do Simples (essa conta é simples_ibs_cbs_dentro_ou_fora).",
          "inputSchema": {
            "properties": {
              "aliquota_cbs": {
                "description": "Só se a pessoa souber: alíquota da CBS em %, para anos de 2027 em diante (sem ela, usa a estimativa da Fazenda).",
                "type": "number"
              },
              "aliquota_ibs_estadual": {
                "description": "Só se a pessoa souber: alíquota do IBS do estado em %.",
                "type": "number"
              },
              "aliquota_ibs_municipal": {
                "description": "Só se a pessoa souber: alíquota do IBS do município em %.",
                "type": "number"
              },
              "cclasstrib": {
                "description": "cClassTrib, quando é um item só.",
                "type": "string"
              },
              "cep": {
                "description": "Ou o CEP, no lugar de cidade e UF.",
                "type": "string"
              },
              "cidade": {
                "description": "Município, junto com a UF.",
                "type": "string"
              },
              "data": {
                "description": "Data da operação (AAAA-MM-DD) ou só o ano (ex.: \"2027\"); padrão hoje.",
                "type": "string"
              },
              "descricao": {
                "description": "O que é, quando é um item só.",
                "type": "string"
              },
              "exportacao": {
                "description": "true se a venda é para o exterior (imunidade).",
                "type": "boolean"
              },
              "itens": {
                "description": "Os itens da venda. Para um item só, pode usar valor/ncm/nbs direto.",
                "items": {
                  "properties": {
                    "cclasstrib": {
                      "description": "cClassTrib, se a pessoa já souber.",
