        {
          "name": "calcular_simples_nacional",
          "title": "Simples Nacional: alíquota e DAS",
          "description": "Calcula o DAS do Simples Nacional do mês pelos Anexos I a V da LC 123: faixa, alíquota nominal, parcela a deduzir e alíquota efetiva, com Fator R (Anexo III ou V), empresa com menos de 12 meses, sublimite e teto. Para MEI, dá o DAS fixo de 2026 e confere o limite de R$ 81 mil no ano (passou até 20% ou mais de 20%). Use quando a pessoa pergunta \"quanto vou pagar de Simples\", \"qual minha alíquota\", \"Anexo III ou V\", \"quanto é o DAS do MEI\" ou \"estourei o limite do MEI\".",
          "inputSchema": {
            "properties": {
              "anexo": {
                "description": "I comércio, II indústria, III/IV/V serviços; III_ou_V quando a atividade depende do Fator R; MEI para o microempreendedor individual.",
                "enum": ["I", "II", "III", "IV", "V", "III_ou_V", "MEI"],
                "type": "string"
              },
              "atividade_mei": {
                "description": "Só para MEI: a atividade, que muda o valor do DAS.",
                "enum": ["comercio_industria", "servicos", "comercio_e_servicos"],
                "type": "string"
              },
              "faturamento_ano": {
                "description": "Só para MEI: quanto faturou (ou vai faturar) no ano, em reais, para conferir o limite de R$ 81 mil.",
                "type": "number"
              },
              "faturamento_mes": {
                "description": "Receita bruta do mês a pagar, em reais.",
