        {
          "name": "calcular_dias_uteis",
          "title": "Calcular dias úteis",
          "description": "Conta os dias úteis entre duas datas, ou soma N dias úteis a uma data, pulando fins de semana e feriados nacionais (inclui Sexta-feira Santa e Consciência Negra); feriados da cidade entram em feriados_extras. Use para prazos e vencimentos: \"que dia cai 10 dias úteis depois de…\", \"quantos dias úteis tem em dezembro\", prazo de boleto, de entrega, de recurso ou de pagamento de rescisão.",
          "inputSchema": {
            "properties": {
              "data_final": {
                "description": "dd/mm/aaaa. Para contar os dias úteis entre as datas.",
                "type": "string"
              },
              "data_inicial": {
                "description": "dd/mm/aaaa.",
                "type": "string"
              },
              "dias": {
                "description": "Quantos dias úteis somar à data inicial. Use no lugar de data_final.",
                "maximum": 3650,
                "minimum": 0,
                "type": "integer"
              },
              "feriados_extras": {
                "description": "Outras datas sem expediente (dd/mm/aaaa), como feriados da cidade.",
                "items": {
                  "type": "string"
                },
                "maxItems": 100,
                "type": "array"
              },
              "incluir_pontos_facultativos": {
                "description": "Trata Carnaval (segunda e terça) e Corpus Christi como não úteis. Padrão: não.",
                "type": "boolean"
              },
              "sabado_util": {
                "description": "Conta o sábado como dia útil. Padrão: não.",
                "type": "boolean"
              }
            },
            "required": ["data_inicial"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calcular dias úteis"
          },
          "behavior": {
