        {
          "name": "calcular_das_atrasado",
          "title": "DAS atrasado: multa e juros",
          "description": "Calcula a multa (0,33% ao dia, até 20%) e os juros (Selic do Banco Central + 1%) de um DAS do Simples ou do MEI pago atrasado, até a data de pagamento, e explica o termo de exclusão por dívida: prazo, como pagar ou parcelar e o que acontece em 1º de janeiro. Use quando a pessoa pergunta \"quanto fica meu DAS atrasado\", \"esqueci de pagar o MEI\", \"recebi termo de exclusão do Simples\" ou \"vou ser excluído do MEI\".",
          "inputSchema": {
            "properties": {
              "competencia": {
                "description": "Mês de referência do DAS, mm/aaaa (vence dia 20 do mês seguinte).",
                "type": "string"
              },
              "data_pagamento": {
                "description": "Quando vai pagar, dd/mm/aaaa (padrão: hoje).",
                "type": "string"
              },
              "termo_de_exclusao": {
                "description": "true se a empresa recebeu termo de exclusão do Simples/MEI por dívida.",
                "type": "boolean"
              },
              "valor": {
                "description": "Valor original do DAS (principal), em reais.",
                "type": "number"
              },
              "vencimento": {
                "description": "Ou a data de vencimento, dd/mm/aaaa, se a pessoa souber.",
                "type": "string"
              }
            },
            "required": ["valor"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "DAS atrasado: multa e juros"
