      "instructions": "Ferramentas da Develop Sistemas para o dia a dia da empresa brasileira, com dado oficial e conta pelas regras vigentes: consulta de CNPJ e CEP, validação de CPF/CNPJ, tabela FIPE do mês, dias úteis com feriados, Pix, boleto, correção monetária pelo Banco Central, mapa e rota, prazos de impostos e da folha do mês, código de serviço e erros da NFS-e nacional, NCM, Simples Nacional e MEI (DAS, limite, DAS atrasado), contas da CLT de 2026 (salário líquido, férias, 13º, rescisão, custo do funcionário, pró-labore), Reforma Tributária (IBS, CBS e cClassTrib pelas calculadoras oficiais da Receita, preço e margem, Simples dentro ou fora do DAS) e o PDF da NFS-e. Também monta e configura um app com a marca da empresa. As respostas trazem a fonte e a data do dado; tabelas e alíquotas mudam todo ano, e as ferramentas já usam as de 2026. Responda em português do Brasil.",
      "tools": [
        {
          "name": "calcular_custo_funcionario",
          "title": "Custo de um funcionário para a empresa",
          "description": "Calcula quanto um funcionário CLT custa para a empresa por mês e por ano em 2026: salário, FGTS, INSS patronal conforme o regime (Simples, Anexo IV, Lucro Presumido/Real), reservas de 13º, férias e multa do FGTS, vale-transporte e benefícios, e o líquido que ele recebe. Use quando a pessoa pergunta \"quanto custa contratar\", \"quanto custa um funcionário de R$ X\", ou quer comparar CLT com outra forma de contratar.",
          "inputSchema": {
            "properties": {
              "beneficios": {
                "description": "Outros benefícios mensais pagos pela empresa (vale-refeição, plano de saúde…), em reais.",
                "type": "number"
              },
              "rat": {
                "description": "RAT ajustado pelo FAP, em % (1 a 6; padrão 2). Só fora do Simples e no Anexo IV.",
                "type": "number"
              },
              "regime": {
                "description": "Regime da empresa: simples (Anexos I, II, III, V), simples_anexo_iv, ou presumido_real.",
                "enum": ["simples", "simples_anexo_iv", "presumido_real"],
                "type": "string"
              },
              "salario": {
                "description": "Salário bruto mensal, em reais.",
                "type": "number"
              },
              "terceiros": {
                "description": "Contribuição a terceiros (Sistema S e salário-educação), em % (padrão 5,8). Só Lucro Presumido/Real.",
                "type": "number"
              },
              "vale_transporte": {
                "description": "Valor mensal do vale-transporte, em reais (o funcionário paga até 6% do salário).",
                "type": "number"
              }
            },
            "required": ["salario"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Custo de um funcionário para a empresa"
