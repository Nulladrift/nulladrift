                "description": "Como as rotas são calculadas por padrão.",
                "enum": ["carro", "bicicleta", "a_pe"],
                "type": "string"
              },
              "nome": {
                "description": "Nome do app, como vai aparecer na IA (ex.: \"Assistente Contábil Silva\").",
                "type": "string"
              },
              "recado": {
                "description": "Recado que a IA segue ao atender pelo app (até 600 letras): quem é a empresa, como falar com ela.",
