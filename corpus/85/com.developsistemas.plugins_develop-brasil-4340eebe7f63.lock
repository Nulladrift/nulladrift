        {
          "name": "preco_e_margem_reforma",
          "title": "Preço e margem na Reforma Tributária",
          "description": "Simula o preço de venda com a Reforma Tributária para empresa do Lucro Presumido ou Real: quanto cobrar de 2027 a 2033 para manter o que sobra hoje, quanto do preço é IBS/CBS destacado, o custo efetivo para o cliente empresa e como fica a margem se o preço não mudar. Considera PIS/Cofins, ICMS ou ISS, IPI, o crédito das compras e a redução do NCM. Use quando a pessoa pergunta \"vou ter que aumentar o preço com a reforma\", \"como fica minha margem\", \"quanto cobrar em 2027\". Para empresa do Simples a conta é simples_ibs_cbs_dentro_ou_fora.",
          "inputSchema": {
            "properties": {
              "aliquota_cbs": {
