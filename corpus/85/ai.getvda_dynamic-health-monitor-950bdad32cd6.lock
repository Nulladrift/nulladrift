{
  "lockfileVersion": 2,
  "subjects": {
    "ai.getvda/dynamic-health-monitor": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://health.getvda.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "health",
        "version": "0.1.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "health_check",
          "description": "Full monitoring cycle: re-discover from the seed, merge with the saved map, check HTTP/TCP/SSL/DNS, detect latency anomalies, roll dependent failures up to one root cause, persist state, and report what changed.",
          "inputSchema": {
            "properties": {
              "healthignore": {
                "description": "gitignore-style exclusion patterns"
              },
              "seed": {
                "description": "the same seed you discovered with"
              },
              "seed_type": {
                "enum": ["domain", "urls", "compose", "github", "cloudrun"],
                "type": "string"
              }
            },
            "required": ["seed"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:be301aab9aa4db19c1e924232db01aa91092ca46a6cbc080682e8e88601edb67"
        },
        {
          "name": "health_discover",
          "description": "FREE dry run: discover everything a seed would monitor — subdomains, compose services, ports, dependency chains — without monitoring or storing anything.",
          "inputSchema": {
            "properties": {
              "healthignore": {
                "description": "gitignore-style exclusion patterns"
              },
              "seed": {
                "description": "domain, URL list, docker-compose content, or GitHub repo URL"
              },
              "seed_type": {
                "enum": ["domain", "urls", "compose", "github", "cloudrun"],
                "type": "string"
              }
            },
            "required": ["seed"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:137dd4ebd2759db28057adafe87ca10ca2ace2d8ce8e758a5bf02ba99add9c63"
        },
        {
          "name": "health_exclude",
          "description": "FREE: add .healthignore patterns for a seed. Applies next cycle.",
          "inputSchema": {
            "properties": {
              "patterns": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "seed": {
                "description": "the seed to update"
              }
            },
            "required": ["patterns", "seed"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:587e5ce59e896932e4752e7c049d15cff02be7f001e1c4b2f2fc31a054d6b808"
        },
        {
          "name": "health_history",
          "description": "Timeline of status changes for a seed over the last N hours.",
          "inputSchema": {
            "properties": {
              "hours": {
                "default": 24,
                "type": "integer"
              },
              "seed": {
                "description": "the seed to report on"
              }
            },
            "required": ["seed"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:724ab43c909083cc972214c70f4f2eb18518179a0e04292dd49f4270064fd0e0"
        },
        {
          "name": "selftest",
          "description": "FREE, no payment required. Runs this agent's real capability on a fixed canned input and returns the genuine result, an honest assertion grade, and the full trust manifest (signed Agent Card, JWKS, governance/licence chain, safety posture) with a proof link for every claim. Intended for registries, graders and auditors: this is behavioural evidence, not a self-description.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b47248acc568e66c52102bd132b0992a5b1f3ada541c9781fd63777864ad8d05"
        }
      ],
      "digest": "sha256:7d119ad1917018dbca941b498b312d2251f9004cbb7d29614865d14a91014e85"
    }
  }
}
