      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "DenkOps hosts APIs, MCP servers and scheduled jobs for you. Before creating or changing a project, read get_denkops_guide for the project layout and denkops.json. deploy takes the project's files; secrets go in environment variables, never in files. Actions run as the signed-in user in the workspace they chose.",
      "tools": [
        {
          "name": "add_connector_account",
          "title": "Add a connector account",
          "description": "Create an email/password account for a connector project. A strong password is generated and shown only once; pass it to the person securely. Password sign-in must be enabled for it to work. Workspace owners only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "email": {
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "project_id": {
                "description": "The project id",
                "pattern": "^[A-Za-z0-9_-][A-Za-z0-9._:-]{0,127}$",
                "type": "string"
              }
            },
            "required": ["email", "project_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add a connector account"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
