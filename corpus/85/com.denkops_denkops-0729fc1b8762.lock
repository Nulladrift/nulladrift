        {
          "name": "deploy",
          "title": "Deploy to DenkOps",
          "description": "Deploy a project to DenkOps by sending its files, and get the live URL back. Include every source file (and denkops.json if the project has one; without it a new project is created, named from `name`, package.json or pyproject.toml). Pass project_id to ship a new version of an existing project. Secrets do not belong in files: .env files are rejected (set environment variables separately). Limits: 500 files, 5 MB.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "files": {
                "items": {
                  "properties": {
                    "content": {
                      "description": "File content (UTF-8 text, or base64 when encoding is base64)",
                      "type": "string"
                    },
                    "encoding": {
                      "enum": ["utf8", "base64"],
                      "type": "string"
                    },
                    "path": {
                      "description": "Relative path inside the project, e.g. src/index.ts",
                      "type": "string"
                    }
                  },
                  "required": ["content", "path"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "name": {
                "description": "Project name for a first deploy without denkops.json",
                "type": "string"
              },
              "project_id": {
                "description": "Existing project to deploy a new version to",
                "pattern": "^[A-Za-z0-9_-][A-Za-z0-9._:-]{0,127}$",
                "type": "string"
              }
            },
            "required": ["files"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Deploy to DenkOps"
