        {
          "name": "create_connection",
          "title": "Create a connection",
          "description": "Mint a new scoped, revocable DenkOps connection token for a CLI, CI job or agent (e.g. GitHub Actions deploys). The token is returned exactly once and cannot be retrieved again. Workspace owners only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agent_type": {
                "description": "e.g. claude-code, codex, openclaw, hermes, other (default other)",
                "type": "string"
              },
              "env_scope": {
                "description": "env var access scope (default none)",
                "enum": ["none", "read", "write"],
                "type": "string"
              },
              "expires_in_days": {
                "anyOf": [
                  {
                    "anyOf": [
                      {
                        "const": 30,
                        "type": "number"
                      },
                      {
                        "const": 90,
                        "type": "number"
                      },
                      {
                        "const": 365,
                        "type": "number"
                      }
                    ]
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "null = never expires (default 90)"
              },
              "label": {
                "type": "string"
              },
              "projects": {
                "description": "restrict to these project ids (default: all projects)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
