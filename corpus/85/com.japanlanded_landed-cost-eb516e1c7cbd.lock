        {
          "name": "estimate_landed_cost",
          "description": "Estimate yen costs to buy one item in Japan through a shopping proxy (Buyee, ZenMarket, Neokyo, Tenso, FROM JAPAN, White Rabbit Express) and ship it abroad. Use this when the user asks how much it costs to ship or import something from Japan, what the landed cost will be, or what Buyee / proxy fees plus postage are for a specific item and destination. Returns pay-now, before-ship, and on-arrival lines in yen. Partial sums only; not a landed total. Missing fees stay null — never treat null as zero, and do not rank proxies by knownPartial. Example: a ¥4,500 Mercari figure, 600 g, to the US by EMS, via Buyee.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "category": "figures",
                "country": "US",
                "price_jpy": 4500,
                "proxy": "buyee",
                "shipping_method": "ems",
                "source_site": "mercari",
                "weight_g": 600
              }
            ],
            "properties": {
              "alcohol_abv": {
                "description": "Alcohol by volume percent, for sake or whisky. Example: 15.",
                "type": "number"
              },
              "category": {
                "description": "Item type: figures (anime or prize figures), trading_cards (Pokémon, Yu-Gi-Oh, One Piece), retro_games, cameras, effects_pedals, sake, whisky.",
                "enum": ["figures", "trading_cards", "retro_games", "cameras", "effects_pedals", "sake", "whisky"],
                "type": "string"
              },
              "country": {
                "description": "Destination ISO 3166-1 alpha-2 code or English name. Examples: US, GB, DE, AU, CA, FR.",
                "type": "string"
              },
              "height_cm": {
                "type": "number"
              },
              "item_url": {
                "description": "Echoed only. Never fetched by this server.",
                "type": "string"
              },
              "lang": {
                "description": "Language of notes. Yen amounts stay the same.",
                "enum": ["en", "ja"],
                "type": "string"
              },
              "length_cm": {
                "description": "Ignored. Volumetric weight is not calculated.",
                "type": "number"
              },
              "lithium": {
                "description": "Lithium battery: installed in the device, spare, none, or unspecified.",
                "enum": ["installed", "spare", "none", "unspecified"],
                "type": "string"
              },
              "mains_voltage": {
                "description": "Mains voltage of the item. Japanese domestic gear is often 100 V.",
                "enum": ["100", "100-240", "unknown", "not_applicable"],
                "type": "string"
              },
              "price_jpy": {
                "description": "Merchandise price in yen for one unit. Example: 4500 for a ¥4,500 figure.",
                "minimum": 1,
                "type": "integer"
              },
              "proxy": {
                "description": "Proxy id: buyee, zenmarket, neokyo, tenso, from-japan, or white-rabbit. Omit to compare every proxy in the dataset.",
                "type": "string"
              },
              "quantity": {
                "default": 1,
                "description": "Number of units. Default 1, maximum 20.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "shipping_method": {
                "description": "Shipping method. japan_post_sal_small_packet and japan_post_sal_parcel are accepted for compatibility but SAL is suspended (Japan Post availability chart updated 2026-10-23; Buyee lists SAL as suspended): the result has a 'suspended' shipping line with no price, listed in excludedUnknownCosts.",
                "enum": ["ems", "japan_post_small_packet", "japan_post_sal_small_packet", "japan_post_surface_small_packet", "japan_post_air_parcel", "japan_post_sal_parcel", "japan_post_surface_parcel", "dhl"],
                "type": "string"
              },
              "source_site": {
                "description": "Where the item is listed in Japan. Affects some proxy fees (ZenMarket charges more on Mercari and Yahoo Auctions).",
                "enum": ["mercari", "yahoo_auctions", "rakuten", "amazon_jp", "surugaya", "digimart", "map_camera", "kitamura", "other"],
                "type": "string"
              },
              "weight_g": {
                "description": "Weight of one unit in grams. Example: 600. Omit only to use an unsourced placeholder; postage is more accurate when set.",
