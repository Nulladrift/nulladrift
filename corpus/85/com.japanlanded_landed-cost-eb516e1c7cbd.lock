      },
      "transport": {
        "type": "http",
        "url": "https://japanlanded.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "japanlanded",
        "title": "JapanLanded landed-cost estimates",
        "version": "2026-11-04.2",
        "description": "Read-only yen estimates for buying Japan goods through a proxy. Estimates only. Missing fees are null. item_url is never fetched. Alcohol has no affiliate link."
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use estimate_landed_cost for yen partial sums. Treat null amounts as unknown, never as zero. knownPartial is a partial sum; proxies leave out different unknown costs (see excludedUnknownCosts and comparisonNote), so do not rank proxies by it. Do not invent VAT totals, FX, or DHL rates. Alcohol categories never get an affiliate referral. Confirm fees with the proxy before purchase. JapanLanded does not sell or ship goods.",
      "tools": [
        {
          "name": "check_shippability",
          "description": "Export check: allowed, conditional, or blocked, with reasons (lithium, alcohol, destination lists). Not a customs clearance.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "alcohol_abv": {
                "type": "number"
              },
              "category": {
                "enum": ["figures", "trading_cards", "retro_games", "cameras", "effects_pedals", "sake", "whisky"],
                "type": "string"
              },
              "country": {
                "type": "string"
              },
              "lang": {
                "enum": ["en", "ja"],
                "type": "string"
              },
              "lithium": {
                "enum": ["installed", "spare", "none", "unspecified"],
                "type": "string"
              },
              "mains_voltage": {
                "enum": ["100", "100-240", "unknown", "not_applicable"],
                "type": "string"
              },
              "price_jpy": {
                "minimum": 1,
                "type": "integer"
              },
              "shipping_method": {
                "description": "Shipping method. japan_post_sal_small_packet and japan_post_sal_parcel are accepted for compatibility but SAL is suspended (Japan Post availability chart updated 2026-10-23; Buyee lists SAL as suspended): the result has a 'suspended' shipping line with no price, listed in excludedUnknownCosts.",
                "enum": ["ems", "japan_post_small_packet", "japan_post_sal_small_packet", "japan_post_surface_small_packet", "japan_post_air_parcel", "japan_post_sal_parcel", "japan_post_surface_parcel", "dhl"],
                "type": "string"
              },
              "weight_g": {
                "type": "number"
              }
            },
            "required": ["category", "country"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a2299675b770b88897e29055da0b431c5177e409c7e08e1fa9687c96c134eaf8"
        },
        {
          "name": "compare_proxies",
          "description": "Estimate a multi-item cart for each proxy. cheapest/fastest stay null until the dataset can support them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "type": "string"
              },
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "alcohol_abv": {
                      "type": "number"
                    },
                    "category": {
                      "enum": ["figures", "trading_cards", "retro_games", "cameras", "effects_pedals", "sake", "whisky"],
                      "type": "string"
                    },
                    "height_cm": {
                      "type": "number"
                    },
                    "item_url": {
                      "description": "Echoed only. Never fetched by this server.",
                      "type": "string"
                    },
                    "length_cm": {
                      "description": "Ignored. Volumetric weight is not calculated.",
                      "type": "number"
                    },
                    "lithium": {
                      "enum": ["installed", "spare", "none", "unspecified"],
                      "type": "string"
                    },
                    "mains_voltage": {
                      "enum": ["100", "100-240", "unknown", "not_applicable"],
                      "type": "string"
                    },
                    "price_jpy": {
                      "description": "Merchandise price in yen for one unit.",
                      "minimum": 1,
                      "type": "integer"
                    },
                    "quantity": {
                      "default": 1,
                      "maximum": 20,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "source_site": {
                      "enum": ["mercari", "yahoo_auctions", "rakuten", "amazon_jp", "surugaya", "digimart", "map_camera", "kitamura", "other"],
                      "type": "string"
                    },
                    "weight_g": {
                      "description": "Weight of one unit in grams. Omit only to use unsourced placeholder.",
                      "type": "number"
                    },
                    "width_cm": {
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "lang": {
                "enum": ["en", "ja"],
                "type": "string"
              },
              "proxy": {
                "type": "string"
              },
              "shipping_method": {
                "description": "Shipping method. japan_post_sal_small_packet and japan_post_sal_parcel are accepted for compatibility but SAL is suspended (Japan Post availability chart updated 2026-10-23; Buyee lists SAL as suspended): the result has a 'suspended' shipping line with no price, listed in excludedUnknownCosts.",
                "enum": ["ems", "japan_post_small_packet", "japan_post_sal_small_packet", "japan_post_surface_small_packet", "japan_post_air_parcel", "japan_post_sal_parcel", "japan_post_surface_parcel", "dhl"],
                "type": "string"
              }
            },
