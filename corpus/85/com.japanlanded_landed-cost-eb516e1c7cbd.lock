            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:53a78174d69bb9d60a9d4edc5ecbff3e82b6b1a46e4905c09cffc0ab971d6cd4"
        },
