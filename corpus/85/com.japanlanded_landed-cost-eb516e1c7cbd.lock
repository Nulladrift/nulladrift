          "description": "Return an outbound link for a Japan proxy. Buyee returns the affiliate URL when the item is not alcohol; sake and whisky never get an affiliate link. Other proxies return their public pages with placeholder:true. Never executes a purchase. Use only when the user wants a signup or store link, not for fee amounts (use estimate_landed_cost or list_proxies for fees).",
