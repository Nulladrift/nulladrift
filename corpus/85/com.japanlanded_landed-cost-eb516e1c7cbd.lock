  "subjects": {
    "com.japanlanded/landed-cost": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://japanlanded.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "japanlanded",
        "title": "JapanLanded landed-cost estimates",
        "version": "2026-11-10.1",
        "description": "Read-only yen estimates for buying Japan goods through a proxy (Buyee, ZenMarket, Neokyo, Tenso, FROM JAPAN, White Rabbit Express) and shipping them abroad. Use estimate_landed_cost for 'how much to ship X from Japan to Y' and list_proxies for Buyee or proxy fees. Estimates only. Missing fees are null. item_url is never fetched. Alcohol has no affiliate link."
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "For questions like 'how much to ship X from Japan to Y' or 'what will this cost via Buyee', call estimate_landed_cost (price_jpy, category, country; add weight_g, source_site, shipping_method, proxy when known). For Buyee or proxy fee schedules alone, call list_proxies. For lithium, alcohol, or 100 V restrictions, call check_shippability. For several items, call compare_proxies. Treat null amounts as unknown, never as zero. knownPartial is a partial sum; proxies leave out different unknown costs (see excludedUnknownCosts and comparisonNote), so do not rank proxies by it. Do not invent VAT totals, FX, or DHL rates. Alcohol categories never get an affiliate referral. Confirm fees with the proxy before purchase. JapanLanded does not sell or ship goods.",
      "tools": [
        {
          "name": "check_shippability",
          "description": "Check whether an item can be exported from Japan to a destination (allowed, conditional, or blocked). Use this for questions like can I ship a lithium battery, sake, whisky, or a 100 V console to the UK or US. Reasons cover lithium, alcohol, and destination lists. Not a customs clearance.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "alcohol_abv": 43,
                "category": "whisky",
                "country": "GB",
                "shipping_method": "ems"
              }
            ],
            "properties": {
              "alcohol_abv": {
                "description": "Alcohol by volume percent, when category is sake or whisky.",
                "type": "number"
              },
              "category": {
                "description": "Item type. sake and whisky use the alcohol rules.",
                "enum": ["figures", "trading_cards", "retro_games", "cameras", "effects_pedals", "sake", "whisky"],
                "type": "string"
              },
              "country": {
                "description": "Destination ISO code or English name. Examples: US, GB, DE.",
                "type": "string"
              },
              "lang": {
                "enum": ["en", "ja"],
                "type": "string"
              },
              "lithium": {
                "enum": ["installed", "spare", "none", "unspecified"],
                "type": "string"
              },
              "mains_voltage": {
                "enum": ["100", "100-240", "unknown", "not_applicable"],
                "type": "string"
              },
              "price_jpy": {
                "minimum": 1,
                "type": "integer"
              },
              "shipping_method": {
                "description": "Shipping method. japan_post_sal_small_packet and japan_post_sal_parcel are accepted for compatibility but SAL is suspended (Japan Post availability chart updated 2026-10-23; Buyee lists SAL as suspended): the result has a 'suspended' shipping line with no price, listed in excludedUnknownCosts.",
                "enum": ["ems", "japan_post_small_packet", "japan_post_sal_small_packet", "japan_post_surface_small_packet", "japan_post_air_parcel", "japan_post_sal_parcel", "japan_post_surface_parcel", "dhl"],
                "type": "string"
              },
              "weight_g": {
                "type": "number"
              }
            },
            "required": ["category", "country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check if Japan Post or the proxy can ship it"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dfb6e04a2a54b1d37041292d395253cbdb2d885df810869673f091368e0a30c5"
        },
        {
          "name": "compare_proxies",
          "description": "Estimate a multi-item cart for each Japan proxy (Buyee, ZenMarket, Neokyo, and others). Use this when the user has several items, asks about consolidating, or wants a side-by-side fee comparison. cheapest and fastest stay null until the dataset can support them. Do not rank by knownPartial: unknown costs differ by proxy (Buyee includes a domestic-postage range; most others do not).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Destination ISO code or English name. Example: US.",
                "type": "string"
              },
              "items": {
                "description": "Cart lines. Each item uses the same fields as estimate_landed_cost (price_jpy, category, weight_g, source_site, …).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "alcohol_abv": {
                      "description": "Alcohol by volume percent, for sake or whisky. Example: 15.",
                      "type": "number"
                    },
                    "category": {
                      "description": "Item type: figures (anime or prize figures), trading_cards (Pokémon, Yu-Gi-Oh, One Piece), retro_games, cameras, effects_pedals, sake, whisky.",
                      "enum": ["figures", "trading_cards", "retro_games", "cameras", "effects_pedals", "sake", "whisky"],
                      "type": "string"
                    },
                    "height_cm": {
                      "type": "number"
                    },
                    "item_url": {
                      "description": "Echoed only. Never fetched by this server.",
                      "type": "string"
                    },
                    "length_cm": {
                      "description": "Ignored. Volumetric weight is not calculated.",
                      "type": "number"
                    },
                    "lithium": {
                      "description": "Lithium battery: installed in the device, spare, none, or unspecified.",
                      "enum": ["installed", "spare", "none", "unspecified"],
                      "type": "string"
                    },
                    "mains_voltage": {
                      "description": "Mains voltage of the item. Japanese domestic gear is often 100 V.",
                      "enum": ["100", "100-240", "unknown", "not_applicable"],
                      "type": "string"
                    },
                    "price_jpy": {
                      "description": "Merchandise price in yen for one unit. Example: 4500 for a ¥4,500 figure.",
                      "minimum": 1,
                      "type": "integer"
                    },
                    "quantity": {
                      "default": 1,
                      "description": "Number of units. Default 1, maximum 20.",
                      "maximum": 20,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "source_site": {
                      "description": "Where the item is listed in Japan. Affects some proxy fees (ZenMarket charges more on Mercari and Yahoo Auctions).",
                      "enum": ["mercari", "yahoo_auctions", "rakuten", "amazon_jp", "surugaya", "digimart", "map_camera", "kitamura", "other"],
                      "type": "string"
                    },
                    "weight_g": {
                      "description": "Weight of one unit in grams. Example: 600. Omit only to use an unsourced placeholder; postage is more accurate when set.",
                      "type": "number"
                    },
                    "width_cm": {
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "lang": {
                "enum": ["en", "ja"],
                "type": "string"
              },
              "proxy": {
                "description": "Optional proxy id. Omit to compare every proxy.",
                "type": "string"
              },
              "shipping_method": {
                "description": "Shipping method. japan_post_sal_small_packet and japan_post_sal_parcel are accepted for compatibility but SAL is suspended (Japan Post availability chart updated 2026-10-23; Buyee lists SAL as suspended): the result has a 'suspended' shipping line with no price, listed in excludedUnknownCosts.",
                "enum": ["ems", "japan_post_small_packet", "japan_post_sal_small_packet", "japan_post_surface_small_packet", "japan_post_air_parcel", "japan_post_sal_parcel", "japan_post_surface_parcel", "dhl"],
                "type": "string"
              }
            },
            "required": ["country", "items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare Japan proxy fees for a cart"
          },
          "behavior": {
