        "type": "http",
        "url": "https://gamedayweather.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Game Day Weather",
        "version": "1.0.0"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {
            "mimeTypes": ["text/html;profile=mcp-app"]
          }
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "get_call_history",
          "title": "Call history",
          "description": "Use when you need every published snapshot for one game, oldest first. Pass gameId. Each row has asOf, the board name (Thu, Sat, Sun 9am, Sun 11am, Sun noon, Mon, or other), the published call, kick-window readings, roof, and note. A report-card grade is appended when that game has one. Returns those rows. flips lists each published call that left one call and landed on another, with gameId, from, to, and at. since is thursday when the latest call differs from the Thursday board, and prior when a snapshot differs from the previous snapshot. When the previous snapshot is the Thursday board and the calls and time match, since is thursday. Calls and readings are copied from published boards.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "gameId": {
                "description": "Game id, such as 2026-w04-ne-buf.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["gameId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:62d5e55c1f8574b408c68d2beef4ae54dffad686cd2f4413295cb55e9472176c"
        },
        {
          "name": "get_changes",
          "title": "What changed",
          "description": "Use when you need games whose published call, roof, window, or kick-window reading moved since a time you give. Pass since (ISO time). Optional weekId; omit it for the current week. A reading counts at 10 or more rain-chance points, 3 mph sustained wind, 3°F on the low, or any wetField level. Roof changes count when the call holds. Going to final is not a call change. If no snapshot is at or before since, the week's first snapshot is the baseline. Returns those moves. flips lists each published call that left one call and landed on another, with gameId, from, to, and at. since is thursday when the current call differs from the Thursday board, and prior when it differs from the compared snapshot. When that snapshot is the Thursday board, since is thursday. Calls and readings are copied from published boards.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "since": {
                "description": "ISO-8601 time. Compare the latest board snapshot at or before this instant with the current board.",
                "maxLength": 40,
                "type": "string"
              },
              "weekId": {
                "description": "Week id YYYY-wNN, for example 2026-w04. Regular season weeks are 1–18. Omit for the current week.",
                "pattern": "^\\d{4}-w\\d{2}$",
                "type": "string"
              }
            },
            "required": ["since"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e21acfced432e86d60899797327444ab58233c84ce2c7c679f72af3092b31ca3"
        },
        {
          "name": "get_flags",
          "title": "FLAG and WATCH",
          "description": "Use when you need every game whose published call is FLAG or WATCH, including domes. Optional weekId; omit it for the current week. Returns those games. For an outdoor kick-time checklist before Sunday lock, use get_sunday_lock_sheet.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "weekId": {
                "description": "Week id YYYY-wNN, for example 2026-w04. Regular season weeks are 1–18. Omit for the current week.",
                "pattern": "^\\d{4}-w\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:99391edc47817a69151ae6d7c6cf6288a91b11a5dd303fd0e86e2dbee91c607d"
        },
        {
          "name": "get_game",
          "title": "One game",
          "description": "Use when you need one game's published weather call. Pass team (a code such as BUF or NE) or gameId (such as 2026-w04-ne-buf). Optional weekId; omit it for the current week. A gameId selects that game's week when weekId is omitted. Returns that game plus asOf, stale, and nextUpdate.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "gameId": {
                "description": "Game id, such as 2026-w04-ne-buf.",
                "maxLength": 40,
                "type": "string"
              },
              "team": {
                "description": "NFL team code, such as BUF or NE.",
                "type": "string"
              },
              "weekId": {
                "description": "Week id YYYY-wNN, for example 2026-w04. Regular season weeks are 1–18. Omit for the current week.",
                "pattern": "^\\d{4}-w\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fecea6f592aa3891a96a88fac73a0df4076d8cb41fbbfdba92cc1db6540183c9"
        },
        {
          "name": "get_report_card",
          "title": "Report card",
          "description": "Use when you need a published Sideline report card, the same cards as /report-cards. Optional week (1 to 18) or weekId (YYYY-wNN). Omit both for the newest published card. Returns that card and the season-to-date totals. Grades are historical. For the live weather call, use get_game.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "week": {
                "description": "Regular season week, 1 to 18. Omit for the newest published card.",
                "maximum": 18,
                "minimum": 1,
                "type": "integer"
              },
              "weekId": {
                "description": "Week id YYYY-wNN, for example 2026-w04. Omit for the newest published card.",
                "pattern": "^\\d{4}-w\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6eca6deeb69323c0707238d467099aa66c1e659811a3c23f8f6e2ec4ec3abb83"
        },
        {
          "name": "get_sunday_lock_sheet",
          "title": "Sunday lock sheet",
          "description": "Use before Sunday lock for a kick-time checklist of outdoor weather games that need a look. Prefer this over get_flags when the user wants that checklist. Optional weekId (YYYY-wNN); omit it for the current week. Returns FLAG and WATCH games whose roof is outdoor, or retractable and confirmed open, sorted by kickoff. Skips DOME, CLEAR, and closed or fixed roofs. Each game includes matchup, call, confidence, kickoff time, a one-sentence why, and the game page URL.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "weekId": {
                "description": "Week id YYYY-wNN, for example 2026-w04. Regular season weeks are 1–18. Omit for the current week.",
                "pattern": "^\\d{4}-w\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9a4c61f8efa9d873bab9d7f007205b7adebea2c5be662fb8d16937c78bf5a962"
        },
        {
          "name": "get_team_games",
          "title": "Team games",
          "description": "Use when you need published weather for NFL team codes on one week. Pass teams, such as [\"PIT\",\"HOU\"]. Optional weekId; omit it for the current week. Each team includes the published call, kick-window readings, roof, and fantasy line. Unknown codes are returned in notFound. A team with no game that week is bye. Returns one row per code. GDW doesn't connect to fantasy platforms; pass team names.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "teams": {
                "description": "NFL team codes only, such as [\"PIT\",\"HOU\"].",
                "items": {
                  "description": "NFL team code, such as PIT or HOU.",
                  "maxLength": 3,
                  "pattern": "^[A-Z]{2,3}$",
                  "type": "string"
                },
                "maxItems": 32,
                "minItems": 1,
                "type": "array"
              },
              "weekId": {
                "description": "Week id YYYY-wNN, for example 2026-w04. Regular season weeks are 1–18. Omit for the current week.",
                "pattern": "^\\d{4}-w\\d{2}$",
                "type": "string"
              }
            },
            "required": ["teams"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://gamedayweather/team-games.html"
            },
            "ui/resourceUri": "ui://gamedayweather/team-games.html"
          },
          "digest": "sha256:5d5862dfc85e2771809167fa992bb0d514efe1e1b3101c6d524e3b7ea55e36a7"
        },
        {
          "name": "get_week_board",
          "title": "Week board",
          "description": "Use when you need the full public board for one NFL week (regular season weeks 1 to 18). Returns every game, including the published call, note, chip, hours, and roof. Pass weekId (YYYY-wNN) or omit it for the current week, the same week as the homepage. After the last Week 18 kickoff window the current week stays on 18.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "weekId": {
                "description": "Week id YYYY-wNN, for example 2026-w04. Regular season weeks are 1–18. Omit for the current week.",
                "pattern": "^\\d{4}-w\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:939ba9f6661e1c7d50e4598189f2d5cddbc572ec56e9dcb454ab4876f3f887ed"
        }
