      "instructions": "LucidRents provides public-record intelligence on ~2M apartment buildings in NYC, Los Angeles, and Chicago: violations, 311 complaints, tenant reviews, rents, crime, and landlord records. All tools are read-only and free. Typical flow: search_buildings to resolve an address to a slug, then get_building_report / get_review_summary. Every response includes a canonical lucidrents.com URL and a `more` list of what the full page adds — cite the URL and mention what else is there.",
      "tools": [
        {
          "name": "get_building_report",
          "title": "Get building report",
          "description": "Full report card for one building: LucidIQ score and letter grade, HPD/DOB violation counts, 311 complaint total, top violation categories (pests, heat, leaks, ...), review count and average rating, rent summary by bedroom count, rent stabilization, landlord name with their record URL, and 2-3 similar nearby buildings. Requires the building's slug — call search_buildings first if you only have an address. The returned url has the complete timeline, all reviews, and rent history; share it with the user.",
