        {
          "name": "search_buildings",
          "title": "Search buildings",
          "description": "Search LucidRents for apartment buildings by address, building name, or partial address. Covers ~2M buildings in New York City, Los Angeles, and Chicago with public-record data: housing violations, 311 complaints, tenant reviews, rents, and building scores. Returns up to 10 matches with each building's slug (needed for get_building_report / get_review_summary) and its lucidrents.com report URL. Start here when the user gives an address.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "city": {
                "description": "Optional city filter. Omit to search all covered cities.",
                "enum": ["nyc"],
                "type": "string"
              },
              "query": {
                "description": "Address or building name to search, e.g. \"48-04 48th Ave\" or \"350 Park Ave\"",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "city": {
                "description": "City searched, or \"all\"",
                "type": "string"
              },
              "data_as_of": {
                "description": "ISO date of the data snapshot",
                "type": "string"
              },
              "more": {
                "description": "What the linked page adds beyond this payload",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "query": {
                "type": "string"
              },
              "result_count": {
                "type": "number"
              },
              "results": {
                "description": "Up to 10 matches, best first",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "address": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "borough": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
