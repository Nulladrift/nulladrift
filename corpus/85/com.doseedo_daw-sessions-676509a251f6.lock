      "serverInfo": {
        "name": "doseedo-daw-sessions",
        "title": "Doseedo DAW Sessions: read, edit and convert Logic, Ableton, FL Studio and Pro Tools projects",
        "version": "0.22.0",
        "description": "Read and edit DAW projects as an agent, save native Logic projects, convert projects between DAWs",
        "websiteUrl": "https://doseedo.com/guides/edit-daw-projects-with-claude"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "doseedo DAW sessions = YOUR DAW PROJECTS, READ AND EDITED BY AN AGENT: open a Logic Pro, Ableton Live, FL Studio, Pro Tools or REAPER project as a session, read it as the arrangement (tracks, regions, MIDI notes, mixer, plugins, tempo, markers), change it in batches, save it as a native Logic project, and convert projects between DAWs (Logic, Ableton, FL Studio, Pro Tools, REAPER, Cubase, Studio One, Bitwig, Dorico; GarageBand as a source). Dø Desktop (macOS) puts edits into the open Logic project. Every sound comes from the project itself: its audio, its instruments, its plugins. RULES: (1) Before a session build call doseedo_edit_ops_reference ONCE (the default view fits; op:\"<name>\" / section:\"recipes\" for detail) and copy a recipe. (2) Never drive the user's screen (no clicking in Logic, no GUI scripting); without Dø Desktop hand over the downloaded project. (3) After unzipping a download run EVERY place_local_files command or those tracks open empty (replay audio_source:\"place_local_files\" / a \"NOT bundled\" warning = action required). (4) Verify from the response (the download's replay, the conversion report), never by unzipping. (5) Result URLs are pre-signed: plain curl, no auth, 24 h. (6) Errors carry code / retryable / next — act on next; service_unavailable or timeout = wait 30 s, retry ONCE, then tell the user which doseedo service is down; never loop. IDS & UNITS: beats are absolute from bar 1 (beat 0 = bar 1) at the project tempo. Faders: set_channel_volume 0.709 = 0 dB, 1.0 = +6 dB (a new track opens at 0 dB in the download). Ids: mint 12 random lowercase hex and on add_track ALWAYS pass both track_id t_<hex> and channel_id ch_<same hex> (bus ch_b_<hex>, marker m_<hex>); every other id (param_id, marker_id, clip_id) comes from doseedo_get_session. Quick Sampler: a one-shot plays at its recorded pitch on C3 = MIDI 60 and plays the WHOLE sample (sample_start_seconds / sample_end_seconds trim it; mode classic stops at note-off — size notes to the sampler's plays_beats from get_session; mode one_shot rings out). Send level 1 = unity (linear 0–2). WORKFLOW (a session in 5 calls): 1) doseedo_create_session, doseedo_list_sessions or doseedo_import_project → session_id. 2) doseedo_get_session → track ids, regions in beats AND seconds, tempo_bpm, time_signature, mixer, plugins, sync.live_edits (big sessions omit notes: include_notes:true with tracks:[ids]). 3) doseedo_edit_session with ALL ops in ONE call (≤500, in order) + a batch_key so a retry dedups; atomic by default — a rejection names a code and, where it can, a did_you_mean; fix and re-send the whole batch with the same batch_key. 4) doseedo_download_session → a no-auth URL + a `replay` report of what landed. 5) curl it into ~/Downloads, unzip, run place_local_files. FILES ON THE USER'S MACHINE never leave it: attach_audio {track_id, local_path, audio_info, start_beats} / set_track_clips audio_ref.local_path / load_quick_sampler_sample sample_path (audio_info = the WAV header numbers; the ops reference shows how to read them). A file at a public URL: doseedo_add_audio_to_session {audio_url} → a sha256 for attach_audio / load_quick_sampler_sample. LIVE vs OFFLINE: live_edits:true|false + live_edits_reason (doseedo_desktop_status, doseedo_get_session.sync) says whether an edit reaches the user's Logic project now — relay the reason. Dø Desktop saves the project, keeps a backup, closes it, writes the edits and reopens it (~10–20 s), so send each change as ONE batch and tell the user the project will reopen. Otherwise edits persist and land in the next download or open. doseedo_download_session needs no desktop; doseedo_bounce_session (tracks to audio through their own plugin chains, rendered on the user's Mac, no credits) does. PLUGINS insert BY NAME (add_device {channel_id, device:{name}}); doseedo_list_plugins lists what the strip can load. CONVERT: doseedo_get_project_upload_url {filename, size_bytes} → curl PUT the zip (zip a project FOLDER so its audio travels; past 4 GB a multipart upload, finished with doseedo_complete_project_upload) → doseedo_convert_project {project_key, direction:\"<source>2<target>\" | \"auto2<target>\"} → job_id → doseedo_wait_task (15 s–2 min) → the file + its transfer report (report, lossy, summary, warnings) — tell the user what the report says before they open it. Cubase, Studio One and Bitwig receive one .dawproject; Dorico receives MusicXML. To EDIT a project instead: doseedo_import_project {project_key} → session_id (audio is not carried; audio.next says how to supply it). Conversions draw on the account's credits (doseedo_account); doseedo_list_jobs finds earlier jobs, doseedo_cancel_job stops one. AUTH: sign in with OAuth when the client asks. Scopes: doo / write:sessions = full; ops:<group> (mixer, regions, plugins, tracks, project, markers, automation, history) = only that op category; read:sessions = read-only (writes → 403 code=read_only_key — do not retry, tell the user which scope is needed). ERRORS are JSON {error, code, retryable, plane, next, request_id}: act on next.",
