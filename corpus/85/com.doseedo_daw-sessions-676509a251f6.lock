        {
          "name": "doseedo_get_project_upload_url",
          "title": "Get a project upload URL",
          "description": "Get a presigned upload for a DAW PROJECT file (for doseedo_convert_project / doseedo_import_project). Zip a project FOLDER so its audio travels with it — and a .logicx or GarageBand .band, which are folders (macOS packages). SIZE LIMITS: a single PUT takes up to 5 GB; guest and free accounts convert projects up to 2 GB, paid plans up to 12 GB (a larger one is refused as project_too_large with the cap and an upgrade link). Pass size_bytes: past 4 GB (or with multipart:true) you get a MULTIPART upload instead — a part_size, one presigned part_url per part, and the complete step (doseedo_complete_project_upload); each part is retried on its own, so a dropped connection costs one part, not the upload. Single PUT: `curl -sS -X PUT -H \"Content-Type: application/zip\" --data-binary @project.zip \"<upload_url>\"`, then pass project_key on. Multipart: `split -b <part_size_bytes> project.zip part.` then for each piece in order `curl -sS -X PUT --data-binary @part.aa \"<part_url>\" -D - -o /dev/null | grep -i etag` (keep each ETag), then doseedo_complete_project_upload {project_key, upload_id, parts}. Need more part URLs than one answer holds? Call this again with project_key + upload_id + part_numbers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "content_type": {
                "description": "MIME type: application/zip for zips (default), application/octet-stream for bare project files.",
                "type": "string"
              },
              "filename": {
                "description": "File name including extension, e.g. \"Song Project.zip\", \"My Song.band.zip\", \"beat.flp\", \"song.cpr\", \"Mix.song\", \"set.dawproject\" or \"score.mxl\".",
                "type": "string"
              },
              "multipart": {
                "description": "Force a multipart upload regardless of size (resumable per part).",
                "type": "boolean"
              },
              "part_numbers": {
                "description": "CONTINUATION: which part numbers (1-based) to sign now, ≤ 24 per call.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "project_key": {
                "description": "CONTINUATION of a multipart upload: the key the first call returned.",
                "type": "string"
              },
              "size_bytes": {
                "description": "The file's size in bytes (stat it). Decides single PUT vs multipart and sizes the parts.",
                "type": "number"
              },
              "upload_id": {
                "description": "CONTINUATION: the upload_id the first call returned.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
