        {
          "name": "doseedo_get_session",
          "title": "Read a DAW session",
          "description": "Read a DAW session as the arrangement an agent edits against: every track with its wire ids (track_id t_…, mixer strip channel_id ch_…), regions in BOTH beats and seconds with their MIDI notes (i, pitch, velocity, start_beats, duration_beats — i is what edit_midi_notes selects by), mixer (volume with dB, pan, mute), plugins with params[{param_id, name, value}] (set_device_param needs param_id) and sampler {mode, sample_seconds, plays_beats, …}, sends/output as ch_b_… ids, buses, tempo_bpm + tempo_map, time_signature + meter_map, key_signature when known, markers (marker_id, beat ABSOLUTE from bar 1), automation lanes, instrument, counts, length — and `sync` with live_edits:true|false + live_edits_reason (will an edit reach Logic now?). Field-by-field map: doseedo_edit_ops_reference {section:\"summary\"}. BUDGET (never cut mid-JSON): notes come inline when the selected tracks hold ≤200 notes, else regions carry note_count + notes_omitted:true — pass include_notes:true with tracks:[ids] for a track's notes; include_params:false / include_automation:false drop params / points; a result still too big is paginated by track with `truncated` + `next` (the exact args for the rest). Read-only. Pass the ids straight to doseedo_edit_session.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_automation": {
                "description": "Include automation lanes with points (default true). false keeps a lane count per track.",
                "type": "boolean"
              },
              "include_notes": {
                "description": "Include MIDI notes. Default: true when the selected tracks hold ≤200 notes in all, else false (regions then carry note_count + notes_omitted:true).",
                "type": "boolean"
              },
              "include_params": {
                "description": "Include plugin params (default true). false keeps param_count only.",
                "type": "boolean"
              },
              "session_id": {
                "description": "From doseedo_list_sessions.",
                "type": "string"
              },
              "tracks": {
                "description": "Only these tracks (track_id t_… or channel_id ch_…; a track name matches too). The rest of the session (tempo, markers, buses, sync) is always included.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
