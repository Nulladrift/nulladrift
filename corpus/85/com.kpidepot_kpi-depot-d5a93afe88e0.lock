{
  "lockfileVersion": 2,
  "subjects": {
    "com.kpidepot/kpi-depot": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://kpidepot.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "kpi-depot",
        "title": "KPI Depot",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "KPI Depot provides definitions, formulas, and industry benchmark data for 20,000+ corporate KPIs. Workflow: search_kpis to find a KPI's kpi_id (slug), get_kpi for full detail, get_benchmarks for benchmark data. Each benchmark response includes a citation URL.",
      "tools": [
        {
          "name": "get_benchmarks",
          "title": "Get KPI Benchmarks",
          "description": "Benchmark data for a single KPI (one kpi_id per call): benchmark values with descriptive metadata (industry, geography, time period, sample size) and full source attribution (source name, URL, excerpt, and comments). Each response includes a citation URL.",
          "inputSchema": {
            "properties": {
              "kpi_id": {
                "description": "The KPI slug from search_kpis. Single value only — no arrays or wildcards.",
                "type": "string"
              }
            },
            "required": ["kpi_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get KPI Benchmarks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a3c0c007596aa518057a71f914afde9d28d604fb9ce5a03d7417dda819520f48"
        },
        {
          "name": "get_kpi",
          "title": "Get KPI Details",
          "description": "Full intelligence for a single KPI: definition, standard formula, common pitfalls, improvement levers, related KPIs, the KPI groups it belongs to, and metadata about its available benchmarks (benchmark values themselves come from get_benchmarks). Takes the kpi_id (slug) returned by search_kpis.",
          "inputSchema": {
            "properties": {
              "kpi_id": {
                "description": "The KPI slug from search_kpis, e.g. \"asset-maintenance-ratio\".",
                "type": "string"
              }
            },
            "required": ["kpi_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get KPI Details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:beb6dfd46490c16bf3f7e7a8e9ce28f8a0ea32ebf3dac91b03a7a7a4a62dd0fb"
        },
        {
          "name": "search_kpis",
          "title": "Search KPIs",
          "description": "Search KPI Depot's library of 20,000+ corporate KPIs by keyword, with optional corporate-function and industry filters. Returns up to 10 relevance-ranked matches, each with a one-line definition, its benchmark count, and the KPI's page URL. When no KPI matches the full query, the response also includes close_matches (nearest KPIs, with which query words each missed) and related_groups (KPI groups whose names match the query, with their top KPIs). Use this first to find the kpi_id (slug) required by get_kpi and get_benchmarks.",
          "inputSchema": {
            "properties": {
              "function": {
                "description": "Optional corporate function filter.",
                "enum": ["Corporate Finance", "Corporate Marketing", "Corporate Strategy", "Customer Service", "Data Management & Analytics", "General Counsel", "Human Resources", "Industry-specific", "Information Technology", "Innovation Management", "Legal", "Operations Management", "Product Management", "Regulatory Compliance", "Sales Management", "Supply Chain Management"],
                "type": "string"
              },
              "industry": {
                "description": "Optional industry sector filter.",
                "enum": ["Business & Professional Services", "Consumer, Food, & Leisure", "Energy, Utilities, & Natural Resources", "Financial Services", "Healthcare & Life Sciences", "Industrials & Manufacturing", "Other, Cross-Industry, & Standards", "Public & Social Sector", "Real Estate, Infrastructure, & Built Environment", "Technology", "Telecommunications & Media", "Transportation, Mobility, & Logistics"],
                "type": "string"
              },
              "query": {
                "description": "Free-text search term, e.g. \"maintenance\", \"customer churn\", \"days sales outstanding\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search KPIs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:09ead199b1e803ec0c411581f875578dfa2ecb559237bbecd4bdba49d7abb33b"
        }
      ],
      "digest": "sha256:16fce81f3d212b5b5a29d831e8d93583ec7b2c5372af6211f9cfa64ac1e17616"
    }
  }
}
