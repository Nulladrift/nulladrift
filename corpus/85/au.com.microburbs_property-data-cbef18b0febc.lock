        {
          "name": "properties_calculators_land_tax",
          "title": "Calculators · Land tax on a property (at its land value)",
          "description": "**Annual land tax on this property if it were the owner's only taxable\nland** — the same calculation as `/calculators/land-tax`, with the state\ntaken from the property and the land value set to its latest land valuation\n(`land_value_source: land_valuation`).\n\nLand tax is charged on everything an owner holds in the state combined, so\nfor an owner with other land this understates the bill: add the land values\ntogether and use `/calculators/land-tax`. Priced as the calculator plus the\nland values. Land valuations are held for NSW properties today; elsewhere,\nand for a property with no valuation, the answer is `available: false`.\n\n**Price: 16¢ per call.**",
          "inputSchema": {
            "properties": {
              "assessment_date": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Any date in the land tax year (YYYY-MM-DD). Default: today in Sydney.",
                "examples": ["2026-11-06"]
              },
              "foreign": {
                "default": false,
                "description": "A foreign or absentee owner — adds the state's surcharge.",
                "type": "boolean"
              },
              "gnaf_id": {
                "examples": ["GANSW704074813"],
                "type": "string"
              },
              "owner_type": {
                "default": "individual",
                "description": "One of: individual, company, trust.",
                "examples": ["individual"],
                "type": "string"
              },
              "principal_residence": {
                "default": false,
                "description": "The owner lives here. Always exempt; returns 0 with the reason.",
                "type": "boolean"
              }
            },
            "required": ["gnaf_id"],
