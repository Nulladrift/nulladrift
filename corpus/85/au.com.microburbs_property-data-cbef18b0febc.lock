          "description": "Recorded road crashes by suburb and by council area per calendar year: fatal, serious-injury, other-injury and non-injury crashes, plus people killed and seriously injured, for every state and territory except the Northern Territory.\n\nCoverage: NSW, Victoria, Queensland, South Australia, Tasmania and the ACT: 2016-2025 (Queensland to 2024); Western Australia 2021-2025. About 15,000 suburbs and 520 council areas. No Northern Territory data. Current to 2026-11-07. Full description, field list and method: `/v1/datasets/road-crashes`.\n\n**Price: 5¢ per call.**",
