        },
        {
          "name": "geocode_suburb",
          "title": "Geocode · Suburb autocomplete",
          "description": "Autocomplete a partial suburb search string against the official suburb (SAL)\nlist. Use this before calling ``/v1/suburbs/{name}/...`` — those\nendpoints require a canonical SAL name in the path.\n\n**Free.**",
