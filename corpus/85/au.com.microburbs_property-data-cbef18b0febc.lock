          "title": "Economics · List economic series",
          "description": "Every economic series we hold — national statistics and the RBA — with its latest value.\nUse it to find a `series_id`, then fetch the history from\n`/economics/series/{series_id}`.\n\nDatasets: `cpi` (25 items incl. rents and new dwellings, 8 capitals +\nnational, monthly and quarterly), `cash-rate`, `mortgage-rates` (banks'\nindicator rates), `wpi` (wages), `building-approvals` (states + capital\ncities), `housing-lending` (owner-occupier, investor, first home buyers),\n`population`, `labour-force` and `dwelling-transfers` (median prices and\ncounts by capital city).\n\n**Price: 1¢ per call.**",
          "inputSchema": {
            "properties": {
              "dataset": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
