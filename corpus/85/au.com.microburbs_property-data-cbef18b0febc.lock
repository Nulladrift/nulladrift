          "description": "**Beta.** The figures behind this topic have not been validated against an independent source, so it is not sold at the same confidence as the other mesh-block topics. Every response says `beta: true` and carries a `beta_notice`.\n\n**Is this place safe?** Estimated crime rates for every mesh block around the property — all crime and eight types, per 100,000 residents a year — with where each block sits among the blocks in its suburb and nationally. From our mesh-block crime model, calibrated in November 2026 so each area's blocks add up to what police recorded there.\n\nOne entry per mesh block within 1,000 m of the property under `mesh_blocks`, nearest first, each with its `mb_code`, `distance_m`, `population` and `dwellings`. Blocks across suburb lines are included. Values only — the polygons come from `/properties/{gnaf_id}/context/mesh-blocks`.\n\nEvery field carries `provenance` — `measured` (at this block), `measured_wider_area` (measured for the SA1 or postcode and repeated on every block in it), `estimate` (our model) or `not_recorded` (not labelled yet) — plus `how`, one sentence on how the number was arrived at (empty when `not_recorded`).\n\n**Price: 20¢ per call.**",
