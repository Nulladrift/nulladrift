        {
          "name": "suburbs_finder_search",
          "title": "Search suburbs",
          "description": "Boolean-AND range filter over suburb metrics, single-column sort,\npaginated. Every row carries its `rank` — position in the ranked result\n(1 = top of the sort, out of `meta.total`). When sorting by a median or a\ngrowth, the actual value is also shown for the first 5 and last 5 rows of\nthe page; for any other suburb's number, call the per-field endpoint\n(market/*, forecast/*).\n\n**Paging:** a page is capped at 25 rows. A bigger `limit` is clamped, not\nrejected — so always read `meta`: `total` is the full match count,\n`has_more` says whether rows remain, and `next_offset` is the `offset` to\npass for the next page. A \"top 50\" needs two calls, each charged.\n\nFlat 30c.\n\n**Price: 30¢ per call.**",
          "inputSchema": {
            "properties": {
              "filter": {
                "description": "Range filter `fieldKey:min..max` (repeatable). Open-ended `min..` / `..max`. Valid fieldKeys: medianHousePrice, grossYield, medianRent, growthForecast4yr, growth10yrCagr, growth3yrCagr, rentGrowth3yr, soldAtLossPct, daysOnMarket, vacancyRate, unitMedianPrice, unitGrossYield, unitMedianRent, unitGrowthForecast4yr, unitGrowth10yrCagr, unitGrowth3yrCagr, unitRentGrowth3yr, unitSoldAtLossPct, unitDaysOnMarket, unitVacancyRate, stockOnMarket, monthsOfInventory, landValuePerSqm, lifestyleScore, safetyScore, hipScore, affluenceScore, renters, distanceCbdKm, publicHousingPct, overseasBornPct, welfareReliancePct, unemploymentPct, singleParentsPct, familyHouseholdsPct, privateSchoolPct, medianIncomeWeekly, communityDepthIndex, premiumRenovationIndex, homeOfficeIndex, tranquilityIndex, innovationEconomyIndex, alternativeLivingIndex, investorConcentration, negativeGearingExposure, mortgageStress. Fields with unit `percent` are FRACTIONS, not 0-100: 0.06 means 6%, so a gross yield of at least 6% is `grossYield:0.06..`. Apartment/unit metrics are the `unit`-prefixed keys (unitMedianPrice, unitGrossYield, unitMedianRent, …); the unprefixed market keys are houses. Unit data only exists where a suburb has a real unit market — coverage runs ~13-54% of suburbs depending on the field, so a unit filter implicitly excludes house-only suburbs.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "default": 25,
                "description": "Page size. Hard cap 25 — a larger value is clamped, NOT an error, and `meta.requested_limit` says so. For more than 25 results, page with `offset`.",
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Row offset — page through results more than 25 deep. `meta.next_offset` gives the value for the next page.",
                "type": "integer"
              },
              "property_type": {
                "default": "house",
                "description": "Legacy flag: 'unit' re-points the ten unprefixed house-market keys (medianHousePrice, grossYield, ...) at their unit column. It does NOT affect the explicit `unit`-prefixed keys, which are always units. Prefer the `unit` keys — they are visible in /fields and can be mixed with house keys in one query.",
                "type": "string"
              },
              "regions": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Comma-separated EXACT SA4 region names — call GET /v1/suburbs/finder/regions for the list. e.g. `Melbourne - Inner`, `Melbourne - West`. A metro name like `Melbourne` alone will NOT match; an unknown value 422s with the closest real names."
              },
              "sort": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Sort field. Prefix '-' for descending (highest first), e.g. `-growth10yrCagr`. Must be one of the field keys (see enum). Works on its own — you do NOT need a filter on the field you sort by; to rank without a threshold, pass `sort` and no filter. Only when `sort` is omitted does it default to the first filter field, desc. Apartment/unit metrics are the `unit`-prefixed keys (unitMedianPrice, unitGrossYield, unitMedianRent, …); the unprefixed market keys are houses. Unit data only exists where a suburb has a real unit market — coverage runs ~13-54% of suburbs depending on the field, so a unit filter implicitly excludes house-only suburbs.",
                "enum": ["medianHousePrice", "grossYield", "medianRent", "growthForecast4yr", "growth10yrCagr", "growth3yrCagr", "rentGrowth3yr", "soldAtLossPct", "daysOnMarket", "vacancyRate", "unitMedianPrice", "unitGrossYield", "unitMedianRent", "unitGrowthForecast4yr", "unitGrowth10yrCagr", "unitGrowth3yrCagr", "unitRentGrowth3yr", "unitSoldAtLossPct", "unitDaysOnMarket", "unitVacancyRate", "stockOnMarket", "monthsOfInventory", "landValuePerSqm", "lifestyleScore", "safetyScore", "hipScore", "affluenceScore", "renters", "distanceCbdKm", "publicHousingPct", "overseasBornPct", "welfareReliancePct", "unemploymentPct", "singleParentsPct", "familyHouseholdsPct", "privateSchoolPct", "medianIncomeWeekly", "communityDepthIndex", "premiumRenovationIndex", "homeOfficeIndex", "tranquilityIndex", "innovationEconomyIndex", "alternativeLivingIndex", "investorConcentration", "negativeGearingExposure", "mortgageStress", "-medianHousePrice", "-grossYield", "-medianRent", "-growthForecast4yr", "-growth10yrCagr", "-growth3yrCagr", "-rentGrowth3yr", "-soldAtLossPct", "-daysOnMarket", "-vacancyRate", "-unitMedianPrice", "-unitGrossYield", "-unitMedianRent", "-unitGrowthForecast4yr", "-unitGrowth10yrCagr", "-unitGrowth3yrCagr", "-unitRentGrowth3yr", "-unitSoldAtLossPct", "-unitDaysOnMarket", "-unitVacancyRate", "-stockOnMarket", "-monthsOfInventory", "-landValuePerSqm", "-lifestyleScore", "-safetyScore", "-hipScore", "-affluenceScore", "-renters", "-distanceCbdKm", "-publicHousingPct", "-overseasBornPct", "-welfareReliancePct", "-unemploymentPct", "-singleParentsPct", "-familyHouseholdsPct", "-privateSchoolPct", "-medianIncomeWeekly", "-communityDepthIndex", "-premiumRenovationIndex", "-homeOfficeIndex", "-tranquilityIndex", "-innovationEconomyIndex", "-alternativeLivingIndex", "-investorConcentration", "-negativeGearingExposure", "-mortgageStress"]
