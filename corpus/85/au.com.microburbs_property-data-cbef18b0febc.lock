          "title": "Economics · CPI history",
          "description": "Consumer Price Index: the index number with its period and annual %\nchange, one row per quarter or month. Covers all groups, the underlying\nmeasures (trimmed mean, weighted median), the 11 expenditure groups, and\nthe housing components property people ask about — rents, new dwellings,\nproperty rates, maintenance, utilities, electricity and insurance — for the\neight capitals and Australia.\n\nCoverage follows the published CPI: quarterly is national for every\nitem (all groups from 1948) plus all groups for each capital; monthly has\nevery item for Australia and each capital (most from 2024; rents from 2022;\nnew dwellings and property rates from 2017). A combination we do not hold\nreturns `available: false`.\n\n**Price: 2¢ per call.**",
