                "minimum": 0,
                "type": "integer"
              },
              "order": {
                "default": "desc",
                "description": "Sort direction.",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "property_type": {
                "anyOf": [
                  {
                    "enum": ["house", "unit"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "`house` (houses, cottages, acreage) or `unit` (apartments, units, townhouses, villas, terraces, duplexes, studios). Omit for both."
              },
              "radius_m": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Radius in metres around `lat`/`lon`, 100–10000."
              },
              "sa3": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "An SA3 name: searches the suburbs whose main SA3 it is (e.g. `Lake Macquarie - East`)."
              },
              "sa4": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "An SA4 name, as `/v1/sa4/list` returns it (e.g. `Newcastle and Lake Macquarie`)."
              },
              "sort": {
                "default": "newest",
                "description": "Sort key. Listings without the value sort last either way.",
                "enum": ["newest", "price", "bedrooms", "land_size"],
                "type": "string"
              },
              "status": {
                "default": "sale",
                "description": "`sale` for listings on the market now (default), `rent` for rentals live now.",
                "enum": ["sale", "rent"],
                "type": "string"
              },
              "suburbs": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Comma-separated suburb names, up to 20 — spelt as the suburb endpoints take them (`Belmont North`, `St Kilda (Vic.)`).",
                "examples": ["Belmont North,Belmont (NSW)"]
              },
              "verbose": {
                "default": false,
                "description": "Include the agent's full ad copy in `attributes.description`. Off by default — it averages ~1.5 KB per listing.",
                "type": "boolean"
              }
            },
            "required": [],
            "type": "object"
          },
