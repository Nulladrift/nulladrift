          "description": "**What are the homes like?** For every mesh block in the suburb: how many properties, the share of houses and strata, median bedrooms, bathrooms and building size, building height, and recent construction.\n\nOne entry per mesh block in the suburb under `mesh_blocks`, each with its `mb_code`, `population` and `dwellings`. Values only — the matching polygons come from `/shapes/mesh-blocks`.\n\nEvery field carries `provenance` — `measured` (at this block), `measured_wider_area` (measured for the SA1 or postcode and repeated on every block in it), `estimate` (our model) or `not_recorded` (not labelled yet) — plus `how`, one sentence on how the number was arrived at (empty when `not_recorded`).",
