        {
          "name": "calculators_land_tax",
          "title": "Calculators · Land tax calculator",
          "description": "**Annual land tax on land you own in a state or territory**, with the\ntax-free threshold, each rate band and any foreign owner surcharge shown.\n\n**Who pays it:** owners of land that isn't their home — investors with rental\nproperties, holiday homes, vacant land, companies and trusts. It is charged\nevery year on the combined land value of everything the owner holds in the\nstate, so two $800,000 blocks cost more than twice one.\n\n**What it covers:** the general scale and threshold, the company / trust\nrates or loss of the threshold where a state has them, any premium band, and\nthe foreign / absentee owner surcharge. The Northern Territory has no land\ntax; the ACT charges it on rented-out homes. The land tax year in force on\n`assessment_date` is used, named in `rates`.\n\n**Caveats:** an estimate, not an assessment. Pass the land value (council or\nstate valuation), not the market price of the property — they differ a lot.\nPrimary production, charities, special trusts and part-year ownership have\nrules not modelled here; see `caveats`. The home exemption is a flag, not a\ncalculation of mixed-use land.\n\n**Price: 1¢ per call.**",
          "inputSchema": {
            "properties": {
              "assessment_date": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Any date in the land tax year you want (YYYY-MM-DD). Default: today in Sydney.",
                "examples": ["2026-11-06"]
              },
              "foreign": {
                "default": false,
                "description": "A foreign or absentee owner — adds the state's surcharge.",
                "type": "boolean"
              },
              "land_value": {
                "description": "Total taxable land value you hold in the state, in dollars — the unimproved / site value of every parcel added together, not the property prices. Leave your own home out (it is exempt).",
                "examples": [1500000],
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "owner_type": {
                "default": "individual",
                "description": "One of: individual, company, trust. Companies and trusts pay higher rates or lose the threshold in some states.",
                "examples": ["individual"],
                "type": "string"
              },
              "principal_residence": {
                "default": false,
                "description": "The land is the owner's home. Always exempt; returns 0 with the reason.",
                "type": "boolean"
              },
              "state": {
                "description": "State or territory: NSW, VIC, QLD, WA, SA, TAS, ACT, NT.",
                "examples": ["NSW"],
                "type": "string"
              }
            },
            "required": ["land_value", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculators · Land tax calculator"
          },
          "behavior": {
