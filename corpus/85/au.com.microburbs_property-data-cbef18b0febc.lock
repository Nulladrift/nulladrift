        {
          "name": "listings_images",
          "title": "Listings · Listing photos",
          "description": "The photos of one listing, as signed links you can download for 15 minutes.\n\n**What you get.** Every photo we hold for the listing, main photo first, in the\nsize you ask for, each as a link to the WebP file on our image store. The links\nneed no key and expire at `expires_at`: download or cache the photos inside that\nwindow, and call again for fresh links. One call covers the whole gallery at a\nflat price per listing, priced separately from the listing data because photos\nare heavy.\n\n**Which photos.** The same ones our listing page shows: the agency's own\nphotography, never a listing portal's, and never logos, banners or office\nshots. A photo we have not copied to our store yet is left out (new listings'\nphotos usually arrive within a day). A listing whose details we withhold — seen\non only one major portal — has no photos here, and no `listing_id` elsewhere.\n\nGet a `listing_id` from `/v1/listings/search`, the SA4 off-market bulk, or the\nsuburb for-sale / for-rent endpoints.\n\nExample: `/v1/listings/cc74291e277ad596d6c41a6ce07077f1/images?size=large`\n\n**Price: 5¢ per call.**",
          "inputSchema": {
            "properties": {
              "listing_id": {
                "description": "The listing's `listing_id`, from any listings endpoint.",
                "examples": ["cc74291e277ad596d6c41a6ce07077f1"],
                "pattern": "^[0-9a-f]{32}$",
                "type": "string"
              },
              "size": {
                "default": "medium",
                "description": "small ≈ 640 px wide, medium ≈ 1200 px (default), large up to 2048 px.",
                "enum": ["small", "medium", "large"],
                "type": "string"
              }
            },
            "required": ["listing_id"],
            "type": "object"
