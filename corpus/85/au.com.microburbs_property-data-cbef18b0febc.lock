        {
          "name": "calculators_first_home",
          "title": "Calculators · First home buyer grants and concessions",
          "description": "**What being a first home buyer is worth on one purchase**: every first\nhome grant in the state (eligible or not, and why), the stamp duty saving\nagainst an ordinary owner-occupier, and the total.\n\n**Who it's for:** first home buyers — Australian citizens or permanent\nresidents buying a home to live in, who have never owned a home in Australia.\nGrants mostly go to new homes under a price cap; duty exemptions and\nconcessions mostly apply to established homes and land too, up to a cap.\n\n**What it covers:** the First Home Owner Grant and any other first-home cash\ngrant the state pays, and the first home duty exemption / concession (via the\nsame rules as `/calculators/stamp-duty`, shown line by line in\n`duty_breakdown`). For `vacant_land`, the grant is assessed as land bought to\nbuild a new home on; the cap on land plus build is spelled out in `detail`.\n\n**Caveats:** eligibility also depends on residence requirements (moving in\nwithin a year and living there 6–12 months), every buyer's history and some\nincome tests — this answers on price, property type and date. Federal\nschemes (deposit guarantees, super savings) are not included. See\n`caveats`.\n\n**Price: 1¢ per call.**",
          "inputSchema": {
            "properties": {
              "contract_date": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Contract date (YYYY-MM-DD); picks the rates in force on that day. Default: today in Sydney.",
                "examples": ["2026-11-06"]
              },
              "dependants": {
                "default": 0,
                "description": "Dependent children — raises an income-tested scheme's limit (ACT).",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "household_income": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Gross household income for the past year — used by income-tested schemes (ACT). Omit and we assume you meet the income test.",
                "examples": [150000]
              },
              "off_the_plan": {
                "default": false,
                "description": "Bought off the plan. Changes the answer only where a state has an off-the-plan concession.",
                "type": "boolean"
              },
              "price": {
                "description": "Purchase price in dollars (for vacant land: the land price).",
                "examples": [650000],
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "property_type": {
                "default": "established",
                "description": "`established` (an existing home), `new` (a new home or off-the-plan, never lived in), or `vacant_land` (land to build a home on).",
                "examples": ["established"],
                "type": "string"
              },
              "regional": {
                "default": false,
                "description": "Outside the capital city (WA: outside Perth and Peel; also the WA grant's northern cap). Ignored where a state draws no such line.",
                "type": "boolean"
              },
              "state": {
                "description": "State or territory: NSW, VIC, QLD, WA, SA, TAS, ACT, NT.",
                "examples": ["NSW"],
                "type": "string"
              }
            },
            "required": ["price", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculators · First home buyer grants and concessions"
