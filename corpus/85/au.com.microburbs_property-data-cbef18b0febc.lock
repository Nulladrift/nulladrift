        {
          "name": "suburbs_lifestyle_pois",
          "title": "Suburb · Amenities",
          "description": "Shown in the suburb report as the 'Amenities' card and map layer in the\nLifestyle section.\n\nEvery named venue / amenity in the suburb as GeoJSON Point features, plus a\nper-category count.\n\nEach point carries `name`, a broad `category` (Restaurant / Cafe, Shopping,\nHealth, Entertainment, Sport & Fitness, Education, …) and a finer `subtype`\n(e.g. `pub`, `bar`, `cafe`, `restaurant`, `gym`, `supermarket`, `school`,\n`pharmacy`). This is the endpoint for \"what / how many <venue type> are in\nthis suburb\" and \"name the pubs / cafes / gyms in X\" — filter or count the\nfeatures on `subtype`, and read real venue names from `name`. The top-level\n`categories` array gives the broad-category counts without walking the list.\n\nUnpaged by default. Big suburbs are big — Sydney is ~3.7 MB of features — so\npass `limit`/`offset` (or narrow with `category`) when you don't need them\nall. `count` and `categories` always describe the whole suburb, so paging\nnever hides the totals. Flat price per call regardless of page size.",
          "inputSchema": {
            "properties": {
              "category": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Only this display category (e.g. `Shopping`). Case-insensitive."
              },
              "limit": {
                "anyOf": [
                  {
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Features to return (default: all)."
              },
              "offset": {
                "default": 0,
                "description": "Feature offset — page with `limit`.",
                "minimum": 0,
                "type": "integer"
              },
              "suburb_name": {
                "type": "string"
              }
            },
            "required": ["suburb_name"],
            "type": "object"
          },
