          "title": "Crime by mesh block — estimated rates and rank in suburb (by suburb) (beta)",
          "description": "**Beta.** The figures behind this topic have not been validated against an independent source, so it is not sold at the same confidence as the other mesh-block topics. Every response says `beta: true` and carries a `beta_notice`.\n\n**Is this place safe?** Estimated crime rates for every mesh block in the suburb — all crime and eight types, per 100,000 residents a year — with where each block sits among the blocks in its suburb and nationally. From our mesh-block crime model, calibrated in November 2026 so each area's blocks add up to what police recorded there.\n\nOne entry per mesh block in the suburb under `mesh_blocks`, each with its `mb_code`, `population` and `dwellings`. Values only — the matching polygons come from `/shapes/mesh-blocks`.\n\nEvery field carries `provenance` — `measured` (at this block), `measured_wider_area` (measured for the SA1 or postcode and repeated on every block in it), `estimate` (our model) or `not_recorded` (not labelled yet) — plus `how`, one sentence on how the number was arrived at (empty when `not_recorded`).\n\n**Price: 20¢ per call.**",
