        {
          "name": "suburbs_demographics_federal_election_results",
          "title": "Suburb · Federal election results",
          "description": "How each suburb voted at the 2019, 2022 and 2025 federal elections (House of Representatives): first-preference share by party, two-party-preferred Labor v Coalition, swings, informal vote and the electorate. Also state and national totals with turnout.\n\nCoverage: About 7,500 suburbs per election (every suburb with at least 100 allocated formal votes), all 8 states and territories, and Australia; federal elections 2019, 2022 and 2025. Current to 2025-05-03. Full description, field list and method: `/v1/datasets/election-results-federal`.\n\n**Price: 5¢ per call.**",
          "inputSchema": {
            "properties": {
              "fields": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Comma-separated subset of: formal_votes, informal_votes, informal_pct, labor_votes, coalition_votes, greens_votes, one_nation_votes, independent_votes, other_votes, labor_pct, coalition_pct, greens_pct, one_nation_pct, independent_pct, other_pct, tpp_labor_votes, tpp_coalition_votes, tpp_labor_pct, tpp_coalition_pct, labor_swing, coalition_swing, greens_swing, one_nation_swing, independent_swing, tpp_labor_swing, main_division, main_division_share_pct, divisions, enrolment, turnout_pct. Omit for all."
              },
              "from": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "First period to include: 2020, 2020-Q3, 2020-07 or 2020-07-01."
              },
              "suburb_name": {
                "description": "Suburb name exactly as /v1/suburbs/list returns it, e.g. `Bondi` or `St Kilda (Vic.)`.",
                "examples": ["Bondi"],
                "type": "string"
              },
              "to": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Last period to include, same formats as `from`."
              }
            },
