        {
          "name": "suburbs_list",
          "title": "List suburbs",
          "description": "List Australian suburbs (SALs). Always returns `{suburb, state}`\nper row so SAL-name collisions across states are unambiguous.\n\nWith no filter you get 1000 suburbs at a time, alphabetically — page\nwith `offset` (1000, 2000, …) for the rest. Pass any of the filters to narrow:\nstate / lga / sa4 / sa3 / postcode / q (name search). Filters\ncombine (AND). Flat cost regardless of how many rows come back.\n\n**Name search (`q`) is typo-tolerant.** It tries an exact match, then\nsubstring, then a fuzzy near-miss, and returns `match`\n(`exact` / `contains` / `fuzzy`) and `score` on every row so you can\nsee which happened.\n\n**Always tell the user which suburb you resolved to, and its state,\nbefore quoting numbers for it.** A fuzzy match is a suggestion, not a\nconfirmation — `rokeby` is one letter from Kokeby in Western Australia\nand Rokeby exists in both Tasmania and Victoria. If more than one\ncandidate is plausible, ask rather than pick.\n\nWhen `q` is combined with `state`, the state is a **preference, not a\nfilter**: in-state candidates rank first, but a suburb of that name in\nanother state is still returned rather than hidden, so a near-miss\nbecomes \"Seaview is in Victoria, not Tasmania\" instead of \"no data\".\nEvery other filter stays a strict AND.\n\n**Free.**",
          "inputSchema": {
            "properties": {
              "lga": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Filter by Local Government Area name."
              },
              "offset": {
                "default": 0,
                "description": "Row offset for the unfiltered list, which comes 1000 suburbs at a time: pass 1000, 2000, … for the next pages (a page shorter than 1000 is the last). Ignored with `q`.",
                "minimum": 0,
                "type": "integer"
              },
              "postcode": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Filter by 4-digit postcode (POA)."
              },
              "q": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Suburb-name search. Matches exactly, then by substring, then by fuzzy near-miss so a typo still resolves ('devenport' -> Devonport). Each row comes back with `match` and `score` saying how it was found."
              },
              "sa3": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Filter by SA3 name."
              },
              "sa4": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Filter by SA4 name."
              },
              "state": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Filter by state / territory (e.g. NSW, VIC, 'New South Wales')."
              }
            },
            "required": [],
            "type": "object"
          },
