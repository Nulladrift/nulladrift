      "instructions": "Microburbs Australian property data: several hundred endpoints, reached through three tools.\n\n1. `search_endpoints(query)` — describe what you want in plain words (\"median rent over time\", \"flood risk for a house\", \"japanese ancestry\"). Returns the best endpoints with their name, path, price in cents and parameters. Free.\n2. `describe_endpoint(endpoint)` — the full description, every parameter and the response field names for one endpoint. Free. Use it when the search row is not enough.\n3. `call_endpoint(endpoint, params)` — run it. `endpoint` is the name from the search (e.g. `suburbs_market_median_rent_series`) or its path; `params` holds the path and query parameters by name, e.g. {\"suburb_name\": \"Bondi\"}. Billed exactly like the REST call; the result carries `_cost_cents`.\n\nNames follow the path: `/v1/suburbs/{suburb_name}/market/median-rent` is `suburbs_market_median_rent`. Suburb endpoints start `suburbs_`, property endpoints `properties_`, then `lga_`, `sa4_`, `mbs_` (mesh blocks), `postcodes_`, `economics_`, `calculators_`, `datasets_`.\n\nSuburb endpoints are keyed by the exact official suburb name (SAL), e.g. `Burwood (NSW)` — many carry a state suffix. Given free text or a bare name, call `geocode_suburb` first and use the `area_name` it returns; nothing else guesses a state or corrects typos. Property endpoints are keyed by GNAF id — resolve an address with `geocode_address`.\n\nTo rank or shortlist suburbs on numeric criteria (growth, yield, price), call `suburbs_finder_search` rather than fetching suburbs one at a time.\n\nWITHOUT A KEY (the free sandbox), `geocode_suburb` still works nationwide. What is limited is the DATA: only these nine suburbs answer, one per state and territory.\n\n  Bondi · Belmont North · St Kilda (Vic.) · Fortitude Valley · Subiaco ·\n  Unley · Sandy Bay · Kambah · Nightcliff\n\nPass the name exactly as written — `St Kilda (Vic.)`, not `St Kilda`. Any other suburb returns 403 naming that list. `geocode_address` is billed and also returns 403, so property endpoints need one of the sample GNAF ids documented at https://www.microburbs.com.au/developers/mcp — or a key from https://www.microburbs.com.au/developers/keys for the whole country.\n\nAlso open without a key: every `economics_*` endpoint, `lga_list` and `sa4_list`, the LGA and SA4 endpoints for the councils and SA4s those nine suburbs sit in, the mesh-block endpoints for blocks inside them (`mbs_list` with one of the nine as `sal`), the postcode endpoints for postcode `2026` only (Bondi's), and the three plain calculators (`calculators_stamp_duty`, `calculators_land_tax`, `calculators_first_home`) for every state.\n",
      "tools": [
        {
          "name": "call_endpoint",
          "title": "Call an endpoint",
          "description": "Call any Microburbs endpoint. `endpoint` is a name from\n`search_endpoints` (e.g. \"suburbs_market_median_rent_series\") or its\npath (\"/v1/suburbs/{suburb_name}/market/median-rent-series\", or filled\nin: \"/v1/suburbs/Bondi/market/median-rent-series\"). `params` holds the\npath and query parameters by name, e.g. {\"suburb_name\": \"Bondi\"}.\nReturns the endpoint's JSON, billed exactly as the REST call (see\n`_cost_cents`); an unknown endpoint or parameter costs nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "endpoint": {
                "type": "string"
              },
              "params": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
