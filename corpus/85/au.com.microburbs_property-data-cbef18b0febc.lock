        {
          "name": "economics_cpi",
          "title": "Economics · CPI history",
          "description": "Consumer Price Index: the index number with its period and annual %\nchange, one row per quarter or month. Covers all groups, the underlying\nmeasures (trimmed mean, weighted median), the 11 expenditure groups, and\nthe housing components property people ask about — rents, new dwellings,\nproperty rates, maintenance, utilities, electricity and insurance — for the\neight capitals and Australia.\n\nCoverage follows the published CPI: quarterly is national for every\nitem (all groups from 1948) plus all groups for each capital; monthly has\nevery item for Australia and each capital (most from 2024; rents from 2022;\nnew dwellings and property rates from 2017). A combination the publisher does not\npublish returns `available: false`.\n\n**Price: 2¢ per call.**",
          "inputSchema": {
            "properties": {
              "frequency": {
                "default": "quarterly",
                "description": "quarterly (from 1948) or monthly (from 2024).",
                "type": "string"
              },
              "from": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Start of range (inclusive): 2020-Q1, 2020-01, 2020-01-15 or 2020.",
                "examples": ["2020-Q1"]
              },
              "item": {
                "default": "all-groups",
                "description": "One of: all-groups, trimmed-mean, weighted-median, excluding-housing, excluding-volatile-items, tradables, non-tradables, food, alcohol-tobacco, clothing-footwear, housing, furnishings-household, health, transport, communication, recreation-culture, education, insurance-financial, rents, new-dwellings, property-rates, dwelling-maintenance, utilities, electricity, insurance.",
                "type": "string"
              },
              "region": {
                "default": "australia",
                "description": "One of: australia, sydney, melbourne, brisbane, adelaide, perth, hobart, darwin, canberra.",
                "type": "string"
              },
              "seasonally_adjusted": {
                "default": false,
                "description": "Seasonally adjusted where the publisher issues it (mostly national). Trimmed mean and weighted median are only published seasonally adjusted.",
                "type": "boolean"
              },
              "to": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "End of range (inclusive), same formats as `from`.",
