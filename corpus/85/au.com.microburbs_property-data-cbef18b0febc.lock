        {
          "name": "listings_off_market",
          "title": "Off-market listings in an SA4 (bulk)",
          "description": "Every off-market listing in an SA4, in pages of up to 250 — the bulk way to\ntake a whole region's off-market stock.\n\n**Off market** means our Property Finder's rule: the listing is on none of the\nmajor listing portals, the agency's own site is a source (an aggregator\nrepublishing someone else's listing does not count), and our evidence that it\nis still live is current. These are listings a portal search will not show you.\n\nSame rows as the suburb listings endpoints and `/v1/listings/search`, newest\nfirst, with `total`, `next_offset` and the same withholding rule. `sa4` is\nspelt as `/v1/sa4/list` returns it, e.g. `Newcastle and Lake Macquarie`.\n`status=rent` for off-market rentals. For off-market listings in a smaller\narea, or with filters, use `/v1/listings/search?off_market=true`.\n\nExample: `/v1/listings/off-market?sa4=Newcastle and Lake Macquarie`\n\n**Price: 300¢ per call.**",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 250,
                "description": "Rows per page, at most 250. `total` always reports the full match count.",
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Row offset for paging. `next_offset` in the response is the value for the next page (null on the last). Each page is a separate call.",
                "minimum": 0,
                "type": "integer"
              },
              "sa4": {
                "description": "The SA4, spelt as `/v1/sa4/list` returns it.",
                "examples": ["Newcastle and Lake Macquarie"],
                "type": "string"
              },
              "status": {
                "default": "sale",
                "description": "`sale` for listings on the market now (default), `rent` for rentals live now.",
                "enum": ["sale", "rent"],
                "type": "string"
              },
              "verbose": {
                "default": false,
                "description": "Include the agent's full ad copy in `attributes.description`. Off by default — it averages ~1.5 KB per listing.",
                "type": "boolean"
              }
            },
            "required": ["sa4"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Off-market listings in an SA4 (bulk)"
