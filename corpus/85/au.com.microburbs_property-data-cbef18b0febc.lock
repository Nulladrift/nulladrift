        {
          "name": "geocode_address",
          "title": "Geocode · Address search (to GNAF)",
          "description": "Resolve a freeform address string to candidate GNAF identifiers.\n\nUse this before calling any ``/v1/properties/{gnaf_id}/...`` route —\nthose endpoints require a GNAF in the path. Returns up to 10\ncandidates, ranked by Meilisearch score.\n\n**Price: 1¢ per call.**",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Freeform address string.",
                "examples": ["27 Arlington Street, Belmont North NSW"],
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
