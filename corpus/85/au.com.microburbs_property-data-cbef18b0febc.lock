      "instructions": "Microburbs Australian property data.\n\nSuburb tools are keyed by the exact official suburb name (SAL), e.g.\n`Burwood (NSW)` — many suburbs carry a state suffix. Given free text or a bare\nname, call `geocode_suburb` first and use the `area_name` it returns. Those\ntools do not guess a state or correct typos; `geocode_suburb` is typo-tolerant\nand is where a name gets resolved.\n\nProperty tools are keyed by GNAF id — resolve an address with `geocode_address`.\n\nTo rank or shortlist suburbs on numeric criteria (growth, yield, price), use\n`suburbs_finder_search` rather than fetching suburbs one at a time.\n\nWITHOUT A KEY (the free sandbox), `geocode_suburb` still works — resolving a\nsuburb name is free nationwide, so start there as usual. What is limited is the\nDATA: only these nine suburbs answer, one per state and territory.\n\n  Bondi · Belmont North · St Kilda (Vic.) · Fortitude Valley · Subiaco ·\n  Unley · Sandy Bay · Kambah · Nightcliff\n\nPass the name exactly as written — the suffix is part of it, so\n`St Kilda (Vic.)`, not `St Kilda`. Any other suburb returns 403 naming that\nlist rather than data. `geocode_address` is billed and also returns 403, so\nproperty tools need one of the sample GNAF ids documented at\nhttps://www.microburbs.com.au/developers/mcp — or a key from\nhttps://www.microburbs.com.au/developers/keys for the whole country.\n\nAlso open without a key: every `economics_*` tool (national series), `lga_list`\nand `sa4_list`, the LGA and SA4 tools for the councils and SA4s those nine\nsuburbs sit in, and the mesh-block tools for blocks inside them (`mbs_list`\nwith one of the nine as `sal`).\n",
      "tools": [
        {
          "name": "area_stats_fields",
          "title": "Area Statistics · Search area-statistics fields",
          "description": "Discover which statistical fields exist. Free (0c). Fuzzy, token-based\nmatching covers table topics and clean column labels as well as terse field\ncodes. Common natural-language plurals and synonyms are handled, so\nthe verbatim `query=couples with children` discovers the exact 2021\nfamily-composition count fields rather than substituting the broader\n`census_family_households` metric. Use the returned field code(s) with the\npriced `/area-stats/SAL/{suburb}/values` route. ~17k fields available.\n\n**Free.**",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 50,
                "description": "Max fields to return.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Fuzzy search over field names/codes, table topics and column labels (e.g. 'total population', 'couple family children', 'tenure owned outright', or 'median rent'). Omit to list.",
                "examples": ["couple family children"]
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Area Statistics · Search area-statistics fields"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": ["Area Statistics"]
            },
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["api"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:28b2a03d9e6fadb231ce59e1bb64c648eb9db62f97f8eea0a98deb41a9722864"
        },
