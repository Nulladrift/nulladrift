              }
            ]
          },
          "digest": "sha256:6c48e2fb0ebeed6d86a0dfe0ea8569b0950a36ebd67274abeb469d6dc1752024"
        },
        {
          "name": "search_endpoints",
          "title": "Search endpoints",
          "description": "Find the Microburbs endpoint that answers a question, in plain words —\ne.g. \"median rent over time\", \"is this house in a flood zone\", \"schools\nnear 10 Smith St\", \"japanese ancestry\". Typo-tolerant, knows synonyms,\nmatches response field names. Returns the best endpoints first, each with\nits `name` (pass it to `call_endpoint`), REST path, price in cents and\nparameters; a dataset's result also has `coverage` (measured or modelled,\ngeography, states, areas covered, time span). Optional `section` keeps only\none docs section, e.g. \"Suburb - Crime\" or just \"crime\"; `level` (suburb,\nlga, postcode, sa2, block, property, points...), `state` (nsw, vic, ...)\nand `period` (a year, e.g. \"2019\") keep only datasets that match. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "level": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "limit": {
                "default": 5,
                "type": "integer"
              },
              "period": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "query": {
                "type": "string"
              },
              "section": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "state": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
