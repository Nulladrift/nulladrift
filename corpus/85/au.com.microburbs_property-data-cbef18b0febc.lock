          "title": "Suburb · For sale",
          "description": "Shown in the suburb report as the 'For sale' table tab in the Properties\nsection.\n\nCurrent for-sale listings in the suburb, with address, price and the\nadvertised price line (with its low/high range when one is stated),\nbeds/baths/cars, land and floor area, coordinates, an `off_market` flag, and\nthe selling agency with its own listing page and named agents.\n\nA listing seen on only one major portal, with no agency page of its own,\nkeeps its address, type and agency name but not its advertised facts: the\nsame rule our property finder applies.\n\n`total` is the full number on the market (computed before paging), so a\ncount is accurate even when the rows are capped. Page through every listing\nwith `limit`/`offset` — `next_offset` is the next page's offset, null on the\nlast page; order is newest listing first and stable across pages. Each page\nis one call at a flat price. Set `verbose=true` for the agent's full\ndescription text; set `off_market=true` for off-market listings only.",
