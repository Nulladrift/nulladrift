        },
        {
          "name": "calculators_stamp_duty",
          "title": "Calculators · Stamp duty calculator",
          "description": "**Stamp duty (transfer duty) on a residential purchase in any state or territory**,\nwith every step shown: the general-rate duty, each concession or exemption\nthat applies, and the foreign purchaser surcharge.\n\n**Who pays it:** the buyer, once, at settlement (or within the state's\ndeadline after it). It is usually the biggest up-front cost after the\ndeposit, and it varies widely with the buyer: the same home can cost a first\nhome buyer nothing under a state's exemption cap and a foreign buyer several\ntimes the ordinary amount.\n\n**What it covers:** the general scale; owner-occupier / home concessions;\nfirst home buyer exemptions and concessions for established homes, new homes\nand vacant land; off-the-plan, pensioner and income-tested schemes where a\nstate has them; and the foreign purchaser surcharge. Rates are those in force\non `contract_date` — each answer names the rates table version and the dates\nit applies.\n\n**Caveats:** an estimate for planning, not a duty assessment. It assumes one\nbuyer (or all buyers alike) and a home, not commercial or primary-production\nland. Mortgage and transfer registration fees are separate and not included.\nEach response lists what it assumed in `caveats`. For first home buyers,\n`/calculators/first-home` sets the duty saving next to the grants.\n\n**Price: 1¢ per call.**",
          "inputSchema": {
            "properties": {
              "buyer_type": {
                "default": "owner_occupier",
                "description": "`first_home` (first home buyer who will live in it), `owner_occupier` (will live in it, not a first home), `investor`, or `foreign` (a foreign person under state law — surcharge duty applies, no home concessions).",
                "examples": ["first_home"],
                "type": "string"
              },
              "contract_date": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Contract date (YYYY-MM-DD); picks the rates in force on that day. Default: today in Sydney.",
                "examples": ["2026-11-06"]
              },
              "dependants": {
                "default": 0,
                "description": "Dependent children — raises an income-tested scheme's limit (ACT).",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "household_income": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Gross household income for the past year — used by income-tested schemes (ACT). Omit and we assume you meet the income test.",
                "examples": [150000]
              },
              "off_the_plan": {
                "default": false,
                "description": "Bought off the plan. Changes the answer only where a state has an off-the-plan concession.",
                "type": "boolean"
              },
              "pensioner": {
                "default": false,
                "description": "Holds an eligible pension or concession card. Changes the answer only where a state has a pensioner concession.",
                "type": "boolean"
              },
              "price": {
                "description": "Purchase price (or market value, if higher) in dollars.",
                "examples": [850000],
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "property_type": {
                "default": "established",
                "description": "`established` (an existing home), `new` (a new home or off-the-plan, never lived in), or `vacant_land` (land to build a home on).",
                "examples": ["established"],
                "type": "string"
              },
              "regional": {
                "default": false,
                "description": "Outside the capital city (WA: outside Perth and Peel; also the WA grant's northern cap). Ignored where a state draws no such line.",
                "type": "boolean"
              },
              "state": {
                "description": "State or territory: NSW, VIC, QLD, WA, SA, TAS, ACT, NT.",
                "examples": ["NSW"],
                "type": "string"
              }
            },
            "required": ["price", "state"],
            "type": "object"
