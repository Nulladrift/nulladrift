        {
          "name": "suburbs_sales_recent",
          "title": "Suburb · Recent sales",
          "description": "Shown in the suburb report as the 'Recent sales' table tab in the Properties\nsection.\n\nProperties sold in the suburb, with beds/baths/land size, sale price and\ndate, and coordinates, newest sale first.\n\n**Default:** the last 3 years, one row per property (its most recent sale).\n\n**Full history:** pass `from` and/or `to` (YYYY-MM-DD) for every sale in that\nrange — one row per sale, so a property sold twice appears twice. History\ndepth varies by state: NSW from 2001, Victoria, Queensland, WA and SA from\nabout 2010, Tasmania from about 2014, ACT and NT from 2019.\n\nPaginated with `limit`/`offset`: `total` reports how many sales match\n(counted before paging) and `next_offset` is the offset of the next page\n(null on the last one). Order is stable — newest first, ties broken by\nproperty — so paging never repeats or skips a sale. Each page is one call,\nat a flat price regardless of page size.\n\n**Price: 20¢ per call.**",
          "inputSchema": {
            "properties": {
              "from": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Earliest sale date to include (YYYY-MM-DD, inclusive). Passing `from` or `to` returns EVERY sale in the range, one row per sale, instead of the default last-3-years feed.",
                "examples": ["2006-01-01"]
              },
              "limit": {
                "default": 20,
                "description": "Sales to return (default 20, max 200).",
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Row offset — page through the feed with `limit`. `next_offset` in the response is the value for the next page.",
                "type": "integer"
              },
              "suburb_name": {
                "type": "string"
              },
              "to": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Latest sale date to include (YYYY-MM-DD, inclusive). Default: today.",
                "examples": ["2015-12-31"]
              }
            },
            "required": ["suburb_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Suburb · Recent sales"
