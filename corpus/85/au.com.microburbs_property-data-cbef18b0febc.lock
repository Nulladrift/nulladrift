        {
          "name": "area_stats_values",
          "title": "Area statistics for a region",
          "description": "Statistical field values for one region. Pass `fields` — 1 to 5 field\ncodes (from /fields) — to fetch.\n\nAt SAL level, `mode=sa1` switches from the suburb-aggregate value to a\nper-SA1 breakdown — every SA1 that falls inside the suburb, each with its\nown values.\n\n**Price: 3¢ per call.**",
          "inputSchema": {
            "properties": {
              "fields": {
                "description": "Comma-separated field codes (from /fields). Required, 1-5 per call.",
                "examples": ["Median_age_persons"],
                "type": "string"
