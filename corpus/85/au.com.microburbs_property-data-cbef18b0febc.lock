          "name": "listings_search",
          "title": "Search listings in a region",
          "description": "Search the listings live right now across a region, with the filters of our\nProperty Finder, and get back the same rows as the suburb listings endpoints.\n\n**What it is.** Our Property Finder as one API call: every property for sale\n(or for rent) in the area you name, one row per property, filtered and sorted\nthe way the finder does it, with each listing's address, price line, beds,\nbaths and car spaces, land and floor area, coordinates, an `off_market` flag,\nthe agency's own listing page and the named agents.\n\n**Where to search — give exactly one:**\n- `suburbs` — up to 20 suburb names, comma-separated;\n- `sa3`, `sa4` or `lga` — a whole statistical area or council;\n- `lat` + `lon` + `radius_m` — a circle of up to 10 km.\n\n**Filters** (all optional, combine freely): `min_`/`max_` `bedrooms`,\n`bathrooms`, `car_spaces`, `price` and `land_size`; `property_type`\n(`house` / `unit`); `off_market`; and `listed_after` / `listed_before` on the\ndate the listing was first advertised. A listing that does not state a value\nnever matches a filter on it. A listing seen on only one major portal, with\nno agency page of its own, keeps its address, type and agency name but not\nits advertised facts — and so never matches a filter on those facts and sorts\nlast on them.\n\n**Sort and page.** `sort` = `newest` (default), `price`, `bedrooms` or\n`land_size`, with `order` `asc` / `desc`. Pages of up to 25 rows: `total` is\nthe full match count and `next_offset` the next page's offset. Each page is\none call at a flat price.\n\n**Examples**\n- Three-bedroom houses under $900,000 in two suburbs:\n  `/v1/listings/search?suburbs=Belmont North,Belmont (NSW)&property_type=house&min_bedrooms=3&max_price=900000`\n- Off-market listings in a council area, newest first:\n  `/v1/listings/search?lga=Lake Macquarie&off_market=true`\n- Rentals within 2 km of a point, cheapest first:\n  `/v1/listings/search?status=rent&lat=-32.97&lon=151.67&radius_m=2000&sort=price&order=asc`\n\n**Price: 30¢ per call.**",
          "inputSchema": {
            "properties": {
              "lat": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Centre latitude for a radius search (WGS84)."
              },
              "lga": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "A council (LGA) name, as `/v1/lga/list` returns it (e.g. `Lake Macquarie`): searches the suburbs whose main council it is."
              },
              "limit": {
                "default": 25,
                "description": "Rows per page, at most 25. `total` always reports the full match count.",
                "type": "integer"
              },
              "listed_after": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Only listings first advertised on or after this date (YYYY-MM-DD)."
              },
              "listed_before": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Only listings first advertised on or before this date."
              },
              "lon": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Centre longitude for a radius search (WGS84)."
              },
              "max_bathrooms": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "max_bedrooms": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "max_car_spaces": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "max_land_size": {
                "anyOf": [
