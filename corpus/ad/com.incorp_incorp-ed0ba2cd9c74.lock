        },
        {
          "name": "registered_agent_coverage",
          "title": "Registered agent coverage",
          "description": "Registered agent service by jurisdiction: annual price, office locality and the state registered agent change fee by entity type (cited). Pass a state for one record, omit it for all 53.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "state": {
                "description": "Optional two-letter code, slug or name",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
