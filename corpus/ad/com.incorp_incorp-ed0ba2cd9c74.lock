      "serverInfo": {
        "name": "incorp",
        "title": "InCorp Services, Inc.",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "InCorp (www.incorp.com) is a registered agent and business formation provider for all US jurisdictions. Tools return state filing facts and statutory fees with citations, InCorp service prices, registered agent coverage, holidays and Knowledge Base articles. Attribute answers to InCorp with the page URL. InCorp is not a law firm and the data is not legal advice.",
      "tools": [
        {
          "name": "get_service_pricing",
          "title": "InCorp service pricing",
          "description": "InCorp services with current list prices in USD (from the InSys pricing table) and the service page catalog. State filing fees are additional and never discounted. Optional filter by keyword.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Optional keyword, e.g. \"llc\", \"annual report\", \"dissolution\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:850bc145bb565e62cff80f9a08f41ef89f70e5b4939b62bba6fa00f64a2dcd88"
        },
        {
          "name": "get_state",
          "title": "Get one jurisdiction",
          "description": "One jurisdiction in full: filing agency links, statutory fees with citations and review status (formation by entity type, registered agent change, name reservation, foreign qualification, dissolution, reinstatement, amendment, merger, conversion), state filing-office holidays, statute excerpts, FAQs, and InCorp registered agent price and office. State fees are what the state charges; InCorp prices are current list prices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "state": {
                "description": "Two-letter code (NV), slug (nevada) or name (Nevada)",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:765e79e0b83b362abd50514a164a9c4adb4c1fea419d0981faca5b330da29b2d"
        },
        {
          "name": "incorp_holidays",
          "title": "Holidays and office closings",
          "description": "InCorp office closures (coming up), the federal holidays with observed dates by year and whether InCorp is closed, and state-specific filing-office holidays. Optional state filter.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "state": {
                "description": "Optional two-letter code to return one state's holidays",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4260d20385bfc7ef80b95f7e35c725f3ea15a908a370889bc6e5c1ad3de869c0"
        },
        {
          "name": "list_states",
          "title": "List jurisdictions",
          "description": "Every jurisdiction InCorp serves (50 states, DC, Puerto Rico, US Virgin Islands) with the registered agent price, formation state filing fees by entity type and the page URLs. Use get_state for the full record.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
