        {
          "name": "create_estimate",
          "title": "Create an estimate or quote (draft)",
          "description": "Prepares an estimate (or, with estimateType QUOTE, a fixed-price quote) for a customer as a draft: customer, date, valid-until date, lines with amounts, and taxes. A new customer name is added to the books. It is NOT sent: the user reviews it and sends it from Mobile Accounting; once the customer accepts, it becomes an invoice there. It is created as a DRAFT: nothing is posted, paid or sent. Tell the user it is waiting for them in Mobile Accounting (openInApp).",
          "inputSchema": {
            "properties": {
              "bookId": {
                "default": null,
                "description": "The set of books, from list_books.",
                "type": ["string", "null"]
              },
              "currency": {
                "default": null,
                "description": "ISO currency when not the books' own.",
                "type": ["string", "null"]
              },
              "customer": {
                "description": "The customer, by name (find_contacts lists the existing ones).",
                "type": "string"
              },
              "date": {
                "default": null,
                "description": "The estimate date, yyyy-MM-dd (default today).",
                "type": ["string", "null"]
              },
              "estimateType": {
                "default": null,
                "description": "ESTIMATE (the price may change, the default) or QUOTE (a fixed price).",
                "type": ["string", "null"]
              },
              "lines": {
                "description": "The work or goods being priced, before tax.",
                "items": {
                  "properties": {
                    "amount": {
                      "description": "The amount before tax, positive.",
                      "type": "number"
                    },
                    "category": {
                      "default": null,
                      "description": "Or a category name, matched exactly (optional).",
                      "type": ["string", "null"]
                    },
                    "categoryId": {
                      "default": null,
                      "description": "A category id from list_categories (optional).",
                      "type": ["integer", "null"]
                    },
                    "description": {
                      "description": "What it was for (for example \"Printer paper\").",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["amount", "description"],
                  "type": "object"
                },
                "type": "array"
              },
              "notes": {
                "default": null,
                "description": "Terms or a note the customer reads on the estimate.",
                "type": ["string", "null"]
              },
              "reference": {
                "default": null,
                "description": "The business's own estimate number or a reference.",
                "type": ["string", "null"]
              },
              "taxes": {
                "default": null,
                "description": "Each tax to charge (GST, HST, PST, sales tax...).",
                "items": {
                  "properties": {
                    "amount": {
                      "description": "The tax amount.",
                      "type": "number"
                    },
                    "label": {
                      "description": "The tax as printed (GST, HST, PST, QST, VAT, sales tax...).",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["amount", "label"],
                  "type": ["object", "null"]
                },
                "type": ["array", "null"]
              },
              "total": {
                "default": null,
                "description": "The expected total, to check the lines and taxes add up.",
                "type": ["number", "null"]
              },
              "validUntil": {
                "default": null,
                "description": "Valid until, yyyy-MM-dd (default 30 days after the date).",
                "type": ["string", "null"]
              }
            },
            "required": ["customer", "lines"],
            "type": "object"
          },
