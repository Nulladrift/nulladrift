{
  "lockfileVersion": 2,
  "subjects": {
    "com.bookgather/bookgather": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.bookgather.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "bookgather",
        "title": "BookGather",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Search BookGather's public listings: upcoming author events (signings, library and bookstore events, festivals, online talks) and author profiles with booking terms. Read-only. Link people to the bookgather.com page in each result to RSVP, buy tickets or send an author a booking request.",
      "tools": [
        {
          "name": "get_author",
          "title": "Author profile",
          "description": "Full public profile for one BookGather author by slug (the last part of their bookgather.com/authors/ link): bio, books, genres, booking terms and upcoming events.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f552cd01d1e95b97592202ec40afe120e98f7c2a68212602ecaeaa89ed582e8e"
        },
        {
          "name": "get_event",
          "title": "Event details",
          "description": "Full details for one BookGather event by its slug (the last part of its bookgather.com/events/ link).",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:54eaa7bf83b79be88ce17111bf3b7c91df39480a1e71a2ae0d36d9a3734ef7f4"
        },
        {
          "name": "search_authors",
          "title": "Search authors",
          "description": "Find authors on BookGather by name, genre or location. Set bookable_only to list authors who accept bookings for school visits, library programs, book clubs, signings, festivals or virtual visits, with their posted fee range. Returns genres, books, booking details and the profile link where a host can send a booking request.",
          "inputSchema": {
            "properties": {
              "bookable_only": {
                "description": "Only authors who have marked themselves available for bookings.",
                "type": "boolean"
              },
              "genre": {
                "description": "e.g. 'Fantasy', 'Romance', 'Children'.",
                "type": "string"
              },
              "limit": {
                "description": "How many to return (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "City or state the author is based in.",
                "type": "string"
              },
              "query": {
                "description": "Author name or keywords.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:92ff1e2b0810d18f0f11057f9238dac1aa6726f00ce16483758091d9ec81e808"
        },
        {
          "name": "search_events",
          "title": "Search author events",
          "description": "Find upcoming author events listed on BookGather: book signings, readings, library and bookstore author events, book festivals and online author talks. Filter by keywords, place and date. Returns title, date (UTC), location, cost and the event page link.",
          "inputSchema": {
            "properties": {
              "from_date": {
                "description": "Earliest date, YYYY-MM-DD. Defaults to today.",
                "type": "string"
              },
              "limit": {
                "description": "How many to return (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "City, state code or venue name to match in the event location, e.g. 'Dallas', 'WA', 'Seattle'.",
                "type": "string"
              },
              "query": {
                "description": "Keywords that must all appear in the title, description or tags, e.g. 'romance signing' or an author's name.",
                "type": "string"
              },
              "to_date": {
                "description": "Latest date, YYYY-MM-DD.",
                "type": "string"
              },
              "virtual_only": {
                "description": "Only online events.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9677f48d317ab827a1605019bf606f0b598fb7e6bb43ae938a8539d0bfdc3726"
        }
      ],
      "digest": "sha256:7880ec06ad5fe6aaa2ba810694ff0b589019720380bcf4b5a30997d3bab548b2"
    }
  }
}
