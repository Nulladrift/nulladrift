        {
          "name": "diagnose_six_year_worldwide_tax_rule",
          "title": "China 6-Year Worldwide Income Rule & 31-Day Reset Diagnostic",
          "description": "Track consecutive 183-day residency years and verify whether a continuous 30+ day absence resets non-domiciled offshore income protection.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "records": {
                "description": "Chronological calendar-year presence flags ordered oldest to newest (up to 6+ years).",
