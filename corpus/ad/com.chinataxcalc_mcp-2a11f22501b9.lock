                  "properties": {
                    "residedOver183Days": {
                      "description": "True if physical days inside mainland China reached at least 183 days in that year.",
                      "type": "boolean"
                    },
                    "singleAbsenceOver30Days": {
                      "description": "True if at least one single departure outside mainland China exceeded 30 consecutive days.",
                      "type": "boolean"
                    },
                    "year": {
                      "description": "Four-digit calendar tax year under review.",
                      "type": "number"
                    }
                  },
                  "required": ["residedOver183Days", "singleAbsenceOver30Days", "year"],
                  "type": "object"
                },
                "type": "array"
              }
