        {
          "name": "compare_cross_border_relocation_net_pay",
          "title": "China vs US, UK, Germany, Singapore & HK After-Tax Benchmark",
          "description": "Benchmark equivalent USD compensation across seven global financial hubs against Shanghai expat net pay with cost-of-living index comparisons.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chinaCityId": {
