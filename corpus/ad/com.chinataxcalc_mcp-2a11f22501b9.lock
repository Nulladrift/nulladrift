      "instructions": "Compute China expat IIT net salary across 6 cities, evaluate 8 Fapiao-backed BIA tax-free exemptions, model MOF/STA 2023 No. 30 annual bonus cliffs, analyze GBA 15% talent rebates, compare 7 overseas hubs, diagnose the 6-year worldwide tax rule, and generate SAFE Circular 2020 No. 14 repatriation kits. Source: https://chinataxcalc.com",
      "tools": [
        {
          "name": "analyze_landlord_fapiao_surcharge_roi",
          "title": "Rental Fapiao Tax Surcharge vs IIT Deduction ROI Analyzer",
          "description": "Evaluate whether paying a landlord surcharge to obtain official housing VAT invoices generates positive after-tax savings at your marginal rate.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "marginalRate": {
                "description": "Employee top applicable IIT decimal rate between 0.03 and 0.45 (e.g., 0.30 for 30%).",
                "type": "number"
              },
              "monthlyRentRMB": {
                "description": "Contractual monthly apartment rent in RMB before any landlord invoice markup.",
                "type": "number"
              },
              "surchargeRatePct": {
                "description": "Percentage fee demanded by the landlord or agent to issue official tax bureau Fapiao (e.g., 5).",
                "type": "number"
              }
            },
            "required": ["marginalRate", "monthlyRentRMB", "surchargeRatePct"],
            "type": "object"
          },
          "annotations": {
