        {
          "name": "calculate_china_expat_iit_and_net_salary",
          "title": "China Expat IIT, Social Security Cap & BIA Net Pay Engine",
          "description": "Compute annual and monthly net take-home cash, marginal brackets, employer costs, and tax savings from eight Fapiao-backed BIA allowances across six Chinese cities.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annualBonus": {
                "description": "Separate annual lump-sum bonus taxed under MOF/STA Announcement 2023 No. 30.",
                "type": "number"
              },
              "childrenEducation": {
                "description": "Accredited international school tuition reimbursed per period with official invoices.",
                "type": "number"
              },
              "cityId": {
                "description": "Municipality determining local social insurance base caps and employer rate tables.",
                "enum": ["shanghai", "beijing", "shenzhen", "guangzhou", "hangzhou", "chengdu"],
                "type": "string"
              },
              "currency": {
                "description": "Reporting currency code used for base pay, BIA items, and returned net figures.",
                "enum": ["RMB", "USD", "EUR", "GBP", "SGD", "HKD"],
                "type": "string"
              },
              "grossAmount": {
                "description": "Base cash remuneration expressed in the chosen currency before payroll deductions or tax.",
                "type": "number"
              },
              "housingRental": {
                "description": "Fapiao-substantiated housing rent allowance matching the chosen incomePeriod and currency.",
                "type": "number"
              },
              "incomePeriod": {
                "description": "Specifies whether grossAmount and BIA inputs are monthly or annualized figures.",
                "enum": ["monthly", "annual"],
                "type": "string"
              },
              "socialSecurityMode": {
                "description": "Select exempt for Shanghai opt-out or treaty protection, otherwise standard capped contributions.",
                "enum": ["exempt", "standard"],
                "type": "string"
              }
            },
            "required": ["grossAmount"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
