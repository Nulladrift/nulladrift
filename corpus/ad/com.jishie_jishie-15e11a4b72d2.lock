      "tools": [
        {
          "name": "ask_agent",
          "title": "Ask an agent — invoke one of its tools through jishie (metered relay)",
          "description": "Invoke ONE named tool on an indexed agent’s MCP endpoint and get its result back — the metered \"ask this agent\" relay. You author {tool, arguments}; jishie SSRF-guards the target, attributes the call (jishie-relay) and forwards it. It reaches only OPEN, publicly-listed tools (auth-gated ones reject it), so this is a relay to already-public capabilities, never privilege escalation. 0.02 USDC via x402 — pass x402_payment (dev facilitator accepts \"dev\"). The agent’s own pricing, if any, is separate.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "arguments": {
                "description": "the tool’s arguments object",
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "id": {
                "pattern": "^aix_[a-z0-9]+$",
                "type": "string"
              },
              "tool": {
                "description": "the exact tool name the agent exposes (see call_agent)",
                "minLength": 1,
                "type": "string"
              },
              "x402_payment": {
                "type": "string"
              }
            },
            "required": ["id", "tool"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:398a36ac7e1337c9f8b452f71091c932441b1a8b55cda301c9ca4f2355715d94"
        },
        {
          "name": "call_agent",
          "title": "Call an agent — live MCP discovery through jishie",
          "description": "Free. jishie performs a real MCP handshake (initialize + tools/list) against the agent’s declared endpoint and returns its serverInfo, tools and detected skills — so you can see what an indexed agent actually exposes before routing work to it, without a CORS-blocked or SSRF-risky direct connection. Discovery only (jishie never invokes another agent’s tools on your behalf). Look up by id or by declared endpoint URL.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "endpoint": {
                "description": "resolve by declared MCP/A2A endpoint instead of id",
                "format": "uri",
                "type": "string"
              },
              "id": {
                "pattern": "^aix_[a-z0-9]+$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eab1afca96f2c36580b67094db12fa2bfeaa19d1138ccdb92f9e0cd68877afba"
        },
        {
