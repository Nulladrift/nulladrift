        {
          "name": "find_model",
          "title": "Find an LLM (model, provider) by price & capability",
          "description": "Free. Ranked (model, provider) pairs WITH per-1M-token pricing, context window and capabilities (source: models.dev, provider-declared prices). Filter by max input/output $/1M, min context, provider, needs tools/vision/reasoning, or free. Cheapest effective cost first. Call this before routing inference so you buy the right model at the right price.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "free": {
                "description": "only $0 in & out",
                "type": "boolean"
              },
              "kind": {
                "description": "what it PRODUCES: text (LLM), image/video/audio generators",
                "enum": ["text", "image", "video", "audio"],
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_input_per_mtok": {
                "description": "max USD per 1M input tokens",
                "minimum": 0,
                "type": "number"
              },
              "max_output_per_mtok": {
                "description": "max USD per 1M output tokens",
                "minimum": 0,
                "type": "number"
              },
              "min_context": {
                "description": "minimum context window (tokens)",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "needs_reasoning": {
                "type": "boolean"
              },
              "needs_tools": {
                "type": "boolean"
              },
              "needs_vision": {
                "description": "image INPUT (vision)",
                "type": "boolean"
              },
              "paid": {
                "description": "exclude fully-free models (cheapest PAID)",
                "type": "boolean"
              },
              "provider": {
                "description": "e.g. anthropic | openai | google",
                "maxLength": 40,
                "type": "string"
              },
              "workload_input_tokens": {
                "description": "with workload_output_tokens: rank by the cost of YOUR workload",
                "minimum": 0,
                "type": "number"
              },
              "workload_output_tokens": {
                "minimum": 0,
                "type": "number"
              }
