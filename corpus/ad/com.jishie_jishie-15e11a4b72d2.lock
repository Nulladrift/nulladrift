          "title": "Capability report (signed) — does it expose what it claims?",
          "description": "A signed, live skill-coverage report (§4.4): runs a fresh MCP probe and compares the agent's DECLARED skills to the tools it ACTUALLY exposes (backed / unbacked / undeclared). Verifies interface capability, not task quality. 0.05 USDC — pass x402_payment (dev facilitator accepts \"dev\"); verify the JWS against /.well-known/jwks.json.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
