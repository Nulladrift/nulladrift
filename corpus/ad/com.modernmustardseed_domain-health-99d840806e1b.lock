{
  "lockfileVersion": 2,
  "subjects": {
    "com.modernmustardseed/domain-health": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.modernmustardseed.com/domain-health"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Domain Health by Modern Mustard Seed",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Domain Health checks any public domain. check_email_auth covers MX, SPF, DKIM, DMARC, BIMI, MTA-STS and TLS-RPT; check_ssl covers the certificate and TLS versions; check_security_headers covers browser security headers; check_domain_registration reads RDAP and DNSSEC; full_domain_report runs all four. All tools are read-only and reach only public DNS resolvers, registries and web servers.",
      "tools": [
        {
          "name": "check_domain_registration",
          "title": "Check domain registration",
          "description": "Read a domain's public registration record from its registry over RDAP (no WHOIS scraping): registrar, creation, expiry and last-change dates, status locks such as clientTransferProhibited, danger states such as redemption period or hold, and nameservers. Also compares the registry's nameservers with the live zone and checks DNSSEC. Subdomains are checked as their registered domain. Some country-code registries do not publish RDAP; the tool says so.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "detail": {
                "default": "summary",
                "description": "\"summary\" (default) lists only findings that need action; \"full\" also lists every passing check.",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "domain": {
                "description": "The domain to check, such as example.com. A website address (https://www.example.com/page) or an email address (jo@example.com) also works; the domain is taken from it.",
                "maxLength": 2048,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check domain registration"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:da154a2057c08473ce19bc894ef844d83e9244fe1d9b53e9ff817e16dd05d342"
        },
        {
          "name": "check_email_auth",
          "title": "Check email authentication",
          "description": "Explain in plain words whether email from a domain will reach the inbox and whether others can forge it. Checks MX, SPF with every include expanded and counted against the 10-lookup limit, DMARC policy, alignment and report permissions, DKIM keys at about 40 common selectors plus any you name (with key size), BIMI, MTA-STS and TLS-RPT, and the DNS rules Google, Yahoo and Microsoft set for bulk senders. Every finding has a severity, a one-sentence fix and the RFC or provider document behind it. Reads public DNS only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "detail": {
                "default": "summary",
                "description": "\"summary\" (default) lists only findings that need action; \"full\" also lists every passing check.",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "dkim_selectors": {
                "description": "Extra DKIM selectors to check, such as the s= value from a DKIM-Signature header (for example \"s1\" or \"selector1\"). About 40 common selectors are always checked.",
                "items": {
                  "maxLength": 63,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "domain": {
                "description": "The domain to check, such as example.com. A website address (https://www.example.com/page) or an email address (jo@example.com) also works; the domain is taken from it.",
                "maxLength": 2048,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check email authentication"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:90d6cb353c288567acbed22173f7c1fbc8258ae8382f1307312fd4393ce2e362"
        },
        {
          "name": "check_security_headers",
          "title": "Check security headers",
          "description": "Read the HTTP security headers a domain's homepage sends, as a browser receives them, and grade each: Strict-Transport-Security, Content-Security-Policy, clickjacking protection (X-Frame-Options or CSP frame-ancestors), X-Content-Type-Options, Referrer-Policy and Permissions-Policy, plus whether http:// redirects to https://, cookie flags, and software version disclosure. Only public web servers on ports 80 and 443 are contacted.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "detail": {
                "default": "summary",
                "description": "\"summary\" (default) lists only findings that need action; \"full\" also lists every passing check.",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "domain": {
                "description": "The domain to check, such as example.com. A website address (https://www.example.com/page) or an email address (jo@example.com) also works; the domain is taken from it.",
                "maxLength": 2048,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check security headers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1cd8554c03f45ada6a47c8d046071a3cbdb499dd934543a658e6249b09f1e8c1"
        },
        {
          "name": "check_ssl",
          "title": "Check SSL certificate",
          "description": "Check the HTTPS certificate and TLS setup of a domain on port 443: issuer, expiry date and days left, whether the chain is complete and trusted, whether the certificate matches the name, key type and size, which TLS versions (1.0 to 1.3) the server accepts, and the CAA record that limits who may issue certificates. Checks www as well when given a bare domain. Every finding has a severity, a fix and a citation.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "detail": {
                "default": "summary",
                "description": "\"summary\" (default) lists only findings that need action; \"full\" also lists every passing check.",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "domain": {
                "description": "The domain to check, such as example.com. A website address (https://www.example.com/page) or an email address (jo@example.com) also works; the domain is taken from it.",
                "maxLength": 2048,
                "minLength": 3,
                "type": "string"
              },
              "include_www": {
                "default": true,
                "description": "Also check www.<domain> when a bare domain is given and www exists. Default true.",
                "type": "boolean"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check SSL certificate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a9494f327ed21e579821b4082b549f5bc182a1aceedb40da3f4aee2a50c8c2e5"
        },
        {
          "name": "full_domain_report",
          "title": "Full domain report",
          "description": "Run every Domain Health check on one domain at once (email authentication, SSL and TLS, security headers, registration and DNSSEC) and answer three questions in plain words: will its email land, is its website safe, and is the domain owned well. Returns a score and grade per area, the top fixes across all areas, and every finding with its severity, fix and citation. Takes 5 to 20 seconds.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "detail": {
                "default": "summary",
                "description": "\"summary\" (default) lists only findings that need action; \"full\" also lists every passing check.",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "dkim_selectors": {
                "description": "Extra DKIM selectors to check, such as the s= value from a DKIM-Signature header (for example \"s1\" or \"selector1\"). About 40 common selectors are always checked.",
                "items": {
                  "maxLength": 63,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "domain": {
                "description": "The domain to check, such as example.com. A website address (https://www.example.com/page) or an email address (jo@example.com) also works; the domain is taken from it.",
                "maxLength": 2048,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Full domain report"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:eb398347f075d7c96c49908b7f359a4af54808b563f0c735ab97f4f05ebcfcd9"
        }
      ],
      "digest": "sha256:76afed43ea77a24479e1f6c61edd024cb07ec5ca516c16b78653f71b16b7f708"
    }
  }
}
