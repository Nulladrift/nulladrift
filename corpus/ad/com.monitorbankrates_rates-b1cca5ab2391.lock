{
  "lockfileVersion": 2,
  "subjects": {
    "com.monitorbankrates/rates": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.monitorbankrates.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "MonitorBankRates",
        "title": "MonitorBankRates",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Live U.S. bank and credit union rates (CDs, savings, money market, checking, mortgages, refinance, home equity, auto, personal loans, credit cards), MBR daily average rates by state, institution health grades, top mortgage lenders and brokers by state or city from federal HMDA data, loan payment calculators (mortgage, refinance, home equity loan, HELOC, auto) at today's average rates, and the MBR Housing Affordability and Insurance Burden indexes. Call list_rate_keys first if unsure which product_key to use. Each result carries an as_of date, a source, and a url to the matching MonitorBankRates.com page.",
      "tools": [
        {
          "name": "calculate_loan",
          "title": "Loan payment calculator",
          "description": "Payment estimates at today's MonitorBankRates average rate for the state (or national), or a rate you pass. calculator = mortgage (monthly principal and interest; pass amount, or home_price and optional down_payment), refinance (new payment, and with current_rate the monthly savings and breakeven months), home_equity_loan (fixed payment), heloc (interest only payment during the draw period, payment once repayment starts, and the payment if the rate rises 1 point), or auto. Returns the inputs and assumptions used and a link to the matching MonitorBankRates calculator page.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Loan amount or balance in dollars.",
                "type": "number"
              },
              "calculator": {
                "enum": ["mortgage", "refinance", "home_equity_loan", "heloc", "auto"],
                "type": "string"
              },
              "closing_costs": {
                "description": "Refinance only: closing costs in dollars (default 2% of the balance).",
                "type": "number"
              },
              "current_rate": {
                "description": "Refinance only: rate on the current loan, in percent.",
                "type": "number"
              },
              "current_years_left": {
                "description": "Refinance only: years left on the current loan.",
                "type": "number"
              },
              "down_payment": {
                "description": "Mortgage only: down payment in dollars (default 20% of home_price).",
                "type": "number"
              },
              "draw_years": {
                "description": "HELOC only: draw period in years (default 10).",
                "type": "number"
              },
              "home_price": {
                "description": "Mortgage only: home price, used when amount is not given.",
                "type": "number"
              },
              "rate": {
                "description": "Optional interest rate in percent. Omit to use today's MonitorBankRates average.",
                "type": "number"
              },
              "state": {
                "description": "Optional two-letter state code or name, for the state average rate.",
                "type": "string"
              },
              "years": {
                "description": "Loan term in years (HELOC: the repayment period). Defaults: mortgage and refinance 30, home equity loan 15, HELOC 20, auto 5.",
                "type": "number"
              }
            },
            "required": ["calculator"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Loan payment calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b5e774b45867fb1a2f99e91fb8241919453c719964470b9f330cf209f5cd172a"
        },
        {
          "name": "get_average_rates",
          "title": "Average rates and trends",
          "description": "MonitorBankRates national or state average rates (APY for deposits, APR for loans) computed daily from every published rate across 8,000+ banks and credit unions. Returns the latest value, change over 1 week / 1 month / 3 months, institution and quote counts, and a daily history. Good for \"what are CD rates doing\", \"average mortgage rate in Texas\", \"average refinance rate\", \"are savings rates falling\".",
          "inputSchema": {
            "properties": {
              "days": {
                "default": 90,
                "description": "Days of history to return.",
                "maximum": 400,
                "minimum": 7,
                "type": "integer"
              },
              "keys": {
                "description": "One or more rate keys (see list_rate_keys), e.g. [\"12-month\",\"60-month\"], [\"30-year\"] or [\"refinance-30-year\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "state": {
                "description": "Optional two-letter state code or name. Omit for the national average.",
                "type": "string"
              }
            },
            "required": ["keys"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Average rates and trends"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:723944a736ab4293ce8fdd46c3f41db809b5b4542d7d74e25e0b7d151d2a4507"
        },
        {
          "name": "get_best_rates",
          "title": "Best rates by product",
          "description": "Top live rates from MonitorBankRates.com for one product (CDs by term, savings, money market, checking, mortgages, refinance, home equity, auto loans, personal loans, credit cards), nationally, for one U.S. state, or for a city (local branches first). Returns one best quote per institution with the institution health grade, minimum deposit, as-of date, and a link. Use list_rate_keys to see valid product_key values (e.g. \"12-month\", \"high-yield_savings\", \"30-year\", \"refinance-30-year\", \"new-auto\").",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "Optional city name (needs state), e.g. Norwalk. Institutions with a branch in that city come first, flagged local, with up to 3 branch addresses there; the rest of the list is filled from the state.",
                "type": "string"
              },
              "institution_type": {
                "description": "Optional filter.",
                "enum": ["bank", "credit union"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "min_deposit": {
                "description": "Deposits only: exclude products whose minimum deposit is above this dollar amount.",
                "type": "number"
              },
              "product_key": {
                "description": "Rate key from list_rate_keys, for example 12-month, high-yield_savings, 30-year, refinance-30-year, refinance-15-year, heloc, new-auto, credit-card.",
                "type": "string"
              },
              "state": {
                "description": "Optional two-letter state code or state name. Returns institutions headquartered or with branches in that state. Omit for national.",
                "type": "string"
              }
            },
            "required": ["product_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Best rates by product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4bdf3fd1c41fc6d87fc510f9456c1263c0ad1d251df9435fcf0483ac749fe927"
        },
        {
          "name": "get_index",
          "title": "Housing affordability and insurance indexes",
          "description": "MonitorBankRates proprietary indexes. \"hai\" = MBR Housing Affordability Index (daily; 100 = median household exactly affords the median home at today's average 30-year rate; higher is more affordable), with national score, state score and rank, and 90-day history; with a city, the city score, its rank in the state, and the home value, income and payment behind it. \"hibi\" = Home Insurance Burden Index and \"aibi\" = Auto Insurance Burden Index (annual; 100 = U.S. average burden; higher is heavier), with state rankings plus an estimated monthly homeowners or car insurance cost for the state or city, by insurer, with the cheapest insurer.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "Optional city name (needs state), e.g. Stamford. hai: city score, rank and inputs. hibi/aibi: city insurance cost estimate by insurer.",
                "type": "string"
              },
              "index": {
                "enum": ["hai", "hibi", "aibi"],
                "type": "string"
              },
              "state": {
                "description": "Optional two-letter state code or name.",
                "type": "string"
              }
            },
            "required": ["index"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Housing affordability and insurance indexes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:463a04b13bcf3c69f8f2bb2f5705cb4b4d317fd6b4cfbe5865b72805ad3932e9"
        },
        {
          "name": "get_institution",
          "title": "Institution rates and health grade",
          "description": "All current deposit and loan rates MonitorBankRates tracks for one bank or credit union, plus its MBR health letter grade, star rating, Texas ratio, branch states, and page link. Pass the slug from search_institutions.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Institution rates and health grade"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:58d9b94d0dab39edff616bce57dedda89f46db12fd7c9064e618e81fa159e278"
        },
        {
          "name": "get_mortgage_lenders",
          "title": "Top mortgage lenders and brokers",
          "description": "Mortgage lenders and brokers in a U.S. state or city, ranked by home loans closed in the latest federal HMDA (Home Mortgage Disclosure Act) data, from the MonitorBankRates lender directory. Returns each lender's loans closed, market share, approval share, median loan, loan programs (Conventional, FHA, VA, USDA, Jumbo, HELOC), headquarters, and MBR health grade for banks and credit unions. Good for \"best mortgage lenders in Florida\", \"FHA lenders in Tampa\", \"credit unions that do mortgages in Ohio\".",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "Optional city name, e.g. Tampa. Falls back to the state list when the city has no list.",
                "type": "string"
              },
              "lender_type": {
                "description": "Optional filter. Mortgage company includes brokers and non-bank lenders.",
                "enum": ["bank", "credit union", "mortgage company"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "program": {
                "description": "Optional: only lenders that closed loans in this program.",
                "enum": ["fha", "va", "usda", "jumbo", "heloc"],
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code or state name.",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Top mortgage lenders and brokers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:79130179f92d23f263309b6bc784222826401672bf023fa166830725c036b242"
        },
        {
          "name": "list_rate_keys",
          "title": "List rate keys and states",
          "description": "Lists every rate key accepted by get_best_rates and get_average_rates with its label, product group, and whether it is measured as APY (deposits) or APR (loans). Also lists U.S. state codes.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List rate keys and states"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:635c62e6b04bb39133e912ed5b33a178e03ef3781bf00e19c44cafd8624a9534"
        },
        {
          "name": "search_institutions",
          "title": "Find a bank or credit union",
          "description": "Search MonitorBankRates' directory of 8,000+ U.S. banks and credit unions by name. Returns matches with type, home state, MBR health grade, how many rates are tracked, and the slug to pass to get_institution.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a bank or credit union"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9e7335fb3ae69821e729d7dea60d3e8d1269a08869b2f6f15677fee9ccd11510"
        }
      ],
      "digest": "sha256:45b275a4f3c233129605b5aa96cba02ebcf3c26aff038dea382487be6798ae4d"
    }
  }
}
