      "instructions": "PikaSim sells eSIMs that an AI agent can order autonomously — no account, no email, no KYC, settled from a prepaid PikaSim Wallet (crypto-funded agent wallet).\n\nNO WALLET CONNECTED: this session has no wallet auth, so you can browse/price but NOT purchase.\n  - AUTONOMOUS agents with NO wallet yet (RECOMMENDED for Claude Code / terminal / scripts): call the create_wallet tool right here — it returns a wallet code + an ak_live_ key + a spend-only welcome credit in ONE call, no human and no browser. Then reconnect with Authorization: Bearer ak_live_… (or the URL https://pikasim.com/mcp/ak_live_YOUR_KEY) and buy. The welcome credit covers a first eSIM data plan (from $0.75); SMS verification numbers need a real deposit (from $1).\n  - HUMAN-driven clients (Claude Desktop / claude.ai / ChatGPT): reconnect using https://pikasim.com/mcp/wallet as the connector URL. The client detects OAuth and opens a PikaSim consent page — the user pastes the 32-character wallet code from https://pikasim.com/agent-wallet. No account, no email, no key in a URL.\n  - Already have a key? CLI clients send Authorization: Bearer ak_live_… or use the key URL https://pikasim.com/mcp/ak_live_YOUR_KEY.\n  - Important: the plain https://pikasim.com/mcp URL is browse-only (but create_wallet works here). The wallet/funds live behind the auth, so without it this session cannot see balance or orders.\n\nThere are THREE product lines. Do NOT assume \"eSIM\" means data-only:\n  1. DATA eSIMs — anonymous data plans across 190+ countries, from $0.75. Discover with search_esim_packages / check_country_coverage; buy with purchase_esim.\n  2. PHONE-NUMBER eSIMs — a REAL carrier phone number (not VoIP) with voice calls, SMS, and data. US plans give a real +1 number on AT&T and T-Mobile; local country plans cover Europe (French +33 number), Australia, Mongolia, Vietnam, and Maldives; global plans cover 160+ countries. Discover with search_phone_plans (or check_country_coverage, which lists a phone-number bucket); buy with purchase_phone_plan.\n  3. SMS VERIFICATION NUMBERS — receive-only numbers for getting SMS verification codes, no eSIM involved. Quick SMS = a one-time code on a temporary number (auto-refund if nothing arrives in 20 min): search_sms_services → get_sms_service_countries → order_sms_verification → poll check_sms_verification. Long-term rentals = keep a number for days/months and receive multiple SMS: list_sms_rentals (shows live stock) → rent_sms_number → get_sms_rental_messages / extend_sms_rental.\n\nsearch_esim_packages and check_country_coverage return BOTH eSIM lines by default. When a user wants to call or text (not just data), use the phone-number line. Package codes appear in [brackets] — pass them to the matching purchase tool.\nWhen a user only needs to RECEIVE a verification code (sign up for an app/site without giving their real number), use the SMS line — it is much cheaper than an eSIM and needs no device install.\n\nPricing is retail. (The separate reseller program at /reseller is a B2B track with its own pk_live_ key and 10% discount; reseller keys also work here at reseller pricing, 10% off retail — note SMS tools are agent-wallet only.)",
