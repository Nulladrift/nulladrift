        {
          "name": "list_orders",
          "description": "Returns the order history for the connected wallet, newest first: each order's ID, package, status, cost, date, ICCID, and install link. Read-only and paginated. Use this to find a past purchase, retrieve an ICCID for get_esim_status, or show a user what they have bought. Results are scoped to this wallet only. Requires a connected agent wallet (OAuth or ak_live_ key).",
