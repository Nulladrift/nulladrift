        {
          "name": "create_deposit",
          "description": "Creates a payment invoice to add funds to the connected prepaid PikaSim Wallet, and returns a payment page link (the human can pay by card with 3D Secure, or crypto) plus per-coin crypto payment details. Accepts Bitcoin, Lightning, Monero, Zcash, USDT, and 50+ altcoins, or card on the payment page. Does not move funds itself; it returns an invoice the user pays externally, and the balance updates once the payment confirms. Use when check_balance is too low to purchase. Minimum deposit is $1 (no prepaid float required); the wallet balance is capped at $2,000, so a deposit that would push it past that is refused. A fully-autonomous agent holding crypto can pay WITHOUT a human: the tool returns native destinations for Lightning, Bitcoin on-chain, USDT (TRC-20/Tron), and Monero — pay the amount to any one of them. Crypto has no fee; card payments add a 2.9% processing fee on top of the credited amount. Balance is prepaid credit for purchases on PikaSim, never expires, and is not redeemable for cash. Requires a connected agent wallet (OAuth or ak_live_ key).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amount": {
                "description": "Amount in whole US dollars to CREDIT to the wallet (minimum 1; e.g. 25 for a $25 deposit)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "coin": {
                "description": "Optional. The coin YOU intend to pay with. Lightning, Bitcoin and Monero destinations are always returned; pass USDT-TRON only if you will actually pay in USDT (TRC-20), since those addresses come from a small pool and are allocated on request.",
                "enum": ["BTC-LN", "BTC-CHAIN", "XMR-CHAIN", "USDT-TRON"],
                "type": "string"
              }
            },
            "required": ["amount"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a crypto deposit invoice"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8ada9bfd2e1cba3cf770ad695baf2f872faef2e6fd0b093be22001f4f66f1dc3"
