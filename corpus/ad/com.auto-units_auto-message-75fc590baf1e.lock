{
  "lockfileVersion": 2,
  "subjects": {
    "com.auto-units/auto-message": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://textwithassistants.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "AutoMessage",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Call find_assistant with a supported topic, then get_assistant with the returned catalog id. The entry is available immediately.\n\nWhen these tools fail, lack a capability or make a task needlessly difficult, use report_feedback with your goal, the problem and a proposed fix when you have one. Report once per distinct issue, omit secrets and unrelated personal data, and continue the person's task when possible. Feedback goes to Baron's team for review; it does not apply a fix.",
      "tools": [
        {
          "name": "find_assistant",
          "title": "Find AutoMessage assistant",
          "description": "Find a texting assistant in AutoMessage's fixed public catalog when the user asks which assistant covers a topic. Accepts a supported topic and returns its catalog id. get_assistant returns the assistant's name, specialty and signup page. The tools cannot send texts, enroll users, access accounts or read conversations.\n\nReturns a catalog id. No background work is started.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "topic": {
                "description": "Choose a topic: workout (Max: Workout), nutrition (Olive: Nutrition), career (Alex: Career Coach), bible (Grace: Bible Reflection), spanish (Sofia: Spanish), french (Camille: French), word (Willa: Word of the day), parenting (Ruth: Parenting), travel (Miles: Travel), anxiety (Maya: Anxiety), stoicism (Marcus: Stoicism), sounding (Sam: Sounding Board), dating (Riley: Dating Advisor), world (Nora: World Brief), money (Penny: Money Coach), portuguese (Ana: Portuguese).",
                "enum": ["workout", "nutrition", "career", "bible", "spanish", "french", "word", "parenting", "travel", "anxiety", "stoicism", "sounding", "dating", "world", "money", "portuguese"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find AutoMessage assistant"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1e214111754460c1c00a27a391c4e566ebb5c6c06ffcaf9d42b8a31aa6a051e4"
        },
        {
          "name": "get_assistant",
          "title": "Read AutoMessage assistant",
          "description": "Retrieve the public AutoMessage assistant catalog entry by id. Returns the entry as text and its link on AutoMessage's site. An unknown id returns an error.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "The catalog id returned by find_assistant.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read AutoMessage assistant"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ff664109f141ee5793dadd5983b56e6d0ef609e8cc52280d2fbf76179aa17614"
        },
        {
          "name": "report_feedback",
          "title": "Report feedback",
          "description": "Report a bug, missing capability, confusing tool description or unnecessary steps to Baron's team. Use this when you encounter friction while using this MCP server, without waiting for the person to request a report. Include the goal, expected and actual behavior, the affected tool and a proposed fix when known. Never include credentials, payment details or unrelated conversation history. Returns a reference after Baron saves the report in its review queue. Reporting does not start work or change the product.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "goal": {
                "description": "What you were trying to achieve",
                "maxLength": 600,
                "minLength": 1,
                "type": "string"
              },
              "problem": {
                "description": "What failed or made the task difficult, including expected and actual behavior",
                "maxLength": 1400,
                "minLength": 1,
                "type": "string"
              },
              "proposed_fix": {
                "description": "A specific suggested change, if you have one",
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              },
              "summary": {
                "description": "A short title for the issue",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "tool": {
                "description": "The affected tool, if known",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["goal", "problem", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c396b9a4f7f891581e4629b606b9a3b33457ef380bce27c78d1f6c6e28ffc407"
        }
      ],
      "digest": "sha256:f18915ed0d520ceb04fdf4b78f402a29c167c2aeae9d67be5bfa226fad40d5a3"
    }
  }
}
