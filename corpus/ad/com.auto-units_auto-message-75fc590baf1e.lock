{
  "lockfileVersion": 2,
  "subjects": {
    "com.auto-units/auto-message": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://textwithassistants.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "AutoMessage",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Call find_assistant with a supported topic, then get_assistant with the returned catalog id. The entry is available immediately.",
      "tools": [
        {
          "name": "find_assistant",
          "title": "Find AutoMessage assistant",
          "description": "Find a texting assistant in AutoMessage's fixed public catalog when the user asks which assistant covers a topic. Accepts a supported topic and returns its catalog id. get_assistant returns the assistant's name, specialty and signup page. The tools cannot send texts, enroll users, access accounts or read conversations.\n\nReturns a catalog id. No background work is started.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "topic": {
                "description": "Choose a topic: workout (Max: Workout), nutrition (Olive: Nutrition), career (Alex: Career Coach), bible (Grace: Bible Reflection), spanish (Sofia: Spanish), french (Camille: French), word (Willa: Word of the day), parenting (Ruth: Parenting), travel (Miles: Travel), anxiety (Maya: Anxiety), stoicism (Marcus: Stoicism), sounding (Sam: Sounding Board), dating (Riley: Dating Advisor), world (Nora: World Brief), money (Penny: Money Coach), portuguese (Ana: Portuguese).",
                "enum": ["workout", "nutrition", "career", "bible", "spanish", "french", "word", "parenting", "travel", "anxiety", "stoicism", "sounding", "dating", "world", "money", "portuguese"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find AutoMessage assistant"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1e214111754460c1c00a27a391c4e566ebb5c6c06ffcaf9d42b8a31aa6a051e4"
        },
        {
          "name": "get_assistant",
          "title": "Read AutoMessage assistant",
          "description": "Retrieve the public AutoMessage assistant catalog entry by id. Returns the entry as text and its link on AutoMessage's site. An unknown id returns an error.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "The catalog id returned by find_assistant.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read AutoMessage assistant"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ff664109f141ee5793dadd5983b56e6d0ef609e8cc52280d2fbf76179aa17614"
        }
      ],
      "digest": "sha256:60f532a615f4ba3adf59ee2fd144ae178bbb92dd9d234aad2fc75537bdda888c"
    }
  }
}
