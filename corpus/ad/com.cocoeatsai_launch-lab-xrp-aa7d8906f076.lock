      },
      "transport": {
        "type": "http",
        "url": "https://cocoeatsai.com/area4/agent/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "launch-lab-xrp",
        "title": "Launch Lab XRP Data",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "XRP market research data for agents. Free tools return cached data and the track record; live data is pay-per-call in XRP via x402. Research data from public sources, not financial advice. Probabilities, not signals to buy or sell.",
      "tools": [
        {
          "name": "x402_doctor",
          "description": "FREE: check whether an x402 paid endpoint is configured so AI agents can actually pay it (HTTP 402, PAYMENT-REQUIRED v2 header, XRPL invoiceId/sourceTag, RLUSD issuer, payTo can receive on-ledger, discovery file). Returns a score and exact fixes.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "The paid endpoint URL",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b0bb681e7730582d39ac9984f3654bae2ebf9a7560ff83130ea24743d38bd278"
        },
        {
          "name": "xrp_brief_sample",
          "description": "A free, cached (up to 6 hours) XRP brief: price, regime/volatility, model outlook, liquidity levels, derivatives, events, flows, news. Live data is pay-per-call (see xrp_paid_endpoints).",
          "inputSchema": {
            "properties": {
              "section": {
                "description": "Optional: return only one section (e.g. snapshot, outlook, levels, derivs, events, flows, news).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f726d5df970ebdce891a26cf17bb49689d3854f23b494b796f03a537e2d0b16f"
        },
        {
          "name": "xrp_paid_endpoints",
          "description": "List the live, pay-per-call XRP data endpoints (x402 on the XRP Ledger, 0.0001-0.05 XRP per call) and how an agent pays for them.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b35755b53ce242d50139d4852b093d0ad0d7c136156cc914be2186d82a48b93e"
        },
        {
          "name": "xrp_track_record",
          "description": "Launch Lab's graded record of daily XRP calls since Oct 8 2026 (hits, misses, streak). Free.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e0489d557fbab88272d2cb67a0ef031f22ff1d482fda1a132466ddcf10796bc0"
        },
        {
          "name": "xrpl_explain_tx",
          "description": "FREE safety check: explain an XRPL transaction in plain English before signing it (JSON or hex blob) and flag risks such as wallet-drainer patterns, fake RLUSD issuers, missing destination tags and partial payments. Returns a verdict: looks_normal, review or do_not_sign.",
          "inputSchema": {
            "properties": {
              "max_xrp": {
                "description": "Optional spending cap in XRP",
                "type": "number"
              },
              "signer": {
                "description": "Optional: the account you expect to be signing",
                "type": "string"
              },
              "tx": {
                "description": "Transaction JSON object or hex blob"
              }
            },
            "required": ["tx"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:aa84158ea8ce817534d15ada163511ea9b1eb3eee90a990c8bf1b9e3f41c2e72"
        },
        {
          "name": "xrpl_wallet_report_preview",
          "description": "Free wallet safety preview: heuristic score and up to three issues; full report is paid. Public ledger reads only, no wallet signing.",
          "inputSchema": {
            "properties": {
              "address": {
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:91f1e8605bf0cd18e07bc51c1f86d256e096305946ff735ae39c3abb6bde1c38"
        }
