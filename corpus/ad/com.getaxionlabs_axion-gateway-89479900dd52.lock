        {
          "name": "mtd_scope",
          "title": "UK Making Tax Digital — in scope from when",
          "description": "One call for UK Making Tax Digital for Income Tax scope: give gross qualifying income (self-employment plus UK and foreign property, before expenses) and get whether you are in, from which date, which threshold and which tax return decided it, your first quarterly update deadline and all four dates, how many quarterly updates you owe (a foreign property is a SEPARATE business from a UK one), and the automatic exemptions. Answers the £20,000-or-less automatic exemption and the not-yet-but-soon case explicitly rather than returning nothing. Free, no key, attribution required. Every fact is traced to a named GOV.UK/HMRC page on mtdfacts.co.uk; the governing law is the Income Tax (Digital Obligations) Regulations 2026 (SI 2026/336).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "has_foreign_property": {
                "description": "True if any of it is foreign property income. A foreign property business is SEPARATE from a UK one: its own quarterly update, and separate digital records for each individual foreign property.",
                "type": "boolean"
              },
              "has_property": {
                "description": "True if any of that income is UK property income. Decides how many quarterly updates are due, not whether you are in scope.",
                "type": "boolean"
              },
              "has_self_employment": {
                "description": "True if any of it is self-employment income. Also a separate business for quarterly updates.",
                "type": "boolean"
              },
              "qualifying_income": {
                "description": "Gross qualifying income in pounds: self-employment income plus UK and foreign property income, BEFORE expenses, from the tax return named by return_year. Employment (PAYE), partnership profit share, dividends and pensions are excluded.",
                "type": "number"
              },
              "return_year": {
                "description": "Which tax return the figures are from. Defaults to 2024-25, the return that decides MTD from 6 April 2026.",
                "enum": ["2024-25", "2025-26", "2026-27"],
                "type": "string"
              }
            },
            "required": ["qualifying_income"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
