        {
          "name": "nyc_ticket",
          "title": "NYC plate — open violations, odds, clocks",
          "description": "One call for a New York plate: every OPEN parking and camera violation live from the City's own Open Data API, what is owed and what is already in judgment, the citywide dismissal and dismissed-or-reduced rate for each ticket's violation type from the City's published hearing records, and the clocks — 30 days from the date on the ticket to request a hearing before late penalties start, roughly 100 days from issue before an unanswered ticket goes into judgment, and the $350 judgment-debt level at which a car can be booted. Disputing is free at nyc.gov and always has been. PRIVACY: the plate goes to the City's API and back inside this one request and is never stored or logged here. Free, no key, attribution required.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "license_type": {
                "description": "Optional plate class code (PAS, COM, OMT, SRF, OMS, APP, TRC, TRL, MOT). Omit to search all types — most drivers should omit it.",
                "type": "string"
              },
              "plate": {
                "description": "License plate, letters and digits only — e.g. 'ABC1234'. Sent to the City's public API and back inside this request; never stored.",
                "type": "string"
              },
              "state": {
                "description": "Two-letter registration state, e.g. 'NY', 'NJ'.",
                "type": "string"
              }
            },
            "required": ["plate", "state"],
            "type": "object"
          },
          "annotations": {
