        {
          "name": "parking_route",
          "title": "UK parking charge — route, deadlines, POPLA record",
          "description": "One call for a UK private parking charge notice: which independent appeals body hears this operator's appeals (POPLA for BPA members, the IAS for IPC members) with the published source for the window, all three deadlines computed from your dates (the discount window, the appeal to the operator, the independent appeal), and POPLA's own record for that operator — appeals decided, appeals allowed, the allowed share, the three-year series and how many the operator did not contest. Sending an appeal to the wrong body wastes the one free independent appeal and neither service forwards to the other, so an ambiguous operator name returns the candidates rather than a guess. Use it at the second no as well, when the operator has rejected the appeal and POPLA has refused it too: the record shows how that operator's decided appeals went, and a POPLA decision binds the operator, not the driver. Free, no key, attribution required. Source: POPLA Annual Report Appendices 2023-2025 and the published BPA and IPC member lists.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "issuer": {
                "description": "The parking operator's company or trading name as printed on the notice — e.g. 'ParkingEye', 'Euro Car Parks', 'APCOA'. An ambiguous name returns candidates, never a guess.",
                "type": "string"
              },
              "notice_date": {
                "description": "Date printed on the parking charge notice, YYYY-MM-DD. Without it no deadlines are computed.",
                "type": "string"
              },
              "rejection_date": {
                "description": "Date the operator rejected your appeal, YYYY-MM-DD. The independent-appeal clock runs from this date, not from the notice.",
                "type": "string"
              }
            },
            "required": ["issuer"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "UK parking charge — route, deadlines, POPLA record"
