      },
      "instructions": "SSTracker's free youth sports drills, practice plans, tryout prep and home training weeks, for parents, coaches and trainers (adults). Every answer is general guidance from the public pages at sstracker.app, kept inside the app's age limits, with the page link to cite. Nothing here is about a particular child; do not send a child's name or any personal details.",
      "tools": [
        {
          "name": "find_drills",
          "title": "Find youth drills by sport and age",
          "description": "For parents, coaches and trainers (adults). Free SSTracker drills open at a child's age (the app's own age gates: contact, tackling, heading and advanced drills wait for their age), each with steps, minutes, a safety line and its page link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age": {
                "description": "The child's age in years.",
                "maximum": 18,
                "minimum": 4,
                "type": "integer"
              },
              "at_home": {
                "description": "Only drills that work at home.",
                "type": "boolean"
              },
              "skill": {
                "description": "Optional: one of the sport's skills, e.g. \"shooting\".",
                "type": "string"
              },
              "sport": {
                "description": "The sport, e.g. \"soccer\" or \"basketball\".",
                "enum": ["baseball", "basketball", "bowling", "cheer", "cross_country", "diving", "field_hockey", "flag_football", "football", "golf", "gymnastics", "hockey", "lacrosse", "rugby", "soccer", "softball", "swimming", "tennis", "track_and_field", "volleyball", "water_polo", "wrestling"],
                "type": "string"
              }
            },
            "required": ["age", "sport"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find youth drills by sport and age"
          },
