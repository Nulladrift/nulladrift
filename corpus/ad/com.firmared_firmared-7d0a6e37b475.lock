          "title": "Portada de FirmaRED Hoy",
          "description": "La portada de FirmaRED Hoy ahora mismo: noticias de 71 medios argentinos e internacionales, cada una con fuente, hora de ingreso sellada y link a la ficha de FirmaRED (no al medio).",
