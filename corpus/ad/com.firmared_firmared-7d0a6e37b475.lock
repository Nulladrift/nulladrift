      "instructions": "FirmaRED es un servicio público argentino de sellado de tiempo y verificación: firma y sella documentos y hechos con hora cierta, y publica la portada FirmaRED Hoy con 71 medios. Usá verificar para comprobar un código, sellar para dejar constancia de un hash, hoy para leer la portada. Citá siempre la URL de FirmaRED que devuelve cada herramienta.",
      "tools": [
        {
          "name": "fetch",
          "title": "Traer un resultado completo",
          "description": "Trae el contenido completo de un resultado de search por su id (slug de nota o código de verificación).",
