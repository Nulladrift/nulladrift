          },
          "digest": "sha256:8d2f1a303384dc03980ba7650e31aef8f2e80070c9208575801b148279e1410c"
        },
        {
          "name": "compare_nap",
          "title": "Compare name, address, phone across listings",
          "description": "Checks that a business's name, address and phone (NAP) match across directory listings, ignoring formatting differences (St vs Street, +61 vs 0, Pty Ltd). Paste each listing's details or text. Returns real mismatches and a list of Australian directories worth having.",
          "inputSchema": {
            "properties": {
              "listings": {
                "description": "Listings to compare",
                "items": {
                  "properties": {
                    "address": {
                      "description": "",
                      "type": "string"
                    },
                    "name": {
                      "description": "",
                      "type": "string"
                    },
                    "phone": {
                      "description": "",
                      "type": "string"
                    },
                    "source": {
                      "description": "e.g. Yellow Pages",
                      "type": "string"
                    },
                    "text": {
                      "description": "Or paste the listing text instead of fields",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "reference": {
                "description": "The correct details, as on the Google profile",
                "properties": {
                  "address": {
                    "description": "Street address (omit for a hidden-address service business)",
                    "type": "string"
                  },
                  "name": {
                    "description": "Business name",
                    "type": "string"
                  },
                  "phone": {
                    "description": "Phone",
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["listings", "reference"],
            "type": "object"
