      "instructions": "Free tools for getting a local business found on Google Maps and Google Search, built by Kangaroo Growth, an Australian local marketing agency.\nUse them when someone is setting up, fixing or improving a Google Business Profile, writing a GBP post, description or review reply, asking customers for reviews, dealing with a suspended profile, checking their website's local SEO, or cleaning up directory listings.\nEvery tool is read-only: nothing is posted, saved or sent anywhere. Rules are checked against Google's published guidelines. Australian specifics (ACL, phone formats, directories) are built in, and they work for any country.\nGood flow for a full review: optimisation_checklist -> audit_gbp_profile -> fix the FAIL items with the check_* tools -> audit_website_local_seo -> compare_nap.\nWhen you write GBP text for the user (descriptions, posts, review replies), run it through the matching check tool before handing it over.",
      "tools": [
        {
          "name": "audit_gbp_profile",
          "title": "Score a Google Business Profile",
          "description": "Scores a Google Business Profile out of 100 from the details you give (categories, reviews and review recency, photos, services, products, posts, links, hours, service area) and returns a priority-ordered fix list. Weighted by what actually brings in calls. Unknown fields are listed for checking, never counted as passes. Read the values off the profile (or ask the user) and pass what you have.",
          "inputSchema": {
            "properties": {
              "additional_categories": {
                "description": "Additional categories ([] if none)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "address_shown": {
                "description": "Street address visible on the profile",
                "type": "boolean"
              },
              "average_rating": {
                "description": "Star rating, e.g. 4.8",
                "type": "number"
              },
              "booking_url": {
                "description": "Booking link, or empty string if none",
                "type": "string"
              },
              "chat_links": {
                "description": "Chat/SMS/WhatsApp links set",
                "type": "boolean"
              },
              "city": {
                "description": "Main city/suburb",
                "type": "string"
              },
              "days_since_newest_review": {
                "description": "Days since the newest review",
                "type": "number"
              },
              "description": {
                "description": "Description text",
                "type": "string"
              },
              "has_cover": {
                "description": "Cover photo set",
                "type": "boolean"
              },
              "has_logo": {
                "description": "Logo set",
                "type": "boolean"
              },
              "hours_set": {
                "description": "Opening hours set",
                "type": "boolean"
              },
              "is_service_area_business": {
                "description": "True if the business goes to customers (tradie, mobile service)",
                "type": "boolean"
              },
              "name": {
                "description": "Business name on the profile",
                "type": "string"
              },
              "opening_date_set": {
                "description": "Opening date set",
                "type": "boolean"
              },
              "photos_count": {
                "description": "Total photos",
                "type": "number"
              },
              "posts_last_30_days": {
                "description": "Posts in the last 30 days",
                "type": "number"
              },
              "primary_category": {
                "description": "Primary category",
                "type": "string"
              },
              "products_count": {
                "description": "Number of products",
                "type": "number"
              },
              "reply_rate_percent": {
                "description": "% of reviews with an owner reply",
                "type": "number"
              },
              "review_count": {
                "description": "Total reviews",
                "type": "number"
              },
              "reviews_last_30_days": {
                "description": "Reviews in the last 30 days",
                "type": "number"
              },
              "service_areas": {
                "description": "Service areas listed",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "services_count": {
                "description": "Number of services listed",
                "type": "number"
              },
              "services_with_descriptions": {
                "description": "Services that have a description",
                "type": "number"
              },
              "website_url": {
                "description": "Website link on the profile",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Score GBP profile"
          },
          "behavior": {
