          "digest": "sha256:72c757316ac324f111cc25d8885fe398fc3c9e798d2b00b5034e1099c3de6ece"
        },
        {
          "name": "check_gbp_description",
          "title": "Check a GBP description",
          "description": "Checks a Google Business Profile description before it's saved: the 750-character limit, links, prices or promotions (not allowed), keyword stuffing, AI-style filler, missing area or services, and what shows before 'More'. Gives a four-block structure that works.",
          "inputSchema": {
            "properties": {
              "business_name": {
                "description": "Optional",
                "type": "string"
              },
              "city": {
                "description": "Optional: main city or suburb",
                "type": "string"
              },
              "description": {
                "description": "The description text",
                "type": "string"
              },
              "services": {
                "description": "Optional: main services that should be mentioned",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check GBP description"
