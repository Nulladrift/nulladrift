        {
          "name": "check_business_name",
          "title": "Check business name for suspension risk",
          "description": "Checks a Google Business Profile name against Google's naming rules (no keywords, locations, taglines, phone numbers, hours). Keyword-stuffed names are the most common cause of suspensions. Returns PASS/RISK/FAIL, each problem with its fix, and the likely real name.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional: primary GBP category",
                "type": "string"
              },
              "city": {
                "description": "Optional: city or suburb the business is in",
                "type": "string"
              },
              "legal_or_signage_name": {
                "description": "Optional: the name on signage, invoices or ABN registration. Words also in this name are allowed",
                "type": "string"
              },
              "name": {
                "description": "The name exactly as it appears on the profile",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check business name"
