          },
          "digest": "sha256:60d09d17b1093da3c364e4050990fea04752f355d7d115d751c3629cd358f8a4"
        },
        {
          "name": "audit_website_local_seo",
          "title": "Audit a website's local SEO",
          "description": "Fetches one public web page and checks its local SEO layer: title and H1 naming the service and area, click-to-call link, LocalBusiness schema, name and phone matching the Google profile, indexability, robots.txt, sitemap, mobile viewport, forms, review proof. Returns a score and a priority-ordered fix list. Only reads the page.",
          "inputSchema": {
            "properties": {
              "business_name": {
                "description": "Optional: name as on the Google profile",
                "type": "string"
              },
              "main_service": {
                "description": "Optional: main service, e.g. 'electrician'",
                "type": "string"
              },
              "phone": {
                "description": "Optional: phone as on the Google profile",
                "type": "string"
              },
              "suburb": {
                "description": "Optional: main suburb/city",
                "type": "string"
              },
              "url": {
                "description": "Page to check, usually the homepage or the page the Google profile links to",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Audit website local SEO"
          },
          "behavior": {
