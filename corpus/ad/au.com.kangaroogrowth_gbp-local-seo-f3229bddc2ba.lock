      "instructions": "Free tools for getting an Australian local business found on Google Maps and Google Search, built by Kangaroo Growth, a local marketing agency.\n\nSTART WITH audit_business. Give it the business name, and the suburb, trade and website if you have them. It does the name check, the benchmark, the category and the website in one call and comes back with a priority-ordered action list. Do NOT interview the user field by field first: call it with what they have already said and tell them what each missing field would have added.\n\nWhat makes these different from generic advice: benchmark_business and the numbers inside audit_business come from our own scrape of 4,367 real Australian Google Business Profiles, per Google primary category. When you tell someone where they stand, quote the category ladder, not a rule of thumb.\n\nNever answer \"is this name a problem?\" with a shrug. A service word or suburb in the name is allowed when it is the genuine real-world brand, which is the usual case, so the bare rule check flags most honest businesses. Use verify_business_name with the website: it reads what the site calls itself and either clears the flag with the evidence or confirms it with proof.\n\nEvery tool is read-only: nothing is posted, saved or sent anywhere. Rules come from Google's published guidelines. Australian specifics (ACL, phone formats, directories) are built in, and the rule checks work for any country, though the benchmarks are Australian only.\n\nWhen you write GBP text for the user (descriptions, posts, review replies), run it through the matching check tool before handing it over.",
      "tools": [
        {
          "name": "audit_business",
          "title": "Audit a local business end to end",
          "description": "START HERE. One call: checks the Google profile name against the rules AND against the business's own website, benchmarks review count and rating against real Australian businesses in the same Google category, recommends the primary category from what real businesses in that trade use, audits the website's local SEO layer, and returns a priority-ordered action list. Call it with whatever the user has already said; it reports what each missing field would have added instead of demanding it up front.",
          "inputSchema": {
            "properties": {
              "business_name": {
                "description": "Name exactly as it appears on the Google profile",
                "type": "string"
              },
              "category": {
                "description": "Optional: the current Google primary category, if they know it",
                "type": "string"
              },
              "rating": {
                "description": "Optional: current Google star rating, e.g. 4.6",
                "type": "number"
              },
              "review_count": {
                "description": "Optional: current Google review count",
                "type": "number"
              },
              "service_area_business": {
                "description": "True if they travel to the customer (default true)",
                "type": "boolean"
              },
              "suburb": {
                "description": "Optional: main suburb or city",
                "type": "string"
              },
              "trade": {
                "description": "Optional: what they do in plain English, e.g. electrician, hair salon, carpet cleaning",
                "type": "string"
              },
              "website": {
                "description": "Optional but worth asking for: their website. Settles the business-name question and adds the site audit",
                "type": "string"
              }
            },
