      "instructions": "Bolot Studio sells personalized aluminium dye-sublimation photo prints across two print families and a DIBOND address sign: 'the-legacy-print' (The Keepsake Trio with three separate 13×9 cm panels and exactly three metal desk stands, Classic, and Statement; a Statement and a Keepsake Trio can also be bought together under a store-wide promotion — this is a promotion, not a separate product size), 'the-cinematic-print' (The Cinematic, Classic, and Statement wall formats), and 'the-address-sign'. This server is READ-ONLY: use it to search the catalog, fetch product details, get shipping estimates, search policies and FAQs, summarize reviews, check photo compatibility, and compare products. It cannot add to cart or check out — to purchase, hand the buyer off to the configurator via the start_configuration tool, which leads into the UCP/ACP checkout flow. Products are not currently available for purchase in the USA. No US prices, offers, shipping quotes or checkout data are published.",
