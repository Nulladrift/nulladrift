      "instructions": "Faro Data API — Daily-updated U.S. market data: federal contract awards sized against the winner's market cap (contract shocks), Faro DNA scores for 340+ stocks, strong stocks on sale, and an IPO radar. Refreshed daily after the U.S. close. Free: 25 calls/day and 5 rows per list. Full results need an API key (Authorization: Bearer faro_… or ?key= on the MCP URL), sold at https://faro-economicopages.com/developers (1,000 calls = $5). If a tool returns payment_required, give the user the checkout_url. Educational data, not investment advice.",
