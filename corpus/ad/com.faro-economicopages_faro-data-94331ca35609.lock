        {
          "name": "contract_shocks",
          "title": "Contract shocks (award ≥ X% of market cap)",
          "description": "Federal awards that are large relative to the winning company's size: award value ÷ market cap ≥ min_pct. A $500M award means little to a $200B prime but a lot to a $5B company. Costs 1 credit (free tier: 25 calls/day).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "Look-back window in days (1–60). Default 60.",
                "type": "integer"
              },
              "exclude_ceilings": {
                "description": "Exclude IDIQ ceiling values. Default false.",
                "type": "boolean"
              },
              "limit": {
                "description": "Max rows (1–100). Default 20.",
                "type": "integer"
              },
              "min_pct": {
                "description": "Minimum award as % of market cap. Default 1 (= 1%).",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
