          "name": "federal_contracts",
          "title": "Federal contract awards to public companies",
          "description": "Recent U.S. federal contract awards (Department of War daily announcements + USAspending) won by publicly traded companies, newest first. Each award includes its size as a % of the winner's market cap and the stock move since the announcement. Costs 1 credit (free tier: 25 calls/day).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agency": {
                "description": "Filter by agency name (contains), e.g. Navy, Army, Air Force.",
                "type": "string"
              },
