                "description": "Look-back window in days (1–60). Default 30.",
                "type": "integer"
              },
              "limit": {
                "description": "Max rows (1–200). Default 25.",
                "type": "integer"
              },
              "min_amount": {
                "description": "Minimum award amount in USD.",
                "type": "number"
              },
              "ticker": {
                "description": "Filter by stock ticker, e.g. HII.",
                "type": "string"
