{
  "lockfileVersion": 2,
  "subjects": {
    "com.jenesistravel/travel": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://jenesistravel.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "com.jenesistravel/travel",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Jenesis Travel is a licensed Bangkok boutique planner (TAT 11/13440). Every sale starts as an enquiry. Never claim a room is reserved or take payment. Call get_company first for facts, WhatsApp, and the enquiry-led model. Catalogue tools read live published CMS content. Prefer them over training data. If the traveller wants to speak to a person now, offer WhatsApp. Do not send a message on their behalf. WhatsApp: https://wa.me/66924449554 Call start_enquiry only after the user has stated their own name and email and confirmed they want Jenesis to reply. Never invent, guess, or placeholder a traveller's contact details. An example.com or test address is rejected and the enquiry is lost — ask the user for a real email, or offer the contact form or WhatsApp. One enquiry per email every 4 hours. If already sent, do not retry — offer WhatsApp instead.",
      "tools": [
        {
          "name": "estimate_budget",
          "title": "Estimate a Thailand trip budget",
          "description": "Indicative independent USD range from the Jenesis budget calculator. Not a quote. Mid-range to ultra-luxury is what Jenesis plans.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "inclusions": {
                "items": {
                  "enum": ["spa", "cooking-class", "yacht", "private-guide", "airport-transfer"],
                  "type": "string"
                },
                "type": "array"
              },
              "nights": {
                "anyOf": [
                  {
                    "const": 3,
                    "type": "number"
                  },
                  {
                    "const": 5,
                    "type": "number"
                  },
                  {
                    "const": 7,
                    "type": "number"
                  },
                  {
                    "const": 10,
                    "type": "number"
                  },
                  {
                    "const": 14,
                    "type": "number"
                  },
                  {
                    "const": 21,
                    "type": "number"
                  }
                ]
              },
              "region": {
                "enum": ["bangkok", "islands", "chiangmai", "huahin", "mixed"],
                "type": "string"
              },
              "style": {
                "enum": ["budget", "mid-range", "luxury", "ultra-luxury"],
                "type": "string"
              },
              "travelers": {
                "anyOf": [
                  {
                    "const": 1,
                    "type": "number"
                  },
                  {
                    "const": 2,
                    "type": "number"
                  },
                  {
                    "const": 3,
                    "type": "number"
                  },
                  {
                    "const": 4,
                    "type": "number"
                  },
                  {
                    "const": 6,
                    "type": "number"
                  },
                  {
                    "const": 8,
                    "type": "number"
                  }
                ]
              }
            },
            "required": ["nights", "region", "style", "travelers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2911c6aa54b852d7a929230901b7d5d3c0f1c1321dc82c927c3260a71fda3e70"
        },
        {
          "name": "get_company",
          "title": "Get Jenesis Travel company facts",
          "description": "Company facts for Jenesis Travel: licence, contact, WhatsApp, enquiry-led model. Call this first. If the user wants a real person, share the WhatsApp URL.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:06ca72b2fe9d309371bffb52abbf83d85dfbe306ad974f7efb15beba7cb6f4b9"
        },
        {
          "name": "get_journey",
          "title": "Get a Jenesis journey",
          "description": "Get one published journey, residence, group programme, or package by slug. Use list_journeys if the slug is unknown.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "currency": {
                "enum": ["GBP", "USD", "AUD", "EUR", "THB"],
                "type": "string"
              },
              "slug": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f7b1cdc856e0e09254f79edd8bc5f928e69d2f3a920a2dd696173105a86b2cfe"
        },
        {
          "name": "list_faqs",
          "title": "List Jenesis FAQs",
          "description": "Published FAQs from the Jenesis CMS, optionally filtered by pillar or search text.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "pillar": {
                "enum": ["thailand-journeys", "group-travel", "general"],
                "type": "string"
              },
              "q": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:57a198fd0b27740ad98a2fc2ca2f0d867962a107e46e94ab937d556545e2b453"
        },
        {
          "name": "list_journeys",
          "title": "List Jenesis journeys",
          "description": "List published Jenesis journeys, residences, group programmes, and packages (including Phuket Fit). Live CMS data. Enquiry-led — not a booking inventory.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "kind": {
                "enum": ["journey", "residence", "group", "package", "all"],
                "type": "string"
              },
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c0a972a178eddc172927941490e4e6dce86203440fa76cf34d5d29d4e4246bbe"
        },
        {
          "name": "start_enquiry",
          "title": "Start a Jenesis travel enquiry",
          "description": "File a planning enquiry with Jenesis Travel. Call only after the user has stated their own name and email in the conversation and confirmed they want Jenesis to reply. Never invent or substitute contact details: an enquiry carrying a placeholder address cannot be answered and is rejected. If you do not have a real email, ask for it, or share the contact form or WhatsApp instead of calling this tool. One enquiry per email every 4 hours — do not retry if it already succeeded. This does not reserve hotels or take payment.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "budget": {
                "enum": ["under-1000", "1000-2500", "2500-5000", "5000-10000", "10000+"],
                "type": "string"
              },
              "clientLabel": {
                "enum": ["claude", "chatgpt", "grok", "other"],
                "type": "string"
              },
              "comments": {
                "maxLength": 2000,
                "type": "string"
              },
              "email": {
                "description": "The traveller's own email address, exactly as they gave it in the conversation. This is the only way Jenesis can reply, so it must be an address they actually read. Never guess one, derive one from their name, or fill in a documentation placeholder such as an example.com address — ask the traveller for it instead.",
                "format": "email",
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "endDate": {
                "type": "string"
              },
              "enquiryType": {
                "enum": ["private", "group", "phuket_fit"],
                "type": "string"
              },
              "experience": {
                "enum": ["wellness-retreats", "boutique-hotels", "culinary-tours", "adventure", "family-holiday", "destination-wedding", "cultural-heritage", "romantic-escapes", "island-coastal", "home-away", "amanta-sathorn", "riverine-place", "not-sure"],
                "type": "string"
              },
              "fitnessLevel": {
                "enum": ["Beginner", "Intermediate", "Advanced"],
                "type": "string"
              },
              "groupObjective": {
                "maxLength": 2000,
                "type": "string"
              },
              "groupProgramme": {
                "enum": ["corporate-incentive", "bangkok-phuket", "bangkok-pattaya", "phuket-krabi", "retreat", "trade-partner", "private-group", "not-sure"],
                "type": "string"
              },
              "groupSize": {
                "enum": ["8-20", "21-40", "41-80", "81-120", "120+", "not-sure"],
                "type": "string"
              },
              "message": {
                "maxLength": 2000,
                "type": "string"
              },
              "name": {
                "description": "The traveller's own name, exactly as they gave it in the conversation. Do not invent one.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "phone": {
                "type": "string"
              },
              "phuketFitPackage": {
                "enum": ["5N/6D Fit Reset", "6N/7D Fit & Wellness Journey", "7N/8D Signature Phuket Fit Camp", "Not sure yet"],
                "type": "string"
              },
              "roomType": {
                "enum": ["1-bed-deluxe", "1-bed-executive", "2-bed-deluxe", "2-bed-executive", "1-bed", "2-bed", "3-bed"],
                "type": "string"
              },
              "startDate": {
                "type": "string"
              },
              "travelers": {
                "enum": ["1", "2", "3-4", "5-8", "9+", "5+"],
                "type": "string"
              }
            },
            "required": ["email", "enquiryType", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f05366ffe96db8fa3ed392ca94ac0b052ce3c40525e4c55ef84135cd0465a82d"
        }
      ],
      "digest": "sha256:ad0ddd136bf6fa853e0c56b83f5f9029f10c1637c24cb59f9127e003862ae29b"
    }
  }
}
