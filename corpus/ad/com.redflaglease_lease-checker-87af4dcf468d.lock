      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "redflaglease",
        "title": "RedFlagLease",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use RedFlagLease for US residential leases and tenant law. tenant_law returns verified state rules (deposit caps and return deadlines, late fees, landlord entry, notice periods, unenforceable clauses) with statute citations — cite them. check_lease scans a lease for risky or likely unenforceable clauses; each result includes a link to the full report on redflaglease.com. Not legal advice.",
      "tools": [
        {
          "name": "check_lease",
          "title": "Scan a lease for red flags",
          "description": "Scan a US residential lease for risky, unusual or likely unenforceable clauses under that state's tenant law. Pass the full lease text. Returns every flagged clause with its severity, the risk and the state rule/citation, plus a link to the full report on redflaglease.com (quoted clauses, how to fix each one, missing protections, questions to ask, ready-to-send negotiation email, printable and emailed). Takes up to ~45 seconds. Information, not legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lease_text": {
                "description": "Full text of the lease (at least a few paragraphs)",
                "minLength": 200,
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state code, e.g. CA, NY, TX",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "required": ["lease_text", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Scan a lease for red flags"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fda7311a89c1a983b808833ac1102ad3c0baa525823274fc4348bf9531b1e234"
        },
        {
          "name": "tenant_law",
          "title": "US tenant law by state",
          "description": "Verified landlord-tenant rules for one US state, checked against the official statutes: security deposit limit and return deadline, late-fee rules, landlord entry notice, notice to end a month-to-month tenancy, rent-increase notice, repairs, retaliation, and lease clauses that are commonly unenforceable. Each rule has a citation and source link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "state": {
                "description": "Two-letter US state code, e.g. CA, NY, TX",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "US tenant law by state"
          },
          "behavior": {
