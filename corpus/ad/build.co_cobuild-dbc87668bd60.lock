        {
          "name": "search",
          "title": "Search co.build",
          "description": "Find devices and public-source mods by device name, model, feature, or project name. Use concise keywords, e.g. 'WHOOP', 'Kindle', or 'sleep export'. Returns descriptions and up to 20 matches per page. Pass nextOffset as offset with the same query and filters to continue. Use type: mod to skip devices, or deviceId/platform/kind/dataSource/needsSubscription/maxSetupMinutes to constrain mods. Filters require documented values and exclude unknowns; local dataSource is not an offline guarantee. Suggestions are approximate alternatives when no exact matches exist; confirm the intended device before setup. No match means no catalog evidence, not proof that a mod cannot exist.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "dataSource": {
                "description": "Catalog data source, not a guarantee of offline operation.",
                "enum": ["bluetooth", "local", "official-api", "unofficial-api", "export"],
                "type": "string"
              },
              "deviceId": {
                "description": "Restrict to this device, including explicitly linked cross-device mods.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "kind": {
                "enum": ["app", "cli", "dashboard", "server", "mcp", "plugin", "firmware", "api"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "maxSetupMinutes": {
                "maximum": 10080,
                "minimum": 0,
                "type": "integer"
              },
              "needsSubscription": {
                "description": "false requires an explicit no-subscription claim; unknown is excluded.",
                "type": "boolean"
              },
              "offset": {
                "default": 0,
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              },
              "platform": {
                "description": "Require documented works or partly support; unknown support is excluded.",
                "enum": ["iphone", "ipad", "android", "mac", "windows", "linux"],
                "type": "string"
              },
              "query": {
                "description": "Concise keywords, not a sentence. Use filters for constraints.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "type": {
                "default": "all",
                "enum": ["all", "device", "mod"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "guidance": {
                "type": "string"
              },
              "nextOffset": {
                "type": ["number", "null"]
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "type": "string"
                    },
                    "deviceId": {
