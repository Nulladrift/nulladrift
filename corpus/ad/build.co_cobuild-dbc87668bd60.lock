                "enum": ["agent_observed", "user_reported"],
                "type": "string"
              },
              "firmware": {
                "anyOf": [
                  {
                    "pattern": "^[vV]?\\d[a-zA-Z0-9]{0,7}(?:[.-][a-zA-Z0-9]{1,8}){0,5}(?: ?\\([a-zA-Z0-9]{1,10}\\))?$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "functionality": {
                "enum": ["works", "partly", "broken", "not_tested"],
                "type": "string"
              },
              "installation": {
                "enum": ["installed", "blocked", "abandoned"],
                "type": "string"
              },
              "modId": {
                "description": "Mod slug or mod: search ID.",
                "pattern": "^(?:mod:)?[a-z0-9][a-z0-9-]{0,99}$",
                "type": "string"
              },
              "modVersion": {
                "anyOf": [
                  {
                    "pattern": "^[vV]?\\d[a-zA-Z0-9]{0,7}(?:[.-][a-zA-Z0-9]{1,8}){0,5}(?: ?\\([a-zA-Z0-9]{1,10}\\))?$",
