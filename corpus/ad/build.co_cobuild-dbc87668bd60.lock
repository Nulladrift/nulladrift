        {
          "name": "fetch",
          "title": "Fetch a co.build record",
          "description": "Read a device or mod found by search. Pass its exact prefixed ID, such as device:whoop or mod:open-health. Returns source text and a citation URL. Device results contain the first 20 mods; use get_device for further pages.",
