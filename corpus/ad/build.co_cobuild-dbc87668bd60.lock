                              "type": "object"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "Net GitHub stars gained over the last `days` days."
                        },
                        "strength": {
                          "additionalProperties": false,
                          "description": "How much each signal lifts its place, 0 (none yet) to 4 (exceptional), relative to the most that signal can add. Not weights or scores. use: downloads, installs and stars; growth: stars gained; talk: people sharing it; builders: people building it.",
                          "properties": {
                            "builders": {
