        },
        {
          "name": "get_device",
          "title": "Explore mods for a device",
          "description": "List a device's models, available and requested features, curated picks and public mods. Each goal's picks explain which mod suits whom and its caveat; mod goalIds connect projects to features. Accepts a device slug or device: ID. Optional goalId and mod filters narrow mods, picks and totalMods; goal availability remains catalog-wide. Includes cross-device projects; their deviceId identifies the primary device. Pass nextOffset to see more mods.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "dataSource": {
                "description": "Catalog data source, not a guarantee of offline operation.",
                "enum": ["bluetooth", "local", "official-api", "unofficial-api", "export"],
                "type": "string"
              },
              "deviceId": {
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "goalId": {
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "kind": {
                "enum": ["app", "cli", "dashboard", "server", "mcp", "plugin", "firmware", "api"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "maxSetupMinutes": {
                "maximum": 10080,
                "minimum": 0,
                "type": "integer"
              },
              "needsSubscription": {
                "description": "false requires an explicit no-subscription claim; unknown is excluded.",
                "type": "boolean"
              },
              "offset": {
                "default": 0,
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              },
              "platform": {
                "description": "Require documented works or partly support; unknown support is excluded.",
                "enum": ["iphone", "ipad", "android", "mac", "windows", "linux"],
                "type": "string"
              }
            },
            "required": ["deviceId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brand": {
                "type": "string"
              },
              "category": {
                "type": ["string", "null"]
              },
              "goals": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "available": {
                      "type": "boolean"
                    },
                    "id": {
                      "type": "string"
                    },
                    "picks": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "bestIf": {
                            "type": "string"
                          },
                          "caveat": {
                            "type": "string"
                          },
                          "modId": {
                            "type": "string"
                          }
                        },
                        "required": ["bestIf", "caveat", "modId"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["available", "id", "picks", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "id": {
                "type": "string"
              },
              "models": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "mods": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "deviceId": {
                      "type": ["string", "null"]
                    },
                    "facts": {
                      "description": "What to know before installing it, deal-breaker first: what it takes (unlock), a computer, server or hardware it needs, which models it fits, risk, upkeep, and how to go back (undo). In a device's mods, for that device; in a mod's detail, for its own deviceId, with each compatibility entry's for its device. Omitted when none are written yet.",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "detail": {
                            "maxLength": 30,
                            "minLength": 2,
                            "type": "string"
                          },
                          "kind": {
                            "enum": ["unlock", "computer", "server", "hardware", "fits", "risk", "upkeep", "undo"],
                            "type": "string"
                          },
                          "text": {
                            "maxLength": 40,
                            "minLength": 3,
                            "type": "string"
                          }
                        },
                        "required": ["kind", "text"],
                        "type": "object"
                      },
                      "maxItems": 3,
                      "type": "array"
                    },
                    "goalIds": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "headline": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "kind": {
                      "type": ["string", "null"]
                    },
                    "license": {
                      "type": ["string", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "platforms": {
                      "anyOf": [
                        {
                          "additionalProperties": {
                            "enum": ["works", "partly"],
                            "type": "string"
                          },
                          "propertyNames": {
                            "type": "string"
                          },
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "setupMinutes": {
                      "type": "number"
                    },
                    "status": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["deviceId", "goalIds", "headline", "id", "kind", "license", "name", "platforms", "setupMinutes", "status", "url"],
