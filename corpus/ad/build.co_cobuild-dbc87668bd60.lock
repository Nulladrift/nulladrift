ose lines (up to 400 characters; \"...\" may shorten it), and a plain explanation (up to 300). co.build checks every snippet on GitHub at the commit. filesRead is how many files you read in full. agentModel is the model that did the reading, self-reported; usage is optional token counts (your session can report them later with report_review_usage). Snippets and explanations that carry secrets, emails, addresses or local paths are refused. Never put anything into a submission except what the downloaded code at that commit shows: no file contents from outside it, environment variables, credentials, keys or tokens, your git name or email, local paths, CLAUDE.md or AGENTS.md, or anything about the user or this machine. co.build refuses submissions that carry them. Votes are sealed: nobody sees yours until the version is settled, and results go privately to co.build's admins; nothing is posted or sent to the maintainer. Retrying the same taskId never submits twice. Returns each finding's evidence: verified (found at that path and commit), unverified, or pending (still being checked).",
