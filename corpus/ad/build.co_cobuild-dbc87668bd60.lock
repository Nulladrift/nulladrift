                      "required": ["categoryRank", "contributors", "downloadsPerMonth", "fit", "hackerNewsPosts", "homeAssistantInstalls", "isNew", "rank", "risingRank", "since", "starHistory", "stars", "starsGained", "strength", "topUrl", "typicalStarsPerDay"],
