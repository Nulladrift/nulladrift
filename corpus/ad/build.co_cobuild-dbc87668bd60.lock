                      "additionalProperties": false,
                      "properties": {
                        "categoryRank": {
                          "anyOf": [
                            {
                              "additionalProperties": false,
                              "properties": {
                                "categoryId": {
                                  "type": "string"
                                },
                                "name": {
                                  "type": "string"
                                },
                                "rank": {
                                  "type": "number"
                                }
                              },
                              "required": ["categoryId", "name", "rank"],
                              "type": "object"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "Its best place on a kind of device's list (get_top_mods categoryId); null when it isn't on one."
                        },
                        "contributors": {
                          "description": "People with commits to its code.",
                          "type": ["number", "null"]
