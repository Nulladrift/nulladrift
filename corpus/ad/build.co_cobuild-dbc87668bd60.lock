                "description": "One kind of device, from categories. Omit for all devices.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "deviceIds": {
                "description": "Only mods for these catalog devices (IDs from search or get_device), each at its best place among them.",
                "items": {
                  "maxLength": 160,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 40,
                "type": "array"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "sort": {
                "default": "top",
                "description": "top: most used and trusted. rising: gaining fastest right now.",
                "enum": ["top", "rising"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "categories": {
                "description": "Kinds of device with their own list; pass an id as categoryId.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "count": {
                      "description": "Ranked mods for this kind of device.",
                      "type": "number"
                    },
                    "id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["count", "id", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "entries": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "device": {
                      "additionalProperties": false,
                      "description": "The device it's ranked for here.",
                      "properties": {
                        "id": {
                          "type": "string"
