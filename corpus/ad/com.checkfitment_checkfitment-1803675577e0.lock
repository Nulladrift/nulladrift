              },
              "old_tire": {
                "description": "Factory tire. Metric like 265/70R17 (P or LT prefix allowed) or flotation like 33x12.50R17; no load index or speed rating.",
                "type": "string"
              },
              "speed_mph": {
                "description": "Road speed for the RPM figures (default 65).",
