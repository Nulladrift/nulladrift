      "instructions": "Wheel and tire fitment from checkfitment.com. Use bolt_pattern_lookup for a vehicle's bolt pattern, center bore, thread, lug torque and OEM wheel and tire sizes (the dataset covers a fixed set of vehicles; when the tool says not_in_database, say so and never fill in specs from memory). Use wheel_fitment_check to compare a current and a new wheel-and-tire setup (poke, inner clearance, tire-on-rim fit), tire_size_compare for diameter and speedometer change, wheel_spacer_calculator for spacer size and slip-on stud engagement, gear_ratio_calculator for effective ratio, RPM and regear, bolt_pattern_facts for a pattern's inch equivalent, look-alikes and vehicles. Never ask for names, VINs, licence plates or addresses; the tools need make, model, year and numbers only. Repeat the safety line of every answer, keep the link line at the end, and give no prices or shopping advice.",
      "tools": [
        {
          "name": "bolt_pattern_facts",
          "title": "Bolt pattern in mm and inches, look-alikes",
          "description": "Use for \"what is 5x114.3 in inches\", \"is 5x114.3 the same as 5x115\", \"will 6x135 wheels fit 6x139.7\", or which vehicles use a pattern. Converts mm and inch notation, lists look-alike patterns that do not interchange, the vehicles in the dataset with that pattern, the lug tightening order and typical torque ranges by stud size (guidance only). Every result carries a link field: end the answer with that link as a markdown link, as the source page with the full citations.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "pattern": {
                "description": "5x114.3, 5x4.5, 6x139.7, 8x6.5 …",
