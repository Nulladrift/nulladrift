        {
          "name": "wheel_fitment_check",
          "title": "Will these wheels (and tires) fit",
          "description": "Use to compare a current wheel (and tire) with a new one: how far the outer edge pokes toward the fender and the inner edge toward the suspension, the diameter and ride-height change, speedometer effect, backspacing, and whether the new tire width suits the new rim width. With measured clearances (outer: tire edge to fender lip; inner: to the nearest suspension part, both on the current setup) it returns fits / tight / rub. Leave the tire fields out for a wheel-only offset comparison. Every result carries a link field: end the answer with that link as a markdown link, as the source page with the full citations.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "current_offset_mm": {
                "maximum": 100,
                "minimum": -100,
                "type": "number"
              },
              "current_tire": {
                "description": "Current tire size. Metric like 265/70R17 (P or LT prefix allowed) or flotation like 33x12.50R17; no load index or speed rating.",
                "type": "string"
              },
              "current_wheel_width_in": {
                "maximum": 16,
                "minimum": 4,
                "type": "number"
              },
              "inner_clearance_mm": {
                "description": "Measured on the current setup: inner sidewall to the nearest suspension or body part.",
                "minimum": 0,
                "type": "number"
              },
              "new_offset_mm": {
                "maximum": 100,
                "minimum": -100,
                "type": "number"
              },
              "new_tire": {
                "description": "New tire size. Metric like 265/70R17 (P or LT prefix allowed) or flotation like 33x12.50R17; no load index or speed rating.",
                "type": "string"
              },
              "new_wheel_width_in": {
                "maximum": 16,
                "minimum": 4,
                "type": "number"
              },
              "outer_clearance_mm": {
