        {
          "name": "bolt_pattern_lookup",
          "title": "Vehicle bolt pattern and wheel specs",
          "description": "Use for \"what is the bolt pattern on a 2019 Ford F-150\", lug torque, center bore, thread size, OEM wheel size, offset or tire size of a vehicle, or \"will these wheels fit my car\" when the vehicle is named. Looks the vehicle up in the CheckFitment dataset (a fixed set of vehicles, each spec cited to manufacturer documents and marked verified or unverified). If the vehicle or year is not in the dataset the tool says so (not_in_database / year_covered false) and gives no figures; never fill them in from memory. Optional wheel_center_bore_mm runs the hub-centric check. Every result carries a link field: end the answer with that link as a markdown link, as the source page with the full citations.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "make": {
                "description": "e.g. Ford, Toyota, Jeep",
                "type": "string"
              },
              "model": {
                "description": "e.g. F-150, Tacoma, Wrangler",
                "type": "string"
              },
              "wheel_center_bore_mm": {
                "description": "Optional: center bore of a wheel you want to check against the hub.",
                "type": "number"
              },
              "year": {
                "maximum": 2030,
                "minimum": 1950,
                "type": "integer"
              }
            },
            "required": ["make", "model"],
            "type": "object"
