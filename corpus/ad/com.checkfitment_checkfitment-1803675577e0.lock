        {
          "name": "gear_ratio_calculator",
          "title": "Gear ratio after a tire change, regear",
          "description": "Use for \"what does my 3.73 axle behave like on 35s\", \"what ratio do I need to regear for 33s\", RPM at highway speed after a tire change, or the crawl ratio (with transfer-case low ratio and first gear). Returns the effective ratio, RPM before and after in a 1:1 gear, the ratio that restores stock feel, the nearest gear set actually sold and how serious the change is. Every result carries a link field: end the answer with that link as a markdown link, as the source page with the full citations.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "axle_ratio": {
                "description": "Current axle (differential) ratio, e.g. 3.73.",
                "maximum": 8,
                "minimum": 1.5,
                "type": "number"
              },
              "first_gear_ratio": {
                "maximum": 10,
                "minimum": 1,
                "type": "number"
              },
              "new_tire": {
                "description": "New tire. Metric like 265/70R17 (P or LT prefix allowed) or flotation like 33x12.50R17; no load index or speed rating.",
