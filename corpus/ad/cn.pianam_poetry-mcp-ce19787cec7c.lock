  "subjects": {
    "cn.pianam/poetry-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pianam.cn/poetry-mcp/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "poetry-mcp",
        "version": "4.1.3"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "logging": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "random_poem",
          "title": "Random Poem",
          "description": "随机返回一首古典诗词（含诗题、朝代、作者、全文），适合每日一诗/创作灵感。可传 category 指定类别：唐诗/宋词/元曲/诗经/楚辞/论语/宋词三百首，不传则从全部约9万首中随机。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "可选类别：唐诗 / 宋词 / 元曲 / 诗经 / 楚辞 / 论语 / 宋词三百首"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:c585d8048450ce5fa8fb70abe407d03dd44c390948cbd69b9cf241c1614b4172"
        },
        {
          "name": "search_poem",
          "title": "Search Poem",
          "description": "检索中华古典诗词：支持按关键词（诗题/诗句内容）、作者（如李白、杜甫、苏轼、李清照）、朝代类别（唐诗/宋词/元曲/诗经/楚辞/论语/宋词三百首）组合查询，返回诗题、朝代、作者与全文。库内含约9万首：唐诗约5.7万、宋词约2.1万、元曲约1.1万及诗经305首、楚辞65篇等。limit 控制返回条数（1-50，默认10）。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "author": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "作者名，如 李白 / 杜甫 / 苏轼 / 辛弃疾 / 李清照"
              },
              "category": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "类别：唐诗 / 宋词 / 元曲 / 诗经 / 楚辞 / 论语 / 宋词三百首（可省略）"
              },
              "keyword": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "关键词，可为诗题（如 静夜思）、诗句片段（如 床前明月光）或任意内容词"
              },
              "limit": {
                "default": 10,
                "description": "返回条数，1-50，默认 10",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:345c9dead9e864c51f6e5051ee8ed61524e813757baad30183a06a68f51d3314"
        }
      ],
      "digest": "sha256:e9e50b6e21c3ad60838a5c61bc9b36eae13c6400cc829248b8693cfa1b66e9fd"
    }
  }
}
