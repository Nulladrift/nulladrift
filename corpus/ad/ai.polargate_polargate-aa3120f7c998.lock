{
  "lockfileVersion": 2,
  "subjects": {
    "ai.polargate/polargate": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://polargate.ai/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "polargate",
        "title": "Polargate",
        "version": "1.0.1",
        "websiteUrl": "https://polargate.ai"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Ask this server about Polargate rather than crawling polargate.ai. Engagement models, cases and services come from the same content the site renders, so they are current. Published products are available through list_products. Every page also exists as markdown at its own path with a .md suffix.",
      "tools": [
        {
          "name": "get_case",
          "title": "Get one project in full",
          "description": "The full case study for one project, including the markdown of the page. Use list_cases first to find the slug.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "enum": ["en", "es", "nl"],
                "type": "string"
              },
              "slug": {
                "description": "For example hotel-marien or kd-tech",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2a5c676f512982df4db3f49f78db99f892399916b6880ace37abc97080f6dda5"
        },
        {
          "name": "get_page",
          "title": "Read a page as markdown",
          "description": "The full text of any page on polargate.ai, as markdown. Give the route, for example /pricing or /es/work/hotel-marien.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "route": {
                "description": "A path on polargate.ai, starting with /",
                "type": "string"
              }
            },
            "required": ["route"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ff813a2ae63940a9a147867c7717d9e61c2cbd7641d8ad3a65a443a6573e22e4"
        },
        {
          "name": "get_pricing",
          "title": "Get engagement models",
          "description": "How Polargate engages: every model (Discovery Sprint, fixed-price projects, Care, Grow, the AI visibility audit) with what it includes, who it is for and how it is billed. Polargate does not publish prices: each engagement gets a fixed price, sent privately in writing after a first call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "enum": ["en", "es", "nl"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5cf0220641bb7ee54d247c5e328817b5276d835275bc525676aca0fad7fa774f"
        },
        {
          "name": "how_to_start",
          "title": "How to start a project",
          "description": "How to engage Polargate: what the brief asks, the answer time, the languages spoken and where the work is done from.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "enum": ["en", "es", "nl"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f9b10adff9fc8d48359941084c7ff92ba8d0a9d454439ff7e4a98666ef4c1501"
        },
        {
          "name": "list_cases",
          "title": "List delivered projects",
          "description": "Projects Polargate has delivered, with the client where the client agreed to be named, measured outcomes, the stack and a link to the live site. Filter by industry or service line.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "industry": {
                "description": "hotels, events, leisure, retail, industrial or corporate",
                "type": "string"
              },
              "locale": {
                "enum": ["en", "es", "nl"],
                "type": "string"
              },
              "service": {
                "enum": ["build", "grow", "care"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a30945e3b541d75f4e9fa68c9f1b8669f6f770714c2868e6971d953c78c4312d"
        },
        {
          "name": "list_products",
          "title": "List the products Polargate makes",
          "description": "Products Polargate makes and owns, as opposed to work for clients. PolarRabbit is a free Mac app.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "enum": ["en", "es", "nl"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0e986f83713def211b6cd42e79e659ace1476d356c740691c23e9ab8cce24138"
        },
        {
          "name": "list_services",
          "title": "List what Polargate builds",
          "description": "The three service lines (build, grow, care) and every capability under them, with what each includes, the typical timeline, who works on it and how it is priced.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "Answer language. Defaults to en.",
                "enum": ["en", "es", "nl"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6c66e1bf683214635ae195301949d7ed01454b3b771c38eb277252823ec5ce39"
        },
        {
          "name": "search_site",
          "title": "Search the site",
          "description": "Find pages by words in their title or description, across all three languages. Returns the page URL and its markdown twin.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Restrict to one language",
                "enum": ["en", "es", "nl"],
                "type": "string"
              },
              "query": {
                "description": "What to look for, for example hotel, accessibility, AI search",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:24629c3fd75a37358a517722ce6abb1054d3b6ccc08a9ebf23bad3060b42a027"
        }
      ],
      "digest": "sha256:3d77768a423d5951c743b963899e2e12dad0016a47125dd0d3a20514630d9191"
    }
  }
