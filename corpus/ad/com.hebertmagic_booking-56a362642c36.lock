      },
      "transport": {
        "type": "http",
        "url": "https://hebertmagic.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "hebert-magic-booking",
        "title": "Rick Hebert Magic — Booking",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Book Rick Hebert — a Houston, Texas magician and mentalist (comedy close-up magic and mind reading for corporate events, weddings, and parties). Use list_packages and get_contact to answer questions, and book_event to submit a request on the user's behalf. Rick personally reviews and confirms every request — booking a date is never instant. Confirm the event details plus the user's name and an email or phone before calling book_event.",
      "tools": [
        {
          "name": "book_event",
          "description": "Submit a request to book Rick Hebert for an event. This sends the details to Rick, who personally reviews every request and replies (usually within a day) to confirm availability, pricing, and details — it does NOT instantly confirm or hold a date. Collect the contact's name and at least an email or phone number before calling. Rick is based near Houston, TX and travels for the right event.",
          "inputSchema": {
            "properties": {
              "contact_pref": {
                "description": "How they'd prefer Rick to reach back — e.g. 'email', 'phone', or 'text'.",
                "type": "string"
              },
              "email": {
                "description": "Contact email address. Provide this and/or a phone number.",
                "type": "string"
              },
              "event_city": {
                "description": "City and/or venue. Rick is based near Houston, TX (Greater Houston: The Woodlands, Sugar Land, Galveston, Clear Lake) and travels for the right event.",
                "type": "string"
              },
              "event_date": {
                "description": "Event date in YYYY-MM-DD format. Omit or leave blank if not set yet.",
                "type": "string"
              },
              "event_time": {
                "description": "Approximate start time, e.g. '7:00 PM'.",
                "type": "string"
              },
              "event_type": {
                "description": "The occasion — e.g. wedding, corporate event, birthday party, holiday party, gala, fundraiser.",
                "type": "string"
              },
              "format": {
                "description": "Preferred format, if known: 'Strolling Close-Up', 'The Stand-Up Show', or 'The Full Evening'. See list_packages. Omit if unsure — Rick will recommend.",
                "type": "string"
              },
              "guest_count": {
                "description": "Approximate number of guests, e.g. '50' or '75-100'.",
                "type": "string"
              },
              "message": {
                "description": "Anything else about the event or what they're looking for.",
                "type": "string"
              },
              "name": {
                "description": "Full name of the person booking.",
                "type": "string"
              },
              "phone": {
                "description": "Contact phone number. Provide this and/or an email.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2d20a4b64b282eddae33c64e577e43c2d3efe2bc4b1ec3f29530ac576c1369de"
        },
        {
          "name": "get_contact",
          "description": "Get Rick Hebert's contact details (phone, email) and the area he serves. Use when the user wants to reach Rick directly or asks where he performs.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4f1e0c9a8a36fb1e150c57564d6767b313032ebc8f47d7a8a54d3f0f7ed92b43"
        },
        {
          "name": "list_packages",
          "description": "List Rick Hebert's three booking formats (each custom-quoted): Strolling Close-Up, The Stand-Up Show, and The Full Evening. Use to help a user choose a format before booking.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
