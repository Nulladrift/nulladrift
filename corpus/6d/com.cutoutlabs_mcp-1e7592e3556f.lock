      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "cutoutlabs",
        "title": "Cutout Labs",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Remove image backgrounds with remove_background. Requires a free Cutout Labs API key sent as X-Api-Key or Authorization: Bearer. Get one at https://www.cutoutlabs.com/background-removal-api",
      "tools": [
        {
          "name": "get_quota",
          "title": "Check remaining free calls",
          "description": "Return how many free remove_background calls remain today for the API key.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:248a19bde195be0d1c71b87f521350b4b412eac754f569253865ecdeff648414"
        },
        {
          "name": "remove_background",
          "title": "Remove image background",
          "description": "Remove the background from an image and return the cutout. Provide exactly one of image_url or image_base64. Returns a transparent PNG by default, or the subject on a solid colour when bg_color is set. When several objects or a person and a product appear together, the model may keep or drop some of them (for example a hand holding a product); use roi to restrict the subject area. Parts of a subject hidden behind something else cannot be recovered.",
          "inputSchema": {
            "properties": {
              "bg_color": {
                "description": "Optional background colour, e.g. ffffff or white.",
                "type": "string"
              },
              "clean_edges": {
                "default": false,
                "description": "Remove coloured fringes from the old background in hair, fur, and soft edges.",
                "type": "boolean"
              },
              "crop": {
                "default": false,
                "description": "Crop the output to the subject.",
                "type": "boolean"
              },
              "format": {
                "default": "png",
                "enum": ["png", "webp", "jpg"],
                "type": "string"
              },
              "image_base64": {
                "description": "Base64-encoded source image (max 12 MB decoded).",
                "type": "string"
              },
              "image_url": {
                "description": "Public http(s) URL of the source image (max 12 MB).",
                "type": "string"
              },
              "roi": {
                "description": "Region of interest as 'x1 y1 x2 y2' in px or %, e.g. '20% 10% 80% 95%'. Only the subject inside this box is kept.",
                "type": "string"
              },
              "size": {
                "default": "medium",
                "description": "Output resolution: preview ≈ 0.25 MP, medium 1.5 MP, hd 4 MP. Use the HTTP API for larger outputs.",
                "enum": ["preview", "medium", "hd"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4989b547b1c52110fbd725a3ecdb0d7fb6c497edbbea16e3be179dd07d696024"
        }
      ],
      "digest": "sha256:081797b25682e355322a43b6651e7efda49555281dc96afefcb154f4240d562f"
    }
  }
