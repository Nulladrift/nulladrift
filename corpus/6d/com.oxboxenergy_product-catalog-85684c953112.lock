{
  "lockfileVersion": 2,
  "subjects": {
    "com.oxboxenergy/product-catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.oxboxenergy.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "oxboxenergy.com",
        "title": "Oxbox Energy product catalogue",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only access to the public website of Oxbox Energy (https://oxboxenergy.com/): one product, the Oxbox 48 V battery energy storage system, with its brochure (a digital and a printable copy of the same text). The website publishes no datasheet, safety data sheet, manual or warranty document; the brochure's specification table is the source for figures. \"SDS\" in that table is a seismic rating, not a safety data sheet. The catalogue is rebuilt from the website every night. Link the source of every fact you give. Give the brochure and page with any figure quoted from it. Oxbox Energy has no online sizing tool; its engineers size systems from a quote request. For prices or a quote, quote_request says what to send and where. This connector only reads the website: it cannot send a message, place a request or run a calculation for anyone.",
      "tools": [
        {
          "name": "fetch",
          "title": "Read a page or document",
          "description": "Read the full text of one result from search, find_series or get_documents (a web page, a PDF, or a product series) with its link.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "An id returned by search, find_series or get_documents.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a page or document"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5eb149daaa38cc7ffd6f059ef02cbdd47f5071b05371f9047f657c7a532a0e8a"
        },
        {
          "name": "find_series",
          "title": "Find a battery series",
          "description": "Return the Oxbox, the one product Oxbox Energy offers (48 V, VRLA gel tubular plate, for solar and home backup), with its page and brochure.",
          "inputSchema": {
            "properties": {
              "application": {
                "description": "e.g. solar, home backup",
                "type": "string"
              },
              "chemistry": {
                "description": "e.g. gel, tubular plate",
                "type": "string"
              },
              "include_discontinued": {
                "description": "Include series the site marks as discontinued (default false).",
                "type": "boolean"
              },
              "text": {
                "description": "Words from the series name or model, e.g. \"Oxbox\"",
                "type": "string"
              },
              "voltage": {
                "description": "Nominal voltage, e.g. \"48 V\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a battery series"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4611f8021c64d57b195455a0fad043a145df76689d4fc459ad7703a2056e9824"
        },
        {
          "name": "get_documents",
          "title": "List the Oxbox brochures",
          "description": "List the documents Oxbox Energy publishes: the Oxbox brochure, as a digital copy (4 pages) and a printable copy (3 pages) of the same text. The specifications are on the brochure's last page. The website publishes no datasheet, SDS, manual or warranty document.",
          "inputSchema": {
            "properties": {
              "series": {
                "description": "A series id from find_series, or its name",
                "type": "string"
              },
              "type": {
                "enum": ["brochure"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List the Oxbox brochures"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a5d539ffff08301884755fcf3e7bb705334fe969ea7204286d99484d5735c251"
        },
        {
          "name": "quote_request",
          "title": "How to request a quote",
          "description": "How to ask Oxbox Energy for a quote or price: the address to write to, and what to include so the engineers can answer without a round of questions. It sends nothing; the customer sends the request themselves.",
          "inputSchema": {
            "properties": {
              "application": {
                "description": "Optional: what it is for",
                "type": "string"
              },
              "series": {
                "description": "Optional: the series or product the quote is for",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How to request a quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7cc50f2b56b10aa8b7767c1fecddc8d1dc6693367044bdab8874e71fc9cdebd2"
        },
        {
          "name": "search",
          "title": "Search Oxbox Energy",
          "description": "Search the Oxbox Energy website: the home page and the Oxbox brochure (specifications, certifications, enclosure and installation details). Ask in plain words, e.g. \"Oxbox capacity in kWh\" or \"Oxbox UL listing\". Returns ids, titles and source links; read one with fetch.",
          "inputSchema": {
