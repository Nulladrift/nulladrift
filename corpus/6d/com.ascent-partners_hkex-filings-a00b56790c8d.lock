{
  "lockfileVersion": 2,
  "subjects": {
    "com.ascent-partners/hkex-filings": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://hkex-listco-updates.ascent-partners.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "hkex-filing-scraper-live",
        "version": "2.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Live, read-only access to HKEx (Hong Kong Stock Exchange) regulatory filings. Every call fetches fresh data from the HKEx website; nothing is stored. Use search_filings with a date window of at most 31 days to find filings, narrowing with the optional stock_code, title_query, document_type, category, and stock_name filters; use list_filing_facets to browse the categories, document types, and stock codes present in a window before drilling in. Then call get_filing on a returned link to download and extract its text and tables. This server never writes and never fetches arbitrary URLs.",
      "tools": [
        {
          "name": "get_filing",
          "title": "Read HKEx Filing",
          "description": "Download one HKEx document by its URL and read, page through, or search its text.\n\n    ``link`` must be an HKEx document URL from search_filings (host ``www1.hkexnews.hk``);\n    any other host is rejected. With ``extract=True`` (default) the response includes up to\n    30 ``tables`` and a window of extracted ``document_text``: ``max_chars`` characters\n    starting at ``offset``. Long reports return ``next_offset``; call again with it to read\n    the next window. Pass ``query`` to search the whole document instead: the response then\n    lists up to 20 case-insensitive matches with their offsets and surrounding text, plus\n    ``match_count`` — use a match offset to read that part. Set ``extract=False`` for size\n    and content type only.\n    ",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "extract": {
                "default": true,
                "description": "Extract text and tables; false returns size and content type only",
                "type": "boolean"
              },
              "link": {
                "description": "HKEx document URL from a search_filings result (host www1.hkexnews.hk)",
                "type": "string"
              },
              "max_chars": {
                "default": 300000,
                "description": "Maximum characters of document_text to return in this window",
                "maximum": 300000,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Character offset where the returned text window starts (use next_offset to page)",
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Optional text to find in the whole document; returns matches with offsets instead of a text window",
                "type": "string"
              }
            },
            "required": ["link"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "description": "The downloaded document, with text and tables when extract is true.",
                "properties": {
                  "content_type": {
                    "type": "string"
                  },
                  "document_text": {
                    "description": "Extracted Markdown text",
                    "type": "string"
                  },
                  "link": {
                    "type": "string"
                  },
                  "match_count": {
                    "description": "Total matches for query",
                    "type": "integer"
                  },
                  "matches": {
                    "items": {
                      "properties": {
                        "offset": {
                          "type": "integer"
                        },
                        "snippet": {
                          "type": "string"
                        }
                      },
                      "required": ["offset", "snippet"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "next_offset": {
                    "description": "Offset of the next window, or null at the end",
                    "type": ["integer", "null"]
                  },
                  "offset": {
                    "type": "integer"
                  },
                  "query": {
                    "type": "string"
                  },
                  "size_bytes": {
                    "type": "integer"
                  },
                  "tables": {
                    "items": {
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "tables_omitted": {
                    "type": "integer"
                  },
                  "text_length": {
                    "description": "Characters in this window",
                    "type": "integer"
                  },
                  "text_truncated": {
                    "description": "True when more text follows this window",
                    "type": "boolean"
                  },
                  "total_text_length": {
                    "description": "Characters in the whole extracted document",
                    "type": "integer"
                  }
                },
                "required": ["link", "size_bytes"],
                "type": "object"
              }
            },
            "required": ["result"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:385d05e2c2a5afd1ad142fc91155cc46cfae649495de779154f98465f512390e"
        },
        {
          "name": "get_server_info",
          "title": "Gateway Info",
          "description": "Report this live gateway's version, transport, and hard limits. Reads nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "description": "Gateway version, transport, tool list, filters, and hard limits.",
                "properties": {
                  "extraction": {
                    "type": "object"
                  },
                  "filters": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "limits": {
                    "type": "object"
                  },
                  "live": {
                    "type": "boolean"
                  },
                  "name": {
                    "type": "string"
                  },
                  "read_only": {
                    "type": "boolean"
                  },
                  "storage": {
                    "type": "string"
                  },
                  "tools": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "transport": {
                    "type": "string"
                  },
                  "version": {
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["result"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:88b9da726be2b6cf5f0b0681189acbd2dcd3684ead5be899b846565786286143"
        },
        {
          "name": "list_filing_facets",
          "title": "Browse Filing Facets",
          "description": "Browse what filings exist in a date window (at most 31 days) without downloading.\n\n    ``from_date``/``to_date`` accept YYYY-MM-DD or DD/MM/YYYY. Returns counts of the\n    categories (headline categories), document types, and stock codes present in the window,\n    each sorted by frequency and capped at 50 values, plus the distinct counts. Optionally\n    narrow to one ``stock_code``. Use this to discover valid filter values before calling\n    search_filings; it fetches the window once and extracts no document text.\n    ",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from_date": {
                "description": "YYYY-MM-DD or DD/MM/YYYY",
                "type": "string"
              },
              "max_results": {
                "description": "Maximum filings to scan (default 50, cap 200)",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "stock_code": {
                "description": "Optional exact HKEx stock code to narrow the facets",
                "type": "string"
              },
              "to_date": {
                "description": "YYYY-MM-DD or DD/MM/YYYY",
                "type": "string"
              }
            },
            "required": ["from_date", "to_date"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "description": "Counts of the window's categories, document types, and stock codes.",
                "properties": {
                  "categories": {
                    "items": {
                      "properties": {
                        "count": {
                          "description": "Filings carrying this value",
                          "type": "integer"
                        },
                        "value": {
                          "description": "The category, file type, or stock code",
                          "type": "string"
                        }
                      },
                      "required": ["count", "value"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "count": {
                    "description": "Filings scanned",
                    "type": "integer"
                  },
                  "distinct_categories": {
                    "type": "integer"
                  },
                  "distinct_document_types": {
                    "type": "integer"
                  },
                  "distinct_stock_codes": {
                    "type": "integer"
                  },
                  "document_types": {
                    "items": {
                      "properties": {
                        "count": {
                          "description": "Filings carrying this value",
                          "type": "integer"
                        },
                        "value": {
                          "description": "The category, file type, or stock code",
                          "type": "string"
                        }
                      },
                      "required": ["count", "value"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "from": {
                    "description": "Window start, YYYY-MM-DD",
                    "type": "string"
                  },
                  "stock_code_filter": {
                    "type": "string"
                  },
                  "stock_codes": {
                    "items": {
                      "properties": {
                        "count": {
                          "description": "Filings carrying this value",
                          "type": "integer"
                        },
                        "value": {
                          "description": "The category, file type, or stock code",
                          "type": "string"
                        }
                      },
                      "required": ["count", "value"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "to": {
                    "description": "Window end, YYYY-MM-DD",
                    "type": "string"
                  },
                  "total_reported": {
                    "type": ["integer", "null"]
                  }
                },
                "required": ["count", "from", "to"],
                "type": "object"
              }
            },
            "required": ["result"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5864606b417cf7a5bcd7685c196d318988b36618721d920a95a83679b14eca09"
        },
        {
          "name": "search_filings",
          "title": "Search HKEx Filings",
          "description": "Search live HKEx filings in a date window (at most 31 days).\n\n    ``from_date``/``to_date`` accept YYYY-MM-DD or DD/MM/YYYY. All filters are optional and\n    combine with AND semantics: ``stock_code`` matches exactly (e.g. ``01461`` or ``1461``);\n    ``title_query``, ``category`` and ``stock_name`` are case-insensitive substrings (e.g.\n    category ``Dividend``); ``document_type`` matches the file type exactly (e.g. ``PDF`` or\n    ``HTML``). Filters are applied to the fetched window, so widen ``max_results`` to catch\n    rarer matches. ``max_results`` caps the number of filings fetched and returned (hard cap\n    200). Returns the matching filings — each carrying ``fileType``, ``sizeText``,\n    ``category`` and ``newsId`` metadata — plus the HKEx-reported total for the window. Use\n    list_filing_facets first to see which categories, types and codes exist in a window.\n    ",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional case-insensitive substring of the headline category",
                "type": "string"
              },
              "document_type": {
                "description": "Optional exact file type, e.g. PDF, HTML, XLS, DOC",
                "type": "string"
              },
              "from_date": {
                "description": "YYYY-MM-DD or DD/MM/YYYY",
                "type": "string"
              },
              "max_results": {
                "description": "Maximum filings to fetch and return (default 50, cap 200)",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "stock_code": {
                "description": "Optional exact HKEx stock code, e.g. 01461",
                "type": "string"
              },
              "stock_name": {
                "description": "Optional case-insensitive substring of the stock short name",
                "type": "string"
              },
              "title_query": {
                "description": "Optional case-insensitive substring of the filing title",
                "type": "string"
              },
              "to_date": {
                "description": "YYYY-MM-DD or DD/MM/YYYY",
                "type": "string"
              }
            },
            "required": ["from_date", "to_date"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "description": "The filings matching the window and filters.",
                "properties": {
                  "count": {
                    "description": "Filings returned",
                    "type": "integer"
                  },
                  "filings": {
                    "description": "One entry per filing",
                    "items": {
                      "properties": {
                        "category": {
                          "description": "HKEx headline category",
                          "type": "string"
                        },
                        "date": {
                          "description": "Release date, DD/MM/YYYY",
                          "type": "string"
                        },
                        "fileType": {
                          "description": "PDF, HTML, XLSX, ...",
                          "type": "string"
                        },
                        "link": {
                          "description": "HKEx document URL",
                          "type": "string"
                        },
                        "newsId": {
                          "description": "HKEx news id",
                          "type": "string"
                        },
                        "sizeText": {
                          "description": "HKEx-reported size, e.g. 53KB",
                          "type": "string"
                        },
                        "stockCode": {
                          "type": "string"
                        },
                        "stockName": {
                          "type": "string"
                        },
                        "title": {
                          "type": "string"
                        }
                      },
                      "required": ["link", "stockCode", "title"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "filters": {
                    "description": "The filters applied",
                    "type": "object"
                  },
                  "from": {
                    "description": "Window start, YYYY-MM-DD",
                    "type": "string"
                  },
                  "to": {
                    "description": "Window end, YYYY-MM-DD",
                    "type": "string"
                  },
                  "total_reported": {
                    "description": "HKEx-reported total for the window, when known",
                    "type": ["integer", "null"]
                  }
                },
                "required": ["count", "filings", "from", "to"],
                "type": "object"
              }
            },
            "required": ["result"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f16faffe1768a7c79d315f69b5d07385653a99bcce0989fb9be03b4c9e0b428c"
        }
      ],
