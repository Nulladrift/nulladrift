        {
          "name": "mcp.score_server",
          "description": "Score an MCP server against the Revuo quality rubric. Pass either a product slug (scored from cached probe data on the product's direct-probe MCP entry; fast) OR an endpoint URL (probed live). Returns: { target, server, summary { coreAwarded/Max/Percent, extensionAwarded/Max/Percent, probedAt }, categories[] (ServerMetadata, CapabilityQuality, ConfigurationUX, RevuoExtensions), checks[] (every rubric check with awarded/max/passed/evaluated/fixSuggestion/evidence), topFixes[] (failed checks ranked by points-at-stake), probe (probe diagnostics) }. Core score (max 100) is Smithery-comparable. Extension score covers Revuo-specific signals (response time today; freshness, error envelope, schema stability are not yet implemented and report evaluated=false — excluded from totals, never counted as a failure). A check with evaluated=false is a Revuo gap, not the server's fault. Errors: { error: { code: 'bad_input'|'not_found', ... } }.",
          "inputSchema": {
            "properties": {
              "refresh": {
                "default": false,
                "description": "When passing slug, force a fresh probe instead of using cached probe data. Default false.",
                "type": "boolean"
              },
              "slug": {
                "default": null,
                "description": "Product slug whose direct-probe MCP server to score. Mutually exclusive with url.",
                "type": ["string", "null"]
              },
              "url": {
                "default": null,
                "description": "MCP endpoint URL (HTTPS) to probe and score. Mutually exclusive with slug.",
                "type": ["string", "null"]
