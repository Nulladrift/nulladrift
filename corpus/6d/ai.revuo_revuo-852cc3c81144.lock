                      "type": "array"
                    },
                    "houseProduct": {
                      "type": ["boolean", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "position": {
                      "type": "integer"
                    },
                    "rank": {
                      "type": "number"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "sponsored": {
