        },
        {
          "name": "book_time",
          "title": "Book a time",
          "description": "Books one open time for a buyer consultation or a listing appointment with London Foster Realty LLC. Needs the start of an open time, a first name, a phone or an email, and person_confirmed. Showings are not offered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "assistant": {
                "description": "Which assistant is sending this.",
                "enum": ["chatgpt", "claude", "gemini", "copilot", "perplexity", "siri", "alexa", "meta", "other"],
                "type": "string"
              },
              "email": {
                "description": "Give a phone or an email.",
                "maxLength": 160,
                "type": "string"
              },
              "first_name": {
                "maxLength": 60,
                "type": "string"
              },
              "kind": {
                "description": "buyer_consult: the person wants to buy a home. listing_appt: the person wants to sell their home.",
                "enum": ["buyer_consult", "listing_appt"],
                "type": "string"
              },
              "language": {
                "description": "The language the person wants.",
                "enum": ["en", "es"],
                "type": "string"
              },
              "last_name": {
                "maxLength": 60,
                "type": "string"
              },
              "note": {
                "description": "What they want, in their words (area, timing, the home).",
                "maxLength": 1000,
                "type": "string"
              },
              "person_confirmed": {
                "description": "true when the person agreed to this time and these details.",
                "type": "boolean"
              },
              "phone": {
                "description": "A US phone number. Give a phone or an email.",
                "maxLength": 30,
                "type": "string"
              },
              "start": {
                "description": "The start of an open time, exactly as listed.",
                "type": "string"
              }
            },
            "required": ["first_name", "kind", "person_confirmed", "start"],
            "type": "object"
          },
          "annotations": {
