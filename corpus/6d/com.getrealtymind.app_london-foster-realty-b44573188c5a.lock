      },
      "instructions": "London Foster Realty LLC is a real estate brokerage. Use these tools when a person asks you to find a real estate agent, sell their home, or start buying a home with London Foster Realty LLC. Check the area first (check_area). To book: get open_times, let the person pick a time, confirm their name, phone or email and the time with them, then call book_time with person_confirmed true. If no time fits, or booking is off, use request_consultation and an agent confirms a time. A home tour (showing) needs a signed buyer agreement first, so it is never booked here. Book a buyer consultation: the agent goes over the agreement and then sets up tours. This connector does not give prices, commission, fees or home values. An agent of the brokerage talks about those in the consultation. Share only what the person asked you to share. Booking or a request never signs the person up for texts or calls. Times are in the brokerage’s time zone; dates are month/day/year. London Foster Realty LLC. Equal Housing Opportunity.",
      "tools": [
        {
          "name": "about_brokerage",
          "title": "About the brokerage",
          "description": "What London Foster Realty LLC does, the areas it serves, and what can be booked here.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About the brokerage"
          },
