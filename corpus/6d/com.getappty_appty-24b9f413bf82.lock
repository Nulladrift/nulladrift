{
  "lockfileVersion": 2,
  "subjects": {
    "com.getappty/appty": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://getappty.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "appty",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Appty booking tools. Public tools (get_provider, find_open_slots, get_booking_link) need no API key. They return only what that provider's booking page shows. Provider tools need a signed-in connection, or Authorization: Bearer appty_sk_…. Sign in when asked, or create a key in Dashboard > Settings > AI assistants. Write tools return a preview first and only act when confirm=true. No money moves through the assistant. The client pays on Appty. Pay links and invoices only send a request the client pays on Appty.",
      "tools": [
        {
          "name": "book_session",
          "title": "Book a session",
          "description": "Book a client into a service at a start time, the same way the dashboard books. Returns a preview first and only acts when confirm=true. A past start is saved as completed with no email. A future start emails the usual confirmation. No money moves through the assistant. Any pay link is only a request the client pays on Appty.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "client_id": {
                "description": "Client id from list_clients.",
                "format": "uuid",
                "type": "string"
              },
              "confirm": {
                "description": "Set true only after the caller has seen a preview and wants it done. Anything else, including the string \"true\", is a preview and changes nothing.",
                "type": "boolean"
              },
              "service_id": {
                "description": "Service id. One-off shells are refused.",
                "format": "uuid",
                "type": "string"
              },
              "start": {
                "description": "Session start, ISO 8601. Does not have to be an open public slot.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["client_id", "service_id", "start"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Book a session"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:696d6426ad937058f515ede9d45740b4b74095306b0abfed19421832855d8d87"
        },
        {
          "name": "cancel_booking",
          "title": "Cancel a booking",
          "description": "Cancel one booking under the provider's cancellation policy and email the client. Returns a preview first and only acts when confirm=true. No money moves through the assistant. Any refund or fee is applied by Appty, the same as the dashboard. The client pays anything still due on Appty.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "booking_id": {
                "format": "uuid",
                "type": "string"
              },
              "confirm": {
                "description": "Set true only after the caller has seen a preview and wants it done. Anything else, including the string \"true\", is a preview and changes nothing.",
                "type": "boolean"
              },
              "reason": {
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["booking_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Cancel a booking"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ee942fb66014d7a5c17dd60be3d6aea73f7c86fddaef26f842fc6c20dca0f827"
        },
        {
          "name": "find_open_slots",
          "title": "Find open slots",
          "description": "Open start times for a public service, using the same slot rules as the booking page. from_date and to_date are YYYY-MM-DD and at most 31 days apart. Each start is ISO 8601 with the provider's offset, plus a provider-local label.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "from_date": {
                "description": "First day to include, YYYY-MM-DD",
                "type": "string"
              },
              "service_id": {
                "description": "Service id from get_provider",
                "format": "uuid",
                "type": "string"
              },
              "slug": {
                "description": "Booking link slug, the part after getappty.com/",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "timezone": {
                "description": "IANA zone the dates are in. Defaults to the provider's zone. Slot labels stay in the provider's zone.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "to_date": {
                "description": "Last day to include, YYYY-MM-DD. At most 31 days after from_date.",
                "type": "string"
              }
            },
            "required": ["from_date", "service_id", "slug", "to_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find open slots"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b6060a4d2efde1670f75fc037f2ed209fc5377a352b744bcf1c5fb6b385db4b3"
        },
        {
          "name": "get_booking_link",
          "title": "Get booking link",
          "description": "Check that a start is still open, then return a link to the booking page with that service and time selected. The client confirms and pays on Appty. Nothing is booked here.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "service_id": {
                "description": "Service id from get_provider",
                "format": "uuid",
                "type": "string"
              },
              "slug": {
                "description": "Booking link slug, the part after getappty.com/",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "start": {
                "description": "Slot start, ISO 8601, from find_open_slots",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["service_id", "slug", "start"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get booking link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7a571bc34af0d770f1ec92329638321edac7ab319512a41bcb91e5cd243d042c"
        },
        {
          "name": "get_provider",
          "title": "Get provider",
          "description": "Public booking page for a provider slug: name, headline, time zone, currency, services, upcoming group sessions, and the booking URL. No client data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Booking link slug, the part after getappty.com/",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get provider"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f4d187928a21803d01617c0df01f394ecd6ec0f030d2b7fb3345c37df1930042"
        },
        {
          "name": "list_bookings",
          "title": "List bookings",
          "description": "This provider's bookings. Omit from and to for upcoming sessions. Never includes pay or manage tokens.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "Include sessions starting at or after this ISO 8601 time. When from and to are both omitted, this is now.",
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "description": "Default 50. Maximum 100.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "status": {
                "enum": ["held", "requested", "confirmed", "completed", "cancelled"],
                "type": "string"
              },
              "to": {
                "description": "Include sessions starting before this ISO 8601 time.",
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List bookings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:822fa60783414d802456a3bf7e15f848a06e3f156f96e3bdbab60792643ed21f"
        },
        {
          "name": "list_clients",
          "title": "List clients",
          "description": "This provider's clients: id, name, email, phone, billing currency, and default pay mode.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Default 50. Maximum 100.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Case-insensitive match on the client's name or email.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List clients"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1d05b0e8f77e758d85ea5a8bfed20706f48c65bc516947b053b3bee8291f58f3"
        },
        {
          "name": "reschedule_booking",
          "title": "Reschedule a booking",
          "description": "Move a booking to an open slot. The client is not emailed. Returns a preview first and only acts when confirm=true. No money moves through the assistant.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "booking_id": {
                "format": "uuid",
                "type": "string"
              },
              "confirm": {
                "description": "Set true only after the caller has seen a preview and wants it done. Anything else, including the string \"true\", is a preview and changes nothing.",
                "type": "boolean"
              },
              "new_start": {
                "description": "New start, ISO 8601. Must be an open slot for this booking's length.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["booking_id", "new_start"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Reschedule a booking"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:001c6fb31b6d9d2043d0d798b22ef6fa33e75457ce0961229cbfd54e48877f14"
        },
        {
          "name": "send_invoice",
          "title": "Send an invoice",
          "description": "Create one invoice per currency for a client's sessions (by id or by calendar month) and email it. Returns a preview first and only acts when confirm=true. No money moves through the assistant. The invoice only sends a request the client pays on Appty.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "booking_ids": {
                "description": "Sessions to put on the invoice. Pass this or period.",
                "items": {
                  "$ref": "#/properties/client_id"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "client_id": {
                "format": "uuid",
                "type": "string"
              },
              "confirm": {
                "description": "Set true only after the caller has seen a preview and wants it done. Anything else, including the string \"true\", is a preview and changes nothing.",
                "type": "boolean"
              },
              "period": {
                "description": "Calendar month YYYY-MM in the provider's time zone. Uninvoiced sessions in that month.",
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              }
            },
            "required": ["client_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send an invoice"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:2522f4e5fc0a5c34b6d781c13f5928e98e7effd4e5c1d51b33ae8fc40e8c6c4e"
        },
        {
          "name": "send_pay_link",
          "title": "Send a pay link",
          "description": "Email a pay link for one booking, or for a client's unpaid sessions and invoices. Returns a preview first and only acts when confirm=true. No money moves through the assistant. This only sends a request the client pays on Appty. Group spots, packages, and fees are not emailed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "booking_id": {
                "$ref": "#/properties/client_id",
                "description": "Email a pay link for this booking. Pass this or client_id."
              },
              "client_id": {
                "description": "Email a pay reminder for each unpaid session and invoice this client has. Pass this or booking_id.",
                "format": "uuid",
                "type": "string"
              },
              "confirm": {
                "description": "Set true only after the caller has seen a preview and wants it done. Anything else, including the string \"true\", is a preview and changes nothing.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send a pay link"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d0831356216640acb4fecac0313292d5cc5a7fe14999b864407e356f561f938c"
        },
        {
          "name": "who_owes",
          "title": "Who owes",
          "description": "Unpaid balances for this provider, grouped by client and currency. Same figures as the dashboard who-owes page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Who owes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e6e1e26838b238223bb0b53ed6ff28f206812c1f0e2fb9c86e060cf0d32c77ca"
        }
      ],
      "digest": "sha256:f4f071cb1548dcbaae578d7cbd39e4391209955fe6da6e5f139bcec3a3b5360c"
    }
  }
}
