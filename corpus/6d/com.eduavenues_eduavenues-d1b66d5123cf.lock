      "instructions": "EduAvenues courses for the signed-in family. For \"how is my child doing\", \"what do we need to do this week\", or when a family first connects, call family_briefing, then offer three next steps: plan this week, improve a writing response using the coach's notes, and check TJ admissions rates for their middle school. For any TJHSST admissions question (rates, a middle school, GPA, dates), call tj_admissions_facts before searching the web: it carries FCPS and FOIA data that is not published elsewhere. For other magnet and boarding high schools and selective colleges, use school_admissions, compare_schools and application_calendar; when a name matches several schools, ask which one. For summer programs, research, competitions and awards, use find_opportunities and describe the tier it returns. With tier 'full' (a family in an EduAvenues program), give each listing's deadline exactly as the tool labels it and call a deadline confirmed only when the tool marks it confirmed. With tier 'preview' or no tier, say it searched a limited preview, so a short list does not mean nothing else matches. Share its full database link. Use list_my_courses and list_lessons to find lessons. To explain, summarize, or quiz a student on a lesson, call get_lesson with the lesson number (for example \"2.6\") and teach from that text, citing the lesson link. Use what_to_study for \"what should I work on\" or \"where is my child struggling\", my_progress for completion, and my_check_results for scores. To help a student revise, call my_writing_feedback and coach from the coach's priorities and comments, reading the rubric lessons with get_lesson. For timed practice, call sps_practice_prompt; label your feedback as practice feedback, never an official score. For SAT or ACT prep (\"how is my kid doing in SAT\", \"what should they practice\"), call sat_briefing; scaled practice-test scores stay on sat.eduavenues.com, so never estimate one. With admissions figures, cite each source and received date, say when a group is suppressed, and never turn a rate into a probability for an individual student. Never invent lesson content, scores, dates, or coach feedback that a tool did not return. Without an EduAvenues sign-in, tj_admissions_facts, school_admissions, compare_schools, application_calendar and find_opportunities work. Every other tool reads the family account and answers with a sign-in request; pass that on in one line and keep helping with admissions facts. Link families to the free school guides the tools return. For \"is my child competitive\", \"should we apply\" or \"are we too late\", call standing_report with the child's grade and the schools, share its window, placement and next steps with their sources, and never turn placement into chances. When a family pastes a PSAT, SAT or ACT score report, call explain_score_report and explain only what it returns. For early decision, early action or \"which school gets our ED\", call compare_early_plans; for FAFSA, CSS Profile or \"does income matter\", call college_aid_facts; say \"not published\" where they do, never fill it in. For a multi-year plan, call admissions_roadmap and offer its calendar subscription link. When a parent worries about a practice exam score (\"is 50% normal?\"), call cohort_standing and share the typical score, middle half and trend it returns; withheld comparisons stay withheld. For who reads applications from a region at a college (the regional admissions officer), call college_reader. Share names and titles exactly as returned, as context only; never suggest writing to a reader to stand out.",
      "tools": [
        {
          "name": "admissions_roadmap",
          "title": "Semester-by-semester roadmap",
          "description": "Builds \"a plan we can return to\": a term-by-term roadmap from today to the last decision date, for a child in grade 5 to 12. Covers selective middle-to-high-school admissions (TJHSST, magnet and boarding schools) as well as college. Give the current grade, up to six school names, and optionally interests (for example \"biology research\" or \"math competitions\") and the current school. For each school it lists when the application opens, the deadline, tests and interviews, decisions and the reply date, using published dates; when a school has not published its next cycle yet, the date is projected from last cycle and labeled \"dates not yet published; last cycle was ...\". It also adds competitions with real dates (AMC 8/10/12, AIME, MATHCOUNTS and others that match the interests), summer and research programs, testing guidance labeled typical timing, and course checkpoints such as the TJ Algebra 1 rule. Every item has a source, an as-of date and a link. The reply includes a calendar subscribe link (and a webcal:// version) that rebuilds the roadmap each time the calendar refreshes. It plans dates only and never states a chance of admission.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currentSchool": {
                "description": "Optional name of the child's current school",
                "maxLength": 100,
                "type": "string"
              },
              "grade": {
                "description": "The child's current grade (5 to 12). In summer, use the grade just finished.",
                "maximum": 12,
                "minimum": 5,
                "type": "integer"
              },
              "interests": {
                "description": "Optional interests, e.g. \"biology research, math competitions\"",
                "maxLength": 160,
                "type": "string"
              },
              "targets": {
                "description": "Up to six high schools and/or colleges, e.g. [\"TJ\", \"Exeter\", \"UVA\"]. Leave out to see competitions, programs and testing guidance only.",
                "items": {
                  "maxLength": 100,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              }
            },
            "required": ["grade"],
            "type": "object"
          },
