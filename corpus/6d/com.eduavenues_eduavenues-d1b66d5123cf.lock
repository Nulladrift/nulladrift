          "title": "Compare selective schools",
          "description": "Side by side published admissions facts for two to four selective high schools or colleges: rates, counts, requirements, deadlines and cost, each with its source and date. Best with schools of the same kind (two boarding schools, or two colleges). Names that match no school or several schools are listed as unresolved.",
