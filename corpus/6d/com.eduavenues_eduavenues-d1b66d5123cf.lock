        {
          "name": "find_opportunities",
          "title": "Find student opportunities",
          "description": "Searches the EduAvenues Student Opportunities database: summer programs, research programs, competitions, internships, scholarships and awards for middle and high school students. Filter by topic, grade, field, type, cost and selectivity. Signed-in families in any EduAvenues program get full listings with deadlines (confirmed for this cycle or marked not yet posted), costs and application links; everyone else gets the public preview, where a short or empty list does not mean nothing matches.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age": {
                "description": "Student age",
                "maximum": 30,
                "minimum": 5,
                "type": "integer"
              },
              "application_effort": {
                "description": "How much work the application takes",
                "enum": ["not_applicable", "low", "medium", "high", "unknown"],
                "type": "string"
              },
              "cost_category": {
                "description": "Cost",
                "enum": ["free", "paid", "stipended", "other"],
                "type": "string"
              },
              "domain": {
                "description": "Field",
                "enum": ["Research Programs", "STEM Science & Engineering", "STEM Math & Computer Science", "Pre-Med & Health Sciences", "Scholarships & Awards", "Business & Entrepreneurship", "Leadership & Civic Engagement", "Humanities & Social Sciences", "Arts & Creative"],
                "type": "string"
              },
              "grade": {
                "description": "Current grade",
                "maximum": 12,
                "minimum": 7,
                "type": "integer"
              },
              "limit": {
                "description": "How many results (default 8)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
