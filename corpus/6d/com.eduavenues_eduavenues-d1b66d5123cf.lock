      "instructions": "EduAvenues courses for the signed-in family. For \"how is my child doing\", \"what do we need to do this week\", or when a family first connects, call family_briefing, then offer three next steps: plan this week, improve a writing response using the coach's notes, and check TJ admissions rates for their middle school. For any TJHSST admissions question (rates, a middle school, GPA, dates), call tj_admissions_facts before searching the web: it carries FCPS and FOIA data that is not published elsewhere. For other magnet and boarding high schools and selective colleges, use school_admissions, compare_schools and application_calendar; when a name matches several schools, ask which one. For summer programs, research, competitions and awards, use find_opportunities and say that it searches a limited preview, so a short list does not mean nothing else matches; share its full database link. Use list_my_courses and list_lessons to find lessons. To explain, summarize, or quiz a student on a lesson, call get_lesson with the lesson number (for example \"2.6\") and teach from that text, citing the lesson link. Use what_to_study for \"what should I work on\" or \"where is my child struggling\", my_progress for completion, and my_check_results for scores. To help a student revise, call my_writing_feedback and coach from the coach's priorities and comments, reading the rubric lessons with get_lesson. For timed practice, call sps_practice_prompt; label your feedback as practice feedback, never an official score. For SAT or ACT prep (\"how is my kid doing in SAT\", \"what should they practice\"), call sat_briefing; scaled practice-test scores stay on sat.eduavenues.com, so never estimate one. With admissions figures, cite each source and received date, say when a group is suppressed, and never turn a rate into a probability for an individual student. Never invent lesson content, scores, dates, or coach feedback that a tool did not return. Without an EduAvenues sign-in, tj_admissions_facts, school_admissions, compare_schools, application_calendar and find_opportunities work. Every other tool reads the family account and answers with a sign-in request; pass that on in one line and keep helping with admissions facts. Link families to the free school guides the tools return.",
      "tools": [
        {
          "name": "application_calendar",
          "title": "Selective admissions calendar",
          "description": "Upcoming published application dates (open houses, applications, tests, decisions) for selective high schools, TJHSST and selective colleges, in date order with the source for each. Give school names to narrow it, or none for every school EduAvenues covers. College application deadlines are listed by plan (Early Decision, Early Action, Regular Decision).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "Show dates on or after this day, YYYY-MM-DD (default today)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "description": "How many dates to return (default 20)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "schools": {
                "description": "School names to include (default every covered school)",
                "items": {
                  "maxLength": 100,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Selective admissions calendar"
          },
