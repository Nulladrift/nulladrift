        {
          "name": "family_briefing",
          "title": "This week for my family",
          "description": "The signed-in family's EduAvenues week, per child: upcoming live classes and practice exams (next 14 days), homework that is due, missing or reviewed (with the coach's review notes), the latest coach feedback on their writing (released scores, top strength, top priority, report link), self-paced progress with the weakest lessons, whether a coach should step in, and the top 3 things to do this week. Answers questions like \"how is my child doing\" and \"what do we need to do this week\".",
