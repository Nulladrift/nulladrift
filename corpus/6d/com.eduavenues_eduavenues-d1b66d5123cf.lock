        {
          "name": "find_opportunities",
          "title": "Find student opportunities",
          "description": "Searches the public preview of the EduAvenues Student Opportunities database: summer programs, research programs, competitions, internships, scholarships and awards for middle and high school students. Filter by topic, grade, field, type, cost and selectivity. The preview is limited, so a short or empty list does not mean nothing matches; the full database link is included.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age": {
                "description": "Student age",
                "maximum": 30,
                "minimum": 5,
                "type": "integer"
              },
              "application_effort": {
                "description": "How much work the application takes",
                "enum": ["not_applicable", "low", "medium", "high", "unknown"],
                "type": "string"
              },
              "cost_category": {
                "description": "Cost",
                "enum": ["free", "paid", "stipended", "other"],
                "type": "string"
              },
              "domain": {
                "description": "Field",
                "enum": ["Research Programs", "STEM Science & Engineering", "STEM Math & Computer Science", "Pre-Med & Health Sciences", "Scholarships & Awards", "Business & Entrepreneurship", "Leadership & Civic Engagement", "Humanities & Social Sciences", "Arts & Creative"],
                "type": "string"
              },
              "grade": {
                "description": "Current grade",
                "maximum": 12,
                "minimum": 7,
                "type": "integer"
              },
              "limit": {
                "description": "How many results (default 8)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "opportunity_type": {
                "description": "Kind of opportunity",
                "enum": ["Award", "Summer Program", "Competition", "Research Internship", "Year-Round Program", "Club/Organization", "Internship", "Online Program"],
                "type": "string"
              },
              "query": {
                "description": "Topic or keywords, e.g. \"math research\" or \"free summer engineering\"",
                "maxLength": 160,
                "type": "string"
              },
              "selectivity": {
                "description": "How selective",
                "enum": ["very_selective", "selective", "moderately_selective", "broadly_accessible", "unknown"],
                "type": "string"
              }
            },
            "type": "object"
          },
