        {
          "name": "explain_score_report",
          "title": "Explain a score report",
          "description": "Explains a PSAT/NMSQT, PSAT 10, PSAT 8/9, SAT or ACT score report pasted by a parent, for \"what does this mean, is it good, should we add prep?\". Paste the report text, or give the test and scores. It checks the numbers against the real score ranges (and rejects impossible ones), explains the total, section and Selection Index scores, repeats any percentiles the report itself printed (it never works one out), names the lowest Knowledge and Skills domains, shows College Board and ACT benchmarks with sources, and with target colleges says whether the score is below, within or above each college's published middle-50% range of enrolled score submitters. Ends with rule-based next steps, a link to the free EduAvenues SAT or ACT diagnostic, and how to send the official report to EduAvenues so practice can adapt. Public: no sign-in, nothing is saved. It does not predict future scores or admission results.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domains": {
                "description": "SAT-suite Knowledge and Skills performance ranges, one per content domain.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "domain": {
                      "description": "Information and Ideas, Craft and Structure, Expression of Ideas, Standard English Conventions, Algebra, Advanced Math, Problem-Solving and Data Analysis, or Geometry and Trigonometry.",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "high": {
                      "maximum": 2400,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "low": {
                      "maximum": 2400,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["domain", "high", "low"],
                  "type": "object"
                },
                "maxItems": 8,
                "type": "array"
              },
              "english": {
                "description": "ACT English.",
                "maximum": 99,
                "minimum": 1,
                "type": "integer"
              },
              "grade": {
                "description": "The student's grade when tested, if not printed on the report.",
                "maximum": 12,
                "minimum": 6,
                "type": "integer"
              },
              "math": {
                "description": "SAT-suite Math section score, or ACT Math.",
                "maximum": 2400,
                "minimum": 1,
                "type": "integer"
              },
              "percentiles": {
                "description": "Percentiles exactly as the report printed them. Omit when the report shows none.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "group": {
                      "description": "The comparison group the report names, e.g. \"Nationally Representative Sample\" or \"SAT User\".",
                      "maxLength": 80,
                      "type": "string"
                    },
                    "percentile": {
                      "maximum": 99,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "scope": {
                      "enum": ["total", "readingWriting", "math", "composite", "english", "reading", "science"],
                      "type": "string"
                    }
                  },
                  "required": ["percentile", "scope"],
                  "type": "object"
                },
                "maxItems": 8,
                "type": "array"
              },
              "reading": {
                "description": "ACT Reading.",
                "maximum": 99,
                "minimum": 1,
                "type": "integer"
              },
              "readingWriting": {
                "description": "SAT-suite Reading and Writing section score.",
                "maximum": 2400,
                "minimum": 1,
                "type": "integer"
              },
              "reportText": {
                "description": "The score report text as pasted, including the total score, section scores, the Knowledge and Skills domain performance ranges and any percentiles. Names and other personal details are not needed.",
                "maxLength": 10000,
                "type": "string"
              },
              "science": {
                "description": "ACT Science, if taken.",
                "maximum": 99,
                "minimum": 1,
                "type": "integer"
              },
              "selectionIndex": {
                "description": "PSAT/NMSQT National Merit Selection Index, if printed.",
                "maximum": 999,
                "minimum": 1,
                "type": "integer"
              },
              "targetColleges": {
                "description": "Up to 5 college names to compare the score with their published middle-50% ranges.",
                "items": {
                  "maxLength": 100,
                  "minLength": 2,
                  "type": "string"
                },
