        {
          "name": "save_template",
          "title": "Save Custom Template",
          "description": "Create a custom pod template in a workspace, or change one (`template_id` from the templates tool), like the console's Templates > Add/Edit. Use it when the user wants pods from an image no official template offers. It needs the admin or billing role and costs nothing; pods made from it are created and billed through create_pod.\n        To create, pass `name` and `image`; the image is read first (see templates `image`) and nothing is saved if it can't be read. A private image needs `registry_login_id` from source_credentials. The image can't be changed later.\n        To change, pass only what changes. `env`, `ports`, `volume_mounts` and `semantic_paths` each replace the whole list when given, so start from the template's current lists (templates with `template`); the answer lists what was removed. Pods already created keep their settings.\n        `ports`: \"external\": true gives the port a public HTTPS URL. Public ports are saved locked (only signed-in members and the port's access keys get in) unless the user explicitly wants one open (\"locked\": false); the answer lists `locked_ports` and `open_ports`.\n        Secrets: never put a secret's value here. Mark the variable \"secret\": true with \"auto_generate\": true or leave the value out to give it at create time; a secret without a value keeps the value the template already stores.\nEvery write requires operation_id. Reuse the ID returned by the preview, or generate a UUID before the first call. Keep it for confirmation and all retries; a new ID means a new operation. After a timeout, check operation_status and resource state before retrying.",
          "inputSchema": {
            "properties": {
              "command": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Replaces the image's entrypoint and cmd; \"\" uses the image's own.",
                "title": "Command"
              },
              "description": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Description"
              },
              "env": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": true,
                      "type": "object"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "[{\"key\": \"HF_HOME\", \"value\": \"/data/hf\"}] with optional \"secret\", \"auto_generate\", \"show_on_connect\" and \"from_image\" (booleans; \"from_image\" marks a variable the image declares). A secret takes no \"value\": \"auto_generate\": true gives each pod a random one; otherwise it is given at create_pod time, or the value the template stores is kept. read templates(template=id) first (its items can be passed back as they are); this list replaces the stored one.",
                "title": "Env"
              },
              "image": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The container image; required to create and can't be changed later.",
                "title": "Image"
              },
              "lock_public_ports": {
                "default": true,
                "description": "Public ports without their own \"locked\" are saved locked.",
                "title": "Lock Public Ports",
                "type": "boolean"
              },
              "name": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Unique among the workspace's custom templates; required to create.",
                "title": "Name"
              },
              "operation_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Operation Id"
              },
              "ports": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": true,
                      "type": "object"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "[{\"port\": 8888, \"name\": \"jupyter\", \"external\": true}] with optional \"locked\" for a public port; read templates(template=id) first (its items can be passed back as they are); this list replaces the stored one.",
                "title": "Ports"
              },
              "registry_login_id": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A `registry_login_id` from source_credentials for a private image; 0 removes it.",
                "title": "Registry Login Id"
              },
              "semantic_paths": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": true,
                      "type": "object"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Input folders for assets and folders whose files become assets: [{\"role\": \"model\", \"path\": \"/models\"}] with optional \"expect\", \"include\", \"required\", \"cardinality\", \"placement\"; [] clears them; read templates(template=id) first (its items can be passed back as they are); this list replaces the stored one.",
                "title": "Semantic Paths"
              },
              "template_id": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A custom template to change, from the templates tool. Omit it to create one.",
                "title": "Template Id"
              },
              "volume_mounts": {
