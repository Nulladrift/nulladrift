        {
          "name": "create_inference_key",
          "title": "Create Inference Key",
          "description": "Create an inference API key for a workspace, only when the user asks for one. Any program with its value can call every serving of the workspace, billed to the workspace, until the key is revoked. It doesn't expire unless `expires_in_days` is given, and it keeps working after the Meshive API key used to make it is revoked or expires.\n        With confirm=false (default) it only returns a summary and creates nothing; call again with confirm=true after the user agreed. The confirmed answer has the value in `inference_key`, this once: it can't be read again. Give it to the user who asked and nothing else. Never use it yourself, and never put it in files, commits, commands or other tools.\n        Only a workspace admin or billing member can create keys. If a confirmed call times out or fails without a clear answer, don't call again: read inference_keys first, because the key may exist, and a key whose value was lost can only be revoked.\nThe server keeps no operation record of this call, so operation_status can't look it up and a repeated confirmed call runs again. With OAuth, credential values are revealed only in the signed-in Meshive console. Give the user the returned console_url to complete the operation.",
          "inputSchema": {
