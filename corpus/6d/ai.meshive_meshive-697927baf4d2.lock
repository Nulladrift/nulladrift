        {
          "name": "revoke_browser_sessions",
          "title": "Sign Out Browser Sessions",
          "description": "Sign out every browser session on a pod's locked ports, only when the user asks: workspace members who opened them in a browser (they stay signed in there for 7 days) have to enter again through the console. Use it when a port was opened on a shared computer, or a session may have leaked. With `pod` it covers every public port of that pod, and no other pod. all_pods=true (and no `pod`) covers every pod of the workspace instead: use it only when the user asks for the whole workspace, and pass `workspace`. It signs out every member at once, the user included: one person's or one computer's session can't be signed out alone, so say that before the user agrees.\n        Browser cookies only: access keys keep working, and connections that are already open (a WebSocket, for example) stay open. It takes a few seconds to apply and can't be undone; calling it again is safe.\n        With confirm=false (default) it only returns a summary and changes nothing; call again with confirm=true and the summary's `pod_name` (for a whole workspace: all_pods=true and the summary's `workspace` id) after the user agreed. Only a workspace admin or billing member can do it.\nEvery write requires operation_id. Reuse the ID returned by the preview, or generate a UUID before the first call. Keep it for confirmation and all retries; a new ID means a new operation. After a timeout, check operation_status and resource state before retrying.",
