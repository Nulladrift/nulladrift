                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Max Price Per Hour"
              },
              "name": {
                "title": "Name",
                "type": "string"
              },
              "operation_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Operation Id"
              },
              "region": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Region"
              },
              "size_gb": {
                "title": "Size Gb",
                "type": "integer"
              },
              "storage_type": {
                "default": "nfs",
                "title": "Storage Type",
                "type": "string"
              },
              "usage_warning": {
                "default": false,
