        {
          "name": "delete_asset_files",
          "title": "Delete Asset Files",
          "description": "Delete some files of Asset Hub assets, like the console's file delete. Choose them with `file_ids` (\"file_...\" from the assets tool, up to 1000, from any assets of one workspace) or with `asset` and `paths` globs over that asset's file paths (\"renders/*\" = that folder and everything in it, \"*.png\" at any depth; `*` also crosses folders).\n        With confirm=false (default) it only returns what would be deleted: file count, size, sample paths and, for Meshive storage, the monthly storage cost it stops; call again with the same arguments, the preview's `expected_file_count` and confirm=true after the user agreed. Files are matched again on confirm; if the match changed, nothing is deleted (selection_changed).\n        Deleted files in Meshive storage can't be recovered. Selecting every file of a collection is refused: deleting the asset is a separate decision (delete_asset). Files of an asset that is frozen or in use are skipped. Needs the workspace's admin or billing role.\nEvery write requires operation_id. Reuse the ID returned by the preview, or generate a UUID before the first call. Keep it for confirmation and all retries; a new ID means a new operation. After a timeout, check operation_status and resource state before retrying.",
