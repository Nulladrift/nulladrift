          "description": "Cancel a queued inference request (`request_id` from inference_requests), when the user asks. Nothing ran, so nothing is billed for it and the credit held for it is refunded. It needs no confirmation: it spends nothing and deletes nothing.\n        Only queued requests can be canceled; a running one finishes or times out on its own (request_not_cancellable). The member who sent it, or a workspace admin or billing member, can cancel it.\nEvery write requires operation_id. Reuse the ID returned by the preview, or generate a UUID before the first call. Keep it for confirmation and all retries; a new ID means a new operation. After a timeout, check operation_status and resource state before retrying.",
