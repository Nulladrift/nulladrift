        {
          "name": "estimate_pod",
          "title": "Estimate Pod Price",
          "description": "Estimate the hourly price of a pod before creating it; nothing is created and no credit is spent.\n        Takes the same arguments as create_pod and returns the price and hardware a pod with them would get.\n        `locked_ports` and `open_ports` list the ports the pod would expose over HTTPS, by the lock each would get\n        (`open_by_template`: open because the template sets them so, not because of this call).\n        \nEach argument's format is in its own description. `workspace` and `template_id` come from the workspaces and templates tools.\nGPU pod: pass `gpu_model` (from the gpus tool) and optionally `gpu_count`/`gpu_vram_gb`; vCPU/RAM default to the GPU's recommended sizes.\nCPU pod: omit `gpu_model`; `cpu_line` picks the CPU line (from the cpus tool; default the cheapest line that fits) and vCPU/RAM default to 8 cores / 32 GiB like the console (or the nearest sizes that line offers).\n`vcpu` and `ram_gb` are totals for the pod and must be sizes the console offers. The system disk is sized by the server (shown as `resources.disk_gb` in the estimate).\n`volumes` attaches existing network storage. `local_volumes` creates new local storage on the pod's machine, billed hourly by size until it is deleted, also while the pod is stopped and after the pod is deleted unless delete_pod lists it.\n`max_price_per_hour` caps the compute hourly rate; existing storage you attach and Asset Hub retention are billed separately.\n`input_assets` places Asset Hub assets in the pod. New files in the template's output folders and in `watched_folders` are uploaded as assets; `watched_template_folders` changes the template's folders and `harvest_destination` where the files go.\n`model_set` adds one model set to the pod, and `hf_token_id` is the token a set gated on Hugging Face needs; the set's files are added before the pod is created, often several minutes.\nPorts exposed over HTTPS are created locked: only workspace members signed in to the console and requests with one of the port's access keys get through, and anything else gets 401. `lock_public_ports=false` (or \"locked\": false on a port) creates them open to anyone who knows the URL: only when the user explicitly asks for that. One exception: a template port whose template sets it open is created open; the preview lists it as `open_by_template` and says how to lock it.",
          "inputSchema": {
            "properties": {
              "command": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Overrides the start command (at most 32,000 characters).",
                "title": "Command"
              },
              "cpu_line": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "CPU pods only: a `cpu_line` value from the cpus tool. Default: the cheapest line that fits.",
                "title": "Cpu Line"
              },
              "cpu_premium": {
                "default": false,
                "title": "Cpu Premium",
                "type": "boolean"
              },
              "env": {
                "anyOf": [
                  {
                    "additionalProperties": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Environment variables; template variables the template leaves blank need a value, except a Hugging Face token (HF_TOKEN): it's only needed for gated or private repos or Hub uploads and is left out when blank, so don't ask for one to run a public model. `secret_keys` names the secret ones.",
                "title": "Env"
              },
              "gpu_count": {
                "default": 1,
                "title": "Gpu Count",
                "type": "integer"
              },
              "gpu_model": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "GPU model from the gpus tool. Omit it for a CPU pod.",
                "title": "Gpu Model"
              },
              "gpu_vram_gb": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Gpu Vram Gb"
              },
              "harvest_destination": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "{\"mode\": \"user_s3\", \"credential_id\": n} sends the uploaded files to the user's bucket instead of managed storage. `credential_id` takes a `bucket_id` from buckets.",
                "title": "Harvest Destination"
              },
              "hf_token_id": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "For Quick Deploy templates whose model set is gated on Hugging Face (the model_sets tool shows `hf_token_required` and `gated_sources`): the id of a workspace token from the source_credentials tool whose Hugging Face account accepted the model's license. The set's files download with that token, so the user must first accept the license on the page in `gated_sources` with the same Hugging Face account. Like `model_set`, a confirmed create with it returns only after the files were linked, which can take minutes.",
                "title": "Hf Token Id"
              },
              "input_assets": {
                "anyOf": [
                  {
                    "items": {},
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Places Asset Hub assets in the pod: [\"asset_id\" or {\"asset\": id, \"target_dir\": \"/workspace/models\", \"role\": role, \"paths\": [\"sub/folder/\"], \"strip_prefix\": \"\"}] (default place /inputs/<asset name> or the template's path for that role); \"paths\" picks some files or folders, copied from the asset's file list exactly as written there, and \"strip_prefix\": \"\" keeps their folder structure (left out, the folder they share is stripped). Only these keys are accepted. They add an input volume billed by size.",
                "title": "Input Assets"
              },
              "internet_premium": {
                "default": false,
                "title": "Internet Premium",
                "type": "boolean"
              },
              "local_volumes": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": true,
                      "type": "object"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Creates NEW local storage on the pod's machine together with the pod: [{\"name\": \"scratch\", \"mount_path\": \"/scratch\", \"size_gb\": 50}] with optional \"encrypted\", \"usage_warning\" and \"usage_warning_threshold\" (0-1). Each needs at least 10 GiB and spot pods can't have one. It is billed hourly by size until it is deleted, also while the pod is stopped and after the pod is deleted unless delete_pod lists it; the estimate includes it as `breakdown.local_storage`.",
                "title": "Local Volumes"
              },
              "lock_public_ports": {
