                "default": null,
                "description": "Event type names from webhooks(kind=\"events\"); required to create. On a change it replaces the subscribed list.",
                "title": "Event Types"
              },
              "label": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
