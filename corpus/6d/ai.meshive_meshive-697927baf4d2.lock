              },
              "operation_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Operation Id"
              },
              "path_in_repo": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
