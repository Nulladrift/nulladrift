        {
          "name": "host_install_command",
          "title": "Get Host Install Command",
          "description": "Get the command that installs the Meshive agent on a new machine and registers it to the user's account,\n        like the console's Add machine: `agent_type` \"compute\" for a GPU or CPU machine, \"storage\" for a storage\n        machine.\n        For about 10 minutes, whoever has the command can register machines to this account, so it is a secret. The\n        account owner is emailed each time one is issued.\n        With confirm=false (default) it only says what it is and issues nothing; call again with confirm=true after the\n        user agreed. Run it only on the machine the user named, as root, and only when they asked you to; otherwise\n        give it to that user alone. Never put it in files, commits or other tools. The machine shows up in the machines\n        tool once its agent connects.\nThe server keeps no operation record of this call, so operation_status can't look it up and a repeated confirmed call runs again. With OAuth, credential values are revealed only in the signed-in Meshive console. Give the user the returned console_url to complete the operation.",
          "inputSchema": {
            "properties": {
              "agent_type": {
                "default": "compute",
                "title": "Agent Type",
                "type": "string"
              },
              "confirm": {
                "default": false,
                "title": "Confirm",
