        {
          "name": "update_asset",
          "title": "Update Asset",
          "description": "Rename an Asset Hub asset (`name`) or change its type (`asset_type`: dataset, model, adapter, checkpoint, config or file), like the console's asset drawer. `asset` is the \"asset_...\" id from the assets tool; pass only what changes.\n        Output assets keep their type, and no asset can be made an output. Names are unique among a workspace's assets.\n        Renaming an asset that collects a pod's watched folder makes the pod's later uploads go to a new asset named after the folder. Renaming an asset the catalog added makes it show in the assets list. Needs the workspace's admin or billing role.\nEvery write requires operation_id. Reuse the ID returned by the preview, or generate a UUID before the first call. Keep it for confirmation and all retries; a new ID means a new operation. After a timeout, check operation_status and resource state before retrying.",
