        {
          "name": "cpus",
          "title": "List CPU Lines",
          "description": "Show the CPU lines a CPU pod can run on right now, with hourly USD prices per vCPU core and per GiB of RAM.\n        A line is a CPU vendor, product line and generation with a fixed RAM type (`ddr_type`, 0 = unknown). Pass its\n        `cpu_line` to estimate_pod or create_pod; without one the cheapest line that fits is used.\n        `max_vcpus_per_pod` and `max_ram_per_pod` (MiB) are the most one pod can get on a single machine.\n        Use `rental_type` \"spot\" for the cheaper preemptible tier.",
