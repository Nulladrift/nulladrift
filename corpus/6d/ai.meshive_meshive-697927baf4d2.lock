        {
          "name": "finish_upload",
          "title": "Finish Upload",
          "description": "Finish an upload started with upload_asset, after every file was PUT to its link: the server checks each file's size and makes the asset ready (`asset_id`), or adds the files to the collection. Calling it again after success returns the same success and adds nothing twice (for a new asset, the same asset). Cancelling (cancel=true) an add to a collection that already finished answers upload_already_completed: the files were added.\n        With cancel=true it cancels instead and removes what was uploaded. If a file is missing or its size is wrong, it says so: PUT that file again (or cancel and start over if its link expired).\nThe server keeps no operation record of this call, so operation_status can't look it up and a repeated call runs again.",
