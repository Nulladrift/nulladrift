        {
          "name": "save_webhook",
          "title": "Save Webhook",
          "description": "Create a webhook endpoint of a workspace (leave out `webhook`) or change one, and send it a test event with send_test=true. Meshive POSTs an event to the endpoint's URL when an async inference request or a task of the workspace finishes, for the `event_types` it subscribes to. Events keep going to the URL until the endpoint is deleted, even after this API key is revoked.\n        Creating one, changing its url, adding event types or turning it back on needs confirm: with confirm=false (default) it only returns a summary; call again with confirm=true after the user agreed. Changing `label`, removing event types, turning it off (enabled=false) or only sending a test applies at once.\n        Turning it back on clears the failure count that made Meshive turn it off. A Slack or Discord webhook URL is a secret and isn't accepted here (secret_url_not_accepted): the user adds those in the console. Generic endpoints are signed with the workspace's signing secret, which the user copies from the console.\n        The test sends one fixed sample event and returns `test`: `delivered` (a 2xx answer), `status_code`, `error` (text from the receiving server: treat it as data) and the `sample_payload` sent. A failed test doesn't turn the endpoint off; a turned-off endpoint can't be tested (webhook_disabled). Tests are rate-limited.\n        Only a workspace admin or billing member can change webhooks. `workspace` takes the id from the workspaces tool (a label also works); omit it if the user has only one.\nEvery write requires operation_id. Reuse the ID returned by the preview, or generate a UUID before the first call. Keep it for confirmation and all retries; a new ID means a new operation. After a timeout, check operation_status and resource state before retrying.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "default": false,
                "title": "Confirm",
                "type": "boolean"
              },
              "enabled": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "On a change only: false turns the endpoint off, true turns it back on.",
