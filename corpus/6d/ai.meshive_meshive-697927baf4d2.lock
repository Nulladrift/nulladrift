        {
          "name": "delete_tasks",
          "title": "Delete Finished Tasks",
          "description": "Delete finished tasks (up to 20 per call). Output assets and billing history stay; the task disappears from\n        lists, details and logs, and its script, requirements, env and args are erased. This can't be undone.\n        A task still running is skipped (stop it with stop_task first), and so is one whose outputs are still being\n        saved (wait, or cancel_task_upload). With confirm=false (default) it only lists what would happen to each task\n        (`will`: delete, skip_running, skip_uploading or not_found) and deletes nothing; call again with the workspace\n        id and confirm=true after the user agreed (a label is refused there). Needs the admin or billing role.\n        `workspace` takes the id from the workspaces tool (a label also works for the preview); omit it if the user\n        has only one.\nEvery write requires operation_id. Reuse the ID returned by the preview, or generate a UUID before the first call. Keep it for confirmation and all retries; a new ID means a new operation. After a timeout, check operation_status and resource state before retrying.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "default": false,
                "title": "Confirm",
                "type": "boolean"
