        {
          "name": "upload_asset",
          "title": "Upload Files",
          "description": "Start uploading files from the user's computer as a new Asset Hub asset, or add them to an existing collection (`asset`), when the user asks to upload them. This server can't read local files: it returns an upload link per file, you PUT each file's exact bytes to its link from your own shell, then call finish_upload.\n        `files` = [{\"path\": name inside the asset (a file name, or a/b.txt for a folder), \"size_bytes\": exact size, \"sha256\": optional}]. One call makes one asset; `name` defaults from the files and `asset_type` (dataset, model, adapter, checkpoint, config, file) is guessed when omitted. Adding to a collection never replaces a file: a path it already has fails with file_exists, and pods already using it get the new files on their next start.\n        Upload each with `curl -fsS -T <local file> \"<url>\"` (on Windows `curl.exe`, not PowerShell's curl alias). The links expire after `presign_expires_in` seconds and let anyone who has them upload into this asset: use them only in that command, never in files or other tools. Files over 200 MiB need the CLI instead (`meshive asset-upload <path>`, which uploads in parts); this tool then cancels and says so.\n        Managed storage is billed per GiB-month (see the assets tool); accounts with no payment yet have a storage limit.\nThe server keeps no operation record of this call, so operation_status can't look it up and a repeated call runs again.",
