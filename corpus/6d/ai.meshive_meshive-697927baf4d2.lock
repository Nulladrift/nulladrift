        {
          "name": "import_asset",
          "title": "Import Asset",
          "description": "Link a Hugging Face repo (\"owner/name\" or its URL), a CivitAI model URL or a direct file URL as an Asset Hub asset, so pods and tasks can use it as `input_assets`.\n        Nothing is copied: the asset is ready at once and has no storage charge; pods and tasks download it from the source when they start. `paths` globs link only some files, `revision` pins a Hugging Face branch/tag/commit.\n        A private or gated source needs a token or key saved in the console — pass its id from source_credentials; if the import fails, tell the user the error message as it is.\n        `source` can also be \"catalog:<slug>\" (an entry from model_sets entries=true) or \"model_set:<slug>\" (every file of a set). The answer lists each `asset_id` with its `default_role`, and `failed` the entries that couldn't be linked; calling again retries only those. Gated Hugging Face files need `hf_token_id` of an account that accepted the license. Catalog assets are hidden from the assets list unless include_catalog=true.\n        From a connected bucket: source \"bucket:<bucket_id>/<folder>\" links the folder as one asset, which can be browsed (asset_files) and copied from but can't be a pod's or task's input_assets itself; with `paths` (object keys from buckets) and `name` it links just those files as an asset that can. Nothing is copied and Meshive doesn't bill its storage; reading it can cost egress at the bucket's provider. Needs the admin or billing role.\n        Source \"asset_...\" of an asset linked from a bucket folder copies the files `paths` match into a new asset in Meshive storage, billed per GiB-month: that case needs confirm=true after the user saw the preview (file count, size, monthly cost). No other source takes `confirm`.\nEvery write requires operation_id. Reuse the ID returned by the preview, or generate a UUID before the first call. Keep it for confirmation and all retries; a new ID means a new operation. After a timeout, check operation_status and resource state before retrying.",
          "inputSchema": {
            "properties": {
              "asset_type": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
