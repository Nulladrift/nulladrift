        {
          "name": "roll_access_key",
          "title": "Roll Port Access Key",
          "description": "Replace the value of one access key, only when the user asks: the key keeps its name and port and gets a new value and a new `id`. Use it when a value may have leaked, before a key expires, or to replace a key that has expired (`expired` in access_keys): its old value is dead already, so `overlap_seconds` is ignored and there is no overlap.\n        The old value keeps working for `overlap_seconds`, so the user's programs can be moved to the new value: 3600 (1 hour, default), 86400 (24 hours), 604800 (7 days), or 0 to stop the old value at once. The new value expires after the same lifetime the key was created with, counted from now. A key with no expiry (`expires_at` null, made in the console) is rolled in the web console when you sign in with an API key.\n        With confirm=false (default) it only returns a summary and changes nothing; call again with confirm=true and the summary's `pod_name` after the user agreed. The confirmed answer has the new value in `access_key`, this once: it can't be read again. Give it to the user who asked and nothing else. Never use it yourself, and never put it in files, commits, commands or other tools.\n        The port must be locked, and only a workspace admin or billing member can roll keys. If a confirmed call times out or fails without a clear answer, don't call again: read access_keys first.\nThe server keeps no operation record of this call, so operation_status can't look it up and a repeated confirmed call runs again. With OAuth, credential values are revealed only in the signed-in Meshive console. Give the user the returned console_url to complete the operation.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "default": false,
                "title": "Confirm",
                "type": "boolean"
              },
              "key_id": {
                "description": "The key's `id` from the access_keys tool.",
                "title": "Key Id",
                "type": "integer"
              },
              "operation_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Operation Id"
              },
              "overlap_seconds": {
                "default": 3600,
                "title": "Overlap Seconds",
                "type": "integer"
              },
              "pod": {
                "description": "The pod_name from the pods tool. Its display name also works, except on a confirmed call (confirm=true) that opens a port, changes a key or signs out browsers: use the `pod_name` the preview returned.",
                "title": "Pod",
                "type": "string"
              },
              "port": {
                "description": "The port number, from the pod's `endpoints` in the pods tool; it must be exposed over HTTPS (`access` locked or unlocked).",
                "title": "Port",
                "type": "integer"
              },
              "workspace": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Workspace"
              }
            },
            "required": ["key_id", "pod", "port"],
            "title": "roll_access_keyArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "roll_access_keyDictOutput",
            "type": "object"
          },
