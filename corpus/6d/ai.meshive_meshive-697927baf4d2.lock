        {
          "name": "watched_folders",
          "title": "Show Watched Folders",
          "description": "Show a pod's watched folders: folders whose new files are uploaded as Asset Hub assets.\n        Each folder has `origin` (template or user), `enabled`, its include patterns and `blocked_reason` (network_storage = on network storage, nested_volume = overlaps your volume; never watched).\n        `revision` is what set_watched_folders needs as `expected_version`; `editable` false (with a reason) means it can't be changed now.\n        Reason no_sidecar means the pod has no uploader: when `can_enable_saving` is true, update_pod with enable_folder_saving=true adds it (one restart); otherwise the pod first needs storage (update_pod `volumes`/`local_volumes`).",
          "inputSchema": {
            "properties": {
              "pod": {
                "title": "Pod",
