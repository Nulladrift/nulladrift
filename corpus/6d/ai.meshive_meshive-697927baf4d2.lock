        {
          "name": "export_asset",
          "title": "Export Asset",
          "description": "Copy an Asset Hub asset stored in Meshive storage out of Meshive: to a connected bucket (`bucket` from buckets, optional `prefix`) or to a Hugging Face repo (`hf_repo` \"owner/name\" with `hf_token_id`, a saved token with write access from source_credentials; `private`, `path_in_repo`). Only admins and billing members can do it.\n        It runs in the background and nothing reports when it finishes: the user checks the bucket or repo. A Hugging Face repo that doesn't exist is created (private unless private=false; a typo makes a new repo), and the user is responsible for the model's license. Objects with the same names in the bucket folder are overwritten.\n        Assets already in the user's bucket or linked from a source can't be exported (export_not_supported). With confirm=false (default) it only returns the destination and size; call again with confirm=true after the user agreed. Accounts without a completed payment have a daily export limit (export_limit_reached).\nEvery write requires operation_id. Reuse the ID returned by the preview, or generate a UUID before the first call. Keep it for confirmation and all retries; a new ID means a new operation. After a timeout, check operation_status and resource state before retrying.",
          "inputSchema": {
            "properties": {
              "asset": {
                "description": "The \"asset_...\" id from the assets tool.",
                "title": "Asset",
                "type": "string"
              },
              "bucket": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A `bucket_id` from the buckets tool.",
                "title": "Bucket"
              },
              "confirm": {
                "default": false,
                "title": "Confirm",
                "type": "boolean"
