      "serverInfo": {
        "name": "meshive",
        "title": "Meshive GPU Cloud",
        "version": "1.11.0",
        "websiteUrl": "https://meshive.ai"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
