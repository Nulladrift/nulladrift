                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Or a Hugging Face repo, \"owner/name\".",
                "title": "Hf Repo"
              },
              "hf_token_id": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "With `hf_repo`: a saved Hugging Face token with write access (source_credentials).",
