              "operation_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Operation Id"
              },
              "paths": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A repo or URL: globs of the files to link. \"bucket:...\": full object keys from buckets (up to 500) to link just those files, `name` required. \"asset_...\": the files to copy (none = all): `path` values from asset_files, taken exactly (any character, up to 500), or globs, when an entry has * or ? (* also crosses folders; brackets are literal; a glob can't hold spaces or other characters outside letters, digits and . _ - / !; up to 32).",
