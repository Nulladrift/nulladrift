        {
          "name": "create_access_key",
          "title": "Create Port Access Key",
          "description": "Create an access key for a locked port of a pod, only when the user asks for one. The key is a secret that lets a program outside the pod call the port: it is sent as `Authorization: Bearer <key>`, or as `X-Meshive-Key: <key>` when the app uses Authorization itself.\n        With confirm=false (default) it only returns a summary and creates nothing; call again with confirm=true and the summary's `pod_name` after the user agreed. The confirmed answer has the value in `access_key`, this once: it can't be read again. Give it to the user who asked and nothing else. Never use it yourself, and never put it in files, commits, commands or other tools. To call the app for your own work, use run_command inside the pod against http://localhost:<port>, which needs no key.\n        `name` is a label of 1-64 characters. `expires_in_days` is 30, 90 (default) or 365; a key that never expires can only be made in the web console. The port must be locked (port_not_locked), and only a workspace admin or billing member can create keys.\n        If a confirmed call times out or fails without a clear answer, don't call again: read access_keys first, because the key may exist, and a key whose value was lost can only be revoked.\nThe server keeps no operation record of this call, so operation_status can't look it up and a repeated confirmed call runs again. With OAuth, credential values are revealed only in the signed-in Meshive console. Give the user the returned console_url to complete the operation.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "default": false,
                "title": "Confirm",
                "type": "boolean"
              },
              "expires_in_days": {
                "default": 90,
                "title": "Expires In Days",
                "type": "integer"
              },
              "name": {
                "title": "Name",
                "type": "string"
              },
              "operation_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Operation Id"
              },
              "pod": {
                "description": "The pod_name from the pods tool. Its display name also works, except on a confirmed call (confirm=true) that opens a port, changes a key or signs out browsers: use the `pod_name` the preview returned.",
                "title": "Pod",
                "type": "string"
              },
              "port": {
                "description": "The port number, from the pod's `endpoints` in the pods tool; it must be exposed over HTTPS (`access` locked or unlocked).",
                "title": "Port",
                "type": "integer"
              },
              "workspace": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Workspace"
              }
            },
            "required": ["name", "pod", "port"],
