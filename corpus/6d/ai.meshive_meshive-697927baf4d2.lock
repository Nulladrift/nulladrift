        {
          "name": "set_default_output_bucket",
          "title": "Set Default Output Bucket",
          "description": "Choose where the outputs of a workspace's tasks are saved by default: Meshive storage (\"managed\", billed per GiB-month) or one of its connected buckets (a verified `bucket_id` from buckets). Tasks that don't pass `output_bucket` use this default. It needs the admin or billing role. Running tasks, console uploads and pod watched folders are not affected.\n        With confirm=false (default) it shows the current and new destination; call again with the workspace id and confirm=true after the user agreed. If nothing would change it says so (`changed` false) without a preview, and a confirmed call then sends nothing.\nEvery write requires operation_id. Reuse the ID returned by the preview, or generate a UUID before the first call. Keep it for confirmation and all retries; a new ID means a new operation. After a timeout, check operation_status and resource state before retrying.",
