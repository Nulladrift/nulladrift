        {
          "name": "connect_storage",
          "title": "Connect to Storage",
          "description": "Get an SSH login to a storage volume's files, like the console's Connect, only when the user asks to connect: the `command` to run and a one-time `password` that expires in a few minutes (`expires_at`).\n        `storage` is its pv_name or display name from the storages tool. Encrypted storage is unlocked and an access pod is started for it; it locks again by itself after `auto_lock_minutes` (`remaining_seconds` left). Other storage is reached through the access pod that already runs for it.\n        With confirm=false (default) it only returns the storage's connection state and changes nothing; call again with confirm=true after the user agreed. It needs a read & write key.\n        The confirmed call waits up to `wait` seconds (0-90, default 60) for the storage to be ready; if it isn't yet, the result has no password and says to call again.\n        Give the command and password to the user and nobody else: never run the command yourself or put the password in files, commits or other tools. Each confirmed call issues a new password.\nThe server keeps no operation record of this call, so operation_status can't look it up and a repeated confirmed call runs again. With OAuth, credential values are revealed only in the signed-in Meshive console. Give the user the returned console_url to complete the operation.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "default": false,
                "title": "Confirm",
