        {
          "name": "delete_credential",
          "title": "Delete Credential",
          "description": "Delete a saved credential of a workspace, only when the user asks: a Hugging Face token (`hf_token`), a CivitAI key (`civitai_key`), a container registry login (`registry_login`) or a bucket connection (`bucket`). It needs the admin or billing role.\n        With confirm=false (default) it deletes nothing and returns what uses the credential: the assets linked with a token or key and the pods using them, the templates, pods and tasks of a registry login, or for a bucket the assets registered from it and whether task outputs go there by default. Show that to the user; call again with the workspace id and confirm=true after they agreed.\n        A deleted token, key or login can't be brought back, and the server doesn't stop you while something uses it: those assets, templates or pods stop working until the user saves a new one in the console. Removing a bucket connection deletes nothing in the bucket and lets uploads already running finish; if task outputs went there by default, they go back to Meshive storage, which is billed. It has to be added again in the console to be used for new work. A bucket connection that is already removed answers `already_removed` without a preview: there is nothing to do.\nEvery write requires operation_id. Reuse the ID returned by the preview, or generate a UUID before the first call. Keep it for confirmation and all retries; a new ID means a new operation. After a timeout, check operation_status and resource state before retrying.",
