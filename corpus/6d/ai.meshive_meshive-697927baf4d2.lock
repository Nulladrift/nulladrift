          "description": "Remove a member from a workspace (`user` = their email from the workspaces tool), or cancel a pending invitation (`invite` = an invite_id from the workspaces tool's `invites`), only when the user asks. It needs the admin or billing role. You can't remove yourself, the only admin or the billing owner (member_not_removable says which; the fix is in the console).\n        With confirm=false (default) it changes nothing and shows the member and the keys that keep working after removal: their inference API keys (an admin or billing member can revoke them with revoke_inference_key) and port access keys they created. Call again with the workspace id and confirm=true after the user agreed.\n        Removal is immediate. Inviting people and changing roles are done in the console.\nEvery write requires operation_id. Reuse the ID returned by the preview, or generate a UUID before the first call. Keep it for confirmation and all retries; a new ID means a new operation. After a timeout, check operation_status and resource state before retrying.",
