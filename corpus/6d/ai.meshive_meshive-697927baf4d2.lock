        {
          "name": "revoke_inference_key",
          "title": "Revoke Inference Key",
          "description": "Revoke an inference key of a workspace so that its value stops working: programs that send it get 401 within seconds. It can't be undone; a new key has a new value.\n        With confirm=false (default) it only returns which key would be revoked and changes nothing; call again with confirm=true after the user agreed.\n        You can revoke your own keys whatever your role; a workspace admin or billing member can revoke any key of the workspace, also one of a member who left. To replace a value instead, use roll_inference_key.\nEvery write requires operation_id. Reuse the ID returned by the preview, or generate a UUID before the first call. Keep it for confirmation and all retries; a new ID means a new operation. After a timeout, check operation_status and resource state before retrying.",
