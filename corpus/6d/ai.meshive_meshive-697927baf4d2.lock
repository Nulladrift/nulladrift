        {
          "name": "delete_asset",
          "title": "Delete Asset",
          "description": "Delete an Asset Hub asset (a file, collection, dataset, model or output; `asset` from the assets tool), like the console's Delete. With confirm=false (default) it only returns what would be deleted: name, file count, size, where it is used and, for Meshive storage, the monthly storage cost it stops; call again with confirm=true after the user agreed.\n        Files in Meshive storage are permanently removed and can't be recovered. A linked asset (Hugging Face, CivitAI, URL) only loses the link, and objects in the user's own bucket stay there. Deleting a task's output asset also removes the task's output links.\n        It fails while a pod or an unfinished task uses the asset, and for assets frozen by the platform. To remove only some files use delete_asset_files. Needs the workspace's admin or billing role.\nEvery write requires operation_id. Reuse the ID returned by the preview, or generate a UUID before the first call. Keep it for confirmation and all retries; a new ID means a new operation. After a timeout, check operation_status and resource state before retrying.",
