        {
          "name": "set_port_lock",
          "title": "Lock or Unlock Port",
          "description": "Lock or unlock one port a pod exposes over HTTPS. The pod isn't restarted. The change takes a few seconds to take effect: the answer's `state` is `locking` or `unlocking` until it does (read `lock_state` with the pods tool). Repeating the call doesn't speed this up: wait by reading `lock_state` with the pods tool instead.\n        locked=true locks it at once, without `confirm`: only workspace members signed in to the console and requests that carry one of the port's access keys (create_access_key) get through. Everything else gets 401, also programs that called the port without a key until now, so tell the user.\n        locked=false unlocks it: anyone who knows the URL can then reach the app, with no sign-in and no key. Do it only when the user explicitly asks. With confirm=false (default) it only returns a summary and changes nothing; call again with confirm=true and the summary's `pod_name` after the user agreed. The port's access keys are kept and work again once it is locked.\n        Only a workspace admin or billing member can change a lock. An internal port has no lock (port_not_public).\nEvery write requires operation_id. Reuse the ID returned by the preview, or generate a UUID before the first call. Keep it for confirmation and all retries; a new ID means a new operation. After a timeout, check operation_status and resource state before retrying.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "default": false,
                "title": "Confirm",
                "type": "boolean"
              },
              "locked": {
