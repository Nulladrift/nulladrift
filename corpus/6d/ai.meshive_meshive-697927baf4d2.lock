        {
          "name": "create_storage",
          "title": "Create Storage",
          "description": "Create a network (nfs) storage volume of `size_gb` GiB (at least 10, like the console) that any pod in the\n        workspace can attach. It is billed hourly by capacity for as long as it exists, mounted or not.\n        With confirm=false (default) it only returns the estimate; call again with confirm=true after the user agreed.\n        `encrypted` turns on at-rest encryption. `usage_warning` warns the user when the volume fills past\n        `usage_warning_threshold` (0-1, default 0.9 = 90% full), like the console's usage warning.\n        Local storage can't be created on its own: create it together with a pod through create_pod `local_volumes`.\n        `storage_type` stays \"nfs\" (\"hostPath\" is refused); `disk_type` and `region` are accepted for compatibility\n        and ignored.\n        The volume appears in the storages tool shortly after; attach it to a pod with create_pod `volumes`.\nEvery write requires operation_id. Reuse the ID returned by the preview, or generate a UUID before the first call. Keep it for confirmation and all retries; a new ID means a new operation. After a timeout, check operation_status and resource state before retrying.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "default": false,
                "title": "Confirm",
                "type": "boolean"
              },
              "disk_type": {
                "default": "NVMe",
                "title": "Disk Type",
                "type": "string"
              },
              "encrypted": {
                "default": false,
                "title": "Encrypted",
                "type": "boolean"
              },
