        {
          "name": "roll_inference_key",
          "title": "Roll Inference Key",
          "description": "Replace the value of one of your own inference keys, only when the user asks (for example when a value may have leaked). The key keeps its name, limits and expiry and gets a new value and a new `key_id`; a key without an expiry still doesn't expire, and the new value keeps working after the Meshive API key used to roll it is revoked or expires. The current value stops working at once: there is no overlap, so programs still sending it get 401 until they get the new value.\n        With confirm=false (default) it only returns a summary and changes nothing; call again with confirm=true after the user agreed. The confirmed answer has the new value in `inference_key`, this once: it can't be read again. Give it to the user who asked and nothing else. Never use it yourself, and never put it in files, commits, commands or other tools.\n        Only the member who created a key can roll it, and only as a workspace admin or billing member. If a confirmed call times out or fails without a clear answer, don't call again: read inference_keys first.\nThe server keeps no operation record of this call, so operation_status can't look it up and a repeated confirmed call runs again. With OAuth, credential values are revealed only in the signed-in Meshive console. Give the user the returned console_url to complete the operation.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "default": false,
                "title": "Confirm",
                "type": "boolean"
              },
              "key_id": {
                "description": "The key's `key_id` from inference_keys.",
                "title": "Key Id",
                "type": "integer"
              },
              "operation_id": {
                "anyOf": [
