      "instructions": "Raziel Calculators: free investment and startup finance tools from Raziel (raziel.co). Use the calculators for exact math instead of estimating: IRR and XIRR, MOIC, CAGR, fund TVPI/DPI, carried interest, SAFE and convertible note conversion, valuation, dilution, option pool, pro rata, liquidation preferences, secondary sales, QSBS (Section 1202), 83(b) and QSBS dates, runway, cap rate, cash on cash and portfolio allocation. Founder metrics: burn multiple, Rule of 40, LTV to CAC, CAC payback and net revenue retention. Reference: search_guides searches Raziel guides to cite, define_term defines private-market terms, compare_platforms compares Raziel with other platforms. Prompts: investor_update, due_diligence_checklist and data_room_checklist. Inputs: money in USD (*_usd), percentages as percent numbers (20 = 20%, *_pct), dates as YYYY-MM-DD. Each result includes calculator_url, a page the user can open to adjust the inputs. Results are for education only, not tax, legal or investment advice.",
      "tools": [
        {
          "name": "burn_multiple",
          "title": "Burn multiple",
          "description": "Capital efficiency: net burn divided by net new ARR over the same period (a quarter or a year). Lower is better. Returns the multiple and a rough band (under 1 amazing, 1 to 1.5 great, 1.5 to 2 good, 2 to 3 suspect, over 3 bad, a rule of thumb popularized by David Sacks). Use rule_of_40 for growth versus profitability instead. Guide: https://raziel.co/learn/importance-startup-burn-rate",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "net_burn_usd": {
                "description": "Net cash burned in the period (cash out minus cash in), as a positive number.",
                "minimum": 0,
                "type": "number"
              },
              "net_new_arr_usd": {
                "description": "Net new annual recurring revenue added in the same period (new + expansion - churn). Can be negative.",
                "type": "number"
              }
            },
            "required": ["net_burn_usd", "net_new_arr_usd"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Burn multiple"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8dcecfee356d0023c8e06ecb5f4a149b3cfdfa91575059a51348238bd58f6c79"
        },
        {
          "name": "cac_payback",
          "title": "CAC payback period",
          "description": "Months of gross profit needed to earn back the cost of acquiring a customer: CAC / (monthly revenue per account x gross margin). Give cac_usd directly, or sales_marketing_spend_usd and new_customers for the same period. Many SaaS investors look for roughly 12 to 18 months or less, shorter for SMB. Use ltv_cac to also see lifetime value. Guide: https://raziel.co/learn/unit-economics-early-stage-startups",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "arpa_monthly_usd": {
                "description": "Average revenue per account per month.",
                "exclusiveMinimum": 0,
                "minimum": 0,
                "type": "number"
              },
              "cac_usd": {
                "description": "Cost to acquire one customer. Optional if spend and new customers are given.",
                "minimum": 0,
                "type": "number"
              },
              "gross_margin_pct": {
                "description": "Gross margin in percent (80 = 80%).",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "new_customers": {
                "description": "New customers won in the same period.",
                "minimum": 1,
                "type": "integer"
              },
              "sales_marketing_spend_usd": {
                "description": "Sales and marketing spend in the period (used with new_customers when cac_usd is not given).",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["arpa_monthly_usd", "gross_margin_pct"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "CAC payback period"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:188745b4184fb3251bbec04ca5e915e3f62f807067a0d4a5143ec021e30e6827"
        },
        {
          "name": "cagr",
          "title": "CAGR calculator",
          "description": "Compound annual growth rate between a start value and an end value over a number of years. Use for growth of a single value (revenue, an asset price); use irr or xirr when there are multiple cash flows. Interactive version: https://raziel.co/tools/cagr-calculator",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "end_value_usd": {
                "description": "Value at the end.",
                "minimum": 0,
                "type": "number"
              },
              "start_value_usd": {
                "description": "Value at the start.",
                "exclusiveMinimum": 0,
                "minimum": 0,
                "type": "number"
              },
              "years": {
                "description": "Number of years between the two values.",
                "exclusiveMinimum": 0,
                "maximum": 200,
                "type": "number"
              }
            },
            "required": ["end_value_usd", "start_value_usd", "years"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "CAGR calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d76f6f3395079fc4f775203cef69958a41b17b219bc714e95e19eac5fbdd3033"
        },
        {
          "name": "cap_rate",
          "title": "Cap rate calculator",
          "description": "Capitalization rate of an income property (net operating income / property value), plus gross rent multiplier and price per unit. Give noi_usd directly or gross income and operating expenses. Use cash_on_cash when financing matters. Interactive version: https://raziel.co/tools/cap-rate-calculator",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "gross_income_usd": {
                "default": 0,
                "description": "Annual gross rental income.",
                "minimum": 0,
                "type": "number"
              },
              "noi_usd": {
                "description": "Annual net operating income. If omitted, gross income minus operating expenses is used.",
                "minimum": 0,
                "type": "number"
              },
              "operating_expenses_usd": {
                "default": 0,
                "description": "Annual operating expenses, excluding mortgage payments.",
                "minimum": 0,
                "type": "number"
              },
              "property_value_usd": {
                "description": "Purchase price or current market value.",
                "exclusiveMinimum": 0,
                "minimum": 0,
                "type": "number"
              },
              "units": {
                "default": 0,
                "description": "Number of units, for price per unit. 0 to skip.",
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["property_value_usd"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cap rate calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:58965b447331f10eda40ecfa81d3fcae53b71720cf21c927158e5ed9c39431cb"
        },
        {
          "name": "carried_interest",
          "title": "Carried interest calculator",
          "description": "European (whole-fund) distribution waterfall: management fees, return of capital, preferred return (hurdle), GP catch-up and carried interest split, with LP net multiple and the gross-to-net drag. Interactive version: https://raziel.co/tools/carried-interest-calculator",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "carry_pct": {
                "default": 20,
                "description": "Carried interest, percent of profits.",
                "exclusiveMaximum": 100,
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "catch_up": {
                "default": "full",
                "description": "GP catch-up after the hurdle.",
                "enum": ["none", "full"],
                "type": "string"
              },
              "fee_years": {
                "default": 5,
                "description": "Years the full fee is charged.",
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              },
              "fund_size_usd": {
                "description": "Total LP commitments.",
                "exclusiveMinimum": 0,
                "minimum": 0,
                "type": "number"
              },
              "gross_moic": {
                "default": 3,
                "description": "Gross multiple on invested capital (mode \"moic\").",
                "minimum": 0,
                "type": "number"
              },
              "hurdle_pct": {
                "default": 8,
                "description": "Preferred return per year, percent. 0 for no hurdle.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "management_fee_pct": {
                "default": 2,
                "description": "Annual management fee on commitments, percent.",
                "exclusiveMaximum": 100,
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "mode": {
                "default": "moic",
                "description": "\"moic\" to give a gross multiple on invested capital, \"proceeds\" to give total exit proceeds.",
                "enum": ["moic", "proceeds"],
                "type": "string"
              },
              "proceeds_usd": {
                "default": 0,
                "description": "Total exit proceeds (mode \"proceeds\").",
                "minimum": 0,
                "type": "number"
              },
              "step_down_fee_pct": {
                "default": 0,
                "description": "Annual fee after the step-down, percent. 0 for none.",
                "exclusiveMaximum": 100,
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "step_down_years": {
                "default": 0,
                "description": "Years the step-down fee is charged.",
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              },
              "years": {
                "default": 10,
                "description": "Years from capital call to distribution.",
                "exclusiveMinimum": 0,
                "maximum": 30,
                "type": "number"
              }
            },
            "required": ["fund_size_usd"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Carried interest calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2b397e5184756490e317f35e2ebea371ec3daa7ced0478d94406559d646b117b"
        },
