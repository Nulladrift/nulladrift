        {
          "name": "liquidation_preference",
          "title": "Liquidation preference calculator",
          "description": "Exit waterfall: how sale proceeds split between preferred series and common, with preference multiples, non-participating, participating or capped participation, and stacked or pari passu seniority. Each series converts to common when that pays more. Interactive version: https://raziel.co/tools/liquidation-preference-calculator",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "common_shares": {
                "description": "Common shares outstanding, including exercised options (fully diluted common).",
                "minimum": 0,
                "type": "number"
              },
              "exit_value_usd": {
                "description": "Net proceeds to equity holders at the exit.",
                "minimum": 0,
                "type": "number"
              },
              "seniority": {
                "default": "stacked",
                "description": "\"stacked\": later series are paid first (listed last = most senior). \"pari\": all series share preferences pro rata.",
                "enum": ["stacked", "pari"],
                "type": "string"
              },
              "series": {
                "description": "Preferred series, oldest first.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "invested_usd": {
                      "description": "Amount the series invested.",
                      "minimum": 0,
                      "type": "number"
                    },
                    "name": {
                      "default": "",
