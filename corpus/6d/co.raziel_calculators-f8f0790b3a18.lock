                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "option_pool_pct": {
                "default": 0,
                "description": "Unissued option pool today, percent of fully diluted shares. Anything not founders or pool is treated as existing investors.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "rounds": {
                "description": "Future rounds in order.",
                "items": {
                  "additionalProperties": false,
