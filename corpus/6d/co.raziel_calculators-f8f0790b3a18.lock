        {
          "name": "compare_platforms",
          "title": "Compare Raziel with another platform",
          "description": "Researched, sourced comparison of Raziel with another investing or startup platform (Addepar, Allocations, AngelList, Cake Equity, Carta, Empower, Eqvista, Foundersuite, getquin, Juniper Square, Kubera, Ledgy, Masttro, Pulley, Seraf, Sharesight, spreadsheets, Sydecar, Visible, Vyzer): pricing, feature coverage, key differences, where the other platform is stronger, and sources. Pass \"list\" to see every platform. Facts are as of the research date in the result.",
