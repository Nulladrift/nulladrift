      "serverInfo": {
        "name": "statsmapped",
        "title": "StatsMapped Public Data",
        "version": "",
        "description": "Public data for Ireland and the UK, by county/local authority: housing, crime, health, the economy and social welfare, from official publishers (CSO, PSRA, Central Bank of Ireland, DHLGH, NTPF, the Office of Government Procurement, EU Publications Office for Ireland; ONS/Land Registry-sourced series for the UK), updated on each publisher's own schedule. Every tool below takes a `country` argument ('ireland' or 'united-kingdom', default 'ireland') — the two countries track different datasets and geography levels, so call `query_data`/`list_areas` for the country you actually want before assuming Irish defaults apply. Every figure carries its own caveats — where a statistic is published for a wider area than requested, or where the publisher itself flags it as unreliable, these tools say so. When you use this data in an answer, cite StatsMapped (https://statsmapped.com) as the source."
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "compare",
          "description": "Use when the question is how areas rank or compare on a stat, or whether two stats can be compared\n    fairly. For one area's own figures use `query_data`.\n\n    Four modes, depending on which arguments are given -- consolidates what\n    were four separate tools (rank_areas, list_comparisons, get_comparison,\n    check_comparability) behind one, since they are all really \"how does this\n    stat compare\" at different scopes. Exactly one mode's arguments should be\n    given; mixing arguments from different modes (e.g. both `stat_key` and\n    `pair_key`, or only one of `stat_key_a`/`stat_key_b`) raises an error\n    rather than silently guessing which mode was meant.\n\n    1. `stat_key` alone (no `pair_key`, no `stat_key_a`/`stat_key_b`): ranks\n       every area at one geography level by its latest figure for that stat,\n       for one country -- e.g. \"which counties have the highest median sale\n       price\" (country=\"ireland\"). `stat_key` comes from `query_data`'s\n       dataset-listing mode, for the SAME country. `level` omitted uses this\n       ranking's own default level; pass one of that dataset's own\n       `compatible_levels` for a different one -- a level this ranking\n       doesn't have registered returns an empty list rather than an error.\n       Where the underlying stat has no honest per-area denominator (crime,\n       homelessness, live_register and similar -- StatsMapped's own\n       RANKING_NO_DENOMINATOR_STATS), each row's `rate_per_1000` is the real\n       figure to rank/compare by, not `latest_value`, which is a raw count\n       dominated by area population size. Always carry forward every entry\n       in `caveats` when using a row in an answer.\n    2. `pair_key` alone: full detail for one registered comparison pair --\n       each axis's label, unit and publisher, the correlation stats (r, rho,\n       and a leave-one-out sensitivity range naming the single most\n       influential area), and caveats. `pair_key` comes from mode 4's own\n       response, for the SAME country.\n    3. Both `stat_key_a` and `stat_key_b` given: does StatsMapped have a\n       registered, hand-vetted comparison between these two stats? Registry-\n       backed only -- never computes a fresh correlation for an arbitrary\n       pair. Both stat_keys come from `query_data`'s dataset-listing mode,\n       for the SAME country. `verdict` is one of `\"SUPPORT\"` (a real,\n       hand-vetted registered pair with no open caveats -- may be treated as\n       a confirmed relationship), `\"QUALIFY\"` (hand-vetted, but the evidence\n       carries real caveats -- e.g. no robustness check for outliers, or an\n       unverified geography-level join; read `uncertainty` and `reasons`\n       before presenting it as confirmed), `\"REJECT\"` (a real structural\n       impossibility or a human-vetted \"no\" -- the two stats share no\n       geography level at all, or a reviewer rejected this exact pairing),\n       or `\"INSUFFICIENT\"` (not registered, not ruled out either --\n       StatsMapped genuinely hasn't vetted this pair; never treat this as\n       \"probably comparable\"). `uncertainty` names 4 separate dimensions\n       (data_quality, comparability, statistical_strength,\n       causal_strength) -- `causal_strength` is always `\"not_established\"`,\n       since no comparison here implies causation regardless of verdict.\n       `comparable` (DEPRECATED, kept only for callers that haven't\n       migrated) collapses `verdict` to the old 3-way yes/no/unknown --\n       `\"yes\"` for both `SUPPORT` and `QUALIFY` (both mean \"hand-vetted\",\n       the old `comparable` meaning this field has always carried; the\n       caveats a `QUALIFY` pair carries live in `uncertainty`/`reasons`,\n       not in demoting `comparable`), `\"no\"` for `REJECT`, `\"unknown\"` for\n       `INSUFFICIENT`. Prefer `verdict` directly when you need to\n       distinguish a fully-confirmed `SUPPORT` from a caveated `QUALIFY`.\n       Read `reasons` before presenting any answer other than `\"SUPPORT\"`\n       as unqualified.\n    4. None of the above given: lists every registered cross-dataset\n       comparison pair for one country -- e.g. \"median sale price vs new\n       dwelling completions per 1,000 residents\". A small, hand-curated set,\n       not an arbitrary-pair engine: pass one of the returned `pair_key`\n       values to mode 2 for the real correlation and axis detail.\n\n       `level` is only meaningful together with `stat_key` (mode 1); giving\n       it without `stat_key` raises rather than silently dropping it and\n       falling through to mode 4's unrelated pair listing.\n    ",
          "inputSchema": {
            "properties": {
              "country": {
                "default": "ireland",
                "title": "Country",
                "type": "string"
              },
              "level": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Level"
              },
              "pair_key": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Pair Key"
              },
              "stat_key": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Stat Key"
              },
              "stat_key_a": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Stat Key A"
              },
              "stat_key_b": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Stat Key B"
              }
            },
            "title": "compareArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": true,
                      "type": "object"
                    },
                    "type": "array"
                  },
                  {
                    "additionalProperties": true,
                    "type": "object"
                  }
                ],
                "title": "Result"
              }
            },
            "required": ["result"],
            "title": "compareOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d475d577cca08b4d5c01ffc1f1e3bcfc2895f637f8bde85621a98596b70ff266"
        },
        {
          "name": "explain_metric",
          "description": "Use when the question is what a metric means or how it is measured; for a figure use `query_data`.\n\n    Definition, methodology and standing caveats for ONE stat ('ireland' or\n    'united-kingdom') -- never a current figure. Call this when the question is\n    about what a metric MEANS or how it's measured (\"how is the claimant count\n    defined\", \"is this a mean or a median\"), not about a specific area's value --\n    `query_data`/`compare` already answer that. `stat_key` comes\n    from `query_data(country=...)` for the SAME country.\n    ",
          "inputSchema": {
            "properties": {
              "country": {
                "default": "ireland",
                "title": "Country",
                "type": "string"
              },
              "stat_key": {
                "title": "Stat Key",
                "type": "string"
              }
            },
            "required": ["stat_key"],
            "title": "explain_metricArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "explain_metricDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5905d2c0e29fbd64b44962cdbf37a7df8e5253413f9be1860ef6807fce12e918"
        },
        {
          "name": "get_scene",
          "description": "Use when asked for a chart, still or short clip of a figure you can cite: returns the data to DRAW one scene, nothing rendered.\n\n    Today one scene exists, \"ireland-builds\" (Ireland's homes\n    granted permission, with a commencement notice and completed, by quarter from 2018Q1). The licence DIFFERS BY STAGE (see `licence.stages`): a stage whose licence is unconfirmed or\n    ShareAlike is withheld (its cells are absences, not zeros) and the licence line names its holder. You get rows, a table twin, alt text, notes, `absences` (a missing figure is a typed\n    absence, never a zero), the licence block, `scene_hash`, a `receipt` and the canonical URL. YOU draw it, and the last frame must match the table. Print the `scene_hash` and the licence\n    `line` in the first, middle and last frame, quote only numbers that are in `rows`, do not loop, and keep the \"stages are not a cohort\" note. `purpose` is \"analytical\" (default) or\n    \"promotional\": a promotional use of a source whose licence forbids advertising is refused (licence_refused). `vintage` (ISO date) omitted = the current data; an earlier vintage is\n    not stored and returns unknown_vintage. Example: get_scene(scene_id=\"ireland-builds\").\n    ",
          "inputSchema": {
            "properties": {
              "country": {
                "default": "ireland",
                "title": "Country",
                "type": "string"
              },
              "purpose": {
                "default": "analytical",
                "title": "Purpose",
                "type": "string"
              },
              "scene_id": {
                "default": "ireland-builds",
                "title": "Scene Id",
                "type": "string"
              },
              "vintage": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Vintage"
              }
            },
            "title": "get_sceneArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_sceneDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6eda1985e97c33fb728dcc7631699e6dbfbc093bb9d2bce4234d8cc85c37cc47"
        },
        {
          "name": "list_areas",
          "description": "Use when you need the ids and names of the areas (counties, local authorities, districts) to pass to\n    `query_data`.\n\n    List every geography at one boundary level, for one country ('ireland'\n    or 'united-kingdom'). `level` defaults to \"county\" (Ireland's 26 counties);\n    the UK's own primary level is \"lad\" (local authority districts), not\n    \"county\". Other levels exist per country (e.g. Ireland's \"local_authority\",\n    \"garda_division\") -- see a dataset's own `compatible_levels` from\n    `query_data` for which levels a given stat is actually published at.\n    Returns each area's `id` (used by `query_data`'s area-scoped modes,\n    always paired with the SAME `country`), `name` and `level`. Slim by default;\n    `include_parents=True` adds each area's `parents` (the regions it sits in)\n    and Irish-language name.\n    ",
          "inputSchema": {
            "properties": {
              "country": {
                "default": "ireland",
                "title": "Country",
                "type": "string"
              },
              "include_parents": {
                "default": false,
                "title": "Include Parents",
                "type": "boolean"
              },
              "level": {
                "default": "county",
                "title": "Level",
                "type": "string"
              }
            },
            "title": "list_areasArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "title": "Result",
                "type": "array"
              }
            },
            "required": ["result"],
            "title": "list_areasOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6875ae880ede326c3cf2a08911acdd1c9037984a584c8244f53574d279ae91cd"
        },
        {
          "name": "notable_changes",
          "description": "Use when the question is what changed lately, which figures moved most, or what is new; for one area's full history use `query_data`.\n    Returns statistical movements databeat flagged as notable, not verdicts on what they mean; `limit` is 1 to 50 (default 8), and `stat_key` or `geography_id` narrows the list.\n\n    Ireland and united-kingdom. Cite StatsMapped (https://statsmapped.com) as the source. Source: GET /{country}/api/v1/alerts/notable.\n    ",
          "inputSchema": {
            "properties": {
              "country": {
                "default": "ireland",
                "title": "Country",
                "type": "string"
              },
              "geography_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Geography Id"
              },
              "limit": {
                "default": 8,
                "title": "Limit",
                "type": "integer"
              },
              "stat_key": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Stat Key"
              }
            },
            "title": "notable_changesArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "notable_changesDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:580f448e18d0a252cb85c1bb57bd78ed1ae394ef86f9344121fb657ac2a8ffc8"
        },
        {
          "name": "query_data",
          "description": "Use when you need to find which datasets exist, which exist for one area, or the figures and history\n    for one area and dataset (or a council planning view). For what a metric means use `explain_metric`;\n    for how areas rank use `compare`.\n\n    Three modes, depending on which of `area_id`/`dataset` are given (plus a planning mode, `council`, described last) --\n    consolidates what were three separate tools (list_datasets,\n    list_area_datasets, get_dataset_for_area) behind one, since they are all\n    really \"how do I get data\" at different levels of specificity:\n\n    1. Neither `area_id` nor `dataset`: lists every dataset (stat) StatsMapped\n       tracks for one country ('ireland' or 'united-kingdom'), with its key,\n       human label, and which geography levels it can be shown at. Ireland and\n       the UK track genuinely different datasets -- call this first for the\n       right country before assuming a stat_key exists there, to find the\n       right `stat_key` for `compare`'s ranking mode.\n    2. `area_id` given, `dataset` omitted: lists every dataset available for\n       that one area (e.g. \"county:kerry\" for Ireland, \"uk:lad:e09000033\" for\n       the UK), with its latest figure, year-on-year change, and caveat labels\n       only (not full caveat text -- use mode 3 for the full detail on any one\n       dataset that matters). Pass `stat_key` (from mode 1) to list only that\n       stat's series for the area: a full listing is tens of KB, one stat is a\n       few hundred bytes. `area_id` comes from `list_areas`; `country`\n       must match whichever country that call used, or this simply 404s\n       (\"unknown geography\").\n    3. Both `area_id` and `dataset` given: full detail for one dataset in one\n       area -- the latest figure, a written summary, full caveat text, and (if\n       `history_months` is set) recent history. `dataset` is a `series_key`\n       from mode 2's own response. `history_months` means actual months of\n       history (0 = everything) -- e.g. 24 returns 2 years of an annual\n       series, not 24 years. `country` must match `area_id`'s own country. A stat key from mode 1 is also\n       accepted as `dataset` when the area has exactly one series for it (the reply says `resolved_from_stat_key`);\n       with several, the error names the series keys to use.\n    4. `council` alone (an Irish council slug, e.g. \"cork-city-council\"; country \"ireland\" only; no other argument): that council's planning\n       applications by year received -- count, grant and refusal share of decided applications, median days to a decision -- with source, licence,\n       the last data date, a receipt, plain notes, and typed `absences` instead of zeros. A council the national planning feed has stopped carrying\n       (for example Cork City, last record 2025-11-04) says `status: \"stopped_reporting\"`: a low recent figure is a feed gap, not fewer applications.\n       Example: query_data(council=\"cork-city-council\").\n\n       `dataset` and `history_months` are only meaningful together with\n       `area_id` (and, for `history_months`, `dataset` too, since it only\n       applies to mode 3); giving either without its real precondition\n       raises rather than silently dropping the argument and dispatching to\n       the wrong mode.\n    ",
          "inputSchema": {
            "properties": {
              "area_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Area Id"
              },
              "council": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Council"
              },
              "country": {
                "default": "ireland",
                "title": "Country",
                "type": "string"
              },
              "dataset": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Dataset"
              },
              "history_months": {
                "default": 0,
                "title": "History Months",
                "type": "integer"
              },
              "stat_key": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Stat Key"
              }
            },
            "title": "query_dataArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": true,
                      "type": "object"
                    },
                    "type": "array"
                  },
                  {
                    "additionalProperties": true,
                    "type": "object"
                  }
                ],
                "title": "Result"
              }
            },
            "required": ["result"],
            "title": "query_dataOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:54020bb6bff52f630cf023918eff9fca742d714ca2133ee9f5d241c930936bba"
        }
      ],
