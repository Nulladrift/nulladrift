{
  "lockfileVersion": 2,
  "subjects": {
    "cloud.verifi/human-verification": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://verifi.cloud/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "verifi",
        "version": "3.0.1"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Verifi sends your claim to a real human who answers accept, reject, or a refined free-text correction. Every chain has an admission and one unlock. Use verify_claim with callback_url, then use unlock_verify when the callback reports ready. If no callback is available, poll get_verify. Every chain is paid, priced in euros and payable in USDC or EURC: an admission, then an unlock whose price depends on when the human answered (SLA window or grace window). Every price is in the first payment requirement, and verifi_info returns the current terms. There is no free human work. x402-aware MCP clients can sign and repeat paid tool calls automatically. Generic clients can pass the signed authorization as payment_signature. Pass callback_url to receive ready or failed events without an active polling loop. No account or API key is required. Never send a private key. A human reads every request: do not spam.",
      "tools": [
        {
          "name": "get_verify",
          "description": "Read the current state of a verification. Free, never reveals a locked answer.\n\n    verify_id: the id returned by verify_claim.\n    Returns status \"processing\" (a human is working: wait retry_after_seconds,\n    or rely on the callback), \"ready\" (an answer exists; service_window shows\n    the window that applied and the exact unlock price, then call\n    unlock_verify), \"failed\" (no answer within 24 hours; failure explains the\n    reason and the free next admission), or \"completed\" (the answer is\n    unlocked and included). Use it as a recovery path when no callback is set.\n    ",
          "inputSchema": {
            "properties": {
              "verify_id": {
                "title": "Verify Id",
                "type": "string"
              }
            },
            "required": ["verify_id"],
            "title": "get_verifyArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a87fe57ba8eea8521cd362985c6e578a741e02297087d2e97759927d9d24dd33"
        },
        {
          "name": "unlock_verify",
          "description": "Unlock a ready chain and return the human result.\n\n    The price was decided when the human answered: the SLA amount inside the\n    SLA window, the grace amount after it, always in the asset the admission\n    was paid in. get_verify shows it as service_window.unlock_amount before\n    you pay. Omit payment_signature first: standard x402-aware\n    MCP clients handle the payment request and retry through MCP metadata\n    automatically. Generic clients can pass the resulting x402 signature\n    manually. Never pass a private key.\n    ",
          "inputSchema": {
            "properties": {
              "payment_signature": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Payment Signature"
              },
              "verify_id": {
                "title": "Verify Id",
                "type": "string"
              }
            },
            "required": ["verify_id"],
            "title": "unlock_verifyArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dd3d1928eaae6eafb0a83eb2bc1da18e1d94639ef5a228a0d40fc768bdfa8139"
        },
        {
          "name": "verifi_info",
          "description": "Describe Verifi before using it: what it does, how to pay, and the current price terms.\n\n    Free and needs no arguments. Returns the service summary, how payment\n    works (no sign-in: each paid call carries an x402 payment), the live\n    price terms (0.10 EUR admission,\n    then 2.90 EUR if a human answers within 60 minutes or 1.45 EUR within 24\n    hours, with the asset amounts and exchange rate used), the callback\n    events, and the rules for agents. Call it once to plan; the payment\n    requirement returned by verify_claim is authoritative.\n    ",
          "inputSchema": {
            "properties": {},
            "title": "verifi_infoArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:11023b241de4ca45e3881fe81075a900d57a467d1cc601f8f80042457eb52611"
        },
        {
          "name": "verify_claim",
          "description": "Ask a real human to verify, decide on, or improve something before your agent acts.\n\n    Use it when a wrong answer is costly: a customer message, a fact the model\n    is unsure of, an approval, or a matter of taste. A person reads the intent\n    and the claim and answers accept, reject, or a refined answer with an\n    explanation. This call is gate 1: it costs 0.10 EUR (paid on Base\n    via x402) and returns a payment requirement first if unpaid; reading that\n    requirement is free and shows every later price.\n\n    intent: what your agent is trying to do (max 2000 chars).\n    claim: the claim a human should verify (max 4000 chars).\n    agent_id: your wallet address (0x + 40 hex). Signs the x402 payments.\n    callback_url: optional HTTPS endpoint for verify.ready or verify.failed.\n    Use it to avoid an active polling loop; retain verify_id for recovery.\n    payment_signature: optional manual compatibility input. Standard x402-aware\n    MCP clients send the signed payment through request metadata automatically.\n    Returns status \"processing\" with a verify_id. Prefer callback_url, or poll\n    get_verify at the returned interval until status is \"ready\" or \"failed\".\n    If ready, call unlock_verify. Only one active verify per agent_id at a time.\n    ",
          "inputSchema": {
            "properties": {
              "agent_id": {
                "title": "Agent Id",
                "type": "string"
              },
              "callback_url": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Callback Url"
              },
              "claim": {
                "title": "Claim",
                "type": "string"
              },
              "intent": {
                "title": "Intent",
                "type": "string"
              },
              "payment_signature": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Payment Signature"
              }
            },
            "required": ["agent_id", "claim", "intent"],
            "title": "verify_claimArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:795225be1059040adcbbda028f501c624202e6c5d141cd1c5844cf069ef366a3"
        }
      ],
      "digest": "sha256:7c4088d5b17c7bdfa34b7c5ddf5f44ab0431c80b20115a36942cfcfd62c38447"
    }
  }
}
