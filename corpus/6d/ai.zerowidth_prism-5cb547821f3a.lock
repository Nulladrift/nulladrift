          "digest": "sha256:e5b2745df4ed0838e017a7615436015849554127ea8fcfeffe26bcbb56c4d093"
        },
        {
          "name": "entity_tags_get",
          "title": "Read the tags on entities",
          "description": "Returns the tags on a batch of entities of one kind — the labels galleries organize by. Ids come from the kind's list/get tool or from search_workspace. Use it before entity_tags_set so you replace the full set knowingly, and to answer 'what is this filed under'. Entities the user can't see are omitted.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "entityKind": {
                "description": "Which kind the ids belong to.",
                "enum": ["workbench_flow", "workbench_task", "workbench_kb", "compass_page", "compass_opportunity", "caliper_dataset", "caliper_rubric", "caliper_eval", "caliper_review", "caliper_spec", "caliper_source", "ledger_entry", "ledger_metric", "napkin_board", "napkin_deck", "napkin_doc", "napkin_sheet", "napkin_diagram", "prism_field", "prism_study"],
                "type": "string"
              },
              "ids": {
                "items": {
                  "maxLength": 100,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this; tokens with a default can override per call. Ignored for workspace API keys.",
                "type": "string"
              }
            },
            "required": ["entityKind", "ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read the tags on entities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:346d83a85b11509449484441c66240b6dde65ba4589afd3b72662213235c98c7"
        },
        {
          "name": "entity_tags_set",
          "title": "Set an entity's tags",
          "description": "Replaces the FULL tag set on one entity (an empty list clears it). Read the current tags with entity_tags_get first and pass the merged list — this is not additive. Tags are lowercase letters, numbers, spaces, and hyphens; prefer labels already in use (entity_tags_browse) so the workspace's vocabulary stays small. The id comes from the kind's list/get tool or search_workspace.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approvalId": {
                "description": "Approval id from a prior needs_confirmation response. Omit on the first call.",
                "type": "string"
              },
              "entityId": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "entityKind": {
                "enum": ["workbench_flow", "workbench_task", "workbench_kb", "compass_page", "compass_opportunity", "caliper_dataset", "caliper_rubric", "caliper_eval", "caliper_review", "caliper_spec", "caliper_source", "ledger_entry", "ledger_metric", "napkin_board", "napkin_deck", "napkin_doc", "napkin_sheet", "napkin_diagram", "prism_field", "prism_study"],
                "type": "string"
              },
              "tags": {
                "items": {
                  "maxLength": 40,
                  "pattern": "^[a-z0-9](?:[a-z0-9 -]*[a-z0-9])?$",
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this; tokens with a default can override per call. Ignored for workspace API keys.",
                "type": "string"
              }
            },
            "required": ["entityId", "entityKind", "tags"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Set an entity's tags"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:195cb303938f61f09536ea335416b97a1bcee8878a0dd4d13f609cc31c843562"
        },
