                  "adjustmentRule": {
                    "type": "string"
                  },
                  "boundaryRule": {
                    "type": "string"
                  },
                  "calendar": {
                    "const": "Gregorian",
                    "type": "string"
                  },
                  "country": {
                    "anyOf": [
                      {
                        "description": "Canonical uppercase ISO country code; discover supported codes with list_locations.",
                        "pattern": "^[A-Z]{2}$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "days": {
                    "type": "number"
                  },
                  "end": {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "excludeHolidays": {
                    "type": "boolean"
                  },
                  "excludeWeekdays": {
                    "items": {
                      "type": "number"
                    },
                    "type": "array"
                  },
                  "includeEnd": {
                    "type": "boolean"
                  },
                  "language": {
                    "type": "string"
                  },
                  "mode": {
                    "enum": ["count", "add", "subtract"],
                    "type": "string"
                  },
                  "months": {
                    "type": "number"
                  },
                  "region": {
                    "anyOf": [
                      {
                        "description": "Exact subdivision code from list_locations; omit for the national calendar.",
                        "maxLength": 64,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "roll": {
                    "enum": ["none", "next", "previous"],
                    "type": "string"
                  },
                  "start": {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "timezone": {
                    "const": "UTC calendar dates (no time of day)",
                    "type": "string"
                  },
                  "weeks": {
                    "type": "number"
                  },
                  "years": {
                    "type": "number"
                  }
                },
                "required": ["boundaryRule", "calendar", "country", "excludeHolidays", "excludeWeekdays", "language", "mode", "region", "start", "timezone"],
