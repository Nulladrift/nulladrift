        {
          "name": "shift_date",
          "title": "Add or subtract a date",
          "description": "Use for 'what date is N days, weeks, months or years before or after X', including business-day deadlines. Without exclusions, applies days, weeks, months, then years. With exclusions, all units become calendar days, and that many non-excluded days are counted: 1 month after 2027-01-15, excluding Saturday and Sunday, gives 2027-03-01, not 2027-02-15. The start date is not counted; the destination is. To move a plain date such as 'one month later' to a working day instead, set roll to next or previous. If holiday data is unavailable, the call fails. Returns the date, its weekday and ISO week, warnings to read, the rules used and a share link.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Country whose public holidays excludeHolidays removes, as its code from list_locations, for example US or DE. Necessary when excludeHolidays is true or region is set.",
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              },
              "days": {
                "default": 0,
                "description": "Days to move. With an exclusion, only days that are not excluded are counted, and the years, months and weeks are first converted to their calendar-day span from start.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "excludeHolidays": {
                "default": false,
                "description": "Exclude public holidays, including observed dates, as full days. The data does not mark half-day holidays. Requires country; unavailable holiday data is an error.",
                "type": "boolean"
              },
              "excludeWeekdays": {
                "default": [],
                "description": "Weekdays that do not count, as numbers: 0 is Sunday, 1 is Monday, and so on to 6 for Saturday. Use [0,6] for a Saturday and Sunday weekend; some countries have a different weekend, so choose the days for the country.",
                "items": {
                  "maximum": 6,
                  "minimum": 0,
                  "type": "integer"
                },
                "maxItems": 7,
                "type": "array"
              },
              "language": {
                "default": "en",
                "description": "Language of the Date Calculator page that shareUrl opens. The call fails when that page does not offer the country. nb and no, zh-Hans and zh-cn, and zh-Hant and zh-tw are the same language. Weekday names and warnings in the result are always English.",
                "enum": ["ar", "bg", "cs", "da", "de", "el", "en", "es", "fi", "fr", "he", "hr", "hu", "id", "it", "ja", "ko", "nb", "nl", "pl", "pt", "ro", "ru", "sk", "sr", "sv", "th", "tr", "uk", "vi", "zh-Hans", "zh-Hant", "no", "zh-cn", "zh-tw"],
                "type": "string"
              },
              "mode": {
                "description": "Direction: add moves forward from start, subtract moves back.",
                "enum": ["add", "subtract"],
                "type": "string"
              },
              "months": {
                "default": 0,
                "description": "Calendar months to move. A day that the target month does not have becomes the last day of that month.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "region": {
                "description": "Region of country, to also exclude its regional public holidays: the exact code that list_locations gives for the country. Omit it to use only the national calendar.",
                "maxLength": 64,
                "type": "string"
              },
              "roll": {
                "default": "none",
                "description": "next or previous: apply the units as plain calendar arithmetic, then move day by day in that direction to the first day that is not excluded. This needs an exclusion, and not all seven weekdays. none: no such move; with an exclusion, the units are counted in days that are not excluded.",
                "enum": ["none", "next", "previous"],
                "type": "string"
              },
              "start": {
                "description": "Date that the move starts from, as year, month and day, for example 2027-01-15. It is not counted.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "weeks": {
                "default": 0,
                "description": "Weeks to move, 7 days each.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "years": {
                "default": 0,
                "description": "Calendar years to move. A 29 February that the target year does not have becomes 28 February.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["mode", "start"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "businessDaysRan": {
                "description": "True when the move counted only days that are not excluded. False for plain calendar arithmetic, which includes every roll.",
                "type": "boolean"
              },
              "date": {
                "description": "The answer: the date after the move.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "holidayData": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "category": {
                        "const": "public",
                        "description": "Always public: the data holds public holidays only.",
                        "type": "string"
                      },
                      "country": {
                        "description": "Country of the holiday calendar that the calculation used.",
                        "pattern": "^[A-Z]{2}$",
                        "type": "string"
                      },
                      "coverage": {
                        "additionalProperties": false,
                        "description": "First and last year that the calendar has data for.",
                        "properties": {
                          "endYear": {
                            "maximum": 9999,
                            "minimum": 1,
                            "type": "integer"
                          },
                          "startYear": {
                            "maximum": 9999,
                            "minimum": 1,
                            "type": "integer"
                          }
                        },
                        "required": ["endYear", "startYear"],
                        "type": "object"
                      },
                      "dataVersion": {
                        "description": "Version of the holiday dataset: a hash of its content, so it changes only when the data changes.",
                        "type": "string"
                      },
                      "fetchedRange": {
                        "additionalProperties": false,
                        "description": "First and last year of the holiday data that the calculation loaded.",
                        "properties": {
                          "endYear": {
                            "maximum": 9999,
                            "minimum": 1,
                            "type": "integer"
                          },
                          "startYear": {
                            "maximum": 9999,
                            "minimum": 1,
                            "type": "integer"
                          }
                        },
                        "required": ["endYear", "startYear"],
                        "type": "object"
                      },
                      "generatedAt": {
                        "description": "Build time of the holiday data, as the dataset gives it.",
                        "type": "string"
                      },
                      "languageFallback": {
                        "description": "True when the calendar does not have the requested language. The names are then in the calendar's default language.",
                        "type": "boolean"
                      },
                      "languageRequested": {
                        "description": "Language requested for the holiday names, in the code form of the holiday data: no, zh-cn and zh-tw show as nb, zh-Hans and zh-Hant.",
                        "type": "string"
                      },
                      "languageUsed": {
                        "description": "Language of the holiday names that the data gave.",
                        "type": "string"
                      },
                      "observed": {
                        "const": true,
                        "description": "Always true: observed dates are included.",
                        "type": "boolean"
                      },
                      "region": {
                        "anyOf": [
                          {
                            "maxLength": 64,
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Region of that calendar. Null for the national calendar."
                      },
                      "source": {
                        "const": "https://api.onlinealarmkur.com",
                        "description": "Origin of the holiday data.",
                        "type": "string"
                      }
                    },
                    "required": ["category", "country", "coverage", "dataVersion", "fetchedRange", "generatedAt", "languageFallback", "languageRequested", "languageUsed", "observed", "region", "source"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Source, version and coverage of the holiday data that the calculation used. Null when it used no holiday data."
              },
              "isoWeek": {
                "description": "ISO 8601 week of date.",
                "pattern": "^\\d{4}-W\\d{2}$",
                "type": "string"
              },
              "ok": {
                "const": true,
                "description": "Always true. An error result has no structured content.",
                "type": "boolean"
              },
              "rollApplied": {
                "description": "True when roll moved the date away from an excluded day.",
                "type": "boolean"
              },
              "rules": {
                "additionalProperties": false,
                "description": "The inputs as the calculation applied them, with defaults filled in, and the rules it followed in words. country is the country that was sent, or null.",
                "properties": {
                  "adjustmentRule": {
                    "description": "In words: how the units and the exclusions were applied. Only for add and subtract.",
                    "type": "string"
                  },
                  "boundaryRule": {
                    "description": "In words: which of the first and the last day the calculation counted.",
                    "type": "string"
                  },
                  "calendar": {
                    "const": "Gregorian",
                    "type": "string"
                  },
                  "country": {
                    "anyOf": [
                      {
                        "pattern": "^[A-Z]{2}$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "days": {
                    "type": "number"
                  },
                  "end": {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "excludeHolidays": {
                    "type": "boolean"
                  },
                  "excludeWeekdays": {
                    "items": {
                      "type": "number"
                    },
                    "type": "array"
                  },
                  "includeEnd": {
                    "type": "boolean"
                  },
                  "language": {
                    "description": "Language of the page that shareUrl opens, with nb, zh-Hans and zh-Hant shown as no, zh-cn and zh-tw.",
                    "type": "string"
                  },
                  "mode": {
                    "enum": ["count", "add", "subtract"],
                    "type": "string"
                  },
                  "months": {
                    "type": "number"
                  },
                  "region": {
                    "anyOf": [
                      {
                        "maxLength": 64,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "roll": {
                    "enum": ["none", "next", "previous"],
                    "type": "string"
                  },
                  "start": {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "timezone": {
                    "const": "UTC calendar dates (no time of day)",
                    "type": "string"
                  },
                  "weeks": {
                    "type": "number"
                  },
                  "years": {
                    "type": "number"
                  }
                },
                "required": ["boundaryRule", "calendar", "country", "excludeHolidays", "excludeWeekdays", "language", "mode", "region", "start", "timezone"],
                "type": "object"
              },
              "shareUrl": {
