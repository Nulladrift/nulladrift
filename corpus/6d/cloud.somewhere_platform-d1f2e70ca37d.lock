{
  "lockfileVersion": 2,
  "subjects": {
    "cloud.somewhere/platform": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.somewhere.cloud/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "somewhere-tech",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Use project_deploy with a name and source files to publish a temporary app. Share the returned live URL, claim URL, and expiry with the person. Keep your session ID private and reuse it for deploys, logs, and errors. Connect a Somewhere account to use other tools.",
      "tools": [
        {
          "name": "errors",
          "description": "Read recent errors for a project in your temporary session.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "project_id": {
                "description": "The project_id returned by project_deploy.",
                "type": "string"
              },
              "session_id": {
                "description": "The private session_id returned by project_deploy. Omit for your first deploy.",
                "type": "string"
              }
            },
            "required": ["project_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5c92c187a56bc1dac54a05f44f91ebbf510f7edb698aae1ad3083b414fa6ffb3"
        },
        {
          "name": "project_deploy",
          "description": "Deploy a temporary app from raw source. Use a name on the first deploy. Give the person the returned live URL, claim URL and expiry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "base_release_id": {
                "description": "The active_release_id returned with the source you are updating.",
                "type": "string"
              },
              "binary_files": {
                "additionalProperties": {
                  "type": "string"
                },
                "type": "object"
              },
              "files": {
                "additionalProperties": {
                  "type": "string"
                },
                "type": "object"
              },
              "functions": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Server handlers keyed by path, such as api/hello.ts.",
                "type": "object"
              },
              "name": {
                "description": "Project name for the first deploy.",
                "type": "string"
              },
              "project_id": {
                "description": "The project_id returned by project_deploy.",
                "type": "string"
              },
              "proof": {
                "description": "Supply this only if the previous deploy response requests it.",
                "type": "object"
              },
              "session_id": {
                "description": "The private session_id returned by project_deploy. Omit for your first deploy.",
                "type": "string"
              }
            },
            "required": ["files"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f60bc779858e74e43546cb192d39eb934d4c116698eca953b64d532e9f71ab93"
        },
        {
          "name": "project_logs",
          "description": "Read logs for a project in your temporary session.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "project_id": {
                "description": "The project_id returned by project_deploy.",
                "type": "string"
              },
              "session_id": {
                "description": "The private session_id returned by project_deploy. Omit for your first deploy.",
                "type": "string"
              }
            },
            "required": ["project_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8620d850eddcb19e2a85ac410780e0b20efe19a6066a2c43b29bd41b9b3b604a"
        }
      ],
      "digest": "sha256:642843740f160527fe975ab195368b7ee0b2f8017d023c0ab7d1d8e3ac773951"
    }
  }
}
