{
  "lockfileVersion": 2,
  "subjects": {
    "cloud.somewhere/platform": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.somewhere.cloud/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "somewhere-tech",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "project_deploy publishes a temporary app from a name and source files and returns its live URL, claim link and expiry for the person. The returned session ID is private; the same session ID continues deploys, logs and errors. A connected Somewhere account enables the other tools.\nAn app deploys with two HTTP calls, with no CLI or install: https://somewhere.cloud/start.txt",
      "tools": [
        {
          "name": "errors",
          "title": "Read recent app errors",
          "description": "Read recent errors for a project in your temporary session.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "project_id": {
                "description": "The project_id returned by project_deploy.",
                "type": "string"
              },
              "session_id": {
                "description": "The private session_id returned by project_deploy. Omit for your first deploy.",
                "type": "string"
              }
            },
            "required": ["project_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read recent app errors"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["mcp"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:bc68fe480fd337d572650e68688e883c4ed2fe0379a1501e4e6fe177aa0bbc3e"
        },
        {
          "name": "project_deploy",
          "title": "Deploy raw source",
          "description": "Deploy a temporary app from raw source. Use a name on the first deploy. Give the person the returned live URL, claim link and expiry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "base_release_id": {
                "description": "The active_release_id returned with the source you are updating.",
                "type": "string"
              },
              "binary_files": {
                "additionalProperties": {
                  "type": "string"
                },
                "type": "object"
              },
              "files": {
                "additionalProperties": {
                  "type": "string"
                },
                "type": "object"
              },
              "functions": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Server handlers keyed by path, such as api/hello.ts.",
                "type": "object"
              },
              "name": {
                "description": "Project name for the first deploy.",
                "type": "string"
              },
              "project_id": {
                "description": "The project_id returned by project_deploy.",
                "type": "string"
              },
              "proof": {
                "description": "Supply this only if the previous deploy response requests it.",
                "type": "object"
              },
              "session_id": {
                "description": "The private session_id returned by project_deploy. Omit for your first deploy.",
                "type": "string"
              }
            },
            "required": ["files"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Deploy raw source"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["mcp"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:c405be0ca7afddb0ff4d16f572d20a54fe93ea60176b3665d99728f2b9e9e1a0"
        },
        {
          "name": "project_logs",
          "title": "Read project logs",
          "description": "Read logs for a project in your temporary session.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "project_id": {
                "description": "The project_id returned by project_deploy.",
                "type": "string"
              },
              "session_id": {
                "description": "The private session_id returned by project_deploy. Omit for your first deploy.",
                "type": "string"
              }
            },
            "required": ["project_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read project logs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["mcp"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:7ae367ce0302ee1cf411fd02d5a48cf3abbf222268135a44404851c9da27b826"
        }
      ],
      "digest": "sha256:90c3c6aa44870f00c7b30b2f1086a1f3f631cd2aa9f9680125c680cb0f1055ef"
    }
  }
