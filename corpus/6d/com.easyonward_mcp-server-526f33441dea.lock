{
  "lockfileVersion": 2,
  "subjects": {
    "com.easyonward/mcp-server": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.easyonward.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "easyonward",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_visa",
          "title": "Check visa & entry requirements",
          "description": "Check whether a traveler holding a given passport needs a visa, and what entry & transit requirements apply, for a destination country — with official government sources. Accepts ISO 3166-1 alpha-2 codes (e.g. \"US\", \"KE\") or common country names (e.g. \"United States\", \"Kenya\"). Returns a plain-language verdict, the specific requirements by severity, deduped official source links, and a deep link to the full EasyOnward analysis. Read-only and PII-free; the analysis is generic for any citizen of the passport country.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "destination_country": {
                "description": "The destination country. ISO 3166-1 alpha-2 code (e.g. \"KE\") or country name (e.g. \"Kenya\").",
                "type": "string"
              },
              "passport_country": {
                "description": "The traveler's passport-issuing country. ISO 3166-1 alpha-2 code (e.g. \"US\") or country name (e.g. \"United States\").",
                "type": "string"
              }
            },
            "required": ["destination_country", "passport_country"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5f66d20af9a92a6556d1b459d884a82277dd666790c57e1f8a7d7baa9bdf00a1"
        },
        {
          "name": "country_code",
          "title": "Resolve a country name to its ISO-2 code",
          "description": "Resolve a country name (or an existing ISO 3166-1 alpha-2 code) to its uppercase ISO 3166-1 alpha-2 code — e.g. \"Kenya\" → \"KE\". Useful before calling check_visa. Returns an error if the name can't be resolved.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "name": {
                "description": "A country name or ISO-2 code, e.g. \"Kenya\" or \"KE\".",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1ed6cc90282452eab7734647d48d2663ba54ed36fa011aa74391f35f59dc2f72"
        }
      ],
      "digest": "sha256:1012d7f19455be57ee121ce5e79236f463be9a7d35604225d5a2cf111f89a0b7"
    }
  }
}
