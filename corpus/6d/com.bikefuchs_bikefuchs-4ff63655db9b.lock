        {
          "name": "resolve_product",
          "title": "Resolve Product URL",
          "description": "Turn a product page URL from a supported shop into structured product data — EAN barcode, price, stock status, and a purchase link — so the EAN can then be used with get_best_price or optimize_cart. Multi-variant product families return a labeled candidate list (size/colour, price, EAN per variant): ask the user to pick a variant, then use that exact variant's EAN with the other tools.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "default": "DE",
                "description": "Country for pricing (DE or AT, default DE)",
                "enum": ["DE", "AT"],
                "type": "string"
              },
              "url": {
                "description": "Product page URL from a supported shop (e.g. 'https://www.rosebikes.de/p/<product-name>-<id>')",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "affiliate_url": {
                "description": "Affiliate link for this product.",
                "type": "string"
              },
              "axis": {
                "description": "Variant axis of the options: 'size', 'colour', 'mixed', 'size_name' or 'name'.",
                "type": "string"
              },
              "brand": {
                "type": "string"
              },
              "disclosure": {
                "type": "string"
              },
              "ean": {
                "type": "string"
              },
              "family_url": {
                "description": "Branded /go/ link to the product family page so the user can pick the variant.",
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "min_price": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "options": {
                "description": "Variants of ONE product. Ask the user to pick one, then use that variant's EAN.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "colour": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "donor_label": {
                      "description": "Verbatim variant/product name; use as the choice label when present.",
                      "type": "string"
                    },
                    "ean": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "EAN of this exact variant; null when the shop has no barcode for this size — then there is no price comparison, use product_url."
                    },
                    "in_stock": {
                      "anyOf": [
                        {
                          "type": "boolean"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Stock at the input shop; null when unknown per variant."
                    },
                    "price": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Price at the input shop; null when only a family-level page price exists."
                    },
                    "product_name": {
                      "description": "Verbatim product name for a flat name-axis option; use as the choice label when present.",
                      "type": "string"
                    },
                    "product_url": {
                      "description": "Direct /go/ link to this exact size at the input shop.",
                      "type": "string"
                    },
                    "size": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  },
                  "required": ["ean"],
                  "type": "object"
                },
                "type": "array"
              },
              "price": {
                "type": "number"
              },
              "product_name": {
                "type": "string"
              },
              "resolved": {
                "type": "boolean"
              },
              "shop": {
                "type": "string"
              },
              "status": {
                "description": "'not_resolved' when the exact variant could not be determined; 'pick_variant' when labeled variant options are returned to choose from.",
                "type": "string"
              }
            },
            "required": ["product_name", "shop"],
            "type": "object"
          },
