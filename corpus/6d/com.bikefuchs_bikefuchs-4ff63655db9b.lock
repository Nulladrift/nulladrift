        {
          "name": "optimize_cart",
          "title": "Optimize Shopping Cart",
          "description": "Find the cheapest way to buy multiple products together: computes the optimal split across shops — which items to order from which shop — accounting for each shop's shipping costs and free-shipping thresholds, and returns the lowest achievable total including shipping. Takes an array of EAN barcodes. For accurate results, call get_best_price for each EAN first, then call optimize_cart.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "default": "DE",
                "description": "Country for pricing and shipping (DE or AT, default DE)",
                "enum": ["DE", "AT"],
                "type": "string"
              },
              "eans": {
                "description": "Array of EAN barcodes (8–14 digit numbers as strings, e.g. '4524667749493'). NOT URLs.",
                "items": {
                  "pattern": "^\\d{8,14}$",
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["eans"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "disclosure": {
                "type": "string"
              },
              "excluded_stale_offers": {
                "additionalProperties": false,
                "properties": {
                  "count": {
                    "type": "number"
                  },
                  "shops": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["count", "shops"],
                "type": "object"
              },
              "optimization": {
                "additionalProperties": false,
                "properties": {
                  "currency": {
                    "type": "string"
                  },
                  "grand_total": {
                    "type": "number"
                  },
                  "shops_used": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "items": {
                          "items": {
                            "additionalProperties": false,
                            "properties": {
                              "affiliate_url": {
                                "description": "Direct link to buy this item. Always show this URL to the user.",
                                "type": "string"
                              },
                              "ean": {
                                "type": "string"
                              },
                              "name": {
                                "type": "string"
                              },
                              "price": {
                                "type": "number"
                              }
                            },
                            "required": ["affiliate_url", "name", "price"],
                            "type": "object"
                          },
                          "type": "array"
                        },
                        "shipping": {
                          "type": "number"
                        },
                        "shop": {
                          "type": "string"
                        },
                        "subtotal": {
                          "type": "number"
                        }
                      },
                      "required": ["items", "shipping", "shop", "subtotal"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "total_cost": {
                    "type": "number"
                  },
                  "total_shipping": {
                    "type": "number"
                  }
                },
                "required": ["currency", "grand_total", "shops_used", "total_cost", "total_shipping"],
                "type": "object"
              },
