          },
          "digest": "sha256:af64dd9f51bbf77ed2c8e784a1584f1d204b1e39117db9cc22007da969a731b8"
        },
        {
          "name": "get_tool",
          "title": "Describe a GlanceDesk tool",
          "description": "Get everything about one GlanceDesk tool before running it: its inputs (types, units, options, min/max) as JSON Schema, outputs, formula or legal rule, official sources with URLs, last-checked date, disclaimer, page URL and a worked example computed by the tool itself.",
