        {
          "name": "gulf_final_settlement",
          "title": "Gulf final settlement (Saudi Arabia, UAE)",
          "description": "Work out what a private-sector worker is owed when a job ends in Saudi Arabia, the UAE or Qatar: end-of-service award or gratuity, unpaid wages, unused leave and overtime, each line with its labour-law article, plus a claim summary. Uses GlanceDesk Jurisdiction's tested engine.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "basic_monthly_wage": {
                "description": "Last basic monthly wage, without allowances (SAR, AED or QAR). The UAE and Qatar gratuity and leave pay use this.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "country": {
                "description": "sa = Saudi Arabia (Labor Law, Royal Decree M/51), ae = United Arab Emirates (Federal Decree-Law 33 of 2021, private sector), qa = Qatar (Labour Law, Law No. 14 of 2004).",
                "enum": ["sa", "ae", "qa"],
                "type": "string"
              },
              "first_day": {
                "description": "First day of work, YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "how_it_ended": {
                "description": "employer = the employer ended the contract (not for misconduct); expired = fixed-term contract ended, not renewed; resign = the worker resigned; breach = the worker left because the employer broke the contract or law (Saudi Art. 81, UAE Art. 45); exception = Saudi only: force majeure, or a female worker leaving within 6 months of marriage or 3 months of giving birth; misconduct = dismissed without notice for a reason the law lists (Saudi Art. 80, UAE Art. 44, Qatar Art. 61).",
                "enum": ["employer", "expired", "resign", "breach", "exception", "misconduct"],
                "type": "string"
              },
              "last_day": {
                "description": "Last day of work, YYYY-MM-DD. Both days count as service.",
                "format": "date",
                "type": "string"
              },
              "night_overtime_hours": {
                "description": "UAE or Qatar, optional: how many of the overtime hours were at night (UAE 10 pm to 4 am, Qatar 9 pm to 3 am; not for shift workers).",
                "minimum": 0,
                "type": "number"
              },
              "normal_hours_per_day": {
                "description": "Needed only with overtime: normal working hours per day in the contract.",
                "exclusiveMinimum": 0,
                "maximum": 24,
                "type": "number"
              },
              "overtime_hours": {
                "description": "Optional. Unpaid overtime hours.",
                "minimum": 0,
                "type": "number"
              },
              "total_monthly_wage": {
                "description": "Last total monthly wage: basic plus contractual allowances. The Saudi award and leave pay use this. Must be at least the basic wage.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "unpaid_absence_days": {
                "description": "UAE only, optional: days of unpaid absence (not counted as service).",
                "minimum": 0,
                "type": "integer"
              },
              "unpaid_wage_months": {
                "description": "Optional. Months of wages not paid (decimals for part months).",
                "minimum": 0,
                "type": "number"
              },
              "unused_leave_days": {
                "description": "Optional. Unused annual leave days earned, including this year's share.",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["basic_monthly_wage", "country", "first_day", "how_it_ended", "last_day", "total_monthly_wage"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Gulf final settlement"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3c2679e1fa81d409ee5e8822d2e35d322b74339a17c9f600ee63f05aee925426"
        },
        {
          "name": "run_calculator",
          "title": "Run a GlanceDesk calculator",
          "description": "Run one GlanceDesk Calculators, GlanceDesk Crypto or GlanceDesk Compute calculator with the person's values and get the tested answer with units, a one-sentence explanation, the formula, official sources, last-checked date, page URL and disclaimer. Invalid or missing values return the calculator's own error message; nothing is guessed or filled in.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "inputs": {
                "additionalProperties": {
                  "type": ["number", "string"]
                },
                "description": "Field id to value, as listed by get_tool. Numbers may be given as numbers or as text like \"10,000\"; dates as YYYY-MM-DD; options by their value.",
                "type": "object"
              },
              "slug": {
