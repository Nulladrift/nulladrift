        },
        {
          "name": "searchExamples",
          "title": "Search Mobiscroll Examples",
          "description": "Search for Mobiscroll examples by query, framework, major version, and component filters. Supports multi-keyword queries — all keywords must match (AND logic). Results are sorted by relevance (title matches rank highest).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "components": {
                "description": "Filter by component. Pass the bare lowercase component IDs as returned by listComponents / getComponentSchema (e.g. \"popup\", \"select\", \"input\", \"checkbox\", \"datepicker\", \"eventcalendar\"). OR logic across the array. For Eventcalendar you may append a view suffix to narrow to that view - \"eventcalendar.agenda\", \"eventcalendar.scheduler\", \"eventcalendar.timeline\", \"eventcalendar.calendarview\"; bare \"eventcalendar\" (or \"eventcalendar.base\") returns all views.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "framework": {
                "description": "Framework to search in. Use \"js\" for plain JavaScript (@mobiscroll/javascript package).",
                "enum": ["react", "angular", "vue", "js", "jquery"],
                "type": "string"
              },
              "major": {
                "description": "Major version to search in",
                "type": "number"
              },
