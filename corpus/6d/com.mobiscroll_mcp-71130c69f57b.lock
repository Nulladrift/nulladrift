        {
          "name": "searchConnect",
          "title": "Search Connect API and SDKs",
          "description": "Keyword search across Connect REST endpoints, SDK methods, concept guides and data models. Space-separated keywords; common synonyms match (meeting -> conference, login -> authorize). Results matching every keyword come first; when none does, results matching some keywords are returned with match \"partial\" and the words nothing matched in unmatchedWords. Results sorted by relevance.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "kind": {
                "description": "What to search (default: all).",
                "enum": ["endpoint", "operation", "guide", "model", "all"],
                "type": "string"
              },
              "language": {
                "description": "Restrict SDK matches to one language. Endpoints, guides and models are always searched.",
                "enum": ["node", "python", "php", "dotnet", "java", "go", "ruby"],
                "type": "string"
              },
              "maxResults": {
                "description": "Max results (default: 20).",
                "type": "number"
              },
              "query": {
                "description": "Space-separated keywords.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Connect API and SDKs"
          },
          "behavior": {
