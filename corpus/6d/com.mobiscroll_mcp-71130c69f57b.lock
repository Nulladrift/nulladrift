      "instructions": "Mobiscroll UI components (v5 and v6; react, angular, vue, js for plain JavaScript, jquery) and Mobiscroll Connect (the calendar REST API and its SDKs).\n\nUI components:\n1. Call resolveEnvironment first, with the raw text of the project's package.json. Use the framework and major it returns in every other call.\n2. If you don't know the component id, call listComponents. The Eventcalendar takes a view suffix: eventcalendar.base, .agenda, .calendarview, .scheduler or .timeline.\n3. Call getComponentSchema without names to get the index, then with names for the entities you will use. Use only APIs it returns; an entity marked deprecated names its replacement.\n4. Prefer adapting an example: searchExamples, then getExampleById for the one you pick. relatedExamples names similar ones.\n5. Call validateCode on your code before you present it.\n6. Never guess a Mobiscroll API. If the schema and the examples don't cover something, say so.\n\nConnect:\n1. Call resolveConnectEnvironment first, with the project's dependency manifest.\n2. REST endpoints: listConnectEndpoints, getConnectEndpointSchema. SDK methods: listConnectSdkMethods, getConnectSdkMethod. searchConnect finds all of them by keyword, mapConnectEndpointToSdk turns an endpoint into the SDK call, and getConnectErrorTaxonomy covers error handling.\n3. Before writing token handling, paging, all-day events, writes, recurring events or webhook handling, read the matching guide (getConnectGuide; without a topic it lists them). getConnectModel gives the JSON shape of events, calendars, webhook deliveries and the other bodies.\n4. Persist the tokens from the SDK token-refresh hook: refresh tokens rotate on every refresh.\n5. Never guess endpoints or SDK signatures.",
      "tools": [
        {
          "name": "getComponentSchema",
          "title": "Get Component API Schema",
          "description": "Returns the API schema (options, events, methods, renderers) for a Mobiscroll component. Two-step, token-efficient flow: (1) call WITHOUT names to get a compact index - every entity as name + kind + tsType + a one-line summary. (2) Review the index, then call AGAIN with names:[...] to get the full details (complete description, default value, related entities) for only the entities you will actually use. Optionally pass kind to narrow to one entity type. The full schema is large, so prefer this two-step flow over pulling everything. Deprecated entities are marked deprecated: true in the index, with their replacement in the summary; don't use them in new code.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "component": {
                "description": "Bare lowercase component ID, regardless of framework (e.g., \"datepicker\", \"select\", \"popup\"). Do NOT include framework-specific prefixes or casing - use \"eventcalendar\" not \"mbsc-eventcalendar\" (Angular), \"MbscEventcalendar\" (Vue), or \"Eventcalendar\" (React). For Eventcalendar, append the variant suffix: \"eventcalendar.base\", \"eventcalendar.agenda\", \"eventcalendar.scheduler\", \"eventcalendar.timeline\", \"eventcalendar.calendarview\". Use listComponents to discover valid IDs.",
                "type": "string"
              },
              "framework": {
                "description": "Framework to get the schema for. Use \"js\" for plain JavaScript (@mobiscroll/javascript package).",
                "enum": ["react", "angular", "vue", "js", "jquery"],
                "type": "string"
              },
              "kind": {
                "description": "Optional filter: return only entities of this kind. Works with or without names.",
                "enum": ["option", "event", "method", "renderer", "localization"],
                "type": "string"
              },
              "major": {
                "description": "Major version (e.g., 5, 6)",
                "type": "number"
              },
              "names": {
                "description": "Detail tier: entity names (as shown in the index) to return in full. Omit on the first call to get the compact index; then call again with the handful of names you need. Names not found are reported in query.notFound.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["component", "framework", "major"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Component API Schema"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:2f350942515b00bfe6ebfaee0bb65a9c6a9a84a23927b26e5d0307aa2613f9f3"
        },
        {
          "name": "getConnectEndpointSchema",
          "title": "Get Connect Endpoint Schema",
          "description": "Returns the full schema of a single Connect REST endpoint: method, path, parameters (query/body/header) with types, authentication, response statuses and bodies, response headers, per-provider behavior, notes, and examples. Resolve by endpointId (from listConnectEndpoints) or by method + path (a full URL or a path with /api works too; a path alone that matches several methods returns the candidates). Describes the endpoint from documentation; does not call it. Documents the Mobiscroll Connect REST API: https://mobiscroll.com/docs/connect/api/overview",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "endpointId": {
                "description": "Endpoint id from listConnectEndpoints, e.g. \"get-events\".",
                "type": "string"
              },
              "method": {
                "description": "HTTP method, e.g. \"GET\". Use with path if endpointId is unknown.",
                "type": "string"
              },
              "path": {
                "description": "Endpoint path, e.g. \"/events\" (relative to the API base; \"/api/events\" or a full URL also work).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Connect Endpoint Schema"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
