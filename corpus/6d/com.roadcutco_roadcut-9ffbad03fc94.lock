{
  "lockfileVersion": 2,
  "subjects": {
    "com.roadcutco/roadcut": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://roadcutco.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "roadcut",
        "title": "Roadcut — European road trips",
        "version": "1.2.0",
        "websiteUrl": "https://roadcutco.com/ai/",
        "icons": [
          {
            "src": "https://roadcutco.com/icon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          },
          {
            "src": "https://roadcutco.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://roadcutco.com/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Roadcut publishes checked European road trip itineraries (day-by-day, km, where to sleep), mountain pass seasons, and speed, alcohol and winter driving rules with official sources. `lang` sets the language of the links. `fits_travel_date` says whether the seasonal passes on a trip are usually open on `travel_date` (default today). `open_in_planner` opens the route on an editable map; `full_plan` is the complete itinerary. Pass seasons are records of past years, not live status; `live_status` links to the road operator. `ev_charging` counts charging stations within 1.5 km of the road; its km figures are along the drawn route, from its start.",
      "tools": [
        {
          "name": "find_road_trips",
          "title": "Find road trips",
          "description": "Search Roadcut's European road trip itineraries by country, number of days or keywords (e.g. \"fjords\", \"Alps\", \"coast\", a town). Returns matching trips with days, km and a link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Country name or ISO code, e.g. \"Norway\" or \"NO\".",
                "type": "string"
              },
              "lang": {
                "description": "Language of the user, for the links (en, de, es, fr, it, cs, da, sv, nb, pl, nl). Default en.",
                "enum": ["en", "de", "es", "fr", "it", "cs", "da", "sv", "nb", "pl", "nl"],
                "type": "string"
              },
              "limit": {
                "description": "Default 8.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "max_days": {
                "description": "Longest trip wanted, in days.",
                "minimum": 1,
                "type": "integer"
              },
              "min_days": {
                "description": "Shortest trip wanted, in days.",
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text keywords: a place, region, landscape or theme.",
                "type": "string"
              },
              "travel_date": {
                "description": "When the user will drive (YYYY-MM-DD), to check seasonal passes. Default today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find road trips"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dd44642cfef14933722f72f454a0a6f31cc436bafc749fe4aac0e7b52a5c36bf"
        },
        {
          "name": "get_driving_rules",
          "title": "Driving rules in a country",
          "description": "Speed limits, drink-driving limit and winter tyre, stud and chain rules for a European country, each with the official sources and the date Roadcut last checked them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Country name or ISO code, e.g. \"Austria\" or \"AT\".",
                "type": "string"
              },
              "lang": {
                "description": "Language of the user, for the links (en, de, es, fr, it, cs, da, sv, nb, pl, nl). Default en.",
                "enum": ["en", "de", "es", "fr", "it", "cs", "da", "sv", "nb", "pl", "nl"],
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Driving rules in a country"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f31cc3ea4944b849e602ba4a0a8a1029f916bb1dae93fea5b1eb25c94aadcb4d"
        },
        {
          "name": "get_mountain_pass",
          "title": "Mountain pass season",
          "description": "When a European mountain pass (Alps, Norway, Carpathians…) usually opens and closes, whether it opened this year, night closures, and where the road operator publishes live status. Search by pass name or country; with neither, every pass Roadcut tracks is listed. Seasons are records of past years, not live status; each result links to the operator's live status.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Country name or ISO code.",
                "type": "string"
              },
              "lang": {
                "description": "Language of the user, for the links (en, de, es, fr, it, cs, da, sv, nb, pl, nl). Default en.",
                "enum": ["en", "de", "es", "fr", "it", "cs", "da", "sv", "nb", "pl", "nl"],
                "type": "string"
              },
              "name": {
                "description": "Pass name or part of it, e.g. \"Trollstigen\", \"Stelvio\".",
                "type": "string"
              },
              "travel_date": {
                "description": "When the user will drive (YYYY-MM-DD), to check seasonal passes. Default today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Mountain pass season"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:30e05ffbbf058268a9030139a8d55a01acf46167f80f79e85dd4b62f28b17b4f"
        },
        {
          "name": "get_road_trip",
          "title": "Get a road trip overview",
          "description": "Day-by-day overview of one Roadcut road trip: from, to, km and where to sleep each day, highlights, ferries, seasonal mountain passes on the way, a cost estimate, EV charging along the road (stations, fast chargers, longest stretch without one), and links to the full plan and the interactive planner. A trip is identified by its slug.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language of the user, for the links (en, de, es, fr, it, cs, da, sv, nb, pl, nl). Default en.",
                "enum": ["en", "de", "es", "fr", "it", "cs", "da", "sv", "nb", "pl", "nl"],
                "type": "string"
              },
              "slug": {
                "description": "Route id, e.g. \"bergen-to-geiranger\".",
                "type": "string"
              },
              "travel_date": {
                "description": "When the user will drive (YYYY-MM-DD), to check seasonal passes. Default today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a road trip overview"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c56b339f707c36c975424b7de496132124b31fccced39190ec96233d6b8db9ac"
        }
      ],
      "digest": "sha256:8702c777f461eb74dca538387b10c6c84802f443a4b2e091b9ad2535a4877baf"
    }
  }
