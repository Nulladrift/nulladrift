      },
      "instructions": "Vérification de données B2B françaises sur référentiels souverains (SIRENE, BODACC, INPI, RNE, INSEE décès), hébergés en France par Dataroia. Outils gratuits : verifier_siret, diagnostiquer_echantillon, resoudre_siren. Outils avec clé API (https://dataroia.com, clé gratuite disponible) : sante_entreprise, dirigeants_entreprise, croiser_deces, surveillance_portefeuille et surveillance_alertes (le delta : abonner ses SIREN, ne lire que ce qui a changé).",
      "tools": [
        {
          "name": "croiser_deces",
          "description": "Croise une liste de contacts avec le registre INSEE des décès.\n    Chaque personne : {\"nom\": str, \"prenom\": str, \"annee_naissance\": int?,\n    \"date_naissance\": \"YYYY-MM-DD\"?, \"code_postal\": str?, \"ref\": str?}.\n    Résultat prudent : les correspondances non certaines sont marquées\n    « à vérifier (homonyme) ». Accessible dès le plan gratuit, dans la limite\n    de son quota.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "title": "Api Key",
                "type": "string"
              },
              "personnes": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "title": "Personnes",
                "type": "array"
              }
            },
            "required": ["api_key", "personnes"],
            "title": "croiser_decesArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Croiser des contacts avec le registre INSEE décès"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:27936480f1e9e6e96d1e6a007a96d76864613efc1ec2c3c3a65903e518e5e00f"
        },
        {
          "name": "diagnostiquer_echantillon",
          "description": "Diagnostic qualité gratuit d'un extrait de fichier CRM/client au format\n    CSV (max 100 lignes, en-tête inclus) : emails et téléphones invalides,\n    SIREN/SIRET à clé fausse, doublons, cellules vides, identifiants détruits\n    par Excel. Aucun envoi à un tiers, aucun stockage. Pour le diagnostic\n    complet gratuit (1000 lignes, croisement SIRENE/BODACC/décès + manque à\n    gagner chiffré) : https://dataroia.com",
          "inputSchema": {
            "properties": {
              "csv_texte": {
                "title": "Csv Texte",
                "type": "string"
              }
            },
            "required": ["csv_texte"],
            "title": "diagnostiquer_echantillonArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Diagnostiquer un échantillon CRM (CSV)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:71cf52d60838f2c157e33a9256706c2d4b9870d7e612cd3fdcb956d69af23adb"
        },
        {
          "name": "dirigeants_entreprise",
          "description": "Dirigeants actifs au RNE (INPI) pour une liste de SIREN, croisés avec\n    le registre INSEE décès (statut vital + score). Clé API requise — le plan\n    gratuit y a accès (1 SIREN par appel).",
          "inputSchema": {
            "properties": {
              "api_key": {
                "title": "Api Key",
                "type": "string"
              },
              "sirens": {
                "items": {
                  "type": "string"
                },
                "title": "Sirens",
                "type": "array"
              }
            },
            "required": ["api_key", "sirens"],
            "title": "dirigeants_entrepriseArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Dirigeants RNE croisés registre décès"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f1e56223ce363e3135152fbd283e0660d1ce88a0827938ca76c690bd79c17579"
        },
        {
          "name": "resoudre_siren",
          "description": "Retrouve le SIREN d'entreprises françaises à partir de leur nom, tel\n    qu'écrit dans un CRM (formes juridiques et accents ignorés). Fournir le\n    code postal quand il est connu : il départage les homonymes. Jusqu'à 10\n    entreprises par appel : {\"nom\": str, \"code_postal\": str?, \"ref\": str?}.\n    Réponse par entreprise : siren, denomination officielle, statut, score et\n    fiabilite (sur | probable | ambigu | non_trouve) + candidats alternatifs.\n    Ne jamais écrire un SIREN \"ambigu\" dans un CRM sans validation humaine.\n    Gratuit, sans clé API.",
          "inputSchema": {
            "properties": {
              "entreprises": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "title": "Entreprises",
                "type": "array"
              }
            },
            "required": ["entreprises"],
            "title": "resoudre_sirenArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Résoudre des noms d'entreprise en SIREN"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a9703a1dcb2215dfe3b92a682d1569b6cd9c09184b8fcc7604fecae89e27864f"
        },
        {
          "name": "sante_entreprise",
          "description": "Score santé consolidé (0-100, label A-D) par SIREN : statut SIRENE,\n    procédures BODACC, comptes annuels INPI, benchmark Banque de France,\n    dirigeants RNE croisés avec le registre INSEE décès. Clé API requise —\n    le plan gratuit y a accès (5 SIREN par appel).",
          "inputSchema": {
            "properties": {
              "api_key": {
                "title": "Api Key",
                "type": "string"
              },
              "sirens": {
                "items": {
                  "type": "string"
                },
                "title": "Sirens",
                "type": "array"
              }
            },
            "required": ["api_key", "sirens"],
            "title": "sante_entrepriseArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Score santé d'entreprise (0-100)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0c43bd3f5b2988cb619b2cf196f74bd7528a5eb18313e36da73a26d9d09fe6d2"
        },
        {
          "name": "surveillance_alertes",
          "description": "Alertes détectées sur le portefeuille surveillé : cessation SIRENE,\n    nouvelle procédure collective BODACC, changement ou décès de dirigeant.\n    C'est l'outil « quoi de neuf depuis mon dernier passage » — inutile de\n    re-vérifier les SIREN un par un. marquer_lues=true acquitte les alertes\n    retournées (le prochain appel ne rendra que les nouveautés).\n    Clé API requise.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "title": "Api Key",
                "type": "string"
              },
              "marquer_lues": {
                "default": false,
                "title": "Marquer Lues",
                "type": "boolean"
              },
              "non_lues_seulement": {
                "default": true,
                "title": "Non Lues Seulement",
                "type": "boolean"
              }
            },
            "required": ["api_key"],
            "title": "surveillance_alertesArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Alertes du portefeuille surveillé (quoi de neuf)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:ac5766bc3b7f02d95c434ce20e1af902d2aa3ebcbab79e231245e937b1ffc5a1"
        },
        {
          "name": "surveillance_portefeuille",
          "description": "Gère le portefeuille de SIREN surveillés par Dataroia (cessations,\n    procédures collectives BODACC, changements et décès de dirigeants).\n    action : \"lister\" | \"ajouter\" | \"retirer\" — sirens requis sauf lister.\n    Le premier passage sur un SIREN établit une référence silencieuse ; les\n    changements suivants deviennent des alertes (voir surveillance_alertes).\n    Clé API requise ; la limite est la taille du portefeuille par plan\n    (free 10, solo 50, starter 100, business 1000), pas un compteur d'appels.",
          "inputSchema": {
            "properties": {
              "action": {
                "title": "Action",
                "type": "string"
              },
              "api_key": {
                "title": "Api Key",
                "type": "string"
              },
              "sirens": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Sirens"
              }
            },
            "required": ["action", "api_key"],
            "title": "surveillance_portefeuilleArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Gérer le portefeuille surveillé (ajouter/retirer/lister)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:7e1bc132d371372422a82c4341ed57404788b03d496c3c146bac3d14f421593f"
        },
        {
          "name": "verifier_siret",
          "description": "Vérifie jusqu'à 10 SIRET (14 chiffres) sur la base SIRENE INSEE locale :\n    existence, établissement fermé, unité légale cessée, procédure collective\n    BODACC. Si l'établissement est fermé, indique le SIRET successeur quand un\n    lien de succession SIRENE existe. Gratuit, sans clé API.",
          "inputSchema": {
            "properties": {
              "sirets": {
                "items": {
                  "type": "string"
                },
                "title": "Sirets",
                "type": "array"
              }
            },
            "required": ["sirets"],
            "title": "verifier_siretArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Vérifier des SIRET (SIRENE, BODACC, successions)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0d101734762233f66690306b5cad6074a57d710a85681a403615551b9915aafb"
        }
      ],
