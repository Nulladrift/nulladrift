              },
              "truvon_id": {
                "description": "Its Truvon ID (biz_…)",
                "type": "string"
              },
              "url": {
                "description": "With format markdown: the address of this record in Markdown",
                "type": "string"
              },
              "website": {
                "description": "With format json: its own website",
                "type": ["string", "null"]
              }
            },
            "required": ["name", "truvon_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a business record"
