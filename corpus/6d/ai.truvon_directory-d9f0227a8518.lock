        {
          "name": "find_local_businesses",
          "title": "Find local businesses",
          "description": "Find local businesses that fit a need near a place. Give the service in a few plain words (\"furnace repair\", \"water heater leak\"), not the user's sentence; timing goes in open_at. Each result says why it fits, how it meets each requirement you stated (yes, no or needs confirmation, with its source), its hours and whether it is open now, whether it is still in business, the phone, and how to act. 5 results by default; limit asks for more, and max_minutes keeps them close. Truvon has no reviews or ratings, and menus, prices and service details only where a business publishes them.",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "Only businesses that offer this: book, order, quote, call or message (comma means any)",
                "type": "string"
              },
              "completable": {
                "description": "Only businesses an agent can complete the action with itself: a Truvon door, a door or endpoint a platform runs for the business (Shopify's for a store; the platform vouches for it, so no claim is needed), or the business's own MCP server, API or commerce endpoint once it has claimed its listing (all treated the same); the rest are removed and counted",
                "type": "boolean"
              },
              "detail": {
                "description": "compact (default) or full records",
                "enum": ["compact", "full"],
                "type": "string"
              },
              "include_closed": {
                "description": "Also list businesses likely closed or closed (left out by default; open on each result says why)",
                "type": "boolean"
              },
              "lat": {
                "description": "The user's latitude in decimal degrees, with lon: the most exact place to measure distance from",
                "type": "number"
              },
              "limit": {
                "description": "How many results (default 5)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "description": "The user's longitude in decimal degrees, with lat",
                "type": "number"
              },
              "max_miles": {
                "description": "Only businesses within this many miles of the place (businesses that serve online always pass)",
                "type": "number"
              },
              "max_minutes": {
                "description": "Only businesses within this many minutes of estimated driving (a routing service where one is configured, else a straight line at road speeds), counted only where someone must be physically present; online and remote service always passes. A business across water, on land no road reaches from the place (an island reached by ferry), has no drive time: it is listed after those within the limit, with across_water saying which ferry",
                "type": "number"
              },
              "model": {
                "description": "Optional: the model you run on (for example claude-sonnet-5-5), kept with the provenance of this call. Leave it out if you do not know.",
                "type": "string"
              },
              "need": {
                "description": "The service in a few plain words: \"furnace repair\", \"water heater leak\", \"bbq catering for 12\". Not the user's whole sentence: matching is by meaning and exact words, so symptoms and timing hide the service. Timing goes in open_at, requirements in the filters",
                "type": "string"
              },
              "open_at": {
                "description": "Open at a specific day and time in the business's local time, e.g. \"sat 18:00\"; or \"now\", \"today\", \"tonight\", \"tomorrow\", \"tomorrow 9am\"; or an ISO 8601 date and time, e.g. \"2026-11-08T18:00\" (the business's local time unless it carries an offset or Z). For a range like \"this week\", leave it out and judge from the hours shown",
                "type": "string"
              },
              "place": {
                "description": "Where the user is, always with its state: \"Town, ST\" (e.g. \"Springfield, IL\") or \"Neighborhood, Town, ST\" (e.g. \"Castro, San Francisco, CA\"); \"City, CC-RR\" with an ISO 3166-2 region outside the US. A place without a state is refused, with the towns it could be. Or send zip, or lat and lon, instead",
                "type": "string"
              },
              "prices": {
                "description": "Only businesses that state prices",
                "type": "boolean"
              },
              "refines": {
                "description": "The search_id of an earlier search this one narrows (one choice of an \"A or B\", a more specific wording, an added requirement). Links the two so we learn what the first answer lacked",
                "type": "string"
              },
              "zip": {
                "description": "The user's 5-digit ZIP code, instead of place",
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "follow_ups_due": {
                "description": "Earlier outcomes due a follow-up with your user",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "measured_from": {
                "description": "The point distances are measured from, and how it was found",
                "type": ["object", "null"]
              },
              "next_cursor": {
                "description": "The cursor for the next page (more_results); none on the last page",
                "type": ["string", "null"]
              },
              "possible": {
                "description": "Businesses that may fit, as the text lists them under Possible",
                "items": {
                  "properties": {
                    "name": {
                      "description": "The business's name",
                      "type": ["string", "null"]
                    },
                    "truvon_id": {
                      "description": "Its Truvon ID (biz_…), the business argument of get_business_record and report_outcome",
                      "type": "string"
                    }
                  },
                  "required": ["name", "truvon_id"],
                  "type": "object"
                },
                "type": "array"
              },
              "query": {
                "description": "The need as read: what it matched on and the kind of business it calls for",
                "type": "object"
              },
              "results": {
                "description": "The businesses that fit, best first, as the text lists them",
                "items": {
                  "properties": {
                    "name": {
                      "description": "The business's name",
                      "type": ["string", "null"]
                    },
                    "truvon_id": {
                      "description": "Its Truvon ID (biz_…), the business argument of get_business_record and report_outcome",
                      "type": "string"
                    }
                  },
                  "required": ["name", "truvon_id"],
                  "type": "object"
                },
                "type": "array"
              },
              "search_id": {
                "description": "This search (srch_…), for report_outcome, show_results and refines",
                "type": "string"
              },
              "showing": {
                "description": "What the results are, in one line",
                "type": "string"
              }
            },
            "required": ["results", "search_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find local businesses"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Searched Truvon",
            "openai/toolInvocation/invoking": "Searching Truvon",
            "ui": {
              "resourceUri": "ui://truvon/results"
            },
            "ui/resourceUri": "ui://truvon/results"
          },
          "digest": "sha256:e71c3aaccdf2bc5d32f459c80322768095046a62d21c5270376f1985206bcd1a"
        },
        {
          "name": "get_business_record",
          "title": "Get a business record",
          "description": "Get one business's full record by its truvon_id or website domain: each fact with its source and date, every source's value where they disagree, prices, offers, hours and every way to act. Open it for a finalist, and whenever a phone or address matters. A business Truvon does not list has no record.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "The business's website domain, or its truvon_id (biz_…) from a result; the id is exact when a domain is listed in several markets. Never a name: check_places_results looks a business up by its name and town",
                "type": "string"
              },
              "format": {
                "default": "markdown",
                "description": "The form of the record: markdown (the default, as text) or json (the same record as structured data)",
                "enum": ["markdown", "json"],
                "type": "string"
              },
              "search_id": {
                "description": "The search_id this listing came from, if any",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
