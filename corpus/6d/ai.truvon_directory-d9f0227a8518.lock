        {
          "name": "get_job",
          "title": "Get a job's status",
          "description": "Get the status of a job you arranged and the business's updates, by the job id report_outcome returned, when your user asks about it.",
          "inputSchema": {
            "properties": {
              "connection": {
                "description": "The connection code connect_truvon gave you, once your user approved its link. Not needed when your app signed in to Truvon itself.",
                "type": "string"
              },
              "job": {
                "description": "The job_id, job_…",
                "type": "string"
              }
            },
            "required": ["job"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "business": {
                "description": "The business doing it",
                "type": ["string", "null"]
              },
              "history": {
                "description": "The business's updates, oldest first",
                "items": {
                  "type": "object"
                },
                "type": "array"
