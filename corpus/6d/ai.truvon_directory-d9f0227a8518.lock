              },
              "facts": {
                "description": "With format json: each fact with its source, date and confidence",
                "type": "object"
              },
              "links": {
                "description": "With format json: the addresses of this record, its grade and its field history",
                "type": "object"
              },
              "name": {
                "description": "The business's name",
