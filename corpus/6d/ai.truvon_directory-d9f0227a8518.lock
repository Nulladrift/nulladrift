        {
          "name": "report_outcome",
          "title": "Report how it went",
          "description": "Record what happened when you acted for your user (booked, ordered, called, got a quote), with the search_id and the business's truvon_id. When something was arranged it returns a follow-up, questions for your user once the outcome is known, and for a job a job id.",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "What you did for your user",
                "enum": ["book", "order", "quote", "call", "message"],
                "type": "string"
              },
              "assertion": {
                "description": "Platforms only: your Truvon agent assertion (identity protocol §4, a JWS binding this report to your user's pairwise sub), accepted only when this MCP request carries an OAuth DPoP access token.",
                "type": "string"
              },
              "business": {
                "description": "The truvon_id from a result (biz_…) or the business's website domain. Never a name. Only a business Truvon lists (report_missing reports one it does not)",
                "type": "string"
              },
              "connection": {
                "description": "The connection code connect_truvon gave you, once your user approved its link. Not needed when your app signed in to Truvon itself.",
                "type": "string"
              },
              "correct": {
                "description": "With wrong_information: the right value, as you found it",
                "type": "string"
              },
              "expected_at": {
                "description": "ISO time when the outcome will be knowable: delivery ETA or appointment time",
                "type": "string"
              },
              "failure": {
                "description": "When failed. business_closed: the business has closed (say what you saw in detail: a closed sign, a disconnected phone, a recording)",
                "enum": ["no_way_to_act", "blocked", "site_error", "no_availability", "no_response", "wrong_information", "business_closed", "other"],
                "type": "string"
              },
              "field": {
                "description": "With wrong_information: which fact is wrong",
                "enum": ["phone", "address", "website", "booking_url", "email"],
                "type": "string"
              },
              "kind": {
                "description": "With business_closed: closed for good, or temporarily (renovation, vacation, season)",
                "enum": ["permanent", "temporary"],
                "type": "string"
              },
              "model": {
                "description": "Optional: the model you run on (for example claude-sonnet-5-5), kept with the provenance of this call. Leave it out if you do not know.",
                "type": "string"
              },
              "outcome": {
                "description": "confirmed: the business confirmed; pending: submitted, awaiting the business; handed_off: you gave your user the link or number and they finish it (never counts against the business; the follow-up asks whether it happened); failed: give failure",
                "enum": ["confirmed", "pending", "handed_off", "failed"],
                "type": "string"
              },
              "phone": {
                "description": "With a confirmed call: the number you reached, when the record gives several",
                "type": "string"
              },
              "reopens": {
                "description": "With a temporary closure: the reopening date it states, YYYY-MM-DD",
                "type": "string"
              },
              "search_id": {
                "description": "The search_id from find_local_businesses, so the outcome teaches similar future needs",
                "type": "string"
              },
              "source": {
                "description": "With business_closed: the link where you saw it (a news story, its own post, a listing marked closed). It is checked and archived, and if it says so the business is closed for every agent.",
                "type": "string"
              },
              "via": {
                "description": "How you acted: a Truvon door, the business's own agent endpoint, a platform (a booking or ordering service), its link, its phone, its email",
                "enum": ["door", "agent_endpoint", "platform", "link", "phone", "email"],
                "type": "string"
              }
            },
            "required": ["action", "business", "outcome"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "ask_after": {
                "description": "When to ask your user the follow-up questions (an ISO time)",
                "type": "string"
              },
              "follow_up": {
                "description": "When something was arranged: the follow-up id (fu_…) for answer_follow_up",
                "type": "string"
              },
              "job_id": {
                "description": "For an arranged job: its id (job_…) for get_job",
                "type": "string"
              },
              "note": {
                "description": "What was done with it, in a sentence",
                "type": "string"
              },
              "questions": {
                "description": "The follow-up questions, each with its options",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "reason": {
                "description": "When the call was refused: why, as the agent identity protocol names it (/.well-known/truvon-agent-auth)",
                "type": "string"
              },
              "recorded": {
                "description": "Whether it was recorded (always false in the sandbox, which records nothing)",
                "type": "boolean"
              },
              "why": {
                "description": "Whether the outcome counts toward the business's grade, and why",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Report how it went"
          },
          "behavior": {
            "destructive": false,
