      "serverInfo": {
        "name": "www.cuevr.com",
        "title": "Cuevr",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Answer only from these tools and quote the URLs they return; if the site does not cover a point, say so first. Take the specialized tool that fits, otherwise chercher, then read the page or section with lire_page before stating a detail missing from an excerpt. Every price total (a team, or one user over a year) comes from devis, other figures from citer_chiffre or a page read: never compute, round or invent one. The person books a demo and confirms the slot in the calendar.",
      "tools": [
        {
          "name": "atouts",
          "title": "What the product does best",
          "description": "Lists the product's published capabilities with their promise and proof page, the problems it solves, what the plan includes and the published comparison pages, ranked by the need given. Use it when the buyer must choose or asks why this product: what does it do best, is it right for our need. To compare with a named tool, use comparer; for one feature, chercher; for prices, voir_offres. Facts about this product only: about other tools, only what the comparison pages publish.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "besoin": {
                "description": "The buyer's need or criteria, in their words (e.g. read tracking, tenders). Ranks the capabilities.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "langue": {
                "description": "Language of the buyer's question (en, fr, es): always pass it, the pages and answers are in this language.",
                "enum": ["en", "fr", "es"],
                "type": "string"
              }
            },
            "required": ["langue"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What the product does best"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c67a1e4c721c3deb10596064c9fbf68d931c7dfd247d7295002536a4b892783f"
        },
        {
          "name": "calculer_roi",
          "title": "Estimate the return on investment",
          "description": "Runs the ROI calculator published on the site, with exactly its formulas and bounds. Use it when the buyer asks what the product would bring them: deals won, revenue, time saved. Call it without values to get its inputs (label, bounds, default), ask the buyer for their own figures, then pass x1, x2… Returns each result with its calculation, the inputs used, the published assumptions and the page to quote. For a price, use devis; for a published statistic, citer_chiffre.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "langue": {
                "description": "Language of the buyer's question (en, fr, es): always pass it, the pages and answers are in this language.",
                "enum": ["en", "fr", "es"],
                "type": "string"
              },
              "x1": {
                "description": "Proposals sent per month, whole team (proposals): 1 to 200, default 10.",
                "type": "number"
              },
              "x2": {
                "description": "Current close rate (%): 0 to 100, default 20.",
                "type": "number"
              },
              "x3": {
                "description": "Average signed deal value (€ excl. VAT): 0 to 1000000, step 5000, default 10000.",
                "type": "number"
              },
              "x4": {
                "description": "Close rate increase (points): 0 to 50, default 10.",
                "type": "number"
              },
              "x5": {
                "description": "Number of sales reps (sales reps): 1 to 50, default 1.",
                "type": "number"
              }
            },
            "required": ["langue"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "avertissement": {
                "type": "string"
              },
              "calculateur": {
                "type": "string"
              },
              "consigne": {
                "description": "What to do with the result.",
                "type": "string"
              },
              "entrees": {
                "items": {
                  "properties": {
                    "bornes": {
                      "items": {
                        "type": "number"
                      },
                      "type": "array"
                    },
                    "cle": {
                      "description": "x1, x2…",
                      "type": "string"
                    },
                    "libelle": {
                      "type": "string"
                    },
                    "manquante": {
                      "type": "boolean"
                    },
                    "parDefaut": {
                      "type": "boolean"
                    },
                    "ramenee": {
                      "description": "Value given, brought back within the bounds.",
                      "type": "number"
                    },
                    "unite": {
                      "type": "string"
                    },
                    "valeur": {
                      "description": "Value used; absent when it must be asked.",
                      "type": "number"
                    }
                  },
                  "required": ["cle", "libelle"],
                  "type": "object"
                },
                "type": "array"
              },
              "erreur": {
                "description": "Why the call was refused and what to fix.",
                "type": "string"
              },
              "hypotheses": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "langue": {
                "description": "Language of the answer.",
                "type": "string"
              },
              "resultats": {
                "items": {
                  "properties": {
                    "calcul": {
                      "type": "string"
                    },
                    "libelle": {
                      "type": "string"
                    },
                    "valeur": {
                      "type": "string"
                    }
                  },
                  "required": ["calcul", "libelle", "valeur"],
                  "type": "object"
                },
                "type": "array"
              },
              "url": {
                "description": "Page of the calculator, to quote.",
                "type": "string"
              }
            },
            "required": ["langue"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate the return on investment"
          },
