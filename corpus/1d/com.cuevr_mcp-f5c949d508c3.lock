        },
        {
          "name": "chercher",
          "title": "Search the site",
          "description": "Searches the site's pages and returns the passages that answer, each with its URL and section anchor, and a confidence. Use it for facts about the product: can it do X, a feature, integrations, security, GDPR, a sector. Steps in the app: comment_faire; prices: voir_offres or devis; comparison: comparer. Returns excerpts: read the page with lire_page before stating a detail they lack. Confidence moyenne or faible: first say what the site does not cover, then give the closest page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "langue": {
                "description": "Language of the buyer's question (en, fr, es): always pass it, the pages and answers are in this language.",
                "enum": ["en", "fr", "es"],
                "type": "string"
              },
              "limite": {
                "description": "Maximum number of passages (1 to 10, default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "requete": {
                "description": "The buyer's question or its key words, in the language of the answer.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["langue", "requete"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the site"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cb2fe26d82fd96bbb2f3a22ac0707c1fef728fc93e8a380dc55801de3a8300e4"
        },
        {
          "name": "citer_chiffre",
          "title": "Quote a sourced figure",
          "description": "Returns the figures published on the site (statistics, results, market data) with their value, label, source URL, date and the page that publishes them. Use it before quoting any figure that is not a price. Quote the figure exactly as returned, with its source and date; never round or extrapolate it. For prices use voir_offres or devis; for an estimate for the buyer, calculer_roi. Returns only published figures: when none matches, give no figure.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "langue": {
                "description": "Language of the buyer's question (en, fr, es): always pass it, the pages and answers are in this language.",
                "enum": ["en", "fr", "es"],
                "type": "string"
              },
              "requete": {
                "description": "Words to look for in the figure or its label. Without it, all figures.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["langue"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "chiffres": {
                "items": {
                  "properties": {
                    "date": {
                      "type": "string"
                    },
                    "detail": {
                      "type": "string"
                    },
                    "fiche": {
                      "type": "string"
                    },
                    "libelle": {
                      "type": "string"
                    },
                    "page": {
                      "description": "Page of the site that publishes it.",
                      "type": "string"
                    },
                    "source": {
                      "properties": {
                        "nom": {
                          "type": "string"
                        },
                        "url": {
                          "type": "string"
                        }
                      },
                      "required": ["url"],
                      "type": "object"
                    },
                    "valeur": {
                      "description": "The figure, to quote exactly.",
                      "type": "string"
                    }
                  },
                  "required": ["date", "libelle", "source", "valeur"],
                  "type": "object"
                },
                "type": "array"
              },
              "consigne": {
                "description": "What to do with the result.",
                "type": "string"
              },
              "erreur": {
                "description": "Why the call was refused and what to fix.",
                "type": "string"
              },
              "langue": {
                "description": "Language of the answer.",
                "type": "string"
              }
            },
            "required": ["langue"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Quote a sourced figure"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
