        {
          "name": "comment_faire",
          "title": "How to do it in the product",
          "description": "Returns the steps from the user documentation for a task in the app, with the app labels as written and the URL of the section to quote. Use it when the buyer asks how to do something in the product: how do I invite a colleague, where do I see why a prospect declined, how do I export a PDF, how do I create an API key. To know whether the product can do something, or what a feature brings, use chercher. Covers the documentation only: no prices, no comparisons.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "langue": {
                "description": "Language of the buyer's question (en, fr, es): always pass it, the pages and answers are in this language.",
                "enum": ["en", "fr", "es"],
                "type": "string"
              },
              "question": {
                "description": "What the person wants to do, in their words (e.g. share a proposal with a decision-maker).",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["langue", "question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How to do it in the product"
          },
          "behavior": {
            "destructive": false,
