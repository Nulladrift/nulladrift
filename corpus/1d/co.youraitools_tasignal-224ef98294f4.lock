      "serverInfo": {
        "name": "tasignal",
        "title": "TASignal",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Call ta_bias with an asset ticker (BTC, ETH, SOL...) and optional timeframe for the technical bias, trend and regime. Indicator values, risk/position sizing and backtests are on the paid x402 routes. Not financial advice.",
      "tools": [
        {
          "name": "ta_bias",
          "title": "Technical bias, trend and regime (free preview)",
          "description": "Descriptive technical read for a crypto asset on closed 15m/1h/4h/1d candles: bias (strong bearish ... strong bullish), trend (up/down/mixed) and regime (trending/ranging) from RSI, MACD, EMA 20/50/200, Bollinger and ADX. Free preview tier. The paid x402 routes add every indicator value and the bias components (/v1/lite), VaR/CVaR, drawdowns and ATR position sizing (/v1/risk) and rule backtests (/v1/backtest). Read-only analytics; not financial advice.",
          "inputSchema": {
            "properties": {
              "symbol": {
                "description": "Base asset ticker, e.g. BTC, ETH, SOL, HYPE (BTC-PERP, ETH-USD and SOLUSDT are accepted too)",
                "type": "string"
              },
              "timeframe": {
                "description": "Candle timeframe: 15m, 1h, 4h or 1d (default 1h; risk default 4h)",
                "enum": ["15m", "1h", "4h", "1d"],
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6450fa1cb6c53503d909e0a1445211ddc40e51f741d9d27fed17dd9fdd2e575d"
        }
      ],
