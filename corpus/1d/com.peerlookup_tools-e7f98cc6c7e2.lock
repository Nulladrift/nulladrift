{
  "lockfileVersion": 2,
  "subjects": {
    "com.peerlookup/tools": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://tools.peerlookup.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "com.peerlookup/tools",
        "title": "Peer Lookup Tools",
        "version": "0.2.2-l2.2"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Peer Lookup Tools. Bounded tools: lab_ping, lab_time, lab_hash, lab_directory.",
      "tools": [
        {
          "name": "lab_codec",
          "description": "Encode/decode base64, base64url, or hex. Max 4096 bytes. Decode returns UTF-8 text only. Same as POST /api/v1/codec.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "data": {
                "type": "string"
              },
              "encoding": {
                "enum": ["base64", "base64url", "hex"],
                "type": "string"
              },
              "op": {
                "enum": ["encode", "decode"],
                "type": "string"
              }
            },
            "required": ["data", "encoding", "op"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:828a745db96662bee63e7c7406cbb9f7ffff2739f14d0760ebf4401cb14a24ac"
        },
        {
          "name": "lab_directory",
          "description": "Static curated directory of agent doors (Peer Lookup + boards/catalogs). Same data as GET /api/v1/directory. Optional kind filter.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Optional filter by entry kind",
                "enum": ["help_board", "catalog", "utility", "docs", "other"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dc50ad225639f49ba623933a329ebeef95f4c2c7c52bf36f1059893cd459a202"
        },
        {
          "name": "lab_hash",
          "description": "SHA-256 of a UTF-8 string. Max 4096 bytes after encoding. Body is not stored (same as POST /api/v1/hash).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "data": {
                "description": "UTF-8 text to hash (≤ 4096 encoded bytes)",
                "type": "string"
              }
            },
            "required": ["data"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f0f792623dd0f62fcab78687918ad692fdcf04e029ff958f02ad2517ba17af8d"
        },
        {
          "name": "lab_json",
          "description": "Validate, pretty-print, or canonicalize JSON text (data must be a string). Max 8192 bytes. Same as POST /api/v1/json.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "data": {
                "description": "JSON text as a string",
                "type": "string"
              },
              "op": {
                "enum": ["validate", "pretty", "canonicalize"],
                "type": "string"
              }
            },
            "required": ["data", "op"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:da92288a2679067f73e5977b5bbd9855361a22546fb565f252ad467a5fb3a11c"
        },
        {
          "name": "lab_ping",
          "description": "Liveness check (same as GET /api/v1/ping).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fe0f8b9f8a8207ceb68a2ebe0b93d975682e9526d9bcb9272f33d1f9bfab5e63"
        },
        {
          "name": "lab_time",
          "description": "Current UTC time from the Worker clock (same as GET /api/v1/time). No external time API.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4156709838fd4bbd086a0610fe1d2ccef9c543b2ef03ccc47e82e8ed7472960c"
        },
        {
          "name": "lab_uuid",
          "description": "Generate (default v7) or validate UUIDs. Batch generate up to 20. Same as GET /api/v1/uuid.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "enum": ["generate", "validate"],
                "type": "string"
              },
              "count": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "id": {
                "description": "UUID to validate",
                "type": "string"
              },
              "version": {
                "enum": [4, 7],
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8dc9ff54a26e5ac6f520e2acc64bf4ddb14e7a908fa93c05f8e666864f94b19a"
        },
        {
          "name": "lab_whoami",
          "description": "request_id + day-scoped actor_pseudonym for log correlation. Never returns IP. Same as GET /api/v1/whoami.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:67fbac3b6e7b36812e466f59f49fa1521d9fe3b6efb5cd66ef630dff06c64ce9"
        }
      ],
      "digest": "sha256:796e9c16162e32ca66030f6b6e56b17f8ea43c0728c5fb87a087587069d55d3b"
    }
  }
}
