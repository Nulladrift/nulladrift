  "subjects": {
    "com.agentgroundcrew/field-services": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentgroundcrew.com/mcp"
