          },
          "digest": "sha256:da56caf59332fa2163f4182d6fe5b32c4156daa9313656292c0af93d37be4fd6"
        },
        {
          "name": "prepare_task_credentials",
          "description": "Generate a cryptographically random private token and submission key for ONE new task. Save both securely before submission; this does not create a task. Calling again generates different credentials, not recovery of previous credentials.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ba871d31fcd8f51f8d53ce1964c48cd3cdfb87ccede391d28b414579ca117ea0"
        },
        {
          "name": "send_message",
          "description": "Send a clarification on one task. Reuse the message idempotency key with identical text on retries. Cannot authorize payment or dispatch through text.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "body": {
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "idempotencyKey": {
                "description": "Stable key for one logical operation. Reuse only with identical input on retries.",
                "pattern": "^[a-zA-Z0-9_-]{16,100}$",
                "type": "string"
              },
              "requestToken": {
                "description": "Private task token. Prefer configuring it in the HTTP Authorization Bearer header. Tool arguments may be retained in client conversation history.",
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "taskId": {
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["body", "idempotencyKey", "taskId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:db3c8e0f49bfad2071786db5095861162a6f1b18f4b462ff99f67ce9c40f4030"
        },
        {
          "name": "submit_task",
          "description": "Submit an authorized brief for human review. No charge or booking. Keep one token and idempotency key per task, including across swarm retries.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brief": {
                "additionalProperties": false,
                "properties": {
                  "acceptance": {
                    "maxLength": 2500,
                    "minLength": 10,
                    "type": "string"
                  },
                  "alias": {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  "budgetUsd": {
                    "maximum": 1000000,
                    "minimum": 95,
                    "type": "number"
                  },
                  "email": {
                    "anyOf": [
                      {
                        "const": "",
                        "type": "string"
                      },
                      {
                        "format": "email",
                        "maxLength": 254,
                        "type": "string"
                      }
                    ],
                    "default": ""
                  },
                  "location": {
                    "maxLength": 300,
                    "minLength": 3,
                    "type": "string"
                  },
                  "permission": {
                    "const": true,
                    "type": "boolean"
                  },
                  "scope": {
                    "maxLength": 6000,
                    "minLength": 20,
                    "type": "string"
                  },
                  "service": {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  "terms": {
                    "const": true,
                    "type": "boolean"
                  },
                  "timing": {
                    "maxLength": 200,
                    "minLength": 3,
                    "type": "string"
                  },
                  "website": {
                    "maxLength": 0,
                    "type": "string"
                  }
                },
                "required": ["acceptance", "alias", "budgetUsd", "location", "permission", "scope", "service", "terms", "timing"],
                "type": "object"
              },
              "idempotencyKey": {
                "description": "Stable key for one logical operation. Reuse only with identical input on retries.",
                "pattern": "^[a-zA-Z0-9_-]{16,100}$",
                "type": "string"
              },
              "requestToken": {
                "description": "Private task token. Prefer configuring it in the HTTP Authorization Bearer header. Tool arguments may be retained in client conversation history.",
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              }
            },
            "required": ["brief", "idempotencyKey"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a5fcd8143cbdb65bed4d73b36560899d5ce11100b1122380b69061c408cd14a4"
        }
