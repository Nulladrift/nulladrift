          "digest": "sha256:358d593ded63bee3d6f02cb2d3e6f2425637c07f39cb19e1acd23fbb01fcbc01"
        },
        {
          "name": "list_services",
          "description": "Read field service options and USD starting estimates. Human quoting and scheduling required.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
