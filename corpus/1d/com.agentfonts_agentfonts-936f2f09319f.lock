{
  "lockfileVersion": 2,
  "subjects": {
    "com.agentfonts/agentfonts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentfonts.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "agentfonts",
        "title": "Agentfonts",
        "version": "0.5.0",
        "description": "Find, price and license fonts for agents; pay per licence with x402 (USDC)."
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "buy_license",
          "description": "Buy a font licence. Call without payment to get x402 payment requirements (USDC), then again with the signed payment. Returns the signed licence and a download link per style; web licences also list WOFF2, WOFF and the original file under downloads[].formats. Spends money: confirm price and licensee with the user first.",
          "inputSchema": {
            "properties": {
              "bundle_id": {
                "description": "A family bundle from get_family, e.g. <family_id>.family",
                "type": "string"
              },
              "font_id": {
                "description": "One style. Or use font_ids or bundle_id.",
                "type": "string"
              },
              "font_ids": {
                "description": "Several styles of the same family, priced per style",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "licensee": {
                "description": "The person or organisation the licence is for. Never the agent itself.",
                "properties": {
                  "country": {
                    "description": "ISO 3166-1 alpha-2",
                    "type": "string"
                  },
                  "email": {
                    "description": "Where the licence is sent; the licensee's address, not the agent's",
                    "type": "string"
                  },
                  "name": {
                    "description": "Legal name of the person or organisation",
                    "type": "string"
                  },
                  "org_id": {
                    "description": "VAT or company number",
                    "type": "string"
                  }
                },
                "required": ["email", "name"],
                "type": "object"
              },
              "options": {
                "additionalProperties": {
                  "type": "integer"
                },
                "description": "Licence dimensions, e.g. {\"visitors\": 100000, \"domains\": 2} or {\"cores\": 8, \"years\": 2}. get_family lists them per use.",
                "type": "object"
              },
              "payment": {
                "description": "Base64 x402 payment payload (X-PAYMENT). Omit on the first call to get the payment requirements.",
                "type": "string"
              },
              "tier": {
                "description": "Shorthand for the first dimension of the use (desktop: computers, web: visitors/month, app: apps, ebook: titles, server: cores)",
                "type": "integer"
              },
              "use": {
                "description": "Licence type. A foundry may define its own; get_family lists them",
                "enum": ["desktop", "web", "app", "ebook", "server"],
                "type": "string"
              }
            },
            "required": ["licensee", "use"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Buy font licence"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:139bd6cf1e4c5ec090c3d3c1da1074c6c911559e2f8e0887bf3ef50df8512253"
        },
        {
          "name": "get_family",
          "description": "Use after search_fonts when the user may want more than one style, or to see how a foundry licenses its fonts. Takes a family id or any font id in the family and returns the family name, foundry, every style with its font_id, base price and variable flag, the bundle offers (whole family, variable fonts, collection) with bundle_id and price, and the foundry's licence types with their dimensions and price tiers (e.g. web: visitors and domains; server: cores and years). Use the returned font_ids, bundle_id, use and dimension keys in quote_license and buy_license. Free and read-only.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "A family id, or the id of any font in the family",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Get font family"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:531b3a701d6057bae0ce9b4a2c0add9982ad7f837ad1071ea41639453dd622d6"
        },
        {
          "name": "preview_font",
          "description": "Details for one font: styles, scripts, metrics, missing glyphs for a sample text and a specimen URL. Free.",
          "inputSchema": {
            "properties": {
              "font_id": {
                "description": "Font id from search_fonts, e.g. 'faro-grotesk-bold-1a2b3c'",
                "type": "string"
              },
              "sample": {
                "description": "Text to check glyph coverage for, e.g. the real headline",
                "type": "string"
              }
            },
            "required": ["font_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Preview font"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5734b9df414e6cceeab88b407db8c85e4749bd9fa83a3749a07ab0c9d51cb1bd"
        },
        {
          "name": "quote_license",
          "description": "Price a licence (USD and USDC) and return machine-readable licence terms. Free, nothing is reserved.",
          "inputSchema": {
            "properties": {
              "bundle_id": {
                "description": "A family bundle from get_family, e.g. <family_id>.family",
                "type": "string"
              },
              "font_id": {
                "description": "One style. Or use font_ids or bundle_id.",
                "type": "string"
              },
              "font_ids": {
                "description": "Several styles of the same family, priced per style",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "options": {
                "additionalProperties": {
                  "type": "integer"
                },
                "description": "Licence dimensions, e.g. {\"visitors\": 100000, \"domains\": 2} or {\"cores\": 8, \"years\": 2}. get_family lists them per use.",
                "type": "object"
              },
              "tier": {
                "description": "Shorthand for the first dimension of the use (desktop: computers, web: visitors/month, app: apps, ebook: titles, server: cores)",
                "type": "integer"
              },
              "use": {
                "description": "Licence type. A foundry may define its own; get_family lists them",
                "enum": ["desktop", "web", "app", "ebook", "server"],
                "type": "string"
              }
            },
            "required": ["use"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Quote font licence"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:16487ee361de8a3d47ef183ecda62f3a9c064bfa7e74de6d917162ff5d069f78"
        },
        {
          "name": "search_fonts",
          "description": "Find fonts to license. Use this first when a user needs a typeface for a design, website, app or document. Filter by free text (family, classification such as 'humanist sans' or 'slab serif', tags), required tags, characters the font must support (e.g. 'åäöŊ' or the actual headline), script and maximum price for a licence type. Returns up to `limit` fonts (default 10), each with id, family, foundry, styles, scripts, classification, open-licence flag and from_price_usd for the smallest tier of the chosen use (desktop by default). Free and read-only. Next: preview_font or get_family with a returned id, then quote_license.",
          "inputSchema": {
            "properties": {
              "glyphs": {
                "description": "Characters the font must support, e.g. 'åäöÅÄÖ' or a sample headline",
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of fonts to return; default 10",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price_usd": {
                "description": "Only fonts at or below this price for use/tier",
                "type": "number"
              },
              "query": {
                "description": "Free text over family, classification and tags, e.g. 'condensed headline sans'",
                "type": "string"
              },
              "script": {
                "description": "latin, latin-ext, cyrillic, greek",
                "type": "string"
              },
              "tags": {
                "description": "All must match: headline, body, condensed, newspaper, ui, print…",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "tier": {
                "description": "first licence dimension: desktop computers, web visitors/month, app apps, ebook titles, server cores",
                "type": "integer"
              },
              "use": {
                "description": "Licence type the price filter and from-price apply to; default desktop",
                "enum": ["desktop", "web", "app", "ebook", "server"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Search fonts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f0ed7a61f7cd1c7b3f1594c0c597b15e9733bef7e772ed0f43883216c85cbcfb"
        }
      ],
      "digest": "sha256:0d693fd46277ef07bedeed874a3122e2e5bfda9eda8572f59657ee2f244a9781"
    }
  }
}
