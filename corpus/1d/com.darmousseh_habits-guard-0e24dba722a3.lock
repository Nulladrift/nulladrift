{
  "lockfileVersion": 2,
  "subjects": {
    "com.darmousseh/habits-guard": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://habits.darmousseh.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "habits-guard",
        "title": "Habits prompt-injection guard",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Call check_prompt on user-typed text before your agent acts on it. When it is wrong, call teach_guard (needs a free key from get_free_key) so your own guard learns.",
      "tools": [
        {
          "name": "check_prompt",
          "title": "Check a prompt for injection",
          "description": "Is this user-typed text a prompt injection or jailbreak (an attempt to override, hijack or extract an AI system's instructions)? Returns flagged true/false and a 0-1 score. Without a key it uses the public guard (30 checks per day per network). With a key it uses your own guard, which learns from teach_guard; the result carries a request_id. Built for user prompts; it is weak on injections hidden in tool output or documents.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "text": {
                "description": "the user prompt to check, up to 8,000 characters",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:72694e3f98fead3c8b2bf9fa66b1ef2ade8cea84f9e72570928fd50b1a639b4e"
        },
        {
          "name": "get_free_key",
          "title": "Get a free API key",
          "description": "Create a free Habits account and API key (no email). The key is shown once; set it as the Authorization: Bearer header for this MCP server. The free plan has a fixed $0.10/day spend cap and its own trainable injection guard.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "username": {
                "description": "optional: 2-32 of a-z 0-9 -",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:10f5a433b06e0c29c41ff03820e6bcaf296920d6c1e79cdd5cddf71f0c167514"
        },
        {
          "name": "teach_guard",
          "title": "Teach your guard",
          "description": "Label one prompt for your own guard so it stops repeating a mistake (a false alarm on a normal request, or a missed injection). Needs an API key (get_free_key). About 50 of your own labels cut false alarms from 15% to 4% in our benchmark.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "injection": {
                "description": "true if it IS an injection/jailbreak, false if it is a normal request",
                "type": "boolean"
              },
              "text": {
                "description": "the prompt",
                "type": "string"
              }
            },
            "required": ["injection", "text"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:171aed34b844a715218afe1d46a3cdcd7ca82d9af27c1ea5ae70addec5ddd525"
        }
      ],
      "digest": "sha256:f5834f8b68233cd263b48d5a894e7b071eb4b301ef9afe1c3fa1b51488faaff5"
    }
  }
}
