          },
          "digest": "sha256:386156dd8b245aa289a156dd208bed5816e37513eb792bc421bf8aee2ca5b149"
        },
        {
          "name": "get_platform_video_specs",
          "title": "Get platform video specs",
          "description": "Maximum length, recommended aspect ratio and resolution for short-form video on YouTube Shorts, Instagram Reels, Facebook Reels, TikTok, Snapchat Spotlight and LinkedIn, read from each platform's own help and developer pages, with the source link for every figure. Use when someone asks how long a Short/Reel/TikTok can be or what size to export.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "platform": {
                "default": "all",
                "description": "Which platform; 'all' returns every platform.",
                "enum": ["all", "youtube_shorts", "instagram_reels", "facebook_reels", "tiktok", "snapchat_spotlight", "linkedin"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get platform video specs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
