          "digest": "sha256:764e3434ba26b873d9a4dcaeb1dd3e25847d1ca1c139d06e19ead423a0db881a"
        },
        {
          "name": "start_video_project",
          "title": "Start a video project",
          "description": "Returns a link to the Mark Studios instant quote (start.markstudios.com), preselected for the chosen service, and what happens after: questions about the footage, a price on screen, then upload. It only builds a link; it sends nothing and collects no personal data. Use when the user says they want to hire an editor or get a quote.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "service": {
                "description": "Service key from find_video_editing_service; omit if unsure.",
                "enum": ["youtube", "short-form", "podcast", "talking-head", "vlog", "commercials", "vsl", "corporate", "course", "wedding", "testimonial", "faceless-youtube", "livestream", "intro-outro", "white-label", "monthly-plans", "thumbnails", "youtube-strategy", "videography"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
