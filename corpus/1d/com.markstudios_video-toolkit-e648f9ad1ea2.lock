{
  "lockfileVersion": 2,
  "subjects": {
    "com.markstudios/video-toolkit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.markstudios.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "markstudios",
        "title": "Mark Studios Video Toolkit",
        "version": "1.0.0",
        "websiteUrl": "https://www.markstudios.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Tools for planning and finishing video projects: platform length and size specs, an editing brief builder, SRT/WebVTT caption conversion and checks, editing turnaround windows, and matching a video need to a Mark Studios editing service with a link to start a project. Every fact cites its source page.",
      "tools": [
        {
          "name": "convert_subtitles",
          "title": "Convert or retime subtitles (SRT/WebVTT)",
          "description": "Converts caption text between SubRip (.srt) and WebVTT (.vtt), optionally shifting every timestamp by a number of milliseconds, and reports format problems (missing numbers, comma/period timestamps, captions run together). Runs entirely on the server with the open-source subtitle code used by the markstudios.com caption tools; nothing is stored.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "captions": {
                "description": "The full text of the .srt or .vtt file.",
                "maxLength": 500000,
                "minLength": 1,
                "type": "string"
              },
              "filename": {
                "description": "Original file name, if known; helps tell .srt from .vtt.",
                "maxLength": 200,
                "type": "string"
              },
              "shift_ms": {
                "default": 0,
                "description": "Milliseconds to add to every timestamp (negative moves captions earlier).",
                "maximum": 86400000,
                "minimum": -86400000,
                "type": "integer"
              },
              "to": {
                "default": "same",
                "description": "Output format; 'same' keeps the input format (use with shift_ms or to clean up).",
                "enum": ["srt", "vtt", "same"],
                "type": "string"
              }
            },
            "required": ["captions"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Convert or retime subtitles (SRT/WebVTT)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f739b0d0eea626c7d8b5c310cf6b155df0cf86606b257935c4e3612cf034b19a"
        },
        {
          "name": "create_editing_brief",
          "title": "Create a video editing brief",
          "description": "Builds a filled-in 7-section video editing brief (project, audience and goal, references, must-include moments, brand rules, deliverable specs, timeline) from whatever the user already knows, and lists the gaps an editor will ask about. Use when someone is about to hand footage to an editor, freelancer or agency. Pass only fields you know.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approver": {
                "description": "Approver: Exactly one person",
                "maxLength": 2000,
                "type": "string"
              },
              "audience": {
                "description": "Who it's for: One sentence",
                "maxLength": 2000,
                "type": "string"
              },
              "avoid": {
                "description": "What not to copy: The traps to avoid",
                "maxLength": 2000,
                "type": "string"
              },
              "brand_files": {
                "description": "Brand files: Lower-thirds, intro, outro, logo",
                "maxLength": 2000,
                "type": "string"
              },
              "captions": {
                "description": "Captions: Burned in, SRT file, or both",
                "maxLength": 2000,
                "type": "string"
              },
              "channel": {
                "description": "Channel or brand: Where it will be published",
                "maxLength": 2000,
                "type": "string"
              },
              "copy": {
                "description": "What to copy: Pacing, captions, color, music, graphics",
                "maxLength": 2000,
                "type": "string"
              },
              "delivery": {
                "description": "Delivery: Where final files go",
                "maxLength": 2000,
                "type": "string"
              },
              "donts": {
                "description": "Don'ts: Past mistakes not to repeat",
                "maxLength": 2000,
                "type": "string"
              },
              "feeling": {
                "description": "How viewers should feel: The reaction you want at the end",
                "maxLength": 2000,
                "type": "string"
              },
              "final_due": {
                "description": "Final due: Date and time",
                "maxLength": 2000,
                "type": "string"
              },
              "fonts_colors": {
                "description": "Fonts and colors: Font names and HEX codes",
                "maxLength": 2000,
                "type": "string"
              },
              "footage_location": {
                "description": "Footage location: The folder link and what's in it",
                "maxLength": 2000,
                "type": "string"
              },
              "kill": {
                "description": "KILL: Anything that can't be used",
                "maxLength": 2000,
                "type": "string"
              },
              "length_target": {
                "description": "Length target: A target with a hard floor and ceiling",
                "maxLength": 2000,
                "type": "string"
              },
              "master": {
                "description": "Master: Resolution, frame rate, audio level",
                "maxLength": 2000,
                "type": "string"
              },
              "metric": {
                "description": "The one metric: What success means for this video",
                "maxLength": 2000,
                "type": "string"
              },
              "music": {
                "description": "Music rules: Which library or tracks are licensed",
                "maxLength": 2000,
                "type": "string"
              },
              "must": {
                "description": "MUST: Timestamps from the raw footage that have to land",
                "maxLength": 2000,
                "type": "string"
              },
              "nice": {
                "description": "NICE-TO-HAVE: Moments to use if they fit",
                "maxLength": 2000,
                "type": "string"
              },
              "publish_date": {
                "description": "Publish date: Date and time, not just a day",
                "maxLength": 2000,
                "type": "string"
              },
              "references": {
                "description": "2–4 reference videos: Links with timestamps",
                "maxLength": 2000,
                "type": "string"
              },
              "response_time": {
                "description": "Response time: How fast you reply to a cut",
                "maxLength": 2000,
                "type": "string"
              },
              "revision_rounds": {
                "description": "Revision rounds: How many, in writing",
                "maxLength": 2000,
                "type": "string"
              },
              "rough_cut_due": {
                "description": "Rough cut due: Date and time",
                "maxLength": 2000,
                "type": "string"
              },
              "sensitive": {
                "description": "SENSITIVE: Faces to blur, legal or private material",
                "maxLength": 2000,
                "type": "string"
              },
              "short_clips": {
                "description": "Short clips: Number, ratio and length",
                "maxLength": 2000,
                "type": "string"
              },
              "sponsor": {
                "description": "Sponsor read: Where it goes, if any",
                "maxLength": 2000,
                "type": "string"
              },
              "thumbnail_frames": {
                "description": "Thumbnail frames: Frames to export as stills",
                "maxLength": 2000,
                "type": "string"
              },
              "working_title": {
                "description": "Working title: The title you plan to publish, or the top two options",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Create a video editing brief"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d52c5dd0d1a317e18ee3d6c5fd2c14d962a963d5a5260283c74577610d05748a"
        },
        {
          "name": "find_video_editing_service",
          "title": "Find a video editing service",
          "description": "Given a description of a video project (e.g. 'turn my podcast into weekly Reels'), returns the closest-matching Mark Studios editing services with what each includes, its standard turnaround, the service page, and a link to start an instant quote for that service. Use when the user asks who could edit a video or how to get one edited.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "need": {
                "description": "What the user wants made or edited, in their words.",
                "maxLength": 1000,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a video editing service"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:70eb314163f2cf4150a36cfa1f2a1b243dd955a203a07d354045f8ba0b3bc4ff"
        },
        {
          "name": "get_editing_turnaround",
          "title": "Get video editing turnaround",
          "description": "Standard Mark Studios editing turnaround windows by format (vlog, YouTube, talking head, short-form batch, ad, corporate, course, VSL, wedding, monthly plan), plus when the clock starts, rush speeds and revision timing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "format": {
                "default": "all",
                "description": "Format to look up.",
                "enum": ["all", "vlog", "youtube", "talking-head", "short-form", "commercials", "corporate", "course", "vsl", "wedding", "monthly"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get video editing turnaround"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
