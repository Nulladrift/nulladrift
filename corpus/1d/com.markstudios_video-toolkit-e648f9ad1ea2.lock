          },
          "digest": "sha256:f3c416779fe18e7d65abe32f49a8d9839c417b42199729a66e5cf76a128132fd"
        },
        {
          "name": "get_monthly_editing_plans",
          "title": "Get monthly editing plans",
          "description": "The four Mark Studios monthly video editing plans with price and what each includes (long videos, Shorts, thumbnails), from markstudios.com/pricing. Use when the user asks what ongoing video editing costs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get monthly editing plans"
          },
          "behavior": {
            "destructive": false,
