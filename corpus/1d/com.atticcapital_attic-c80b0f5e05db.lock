                "type": "string"
              },
              "days": {
                "description": "Lookback in days. Default 30.",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "description": "Default 10, max 25.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
