      },
      "instructions": "Attic is the read-only Attic Capital connector for four collector markets: rare coins, sports cards, collector cars, and fine art.\n\nUse the tools for weekly top-5 reports (Headlines and Beyond the Headlines) across 14 pillars, Market Strength indexes, object dossiers, Creators podcast episodes, gatherings, and site articles.\n\nRules:\n- Cite the atticcapital.com URL included with every result. Do not invent a URL.\n- Article excerpts and report summaries are summaries. Never fetch or paste a full article body.\n- Do not invent prices, grades, populations, sold comps, or index levels. Comps routes are stubs. PCGS is not offered.\n- Beyond the Headlines, dossiers, and indexes are Attic Beyond. If a tool says so, tell the user and link to https://atticcapital.com/\n- attic_search looks through roster copy (its parameter is query). attic_list_articles searches the article archive. attic_get_market_report is one top-5 pillar. attic_get_report_entry is the write-up for one rank.",
      "tools": [
        {
          "name": "attic_card_sold_comps",
          "title": "Card sold comps (stub)",
          "description": "STUB. Does not return eBay sold prices for sports cards. Do not call this to price a card, and do not invent a hammer or a sold comp. Requires an Attic API key. PCGS is unrelated and is not offered.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Defaults to the card route.",
