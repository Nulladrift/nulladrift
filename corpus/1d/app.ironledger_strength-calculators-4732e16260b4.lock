        },
        {
          "name": "warmup_sets",
          "title": "Warm-up set calculator",
          "description": "Build a warm-up ramp to a working weight: plate-friendly jumps, reps falling from 10 to singles, with the plates for each set. The same ramp the IronLedger app suggests.",
          "inputSchema": {
