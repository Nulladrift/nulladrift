        },
        {
          "name": "strength_standards",
          "title": "Strength standards",
          "description": "Squat, bench press, deadlift and total percentiles for raw competition powerlifters, by sex, IPF weight class, age group and drug-tested status, from OpenPowerlifting’s public-domain meet results. Give a lift to place it among them. These describe competitive lifters, not the general gym population.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age": {
                "description": "Optional: age in years, for the age group (14-18, 19-23, 24-39, 40-49, 50-59, 60-69, 70+). Omit for all ages.",
                "maximum": 100,
                "minimum": 14,
                "type": "integer"
              },
              "bodyweight": {
                "description": "Bodyweight in the chosen unit; it sets the IPF weight class.",
                "maximum": 400,
                "minimum": 20,
                "type": "number"
              },
              "lift": {
                "default": "total",
                "description": "squat, bench, deadlift, or total (squat + bench + deadlift).",
                "enum": ["squat", "bench", "deadlift", "total"],
                "type": "string"
              },
              "scope": {
                "default": "all",
                "description": "all federations, or tested: drug-tested categories only.",
                "enum": ["all", "tested"],
                "type": "string"
              },
              "sex": {
                "description": "The sex category the lifter competes in.",
                "enum": ["male", "female"],
                "type": "string"
              },
              "unit": {
                "default": "kg",
                "description": "Weight unit for every load in and out: kg or lb.",
                "enum": ["kg", "lb"],
                "type": "string"
              },
              "weight": {
                "description": "Optional: the lifter’s best for that lift, to place among the percentiles.",
                "maximum": 2000,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["bodyweight", "sex"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Strength standards"
          },
