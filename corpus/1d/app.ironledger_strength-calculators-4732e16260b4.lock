{
  "lockfileVersion": 2,
  "subjects": {
    "app.ironledger/strength-calculators": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.ironledger.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ironledger-calculators",
        "title": "IronLedger strength calculators",
        "version": "1.3.0",
        "description": "Free strength-training calculators: one-rep max, RPE loads, barbell plates, warm-up sets, a 5/3/1 cycle, DOTS, IPF GL and Wilks scores, and strength standards from OpenPowerlifting data, plus a checker for program files.",
        "websiteUrl": "https://www.ironledger.app/tools"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Deterministic strength-training calculators from IronLedger. All tools are read-only calculations with no account. Loads are in kg or lb (pass unit). Each result includes a plain-English summary and a url to the same result on ironledger.app, which you can share with the user.",
      "tools": [
        {
          "name": "check_program_file",
          "title": "IronLedger program file checker",
          "description": "Check a training program written as a CSV or TSV file exactly as the IronLedger app will import it, before anyone loads it on a phone. Returns the weeks, sessions and exercises it creates, every skipped row and warning with its row number, the exercise names the app will question (\"Did you mean ...?\"), and names that will become new custom exercises. Use it whenever you write a program for someone to import into IronLedger, and fix anything it reports first. The app names the program after the file, so pass the file name you will give it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "file": {
                "description": "The whole program file as text. Canonical header: Week,Day,Exercise,Sets,Reps,Load,RPE,RIR,Rest,Notes, then one row per exercise, such as 1,Day 1,Squat,5,5,100 kg,8,,3:00,belt. Wrap a cell that contains a comma in double quotes; never use a double quote inside a cell.",
                "maxLength": 200000,
                "type": "string"
              },
              "fileName": {
                "description": "The file name it will be saved as, such as \"Texas Method.csv\". The app names the program after it; without one the program is called Imported Spreadsheet.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["file"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "IronLedger program file checker"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:887c87105dbe447a7e0dae581d0f91dc6ced4fb29759a3b576193159e4785a08"
        },
        {
          "name": "five_three_one",
          "title": "5/3/1 calculator",
          "description": "Jim Wendler’s 5/3/1: the training max from a one-rep max (or a recent set of weight × reps) and every set of a four-week cycle, warm-ups and the deload, rounded to loadable weights. Option one or two percentages, a 90% or lower training max, and the next cycle’s training max for a named lift. Percentages and rounding follow Wendler’s 2009 manual.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lift": {
                "description": "Optional: squat, bench, deadlift or press, to add the next cycle’s training max (+5 kg or 10 lb lower body, +2.5 kg or 5 lb upper body).",
                "enum": ["squat", "bench", "deadlift", "press"],
                "type": "string"
              },
              "oneRepMax": {
                "description": "A tested or estimated one-rep max. Give this, or weight and reps.",
                "maximum": 2000,
                "minimum": 1,
                "type": "number"
              },
              "option": {
                "default": "one",
                "description": "The manual’s percentage option: one (65/75/85, 70/80/90, 75/85/95; recommended) or two (heavier first sets in weeks 1 and 2).",
                "enum": ["one", "two"],
                "type": "string"
              },
              "reps": {
                "description": "Reps in that set, 1 to 30.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "tmPercent": {
                "default": 90,
                "description": "Training max as a percentage of the max, 80 to 95. The manual uses 90; 85 is the cautious choice.",
                "maximum": 95,
                "minimum": 80,
                "type": "number"
              },
              "unit": {
                "default": "kg",
                "description": "Weight unit for every load in and out: kg or lb.",
                "enum": ["kg", "lb"],
                "type": "string"
              },
              "weight": {
                "description": "Weight of a recent set, used with reps to estimate the max (Epley).",
                "maximum": 2000,
                "minimum": 0.5,
                "type": "number"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "5/3/1 calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:28bb4c8b5b53c30d08719b932719d3f3e86d9c94236b6656091a393dac9d945a"
        },
        {
          "name": "one_rep_max",
          "title": "One-rep max calculator",
          "description": "Estimate a one-rep max (1RM) from a set of weight × reps, with a percentage table and the load each rep count should allow. Epley by default, Brzycki optional. Estimates above 10 reps are flagged as less reliable.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "formula": {
                "default": "epley",
                "description": "One-rep max formula: epley (weight × (1 + reps ÷ 30), the one the IronLedger app uses) or brzycki (weight × 36 ÷ (37 − reps)).",
                "enum": ["epley", "brzycki"],
                "type": "string"
              },
              "reps": {
                "description": "Reps completed, 1 to 30.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "unit": {
                "default": "kg",
                "description": "Weight unit for every load in and out: kg or lb.",
                "enum": ["kg", "lb"],
                "type": "string"
              },
              "weight": {
                "description": "Weight lifted for the set.",
                "maximum": 2000,
                "minimum": 0.5,
                "type": "number"
              }
            },
            "required": ["reps", "weight"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "One-rep max calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:094a2fbab3ccd81f3bf8b8fcd825e7f2f8ac4583f72ac9b4ffd6c541311681a0"
        },
        {
          "name": "plate_loading",
          "title": "Barbell plate calculator",
          "description": "Work out which plates to put on each side of a barbell to reach a target weight, using standard gym plates or the plates you list. Reports the exact load and anything your plates can’t make.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bar": {
                "description": "Bar weight in the chosen unit. Defaults to 20 kg or 45 lb.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "collarWeight": {
                "description": "Weight of each collar. Defaults to 2.5 kg or 5 lb.",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "collars": {
                "default": false,
                "description": "Count a collar on each side.",
                "type": "boolean"
              },
              "plates": {
                "description": "Plates available, heaviest first or in any order: \"25,20,15,10,5,2.5,1.25\" for as many as needed, or \"25:4,20:2\" for pairs owned. Defaults to standard gym plates (kg: 25 to 1.25; lb: 45 to 2.5).",
                "type": "string"
              },
              "target": {
                "description": "Total weight wanted on the bar, including the bar.",
                "maximum": 2000,
                "minimum": 0,
                "type": "number"
              },
              "unit": {
                "default": "kg",
                "description": "Weight unit for every load in and out: kg or lb.",
                "enum": ["kg", "lb"],
                "type": "string"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Barbell plate calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a3c3efce8cd02427bc907d824406ddf06a567c0b1d594db340f06aabcf63e75a"
        },
        {
          "name": "powerlifting_score",
          "title": "DOTS, IPF GL and Wilks calculator",
          "description": "Score a powerlifting total (or a bench press) against bodyweight with DOTS, IPF GL points and the original Wilks, using the coefficients the OpenPowerlifting rankings use.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bodyweight": {
                "description": "Bodyweight in the chosen unit.",
                "maximum": 400,
                "minimum": 20,
                "type": "number"
              },
              "equipment": {
                "default": "raw",
                "description": "For IPF GL: raw (classic) or equipped.",
                "enum": ["raw", "equipped"],
                "type": "string"
              },
              "event": {
                "default": "sbd",
                "description": "For IPF GL: sbd (full powerlifting total) or bench (bench press only).",
                "enum": ["sbd", "bench"],
                "type": "string"
              },
              "sex": {
                "description": "The formulas have separate male and female coefficients.",
                "enum": ["male", "female"],
                "type": "string"
              },
              "total": {
                "description": "Total lifted (squat + bench + deadlift), or the bench press for event \"bench\".",
                "maximum": 2000,
                "minimum": 1,
                "type": "number"
              },
              "unit": {
                "default": "kg",
                "description": "Weight unit for every load in and out: kg or lb.",
                "enum": ["kg", "lb"],
                "type": "string"
              }
            },
            "required": ["bodyweight", "sex", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "DOTS, IPF GL and Wilks calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b3bd15ce04cccc134a2b2cef46cc1e1eeaf24bc3b5e900222d047d63d84f155f"
        },
        {
          "name": "rpe_estimate_max",
          "title": "Estimate one-rep max from a set and its RPE",
          "description": "Estimate a one-rep max from weight, reps and RPE, treating RPE as reps in reserve (RPE 8 = 2 reps left) and applying the one-rep max formula to reps + reps in reserve.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "formula": {
                "default": "epley",
                "description": "One-rep max formula: epley (weight × (1 + reps ÷ 30), the one the IronLedger app uses) or brzycki (weight × 36 ÷ (37 − reps)).",
                "enum": ["epley", "brzycki"],
                "type": "string"
              },
              "reps": {
                "description": "Reps completed, 1 to 20.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "rpe": {
                "description": "Rating of perceived exertion, 5 to 10, read as reps in reserve (RPE 8 = 2 reps left). Half points allowed.",
                "maximum": 10,
                "minimum": 5,
                "type": "number"
              },
              "unit": {
                "default": "kg",
                "description": "Weight unit for every load in and out: kg or lb.",
                "enum": ["kg", "lb"],
                "type": "string"
              },
              "weight": {
                "description": "Weight lifted for the set.",
                "maximum": 2000,
                "minimum": 0.5,
                "type": "number"
              }
            },
            "required": ["reps", "rpe", "weight"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate one-rep max from a set and its RPE"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f6de4b983fd5a9495fdaac41177fc6e58b2fa63b1fd79b85cb0c880a900fbdfe"
        },
        {
          "name": "rpe_target_load",
          "title": "Load for a target reps and RPE",
          "description": "Find the load for a set of a given number of reps at a target RPE, from a known or estimated one-rep max. Rounded to the nearest 0.5.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "formula": {
                "default": "epley",
                "description": "One-rep max formula: epley (weight × (1 + reps ÷ 30), the one the IronLedger app uses) or brzycki (weight × 36 ÷ (37 − reps)).",
                "enum": ["epley", "brzycki"],
                "type": "string"
              },
              "oneRepMax": {
                "description": "Your one-rep max (tested or estimated).",
                "maximum": 2000,
                "minimum": 1,
                "type": "number"
              },
              "reps": {
                "description": "Target reps, 1 to 20.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "rpe": {
                "description": "Rating of perceived exertion, 5 to 10, read as reps in reserve (RPE 8 = 2 reps left). Half points allowed.",
                "maximum": 10,
                "minimum": 5,
                "type": "number"
              },
              "unit": {
                "default": "kg",
                "description": "Weight unit for every load in and out: kg or lb.",
                "enum": ["kg", "lb"],
                "type": "string"
              }
            },
            "required": ["oneRepMax", "reps", "rpe"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Load for a target reps and RPE"
          },
          "behavior": {
