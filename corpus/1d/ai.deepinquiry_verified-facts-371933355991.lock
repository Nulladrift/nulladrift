            "readOnly": true
          },
          "digest": "sha256:3b622d4728cbcd72797a8209e35fda9fc82bb35fd535b7162a70dcbb69b2577e"
        },
        {
          "name": "search_facts",
          "title": "Search facts",
          "description": "Semantic search over DeepInquiry verified facts. Returns the closest facts with their sources, tier, score and signature.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional category filter.",
                "type": "string"
              },
              "limit": {
                "description": "How many facts to return. Default 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "min_tier": {
                "description": "Optional lowest verification tier to include.",
                "enum": ["gold", "silver", "bronze", "unverified"],
                "type": "string"
              },
              "query": {
                "description": "What to look for, in plain language (up to 500 characters).",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
