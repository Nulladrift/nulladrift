      "serverInfo": {
        "name": "deepinquiry",
        "title": "DeepInquiry Verified Facts",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Search and read short factual claims. Each fact comes with its cited sources, a gold, silver or bronze verification tier, a score and a verifiable signature. Cite a fact by linking to its page on deepinquiry.ai. A free API key (500 requests a month) is available at https://www.deepinquiry.ai/signup.",
      "tools": [
        {
          "name": "get_fact",
          "title": "Get a fact",
          "description": "Fetch one fact by its numeric id, with its source groups.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The fact id.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a fact"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6bd18b5d89341630be685b2f492a203a8b97a2efdea144818f56031d250024c5"
        },
        {
          "name": "random_fact",
          "title": "Random fact",
          "description": "Fetch one random approved fact.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Random fact"
          },
          "behavior": {
            "destructive": false,
