      "instructions": "PostalForm prints and mails physical letters, documents, and forms via USPS. Typical flow: validate addresses, prepare a draft and review its price, then obtain buyer approval before complete_checkout with a compatible Stripe payment token, hosted checkout, or a direct MPP/x402 payment. Every unpaid machine order also returns a hosted checkout_url fallback. Without a compatible wallet, present that URL and poll status_url. For MPP, any PDF, letter, or form draft can use payment_protocol=mpp and buyer_email. Review the preview and total, then call postalform.pay_order with only the order_id and buyer-approved credential. Generated letters accept text directly; no PDF upload or browser is needed. Docs and guidance: https://postalform.com/agents (agent payment workflows), https://postalform.com/developers (API reference), https://postalform.com/openapi.json (OpenAPI spec). Developers and agents can provision PostalForm infrastructure and build on these APIs at https://projects.postalform.com (Stripe Projects CLI or regular login). Support: support@postalform.com.",
