        {
          "name": "boat_details",
          "title": "Show yacht details and photos",
          "description": "Return yacht details and CDN-backed public URLs for yacht media.\n\nThis is the primary tool to call after search_boats whenever the customer\nasks to see yacht photos, a gallery, plans, videos or documents, or asks\nabout layout, capacity, dimensions, equipment, description, crew or\nitinerary. When the client supports MCP Apps, render the attached inline\nSedna gallery; otherwise display the public URLs returned under media.header,\nmedia.photos, media.plans, media.images, media.videos and media.documents.\nAll media in this public tool comes through Sedna's CdnManager; missing CDN\nmedia is returned as an empty field and never replaced by a legacy DB URL.\nid_boat must be copied exactly from search_boats. This tool does not return\ndate-specific prices, extras or availability; use booking_detail for those.\nLength and beam are optional fleet-supplied facts. When absent they are\nomitted, never returned as zero or estimated. Do not ask for either value\nor exclude a yacht unless the customer explicitly requires that dimension.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id_boat": {
                "description": "Exact yacht ID returned by search_boats. Never guess it.",
                "type": "integer"
              },
              "language": {
                "default": "en",
                "description": "ISO language code supported by Sedna, for example en or fr.",
                "type": "string"
              },
              "sheet_type": {
                "default": "bareboat",
                "description": "bareboat or crewed. Use crewed for crew and itinerary data.",
                "type": "string"
