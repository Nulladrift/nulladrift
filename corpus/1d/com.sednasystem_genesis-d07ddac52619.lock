        {
          "name": "booking_create",
          "title": "Send option or booking request",
          "description": "Submits a request for a booking or a request for an option.\n\nThis action re-prices and submits the request. ``booking_detail_mod`` is a\nstateless preview: selections made there are not stored automatically.\nTherefore selected_extras MUST repeat every extra the customer selected,\nusing the exact id_opt and quantity. Pass an empty list only when the\ncustomer selected no optional extras. Never report an extra as selected\nunless this tool's saved_extras verification confirms it.\n\nFull client details (name, email, phone) are required to submit the request.\n **** strong rule: AI should not guess or input customer information on its own. It must ask customers to input it on its own.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "arrival_port_pay_option": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "arrival_selected": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "client_email": {
                "description": "The client's valid email address.",
                "type": "string"
              },
              "client_name": {
                "description": "The client's full name.",
                "type": "string"
              },
              "client_phone": {
                "description": "The client's contact phone number.",
                "type": "string"
              },
              "currency_id_devise": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "dateEnd": {
                "description": "The end date (DD/MM/YYYY).",
                "type": "string"
              },
              "dateStart": {
                "description": "The start date (DD/MM/YYYY).",
                "type": "string"
              },
              "departure_port_pay_option": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "departure_selected": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "id_boat": {
                "description": "The unique boat identifier.",
                "type": "integer"
              },
              "id_tbf1": {
                "description": "The TBF1 identifier for the booking.",
                "type": "integer"
              },
              "mode": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
