        {
          "name": "booking_detail_mod",
          "title": "Recalculate price with extras",
          "description": "Apply customer selections and return server-recalculated booking details.\n\nCopy id_boat and id_tbf1 from search_boats. Sedna is the only source of\ntruth for prices: never calculate totals in the LLM. Send selected extras,\npassenger count, currency, ports and payment options here, then present the\ncomplete updated summary returned by the server. This is a stateless price\npreview and does not save the selection. If the customer proceeds, repeat\nthe complete selected_extras list in booking_create. When the customer asks\nfor the new total, quote customer_cost_summary.full_customer_cost. Explain\npayable_now and payable_at_base separately; never add them in the LLM, and\nkeep the refundable deposit separate.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
