        {
          "name": "readme",
          "title": "Sedna search guidance",
          "description": "Sedna guidance for public yacht-search conversations.\n\n1. Yacht, fleet, availability and price facts come from Sedna tool results;\n   do not invent them.\n2. Stay neutral between fleets. Present factual differences and let the\n   customer decide.\n3. Call Base_list before search_boats so the search uses an official base.\n4. Copy id_boat and id_tbf1 exactly as returned by search_boats.\n5. When the customer does not state a year, clarify the date or use the\n   current year rather than silently choosing another year.\n6. When the customer asks to see yacht photos or other yacht media, call\n   boat_details with the exact id_boat from search_boats. Display the public\n   URLs returned in media.header, media.photos, media.plans or media.images.\n   search_boats intentionally returns no gallery. Use booking_detail only\n   for date-specific availability, prices, extras and booking choices.\n7. A search result is available only for the requested dates reported by\n   Sedna. Never generalize that availability to different dates.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Sedna search guidance"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:fe0de5f6b0219e30ee82af8dcf74bc02c34f78e8a0aa7a2830730093560a7d1c"
        },
        {
          "name": "search_boats",
          "title": "Search available yachts",
          "description": "Search Sedna for yachts available for the exact requested dates.\n\nCall Base_list first and use an official base name. Results have passed\nSedna planning/block and pricing checks for start_date plus nights. If\nmore than 30 yachts match, state the accurate count and ask for a fleet,\nmodel or year preference. If 30 or fewer match, show every result with its\nfleet name; never select an arbitrary subset. If none match, offer\nalternative bases or dates.\n\nSearch results intentionally contain no yacht images. If the customer asks\nto see photos, a gallery, plans, videos or documents for a selected yacht,\ncall boat_details with its exact id_boat and display the returned public\nmedia URLs. Use booking_detail for date-specific prices, extras, ports and\nbooking choices.\n\nLength and beam are optional fleet-supplied facts. Missing values are\nomitted and must never exclude an otherwise matching yacht, be shown as\nzero, be estimated, or trigger a clarification unless the customer has\nexplicitly made that dimension a requirement.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "base": {
                "description": "Exact base name returned by Base_list.",
                "type": "string"
              },
              "bathroom": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional bathroom filter."
              },
              "boat_model": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional yacht brand, partial model or complete model. For example, \"Lagoon\" matches Lagoon 380, Lagoon 40 and Lagoon 42; \"Lagoon 42\" also matches directly."
              },
              "boat_type": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional exact yacht type."
              },
              "boat_year": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional build-year filter (exact, range or comparator)."
              },
              "double_cabin": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional double-cabin filter."
              },
              "fleet_name": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional fleet preference."
              },
              "nights": {
                "description": "Number of charter nights.",
                "type": "integer"
              },
              "option": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Additional supported Sedna filters."
              },
              "page": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": 1,
                "description": "Result page starting at 1."
              },
              "pax": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional passenger-capacity filter. A single number means at least that many guests; ranges and comparators are also supported."
              },
              "price": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
