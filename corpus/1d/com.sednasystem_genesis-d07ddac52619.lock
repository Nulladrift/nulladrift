        {
          "name": "booking_detail",
          "title": "Get prices and extras",
          "description": "Return date-specific availability, pricing, extras and booking choices.\n\nUse id_boat and id_tbf1 exactly as returned by search_boats. This tool is\nfor a selected yacht and charter period. Do not call this tool only to see\nyacht photos or media; call boat_details with the exact id_boat instead.\nAny Images included here are supplemental booking-context images, while\nboat_details is the canonical source for the complete public media URLs.\n\nShow all optional extras. After the customer changes extras, passenger\ncount, currency, ports or payment options, call booking_detail_mod and use\nonly its server-calculated totals. When asked for the total, quote\ncustomer_cost_summary.full_customer_cost; deposits are returned separately\nand are not included in that amount. Finally, offer a request for an option\nor a request for a booking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dateEnd": {
                "description": "End date in DD/MM/YYYY format.",
                "type": "string"
              },
              "dateStart": {
                "description": "Start date in DD/MM/YYYY format.",
                "type": "string"
              },
              "id_boat": {
                "description": "Exact yacht ID returned by search_boats.",
                "type": "integer"
              },
              "id_tbf1": {
                "description": "Exact pricing ID returned by search_boats.",
                "type": "integer"
              },
              "pax": {
                "description": "Number of passengers.",
                "type": "integer"
              }
            },
            "required": ["dateEnd", "dateStart", "id_boat", "id_tbf1", "pax"],
            "type": "object"
          },
          "annotations": {
