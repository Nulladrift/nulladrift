                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["client_email", "client_name", "client_phone", "dateEnd", "dateStart", "id_boat", "id_tbf1", "pax", "selected_extras"],
            "type": "object"
          },
