        {
          "name": "Base_list",
          "title": "List charter bases",
          "description": "Sedna yacht-search guidance and available bases.\n\nThis tool lists available bases grouped by country and provides operating\nguidance for yacht searches.\n\n1. Yacht, fleet, availability and price facts come from Sedna tool results;\n   do not invent them.\n2. Stay neutral between fleets and present factual differences so the\n   customer can decide.\n3. Copy `id_tbf1` and `id_boat` exactly from `search_boats` results.\n4. If no year is specified, clarify the date or use the current year.\n5. Call `Base_list` before `search_boats` and use the returned base name.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
