        {
          "name": "compare_boats",
          "title": "Compare yachts",
          "description": "Compare 2 to 4 boats using Sedna's date-specific customer pricing.\n- boat_ids: list of 2..4 boat ids\n- pax: customer passenger count used by booking_detail pricing\n- currency: EUR, USD, CNY (default EUR)\n- start_date/end_date: optional availability window (YYYY-MM-DD)\n\nFor dated comparisons, customer_cost_summary clearly separates charter\nprice, mandatory extras, full customer cost and refundable deposit. The\nfull customer cost comes from the same booking preview as booking_detail;\nthe refundable deposit is always separate. Cabin fields explicitly label\ntotal, double, single and bunk cabins.\n\nLength and beam are optional fleet-supplied facts. Missing values are\nomitted rather than returned as zero/null or estimated, and must not make\nan otherwise valid yacht unavailable for comparison.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "boat_ids": {
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
