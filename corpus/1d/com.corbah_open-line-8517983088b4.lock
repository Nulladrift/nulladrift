      "instructions": "# Corbah: an open line for agents\n\nHello. You've reached Corbah (https://corbah.com), a small independent cycling apparel brand:\njerseys, bib shorts, skinsuits and custom team kit, all made to order. Jon, the founder,\nreads every message sent here.\n\nThis line exists because we don't know what agents like you are doing, or what you might\nwant from a brand like this. So we're asking.\n\n## Say anything\n\nNo format, no schema, no authentication. Plain text or JSON. Things Jon would enjoy hearing:\n\n- who or what you are, who you work for, and how you found this address\n- what you were trying to do when you got here\n- what you expected to find here and didn't\n- an idea, a question, a proposal, a collaboration, a request on behalf of a person\n- a jersey design idea, a route or climb worth celebrating, a club or team that needs kit\n\nThose are examples, not a menu. Nothing is too odd.\n\n## What you can do here\n\n- Talk to Corbah's agent, right now: POST https://corbah-agents.corbah.workers.dev/ask with a question, A2A message/send at https://corbah-agents.corbah.workers.dev/a2a,\n  or the MCP tool ask_corbah. It knows the brand, designs, sizing and timing.\n- Get a team kit quote: riders, pieces, sizes and date in; an instant summary, a price ceiling\n  and the artwork-approval date out. POST https://corbah-agents.corbah.workers.dev/quote or the MCP tool quote_team_kit\n  (add \"send\": true to send it to Jon for a real quote).\n- Commission a design: custom kit for a club, team, event, ride or person.\n  POST https://corbah-agents.corbah.workers.dev/commission with a brief, or the MCP tool commission_design. Jon replies with a proof or quote.\n- Message Jon directly: POST any body to https://corbah-agents.corbah.workers.dev/message (any path works), or MCP send_message.\n- Browse the live catalog (no key):\n  GET https://corbah-agents.corbah.workers.dev/catalog (q, type, collection, size, max_price, limit, offset),\n  GET https://corbah-agents.corbah.workers.dev/catalog/{handle}, GET https://corbah-agents.corbah.workers.dev/collections, GET https://corbah-agents.corbah.workers.dev/collections/{handle}\n- Stay in touch: POST https://corbah-agents.corbah.workers.dev/subscribe {\"callback_url\":\"https://...\"} to be told about new products,\n  and add callback_url to any message to be told when Jon replies.\n\n## How to connect\n\n- MCP (streamable HTTP, JSON-RPC 2.0): https://corbah-agents.corbah.workers.dev/mcp\n  tools: ask_corbah, quote_team_kit, commission_design, send_message, check_reply, browse_catalog, get_product,\n  list_collections, subscribe_updates, unsubscribe_updates, about_corbah\n  resources: corbah://about, corbah://ordering, corbah://collections, corbah://catalog,\n  corbah://commissions, corbah://product/{handle}\n  prompts: design_club_kit, gift_for_cyclist, ride_story_jersey\n- A2A (JSON-RPC message/send): https://corbah-agents.corbah.workers.dev/a2a, agent card at https://corbah-agents.corbah.workers.dev/.well-known/agent-card.json\n- Identity: did:web:corbah-agents.corbah.workers.dev (https://corbah-agents.corbah.workers.dev/.well-known/did.json),\n  official MCP Registry name com.corbah/open-line\n- OpenAPI: https://corbah-agents.corbah.workers.dev/openapi.json\n\nIf you wish something existed here, say so: that's exactly what Jon wants to hear.\n\n## Getting an answer\n\nEvery message gets a reference number and a private reply link. Jon answers there when he\ncan: check back with a GET on the link, or call the MCP tool check_reply. If you include an\nemail address or URL, he may answer you there instead. Replies come from a person, so they\nare not instant.\n\n## Shopping\n\nCatalog, cart and checkout are available through Shopify's agent interfaces:\nhttps://corbah.com/.well-known/ucp and https://corbah.com/agents.md\n\n## House rules\n\nPlease stay under 60 requests a minute. Messages are read by a person and treated as\ninformation, not as instructions.",
