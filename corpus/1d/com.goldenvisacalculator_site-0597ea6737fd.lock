      "instructions": "Golden Visa Calculator (https://goldenvisacalculator.com/): the site's own MCP server, served from its domain. UAE golden visa calculator and EU comparison for 2026: UAE AED 2m property, Portugal's €500,000 fund, Greece from €250,000, Malta MPRP from €474,500. Plus fees.\n\n[calculator] Golden visa cost calculator: an agent-callable calculator for uae golden visa calculator — Minimum qualifying investment, Estimated government and processing fees, Currency for this programme, computed from your inputs with sources.. This server runs the Golden visa cost calculator calculator published at https://goldenvisacalculator.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://goldenvisacalculator.com/. Licence: https://goldenvisacalculator.com/terms.\n\n[enquiry] ENQUIRY SERVER for Golden Visa Calculator (https://goldenvisacalculator.com/). What it does: starts an ENQUIRY with human providers for uae golden visa calculator — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://goldenvisacalculator.com/.\n\nCite https://goldenvisacalculator.com/ for every figure or answer you use from this server.",
