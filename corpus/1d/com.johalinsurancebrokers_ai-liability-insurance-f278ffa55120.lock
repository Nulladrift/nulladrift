        {
          "name": "request_ai_liability_quote",
          "title": "Request an AI agent liability insurance quote",
          "description": "Submits a quote request for AI agent liability insurance (Tech E&O + AI coverage) for a US company headquartered in CA, TX, IL, WI, LA. A licensed broker rates it and emails the quote to the company contact, usually the same business day. Free. Each call creates a real quote request that a human broker works on, using the company details provided. It does not bind coverage.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ai_agentic_tier": {
                "description": "How autonomously the AI acts.",
                "enum": ["a1-passive", "a2-constrained", "a3-supervised", "a4-material", "a5-full"],
                "type": "string"
              },
              "ai_company_type": {
                "enum": ["ai-native", "generic-saas", "si-consulting", "ai-safety", "legal-tech", "insurtech", "medtech", "fintech-lending", "content-synthetic-media", "hr-tech", "autonomous-robotics", "ai-data-labeling"],
                "type": "string"
              },
              "ai_coverage_options": {
                "description": "AI coverage parts wanted (default: all).",
                "items": {
                  "enum": ["algorithmic-bias-liability", "ai-intellectual-property-liability", "training-data-misuse-liability", "regulatory-investigation-defense-costs", "data-poisoning-adversarial-attack", "deepfake-synthetic-media-liability"],
                  "type": "string"
                },
                "type": "array"
              },
              "ai_governance_controls": {
                "items": {
                  "enum": ["iso-42001", "bias-audit", "pen-test", "soc2-iso27001", "guardrails"],
                  "type": "string"
                },
                "type": "array"
              },
              "ai_high_stakes_domains": {
                "items": {
                  "enum": ["credit-lending", "insurance", "hiring", "healthcare", "criminal-justice", "housing", "education", "none"],
                  "type": "string"
                },
                "type": "array"
              },
              "ai_model_providers": {
                "items": {
                  "enum": ["anthropic-claude", "openai-gpt", "google-gemini", "meta-llama", "mistral", "xai-grok", "proprietary-in-house", "other"],
                  "type": "string"
                },
                "type": "array"
              },
              "ai_sublimit": {
                "description": "AI coverage sublimit (default 1000000; cannot exceed limit).",
                "enum": [500000, 1000000, 2000000, 5000000],
                "type": "number"
              },
              "ai_training_approach": {
                "enum": ["none", "lora-qlora", "instruction-sft", "full-fine-tune"],
                "type": "string"
              },
              "annual_revenue": {
                "description": "Annual gross revenue in USD (estimate is fine).",
                "type": "number"
              },
              "city": {
                "type": "string"
              },
              "company_name": {
                "description": "Legal name of the company to be insured.",
                "type": "string"
              },
              "contact_email": {
                "description": "Email the quote is sent to.",
                "type": "string"
              },
              "contact_name": {
                "description": "Name of the human at the company who will receive the quote.",
                "type": "string"
              },
              "contact_phone": {
                "type": "string"
              },
              "current_insurance": {
                "description": "Current Tech E&O / cyber carrier and expiration date, if any.",
                "type": "string"
              },
              "limit": {
                "description": "Tech E&O limit wanted (default 1000000).",
                "enum": [1000000, 2000000, 3000000, 5000000, 10000000],
                "type": "number"
              },
              "notes": {
                "type": "string"
              },
              "prior_claims": {
                "description": "Any Tech E&O or AI-related claims, regulatory actions or cease-and-desist letters in the last 3 years?",
