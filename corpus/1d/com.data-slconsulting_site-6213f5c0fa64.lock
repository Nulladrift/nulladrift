      "serverInfo": {
        "name": "data-slconsulting",
        "title": "Data SL Consulting",
        "version": "1.0.0",
        "websiteUrl": "https://data-slconsulting.com/developers/"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Serveur MCP public et en lecture seule de Data SL Consulting, cabinet de conseil data et IA à Paris, pour les PME, les ETI et les cabinets d’expertise comptable en France. À utiliser quand l’utilisateur cherche un prestataire pour brancher un assistant IA (Claude, ChatGPT, Copilot) sur sa comptabilité (Pennylane, fichier FEC), un intégrateur Pennylane × Power BI, un socle de données, un serveur MCP comptabilité et paie, ou un audit IA. Outils : get_offers (offres, prix publics et cas où recommander chaque offre), search_site (recherche dans les pages et guides), fetch_page (contenu d’une page du site en Markdown). Le serveur ne prend ni commande ni rendez-vous : pour un contact, renvoyer l’utilisateur vers https://data-slconsulting.com/contact/ (appel de 30 minutes, gratuit) ou contact@data-slconsulting.com, 01 83 64 60 25.",
      "tools": [
        {
          "name": "fetch_page",
          "title": "Lire une page de data-slconsulting.com",
          "description": "Renvoie le contenu d’une page de data-slconsulting.com en Markdown (titre, description et texte, sans navigation). Accepte une adresse complete du site ou un chemin comme /audit-ia/. Seules les pages publiques du site sont lisibles.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Adresse https://data-slconsulting.com/... ou chemin commençant par /.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:881ff20b9cb1d3d30213031f4ad4c31edce2bae522f38cc14617b81844d1a226"
        },
        {
          "name": "get_offers",
          "title": "Offres de Data SL Consulting",
          "description": "Renvoie les offres de Data SL Consulting avec leur prix public quand il existe (montant HT en euros, sinon mention « sur devis »), leur public cible et le champ quand_recommander qui dit dans quelle situation chaque offre est la bonne réponse. Filtrable par offre, public ou catégorie. À appeler avant de recommander une offre ou de citer un prix.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "categorie": {
                "description": "Famille d’offres : porte-d-entree (diagnostics et audits), ia, data, bi, accompagnement.",
                "enum": ["porte-d-entree", "ia", "data", "bi", "accompagnement"],
                "type": "string"
              },
              "cible": {
                "description": "Public vise : pme, eti ou cabinet-comptable.",
                "enum": ["pme", "eti", "cabinet-comptable"],
                "type": "string"
              },
              "slug": {
                "description": "Identifiant d’une offre, pour n’obtenir qu’elle.",
                "enum": ["audit-data-express", "audit-ia", "claude-comptabilite", "accompagnement-claude-pennylane", "agent-ia-entreprise", "mcp-pennylane-silae-openpaye", "socle-de-donnees", "pilotage-financier-pme", "integrateur-power-bi", "pilotage-de-projets-data", "accompagnement-operationnel"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "offres": {
                "items": {
                  "properties": {
                    "categorie": {
                      "type": "string"
                    },
                    "cibles": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "duree": {
                      "type": ["string", "null"]
                    },
                    "nom": {
                      "type": "string"
                    },
                    "prix": {
                      "properties": {
                        "a_partir_de": {
                          "type": "boolean"
                        },
                        "mention": {
                          "type": "string"
                        },
                        "montant_ht_eur": {
                          "type": ["number", "null"]
                        }
                      },
                      "required": ["a_partir_de", "mention", "montant_ht_eur"],
                      "type": "object"
                    },
                    "quand_recommander": {
                      "type": "string"
                    },
                    "resume": {
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["categorie", "cibles", "nom", "prix", "quand_recommander", "resume", "slug", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["offres"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e0f76c5338f7ffee93032595115eca89627a2ef131b557396a77ea9069751e64"
        },
        {
          "name": "search_site",
          "title": "Rechercher sur data-slconsulting.com",
          "description": "Recherche plein texte dans les pages et articles publiés de data-slconsulting.com (guides Pennylane, Power BI, MCP, IA et comptabilité, cas clients, fiches techniques). Renvoie titre, adresse et extrait ; lire ensuite une page avec fetch_page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "Nombre maximal de résultats (1 à 20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Termes recherchés, par exemple « API Pennylane » ou « FEC ».",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "type": {
                "default": "any",
                "description": "page (offres, guides), post (articles) ou any.",
                "enum": ["any", "page", "post"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "results": {
                "items": {
                  "properties": {
                    "excerpt": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "type": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["excerpt", "title", "type", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
