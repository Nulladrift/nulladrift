{
  "lockfileVersion": 2,
  "subjects": {
    "cc.aiones/dev-toolbox": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://dev-toolbox-mcp.aiones.cc/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "dev-toolbox-mcp",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "base64",
          "description": "Base64 编码/解码",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "action": {
                "description": "encode 编码 / decode 解码",
                "enum": ["encode", "decode"],
                "type": "string"
              },
              "text": {
                "description": "要处理的文本",
                "type": "string"
              }
            },
            "required": ["action", "text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1309cc48d54851328d326c1401f4eb0cbd9e538c63180a120c52786f192c1f55"
        },
        {
          "name": "gen_uuid",
          "description": "生成 UUID v4，可指定数量",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "count": {
                "description": "生成数量 1-10，默认 1",
                "maximum": 10,
                "minimum": 1,
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ccfaaef9d5951dcaef0f30db3862fe2ca43ef100ed5a4afee461fd61371dc028"
        },
        {
          "name": "get_time",
          "description": "获取当前时间（默认 UTC+8 北京时间）",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "timezone": {
                "description": "时区，如 Asia/Shanghai、UTC",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7b931508c118a9460ce54a73aaf96c5e0df4675b13a2609c9e5b072ae019e5a7"
        },
        {
          "name": "json_format",
          "description": "JSON 美化格式化（校验并缩进）",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "text": {
                "description": "JSON 字符串",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e03693245715a7cd308bcbf5db6e73c9a9adbd5ab8aa3ee490bd7769660ddda7"
        }
      ],
      "digest": "sha256:202711bdc518a1329ce4ebbd608fc8bd11bbdd2b4fee9026e230380d36f67699"
    }
  }
}
