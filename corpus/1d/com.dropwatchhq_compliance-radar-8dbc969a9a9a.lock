{
  "lockfileVersion": 2,
  "subjects": {
    "com.dropwatchhq/compliance-radar": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://compliance.dropwatchhq.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "compliance-radar",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Informational compliance/tax-deadline directory. NOT legal or tax advice. Every result cites an official source with a verified-as-of date.",
      "tools": [
        {
          "name": "build_checklist",
          "description": "Build a personalized list of likely recurring compliance obligations and their NEXT deadline dates from an entity profile (entity type + state + formation date + a few flags). Pure date arithmetic over officially-cited rules — NOT individualized legal or tax advice. Always verify against the cited sources and a licensed professional.",
          "inputSchema": {
            "properties": {
              "entityType": {
                "enum": ["llc", "c-corp", "s-corp", "sole-prop", "partnership"],
                "type": "string"
              },
              "foreignOwned": {
                "description": "True if owned (>=25% or wholly) by a non-US person.",
                "type": "boolean"
              },
              "formationDate": {
                "description": "Entity formation date YYYY-MM-DD (drives anniversary-based deadlines).",
                "type": "string"
              },
              "hasEmployees": {
                "type": "boolean"
              },
              "paysContractors": {
                "description": "True if you pay $600+ to US contractors (1099 obligations).",
                "type": "boolean"
              },
              "state": {
                "description": "2-letter formation/registration state, e.g. 'DE'.",
                "type": "string"
              }
            },
            "required": ["entityType", "state"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:53a95c4bfe2706c80b1ad2b31e84796591bcd82adbc44b5890b574682c393329"
        },
        {
          "name": "create_deadline_tracker",
          "description": "Save an entity profile plus an email and/or webhook URL to receive FREE recurring reminders before each upcoming compliance deadline. Returns a manage id. INFORMATIONAL reminders only — not legal or tax advice.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "Where to send reminders (email or webhook required).",
                "type": "string"
              },
              "entityType": {
                "enum": ["llc", "c-corp", "s-corp", "sole-prop", "partnership"],
                "type": "string"
              },
              "foreignOwned": {
                "type": "boolean"
              },
              "formationDate": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "hasEmployees": {
                "type": "boolean"
              },
              "paysContractors": {
                "type": "boolean"
              },
              "remindDays": {
                "description": "Days of lead time before a deadline to remind (default 30, 1-120).",
                "type": "number"
              },
              "state": {
                "type": "string"
              },
              "webhook": {
                "description": "POST target for reminder JSON (email or webhook required).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a8df79e9d649eaf9470bc21320c3a03cf7a91b88e1995bd46e015c0509a2f7fd"
        },
        {
          "name": "get_obligation",
          "description": "Return full detail for a single obligation by id: what it is, who must file, the deadline, the penalty for missing it, and a link to the OFFICIAL government source with a dated 'verified as of'. INFORMATIONAL ONLY — not legal or tax advice.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Obligation id, e.g. 'fincen-boi', 'irs-5472', 'de-franchise-llc'.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4bd063e2dcf8ad455a23d79237e1b281b0d5feb2cd82f3337800511aee3f1486"
        },
        {
          "name": "list_obligations",
          "description": "List recurring US compliance / tax-filing obligations that commonly blindside small businesses and foreign-owned US LLCs (FinCEN BOI, IRS Form 5472, Delaware/WY/NV/CA franchise tax & annual reports, 1099 deadlines, etc.). Each item cites its official IRS/FinCEN/state source with the date it was last verified. INFORMATIONAL ONLY — not legal or tax advice. Optionally filter by entity type and/or 2-letter state.",
          "inputSchema": {
            "properties": {
              "entityType": {
                "description": "Filter to obligations that can apply to this entity type.",
                "enum": ["llc", "c-corp", "s-corp", "sole-prop", "partnership"],
                "type": "string"
              },
              "foreignOwned": {
                "description": "Include foreign-owned-only obligations (e.g. Form 5472).",
                "type": "boolean"
              },
              "state": {
                "description": "2-letter US state (e.g. 'DE'). Filters state-specific obligations + always-included federal ones.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7fd8c160f5bb4c6809599ee57356bc6b9c34de141f0405d00931f2b83e3344e4"
        }
      ],
      "digest": "sha256:9217eb133b71247f2f668577dbae2c6cd941662364c66f0f5b054f5f7f591213"
    }
  }
}
