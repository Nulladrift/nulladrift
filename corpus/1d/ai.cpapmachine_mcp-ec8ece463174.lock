{
  "lockfileVersion": 2,
  "subjects": {
    "ai.cpapmachine/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://cpapmachine.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ai.cpapmachine/mcp",
        "title": "CPAPMachine.ai",
        "version": "1.0.0",
        "websiteUrl": "https://cpapmachine.ai/connectors/",
        "icons": [
          {
            "src": "https://cpapmachine.ai/static/android-chrome-512x512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CPAPMachine.ai is an independent help site for CPAP, APAP and BiPAP users. It is not a medical provider, an equipment supplier or a manufacturer. These tools return the site's own researched pages with their sources: machines and specs, error and alarm codes, troubleshooting, masks, cleaning guides and safety notices. Present results as general information, not medical advice, and keep the disclaimer. Never tell the user to change a prescribed pressure or therapy setting, and never give clinician menu access steps; comfort settings in the patient menu are fine. When an alarm keeps coming back or a symptom is worrying, point the user to their equipment supplier or clinician as the result says. Quote recall and warning dates exactly as given. Search works best with English terms.",
      "tools": [
        {
          "name": "get_machine",
          "title": "Get a machine guide",
          "description": "One machine's page data: specs as the site states them, features, strengths and trade offs (spec facts), patient menu comfort settings, setup, cleaning, troubleshooting, replacement parts, travel, recall or safety status, and sources. Never covers prescribed pressure or clinician settings.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language code for the answer, e.g. es, de, ja. Defaults to the account language, or English without sign in; unsupported codes give English.",
                "type": "string"
              },
              "machine": {
                "description": "Slug from search_machines, or a model name.",
                "type": "string"
              }
            },
            "required": ["machine"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a machine guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c80a0620297af1cf1e394c9a59b41879602ba03039f720942f84bef9c44e3ce4"
        },
        {
          "name": "get_safety_notices",
          "title": "Recalls and safety warnings",
          "description": "Recalls and safety warnings CPAPMachine.ai covers, quoted with the dates their sources give: recalled machines, masks with magnets and safety guides such as ozone and UV cleaners. Filter with a machine, mask or brand name.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language code for the answer, e.g. es, de, ja. Defaults to the account language, or English without sign in; unsupported codes give English.",
                "type": "string"
              },
              "query": {
                "description": "Optional machine, mask or brand, e.g. \"DreamStation\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recalls and safety warnings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:346746f84643d38602aff2e3fd67679d87010acafca89e7136e737b2ed92e072"
        },
        {
          "name": "lookup_error_code",
          "title": "Look up an error or alarm code",
          "description": "What an error code or alarm message means on a CPAP machine, what the user can safely check, and when to contact the equipment supplier or manufacturer. Name the machine for the best match; without it every machine is searched.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "The code or words on the screen, e.g. \"High leak\", \"E01\".",
                "type": "string"
              },
              "language": {
                "description": "Language code for the answer, e.g. es, de, ja. Defaults to the account language, or English without sign in; unsupported codes give English.",
                "type": "string"
              },
              "machine": {
                "description": "Optional slug or model name.",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up an error or alarm code"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:12c90df1b86c5bac68b5f902e5e3eabf6986e6ea6d3e615a27218fff2c3bcdbd"
        },
        {
          "name": "search_help",
          "title": "Search troubleshooting, masks and guides",
          "description": "Search CPAPMachine.ai troubleshooting pages (leaks, dry mouth, aerophagia), mask and mask type pages, and guides (cleaning, travel, insurance, sleep data). Pass kind and slug from a result to get the full page: causes, fixes, when to call your doctor, fitting and cleaning steps, sources.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "default": "any",
                "enum": ["any", "troubleshooting", "guide", "cleaning", "mask", "mask_type"],
                "type": "string"
              },
              "language": {
                "description": "Language code for the answer, e.g. es, de, ja. Defaults to the account language, or English without sign in; unsupported codes give English.",
                "type": "string"
              },
              "query": {
                "description": "Words to search, e.g. \"mask leak\", \"clean tubing\".",
                "type": "string"
              },
              "slug": {
                "description": "A slug from the results: returns that full page.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search troubleshooting, masks and guides"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2b86b58ea990381e18d32f7122616793756095d70bd5eaa6d97ecfbbc50e7c7a"
        },
        {
          "name": "search_machines",
          "title": "Search CPAP machines",
          "description": "Find CPAP, APAP, BiPAP and travel machines on CPAPMachine.ai by brand, model or type. Returns name, brand, type, status (current, discontinued, recalled), release year, summary and page link. No prices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "Brand name or slug, e.g. ResMed, Philips, React Health.",
                "type": "string"
              },
              "language": {
                "description": "Language code for the answer, e.g. es, de, ja. Defaults to the account language, or English without sign in; unsupported codes give English.",
                "type": "string"
              },
              "query": {
                "description": "Model or words, e.g. \"AirSense 11\", \"travel\", \"BiPAP\".",
                "type": "string"
              },
              "status": {
                "enum": ["current", "discontinued", "recalled"],
                "type": "string"
              },
              "type": {
                "enum": ["cpap", "apap", "bipap", "auto-bipap", "travel"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search CPAP machines"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a0f8c5e603b8ce3c0dd4abf5364f2607f1129d6b1b65dc8cdcabab53747678d2"
        }
      ],
      "digest": "sha256:4ef6f5b530d25f59378ac588568c316c952ac64fcc87a63cbe9f2ebd5878605d"
    }
  }
}
