        {
          "name": "run_stat_query",
          "title": "Compute an NFL statistic on request",
          "description": "Computes an NFL figure from a structured query rather than looking one up: a population (position, qualifying threshold), a window (seasons, weeks, a team span, a coach's tenure), one named measure, and one operation (leaders, rank, count, only-who, a per-season streak, or a share of a total). Answers questions the verified panel has no pre-computed row for — qualified superlatives, multi-season streaks, derived rates. Every response carries the executed method, the population size, the measure's definition and the data version it ran against. Figures are computed on request from nflverse data and are labelled as computed, not verified. A figure that cannot be served comes back with the reason and the nearest thing covered.\n\nFantasy measures answer in the convention `scoring` names — \"standard\", \"half_ppr\" or \"ppr\" — and default to half-PPR when none is named; the response says which it used. A bare \"PPR\" means full PPR.\n\nmeasure.key takes a measure name (\"rushing_yards\", \"half_ppr_points\") or a verified panel metric key (\"key_player_stats.rushing.yards\", \"fantasy_scoring.half_ppr_points\"). A panel metric key this tool does not compute is refused with the reason.",
