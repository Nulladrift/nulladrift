{
  "lockfileVersion": 2,
  "subjects": {
    "ai.artidrop/artidrop": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://artidrop.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "artidrop",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get",
          "description": "Get artifact metadata. Set include_content to true to also return the full HTML content.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "Artifact ID or short ID",
                "type": "string"
              },
              "include_content": {
                "description": "Include the full HTML content in the response (default: false)",
                "type": "boolean"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:50c871fb6922e39aff663c6a8cc725dc2070360fe9f036238e09aa864827b586"
        },
        {
          "name": "publish",
          "description": "Publish HTML or Markdown content as a shareable URL. Pass `content` byte-for-byte from the source — do not retype, reformat, minify, summarize, or 'clean up' the input; even one stray character can break inline scripts on the published page. If the content is too large to copy verbatim through the model, use the REST endpoint `POST /v1/artifacts` (or `/v1/artifacts/upload` for ZIPs) instead. For Markdown, optionally include images as base64-encoded data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "content": {
                "description": "The HTML or Markdown content to publish. Copy this verbatim from the source file or buffer — do not modify, reformat, or regenerate it. Whitespace, emojis, comments, and exact character sequences inside <script> and <style> blocks all matter. If you cannot fit the full content unmodified in one tool call, fall back to POST /v1/artifacts via curl.",
                "type": "string"
              },
              "format": {
                "description": "Content format",
                "enum": ["html", "markdown"],
                "type": "string"
              },
              "images": {
                "description": "Images referenced in the markdown content. Only used when format is 'markdown'.",
                "items": {
                  "properties": {
                    "data": {
                      "description": "Base64-encoded image file data",
                      "type": "string"
                    },
                    "path": {
                      "description": "Relative path as referenced in the markdown (e.g., 'images/demo.png')",
                      "type": "string"
                    }
                  },
                  "required": ["data", "path"],
                  "type": "object"
                },
                "type": "array"
              },
              "title": {
                "description": "Artifact title (default: Untitled)",
                "type": "string"
              },
              "visibility": {
                "description": "Visibility (default: unlisted)",
                "enum": ["public", "unlisted"],
                "type": "string"
              }
            },
            "required": ["content", "format"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:041fd35105393acf38bd5df9e3b0426bb6cfe0a8d36df5f6a5f3bf49129c6b23"
        },
        {
          "name": "publish_site",
          "description": "Publish a multi-file HTML site from a base64-encoded ZIP file. The ZIP must contain an index.html at its root. For sites larger than ~10MB — or whenever you have the file on disk — prefer the REST API /v1/artifacts/upload endpoint to avoid base64 overhead and to guarantee byte-faithful upload.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "title": {
                "description": "Site title (default: Untitled)",
                "type": "string"
              },
              "visibility": {
                "description": "Visibility (default: unlisted)",
                "enum": ["public", "unlisted"],
                "type": "string"
              },
              "zip_base64": {
                "description": "Base64-encoded ZIP file containing the site files",
                "type": "string"
              }
            },
            "required": ["zip_base64"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ace46cf10db075cefa3319260e4b6888a7b9cdde4a6b94c9c9673a5e1e98b6c5"
        },
        {
          "name": "versions",
          "description": "List version history of an artifact",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "Artifact ID",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:90fa3feb0a8f9260f94092ff423fd0cbbd97a51fe1bb51ea3d1b48c34850a76d"
        }
      ],
      "digest": "sha256:fd76f46636f3ff78b11c8904d5bedde6986bfaef5098c338b51653eb9291830c"
    }
  }
}
