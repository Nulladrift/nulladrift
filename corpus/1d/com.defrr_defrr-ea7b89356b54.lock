        {
          "name": "defrr_process_renewal",
          "title": "Process renewals",
          "description": "Use when customers renew and you need the renewal worked out: send each contract's terms as they stand, and the renewal's end date and the price for the renewal term. Returns the renewal term and how its price compares with the term before it (in total and per month, since a renewal can be a different length), the billing entry to post, the revised month-by-month schedule, and the total to post by month. With the latest closed month, a renewal processed after it started has its billing and catch-up revenue posted in the first open month instead. The renewal is recognised on the contract's own basis: a different basis is a new contract (defrr_create_contract). Up to 50 renewals per call, each with your own id. Costs 1 credit per renewal (refunded if the call fails). Nothing you send is stored.",
          "inputSchema": {
            "properties": {
              "lockedThrough": {
                "description": "The latest month already closed for changes, as YYYY-MM. Revenue in that month and earlier cannot be changed, so the correction is posted in the next month. Leave out or null if no month is closed.",
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": ["string", "null"]
              },
              "renewals": {
                "description": "The renewals to process, up to 50. Each is charged 1 credit.",
                "items": {
                  "properties": {
                    "id": {
                      "description": "Your own reference for the renewal (a contract or renewal id). Returned with its result so you can match them up. Optional; each must be different.",
                      "maxLength": 64,
                      "minLength": 1,
                      "type": "string"
                    },
                    "renewal": {
                      "description": "The renewal. It starts the day after the contract's last term ends.",
                      "properties": {
                        "endDate": {
                          "description": "YYYY-MM-DD. The renewal term's end date: after the contract's current last end date.",
                          "format": "date",
                          "type": "string"
                        },
                        "exchangeRate": {
                          "description": "Required when the schedule has a currency: how much of your base currency one unit of it is worth on the renewal's start date. priceForRenewalTerm is then in that currency.",
                          "exclusiveMinimum": 0,
                          "type": "number"
                        },
                        "priceForRenewalTerm": {
                          "description": "The renewal term's own total price (not a monthly or yearly rate, and not an increase): a renewal can be shorter or longer than the term before it.",
                          "exclusiveMinimum": 0,
                          "type": "number"
                        }
                      },
                      "required": ["endDate", "priceForRenewalTerm"],
                      "type": "object"
                    },
                    "schedule": {
                      "description": "The contract's terms. The first term needs a startDate; each later term (a renewal) starts the day after the previous one ends when endDateIncluded is true (the default), or on the day the previous one ends when it is false.",
                      "properties": {
                        "currency": {
                          "description": "Only for a contract priced in a foreign currency: its code, such as EUR. Every term's price is then in that currency, and each term needs an exchangeRate.",
                          "pattern": "^[A-Za-z]{3}$",
