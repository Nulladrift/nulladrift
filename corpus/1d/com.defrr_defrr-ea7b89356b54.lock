        {
          "name": "defrr_reprice_contract",
          "title": "Reprice the original term of a contract",
          "description": "Use when the contract's ORIGINAL term (its first term, before any renewal) was priced too high and needs a credit. Renewals keep their own prices; to correct a renewal use defrr_reprice_renewal. Returns the credit note, the revenue to reverse for months already closed, and the corrected revenue month by month. Costs 2 credits (refunded if it fails).",
          "inputSchema": {
            "properties": {
              "correctedPrice": {
                "description": "What the original term should have cost, in the schedule's currency. Must be lower than its current price.",
