        {
          "name": "defrr_create_contract",
          "title": "Create a contract",
          "description": "Use when a new deal is signed and you need its revenue and billing schedule worked out from the terms, without saving it anywhere. Returns every month's billing, revenue and deferred balance, and the contract's totals. For a deal priced in a foreign currency, send currency and exchangeRate and the term prices in that currency. For a contract that started in months that are already closed (a back-dated contract), pass lockedThrough: the months from its start through that month are caught up as one lump of revenue in the first open month, the way defrr's app does, and the result says how much (foreign currency works; a single-term contract needs a quantity of 1, renewals are fine). Nothing is corrected, credited or saved: to record the contract in the user's defrr organization, use defrr_save_contract instead, if you have it. Costs 1 credit (refunded if it fails).",
          "inputSchema": {
            "properties": {
              "currency": {
                "description": "Only when the deal is priced in a foreign currency: its three-letter code, such as EUR. Then every term's price is in that currency.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "exchangeRate": {
                "description": "Required with currency: how much of the organization's base currency ONE unit of that currency is worth (1 EUR = 1.8 NZD is 1.8). The schedule and totals come back in the base currency, with the foreign prices beside them.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "lockedThrough": {
                "description": "Only for a back-dated contract: the latest closed month, as YYYY-MM (it must be on or after the contract's start month and before its last month). Revenue for the months through it is recognised together in the next month.",
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              },
              "schedule": {
                "description": "The contract's terms. The first term needs a startDate; each later term (a renewal) starts the day after the previous one ends when endDateIncluded is true (the default), or on the day the previous one ends when it is false.",
                "properties": {
                  "endDateIncluded": {
                    "description": "Always send it. True if a term's end date is its last day (a year from 1 Mar 2026 ends 2027-02-28): use true unless the user's own dates show otherwise. False if the end date is the first day of the next term, as when the user gives the same calendar day a whole number of months later (10 Feb 2027 to 10 Feb 2028, so the last covered day is 9 Feb 2028). Defaults to true if left out.",
                    "type": "boolean"
                  },
                  "recognition": {
                    "description": "How revenue is recognised: 'exact' per day, or 'smooth' as equal months.",
                    "enum": ["exact", "smooth"],
                    "type": "string"
                  },
                  "terms": {
                    "description": "The original term first, then each renewal in order.",
                    "items": {
                      "properties": {
                        "endDate": {
                          "description": "YYYY-MM-DD.",
                          "format": "date",
                          "type": "string"
                        },
                        "price": {
                          "description": "The term's total price: for all its units, not per unit.",
                          "minimum": 0,
                          "type": "number"
                        },
                        "quantity": {
                          "description": "Optional: how many units (seats) the term's total price covers, 1 if you leave it out. It doesn't change the schedule, which follows the total; it is recorded with the contract so its unit price can be seen.",
                          "minimum": 1,
                          "type": "integer"
                        },
                        "startDate": {
                          "description": "YYYY-MM-DD. Required on the first term; leave out on renewals.",
                          "format": "date",
                          "type": "string"
                        }
                      },
                      "required": ["endDate", "price"],
                      "type": "object"
                    },
                    "maxItems": 12,
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": ["recognition", "terms"],
                "type": "object"
              }
            },
            "required": ["schedule"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
