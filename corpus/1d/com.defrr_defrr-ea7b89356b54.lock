        {
          "name": "defrr_create_waterfall",
          "title": "Create a revenue waterfall for several contracts",
          "description": "Use when you need the deferred revenue roll-forward for a set of contracts: send up to 50 contracts' terms and get back, for each contract and for all of them together, every month's billing, revenue and ending deferred balance (opening deferred balance + billing - revenue = ending). Each contract is built like defrr_create_contract. Everything or nothing: if one contract is rejected the call fails and nothing is charged. Costs 1 credit per contract (refunded if it fails). Nothing you send is stored. For more than 50 contracts, send them in batches of up to 50, each saying which batch it is (batch: number and of) and passing in the carry returned by the batch before; the last batch returns grandTotal for all of them. For a very large set, call the REST API from a script instead of through the model.",
          "inputSchema": {
            "properties": {
              "batch": {
                "description": "Only when sending more than 50 contracts in several calls: which call this is. Send batch 1 first, then 2, and so on, in order.",
                "properties": {
                  "number": {
                    "description": "This batch's position, starting at 1.",
                    "minimum": 1,
                    "type": "integer"
                  },
                  "of": {
                    "description": "How many batches there are in all.",
                    "maximum": 400,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "required": ["number", "of"],
                "type": "object"
              },
              "carry": {
                "description": "From batch 2 on: the carry returned by the previous batch, passed back exactly as it was given. Not used on batch 1.",
                "type": "string"
              },
              "contracts": {
                "description": "The contracts to include, up to 50. Each is charged 1 credit.",
                "items": {
                  "properties": {
                    "id": {
                      "description": "Your own reference for the contract (a customer or contract id). Returned with its rows so you can match them up. Optional; each must be different.",
                      "maxLength": 64,
                      "minLength": 1,
                      "type": "string"
                    },
                    "schedule": {
                      "description": "The contract's terms. The first term needs a startDate; each later term (a renewal) starts the day after the previous one ends when endDateIncluded is true (the default), or on the day the previous one ends when it is false.",
                      "properties": {
                        "endDateIncluded": {
                          "description": "Always send it. True if a term's end date is its last day (a year from 1 Mar 2026 ends 2027-02-28): use true unless the user's own dates show otherwise. False if the end date is the first day of the next term, as when the user gives the same calendar day a whole number of months later (10 Feb 2027 to 10 Feb 2028, so the last covered day is 9 Feb 2028). Defaults to true if left out.",
                          "type": "boolean"
                        },
                        "recognition": {
                          "description": "How revenue is recognised: 'exact' per day, or 'smooth' as equal months.",
                          "enum": ["exact", "smooth"],
                          "type": "string"
                        },
                        "terms": {
                          "description": "The original term first, then each renewal in order.",
                          "items": {
                            "properties": {
                              "endDate": {
                                "description": "YYYY-MM-DD.",
                                "format": "date",
                                "type": "string"
                              },
                              "price": {
                                "description": "The term's total price: for all its units, not per unit.",
                                "minimum": 0,
                                "type": "number"
                              },
                              "quantity": {
                                "description": "Optional: how many units (seats) the term's total price covers, 1 if you leave it out. It doesn't change the schedule, which follows the total; it is recorded with the contract so its unit price can be seen.",
                                "minimum": 1,
                                "type": "integer"
                              },
                              "startDate": {
                                "description": "YYYY-MM-DD. Required on the first term; leave out on renewals.",
                                "format": "date",
                                "type": "string"
                              }
                            },
                            "required": ["endDate", "price"],
                            "type": "object"
                          },
                          "maxItems": 12,
                          "minItems": 1,
                          "type": "array"
                        }
                      },
                      "required": ["recognition", "terms"],
                      "type": "object"
                    }
                  },
                  "required": ["schedule"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "shape": {
                "description": "'wide' (the default) gives each contract's months as lists. 'rows' gives one row per contract per month, ready for a spreadsheet or a database.",
                "enum": ["wide", "rows"],
                "type": "string"
              }
            },
            "required": ["contracts"],
            "type": "object"
          },
