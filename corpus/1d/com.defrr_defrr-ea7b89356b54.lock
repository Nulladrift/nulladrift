        {
          "name": "defrr_usage_billing",
          "title": "Price usage",
          "description": "Use when customers are billed on what they use and you need the usage turned into what it costs, month by month. Send each customer-and-product's pricing (flat or volume tiers, a prepaid credit balance, or a hybrid: a fixed monthly fee with included units and a price per unit above them) and the quantity used in each month; get back each month's revenue, the total across all of them, and any prepaid overage (units beyond the balance, flagged and not priced). A hybrid line returns revenue (the fixed fee, which excludes overage), overage (units over the allowance, priced) and revenueInclOverage for each month. Without a startDate the allowance starts again each month you list. With a startDate (and dated usage entries) the cycles follow the contract's anniversary: the fee is booked in full in the month each cycle starts, whether or not anything was used, and the overage in the month the cycle ends; the response also lists each cycle. Quantities are what was used in that month, not a running total. Tiers price band by band, and the bands start again each month. Costs 1 credit per line (refunded if it fails). Nothing you send is stored.",
          "inputSchema": {
            "properties": {
              "breakdown": {
                "description": "True to list, for each flat or volume month, the units and amount in each band. Defaults to false.",
                "type": "boolean"
              },
              "lines": {
                "description": "The customer-and-product lines to price, up to 50. Each is charged 1 credit.",
                "items": {
                  "properties": {
                    "id": {
                      "description": "Your own reference for the line (a customer and product). Returned with its months so you can match them up. Optional; each must be different.",
                      "maxLength": 64,
                      "minLength": 1,
                      "type": "string"
                    },
                    "pricing": {
                      "description": "How the usage is priced. flat and volume use tiers; prepaid_credit uses unitPrice and openingBalance; hybrid uses baseFee, includedUnits and overageUnitPrice.",
                      "properties": {
                        "baseFee": {
                          "description": "For hybrid: the fixed fee for each month listed. It is the month's revenue and excludes overage.",
                          "minimum": 0,
                          "type": "number"
                        },
                        "cycle": {
                          "description": "For hybrid: the cycle length. Only monthly is supported, and it is the default.",
                          "enum": ["monthly"],
                          "type": "string"
                        },
                        "includedUnits": {
                          "description": "For hybrid: the units each month's fee includes.",
                          "minimum": 0,
                          "type": "number"
                        },
                        "model": {
                          "description": "flat and volume are both priced band by band, the way the defrr app prices them.",
                          "enum": ["flat", "volume", "prepaid_credit", "hybrid"],
                          "type": "string"
                        },
                        "openingBalance": {
                          "description": "For prepaid_credit: the units left before the first month listed. Defaults to 0.",
                          "minimum": 0,
                          "type": "number"
                        },
                        "overageUnitPrice": {
                          "description": "For hybrid: the price of each unit above includedUnits in a month.",
                          "minimum": 0,
                          "type": "number"
                        },
                        "tiers": {
                          "description": "For flat and volume: each tier prices only the units inside it. Exactly one tier, the last, has no limit (limit null).",
                          "items": {
                            "properties": {
                              "limit": {
                                "description": "The most units this tier covers in a month, counted from zero (so tiers of 100000 and 500000 mean the first 100000 units, then the next 400000). Null for the last tier.",
                                "exclusiveMinimum": 0,
                                "type": ["number", "null"]
                              },
                              "price": {
                                "description": "Price per unit in this tier.",
                                "minimum": 0,
                                "type": "number"
                              }
                            },
                            "required": ["price"],
                            "type": "object"
                          },
                          "maxItems": 20,
                          "minItems": 1,
                          "type": "array"
                        },
                        "unitPrice": {
                          "description": "For prepaid_credit: the price of one unit drawn down.",
                          "minimum": 0,
                          "type": "number"
                        }
                      },
                      "required": ["model"],
                      "type": "object"
                    },
                    "startDate": {
                      "description": "Hybrid only: the date the contract starts, YYYY-MM-DD. The cycles then follow the contract: each starts on the anniversary of this date (the same day each month, or the month's last day when it has no such day). The fee is the revenue of the month a cycle starts in, in full and whether or not anything was used; the overage of a cycle falls in the month it ends in. With a startDate, usage entries carry a date instead of a period.",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "through": {
                      "description": "Hybrid with a startDate only: price every cycle that starts on or before this date, YYYY-MM-DD, including cycles with no usage. Defaults to the date of the last usage entry. To stop a subscription that has ended or isn't being paid, set it to the date it stopped or to the start of the last paid cycle.",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "usage": {
                      "description": "Without a startDate: the units used in each month, up to 24 months, one entry per month (a month listed twice is refused). With a startDate (hybrid): dated entries, up to 1000, each assigned to the contract cycle its date falls in; the same date may appear more than once and is added up.",
                      "items": {
                        "properties": {
                          "date": {
                            "description": "The day the units were used, YYYY-MM-DD. Only with a startDate, on or after it.",
