      "serverInfo": {
        "name": "defrr",
        "title": "defrr revenue recognition",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "defrr works out contract revenue and billing from the terms you send, with nothing stored. It can build a new contract's month-by-month schedule (defrr_create_contract) or the deferred revenue roll-forward for up to 50 contracts at a time, with their total (defrr_create_waterfall); process contract renewals, with the billing entry and any catch-up for closed months (defrr_process_renewal); price a customer's usage under flat, volume, prepaid-credit or fixed-fee-plus-overage pricing, month by month (defrr_usage_billing); and work out what a price correction or a cancellation does to a contract (the reprice and cancel tools). For a correction, send the contract's terms (dates and prices) and the latest month already closed for changes; defrr returns the credit note, the reversal to post for closed months, and the corrected revenue by month. Each calculation costs credits; defrr_get_credit_balance is free. A call that fails is refunded. This session has no API key, so the tools can be listed here but not called. Create a free key at https://defrr.com/developers/account and send it as 'Authorization: Bearer dfr_live_...' to run them.",
      "tools": [
        {
          "name": "defrr_cancel_contract",
          "title": "Cancel a contract",
          "description": "Use when a whole contract is voided and refunded. Reverses everything recognised in closed months and removes the rest. Costs 2 credits (refunded if it fails).",
          "inputSchema": {
            "properties": {
              "lockedThrough": {
                "description": "The latest month already closed for changes, as YYYY-MM. Revenue in that month and earlier cannot be changed, so the correction is posted in the next month. Leave out or null if no month is closed.",
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": ["string", "null"]
              },
              "schedule": {
                "description": "The contract's terms. The first term needs a startDate; each later term (a renewal) starts the day after the previous one ends when endDateIncluded is true (the default), or on the day the previous one ends when it is false.",
                "properties": {
                  "currency": {
                    "description": "Only for a contract priced in a foreign currency: its code, such as EUR. Every term's price is then in that currency, and each term needs an exchangeRate.",
                    "pattern": "^[A-Za-z]{3}$",
                    "type": "string"
                  },
                  "endDateIncluded": {
                    "description": "Always send it. True if a term's end date is its last day (a year from 1 Mar 2026 ends 2027-02-28): use true unless the user's own dates show otherwise. False if the end date is the first day of the next term, as when the user gives the same calendar day a whole number of months later (10 Feb 2027 to 10 Feb 2028, so the last covered day is 9 Feb 2028). Defaults to true if left out.",
                    "type": "boolean"
                  },
                  "exchangeRate": {
                    "description": "With currency: the rate for every term that has none of its own.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "recognition": {
                    "description": "How revenue is recognised: 'exact' per day, or 'smooth' as equal months.",
                    "enum": ["exact", "smooth"],
                    "type": "string"
                  },
                  "terms": {
                    "description": "The original term first, then each renewal in order.",
                    "items": {
                      "properties": {
                        "endDate": {
                          "description": "YYYY-MM-DD.",
                          "format": "date",
                          "type": "string"
                        },
                        "exchangeRate": {
                          "description": "With currency: how much of your base currency ONE unit of the foreign currency was worth when this term was booked. Corrections use it, so they agree with what was billed.",
                          "exclusiveMinimum": 0,
                          "type": "number"
                        },
                        "price": {
                          "description": "The term's total price: for all its units, not per unit.",
                          "minimum": 0,
                          "type": "number"
                        },
                        "quantity": {
                          "description": "Optional: how many units (seats) the term's total price covers, 1 if you leave it out. It doesn't change the schedule, which follows the total; it is recorded with the contract so its unit price can be seen.",
                          "minimum": 1,
                          "type": "integer"
                        },
                        "startDate": {
                          "description": "YYYY-MM-DD. Required on the first term; leave out on renewals.",
                          "format": "date",
                          "type": "string"
                        }
                      },
                      "required": ["endDate", "price"],
                      "type": "object"
                    },
                    "maxItems": 12,
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": ["recognition", "terms"],
                "type": "object"
              }
            },
            "required": ["schedule"],
            "type": "object"
          },
