                            "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                            "type": "string"
                          },
                          "quantity": {
                            "description": "Units used in that month (or on that day): not a running total.",
                            "minimum": 0,
                            "type": "number"
                          }
                        },
                        "required": ["quantity"],
                        "type": "object"
                      },
                      "maxItems": 1000,
                      "minItems": 0,
                      "type": "array"
                    }
                  },
