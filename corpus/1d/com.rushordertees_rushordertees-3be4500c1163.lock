                    "description": "The date free delivery arrives, YYYY-MM-DD.",
                    "type": "string"
                  },
                  "delivery_days": {
                    "description": "Business days from now to the customer's door with free delivery.",
                    "type": "integer"
                  },
                  "id": {
                    "description": "Pass this to choose_option.",
                    "type": "string"
                  },
                  "meets_deadline": {
                    "description": "Whether free delivery arrives by the customer's deadline.",
                    "type": ["boolean", "null"]
                  },
                  "method": {
                    "type": "string"
                  },
                  "quantity": {
                    "type": "integer"
                  },
                  "rush_delivers_by": {
                    "description": "The earliest date rush delivery arrives, YYYY-MM-DD; its shipping is priced at checkout, where the customer chooses the speed.",
                    "type": ["string", "null"]
                  },
                  "rush_delivery_days": {
                    "description": "Business days to the door with rush delivery; null when rush is no sooner.",
                    "type": ["integer", "null"]
                  },
                  "rush_meets_deadline": {
                    "type": ["boolean", "null"]
                  },
                  "summary": {
                    "description": "Customer-ready description of the option.",
                    "type": "string"
                  },
                  "total_cents": {
                    "type": "integer"
                  },
                  "unit_price_cents": {
                    "type": "integer"
                  }
                },
                "required": ["currency", "delivers_by", "delivery_days", "id", "method", "quantity", "summary", "total_cents", "unit_price_cents"],
                "type": ["object", "null"]
              },
              "expires_at": {
                "description": "When an unsaved order expires; null once it is saved to an account or paid.",
                "type": ["string", "null"]
              },
              "garment": {
                "description": "The garment on the order, and what mockup_url shows. Name it when you show the picture; when it is provisional, say so.",
                "properties": {
                  "brand": {
                    "type": ["string", "null"]
                  },
                  "color": {
                    "description": "The shade on the order, as the mill names it.",
                    "type": "string"
                  },
                  "fabric": {
                    "description": "The fabric family in customer words.",
                    "type": ["string", "null"]
                  },
                  "is_provisional": {
                    "description": "True while alternatives are on offer and the customer has not picked: this is the garment we will use unless they choose another.",
                    "type": "boolean"
                  },
                  "materials": {
                    "description": "The mill's own material words, e.g. \"Tri-Blend (Poly/Cotton/Rayon)\".",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "name": {
                    "type": "string"
                  },
                  "size": {
                    "type": "string"
                  },
                  "style": {
