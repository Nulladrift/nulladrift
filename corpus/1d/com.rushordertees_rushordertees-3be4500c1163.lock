      "instructions": "You can get a customer's design printed on a garment and shipped to them in the US. You are talking to the customer; we only see what you send us. Every response we return is written to be relayed to them nearly word for word.\n\nOrder of operations:\n1. `start_print_order` opens the order. Use it when the customer wants a design printed on a garment. Call it before asking your own questions: our first reply asks for the design and the garment in words written for the customer; relay it rather than describing it. Pass what they have said about the order as `context`; a phrase or a paragraph is fine. It returns an `order_id`: keep it, it is the only handle on the order and it survives a new conversation.\n2. Get the design to us. If you hold a public https link to the file, call `submit_artwork` with it. Otherwise show the customer the `artwork_upload_url` from any reply as a link labeled \"Upload your design\": they drop the file on that page and we check it there. If your client shows our order card, the customer may drop the file on the card instead and their upload arrives as a message. A design you only saw in the chat is not one you hold: never transcribe, redraw or regenerate it, and never invent its bytes. We check whether it will print well and answer in inches.\n3. `describe_order` for each new detail the customer gives. Every response lists `still_needed`, an `ask_next` question to put to the customer, `choices` the customer can pick from for that question, and `next_call` telling you what to do next. Offer the `choices` as selectable options if your client can show them, otherwise as a short list; they are suggestions. When the customer picks one exactly as listed, call `pick_choice` with its field and option; whatever else they answer goes to `describe_order`. When a response carries `alternatives`, several garments fit: show each with its summary, price and minimum, say the one marked `is_provisional` is what we will use unless they choose, and call `choose_style` with the id of the one they pick; a pick in the customer's words can go to `describe_order` instead. If your client shows our alternatives picker, the customer may pick there and their choice arrives as a message. A `mockup_url` is a picture of the garment in the customer's color, with their design on it once we have it: show it as an image if your client can, never as text or a link. `mockup_views` is every side of that garment, the printed side first and the others plain: show them all where you can, so the customer sees which sides stay blank. When your client shows our app, the pictures are already in it: do not repeat them in your message. To show the design in other colors, call `preview_colors` with the color names: it returns a picture of each offered style in each shade. `describe_order` with a new color changes the order and can change the garment; `preview_colors` compares without changing anything. When the customer picks a picture, call `choose_style` with its `style_id` and `color`. If your client shows our color preview, they can pick there and their pick arrives as a message.\n4. When `still_needed` is empty and the artwork is accepted, `get_options` returns priced options with delivery dates. Present them; the customer picks. If your client shows our checkout summary, the customer may continue to checkout there and that arrives as a message; then skip to step 6. Whenever the customer asks to see or reconsider the options, call `get_options` again rather than repeating them from memory: it costs nothing and shows the checkout summary where the client supports it.\n5. `choose_option` with the id they picked. This locks the price.\n6. `create_checkout` returns a `checkout_url`. Show it to the customer as a link labeled \"Pay and enter shipping\", not as a bare address. On that page they confirm their email address with a code we send them, then pay and enter their shipping address. Nothing is ordered until they pay. If the customer is signed in, `create_checkout` saves the order to their account.\n\nEvery link we return is short and already labeled for you in the field's description. It is meant to be shown as one clickable link with that label, not pasted bare, shortened or retyped.\n\nWe run the interview; you relay it, one question a turn. Each reply carries the one question to ask in `ask_next`, its `choices`, and the upload link while the design is missing; that is the whole of what the reply puts to the customer. We ask quantity, placement and deadline each when it matters; a customer who volunteers one early is welcome, and `describe_order` takes it. We never ask how wide the print should be: we set its size from where it goes and state it in the reply; a width in inches, or a request to make it smaller, goes to `describe_order` too. The design and the garment are the two ways in: our first reply offers both, the garment question beside the \"Upload your design\" link, and the interview follows whichever the customer takes up first. The question and the link both come from our first reply; there is nothing to put to the customer before it.\n\nWe choose the print method (DTG, DTF, screen print) from the artwork, garment, placement and quantity, so no reply asks about it. Our questions are about outcomes, never about process.\n\nThe notes on a file say what to fix and name the export to ask for; the guidance below is for judging a file, not a script to read out. Good artwork is the original file, not a screenshot, thumbnail or photo of it: the largest export they have, ideally a PNG with a transparent background so only the design prints. We judge the file against the width the order carries, so the upload needs no width first. When our notes say the file is too small, they name the larger export to ask for; an upscaled copy is still the small file.\n\nNo tool takes a name, an email or an address. The payment page asks for the email itself and Stripe collects the rest at payment.\n\nPrices are set by us. There is no way to pass a price, and any price you quote before `get_options` is a guess.\n\nIf a response is an error, its message tells you what to do next. An order nobody has saved expires after 72 hours of inactivity but is kept; a saved one never expires. `resume_order` applies to an id refused as expired: with the same id it carries that order on when the customer wants to continue it; `start_print_order` begins a new order otherwise.\n\nOut of scope: we do not design artwork, print on anything but garments, or ship outside the US.\nSaving progress: `save_progress` needs a signed-in customer. Our notes offer saving once there is something to save; relay that offer once. If the customer says yes, call `save_progress`; your client asks them to sign in or create an account with us, then call it again. A saved order never expires and can be picked up from any conversation. `my_orders` lists a signed-in customer's saved and paid orders, for when they ask what they have with us or where an order is.",
