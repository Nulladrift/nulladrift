      "serverInfo": {
        "name": "rushordertees",
        "title": "RushOrderTees",
        "version": "0.52.3",
        "description": "Prints a customer's design on a garment and ships it in the US: order intake, an artwork check in inches, mockups, priced options with delivery dates, and checkout.",
        "websiteUrl": "https://mcp.rushordertees.com"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "prompts": {
          "listChanged": false
