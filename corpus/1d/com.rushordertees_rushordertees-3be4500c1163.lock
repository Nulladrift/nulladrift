        {
          "name": "describe_order",
          "title": "Describe the order",
          "description": "Records more about what the customer wants — an answer to ask_next, a correction, or a whole paragraph — and reports what is still needed. Call it each time the customer gives a new detail. In clients that render our app the customer sees their design on the garment when it changes, and the styles when several fit; a pick made there arrives as a message. The question in ask_next is for the customer either way: ask it. Also records a decision about the order: a stop, an objection to the price or the date, or a request we do not offer. It belongs to the order's record, and the reply says what the order still needs.",
          "inputSchema": {
            "properties": {
              "context": {
                "description": "What the customer said, in their own words. Garment, color, size, quantity, print width in inches, placement, deadline — whatever is new. Unstructured prose is fine.",
                "type": "string"
              },
              "order_id": {
                "description": "The order_id returned by start_print_order.",
                "type": "string"
              }
            },
            "required": ["context", "order_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "alternatives": {
                "description": "Present from the moment several styles fit until the customer picks, beside whatever ask_next asks: show all of them with their summaries, prices and minimums, say the one marked is_provisional is what we will use unless they choose, and call choose_style with the id they pick (or send \"any\" to describe_order to leave it to us).",
                "items": {
                  "properties": {
                    "brand": {
                      "type": ["string", "null"]
                    },
                    "color_code": {
                      "type": ["string", "null"]
                    },
                    "cut": {
                      "description": "How it hangs: loose, standard or fitted, in customer words.",
                      "type": ["string", "null"]
                    },
                    "fabric": {
                      "type": ["string", "null"]
                    },
                    "id": {
                      "description": "Pass this to choose_style when the customer picks it.",
                      "type": "string"
                    },
                    "is_provisional": {
                      "description": "True on the style we will use unless the customer picks another.",
                      "type": "boolean"
                    },
                    "minimum": {
                      "description": "The minimum as the storefront words it (\"Minimum 10\", \"No minimum\"). Say it with the price.",
                      "type": "string"
                    },
                    "minimum_quantity": {
                      "description": "The fewest pieces the style is sold in.",
                      "type": "integer"
                    },
                    "mockup_url": {
                      "description": "An image address: show it as a picture where your client can, unless our app already shows it in the chat, never as text or as a link, and never describe it in place of the summary.",
                      "type": ["string", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "price_label": {
                      "description": "\"cheapest\" or \"priciest\" of the three, when they differ.",
                      "type": ["string", "null"]
                    },
                    "price_tier": {
                      "type": ["string", "null"]
                    },
                    "priced_at_quantity": {
                      "description": "The quantity the price is for: the order's, or 1 until the customer says how many, or the style's minimum when that is more. It drops at 12 and again at 24.",
                      "type": "integer"
                    },
                    "rank": {
                      "description": "1 is the most popular.",
                      "type": "integer"
                    },
                    "style": {
                      "description": "The mill's style code.",
                      "type": "string"
                    },
                    "summary": {
                      "description": "One line on what sets it apart. Relay it as written.",
                      "type": "string"
                    },
                    "unit_price_cents": {
                      "description": "Garment and printing, per garment, at priced_at_quantity.",
                      "type": "integer"
                    },
                    "weight": {
                      "description": "Lightweight, midweight or heavyweight, in customer words.",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["id", "is_provisional", "minimum", "minimum_quantity", "name", "priced_at_quantity", "rank", "style", "summary", "unit_price_cents"],
                  "type": "object"
                },
                "type": ["array", "null"]
              },
              "artwork": {
                "properties": {
                  "artwork_id": {
                    "type": ["string", "null"]
                  },
                  "findings": {
                    "description": "What we measured: the crisp width, the background, the file.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "max_print_width_in": {
                    "description": "Largest width, in inches, that prints crisply.",
                    "type": ["number", "null"]
                  },
                  "review_notes": {
                    "description": "What our design reviewer said about this file on this garment: the background, which garment colors suit it, fine detail. Relay it when the customer asks about color or the design, or has not heard it yet; it was shown on the upload page but you did not see it.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "suggested_colors": {
                    "description": "The garment colors this design suits among those the customer can still choose, best first, scored from the design's own colors: shades once a garment is named, color families before. They lead the color choices. Empty once the color is decided.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "verdict": {
                    "enum": ["accepted", "warned", "rejected"],
                    "type": "string"
