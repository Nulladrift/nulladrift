                },
                "required": ["color", "is_provisional", "materials", "name", "size", "style"],
                "type": ["object", "null"]
              },
              "mockup_changed": {
                "description": "True when mockup_views shows the design on the garment differently from the last time it was shown: a new garment, color, design, placement or width. Show the pictures again when it is true.",
                "type": "boolean"
