{
  "lockfileVersion": 2,
  "subjects": {
    "ca.structureclerk/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://structureclerk.ca/api/mcp-http"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "structureclerk",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "algorithmic_compliance_assessment",
          "description": "Assess algorithmic compliance maturity for AI systems. Returns applicable frameworks (EU AI Act, Law 25, AIDA/C-27, ISO 42001, NIST AI RMF), sector-specific obligations and assessment dimensions.",
          "inputSchema": {
            "properties": {
              "jurisdiction": {
                "description": "ISO code (e.g. QC, FR, DE, US, EU)",
                "type": "string"
              },
              "sector": {
                "description": "e.g. health, finance, hr, legal, tech, education, retail, manufacturing",
                "type": "string"
              }
            },
            "required": ["jurisdiction"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:263313d32c216949ebb4d401ca1471968f45b3621001cbdda04e7bfc88a41ede"
        },
        {
          "name": "authority_decide",
          "description": "Deterministic, rule-based advisory decision (no LLM) on whether an AI agent may execute an action: ALLOW, APPROVE (human approval required), DENY (human-only decision) or ESCALATE (doubt threshold). Cites applicable frameworks per jurisdiction and sector, and returns an evidence record. Advisory only: StructureClerk decides, your infrastructure enforces.",
          "inputSchema": {
            "properties": {
              "action": {
                "properties": {
                  "amount": {
                    "type": "number"
                  },
                  "currency": {
                    "description": "3-letter code, e.g. CAD",
                    "type": "string"
                  },
                  "data_categories": {
                    "description": "e.g. personal, health, biometric, minors, financial",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "irreversible": {
                    "type": "boolean"
                  },
                  "type": {
                    "description": "Dotted action type, e.g. payment.execute, read.contract",
                    "type": "string"
                  }
                },
                "required": ["type"],
                "type": "object"
              },
              "agent": {
                "properties": {
                  "autonomy_level": {
                    "description": "1 supervised, 2 augmented, 3 autonomous",
                    "maximum": 3,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "id": {
                    "description": "Caller-assigned agent identifier",
                    "type": "string"
                  }
                },
                "required": ["autonomy_level", "id"],
                "type": "object"
              },
              "context": {
                "properties": {
                  "jurisdictions": {
                    "description": "ISO codes, e.g. QC, FR, EU",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "sector": {
                    "description": "e.g. health, finance, public, insurance, tech",
                    "type": "string"
                  }
                },
                "required": ["jurisdictions", "sector"],
                "type": "object"
              }
            },
            "required": ["action", "agent", "context"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5e98489f3a86997127ff844db118a4b5fdb6b84f39dd28f64effcad081fb4cf0"
        },
        {
          "name": "compliance_check",
          "description": "Analyze regulatory obligations for a company based on jurisdiction, size and sector. Returns applicable frameworks, risk level and priority actions.",
          "inputSchema": {
            "properties": {
              "company_size": {
                "description": "e.g. 1-10, 11-50, 51-250, 250+",
                "type": "string"
              },
              "jurisdiction": {
                "description": "ISO code (e.g. QC, FR, DE, US)",
                "type": "string"
              },
              "processes_personal_data": {
                "type": "boolean"
              },
              "sector": {
                "description": "e.g. tech, health, finance, retail",
                "type": "string"
              },
              "uses_ai": {
                "type": "boolean"
              }
            },
            "required": ["jurisdiction"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:47fda9119c0de14f7cf41d0bc4112194395b92db790e68f42ea0238408cabdae"
        },
        {
          "name": "compliance_roadmap",
          "description": "Generate a phased compliance action plan with cost estimates adapted to SME budgets.",
          "inputSchema": {
            "properties": {
              "budget": {
                "description": "low, medium or high",
                "type": "string"
              },
              "company_size": {
                "description": "e.g. 1-10, 11-50, 51-250, 250+",
                "type": "string"
              },
              "jurisdiction": {
                "description": "ISO code (e.g. QC, FR, DE, US)",
                "type": "string"
              },
              "sector": {
                "type": "string"
              },
              "timeline_months": {
                "description": "Number of months for the plan",
                "type": "number"
              }
            },
            "required": ["jurisdiction"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:07b78c01aaa8d789ad9f49445bab1558aae3ca0b451ba07fef97854162110de9"
        },
        {
          "name": "jurisdiction_map",
          "description": "Get applicable regulatory frameworks for a jurisdiction. Without a jurisdiction parameter, returns all 192 jurisdictions.",
          "inputSchema": {
            "properties": {
              "jurisdiction": {
                "description": "ISO code (e.g. QC, FR, DE). Omit for full list.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:91457d0f6052a51de9bd85348125d95166112d2611bfe615e1d3423c0b825d5d"
        }
      ],
      "digest": "sha256:f1b5be07d78401cf3fbf24997630f642d9a83baeb304b02cfa4b13b2a6d823f5"
    }
  }
}
