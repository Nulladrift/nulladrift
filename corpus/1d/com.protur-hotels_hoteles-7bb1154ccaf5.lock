{
  "lockfileVersion": 2,
  "subjects": {
    "com.protur-hotels/hoteles": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://chatbot.protur-hotels.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "protur-hoteles",
        "title": "Protur Hotels",
        "version": "1.1.0",
        "websiteUrl": "https://protur-hotels.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "MCP oficial de Protur Hotels (https://protur-hotels.com): información confirmada de sus hoteles en Mallorca y Almería, solo lectura. Empieza con listar_hoteles; para un dato concreto usa buscar o info_hotel. Si no hay resultado, no inventes la respuesta. Precios y disponibilidad reales: disponibilidad, comparar_hoteles y fechas_mas_baratas (con enlace de reserva directa); no inventes precios.",
      "tools": [
        {
          "name": "buscar",
          "description": "Busca un texto en las preguntas y respuestas confirmadas. Con hotel, solo en ese; sin hotel, en todos los que tengas asignados (los resultados indican el hotel).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hotel": {
                "type": "string"
              },
              "limite": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "texto": {
                "type": "string"
              }
            },
            "required": ["texto"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:01f451bb31c1b7940466e3c8f7f584d17c2c2d9cd0bbff6a8a27cc59b278df14"
        },
        {
          "name": "cartas",
          "description": "Enlaces públicos a las cartas (bebidas, snacks, vinos, restaurantes) de un hotel.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hotel": {
                "type": "string"
              }
            },
            "required": ["hotel"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7b6c7fecb6c63f4436e3f9b6b86a8d1c9ae85eb4e6ab6dce655e132dd0666acc"
        },
        {
          "name": "comparar_hoteles",
          "description": "Compara el precio más barato de la estancia en varios hoteles de Protur para las mismas fechas y huéspedes, ordenado de menor a mayor, con enlace de reserva de cada uno.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "entrada": {
                "description": "Fecha de entrada, YYYY-MM-DD",
                "type": "string"
              },
              "habitaciones": {
                "description": "Una entrada por habitación",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "adultos": {
                      "maximum": 30,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "bebes": {
                      "description": "Bebés menores de 2 años",
                      "maximum": 10,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "edades_ninos": {
                      "description": "Edad de cada menor",
                      "items": {
                        "maximum": 17,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["adultos"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "hoteles": {
                "description": "Opcional: slugs o nombres de los hoteles (por defecto, todos los que se reservan online)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "idioma": {
                "description": "Idioma de los textos y del enlace de reserva (por defecto es)",
                "enum": ["es", "en", "de", "fr", "ca"],
                "type": "string"
              },
              "salida": {
                "description": "Fecha de salida, YYYY-MM-DD",
                "type": "string"
              }
            },
            "required": ["entrada", "habitaciones", "salida"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5f8e42dea2ce9382301dbf3dcc3ad852be04486639a2d56715acfd5c673d15da"
        },
        {
          "name": "disponibilidad",
          "description": "Disponibilidad y precios reales de un hotel para unas fechas y unos huéspedes: tipos de habitación libres, tarifas, régimen, si se puede cancelar, y enlace para reservar directamente con esa búsqueda.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "entrada": {
                "description": "Fecha de entrada, YYYY-MM-DD",
                "type": "string"
              },
              "habitaciones": {
                "description": "Una entrada por habitación",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "adultos": {
                      "maximum": 30,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "bebes": {
                      "description": "Bebés menores de 2 años",
                      "maximum": 10,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "edades_ninos": {
                      "description": "Edad de cada menor",
                      "items": {
                        "maximum": 17,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["adultos"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "hotel": {
                "description": "Slug o nombre del hotel (ver listar_hoteles)",
                "type": "string"
              },
              "idioma": {
                "description": "Idioma de los textos y del enlace de reserva (por defecto es)",
                "enum": ["es", "en", "de", "fr", "ca"],
                "type": "string"
              },
              "salida": {
                "description": "Fecha de salida, YYYY-MM-DD",
                "type": "string"
              }
            },
            "required": ["entrada", "habitaciones", "hotel", "salida"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:24fa4a9fec4ff89399861361b96c5ed7bc8a36359620efe75389b041db3d6953"
        },
        {
          "name": "fechas_mas_baratas",
          "description": "Para fechas flexibles: busca las entradas más baratas de una estancia de N noches dentro de un rango (máximo 62 días), confirma el precio real y da el enlace de reserva. «Semana» = 7 noches.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "desde": {
                "description": "Primer día posible de entrada, YYYY-MM-DD",
                "type": "string"
              },
              "habitaciones": {
                "description": "Una entrada por habitación",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "adultos": {
                      "maximum": 30,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "bebes": {
                      "description": "Bebés menores de 2 años",
                      "maximum": 10,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "edades_ninos": {
                      "description": "Edad de cada menor",
                      "items": {
                        "maximum": 17,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["adultos"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "hasta": {
                "description": "Último día posible de salida, YYYY-MM-DD",
                "type": "string"
              },
              "hoteles": {
                "description": "Opcional: slugs o nombres de los hoteles (por defecto, todos los que se reservan online)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "idioma": {
                "description": "Idioma de los textos y del enlace de reserva (por defecto es)",
                "enum": ["es", "en", "de", "fr", "ca"],
                "type": "string"
              },
              "noches": {
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["desde", "habitaciones", "hasta", "noches"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6ea1ce798aa883ea347d6c9f09595d7783d772d9fb783d34b21fa9f748265100"
        },
        {
          "name": "ficha_hotel",
          "description": "Datos generales de un hotel (categoría, contacto, periodo de apertura…) y los temas de información que tiene.",
          "inputSchema": {
            "additionalProperties": false,
