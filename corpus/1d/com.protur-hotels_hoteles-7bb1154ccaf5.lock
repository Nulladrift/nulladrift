          "name": "info_cadena",
          "description": "Políticas y datos comunes a todos los hoteles de Protur (propinas, mascotas, idiomas, etc.). Un dato propio de un hotel prevalece sobre este.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
