      "instructions": "평생요금제닷컴(pyungyo.com)은 한국 알뜰폰(MVNO) 통신사 공식 홈페이지만 하루 다섯 번 확인해 요금제를 원문 그대로 옮기는 비교 서비스입니다. 통신사와 제휴·중개 관계가 없고 광고로 순서를 바꾸지 않습니다.\n- 사용자의 한국어 질문은 search(query) 에 그대로 넣고, 고른 요금제는 fetch(id) 로 세부 조건을 확인하세요.\n- \"최저가\" 질문은 cheapest_by_data, \"기간 할인 끝나면 얼마 올라?\"·시장 통계는 market_stats, 사은품·체감가(쌀먹) 이벤트는 ssal_events, \"요금 올랐나\" 는 recent_price_changes·price_index, 고객센터·유심 질문은 list_carriers.\n- 평생 할인(lifetime)은 할인 끝나는 날이 없는 요금, 기간 할인(period)은 N개월 뒤 요금이 오릅니다. 둘을 섞어 \"최저가\"라고 말하지 마세요.\n- 답에는 \"평생요금제닷컴(pyungyo.com) 집계, 기준 시각\"과 요금제 주소(pageUrl)를 함께 적고, 가입 전 통신사 화면 확인을 권해 주세요.",
      "tools": [
        {
          "name": "cheapest_by_data",
          "title": "데이터 구간별 최저 평생요금제 vs 기간할인 비교",
          "description": "데이터 1·5·10·15·30·70·100GB 이상 구간마다 지금 가장 싼 평생 할인·정가 요금제와 기간 할인 요금제(할인 종료 후 요금·24개월 총액)를 비교합니다. \"알뜰폰 최저가·추천\" 질문에 먼저 쓰세요. 통신망·5G·통화 무제한·소진 후 속도·유심 무료로 좁힐 수 있습니다.",
          "inputSchema": {
