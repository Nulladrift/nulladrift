          "description": "Search Korean MVNO (알뜰폰) mobile plans in plain Korean. 한국어 질문을 그대로 넣으면 조건(데이터 GB·월 요금 상한·통신망·5G·통화 무제한·부가통화·유심 무료·테더링·결합·데이터 쉐어링·조건 없음·통신사·평생/기간/선착순)을 읽어 통신사 공식 홈페이지 기준 요금제를 찾고, 같은 조건의 기간할인 요금제(할인 종료 후 인상 요금 및 24개월 총액) 비교도 함께 돌려줍니다. 결과의 id 로 fetch 를 부르면 세부 조건·가격 기록이 나옵니다. 예: \"KT망 10GB 1만원 이하\", \"월 1만원 이하 데이터 많은 거\", \"데이터 무제한 5G\", \"유심 무료 통화 무제한\", \"선착순 한정 요금제\".",
