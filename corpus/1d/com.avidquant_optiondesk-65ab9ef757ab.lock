                    "description": "The PNG bytes, base64 encoded.",
                    "title": "Data",
                    "type": "string"
                  },
                  "mime_type": {
                    "const": "image/png",
                    "description": "Always image/png.",
                    "title": "Mime Type",
                    "type": "string"
                  },
                  "name": {
                    "description": "Plot name, matching plot_types.",
                    "title": "Name",
                    "type": "string"
                  }
                },
                "required": ["data", "mime_type", "name"],
                "title": "PlotImage",
                "type": "object"
              }
            },
            "description": "Structured metadata returned with an inline plot result.",
