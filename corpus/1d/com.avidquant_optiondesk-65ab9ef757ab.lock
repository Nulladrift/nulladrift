            "$defs": {
              "PlotImage": {
                "description": "One PNG carried inside the structured result for the plot app.\n\nThe image content blocks still carry the same bytes for clients that\nshow them directly. The app resource reads this copy, because a host\nhands an app the structured content and not the content blocks.",
