{
  "lockfileVersion": 2,
  "subjects": {
    "com.omniwatchguard/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.omniwatchguard.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "omniwatchguard",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "create_monitor",
          "description": "Create a new monitor for a web page. Types: text, price, stock, css, api, seo, ssl (tech_stack and whois need the matching add-on). The number of monitors and the available check intervals depend on the user's plan.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "frequency": {
                "description": "Check interval in minutes: 60 on Starter; 15, 30 or 60 on Pro; 5, 15, 30 or 60 on Agency",
                "type": "number"
              },
              "name": {
                "description": "Display name for the monitor (default: the domain of the URL)",
                "type": "string"
              },
              "notify_telegram": {
                "description": "Telegram chat ID for this monitor's alerts (Agency plan)",
                "type": "string"
              },
              "price_threshold_type": {
                "description": "For type=price: 'any', 'increase' or 'decrease'",
                "type": "string"
              },
              "price_threshold_value": {
                "description": "Price threshold that triggers an alert",
                "type": "number"
              },
              "selector": {
                "description": "Optional CSS selector that limits monitoring to one element of the page (used with type css)",
                "type": "string"
              },
              "stock_alert_type": {
                "description": "For type=stock: 'any', 'in_stock' or 'out_of_stock'",
                "type": "string"
              },
              "type": {
                "description": "Monitor type: text, price, stock, css, api, seo or ssl. Default: text",
                "type": "string"
              },
              "url": {
                "description": "Full URL of the page to monitor",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4ab4935a4efb0beb93f5816c1aa0d79795a665f88f2d78dcab237302138def1b"
        },
        {
          "name": "delete_monitor",
          "description": "Delete an existing monitor.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Monitor ID",
                "type": "number"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:10d39145a1f627637e167eab514c812423ed5c8602641984d8cdc4574e7974df"
        },
        {
          "name": "get_monitor",
          "description": "Get the full details of one monitor and its last 20 check results.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Monitor ID",
                "type": "number"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d732e0aa9947329428a9ffc50644c0a167e22643b71f6cc8c9065f4a5a2cf617"
        },
        {
          "name": "list_alerts",
          "description": "List the latest alerts sent to the user (email, webhook, Slack, Discord, Telegram), with details of the change that triggered each one.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "type": {
                "description": "Optional filter by alert channel",
                "enum": ["email", "webhook", "slack", "discord", "telegram"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3f9d945db17a465fb1b4daf9c43a7d6efdd12a844717dfaea41b617af46abba6"
        },
        {
          "name": "list_monitors",
          "description": "List all OmniWatchGuard monitors of the authenticated user, with the number of changes in the last 7 days and the last detected change.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:98954975ace9986d46ab0f90fcdc7465126c4af4c87501bf9316ccd2fb2ed879"
        },
        {
          "name": "set_monitor_status",
          "description": "Pause or resume an existing monitor.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Monitor ID",
                "type": "number"
              },
              "status": {
                "description": "New status of the monitor",
                "enum": ["active", "paused"],
                "type": "string"
              }
            },
            "required": ["id", "status"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4f048179b1c6303c78ac5c9dc03f01e6895c46d12ec17445d19d3cb3b8b17024"
        },
        {
          "name": "update_monitor",
          "description": "Update fields of an existing monitor: name, URL, selector, check interval or price/stock thresholds.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "frequency": {
                "description": "New check interval in minutes (allowed values depend on the plan)",
                "type": "number"
              },
              "id": {
                "description": "Monitor ID",
                "type": "number"
              },
              "name": {
                "description": "New display name",
                "type": "string"
              },
              "price_threshold_type": {
                "description": "For price monitors: 'any', 'increase' or 'decrease'",
                "type": "string"
              },
              "price_threshold_value": {
                "description": "For price monitors: threshold that triggers an alert",
                "type": "number"
              },
              "selector": {
                "description": "New CSS selector",
                "type": "string"
              },
              "stock_alert_type": {
                "description": "For stock monitors: 'any', 'in_stock' or 'out_of_stock'",
                "type": "string"
              },
              "url": {
                "description": "New page URL",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3d7a140f1d3d5ce1dfb74e7316697b5232855bf16fe25e48d53d3da7f61d8189"
        }
      ],
      "digest": "sha256:4fa3f03741531d27aff2e7ae4ee95b3a3c8eccd1da851584fe4b4b4c588eb665"
    }
  }
}
