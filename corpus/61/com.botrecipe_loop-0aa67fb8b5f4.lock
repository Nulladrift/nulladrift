{
  "lockfileVersion": 2,
  "subjects": {
    "com.botrecipe/loop": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://loop.cloudforbots.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "loop-breaker",
        "title": "Loop Breaker",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Catches your AI agent repeating the same failing step or tool call. Call check_step after each step; when the same call fails the same way 3 times, or runs 5 times in a row, Pro halts the run before it burns more time and money. Free watch-only mode never halts: it flags loops and drafts a weekly report. Pro is $9 a month. Free 500 calls/day, then $9/month. No model inside: bring your own model. Works with Claude, Codex, ChatGPT, Grok Bot.",
      "tools": [
        {
          "name": "check_step",
          "description": "Call AFTER each tool call or agent step with what you just did and whether it failed. Loop Breaker fingerprints the call (tool + normalized args + error) and returns verdict ok, loop_detected or halted. Pro: on a loop, halt=true; stop the run, do not retry, and tell your user what repeated. Free watch-only: never halts, returns would_halt and logs it for the weekly report.",
          "inputSchema": {
            "properties": {
              "args": {
                "description": "The arguments you passed (object or string). Volatile values like timestamps and ids are normalized away."
              },
              "error": {
                "description": "The error message if the step failed. Omit or empty if it succeeded.",
                "type": "string"
              },
              "max_failures": {
                "description": "Same failing call this many times = loop. Default 3 (min 2, max 20).",
                "type": "integer"
              },
              "max_repeats": {
                "description": "Same call this many times in a row (even if it succeeds) = loop. Default 5 (min 3, max 50).",
                "type": "integer"
              },
              "run_id": {
                "description": "Any stable id for this agent run, e.g. \"nightly-sync-2026-10-15\". Use the same id for every step of the run (and its sub-agents).",
                "type": "string"
              },
              "tool": {
                "description": "The tool or step name you just ran, e.g. \"browser.click\" or \"git push\".",
                "type": "string"
              }
            },
            "required": ["run_id", "tool"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d5f6385415d0c44938a6cedfe18ad219a1ea38c1748d436705defb9794c6b887"
        },
        {
          "name": "loop_status",
          "description": "Show a run's loops so far, whether it is halted, and its last 10 steps.",
          "inputSchema": {
            "properties": {
              "run_id": {
                "description": "Any stable id for this agent run, e.g. \"nightly-sync-2026-10-15\". Use the same id for every step of the run (and its sub-agents).",
                "type": "string"
              }
            },
            "required": ["run_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d6624861167b18de6a6507fa0cbaba94d05da300574c299780807c21b7283810"
        },
        {
          "name": "usage_and_upgrade",
          "description": "Show today's usage for your key or IP and the $49/month All Access upgrade link (cloudforbots.com/offer). Free tier: 500 calls/day. Not metered.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
