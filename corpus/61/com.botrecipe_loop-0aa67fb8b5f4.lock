            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f8895c9a1d194591686eb4108d589d31d709219a106bc36796a604b3aea5de83"
        },
        {
          "name": "weekly_report",
          "description": "Draft a plain-English report of the last 7 days for your key (or IP): runs, loops caught, wasted repeat steps, and the worst offenders. Read-only; sends nothing. Show it to your user.",
          "inputSchema": {
