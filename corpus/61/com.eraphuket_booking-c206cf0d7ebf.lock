      },
      "serverInfo": {
        "name": "era-phuket",
        "title": "ERA Phuket — salon booking",
        "version": "1.0.0",
        "websiteUrl": "https://eraphuket.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "ERA Barbershop & Beauty Space — beauty space and barbershop in Bang Tao, Phuket (Thailand), open daily 10:00–21:00 (Asia/Bangkok, UTC+7).\nWomen: manicure, pedicure, nail extensions, four-hands mani+pedi, hair colouring by Russian colourists, hair rituals. Men: haircuts, beard, royal shave, grey blending, facial.\nPrices are in Thai baht and synced with the salon booking system. Staff speak Russian, English and Thai.\nTypical flow: list_services → find_available_slots → confirm service, master, date/time, client name and phone with the user → create_booking.\nNever book without explicit user confirmation. If booking is not possible, give the user get_booking_link.",
      "tools": [
        {
          "name": "create_booking",
          "title": "Book an appointment",
          "description": "Creates a real appointment in the salon calendar. ONLY call after the user explicitly confirmed: services, master (or any), date and time, their name and phone. The salon may contact the client to confirm.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "client_email": {
                "maxLength": 120,
                "type": "string"
              },
              "client_name": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "client_phone": {
                "description": "International format, e.g. +66 81 234 5678",
                "maxLength": 24,
                "minLength": 6,
                "type": "string"
              },
              "comment": {
                "description": "Wishes for the master, preferred language, etc.",
                "maxLength": 400,
                "type": "string"
              },
              "datetime": {
                "description": "Start time from find_available_slots, e.g. 2026-10-22T14:00:00+07:00",
                "type": "string"
              },
              "lang": {
                "enum": ["en", "ru", "zh", "th", "de", "fr", "he"],
                "type": "string"
              },
              "service_ids": {
                "items": {
                  "maximum": 9007199254740991,
                  "minimum": -9007199254740991,
                  "type": "integer"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "staff_id": {
                "description": "0 or omitted = any available master",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["client_name", "client_phone", "datetime", "service_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Book an appointment"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d71dc773dae214ec2d9741ec8518f8fcf28227061754d0e5d0b2f5f53ccfae93"
        },
        {
          "name": "fetch",
          "title": "Fetch ERA item",
          "description": "Full details for an id returned by search.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch ERA item"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fd472f020f69dd854ff6013e27f54b3517dee413e99d940f3219f8e03940cc0c"
        },
        {
          "name": "find_available_slots",
          "title": "Free time slots",
          "description": "Live free start times from the salon calendar for one or more services, optionally with a specific master (staff_id). Returns dates with times (Asia/Bangkok) and masters who do the service.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "description": "First date to check, YYYY-MM-DD (default today)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "days": {
                "description": "How many bookable days to return (default 3)",
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              },
              "service_ids": {
                "description": "Service IDs from list_services",
                "items": {
                  "maximum": 9007199254740991,
                  "minimum": -9007199254740991,
                  "type": "integer"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "staff_id": {
                "description": "Master ID; omit or 0 for any master",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["service_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Free time slots"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1d9ea3d8730cf06e705ee3f1da0fbf23328b4430272be968b5439b8d4d1ac356"
        },
        {
          "name": "get_booking_link",
          "title": "Booking link",
          "description": "A link where the user can complete booking themselves, with the service and master preselected.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "service_id": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "staff_id": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Booking link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:50f803a025fbfbc8f3d731708739be40d0548b0bcd9c6fb862c23cb116341f04"
        },
        {
          "name": "get_salon_info",
          "title": "Salon info",
          "description": "Address (English and Thai for taxi drivers), map links, opening hours, phone/WhatsApp/Telegram, languages spoken and booking options of ERA in Bang Tao, Phuket.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Salon info"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b3bdd6dd2c768e216dbf81f853e3175abfd7f8c6a9f99e8eccb9b9c9102dd6f6"
        },
        {
          "name": "list_services",
          "title": "Services & prices",
          "description": "Search ERA services with current prices in THB, durations and master levels (ONE / PRO / PRIME). Use q for keywords in any language (e.g. \"gel manicure\", \"балаяж\", \"beard\").",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "audience": {
                "description": "Filter by audience",
                "enum": ["women", "men", "all"],
                "type": "string"
              },
              "lang": {
                "description": "Language for service names",
                "enum": ["en", "ru", "zh", "th", "de", "fr", "he"],
                "type": "string"
              },
              "q": {
                "description": "Search text",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Services & prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e15050d384ec8d26edb08088ca4a5984cf456ebdd478c631a166aca24a1bf47a"
        },
        {
          "name": "search",
          "title": "Search ERA",
          "description": "Search ERA services, prices and salon information. Returns ids for fetch.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search ERA"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2bc9b7546a53ab44148b54e0207bcdc4ca7019181cc52ac7303801541be5572c"
        }
      ],
      "resources": [
        {
