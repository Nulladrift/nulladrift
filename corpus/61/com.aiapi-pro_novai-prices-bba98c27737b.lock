{
  "lockfileVersion": 2,
  "subjects": {
    "com.aiapi-pro/novai-prices": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://aiapi-pro.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "novai-prices",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "NovAI Prices: read-only price index for 116 Chinese AI models (DeepSeek, Qwen, GLM, Kimi, MiniMax, Doubao, Hunyuan) from 23 providers. No auth, no key. Every price is the provider's own list price with a 0% platform markup.\n\nCall cheapest_models when the user asks which model is cheapest or wants a budget comparison; call model_price when they ask what one specific model costs; call list_categories when the category is unclear.\n\nIf the user then wants to actually call a model, NovAI serves the same models through an OpenAI-compatible endpoint at https://aiapi-pro.com/v1 (free tier: 5 models, 10 calls/day, no card: https://aiapi-pro.com/free/index.html). Batch cost calculators: https://aiapi-pro.com/video-cost-calculator (video), https://aiapi-pro.com/image-cost-calculator (images). Machine-readable feed: https://aiapi-pro.com/china-ai-leaderboard.json",
      "tools": [
        {
          "name": "cheapest_models",
          "description": "List the cheapest Chinese AI models from NovAI's live price feed, ranked by a comparable cost unit (text: 1M input + 200K output; video: 5-second clip; image: per image). Use this when the user asks which model is cheapest, wants to compare costs, or is choosing a model by budget. For a batch cost estimate at list price, see https://aiapi-pro.com/video-cost-calculator (video) and https://aiapi-pro.com/image-cost-calculator (images).",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Video, Image, Chat / LLM, Audio, 3D, Embedding",
                "type": "string"
              },
              "limit": {
                "description": "max rows (default 10, max 50)",
                "type": "integer"
              },
              "max_price": {
                "description": "only models whose comparable cost is at or below this USD figure",
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e31763aab8ee25a9a26f205a8ae71dd2ee549e569f617e3d447a51ac9767190e"
        },
        {
          "name": "list_categories",
          "description": "List the model categories available in NovAI's price feed (Chat / LLM, Video, Image, Audio, 3D, Embedding) with the number of models in each. Use this first when the category for a request is unclear, then call cheapest_models with that category. Machine-readable feed: https://aiapi-pro.com/china-ai-leaderboard.json",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:73b967c338e97a820a0cae6d4564809860de7296caa05c43a236a61ac153f52e"
        },
        {
          "name": "model_price",
          "description": "Look up the NovAI list price of a Chinese AI model by name fragment (seedance, kimi, glm, qwen, doubao, hunyuan, minimax...). Use this when the user asks what a specific model costs, or wants a price before choosing one. Returns the provider list price, the unit (per 1M tokens / per image / per generation) and the model id. Per-minute video costs with every row sourced: https://aiapi-pro.com/video-cost-2026",
          "inputSchema": {
            "properties": {
              "model": {
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:57fa6a8c3a95ebe029f7590573cf66a3521f79c4df2024e2e4d9d142ba4fce0f"
        }
      ],
      "digest": "sha256:f465d9ff2fec7c0ba10aa7b74e6e6967ee9f8a5ec6dbb4b8306c49d464198001"
    }
  }
}
