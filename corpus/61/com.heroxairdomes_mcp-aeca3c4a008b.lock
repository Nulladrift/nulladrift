{
  "lockfileVersion": 2,
  "subjects": {
    "com.heroxairdomes/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.heroxairdomes.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "herox-airdomes-product",
        "title": "HeroX AirDomes Product",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Product MCP server for HeroX AirDomes (air-supported domes and fabric structures). Use it to get company facts, list and start purchases of planning packages, book consultations, and run the ROI, OPEX, additional-costs and financing calculators (estimates, not quotes). For documentation and articles use the docs MCP server at https://www.heroxairdomes.com/api/docs-mcp.",
      "tools": [
        {
          "name": "book_consultation",
          "title": "Book a consultation",
          "description": "Get the booking link for a free 1:1 product overview and ROI estimate call with the HeroX team. Use when the user wants a quote, a site-specific price, or to talk to sales.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "topic": {
                "description": "Optional short summary of what the user wants to discuss.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2c912fa12e7c815555b396476a1a001832a3548494a3a36cb2a4c52dfe9e2a20"
        },
        {
          "name": "calculate_dome_roi",
          "title": "Calculate air dome ROI",
          "description": "Run the HeroX ROI calculator (https://www.heroxairdomes.com/resources/roi): payback period, 5- and 10-year ROI, net annual income and a 10-year cumulative cash flow. All money in USD. This is an estimate for planning purposes only, not a quote.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "additional_costs_usd": {
                "default": 50000,
                "description": "Additional Costs in USD (foundation, permits, utilities...).",
                "minimum": 0,
                "type": "number"
              },
              "air_dome_cost_usd": {
                "default": 500000,
                "description": "Air Dome Cost in USD.",
                "minimum": 0,
                "type": "number"
              },
              "annual_revenue_growth_percent": {
                "default": 5,
                "description": "Annual Revenue Growth in percent per year (0-20).",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "operational_costs_annual_usd": {
                "default": 25000,
                "description": "Operational Costs (Annual) in USD per year.",
                "minimum": 0,
                "type": "number"
              },
              "operational_mode": {
                "default": "permanent",
                "description": "Operational Mode: seasonal = 180 days/year, permanent = 365 days/year.",
                "enum": ["seasonal", "permanent"],
                "type": "string"
              },
              "rent_per_hour_usd": {
                "default": 100,
                "description": "Avg. Rent/h/Dome in USD per hour.",
                "minimum": 0,
                "type": "number"
              },
              "rented_hours_per_day": {
                "default": 10,
                "description": "Avg. # of Rented Hours/Day/Dome (0-24, step 0.5).",
                "maximum": 24,
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1ba203157f5d387d2a501bf3a9bd772b19ecae4415705ef7e57c4645035a4803"
        },
        {
          "name": "estimate_additional_costs",
          "title": "Estimate additional project costs",
          "description": "Run the HeroX Additional Costs Estimator (https://www.heroxairdomes.com/resources/additional-costs): foundation, permitting, site prep, utilities, cranes, workforce, HVAC and (US) general contracting costs beyond the dome itself. US results are in USD, Europe + Globally results in EUR. This is an estimate for planning purposes only, not a quote.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "length": {
                "default": 120,
                "description": "Length in the chosen units (ft or m), step 0.1.",
                "minimum": 0,
                "type": "number"
              },
              "market": {
                "default": "US",
                "description": "Market: US ($, USD) or Europe (Europe + Globally, €, EUR).",
                "enum": ["US", "Europe"],
                "type": "string"
              },
              "units": {
                "description": "Units for length and width: Feet (ft) or Meters (m). Defaults to Feet for US and Meters for Europe, like the page.",
                "enum": ["Feet", "Meters"],
                "type": "string"
              },
              "width": {
                "default": 60,
                "description": "Width in the chosen units (ft or m), step 0.1.",
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a33d1e61a60c85ec46eeb988978ad2741ddd5905a053c03b95620d11352da212"
        },
        {
          "name": "estimate_dome_opex",
          "title": "Estimate air dome operating costs",
          "description": "Run the HeroX OPEX calculator (https://www.heroxairdomes.com/resources/opex): annual and monthly costs for fan/inflation, heating, cooling and lighting. Length, width and target temperature are always given in ft and °F (the page's slider values); unit_system only switches the page to metric display (€, m, °C) and its metric formula variant, exactly like the page. This is an estimate for planning purposes only, not a quote.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "climate": {
                "default": "cold",
                "description": "Climate: hot = Hot (Dubai, UAE); mild = Mild (Brussels, Belgium); cold = Cold (New York, NY); veryCold = Very Cold (Columbus, OH); extremelyCold = Extremely Cold (Montreal, Canada).",
                "enum": ["hot", "mild", "cold", "veryCold", "extremelyCold"],
                "type": "string"
              },
              "cooling_system": {
                "default": "off",
                "description": "Cooling System on or off.",
                "enum": ["on", "off"],
                "type": "string"
              },
              "daily_usage_hours": {
                "default": 8,
                "description": "Daily Usage Hours (4-24, step 1).",
                "maximum": 24,
                "minimum": 4,
                "type": "number"
              },
              "electricity_price_per_kwh": {
                "default": 0.3745,
                "description": "Electricity Price in $/kWh (€/kWh in metric), e.g. 0.3745. The page field shows this ×100 (37.45).",
                "minimum": 0,
                "type": "number"
              },
              "energy_efficiency": {
                "default": "superhero",
                "description": "Energy Efficiency (membrane): standard = Standard U 3.05 / R 2; hero = Hero U 1.74 / R 3; superhero = Superhero U 1.43 / R 4; insulated = Insulated U 0.57 / R 10; apex = Apex U 0.42 / R 14.",
                "enum": ["standard", "hero", "superhero", "insulated", "apex"],
                "type": "string"
              },
              "gas_price_per_kwh": {
                "default": 0.1147,
                "description": "Gas Price in $/kWh (€/kWh in metric), e.g. 0.1147. The page field shows this ×100 (11.47).",
                "minimum": 0,
                "type": "number"
              },
              "length_ft": {
                "default": 120,
                "description": "Length in feet (50-400, page slider step 10).",
                "maximum": 400,
                "minimum": 50,
                "type": "number"
              },
              "operational_mode": {
                "default": "permanent",
                "description": "Operational Mode: seasonal = 180 days/year, permanent = 365 days/year.",
                "enum": ["seasonal", "permanent"],
                "type": "string"
              },
              "target_temp_f": {
                "default": 65,
                "description": "Target Temperature in °F (50-80, step 1).",
                "maximum": 80,
                "minimum": 50,
                "type": "number"
              },
              "unit_system": {
                "default": "imperial",
                "description": "Unit System. imperial = $ / ft / °F, metric = € / m / °C display.",
                "enum": ["imperial", "metric"],
                "type": "string"
              },
              "width_ft": {
                "default": 120,
                "description": "Width in feet (50-400, page slider step 10).",
                "maximum": 400,
                "minimum": 50,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:76f2a0095f9786d34cdea4a9796ca6cd1a0f0191a0a8850fca15bfd8599bfc39"
        },
        {
          "name": "estimate_financing_payment",
          "title": "Estimate financing payment",
          "description": "Run the HeroX Financing Calculator (https://www.heroxairdomes.com/resources/financing): monthly payment, financed amount, total interest and total cost in USD. Assumes 10% down and 8% APR. Options from $0 down and rates from 5.99% depend on credit and project details. This is an estimate for planning purposes only, not a quote.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "project_value_usd": {
                "default": 500000,
                "description": "Project Value in USD (100,000-2,000,000, page slider step 10,000).",
                "maximum": 2000000,
                "minimum": 100000,
                "type": "number"
              },
              "term_months": {
                "default": 60,
                "description": "Term Length in months: 24, 36, 48, 60 or 72 (2-6 years).",
                "enum": [24, 36, 48, 60, 72],
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3bc1481146ea6714e5f40ae43561734e8dcc341d385dcce0f07201135cf7b0cf"
        },
        {
          "name": "get_company_overview",
          "title": "Company overview",
          "description": "Summary of HeroX AirDomes: applications, typical project budgets, sizes, lead times, options, warranty and financing. Use before answering any pricing or capability question.",
          "inputSchema": {
