        {
          "name": "build_business_plan",
          "title": "Build a dome business plan",
          "description": "Facility business plan: capex (HeroX price from the pricing engine for air domes, site works, fit-out, contingency), court revenue model, operating costs (energy for inflation/heating/lighting, staff, maintenance, insurance), optional HeroX financing, EBITDA, payback and a 10-year cash flow, with every assumption listed. Write it up for the user as a clear plan with a table, and invite them to replace defaults with local numbers (court rates, energy prices, staff). Planning model, not financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annual_price_growth_pct": {
                "description": "Default 3.",
                "maximum": 15,
                "minimum": -5,
                "type": "number"
              },
              "climate": {
                "default": "cold",
                "description": "Sizes the heating: hot (Dubai), mild (Brussels), cold (New York), veryCold (Columbus OH), extremelyCold (Montreal). Pick the closest to the site.",
                "enum": ["hot", "mild", "cold", "veryCold", "extremelyCold"],
                "type": "string"
              },
              "courts": {
                "description": "Number of courts (or fields / pools). Used to size the dome when dimensions are unknown.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "financed": {
                "default": false,
                "description": "Use HeroX financing (10% down, 8% APR) on the HeroX scope.",
                "type": "boolean"
              },
              "include_mechanical": {
                "default": true,
                "description": "Air domes only: include the inflation and heating unit (false if an existing unit is reused).",
                "type": "boolean"
              },
              "length_ft": {
                "description": "Footprint length in feet, if known.",
                "maximum": 1200,
                "minimum": 40,
                "type": "number"
              },
              "length_m": {
                "description": "Footprint length in metres (alternative to feet).",
                "maximum": 370,
                "minimum": 12,
                "type": "number"
              },
              "loan_term_months": {
                "enum": [24, 36, 48, 60, 72],
                "type": "integer"
              },
              "offpeak_occupancy_pct": {
                "description": "Default 25.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "open_hours_per_day": {
                "description": "Default 16.",
                "maximum": 24,
                "minimum": 4,
                "type": "number"
              },
              "operating_mode": {
                "default": "permanent",
                "description": "seasonal = dome up ~6 winter months.",
                "enum": ["permanent", "seasonal"],
                "type": "string"
              },
              "other_revenue_pct": {
                "description": "Memberships, coaching, events as % of court revenue. Default 20.",
                "maximum": 200,
                "minimum": 0,
                "type": "number"
              },
              "peak_hours_per_day": {
                "description": "Default 5.",
                "maximum": 24,
                "minimum": 0,
                "type": "number"
              },
              "peak_occupancy_pct": {
                "description": "Default 80.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "rate_per_court_hour_usd": {
                "description": "Rental price per court-hour (field-hour for soccer). Defaults by sport and region.",
                "maximum": 2000,
                "minimum": 5,
                "type": "number"
              },
              "region": {
                "default": "north_america",
                "description": "north_america is quoted in USD and feet; everywhere else in EUR and metres.",
                "enum": ["north_america", "europe", "middle_east", "australia_nz", "other"],
                "type": "string"
              },
              "spec": {
                "default": "insulated",
                "description": "seasonal = single layer, winter-only; standard = double layer; insulated = year-round insulated (most common in cold climates); premium = highest insulation.",
                "enum": ["seasonal", "standard", "insulated", "premium"],
                "type": "string"
              },
              "sport": {
                "default": "tennis",
                "enum": ["tennis", "pickleball", "padel", "soccer", "basketball", "multi_sport", "pool", "other"],
                "type": "string"
              },
