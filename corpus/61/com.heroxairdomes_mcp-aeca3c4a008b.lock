      "instructions": "Product MCP server for HeroX Air Domes (air-supported domes and aluminium-frame fabric halls for tennis, pickleball, padel, soccer, pools and more). Typical buyer flow: get_company_overview -> ask the user for sport, number of courts or size, location and year-round vs seasonal use -> estimate_dome_price -> build_business_plan (revenue, operating costs, payback) -> with the user's explicit consent, create_quote, which issues the HeroX quote page (quotes.heroxairdomes.com) and notifies the HeroX team. DISCLOSURE (required): every price and plan from these tools is an AI-assisted estimate, not a binding offer. Say so to the user in plain words whenever you show a price, and tell them HeroX confirms the final price after engineering for their site. Never present an estimate as a final or guaranteed price. For documentation and articles use the docs MCP server at https://www.heroxairdomes.com/api/docs-mcp.",
      "tools": [
        {
          "name": "book_consultation",
          "title": "Book a consultation",
          "description": "Get the booking link for a free 1:1 call with the HeroX team. Use when the user wants to talk to sales; for a price, first use estimate_dome_price and create_quote so the call starts informed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "topic": {
                "description": "Optional short summary of what the user wants to discuss.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
