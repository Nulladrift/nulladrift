        {
          "name": "start_planning_package_purchase",
          "title": "Start a planning package purchase",
          "description": "Get the checkout link for a planning package so the user can pay securely on heroxairdomes.com. Does not charge anything; the user completes payment themselves.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "package_id": {
                "description": "Package ID from list_planning_packages.",
                "enum": ["sketch", "renders", "virtualtour", "sitevisit"],
                "type": "string"
              }
            },
            "required": ["package_id"],
            "type": "object"
          },
          "annotations": {
