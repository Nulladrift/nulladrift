        {
          "name": "revclamp_calculate_roi_and_plan_fit",
          "title": "Calculate B2B 0% Take-Rate ROI & Optimal Plan Fit",
          "description": "Deterministically calculate monthly and annual B2B margin savings using exact integer USD cents when replacing a 25%-30% contingency chargeback agency with RevClamp flat-rate 0% commission plans ($19 Starter, $59 Growth, $199 Scale). Evaluates monthlyWonDisputeUsd, monthlyGhostBleedUsd, contingencyTakeRatePercent, and monthlyUsageEvents to recommend the optimal tier. Returns structuredContent containing ok, mode, statelessEphemeralAudit, tenantId, recommendedTier, annualNetMarginSavedUsd, roiMultiple, and calculation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "contingencyTakeRatePercent": {
                "description": "Competitor chargeback agency contingency commission percentage (valid range: 1 to 50, default: 25 for 25% take-rate tools).",
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "demo": {
                "description": "Optional boolean flag (default: false) for sample preview parity across all 9 MCP tools.",
                "type": "boolean"
              },
              "monthlyGhostBleedUsd": {
                "description": "Monthly unpaid AI/API or SaaS usage bleed stopped by RevClamp basil entitlement guards in USD (valid range: 0 to 10000000, default: 600).",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "monthlyUsageEvents": {
                "description": "Monthly verified usage events across your workspace (integer 0 to 50000000, default: 250000) used to recommend Starter (<=100k), Growth (<=1M), or Scale (<=5M).",
                "maximum": 50000000,
                "minimum": 0,
                "type": "integer"
              },
              "monthlyWonDisputeUsd": {
                "description": "Monthly won Stripe chargeback volume in USD (valid range: 0 to 10000000, default: 10000) subject to legacy agency take-rate fees.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate B2B 0% Take-Rate ROI & Optimal Plan Fit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:94fb388734e5fd8348a17ce6385e11632ba8c11222f86b81399d57aafc3e7e4a"
        },
        {
          "name": "revclamp_evaluate_ghost_usage",
          "title": "Evaluate Single-Customer Stripe Basil Ghost Usage",
          "description": "Evaluate whether a specific customer's AI or API usage event constitutes unpaid ghost usage across multi-subscription Stripe 2025-03-31.basil state, enforcing fail-closed pagination (has_more must be explicitly false) and configurable 0-14 day dunning grace windows. Executes as a stateless, read-only entitlement evaluator with zero side effects. Returns structuredContent containing ok, mode, statelessEphemeralAudit, tenantId, and evaluation (isGhostLeak, isGhostUsage, reason). Use this tool for real-time per-customer entitlement gating; use revclamp_audit_revenue_leakage for batch multi-customer portfolio audits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currentPeriodEnd": {
                "description": "Optional camelCase alias for current_period_end (Unix epoch seconds, epoch milliseconds, or ISO-8601 string)."
              },
              "currentPeriodEndSec": {
                "description": "Optional flat subscription current_period_end in Unix epoch integer seconds.",
                "minimum": 1,
                "type": "integer"
              },
              "current_period_end": {
                "description": "Optional flat subscription current_period_end (Unix epoch seconds, epoch milliseconds, or ISO-8601 string)."
              },
              "customerId": {
                "description": "Stripe customer identifier to evaluate (format example: 'cus_9s6XKzkNRiz8i3', max 64 chars).",
                "type": "string"
              },
              "demo": {
                "description": "Optional simulation flag (boolean) for deterministic ghost-usage preview.",
                "type": "boolean"
              },
              "dunningGracePeriodDays": {
                "description": "Dunning grace window in integer days (valid range: 0 to 14, default: 3) after latest_invoice_failed_at during which past_due subscriptions remain entitled.",
                "maximum": 14,
                "minimum": 0,
                "type": "integer"
              },
              "latestInvoiceFailedAtSec": {
                "description": "Optional flat latest_invoice_failed_at timestamp in Unix epoch integer seconds for past_due grace evaluation.",
                "minimum": 1,
                "type": "integer"
              },
              "latest_invoice_failed_at": {
                "description": "Optional flat latest_invoice_failed_at timestamp (Unix epoch seconds, epoch milliseconds, or ISO-8601 string)."
              },
              "occurredAt": {
                "description": "Optional usage event timestamp as ISO-8601 string, Unix epoch seconds, or Unix epoch milliseconds."
              },
              "occurredAtSec": {
                "description": "Optional alias for usageTimestampSec: Unix epoch timestamp in integer seconds (e.g. 1761264000) when the usage event occurred (used when usageTimestampSec is omitted).",
                "type": "integer"
              },
              "occurred_at": {
                "description": "Optional snake_case alias for occurredAt (ISO-8601 string, Unix epoch seconds, or Unix epoch milliseconds)."
              },
              "subscriptionStatus": {
                "description": "Optional flat Stripe subscription status shorthand ('active', 'trialing', 'past_due', 'canceled', 'unpaid', 'incomplete', 'incomplete_expired', 'paused') when subscriptions is omitted.",
                "type": "string"
              },
              "subscription_status": {
                "description": "Optional snake_case alias for subscriptionStatus.",
                "type": "string"
              },
              "subscriptions": {
                "description": "Optional Stripe customer subscriptions payload: either a Stripe list object ({ data: [...], has_more: false }) or a raw array of up to 50 subscription objects containing id, status ('active', 'trialing', 'past_due', 'canceled', 'unpaid'), current_period_end, or items.data[].current_period_end in Unix seconds."
              },
              "subscriptionsHasMore": {
                "description": "Pagination completeness flag (boolean). Must be explicitly set to false when passing a raw subscriptions array so RevClamp can verify no active subscription was truncated on a later page.",
                "type": "boolean"
              },
              "timestamp": {
                "description": "Optional alias for occurredAt (ISO-8601 string, Unix epoch seconds, or Unix epoch milliseconds)."
              },
              "usageEvent": {
                "description": "Optional metered usage event object containing customer_id (or stripe_customer_id), event_name, and occurred_at (or occurred_at_sec).",
                "type": "object"
              },
              "usageTimestampSec": {
                "description": "Optional Unix epoch timestamp in integer seconds (e.g. 1761264000) when the AI/API usage event occurred (defaults to current server Unix timestamp if omitted).",
                "type": "integer"
              }
            },
            "type": "object"
          },
