        {
          "name": "revclamp_lint_dispute_evidence",
          "title": "Stripe Dispute Evidence UTF-16 & CE 3.0 Completeness Linter",
          "description": "Deterministically lint a Stripe dispute evidence[access_activity_log] payload against Stripe's 18,000 UTF-16 code unit (String.prototype.length) ceiling, UTF-8 byte length, non-destructive --- BEGIN REVCLAMP CE3 EVIDENCE --- / --- END REVCLAMP CE3 EVIDENCE --- (or [RevClamp Verified Product Usage Log] / [/RevClamp Verified Product Usage Log]) delimiter markers, existing merchant note preservation, 17,922/17,920-char fixed wrapper capacity threshold (SKIP_POST_PRESERVE_DRAFT), and Visa Compelling Evidence 3.0 (CE 3.0) prior-charge (>= 2) + IP/device overlap qualification. Returns structuredContent containing ok, mode, statelessEphemeralAudit, tenantId, lint, utf16CodeUnits, maxUtf16Ceiling, remainingUtf16Units, withinCeiling, utf8Bytes, nonDestructiveMarkersPresent, merchantNotesPreserved, merchantNotesUtf16CodeUnits, fixedWrapperUtf16CodeUnits, merchantLogAtCapacity, stagingActionWhenAtCapacity, priorMatchedCount, hasIpMatch, hasDeviceMatch, ce3RubricPassed, and overallVerdict.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accessActivityLog": {
                "description": "Alias for evidenceLogText representing Stripe dispute evidence[access_activity_log] payload.",
                "maxLength": 30000,
                "type": "string"
              },
              "demo": {
                "default": false,
                "description": "Set true to lint a sample preset fixture when evidenceLogText / accessActivityLog is omitted.",
                "type": "boolean"
              },
              "disputedTransaction": {
                "description": "Optional disputed Stripe charge/transaction metadata evaluated against priorTransactions for Visa CE 3.0 qualification.",
                "type": "object"
              },
              "evidenceLogText": {
                "description": "Merged or candidate Stripe dispute evidence[access_activity_log] payload evaluated against the 18,000 UTF-16 code unit ceiling and non-destructive delimiter markers.",
                "maxLength": 30000,
                "type": "string"
              },
              "existingMerchantNotes": {
                "description": "Existing human AE/support notes inside evidence[access_activity_log] that must be preserved.",
                "maxLength": 30000,
                "type": "string"
              },
              "hasDeviceMatch": {
                "description": "Whether the disputed charge device_id fingerprint matches the historical undisputed charges.",
                "type": "boolean"
              },
              "hasIpMatch": {
                "description": "Whether the disputed charge IPv4/IPv6 address matches the historical undisputed charges.",
                "type": "boolean"
              },
              "preset": {
                "default": "valid_ce3_non_destructive",
                "description": "Scenario preset to evaluate when custom evidenceLogText / accessActivityLog is omitted (default: 'valid_ce3_non_destructive').",
                "enum": ["valid_ce3_non_destructive", "utf16_overflow_19k", "missing_device_and_overwrite_risk", "custom", "ce3_24k_truncation_trap", "ce3_clean_compacted_14k", "ce3_missing_device_binding_19k"],
                "type": "string"
              },
              "priorMatchedCount": {
                "description": "Number of prior undisputed Stripe charges (120d-365d old) with matching customer_id and IP/device fingerprint (Visa CE 3.0 requires >= 2).",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "priorTransactions": {
                "description": "Optional historical undisputed Stripe charges (120d-365d prior) evaluated for Visa CE 3.0 two-identifier overlap.",
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Stripe Dispute Evidence UTF-16 & CE 3.0 Completeness Linter"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c0a19f5f899543a1c8d7e4bbe23847577145078b1030fa791d1359136c83c36f"
        },
        {
          "name": "revclamp_reconcile_b2b_net_terms",
          "title": "Reconcile B2B Wholesale Net-15/30/60 Deposits & Credit Notes",
          "description": "Reconcile B2B wholesale Net-15, Net-30, and Net-60 invoice deposits, partial payments, and credit notes using exact integer minor-unit (EUR/USD cent) arithmetic with zero IEEE-754 floating-point drift. Executes as a pure, stateless, read-only financial reconciliation function. Returns structuredContent containing ok, mode, statelessEphemeralAudit, tenantId, and reconciliation (state, status, fulfillmentHold, releaseHoldAction, requiredDepositCents, remainingBalanceCents, creditDueCents, overpaidWarning, orderTag). Use this tool for B2B wholesale order deposit gating and Net-terms balance calculation; use revclamp_validate_eu_vat_vies for cross-border EU VAT number validation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "creditNoteCents": {
                "description": "Optional post-invoice credit notes or return adjustments in integer cents (valid range: 0 to totalOrderCents, default: 0; singular alias for creditNotesCents).",
                "minimum": 0,
                "type": "integer"
              },
              "creditNotesCents": {
                "description": "Optional post-invoice credit notes or return adjustments in integer cents (valid range: 0 to totalOrderCents, default: 0; plural alias for creditNoteCents).",
                "minimum": 0,
                "type": "integer"
              },
              "daysElapsedSinceInvoice": {
                "description": "Optional elapsed integer days since invoice issuance (valid range: 0 to 3650, default: 5).",
                "maximum": 3650,
                "minimum": 0,
                "type": "integer"
              },
              "demo": {
                "description": "Optional sandbox flag (boolean).",
                "type": "boolean"
              },
              "orderId": {
                "description": "B2B wholesale order or invoice identifier (e.g. 'gid://shopify/Order/908812' or 'ORD-2026-9088', default: 'ord_local_b2b_01', max 64 chars).",
                "type": "string"
              },
              "orderTotalCents": {
                "description": "Alias for totalOrderCents: gross invoice total in positive integer minor currency units / cents (must be > 0).",
                "minimum": 1,
                "type": "integer"
              },
              "paidAmountCents": {
                "description": "Required cumulative amount collected from the buyer in non-negative integer cents (e.g. 75000 for 750.00 EUR; must be >= 0).",
                "minimum": 0,
                "type": "integer"
              },
              "paymentTermsDays": {
                "description": "Optional B2B net payment terms maturity window in integer days (allowed values: 15, 30, or 60 for Net-15, Net-30, or Net-60; default: 30).",
                "enum": [15, 30, 60],
                "type": "integer"
              },
              "requiredDepositCents": {
                "description": "Optional explicit upfront deposit threshold in integer cents (valid range: 0 to effectiveTotalCents). Overrides requiredDepositPercent when provided.",
                "minimum": 0,
                "type": "integer"
              },
              "requiredDepositPercent": {
                "description": "Optional upfront deposit percentage required before releasing warehouse fulfillment hold (valid range: 0 to 100, default: 30 i.e. 30% upfront deposit).",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "toleranceCents": {
                "description": "Optional rounding/FX reconciliation tolerance in integer cents (valid range: 0 to min(500, 1% of totalOrderCents), default: 0).",
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "totalOrderCents": {
                "description": "Gross invoice total in positive integer minor currency units / cents (e.g. 250000 for 2,500.00 EUR; must be > 0).",
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Reconcile B2B Wholesale Net-15/30/60 Deposits & Credit Notes"
          },
          "behavior": {
