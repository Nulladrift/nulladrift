        },
        {
          "name": "revclamp_simulate_webhook_replay",
          "title": "Simulate Webhook Replay & Out-of-Order State Machine",
          "description": "Deterministically evaluate an ordered or out-of-order sequence of 1-10 Stripe/Shopify/RevClamp subscription lifecycle webhooks against a 72-hour idempotency deduplication Set (eventId), a configurable idempotencyWindowSec (60s-2592000s, default: 259200s / 72h), and a monotonic transition timestamp guard (event.createdSec >= lastAppliedCreatedSec). Compares RevClamp's monotonic FSM against a naive overwrite-on-arrival handler to detect resurrected canceled subscriptions, stale tier downgrades, and duplicate retry side-effects. Returns structuredContent containing ok, mode, statelessEphemeralAudit, tenantId, simulation, steps, finalStatus, finalTier, finalEntitlementDecision, naiveFinalStatus, and naiveHandlerBug.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "demo": {
                "description": "Optional sandbox flag to run the preset replay simulation.",
                "type": "boolean"
              },
              "events": {
                "description": "Optional custom array of 1 to 10 webhook events ({ eventId, eventType, createdSec, subscriptionStatus, tier, currentPeriodEndSec }) in arrival order.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "arrivedAtSec": {
                      "description": "Optional arrival timestamp in Unix seconds for per-event deduplication window evaluation.",
                      "maximum": 4102444800,
                      "minimum": 946684800,
                      "type": "integer"
                    },
                    "arrived_at_sec": {
                      "description": "Snake_case alias for arrivedAtSec in Unix seconds.",
                      "maximum": 4102444800,
                      "minimum": 946684800,
                      "type": "integer"
                    },
                    "created": {
                      "description": "Alias for createdSec when passing Stripe Unix created timestamps.",
                      "maximum": 4102444800,
                      "minimum": 946684800,
                      "type": "integer"
                    },
                    "createdSec": {
                      "description": "Provider event creation timestamp in Unix seconds (must be <= nowSec + 34560000 / 400 days) compared monotonically against lastAppliedCreatedSec.",
                      "maximum": 4102444800,
                      "minimum": 946684800,
                      "type": "integer"
                    },
                    "currentPeriodEndSec": {
                      "description": "Optional subscription current_period_end timestamp in Unix seconds.",
                      "maximum": 4102444800,
                      "minimum": 946684800,
                      "type": "integer"
                    },
                    "eventId": {
                      "description": "Unique provider webhook event ID (e.g. evt_cancel_final_1050) checked against the 72-hour deduplication Set.",
                      "maxLength": 96,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9_.:-]{1,96}$",
                      "type": "string"
                    },
                    "eventType": {
                      "description": "Webhook event type string (e.g. customer.subscription.deleted, customer.subscription.updated, invoice.payment_failed).",
                      "maxLength": 96,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9_.-]{1,96}$",
                      "type": "string"
                    },
                    "id": {
                      "description": "Alias for eventId when passing raw Stripe/Shopify event objects.",
                      "maxLength": 96,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9_.:-]{1,96}$",
                      "type": "string"
                    },
                    "status": {
                      "description": "Alias for subscriptionStatus.",
                      "enum": ["active", "trialing", "past_due", "paused", "canceled", "cancelled", "unpaid", "cancel_at_period_end", "expired"],
                      "type": "string"
                    },
                    "subscriptionStatus": {
                      "description": "Subscription lifecycle status carried by this webhook event.",
                      "enum": ["active", "trialing", "past_due", "paused", "canceled", "cancelled", "unpaid", "cancel_at_period_end", "expired"],
                      "type": "string"
                    },
                    "target_status": {
                      "description": "Snake_case alias for subscriptionStatus.",
                      "enum": ["active", "trialing", "past_due", "paused", "canceled", "cancelled", "unpaid", "cancel_at_period_end", "expired"],
                      "type": "string"
                    },
                    "tier": {
                      "description": "Optional RevClamp plan tier associated with the subscription state (default: 'growth_59').",
                      "enum": ["free", "starter_19", "growth_59", "scale_199"],
                      "type": "string"
                    },
                    "type": {
                      "description": "Alias for eventType (defaults to 'customer.subscription.updated' when omitted).",
                      "maxLength": 96,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9_.-]{1,96}$",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "idempotencyWindowSec": {
                "description": "Deduplication and replay-acceptance window in seconds (valid range: 60 to 2592000, default: 259200 for 72 hours).",
                "maximum": 2592000,
                "minimum": 60,
                "type": "integer"
              },
              "nowSec": {
                "description": "Reference evaluation timestamp in Unix seconds used to check the 72-hour idempotency window.",
                "maximum": 4102444800,
                "minimum": 946684800,
                "type": "integer"
              },
              "scenarioPreset": {
                "description": "Scenario preset to evaluate when custom events are omitted (default: 'out_of_order_stale_update_after_cancel').",
                "enum": ["out_of_order_stale_update_after_cancel", "duplicate_event_id_replay_72h", "valid_monotonic_upgrade_sequence", "expired_72h_window_stale_event", "custom"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Simulate Webhook Replay & Out-of-Order State Machine"
          },
          "behavior": {
