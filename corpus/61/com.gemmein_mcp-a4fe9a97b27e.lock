        {
          "name": "prove_app",
          "title": "Prove the app works",
          "description": "Proves on the server what a chat can't: Gemmein signs in as two of the app's test members (the first two test_member_add made, or the two named; never a real person, and no key passes through the chat) and runs the standard proofs through the app's real doors in Development. Useful before reporting the app as done. Each private or direct collection: alice writes; bob can't read, change, delete or list it; signed out, nobody can read or write. Each lockedFields field: alice's create naming it, and her update naming it, are both refused field_locked, whatever the value — a FAIL in plain words if either is accepted. A private, shared or community collection with a field named like status/paid/confirmed/approved/verified that ISN'T locked gets a WARN (never a refusal — a name proves nothing, but if it means paid or confirmed it should be in lockedFields). Each data_change relay on those collections that fires on created: it fired on alice's write, its run is on Relays → events, and an email_person action's email reached alice's test mailbox (no verified domain needed for test members). Each AI tool: one call as alice — it answers and spends the credits it states, or the line says to add the provider key on the AI page. One plain line per proof: pass, fail (with what is open or broken), couldn't run (with why), or warn. It deletes the records it wrote and ends its sessions; what the app's relays do with the write stands, as for any write (a call_url relay calls its address). Runs in Development only; the server refuses Live. 10 runs a day for each app. This is what a founder may call checking the app works, or is safe.",
