          "description": "Creates or updates one collection in Development from its declaration — exactly the JSON of gemmein/collections/<name>.json ({ rule, fields, unlockedBy, publishing, openFields, lockedFields, directInitiation, rankable }). Same validator as gemmein dev and sync: a bad name, rule or field is refused with the fix. Don't store health or medical data, biometric data, government ID numbers (such as social security or passport numbers) or payment card details in a collection; payments go through Stripe, which holds card details. A field whose name says it holds one of those (ssn, passport_number, card_number, cvc, diagnosis, medical_record…) is refused (sensitive_field). A rule never changes on an existing collection (that is a delete and recreate, which the founder approves). Anything the customer must never set — paid, confirmed, approved, a booking or order status — goes in \"lockedFields\": { \"status\": \"requested\" }: no app session can create or update that field (403 field_locked); only your server, a relay, an Edge function, a view action or the dashboard changes it. explain_rule explains each rule. A collection is what a founder may call a list of things the app keeps; its rule, who can see it.",
