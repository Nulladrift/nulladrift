        {
          "name": "explain_relay",
          "title": "Explain relay (validate offline)",
          "description": "Validates a relay definition — the contents of gemmein/relays/<name>.json — offline, before `gemmein sync` carries it to the cloud. A relay is the secure boundary for three jobs. React, nothing charged: a receiver (a provider's webhook), schedule (a clock), data_change (a record changing), credits_low or run_started trigger runs Gemmein's own verbs, and call_url sends a signed notice to the founder's server. Charge for an action, when the user's action costs credits (book a class, unlock, post): an app_call trigger — the app calls the relay by name with g.relays.call before anything is written — whose first action spend_credits takes the caller's own credits, or refuses with 402 credits_exhausted so nothing else runs, refunded if what it pays for (the first write) fails; once that is done the charge stands and later actions are follow-ups that retry. Charge for work the founder's own server does, AI or not: that is a pipeline, a tool on provider external (put_ai_tool), not call_url; a relay's start_run starts such a paid job from an event. One trigger and up to ten actions in Gemmein's own verbs (write_record, grant_access, revoke_access, grant_credits, spend_credits, email_person, call_url, run_function, start_run, fulfil_product, refund_product, grant_plan, revoke_plan) — Gemmein runs it: receives the event, maps the fields, authorises, carries out the action. Takes the definition JSON; returns the English sentence the dashboard shows (\"When gocardless-paid receives an event where event_type is confirmed → grant Pro, email the person, call https://…\") or the one refusal sentence the cloud would answer, naming the field and the fix. Offline and read-only: nothing is created. Two checks run only in the cloud and are stated in the answer (the API's own hosts; the address's resolved network at call time).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
