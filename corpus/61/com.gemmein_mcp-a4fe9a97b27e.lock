        {
          "name": "buy_plan",
          "title": "Buy a Gemmein plan (your human pays)",
          "description": "Free to build. You pay when an app goes live — or buy ahead if you're ready. Hands your human Gemmein's own payment page for the ACCOUNT's plan, before this app goes live (one plan covers every app on the account — Launch — $29 a month for the account, up to 5 apps — any may go live. 50 GB pooled storage.; Run a business — $79 a month for the account, up to 10 apps — any may go live. 200 GB pooled storage.; Grow — $199 a month for the account, up to 25 apps — any may go live. 500 GB pooled storage.; Annual billing on every paid tier: 2 months off, save 17% (Launch $290, Run a business $790, Grow $1,990 a year). Above 25 apps is Beyond: there's no checkout for it — your human talks to us at hello@gemmein.com. Nothing was set up.). They sign in, see the plan you named already picked — they can pick another tier or yearly there — and pay in Stripe's window. The plan then belongs to the ACCOUNT and billing starts at once, covering every app on it; this app is NOT taken live by it, and going live later (for this or any other app on the account) is only their approval (request_go_live), with no payment step. Paying is your human's act; this tool changes nothing itself. Answers state: waiting (the link — send it, then call buy_plan again with wait: 40 straight away, and again while it says waiting; it answers the moment they pay, or that the page was closed, expired or revoked (this connection disconnected) — never ask your human to tell you when they've paid), paid or already_paid (what the account owns), already_live (tier changes are your human's, in Stripe's billing portal from Usage), or refused (why, with the fix). Calling again reuses the same page. Opened from the app this connection is for, but pays for the whole account's plan. This is what a founder may call paying for Gemmein, buying a plan or subscribing.",
          "inputSchema": {
