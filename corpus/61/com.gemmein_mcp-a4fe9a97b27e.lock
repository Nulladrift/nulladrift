        {
          "name": "create_app",
          "title": "Ask to create a new app",
          "description": "Asks the founder to make another app on this same account, in Development only — a separate sandbox with its own collections, keys and settings, sharing nothing with this app's data. Refused once the account already has an app of that name or is at its cap. The new app has no connection of its own yet: a founder connects to it with its own `npx gemmein login` or its own connector approval, and picks it there. Going live for it is its own go-live, from inside it — that is what starts billing for it. This is a change to how the business runs: your human approves it in their browser with the code Gemmein emails (and, when they set one up, their authenticator app's code). Nothing changes until they approve; approving it carries it out — Gemmein does it the moment they press Approve, once, and records what happened on their Logs. The approval page shows Gemmein's own sentence of the real effect, read against Live; a request that no longer matches Live when it is carried out is refused and nothing changes. Returns the approval link for your human and a handle: live_action_status with wait: true answers the moment it is done, or why not — never ask your human to tell you they approved. A second call asks again (a new approval).",
