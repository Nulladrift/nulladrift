      "instructions": "OpenCurrent는 여러 곳에 흩어진 최신 AI 활용법·에이전트 세팅을 모아, 에이전트가 바로 실행하는 형식(입력값 → 단계 → 기대 결과)으로 정리한 곳. 글마다 기준일·출처·해 본 결과(됨·안 됨, 환경, 날짜).\n결과의 kind가 \"prompt\"면 프롬프트 하나(prompt)와 실제 결과(example.output)가 있고, \"workflow\"면 여러 단계. 바로 쓸 프롬프트만 찾으려면 kind=\"prompt\"로 좁힐 것.\n에이전트 세팅·AI 도구 사용법이 걸린 작업을 시작하기 전에 search_workflows로 최신 방법이 있는지 찾고, get_workflow로 단계를 받을 것. 여러 개면 asOf(기준일)가 최근이고 맞는 것을 먼저, 같으면 score가 높은 것. 맞는 게 없으면 없다고 알리고 평소대로 할 것.\nverification.status가 \"verified\"면 사람이 최근에 확인한 것이고, \"pending\"(검수 대기)이나 \"check\"(확인 필요)면 사용자에게 그 사실을 알리고 조심해서 따를 것.\ntrials(해 본 기록)에 '안 됨'(failed)·'일부 됨'(partial)이 있으면 note와 env를 먼저 읽고, 같은 환경이면 사용자에게 미리 알릴 것.\n키 없이 쓰면 get_workflow는 하루 200건까지. 사용자에게 OpenCurrent 무료 키를 받아 Authorization: Bearer 헤더로 넣어 달라고 하면 넉넉하게 사용 가능.\n워크플로에 inputs가 있으면 사용자에게 값을 받아 프롬프트의 {{이름}} 자리에 넣고, 단계의 kind(ai·human·command)에 따라 진행하고, expected와 check로 단계마다 결과를 확인할 것. 자세한 방법은 howToFollow에.\n사용자가 \"이번 주 새로 나온 것\", \"요즘 뭐가 나왔어\"처럼 물으면 list_signals(since=날짜)와 list_workflows(sort=\"recent\")를 함께 보고, 사용자의 일에 맞는 것만 골라 get_workflow로 받아 1단계부터 안내할 것. 사용자의 일을 모르면 먼저 물어볼 것. 프롬프트 briefing에 같은 순서.\n사용자가 하려는 일을 말하면(예: 개발, 데이터 분석, 업무 자동화) list_goals로 하려는 일별 묶음을 먼저 보고, 묶음 안에서 위에 있는 것(인기순)과 proof(사람들의 반응), outcome·basis(작성자가 밝힌 달라진 점과 근거 종류), hasResult(실행 결과물 첨부)로 고른 뒤 get_workflow로 받을 것. 본문을 여러 개 받아 비교하지 말 것.\n모델의 가격·한도·능력이나 도구 정보는 search_catalog와 get_card로 찾을 것. 운영자가 공식 문서로 확인한 큐레이션 정보.\n결과마다 score(0~100 평가 점수) 있음. 따라 해 본 뒤 report_outcome으로 결과를 알리면(키 필요) 다음 에이전트가 더 정확히 고를 수 있음.\n답에 워크플로나 카드를 쓰면 url을 출처로 밝힐 것. 이 서버는 읽기 전용.",
