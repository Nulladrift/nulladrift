        },
        {
          "name": "update_follower",
          "title": "Update a follower",
          "description": "Change rules, or pause and resume this follower. Changes apply to what's copied from then on.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adjust_contract_size": {
                "description": "Even out different contract sizes between the brokers (gold can be 100 oz a lot at one broker and 10 oz at another). Applies to `multiplier` and the ratio modes.",
                "type": "boolean"
              },
              "below_minimum": {
                "description": "When a copy comes out below the broker's minimum lot: trade the minimum, or skip it.",
                "enum": ["minimum", "skip"],
                "type": "string"
              },
              "copier_id": {
                "description": "The copier's ID.",
                "examples": ["3d2c1b0a-9f8e-4d7c-8b6a-5f4e3d2c1b0a"],
                "format": "uuid",
                "type": "string"
              },
              "copy_existing": {
                "description": "Also copy the positions and pending orders the master already has when the follower is attached. Nothing the master opens or places during a pause is ever copied.",
                "type": "boolean"
              },
              "copy_pending": {
                "description": "Place the master's pending orders on the follower as pending orders, and follow their changes, rather than copying them once they fill. Needs both terminals on the current version.",
                "type": "boolean"
              },
              "copy_stops": {
                "description": "Copy stop loss and take profit, including later changes.",
                "type": "boolean"
              },
              "follower_id": {
                "description": "The follower's ID (not its account's).",
                "examples": ["9a8b7c6d-5e4f-4a3b-9c2d-1e0f9a8b7c6d"],
                "format": "uuid",
                "type": "string"
              },
              "is_active": {
                "description": "Pause with `false`. Resuming copies only what the master opens from then on, also with `copy_existing`.",
                "type": "boolean"
              },
              "lot_mode": {
                "description": "How each copy is sized. `multiplier`: the master's lots times `lot_value`. `fixed`: `lot_value` lots on every copy. `balance_ratio` / `equity_ratio`: the master's lots scaled by this account's balance or equity against the master's, times `lot_value`. `risk_percent`: sized so the master's stop loss risks `lot_value` percent of this account's equity; trades without a stop loss are skipped.",
                "enum": ["multiplier", "fixed", "balance_ratio", "equity_ratio", "risk_percent"],
                "type": "string"
              },
              "lot_value": {
                "description": "The multiplier, the lot size or the risk percentage, by `lot_mode`. Above 0 and up to 1000; up to 100 for `risk_percent`. Up to four decimal places.",
                "examples": [1],
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              },
              "max_delay_seconds": {
                "description": "How late a master trade may still be copied, for example after a reconnect; older ones are skipped.",
                "maximum": 3600,
                "minimum": 0,
                "type": "integer"
              },
              "max_lot": {
                "description": "The most lots one copy may have; null for no limit.",
                "exclusiveMinimum": 0,
                "type": ["number", "null"]
              },
              "max_slippage_pips": {
                "description": "The slippage allowed per order; null uses the broker's default.",
                "minimum": 0,
                "type": ["number", "null"]
              },
              "reverse": {
                "description": "Sell when the master buys and the other way round; stop loss and take profit swap.",
                "type": "boolean"
              },
              "sessions": {
                "description": "When new trades are copied; empty means any time. Closes and changes to copies already open are always copied.",
                "items": {
                  "description": "A window in which new trades are copied.",
                  "properties": {
                    "days": {
                      "description": "0 is Monday, 6 Sunday.",
                      "examples": [
                        [0, 1, 2, 3, 4]
                      ],
                      "items": {
                        "maximum": 6,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "minItems": 1,
                      "type": "array"
                    },
                    "end": {
                      "description": "`HH:MM`. An end before its start runs past midnight.",
                      "examples": ["16:30"],
                      "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                      "type": "string"
                    },
                    "start": {
                      "description": "`HH:MM`, 24-hour.",
                      "examples": ["07:00"],
                      "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                      "type": "string"
                    }
                  },
                  "required": ["days", "end", "start"],
                  "type": "object"
                },
                "maxItems": 14,
                "type": "array"
              },
              "symbol_filter": {
                "description": "`all` copies every symbol, `include` only those in `symbols`, `exclude` all but them.",
                "enum": ["all", "include", "exclude"],
                "type": "string"
              },
              "symbol_map": {
                "additionalProperties": {
                  "maxLength": 32,
                  "type": "string"
                },
                "description": "Master symbol to follower symbol, for names that don't match by themselves. Matching tries this map, then the same name, the name without the broker's decorations (`EURUSD.m`, `US30.cash`), then known aliases (`XAUUSD` and `GOLD`); anything still ambiguous is skipped, never guessed.",
                "examples": [
                  {
                    "XAUUSD": "GOLD.m"
                  }
                ],
                "maxProperties": 200,
                "type": "object"
              },
              "symbols": {
                "description": "The master's symbol names for `symbol_filter`, which needs at least one unless it is `all`. `XAUUSD` also covers decorated names such as `XAUUSD.m`.",
                "examples": [
                  ["XAUUSD", "EURUSD"]
                ],
                "items": {
                  "maxLength": 32,
                  "type": "string"
                },
                "maxItems": 200,
                "type": "array"
              },
              "timezone": {
                "description": "The clock `sessions` are read on: `broker` (the master broker's server time, as its MetaTrader charts show it) or a time zone name such as `Europe/London`.",
                "examples": ["broker"],
                "type": "string"
              }
            },
            "required": ["copier_id", "follower_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Update a follower"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
