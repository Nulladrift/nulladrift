{
  "lockfileVersion": 2,
  "subjects": {
    "com.algotradertools/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.algotradertools.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "algotradertools",
        "title": "Algo Trader Tools",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Algo Trader Tools copies trades between MetaTrader 4 and 5 accounts. These tools manage the accounts, copiers and followers of the user this API key belongs to, with the same rules as the app. A copier copies one master account to its followers, and each follower has its own rules: sizing, reverse, stops, symbol filters and mapping, trading sessions.\n\nStart with list_accounts and list_copiers to get ids. An account id goes into create_copier as master_id and into add_follower as account_id. Lists come in pages: while has_more is true, pass next_cursor as cursor. Only the tools this key's scopes allow are listed. Without a key every tool is listed, and each call fails with authentication_required: the user creates a key at https://app.algotradertools.com/api-keys and adds it to this client's settings.\n\nChanges reach live trading at once. Pausing stops new copies; delete_copier and remove_follower with close_positions=true close the copies at market; disconnect_account deletes the account with its history. Confirm with the user before changing or deleting anything.\n\nA failed call returns the API's error: code says what went wrong, detail how to fix it, and errors lists each invalid field with a JSON Pointer to it.\n\nConnecting or reconnecting an account needs the broker password, which should not pass through a chat, so there is no tool for it: the user connects accounts in the app at https://app.algotradertools.com/accounts.",
      "tools": [
        {
          "name": "add_follower",
          "title": "Add a follower",
          "description": "Attaches one of your accounts to the copier with its own rules; leave a rule out for its default. Copying starts at once (unless `is_active` is false), with what the master opens from then on. Retrying is safe: a second attempt fails with `already_following`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "account_id": {
                "description": "One of your connected accounts: connected with its master password, not this copier's master, not a master anywhere and not already copying this master.",
                "examples": ["0b7e5c1a-2f3d-4e6a-8b9c-7d6e5f4a3b2c"],
                "format": "uuid",
                "type": "string"
              },
              "adjust_contract_size": {
                "default": true,
                "description": "Even out different contract sizes between the brokers (gold can be 100 oz a lot at one broker and 10 oz at another). Applies to `multiplier` and the ratio modes.",
                "type": "boolean"
              },
              "below_minimum": {
                "default": "minimum",
                "description": "When a copy comes out below the broker's minimum lot: trade the minimum, or skip it.",
                "enum": ["minimum", "skip"],
                "type": "string"
              },
              "copier_id": {
                "description": "The copier's ID.",
                "examples": ["3d2c1b0a-9f8e-4d7c-8b6a-5f4e3d2c1b0a"],
                "format": "uuid",
                "type": "string"
              },
              "copy_existing": {
                "default": false,
                "description": "Also copy the positions and pending orders the master already has when the follower is attached. Nothing the master opens or places during a pause is ever copied.",
                "type": "boolean"
              },
              "copy_pending": {
                "default": false,
                "description": "Place the master's pending orders on the follower as pending orders, and follow their changes, rather than copying them once they fill. Needs both terminals on the current version.",
                "type": "boolean"
              },
              "copy_stops": {
                "default": true,
                "description": "Copy stop loss and take profit, including later changes.",
                "type": "boolean"
              },
              "is_active": {
                "default": true,
                "description": "Start paused with `false`.",
                "type": "boolean"
              },
              "lot_mode": {
                "default": "multiplier",
                "description": "How each copy is sized. `multiplier`: the master's lots times `lot_value`. `fixed`: `lot_value` lots on every copy. `balance_ratio` / `equity_ratio`: the master's lots scaled by this account's balance or equity against the master's, times `lot_value`. `risk_percent`: sized so the master's stop loss risks `lot_value` percent of this account's equity; trades without a stop loss are skipped.",
                "enum": ["multiplier", "fixed", "balance_ratio", "equity_ratio", "risk_percent"],
                "type": "string"
              },
              "lot_value": {
                "default": 1,
                "description": "The multiplier, the lot size or the risk percentage, by `lot_mode`. Above 0 and up to 1000; up to 100 for `risk_percent`. Up to four decimal places.",
                "examples": [1],
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              },
              "max_delay_seconds": {
                "default": 60,
                "description": "How late a master trade may still be copied, for example after a reconnect; older ones are skipped.",
                "maximum": 3600,
                "minimum": 0,
                "type": "integer"
              },
              "max_lot": {
                "default": null,
                "description": "The most lots one copy may have; null for no limit.",
                "exclusiveMinimum": 0,
                "type": ["number", "null"]
              },
              "max_slippage_pips": {
                "description": "The slippage allowed per order; null uses the broker's default.",
                "minimum": 0,
                "type": ["number", "null"]
              },
              "reverse": {
                "default": false,
                "description": "Sell when the master buys and the other way round; stop loss and take profit swap.",
                "type": "boolean"
              },
              "sessions": {
                "default": [],
                "description": "When new trades are copied; empty means any time. Closes and changes to copies already open are always copied.",
                "items": {
                  "description": "A window in which new trades are copied.",
                  "properties": {
                    "days": {
                      "description": "0 is Monday, 6 Sunday.",
                      "examples": [
                        [0, 1, 2, 3, 4]
                      ],
                      "items": {
                        "maximum": 6,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "minItems": 1,
                      "type": "array"
                    },
                    "end": {
                      "description": "`HH:MM`. An end before its start runs past midnight.",
                      "examples": ["16:30"],
                      "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                      "type": "string"
                    },
                    "start": {
                      "description": "`HH:MM`, 24-hour.",
                      "examples": ["07:00"],
                      "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                      "type": "string"
                    }
                  },
                  "required": ["days", "end", "start"],
                  "type": "object"
                },
                "maxItems": 14,
                "type": "array"
              },
              "symbol_filter": {
                "default": "all",
                "description": "`all` copies every symbol, `include` only those in `symbols`, `exclude` all but them.",
                "enum": ["all", "include", "exclude"],
                "type": "string"
              },
              "symbol_map": {
                "additionalProperties": {
                  "maxLength": 32,
                  "type": "string"
                },
                "default": {},
                "description": "Master symbol to follower symbol, for names that don't match by themselves. Matching tries this map, then the same name, the name without the broker's decorations (`EURUSD.m`, `US30.cash`), then known aliases (`XAUUSD` and `GOLD`); anything still ambiguous is skipped, never guessed.",
                "examples": [
                  {
                    "XAUUSD": "GOLD.m"
                  }
                ],
                "maxProperties": 200,
                "type": "object"
              },
              "symbols": {
                "default": [],
                "description": "The master's symbol names for `symbol_filter`, which needs at least one unless it is `all`. `XAUUSD` also covers decorated names such as `XAUUSD.m`.",
                "examples": [
                  ["XAUUSD", "EURUSD"]
                ],
                "items": {
                  "maxLength": 32,
                  "type": "string"
                },
                "maxItems": 200,
                "type": "array"
              },
              "timezone": {
                "default": "broker",
                "description": "The clock `sessions` are read on: `broker` (the master broker's server time, as its MetaTrader charts show it) or a time zone name such as `Europe/London`.",
                "examples": ["broker"],
                "type": "string"
              }
            },
            "required": ["account_id", "copier_id"],
            "type": "object"
          },
