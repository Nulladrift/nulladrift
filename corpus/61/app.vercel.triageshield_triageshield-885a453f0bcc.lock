            "properties": {
              "repo": {
                "description": "A github.com/owner/name URL for the repo the report claims to be about",
                "type": "string"
              },
              "report": {
                "description": "The vulnerability report text to check",
                "type": "string"
              }
            },
            "required": ["repo", "report"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
