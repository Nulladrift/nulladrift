        },
        {
          "name": "lookup_ip",
          "title": "IP Intelligence Lookup",
          "description": "Query complete IP intelligence: geolocation, ISP, ASN, IP type (residential/datacenter/mobile/VPN/proxy/Tor), risk score, and IPIPAI composite score (0-100 with grade A+ to D). This is the primary tool for IP analysis.",
          "inputSchema": {
            "properties": {
              "check_services": {
                "default": false,
                "description": "If true, also check AI service accessibility (ChatGPT, Claude, Gemini, Copilot)",
                "type": "boolean"
              },
              "ip": {
                "description": "IPv4 or IPv6 address (e.g. \"8.8.8.8\" or \"2606:4700:4700::1111\")",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Response language",
                "enum": ["en", "zh"],
                "type": "string"
              }
            },
            "required": ["ip"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:056a3b197c0bc55902b013529d1740df574ec76bb7b42c71a0ea1027b02b60f2"
        },
        {
