        },
        {
          "name": "check_service_access",
          "title": "Service Accessibility Check",
          "description": "Check if a specific service (ChatGPT, Claude, Netflix, Disney+, etc.) is accessible from a given IP location. Useful for diagnosing \"why can't I access X?\" questions.",
          "inputSchema": {
            "properties": {
              "ip": {
                "description": "IP address to check from",
                "type": "string"
              },
              "service": {
                "description": "Service ID to check",
                "enum": ["chatgpt", "claude", "gemini", "copilot", "netflix", "disney", "youtube", "spotify", "tiktok", "google", "github", "twitter"],
                "type": "string"
              }
            },
            "required": ["ip", "service"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:89f737af49f8a40d8cc5e69a66bf4c039a18fff0009358036a07c50e953f863a"
        },
        {
          "name": "check_website_availability",
          "title": "Website Availability Check",
