        {
          "name": "check_ip_reputation",
          "title": "IP Reputation Check",
          "description": "Check IP reputation: proxy/VPN detection, Tor exit node, blacklist status, hosting/datacenter classification. Returns a verdict (Safe / Low / Medium / High / Critical Risk) with pass/fail checks.",
          "inputSchema": {
            "properties": {
              "ip": {
                "description": "IP address to check",
                "type": "string"
              }
            },
            "required": ["ip"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
