          "inputSchema": {
            "properties": {
              "mac": {
                "description": "MAC address (e.g. \"00:1A:2B:3C:4D:5E\" or \"001A2B3C4D5E\")",
                "type": "string"
              }
            },
            "required": ["mac"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
