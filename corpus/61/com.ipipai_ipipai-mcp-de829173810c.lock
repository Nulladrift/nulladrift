            "readOnly": false
          },
          "digest": "sha256:7e47f005195e0f34c08f478461adb5d73df6e9583b3b99148ff95707327e23bd"
        },
        {
          "name": "trace_route",
          "title": "Traceroute",
          "description": "Trace the network path from the server to a target host. Returns hop-by-hop IP, hostname, and latency for each hop.",
