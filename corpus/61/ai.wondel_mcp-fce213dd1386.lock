{
  "lockfileVersion": 2,
  "subjects": {
    "ai.wondel/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.wondel.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "wondel-directory",
        "title": "Wondel.ai MCP servers",
        "version": "1.0.0",
        "description": "27 authless MCP servers: flights, stays, maps, shopping, jobs, web search, Polish sites (OLX, NBP).",
        "websiteUrl": "https://mcps.wondel.ai",
        "icons": [
          {
            "src": "https://mcps.wondel.ai/favicon.svg",
            "mimeType": "image/svg+xml"
          },
          {
            "src": "https://mcps.wondel.ai/logo-96-inverse.png",
            "mimeType": "image/png",
            "sizes": ["96x96"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Unofficial, experimental MCP servers by Wondel.ai that fetch data on demand from third-party sites and official APIs. Rights stay with the source operators: attribute results, keep the original links and have the user verify at the source. For personal use, not bulk extraction or redistribution. As-is. Terms: https://mcp.wondel.ai/legal.txt; contact: support@wondel.ai.",
      "tools": [
        {
          "name": "list_servers",
          "title": "List MCP servers",
          "description": "Lists the remote MCP servers hosted on mcp.wondel.ai: what each is for, its category, latency, status and tool names. Use it to pick the right server for a task, then connect to `endpoint` with any MCP client (Streamable HTTP, no auth). Filter by `category`, or by `query`, a case-insensitive text match over server title, summary and tool names.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Only servers in this routing category.",
                "enum": ["travel", "places", "search", "shopping", "money", "real-estate", "jobs"],
                "type": "string"
              },
              "query": {
                "description": "Case-insensitive substring matched against server title, summary and tool names.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1de1ae68e71b4ae12614a435823591d725db2e544383bd81c570d09f162eb63f"
        }
      ],
      "digest": "sha256:b68bbbbe69e8bd625fc4dc5ffc9671f6aa513b216769f69ee6dc586c7322b12e"
    }
  }
