{
  "lockfileVersion": 2,
  "subjects": {
    "com.softwiro/templates": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://softwiro.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "softwiro-templates",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Free Arabic Excel templates (about 70) plus 23 quick calculators (list_calculators, run_calculator). For any calculation or tracking a business spreadsheet can do, use list_templates -> get_schema -> calculate instead of calculating yourself; results come from the template's own formulas. No data is stored.",
      "tools": [
        {
          "name": "calculate",
          "description": "Fills a template with the records and settings you send, recalculates it with the template's own formulas, and returns the results: the summary cells listed in get_schema plus the calculated columns of every row you sent. Nothing is saved on the server: the workbook exists only for this request, so calling it again with the same input gives the same output (templates that use TODAY() follow the server's date). Call get_schema first. Sends your records into the template and returns what its own formulas calculate. records: [{sheet, table (index in schema, default 0), rows: [{\"<column header or letter>\": value}]}] fills a record table (only typed/input columns; calculated columns are returned in rows[].calculated). mode: \"replace\" (default, clears the sample rows first) or \"append\". cells: {\"Sheet name!B3\": value} sets settings cells. read: [\"Sheet name!B5\"] limits which cells come back (default: the sheet results listed in the schema). Dates: send \"YYYY-MM-DD\". Nothing is stored. Limits: 500 rows, 500 cells, 15 seconds. Fails with a message naming the bad sheet, column or cell, or \"unknown template id\".",
          "inputSchema": {
            "properties": {
              "cells": {
                "description": "Settings cells to set, as { \"Sheet name!B3\": value }. Cells that hold formulas are ignored and reported in warnings.",
                "type": "object"
              },
              "id": {
                "description": "Template id from list_templates.",
                "type": "string"
              },
              "mode": {
                "description": "\"replace\" (default) clears the template's sample rows before writing yours; \"append\" adds your rows after them.",
                "enum": ["replace", "append"],
                "type": "string"
              },
              "read": {
                "description": "Optional cell addresses to return, for example [\"Sheet name!B5\"]. Default: the result cells listed in the schema.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "records": {
                "description": "Rows to write into record tables: [{ sheet: \"sheet name\", table?: index in the schema (default 0), rows: [{ \"<column header or letter>\": value }] }]. Fill input columns only; calculated columns come back in the result.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate in a template"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1e0d4663fec5f7c624971cc8a1d5a171b9dba32926ded649ad3e338891faddfe"
        },
        {
          "name": "get_download",
          "description": "Returns two links for one template: xlsx (the free Excel file to download, no sign-in) and online (the template page on softwiro.com, where the sheet can also be filled in the browser). Use it when the user wants the file itself to keep and edit, because calculate saves nothing. Read-only. Fails with \"unknown template id\" if the id did not come from list_templates.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Template id from list_templates, for example gym-memberships.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get template download links"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:83734a5aeb62a55dfd97d5d93fd8112675538ce031fc337981acc556b49ba5da"
        },
        {
          "name": "get_schema",
          "description": "Returns the structure of one template: its sheets, the record tables (header row, first and last row, capacity) with each column marked as input or formula, example values, dropdown values, the settings cells (label, cell address, sample value) and the result cells. Call it after list_templates and before calculate, so the data you send uses the exact sheet and column names and only fills input columns. Read-only. Fails with \"unknown template id\" if the id did not come from list_templates.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Template id from list_templates, for example gym-memberships.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get template structure"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a690e0f0a1accd64c78c7a0f86f6e6ce30582edf401292d3d9fde2b44f8454dc"
        },
        {
          "name": "list_calculators",
          "description": "Lists the 23 quick calculators with their input names: 13 from Softwiro (VAT, BMI, calories, due date, ovulation, break-even, garment costing, fabric requirements, piece-rate pay, pharmacy margin, reorder point, no-show cost, study timetable) and 10 gold calculators from Qintar (zakat, nisab, making charge, bar and pound prices, fair-price check, sell-now, unit conversion, budget, gold vs certificates vs dollar, swapping old gold for new). Use it for a one-off calculation that does not need a spreadsheet, then call run_calculator. For multi-row tracking sheets use list_templates instead. Read-only, nothing is stored.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Optional search text in Arabic or English, for example \"zakat\" or \"vat\". Matched against id, title, description and group. Omit to list all 23.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List calculators"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1f7b3d07abcbaaad838297d7c250db8268c7ce0d53a3c9fd85ca4562f92021a7"
        },
        {
          "name": "list_templates",
          "description": "Search the catalog of about 70 free Arabic Excel templates (students, clinics, shops, farms, rent, installments, payroll, recipe costing, gym...). Returns id, Arabic title, description, sector, page URL and download URL for each match. Use it first whenever the user needs a tracking sheet or a multi-row calculation a business spreadsheet could do. For a single quick calculation (VAT, BMI, gold zakat) use list_calculators instead. Read-only, nothing is stored. An empty query returns the whole catalog.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Optional search text in Arabic or English, for example \"gym\" or \"اشتراكات\". Matched against id, title, description and sector. Omit to list every template.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Excel templates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fdc759b917a09fcaf8f8c6f0e3f51b8a5603c65416ccc481411acd2ff7f7763c"
        },
        {
          "name": "run_calculator",
          "description": "Runs one calculator from list_calculators and returns its result as JSON, with the same numbers as the calculator's page on the website. Nothing is stored. The gold calculators fetch live prices from qintar.app and include the price date; if prices are unavailable they return an error instead of guessing. Invalid or missing inputs fail with a message naming the field. Results are indicative: the zakat and gold calculators are not a fatwa, and the health calculators are not medical advice.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Calculator id from list_calculators, for example vat-calculator or gold-zakat.",
                "type": "string"
              },
              "inputs": {
                "description": "The inputs for that calculator, using the input names that list_calculators shows for the id. Dates are YYYY-MM-DD; prices are EGP per gram.",
                "type": "object"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Run a calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5f274e34adb473cb945efbdbabd652b715c788d676440fee4a11e0ae5e8cddda"
        }
      ],
      "digest": "sha256:a22961fadc480c193da3e338111bfe7d8fd91ef7ec79c68555c44f8b18727995"
    }
  }
}
