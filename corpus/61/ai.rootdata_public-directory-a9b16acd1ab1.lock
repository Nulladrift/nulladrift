        },
        {
          "name": "root_data_faq",
          "title": "Root Data FAQ",
          "description": "Answer common public questions about Root Data services, DSO directories, dental practice benchmarks, AI Coach, integrations, privacy, demos, and pricing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 160,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
