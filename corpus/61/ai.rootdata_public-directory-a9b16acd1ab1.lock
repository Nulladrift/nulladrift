{
  "lockfileVersion": 2,
  "subjects": {
    "ai.rootdata/public-directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://rootdata.ai/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "root-data-public-directory",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "compare_dsos",
          "title": "Compare DSOs",
          "description": "Compare two Root Data public DSO directory profiles by slug using public profile summaries, regions, websites, and public signal counts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "dso_slug1": {
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "dso_slug2": {
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["dso_slug1", "dso_slug2"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:bdee658d48a7db9847e9c5909e8cafd0016467df623429047f7066c7b5ace1e1"
        },
        {
          "name": "get_dso_profile",
          "title": "Get DSO Profile",
          "description": "Get one public Root Data DSO directory profile by slug. Returns public website, region, profile URL, summary, and public signals.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:2e4ceb8a8ed387a0da367d69cb69549671c43a3902e6b211582e2f4afea69d08"
        },
        {
          "name": "get_practice_profile",
          "title": "Get Practice Profile",
          "description": "Get one published public dental practice directory profile by slug. Returns public website, locations, services, rating summary, and profile URL.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "maxLength": 180,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:91f173c482e534e1c4f370178a2b1ba61a9966c8f65dfcf110f8e5ba2ede9c31"
        },
        {
          "name": "list_top_dsos",
          "title": "List Top DSOs",
          "description": "List public DSO directory profiles ranked by public size, locations, or growth signals inferred from public profile text. Results are directional, not a private operating benchmark.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "by": {
                "enum": ["size", "locations", "growth"],
                "type": "string"
              },
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["by"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
