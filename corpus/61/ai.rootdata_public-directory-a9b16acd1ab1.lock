        },
        {
          "name": "search_blog_articles",
          "title": "Search Blog Articles",
          "description": "Search published Root Data blog articles by title, slug, excerpt, category, tag, or SEO summary. Supports DSO-only, practice-only, both-audience, or all articles.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "audience": {
                "enum": ["dso", "practice", "both", "all"],
                "type": "string"
              },
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 160,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9bdaa11f0519048ad16931d040f4a7232b61a09cf33c2462483e22475f764260"
        },
        {
          "name": "search_dsos",
          "title": "Search DSOs",
          "description": "Search Root Data's public DSO directory by organization name, slug, website, summary, or public website signals. Returns public directory data only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:af92e6cf8e0529fff51e83f839700f33b3703803d86c92a7db30bdef54f5b31f"
        },
        {
          "name": "search_practices",
          "title": "Search Dental Practices",
          "description": "Search Root Data's public dental practice directory. Supports query, service, location, city, state, minimum Google reviews, minimum star rating, and sorting by Google review count or rating. Returns published public listings only. All parameters are optional.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "maxLength": 80,
                "type": "string"
              },
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "maxLength": 120,
                "type": "string"
              },
              "query": {
                "maxLength": 120,
                "type": "string"
              },
              "reviews": {
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              },
              "service": {
                "maxLength": 100,
                "type": "string"
              },
              "sortBy": {
                "enum": ["default", "name", "google_reviews", "google_rating"],
                "type": "string"
              },
              "stars": {
                "maximum": 5,
                "minimum": 0,
                "type": "number"
              },
              "state": {
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:94293483547f9f69264a3940b799ad6f42963161b8fc7757aa84fb636737a763"
