          },
          "digest": "sha256:1a2c3398e093be331acd94925b9bc3e75fba7a3c5bbe4022c66b0692ab6848cf"
        },
        {
          "name": "list_templates",
          "title": "List Filmagic templates",
          "description": "List Filmagic video and social post templates with what each is for, its category and lengths. Filter by category (Launch, Posts, Story, Product, Mockup, Demo, Social) or a search word.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Launch, Posts, Story, Product, Mockup, Demo or Social",
                "type": "string"
              },
              "limit": {
                "description": "How many to return (default 25)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "A word to match in the name or use, e.g. \"AI\", \"app\", \"carousel\"",
                "type": "string"
              }
            },
            "type": "object"
          },
