      "serverInfo": {
        "name": "filmagic",
        "title": "Filmagic",
        "version": "1.0.0",
        "websiteUrl": "https://filmagic.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Filmagic turns a product website into a branded launch video or social post: it reads the site for the name, copy, colours, fonts, logo and screens, writes the scenes and cuts them to music. The video is built and previewed in the user's browser from the returned link; exporting the MP4 happens there (free accounts get 3 exports a month at 720p).",
      "tools": [
        {
          "name": "create_video",
          "title": "Make a launch video from a website",
          "description": "Start a Filmagic video from a product website. Returns a filmagic.app link: opening it reads the site and builds the video in the browser, ready to preview, edit and export. Without a template, Filmagic writes a custom cut for the product; with one, it fills that template.",
          "inputSchema": {
            "properties": {
              "template": {
                "description": "Optional template id, e.g. \"xstyle\", \"beam\" or \"whatsnew\"",
                "type": "string"
              },
              "url": {
                "description": "The product website, e.g. https://yourproduct.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Make a launch video from a website"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:21cc51dd5b6c3fbf500723fb25167b45d5c37daf90d21286779e925b497b1cfa"
        },
        {
          "name": "get_pricing",
          "title": "Filmagic pricing",
          "description": "Filmagic plans and what each includes: the free plan, the one-video pass and the monthly plans, with credits and export quality.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Filmagic pricing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
