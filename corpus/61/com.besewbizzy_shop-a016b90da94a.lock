            "readOnly": true
          },
          "digest": "sha256:beb635591f8bb058eb816dd5b89f5a4b81e03522447c5d53f3ffd37c8a691d25"
        },
        {
          "name": "search_products",
          "title": "Search products",
          "description": "Search the shop's products by name, maker, collection, color or SKU — every word must match. Returns price, sale price, whether it's per yard, stock, colors and the product url.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "e.g. \"riley blake stripe\", \"magic dot raspberry\", \"kona black\", \"5230-33\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search products"
          },
          "behavior": {
