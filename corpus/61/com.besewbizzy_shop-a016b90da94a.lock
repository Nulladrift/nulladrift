      "serverInfo": {
        "name": "besewbizzy",
        "title": "Be Sew Bizzy",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Be Sew Bizzy is a quilt and sewing shop. Use these tools to answer questions about what it sells (quilting fabric, notions, patterns, embroidery supplies), prices and sales, stock, upcoming classes and events, and opening hours. Prices are USD and fabric is priced per yard. Always give the customer the product or class url. Don't guess — search.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch a product",
          "description": "Full details of one product by the id search returned: price, sale price, per-yard or each, stock, every color and the description.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "An id from search results",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch a product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d7dc8e7bfca603833a62ce6ae19f6ecf4f1067f897da7ca70f9c0d819efdfc99"
        },
        {
          "name": "get_product",
          "title": "Get product",
          "description": "One product by its slug (from search results): description, price, sale price, and every color with its SKU and stock.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The product's slug, e.g. \"moda-magic-dot\"",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:976193393fc1fa0a105a0a2bb35f016f8b6abffbb60831da991acf0d82b4e0f0"
        },
        {
          "name": "get_store_info",
          "title": "Store hours",
          "description": "The shop's posted opening hours and whether it is open right now.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Store hours"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:32904870e60d6fef4bcfa8eccef17608ece6b1765467af844a40fc95c8ef986e"
        },
        {
          "name": "list_classes",
          "title": "Upcoming classes and events",
          "description": "Upcoming class and event sessions at the shop, soonest first, with date, time, price, instructor and url.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "default": 60,
                "description": "How many days ahead to look.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words the class title must contain.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Upcoming classes and events"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1d3374fa4df29c4779d843d5efad599da92dcf359d8fef8d356c2336b43c3d47"
        },
        {
          "name": "search",
          "title": "Search the shop",
          "description": "Search Be Sew Bizzy's products (quilt fabric, notions, patterns, embroidery supplies) by name, maker, collection, color or SKU. Returns ids to pass to fetch for price, sale, stock and colors.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "e.g. \"riley blake stripe\", \"magic dot raspberry\", \"kona black\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the shop"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
