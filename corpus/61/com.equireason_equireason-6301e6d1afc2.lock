      "serverInfo": {
        "name": "equireason",
        "title": "EquiReason",
        "version": "1.0.0",
        "websiteUrl": "https://equireason.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "EquiReason serves the filed record of about 3,100 US-listed companies: annual statements from SEC XBRL, recent 10-K/10-Q/8-K filings with plain-language summaries, Form 4 insider trades, 13F holders and tracked fund portfolios, weekly lists of guidance changes and corporate events, and market trends with the conditions that would end them. Signed in with an EquiReason account, get_company adds the research the user's plan includes (verdict, its reasons, what would change it, valuation, prices, analyst estimates) and get_opportunities ranks companies. get_company_history reads EquiReason's forward-observed revision ledger: it starts only when the system first captured a value, so history before that first capture is unknown, not reconstructed. It is not Morningstar-equivalent retroactive history. Start with search_companies when you only have a company name. Cite the `url` field so the reader can check the source. It does not give buy or sell recommendations.",
      "tools": [
        {
          "name": "get_company",
          "title": "Get a company's filed record",
          "description": "A company's filed record: annual income, balance-sheet and cash-flow lines from SEC XBRL, revenue mix by reported segment, the latest filings with plain-language summaries and links, Form 4 insider trades (planned vs unplanned), 13F holder counts by quarter, risk-factor changes and earnings-call dates. Signed in, it adds the research the user's plan includes: the verdict and its reasons, what would change it, valuation, prices and analyst estimates.",
          "inputSchema": {
            "properties": {
              "ticker": {
                "description": "US ticker, e.g. AAPL",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a company's filed record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:bc8ece4a45cae99e4b5e3fd269c1c6532b4facbf953102e33ab2a3c48c1bb4fb"
        },
        {
          "name": "get_company_history",
          "title": "Get a company's forward PIT history",
          "description": "Read EquiReason's forward-observed revision ledger as of an ISO date or offset timestamp. Coverage starts at the system's first capture for each domain: values before that capture are unknown, not reconstructed, and overwritten pre-ledger intraday data is not recovered. Each row carries revision, fiscal period, basis, source lineage, first-seen and observed-at. Requires signing in; financial, estimate, guidance, verdict and transcript-reading domains follow the plan's existing feature entitlements. Bounded paging with cursor/high_watermark.",
          "inputSchema": {
            "properties": {
              "as_of": {
                "description": "ISO date (YYYY-MM-DD) or timestamp with offset, e.g. 2026-11-05T14:00:00Z",
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous page",
                "minimum": 0,
                "type": "integer"
              },
              "domains": {
                "description": "Optional domains; omit for all available domains",
                "items": {
                  "enum": ["annual_financials", "quarterly_financials", "balance_financials", "kpi", "market_cap_ev", "guidance", "estimates", "earnings_surprise", "verdict", "transcript_reading"],
                  "type": "string"
                },
                "type": "array"
              },
              "high_watermark": {
                "description": "high_watermark from the first page; pins the snapshot",
                "minimum": 0,
                "type": "integer"
              },
              "limit": {
                "description": "Rows per page (default 50)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "ticker": {
                "description": "US ticker, e.g. AAPL",
                "type": "string"
              }
            },
            "required": ["as_of", "ticker"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a company's forward PIT history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:f18dd637ae513f123cfe7ef6060786d83710d6f129bdd9d405ff12e665a81b38"
        },
