        {
          "name": "list_filing_events",
          "title": "List this week's filing events",
          "description": "Companies with a given event in the last 7 days (or an earlier ISO week): guidance raised or cut, unplanned insider buying, executive changes, acquisitions, buybacks, layoffs. Each row quotes the filing or call.",
          "inputSchema": {
            "properties": {
              "kind": {
                "enum": ["guidance", "insider-buying", "executive-changes", "acquisitions", "buybacks", "layoffs"],
                "type": "string"
              },
              "limit": {
                "description": "Rows per page (default 50)",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Zero-based row offset; use `next` from the previous page",
                "minimum": 0,
                "type": "integer"
              },
              "snapshot": {
                "description": "Snapshot from the first page; detects changed lists",
                "type": "string"
              },
              "week": {
                "description": "Optional ISO week such as 2026-w44; omit for the last 7 days",
                "type": "string"
              }
