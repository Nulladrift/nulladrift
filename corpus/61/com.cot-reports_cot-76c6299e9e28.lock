{
  "lockfileVersion": 2,
  "subjects": {
    "com.cot-reports/cot": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.cot-reports.com/"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "cot-reports",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "COT-Reports.com — the weekly CFTC Commitments of Traders (COT) data for 350+ U.S. futures markets: who is long and short (speculators, hedgers, small traders), week-on-week changes, open interest. Start with get_latest_positions for one market, get_latest_snapshot or get_weekly_summary for an overview, list_markets to find a market. Every answer names the report date and links to the matching COT-Reports page — cite them.",
      "tools": [
        {
          "name": "explain_cot",
          "title": "Explain a COT concept",
          "description": "A short explanation of a COT concept — the trader groups, net positions, open interest, the four report families, the COT index, release timing — with a link to the full guide. Available at every level.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "topic": {
                "description": "The concept to explain.",
                "enum": ["what_is_cot", "trader_groups", "net_position", "open_interest", "report_families", "cot_index", "release_timing"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain a COT concept"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4ef0177496c2dda6c8ad68dd4c425a1d5508a02f0461957bfebaaf0aafcf173b"
        },
        {
          "name": "get_cot_index",
          "title": "COT index for one market",
          "description": "The COT index (0–100: where the current net position, as % of open interest, sits between its lowest and highest of the lookback window) for large speculators and commercials, from the Legacy report. Without an account: the 26- and 52-week windows; a free account, COT Premium and a Data API key: every window. Both CFTC variants (Futures Only and Futures & Options Combined) with COT Premium and Data API keys; without an account and with a free account, each report's default variant.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "lookback_weeks": {
                "anyOf": [
                  {
                    "const": 26,
                    "type": "number"
                  },
                  {
                    "const": 52,
                    "type": "number"
                  },
                  {
                    "const": 156,
                    "type": "number"
                  },
                  {
                    "const": 260,
                    "type": "number"
                  }
                ],
                "description": "Lookback window in weeks: 26, 52, 156 or 260. Default: 156 (3 years) — 52 without an account."
              },
              "market": {
                "description": "A CFTC code (e.g. 099741), a ticker (e.g. 6E, GC) or a market name.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "variant": {
                "description": "CFTC variant: futonly = Futures Only, combined = Futures & Options Combined. Default: the report's own (Legacy: futonly; Disaggregated, TFF: combined; Supplemental is published combined only).",
                "enum": ["futonly", "combined"],
                "type": "string"
              }
            },
            "required": ["market"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "COT index for one market"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a859bac05aa3d7f061ec91e74406de442d0517aa71c819719702098f69c8f301"
        },
        {
          "name": "get_history",
          "title": "COT history for one market",
          "description": "Weekly COT history for one market, newest first: open interest and the net position of every trader group (up to 260 reports per call; page back with \"until\"). Without an account: Legacy, the last 26 reports (6 months). Free account: Legacy, the last 520 reports (10 years). COT Premium and Data API keys: every report family and the full history; COT Premium also adds close prices. A new COT Premium subscription that can still be withdrawn from reads the last year of what Premium adds, until the date in its confirmation e-mail. Both CFTC variants (Futures Only and Futures & Options Combined) with COT Premium and Data API keys; without an account and with a free account, each report's default variant.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "from": {
                "description": "Oldest report date to include, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "market": {
                "description": "A CFTC code (e.g. 099741), a ticker (e.g. 6E, GC) or a market name.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "report": {
                "description": "Report family: legacy (default), disaggregated, tff or supplemental.",
                "enum": ["legacy", "disaggregated", "tff", "supplemental"],
                "type": "string"
              },
              "reports": {
                "description": "How many weekly reports (default 12).",
                "maximum": 260,
                "minimum": 1,
                "type": "integer"
              },
              "until": {
                "description": "Newest report date to include, YYYY-MM-DD (for paging back).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "variant": {
                "description": "CFTC variant: futonly = Futures Only, combined = Futures & Options Combined. Default: the report's own (Legacy: futonly; Disaggregated, TFF: combined; Supplemental is published combined only).",
                "enum": ["futonly", "combined"],
                "type": "string"
              }
            },
            "required": ["market"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "COT history for one market"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:897a008b0541d9476236c38e96a0cc7d4f4c158370437af53792773350997dd6"
        },
        {
          "name": "get_latest_positions",
          "title": "Latest COT positions for one market",
          "description": "The latest COT report for one market: long, short and net positions of every trader group, the week-on-week change, % of open interest. Without an account and with a free account: the Legacy report. COT Premium and Data API keys: every report family (Legacy, Disaggregated, TFF, Supplemental); COT Premium also adds the close price. Both CFTC variants (Futures Only and Futures & Options Combined) with COT Premium and Data API keys; without an account and with a free account, each report's default variant.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "market": {
                "description": "A CFTC code (e.g. 099741), a ticker (e.g. 6E, GC) or a market name.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "report": {
                "description": "Report family: legacy (default), disaggregated, tff or supplemental.",
                "enum": ["legacy", "disaggregated", "tff", "supplemental"],
                "type": "string"
              },
              "variant": {
                "description": "CFTC variant: futonly = Futures Only, combined = Futures & Options Combined. Default: the report's own (Legacy: futonly; Disaggregated, TFF: combined; Supplemental is published combined only).",
                "enum": ["futonly", "combined"],
                "type": "string"
              }
            },
            "required": ["market"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Latest COT positions for one market"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7c013d2f5794ff8a4fb78752ecef9539fb1da5797e020c7e89ee0f2fb723652a"
        },
        {
          "name": "get_latest_snapshot",
          "title": "Latest COT snapshot of every market",
          "description": "The latest Legacy COT report of every market, 100 markets per answer (use offset for the next page): net positions of large speculators and commercials, their week-on-week change, and open interest. Filter by category. Available at every level. Both CFTC variants (Futures Only and Futures & Options Combined) with COT Premium and Data API keys; without an account and with a free account, each report's default variant.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "A category or subcategory, e.g. \"Energy\", \"Stock Indices\".",
                "maxLength": 60,
                "type": "string"
              },
              "offset": {
                "description": "Paging: skip this many markets (default 0).",
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "variant": {
                "description": "CFTC variant: futonly = Futures Only, combined = Futures & Options Combined. Default: the report's own (Legacy: futonly; Disaggregated, TFF: combined; Supplemental is published combined only).",
                "enum": ["futonly", "combined"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Latest COT snapshot of every market"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:56785a1811e9ea825334a3f11a57b0f249eac7cfe860f0b7ee596246735f5d9f"
        },
