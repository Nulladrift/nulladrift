        },
        {
          "name": "list_markets",
          "title": "List COT markets",
          "description": "Lists the CFTC markets COT-Reports covers (350+): CFTC code, ticker, name, exchange, category and which report families exist for each. Filter by a search text, a category or a report family. Available at every level.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "A category or subcategory, e.g. \"Metals\", \"Currencies & Forex\".",
                "maxLength": 60,
                "type": "string"
              },
              "limit": {
                "description": "At most 50 (default 25).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "report": {
                "description": "Report family: legacy (default), disaggregated, tff or supplemental.",
                "enum": ["legacy", "disaggregated", "tff", "supplemental"],
                "type": "string"
              },
              "search": {
                "description": "Part of a name, ticker, alias or CFTC code.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List COT markets"
          },
          "behavior": {
