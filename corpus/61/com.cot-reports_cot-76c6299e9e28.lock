        {
          "name": "scan_extremes",
          "title": "Markets at positioning extremes",
          "description": "Markets where large speculators are crowded long or short this week (the Crowding score: a blend of the 26-, 52- and 156-week percentiles of their net position as % of open interest; crowded long from 80 until it falls below 75, crowded short from 20 until it rises above 25), from the Legacy Futures Only report. COT Premium only, as on the website.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "side": {
