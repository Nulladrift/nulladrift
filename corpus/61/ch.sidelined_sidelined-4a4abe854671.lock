        {
          "name": "search_absences",
          "title": "Search unavailable players",
          "description": "Unavailable players across the league in one call, optionally filtered by club, type and confidence. Without arguments: everyone out at all 14 clubs (use this instead of get_team_absences per club). For example all injured players (type \"injury\"), or everything only inferred from lineups (confidence \"inferred\"). A type without categories returns every entry of that type (type \"loan\": the players on loan).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "categories": {
                "description": "Which entries: \"out\" (default: injured, ill, suspended and other absences), \"scratch\" (fit, left out by the coach), \"loan\" (farm team or another club), or \"all\".",
                "items": {
                  "enum": ["out", "scratch", "loan", "all"],
                  "type": "string"
                },
                "type": "array"
              },
              "confidence": {
                "description": "How it is known: \"official\" (the club), \"league\" (National League, SIHF lineup sheets), \"media\" (checked report), \"inferred\" (missing from lineups, reason unknown).",
                "enum": ["official", "league", "media", "inferred"],
                "type": "string"
              },
              "team": {
                "description": "The club: its slug or its name (\"EV Zug\", \"SCRJ Lakers\"). The slugs: ajoie (HC Ajoie), ambri (HC Ambrì-Piotta), bern (SC Bern), biel (EHC Biel-Bienne), davos (HC Davos), fribourg (Fribourg-Gottéron), geneve (Genève-Servette HC), kloten (EHC Kloten), langnau (SCL Tigers), lausanne (Lausanne HC), lugano (HC Lugano), rapperswil (SCRJ Lakers), zsc (ZSC Lions), zug (EV Zug).",
                "minLength": 1,
                "type": "string"
              },
              "type": {
                "description": "The kind of absence.",
                "enum": ["injury", "illness", "suspension", "loan", "national_team", "personal", "healthy_scratch", "import_limit", "unknown"],
                "type": "string"
              }
            },
            "type": "object"
