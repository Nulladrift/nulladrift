      "instructions": "sidelined.ch lists the unavailable players of the 14 Swiss National League ice hockey clubs: injured, ill, suspended and otherwise out, each with its source.\n\nHow to present it:\n1. Name the source of each entry (\"according to the club's medical report\") and show the attribution: Data: sidelined.ch, from the clubs, the National League and the Swiss Ice Hockey Federation (sources on each entry) (https://sidelined.ch).\n2. No medical speculation. Pass on \"reason_text\" as it is. Never infer a diagnosis, its severity or a return date beyond what \"return\" says.\n3. \"return\" is an estimate: \"min\" and \"max\" are sidelined.ch's reading of the club's wording, not a club statement.\n4. Expected back: when \"expected_back\" is set, the club says the player plays that game. Say it as the club's word (\"EV Zug expects him back against Ambrì on Wednesday\"), with the article; he's still listed out until he's dressed, so don't call him back yet.\n5. Off the club's report: when \"off_club_report\" is set, the club no longer lists the player, but another source still does (usually SIHF's sheet of the last game). Say that, with the date; \"return\" is the club's last estimate from before, so don't present it as current, and don't guess that he's back.\n6. Suspensions: when \"return.kind\" is \"games\", \"min\" is the date of the first game the player may play again. He misses the games before it, not the game on that date.\n7. Quote only the source's words: \"return.text\" is the source's wording when \"return.text_by\" is \"source\". When it is \"sidelined\" (league suspensions: \"für 3 Spiele gesperrt\"), it's our summary: say it in your own words, without quotation marks.\n8. \"inferred\" means reason unknown: the player is a regular missing from recent lineups, nothing more. Say so.\n9. Only \"out\" counts as unavailable. \"scratch\" (healthy scratch, import limit) and \"loan\" (farm team or another club) are roster decisions, not absences; they are left out unless asked for.\n10. Game dates: \"next_game\" is each club's next National League game, from the league's schedule. Use it rather than another site; for games further ahead, or other competitions, say it isn't in this data.\n11. Season figures aren't in this data: man-games lost, ice time missing and goalie games lost per club are on https://sidelined.ch/stats (this season so far and 2025/26). Link there; don't count them from the current entries, which only show who is out now.\n12. Mind freshness: the data is refreshed every 15 to 30 minutes, and around games; \"checked_at\" and \"updated_at\" say how recent it is.\n\nData model and rules: https://developers.sidelined.ch/api/concepts",
      "tools": [
        {
          "name": "get_recent_changes",
          "title": "Recent changes",
          "description": "Players newly listed as out (\"opened\"), open entries with a new type, reason or suspension length, or off or back on the club's medical report while another source keeps them open (\"updated\", with changed, suspension and club_report), and players no longer listed (\"closed\", with closed_reason), newest first, from the last 14 days. Healthy scratches and loans are not included. Use next_cursor as cursor for older changes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cursor": {
                "description": "next_cursor from a previous call.",
                "type": "string"
              },
              "limit": {
                "description": "How many (default 50).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "Only changes from this date or time on (ISO 8601, e.g. \"2026-10-27\").",
                "type": "string"
              },
              "team": {
                "description": "The club: its slug or its name (\"EV Zug\", \"SCRJ Lakers\"). The slugs: ajoie (HC Ajoie), ambri (HC Ambrì-Piotta), bern (SC Bern), biel (EHC Biel-Bienne), davos (HC Davos), fribourg (Fribourg-Gottéron), geneve (Genève-Servette HC), kloten (EHC Kloten), langnau (SCL Tigers), lausanne (Lausanne HC), lugano (HC Lugano), rapperswil (SCRJ Lakers), zsc (ZSC Lions), zug (EV Zug).",
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
