          "digest": "sha256:d8e43a4e99df243dd841fb70132985b325bcf72af0cfb98d9e85a994f113bddf"
        },
        {
          "name": "get_team_absences",
          "title": "A club's unavailable players",
          "description": "Who is out at one club right now, and its next National League game (next_game): each player with type, reason as the source published it, since when, the expected return, confidence and sources. By default only players counted as out; ask for categories to include healthy scratches or loans. For several clubs or the whole league, use search_absences instead: one call, not one per club.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "categories": {
                "description": "Which entries: \"out\" (default: injured, ill, suspended and other absences), \"scratch\" (fit, left out by the coach), \"loan\" (farm team or another club), or \"all\".",
                "items": {
                  "enum": ["out", "scratch", "loan", "all"],
                  "type": "string"
                },
                "type": "array"
              },
              "team": {
                "description": "The club: its slug or its name (\"EV Zug\", \"SCRJ Lakers\"). The slugs: ajoie (HC Ajoie), ambri (HC Ambrì-Piotta), bern (SC Bern), biel (EHC Biel-Bienne), davos (HC Davos), fribourg (Fribourg-Gottéron), geneve (Genève-Servette HC), kloten (EHC Kloten), langnau (SCL Tigers), lausanne (Lausanne HC), lugano (HC Lugano), rapperswil (SCRJ Lakers), zsc (ZSC Lions), zug (EV Zug).",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["team"],
            "type": "object"
          },
