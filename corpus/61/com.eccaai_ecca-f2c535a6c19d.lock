        {
          "name": "ecca_synthesize",
          "title": "Compare Engine Answers",
          "description": "Compare answers from configured engines and inspect disagreement, with lexical similarity and final-answer agreement when measurable.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "antagonist": {
                "default": false,
                "description": "When true, forces one engine to act as adversarial red-team antagonist.",
                "type": "boolean"
              },
              "depth": {
                "default": "executive",
                "description": "intuitive and fast route to one engine; executive, pioneer and deep route a multi-engine dispatch (free callers: two engines first, expanding on measured divergence, one deep solve per day). Any other value is refused.",
                "enum": ["intuitive", "executive", "pioneer", "fast", "deep"],
                "type": "string"
              },
              "model": {
                "default": "axiom-reasoner",
                "description": "Label echoed in the result. Every value dispatches through the same registered engines; depth decides fast or multi-engine.",
                "enum": ["axiom-vector", "axiom-core", "axiom-reasoner", "axiom-omni", "axiom-sovereign"],
                "type": "string"
              },
              "query": {
                "description": "The core inquiry, hypothesis, or decision challenge to synthesize.",
                "maxLength": 64000,
                "type": "string"
              }
