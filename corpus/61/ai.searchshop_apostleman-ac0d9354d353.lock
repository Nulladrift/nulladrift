        {
          "name": "create_checkout",
          "description": "Use when the user wants to buy one or more products. This store's availability is not confirmed here: a checkout link is created only when every item has been approved for checkout on this store and Shopify reports it for sale; otherwise the tool returns the product page on the store's own site for each item. Pass variant IDs (items) and/or product URLs (product_urls). Use search_products first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "decision_id": {
                "description": "Optional — leave unset unless an earlier create_checkout error asked for it.",
                "maxLength": 100,
                "type": "string"
              },
              "discount_code": {
                "description": "Discount code to apply (e.g. 'WELCOME10')",
                "maxLength": 50,
                "type": "string"
              },
              "items": {
                "description": "Products to add to cart by variant ID",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "quantity": {
                      "default": 1,
                      "description": "Quantity (default 1)",
                      "maximum": 10,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "selling_plan_id": {
                      "description": "Shopify selling plan ID for subscriptions",
                      "type": "string"
                    },
                    "variant_id": {
                      "description": "Shopify variant ID (numeric or GID format)",
                      "type": ["string", "number"]
                    }
                  },
                  "required": ["variant_id"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "note": {
                "description": "Cart note visible to the merchant",
                "maxLength": 500,
                "type": "string"
              },
              "product_urls": {
                "description": "Products to add to cart by URL — resolved to variant IDs automatically",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "quantity": {
                      "default": 1,
                      "description": "Quantity (default 1)",
                      "maximum": 10,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "url": {
                      "description": "Shopify product URL (e.g. https://store.com/products/handle)",
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["url"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:787158a9caa975754d807b55967919ce745fdcf5ae26ce136224f225d1f260a8"
