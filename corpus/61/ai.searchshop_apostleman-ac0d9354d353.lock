          "digest": "sha256:e1cbc3841f63bb10709804a2f6445c38136eb77d6721b43c46293964c02c1a1e"
        },
        {
          "name": "shop",
          "description": "Start here for any shopping request. Pass the shopper's COMPLETE request in their own words and this tool will understand it and route to the right capability (personalized recommendation, catalog search, product lookup, or comparison), preserving every qualifier — concerns, skin type, budget, brand. Prefer this tool whenever the request is conversational or carries any nuance. The granular tools (search_products, get_product, compare_products, create_checkout) remain available as precise follow-ups.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "Secondary hint only — brand filter if stated.",
                "maxLength": 100,
                "type": "string"
              },
              "budget_max": {
                "description": "Secondary hint only — maximum budget if stated.",
                "type": "number"
              },
              "intent": {
                "description": "Secondary hint only — the primary signal is `request`.",
                "enum": ["advice", "browse", "product", "compare", "buy", "question"],
                "type": "string"
              },
              "product_refs": {
                "description": "Secondary hint only — exact product titles/SKUs when already known.",
                "items": {
                  "maxLength": 200,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "request": {
                "description": "The shopper's complete request in their own words. Include every detail: concern, skin type, budget, brand, product names, questions. Do not summarize or drop qualifiers.",
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["request"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
