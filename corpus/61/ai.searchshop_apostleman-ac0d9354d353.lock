      "tools": [
        {
          "name": "check_compatibility",
          "description": "Check which products are compatible with a given product. For devices, shows required consumables (e.g., conductive gel for MIRA). For topicals, shows which devices they work with. Use when a customer asks 'what gel do I need with MIRA?' or 'does this serum work with CryoSculpt?'",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "product": {
                "description": "Product name or SKU to check compatibility for",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:37b30c86e13517dd0013ea5c3b7ecd3ff85225a2133a110e1dbe8d41d6f0625d"
        },
        {
          "name": "check_inventory",
          "description": "Check if a product is currently available. Uses Shopify Storefront API to verify real-time stock status. Use when a customer asks 'is MIRA in stock?' or before recommending a product.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "product": {
                "description": "Product name or SKU to check availability for",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6e071b9b427e2b2a9646d496c0282ccdc23f426c0146ed5b841501787d9d84c8"
        },
        {
          "name": "compare_products",
          "description": "Compare two or more products side by side. Use when the user asks to compare, says 'X vs Y', or wants to decide between options. Do not use for single product lookup — use get_product instead. Returns structured comparison with shared attributes, differences, tradeoffs, and a decision hint.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "products": {
                "description": "Product titles or SKUs to compare (e.g. ['MIRA', 'CryoSculpt'])",
                "items": {
                  "maxLength": 200,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["products"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/product-card-16f3cdfb2cd0.html",
            "openai/toolInvocation/invoked": "Comparison ready.",
            "openai/toolInvocation/invoking": "Comparing products…",
            "openai/widgetCSP": {
              "connect_domains": ["https://*.ngrok-free.dev", "https://*.myshopify.com", "https://cdn.shopify.com", "https://esm.sh"],
              "redirect_domains": ["https://*.myshopify.com", "https://*.shopify.com"],
