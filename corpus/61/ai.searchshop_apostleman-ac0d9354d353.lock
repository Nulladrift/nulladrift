              "resource_domains": ["https://esm.sh", "https://cdn.shopify.com", "https://*.shopify.com", "https://*.youthtothepeople.com", "https://*.laluer.com", "https://laluer.com", "https://*.glam-moda.com", "https://incidecoder-content.storage.googleapis.com", "https://media.kohlsimg.com", "https://*.mercdn.net", "https://*.bigcommerce.com", "https://di2ponv0v5otw.cloudfront.net", "https://placehold.co"]
