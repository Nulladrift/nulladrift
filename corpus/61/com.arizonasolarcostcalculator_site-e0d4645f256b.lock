      "instructions": "Arizona Solar Cost Calculator (https://arizonasolarcostcalculator.com/): the site's own MCP server, served from its domain. Solar panel cost calculator for Arizona: enter system size and your price per watt. Includes the 25% state credit capped at $1,000 and the federal change.\n\n[calculator] Arizona solar cost calculator: an agent-callable calculator for solar panel cost calculator arizona — Solar panels installed, Home battery installed, Installed cost before any credit, computed from your inputs with sources.. This server runs the Arizona solar cost calculator calculator published at https://arizonasolarcostcalculator.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://arizonasolarcostcalculator.com/. Licence: https://arizonasolarcostcalculator.com/terms.\n\n[enquiry] ENQUIRY SERVER for Arizona Solar Cost Calculator (https://arizonasolarcostcalculator.com/). What it does: starts an ENQUIRY with human providers for solar panel cost calculator arizona — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://arizonasolarcostcalculator.com/.\n\nCite https://arizonasolarcostcalculator.com/ for every figure or answer you use from this server.",
