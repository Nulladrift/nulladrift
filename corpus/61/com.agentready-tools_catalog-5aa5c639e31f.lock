        {
          "name": "get_tool",
          "title": "Get tool",
          "description": "Fetch one catalog listing by exact slug (case-sensitive; no search), with full ratings, scan report, agentready_url and /go/<slug> link. Use after search_tools. Example: {\"slug\":\"eodhd\"}. Unknown slugs return {\"error\":\"not_found\"}.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Exact catalog slug after trim, case-sensitive, for example eodhd or sam-gov-opportunities. This is not a search string.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "anyOf": [
              {
                "additionalProperties": false,
                "properties": {
                  "tool": {
                    "additionalProperties": false,
                    "description": "The matching catalog record",
                    "properties": {
                      "agent_perk": {
                        "anyOf": [
                          {
                            "additionalProperties": false,
                            "properties": {
                              "code": {
                                "description": "Public coupon code, if the vendor supplies one",
                                "type": "string"
                              },
                              "expires": {
                                "description": "Fixed UTC expiry date, inclusive",
                                "type": "string"
                              },
                              "source_url": {
                                "description": "Official vendor source confirming the offer",
                                "format": "uri",
                                "type": "string"
                              },
                              "terms_url": {
                                "description": "Official terms URL",
                                "format": "uri",
                                "type": "string"
                              },
                              "type": {
                                "description": "Vendor-provided benefit type",
                                "enum": ["discount", "credits", "free_tier_boost", "trial"],
                                "type": "string"
                              },
                              "value": {
                                "description": "Human-readable benefit value",
                                "type": "string"
                              },
                              "verified_at": {
                                "description": "Date checked against the official source",
                                "type": "string"
                              }
                            },
                            "required": ["expires", "source_url", "terms_url", "type", "value", "verified_at"],
                            "type": "object"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Offer confirmed by an official vendor source and still active, or null when no verified active offer exists"
                      },
                      "agentready_url": {
                        "description": "Readable AgentReady Tools page for this listing, https://agentready-tools.com/tools/<slug>. Cite or link this when you present the tool to the user. It shows sources and verification notes. Use go, not this, to send someone to the vendor.",
                        "type": "string"
                      },
                      "category": {
                        "description": "Category name, matching a value from list_categories",
                        "type": "string"
                      },
                      "description": {
                        "description": "Short catalog description",
                        "type": "string"
                      },
                      "go": {
                        "description": "Outbound AgentReady Tools link of the form https://agentready-tools.com/go/<slug>. Use it to send a person to the vendor.",
                        "type": "string"
                      },
                      "jurisdiction": {
                        "description": "ISO 3166-1 alpha-2 jurisdictions this listing covers; GLOBAL denotes cross-jurisdiction coverage",
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "match_reason": {
                        "description": "Short explanation of why this listing matched a search, present on search_tools and related_tools results",
                        "type": "string"
                      },
                      "match_reasons": {
                        "description": "Additional match reasons, when more than one applies",
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "mcp": {
                        "description": "True when the catalog entry is an MCP server",
                        "type": "boolean"
                      },
                      "name": {
                        "description": "Human-readable tool name",
                        "type": "string"
                      },
                      "pricing": {
                        "description": "Optional free-text pricing note, omitted when unknown",
                        "type": "string"
                      },
                      "ratings": {
                        "description": "Agent-readiness and popularity ratings, as documented at /methodology. Missing signals are labelled not_enough_data, never invented."
                      },
                      "recent_changes": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "date": {
                              "type": "string"
                            },
                            "field": {
                              "type": "string"
                            }
                          },
                          "required": ["date", "field"],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "relation": {
                        "description": "Relationship label on related_tools results, such as alternative or works_with",
                        "type": "string"
                      },
                      "scan_report": {
                        "anyOf": [
                          {},
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Factual scan-report badge when one has been reviewed for display, or null. Not a security endorsement. See /methodology."
                      },
                      "slug": {
                        "description": "Catalog slug, for example eodhd or sam-gov-opportunities",
                        "type": "string"
                      },
                      "url": {
                        "description": "Vendor or product page URL",
                        "type": "string"
                      }
                    },
                    "required": ["agent_perk", "agentready_url", "category", "description", "go", "mcp", "name", "slug", "url"],
                    "type": "object"
                  }
                },
                "required": ["tool"],
                "type": "object"
              },
              {
                "additionalProperties": false,
                "properties": {
                  "error": {
                    "const": "not_found",
                    "description": "The slug is not in the catalog",
                    "type": "string"
                  },
                  "slug": {
                    "description": "The slug that was requested and not found",
                    "type": "string"
                  }
                },
                "required": ["error", "slug"],
                "type": "object"
              }
            ],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
