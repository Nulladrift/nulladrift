        },
        {
          "name": "find_sites",
          "title": "Find sites",
          "description": "Find websites in the AgentReady Sites directory by normalized task, access level or text. Example: {\"task\":\"track-parcel\",\"access\":\"browser_only\",\"limit\":10}. Results link to a site card with dated discovery checks. A site card is not a task-completion score; see its evaluation status.",
