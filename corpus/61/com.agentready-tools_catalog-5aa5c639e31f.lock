            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "access": {
                "description": "Optional access level: keyless_url, open_mcp, signup_mcp, signup_api or browser_only.",
                "type": "string"
              },
              "limit": {
                "description": "Maximum results, 1-50; defaults to 10.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "query": {
                "description": "Optional text matched against site name, domain, description and supported task labels or synonyms.",
                "type": "string"
              },
              "task": {
                "description": "Optional exact task id from the AgentReady task list, for example track-parcel or extract-pdf-text.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "count": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
