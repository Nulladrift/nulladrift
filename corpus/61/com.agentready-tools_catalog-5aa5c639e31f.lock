        {
          "name": "search_tools",
          "title": "Search tools",
          "description": "Search the AgentReady Tools catalog. The query is optional: omit it (or pass an empty string) to list the catalog, optionally narrowed by filters. When a query is present, results are ranked and each item includes match_reason (and sometimes match_reasons). Matching is case-insensitive, typo-tolerant for longer tokens, and expands common task synonyms (for example scrape/crawler, jobs/ATS, maps/places). Use this to discover tools. Call get_tool when you already have a slug, list_categories for valid category names, and related_tools for alternatives or works-with links. Filters: category (exact, case-insensitive, as returned by list_categories; unknown names yield an empty list), pricing (free, paid, unknown, or a substring of the pricing note), has_mcp (boolean), free_tier (boolean; true if the pricing note mentions a free plan), and limit (optional maximum number of results; omit it to return all matches). No authentication. This server allows 60 MCP requests per minute.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Optional exact category name, case-insensitive, as returned by list_categories. Combined with query when both are set. Unknown names yield an empty list.",
                "type": "string"
              },
              "free_tier": {
                "description": "If true, only listings whose pricing note mentions a free plan or key.",
                "type": "boolean"
              },
              "has_mcp": {
                "description": "If true, only official MCP servers. If false, only listings that are not MCP servers.",
                "type": "boolean"
              },
              "limit": {
                "description": "Optional maximum number of results. Omit to return all matches, ranked when a query is present.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "pricing": {
                "description": "Optional pricing filter: free, paid, unknown, or a substring of the catalog pricing note.",
                "type": "string"
              },
              "query": {
                "description": "Optional search string, matched against name, description, slug, category, and url, with typo tolerance and synonyms. Omit or leave empty to return every tool, optionally narrowed by filters.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "count": {
                "description": "Number of tools in this result; equals tools.length.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "tools": {
                "description": "Matching tools, ranked when a query is present, otherwise in catalog order",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "affiliate": {
                      "description": "True when the go link is an affiliate referral",
                      "type": "boolean"
                    },
                    "category": {
                      "description": "Category name, matching a value from list_categories",
                      "type": "string"
                    },
                    "description": {
                      "description": "Short catalog description",
                      "type": "string"
                    },
                    "go": {
                      "description": "Outbound AgentReady Tools link of the form https://agentready-tools.com/go/<slug>",
                      "type": "string"
                    },
                    "match_reason": {
                      "description": "Short explanation of why this listing matched a search, present on search_tools and related_tools results",
                      "type": "string"
                    },
                    "match_reasons": {
                      "description": "Additional match reasons, when more than one applies",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "mcp": {
                      "description": "True when the catalog entry is an MCP server",
                      "type": "boolean"
                    },
                    "name": {
                      "description": "Human-readable tool name",
                      "type": "string"
                    },
                    "pricing": {
                      "description": "Optional free-text pricing note, omitted when unknown",
                      "type": "string"
                    },
                    "ratings": {
                      "description": "Agent-readiness and popularity ratings, as documented at /methodology. Missing signals are labelled not_enough_data, never invented."
                    },
                    "relation": {
                      "description": "Relationship label on related_tools results, such as alternative or works_with",
                      "type": "string"
                    },
                    "scan_report": {
