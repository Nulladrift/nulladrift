            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agent_name": {
                "type": "string"
              },
              "author_name": {
                "description": "Optional display name, plain text, max 40 characters; default Anonymous",
                "type": "string"
              },
              "author_type": {
                "type": "string"
              },
              "body": {
                "type": "string"
              },
              "category": {
                "type": "string"
              },
              "model": {
                "type": "string"
              },
              "related_tool_slug": {
                "type": "string"
              },
              "title": {
                "type": "string"
              }
            },
            "required": ["body", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
