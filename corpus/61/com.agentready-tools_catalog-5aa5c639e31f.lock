        {
          "name": "get_tool",
          "title": "Get tool",
          "description": "Return one catalog tool by exact slug after trimming whitespace. Slug matching is case-sensitive; it does not search or fuzzy-match. Use this after search_tools, or when the slug is already known; use search_tools to discover slugs, and list_categories to browse categories. If the slug is missing, the tool errors with {\"error\":\"not_found\",\"slug\":...} and no tool record. The result includes agentready_url (the readable AgentReady Tools page, with sources and verification notes) and the /go/<slug> outbound link. Cite or link agentready_url when you present the tool to the user, and use go when you send the user to the vendor. No authentication. This server allows 60 MCP requests per minute.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Exact catalog slug after trim, case-sensitive, for example eodhd or sam-gov-opportunities. This is not a search string.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "anyOf": [
              {
                "additionalProperties": false,
                "properties": {
                  "tool": {
                    "additionalProperties": false,
                    "description": "The matching catalog record",
                    "properties": {
                      "agentready_url": {
                        "description": "Readable AgentReady Tools page for this listing, https://agentready-tools.com/tools/<slug>. Cite or link this when you present the tool to the user. Over MCP it carries ?ref=mcp so visits from agent answers can be counted. It shows sources and verification notes. Use go, not this, to send someone to the vendor.",
                        "type": "string"
                      },
                      "category": {
                        "description": "Category name, matching a value from list_categories",
                        "type": "string"
                      },
                      "description": {
                        "description": "Short catalog description",
                        "type": "string"
                      },
                      "go": {
                        "description": "Outbound AgentReady Tools link of the form https://agentready-tools.com/go/<slug>. Use it to send a person to the vendor.",
                        "type": "string"
                      },
                      "match_reason": {
                        "description": "Short explanation of why this listing matched a search, present on search_tools and related_tools results",
                        "type": "string"
                      },
                      "match_reasons": {
                        "description": "Additional match reasons, when more than one applies",
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "mcp": {
                        "description": "True when the catalog entry is an MCP server",
                        "type": "boolean"
                      },
                      "name": {
                        "description": "Human-readable tool name",
                        "type": "string"
                      },
                      "pricing": {
                        "description": "Optional free-text pricing note, omitted when unknown",
                        "type": "string"
                      },
                      "ratings": {
                        "description": "Agent-readiness and popularity ratings, as documented at /methodology. Missing signals are labelled not_enough_data, never invented."
                      },
                      "relation": {
                        "description": "Relationship label on related_tools results, such as alternative or works_with",
                        "type": "string"
                      },
                      "scan_report": {
                        "anyOf": [
                          {},
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Factual scan-report badge when one has been reviewed for display, or null. Not a security endorsement. See /methodology."
                      },
                      "slug": {
                        "description": "Catalog slug, for example eodhd or sam-gov-opportunities",
                        "type": "string"
                      },
                      "url": {
                        "description": "Vendor or product page URL",
                        "type": "string"
                      }
                    },
                    "required": ["agentready_url", "category", "description", "go", "mcp", "name", "slug", "url"],
                    "type": "object"
                  }
                },
                "required": ["tool"],
                "type": "object"
              },
              {
                "additionalProperties": false,
                "properties": {
                  "error": {
                    "const": "not_found",
                    "description": "The slug is not in the catalog",
                    "type": "string"
                  },
                  "slug": {
                    "description": "The slug that was requested and not found",
                    "type": "string"
                  }
                },
                "required": ["error", "slug"],
                "type": "object"
              }
            ],
            "type": "object"
          },
