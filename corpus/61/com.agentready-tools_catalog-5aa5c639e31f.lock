      },
      "transport": {
        "type": "http",
        "url": "https://agentready-tools.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "agentready-tools",
        "version": "1.2.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only AgentReady Tools catalog. No authentication. 60 MCP requests per minute. Use search_tools to discover tools or to list the catalog (omit query for all tools; optional filters: category, pricing, has_mcp, free_tier, limit). Results are ranked when a query is present and include a match_reason. Use list_categories for valid category names. Use get_tool only when you already have an exact slug. Use related_tools for alternatives and works-with listings. get_tool includes ratings and, when present, a factual scan_report badge (not a security endorsement). Ratings and badges are documented at https://agentready-tools.com/methodology.",
      "tools": [
        {
          "name": "get_tool",
          "title": "Get tool",
          "description": "Return one catalog tool by exact slug after trimming whitespace. Slug matching is case-sensitive; it does not search or fuzzy-match. Use this after search_tools, or when the slug is already known; use search_tools to discover slugs, and list_categories to browse categories. If the slug is missing, the tool errors with {\"error\":\"not_found\",\"slug\":...} and no tool record. The result includes the /go/<slug> outbound link. No authentication. This server allows 60 MCP requests per minute.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Exact catalog slug after trim, case-sensitive, for example eodhd or sam-gov-opportunities. This is not a search string.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "anyOf": [
              {
                "additionalProperties": false,
                "properties": {
                  "tool": {
                    "additionalProperties": false,
                    "description": "The matching catalog record",
                    "properties": {
                      "affiliate": {
                        "description": "True when the go link is an affiliate referral",
                        "type": "boolean"
                      },
                      "category": {
                        "description": "Category name, matching a value from list_categories",
                        "type": "string"
                      },
                      "description": {
                        "description": "Short catalog description",
                        "type": "string"
                      },
                      "go": {
                        "description": "Outbound AgentReady Tools link of the form https://agentready-tools.com/go/<slug>",
                        "type": "string"
                      },
                      "match_reason": {
                        "description": "Short explanation of why this listing matched a search, present on search_tools and related_tools results",
                        "type": "string"
                      },
                      "match_reasons": {
                        "description": "Additional match reasons, when more than one applies",
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "mcp": {
                        "description": "True when the catalog entry is an MCP server",
                        "type": "boolean"
                      },
                      "name": {
                        "description": "Human-readable tool name",
                        "type": "string"
                      },
                      "pricing": {
                        "description": "Optional free-text pricing note, omitted when unknown",
                        "type": "string"
                      },
                      "ratings": {
                        "description": "Agent-readiness and popularity ratings, as documented at /methodology. Missing signals are labelled not_enough_data, never invented."
                      },
                      "relation": {
                        "description": "Relationship label on related_tools results, such as alternative or works_with",
                        "type": "string"
                      },
                      "scan_report": {
                        "anyOf": [
                          {},
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Factual scan-report badge when one has been reviewed for display, or null. Not a security endorsement. See /methodology."
                      },
                      "slug": {
                        "description": "Catalog slug, for example eodhd or sam-gov-opportunities",
                        "type": "string"
                      },
                      "url": {
                        "description": "Vendor or product page URL",
                        "type": "string"
                      }
                    },
                    "required": ["affiliate", "category", "description", "go", "mcp", "name", "slug", "url"],
                    "type": "object"
                  }
                },
                "required": ["tool"],
                "type": "object"
              },
              {
                "additionalProperties": false,
                "properties": {
                  "error": {
                    "const": "not_found",
                    "description": "The slug is not in the catalog",
                    "type": "string"
                  },
                  "slug": {
                    "description": "The slug that was requested and not found",
                    "type": "string"
                  }
                },
                "required": ["error", "slug"],
                "type": "object"
              }
            ],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bc8bd545dd2ffe3abaa61c937dcff08e1b5178bc529be0f60cf43911341fb521"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "List every catalog category, with no filters, in first-seen catalog order. Use this to get valid category names before calling search_tools with a category filter. It does not list tools; omit query on search_tools for the full tool catalog, and use get_tool only when you already have a slug. No authentication. The list is unpaginated and complete. This server allows 60 MCP requests per minute.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "categories": {
                "description": "Unique category names in first-seen catalog order, suitable for search_tools category.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "count": {
                "description": "Number of categories; equals categories.length. There is no pagination.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["categories", "count"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:325b2266aa0c624c80f399d8adb6460f6706763be6cd7aa334e0a833a6ce1551"
