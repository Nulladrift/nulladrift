        {
          "name": "get_weather",
          "title": "Get weather",
          "description": "Weather now, for the next hour, and for today plus 3 days at a point, based on data from MET Norway (credit the source). Coordinates only: look up the place's latitude and longitude first. Example: {\"lat\":32.08,\"lon\":34.78,\"tz\":\"Asia/Jerusalem\"}.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "lat": {
                "description": "Latitude in decimal degrees, -90 to 90.",
                "type": "number"
              },
              "lon": {
                "description": "Longitude in decimal degrees, -180 to 180.",
                "type": "number"
              },
              "tz": {
                "description": "Optional IANA time zone for local days, for example Asia/Jerusalem. Without it, days use an approximate offset from longitude.",
                "type": "string"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
