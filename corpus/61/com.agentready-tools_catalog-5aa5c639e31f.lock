        },
        {
          "name": "convert_currency",
          "title": "Convert currency",
          "description": "Convert an amount at the ECB euro reference rates (about 30 currencies, published each working day), with the rate date and method. Information only: banks and card issuers apply their own rates and fees; not financial advice. Example: {\"from\":\"USD\",\"to\":\"ILS\",\"amount\":100}.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "amount": {
                "description": "Amount to convert. Default 1.",
                "type": "number"
              },
              "from": {
                "description": "ISO 4217 code to convert from, for example USD.",
                "type": "string"
              },
              "to": {
                "description": "ISO 4217 code to convert to, for example ILS.",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
