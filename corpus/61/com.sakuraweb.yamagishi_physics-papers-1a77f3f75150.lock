          "arguments": [
            {
              "name": "expression",
              "description": "π の因子を含む式や文（例：g = 4πħ²a/m・d³p/(2π)³）",
              "required": true
            }
          ],
          "digest": "sha256:222a5f57fcb9544502514e45651fde96867875a0c5273bbf0cd37f92d6c7fba5"
        }
