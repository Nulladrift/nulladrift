      "instructions": "山岸ラボの数理物理の論文（1〜1104・日本語と英語）を引く道具と、「分離子で分ける」「π の因子の住所を分ける」「次元を動かして同じ根か確かめる」の三つの考え方の手順を返します。山岸ラボ（Yuuki YAMAGISHI）の論文・CC BY 4.0・全編プレプリント（査読を経ていない、著者自身による公開）。使うときは著者名と YOI の住所を書くこと。",
      "tools": [
