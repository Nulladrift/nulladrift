          "name": "jigen_wo_ugokasu",
          "title": "次元を動かして、同じ根か別の根かを確かめる",
          "description": "3 次元でたまたま同じ数になる二つの量が、同じ根か別の根かを、空間の次元 d を動かして確かめる手順（論文58 の方法）。",
          "arguments": [
            {
              "name": "pair",
              "description": "同じ数に見える二つの量（例：球殻の重さを一定にする指数と、地平線のつり合いの指数）",
              "required": true
            }
          ],
          "digest": "sha256:2eacc4a13d4cb857f380521edfa57fd996cdda52caa558f825bb15c41940d496"
        },
