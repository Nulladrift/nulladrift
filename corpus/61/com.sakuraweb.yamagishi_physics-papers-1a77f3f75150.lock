      "prompts": [
        {
          "name": "bunrishi",
          "title": "分離子で分ける",
          "description": "同じ名前・同じ数・同じ形で呼ばれているものを、何を動かすと別物になるか（分離子）で分ける手順。",
          "arguments": [
            {
              "name": "topic",
              "description": "分けたい式・数・言葉（例：1/r² の 2・物理の式の 4π・『次元の呪い』）",
