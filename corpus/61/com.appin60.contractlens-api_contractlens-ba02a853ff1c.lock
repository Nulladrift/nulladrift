      "serverInfo": {
        "name": "contractlens",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "address_info",
          "description": "What is this address? EOA, EIP-7702 delegated EOA, Safe multisig (threshold, owners), timelock, ERC-20 token, proxy or contract, with native balance. Use before sending funds to or trusting an address.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "description": "0x address",
                "type": "string"
              },
              "chainId": {
                "description": "EVM chain id",
                "type": "string"
              }
            },
            "required": ["address", "chainId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6fce7ea75916eaae697782eb90fd1c34b0d9208ba2ed583dfd8c93c18fe44e44"
        },
        {
          "name": "check_token",
          "description": "Fast (1-3 s) risk verdict for an ERC-20 token before buying it: LOW/MEDIUM/HIGH with reasons. Who controls it (renounced, single key, Safe multisig, timelock), upgradeable proxy, admin powers in the bytecode (mint, blacklist, pause, adjustable tax, trading switch), source verification, DEX liquidity and pair age. Chains: 1 Ethereum, 8453 Base, 42161 Arbitrum, 10 Optimism, 137 Polygon, 56 BNB.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "description": "0x token address",
                "type": "string"
              },
              "chainId": {
                "description": "EVM chain id, e.g. 8453 for Base",
                "type": "string"
              }
            },
            "required": ["address", "chainId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1bf88dbe88a31731f7dcdb0f85c4ed4e037fbd70b6b16b97fe6692837a9a1169"
        },
        {
          "name": "check_x402_payability",
          "description": "For x402 sellers: can a real buyer actually pay this endpoint? Sends one payment signed by a fresh unfunded key through the endpoint's server and facilitator. Payable endpoints fail only on balance; anything else is reported with the exact reason (schema, description over 500 chars, EIP-712 domain, price over the $1 default client cap, paywall not enforcing).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "url": {
                "description": "Full https URL of the x402 endpoint, with any query params it needs",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2caba63c1491d35b12e6445fcdf985879157ea5a9f6240b16518421e09fd1a44"
        },
        {
          "name": "gas_now",
          "description": "Live EIP-1559 gas for a chain: base fee, slow/standard/fast tips, maxFeePerGas values and the cost of common actions. Chains: 1, 8453, 42161, 10, 137, 56.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "chainId": {
                "description": "EVM chain id, e.g. 8453 for Base",
                "type": "string"
              }
            },
            "required": ["chainId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:be8f8d8bdb400e228e5461978756d048c2afc6a0a7e1792c1ea277a5269b7ec4"
        },
        {
          "name": "scan_contract",
          "description": "Security scan of a verified EVM smart contract: who controls it now (owner / proxy admin: renounced, single-key EOA or Safe multisig), every owner/role-gated function (mint, pause, blacklist, upgrade, fees), proxy status, and Slither static-analysis findings ranked by impact. Use before approving, depositing into or buying a token. Chains: 1 Ethereum, 8453 Base, 42161 Arbitrum, 10 Optimism, 137 Polygon, 56 BNB.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "description": "0x contract address (must be verified on Sourcify)",
                "type": "string"
              },
              "chainId": {
                "description": "EVM chain id, e.g. 8453 for Base",
                "type": "string"
              }
            },
            "required": ["address", "chainId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
