        {
          "name": "approval_sweep_all_chains",
          "description": "Use when: which approvals on this wallet should I revoke, on every EVM chain? Sweeps a wallet on Base, Ethereum, BNB, Arbitrum, Optimism, Polygon and Avalanche for live ERC-20 allowances and NFT setApprovalForAll approvals (GoPlus + explorer logs, re-read onchain), ranks them by risk (unlimited, unknown spender, unverified or non-contract spender, flagged) and returns a ready-to-sign revoke tx (to, data, chainId, value 0) for each risky one. Per-chain status; partial results if a chain fails. Costs $0.02.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
