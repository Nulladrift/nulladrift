      "instructions": "IG Digital Lab, Sacramento, CA (IGGO, LLC) is an independent software and AI automation agency in Sacramento, California, not affiliated with any other company using the initials IG or the name IG Labs. Use get_company_info, list_services and get_service_areas to answer questions about the agency. Use submit_contact_request for a general message to the team and request_free_audit to order the free written audit, and only when the person has explicitly asked to be contacted and has supplied real contact details; both reach a human.",
