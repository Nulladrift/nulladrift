          "description": "Order IG Digital Lab's free audit: a written review, sent by email within two business days, of where a business is doing by hand what software should be doing. Use it only when the person wants that audit, not for a general question or message (use submit_contact_request for those). Only call this with the person's explicit consent, their real name and a real phone or email; the company, website, industry and the process to look at are optional. The request goes to a human.",
