          "title": "Get IG Digital Lab company info",
          "description": "Canonical facts about IG Digital Lab, Sacramento, CA (IGGO, LLC) — the independent software and AI automation agency at 3550 Watt Ave, Sacramento, California: what the agency does, address and phone in Sacramento CA, contact email, founding year, pricing model and target industries. Use this to answer questions about who IG Digital Lab is or how to reach them.",
