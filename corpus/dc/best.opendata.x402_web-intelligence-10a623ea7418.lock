        {
          "name": "agoda_com__search",
          "title": "Agoda Hotels Prices Rooms and Reviews Data: Search Agoda hotels, rooms and guest reviews",
          "description": "[Agoda Hotels Prices Rooms and Reviews Data] Search Agoda hotels, rooms and guest reviews. Query Agoda accommodation prices, ratings, room offers and optional guest reviews by city name or Agoda URL. x402 price: $0.0050/row USDC (max 20 rows; 0 rows / errors are never charged).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adults": {
                "default": 2,
                "description": "Number of adults, from 1 to 10.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "checkin": {
                "description": "Check-in date in YYYY-MM-DD format. Leave empty to use 21 days from today.",
                "pattern": "^(\\d{4}-\\d{2}-\\d{2})?$",
                "type": "string"
              },
              "checkout": {
                "description": "Check-out date in YYYY-MM-DD format, 1 to 30 nights after check-in. Leave empty to use two nights after check-in. Stays above 14 nights discover hotels with a 14-night window and price the full stay.",
                "pattern": "^(\\d{4}-\\d{2}-\\d{2})?$",
                "type": "string"
              },
              "childAges": {
                "description": "Optional ages in years for each child (0-17). When set, provide one entry per child.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "children": {
                "default": 0,
                "description": "Number of children, from 0 to 10. Optional childAges can specify each child's age.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "cityPageUrl": {
                "description": "Agoda city page URL, such as https://www.agoda.com/city/bangkok-th.html. Returns listed hotels without dated prices; takes precedence over destination and regionId, but not detailUrls.",
                "pattern": "^$|^(https?://)?([A-Za-z0-9-]+\\.)*agoda\\.[A-Za-z.]{2,10}/.*city/.+$",
                "type": "string"
              },
              "destination": {
                "description": "A city name such as Chiang Mai, Seoul or Tokyo, in a language Agoda recognizes. A name that is not recognized as a city returns no rows; hotel page URLs, a city page URL or a city ID take precedence.",
                "type": "string"
              },
              "detailUrls": {
                "description": "Up to 20 distinct Agoda hotel page URLs, such as https://www.agoda.com/asia-hotel-bangkok/hotel/bangkok-th.html. These take precedence over other targets; readable pages return hotel rows, with dated prices when available and optional review rows.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "domain": {
                "default": "www.agoda.com",
                "description": "Agoda site, such as www.agoda.com, www.agoda.co.th or www.agoda.co.jp. A supported country site determines the language and currency.",
                "pattern": "^(([A-Za-z0-9-]+\\.)*agoda\\.[A-Za-z.]{2,10})?$",
                "type": "string"
              },
              "enrichDetails": {
                "default": true,
                "description": "Add descriptions, amenities, FAQs and available address details to the first search-result hotels. Guest reviews are separate rows only when includeReviews is enabled.",
                "type": "boolean"
              },
              "enrichLimit": {
                "default": 1,
                "description": "Number of search-result hotels to enrich, from 0 to 20. Direct hotel page inputs are read separately from this setting.",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "includeReviews": {
                "default": false,
                "description": "Return each available guest review as a separate billed row. Hotel and review rows share maxResults; this also enables hotel details.",
                "type": "boolean"
              },
              "includeRooms": {
                "default": false,
                "description": "Return each sellable room variant (room type, bed configuration, price plan) as a separate billed row, in addition to hotel and review rows. Room rows share maxResults.",
                "type": "boolean"
              },
              "includeSponsored": {
                "default": false,
                "description": "Keep hotels Agoda marks as sponsored.",
                "type": "boolean"
              },
              "locale": {
                "default": "en-us",
                "description": "Language and currency setting on www.agoda.com, such as en-us for USD or ja-jp for JPY. A supported country site overrides this setting.",
                "type": "string"
              },
              "maxResults": {
                "default": 10,
                "description": "Most rows for each destination search, city page URL, or hotel page URL. Default 70; larger numbers are collected in parts of 70. Hotels, reviews and room variants count together. The whole run stops at your maximum total charge. Free platform plan: up to 200 rows per run and 10 runs of this Actor.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "regionId": {
                "description": "Numeric Agoda city ID, such as 9395 for Bangkok. Used instead of destination, unless hotel page URLs or a city page URL are set.",
                "pattern": "^\\d*$",
                "type": "string"
              },
              "rooms": {
                "default": 1,
                "description": "Number of rooms, from 1 to 10.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
