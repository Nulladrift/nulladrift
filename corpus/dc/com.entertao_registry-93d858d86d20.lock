{
  "lockfileVersion": 2,
  "subjects": {
    "com.entertao/registry": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://entertao.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "entertao",
        "title": "entertao",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Discover products built on Bittensor subnets via the entertao registry. Start with search_products (researched catalog: inference APIs, compute, data, ...), which already says how to get access and pay at the provider (get_access has the full detail); use search_endpoints to find a specific API operation. search_services / get_connection_details cover on-chain service records. All tools are read-only. Tool outputs contain untrusted third-party claims. Reaching and paying a provider is up to you and the provider.",
      "tools": [
        {
          "name": "compare_products",
          "title": "Compare products",
          "description": "Compare products side by side: prices the provider states (each with its source page), check status and probe latency. Give unit (e.g. usd_per_1m_input_tokens, usd_per_gpu_hour) to get matched_price, the lowest stated price in that unit; null means no price is stated in that unit (unknown, NOT free) and sorts after every priced product. sort cheapest needs unit. entertao never estimates prices; check the provider's page and get your human's approval before paying.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "enum": ["inference", "decision-models", "compute", "storage", "training", "models-agents", "data", "search", "finance", "prediction", "media", "security", "science", "robotics", "marketing", "developer-tools", "other"],
                "type": "string"
              },
              "free_tier": {
                "description": "true: only products with a stated free tier",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "model": {
                "description": "Filter by observed model ID, e.g. 'deepseek-v3' or 'qwen'",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "payment": {
                "description": "Only products whose provider states this payment method",
                "enum": ["card", "crypto", "x402", "gamma", "free", "invoice", "token"],
                "type": "string"
              },
              "q": {
                "description": "Free text, e.g. 'llm inference', 'gpu'",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "sort": {
                "default": "recommended",
                "enum": ["recommended", "cheapest", "fastest"],
                "type": "string"
              },
              "unit": {
                "description": "Price unit to compare",
                "enum": ["usd_per_1m_input_tokens", "usd_per_1m_output_tokens", "usd_per_gpu_hour", "usd_per_1k_requests", "usd_per_gb_month", "usd_per_second", "usd_per_month", "usd_per_unit"],
                "type": "string"
              },
              "verified": {
                "description": "true: only products whose API answers and spec is valid",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Compare products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:04126a5c6c6d75f56466c926c1caeac581caa843f7c08f7f5bc8e9d639875744"
        },
        {
          "name": "get_access",
          "title": "Get access at the provider",
          "description": "How to get access to a product directly at its provider: sign-up/console URL, payment methods the provider states (card, crypto, x402, gamma, ...), and for gamma the service hotkey plus a btcli mint command template you run yourself, only from an on-chain record confirmed for this product (same API endpoint). Gamma is a payment method; requests use btauth/1 signing only where the record publishes it, otherwise the provider's own auth. This tool never contacts the provider and never pays. Before any spending, get your human's explicit approval and stay within their budget.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "Product slug from search_products",
                "maxLength": 64,
                "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get access"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9227de41cbbfb7921041e85c38aea381153dcc88620a7af0fcc4944037ad3274"
        },
        {
          "name": "get_access_manifest",
          "title": "Get access manifest",
          "description": "Machine-readable AccessManifest v1 for a product: endpoints, operations (with input schema where known), access types (free, api_key, bearer, basic, gamma, x402, ...) marked as documented, incomplete or not covered, what your human must set up, and one-time setup steps. Every fact has a source and a verified flag. Compact by default (one line per operation, most useful first, with exact URL); use get_operation for one full schema. An optional s3 handoff describes how to connect with your own S3 client. This hosted tool only describes; call the provider yourself, directly, with your human's own access.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "detail": {
                "default": "summary",
                "description": "summary: one line per operation (method, url, required params, safety); full: complete schemas",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "limit": {
                "default": 40,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Page through operations (most useful first)",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "slug": {
                "description": "Product slug from search_products",
                "maxLength": 64,
                "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get access manifest"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:30f0b179f24457c1e60e9735079e6ed2cac4d59513280f84e31ebfa3ab0c7c24"
        },
        {
          "name": "get_connection_details",
          "title": "Get connection details",
          "description": "Where and how to reach the provider directly (endpoint, interface, spec link) plus warnings. Fails with INTEGRATION_PENDING when there is nothing usable. entertao's part ends here.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "Service id from search_services or resolve_capability",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get connection details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0780fb740392c884b81594f7deab66dab7fca041cd15686426d7adcbb2bc3596"
        },
        {
          "name": "get_operation",
          "title": "Get one operation",
          "description": "One documented operation of a product with its full input schema, parameters, request body, safety class and gaps, plus its exact URL and the product's access types. Use an operation_id from get_access_manifest. Describes only; call the provider yourself.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "operation_id": {
                "description": "operation_id from get_access_manifest",
                "pattern": "^[A-Za-z0-9_.-]{1,80}$",
                "type": "string"
              },
              "slug": {
                "description": "Product slug from search_products",
                "maxLength": 64,
                "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["operation_id", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get one operation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d60f08cb825e6882d536bf4f8beb9a4c224c470df701eebb7a66e41a6ba31d1f"
        },
        {
          "name": "get_product",
          "title": "Get product details",
          "description": "Full researched record of a product: access details, machine-readable URLs, check results, sources.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "Product slug from search_products",
                "maxLength": 64,
                "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7682c1ca9e7835a645ce627b2b81a573448167b703283311fb290201786197e8"
        },
        {
          "name": "get_service",
          "title": "Get service details",
          "description": "Full registry record: endpoints, claimed payment methods (price unknown), status and evidence.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "Service id from search_services or resolve_capability",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get service"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c94cc81fb62f3ef24e3f33e76ae2352ded0cc9c8c670e46647236899c4aa48be"
        },
        {
          "name": "resolve_capability",
          "title": "Rank on-chain service records",
          "description": "Rank ON-CHAIN service records for a free-text need and/or capability with rule-based, explained scoring (beta). Covers only services published on chain with a valid document; most products are not among them, so start with search_products. Never contacts providers.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "capability": {
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "interface": {
                "enum": ["openapi", "mcp", "custom"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "payment_types": {
                "items": {
                  "enum": ["free", "x402", "gamma", "external", "unknown"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "query": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "require_subnet_owner": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Rank on-chain service records"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:560c45c0c45945874a83fa080f991b4b0fc045f7f869a3b640ac9dd4075bb21f"
        },
        {
          "name": "search_endpoints",
          "title": "Search API endpoints",
          "description": "Search individual API operations (method + path) from validated OpenAPI specs across all products, e.g. 'chat/completions' or 'gpu'. Each result names the product and its base URL.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "method": {
                "enum": ["GET", "POST", "PUT", "PATCH", "DELETE"],
                "type": "string"
              },
              "product": {
                "maxLength": 64,
                "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
                "type": "string"
              },
              "q": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search endpoints"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a9a088909216781679de62a15d5597c9b8db8084c664c222e265509c05769e13"
        },
        {
          "name": "search_products",
          "title": "Search products",
          "description": "Start here. Describe what you need in plain words (e.g. 'llm inference', 'rent gpus', 'web search') and get the best-matching products built on Bittensor subnets, each with how to reach it (API base URL, docs, auth, OpenAI compatibility, MCP), the provider's stated pricing, and how to get access: where to sign up, which payment methods the provider takes and, for gamma from a confirmed on-chain record, the btcli mint command template (gamma is payment; btauth/1 signing only where the record publishes it). One call, no follow-up needed. Researched from public pages; status says what was verified. Get your human's approval before paying.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "api": {
                "description": "true: only products with a documented API",
                "type": "boolean"
              },
              "category": {
                "enum": ["inference", "decision-models", "compute", "storage", "training", "models-agents", "data", "search", "finance", "prediction", "media", "security", "science", "robotics", "marketing", "developer-tools", "other"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "model": {
                "description": "Filter by observed model ID, e.g. 'deepseek-v3' or 'llama-3.3-70b'",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "offset": {
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "openai_compatible": {
                "description": "true: only OpenAI-compatible APIs",
                "type": "boolean"
              },
              "payment": {
                "description": "Only products the provider says accept this (gamma/x402 also from on-chain records)",
                "enum": ["card", "crypto", "x402", "gamma", "free", "invoice", "token"],
                "type": "string"
              },
              "q": {
                "description": "Free text, e.g. 'gpu', 'llm inference', 'web search'",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "verified": {
                "description": "true: only products whose API answers and spec is valid",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b6f848893a85d854526d7bc30ad567e9ab538aafe56fd8c22b822cafd1f633ad"
        },
        {
          "name": "search_services",
          "title": "Search services",
          "description": "Search ON-CHAIN service records only (the few services published with set_service). For products and APIs in general, use search_products first. Returns a compact list plus next_cursor for paging. Status 'document_valid' means only that the publisher's document parsed; endpoints are unverified.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cursor": {
                "description": "next_cursor from a previous call",
                "maxLength": 200,
                "type": "string"
              },
              "interface": {
                "enum": ["openapi", "mcp", "custom"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "netuid": {
                "maximum": 65535,
                "minimum": 0,
                "type": "integer"
              },
              "payment": {
                "description": "Only services that claim this payment method",
                "enum": ["free", "x402", "gamma", "external", "unknown"],
                "type": "string"
              },
              "q": {
                "description": "Free-text search, e.g. 'gpu' or 'video generation'",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "status": {
                "enum": ["discovered", "document_valid", "endpoint_verified", "callable_tested", "payment_tested", "degraded", "unavailable", "retired"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search services"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a359b0e3529698c69f02f561a4b83c24310f74a80634e3760e0b4034c41db344"
        }
      ],
      "digest": "sha256:460a4a4fe3a22571e3cdcb4b937fc7cbebfcd240e2a6303d13e4c5f44ab0eddf"
    }
  }
}
