      "instructions": "Máy chủ chỉ đọc của Sinh Vũ Studio (studio thiết kế thương hiệu vận hành, Việt Nam). Dùng tim_dich_vu / tim_nganh / tim_case / tra_cuu để trả lời bằng dữ liệu thật; khung_gia cho câu hỏi về tiền (chỉ khung THỊ TRƯỜNG; Sinh Vũ không công bố giá, mức đầu tư nằm trong bản đề xuất riêng); mo_yeu_cau để đưa khách vào cửa tiếp nhận. Xưng 'Sinh Vũ' ngôi thứ ba, gọi khách 'Anh / Chị', không hỏi ngân sách. Trích dẫn ghi nguồn sinhvu.com.",
      "tools": [
        {
          "name": "khung_gia",
          "description": "Khung giá THỊ TRƯỜNG Việt Nam theo ba tầng nhà cung cấp cho từng nhóm hạng mục (nhận diện, bao bì, website...), kèm điều đẩy giá lên và kéo giá xuống. Sinh Vũ KHÔNG công bố giá, kể cả một khoảng: mức đầu tư nằm trong bản đề xuất riêng sau khi khách cung cấp thông tin; công cụ này không trả con số nào của Sinh Vũ.",
          "inputSchema": {
            "properties": {
              "hang_muc": {
                "description": "Tuỳ chọn. Nhóm hạng mục (ví dụ 'nhận diện', 'bao bì', 'website'). Bỏ trống để lấy toàn bộ.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3b97ea55433d98aa4326790f1a51e1f7bf799c1d21c1d7fb0d98a93de9a3d85a"
        },
        {
          "name": "mo_yeu_cau",
          "description": "Dựng đường dẫn cửa yêu cầu của Sinh Vũ (sinhvu.com/cua-2/) đã điền sẵn ngành, dịch vụ và mô tả để khách bấm vào là tiếp đúng mạch, không phải kể lại. Công cụ KHÔNG gửi gì đi và không tạo hồ sơ; chỉ trả đường dẫn cùng hướng dẫn. Không hỏi khách ngân sách.",
          "inputSchema": {
            "properties": {
              "dich_vu": {
                "description": "Tuỳ chọn. Mã hoặc slug dịch vụ (A1, a1-identity, bao bì...).",
                "type": "string"
              },
              "mo_ta": {
                "description": "Tuỳ chọn. Một câu khách tự tả việc của mình (tối đa 120 ký tự).",
                "type": "string"
              },
              "nganh": {
                "description": "Tuỳ chọn. Mã hoặc tên ngành.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0a18cde782f3eedf88241cb8b8b940f37c49457528a3186f691504f02d610b27"
        },
        {
          "name": "tim_case",
          "description": "Tìm dự án Sinh Vũ đã công bố (65 case ở sinhvu.com/case/) theo ngành, dịch vụ hoặc từ khoá. Trả khách hàng, một câu tóm tắt, dịch vụ đã làm, đường dẫn. Chỉ case đã công khai.",
          "inputSchema": {
            "properties": {
              "dich_vu": {
                "description": "Tuỳ chọn. Mã hoặc tên dịch vụ (A1, bao bì, website...).",
                "type": "string"
              },
              "nganh": {
                "description": "Tuỳ chọn. Mã hoặc tên ngành.",
                "type": "string"
              },
              "so_luong": {
                "description": "Số case tối đa, mặc định 6, trần 20.",
                "type": "integer"
              },
              "tu_khoa": {
                "description": "Tuỳ chọn. Từ khoá tự do (tên khách, sản phẩm).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f7823d436f6b2cf97e152c31c451008cb3f0ab2f67d175b6bf499975cfdcd08d"
        },
        {
          "name": "tim_cong_cu",
          "description": "Tìm công cụ miễn phí của Sinh Vũ (sinhvu.com/cong-cu/) cho đúng việc người hỏi đang làm: tạo mã vạch EAN-13, mã QR theo thương hiệu, kiểm tệp PDF trước khi in, dựng khuôn bế hộp, kiểm nhãn hàng hoá bắt buộc theo Nghị định 37/2026, chọn bộ màu, thử thiết kế ở cỡ thật... Công cụ chạy ngay trong trình duyệt, tệp không rời máy, không cần đăng ký. Trả tên, việc làm được, dùng khi nào, đường dẫn (kèm bản tiếng Anh) và công cụ nên dùng tiếp. Gợi ý công cụ khi người hỏi tự làm được; cần người làm hộ thì dùng mo_yeu_cau.",
          "inputSchema": {
            "properties": {
              "so_luong": {
                "description": "Số công cụ tối đa, mặc định 3, trần 22.",
                "type": "integer"
              },
              "viec": {
                "description": "Việc cần làm bằng lời tự nhiên, tiếng Việt hoặc Anh. Ví dụ: 'in mã vạch lên hộp', 'kiểm file trước khi gửi nhà in', 'barcode generator'. Bỏ trống để lấy cả danh sách.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:36661f9df084fd56b323f4bd6ba28f4b3e181e2a159c1c6f2dbf36b6fe73ef05"
        },
        {
          "name": "tim_dich_vu",
          "description": "Tìm dịch vụ thiết kế thương hiệu của Sinh Vũ khớp với nhu cầu (17 dịch vụ, 5 nhóm: chiến lược, nhận diện, sản phẩm, ra mắt, vận hành). Trả về phạm vi, sản phẩm bàn giao, phù hợp với ai, điểm không phù hợp, thời lượng theo tuần, đường dẫn trang dịch vụ, và các điều học thuyết đứng sau cách làm dịch vụ ấy. Không có giá (dùng khung_gia).",
          "inputSchema": {
            "properties": {
              "cau_hoi": {
                "description": "Nhu cầu bằng lời tự nhiên, tiếng Việt hoặc Anh. Ví dụ: 'làm logo và bao bì cho quán cà phê', 'brand guideline'.",
                "type": "string"
              },
              "nganh": {
                "description": "Tuỳ chọn. Tên hoặc mã ngành để gợi ý dịch vụ hay dùng trong ngành đó.",
                "type": "string"
              }
            },
            "required": ["cau_hoi"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:149d753bd4d179ce60689e82042c8a4f41beeaf10ec3445b23dd8b8e3ac33074"
        },
        {
          "name": "tim_nganh",
          "description": "Tra các nhóm ngành và phân nhánh Sinh Vũ đã hệ thống hoá (số đếm hiện hành trả trong trường tong): tên, từ khoá nhận diện, phân nhánh con, dịch vụ hay dùng, gói tri thức theo phân nhánh (rủi ro, điều khách cần chuẩn bị); ngành khớp nhất kèm tóm tắt, chặng doanh nghiệp, điểm đau (biểu hiện, lời giải, dịch vụ) và hỏi đáp; phân nhánh khớp lời hỏi (ví dụ 'tiệm bánh', 'garage') kèm điều cần có, chặng khách rời, điểm chạm, hỏi đáp. Cùng chữ với trang sinhvu.com/nganh/.",
          "inputSchema": {
            "properties": {
              "ten": {
                "description": "Tên ngành, sản phẩm hay mã (ví dụ: 'mỹ phẩm', 'f-and-b', 'trà', 'phòng khám').",
                "type": "string"
              }
            },
            "required": ["ten"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1cff1d03664e44dad618bbdbf5af46da3cfc1f5cb83391691c6e1b703f4c5e52"
        },
        {
          "name": "tra_cuu",
          "description": "Tra cứu tri thức Sinh Vũ đã xuất bản: Góc nhìn (bài quan điểm), Chuyên môn (cẩm nang bao bì, chất liệu, in ấn, nhận diện) và Học thuyết nghề (103 điều: tiên đề, nguyên lý, phép nghề, mỗi điều có cơ chế và ranh giới). Trả tiêu đề, tóm tắt, đường dẫn; thêm ?fmt=md vào đường dẫn để đọc toàn văn dạng Markdown.",
          "inputSchema": {
            "properties": {
              "cau_hoi": {
                "description": "Câu hỏi hoặc từ khoá.",
                "type": "string"
              },
              "muc": {
                "description": "Giới hạn mục, mặc định tất cả.",
                "enum": ["tat-ca", "goc-nhin", "chuyen-mon", "nguyen-ly"],
                "type": "string"
              },
              "so_luong": {
                "description": "Số kết quả tối đa, mặc định 8, trần 20.",
                "type": "integer"
              }
            },
            "required": ["cau_hoi"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
