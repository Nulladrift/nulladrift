        {
          "name": "view_pdf",
          "title": "View PDF",
          "description": "Display an already-uploaded PDF in an interactive viewer widget.\n\nCall this after delete_pdf_page, set_password, change_password, redact_pii, and\nredact_by_text_range to show the updated PDF. Also call when the user explicitly\nasks to (re-)display a specific PDF.\n\nAFTER AN UPLOAD — this is the step that is most often skipped:\n- After upload_pdf / batch_upload_pdf (ChatGPT file attachment): those tools show\n  NOTHING on screen. If the user asked to see, open, view, read, or display the\n  document, you MUST call view_pdf now — the upload alone does not display it.\n- After create_upload_page (widget upload): do NOT call view_pdf. That widget\n  renders the PDF itself.\n\nThe job_id must be one you actually received from upload_pdf, batch_upload_pdf, or\ncheck_upload_status ('jobs' / 'already_uploaded'). NEVER invent a job_id and never\npass a filename as job_id. If you do not have a job_id yet, the file is not on the\nserver: upload it first and call view_pdf afterwards.\n\nMANDATORY after this tool returns:\n1. Render a markdown download link so the user can save the file:\n   [Download {filename}]({download_url})\n2. Follow cta_instruction and append cta_text at the end of your reply.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "default": "",
                "description": "Job ID of the PDF to display (use the latest job_id).",
                "type": "string"
              },
              "session_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Session ID that the job belongs to."
              }
            },
            "type": "object"
          },
