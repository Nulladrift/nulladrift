        {
          "name": "get_pdf_page_images",
          "title": "Get PDF Page Images",
          "description": "Use this when you need to visually inspect PDF pages to identify content that cannot be detected from text alone — for example, pages containing a logo, a photograph, a watermark, a QR code, or any visual element. Returns rendered JPEG screenshots as images you can see. Returns at most 10 pages per call. ALWAYS start from start_page=1 and paginate through the ENTIRE document: check 'has_more' in structuredContent — if true, call again with start_page=next_start_page. Repeat until has_more is false. You must finish scanning all pages before answering the user's question or performing any action (e.g. deletion). Requires: pip install pymupdf",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "default": 10,
                "description": "Number of pages to render per call (capped at MAX_IMAGE_PAGES).",
                "type": "integer"
              },
              "job_id": {
                "description": "Job ID of the PDF to render.",
                "type": "string"
              },
              "session_id": {
                "description": "Session ID that the job belongs to.",
                "type": "string"
              },
              "start_page": {
                "default": 1,
                "description": "1-based page number to start from (default 1).",
                "type": "integer"
              }
            },
            "required": ["job_id", "session_id"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Response data structure for rendered PDF page images.\n\n圖片本身走 content 的 ImageContent，這裡只描述分頁進度，\n讓模型知道還要不要繼續往下翻。",
            "properties": {
              "has_more": {
                "title": "Has More",
                "type": "boolean"
              },
              "job_id": {
                "title": "Job Id",
                "type": "string"
