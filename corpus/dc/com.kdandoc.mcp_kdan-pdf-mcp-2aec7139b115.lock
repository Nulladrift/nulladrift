        {
          "name": "upload_pdf",
          "title": "Upload PDF",
          "description": "Upload a PDF from a ChatGPT file attachment.\n\nMANDATORY WORKFLOW — follow EVERY step in order:\n1. ALWAYS call check_upload_status FIRST — even if you think the file is new.\n2. If a job with the same filename already exists, reuse its job_id — do NOT call upload_pdf.\n3. Only call upload_pdf if the file is confirmed absent from check_upload_status.\nSkipping step 1 and calling upload_pdf directly is FORBIDDEN.\n\nUse this when the user provides a file attachment in ChatGPT. The host resolves\nthe attachment and passes it to this tool; the tool then stores the PDF and\nreturns session_id and job_id for use in all subsequent tool calls.\n\nDo NOT inspect, construct, or reason about download URLs, file ids, or sandbox\npaths (e.g. '/mnt/data/...') — just pass the attachment straight through.\nNEVER invent, guess, or synthesise a download_url or file_id. If you do not have\na real attachment handed to you by the host, this is not the right tool.\n\nThis tool ONLY works on hosts that resolve chat attachments for you (ChatGPT).\nOn every other MCP client — Claude and other connectors — no such attachment\nexists: call create_upload_page instead to display the upload widget, and let\nthe user pick the file themselves.\n\nLikewise, if this tool is unavailable, is blocked, or reports a permission\nerror, do NOT tell the user that uploading is impossible. Fall back to\ncreate_upload_page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "pdf_file": {
                "additionalProperties": true,
                "description": "The file attachment, supplied by the host.",
                "properties": {
                  "download_url": {
                    "description": "Signed URL to download the file from.",
                    "type": "string"
                  },
                  "file_id": {
                    "description": "ChatGPT file identifier.",
                    "type": "string"
                  },
                  "file_name": {
                    "default": "",
                    "description": "Original file name.",
                    "type": "string"
                  },
                  "mime_type": {
                    "default": "",
                    "description": "MIME type of the file.",
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "session_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Existing session ID to group this file with previous uploads.\nIf omitted, a new session is created. Always pass the same session_id\nthroughout the entire conversation."
              }
            },
            "required": ["pdf_file"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Response data structure for upload_pdf / upload_pdf_from_path.\n\n重複上傳與新上傳走的是不同分支，但欄位刻意保持完全一致：\noutputSchema 宣告出去之後，每一條回傳路徑都必須符合同一份 schema。",
            "properties": {
              "filename": {
                "type": "string"
              },
              "instructions": {
                "type": "string"
              },
              "job_id": {
                "type": "string"
              },
