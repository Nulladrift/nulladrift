        {
          "name": "check_upload_status",
          "title": "Check Upload Status",
          "description": "Check existing uploads and determine which files still need uploading.\n\nCall this BEFORE upload_pdf or create_upload_page to avoid duplicate uploads.\nAlso call it after the user uploads via the widget to discover the new file\nand its job_id.\n\nReturns 'session_id' (always — store it!), plus:\n- 'already_uploaded': files from pending_filenames that are already in this\n  session, with reusable job_ids (empty when pending_filenames is omitted)\n- 'needs_upload': files not yet in this session (must be uploaded)\n- 'jobs' / 'count': every file currently stored in this session\n\nYou MUST call this tool before any upload, and you MUST act on its result immediately.\nWhen you passed pending_filenames:\n- 'needs_upload' is non-empty → call upload_pdf (single) or batch_upload_pdf (multiple)\n  with ONLY the files listed in 'needs_upload'. Pass the same session_id.\n  Do NOT upload files in 'already_uploaded'.\n- 'needs_upload' is empty → skip uploading entirely; use the job_ids from 'already_uploaded'.\n\nWhen pending_filenames is omitted, 'already_uploaded' and 'needs_upload' are\nalways empty and carry NO meaning — read 'jobs' instead. A non-empty 'jobs'\nmeans the files are already here: use those job_ids and do NOT ask the user to\nupload again.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "pending_filenames": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Bare filenames to check, e.g. ['FileA.pdf', 'FileB.pdf'].\nNever include directory paths like '/mnt/data/FileA.pdf'."
              },
              "session_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Session ID from a previous upload_pdf or create_upload_page call.\nIf omitted, a new session_id is generated and ALL pending files are\ntreated as needs_upload (new workflow)."
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "description": "Response data structure for check_upload_status.\n\n三條回傳路徑（全新 workflow、有 pending_filenames、列出整個 session）\n共用這一份形狀，缺席的欄位一律給空值而不是省略，才能符合宣告的 outputSchema。",
