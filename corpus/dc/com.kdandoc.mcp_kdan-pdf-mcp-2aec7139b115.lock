        {
          "name": "compare_pdfs",
          "title": "Compare PDFs",
          "description": "MANDATORY for all document comparison requests. Compare two PDFs side-by-side.\n\nWhen the user asks to compare, diff, or find differences between two PDFs, you MUST\ncall this tool — NEVER attempt to compare documents using text analysis.\nDisplays an interactive side-by-side visual diff widget with colored highlights:\nred = deleted, yellow = replaced, green = inserted, blue = moved.\n\nBefore calling, confirm both job_ids exist via check_upload_status.\n\nMANDATORY after this tool returns:\n1. Report how many spots of each type were found ('spots' in the result), naming the\n   highlight colour for each one so the user can read the widget.\n2. Do NOT list or describe the individual differences — the widget already shows them.\n3. Follow cta_instruction and append cta_text at the end of your reply.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_id_a": {
                "description": "Job ID for the first (original) PDF.",
                "type": "string"
              },
              "job_id_b": {
                "description": "Job ID for the second (modified) PDF.",
                "type": "string"
              },
              "session_id": {
                "description": "Session ID that both jobs belong to.",
                "type": "string"
              }
            },
            "required": ["job_id_a", "job_id_b", "session_id"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Response data structure for PDF comparison widget.\n\nArgs:\n    TypedDict: Full structured payload for compare widget rendering.",
            "properties": {
              "anchors": {
                "items": {
                  "items": {
                    "type": "integer"
                  },
                  "type": "array"
                },
                "title": "Anchors",
                "type": "array"
              },
              "cta_instruction": {
                "title": "Cta Instruction",
                "type": "string"
              },
              "cta_text": {
                "title": "Cta Text",
                "type": "string"
              },
              "filename_a": {
                "title": "Filename A",
                "type": "string"
              },
