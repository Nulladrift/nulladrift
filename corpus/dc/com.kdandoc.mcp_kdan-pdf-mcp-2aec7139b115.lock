        {
          "name": "redact_by_text_range",
          "title": "Redact PDF Text",
          "description": "Redact PDF text by specifying the exact text to remove on each line.\n\nMANDATORY WORKFLOW — follow every step in order before calling this tool:\n\nStep 1 — Retrieve line text:\n    Call list_redactable_line_text and note the exact 'text' string\n    and 'line_index' for every line you intend to redact.\n\nStep 2 — Identify the text to redact:\n    Provide the exact substring to remove. The value must appear verbatim\n    in the line's 'text' field.\n    - Non-CJK text (e.g. English): whole-word matching is enforced.\n      \"the\" will NOT redact text inside \"then\", \"there\", or \"either\".\n    - CJK text (e.g. Chinese): substring matching — \"王大明\" will match\n      wherever it appears in the line.\n\nStep 3 — Build the content payload:\n    Group redaction targets by page. Each page entry contains a list of\n    { line_index, text } pairs.\n\n    Example:\n        content = [\n            {\n                \"page_index\": 1,\n                \"lines\": [\n                    {\"line_index\": 3, \"text\": \"John Doe\"},\n                    {\"line_index\": 7, \"text\": \"confidential\"}\n                ]\n            }\n        ]\n\nStep 4 — Verify and re-redact if needed:\n    After this tool returns, you MUST call list_redactable_line_text again\n    with the NEW job_id to verify that all intended targets have been removed.\n    If any target text still appears in the result, call redact_by_text_range\n    again immediately with the remaining targets. Repeat until all targets\n    are gone — do NOT report success until the verification confirms zero\n    remaining targets.\n\nCreates a NEW job_id (with parent_job_id linking to the source). After redaction\ncompletes, call 'view_pdf' with the new job_id to display the result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "content": {
                "description": "List of pages to redact. Each item must include:\n- page_index (int): 1-based page number.\n- lines (list): each entry contains:\n    - line_index (int): line index from list_redactable_line_text.\n    - text (str): exact text to redact from that line.",
                "items": {
                  "description": "指定某頁中要遮蔽的行與文字。",
                  "properties": {
                    "lines": {
                      "items": {
                        "description": "指定單行中要遮蔽的文字。",
                        "properties": {
                          "line_index": {
                            "type": "integer"
                          },
                          "text": {
                            "type": "string"
                          }
                        },
                        "required": ["line_index", "text"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "page_index": {
                      "type": "integer"
                    }
                  },
                  "required": ["lines", "page_index"],
                  "type": "object"
                },
                "type": "array"
              },
              "job_id": {
                "description": "Job ID of the PDF to redact (use the latest job_id).",
                "type": "string"
              },
              "session_id": {
                "description": "Session ID that the job belongs to.",
                "type": "string"
              }
            },
            "required": ["content", "job_id", "session_id"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Response data structure for downloading a file.",
            "properties": {
              "download_url": {
                "type": "string"
              },
              "filename": {
                "type": "string"
              },
              "instructions": {
                "type": "string"
              },
              "job_id": {
                "type": "string"
              },
              "mime_type": {
                "type": "string"
              },
              "parent_job_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "reply_note": {
                "type": "string"
              },
              "session_id": {
                "type": "string"
              }
            },
            "required": ["download_url", "filename", "instructions", "job_id", "mime_type", "parent_job_id", "reply_note", "session_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
