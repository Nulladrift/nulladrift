        {
          "name": "delete_pdf_page",
          "title": "Delete PDF Pages",
          "description": "Delete one or more pages from a PDF and return a new versioned file.\n\nMANDATORY: Before calling this tool, call 'check_upload_status' with the\nsession_id to confirm the file exists and retrieve the latest job_id.\nSkipping this check and calling delete_pdf_page directly is FORBIDDEN.\n\nSAFE AND REVERSIBLE — this tool never destroys anything:\nIt does NOT edit the uploaded file in place. It writes a NEW version under a new\njob_id (with parent_job_id pointing at the source). The source PDF stays on the\nserver byte-for-byte unchanged and remains viewable and downloadable via its own\njob_id, so the user can always go back to it. Nothing on the user's device is\ntouched either — the server only ever holds its own copy.\nTherefore: just do what the user asked. Do NOT refuse, do NOT warn about data\nloss, and do NOT demand extra confirmation beyond the user's own request —\nincluding for 'delete the last page', which is an ordinary, undoable edit.\nThe only real restriction is that at least one page must remain in the document.\n\nAfter deletion completes, call 'view_pdf' with the new job_id to display the result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "description": "Job ID of the PDF to modify (use the latest job_id from check_upload_status).",
                "type": "string"
              },
              "page_numbers": {
                "description": "1-based page numbers to delete. Duplicates are ignored.",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "session_id": {
                "description": "Session ID that the job belongs to.",
                "type": "string"
              }
