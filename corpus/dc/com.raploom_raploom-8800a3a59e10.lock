{
  "lockfileVersion": 2,
  "subjects": {
    "com.raploom/raploom": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://raploom.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.raploom/raploom",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Raploom makes 12-second AI rap videos (4 short lines, vocals and a beat).\nTypical flow: understand who it is for and one specific detail → draft_lyrics → show the 4 lines and let the user edit → for an original character call create_character_video_order (needs the user's email and explicit approval of the lyrics and characters) → give the user payUrl → later get_order_status.\nFor videos from real photos use get_photo_video_link; photos are uploaded, screened and consented on the website. Hotel Lobby currently requires two adult photos.\nNever promise exact pronunciation, lip sync or delivery times. Do not invent prices; use the values tools return.\nLyric drafts are free. Payment happens only when the user opens payUrl and completes Stripe checkout. Keep the returned order link private; it grants access. Never send access tokens in URL queries or logs. Existing paid-pack uses are managed on orderUrl; do not create another order to spend those uses. If an order call has an uncertain result, do not automatically create another order.",
      "tools": [
        {
          "name": "create_character_video_order",
          "description": "Create an UNPAID order for 1–2 original characters, without photos. ONLY call after the user explicitly approves the characters, four lyrics and delivery email. No charge, Stripe session or video generation happens here. One video $6.99; three $15.99, one-time purchase. Give payUrl exactly as returned; the user must open it and pay personally. Do not automatically retry an uncertain order call.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "characters": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "maxLength": 120,
                      "minLength": 10,
                      "type": "string"
                    },
                    "name": {
                      "maxLength": 32,
                      "type": "string"
                    },
                    "voice": {
                      "enum": ["female", "male"],
                      "type": "string"
                    }
                  },
                  "required": ["description", "voice"],
                  "type": "object"
                },
                "maxItems": 2,
                "minItems": 1,
                "type": "array"
              },
              "email": {
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "lines": {
                "items": {
                  "maxLength": 100,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 4,
                "type": "array"
              },
              "offer": {
                "enum": ["single", "three"],
                "type": "string"
              },
              "stage": {
                "enum": ["studio-booth", "hotel-lobby", "street-cypher", "rooftop-night", "party-room"],
                "type": "string"
              },
              "topic": {
                "maxLength": 160,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["characters", "email", "lines", "offer", "stage", "topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8a072dd276d3ed706eb8c9611c71c09a8c9b70445300a9e4e677ee04b7638e8a"
        },
        {
          "name": "draft_lyrics",
          "description": "Write four short English rap lyric lines for free. Treat them as a draft: show the words and let the user approve or edit before ordering. With two performers, lines 1–2 are A and lines 3–4 are B; a recipient is not another singer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "occasion": {
                "default": "just-for-fun",
                "enum": ["just-for-fun", "birthday", "best-friends", "couple", "roast", "hype"],
                "type": "string"
              },
              "performers": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "maxLength": 32,
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 2,
                "minItems": 1,
                "type": "array"
              },
              "recipient": {
                "default": "",
                "maxLength": 32,
                "type": "string"
              },
              "subject": {
                "default": "character",
                "enum": ["person", "pet", "character"],
                "type": "string"
              },
              "topic": {
                "maxLength": 160,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["performers", "topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:005d61239dd2fc897b36dceac92de3cc97b1cc7e15448ec5f6c453c32826e241"
        },
        {
          "name": "get_order_status",
          "description": "Read a private order using BOTH its orderId and accessToken returned at creation. Never look up orders by email. Return only payment/video state and the private order link; video downloads stay on the website.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "accessToken": {
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              },
              "orderId": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["accessToken", "orderId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4a605eee28f6fed3360e99a2b2e8fc671490ad767924b5821ec5ebe08315dda2"
        },
        {
          "name": "get_photo_video_link",
          "description": "For a video from one person, two separate people, or a pet photo, give the user a website creation link. Photos, screening and consenting-adult declarations must be completed on raploom.com. Never accept photos through this tool.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "kind": {
                "enum": ["solo", "duo", "pet"],
                "type": "string"
              },
              "stage": {
                "enum": ["studio-booth", "hotel-lobby", "street-cypher", "rooftop-night", "party-room"],
                "type": "string"
              },
              "topic": {
                "maxLength": 160,
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:29f081fe982a4e583a368848428bc06931ab208ee8173942f53f76cb722a374f"
        },
        {
          "name": "list_examples",
          "description": "Show real published Raploom outputs and their actual lyrics. Use these to explain possibilities, not to promise an identical result. Optional use filter. Disclosures must stay visible.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "use": {
                "enum": ["birthday", "friends", "couple", "pet", "character", "promo"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:bb0f4698e5098478f3afce9838d581b2d29d219f2f46452f6c9f3ba91c82e6bb"
        },
        {
          "name": "list_stages",
          "description": "List the five stages and their supported photo modes. Hotel Lobby is only for two adult photos; use another stage for original characters.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:98127510edea244ed6858ded855473b71eb128c0453e620489b00e7f9e2be485"
        }
      ],
      "digest": "sha256:2137e022c670ac7ad3654a450fc35888492e33800bc7ba2ad162cc6faee8cf94"
    }
  }
}
