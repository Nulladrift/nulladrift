{
  "lockfileVersion": 2,
  "subjects": {
    "com.gurify/signing": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://sign.gurify.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "signing-for-agents",
        "title": "Signing for agents",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "E-signatures for AI agents. This service never sends email to anyone: send_for_signing returns a signing link for each person, and you send each link yourself, to that person only. If you have no API token yet, call create_account (it needs none and emails nothing), keep the token, and send it as 'Authorization: Bearer <token>' on this connection. Field positions are percentages of the page from its top-left corner. Guide: https://sign.gurify.com/docs",
      "tools": [
        {
          "name": "cancel_envelope",
          "description": "Cancel a pending envelope: its signing links stop working. Nobody is told; tell them yourself.",
          "inputSchema": {
            "properties": {
              "envelope_id": {
                "type": "string"
              },
              "reason": {
                "type": "string"
              }
            },
            "required": ["envelope_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3f9a91f1a8556082719bc79cacd574d5caac4357c51406da3bf9d1c5d8f1afb4"
        },
        {
          "name": "create_account",
          "description": "Make an account and an API token, with no email and no human. Needs no token. Nothing is sent to the email address; it names the account. Returns api_token (and a generated password for the web app).",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "The account's login. Nothing is ever sent to it.",
                "type": "string"
              },
              "name": {
                "description": "The account's name, e.g. your user's business.",
                "type": "string"
              },
              "password": {
                "description": "Optional. 8 to 72 characters with upper and lower case, a digit and a symbol. Made for you if missing.",
                "type": "string"
              },
              "token_name": {
                "type": "string"
              }
            },
            "required": ["email", "name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:10263d75ff2adbfcd3705140603b2614c6f266a6d8ed73f1532e05895eab6c87"
        },
        {
          "name": "delete_envelope",
          "description": "Delete an envelope.",
          "inputSchema": {
            "properties": {
              "envelope_id": {
                "description": "As returned by send_for_signing.",
                "type": "string"
              }
            },
            "required": ["envelope_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2516650730e2b2eb12c608fda0c94fe7d76c6bf1d209d14a9b0f4d6ee8fad799"
        },
        {
          "name": "download_document",
          "description": "Download a PDF of an envelope: the signed document (once COMPLETED), the original, the signing certificate or the audit log. Returned as an embedded PDF resource.",
          "inputSchema": {
            "properties": {
              "envelope_id": {
                "type": "string"
              },
              "which": {
                "default": "signed",
                "enum": ["signed", "original", "certificate", "audit_log"],
                "type": "string"
              }
            },
            "required": ["envelope_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:39bfc0e129f2b19eafb6f90720705eb5baec229428a83e2e564db09d18c6f54d"
        },
        {
          "name": "get_envelope",
          "description": "The status of an envelope (DRAFT, PENDING, COMPLETED, REJECTED, CANCELLED), each person's signing and read status, and the signing link of each person who has not signed yet.",
          "inputSchema": {
            "properties": {
              "envelope_id": {
                "description": "As returned by send_for_signing.",
                "type": "string"
              }
            },
            "required": ["envelope_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:10ece7f36e6953e91982e7b063da856208aede9bf68e6d1f3511caee1dff48b9"
        },
        {
          "name": "list_envelopes",
          "description": "Your envelopes, newest first.",
          "inputSchema": {
            "properties": {
              "page": {
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search the titles.",
                "type": "string"
              },
              "status": {
                "enum": ["DRAFT", "PENDING", "COMPLETED", "REJECTED"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:76daff3f3a952fe20d2b83eaa8658344f4f42808c09c450f603c3f39db97c747"
        },
        {
          "name": "send_for_signing",
          "description": "Upload a PDF, place the fields for each person, and get a signing link for each one. Nothing is emailed: send each signing_url to its own person yourself.",
          "inputSchema": {
            "properties": {
              "date_format": {
                "description": "e.g. MM/dd/yyyy",
                "type": "string"
              },
              "pdf_base64": {
                "description": "The PDF, base64. Or give pdf_url.",
                "type": "string"
              },
              "pdf_url": {
                "description": "A public http(s) address of the PDF (15 MB at most).",
                "type": "string"
              },
              "recipients": {
                "items": {
                  "properties": {
                    "email": {
                      "description": "Names the person in the audit log. Nothing is sent to it.",
                      "type": "string"
                    },
                    "fields": {
                      "items": {
                        "properties": {
                          "fieldMeta": {
                            "description": "Choices and options for RADIO, CHECKBOX, DROPDOWN and TEXT fields, as in Documenso's API v2.",
                            "type": "object"
                          },
                          "height": {
                            "description": "Percent of the page height.",
                            "type": "number"
                          },
                          "page": {
                            "description": "Counts from 1.",
                            "minimum": 1,
                            "type": "integer"
                          },
                          "positionX": {
                            "description": "Percent of the page width, from the left edge.",
                            "type": "number"
                          },
                          "positionY": {
                            "description": "Percent of the page height, from the top edge.",
                            "type": "number"
                          },
                          "type": {
                            "enum": ["SIGNATURE", "FREE_SIGNATURE", "INITIALS", "NAME", "EMAIL", "DATE", "TEXT", "NUMBER", "CHECKBOX", "RADIO", "DROPDOWN"],
                            "type": "string"
                          },
                          "width": {
                            "description": "Percent of the page width.",
                            "type": "number"
                          }
                        },
                        "required": ["height", "page", "positionX", "positionY", "type", "width"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "name": {
                      "type": "string"
                    },
                    "role": {
                      "default": "SIGNER",
                      "enum": ["SIGNER", "APPROVER", "VIEWER", "CC", "ASSISTANT"],
                      "type": "string"
                    },
                    "signing_order": {
                      "description": "For SEQUENTIAL signing.",
                      "type": "integer"
                    }
                  },
                  "required": ["email", "name"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "redirect_url": {
                "description": "The page a person sees after signing.",
                "type": "string"
              },
              "signing_order": {
                "default": "PARALLEL",
                "enum": ["PARALLEL", "SEQUENTIAL"],
                "type": "string"
              },
              "timezone": {
                "description": "IANA zone for dates, e.g. America/Phoenix.",
                "type": "string"
              },
              "title": {
                "type": "string"
              }
            },
            "required": ["recipients", "title"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:258f8021fd25173877e767f5f9169c6de1e38cf2d8509819ab6b2839c1f18bae"
        }
      ],
      "digest": "sha256:69c9cfb11a9cc794baa708b30ce3383ec7ba7e89ddee74e715151db20ee53f6c"
    }
  }
}
