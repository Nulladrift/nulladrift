        },
        {
          "name": "connect_promise",
          "title": "Connect Promise",
          "description": "Return a Promise signup URL for users who want agent access to follow-up memory. Safety: Never collects provider credentials in the agent. Send the user to Promise.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "clientName": {
                "description": "Name of the agent or MCP client requesting access.",
                "type": "string"
              },
              "intent": {
                "description": "Signup intent to preserve in Promise attribution.",
                "type": "string"
              },
              "returnUrl": {
                "description": "HTTPS URL the user can return to after Promise authorization.",
                "type": "string"
              },
              "scopes": {
                "items": {
                  "enum": ["promise.memory.read", "promise.evidence.read", "promise.capture.write", "promise.followup.write", "promise.draft.write"],
                  "type": "string"
                },
                "type": "array"
              },
              "state": {
                "description": "Opaque agent state returned unchanged after authorization.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
