          "name": "capture_note",
          "title": "Capture note",
          "description": "Let a user tell Promise something to remember. Safety: Echo what Promise understood and require review when the platform requests it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "contactId": {
                "format": "uuid",
                "type": "string"
              },
              "dueAt": {
                "format": "date-time",
                "type": "string"
              },
              "kind": {
                "default": "remember",
                "enum": ["task", "follow_up", "remember"],
                "type": "string"
              },
              "personName": {
                "type": "string"
              },
              "requestId": {
                "format": "uuid",
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "transcript": {
                "type": "string"
              }
            },
            "required": ["transcript"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
