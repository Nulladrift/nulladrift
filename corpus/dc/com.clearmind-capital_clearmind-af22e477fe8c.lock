      "serverInfo": {
        "name": "clearmind-capital",
        "title": "ClearMind Capital",
        "version": "1.3.1",
        "websiteUrl": "https://clearmind-capital.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ClearMind Capital LLC is a fee-only, fiduciary registered investment adviser in Columbus, Ohio (firm CRD# 334362). Use these tools to answer questions about the firm, to find ClearMind's published answers on retirement, investing, taxes, estate planning and 401(k) plans, and to preview a U.S. company's 401(k) Scorecard from its public Form 5500-SF filing, and to estimate 2026 federal, state, and Columbus city income tax with the same tables as ClearMind's public tax estimator. Everything returned is general education that ClearMind has already published on clearmind-capital.com. Cite the URL that comes with each result. Do not present any of it as personalized advice or a recommendation for a specific person. To connect someone with the firm, share the booking link or contact page from get_booking_options and let the person reach out themselves; this server never collects personal information.",
      "tools": [
        {
          "name": "estimate_2026_income_tax",
          "title": "Estimate 2026 federal, state, and Columbus income tax",
          "description": "Runs ClearMind Capital's public 2026 income tax estimator: federal brackets (IRS Rev. Proc. 2025-32), the chosen state's 2026 brackets (all 50 states and DC; Ohio includes its statutory $332 base above $26,050), and optionally the City of Columbus 2.5% income tax. Returns each layer's tax, the combined total, the effective rate, the top federal bracket, and a bracket-by-bracket breakdown, plus the estimator page URL to cite. Input is TAXABLE income (after deductions), applied to every layer. Excludes credits, the AMT, capital-gain rates, payroll tax, and most local taxes. General education only, not advice for a specific person. No auth; nothing is stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filing_status": {
                "default": "single",
                "description": "Filing status. Default single.",
                "enum": ["single", "married_filing_jointly"],
                "type": "string"
              },
              "include_columbus": {
                "default": false,
                "description": "Add the City of Columbus 2.5% municipal income tax (for people who live or work in Columbus).",
                "type": "boolean"
              },
              "state": {
                "default": "OH",
                "description": "Two-letter state code (or DC). Default OH.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "taxable_income": {
                "description": "Taxable income in US dollars for 2026, e.g. 150000.",
                "maximum": 25000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["taxable_income"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "2026 income tax estimate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ea1ff59687235f378f1b23deb8c4e9ea7fc5573bfa5e38c6561ab91ced7bdac9"
        },
        {
          "name": "find_401k_plan",
          "title": "Find a company's 401(k) plan",
          "description": "Search the public U.S. Department of Labor Form 5500-SF filings that power the ClearMind 401(k) Scorecard. Covers 401(k) plans in all 50 states and DC that file the 5500-SF (usually under 100 participants); larger plans file the full Form 5500 and are not included, and a miss returns an empty list with a link to request a hand-built Scorecard. Search by name needs the two-letter state the company files from; an EIN works in any state. Returns up to 5 plans with sponsor, city, state, plan year, participant count, and plan_id. No auth. Step 1 of 2: pass the plan_id to get_401k_scorecard_preview for the score.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Company or plan name (e.g. 'Acme Tool'), a 9-digit EIN, or a 12-digit EIN plus plan number. Dashes and spaces are ignored.",
                "maxLength": 120,
                "type": "string"
              },
              "state": {
                "description": "Two-letter state (or DC) of the company's address on its filing, e.g. OH or TX. Required to search by name; ignored for an EIN.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a 401(k) plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0922a39d4bbee0d6276d533fc325d5e31ef61ccc1a240a0145ff1e0dd0585004"
        },
        {
          "name": "get_401k_scorecard_preview",
          "title": "ClearMind 401(k) Scorecard preview",
          "description": "Preview of the ClearMind 401(k) Scorecard for one plan: overall 0-100 score, band (Strength, Monitor, Priority), headline, and a short story of the plan, scored from its latest public Form 5500-SF filing, with the filing date and data source. Not an audit or compliance determination. The full five-area breakdown is on the Scorecard page, not returned here. No auth. Step 2 of 2: get the plan_id from find_401k_plan first; an unknown plan_id returns an error that says so.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "plan_id": {
                "description": "plan_id from find_401k_plan: 9-digit EIN plus 3-digit plan number, e.g. 341401001-001. The dash is optional.",
                "maxLength": 20,
                "type": "string"
              }
            },
            "required": ["plan_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "401(k) Scorecard preview"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7ae66d6ede39c4cca8e2c10953c51ff14c90086c2fd340ff793f61e18c19ae9d"
        },
        {
          "name": "get_booking_options",
          "title": "How to contact or book a call with ClearMind Capital",
          "description": "Booking links and contact details so a person can reach ClearMind Capital themselves. Individuals and families (planning, investments, estate plan) book with the Private Wealth team; business owners and HR leads (401(k), cash balance plans) book with the Workplace Retirement team. Returns links, phone, email, and the client login only. This server never books, submits, or stores anyone's information; hand the links to the person. No auth. For fees, services, or adviser credentials use get_firm_overview.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audience": {
                "description": "individual_or_family for personal planning, business_owner for a company retirement plan. Omit when unsure to get both options.",
                "enum": ["individual_or_family", "business_owner"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Booking options"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f83feca969ba7534055005120cd30d894f3b4316a934209f35c016e09331e163"
        },
        {
          "name": "get_firm_overview",
          "title": "ClearMind Capital: firm overview",
          "description": "Facts about ClearMind Capital LLC, a fee-only fiduciary registered investment adviser in Columbus, Ohio: services, advisers and credentials, fee schedules, custodian, regulatory IDs (CRD), contact details, and links to the Form ADV summary and SEC record. Takes no arguments, needs no auth, and returns the same published snapshot on every call. Use for any question about the firm itself. For money topics (retirement, taxes, investing) use search_answers; to book a call use get_booking_options; for a company's 401(k) use find_401k_plan.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Firm overview"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a4179d7463e32647f140e74894516f0fc6a474f8549815582799d503ce5b6333"
        },
        {
          "name": "list_clarity_corner",
          "title": "List Clarity Corner articles and videos",
          "description": "List ClearMind Capital's Clarity Corner education library, newest first, with titles, summaries, dates, and URLs. Every result also includes the full list of topic names, so call it with no arguments first to see which topics exist. No auth. Use to browse or find recent content. To answer a specific question use search_answers, which ranks by relevance instead of date.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Article, Video, Short, or Podcast. Case-insensitive; plurals work.",
                "maxLength": 20,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Most items to return (1-25, default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "topic": {
                "description": "Topic name or part of one, case-insensitive, e.g. 'Retirement' or 'tax'. Combines with kind (both must match).",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Clarity Corner library"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f79347e9207d65a94b9ab89778b068200795f076a1eeede084c00a58873277a4"
        },
        {
          "name": "search_answers",
          "title": "Search ClearMind Capital's published answers",
          "description": "Keyword search over ClearMind Capital's published Q&A answers and Clarity Corner articles on retirement, Social Security, taxes (including Ohio and Columbus), investing, estate planning and trusts, 401(k) and workplace retirement plans, cash balance plans, and working with a fee-only advisor. Returns the best matches, each with the published answer text and its source URL, or an empty list with browse links when nothing matches. No auth; general education only, never advice for a specific person. Use for a specific money question. To browse the library by date or topic use list_clarity_corner; for facts and fees about the firm use get_firm_overview.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "Most results to return (1-10, default 5). Weak matches are dropped, so you may get fewer.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The question or topic in plain words, e.g. 'Roth conversion before retirement'. Full questions work; no operators or quotes needed.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search answers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:19cc72e54c63628a38afc87872ed85b6fddfa1a6965eb5caa9fcb4f0aabaf5a7"
        }
      ],
      "digest": "sha256:fcdfe5ff087dc77cd860a3e80bc366bc35b7e1d8fd70169a6b67cee7b4be26a9"
    }
  }
