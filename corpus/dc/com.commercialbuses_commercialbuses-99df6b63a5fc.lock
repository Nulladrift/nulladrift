        {
          "name": "get_used_bus_prices",
          "description": "Median asking prices and mileage for used buses by model year, measured from current dealer listings on CommercialBuses, with the listing and dealer count behind every figure. Prices cover school, cutaway and paratransit buses; mileage also covers motorcoaches. Asking prices, not sale prices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bus_type": {
                "description": "Optional. Omit for every type with enough data.",
                "enum": ["school-bus", "cutaway-bus", "paratransit-bus", "motorcoach", "type-a-school-bus", "activity-bus", "shuttle-bus", "transit-bus"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Used bus prices and mileage"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
