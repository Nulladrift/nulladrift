      "tools": [
        {
          "name": "answer_bus_question",
          "description": "Answers to the questions people ask when buying a used or new commercial bus: CDL and licensing, federal school bus and accessibility rules, inspecting a used bus, title, registration and insurance, financing and grants, delivery, and buses for churches, schools, camps, senior living, NEMT, shuttles and skoolies. Returns the closest written answers with their official sources and a link to each on CommercialBuses. If nothing matches, says so and gives the page where a person can be asked.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many answers to return. Default 3.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "question": {
                "description": "The buyer's question in their own words.",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Answer a bus buying question"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9e351880b43d8065a88f59df1e72ecf10fab7e0a9a584403424825c482aab1ee"
        },
        {
          "name": "check_cdl_requirement",
          "description": "Whether a bus needs a commercial driver's license under US federal rules, which class (B or C), and which endorsements (passenger, school bus), from the passenger count, weight rating and whether it carries students. Returns a link to buses for sale in that size. Federal only; states can add rules.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "carries_students": {
                "description": "true if it will carry students to or from school or school events.",
                "type": "boolean"
              },
              "passengers": {
                "description": "Passenger seats, not counting the driver. Count each wheelchair position.",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "weight": {
                "description": "Gross vehicle weight rating, from the door-frame label. Default unknown.",
                "enum": ["under_26001_lb", "26001_lb_or_more", "unknown"],
                "type": "string"
              }
            },
            "required": ["passengers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check the CDL requirement"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:66fd82114492716b5c630e7fa4476de266411c156e5046bd2ef9832d2284a282"
        },
        {
          "name": "check_vehicle_rules",
          "description": "The US federal rules and published guidance that apply to a church, school, camp, senior living community, medical transport (NEMT) operator or hotel buying a bus: CDL, the school bus rule for new vehicles, insurer guidance on 15-passenger vans, ADA accessibility for new vehicles, the hotel shuttle exception and USDOT number, insurance minimums, and Section 5310 funding. Each with its citation. Federal only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "carries_students": {
                "type": "boolean"
              },
              "new_vehicle": {
                "description": "true if buying new. Several rules cover new vehicles only.",
                "type": "boolean"
              },
              "organization_type": {
                "enum": ["church", "school", "camp", "senior", "nemt", "hotel", "other"],
                "type": "string"
              },
              "passengers": {
                "description": "Passenger seats, not counting the driver.",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "weight_over_26000_lb": {
                "description": "Omit if unknown.",
                "type": "boolean"
              }
            },
            "required": ["organization_type", "passengers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check the rules for a bus"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:967cb106ca1ba5adebd002077e0dc3ca8a6ffbf5ee249a9265329b264dd04f92"
        },
        {
          "name": "compare_own_vs_outsource",
          "description": "Yearly cost of owning a bus against charter, a contracted shuttle or rideshare, using only figures the caller supplies. Spreads the purchase over the years kept less resale, adds insurance, maintenance, fuel and driver pay, and names any owning cost left out so a partial answer says it is partial.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "alternatives": {
                "description": "Each quote to compare, e.g. a charter at $1,200 per trip or a shuttle contract at $4,000 per month.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "maxLength": 60,
                      "type": "string"
                    },
                    "rate_usd": {
                      "minimum": 0,
                      "type": "number"
                    },
                    "unit": {
                      "enum": ["trip", "month"],
                      "type": "string"
                    }
                  },
                  "required": ["label", "rate_usd", "unit"],
                  "type": "object"
                },
                "maxItems": 5,
                "type": "array"
              },
              "bus_price_usd": {
                "minimum": 0,
                "type": "number"
              },
              "driver_hours_per_year": {
                "minimum": 0,
                "type": "number"
              },
              "driver_pay_per_hour_usd": {
                "minimum": 0,
                "type": "number"
              },
              "fuel_price_per_gallon": {
                "minimum": 0,
                "type": "number"
              },
              "insurance_per_year_usd": {
                "minimum": 0,
                "type": "number"
              },
              "maintenance_per_year_usd": {
                "minimum": 0,
                "type": "number"
              },
              "miles_per_year": {
                "minimum": 0,
                "type": "number"
              },
              "mpg": {
                "minimum": 0,
                "type": "number"
              },
              "resale_usd": {
                "minimum": 0,
                "type": "number"
              },
              "trips_per_year": {
                "minimum": 0,
                "type": "number"
              },
              "years_kept": {
                "minimum": 1,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Own a bus or outsource?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ba2f7c0f392c9bde19a8ce150b3f2bb712707a2ee8bd32ea7a0ffdf930429782"
        },
        {
          "name": "draft_board_proposal",
          "description": "Write a bus purchase proposal for a church, school, camp or senior living board: the need, the bus, why not a 15-passenger van, the driver and license plan, a five-year cost table from the buyer's own figures, funding to ask about, an inspection plan and a draft motion with a not-to-exceed amount. Returns Markdown. Invents no costs: blank figures are left out.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bus": {
                "description": "e.g. 2019 Ford E-450 shuttle bus",
                "maxLength": 160,
                "type": "string"
              },
              "fuel_price_per_gallon": {
                "minimum": 0,
                "type": "number"
              },
              "insurance_per_year_usd": {
                "minimum": 0,
                "type": "number"
              },
              "listing_url": {
                "description": "A commercialbuses.com listing URL, if the bus is listed here.",
                "type": "string"
              },
              "maintenance_per_year_usd": {
                "minimum": 0,
                "type": "number"
              },
              "miles_per_year": {
                "minimum": 0,
                "type": "number"
              },
              "mpg": {
                "minimum": 0,
                "type": "number"
              },
              "need": {
                "description": "Who rides, where, how often.",
                "maxLength": 1000,
                "type": "string"
              },
              "not_to_exceed_usd": {
                "description": "The most the board authorizes. Defaults to the price.",
                "minimum": 0,
                "type": "integer"
              },
              "organization": {
                "maxLength": 160,
                "type": "string"
              },
              "organization_type": {
                "enum": ["church", "school", "camp", "senior", "other"],
                "type": "string"
              },
              "passengers": {
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "price_usd": {
                "minimum": 0,
                "type": "integer"
              },
              "signer": {
                "description": "Name and title of who signs.",
                "maxLength": 160,
                "type": "string"
              },
              "wheelchair_lift": {
                "type": "boolean"
              }
            },
            "required": ["organization_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Draft a board proposal"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8a96a5fa99f31c8a68c2d939ed8000ed39460151ca1b7554f3db35bc03324f8a"
        },
        {
          "name": "find_skoolie_bus",
          "description": "Find a bus to convert into a skoolie (a school bus or shuttle turned into a camper or tiny home). Returns used school, activity, shuttle and cutaway buses listed by dealers here, live federal surplus auction lots, and ready-made searches on GovDeals, Public Surplus and Municibid filtered by distance and price, and category links into Skoolie Livin' Classifieds. Auction and classified results are links to those sites, not copies of their listings. Free, no account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Default 10 per source.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_price_usd": {
                "description": "Budget ceiling in dollars, e.g. 5000.",
                "minimum": 1,
                "type": "integer"
              },
              "radius_miles": {
                "description": "How far the buyer will travel. Default 250.",
                "maximum": 1000,
                "minimum": 10,
                "type": "integer"
              },
              "state": {
                "description": "Two-letter US state, used for dealer listings and federal lots, e.g. FL.",
                "type": "string"
              },
              "zip": {
                "description": "US ZIP code to search around, e.g. 32801.",
                "pattern": "^\\d{5}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find a skoolie bus"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:39d4f44afac95864602e1c8a1e7acc1a08569858824b6d74bc0e7a660ca22c11"
        },
        {
          "name": "get_bus",
          "description": "One listed bus in full public detail, by its listing URL or slug, plus how to ask about it. Says plainly when the unit is no longer listed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "listing": {
                "description": "The listing URL or slug from search_buses, e.g. 2019-ford-e450-shuttle-bus-ab12cd34ef56.",
                "type": "string"
              }
            },
            "required": ["listing"],
            "type": "object"
