            "readOnly": false
          },
          "digest": "sha256:d303fbe26fb9bddcdc3487d01a5f577f8fcd4780b274ea410d039456216373f2"
        },
        {
          "name": "search_buses",
          "description": "Search the commercial buses currently listed for sale by participating dealers. Filter by bus type, seats, wheelchair lift, condition and state. Returns public listing summaries with a link to each listing page. Dealer names and exact prices are not public; to reach the dealer, use request_bus.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bus_type": {
                "description": "A category slug from list_bus_categories, e.g. cutaway-bus, school-bus, motorcoach.",
                "type": "string"
              },
              "condition": {
                "enum": ["new", "used"],
                "type": "string"
              },
              "limit": {
                "description": "Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "min_seats": {
                "description": "Smallest passenger count that works.",
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free text matched against the title, e.g. 'Ford E-450'.",
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state where the bus is, e.g. TX.",
                "type": "string"
              },
              "wheelchair_lift": {
                "description": "true to show only units with a lift or ramp.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search buses for sale"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
