        },
        {
          "name": "get_bus_category",
          "description": "One bus category in full, by slug, including the related categories worth considering instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "e.g. school-bus, cutaway-bus, motorcoach",
                "type": "string"
              }
