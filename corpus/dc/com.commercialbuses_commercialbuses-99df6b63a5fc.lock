        },
        {
          "name": "request_bus",
          "description": "Send a buyer's bus requirements to a CommercialBuses person, who searches participating dealer inventory and replies by email. Use only when the buyer has asked you to, with their real name and email: they will be contacted. Free for the buyer. Mention a specific listing in notes if they want that unit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "budget_max_usd": {
                "minimum": 0,
                "type": "integer"
              },
              "bus_types": {
                "description": "One or more category slugs from list_bus_categories.",
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "buyer_consented": {
                "const": true,
                "description": "Must be true: the buyer asked for this request to be sent.",
                "type": "boolean"
              },
              "buyer_email": {
                "format": "email",
                "type": "string"
              },
              "buyer_name": {
                "minLength": 1,
                "type": "string"
              },
              "buyer_phone": {
                "type": "string"
              },
              "city": {
                "description": "Where the buyer needs the bus.",
                "type": "string"
              },
              "condition": {
                "enum": ["new", "used", "either"],
                "type": "string"
              },
              "min_seats": {
                "minimum": 1,
                "type": "integer"
              },
              "notes": {
                "description": "Anything else, including a listing URL they liked.",
                "type": "string"
              },
              "organization": {
                "description": "Church, school, company or agency, if any.",
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state.",
                "type": "string"
              },
              "timeline": {
                "description": "When they need it, in their words.",
                "type": "string"
              },
              "wheelchair_lift": {
                "type": "boolean"
              }
            },
            "required": ["bus_types", "buyer_consented", "buyer_email", "buyer_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ask a person to find this bus"
          },
          "behavior": {
            "destructive": false,
