{
  "lockfileVersion": 2,
  "subjects": {
    "cn.pianam/devtools-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pianam.cn/devtools-mcp/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "devtools-mcp",
        "version": "4.1.3"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "logging": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "convert_timestamp",
          "title": "Convert Timestamp",
          "description": "时间戳双向转换，时区统一北京时间(UTC+8)。传入 Unix 时间戳（整数秒或毫秒，自动识别；也接受数字字符串）返回 ISO 8601 北京时间字符串；传入日期/时间字符串（如 2026-09-05、2026-09-05 10:30:00、2026-09-05T10:30:00+08:00）返回 Unix 秒/毫秒时间戳；不传 value 返回当前时间的两种格式。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "to": {
                "default": "iso",
                "description": "转换方向提示，\"iso\"（默认，转北京时间字符串）或 \"unix\"（转时间戳）；\n实际方向按 value 类型自动判断",
                "type": "string"
              },
              "value": {
                "anyOf": [
                  {},
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Unix 时间戳（秒/毫秒，整数或数字字符串，自动区分），\n   或日期时间字符串（ISO 8601、YYYY-MM-DD、YYYY/MM/DD HH:MM 等）；\n   不传或传空字符串则返回当前北京时间"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:62465cedf23532c5de3faf13b9f08cf827483aaa39c19805fb077dc002167927"
        },
        {
          "name": "convert_unit",
          "title": "Convert Unit",
          "description": "单位换算，支持四类：长度(m/km/cm/mm/mile/foot/inch，含毫米/厘米/英里/英尺/英寸)、重量(kg/g/mg/t/lb/oz，含克/磅/盎司)、温度(c/f/k，摄氏度/华氏度/开尔文，自动做偏移换算)、数据存储(B/KB/MB/GB/TB/PB，按1024二进制换算)。不支持的单位或跨类别换算（如米换算成千克）会返回清晰错误。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from_unit": {
                "description": "源单位，如 \"km\"、\"lb\"、\"f\"、\"GB\"",
                "type": "string"
              },
              "to_unit": {
                "description": "目标单位，如 \"mile\"、\"kg\"、\"c\"、\"MB\"",
                "type": "string"
              },
              "value": {
                "description": "待换算的数值",
                "type": "number"
              }
            },
            "required": ["from_unit", "to_unit", "value"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:0ae6afa3e5f4eb61259b3c8202e2eb05181faf77ed7952e20fa7ed99da66ed91"
        },
        {
          "name": "format_json",
          "title": "Format Json",
          "description": "JSON 字符串处理。action 支持：format（美化缩进2格，中文不转义）、minify（压缩为单行去空白）、validate（仅校验合法性，非法时返回错误行号、列号、位置指针和上下文片段）。输入 data 必须是字符串。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "default": "format",
                "description": "\"format\"（默认，美化缩进2格）、\"minify\"（压缩）、\n    \"validate\"（校验合法性）",
                "type": "string"
              },
              "data": {
                "description": "JSON 格式的字符串",
                "type": "string"
              }
            },
            "required": ["data"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:ac8a8216b327661bd90f2305ef5c9786c2608abb6f6ca045d1d72568dca60b21"
        },
        {
          "name": "generate_qr",
          "title": "Generate Qr",
          "description": "生成二维码。默认 format='svg' 返回 SVG 矢量图字符串（纯标准库生成，可直接保存为 .svg 文件，AI agent 可直接写文件）；format='png' 时返回 PNG 图片的 base64 编码和 data URI（需服务器安装 Pillow，未安装会返回提示）。content 支持 URL、纯文本、WiFi 配置（如 WIFI:T:WPA;S:网络名;P:密码;;）等任意字符串，上限 2000 字节。CPU 密集，走线程池不阻塞事件循环。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "content": {
                "description": "要编码的内容，支持 URL、纯文本、WiFi 字符串等，不能为空",
                "type": "string"
              },
              "format": {
                "default": "svg",
                "description": "\"svg\"（默认，返回 SVG 文本）或 \"png\"（返回 base64，需 Pillow）",
                "type": "string"
              }
            },
            "required": ["content"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:0dec478442803e67a4909183e71905a49604dc8ed512fdf058249dd8cbcf7e43"
        },
        {
          "name": "generate_uuid",
          "title": "Generate Uuid",
          "description": "生成 UUID（通用唯一识别码）。支持 v4 随机 UUID（默认）和 v5 命名空间 UUID（SHA-1 确定性生成，需提供 namespace 和 name）。count 可一次生成多个（1~1000）。namespace 支持预定义名 dns/url/oid/x500 或完整 UUID 字符串。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "default": 1,
                "description": "生成数量，1~1000，默认 1",
                "type": "integer"
              },
              "name": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "v5 必填，命名用的名称字符串，如域名、URL 等"
              },
              "namespace": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "v5 必填，命名空间，可传 \"dns\"/\"url\"/\"oid\"/\"x500\" 或完整 UUID 字符串"
              },
              "version": {
                "default": "v4",
                "description": "UUID 版本，\"v4\"（默认，随机）或 \"v5\"（命名空间确定性）",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:b61f62620ab7ee183d6db38ae5650d356ef7bcb423b066857ad49907ef3637f7"
        },
        {
          "name": "query_npm_version",
          "title": "Query Npm Version",
          "description": "查询 npm 包的最新版本信息。输入 npm 包名（如 react、vue、express、@vue/cli），返回最新版本号 latest_version、该版本发布时间 published_at（UTC ISO 8601）、包描述 description、开源协议 license，以及主页/仓库地址等。数据源优先官方 registry.npmjs.org，失败自动兜底淘宝镜像 registry.npmmirror.com（国内更快）。包不存在返回明确的 404 提示。网络 I/O 走线程池不阻塞事件循环。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "package": {
                "description": "npm 包名，如 \"react\"、\"vue\"、\"express\"、\"@vue/cli\"",
                "type": "string"
              }
            },
            "required": ["package"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:819129626dfe2dabdddb138668f296bc410cc35f0a0f67173bab66538553cc64"
        },
        {
          "name": "resolve_dns",
          "title": "Resolve Dns",
          "description": "DNS 域名解析（DoH，JSON API）。输入域名 name（如 baidu.com、www.qq.com）和记录类型 type（A 默认/AAAA/CNAME/MX/TXT），返回解析记录列表（每条含 name、type、ttl、data；MX 数据为 优先级+邮件交换主机，TXT 为文本记录）。数据源优先阿里 DoH（dns.alidns.com，国内快），失败自动兜底 Cloudflare DoH。域名不存在返回 NXDOMAIN 提示；域名存在但无该类型记录时返回空列表并附说明。网络 I/O 走线程池不阻塞事件循环。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "要解析的域名，如 \"baidu.com\"、\"www.qq.com\"（不含 http:// 和路径）",
                "type": "string"
              },
              "type": {
                "default": "A",
                "description": "记录类型，\"A\"（默认，IPv4）/ \"AAAA\"（IPv6）/\n  \"CNAME\"（别名）/ \"MX\"（邮件交换）/ \"TXT\"（文本记录）",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:21c3b3d7324dc845fe8352a41f1ccc30f1e46ac358c603160b70674054abde1f"
        }
      ],
      "digest": "sha256:f9b6c4226a1cfae02a4b5bb400085b84b378f14c81be85d9a60518e97895aede"
    }
  }
}
