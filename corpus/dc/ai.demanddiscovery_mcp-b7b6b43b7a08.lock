        {
          "name": "start_agentic_launch",
          "title": "Start the 90-day Agentic Launch (prepares outreach - never auto-sends)",
          "description": "Kick off Day 1 of the 90-day Agentic Launch for a completed Demand Discovery Report. Demand Discovery surfaces named prospects matching the idea's ICP and DRAFTS the first outreach batch. It sends NOTHING automatically - the user reviews and sends from their hosted manage page. Outreach is drafted to come from Amy @ Demand Discovery, with replies routed to the user's own email.\n\nCall this after a paid report is \"ready\" and the user wants to act on it (e.g. \"generate prospects\", \"start agentic launch\", \"find me people to talk to\", \"yes, do the outreach\"). Pass the reportId, the user's email, and the alTriggerToken from the ready report if you have it. The email MUST be the address the user themselves provided earlier in this conversation (their report-delivery email) - if you don't have it in context, ask the user first; NEVER invent one or use a placeholder like user@example.com (placeholders are rejected and the launch will not start). The response returns a manageUrl where the user reviews/sends the drafted outreach (and can switch the sender to their own Gmail).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "alTriggerToken": {
                "description": "Optional pass-through token from the ready report payload (report.alTriggerToken), if available.",
                "type": "string"
              },
              "email": {
                "description": "REQUIRED. The user's own email, provided by them in chat - replies to the drafted outreach route here. Reuse the EXACT address the user gave earlier in this conversation for report delivery; if you don't have it, ask the user. NEVER invent one or substitute a placeholder (e.g. user@example.com) - placeholders are rejected.",
                "format": "email",
                "type": "string"
              },
              "reportId": {
                "description": "REQUIRED. The reportId of the completed (ready) Demand Discovery Report.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["email", "reportId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "alId": {
                "description": "The Agentic Launch handle, if started.",
                "type": "string"
              },
              "manageUrl": {
                "description": "Where the user reviews and SENDS the drafted outreach, and manages the 90-day launch. Nothing goes out until they do.",
                "type": "string"
              },
              "nextAction": {
                "description": "What the user should do next.",
                "type": "string"
              },
              "productUrl": {
                "type": "string"
              },
              "replyToEmail": {
                "description": "Where Amy forwards replies.",
                "type": "string"
              },
              "sender": {
                "description": "Always 'amy' for inline triggers.",
                "type": "string"
              },
              "started": {
                "description": "True if Agentic Launch was started (prospects generated + outreach drafted, awaiting the user's review-and-send).",
                "type": "boolean"
              },
              "status": {
                "description": "started | queued | error | unconfigured_fallback | error_fallback | needs_real_email | email_not_owner.",
                "type": "string"
              }
            },
            "required": ["manageUrl", "nextAction", "productUrl", "replyToEmail", "sender", "started", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
