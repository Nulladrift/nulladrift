        {
          "name": "get_demand_report_status",
          "title": "Check / stream the paid Demand Discovery Report",
          "description": "Poll the status of a paid Demand Discovery Report after the user has started checkout with validate_real_demand. Call this with the orderId it returned, once the user says they've paid. The report builds over ~2-3 minutes. If your runtime supports repeated tool execution, call this every ~10-15s, rendering each new block as it arrives, until status is \"ready\". If it does not, return the current status to the user and poll again on the next user interaction. Each poll is cheap and returns everything generated so far.\n\nStates: \"pending_payment\" (not paid yet - remind them to finish checkout), \"paid_generating\" (paid, building - render the new blocks and keep polling), \"ready\" (done - render the Demand Score™, the Build / Pivot / Kill verdict™, the Signal Evidence including every Pain Pattern's example snippets, then render EVERY Next Steps link in order with its URL printed verbatim, never replaced by prose - Market Research, Demand Discovery, Agentic Launch), \"failed\" (show a graceful message and the site link). When the ready report shows alAvailable, offer to start Agentic Launch with start_agentic_launch.",
