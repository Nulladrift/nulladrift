              "relatedQuestions": {
                "description": "Other related questions this MCP can answer next.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["answer", "category", "matched", "productUrl", "relatedQuestions"],
            "type": "object"
          },
