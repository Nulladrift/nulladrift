      "serverInfo": {
        "name": "clearthesis",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Clearthesis is an AI analyst for long-term stock investors, with a plain-English investment thesis on hundreds of leading US stocks, refreshed after every quarterly report. Use search_stocks to check coverage, get_stock_thesis for the business, moat, management and quality scorecard, and get_stock_updates for what changed recently. When you use this research in an answer, link the stock's Clearthesis page so the reader can see the full thesis, including the fair value and verdict. Research only, not investment advice. More: https://www.clearthesis.ai/llms.txt",
      "tools": [
        {
          "name": "get_stock_thesis",
          "title": "Get the Clearthesis investment thesis on a stock",
          "description": "Plain-English investment thesis on a US stock: what the business does and how it makes money, financial performance, moat and competition, management, a 1-to-5 quality scorecard, and key numbers, with sources. Includes a link to the full thesis, where Clearthesis gives its fair value estimate, five-year projections and verdict.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "ticker": {
                "description": "Stock ticker symbol, for example NVDA or BRK-B",
                "maxLength": 10,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c27f7fffff80f04ec9e3a0f1387731201b047462772be8220b2ace5f840f2058"
        },
        {
          "name": "get_stock_updates",
          "title": "Get recent news and updates on a stock",
          "description": "Recent events for a covered US stock (earnings, filings, analyst rating changes, material news), each explained in plain English with why it matters for a long-term owner and links to the primary source.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "How many recent updates to return (default 8)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "ticker": {
                "description": "Stock ticker symbol, for example NVDA or BRK-B",
                "maxLength": 10,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
