      "serverInfo": {
        "name": "compensationprofessional-discovery",
        "version": "1.0.0",
        "description": "Read-only MCP access to Compensation Professional's compensation library, query-shaped practitioner answers, and effective-dated minimum-wage records by jurisdiction.",
        "websiteUrl": "https://compensationprofessional.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
