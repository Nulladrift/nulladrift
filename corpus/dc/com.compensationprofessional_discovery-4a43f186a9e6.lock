      "tools": [
        {
          "name": "check_wage_locations",
          "title": "Check the binding minimum wage for multiple locations",
          "description": "Checks the binding minimum-wage rate for up to 50 US locations in one call (city/county rate when it applies, else state, else federal). Each location may be a place name (\"Spokane, WA\", \"Texas\", \"TX\") or a jurisdiction slug. A city with no rule of its own on file returns its state's rate with noLocalRule:true. An unmatched location returns found:false with a reason instead of being omitted. 113 known jurisdictions, e.g.: federal, alaska, alabama, arkansas.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "locations": {
                "description": "Up to 50 places, one per item: \"City, ST\", a state name or code, or a slug (e.g. Spokane, WA; texas; seattle-wa).",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "rangeMinimum": {
                "description": "Optional proposed hourly range minimum; each found row returns belowRangeMinimum (CP-129/130).",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["locations"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "contract": {
                "type": "string"
              },
              "found": {
                "type": "number"
              },
              "requested": {
                "type": "number"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "belowRangeMinimum": {
                      "additionalProperties": false,
                      "properties": {
                        "next": {
                          "type": "boolean"
                        },
                        "nextEffective": {
                          "type": ["string", "null"]
                        },
                        "now": {
                          "type": "boolean"
                        }
                      },
                      "required": ["next", "nextEffective", "now"],
                      "type": "object"
                    },
                    "candidates": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "canonicalUrl": {
                      "type": "string"
                    },
                    "currency": {
                      "type": "string"
                    },
                    "didYouMean": {
                      "type": ["string", "null"]
                    },
                    "displayName": {
                      "type": "string"
                    },
                    "effectiveStart": {
                      "type": "string"
                    },
                    "found": {
                      "type": "boolean"
                    },
                    "fullLabel": {
                      "type": "string"
                    },
                    "input": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "noLocalRule": {
                      "type": "boolean"
                    },
                    "rate": {
                      "type": "number"
                    },
                    "reason": {
                      "enum": ["not_recognised", "ambiguous"],
                      "type": "string"
                    },
                    "scheduledRule": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "effectiveStart": {
                              "type": "string"
                            },
                            "jurisdictionDisplayName": {
                              "type": "string"
                            },
                            "rate": {
                              "type": "number"
                            }
                          },
                          "required": ["effectiveStart", "jurisdictionDisplayName", "rate"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "slug": {
                      "type": "string"
                    },
                    "stateCode": {
                      "type": ["string", "null"]
                    },
                    "type": {
                      "type": "string"
                    },
                    "typeLabel": {
                      "type": "string"
                    }
                  },
                  "required": ["found", "input"],
                  "type": "object"
                },
                "type": "array"
              },
              "retrievedAt": {
                "type": "string"
              },
              "source": {
                "type": "string"
              }
            },
            "required": ["contract", "found", "requested", "results", "retrievedAt", "source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:93af9001443bdda12cf3106b55866f4f4ef28d7e28d3cd3f1e38ce2a41ffb61a"
        },
        {
          "name": "get_answer",
          "title": "Get a query-shaped compensation answer",
          "description": "Returns one authored /answers page as structured content: question, short answer, problem frame, and citations. Known slugs (14): how-to-set-pay-ranges, what-should-we-pay-for-a-role, is-our-pay-competitive, how-to-tie-executive-pay-to-performance, executive-compensation-components, how-much-executive-pay-at-risk, business-case-for-changing-rewards, make-financial-case-for-compensation, ….",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "Answer slug from the query map (e.g. how-to-set-pay-ranges).",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "canonicalUrl": {
                "type": "string"
              },
              "categoryTerms": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "citations": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "libraryId": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["title"],
                  "type": "object"
                },
                "type": "array"
              },
              "contentTargets": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "href": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    }
                  },
                  "required": ["href", "label"],
                  "type": "object"
                },
                "type": "array"
              },
              "contract": {
                "type": "string"
              },
              "problemFrame": {
                "type": "string"
              },
              "question": {
                "type": "string"
              },
              "relatedQuestions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "shortAnswer": {
                "type": "string"
              },
              "slug": {
                "type": "string"
              },
              "sources": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "author": {
                      "type": "string"
                    },
                    "libraryId": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["libraryId", "title"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["canonicalUrl", "categoryTerms", "citations", "contentTargets", "contract", "problemFrame", "question", "relatedQuestions", "shortAnswer", "slug", "sources"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
