{
  "lockfileVersion": 2,
  "subjects": {
    "com.ispixelworking/pixel-check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ispixelworking.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ispixelworking",
        "title": "IsPixelWorking",
        "version": "1.1.0",
        "websiteUrl": "https://ispixelworking.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "IsPixelWorking checks whether a web page's ad tracking works: its Meta, TikTok and OpenAI pixels (the Meta Pixel is the former Facebook Pixel), each with its own grade; there is no overall grade. A Chrome browser in the EU opens the page twice: once without touching the cookie banner, and once arriving from an ad (test click IDs) with cookies accepted and the main buttons clicked. It records what the page sends to ad platforms, never forwards it to them, never fills in forms and never buys anything. Other ad platforms it sees on the page (Google Ads, LinkedIn and others) are not graded yet.\n\nTypical use: call check_page with the landing page the ads point to (it waits up to about 40 seconds for the result), read the problems, then call get_fix_guide for each problem with the site's platform. After the site owner deploys a fix, call check_page again with recheck: true (allowed once the previous check is an hour old) to verify it.\n\nA check usually takes 20 to 60 seconds; if check_page returns while it is still running, call get_report with the report id about 20 seconds later. Results of the last 24 hours are reused and cost nothing. New checks are limited per IP address and per day; with an API key from an IsPixelWorking account (header \"Authorization: Bearer ipw_…\") they count against the account's plan, and paid plans also get their monitored pages (list_monitored_pages, recheck_monitored_page, add_monitored_page). Findings describe technical behaviour, not legal compliance.",
      "tools": [
        {
          "name": "check_page",
          "title": "Check a page's ad pixels",
          "description": "Check whether a web page's Meta, TikTok and OpenAI pixels work (the Meta Pixel is the former Facebook Pixel), with a grade for each: cookie consent, duplicate events, event IDs, the ad click IDs (e.g. fbclid -> _fbc) and signs of server-side tracking. A browser in the EU visits the page twice; it never fills in forms, never buys anything and never forwards what the page sends to the ad platforms. The result is kept as a report at an unlisted link for 90 days. Reuses a result from the last 24 hours unless recheck is true. Waits for the result up to wait_seconds (a check takes 20 to 60 seconds); if it is still running, call get_report later.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "recheck": {
                "description": "Start a fresh check instead of reusing a recent result (allowed once the last check is an hour old). Use after a fix was deployed.",
                "type": "boolean"
              },
              "url": {
                "description": "The page to check, usually the landing page the ads point to, e.g. https://example.com/landing",
                "maxLength": 2048,
                "minLength": 3,
                "type": "string"
              },
              "wait_seconds": {
                "description": "How long to wait for the result, 0 to 45 seconds (default 40).",
                "maximum": 45,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3089a0d53fa82512f19367229b862a367c50cc2686e99d2d59aae14179064b1b"
        },
        {
          "name": "get_fix_guide",
          "title": "Get a step-by-step fix guide",
          "description": "Step-by-step guide (Markdown) for fixing a problem the check found, for the site's platform when one exists (otherwise the general version). With consent_tool, returns the guide for wiring the Meta, TikTok and OpenAI pixels to that consent tool instead. Guides exist for: meta.fires_before_consent, meta.not_firing_after_consent, meta.duplicate_pixel, meta.missing_event_id, meta.fbc_not_set, meta.server_copy_without_event_id, meta.server_event_id_mismatch, tiktok.fires_before_consent, tiktok.not_firing_after_consent, tiktok.event_id_reused, tiktok.duplicate_pixel, tiktok.missing_event_id, tiktok.click_id_not_set, tiktok.mobile_cta_tracking_mismatch, tiktok.multiple_pixels, tiktok.server_copy_without_event_id, tiktok.server_event_id_mismatch, openai.fires_before_consent, openai.not_firing_after_consent, openai.event_id_reused, openai.duplicate_pixel, openai.missing_event_id, openai.click_id_not_set, openai.mobile_cta_tracking_mismatch, openai.multiple_pixels, openai.server_copy_without_event_id, openai.server_event_id_mismatch. Setup guides (pass the id as issue_id): general.server_side_not_detected (setting up the Meta Conversions API), tiktok.events_api_setup (setting up the TikTok Events API), openai.pixel_setup (installing the OpenAI Pixel), openai.conversions_api_setup (setting up the OpenAI Conversions API).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "consent_tool": {
                "description": "Consent tool guide: complianz (Complianz), cookiebot (Cookiebot), cookieyes (CookieYes), onetrust (OneTrust), usercentrics (Usercentrics)",
                "enum": ["complianz", "cookiebot", "cookieyes", "onetrust", "usercentrics"],
                "type": "string"
              },
              "issue_id": {
                "description": "Problem id from a report, e.g. meta.fires_before_consent",
                "maxLength": 80,
                "type": "string"
              },
              "platform": {
                "description": "Site platform from the report, e.g. framer, shopify, webflow, wordpress",
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a4feaf4e60a1c2c7c64e6a03bdccc12d91f9876b5acc195f91bb28dfffcf4f0f"
        },
        {
          "name": "get_report",
          "title": "Read a check report",
          "description": "Read the result of a check by its report id or report link (https://ispixelworking.com/r/<id>): status, a grade for each pixel found (Meta, TikTok and OpenAI), problems with explanations and fix guide links, checklist. Reports are kept for 90 days.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "report": {
                "description": "Report id (e.g. Ab3dE5fG7hJ9kL2m) or report link",
                "maxLength": 200,
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["report"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dc6fe313ef4b5f5414f26b72506aeaa6f91dbc14e798ee9ffc03c326e27dd871"
        },
        {
          "name": "list_findings",
          "title": "List the problems a check can find",
          "description": "Every problem (finding) the check can report, with id, severity, title, explanation and whether a fix guide exists.",
