            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["memes"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:bbaf11691b1c47d64ea8f1516b9ca7ca823e304ab11ca82b77a48b491142baf4"
        }
      ],
      "prompts": [
        {
          "name": "make_meme",
          "title": "Make a meme",
          "description": "Make a meme about any topic with a classic template.",
