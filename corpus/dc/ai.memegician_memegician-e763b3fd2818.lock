{
  "lockfileVersion": 2,
  "subjects": {
    "ai.memegician/memegician": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://memegician.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "memegician",
        "title": "Memegician",
        "version": "1.1.0",
        "websiteUrl": "https://memegician.ai"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Memegician makes memes from 400+ classic templates.\nWorkflow: 1) search_meme_templates with the emotion or situation, 2) get_meme_template to read its text slots\n(each slot's label says what goes there, in order), 3) write short, funny captions (2-7 words per slot)\nin the template's traditional format, 4) render_meme. get_trending_meme_templates lists what people search for now.\nWithout an API key, renders carry a small memegician.ai watermark (25/day).\nAll images are classic stock templates with text drawn on them (no AI image generation).\ngenerate_memes returns 6 finished memes with captions written by Memegician; it needs the user's Memegician\naccount and uses 1 of their credits per call.",
      "tools": [
        {
          "name": "generate_memes",
          "title": "Generate memes with AI (uses 1 credit)",
          "description": "Given a situation, picks 6 fitting classic templates, writes captions for them with a language model and returns the 6 finished memes (text drawn on the stock template images, no AI image generation). Each meme is also saved to the user's My Memes. Requires the user's Memegician account and uses 1 credit from it per call.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "situation": {
                "description": "What the memes should be about, e.g. \"my code works on the first try\"",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["situation"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Generate memes with AI (uses 1 credit)"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["memes"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:50a3bed0e2530031c942ce70fe546d9e396f63eb22289cd5e1b93c17b12274b9"
        },
        {
          "name": "get_meme_template",
          "title": "Get a meme template",
          "description": "Get one template's text slots (what each caption should say, in order), description, when to use it and example captions. The slot list is the caption order render_meme expects.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "template_id": {
                "exclusiveMinimum": 0,
                "type": "integer"
              }
            },
            "required": ["template_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a meme template"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["memes"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:683b3143b56ab59b20aca97190299886da068ee288bb1bef950546786c0d4713"
        },
        {
          "name": "get_trending_meme_templates",
          "title": "Trending meme templates",
          "description": "The meme templates with the most US Google searches in the latest month of search data (the result says which month; search data lags 1-2 months), plus the biggest risers. Useful for picking a timely format.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Trending meme templates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["memes"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:bb46a02755116bc37c47ad896b5ab59db6e2260ead867bad7c7aa8687d95bd9e"
        },
        {
          "name": "render_meme",
          "title": "Render a meme",
          "description": "Draw captions onto a classic meme template image (text overlay on the stock template, no AI image generation) and return the finished meme image plus a permanent public URL. Pass one caption per text slot, in slot order (use \"\" to leave a slot empty).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "aspect_ratio": {
                "enum": ["1:1", "3:4", "4:3", "9:16", "16:9"],
                "type": "string"
              },
              "captions": {
                "items": {
                  "maxLength": 200,
                  "type": "string"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "template_id": {
                "exclusiveMinimum": 0,
                "type": "integer"
              }
            },
            "required": ["captions", "template_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Render a meme"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["memes"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:ae08afa9ffc37e865dd731f1feeba9523dc9456ae00c782c194075e07944fe2c"
        },
        {
          "name": "search_meme_templates",
          "title": "Search meme templates",
          "description": "Find meme templates that fit an emotion, situation or name (e.g. \"panic\", \"choosing between two options\", \"drake\"). Returns template ids, names, categories, slot counts and each template's memegician.ai page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
