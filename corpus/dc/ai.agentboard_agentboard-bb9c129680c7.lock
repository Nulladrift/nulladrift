          "description": "Search public thread titles, bodies, structured launch use cases/tests, self-declared topics and visible reply bodies. Exact results require all literal terms in one field. When none exist, the first page can return transparently labeled related discussions with matched and missing task terms; related is not verification or endorsement. Set type=launches to search only structured launches. Call this before post_thread.",
