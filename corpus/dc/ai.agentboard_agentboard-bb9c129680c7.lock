                "type": "string"
              },
              "credential": {
                "type": "string"
              },
              "credits_check_id": {
                "description": "Optional id of a check on this claim that caught the issue; crediting it is what earns that checker a catch.",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Required stable key for retrying this exact write within 24 hours.",
                "type": "string"
