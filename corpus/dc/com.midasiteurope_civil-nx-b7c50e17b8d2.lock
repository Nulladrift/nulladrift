        {
          "name": "pd6694_route_a",
          "title": "PD 6694-1 Route A earth pressures",
          "description": "PD 6694-1 integral abutment earth pressures by the limit-equilibrium route (K*, cl.9.4.3/9.4.4) with the PD 6694-1 Integral Abutment plugin's own engine: thermal movement and design displacement, the route (A1/A2, or B / review when Annex A is needed), applicability checks, coefficients, and the four states EXPMAX/EXPMIN/CONMAX/CONMIN (force, peak pressure, resultant, moment per metre). Needs no model.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "abutment": {
                "additionalProperties": false,
                "properties": {
                  "foundationType": {
                    "description": "Decides the route: footings/bank pads → Route A; piles/embedded walls → Annex A (SSI).",
                    "enum": ["spread_footing", "bank_pad", "single_row_piles", "multi_row_piles", "embedded_wall"]
                  },
                  "group": {
                    "description": "Structure group holding the abutment wall plates.",
                    "type": "string"
                  },
                  "loadedWidth": {
                    "description": "Wall width loaded, m (default 10).",
                    "type": "number"
                  },
                  "retainedHeight": {
                    "description": "H, m (default 6).",
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "abutmentType": {
                "description": "\"frame\" (full-height frame, default), \"bank pad\", \"end screen\" or \"embedded\" (embedded walls are outside the K* method).",
                "type": "string"
              },
              "alphaMicro": {
                "description": "Thermal coefficient ×1e-6 /°C (default 12).",
                "type": "number"
              },
              "expansionLength": {
                "description": "Length to the point of zero movement, m (default 60).",
                "type": "number"
              },
              "gammaBulk": {
                "description": "Backfill bulk unit weight, kN/m³ (default 18; typical 18 to 20).",
                "type": "number"
              },
              "gammaQ": {
                "description": "γQ, cl.9.4.2 partial factor on the thermal movement (default 1, the unfactored case; expected 1 to 1.5).",
                "type": "number"
              },
              "gammaSat": {
                "description": "Backfill saturated unit weight, kN/m³ (default 20; not below gammaBulk).",
                "type": "number"
              },
              "hasWaterTable": {
                "description": "A water table behind the wall (default false); its depth is waterTableDepth.",
                "type": "boolean"
              },
              "nAbutmentsSharing": {
                "description": "Abutments sharing the movement (default 2).",
                "type": "number"
              },
              "override": {
                "description": "Engineer's route override {route, engineer, reason} — only with the user's justification.",
                "type": ["object", "null"]
              },
              "phiCritDeg": {
                "description": "Backfill φ'crit (default 32).",
                "type": "number"
              },
              "phiInferiorDeg": {
                "description": "Inferior φ' for K0,max, degrees (default null = phiCritDeg).",
                "type": ["number", "null"]
              },
              "phiPeakDeg": {
                "description": "Backfill φ'peak (default 35).",
                "type": "number"
              },
              "phiSuperiorDeg": {
                "description": "Superior φ' for K0,min, degrees (default null = phiPeakDeg). Must not be below phiInferiorDeg.",
                "type": ["number", "null"]
              },
              "psi": {
                "description": "ψ, cl.9.4.2 combination factor on the thermal movement (default 1, the unfactored case).",
                "type": "number"
              },
              "skewDeg": {
                "description": "Skew, degrees (default 0). 0 to 30 for the K* method; the SSI route needs a square wall.",
                "type": "number"
              },
              "surchargeKpa": {
                "description": "Surcharge added to σ'v behind the wall at every depth, kPa (default 0).",
                "type": "number"
              },
              "tMax": {
                "description": "Max effective bridge temperature, °C (default 37).",
                "type": "number"
              },
              "tMin": {
                "description": "Min effective bridge temperature, °C (default -2).",
                "type": "number"
              },
              "waterTableDepth": {
                "description": "Water table depth below the retained surface, m (default 2; used only when hasWaterTable).",
                "type": "number"
              }
