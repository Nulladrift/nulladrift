          "digest": "sha256:4a58c60ebd348e7011e2ee713b549367621c42c55c16a3760590ba41fdd8a1a7"
        },
        {
          "name": "cs455_export_calc_sheet",
          "title": "CS 455 calculation sheet (Excel)",
          "description": "The report. Assesses one element end exactly as cs455_assess and writes the plugin's reference-format calculation sheet (.xlsx: A4 pages, title block, geometry, materials, reinforcement, section properties, sagging/hogging bending, shear and torsion with live formulas and charts (for a column, pier or pile: effective heights, N_uz, the governing biaxial bending and shear rows and a table of every row), summary of results, and a Summary sheet with demand, resistance and ratio per check). Returns a download link. Use the same rebar/links that cs455_describe_section confirmed against the user's drawing. Read-only on the model.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "axialSign": {
                "description": "Positive MIDAS axial is tension (-1, default) or compression (1).",
                "enum": [-1, 1]
              },
              "cases": {
                "description": "Load cases / combinations by name (default: every load combination the model has).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "classification": {
                "description": "RC only in these tools.",
                "enum": ["RC"]
              },
              "concreteModel": {
                "description": "Figure 3.4.1 curve (default) or the constant 0.6 fcu/γmc block of cl 5.1(3).",
                "enum": ["parabolic", "rectangular"]
              },
              "concreteParts": {
                "description": "Composite sections: { part id: f_cu } where a part's grade differs (describe lists the parts).",
                "type": "object"
              },
              "confirmDimensions": {
                "description": "Only after the user has compared the drawn section with the drawing: needed when CIVIL NX published no properties to check the outline against.",
                "type": "boolean"
              },
              "drawingReference": {
                "type": "string"
              },
              "element": {
                "type": "integer"
              },
              "end": {
                "enum": ["I", "J"]
              },
              "fcu": {
                "description": "Concrete cube strength, MPa (default: from the model's EN grade C../.. — its cube value).",
                "type": "number"
              },
              "fy": {
                "description": "Reinforcement yield strength, MPa (default 500).",
                "type": "number"
              },
              "image": {
                "description": "cs455_describe_section only: return the drawing of the section with its bars (default true).",
                "type": "boolean"
              },
              "links": {
                "additionalProperties": false,
                "description": "Links (omit for concrete-only shear, cl 5.6). Used by shear and by torsion.",
                "properties": {
                  "dia": {
                    "description": "mm, or inches '0.5in', or US '#4' (default 12)",
                    "type": ["number", "string"]
                  },
                  "fyv": {
                    "type": "number"
                  },
                  "legs": {
                    "type": "integer"
                  },
                  "spacing": {
                    "description": "mm along the member",
                    "type": "number"
                  }
                },
                "required": ["spacing"],
                "type": "object"
              },
              "location": {
                "enum": ["support", "midspan", "quarter", "other"]
              },
              "maxRows": {
                "description": "Stop above this many force rows (default 1000).",
                "type": "integer"
              },
              "member": {
                "additionalProperties": false,
                "description": "Assess as a column, pier or pile to CS 455 Section 7 instead of a beam (the plugin's Sections tab > Member). The effective height about each axis is a Table 7.2 case (1: both ends held in position and rotation 0.7; 2: top in position only, bottom fixed 0.85; 3: both ends in position only 1.0; 4: bottom fixed, top unrestrained, racked rollers 1.3; 5: bottom fixed, top unrestrained 1.4; 6: bottom fixed, top restrained in rotation only 1.5; 7: cantilever, top free 2.3) or your own factor k (l_e = k l_o). Give links: their diameter and spacing decide whether the compression bars count (7.6). A pile is assessed as a column with no soil restraint: give k for its depth to fixity. Omit for a beam.",
                "properties": {
                  "caseY": {
                    "description": "Table 7.2 case about the y axis (bending My); 0 = use kY. Default 3.",
                    "enum": [0, 1, 2, 3, 4, 5, 6, 7],
                    "type": "integer"
                  },
                  "caseZ": {
                    "description": "Table 7.2 case about the z axis (bending Mz); 0 = use kZ. Default 3.",
                    "enum": [0, 1, 2, 3, 4, 5, 6, 7],
                    "type": "integer"
                  },
                  "kY": {
                    "description": "Effective height factor about y (used when caseY is 0 or omitted with kY given).",
                    "type": "number"
                  },
                  "kZ": {
                    "description": "Effective height factor about z.",
                    "type": "number"
                  },
                  "length": {
                    "description": "Length between restraints l_o, metres.",
                    "type": "number"
                  },
                  "type": {
                    "enum": ["beam", "column", "pier", "pile"]
                  }
                },
                "required": ["type"],
                "type": "object"
              },
              "momentSign": {
                "description": "Positive MIDAS My is sagging (1, default) or hogging (-1).",
                "enum": [1, -1]
              },
              "rebar": {
                "additionalProperties": false,
                "description": "The bar schedule, as the plugin's Reinforcement tab: cover (mm to the bar face, default 50), gap (mm between layers, default max(25, Ø)), rows [{face: bottom|top|side|depth, layer (any whole number, 1 = outermost), count ('8' bars or '@150' spacing), dia (mm, or '1.128in', or '#9'), depth (mm below top, face 'depth' only), span ('±430:900' width limits), from/to/which (side bars)}], coords {datum: bc|bl|tc, text: 'y z dia' per line, mm}.",
                "properties": {
                  "coords": {
                    "additionalProperties": false,
                    "properties": {
                      "datum": {
                        "enum": ["bc", "bl", "tc"]
                      },
                      "text": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "cover": {
                    "type": "number"
                  },
                  "gap": {
                    "type": ["number", "string"]
                  },
                  "rows": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "count": {
                          "description": "8 (bars) or '@150' (spacing, mm)",
                          "type": ["string", "integer"]
                        },
                        "depth": {
                          "type": ["number", "string"]
                        },
                        "dia": {
                          "description": "Bar diameter: mm (32, 28.6), inches ('1.128in', '1 1/8\"') or a US bar number ('#9').",
                          "type": ["number", "string"]
                        },
                        "face": {
                          "enum": ["bottom", "top", "side", "depth"]
                        },
                        "from": {
                          "type": ["number", "string"]
                        },
                        "layer": {
                          "type": "integer"
                        },
                        "span": {
                          "type": "string"
                        },
                        "to": {
                          "type": ["number", "string"]
                        },
                        "which": {
                          "enum": ["both", "left", "right"]
                        }
                      },
                      "required": ["count", "dia", "face"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "report": {
                "additionalProperties": false,
                "properties": {
                  "checkedBy": {
                    "type": "string"
                  },
                  "client": {
                    "type": "string"
                  },
                  "date": {
                    "type": "string"
                  },
                  "preparedBy": {
                    "type": "string"
                  },
                  "project": {
                    "type": "string"
                  },
                  "projectNo": {
                    "type": "string"
                  },
                  "reference": {
                    "type": "string"
                  },
                  "revision": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "restrained": {
                "description": "Compression bars are restrained by links (cl 5.3.1). Default false: compression bars get no compressive strength (cl 5.3.2(1)), conservative.",
                "type": "boolean"
              },
              "secondaryActions": {
                "description": "Vy / T / Mz: assess N–My–Vz and list them (default), or refuse rows where they are non-zero.",
                "enum": ["report", "block"]
              },
              "sectionId": {
                "description": "The CIVIL NX section id (a beam section).",
                "type": ["integer", "string"]
              },
              "shear": {
                "description": "Run the shear check (default true).",
                "type": "boolean"
              },
              "stations": {
                "description": "Element ends to assess (default: the section's first element, both ends, midspan). Location 'support' removes the shear enhancement near supports.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "element": {
                      "type": "integer"
                    },
                    "end": {
                      "enum": ["I", "J", "IJ"]
                    },
                    "location": {
                      "enum": ["support", "midspan", "quarter", "other"]
                    }
                  },
                  "required": ["element"],
                  "type": "object"
                },
                "type": "array"
              },
              "tensionOrigin": {
                "enum": ["externally applied axial tension", "restraint-induced tension"]
              },
              "torsion": {
                "description": "Torsion check, CS 455 cl 5.17–5.27, on rows that carry a torque (default true, as in the plugin).",
                "type": "boolean"
              }
            },
            "required": ["element", "rebar", "sectionId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b82224dc7018f9f067bf0656a8c86e442005308f091b275d665427df2024c2d0"
