                "default": 10,
                "description": "An element longer or shorter than the median length by this factor is an outlier.",
                "exclusiveMinimum": 1,
                "type": "number"
              },
              "toleranceMm": {
                "default": 1,
                "description": "Nodes closer than this (mm, 3D) count as coincident.",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
