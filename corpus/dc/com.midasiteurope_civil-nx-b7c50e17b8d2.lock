        {
          "name": "midas_docs_search",
          "title": "Search the MIDAS manuals",
          "description": "Searches the MIDAS help centre (support.midasuser.com), live: the CIVIL NX and GEN NX online help (every dialog: what it does, where it is in the menus, each input), the MIDAS API (MAPI) JSON manual (every db/ table, its URI, methods, JSON schema and examples), FAQ, tutorials and release notes. Use it to answer how-to and what-does-this-input-mean questions, to check CIVIL NX behaviour before advising, and to find the JSON shape of a MAPI table. English articles. Returns the matching articles (id, title, area, section, snippet, link); read one in full with midas_docs_read. Areas default to CIVIL NX help + API manual + FAQ + tutorials. Needs no model and no account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "areas": {
                "description": "Where to search: civil (CIVIL NX online help), gen (GEN NX online help), api (MIDAS API (MAPI) JSON manual), faq (FAQ), tutorials (Tutorials), updates (Product updates / release notes), cim (CIM online help), excel (Excel Connector), grasshopper (Grasshopper API), or all. Default: civil, api, faq, tutorials.",
                "items": {
                  "enum": ["civil", "gen", "api", "faq", "tutorials", "updates", "cim", "excel", "grasshopper", "all"],
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "default": 8,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, in the manual's own words where possible, e.g. \"composite section for construction stage\", \"moving load optimization\", \"db/STAG\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
