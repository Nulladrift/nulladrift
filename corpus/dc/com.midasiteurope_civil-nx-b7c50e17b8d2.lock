        {
          "name": "ec_wind_apply",
          "title": "Write bridge wind loads (Wind Load Calculator)",
          "description": "Calculates wind on the deck (EN 1991-1-4 §8, or CS 454 Appendix D with code: CS454) and writes it with the Wind Load Calculator plugin's adapter: one load case per global direction (EC1W_ for EN, C454W_ for CS 454), then beam loads (beam deck) or a pressure + fascia nodal loads (plate deck) on the target elements — one element written and read back first, then the rest, with a direction audit. Target: elementIds, a structure group, or (neither) the deck the plugin finds itself. Previews unless apply: true.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "acknowledgeOutOfScope": {
                "default": false,
                "description": "Only with the user's agreement: apply the code to a form it does not cover.",
                "type": "boolean"
              },
              "acknowledgeUnverifiedAnnex": {
                "default": false,
                "type": "boolean"
              },
              "apply": {
                "default": false,
                "type": "boolean"
              },
              "bridge": {
                "additionalProperties": true,
                "description": "Deck inputs, metres. Omitted geometry is measured from the model (ec_wind_apply) — ec_wind_bridge needs b, d, L and groundToSoffit.",
                "properties": {
                  "L": {
                    "description": "Span / loaded length.",
                    "type": "number"
                  },
                  "b": {
                    "description": "Deck width b.",
                    "type": "number"
                  },
                  "d": {
                    "description": "Deck depth d (§8.3.1 Figure 8.5).",
                    "type": "number"
                  },
                  "d1": {
                    "description": "Parapet / barrier height above the deck (m).",
                    "type": ["number", "null"]
                  },
                  "groundToSoffit": {
                    "description": "Height of the soffit above ground (for z_e).",
                    "type": "number"
                  },
                  "inclinationDeg": {
                    "type": "number"
                  },
                  "method": {
                    "description": "general (default) or the simplified route the plugin offers.",
                    "type": "string"
                  },
                  "restraint": {
                    "description": "Table 8.1 parapet/barrier case (plugin values, default none).",
                    "type": "string"
                  },
                  "sides": {
                    "description": "Parapets on one or both sides (one|both).",
                    "type": "string"
                  },
                  "structuralForm": {
                    "description": "normal (beam-and-slab / plate girder, default), box, slab, uDeck (half-through), portal (portal / box culvert / integral), truss, arch, cableStayed, suspension… — forms the chosen code does not cover need acknowledgeOutOfScope.",
                    "type": "string"
                  },
                  "traffic": {
                    "description": "Traffic on the deck (none, road, rail). EN: the §8.3.1(5) case (higher of the barrier and the 2 m vehicle / 4 m train band). CS 454: the live-load case (d_L 2.5 m highway, 3.7 m rail, 1.25 m foot).",
                    "type": "string"
                  },
                  "trafficLength": {
                    "description": "EN §8.3.1(5), road only: {mode: \"whole\"} (default) or {mode: \"ranges\", text: \"0-20, 45-60\"} — the loaded length(s) carrying traffic, in m along the span.",
                    "properties": {
                      "mode": {
                        "enum": ["whole", "ranges"]
                      },
                      "text": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "transverseSlopeDeg": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "cdir": {
                "type": "number"
              },
              "co": {
                "description": "Orography factor c_o (default 1).",
                "type": "number"
              },
              "code": {
                "default": "EN",
                "description": "Design code: EN = EN 1991-1-4 §8 (with nationalAnnex); CS454 = CS 454 Rev 0 Appendix D (UK assessment), which ignores the EN climate inputs and uses cs454 instead. CS 454 loads are written nominal as C454W_ cases.",
                "enum": ["EN", "CS454"]
              },
              "confirmPlanHash": {
                "type": "string"
              },
              "cs454": {
                "additionalProperties": false,
                "description": "CS 454 Appendix D inputs (code: CS454). The deck geometry stays in bridge.",
                "properties": {
                  "altitude": {
                    "description": "Site altitude Δ, m (Sa).",
                    "type": "number"
                  },
                  "cd": {
                    "description": "Override C_D (else Figure D.6).",
                    "type": ["number", "null"]
                  },
                  "directionDeg": {
                    "description": "Wind direction from north for Sd; omit = unknown (Sd 1.0).",
                    "type": ["number", "null"]
                  },
                  "height": {
                    "description": "Height H above ground; default soffit + half the depth.",
                    "type": ["number", "null"]
                  },
                  "loadedLength": {
                    "description": "Horizontal wind loaded length; default L.",
                    "type": ["number", "null"]
                  },
                  "method": {
                    "default": "full",
                    "description": "full = Appendix D; simplified = cl 5.33.1 6 kN/m² (highway, slab / beam-and-slab, L ≤ 20 m, b ≥ 10 m).",
                    "enum": ["full", "simplified"]
                  },
                  "minBeams": {
                    "description": "Deck on I sections with more than 4 beams, or box girders: C_D at least 1.3. Tick it for PSC I and steel I girder decks.",
                    "type": "boolean"
                  },
                  "parapetCd": {
                    "description": "Parapet C_D (Table D.15).",
                    "type": ["number", "null"]
                  },
                  "parapetCount": {
                    "type": ["number", "null"]
                  },
                  "parapetLong": {
                    "description": "Table D.17 parapet type for the longitudinal share (infill default).",
                    "type": "string"
                  },
                  "parapetSolid": {
                    "description": "Solid depth per parapet, m (Table D.10).",
                    "type": ["number", "null"]
                  },
                  "returnPeriod": {
                    "default": 120,
                    "description": "Return period T, years (Sp).",
                    "type": "number"
                  },
                  "seaKm": {
                    "description": "Distance from the sea, km (Table D.4 / D.5).",
                    "type": "number"
                  },
                  "sh": {
                    "default": 1,
                    "description": "Topography factor S'h.",
                    "type": "number"
                  },
                  "superelevationDeg": {
                    "type": "number"
                  },
                  "town": {
                    "description": "Site in town (Tg / Tc).",
                    "type": "boolean"
                  },
                  "townKm": {
                    "description": "Distance into town, km.",
                    "type": "number"
                  },
                  "trussDt": {
                    "type": ["number", "null"]
                  },
                  "trussMembers": {
                    "description": "flat (default) or round truss members (Tables D.13 / D.14).",
                    "type": "string"
                  },
                  "use": {
                    "default": "highway",
                    "enum": ["highway", "rail", "foot"]
                  },
                  "vb": {
                    "description": "Basic mean hourly wind speed Vb (Figure D.1), m/s.",
                    "type": "number"
                  },
                  "windInclinationDeg": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "cscdOverride": {
                "type": ["number", "null"]
              },
              "cseason": {
                "type": "number"
              },
              "directions": {
                "additionalProperties": {
                  "type": "boolean"
                },
                "description": "Global load directions to write, e.g. {\"Z-\": false}. Default: all six (X±, Y±, Z±).",
                "type": "object"
              },
              "elementIds": {
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "group": {
                "type": "string"
              },
              "lineOfAction": {
                "default": "aref",
                "description": "Transverse wind at mid-height of d_tot (aref) or at the section centroids.",
                "enum": ["aref", "centroid"]
              },
              "nationalAnnex": {
                "description": "EN only. Built-in annex id; default CEN.",
                "type": "string"
              },
              "returnPeriodYears": {
                "description": "Default 50.",
                "type": "number"
              },
              "terrainCategory": {
                "description": "0, I, II (default), III or IV.",
                "type": "string"
              },
              "vb0": {
                "description": "Fundamental basic wind velocity v_b,0, m/s (CEN has no map).",
                "type": "number"
              },
              "zEccentric": {
                "default": true,
                "description": "EN §8.3.3(5): place the vertical force at e = ±b/4. CS 454 always loads at the centroid.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:cf7acd3b3062b68dba8c4a233a7c854e4ddcc2680db0d7cace65ecfd297772c3"
