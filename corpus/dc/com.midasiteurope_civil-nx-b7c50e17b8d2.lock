                  "type": "string"
                },
                "type": "array"
              },
              "sheetName": {
                "description": "Excel sheet name (≤ 31 characters).",
                "type": "string"
              },
              "stageSteps": {
                "description": "With constructionStage: e.g. [\"CS1:001(first)\", \"CS3:002(last)\"]. Omit for every saved step.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "table": {
                "description": "Table id from result_table_catalog (e.g. reaction-global, beam-force, displacement-global, plate-force-unit-local, db-node). A MIDAS TABLE_TYPE (BEAMFORCE) or DB key (NODE) is accepted too.",
                "type": "string"
              },
              "tableType": {
                "description": "For result-any: the MIDAS TABLE_TYPE.",
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "units": {
                "additionalProperties": false,
