        {
          "name": "bridge_thermal_apply",
          "title": "Write bridge temperature loads (Bridge Thermal Loads)",
          "description": "Calculates the temperature actions for the deck and writes them with the Bridge Thermal Loads plugin's writer: EC1T_Uniform_Exp/_Con (type T, element or system temperature), EC1T_Diff_Heat/_Cool (type TPG: beam section temperature bands, or a linear gradient for Approach 1 and plates), and optionally EC1T_Bearing_* and EC1T_Comb_Max/_Min (USER). Temperatures are converted to the model's unit; the model is re-checked before writing, an undo record is kept before the first change, and every row is read back. Previews unless apply: true.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "T0": {
                "additionalProperties": false,
                "description": "Initial (restraint) temperature, °C. Default: the code's value where it gives one.",
