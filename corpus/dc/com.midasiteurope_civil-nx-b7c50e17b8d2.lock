        {
          "name": "create_nodes",
          "title": "Node Generator — create nodes",
          "description": "Creates nodes in the open CIVIL NX model from X, Y, Z coordinates with the Node Generator plugin's own engine: every check the plugin window makes (blank or non-numeric coordinates, bad or duplicate ids, ids above 999999, ids that already exist, coincident nodes within a tolerance), its numbering modes and its write rules. Give the points as nodes [{id?, x, y, z}] or as table (text pasted from Excel or a CSV; a header like ID,X,Y,Z is recognised, decimal commas and semicolon CSVs too). Coordinates are in inputUnit (m or mm) plus an optional origin offset, and are converted to the model's length unit. numbering: 'auto' continues after the highest existing node id; 'start' uses start + increment; 'column' keeps the ids given (default when every row has one). An id that already exists blocks the write unless overwrite: true, which MOVES those nodes (and the elements on them). Coincident nodes are reported first; choose coincident: 'skip' or 'create'. Previews unless apply: true with confirmPlanHash; new nodes go by POST (create-only, so a node made since the preview is never overwritten), overwrites by PUT, then db/NODE is read back. create_nodes_undo reverses it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "apply": {
                "default": false,
                "description": "Write to CIVIL NX. Only after the user approved the preview.",
                "type": "boolean"
              },
              "coincident": {
                "default": "report",
                "description": "report = preview only; skip = leave coincident rows out; create = create them anyway.",
                "enum": ["report", "skip", "create"]
              },
              "confirmPlanHash": {
                "description": "planHash from the approved preview; the write is refused if the plan differs.",
                "type": "string"
              },
              "decimal": {
                "description": "Decimal mark in table text; AUTO detects it.",
                "enum": ["AUTO", "POINT", "COMMA"]
              },
              "increment": {
                "description": "numbering 'start': step between ids.",
                "minimum": 1,
                "type": "integer"
              },
              "inputUnit": {
                "default": "M",
                "description": "Unit of the coordinates, the origin offset and the tolerance.",
                "enum": ["M", "MM"]
              },
              "nodes": {
                "description": "Points: {x, y, z} or {id, x, y, z}; [x, y, z] and [id, x, y, z] arrays also work.",
                "items": {
                  "anyOf": [
                    {
                      "additionalProperties": false,
                      "properties": {
                        "id": {
                          "type": ["integer", "string"]
                        },
                        "x": {
                          "type": ["number", "string"]
                        },
                        "y": {
                          "type": ["number", "string"]
                        },
                        "z": {
                          "type": ["number", "string"]
                        }
                      },
                      "type": "object"
                    },
                    {
                      "items": {
                        "type": ["number", "string"]
                      },
                      "type": "array"
                    }
                  ]
                },
                "type": "array"
              },
              "numbering": {
                "enum": ["auto", "start", "column"]
              },
              "origin": {
                "additionalProperties": false,
                "description": "Added to every coordinate (input unit).",
                "properties": {
                  "x": {
                    "type": ["number", "string"]
                  },
                  "y": {
                    "type": ["number", "string"]
                  },
                  "z": {
                    "type": ["number", "string"]
                  }
                },
                "type": "object"
              },
              "overwrite": {
                "default": false,
                "description": "Move existing nodes whose id is in the input to the new coordinates. Only with the user's agreement.",
                "type": "boolean"
              },
              "start": {
                "description": "numbering 'start': first id.",
                "minimum": 1,
                "type": "integer"
              },
              "table": {
                "description": "Instead of nodes: tab-, comma- or semicolon-separated text, one node per line (ID, X, Y, Z or X, Y, Z), optional header row.",
                "type": "string"
              },
              "tolerance": {
                "default": 0.001,
                "description": "Coincidence tolerance, input unit.",
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
