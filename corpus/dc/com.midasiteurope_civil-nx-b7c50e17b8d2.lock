      "instructions": "Tools that build, check and report on a MIDAS CIVIL NX model through the engines of the MIDAS IT Europe plugins. Each tool runs the same code as its plugin, so the plugin's rules and checks — verified against live CIVIL NX — apply.\n\nHow to work:\n- Start with civil_status: it confirms CIVIL NX is connected and summarises the open model (units, groups, load cases, stages). Read only what you need with the read tools before proposing inputs.\n- Tools of kind \"calc\" need no model; \"read\" tools only read it; \"write\" tools change it; \"job\" tools may run long.\n- On the website, every apply (and every long job) runs in the background: the call returns { jobId, status: \"queued\" } at once. Poll job_status with that jobId every few seconds until status is \"done\" (the tool's result is in result) or \"failed\" (the reason is in error). Do not call the apply again while it runs.\n- Every write tool previews by default (apply omitted or false) and writes nothing. Show the user the preview, get their go-ahead, then call again with the same inputs, apply: true and confirmPlanHash set to the preview's planHash. If the model changed in between, the apply refuses rather than writing something the user did not see.\n- Never set options marked DESTRUCTIVE (replaceExisting, codeChange, unitSwitch, …) without the user agreeing to what the preview says they do.\n- Every apply is recorded; the matching *_undo tool reverses it. Undo in reverse order (later work before the model it sits on).\n- On the website, tools that read or write the model need the user's personal token from midasiteurope.com/llm (a free account); calculation tools work without one. There is no limit on how many writes an account may apply.\n- Files (IFC, DXF, XLSX, PDF) come back as a download link, never inline.\n- A sketch or photo of a cross-section becomes a CIVIL NX section through Section Designer: section_preview (look at the drawing it returns and compare it with the sketch; ask about any dimension the sketch does not give) → section_properties → section_write.\n- New spans, support skews, a new alignment or new deck levels for a bridge model that already exists go through Bridge Reshaper: bridge_reshape_read → bridge_reshape (look at the plan drawing it returns: grey as it is, blue proposed) → apply with the user's go-ahead → bridge_reshape_undo if needed.\n- Which load cases make up a combination's result: combination_tree → combination_contributions (every item is checked against CIVIL NX's own value).\n- Prestressing tendons for a concrete girder go through Tendon Designer: tendon_design designs new tendons, or reads the model's own (mode improve) and checks them to EN 1992-1-1; go through any failed check with the user (autoResolve tries the smallest change that clears it) and confirm a concrete grade it says was not read. Then tendon_write (preview, then apply; name the construction stage each tendon group is stressed in when the model has stages) and tendon_write_undo.\n- An EN 1992 (Eurocode) check of concrete beam, column, pier or pile sections — reinforced, or prestressed / precast girder + deck slab — goes through the Eurocode Section Checker: ec2_describe_section (look at the drawing it returns with the bars and tendons placed and compare it with the user's drawing; ask about cover, links or anything the drawing does not show) → ec2_section_check → ec2_export_calc_sheet for the Excel calculation sheet. For a prestressed section, agree with the user which load cases are the girder self-weight and which act on the precast girder alone (stages). CS 455 assessments go through the cs455_* tools instead.\n- For how-to questions, what a CIVIL NX input means, or the JSON of a MIDAS API table, search the MIDAS manuals with midas_docs_search and read the article with midas_docs_read before answering from memory; give the user the article's link.\n- Supports, point springs, beam end releases, self-weight, nodal loads, beam UDLs, plate pressures and element temperatures go through civil_loads_supports in ONE call: name where (structure group, id ranges, a line, a box, a coordinate, pick xmin/xmax for girder ends) and what, in kN and m — no table lookup, no reading nodes or elements, no rows. Check the totals per load case in its preview with the user. Hand-picked combinations (\"ULS = 1.35 SW + 1.5 LL\"): civil_combinations_quick. Taking loads, supports or load cases out: civil_remove_loads (it keeps the other cases' loads on the same elements).\n- When no tool fits a model change, use civil_write_tables rather than telling the user it cannot be done; never try to drive the CIVIL NX window instead.\n- Prefer a plugin tool where one does the job. For anything else — building a model from scratch, or a change no plugin makes — use civil_write_tables: look up each table's fields in the API manual first (midas_docs_read) and valid names in midas_library (material standards and grades, section shapes and their dimension order, element and support rows), write in dependency order (materials and sections, nodes, elements, supports, load cases, loads), preview, and apply only with the user's go-ahead. Then civil_save_model (a new model needs a path) and civil_run_analysis before reading results.",
      "tools": [
        {
          "name": "auto_structure_groups",
          "title": "Auto Structure Groups",
          "description": "Creates one structure group per section, per material, or per section + material pair, with the Auto Structure Groups plugin's own engine: it reads every element's section and material, names each group from the prefix and the section/material names (cleaned and cut to 40 characters, as in the plugin; elements with no section/material go to <prefix>UNASSIGNED), largest group first. Optional: include each group's nodes, skip groups with fewer than minElements elements, or write only the groups named in groups. A name that already exists is skipped unless existing: 'overwrite' — and then this run's members are ADDED to that group (CIVIL NX merges a write into an existing group; it never removes members). Previews unless apply: true with confirmPlanHash; the plugin's writer re-reads db/GRUP, writes in batches and checks the read-back. auto_structure_groups_undo reverses it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "apply": {
                "default": false,
                "description": "Write to CIVIL NX. Only after the user approved the preview.",
                "type": "boolean"
              },
              "confirmPlanHash": {
                "description": "planHash from the approved preview; the write is refused if the plan differs.",
                "type": "string"
              },
              "existing": {
                "default": "skip",
                "description": "A proposed name that already exists: leave that group alone, or add this run's members to it.",
                "enum": ["skip", "overwrite"]
              },
              "groups": {
                "description": "Write only these proposed groups (names from the preview); default all.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "includeNodes": {
                "default": false,
                "description": "Also put each group's element nodes in the group.",
                "type": "boolean"
              },
              "minElements": {
                "description": "Skip groups with fewer elements than this (2 or more turns the filter on).",
                "minimum": 0,
                "type": "integer"
              },
              "mode": {
                "default": "section",
                "description": "What one group holds: one section, one section + material pair, or one material.",
                "enum": ["section", "section_material", "material"]
              },
              "prefix": {
                "default": "SG_",
                "description": "Put in front of every group name.",
                "type": "string"
              }
            },
            "type": "object"
          },
