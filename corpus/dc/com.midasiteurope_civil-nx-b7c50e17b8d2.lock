                },
                "type": "object"
              },
              "suffix": {
                "description": "Write a named set: every case name gets this suffix (letters, digits, _ or -, at most 12), e.g. _2.",
                "type": "string"
              },
              "surfacing": {
                "additionalProperties": false,
                "properties": {
                  "mm": {
