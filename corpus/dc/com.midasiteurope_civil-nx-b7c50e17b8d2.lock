                    "type": "number"
                  },
                  "mode": {
                    "default": "mm",
                    "enum": ["unsurfaced", "waterproofed", "mm", "ballast"]
                  }
                },
                "type": "object"
              },
              "trussReduction": {
                "default": false,
                "description": "Steel truss / plate girder reduction where the code gives one.",
                "type": "boolean"
              },
              "useSelection": {
                "description": "Use the elements selected in CIVIL NX (when neither group nor elementIds is given).",
                "type": "boolean"
              },
              "wholeModelUniform": {
                "default": false,
