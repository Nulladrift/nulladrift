                "default": false,
                "type": "boolean"
              },
              "code": {
                "default": "EN1991-1-5_2003_UKNA",
                "description": "EN 1991-1-5 with the UK NA (default) or the CEN values, CS 454, BS 5400-2:2006 or the legacy BS 5400-2:1978.",
                "enum": ["EN1991-1-5_2003_UKNA", "EN1991-1-5_2003_CEN", "CS454", "BS5400-2_2006", "BS5400-2_1978"]
              },
              "confirmPlanHash": {
                "type": "string"
              },
              "elementDifferences": {
                "default": false,
                "type": "boolean"
              },
              "elementIds": {
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "group": {
                "description": "Structure group holding the deck elements.",
                "type": "string"
              },
              "loads": {
                "additionalProperties": false,
                "description": "Load types to generate (each gives two cases). Default: uniform and difference.",
                "properties": {
                  "bearing": {
                    "default": false,
                    "description": "Bearing / joint ranges (USER cases, not for structural combinations).",
                    "type": "boolean"
                  },
                  "combined": {
                    "default": false,
                    "description": "CS 454 / BS 5400-2:2006 combined X − Y distributions (EC1T_Comb_*, used INSTEAD of Uniform + Difference).",
                    "type": "boolean"
                  },
                  "difference": {
                    "default": true,
                    "type": "boolean"
                  },
                  "uniform": {
                    "default": true,
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "material": {
                "additionalProperties": false,
                "description": "Band material: element (default, the model's E and α) or input (the code's α with E given here, in the model's force/length² units).",
