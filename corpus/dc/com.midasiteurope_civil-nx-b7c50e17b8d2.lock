        },
        {
          "name": "combination_contributions",
          "title": "Which load cases make up a combination's result",
          "description": "Load Combination Contribution Analyzer, step 2. Splits one or more load combinations' results at a set of items into the load cases that produced them: for every item, output point (beam I/J and intermediate points, plate nodes and centre), component and max/min, the signed contribution of each case, its share of the gross, and the governing permutation written out with factors multiplied down (e.g. 1.35*Self weight(ST) + 1.5*LM1(MV:max)). Add superposes; an Envelope is resolved to the child that governs at each item (the governing child is counted per envelope); ABS gives |f·R| shares; SRSS energy shares. Moving-load, settlement and response-spectrum cases enter at their max or min end. Construction-stage cases are read at the final stage's last step. Cases are identified by type and name together. EVERY item is recomposed and must match the value CIVIL NX reports for the combination at the same item, part, component and sense — if any does not, the run stops and nothing is reported. Returns per combination: the cases ranked by share of the gross over the run, cases zero everywhere, envelope governing counts, and the critical item (largest |value|) per component and sense with its full breakdown; rows largest |value| first; csv: true stores every row. Tables: BEAM, TRUSS, PLATE (per unit length, local axes), ELASTICLINK, GENLINK, REACTION (supported nodes only — CIVIL NX answers other nodes with a made-up total; zero reaction rows it omits are read as zero), DISPLACEMENT. Items in set syntax (elements 101to148, nodes N1toN20, general links L5, elastic links EL7) and/or structure groups (for node tables: the group's nodes plus the nodes of its elements). Read-only (only /post/TABLE reads). Runs as a job on the website.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "combinations": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 10,
                    "minItems": 1,
                    "type": "array"
                  }
                ],
                "description": "One General-tab combination name, or up to 10 decomposed at the same items in the same run."
              },
              "components": {
                "description": "Components to decompose (table column names, e.g. Moment-y, Shear-z, FZ, DZ, Mxx). Default: all of the table's.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "csv": {
                "default": false,
                "description": "Also store every row with every case's contribution as a CSV and return its link.",
                "type": "boolean"
              },
              "groups": {
                "description": "Structure group names to add to the set.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "items": {
                "description": "Items in set syntax, e.g. \"101to148\", \"N9001toN9006\", \"EL1toEL10\". Typed ids must exist and be of the table's kind; ranges keep only what fits.",
                "type": "string"
              },
              "maxRows": {
                "default": 50,
                "description": "At most this many rows inline (largest |value| first).",
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "sense": {
                "default": "both",
                "description": "For max/min-pair combinations: which end(s). Ignored for single-valued ones.",
                "enum": ["max", "min", "both"],
                "type": "string"
              },
              "table": {
                "description": "Which result table to decompose.",
                "enum": ["BEAM", "TRUSS", "PLATE", "ELASTICLINK", "GENLINK", "REACTION", "DISPLACEMENT"],
                "type": "string"
              },
              "units": {
                "additionalProperties": false,
                "description": "Units to report in (CIVIL NX converts). Default: the model's own.",
                "properties": {
                  "force": {
                    "enum": ["N", "kN", "kgf", "tonf", "lbf", "kips"],
                    "type": "string"
                  },
                  "length": {
                    "enum": ["mm", "cm", "m", "in", "ft"],
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["combinations", "table"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:67d01bc612c98e5d303d7c8f05440f3b195f861bb631a6954f63a5b40e0c2ece"
        },
        {
          "name": "combination_tree",
          "title": "Combinations: list them, or show one's tree",
          "description": "Load Combination Contribution Analyzer, step 1. Without name: lists the model's General-tab load combinations (LCOM-GEN) with type (ADD, ENVELOPE, ABS, SRSS), constituent count, whether it is a max/min pair, and whether it can be decomposed (refused: time-history, unknown analysis type, undefined constituents, self-reference, a constituent whose type differs from the case of that name) — plus the result tables the model has items for (BEAM, TRUSS, PLATE, ELASTICLINK, GENLINK, REACTION, DISPLACEMENT) with their components and units, structure groups, construction stages and the model's units. With name: that combination's full tree (nested combinations, factors, kinds), the effective factor of every load case over all Add paths (a case reached down several branches gets the sum of the path products), and the envelopes / ABS / SRSS inside it. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 300,
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "A combination to show in full. Omit to list them all.",
                "type": "string"
              },
              "search": {
                "description": "Only combinations whose name contains this (case-insensitive).",
                "type": "string"
              },
              "units": {
                "additionalProperties": false,
                "description": "Units to report in (CIVIL NX converts). Default: the model's own.",
                "properties": {
                  "force": {
                    "enum": ["N", "kN", "kgf", "tonf", "lbf", "kips"],
                    "type": "string"
                  },
                  "length": {
                    "enum": ["mm", "cm", "m", "in", "ft"],
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8ef3b1362e40a7185d1998406b0127854f5dbab927a740decc7aa37d8c99f6b6"
        },
        {
          "name": "concurrent_forces",
          "title": "Concurrent forces at the governing state",
          "description": "Concurrent Force Reporter, step 2. For a set of items (elements, nodes, links), finds the load state that makes ONE key effect extreme at ONE key item (max, min or absolute max over the selected load cases and combinations, at every output point), then reports every item's results IN THAT SAME STATE — the coexistent forces a bearing, pier cap or connection check needs, not each item's own envelope. If the governing load is an envelope (or an Add containing one), it is resolved recursively to a single deterministic state (a weighted sum of static/stage cases, pinning each envelope to the child that governs at the key item), re-read at that state, and gated against the value MIDAS itself reports; it refuses rather than approximates. Near-ties are reported. Items: items in set syntax — elements 12 or 15to20, nodes N12, general links L12, elastic links EL12 (a range keeps only ids that exist) — and/or structure groups. keyItem must be in the set. Values come back in the units asked for (default the model's); plate results are per unit length. Read-only (only /post/TABLE result reads). Call concurrent_forces_setup first for names and keyEffect ids. Runs as a job on the website.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "criterion": {
                "default": "max",
                "enum": ["max", "min", "absmax"],
                "type": "string"
              },
              "csv": {
                "default": false,
                "description": "Also store the full table (header, notes, every row) as a CSV file and return its link.",
                "type": "boolean"
              },
              "groups": {
                "description": "Structure groups to add to the set.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "include": {
                      "default": "elements",
                      "description": "elements, nodes, both, links (general/elastic links with an end on the group's nodes) or all.",
                      "enum": ["elements", "nodes", "both", "links", "all"],
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "type": "array"
              },
              "items": {
                "description": "Items in set syntax, e.g. \"101to148, N9001to9006, EL12\".",
                "type": "string"
              },
              "keyEffect": {
