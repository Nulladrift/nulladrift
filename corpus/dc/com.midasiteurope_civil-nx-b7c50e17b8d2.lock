        {
          "name": "b2p_convert",
          "title": "Beam to Plate — convert beams into a plate/solid mesh",
          "description": "Converts beam elements into a plate (or solid) mesh of their cross-section with the Beam to Plate plugin's own engine (1.0.6): every section CIVIL NX gives geometry for (rolled/fabricated steel, PSC, boxes, composite, tapered groups, VALUE, catalogue), solid concrete sections as a grid of plates or as solids, exact beam loads / nodal loads / temperatures moved onto the mesh, haunches, diaphragms, deck slabs joined, rigid links to whatever else meets the beam's nodes (staged per construction stage), virtual beams per row of plates, groups and composite casting stages carried across. Previews by default (totals, volume check, per-section verdict, notes, what is left behind such as tendons or lanes, problems, planHash) and writes nothing. With apply: true and confirmPlanHash it re-reads the model, refuses if the plan changed, and writes the plugin's way: nodes, thicknesses and elements written and read back, then links, loads, groups, stages, virtual beams, and only then the source beams deleted (deleteSourceBeams); a write that fails part way is rolled back by the plugin. The run is recorded for b2p_undo. Lengths are in the model's unit. Use b2p_survey first. Runs as a background job on the website (poll job_status).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "acceptSections": {
                "description": "Section ids to convert although their check failed (the window's 'Convert anyway'). Only with the user's agreement.",
                "items": {
                  "type": ["integer", "string"]
                },
                "type": "array"
              },
              "apply": {
                "default": false,
                "description": "Write to CIVIL NX. Only after the user approved the preview.",
                "type": "boolean"
              },
              "boundaryGroup": {
                "default": "B2P links",
                "description": "Boundary group for the rigid links (one per stage in a staged model).",
                "maxLength": 16,
                "type": "string"
              },
              "calibrate": {
                "default": "generic",
                "description": "Adjust plate thicknesses so the mesh has the section's own A, centroid, Iyy, Izz: where the shape is idealised (generic), every section, or never.",
                "enum": ["generic", "all", "off"]
              },
              "confirmPlanHash": {
                "description": "planHash from the approved preview; the write is refused if the plan differs.",
                "type": "string"
              },
              "convertLoads": {
                "default": true,
                "description": "Move beam loads, nodal loads on the beams' nodes and element temperatures onto the plates.",
                "type": "boolean"
              },
              "deckPlates": {
                "default": "follow",
                "description": "Deck plates (plugin 1.0.6): follow = along the slab's mid-thickness, as before; straight = every top-slab node on one line under the top surface, each thicker plate (tapering cantilever, haunches) offset to its own concrete through the plate offset, so area, centroid and second moments are kept; webs run on to the deck line.",
                "enum": ["follow", "straight"]
              },
              "deleteOrphanNodes": {
                "default": true,
                "description": "Remove the beams' own nodes that nothing else uses once they are deleted.",
                "type": "boolean"
              },
              "deleteSourceBeams": {
                "default": true,
                "description": "DESTRUCTIVE: delete the converted beams after the mesh is written and read back (b2p_undo puts them back). Never deleted for a slice.",
                "type": "boolean"
              },
              "diaphragms": {
                "default": true,
                "description": "Fill compact diaphragm segments of a box run with plates (plate mode).",
                "type": "boolean"
              },
              "elementIds": {
                "description": "Beam element ids: \"101-118, 205\" or [101, 102].",
                "items": {
                  "type": ["integer", "string"]
                },
                "type": ["string", "array"]
              },
              "facets": {
                "default": 24,
                "description": "Facets per circle for round sections.",
                "maximum": 64,
                "minimum": 8,
                "type": "integer"
              },
              "groupName": {
                "default": "B2P mesh",
                "description": "Structure group for the whole mesh ('' for none).",
                "maxLength": 16,
                "type": "string"
              },
              "groups": {
                "description": "Every beam in these structure groups.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "includeUncountedStiffeners": {
                "default": false,
                "description": "Also mesh stiffeners CIVIL NX leaves out of the section (the 'C' box unticked).",
                "type": "boolean"
              },
              "joinDecks": {
                "default": true,
                "description": "Join neighbouring girders' deck slabs.",
                "type": "boolean"
              },
              "linkAll": {
