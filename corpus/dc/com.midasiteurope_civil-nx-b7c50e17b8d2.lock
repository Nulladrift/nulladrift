        {
          "name": "sls_stress_check",
          "title": "SLS stress limitation check (Stress Profile Generator)",
          "description": "The Stress Profile Generator's SLS report check (EN 1992-2 §7.2 concrete, EN 1993-2 §7.3 structural steel; normal stress σx at the fibres) over many elements × positions × combinations — or, with source stages, its construction-stage checks (fck(t) from CIVIL NX's concrete age, steel fy/γM0, tendons from CIVIL NX's tendon stresses). Every state is generated and matched with CIVIL NX as in stress_profile; composite parts are checked against their own concrete's fck. LIMITS ARE OPT-IN exactly as in the plugin: with no limit chosen the verdict is NO LIMIT APPLIED; nothing that could not be evaluated passes (INCOMPLETE). Combination categories (characteristic / frequent / quasi-permanent / none) are taken as given, else guessed from the name and reported. Returns the one verdict, the limits used, counts, the governing state, failures, what was not evaluated and why, per combination/stage and per element, and the plugin's SLS CSV as a download link. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "combinations": {
                "description": "source combinations: the combinations to check, each a name or {name, category}.",
                "items": {
                  "anyOf": [
                    {
                      "type": "string"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "category": {
                          "enum": ["characteristic", "frequent", "quasi-permanent", "none"]
                        },
                        "name": {
                          "type": "string"
                        }
                      },
                      "required": ["name"],
                      "type": "object"
                    }
                  ]
                },
                "type": "array"
              },
              "csv": {
                "default": true,
                "description": "Return the plugin's SLS CSV (every state, one row per part) as a download link.",
                "type": "boolean"
              },
              "elementIds": {
                "description": "Beam element numbers.",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "elements": {
                "description": "Element list as the plugin takes it, e.g. \"1-20, 35, 40 to 44\".",
                "type": "string"
              },
              "group": {
                "description": "A structure group; its beam elements are used.",
                "type": "string"
              },
              "limits": {
                "additionalProperties": false,
                "description": "Combination checks. Nothing optional is on unless set here. Stresses in MPa.",
                "properties": {
                  "compressionCharacteristic": {
                    "default": "none",
                    "description": "σc ≤ k1·fck in characteristic combinations: XD/XF/XS exposure (EN 1992-2 §7.2(102)) or a project requirement.",
                    "enum": ["none", "xd", "project"]
                  },
                  "compressionQuasiPermanent": {
                    "default": "k2",
                    "description": "σc ≤ k2·fck in quasi-permanent combinations (linear creep) — the plugin's default.",
                    "enum": ["k2", "none"]
                  },
                  "fck": {
                    "description": "Concrete fck (used where the model holds none, or everywhere with fckForEveryConcrete).",
                    "type": "number"
                  },
                  "fckForEveryConcrete": {
                    "default": false,
                    "type": "boolean"
                  },
                  "fctm": {
                    "description": "fctm; default from fck (EN 1992-1-1 Table 3.1).",
                    "type": "number"
                  },
                  "fy": {
                    "description": "Structural steel fy; default from the grade name (e.g. S355).",
                    "type": "number"
                  },
                  "gammaMser": {
                    "default": 1,
                    "type": "number"
                  },
                  "k1": {
                    "default": 0.6,
                    "type": "number"
                  },
                  "k2": {
                    "default": 0.45,
                    "type": "number"
                  },
                  "steel": {
                    "default": "normal",
