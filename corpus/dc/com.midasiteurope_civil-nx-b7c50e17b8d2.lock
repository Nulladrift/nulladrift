                "type": "string"
              },
              "designId": {
                "description": "The tendon_design result to write (default: the latest).",
                "type": "string"
              },
              "loadCase": {
                "description": "Prestress load case (default PS, or the model tendons' own).",
                "type": "string"
              },
              "loadGroupPrefix": {
                "default": "TD PS",
                "description": "Each tendon group's prestress goes in a load group named this prefix plus the group's name (made if missing). Empty string = no load group (Default); stages need one.",
                "type": "string"
              },
              "prefix": {
                "default": "TD",
                "description": "Tendon name prefix, at most 8 characters (tendons are named <prefix>-C1R1, ...).",
                "type": "string"
              },
              "replace": {
                "default": true,
                "description": "Remove tendons this tool wrote before on these elements with the same prefix (recorded in the ledger and unchanged since).",
