        {
          "name": "stage_groups",
          "title": "Construction Stage Wizard — structure groups",
          "description": "Creates structure groups with the Construction Stage Wizard plugin's group builder: pick a scope of elements, split it by rules (slice along X/Y/Z into n segments or at cuts, by section, material, element type, thickness, id ranges, existing groups), name them from a template, and resolve clashes with existing groups by policy. Typical use: segments of a deck for staged construction, e.g. rules [{kind:'slice', axis:'X', mode:'count', count:8, cuts:[]}] with naming {template:'Seg_{SLICE}'}. Previews unless apply: true; the write keeps a snapshot for stages_undo.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "apply": {
                "default": false,
                "description": "Write to CIVIL NX. Only after the user approved the preview.",
                "type": "boolean"
              },
              "confirmPlanHash": {
                "description": "planHash from the approved preview; the write is refused if the plan differs.",
                "type": "string"
              },
              "includeNodes": {
                "default": true,
                "type": "boolean"
              },
              "naming": {
                "additionalProperties": true,
                "description": "template with tokens {INDEX}, {SLICE}, {SECTION}, {MATERIAL}, {TYPE}…; prefix, suffix, pad, start.",
                "type": "object"
              },
              "policy": {
                "default": "skip",
                "description": "What to do when a group name already exists.",
                "enum": ["skip", "overwrite", "merge", "rename"]
              },
              "rules": {
                "description": "Applied together (every combination becomes a group): {kind:'slice', axis:'X'|'Y'|'Z', mode:'count'|'cuts', count, cuts:[coords]}, {kind:'section'}, {kind:'material'}, {kind:'type'}, {kind:'thickness'}, {kind:'idRange', ranges:[{label, text}]}, {kind:'existingGroup', groups:[names]}.",
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              },
              "scope": {
                "additionalProperties": true,
                "description": "{kind:'all'} | {kind:'groups', groups:[names]} | {kind:'ids', text:'1-80'} | {kind:'selection', elements:[ids]}",
                "type": "object"
              },
              "typeFilter": {
                "description": "Element types to keep (BEAM, TRUSS, PLATE, SOLID…); empty = all.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
