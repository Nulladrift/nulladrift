              "loadAt": {
                "default": "exact",
                "description": "Where a converted load lands: exactly where it acts; on the section centreline; spread over the section; spread over the deck top.",
                "enum": ["exact", "centreline", "spread", "deck"]
              },
              "loadFloor": {
                "description": "Ignore nodal loads under this, in the model's force unit (default 0.01 kN); totals are kept.",
