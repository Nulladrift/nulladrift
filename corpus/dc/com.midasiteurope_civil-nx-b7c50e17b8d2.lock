        {
          "name": "ec_moving_loads_read",
          "title": "Read the model for Eurocode moving loads",
          "description": "Read-only: changes nothing in the model. Call it before ec_moving_loads to see what the Eurocode - Moving Load Wizard would do. Returns: existing (the lanes, vehicles, cases and groups already in the model, each marked if an earlier ec_moving_loads run created it); laneKindSuggestion (LINE for beams, SURFACE for plates); deckRead (reference girder or plate edge, width, kerb offset, cross-beam group, skew — narrowed by deckFilter, reversed by trafficOtherWay); the lanes, lane roles and cases the given settings would produce; config (the plugin's own settings file — pass it back as configFile); options (valid load groups, vehicles and Irish Rail trains). Takes the same inputs as ec_moving_loads; the write permissions (codeChange, unitSwitch) only change which blockers are listed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "codeChange": {
                "default": false,
                "description": "A permission for the write tool. Here it only changes which blockers are listed — this tool never writes. Accepted so the same inputs serve both tools.",
                "type": "boolean"
              },
              "config": {
                "additionalProperties": true,
                "description": "Advanced: any other plugin configuration field, deep-merged over the settings.",
                "type": "object"
              },
              "configFile": {
                "description": "The plugin's own Export JSON settings file (or its \"config\"), as text or object: starts from those settings instead of the defaults. The deck is then not re-read unless readDeck: true.",
                "type": ["string", "object"]
              },
              "deckFilter": {
                "additionalProperties": true,
                "description": "Read the deck only from these members, as the plugin's Show only: group (structure group name), section (\"S:<id>\" beam section or \"T:<id>\" plate thickness), zMin / zMax (level band, m).",
                "properties": {
                  "group": {
                    "type": "string"
                  },
                  "section": {
                    "type": "string"
                  },
                  "zMax": {
                    "type": "number"
                  },
                  "zMin": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "irishRailTrains": {
                "description": "Irish Rail CCE-STR-PSD-008 Appendix C trains on the tracks: true for all, or train ids / names (ec_moving_loads_read options). Dynamic factor settings in loading.ieRail.",
                "items": {
                  "type": "string"
                },
                "type": ["boolean", "array"]
              },
              "laneKind": {
                "description": "Default: what the model suggests (beams -> LINE, plates -> SURFACE).",
                "enum": ["LINE", "SURFACE"]
              },
              "laneSource": {
                "default": "NEW",
                "description": "NEW shows the lanes the settings would lay out; EXISTING shows the lanes already in the model.",
                "enum": ["NEW", "EXISTING"]
              },
              "lanes": {
                "additionalProperties": true,
                "description": "Lane options: prefix (default EC), packing, wheelSpace, optimiseNotional, lm2Manual / lm2Centre, sv / svCentre / svWidth (LM3 route), tracks { tracks, firstTrack, spacing, gauge }, userLanes.",
                "type": "object"
              },
              "loading": {
                "additionalProperties": true,
