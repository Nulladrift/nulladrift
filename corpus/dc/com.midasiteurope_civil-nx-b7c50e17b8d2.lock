                "description": "DESTRUCTIVE: overwrite the section already at id (elements using it change stiffness). Only with the user's agreement.",
                "type": "boolean"
              },
              "section": {
                "additionalProperties": false,
                "description": "The section, read off the sketch. Axes: y across (positive right), z up, as seen in CIVIL's section dialog; put the origin anywhere convenient (e.g. bottom-left corner or soffit centre) — CIVIL's frame is applied on write.",
