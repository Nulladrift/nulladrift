        {
          "name": "skew_grillage",
          "title": "Skew Grillage Geometry Generator",
          "description": "Generates a bridge deck (beam grillage or plate mesh) with the Skew Grillage Geometry Generator plugin's own engine: skew, unequal girders, plan curvature, multi-span, crossfall and vertical profile, automatic transverse section sizing and structure groups (GIRDERS, CROSS-BEAMS, END-BEAMS for the support-line members, SPAN-n, or DECK for plates). Without apply it only previews (counts, metrics, groups, planHash). With apply: true it writes to CIVIL NX exactly as the plugin does: it refuses a model that already holds geometry unless replaceExisting is set, creates default material/sections/thickness where the ids are missing, and records the run for skew_grillage_undo.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "allowDefaultProperties": {
                "default": true,
                "description": "Create a default C30-like material and rectangular sections/thickness when the ids are not in the model.",
                "type": "boolean"
              },
              "apply": {
                "default": false,
                "description": "Write to CIVIL NX. Only after the user approved the preview.",
                "type": "boolean"
              },
              "autoTransverseSections": {
                "default": true,
                "description": "One transverse section per measured tributary width (beam decks).",
                "type": "boolean"
              },
              "confirmPlanHash": {
                "description": "planHash from the approved preview; the write is refused if the plan differs.",
                "type": "string"
              },
              "geometry": {
                "additionalProperties": true,
                "description": "Deck inputs, named as in the plugin. Anything omitted takes the plugin form's default. Lengths in metres, angles in degrees.",
                "properties": {
                  "crossfall": {
                    "description": "%",
                    "type": "number"
