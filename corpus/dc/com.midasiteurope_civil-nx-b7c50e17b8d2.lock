                      "type": "object"
                    },
                    "extraArgument": {
                      "description": "For 'all columns' tables: more POST /post/TABLE Argument keys (e.g. LOAD_CASE_NAMES, NODE_ELEMS, OPT_CS).",
                      "type": "object"
                    },
                    "loadCases": {
                      "description": "e.g. [\"DL(ST)\", \"ULS(CB)\", \"ENV(CB:max)\", \"LM1(MV:max)\"]. Omit for every case.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "nodeCenter": {
