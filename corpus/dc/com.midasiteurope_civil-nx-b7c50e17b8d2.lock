                  {
                    "additionalProperties": false,
                    "properties": {
                      "beamDiagrams": {
                        "description": "Beam force/moment diagrams; need an analysed model.",
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "caseType": {
                              "enum": ["ST", "CB", "CS"],
                              "type": "string"
                            },
                            "component": {
                              "default": "My",
                              "enum": ["Fx", "Fy", "Fz", "Fyz", "Mx", "My", "Mz", "Myz", "Mb", "Mt", "Mw"],
                              "type": "string"
                            },
                            "loadCase": {
                              "description": "Static case or combination name; for a construction stage, the result part (Summation, Dead Load, Tendon Primary …).",
                              "type": "string"
