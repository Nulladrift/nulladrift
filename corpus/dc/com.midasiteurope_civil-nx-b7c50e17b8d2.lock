        {
          "name": "ec2_section_check",
          "title": "Eurocode Section Checker: EN 1992 check of RC and prestressed sections",
          "description": "EN 1992-1-1 / EN 1992-2 check of concrete beam, column, pier and pile sections with the Eurocode Section Checker plugin's own engine. Reads the concurrent force sets at the chosen stations for the chosen combinations (BEAMFORCE for plain combinations; BEAMFORCEVBM for envelopes and moving loads, with the concurrency guard - a combination with no concurrent sets is checked at the corners of its force box, never mixed), then checks every row: ULS biaxial bending with axial force (fibre section), shear Vz and Vy (6.2), torsion (6.3), detailing; SLS stresses (7.2) and crack width (7.3) under characteristic / quasi-permanent rows; columns and piles to 5.8 (slenderness, imperfections, nominal curvature). Prestressed beams (psc): transfer stresses, stage-by-stage stresses with the girder alone and the composite section, ULS with the tendons' strain, shear with prestress, interface shear (6.2.5), decompression and crack width (Table 7.1N / 7.101N). Returns the verdict, the governing row of every check per section, the worst rows and what was not covered. Read-only; a job on the website.",
