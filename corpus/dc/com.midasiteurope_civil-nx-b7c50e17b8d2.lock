                    "enum": ["none", "one-way", "two-way", "camber"]
                  },
                  "curveDirection": {
                    "enum": ["left", "right"]
                  },
                  "curveEnabled": {
                    "type": "boolean"
                  },
                  "curveGirderSetOut": {
                    "enum": ["concentric", "fitted", "translated"]
