        {
          "name": "point_to_patch_apply",
          "title": "Disperse point loads into patch loads",
          "description": "Converts the model's point loads (or a coordinate table) into dispersed patch loads with the Point to Patch Convertor's engine and writes them as PATCH_<case> load cases: plate decks get pressures on the plates the patch covers, grillages get UDLs on the members by the lever rule, total force conserved; units converted to the model's. The writer snapshots every row it touches, writes, and reads every item back with a force-equilibrium check. Previews unless apply: true.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "acceptBlockers": {
                "default": false,
                "description": "Accept OVERRIDABLE blockers (the plugin's \"Write anyway\") — only with the user's agreement.",
                "type": "boolean"
              },
              "active": {
                "additionalProperties": true,
                "description": "Elements the patches may load: { groups: [names], useZ, zMin, zMax }.",
                "type": "object"
              },
              "apply": {
                "default": false,
                "type": "boolean"
              },
              "confirmPlanHash": {
                "type": "string"
              },
              "conserveForce": {
                "default": true,
                "type": "boolean"
              },
              "direction": {
                "default": "GZ",
                "enum": ["GZ", "LZ"]
              },
              "dispersal": {
                "additionalProperties": false,
                "properties": {
                  "alphaC": {
                    "description": "Half-angle through the concrete, °.",
                    "type": "number"
                  },
                  "alphaCLong": {
                    "type": "number"
                  },
                  "alphaS": {
                    "description": "Half-angle from vertical through the surfacing, ° (0 is honoured).",
                    "type": "number"
                  },
                  "alphaSLong": {
                    "type": "number"
                  },
                  "b0": {
                    "description": "Contact width across the traffic, m (null = the preset's).",
                    "type": "number"
                  },
                  "l0": {
                    "description": "Contact length along the traffic, m.",
                    "type": "number"
                  },
                  "neutralAxisDepth": {
                    "description": "m below the top, for NEUTRAL_AXIS.",
                    "type": "number"
                  },
                  "presetId": {
                    "description": "Contact area and spread rule (EN 1991-2, UK NA, CS 454, BS 5400, Network Rail…; point_to_patch_read lists them with their clauses).",
                    "enum": ["EC_LM1_TS", "EC_LM2", "EC_LM1_TS_ORTHO", "EC_FLM3", "EC_T48_A", "EC_T48_B", "EC_T48_C", "EC_LM3_AXLE_200", "EC_LM3_AXLE_240", "EC_FOOT_ACC", "UKNA_LM1_TS", "UKNA_LM2", "UKNA_SV", "UKNA_SOV", "UKNA_ABUTMENT", "CS454_RC_SLAB", "CS454_0P3", "CS454_HB", "CS454_TROUGH_STRIP", "EC_RAIL_UNDER_RAIL", "NR025_BALLAST", "NR025_ARCH_FILL", "BS5400_RU_RL", "CUSTOM"]
                  },
                  "targetPlane": {
                    "enum": ["MID_PLANE", "NEUTRAL_AXIS"]
                  },
                  "tc": {
                    "description": "Slab depth, m (apply: default the plate thickness).",
                    "type": "number"
                  },
                  "ts": {
                    "description": "Surfacing / ballast / fill depth, m.",
                    "type": "number"
                  }
                },
                "required": ["presetId"],
                "type": "object"
              },
              "kind": {
                "default": "AUTO",
                "enum": ["AUTO", "PLATE", "GRILLAGE"]
              },
              "output": {
                "additionalProperties": false,
                "properties": {
                  "mode": {
                    "default": "REPLACE",
                    "description": "REPLACE rewrites the PATCH_ cases (and removes earlier ones it does not reproduce); ADD writes new ones beside them.",
                    "enum": ["REPLACE", "ADD"]
                  },
                  "tag": {
                    "description": "Added to the case names: PATCH_<case>_<tag>.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "rail": {
                "additionalProperties": false,
                "properties": {
                  "f": {
                    "description": "User load factor.",
                    "type": "number"
                  },
                  "spacing": {
                    "description": "Sleeper spacing, m.",
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "rotationDeg": {
                "description": "Traffic direction from global +X, °.",
                "type": "number"
              },
              "source": {
                "additionalProperties": true,
                "description": "mode MODEL (default: nodal and beam concentrated loads; lcNames to pick cases, owners, minMagnitude) or MANUAL (manualText: one load per line 'X, Y, P[, Z]' in kN and m; manualCase names the case).",
                "type": "object"
              }
            },
            "required": ["dispersal"],
            "type": "object"
          },
