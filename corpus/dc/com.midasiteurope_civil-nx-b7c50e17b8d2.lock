        {
          "name": "culvert_analyse_and_check",
          "title": "Analyse the culvert and run every check",
          "description": "On the culvert model built from the same inputs (refused if the open model's counts differ): runs the CIVIL NX analysis (unless analyse: false), reads the basic-case results (forces, reactions, displacements) and runs the plugin's checks — every Annex A2 combination and vehicle position: ULS flexure and shear, SLS stresses and crack width, detailing, bearing and uplift. Returns the verdict and the governing locations. Takes minutes: a job on the website.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "analyse": {
                "description": "Run the analysis first (default true).",
                "type": "boolean"
              },
              "maxLocations": {
                "description": "Locations to list, worst first (default 30).",
                "type": "integer"
              },
              "project": {
                "additionalProperties": true,
                "description": "Changes to the 2D Culvert project (schema culvert-studio/2), merged onto the plugin's default project; arrays replace. Sections: project {name, reference, revision}; basis {profile: EN-1G | UK-1G | ..., concrete 'C32/40', steel 'B500B'}; geometry {spans [m per cell], clear_height, t_top, t_bot, t_ext, t_int, haunch_top [w,h], haunch_bot}; ground {fill, fill_density, surfacing_thk, surfacing_density, soil_density, soil_sub, phi, k0_override, subgrade (kN/m3), side_springs}; water {gw_depth, internal_depth}; earth_pressure {method K0 | annexB | cl94, fill_6n6p, ...}; traffic {carriageway, lm1, lm2, braking, surcharge, step, lm3 {enabled, sv80, sv100, sv196, gaps}, vehicles}; thermal {dT_exp, dT_con, dT_heat, dT_cool, shrinkage}; loads {sdl}; reinforcement {top_slab, base_slab, walls}; design {allowable_bearing, RH, t0, creep_phi}. Lengths m, bars [dia mm, spacing mm].",
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
