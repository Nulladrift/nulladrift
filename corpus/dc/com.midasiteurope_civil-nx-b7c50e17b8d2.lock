        {
          "name": "slab_assess",
          "title": "Assess RC slabs/shells from plate forces",
          "description": "Reads plate forces (PLATEFORCEUL, element local axes) for one orientation group and the given load cases, rotates them to the reinforcement direction and assesses every position with the plugin's own core (Denton, Wood-Armer, sandwich, Annex LL, CS 455). Returns counts, the worst elements with governing case/position, coverage and every gap (missing results are INCOMPLETE, never a pass). Read-only. Can take minutes on big models (a job on the website).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "alphaDeg": {
                "description": "Angle of the second bar direction from the first, degrees (default 90 = orthogonal).",
                "type": "number"
              },
              "averaging": {
                "description": "Average nodal results over the plates meeting at each node (in the reinforcement frame). Off by default: averaging hides peaks.",
                "type": "boolean"
              },
              "bars": {
                "additionalProperties": false,
                "description": "The bar arrangement (preferred): drives the Denton/Wood-Armer capacities, the Annex LL steel forces and covers, and CS 455.",
                "properties": {
                  "alpha_cc": {
                    "description": "Long-term coefficient αcc on fck for the flexural capacities (default 0.85, UK NA).",
                    "type": "number"
                  },
                  "bottom": {
                    "additionalProperties": false,
                    "description": "One face: {cover_mm, layers: [{dia, spacing, angle, outer}, ...]} — one layer per bar direction, the outer one marked outer: true.",
                    "properties": {
                      "cover_mm": {
                        "description": "nominal cover to the bar face, mm",
                        "type": "number"
                      },
                      "layers": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "angle": {
                              "description": "bar direction, degrees from the reinforcement x direction (0 or alphaDeg)",
                              "type": "number"
                            },
                            "dia": {
                              "description": "bar diameter, mm",
                              "exclusiveMinimum": 0,
                              "type": "number"
                            },
                            "outer": {
                              "description": "the outer layer of its face",
                              "type": "boolean"
                            },
                            "spacing": {
                              "description": "mm",
                              "exclusiveMinimum": 0,
                              "type": "number"
                            }
                          },
                          "required": ["dia", "spacing"],
                          "type": "object"
                        },
                        "minItems": 1,
                        "type": "array"
                      }
                    },
                    "required": ["layers"],
                    "type": "object"
                  },
                  "fck": {
                    "description": "Concrete characteristic cylinder strength, MPa.",
                    "type": "number"
                  },
                  "fyk": {
                    "description": "Reinforcement yield strength, MPa (default 500).",
                    "type": "number"
                  },
                  "gamma_c": {
                    "description": "Concrete partial factor γc (default 1.5).",
                    "type": "number"
                  },
                  "gamma_s": {
                    "description": "Reinforcement partial factor γs (default 1.15).",
                    "type": "number"
                  },
                  "thickness_mm": {
                    "description": "Slab thickness, mm.",
                    "type": "number"
                  },
