                        "template": {
                          "additionalProperties": false,
                          "description": "A Section Designer template instead of regions; lengths in the section's units. Soffit on z = 0 and centreline on y = 0, moved by at. i_girder: H depth, tw web, Bt/tft top flange width/thickness, Bb/tfb bottom flange, htw/hth top haunch width (beyond the web face)/height, hbw/hbh bottom haunch. box_girder: cells 1–3, B deck width, Bw outer width across the webs at the top (under the cantilever roots), Bs soffit width, H depth, ts top slab, tb bottom slab, tw web thickness (horizontal), tc/tr cantilever thickness at tip/root, htw/hth and hbw/hbh cell haunches (top and bottom corners). Haunches default to 0.",
                          "properties": {
                            "B": {
