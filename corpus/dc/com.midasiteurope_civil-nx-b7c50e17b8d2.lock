        {
          "name": "preview_result_table",
          "title": "Preview one result or model table",
          "description": "Reads one table from the open CIVIL NX model the way the exporter's 'Preview this table' does and returns its first rows (default 20, max 200) with unit-labelled headers, any sub-tables (e.g. reaction totals) and the exact POST /post/TABLE Argument sent. Result tables are a quick sample (first 20 nodes/elements, 3 load cases, 2 stage steps) with an estimate of the full row count; model tables are read whole. When no loadCases are given it also lists the model's load-case names (loadCasesInModel). Read-only (GET /db and POST /post/TABLE only). Results need an analysed model.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "argument": {
                "description": "For custom-table: the full POST /post/TABLE Argument object.",
                "type": "object"
              },
              "averageNodal": {
                "type": "boolean"
              },
              "columns": {
                "description": "Model tables: exact column names to keep (preview first to see them).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "components": {
                "description": "Columns, as listed for the table (e.g. Axial, Moment-y). Omit for the plugin's defaults; for 'all columns' tables omit for every column.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "constructionStage": {
                "description": "Results of the construction stage analysis (adds Stage and Step columns).",
                "type": "boolean"
              },
              "dbKey": {
                "description": "For db-custom: any /db/ key (e.g. MVHL, TDNA).",
                "type": "string"
              },
              "decimals": {
                "description": "Default 6.",
                "maximum": 15,
                "minimum": 0,
                "type": "integer"
              },
              "displacementOption": {
                "description": "Displacement tables in construction stages.",
                "enum": ["Accumulative", "Current", "Real"],
                "type": "string"
              },
              "entities": {
                "additionalProperties": false,
                "properties": {
                  "mode": {
                    "default": "all",
                    "enum": ["all", "ids", "range", "group"],
                    "type": "string"
                  },
                  "value": {
                    "description": "ids: \"1-40, 52\"; range: \"1 to 250\"; group: the structure group name.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "extraArgument": {
                "description": "For 'all columns' tables: more POST /post/TABLE Argument keys (e.g. LOAD_CASE_NAMES, NODE_ELEMS, OPT_CS).",
                "type": "object"
              },
              "loadCases": {
                "description": "e.g. [\"DL(ST)\", \"ULS(CB)\", \"ENV(CB:max)\", \"LM1(MV:max)\"]. Omit for every case.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "nodeCenter": {
                "description": "Plate tables: include the element centre.",
                "type": "boolean"
              },
              "nodeCorners": {
                "description": "Plate tables: include the corner nodes (default true).",
                "type": "boolean"
              },
              "numberFormat": {
                "description": "Default Scientific.",
                "enum": ["Default", "Fixed", "Scientific", "General"],
                "type": "string"
              },
              "parts": {
                "description": "Beam tables: stations along each element (default PartI, PartJ).",
                "items": {
                  "enum": ["PartI", "Part1/4", "Part2/4", "Part3/4", "PartJ"],
                  "type": "string"
                },
                "type": "array"
              },
              "records": {
                "additionalProperties": false,
                "description": "Model tables: which record ids (filtered after the read).",
                "properties": {
                  "mode": {
                    "enum": ["all", "ids", "range"],
                    "type": "string"
                  },
                  "value": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "rows": {
                "default": 20,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "sectionPositions": {
                "description": "Beam stress detail: e.g. [\"Maximum\"] or stress point numbers.",
