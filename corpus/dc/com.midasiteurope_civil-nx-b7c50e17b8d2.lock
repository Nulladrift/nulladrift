        {
          "name": "civil_write_tables",
          "title": "Write any model table (build from scratch)",
          "description": "Creates, changes or deletes rows in any CIVIL NX database table through the MIDAS API — nodes, elements, materials, sections, thicknesses, supports, links, load cases, loads, groups, stages, combinations, anything the API manual lists — so a model can be built from scratch or changed where no plugin tool does it. Look up the table and its fields first with midas_docs_search / midas_docs_read (e.g. \"db/ELEM\"), and read the current rows with civil_read_table. writes is a list of steps run in order: { table, op: create (POST — new keys only, refused if a key exists) | upsert (PUT — creates or changes; GRUP lists and CNLD/BMLD/PRES/RIGD items MERGE, they are never removed by a PUT) | delete (DESTRUCTIVE — needs allowDestructive; a node takes its elements, an element its loads, a load case its loads), rows: { \"<key>\": {fields} } | ids: [keys] }. The preview simulates every step over the current model: what each creates, changes (which fields) and deletes; it blocks keys that already exist on create, elements that refer to nodes, materials, sections or thicknesses that do not exist (CIVIL NX accepts a missing section silently), deletes and UNIT / MVCD writes without allowDestructive. Then apply: true with confirmPlanHash writes the steps (stopping at the first refusal), reads every touched row back and reports anything not stored as sent. civil_write_tables_undo puts every touched row back.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "allowDestructive": {
                "default": false,
                "description": "DESTRUCTIVE: allow delete steps and writes to UNIT / MVCD. Only after the user agreed to what the preview says they do.",
                "type": "boolean"
              },
              "apply": {
                "default": false,
                "description": "Write to CIVIL NX. Only after the user approved the preview.",
                "type": "boolean"
              },
              "confirmPlanHash": {
                "description": "planHash from the approved preview; refused if the model or the steps changed.",
                "type": "string"
              },
              "writes": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "ids": {
                      "description": "delete: the keys to delete.",
                      "items": {
                        "type": ["integer", "string"]
                      },
                      "type": "array"
                    },
                    "op": {
                      "enum": ["create", "upsert", "delete"],
                      "type": "string"
                    },
                    "rows": {
                      "additionalProperties": {
                        "description": "One row: the table's fields as the API manual gives them (Assign).",
                        "type": "object"
                      },
                      "description": "create / upsert: { \"<key>\": { field: value } }, keys are whole numbers.",
                      "type": "object"
                    },
                    "table": {
                      "description": "Table key as in the API manual's URI (db/NODE → NODE; LCOM-GEN, MVLDBS…).",
                      "type": "string"
                    }
                  },
                  "required": ["op", "table"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["writes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:3c9b29e5ea8a9b1e9af20c422cb8efce8760592f6af659ec273c462404cbad5e"
        },
        {
          "name": "civil_write_tables_undo",
          "title": "Undo a civil_write_tables run",
          "description": "Puts every row a civil_write_tables run touched back as it was before the run: deletes rows it created, restores rows it changed or deleted (a merging table's row is replaced whole). Works on a run that stopped part-way too. Warns where a row changed after the run. What CIVIL NX deleted along with a row (elements on a deleted node, loads on a deleted element) is not part of the run and does not come back. Default: the latest run not yet undone. Previews unless apply: true.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "apply": {
                "default": false,
                "type": "boolean"
              },
