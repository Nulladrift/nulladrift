        {
          "name": "stress_element_loads",
          "title": "Results available for beam elements (Stress Profile Generator)",
          "description": "Reads what the Stress Profile Generator can show for chosen beam elements: each element's section (type, outline verified, composite parts, tapered), material, length, the load cases / combinations / envelopes CIVIL NX publishes results for (with kind and whether each is one concurrent state), the construction stages with results for that element (and, with stage, that stage's results such as Summation). Also lists the model's combinations with the SLS category the plugin would guess. Read-only; reads results with a few batched /post/TABLE requests. Use it before stress_profile or sls_stress_check.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "elementIds": {
                "description": "Beam element numbers.",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "elements": {
                "description": "Element list as the plugin takes it, e.g. \"1-20, 35, 40 to 44\".",
                "type": "string"
              },
              "group": {
                "description": "A structure group; its beam elements are used.",
                "type": "string"
              },
              "stage": {
                "description": "A construction stage: also list its results for each element.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c424bf2fe40e86d193877f5a7ee684c8b5ab805c8ae852a9946dffabccc440b4"
        },
        {
          "name": "stress_profile",
          "title": "Stress distribution through a beam section (Stress Profile Generator)",
          "description": "The Stress Profile Generator's profile for ONE beam element: from CIVIL NX's beam forces and the true section outline it calculates σx (or σx from N / My / Mz, τ from Vz / Vy, von Mises, principal, Tresca) over the section at the chosen positions and loads, and checks every profile against CIVIL NX's own published stresses (effective PSC sections are drawn through CIVIL NX's stress points; composite sections part by part from CIVIL NX's per-part results; envelopes give CIVIL NX's values at the stress points plus the governing member or static part as a profile). Returns per profile: status (ok/unchecked/points/refused) with reasons, forces, extremes and where they occur, CIVIL NX vs calculated at stress points 1–4, per-part σx for composites, and min/max across the section at each depth. With `thermal` it gives the EN 1991-1-5 temperature stresses instead, split into total, restraint, self-equilibrating, uniform and linear parts (Type 3 heating/cooling with 100 mm surfacing, a user ΔT profile, or CIVIL NX's own section temperature; restraint free, full, axial, rotation, or CIVIL NX's forces of a load). Optional csv gives the plugin's CSV export as a download link. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "csv": {
                "default": false,
                "description": "Also return the plugin's CSV export of every profile (a download link).",
                "type": "boolean"
              },
              "depthLevels": {
                "default": 10,
                "description": "Levels of the through-depth table (vertex levels are added); 0 leaves it out.",
                "maximum": 40,
                "minimum": 0,
                "type": "integer"
              },
              "elementId": {
                "description": "The beam element.",
                "type": "integer"
              },
              "loads": {
                "description": "Load case / combination / envelope names as stress_element_loads lists them; with stage, that stage's results (e.g. Summation, Dead Load).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "positions": {
                "description": "Positions along the element: I-end, ¼, ½, ¾ span, J-end. Default [\"2/4\"].",
                "items": {
                  "enum": ["I", "1/4", "2/4", "3/4", "J"]
                },
                "type": "array"
              },
              "result": {
                "default": "sx",
                "description": "sx σx combined; sxN/sxMy/sxMz its parts; tVz/tVy shear; vm von Mises; s1/s2 principal; tmax; tresca.",
                "enum": ["sx", "sxN", "sxMy", "sxMz", "tVz", "tVy", "vm", "s1", "s2", "tmax", "tresca"]
              },
              "sectionProperties": {
                "default": "effective",
                "description": "effective = CIVIL NX's own stresses (as the plugin's default); gross = the plugin's calculation on the section as modelled, difference stated.",
                "enum": ["effective", "gross"]
              },
              "stage": {
                "description": "Construction stage: use its results (last step) instead of the final state.",
                "type": "string"
              },
              "thermal": {
                "additionalProperties": false,
                "description": "Temperature stresses instead of load results (EN 1991-1-5 §6.1.4).",
                "properties": {
                  "E": {
                    "description": "E of the element's material, kN/m², if the model's is not to be used.",
                    "type": "number"
                  },
                  "alphas": {
                    "description": "α per section part, 1/°C (null = from the model). Composite-General parts have none in the model and need it.",
                    "items": {
                      "type": ["number", "null"]
                    },
                    "type": "array"
                  },
                  "components": {
                    "description": "Default all: tTot total, tRes restraint, teig self-equilibrating, tUni uniform (fully restrained), tLin linear (fully restrained).",
                    "items": {
                      "enum": ["tTot", "tRes", "teig", "tUni", "tLin"]
                    },
                    "type": "array"
                  },
                  "load": {
                    "description": "CIVIL NX static load case / combination for preset civil or restraint civil.",
                    "type": "string"
                  },
                  "points": {
                    "description": "preset user: [depth below the top m, ΔT °C] pairs, linear between, zero outside.",
                    "items": {
                      "items": {
                        "type": "number"
                      },
                      "maxItems": 2,
                      "minItems": 2,
                      "type": "array"
                    },
                    "type": "array"
                  },
                  "preset": {
                    "default": "heating",
                    "description": "Type 3 heating / cooling (Table B.3, 100 mm surfacing — check the National Annex), user points, or CIVIL NX's own section/element temperature of thermal.load.",
                    "enum": ["heating", "cooling", "user", "civil"]
                  },
                  "restraint": {
                    "default": "free",
                    "description": "free (statically determinate), full, axial only, rotation only, or CIVIL NX's beam forces of thermal.load.",
                    "enum": ["free", "full", "axial", "rot", "civil"]
                  }
                },
                "type": "object"
              },
              "unit": {
                "default": "MPa",
                "description": "Stress unit of the results (internally kN/m²).",
                "enum": ["MPa", "kN/m2", "kgf/cm2", "ksi", "psi"]
              }
            },
            "required": ["elementId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:774f672e13524ad299313dddea3507a766c4e604e23bb134f721ce241d316a82"
        },
        {
          "name": "tendon_design",
          "title": "Design or check a girder's prestressing tendons (Tendon Designer)",
          "description": "Designs the post- or pre-tensioning tendons of a concrete girder in the open model to EN 1992-1-1 with the Tendon Designer plugin's own engine, or reads the model's own tendons and checks them (mode improve, the default when tendons run along the girder). Reads the girder (a structure group, element list or the CIVIL NX selection; for improve it is picked from the tendons), its sections, supports and concrete, and the forces: construction-stage results when the model has stages (stage by stage for improve), else the static load cases named, plus an optional live envelope and ULS envelope combination. The girder is ONE girder line (a group holding several girders is split; girderLine picks one). Composite girders (precast + deck slab) are checked stage by stage (compositeMode) with the slab's own concrete, including the slab top; standard precast beams are pre-tensioned on their published strand positions, with debonded (sleeved) strands set or searched for by debonding, each end's length separately. Then auto-designs the layout (new), reads the tendons in (improve), or takes tendons the user gives as heights above the soffit with transverse distances (soffitTendons, e.g. an existing bridge's tendon schedule), and runs every check: stresses at transfer and in service, Magnel, load balancing, losses, ULS bending, cover, spacing, bend radius, anchorage zones. autoResolve tries the smallest change that clears failed checks. exportSoffitCsv returns the tendons as a soffit-height CSV (download link). The design is kept (designId) for tendon_write. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "autoResolve": {
                "default": false,
                "description": "When checks fail, try the smallest change that clears them (the plugin's Auto-resolve); taken only if fewer checks fail.",
                "type": "boolean"
              },
              "columnStrands": {
                "description": "Strands per tendon, column by column (left to right, as design.columns lists them); null = the design's strandsPerTendon. A column with its own count is written with its own tendon property. Post-tensioned draped tendons only (not standard strand patterns).",
                "items": {
                  "maximum": 61,
                  "minimum": 1,
                  "type": ["integer", "null"]
                },
                "maxItems": 40,
                "type": "array"
              },
              "compositeMode": {
                "description": "Composite girder (precast girder + deck slab section): when the tendons are stressed. before = prestress, girder and wet-slab weight on the girder alone, superimposed dead and live load on the composite section (precast / pre-tensioned); after = the slab has hardened, prestress on the composite section too; off = ignore the slab. Default: worked out from the construction stages (first stressing stage vs the slab's CSCS stage), else before. The slab's concrete is read from the model (CSCS, else the section's Es/Ec).",
                "enum": ["before", "after", "off"]
              },
              "compositeSection": {
                "description": "Old name of compositeMode: girder = before, whole = after.",
                "enum": ["girder", "whole"]
              },
              "debonding": {
                "anyOf": [
                  {
                    "enum": ["auto", "none"]
                  },
                  {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "endA_m": {
                          "description": "Sleeved length at end A (the girder's start), m.",
                          "minimum": 0,
                          "type": "number"
                        },
                        "endB_m": {
                          "description": "At end B, m (default = endA_m).",
                          "minimum": 0,
                          "type": "number"
                        },
                        "strands": {
                          "items": {
                            "type": ["string", "integer"]
                          },
                          "minItems": 1,
                          "type": "array"
                        }
                      },
                      "required": ["endA_m", "strands"],
                      "type": "object"
                    },
                    "maxItems": 100,
                    "type": "array"
                  }
                ],
                "description": "Pre-tensioned only: strands sleeved (debonded) at the beam ends so they carry no force there - relieves transfer tension at the ends. \"auto\" = the plugin's Find debonding on the strands as designed (pairs of inner strands, 1-6 m, within 25 % of all strands and 40 % of a row, outermost strands bonded; taken only if checks improve); \"none\" = every strand bonded (auto-design does not debond either); or a list giving exactly the strands to sleeve, by name as design.debonding.strandNames lists them (standard positions like \"A.5\", or tendon numbers on a tendon grid). Omitted: as auto-design left it (on a standard precast beam it may already debond). Written to CIVIL NX as each strand's DeBondBLEN / DeBondELEN."
              },
              "elementIds": {
                "description": "The girder's beam elements (one girder line).",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "exportSoffitCsv": {
                "default": false,
                "description": "Also return the design's tendons (new, improved or given) as the soffit-height CSV - Tendon, Station (m), Height above soffit (mm), Transverse distance y (mm), one row per point - as a download link (soffitHeightsCsv). It is the file the plugin's Heights from soffit… imports and soffitTendons.csv reads.",
                "type": "boolean"
              },
              "externalTendons": {
                "additionalProperties": false,
                "description": "mode new, post-tensioned box or U girders: add external tendons in the void (CIVIL NX External tendon type), straight between deviators - anchored at the centroid, low at 0.3 and 0.7 of each span just clear of the bottom slab, high over interior supports. Added before the internal tendons are sized, so those are sized with them in place.",
                "properties": {
                  "clear_mm": {
                    "description": "Clear gap from the sheath to the concrete, mm (default 50).",
                    "minimum": 0,
                    "type": "number"
                  },
                  "count": {
                    "default": 4,
                    "description": "External tendons (placed beside each web; one at the middle when odd).",
                    "maximum": 12,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "mu": {
                    "description": "Friction at the deviators (default 0.12, HDPE duct, EN 1992-1-1 Table 5.1; steel 0.25).",
                    "maximum": 0.5,
                    "minimum": 0,
                    "type": "number"
                  },
                  "strands": {
                    "default": 19,
                    "description": "Strands per external tendon.",
                    "maximum": 61,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "forces": {
                "additionalProperties": false,
                "description": "Where the forces come from. Default: CIVIL NX - construction-stage results when the model has stages (the construction-stage analysis must have been run), else static load cases.",
                "properties": {
                  "kind": {
                    "description": "On a staged model: cs (default) or static load cases.",
                    "enum": ["cs", "static"]
                  },
                  "liveMax": {
                    "description": "Live load envelope max, as CIVIL NX names it, e.g. \"LL(MV:max)\" or \"SLS(CB:max)\".",
                    "type": "string"
                  },
                  "liveMin": {
                    "description": "Live load envelope min.",
                    "type": "string"
                  },
                  "selfWeight": {
                    "description": "Static: self-weight case(s) with their suffix, e.g. [\"DL(ST)\"]. Default: the case named like self weight / dead.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "source": {
                    "default": "civil",
                    "description": "beam = no forces read: the plugin's continuous beam with self-weight from the section plus lineLoads.",
                    "enum": ["civil", "beam"]
                  },
                  "superimposedDead": {
                    "description": "Static: superimposed dead case(s), e.g. [\"SDL(ST)\"].",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "ulsEnvelope": {
                    "additionalProperties": false,
                    "description": "A ULS envelope combination used in place of the factored sum.",
                    "properties": {
                      "includesPrestress": {
                        "description": "The combination already holds the prestress secondary moments (default true on a staged model).",
                        "type": "boolean"
                      },
                      "max": {
                        "description": "e.g. \"ULS ENV(CB:max)\"",
                        "type": "string"
                      },
                      "min": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "girderLine": {
                "description": "When the group/elements hold several separate girders: which one to design (1-based, as listed in girderNotes). Default: the one with the most tendons on it.",
                "minimum": 1,
                "type": "integer"
              },
              "group": {
                "description": "Structure group holding ONE girder's beam elements - the elements one continuous tendon runs through, end to end (not the whole deck). A group holding several girders is split into its girder lines and one is designed (girderLine).",
                "type": "string"
              },
              "keep": {
                "additionalProperties": false,
                "description": "autoResolve: what it must not change. improve default: anchors, count, strandsPerTendon and duct kept, profile free; new default: nothing kept.",
                "properties": {
                  "anchors": {
                    "type": "boolean"
                  },
                  "count": {
                    "type": "boolean"
                  },
                  "duct": {
                    "type": "boolean"
                  },
                  "profile": {
                    "type": "boolean"
                  },
                  "strandsPerTendon": {
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "lineLoads": {
                "additionalProperties": false,
                "description": "forces.source beam: superimposed dead and live line loads, kN/m.",
                "properties": {
                  "live": {
                    "type": "number"
                  },
                  "sdl": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "losses": {
                "additionalProperties": false,
                "description": "Loss method and inputs (default EN 1992-1-1 with Annex B creep and shrinkage). code cs455 assesses an existing UK bridge's losses to CS 455 clause 8 (8.7-8.14); the stress limits and resistance checks stay EN 1992-1-1.",
                "properties": {
                  "RH": {
                    "description": "EN 1992: relative humidity, % (default 80).",
                    "type": "number"
                  },
                  "code": {
                    "enum": ["ec2", "cs455"]
                  },
                  "creepCoefficient": {
                    "description": "EN 1992: a creep coefficient phi(inf, t0) in place of Annex B.",
                    "type": "number"
                  },
                  "cs455": {
                    "additionalProperties": false,
                    "description": "code cs455 inputs (blank = the tables).",
                    "properties": {
                      "Ec_GPa": {
                        "description": "Concrete modulus at transfer (default Eq 3.5a, 20 + 0.27 fci).",
                        "type": "number"
                      },
                      "creepPerMPa_e6": {
                        "description": "Creep strain per MPa x1e-6 in place of Table 8.8.3 (0 is used as entered).",
