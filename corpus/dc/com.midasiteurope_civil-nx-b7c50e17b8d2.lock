                  "Econcrete": {
                    "type": "number"
                  },
                  "Esteel": {
                    "type": "number"
                  },
                  "mode": {
                    "default": "element",
                    "enum": ["element", "input"]
                  }
                },
                "type": "object"
              },
              "method": {
                "description": "Temperature difference: approach2 = non-linear profile (code profiles), approach1 = linear. Default: the code's (the CEN text leaves it to the annex — then it must be given).",
                "enum": ["approach2", "approach1"]
              },
              "modularRatio": {
                "description": "Es/Ec, needed for combined cases on composite sections (LR 765 effective temperature).",
                "type": "number"
              },
              "overwrite": {
                "default": false,
                "description": "Replace EC1T_ cases of the same names already in the model. Only with the user's agreement.",
                "type": "boolean"
              },
              "procedure": {
                "default": "normal",
                "description": "Composite decks under EN: normal or simplified procedure.",
                "enum": ["normal", "simplified"]
              },
              "sectionOverrides": {
                "description": "Corrections to the sections bridge_thermal_read reports (by key or name).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "D": {
                      "type": "number"
                    },
                    "h": {
                      "type": "number"
                    },
                    "kind": {
                      "description": "Deck type: steel_box, steel_plate (truss or plate girders), composite (concrete deck on steel girders), concrete_slab, concrete_beam, concrete_box.",
                      "enum": ["steel_box", "steel_plate", "composite", "concrete_slab", "concrete_beam", "concrete_box"]
                    },
                    "parts": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "b": {
                            "description": "Width, m.",
                            "type": "number"
                          },
                          "mat": {
                            "enum": ["steel", "concrete"]
                          },
                          "name": {
                            "type": "string"
                          },
                          "z1": {
                            "description": "Top of the part, m below the top of the deck.",
                            "type": "number"
                          },
                          "z2": {
                            "description": "Bottom of the part, m.",
                            "type": "number"
                          }
                        },
                        "required": ["b", "z1", "z2"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "section": {
                      "type": "string"
                    }
                  },
                  "required": ["section"],
                  "type": "object"
                },
                "type": "array"
              },
              "simultaneity": {
                "default": true,
                "description": "Report the simultaneity combinations (ω factors).",
                "type": "boolean"
              },
              "site": {
                "additionalProperties": false,
                "description": "For the uniform component (and bearing / combined cases). Tmin / Tmax are the shade air temperatures read from the code's maps by the user (the maps are not built in), °C.",
                "properties": {
