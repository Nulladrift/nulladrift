        {
          "name": "ec2_describe_section",
          "title": "Eurocode Section Checker: read a section and place its bars",
          "description": "Start here for an EN 1992 section check. Reads one beam section of the open model through the shared MIDAS section library (any CIVIL NX section family; composite deck slabs as separate regions; tapered sections per end), places the bars from the given schedule with the Eurocode Section Checker's own placement and, for a prestressed beam, the tendons - and RETURNS A DRAWING of the section with every bar and tendon. Compare it with the user's drawing and correct rebar / psc.tendons until they match, then call ec2_section_check. Also returns depth, width, area, the bars placed per schedule row (or why a row failed), the concrete class read from the model material and the member type / length the model suggests. An unknown sectionId is answered with the model's beam sections. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "grade": {
                "description": "EN 206 class, e.g. C35/45 (default: from the model material, else C30/37 assumed).",
                "type": "string"
              },
              "image": {
                "description": "return the drawing (default true)",
                "type": "boolean"
              },
              "member": {
                "additionalProperties": false,
                "description": "Check as a column, pier or pile (EC2 5.8 slenderness, imperfections, nominal-curvature second order; pile: bored-pile minimum steel 9.8.5) instead of a beam. Default: column when the elements are mostly vertical, else beam. Effective length l0 = k * length about each axis: caseY/caseZ from EC2 Fig 5.7 (a pinned both ends 1.0, b cantilever 2.0, c fixed-pinned 0.7, d fixed both 0.5, e fixed both, sway 1.0, f fixed-pinned, sway 2.0) or kY/kZ.",
                "properties": {
                  "caseY": {
                    "enum": ["a", "b", "c", "d", "e", "f", "custom"]
                  },
                  "caseZ": {
                    "enum": ["a", "b", "c", "d", "e", "f", "custom"]
                  },
                  "kY": {
                    "type": "number"
                  },
                  "kZ": {
                    "type": "number"
                  },
                  "length": {
                    "description": "metres (default: the longest run of joined elements with this section)",
                    "type": "number"
                  },
                  "phiEf": {
                    "description": "effective creep ratio (5.8.4), default from the engine",
                    "type": "number"
                  },
                  "type": {
                    "enum": ["beam", "column", "pier", "pile"]
                  },
                  "uncased": {
                    "description": "pile: bored without casing (EC2 2.3.4.2(2) reduced diameter)",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "psc": {
                "additionalProperties": false,
                "description": "Prestressed beam (EC2 5.10, 6.1, 7.1-7.3; 6.2.5 interface shear when composite): every tendon at its own position. tendons: the plugin's text lines - 'y z Ap [sigma_pm0]' for one tendon, 'y1 z1 y2 z2 n Ap [sigma_pm0]' for a line of n - with Ap in mm² or a strand '15.7s' or '19x15.7', coordinates mm from the datum (bc = bottom centre, bl = bottom left, tc = top centre, z down); or a list [{y, z, area, sigma0?}]. Stage 1 (prestress, girder self-weight, load cases tagged stage1) acts on the girder alone; give composite for a precast girder + deck slab.",
                "properties": {
                  "Ep": {
                    "type": "number"
                  },
                  "alphaL": {
                    "type": "number"
                  },
                  "composite": {
                    "additionalProperties": false,
                    "properties": {
                      "asi": {
                        "description": "interface steel mm²/m",
                        "type": "number"
                      },
                      "depth": {
                        "description": "mm from the top",
                        "type": "number"
                      },
                      "grade": {
                        "description": "slab concrete class, e.g. C30/37",
                        "type": "string"
                      },
                      "roughness": {
                        "description": "EC2 6.2.5(2), default rough",
                        "enum": ["very_smooth", "smooth", "rough", "indented"]
                      },
                      "slab": {
                        "description": "the section's deck-slab region (default when it has one) or everything above a depth",
                        "enum": ["extras", "depth"]
                      }
                    },
                    "type": "object"
                  },
                  "datum": {
                    "enum": ["bc", "bl", "tc"]
                  },
                  "duct": {
                    "description": "post-tensioning duct diameter, mm",
                    "type": "number"
                  },
                  "ductType": {
                    "enum": ["metal", "plastic"]
                  },
                  "fckt": {
                    "description": "f_ck at transfer (default 0.7 f_ck)",
                    "type": "number"
                  },
                  "fp01k": {
                    "type": "number"
                  },
                  "fpk": {
                    "type": "number"
                  },
                  "k6": {
                    "type": "boolean"
                  },
                  "lossPercent": {
                    "description": "time-dependent losses, % (default 15)",
                    "type": "number"
                  },
                  "method": {
                    "enum": ["pre", "post"]
                  },
                  "points": {
                    "description": "extra stress points 'y z [label]'",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
