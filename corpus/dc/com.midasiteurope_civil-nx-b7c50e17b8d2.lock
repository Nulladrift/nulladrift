        {
          "name": "construction_stages",
          "title": "Construction Stage Wizard — stage sequence",
          "description": "Builds a construction stage sequence with the Construction Stage Wizard plugin's bulk generator and writes it with its stage planner (which keeps composite sections and construction-stage load combinations intact, rewriting and restoring them when CIVIL NX would otherwise delete them). Structure groups are activated in order, groupsPerStage at a time; boundary and load groups (e.g. supports, self weight) ride in the first new stage; an optional temporary group per stage (e.g. a form traveller) is switched on and off with it; an optional final stage closes the sequence. mode 'append' adds after the model's existing stages; 'replace' replaces them all. Every stage is validated against the model's groups first. Previews unless apply: true; the write keeps a snapshot for stages_undo.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age": {
                "description": "Material age at activation, days; null follows the stage duration.",
                "type": ["number", "null"]
              },
              "apply": {
                "default": false,
                "description": "Write to CIVIL NX. Only after the user approved the preview.",
                "type": "boolean"
              },
              "boundaryGroups": {
                "description": "Boundary groups activated in the first new stage (deformed position).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "confirmPlanHash": {
                "description": "planHash from the approved preview; the write is refused if the plan differs.",
                "type": "string"
              },
              "durations": {
                "description": "Days per stage; several values repeat as a pattern (e.g. [7, 7, 14]). Default [7].",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "finalStage": {
                "additionalProperties": true,
                "description": "{name, duration, steps}: a closing stage, e.g. long-term with time steps.",
                "type": "object"
              },
              "groupPrefix": {
                "description": "Instead of groups: every structure group whose name starts with this, in natural order (Seg_2 before Seg_10).",
                "type": "string"
              },
              "groups": {
                "description": "Structure groups in construction order.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "groupsPerStage": {
                "default": 1,
                "minimum": 1,
                "type": "integer"
              },
              "loadGroups": {
                "description": "Load groups activated in the first new stage (e.g. self weight).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "mode": {
                "default": "append",
                "enum": ["append", "replace"]
              },
              "naming": {
                "additionalProperties": true,
