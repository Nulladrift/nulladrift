        {
          "name": "cs_stage_report",
          "title": "Construction Stage Reporter — Excel / PDF report",
          "description": "Makes the Construction Stage Reporter plugin's own reports of the open model's construction stages and returns download links (never the file inline): the Excel workbook (summary, stage matrices for structure/boundary/load groups, group tables, stage details, composite sections, displacements, beam results, warnings) and the A4 PDF (cover, summary, matrices, one page per stage with a picture of CIVIL NX's own view of that stage from /view/CAPTURE, and the warnings). Construction-stage displacements (series, default Summation) are included when the analysis has been run; members (as cs_stage_results) adds one beam result component. The MP4 animation is not available here — use the plugin in CIVIL NX. Read-only, but the pictures make CIVIL NX show each stage in turn. Runs as a job.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "displacements": {
                "default": true,
                "type": "boolean"
              },
              "formats": {
                "description": "Default both.",
                "items": {
                  "enum": ["xlsx", "pdf"]
                },
                "type": "array"
              },
              "includeLoads": {
                "default": true,
                "description": "Include the load group matrix and load columns.",
                "type": "boolean"
              },
              "maxSnapshots": {
                "default": 60,
                "description": "With more stages than this, pictures for this many evenly spread stages.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "members": {
                "additionalProperties": false,
                "description": "Beam results of chosen members: {groups:[structure group names]} and/or {elements:[ids]} (only TYPE BEAM elements count), table 'BEAMFORCE' (default) or 'BEAMSTRESS', component (default Moment-y for forces, Cb(min/max) for stresses; heads such as Axial, Shear-z, Moment-y, Bend(+z), Cb1(-y+z), or short names My, Mz, Fx, Fz), part 'gov' (default: on composite members the governing section part at each position) or 1–4 (1 = girder, 2 = slab), series (default Summation). Composite members' stresses are read per section part (COMPSECTBEAMSTRESS), as the plugin does.",
                "properties": {
                  "component": {
                    "type": "string"
                  },
                  "elements": {
                    "items": {
                      "type": "integer"
                    },
                    "type": "array"
                  },
                  "groups": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "part": {
                    "default": "gov",
                    "type": ["string", "integer"]
                  },
                  "series": {
                    "default": "Summation",
                    "type": "string"
                  },
                  "table": {
                    "default": "BEAMFORCE",
                    "enum": ["BEAMFORCE", "BEAMSTRESS"]
                  }
                },
                "type": "object"
              },
              "program": {
                "description": "Program name printed on the reports, when CIVIL NX does not report its version.",
                "type": "string"
              },
              "series": {
                "default": "Summation",
                "type": "string"
              },
              "snapshots": {
                "default": true,
                "description": "A picture per stage in the PDF from CIVIL NX (/view/CAPTURE).",
                "type": "boolean"
              },
              "view": {
                "default": "iso",
                "enum": ["iso", "plan", "elevation", "side"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3db415294369e00875b1bd47759b9eb3772a5cbba1951adfa6fe9107b7753ba5"
        },
        {
          "name": "cs_stage_results",
          "title": "Construction Stage Reporter — construction-stage results",
          "description": "Reads construction-stage analysis results the way the Construction Stage Reporter plugin does (POST /post/TABLE in the construction-stage family, every stage in one query at its last step; stages after the analysis stopped carry the stage before and are flagged published:false). displacements (default on): per stage the largest resultant |D| over all nodes, its node and DX/DY/DZ, in mm; nodes:[ids] adds those nodes' displacements per stage. members: beam forces or stresses of chosen beams — per stage the max/min of a component over the beams active in it, with element, output position (I…J) and section part; detailElements:[ids] (≤20) adds the values along those beams. Units are the model's (forces/moments) and mm (displacements). series is a construction-stage result series (default Summation; listSeries: true lists what the model publishes, e.g. Dead Load, Tendon Primary, Creep Secondary). Needs a construction-stage analysis already run in CIVIL NX. Read-only; may take a minute on big models.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "displacements": {
                "default": true,
                "type": "boolean"
              },
              "listSeries": {
                "default": false,
                "description": "Also list the construction-stage series the model publishes.",
                "type": "boolean"
              },
              "members": {
                "additionalProperties": false,
                "description": "Beam results of chosen members: {groups:[structure group names]} and/or {elements:[ids]} (only TYPE BEAM elements count), table 'BEAMFORCE' (default) or 'BEAMSTRESS', component (default Moment-y for forces, Cb(min/max) for stresses; heads such as Axial, Shear-z, Moment-y, Bend(+z), Cb1(-y+z), or short names My, Mz, Fx, Fz), part 'gov' (default: on composite members the governing section part at each position) or 1–4 (1 = girder, 2 = slab), series (default Summation). Composite members' stresses are read per section part (COMPSECTBEAMSTRESS), as the plugin does.",
                "properties": {
                  "component": {
                    "type": "string"
                  },
                  "components": {
                    "description": "Several components at once (instead of component).",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "detailElements": {
                    "items": {
                      "type": "integer"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  "elements": {
                    "items": {
                      "type": "integer"
                    },
                    "type": "array"
                  },
                  "groups": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "part": {
                    "default": "gov",
                    "type": ["string", "integer"]
                  },
                  "series": {
                    "default": "Summation",
                    "type": "string"
                  },
                  "table": {
