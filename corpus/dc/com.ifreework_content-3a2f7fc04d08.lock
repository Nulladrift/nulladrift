      "instructions": "Public server of ifreework.com, the site of Andrey Zubar (senior backend and AI developer). No authentication is needed. It exposes four sections in Russian (lang=ru, default) and English (lang=en): About (get_about), Services (list_services/get_service), Portfolio of completed projects (list_portfolio/get_portfolio_item) and Blog articles (list_blog_posts/get_blog_post). Use search_content to find pages by topic. Every result carries a canonical url; cite it when answering. Content comes from published pages only; do not infer facts that are not in it. All content and contact tools are read-only. send_message is the only side-effecting tool: it delivers a message to the owner through the site's contact form. Call it only after the human user has approved the exact text and reply-to e-mail (confirmed_by_user=true); never on your own initiative and never with secrets.",
