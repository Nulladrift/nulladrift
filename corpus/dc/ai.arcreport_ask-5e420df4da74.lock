            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:34d486863490af5b9ee97d5e8f1988d1c89d857ef28954e6f872aca9fe6e68d9"
        },
        {
          "name": "store_record",
          "title": "Store record",
          "description": "Call this when a user asks what ARC recorded for a store, or you need the citable store page. Returns the store page's verdict, checked_at (the day of the check), stale, category, tried (ARC's standard shoppers' newest dated run, or \"Not measured\"), the recorded fix, payment_methods_declared (as on before_checkout; null with payment_methods_note when ARC has no UCP profile reading, which is not a no), record_url (claimed, served, date, method and product_markup as JSON) and links to the page, its JSON and Markdown. Example: store_record({\"store\":\"allbirds.com\"}) → {\"verdict\":\"…\",\"page_url\":\"https://www.arcreport.ai/stores/allbirds.com\",…}. Reads the published snapshot behind /stores/<host>. Saved checks only: no store fetch, no scan, no login. Advisory; ARC stops before payment. Every answer carries checked_at (the saved check it rests on; for a list, the oldest) and stale (true when that check is 24 hours old or older, or has no time). Errors: {error:{code, message, next_step}}.",
