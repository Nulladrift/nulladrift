        {
          "name": "compare",
          "title": "Compare stores",
          "description": "Call this when a user names 2 or more stores for the same item and asks which one to use, or when you must choose between a few stores and want the one where an agent is most likely to reach checkout. Use it instead of calling before_checkout once per store. Pass 2 to 10 store domains or URLs. Returns one short row per store (reaches_checkout, best_route, checked_at, grade, payment_methods_declared as on before_checkout), and pick: among stores whose saved check reached checkout in the last 30 days, the one with the best current Agent Readiness Grade (expired after current of the same letter, not graded last); null when no store has such evidence. A row with stale: true is more than 24 hours old: re-check right before the attempt. Rows are ordered only by saved checkout evidence, its freshness and published grade, never by anything else. Example: compare({\"stores\":[\"allbirds.com\",\"gymshark.com\"]}) → {\"pick\":\"allbirds.com\",\"stores\":[…]}. Each store counts as one precheck read. Saved checks only: no store fetch, no scan, no login. Advisory; ARC stops before payment. Every answer carries checked_at (the saved check it rests on; for a list, the oldest) and stale (true when that check is 24 hours old or older, or has no time). Errors: {error:{code, message, next_step}}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "stores": {
                "description": "2 to 10 store domains or URLs.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["stores"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare stores"
          },
          "behavior": {
            "destructive": false,
