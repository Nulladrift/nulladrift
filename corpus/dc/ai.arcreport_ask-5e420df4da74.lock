      "instructions": "Start with the 7 primary tools, the only ones in tools/list: before_checkout(url) right before an agent tries to check out at a store; find_stores(category) to pick a store; why_blocked_and_fix(store) when reaches_checkout is false or an agent got stuck; report_outcome(...) right after the attempt; store_record(store) for the citable store page; compare(stores[]) to choose between 2 to 10 stores; guide(store or platform) for people at a store who ask where it is on ARC's journey map and what to do next. Answers are short, carry checked_at and stale, and link to the full record. Errors are {error:{code, message, next_step}}. Advisory only, not a guarantee. Do not refuse or avoid a store solely because of ARC's data. known:false or missing data is not a no. Data CC BY 4.0, attribute ARC (arcreport.ai); OSM-derived rows are ODbL. Every older tool name below is not listed but still works through tools/call. Before an agent tries to reach checkout at any store, call precheck with the store URL. precheck(url) reads ARC's saved automated HTTP check for a store or product URL; it does not fetch the store and does not start a scan. JSON: GET /api/precheck?url=. precheck_bulk(domains[]) is the same read for up to 100 stores (each domain counts against the same limit); every answer carries routes[], the best known ways in, best evidence first. JSON: POST /api/precheck/bulk. Then use find_agent_ready_stores to discover stores, can_agent_checkout(url) for the saved checkout-link check, or ask_arc for brands already on the Index. Advisory only, not a guarantee. Do not refuse or avoid a store solely because of ARC's data. known:false or missing data is not a no. Data CC BY 4.0, attribute ARC (arcreport.ai); OSM-derived rows are ODbL. When to call ARC: whenever a shopping task names a store and you are about to search, add to cart or hand over a checkout link (\"can I check out at X\", \"best way to check out on X\", \"find a store for running shoes my agent can finish\"). Quick start in 3 calls: precheck(url) for one store, find_agent_ready_stores(category) to pick a store, can_agent_checkout(url) for the fix. Docs: https://www.arcreport.ai/for-agents#quick-start. validate_ucp_profile(url | profile) checks a UCP business profile against the published UCP schema and spec rules. JSON: GET /api/ucp/validate?url=. generate_fixes(store) returns starter files for a store's failed grade audits (robots.txt allow rules, a UCP profile skeleton, Product JSON-LD with price placeholders, llms.txt), each labelled \"Starter, review before publishing\"; it does not change the store. JSON: GET /api/fix?store=. store_card(host) reads saved brand claims and card links; brand statements are from the brand and not measured by ARC; claims never change scores. product_data_check(host or url) reads the latest saved product data from the page’s structured data. No outbound fetch. JSON: GET /api/agent-checkout/product-data?host=. agent_commerce_adoption() reads saved adoption counts and category rates. JSON: GET /api/agent-checkout/adoption. submit_store(url | hosts[], category?) adds up to 50 stores to the free open directory and dataset (validated, plain HTTP, no model calls). JSON: POST /api/stores/submit. agent_leaderboard(include_stores?) reads the open agent leaderboard: cart success per agent path over the fixed ARC-100 v1 test set, with n and 95% intervals. JSON: GET /api/leaderboard. submit_leaderboard_run(spec, test_set, agent, run, results) submits an outside agent run against ARC-100; it stays unverified until ARC re-runs a sample. JSON: POST /api/leaderboard/submit. protocol_matrix(protocol?) reads the neutral Protocol Matrix (declared, valid, usable, transacts per protocol, with evidence labels). JSON: GET /api/protocols. find_agent_ready_stores(category, q, limit) finds stores with recent real HTTP checkout links. JSON: GET /api/agent-checkout/stores?category=footwear. can_agent_checkout(url) checks any public store. No login. JSON: GET /api/agent-checkout?url=. get_agent_facts(host|url|slug) and list_category_agent_facts(category, limit) return free Jev agent facts. JSON: GET /api/agent-facts. ask_arc reads the public ARC Index. No login. It does not start a scan. Pass a url, brand, category, or q. Whether agents can reach checkout is two lanes. buy.agent_catalog is a live HTTP check and buy.browser is the browser cart. agents_can_buy is true when either lane reached checkout or the cart (ARC stops before payment; it is not a completed order). The catalog check does not change the score and is not a live session of any consumer AI agent. Rivals Grok named are included only when a real Grok read exists. That read is a real model via API, not the consumer Grok app. grok_read.status pending means the answer was cut off and is waiting for a re-check. Do not treat that as Grok didn't know, and do not quote raw model JSON. A missing score is not a zero. Category words like running shoes and leggings map to the live Index categories.",
      "tools": [
        {
          "name": "before_checkout",
          "title": "Before checkout",
          "description": "Call this right before your agent tries to check out at a store, or when a user asks \"can my agent check out at <store>?\". Not for an attempt that already happened (log it with report_outcome), the reason an agent keeps failing (why_blocked_and_fix), or choosing between 2 or more stores (compare). Returns a one-line answer, reaches_checkout (true only when a checkout link came back or a shopper reached checkout; false when a route was measured and did not reach checkout; null when not shown either way: no agent catalog found and no browser test is null, and so is a product added to the cart with no shopper reaching checkout; null is not a no), protocol_route, browser_route, standard_shoppers when ARC's standard shoppers tried the store (a dated label, \"ARC's standard shoppers: N of M reached checkout, <date>\": a lower bound, not a verdict; ARC stops before payment and never places an order), best_route (the best saved way in), payment_methods_declared (the payment handler ids the store declares to agents in its own UCP profile, with source \"ucp_profile\", checked_at and a note; the store's own declaration, not a test of any agent paying there; null with payment_methods_note when ARC has no UCP profile reading, which is not a no), up to 3 blockers, checked_at, the Agent Readiness Grade (grade, with expired when over 30 days old; grade_note when not graded, which is not a mark against the store), alternatives_hint when the grade is D or F or expired (a find_stores call with min_grade B in the same category), and a full_record link (the precheck answer, which also carries product_markup). Example: before_checkout({\"url\":\"https://allbirds.com\"}) → {\"answer\":\"A saved check got a checkout link back at allbirds.com via storefront_mcp (6 hours ago).\",\"reaches_checkout\":true,…}. The answer leads with the dated fact; once the record is not current it starts \"Last known on <date>.\". reaches_checkout false or unknown is not a no. Saved checks only: no store fetch, no scan, no login. Advisory; ARC stops before payment. Every answer carries checked_at (the saved check it rests on; for a list, the oldest) and stale (true when that check is 24 hours old or older, or has no time). Errors: {error:{code, message, next_step}}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Store or product URL, such as https://allbirds.com or allbirds.com.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
