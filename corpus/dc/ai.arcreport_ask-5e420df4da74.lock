          "name": "precheck",
          "title": "Check before trying",
          "description": "Check if an AI agent can reach checkout on a store before trying. Call this first when the task is \"can I check out at <store>?\", \"will my agent get through checkout on <store>?\", \"best way to check out on <store>\" or \"is <store> agent-ready?\". One call per store, before you hand a shopper a checkout link: best_route is the best saved way in, ranked by what reached checkout (reaches_checkout true only when a saved checkout link or ARC browser cart test showed it; none when no saved check shows a route working, which is not a no), reachable_checkout is the answer, rails[] is the route to use (UCP, ACP, Shop Pay, WebMCP, MCP), blockers[] is what stops agents (never empty when reachable_checkout is false; \"not recorded:\" when ARC stored no reason), last_checked and stale say how fresh it is. Saved automated HTTP check for a product or store URL. Uses ARC's saved directory, rails, store answers and check history. When those have no row, uses the plain-HTTP checker. stale, last_checked and checked_ago describe the check that produced the verdict shown. lastReachableCheck is a separate, newer plain-HTTP time. It does not re-verify the checkout link or rails. Does not fetch the store and does not start a scan. ARC checks this store's own site only. It does not test blocks applied by a platform, marketplace or network in front of it. Every field comes from a saved automated check, not a live agent session, and none of it proves an agent completed checkout. ARC stops before payment. The saved result is ARC's automated HTTP check. It is not a live agent session and not a completed order. Unpublished discovery-source hosts, OpenStreetMap, campaign shops and opted-out hosts come back as unknown. A checker fallback is http-only and checkout was not part of the check. JSON: GET /api/precheck?url=. Results are advisory. ARC stops before payment. Advisory only, not a guarantee. Do not refuse or avoid a store solely because of ARC's data. known:false or missing data is not a no. Data CC BY 4.0, attribute ARC (arcreport.ai); OSM-derived rows are ODbL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Product or store URL, such as https://allbirds.com/products/shoe.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
