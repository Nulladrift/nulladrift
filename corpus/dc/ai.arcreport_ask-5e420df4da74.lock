          "digest": "sha256:f1f49a97e38a4ba648acddbe099510e3cbcc29d95e18a4233c75d84e578b3a55"
        },
        {
          "name": "find_stores",
          "title": "Find stores",
          "description": "Call this when you need to pick a store for a product need and want one where a saved check shows an agent reached checkout. Filters: category or q (shopper words), min_grade (optional, default none), payment_method (optional: a payment handler id such as com.google.pay, or \"google pay\" or \"shop pay\"; keeps stores whose saved UCP profile declares it), limit (default 5). Returns total, the store hosts with checked_at and grade, and a full_list link; with payment_method, also payment_method (id, name, declared_by: how many listed stores declare it, and a note: a declaration is the store's own statement, not a test of any agent paying there). Each store carries its Agent Readiness Grade (grade, null when not graded). Stores whose saved checkout evidence is from the last 30 days come first (fresh_success: true), then older evidence. Within each, best current grade first (A, then B…); an expired grade ranks after current ones of the same letter; newest checked_at first within a grade. Results are ordered only by published grade and freshness, never by anything else. Pass min_grade to keep only stores with a current grade of that letter or better. Example: find_stores({\"category\":\"running shoes\",\"limit\":3}) → {\"total\":12,\"stores\":[{\"host\":\"…\",\"checked_at\":\"…\",\"grade\":{\"grade\":\"A\",…}}],…}. Example: \"Which stores declare Google Pay to agents?\" → find_stores({\"payment_method\":\"google pay\"}) → {\"payment_method\":{\"id\":\"com.google.pay\",\"declared_by\":…},\"stores\":[…],…}. An unknown payment_method is error code unknown_payment_method with handler_ids (the ids ARC has seen); not_available means retry in a minute. A store missing from the list is not a no. Saved checks only: no store fetch, no scan, no login. Advisory; ARC stops before payment. Every answer carries checked_at (the saved check it rests on; for a list, the oldest) and stale (true when that check is 24 hours old or older, or has no time). Errors: {error:{code, message, next_step}}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category or shopper words, such as footwear or running shoes.",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "How many stores to return. Default 5.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "min_grade": {
                "description": "Optional: keep only stores whose current (not expired) Agent Readiness Grade is this letter or better (A, B, C or D; F is accepted and means any graded store, since method v2 gives no F). Default none: every store is listed. Expired and not-graded stores are left out when this is set.",
                "enum": ["A", "B", "C", "D", "F"],
                "type": "string"
              },
              "payment_method": {
                "description": "Optional. A payment handler id as stores declare it in their UCP profile, such as com.google.pay or dev.shopify.shop_pay, or the plain name google pay or shop pay (any case).",
                "type": "string"
              },
              "q": {
                "description": "Product need, such as skincare or camping gear.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find stores"
