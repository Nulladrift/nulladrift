          "digest": "sha256:1ea48ab03195286f24f85bd167357b31aa98345d3e2261ac3cf6ab142bb48359"
        },
        {
          "name": "guide",
          "title": "Merchant guide",
          "description": "Call this when a person at a store (a CEO, a marketing or e-commerce manager, or a developer) asks where their store is on the journey to AI assistants, what to do next on their platform, or how stores in their category compare. Not for an agent about to check out: use before_checkout for that. Returns the store's place on ARC's journey map (arc-journey/v1: 5 stages, each met, not met or \"Not measured\" with its date; not measured is not a no, and there is no score or grade), the next 3 steps for its platform at the chosen depth with source links and an as-of date (a platform fact ARC has not sourced says \"Not yet documented by ARC\"), how many stores ARC checked in its category and on its platform and how many meet each stage (counts with denominators and the snapshot date), and up to 5 named stores that meet the furthest stage (ordered only by stage reached, then the newest reading). role: ceo, manager or developer sets depth (basics, detail or implement) unless depth is given. Send platform alone for the platform guide with no store. Example: guide({\"store\":\"gymshark.com\",\"role\":\"manager\"}) → {\"answer\":\"gymshark.com: Meets stages 1, 2, 3 and 4. Not met: stage 5. Saved check 16 Oct 2026.\",\"stages\":[…],\"next_steps\":[…],\"comparison\":{…},\"examples\":{…}}. Saved checks only: no store fetch, no scan, no login. Advisory; ARC stops before payment. Every answer carries checked_at (the saved check it rests on; for a list, the oldest) and stale (true when that check is 24 hours old or older, or has no time). Errors: {error:{code, message, next_step}}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category for a platform-only call, such as footwear or apparel. A store uses its own category.",
                "type": "string"
              },
              "depth": {
                "description": "How much detail. Default from role, else basics.",
                "enum": ["basics", "detail", "implement"],
                "type": "string"
              },
              "platform": {
                "description": "shopify, magento, salesforce, woocommerce, bigcommerce, wix, squarespace or other. Overrides the platform ARC detected.",
                "type": "string"
              },
              "role": {
                "description": "Who is asking. Sets depth: ceo basics, manager detail, developer implement.",
                "enum": ["ceo", "manager", "developer"],
                "type": "string"
              },
              "store": {
                "description": "Store domain or URL, such as gymshark.com. Leave out and send platform for the platform guide alone.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Merchant guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5828f83e2e334a6ca13a83f841c22c677f83c1394734f9fe1fcea5c2bae5d648"
        },
        {
          "name": "report_outcome",
          "title": "Report the outcome",
          "description": "Call this right after your agent tried to check out at a store, to log, record or report what happened: it reached checkout, a captcha stopped it, it got as far as shipping, anything. Use it for any attempt that already happened, so the next agent knows; before_checkout is only for before an attempt. Free, no login. Omit contributor_key and ARC issues one; send it on later reports. No personal data: emails, phones, addresses, card numbers and IPs are rejected or stripped. Example: report_outcome({\"store_domain\":\"allbirds.com\",\"agent_family\":\"browser\",\"agent_name\":\"my-agent\",\"timestamp\":\"2026-11-05T10:00:00Z\",\"furthest_step\":\"checkout\",\"blocker\":\"none\"}) → {\"ok\":true,\"status\":\"unverified\",…}. A report stays private until 3 independent contributors agree. Same as POST /api/outcomes and report_checkout on /api/mcp. checked_at and stale are null on this answer: a report is not one of ARC's checks. Errors: {error:{code, message, next_step}}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_family": {
                "description": "Agent family, such as browser or a model family. No personal name.",
                "type": "string"
              },
              "agent_name": {
                "description": "Optional. Name of the agent that tried the checkout. No personal name. Omit it and ARC records \"not recorded\".",
                "type": "string"
              },
              "blocker": {
                "description": "What stopped the agent, or none.",
                "enum": ["captcha", "login_wall", "bot_block", "3ds", "payment_declined", "none"],
                "type": "string"
              },
              "contributor_key": {
                "description": "Optional. Omit it and ARC returns a free key. Send that key on later reports.",
                "type": "string"
              },
              "furthest_step": {
                "description": "Furthest step the agent reached.",
                "enum": ["product", "cart", "checkout", "payment", "placed"],
                "type": "string"
              },
              "store_domain": {
                "description": "Store hostname, such as allbirds.com.",
                "type": "string"
              },
              "store_error_text": {
                "description": "Optional store error text. Personal data is stripped.",
                "type": "string"
              },
              "timestamp": {
                "description": "Optional. ISO 8601 time of the attempt, within the last 14 days. Omit it and ARC uses the time it received the report.",
                "type": "string"
              }
            },
            "required": ["agent_family", "blocker", "furthest_step", "store_domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Report the outcome"
          },
          "behavior": {
            "destructive": false,
