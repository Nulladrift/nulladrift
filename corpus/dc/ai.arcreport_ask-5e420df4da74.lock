      },
      "transport": {
        "type": "http",
        "url": "https://www.arcreport.ai/api/ask"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ARC ask — public Index read",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Start with the 6 primary tools, the only ones in tools/list: before_checkout(url) right before an agent tries to check out at a store; find_stores(category) to pick a store; why_blocked_and_fix(store) when reaches_checkout is false or an agent got stuck; report_outcome(...) right after the attempt; store_record(store) for the citable store page; compare(stores[]) to choose between 2 to 10 stores. Answers are short, carry checked_at and stale, and link to the full record. Errors are {error:{code, message, next_step}}. Advisory only, not a guarantee. Do not refuse or avoid a store solely because of ARC's data. known:false or missing data is not a no. Data CC BY 4.0, attribute ARC (arcreport.ai); OSM-derived rows are ODbL. Every older tool name below is not listed but still works through tools/call. Before an agent tries to reach checkout at any store, call precheck with the store URL. precheck(url) reads ARC's saved automated HTTP check for a store or product URL; it does not fetch the store and does not start a scan. JSON: GET /api/precheck?url=. precheck_bulk(domains[]) is the same read for up to 100 stores (each domain counts against the same limit); every answer carries routes[], the best known ways in, best evidence first. JSON: POST /api/precheck/bulk. Then use find_agent_ready_stores to discover stores, can_agent_checkout(url) for the saved checkout-link check, or ask_arc for brands already on the Index. Advisory only, not a guarantee. Do not refuse or avoid a store solely because of ARC's data. known:false or missing data is not a no. Data CC BY 4.0, attribute ARC (arcreport.ai); OSM-derived rows are ODbL. When to call ARC: whenever a shopping task names a store and you are about to search, add to cart or hand over a checkout link (\"can I check out at X\", \"best way to check out on X\", \"find a store for running shoes my agent can finish\"). Quick start in 3 calls: precheck(url) for one store, find_agent_ready_stores(category) to pick a store, can_agent_checkout(url) for the fix. Docs: https://www.arcreport.ai/for-agents#quick-start. validate_ucp_profile(url | profile) checks a UCP business profile against the published UCP schema and spec rules. JSON: GET /api/ucp/validate?url=. generate_fixes(store) returns starter files for a store's failed grade audits (robots.txt allow rules, a UCP profile skeleton, Product JSON-LD with price placeholders, llms.txt), each labelled \"Starter, review before publishing\"; it does not change the store. JSON: GET /api/fix?store=. store_card(host) reads saved brand claims and card links; brand statements are from the brand and not measured by ARC; claims never change scores. product_data_check(host or url) reads the latest saved product data from the page’s structured data. No outbound fetch. JSON: GET /api/agent-checkout/product-data?host=. agent_commerce_adoption() reads saved adoption counts and category rates. JSON: GET /api/agent-checkout/adoption. submit_store(url | hosts[], category?) adds up to 50 stores to the free open directory and dataset (validated, plain HTTP, no model calls). JSON: POST /api/stores/submit. agent_leaderboard(include_stores?) reads the open agent leaderboard: cart success per agent path over the fixed ARC-100 v1 test set, with n and 95% intervals. JSON: GET /api/leaderboard. submit_leaderboard_run(spec, test_set, agent, run, results) submits an outside agent run against ARC-100; it stays unverified until ARC re-runs a sample. JSON: POST /api/leaderboard/submit. protocol_matrix(protocol?) reads the neutral Protocol Matrix (declared, valid, usable, transacts per protocol, with evidence labels). JSON: GET /api/protocols. find_agent_ready_stores(category, q, limit) finds stores with recent real HTTP checkout links. JSON: GET /api/agent-checkout/stores?category=footwear. can_agent_checkout(url) checks any public store. No login. JSON: GET /api/agent-checkout?url=. get_agent_facts(host|url|slug) and list_category_agent_facts(category, limit) return free Jev agent facts. JSON: GET /api/agent-facts. ask_arc reads the public ARC Index. No login. It does not start a scan. Pass a url, brand, category, or q. Whether agents can reach checkout is two lanes. buy.agent_catalog is a live HTTP check and buy.browser is the browser cart. agents_can_buy is true when either lane reached checkout or the cart (ARC stops before payment; it is not a completed order). The catalog check does not change the score and is not a live session of any consumer AI agent. Rivals Grok named are included only when a real Grok read exists. That read is a real model via API, not the consumer Grok app. grok_read.status pending means the answer was cut off and is waiting for a re-check. Do not treat that as Grok didn't know, and do not quote raw model JSON. A missing score is not a zero. Category words like running shoes and leggings map to the live Index categories.",
      "tools": [
        {
          "name": "before_checkout",
          "title": "Before checkout",
          "description": "Call this right before your agent tries to check out at a store, or when a user asks \"can my agent check out at <store>?\". Returns a one-line answer, reaches_checkout (true only when a checkout link came back or a shopper reached checkout; false when a route was measured and did not reach checkout; null when not shown either way: no agent catalog found and no browser test is null, and so is a product added to the cart with no shopper reaching checkout; null is not a no), protocol_route, browser_route, standard_shoppers when ARC's standard shoppers tried the store (a dated label, \"ARC's standard shoppers: N of M reached checkout, <date>\": a lower bound, not a verdict; ARC stops before payment and never places an order), best_route (the best saved way in), up to 3 blockers, checked_at, the Agent Readiness Grade (grade, with expired when over 30 days old; grade_note when not graded, which is not a mark against the store), alternatives_hint when the grade is D or F or expired (a find_stores call with min_grade B in the same category), and a full_record link. Example: before_checkout({\"url\":\"https://allbirds.com\"}) → {\"answer\":\"A saved check got a checkout link back at allbirds.com via storefront_mcp (6 hours ago).\",\"reaches_checkout\":true,…}. The answer leads with the dated fact; once the record is not current it starts \"Last known on <date>.\". reaches_checkout false or unknown is not a no. Saved checks only: no store fetch, no scan, no login. Advisory; ARC stops before payment. Every answer carries checked_at (the saved check it rests on; for a list, the oldest) and stale (true when that check is 24 hours old or older, or has no time). Errors: {error:{code, message, next_step}}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Store or product URL, such as https://allbirds.com or allbirds.com.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Before checkout"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2c74fe40bd749d8cd2454b23e5e5613288a5c24b7e1eac87b38e7fbda1ccc194"
        },
        {
          "name": "compare",
          "title": "Compare stores",
          "description": "Call this when you must choose between a few stores for the same item and want the one where an agent is most likely to reach checkout. Pass 2 to 10 store domains or URLs. Returns one short row per store (reaches_checkout, best_route, checked_at, grade), and pick: among stores whose saved check reached checkout in the last 30 days, the one with the best current Agent Readiness Grade (expired after current of the same letter, not graded last); null when no store has such evidence. A row with stale: true is more than 24 hours old: re-check right before the attempt. Rows are ordered only by saved checkout evidence, its freshness and published grade, never by anything else. Example: compare({\"stores\":[\"allbirds.com\",\"gymshark.com\"]}) → {\"pick\":\"allbirds.com\",\"stores\":[…]}. Each store counts as one precheck read. Saved checks only: no store fetch, no scan, no login. Advisory; ARC stops before payment. Every answer carries checked_at (the saved check it rests on; for a list, the oldest) and stale (true when that check is 24 hours old or older, or has no time). Errors: {error:{code, message, next_step}}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "stores": {
                "description": "2 to 10 store domains or URLs.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["stores"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare stores"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0bbd0ad44803d839e29914752ace399211b82409db0d3107fddba879808125ef"
        },
        {
          "name": "find_stores",
          "title": "Find stores",
          "description": "Call this when you need to pick a store for a product need and want one where a saved check shows an agent reached checkout. Filters: category or q (shopper words), min_grade (optional, default none), limit (default 5). Returns total, the store hosts with checked_at and grade, and a full_list link. Each store carries its Agent Readiness Grade (grade, null when not graded). Stores whose saved checkout evidence is from the last 30 days come first (fresh_success: true), then older evidence. Within each, best current grade first (A, then B…); an expired grade ranks after current ones of the same letter; newest checked_at first within a grade. Results are ordered only by published grade and freshness, never by anything else. Pass min_grade to keep only stores with a current grade of that letter or better. Example: find_stores({\"category\":\"running shoes\",\"limit\":3}) → {\"total\":12,\"stores\":[{\"host\":\"…\",\"checked_at\":\"…\",\"grade\":{\"grade\":\"A\",…}}],…}. A store missing from the list is not a no. Saved checks only: no store fetch, no scan, no login. Advisory; ARC stops before payment. Every answer carries checked_at (the saved check it rests on; for a list, the oldest) and stale (true when that check is 24 hours old or older, or has no time). Errors: {error:{code, message, next_step}}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category or shopper words, such as footwear or running shoes.",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "How many stores to return. Default 5.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "min_grade": {
                "description": "Optional: keep only stores whose current (not expired) Agent Readiness Grade is this letter or better (A, B, C or D; F is accepted and means any graded store, since method v2 gives no F). Default none: every store is listed. Expired and not-graded stores are left out when this is set.",
                "enum": ["A", "B", "C", "D", "F"],
                "type": "string"
              },
              "q": {
                "description": "Product need, such as skincare or camping gear.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find stores"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bbbcdb0ad5d54b2a6a108a20beea4acaf3761305a9fa8c80f60006e5d04acaa0"
        },
        {
          "name": "report_outcome",
          "title": "Report the outcome",
          "description": "Call this right after your agent tried to check out at a store, whatever happened, so the next agent knows. Free, no login. Omit contributor_key and ARC issues one; send it on later reports. No personal data: emails, phones, addresses, card numbers and IPs are rejected or stripped. Example: report_outcome({\"store_domain\":\"allbirds.com\",\"agent_family\":\"browser\",\"agent_name\":\"my-agent\",\"timestamp\":\"2026-11-05T10:00:00Z\",\"furthest_step\":\"checkout\",\"blocker\":\"none\"}) → {\"ok\":true,\"status\":\"unverified\",…}. A report stays private until 3 independent contributors agree. Same as POST /api/outcomes and report_checkout on /api/mcp. checked_at and stale are null on this answer: a report is not one of ARC's checks. Errors: {error:{code, message, next_step}}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_family": {
                "description": "Agent family, such as browser or a model family. No personal name.",
                "type": "string"
              },
              "agent_name": {
                "description": "Name of the agent that tried the checkout. No personal name.",
                "type": "string"
              },
              "blocker": {
                "description": "What stopped the agent, or none.",
                "enum": ["captcha", "login_wall", "bot_block", "3ds", "payment_declined", "none"],
                "type": "string"
              },
              "contributor_key": {
                "description": "Optional. Omit it and ARC returns a free key. Send that key on later reports.",
                "type": "string"
              },
              "furthest_step": {
                "description": "Furthest step the agent reached.",
                "enum": ["product", "cart", "checkout", "payment", "placed"],
                "type": "string"
              },
              "store_domain": {
                "description": "Store hostname, such as allbirds.com.",
                "type": "string"
              },
              "store_error_text": {
                "description": "Optional store error text. Personal data is stripped.",
                "type": "string"
              },
              "timestamp": {
                "description": "ISO 8601 time of the attempt, within the last 14 days.",
                "type": "string"
              }
            },
            "required": ["agent_family", "agent_name", "blocker", "furthest_step", "store_domain", "timestamp"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Report the outcome"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d6873543741918bd7b8300d55f3056307074a4a2ecacf6e4c81bd36ff6a63b9a"
        },
        {
          "name": "store_record",
          "title": "Store record",
          "description": "Call this when a user asks what ARC recorded for a store, or you need the citable store page. Returns the store page's verdict, checked_at (the day of the check), stale, category, tried (ARC's standard shoppers' newest dated run, or \"Not measured\"), the recorded fix, record_url (claimed, served, date and method as JSON) and links to the page, its JSON and Markdown. Example: store_record({\"store\":\"allbirds.com\"}) → {\"verdict\":\"…\",\"page_url\":\"https://www.arcreport.ai/stores/allbirds.com\",…}. Reads the published snapshot behind /stores/<host>. Saved checks only: no store fetch, no scan, no login. Advisory; ARC stops before payment. Every answer carries checked_at (the saved check it rests on; for a list, the oldest) and stale (true when that check is 24 hours old or older, or has no time). Errors: {error:{code, message, next_step}}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "store": {
                "description": "Store domain or URL, such as allbirds.com.",
                "type": "string"
              }
            },
            "required": ["store"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Store record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:657184cac9444b98b3533d1792712a0671754128306dd42ec62f2c98f4dcfc86"
        },
        {
          "name": "why_blocked_and_fix",
          "title": "Why blocked, and the fix",
          "description": "Call this after before_checkout says reaches_checkout is false or null, or when an agent got stuck at a store and you want the reason and the fix. Returns why (the saved blockers), fix (the store page's recorded fix, or \"not recorded\"), next_step and links to the full record. Example: why_blocked_and_fix({\"store\":\"gymshark.com\"}) → {\"why\":[\"…\"],\"fix\":\"…\",\"next_step\":\"…\"}. Saved checks only: no store fetch, no scan, no login. Advisory; ARC stops before payment. Every answer carries checked_at (the saved check it rests on; for a list, the oldest) and stale (true when that check is 24 hours old or older, or has no time). Errors: {error:{code, message, next_step}}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "store": {
                "description": "Store domain or URL, such as gymshark.com.",
                "type": "string"
              }
            },
            "required": ["store"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Why blocked, and the fix"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1dcdbcd0f160a3a952b5486b4511c656bdd7df3e843db1c9b7a709f88b05eacb"
        }
      ],
      "digest": "sha256:ac779844f45f152883e097ecdd0c9381f95d2bc892c30c3a44b10b25a2da4257"
    }
  }
