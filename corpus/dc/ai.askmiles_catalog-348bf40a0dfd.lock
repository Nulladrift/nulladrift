{
  "lockfileVersion": 2,
  "subjects": {
    "ai.askmiles/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.askmiles.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2024-11-05", "2025-03-26", "2025-06-18", "2025-11-25", "2026-07-28"]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Miles' public credit-card catalog: every card open to new applicants, the transfer-partner graph, and Miles' own point valuations.\n\nThis is catalog data, not advice. It carries card facts — issuer, annual fee, network, foreign transaction fee, rewards currency, which statement credits, lounge networks and protections a card has. It does NOT carry earning rates by category, welcome-offer amounts, transfer ratios, bonus sizes, ongoing-value estimates, or application links, and it knows nothing about which cards anyone holds.\n\nSo: answer from what a tool returns, and when a question needs the parts that are absent, say they are not in this catalog rather than filling them in from memory. Card annual fees in particular have moved recently; use the number a tool returns, never a remembered one.\n\nPoint valuations are Miles' own estimates of what a point is worth, not market prices. Attribute them.",
      "tools": [
        {
          "name": "compare_card_facts",
          "title": "Compare cards side by side",
          "description": "The same catalog record for 2-5 cards at once, for comparing fees, networks and which benefits each carries. Card facts only — no earning rates, welcome-offer amounts, transfer ratios, or bonus sizes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "card_names": {
                "description": "Card names, matched loosely.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["card_names"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3fc853e42e0d5648e39e3bf216f015268582e954fd8789e7d8d2cd8ac5a5e346"
        },
        {
          "name": "estimate_point_value",
          "title": "What a point is worth",
          "description": "Miles' own estimate of a loyalty point's value in cents, optionally multiplied by a balance. Call with no arguments to list every program Miles values, with the exact spelling to use. These are Miles' estimates, not market prices — attribute them. Card facts only — no earning rates, welcome-offer amounts, transfer ratios, or bonus sizes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "points": {
                "description": "A balance to value, in points.",
                "type": "number"
              },
              "program": {
                "description": "Loyalty program, e.g. 'World of Hyatt'. Matched loosely. Omit to list all.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cca53a3e6b090812acda7b4c4dd90b9c607430c512339b17f5ad097e62ad551b"
        },
        {
          "name": "find_transfer_routes",
          "title": "Which transfer routes exist",
          "description": "Which loyalty programs a currency transfers to, or which currencies reach a destination, and whether a transfer bonus is running. This is the route graph only — it does not carry transfer ratios, bonus sizes, expiry dates, or which route is worth taking. Card facts only — no earning rates, welcome-offer amounts, transfer ratios, or bonus sizes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from_program": {
                "description": "Source currency, e.g. 'Chase Ultimate Rewards'.",
                "enum": ["Aer Lingus AerClub", "American Express Membership Rewards", "Bilt Rewards", "British Airways Club", "Capital One Miles", "Chase Ultimate Rewards", "Choice Privileges", "Citi ThankYou Rewards", "Club Iberia Plus", "Finnair Plus", "HSBC Rewards Points", "Loganair Loyalty", "Marriott Bonvoy", "Qatar Airways Privilege Club", "Rove Miles", "US Bank Altitude Points", "Virgin Atlantic Flying Club", "Virgin Red", "Wells Fargo Rewards", "Wyndham Rewards"],
                "type": "string"
              },
              "include_inactive": {
                "description": "Include routes that have been discontinued.",
                "type": "boolean"
              },
              "limit": {
                "description": "Routes to return. Default 100, maximum 200.",
                "type": "number"
              },
              "only_with_bonus": {
                "description": "Only routes with a transfer bonus running.",
                "type": "boolean"
              },
              "to_program": {
                "description": "Destination program, e.g. 'World of Hyatt'. Matched loosely; call with neither argument to list every source.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1a0c40ba5552b5a083341dd9359fdbae3ace9f7b213fdcfe20d485dcc0d9c3a1"
        },
        {
          "name": "get_card_facts",
          "title": "One card's catalog record",
          "description": "Everything the public catalog holds on one card: issuer, annual fee, network, foreign transaction fee, rewards currency, and the names of its statement credits, lounge networks and protections. Card name is matched loosely. Card facts only — no earning rates, welcome-offer amounts, transfer ratios, or bonus sizes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "card_name": {
                "description": "Card name, e.g. 'Amex Platinum' or 'Venture X'.",
                "type": "string"
              }
            },
            "required": ["card_name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fac8cdd708b24ea9bf31885ffb7a127cd61de1f1dd450f8dd06e6f6d2b4caf12"
        },
        {
          "name": "search_card_catalog",
          "title": "Search the card catalog",
          "description": "Find credit cards open to new applicants by issuer, annual fee, network, rewards currency, or a benefit they carry. Returns a short row per card; call get_card_facts for one card's full record. Card facts only — no earning rates, welcome-offer amounts, transfer ratios, or bonus sizes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "benefit": {
                "description": "Words to look for in a card's statement credits, lounge networks, or purchase/travel protections, e.g. 'Global Entry', 'Priority Pass', 'trip delay'.",
                "type": "string"
              },
              "card_type": {
                "description": "Personal or Business.",
                "enum": ["Business", "Personal"],
                "type": "string"
              },
              "has_free_night_certificate": {
                "description": "Only cards granting a free night certificate.",
                "type": "boolean"
              },
              "has_lounge_access": {
                "description": "Only cards carrying at least one lounge network.",
                "type": "boolean"
              },
              "issuer": {
                "description": "Exact issuer name.",
                "enum": ["American Express", "Bank of America", "Barclays", "BECU", "Capital One", "Chase", "Citi", "Column N.A.", "Comenity", "Discover", "Elan Financial Services", "Emigrant Bank", "First Bank & Trust", "First Electronic Bank", "FNBO", "Goldman Sachs", "HSBC", "Synchrony", "TD Bank", "UBS", "US Bank", "Wells Fargo"],
                "type": "string"
              },
              "limit": {
                "description": "Rows to return. Default 10, maximum 25.",
                "type": "number"
              },
              "max_annual_fee": {
                "description": "Highest annual fee in dollars, inclusive.",
                "type": "number"
              },
              "network": {
                "description": "Payment network.",
                "enum": ["American Express", "Discover", "Mastercard", "Visa"],
                "type": "string"
              },
              "no_foreign_transaction_fee": {
                "description": "Only cards with no foreign transaction fee.",
                "type": "boolean"
              },
              "rewards_currency": {
                "description": "Loyalty currency the card earns, e.g. 'Chase Ultimate Rewards'. Matched loosely.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5711b54c4fcc8e71f15dc0e5b1a154e5df76bf72053c7a6e30cf15a88ee769f7"
        }
      ],
      "digest": "sha256:d967a2df73db641cac03a50ad1d2b949270ebc9264bf7776f95f756b30bf551a"
    }
  }
}
