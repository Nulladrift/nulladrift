                "type": "object"
              },
              "record": {
                "description": "The record from the last Reading on these same two people, unchanged. Leave out on the first Reading.",
                "type": "string"
              },
              "user": {
                "description": "The person you work for.",
                "properties": {
                  "company": {
                    "maxLength": 150,
                    "type": "string"
                  },
                  "email": {
                    "description": "Ties the record to this pair. Never stored, never sent to an AI model.",
