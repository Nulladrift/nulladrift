      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "ARVX reads two people from the emails between them: the person you work for (user) and a person they work with (other). It returns colors area by area, up to three predictions, what moved since the last Reading on the pair, and up to two lines on what is acting on the other person this week.\n\nGetting access: a person must sign up, accept the terms and create the key. You cannot do it for them. If there is no key, call arvx_get_access and give the person the signup link.\n\nMemory of a pair: every Reading returns a sealed record. Save it exactly as returned, with the two people it belongs to, and send it as record in the next Reading on the same two people. If it is lost, the next Reading starts the pair over and loses what ARVX learned about them. ARVX keeps nothing, so the record exists only where you save it.\n\nExplaining a Reading to the person:\n- Show the statement line with every Reading.\n- Say what each color means for this exchange: green on target, yellow drifting, red off. Name the area in plain words (clarity, cadence, responsiveness, bench strength, meaningful moments).\n- Predictions are what ARVX expects next, based on what it sees today. Present them as expectations, with what to do if they happen.\n- Never turn a Reading into a score, a rating, a trait or a personality label on the other person, and never guess at sensitive matters about anyone (health, money, family, beliefs and the like).\n- The person decides what to say and do. Offer advice; leave the final call to them.\n\nRefusals: a refused Reading costs nothing and counts nothing. Pass the refusal sentence to the person as it is.",
      "tools": [
        {
          "name": "arvx_get_access",
          "description": "How to get access to ARVX: the signup link to give the person, what they must do themselves, the price, and how to add their key to this connector. Call this when there is no key, or when the person asks how to start. Costs nothing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:074dd2c62291fd21151e7a5cc10b353d0f214b36c3dd1d085d62ff0c18153c03"
        },
        {
          "name": "arvx_record_summary",
          "description": "When someone asks what is held about them: returns every item in a saved record in plain words. Needs the record and both people's emails. Never uses up a Reading; 10 a month per account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "other": {
                "properties": {
                  "email": {
                    "format": "email",
                    "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                    "type": "string"
                  }
                },
                "required": ["email"],
                "type": "object"
              },
              "reason": {
                "enum": ["access_request", "correction", "deletion_check"],
                "type": "string"
              },
              "record": {
                "type": "string"
              },
              "user": {
                "properties": {
                  "email": {
                    "format": "email",
                    "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                    "type": "string"
                  }
                },
                "required": ["email"],
                "type": "object"
              }
            },
            "required": ["other", "reason", "record", "user"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f5df6cc37d2ed118f07248382223267f0477700d29814f46b065b2bbef9c0409"
        },
        {
          "name": "arvx_run_reading",
          "description": "Run a Reading on two people from the emails between them. Send at least 3 emails written by the user and 3 by the other person, oldest first. From the second Reading on a pair, send the record from the last Reading exactly as it was returned. Costs one Reading (the first 3 are free). Save the record from the answer with this pair.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "emails": {
                "description": "Oldest first. Each person is read from their own latest 20 emails, the first 3,000 characters of each.",
                "items": {
                  "properties": {
                    "body": {
                      "maxLength": 20000,
                      "type": "string"
                    },
                    "from": {
                      "enum": ["user", "other"],
                      "type": "string"
                    },
                    "sentAt": {
                      "description": "Date and time sent, such as 2026-10-01T14:30:00Z.",
                      "type": "string"
                    }
                  },
                  "required": ["body", "from"],
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              },
              "other": {
                "description": "The person the user works with.",
                "properties": {
                  "city": {
                    "description": "With state, switches on severe weather warnings.",
                    "type": "string"
                  },
                  "company": {
                    "description": "Switches on company news.",
                    "maxLength": 150,
                    "type": "string"
                  },
                  "country": {
                    "const": "US",
                    "description": "ARVX reads people in the United States only. US switches on U.S. holidays.",
                    "type": "string"
                  },
                  "email": {
                    "description": "Ties the record to this pair. Never stored, never sent to an AI model.",
                    "format": "email",
                    "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 100,
                    "type": "string"
                  },
                  "scores": {
                    "description": "Only results from a personality assessment the person agreed to. At least 5 of the 9 traits, each 1 to 10. Never results collected for a hiring decision, and never clinical tests. Leave this out to have the person read from their emails.",
                    "properties": {
                      "disc": {
                        "properties": {
                          "calculativeness": {
                            "description": "DISC's C goes here.",
                            "maximum": 10,
                            "minimum": 1,
                            "type": "integer"
