                            "minimum": 1,
                            "type": "integer"
                          },
                          "extraversion": {
                            "maximum": 10,
                            "minimum": 1,
                            "type": "integer"
                          },
                          "openness": {
                            "maximum": 10,
                            "minimum": 1,
                            "type": "integer"
                          }
                        },
                        "type": "object"
                      }
                    },
                    "type": "object"
                  },
                  "state": {
                    "description": "Two-letter code, such as MI.",
                    "maxLength": 2,
                    "minLength": 2,
                    "type": "string"
                  },
                  "title": {
                    "maxLength": 150,
                    "type": "string"
