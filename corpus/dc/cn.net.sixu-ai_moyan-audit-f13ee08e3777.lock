{
  "lockfileVersion": 2,
  "subjects": {
    "cn.net.sixu-ai/moyan-audit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://aipay.sixu-ai.net.cn/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "moyan-audit",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "moyan_checkup",
          "description": "Full deterministic security audit of an AI-agent session record (25 checks, three-level verdict: verified / unverified / unknown, per-check evidence). Provide the record as {profile, responses}, or as {session: {profile, responses}}, or as {question: \"<session record JSON string>\"}. Never include passwords, private keys, seed phrases, or production credentials — such input is rejected before execution.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "profile": {
                "description": "Agent profile object of the session record.",
                "type": "object"
              },
              "question": {
                "description": "Session record as a JSON string (same form as the HTTP checkup endpoint).",
                "type": "string"
              },
              "responses": {
                "description": "Responses object of the session record, keyed by check id.",
                "type": "object"
              },
              "session": {
                "description": "Whole session record object ({profile, responses}).",
                "type": "object"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6cb74b5b9ba883ce6215397aa2fda0a536848a8ccc3b79627cdfbc81460be538"
        },
        {
          "name": "moyan_precheck",
          "description": "Single-event security pre-check from a free-text incident description (deterministic feature pre-check; patterns reported by the submitter are marked unverified, unaddressed categories unknown). If the description embeds a structured session record JSON, the full 25-check engine runs instead. Never include passwords, private keys, seed phrases, or production credentials — such input is rejected before execution.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "context": {
                "description": "Optional additional context.",
                "type": "string"
              },
              "endpoint": {
                "description": "Optional target endpoint involved.",
                "type": "string"
              },
              "text": {
                "description": "Free-text incident description.",
                "type": "string"
              },
              "title": {
                "description": "Optional incident title.",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fa65a20e28b2d0ceb989f65ce51864dab50a406e1c6dff0dc15cf8e46b16f124"
        }
      ],
      "digest": "sha256:5bcc9c85de90097ab5dd25b16e777fc797b0bd3b4f05767210e9fd9e07188492"
    }
  }
}
