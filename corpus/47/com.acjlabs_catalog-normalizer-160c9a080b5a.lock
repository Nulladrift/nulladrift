{
  "lockfileVersion": 2,
  "subjects": {
    "com.acjlabs/catalog-normalizer": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://catalog-normalizer.acjlabs.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "catalog-attribute-normalizer",
        "version": "0.2.0",
        "description": "Taxonomy-grounded catalog attribute normalizer — verified against the real Google Product Taxonomy, so it catches the plausible-but-wrong category IDs a generic LLM invents. Messy catalogs in; clean attributes, units, and grounded category mappings out.",
        "websiteUrl": "https://github.com/acjlabs/catalog-normalizer"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "normalize_catalog",
          "title": "Normalize Catalog",
          "description": "Normalizes a batch of catalog products (attribute canonicalization/extraction + category-path mapping into the requested target taxonomies: google, shopify, amazon). Returns one result per input product, same order: a NormalizedProduct on success, or { error, source_title } if that specific product's classification failed — one product's failure never voids the rest of the batch. attributes is keyed by a controlled vocabulary (size, color, material, gender, sleeve_length — unrecognized keys are dropped, not passed through under a model-chosen name) and each value carries provenance: \"canonicalized\" means it came from your own raw_attributes input for that product (deterministic cleanup only, no recall); \"extracted\" means the model inferred it from the title/description and it wasn't in your input — treat extracted values as a suggestion, not a confirmed fact about the product, the same way you'd treat a low-confidence category_paths entry. category_paths for google and shopify is retrieval-grounded against the real, current taxonomy files (not recalled from memory) — measured at 22/24 (91.7%) exact path+leaf_id matches on a 12-product evaluation set; amazon has no comparable public reference file, so it stays best-effort. Each entry's confidence (0-1) and leaf_id (null when not confident it matches a real node) are the honest signal regardless of taxonomy — treat a low-confidence or null-leaf_id result as a suggestion worth a quick human check, not a confirmed classification.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "products": {
                "items": {
                  "properties": {
                    "description": {
                      "maxLength": 5000,
                      "type": "string"
                    },
                    "raw_attributes": {
                      "additionalProperties": {
                        "maxLength": 1000,
                        "type": "string"
                      },
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "title": {
                      "maxLength": 500,
                      "type": "string"
                    }
                  },
                  "required": ["description", "raw_attributes", "title"],
                  "type": "object"
                },
                "maxItems": 200,
                "type": "array"
              },
              "target_taxonomies": {
                "items": {
                  "enum": ["google", "shopify", "amazon"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["products", "target_taxonomies"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "anyOf": [
                    {
                      "additionalProperties": false,
                      "properties": {
                        "attributes": {
                          "additionalProperties": false,
                          "properties": {
                            "color": {
                              "additionalProperties": false,
                              "properties": {
                                "provenance": {
                                  "enum": ["canonicalized", "extracted"],
                                  "type": "string"
                                },
                                "value": {
                                  "type": "string"
                                }
                              },
                              "required": ["provenance", "value"],
                              "type": "object"
                            },
                            "gender": {
                              "additionalProperties": false,
                              "properties": {
                                "provenance": {
                                  "enum": ["canonicalized", "extracted"],
                                  "type": "string"
                                },
                                "value": {
                                  "type": "string"
                                }
                              },
                              "required": ["provenance", "value"],
                              "type": "object"
                            },
                            "material": {
                              "additionalProperties": false,
                              "properties": {
                                "provenance": {
                                  "enum": ["canonicalized", "extracted"],
                                  "type": "string"
                                },
                                "value": {
                                  "type": "string"
                                }
                              },
                              "required": ["provenance", "value"],
                              "type": "object"
                            },
                            "size": {
                              "additionalProperties": false,
                              "properties": {
                                "provenance": {
                                  "enum": ["canonicalized", "extracted"],
                                  "type": "string"
                                },
                                "value": {
                                  "type": "string"
                                }
                              },
                              "required": ["provenance", "value"],
                              "type": "object"
                            },
                            "sleeve_length": {
                              "additionalProperties": false,
                              "properties": {
                                "provenance": {
                                  "enum": ["canonicalized", "extracted"],
                                  "type": "string"
                                },
                                "value": {
                                  "type": "string"
                                }
                              },
                              "required": ["provenance", "value"],
                              "type": "object"
                            }
                          },
                          "type": "object"
                        },
                        "category_paths": {
                          "additionalProperties": false,
                          "properties": {
                            "amazon": {
                              "additionalProperties": false,
                              "properties": {
                                "confidence": {
                                  "type": "number"
                                },
                                "leaf_id": {
                                  "anyOf": [
                                    {
                                      "type": "string"
                                    },
                                    {
                                      "type": "null"
                                    }
                                  ]
                                },
                                "path": {
                                  "items": {
                                    "type": "string"
                                  },
                                  "type": "array"
                                }
                              },
                              "required": ["confidence", "leaf_id", "path"],
                              "type": "object"
                            },
                            "google": {
                              "additionalProperties": false,
                              "properties": {
                                "confidence": {
                                  "type": "number"
                                },
                                "leaf_id": {
                                  "anyOf": [
                                    {
                                      "type": "string"
                                    },
                                    {
                                      "type": "null"
                                    }
                                  ]
                                },
                                "path": {
                                  "items": {
                                    "type": "string"
                                  },
                                  "type": "array"
                                }
                              },
                              "required": ["confidence", "leaf_id", "path"],
                              "type": "object"
                            },
                            "shopify": {
                              "additionalProperties": false,
                              "properties": {
                                "confidence": {
                                  "type": "number"
                                },
                                "leaf_id": {
                                  "anyOf": [
                                    {
                                      "type": "string"
                                    },
                                    {
                                      "type": "null"
                                    }
                                  ]
                                },
                                "path": {
                                  "items": {
                                    "type": "string"
                                  },
                                  "type": "array"
                                }
                              },
                              "required": ["confidence", "leaf_id", "path"],
                              "type": "object"
                            }
                          },
                          "type": "object"
                        },
                        "schema_version": {
                          "const": "2.0",
                          "type": "string"
                        },
                        "source_title": {
                          "type": "string"
                        }
                      },
                      "required": ["attributes", "category_paths", "schema_version", "source_title"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "error": {
                          "type": "string"
                        },
                        "source_title": {
                          "type": "string"
                        }
                      },
                      "required": ["error", "source_title"],
                      "type": "object"
                    }
                  ]
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9dc9667543f75fdbc62c74a21bb49b178beff9ee974acb0e49e5656d23c3dccf"
        }
      ],
      "digest": "sha256:97a1770055961edf77295a0ec45c226657323208fb595cc32206452811c5715e"
    }
  }
}
