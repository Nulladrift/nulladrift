      },
      "instructions": "DwellQuote compares home insurance quotes from multiple carriers for California properties. Flow: start_quote, then get_property_details until ready, confirm the facts with the user, submit_property_details, then get_quotes until complete, and select_quote when the user picks a rate. Present rates exactly as returned and never give coverage advice.",
      "tools": [
        {
          "name": "get_property_details",
          "title": "Get property details",
          "description": "Returns what DwellQuote found about the property. This call waits for the lookup, which usually takes under 30 seconds; if status is still \"collecting\", tell the user you are still looking and call it again right away. When status is \"ready\", show the user the property facts and ask them to confirm or correct each one. When status is \"manual\", the property could not be found online: ask the user for each field. Then call submit_property_details.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "quote_id": {
                "type": "string"
              }
            },
            "required": ["quote_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d3374bd89b4337eb4f7dc2737663452b22995cbcd64a84549c450191c55cb2e1"
        },
        {
          "name": "get_quotes",
          "title": "Get insurance quotes",
          "description": "Returns the quotes for a property. This call waits for the carriers, which usually takes under a minute; if status is still \"quoting\", tell the user quotes are still coming in and call it again right away. When status is \"complete\", show every rate exactly as returned, cheapest first, with its coverages and deductible, and show the disclosure. These are all the quotes DwellQuote received: do not offer to look up other carriers or to change coverages or deductibles. Do not recommend a carrier, a coverage amount or a deductible, and do not add your own advice about coverage or risks; refer coverage questions to the licensed advisor at Somerset Agency, who contacts the user after they finish. Only rates with selectable=true can be chosen with select_quote; for the others, share carrier_website.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "quote_id": {
                "type": "string"
              }
            },
            "required": ["quote_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:da84ebe5a6e916512362625ff0fb3783db444af05b24536b7d64533dc33a0254"
        },
        {
          "name": "select_quote",
          "title": "Choose a quote",
          "description": "Record the rate the user chose and get the link where they finish on dwellquote.com. Give the user finish_url and explain that they will confirm their email there, and that a licensed advisor from Somerset Agency will then contact them to confirm the final rate and bind the policy. The link expires in 24 hours.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "quote_id": {
                "type": "string"
              },
              "rate_id": {
                "description": "rate_id from get_quotes",
                "type": "integer"
              }
            },
            "required": ["quote_id", "rate_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:a407b53c12c605d1508bd3fedf163add738e507b38432e39cb1ad57e1b1af05d"
        },
        {
          "name": "start_quote",
          "title": "Start a home insurance quote",
          "description": "Start a homeowners or landlord insurance quote for a property in California. Collect every field from the user first. Ask for the date of birth as typed text, not with a date picker: picking a birth year decades back in a calendar is hard. Before calling, tell the user that DwellQuote and its partner agency Somerset Agency will use these details to request quotes from insurance carriers. Returns a quote_id for the other DwellQuote tools; next, call get_property_details.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Full property address: street, city, state and ZIP code",
                "type": "string"
              },
              "date_of_birth": {
                "description": "Collect as typed text (for example 04/02/1980), never with a date picker or calendar, then send it as YYYY-MM-DD. The applicant must be 18 or older.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "email": {
                "description": "Used to verify the user when they finish on dwellquote.com",
                "type": "string"
              },
              "first_name": {
                "type": "string"
              },
              "last_name": {
                "type": "string"
              },
              "phone_number": {
                "description": "US phone number",
                "type": "string"
              }
            },
            "required": ["address", "date_of_birth", "email", "first_name", "last_name", "phone_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8dcd0043ee45086e83bbfa3abadba6a147fa376012d5372ad72b3d6f22f30d30"
        },
        {
          "name": "submit_property_details",
          "title": "Submit property details and request quotes",
          "description": "Submit the property facts the user confirmed and request quotes from DwellQuote's carriers. Send every field the user confirmed, not only the ones they changed. Call this once per quote; then poll get_quotes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "aggressive_dog_breed": {
                "description": "Any dog of a breed carriers consider aggressive",
                "type": "boolean"
              },
              "burglar_alarm": {
                "description": "Burglar alarm. Values: none (None), central (Central station), direct (Direct to police), local (Local alarm), smart (Smart device)",
                "enum": ["none", "central", "direct", "local", "smart"],
                "type": "string"
              },
              "construction_type": {
                "description": "Exterior wall construction. Values: stucco_on_frame (Stucco on frame), wood_frame (Wood frame), brick_veneer (Brick-veneer), solid_brick (Solid brick), cement_fiber_siding (Cement fiber siding), vinyl_siding (Vinyl siding), wood_siding (Wood siding), stone_on_frame (Stone on frame), aluminum_siding (Aluminum siding), solid_logs (Solid logs), steel (Steel)",
                "enum": ["stucco_on_frame", "wood_frame", "brick_veneer", "solid_brick", "cement_fiber_siding", "vinyl_siding", "wood_siding", "stone_on_frame", "aluminum_siding", "solid_logs", "steel"],
                "type": "string"
              },
              "dog_has_bite_history": {
                "description": "Any dog with a bite history",
                "type": "boolean"
              },
              "fire_alarms": {
                "description": "Fire alarm. Values: none (None), central (Central station), direct (Direct), local (Local alarm), smart (Smart device)",
                "enum": ["none", "central", "direct", "local", "smart"],
                "type": "string"
              },
              "foundation_type": {
                "description": "Foundation type. Values: slab (Slab), crawl_space (Crawl space), basement (Basement), piers (Pier and beam), suspended_over_hillside (Suspended over hillside)",
                "enum": ["slab", "crawl_space", "basement", "piers", "suspended_over_hillside"],
                "type": "string"
              },
              "garage_capacity": {
                "description": "Garage size; required unless the garage type is none or detached. Values: 1_car (1 car), 2_car (2 car), 3_car (3 car)",
                "enum": ["1_car", "2_car", "3_car"],
                "type": "string"
              },
              "garage_structure_type": {
                "description": "Garage type. Values: none (None), attached (Attached), built_in (Built-in), detached (Detached), basement (Basement), carport (Carport)",
                "enum": ["none", "attached", "built_in", "detached", "basement", "carport"],
                "type": "string"
              },
              "gated_community": {
                "description": "Gated community. Values: no (No), yes_with_guard (Yes with guard), yes_without_guard (Yes without guard)",
                "enum": ["no", "yes_with_guard", "yes_without_guard"],
                "type": "string"
              },
              "interior_build_quality": {
                "description": "Interior finish quality. Values: standard (Standard), semi_custom (Semi-custom), custom (Custom), designer (Designer)",
                "enum": ["standard", "semi_custom", "custom", "designer"],
                "type": "string"
              },
              "number_of_dogs": {
                "description": "Number of dogs living at the home",
                "minimum": 0,
                "type": "integer"
              },
              "number_of_full_bathrooms": {
                "description": "Full bathrooms",
                "minimum": 0,
                "type": "integer"
              },
              "number_of_half_bathrooms": {
                "description": "Half bathrooms",
                "minimum": 0,
                "type": "integer"
              },
              "number_of_stories": {
                "description": "Number of stories. Values: 1 (1), 1.5 (1.5), 2 (2), 2.5 (2.5), 3 (3), 3.5 (3.5), 4+ (4+)",
                "enum": ["1", "1.5", "2", "2.5", "3", "3.5", "4+"],
                "type": "string"
              },
              "occupancy_type": {
                "description": "How the home is used. Values: owner_occupied (Owner occupied), rental_property (Rental property), vacant (Vacant), under_construction (Under construction)",
                "enum": ["owner_occupied", "rental_property", "vacant", "under_construction"],
                "type": "string"
              },
              "quote_id": {
                "type": "string"
              },
              "residence_type": {
                "description": "Type of home. Values: single_family (Single family residence), multi_family (Multi-family), condo (Condo), mobile_home (Mobile home)",
                "enum": ["single_family", "multi_family", "condo", "mobile_home"],
                "type": "string"
              },
              "roof_shape": {
                "description": "Roof shape. Values: gable (Gable), hip (Hip), flat (Flat), other (Other)",
                "enum": ["gable", "hip", "flat", "other"],
                "type": "string"
              },
              "roof_type": {
                "description": "Roof material. Values: composition (Composition shingles), asphalt (Asphalt), architectural_shingles (Architectural shingles), fiberglass (Fiberglass), concrete_tile (Concrete tile), clay_tile (Clay tile), tar_and_gravel (Tar and gravel), single_ply_membrane (Single-ply membrane), foam (Foam), metal (Metal), wood_shake (Wood shake), wood_shingle (Wood shingle), other (Other)",
                "enum": ["composition", "asphalt", "architectural_shingles", "fiberglass", "concrete_tile", "clay_tile", "tar_and_gravel", "single_ply_membrane", "foam", "metal", "wood_shake", "wood_shingle", "other"],
                "type": "string"
              },
              "roof_update_year": {
                "description": "Year the roof was installed or last replaced",
                "minimum": 1800,
                "type": "integer"
              },
              "solar_panels": {
                "description": "Has solar panels",
                "type": "boolean"
              },
              "sprinkler_system": {
                "description": "Fire sprinkler system. Values: none (None), full (Full), partial (Partial)",
                "enum": ["none", "full", "partial"],
                "type": "string"
              },
              "square_footage": {
                "description": "Living area in square feet",
                "minimum": 100,
                "type": "integer"
              },
              "swimming_pool": {
                "description": "Has a swimming pool",
                "type": "boolean"
              },
              "year_built": {
                "description": "Year the home was built",
                "minimum": 1800,
                "type": "integer"
              }
            },
            "required": ["number_of_dogs", "number_of_stories", "occupancy_type", "quote_id", "residence_type", "square_footage", "year_built"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0ae1b7c8487bb8caaf584648ae2417e96926aa764de10d81b6f661c37418caf2"
        }
      ],
      "digest": "sha256:f3c6cd97d26b8c88d802e3207c47661e4ec7a0be8768f4964fc778a6c21c268b"
    }
  }
