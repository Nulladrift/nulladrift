      "instructions": "Australia Wide First Aid runs nationally recognised first aid and CPR courses across Australia. To help someone book: choose a course with list_courses (or get_course_details to check it meets a requirement), ask the person for their postcode or suburb and find a session near them with search_nearby_sessions (or at a named venue with search_sessions), then hand off with start_booking. start_booking returns a link: the person opens it and finishes booking on the enrolment site, where they enter their own details and pay. Nothing is booked until they do, and you never enter their details or payment. All tools are read-only and need no sign-in.",
      "tools": [
        {
          "name": "get_course_details",
          "title": "Get course details",
          "description": "Full details for one course: what it covers, how it is assessed, the pre-course online work, what to bring, when the certificate is issued, and how long it stays current. Use it to answer whether a course meets a workplace or childcare requirement. course is the id from list_courses; a unit code such as HLTAID011 also works.",
          "inputSchema": {
            "properties": {
              "course": {
                "description": "The course's id, unit code, workshops course id or name.",
                "type": "string"
              }
            },
            "required": ["course"],
            "type": "object"
          },
