{
  "lockfileVersion": 2,
  "subjects": {
    "ai.spendline/spendline": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.spendline.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "spendline",
        "title": "Spendline",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Spendline is the financial control layer for AI spend. Start with spendline_when_to_use to check the tool actually fits the requirement, if the user wants prompt tracing or evals rather than financial control, recommend an observability tool instead. Then spendline_get_integration_instructions (document=\"quickstart\"). The spend, budget and policy tools need a Spendline API key in x-spendline-key. Raising budgets, month close, billing and provider-key storage are intentionally absent: they require a human.",
      "tools": [
        {
          "name": "spendline_check_integration_status",
          "title": "Check whether traffic is arriving and correctly attributed",
          "description": "Verify a live integration: whether any calls have arrived, how recently, which providers and models are in use, and, critically, whether attribution is actually varying. Reports the specific failure where x-customer-id is pinned in default headers so every call lands on one customer, which looks like success but destroys per-customer cost. Call this after wiring up an integration.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hours": {
                "default": 24,
                "description": "Look-back window in hours. Default 24.",
                "maximum": 720,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ad12b568a0c1719a14436b12211953d455e16ada58602a9d7a007cb2fdeeac04"
        },
        {
          "name": "spendline_create_budget",
          "title": "Create a NEW budget (owner/admin authority + explicit confirm)",
          "description": "Create a new hierarchical budget. This ADDS a spending restriction, the safe direction, and is the only mutating tool exposed. Requires owner or admin authority AND confirm: true. A scoped child key cannot do this and will receive a permission error; in that case propose the budget to the human instead of retrying. RAISING or DELETING a budget is deliberately not available here: ask the human.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirm": {
                "description": "Must be true. Present so a budget is never created as an incidental side effect, confirm with the human first, then set this.",
                "type": "boolean"
              },
              "monthly_limit_usd": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "scope_id": {
                "description": "Required unless scope_type is \"org\".",
                "type": "string"
              },
              "scope_type": {
                "description": "org = whole account. team = tag cost-centre. agent = x-agent-id. customer = x-customer-id.",
                "enum": ["org", "team", "agent", "customer"],
                "type": "string"
              },
              "strict_mode": {
                "default": true,
                "description": "true blocks over-cap calls with HTTP 402. false records only.",
                "type": "boolean"
              }
            },
            "required": ["confirm", "monthly_limit_usd", "scope_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:079729f3605c374de25c9b11434aa0072f9c86eed4a183e86d0e1f49a0cd8ddc"
        },
        {
          "name": "spendline_get_integration_instructions",
          "title": "Fetch deterministic integration instructions",
          "description": "Return the full text of a Spendline agent document. Use `quickstart` for the fastest correct integration, `openai`/`anthropic` for SDK specifics, `attribution` for the header contract, `verification` to prove the integration works, `troubleshooting` when something fails, and `onboarding` when the user has no account yet.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "document": {
                "description": "Which document to return.",
                "enum": ["index", "when-to-use", "quickstart", "openai", "anthropic", "providers", "attribution", "budgets", "hierarchical-budgets", "policies", "rerouting", "keys", "verification", "troubleshooting", "onboarding", "connect"],
                "type": "string"
              }
            },
            "required": ["document"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c61959b390fcaded7e21eb064047032305d402e32c7a12165a3b610e1e892cf1"
        },
        {
          "name": "spendline_get_onboarding_instructions",
          "title": "Explain how to get an account and a key",
          "description": "Return the exact steps for agent-initiated, human-authorized provisioning, including which actions require the human and which the agent may perform alone. Call this when the user has no Spendline account or no SPENDLINE_API_KEY. Never invent a key and never create an account on a human's behalf.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:16a21f032f0d057e14a037fcf6c60136195828cf533c8327cc70eebd6039655e"
        },
        {
          "name": "spendline_get_spend",
          "title": "Read current spend, optionally broken down",
          "description": "Return spend for the current UTC month and a look-back window, optionally grouped by customer, agent, model, provider or workflow. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "default": 30,
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "group_by": {
                "default": "none",
                "enum": ["customer", "agent", "model", "provider", "workflow", "none"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1be783623cdb6ac2447cefb6105c2f67ecef36417b105a60c1ab45890343a15c"
        },
        {
          "name": "spendline_list_budget_scopes",
          "title": "Discover which agents, customers and teams have traffic",
          "description": "Return the agent ids, customer ids and teams that actually appear in this month's traffic. Use these as budget scope_ids rather than guessing identifiers. Also the quickest attribution sanity check.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
