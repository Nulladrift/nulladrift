          },
          "digest": "sha256:435b9014178b0c3393ce49fc5e13a6023985918f96fc17a88bb72ca31f6adb6c"
        },
        {
          "name": "spendline_list_budgets",
          "title": "List budgets with current spend against each limit",
          "description": "Return every hierarchical budget for the account with month-to-date spend, percentage used, and whether it is in blocking (strict) mode. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
