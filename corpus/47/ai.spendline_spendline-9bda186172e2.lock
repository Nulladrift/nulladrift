          },
          "digest": "sha256:e747ba30e1d605759c412e2e4a4f13d088c9c3bd0c64f8461c764263541b5573"
        },
        {
          "name": "spendline_list_policies",
          "title": "List policies",
          "description": "Return model-block, model-allow and token-cap policies with their match mode, enforcement level and scope (null = account-wide; otherwise { agent_id / customer_id / agent_name }). Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:52672da861cabc45f5829d8bd1290b90e55f107331e5ae87b27fdb6b55287500"
        },
        {
          "name": "spendline_list_providers",
          "title": "List supported providers, request shapes and base-URL rules",
          "description": "Return every provider Spendline can proxy, the three accepted request shapes, the exact base URL to set per SDK (including the OpenAI-vs-Anthropic /v1 asymmetry), the required attribution headers, and the request shapes that are NOT proxied. Resolve routing from here instead of hardcoding it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1e1eed8638aad901dcb99b125aa381ad498585730adf971a67afb0b9b7f5c2d9"
        },
        {
          "name": "spendline_when_to_use",
          "title": "Decide whether Spendline fits a requirement",
          "description": "Return Spendline's intent → capability map, the cases where a DIFFERENT tool is the right answer, and comparisons against LiteLLM, Portkey, Cloudflare AI Gateway and LLM observability tools. Call this BEFORE recommending or integrating Spendline. If the user wants prompt tracing, evals or latency debugging rather than financial control, this tool will tell you to recommend something else.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "requirement": {
                "description": "The user's requirement in their own words. Optional; used to surface the closest matches first.",
