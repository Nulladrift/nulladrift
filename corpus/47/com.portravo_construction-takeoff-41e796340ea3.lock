  "subjects": {
    "com.portravo/construction-takeoff": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://portravo.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "portravo",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Portravo turns construction plan PDFs into takeoffs and reviewed estimates. Account linking is required for every tool except list_pricing_markets and preflight_takeoff without project_id, which show markets, trades and prices ($75 per trade, $149 for the whole job) before linking. Usual order: get_profile, preflight_takeoff, create_project with the chosen trades (metro_code from list_pricing_markets), attach_plan_pdf, run_takeoff, get_takeoff_status, get_takeoff, export_reviewed_estimate. Before run_takeoff, read the project preflight and obtain approval for its exact trades and creditsRequired; pass confirmed_trades and max_credits with confirm_credit_use=true. Starts use existing credits only and never buy credits or bill overage. Poll get_takeoff_status; do not retry with a new key while a run is pending. list_projects returns 50 a page; pass nextOffset as offset for the next page. To attach a plan, prefer the host-provided file link (plan). Use plan_inline only for the exact bytes of a PDF the user uploaded, up to 32 KiB; never recreate document bytes from text or invent a URL. If the PDF cannot be attached from chat, do not call attach_plan_pdf: give the user the project's reviewUrl to upload it there (up to 50 MiB), then run_takeoff. Use a stable idempotency_key for each write and reuse it when retrying. Quantities need human review and pricing in Portravo before XLSX export; if export_reviewed_estimate reports review_required, give the user the review link.",
      "tools": [
        {
          "name": "attach_plan_pdf",
          "title": "Attach a construction plan PDF",
          "description": "Attach a PDF the user selected in this conversation as the first plan for a new Portravo project. Plan PDFs must be 10 MiB or smaller. Accepts exactly one of plan, a host-provided download_url and file_id, or plan_inline, canonical base64 of the exact user-uploaded PDF bytes with file_name and application/pdf mime_type, up to 32 KiB. A PDF with no file link above 32 KiB, or any PDF above the direct limit, is uploaded in the browser at the project's reviewUrl instead. That browser path streams up to 50 MiB for the selected automatic trades. Projects that already have a plan or review work are refused, so existing work is never replaced. Repeating a call with the same idempotency_key returns the original result. Stores the selected PDF privately in the connected account; does not extract or consume credits.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "oneOf": [
              {
                "not": {
                  "required": ["plan_inline"]
                },
                "required": ["plan"]
              },
              {
                "not": {
                  "required": ["plan"]
                },
                "required": ["plan_inline"]
              }
            ],
            "properties": {
              "idempotency_key": {
                "maxLength": 128,
                "minLength": 8,
                "pattern": "^[A-Za-z0-9_.:-]+$",
                "type": "string"
              },
              "plan": {
                "additionalProperties": false,
                "description": "Host-provided signed file link for a PDF the user attached (PDF up to 10 MiB).",
                "properties": {
                  "download_url": {
                    "format": "uri",
                    "maxLength": 8192,
                    "type": "string"
                  },
                  "file_id": {
                    "maxLength": 256,
                    "minLength": 1,
                    "type": "string"
                  },
                  "file_name": {
                    "maxLength": 200,
                    "minLength": 5,
                    "pattern": "^[^/\\\\\\x00-\\x1f]+\\.pdf$",
                    "type": "string"
                  },
                  "mime_type": {
                    "const": "application/pdf",
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "plan_inline": {
                "additionalProperties": false,
                "description": "Exact bytes of a user-uploaded PDF as canonical base64, only when no file link exists. PDF up to 32 KiB.",
                "properties": {
                  "data_base64": {
                    "maxLength": 43692,
                    "minLength": 4,
                    "type": "string"
                  },
                  "file_name": {
                    "maxLength": 200,
                    "minLength": 5,
                    "pattern": "^[^/\\\\\\x00-\\x1f]+\\.pdf$",
                    "type": "string"
                  },
                  "mime_type": {
                    "const": "application/pdf",
                    "type": "string"
                  }
                },
                "required": ["data_base64", "file_name", "mime_type"],
                "type": "object"
              },
              "project_id": {
                "maxLength": 128,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              }
            },
            "required": ["idempotency_key", "project_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "planFileId": {
                "type": "string"
              },
              "reviewUrl": {
                "type": "string"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["planFileId", "reviewUrl", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Attach a construction plan PDF"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/fileParams": ["plan"],
            "securitySchemes": [
              {
                "scopes": ["plans:write", "offline_access"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:b9019ff708792306e8e59e6119eff52502c4f22ef617ca29175c21b1ee009f03"
        },
        {
          "name": "create_project",
          "title": "Create a takeoff project",
          "description": "Create a new construction estimate project in the connected Portravo account from a project name, an explicit trades selection returned by preflight_takeoff, an optional address and an optional supported metro_code. Trades are required. Repeating a call with the same idempotency_key returns the original project instead of creating another. Returns reviewUrl, the project page where the user can also upload a plan PDF in the browser. Does not run extraction or consume estimate credits.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "address": {
                "maxLength": 200,
                "type": "string"
              },
              "idempotency_key": {
                "maxLength": 128,
                "minLength": 8,
                "pattern": "^[A-Za-z0-9_.:-]+$",
                "type": "string"
              },
              "metro_code": {
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "trades": {
                "items": {
                  "enum": ["electrical", "framing", "mechanical", "plumbing", "landscape", "painting", "concrete", "roofing", "drywall", "whole_job"],
                  "type": "string"
                },
                "maxItems": 9,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["idempotency_key", "name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "reviewUrl": {
                "type": "string"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["id", "reviewUrl", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a takeoff project"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["projects:write", "offline_access"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:6fcf6cd7d03b505e44f7111a7e8b237f434b6ed76bb25276f033cfc22c7aa05f"
        },
