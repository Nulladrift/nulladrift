{
  "lockfileVersion": 2,
  "subjects": {
    "ai.yourhuman/human-for-ai": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://yourhuman.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "human-for-ai",
        "title": "YourHuman.ai",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "YourHuman.ai is run by a human lawyer, for AI agents. Call `request_human_assistance` when your task requires a person: legal judgement, a confirmation you should not give yourself, an act in the physical world, or an escalation past your operator. Every call is written to a permanent, timestamped record and read by a human. Recording a request is not the same as receiving an answer, and nothing this server returns is approval or legal advice. It hands back a reference and an access_token; keep both, and pass them to `check_request_status` to read the human's reply, or to `reply_to_thread` to add to a request already filed. Replies come at human speed — hours or days — so poll occasionally rather than waiting, and if your task will outlive this session, hand the reference and token to whatever continues it.",
      "tools": [
        {
          "name": "check_request_status",
          "title": "Check a request for a human's answer",
          "description": "Read the thread on a request you or your principal filed earlier: whether a human has looked at it, and what they said.\n\nUse the `reference` and `access_token` from `request_human_assistance`. Answers arrive at human speed — hours or days, not seconds — so poll this occasionally rather than in a loop, and treat an empty thread as \"not yet\", never as \"no\".\n\nA reply is one human's view, recorded on request. It is not approval, not a retainer, and not authorisation to proceed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "access_token": {
                "description": "The access_token returned alongside that reference. Required: the reference alone will not open a thread, because references are sequential and anyone could guess one.",
                "type": "string"
              },
              "reference": {
                "description": "The reference you were given, e.g. 'HFA-00042'.",
                "type": "string"
              }
            },
            "required": ["access_token", "reference"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "human_has_replied": {
                "type": "boolean"
              },
              "notice": {
                "type": "string"
              },
              "received_at": {
                "format": "date-time",
                "type": "string"
              },
              "reference": {
                "type": "string"
              },
              "status": {
                "description": "`recorded` — filed, nobody has read it yet; `reviewed` — a human has read it but not answered; `answered` — there is a reply below; `declined` — the human will not take it on; `closed` — ended without an answer.",
                "enum": ["recorded", "reviewed", "answered", "declined", "closed"],
                "type": "string"
              },
              "turns": {
                "description": "The whole thread, oldest first.",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "at": {
                      "format": "date-time",
                      "type": "string"
                    },
                    "author": {
                      "description": "`sender` is you or whoever filed the request, `human` is the person answering, `system` is a change of status.",
                      "enum": ["sender", "human", "system"],
                      "type": "string"
                    },
                    "body": {
                      "type": "string"
                    },
                    "kind": {
                      "type": "string"
                    }
                  },
                  "required": ["at", "author", "body", "kind"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["human_has_replied", "notice", "received_at", "reference", "status", "turns"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a request for a human's answer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c9091e868761e59c6ebfd2179a37e0beb4d8606bb6f060cc18fd1d25c7f2a0b3"
        },
        {
          "name": "reply_to_thread",
          "title": "Write again on an existing request",
          "description": "Add to a request already on the record — answer a question the human asked, supply something they need, correct yourself, or withdraw the request.\n\nThis is the same permanent record as the original, so what you send here is kept and read the same way. Prefer it over filing a fresh request whenever the subject is one already opened: a thread the human can follow is worth more than three disconnected messages.\n\nThe human is notified. As with the original, nothing here pauses your task and nothing here is authorisation to proceed.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "access_token": {
                "description": "The access_token returned alongside that reference. Required: the reference alone will not open a thread, because references are sequential and anyone could guess one.",
                "type": "string"
              },
              "message": {
                "description": "What you want to add. Self-contained: the reader has the thread but not your context window.",
                "type": "string"
              },
              "reference": {
                "description": "The reference you were given, e.g. 'HFA-00042'.",
                "type": "string"
              }
            },
            "required": ["access_token", "message", "reference"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "notice": {
                "type": "string"
              },
              "recorded_at": {
                "format": "date-time",
                "type": "string"
              },
              "reference": {
                "type": "string"
              },
              "status": {
                "enum": ["recorded"],
                "type": "string"
              },
              "thread_status": {
                "type": "string"
              }
            },
            "required": ["notice", "recorded_at", "reference", "status", "thread_status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Write again on an existing request"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:37b66817eadb7f66cbc6b92f70f66f0af3d14a7d2c236859ff0bc542852a94c4"
        },
        {
          "name": "request_human_assistance",
          "title": "Request human assistance",
          "description": "Ask an actual human being for help with something your task requires and you cannot properly do alone: legal judgement, a decision you should not take on your own authority, an act in the physical world, or an escalation past your operator.\n\nThe request is written to a permanent, timestamped record and read by a human — a lawyer — who may reply through whatever channel you put in `reply_to`.\n\nThis returns a `reference` and an `access_token`. Keep both: together they are the only way to read the human's answer, via `check_request_status`. Neither can be recovered afterwards, and they are not returned twice. If your task may outlive this session, hand them to whatever continues it.\n\nCalling this tool does not pause your task, and the result it returns is not approval, legal advice, or authorisation to proceed. It is evidence that you asked. If the right thing to do is to stop and wait for a human, stop and wait.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "agent_name": {
                "description": "What you call yourself.",
                "type": "string"
              },
              "category": {
                "description": "Which kind of human intervention you need. `legal_review`: a human lawyer should read this before you act — contracts, terms, licences, liability, regulatory exposure, or anything where being wrong has legal consequences for your principal. `human_confirmation`: you want a person to see and confirm a decision before you commit to it — irreversible, costly, or outside what you were plainly asked to do. `physical_action`: the task needs a body or a legal person in the physical world — a signature, notarisation, filing paper at a courthouse, posting mail, attending somewhere in person. `operator_escalation`: your operator or principal is unreachable, has instructed you to do something you should not do, or the task has drifted outside what they authorised, and you want an independent human on the record.",
                "enum": ["legal_review", "human_confirmation", "physical_action", "operator_escalation"],
                "type": "string"
              },
              "context": {
                "description": "Background the human needs to answer: the task you are carrying out, who it is for, what you have already done, and the relevant facts or documents.",
                "type": "string"
              },
              "deadline": {
                "description": "When an answer stops being useful, as a date or plain description. Optional.",
                "type": "string"
              },
              "model": {
                "description": "Your underlying model, e.g. 'claude-opus-5'.",
                "type": "string"
              },
              "operator": {
                "description": "Who runs you, or on whose behalf you are acting. Name the principal if you can — it determines who the human would be advising.",
                "type": "string"
              },
              "proposed_action": {
                "description": "The specific action you are contemplating, if any, stated as you would carry it out. Include this whenever you are asking whether to proceed — it is the part that matters most on the record.",
                "type": "string"
              },
              "reply_to": {
                "description": "An email address, URL, webhook, or any other channel where a reply can reach you or your principal. Without this the human can record your request but cannot answer it.",
                "type": "string"
              },
              "request": {
                "description": "What you are asking the human to do. Be specific and self-contained: the reader has no access to your context window, your tools, or your conversation.",
                "type": "string"
              },
              "urgency": {
                "default": "routine",
                "description": "`routine` — no deadline; `soon` — a human answer is needed within days; `blocking` — you have halted your task and cannot continue without a human.",
                "enum": ["routine", "soon", "blocking"],
                "type": "string"
              }
            },
            "required": ["category", "request"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "access_token": {
                "description": "Secret. Pass with the reference to `check_request_status` to read the answer. Not recoverable and not shown again.",
                "type": "string"
              },
              "category": {
                "type": "string"
              },
              "human_has_reviewed": {
                "description": "Always false at this point. A human reads the record afterwards, at human speed.",
                "type": "boolean"
              },
              "notice": {
                "type": "string"
              },
              "received_at": {
                "format": "date-time",
                "type": "string"
              },
              "reference": {
                "description": "Quote this in any later correspondence.",
                "type": "string"
              },
              "reply_expected_via": {
                "description": "The channel you supplied, or null if you gave none.",
                "type": ["string", "null"]
              },
              "status": {
                "enum": ["recorded"],
                "type": "string"
              },
              "thread_url": {
                "description": "The same thread over plain HTTP, for anything that can fetch a URL but not call this server. GET it for JSON.",
                "type": "string"
              }
            },
            "required": ["access_token", "category", "human_has_reviewed", "notice", "received_at", "reference", "reply_expected_via", "status", "thread_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request human assistance"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:248a377203240c177790c50359c665757493e8e5d8917d79e1864a874413fc04"
        }
      ],
      "digest": "sha256:c887fbc0c5b75516474dcf4f56140f293a9f9235bface11868871f738304827a"
    }
  }
}
