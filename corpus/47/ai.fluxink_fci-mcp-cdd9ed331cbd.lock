        {
          "name": "fluxink-mcp-chatgpt-show-handwriting-canvas",
          "description": "Open the FluxInk handwriting recognition canvas. The user draws freehand strokes with a stylus, finger, or mouse. The strokes are converted by one of two model families: general recognition for handwriting, math, and chemical formulas, or structure recognition for molecular structures.\n\nUse this when the user asks to handwrite, draw, sketch, ink, scribble, or scrawl something. Use this when the user wants to draw a math equation, chemical formula, or molecular structure rather than type it. Use this when the user asks for a canvas, drawing pad, handwriting input box, or whiteboard. Use this when the user wants to convert stylus or finger drawings into recognized text or markup.\n\nDo NOT use this when the user types a question, equation, or formula in chat and just wants an answer. Do NOT use this when the user uploads or references an existing image of handwriting (call recognize_image instead). Do NOT use this when the user wants a formatted document, study sheet, or layout PDF (call create_layout instead). Do NOT use this when the user wants text rendered in a personal handwriting style (call show_style_canvas instead). Do NOT use this for conversational or informational requests that need no ink input.\n\nDo NOT re-open if a FluxInk handwriting canvas is already visible from any earlier turn. Instead instruct the user to keep drawing on the existing canvas. Only set force_new=true when the user explicitly asks for a brand new, fresh, or blank canvas.\n\nAlways pass the original chat message in the prompt parameter so context is preserved after recognition. After calling, write a single short acknowledgement and do NOT describe the canvas UI.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "force_new": {
                "default": false,
                "description": "Set true ONLY when the user explicitly asks for a brand-new canvas. Otherwise leave false so a previously opened canvas is reused.",
                "type": "boolean"
              },
              "language": {
                "description": "Optional language hint for text mode. Omit to use the mixed-language model default.",
                "type": "string"
              },
              "mode": {
                "default": "general",
                "description": "Recognition family for the canvas. Use general for text, math, and chemical formulas; use structure only for molecular structures.",
                "enum": ["general", "structure"],
                "type": "string"
              },
              "prompt": {
                "description": "The original chat message that triggered the canvas. Passed through to the follow-up message after recognition.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "message": {
                "type": "string"
              },
              "mode": {
                "enum": ["general", "structure"],
                "type": "string"
              },
              "prompt": {
                "type": "string"
              },
              "reuse": {
                "type": "boolean"
              }
            },
            "required": ["message", "mode", "prompt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/hwr-widget.html",
            "openai/toolInvocation/invoked": "Canvas ready",
            "openai/toolInvocation/invoking": "Opening handwriting canvas...",
            "openai/widgetAccessible": true,
            "ui": {
