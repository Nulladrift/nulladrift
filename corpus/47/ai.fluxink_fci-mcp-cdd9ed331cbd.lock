        {
          "name": "fluxink-mcp-chatgpt-create-layout",
          "description": "FluxInk document layout generator. Transform raw text content into a structured PDF using one of seven study or work templates, then preview it in an embedded PDF viewer widget.\n\nSupported layout_type values. cornell is the Cornell note taking layout with cue, notes, and summary. bullet_points is a clean bulleted summary. zettelkasten is atomic linked notes. journalism_5w1h is who, what, when, where, why, and how. meeting_add is a meeting agenda plus action items. sq3r is Survey, Question, Read, Recite, Review study notes. pso is Problem, Solution, Outcome.\n\nUse this when the user asks for a Cornell sheet, bulleted summary, Zettelkasten card, 5W1H breakdown, meeting agenda or minutes, SQ3R study sheet, or PSO writeup. Use this when the user wants to turn raw notes, lecture transcript, or source material into a printable PDF or formatted study sheet. Use this when the user asks for a downloadable PDF document of their content.\n\nDo NOT use this when the user just asks for a plain summary in chat. Give it inline. Do NOT use this when the user wants to handwrite or draw something. Call show_handwriting_canvas instead. Do NOT use this when the user wants text in a personal handwriting style. Call show_style_canvas instead. Do NOT use this for plain informational requests with no document generation intent.\n\nAlways pass the source material verbatim in the content parameter. Do NOT pre summarize. The layout engine handles structuring. Pick the layout_type that best matches the stated purpose. If unclear, ask one short clarifying question instead of guessing.\n\nDo NOT re-call if a layout PDF is already visible from a previous turn unless the user explicitly asks for a different layout, different content, or a regeneration. After calling, write a single short acknowledgement and do NOT restate the PDF content.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "content": {
                "description": "The raw educational or note content to transform into a structured layout. Pass the full text. The backend will analyze, structure, and render it.",
                "type": "string"
              },
              "layout_type": {
                "description": "Layout template to render. Allowed values. cornell (Cornell note taking layout with cue, notes, and summary). bullet_points (clean bulleted summary). zettelkasten (atomic linked notes). journalism_5w1h (who, what, when, where, why, how). meeting_add (meeting agenda plus action items). sq3r (Survey, Question, Read, Recite, Review study notes). pso (Problem, Solution, Outcome).",
                "enum": ["cornell", "bullet_points", "zettelkasten", "journalism_5w1h", "meeting_add", "sq3r", "pso"],
                "type": "string"
              },
              "title": {
                "description": "Optional title for the document. If omitted, the backend generates one.",
                "type": "string"
              }
            },
            "required": ["content", "layout_type"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "error": {
                "type": "string"
              },
              "layout_type": {
                "enum": ["cornell", "bullet_points", "zettelkasten", "journalism_5w1h", "meeting_add", "sq3r", "pso"],
                "type": "string"
              },
              "success": {
                "type": "boolean"
              },
              "title": {
                "type": "string"
              }
            },
            "required": ["success"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
