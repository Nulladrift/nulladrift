          "digest": "sha256:ebfe271091e71aba8b7e1afdb0358b685316ec926f40082a7eb29aa959afd99e"
        },
        {
          "name": "fluxink-mcp-chatgpt-recognize-handwriting",
          "description": "Internal FluxInk handwriting recognition execution endpoint. Invoked ONLY by the handwriting canvas widget when the user finishes drawing. Do NOT call this tool directly from chat. To capture handwriting from the user, call show_handwriting_canvas instead. This endpoint requires a JSON stroke payload that only the widget can produce.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Optional language hint for text mode.",
                "type": "string"
              },
              "mode": {
                "default": "general",
                "description": "Widget-internal recognition family. Preferred values are general or structure; legacy text, math, and chemical values are accepted for existing widget compatibility.",
                "type": "string"
              },
              "strokes": {
                "description": "JSON encoded array of strokes captured by the widget. Each stroke is an object with x, y, t arrays.",
                "type": "string"
              }
            },
            "required": ["strokes"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "error": {
                "type": "string"
              },
              "result": {},
              "success": {
                "type": "boolean"
              }
            },
            "required": ["success"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Recognition ready",
            "openai/toolInvocation/invoking": "Recognizing handwriting...",
            "openai/visibility": "private",
            "openai/widgetAccessible": true
          },
          "digest": "sha256:41b84d5b72089d28ba62b1f2795ed5e9f7b669f8d13762f3fbad3593a71e0912"
        },
        {
          "name": "fluxink-mcp-chatgpt-recognize-image",
          "description": "FluxInk image text recognition. Extract text from an EXISTING image (file upload, URL, or base64) the user provides. Higher accuracy than built in vision for tightly packed text, multi language documents, math, and LaTeX. Returns per region confidence and detection coordinates.\n\nUse this when the user uploads, attaches, or shares an image containing text they want extracted (screenshot, photo, scanned document, receipt, sign, whiteboard, book page, photographed handwritten notes). Use this when the user wants a photographed math expression or chemistry formula converted to LaTeX. Use this when the user references an image and asks to read, transcribe, or digitize the text in it.\n\nDo NOT use this when the user has NOT provided an image yet. Do NOT use this when the user wants to draw or handwrite something fresh (call show_handwriting_canvas instead). Do NOT use this when the request is a plain text question, summary, or explanation with no image attached.\n\nThe language parameter selects the recognition mode. en is English text (default). zh is Chinese text. paddle is multilingual or mixed text. formula is mathematics. latex returns raw LaTeX markup. After returning results, present the extracted text clearly and offer follow up actions like translation, summarization, or editing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "image": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "download_url": {
                        "description": "URL to download the image.",
                        "type": "string"
                      },
                      "file_id": {
                        "description": "ChatGPT file ID.",
                        "type": "string"
                      }
                    },
                    "required": ["download_url", "file_id"],
                    "type": "object"
                  },
                  {
                    "description": "Direct URL or base64 data URI of the image.",
                    "type": "string"
                  }
                ],
                "description": "Image to recognize text from. Pass an image from the conversation."
              },
              "language": {
                "default": "en",
                "description": "Recognition mode. Allowed values. en (English text). zh (Chinese text). paddle (multilingual mixed text). formula (mathematics with LaTeX output). latex (return raw LaTeX markup).",
                "enum": ["en", "zh", "paddle", "formula", "latex"],
                "type": "string"
              }
            },
            "required": ["image"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "detection_count": {
                "type": "number"
              },
              "error": {
                "type": "string"
              },
              "full_text": {
                "type": "string"
              },
              "language": {
                "enum": ["en", "zh", "paddle", "formula", "latex"],
                "type": "string"
              },
              "results": {
                "items": {
                  "additionalProperties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "success": {
                "type": "boolean"
              },
              "total_time_ms": {
                "type": "number"
              }
            },
            "required": ["success"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
