            }
          },
          "digest": "sha256:fbc2523e5f81f0209831989aa12613eec97ff301a5a821b96c8c35dcf7b59adf"
        },
        {
          "name": "fluxink-mcp-chatgpt-synthesize-handwriting-style",
          "description": "Internal FluxInk natural texture ink execution endpoint. Invoked ONLY by the style canvas widget when the user clicks Generate. Do NOT call this tool directly from chat. To render text in the personal handwriting style of the user, call show_style_canvas instead. This endpoint requires JSON encoded style strokes captured by the widget.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cell_size": {
                "default": 128,
                "description": "Character cell size in pixels.",
                "type": "number"
              },
              "legibility": {
                "default": 1,
                "description": "Legibility level (0.0 to 2.0).",
                "type": "number"
              },
              "stroke_width": {
                "default": 3.5,
                "description": "Output stroke width (1.0 to 15.0).",
                "type": "number"
              },
              "style_strokes": {
                "description": "JSON encoded array of style strokes captured from the canvas.",
                "type": "string"
              },
              "style_text": {
                "description": "Text the user actually wrote as the style sample (for accurate style conditioning). If omitted, the backend auto recognises via handwriting recognition.",
                "type": "string"
              },
              "text": {
                "description": "Text to synthesize in the captured handwriting style.",
                "type": "string"
              }
            },
            "required": ["style_strokes", "text"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "charCount": {
                "type": "number"
              },
              "error": {
                "type": "string"
              },
              "imageBase64": {
                "type": "string"
              },
              "inferenceTimeMs": {
                "type": "number"
              },
              "success": {
                "type": "boolean"
              }
            },
            "required": ["success"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
