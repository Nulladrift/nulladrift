                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "rows": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "disposition": {
                            "anyOf": [
                              {
                                "enum": ["none", "quarantine", "reject"],
                                "type": "string"
