                                    },
                                    {
                                      "type": "null"
                                    }
                                  ]
                                }
                              },
                              "required": ["comment_in_external_data", "type"],
                              "type": "object"
                            },
                            "type": "array"
                          },
                          "passed": {
                            "type": "boolean"
                          },
                          "spf_domain": {
                            "type": ["string", "null"]
                          },
                          "spf_result": {
                            "anyOf": [
                              {
                                "enum": ["none", "neutral", "pass", "fail", "softfail", "temperror", "permerror", "unrecognised"],
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ]
                          }
                        },
                        "required": ["disposition", "dkim_domain", "dkim_result", "dkim_signatures", "ip", "messages", "override_reasons", "passed", "spf_domain", "spf_result"],
                        "type": "object"
                      },
                      "type": "array"
