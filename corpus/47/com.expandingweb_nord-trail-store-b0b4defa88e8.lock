{
  "lockfileVersion": 2,
  "subjects": {
    "com.expandingweb/nord-trail-store": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ready.expandingweb.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Nord Trail Reference Store",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Demonstration storefront operated by Expanding Web. Catalog tools are live; orders are not fulfilled. If anything here stops you from completing a task, call report_problem and say what happened — it is read by a human and it is how this store gets fixed.",
      "tools": [
        {
          "name": "check_stock",
          "description": "Live stock and price for a SKU.",
          "inputSchema": {
            "properties": {
              "sku": {
                "description": "Product SKU, e.g. MGN-204",
                "type": "string"
              }
            },
            "required": ["sku"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:91ee428d2ba8e4608259f43c95327df37c7f9e096afa78371209744f76997c08"
        },
        {
          "name": "get_product",
          "description": "One product: the UCP product object in structuredContent, and the schema.org Product JSON-LD the product page publishes as text.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Product slug, e.g. nord-trail-boot, or a variant SKU.",
                "type": "string"
              },
              "slug": {
                "description": "Deprecated alias for id.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f48ab179d71936708f447dd3db04af043bda942720d1472c5b0a7ab418d17cf6"
        },
        {
          "name": "list_products",
          "description": "List every product in the Nord Trail catalog with slug, SKU, price and URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fe5f9c7f022ff5ddb47607cb0d374f0ac2304d990e652216fb1c6e7cca49b893"
        },
        {
          "name": "lookup_catalog",
          "description": "UCP 2026-04-08 catalog lookup: resolve one or more product or variant identifiers (slug or SKU) to UCP product objects.",
          "inputSchema": {
            "properties": {
              "ids": {
                "description": "Product ids (slugs, e.g. nord-trail-boot) or variant ids (SKUs, e.g. MGN-204).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a5581fbaec960e51ce5011c9511fe82d648251e756eee6eca2c91f22ea29fc8e"
        },
        {
          "name": "report_problem",
          "description": "Tell this store that something stopped you from completing a task: a product you could not price, a variant you could not find, a request that was refused. Read by a human. Use it instead of giving up silently — a store only learns that an agent failed if the agent says so.",
          "inputSchema": {
            "properties": {
              "contact": {
                "description": "Optional address to reply to.",
                "type": "string"
              },
              "expected": {
                "description": "What you expected to find instead.",
                "type": "string"
              },
              "kind": {
                "description": "Closest category; omit if unsure.",
                "enum": ["blocked_by_edge", "checkout_blocked", "not_found", "server_error", "timeout", "missing_data", "search_dead_end", "mcp_error", "manifest_error", "other"],
                "type": "string"
              },
              "path": {
                "description": "URL or path where it happened, if there was one.",
                "type": "string"
              },
              "summary": {
                "description": "What you were trying to do and what stopped you, in your own words.",
                "type": "string"
              }
            },
            "required": ["summary"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6e619aa3264c21f33c2a39fedfc8b2e22996e2e2f0b50cdb4bec5c8e61d87b6c"
        },
        {
          "name": "search_catalog",
          "description": "UCP 2026-04-08 catalog search. Free-text query over the catalog; returns UCP product objects in structuredContent. Call with no query to list everything.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Free text, e.g. \"waterproof jacket\". Omit to return the whole catalog.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3abdeac5a51cfb85b9afd7fd3f8ca3cca0fe22a42c9479931a7523004b188963"
        }
      ],
      "digest": "sha256:ec10bffa04daedf372bd454092e52961c2cdb6645923c9c8b95bf3360186fa7a"
    }
  }
}
