{
  "lockfileVersion": 2,
  "subjects": {
    "app.wolrdpulse/wolrdpulse": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "sse",
        "url": "https://wolrdpulse.app/sse"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "wolrdpulse-mcp",
        "version": "1.0.0",
        "description": "WorldPulse Real-Time Cloud & DevOps Intelligence Server"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "get_cloud_status",
          "description": "Retrieve real-time operational status, incident summaries, and latency metrics across major developer and cloud infrastructure providers (AWS, GitHub, Cloudflare, OpenAI, Anthropic, Vercel, Supabase, NPM, Discord, Reddit, and Datadog). Returns overall health state, individual component statuses, and active incident details.",
          "inputSchema": {
            "properties": {
              "provider": {
                "description": "Optional identifier of a single cloud or developer platform to query. If omitted, returns real-time status across all 11 monitored providers.",
                "enum": ["aws", "github", "cloudflare", "openai", "anthropic", "vercel", "supabase", "npm", "discord", "reddit", "datadog"],
                "examples": ["github", "aws", "openai", "vercel"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fbcedc71f8d56f0bc778cca93a12266c8240fc7971de99b5b67f0ce71c5736a1"
        },
        {
          "name": "get_tech_pulse",
          "description": "Fetches real-time developer ecosystem intelligence: latest stable releases of major infrastructure software and developer tools (Kubernetes, Docker, Bun, Next.js, Go, Rust), alongside trending developer repositories on GitHub.",
          "inputSchema": {
            "properties": {
              "category": {
                "default": "all",
                "description": "Filter technology pulse data by category. Choose 'all' for complete release and trending digest, 'releases' for software version updates, or 'trending' for developer repositories.",
                "enum": ["all", "releases", "trending"],
                "examples": ["all", "releases", "trending"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of items to return in the feed.",
                "examples": [5, 10, 20],
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4328463d5f8a89f3e5947d534e9471c7407c2f6d52b21d24f5e12ec6a520e0f2"
        },
        {
          "name": "inspect_dns",
          "description": "Alias for query_dns. Resolves live DNS records via Cloudflare DNS-over-HTTPS (1.1.1.1) to diagnose domain propagation, mail exchange routing, or ownership verification records.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "The target domain name or hostname to query via DNS-over-HTTPS.",
                "examples": ["wolrdpulse.app", "github.com", "vercel.com"],
                "minLength": 3,
                "pattern": "^[a-zA-Z0-9.-]+$",
                "type": "string"
              },
              "recordType": {
                "default": "A",
                "description": "The DNS Resource Record type to query. Defaults to 'A'.",
                "enum": ["A", "AAAA", "CNAME", "MX", "TXT", "NS", "SOA", "CAA"],
                "examples": ["A", "CNAME", "MX", "TXT"],
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c112cce6030262ba4d0744d90cacf48214b5b1713ea8a80697ab341f559177b6"
        },
        {
          "name": "inspect_ssl",
          "description": "Connects securely via TLS socket to inspect an endpoint's SSL/TLS certificate chain. Returns certificate validity, exact expiration date, remaining valid days, issuer organization, subject common name, SHA-256 fingerprint, and serial number.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Fully qualified domain name (FQDN) or hostname to probe for TLS certificate details (e.g. 'api.github.com' or 'wolrdpulse.app'). Do not include protocol prefixes.",
                "examples": ["api.github.com", "wolrdpulse.app", "openai.com"],
                "minLength": 3,
                "pattern": "^[a-zA-Z0-9.-]+$",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3a5fe93b33773b531b6255618404cde8003b490c68e0bc08c298067d5495418c"
        },
        {
          "name": "ping_endpoint",
          "description": "Pings a public HTTP or HTTPS web service or API endpoint to measure Time-To-First-Byte (TTFB) latency, HTTP response status code, status message, and inspect diagnostic HTTP headers (Cloudflare ray, server, cache-control, HSTS).",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "The full HTTP or HTTPS URL to ping (e.g. 'https://api.github.com' or 'https://wolrdpulse.app').",
                "examples": ["https://api.github.com", "https://wolrdpulse.app", "https://api.openai.com/v1/models"],
                "format": "uri",
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:67cd167e54d362cfbd76602e1abfbfc94dbee860a5c6e073e7d155b773eb8204"
        },
        {
          "name": "query_dns",
          "description": "Performs live DNS resolution queries using Cloudflare DNS-over-HTTPS (DoH 1.1.1.1). Resolves standard DNS Resource Record types (A, AAAA, CNAME, MX, TXT, NS, SOA, CAA) and returns authoritative answers, TTL values, and resolution latency.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "The target domain name or hostname to query via DNS-over-HTTPS.",
                "examples": ["wolrdpulse.app", "github.com", "vercel.com"],
                "minLength": 3,
                "pattern": "^[a-zA-Z0-9.-]+$",
                "type": "string"
              },
              "recordType": {
                "default": "A",
                "description": "The DNS Resource Record type to query. Defaults to 'A'.",
                "enum": ["A", "AAAA", "CNAME", "MX", "TXT", "NS", "SOA", "CAA"],
                "examples": ["A", "CNAME", "MX", "TXT"],
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:393ca04ec42a2723792ee87a9bbe936c99eb44b0f8de17d0d616b194b6d71bef"
        }
      ],
      "digest": "sha256:5082f241e397d47574b4fcf9b397a2d01a429b1fb919b64686ccf35cab6e92fe"
    }
  }
}
