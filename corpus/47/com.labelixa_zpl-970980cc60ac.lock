        {
          "name": "cpcl_validate",
          "title": "Validate CPCL",
          "description": "Lint CPCL label code and return positioned findings with severity as JSON. Checks the command set Labelixa implements from the CPCL manual — a clean result is not a guarantee that a specific printer accepts the job. Run this before cpcl_preview; if you are not sure which language the code is, call language_detect first.",
          "inputSchema": {
            "properties": {
              "cpcl": {
                "description": "Raw CPCL code",
                "type": "string"
              }
            },
            "required": ["cpcl"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "diagnostics": {
                "items": {
                  "properties": {
                    "code": {
                      "description": "Stable diagnostic code, e.g. ZPL0002",
                      "type": "string"
                    },
                    "col": {
                      "type": "integer"
                    },
                    "end_col": {
                      "type": "integer"
                    },
                    "end_line": {
                      "type": "integer"
                    },
                    "line": {
                      "type": "integer"
                    },
                    "message": {
                      "description": "Human-readable message in the requested language",
                      "type": "string"
                    },
                    "message_key": {
                      "description": "i18n key for the message",
                      "type": "string"
                    },
                    "severity": {
                      "enum": ["error", "warning", "info"],
                      "type": "string"
                    }
                  },
                  "required": ["code", "col", "line", "severity"],
                  "type": "object"
                },
                "type": "array"
              },
              "summary": {
                "properties": {
                  "error": {
                    "type": "integer"
                  },
                  "info": {
                    "type": "integer"
                  },
                  "total": {
                    "type": "integer"
                  },
                  "warning": {
                    "type": "integer"
                  }
                },
                "required": ["error", "info", "total", "warning"],
                "type": "object"
              }
            },
            "required": ["diagnostics", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Validate CPCL"
