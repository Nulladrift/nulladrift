      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Labelixa renders, validates, debugs and converts thermal printer labels: ZPL, EPL, TSPL and CPCL. Typical flow: zpl_validate (or epl_validate / tspl_validate / cpcl_validate) to lint, then zpl_preview (or the matching *_preview tool) to see the rendered label as PNG. Other tools cover DPI conversion, barcode analysis, printer compatibility, label templates and image-to-ZPL. Anonymous use is rate-limited per IP; pass a Labelixa API key (Authorization: Bearer lbx_...) to use the account's own quota.",
      "tools": [
        {
          "name": "barcode_png",
          "title": "Generate barcode PNG",
          "description": "Generate a single barcode as a PNG image (Code 128, QR, DataMatrix, EAN-13, UPC-A, PDF417 and more). For a full label with text and layout, write ZPL and use zpl_preview instead.",
          "inputSchema": {
            "properties": {
              "data": {
                "description": "Data to encode",
                "type": "string"
              },
              "type": {
                "default": "code128",
                "description": "Symbology (code128, qr, datamatrix, ean13, upca, pdf417...)",
                "type": "string"
              }
            },
            "required": ["data"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Generate barcode PNG"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:009e7e47efc6ac79bff7af043b61e4a1964586ab71ae324734ac94672f03ab3d"
        },
