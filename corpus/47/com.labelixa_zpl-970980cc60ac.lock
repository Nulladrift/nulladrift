        {
          "name": "convert_zpl_dpi",
          "title": "Convert ZPL DPI",
          "description": "Rescale ZPL between printer resolutions (203/300/600 DPI): coordinates, fonts, barcode module width and label size are scaled. Embedded ^GF/~DG image data is NOT scaled; the response says so instead of silently passing it through.",
          "inputSchema": {
            "properties": {
              "source_dpi": {
                "description": "Resolution the ZPL was written for, in DPI (not dpmm: 203 DPI = 8 dpmm).",
                "enum": [152, 203, 300, 600],
                "type": "integer"
              },
              "target_dpi": {
                "description": "Resolution to rescale to, in DPI. Equal to source_dpi means no scaling.",
                "enum": [152, 203, 300, 600],
                "type": "integer"
              },
              "zpl": {
                "description": "Raw ZPL code",
                "type": "string"
              }
            },
            "required": ["source_dpi", "target_dpi", "zpl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Convert ZPL DPI"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a9f0957f6a6622336c03c888dbf4632bcd5d9d66e09a0e25e87a333671433ef1"
        },
        {
          "name": "cpcl_preview",
          "title": "Render CPCL label",
          "description": "Render CPCL label code and return a PNG preview. The preview assumes 203 dpi and is an interpretation of the CPCL manual covering a core command subset — no physical printer validation. `labels` in the response is the TOTAL number of labels the stream prints (a stream may contain several, each ended by `PRINT`); pass `index` to render a different one.",
          "inputSchema": {
            "properties": {
              "cpcl": {
                "description": "Raw CPCL code",
                "type": "string"
              },
              "index": {
                "default": 0,
                "description": "Label index in the stream",
                "type": "integer"
              }
            },
            "required": ["cpcl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Render CPCL label"
