        {
          "name": "bulk_submit",
          "title": "Submit bulk label job",
          "description": "Submit a bulk label production job: one ZPL template with {{variable}} placeholders plus data rows (one object per label). Requires an API key whose plan includes bulk jobs. Quota is charged UPFRONT, one operation per row, and failed rows are not refunded; rows per job are capped by plan. Returns the job id — check bulk_status (small jobs usually finish within seconds).",
          "inputSchema": {
            "properties": {
              "dpmm": {
                "default": 8,
                "description": "Print density (default 8)",
                "enum": [6, 8, 12, 24],
                "type": "integer"
              },
              "height_in": {
                "description": "Label height, inches",
                "type": "number"
              },
              "output": {
                "default": "zpl",
                "description": "Output format (default zpl)",
                "enum": ["zpl", "png", "pdf"],
                "type": "string"
              },
              "rows": {
                "description": "One object per label: placeholder name -> value, e.g. [{\"name\": \"Ada\", \"sku\": \"A-1\"}]",
                "items": {
                  "additionalProperties": {
                    "type": "string"
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "width_in": {
                "description": "Label width, inches",
                "type": "number"
              },
              "zpl": {
                "description": "ZPL template with {{name}} placeholders",
                "type": "string"
              }
            },
            "required": ["rows", "zpl"],
            "type": "object"
          },
