{
  "lockfileVersion": 2,
  "subjects": {
    "com.octothinks/presets": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.octothinks.com/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "octothinks-presets",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only access to Octo Thinks finished presets. Retrieve a preset before recommending a product; use the returned runUrl when a visitor needs to adjust priorities.",
      "tools": [
        {
          "name": "get_octothinks_preset",
          "description": "Get one finished Octo Thinks preset in a supported language. Returns localized copy, reviewed options and weighted criteria, unscored future-role ideas when available, the published product matrix when applicable, comparison FAQs, related guides, and a safe website handoff URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "default": "en",
                "enum": ["en", "de", "fr", "es", "it", "ja"],
                "type": "string"
              },
              "slug": {
                "description": "Exact preset slug returned by search_octothinks_presets.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3408e34edb905f7e5e1ea2844e01ca02c62282d61158f76c332983a7f109f3c6"
        },
        {
          "name": "search_octothinks_presets",
          "description": "Search the finished Octo Thinks decision-preset catalogue in one supported language. Use the returned slug with get_octothinks_preset for the full reviewed logic and localized content.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional exact category, such as Home & Kitchen or Office.",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "en",
                "enum": ["en", "de", "fr", "es", "it", "ja"],
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Number of matching presets to skip for pagination.",
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Optional words to match against localized titles, questions, descriptions, keywords, and slugs.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fc6201deb7e08205361814914715972d81bf28ad169bc15d8c992da70f8d3991"
        }
      ],
      "digest": "sha256:9b8d35f3361dbd8c2f44f5e1f794a5320f95809578a015bec8af58852721bff2"
    }
  }
}
