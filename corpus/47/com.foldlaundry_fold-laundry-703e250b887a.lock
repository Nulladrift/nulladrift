        {
          "name": "enroll_in_club",
          "title": "Enroll in Fold Club",
          "description": "Enroll a Fold customer in Fold Club. Requires a recent order code + email for identity (same auth model as track_order). The customer MUST have a saved card on file — if not, we return an error pointing them to /app/payment. Three plans: WF_CLUB (Wash & Fold), DC_CLUB (Dry Cleaning), ALL_IN (Wash & Fold + Dry Cleaning), each MONTHLY or ANNUAL; current monthly prices are in get_pricing → membership. Annual billing: 1 month free (pay for 11 months, i.e. 11 × the monthly price). The card is charged immediately and the plan renews automatically (every month, or every year for ANNUAL) at that price until cancelled; cancel any time in the app (Account → Fold Club) — the plan then runs to the end of the paid month/year with no refund for unused time. Before calling this tool, look up the price with get_pricing and tell the customer the exact amount, that it renews automatically, and how to cancel, and get their explicit yes. promoCode WELCOME gives the first month free on MONTHLY billing only (it is typically sent to customers by SMS/email after their first delivery); promo codes are rejected on ANNUAL.",
          "inputSchema": {
            "properties": {
              "billingInterval": {
                "description": "Billing cadence. ANNUAL: 1 month free (pay for 11 months), charged once per year in advance, renews automatically each year.",
                "enum": ["MONTHLY", "ANNUAL"],
                "type": "string"
              },
              "email": {
                "description": "Customer email — must match the recentOrderCode owner.",
                "type": "string"
              },
