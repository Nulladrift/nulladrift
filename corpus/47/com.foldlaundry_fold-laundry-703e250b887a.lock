              },
              "idempotencyKey": {
                "description": "UUID recommended. Retrying a confirmed call with the same key returns the same orders.",
                "type": "string"
              },
              "turnovers": {
                "items": {
                  "properties": {
                    "addressId": {
                      "description": "Saved address (property) id from get_my_account.",
                      "type": "string"
                    },
                    "checkoutDate": {
                      "description": "YYYY-MM-DD guest checkout = pickup day.",
                      "type": "string"
                    },
                    "nextCheckInDate": {
                      "description": "YYYY-MM-DD next guest check-in = return day. Default: day after checkout.",
                      "type": "string"
                    },
                    "notes": {
                      "description": "For this pickup only, e.g. \"2 king sets + 6 bath towels\".",
                      "type": "string"
                    },
                    "pickupWindow": {
                      "description": "Pickup window label for that market.",
                      "type": "string"
                    },
                    "service": {
                      "enum": ["WASH_AND_FOLD", "DRY_CLEANING", "BOTH"],
                      "type": "string"
                    }
                  },
                  "required": ["addressId", "checkoutDate"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              }
