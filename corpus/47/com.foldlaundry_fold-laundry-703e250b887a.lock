        {
          "name": "book_for_hotel_guest",
          "title": "Schedule for a hotel guest (front desk)",
          "description": "Requires the connected Fold account of front-desk staff at a Fold partner hotel (the login must belong to the hotel's Fold business account). Schedules laundry pickup for a guest by room number at that hotel. billTo='hotel' (default) puts the order on the hotel's monthly Fold statement so the hotel can charge the guest's folio: no card link is sent and no card is charged. billTo='guest' sends the guest the usual card link instead and is priced at the hotel guest rates (see book_hotel_pickup); billTo='hotel' orders are priced on the hotel's Fold contract rates, with the same hotel order minimum (get_pricing → hotelGuestRates). Guest name, email and phone are still needed for status updates. returnPreference: same_day (bag at the desk before 9 AM), express_same_day (9 AM–noon, Express surcharge), next_day, or flexible. This creates a real order.",
          "inputSchema": {
            "properties": {
              "billTo": {
                "description": "Default 'hotel' (on the hotel's monthly statement).",
                "enum": ["hotel", "guest"],
                "type": "string"
              },
              "guestEmail": {
                "description": "For order status updates and the receipt.",
                "type": "string"
              },
              "guestFirstName": {
                "type": "string"
              },
              "guestLastName": {
                "type": "string"
              },
              "guestPhone": {
                "description": "E.164 or US 10-digit, for pickup/delivery texts.",
                "type": "string"
              },
              "hotelAccountName": {
                "description": "Only needed if this login belongs to more than one partner hotel.",
                "type": "string"
              },
              "idempotencyKey": {
                "description": "UUID recommended. Retrying with the same key returns the same order.",
                "type": "string"
              },
              "notes": {
                "description": "For this order only, e.g. \"2 dress shirts on hangers, rush for 6 PM event\".",
                "type": "string"
              },
              "returnPreference": {
                "enum": ["same_day", "express_same_day", "next_day", "flexible"],
                "type": "string"
              },
              "roomNumber": {
                "type": "string"
              },
              "services": {
                "items": {
                  "enum": ["WASH_AND_FOLD", "DRY_CLEANING", "HANG_DRY"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["guestEmail", "guestFirstName", "guestLastName", "guestPhone", "returnPreference", "roomNumber", "services"],
            "type": "object"
