                "description": "Which Club plan to enroll in.",
                "enum": ["WF_CLUB", "DC_CLUB", "ALL_IN"],
                "type": "string"
              },
              "promoCode": {
                "description": "Optional Stripe promo code (e.g. WELCOME for first month free). MONTHLY billing only.",
                "type": "string"
              },
              "recentOrderCode": {
                "description": "A recent Fold order code (FOLD-XXXXX) belonging to this customer — used as proof of identity.",
                "type": "string"
              }
            },
