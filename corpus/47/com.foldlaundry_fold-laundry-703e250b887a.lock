        {
          "name": "book_my_pickup",
          "title": "Schedule a pickup (signed in)",
          "description": "Requires the customer's connected Fold account. Schedules a pickup at one of their SAVED addresses using their saved card, gate code / access notes and laundry preferences — no payment link needed. Omit addressId to use their default address. pickupWindow must be one of the market's windows; if it is missing or invalid the response lists the valid windows and nothing is scheduled. Delivery is the next evening by default (Fold delivers in the evening only). sameAsLastOrder=true reuses the service, address and pickup window of the customer's most recent order (or of sameAsOrderCode, e.g. from a receipt); anything passed explicitly overrides it. This creates a real order. An optional idempotencyKey (UUID) makes retries return the same order instead of creating a second one.",
          "inputSchema": {
            "properties": {
              "addressId": {
                "description": "One of the customer's saved addressIds (from get_my_account). Default: their default address.",
                "type": "string"
              },
              "deliveryDate": {
                "description": "YYYY-MM-DD. Default: the day after pickup.",
                "type": "string"
              },
              "deliveryWindow": {
                "description": "Evening delivery window label. Default: the market's evening window.",
                "type": "string"
              },
              "idempotencyKey": {
                "description": "UUID recommended. Retrying with the same key returns the same order.",
                "type": "string"
              },
              "notes": {
                "description": "Notes for THIS order only (e.g. \"wine stain on white shirt\"). Standing preferences are applied automatically.",
                "type": "string"
              },
              "pickupDate": {
                "description": "YYYY-MM-DD, today or later (Pacific time).",
                "type": "string"
              },
              "pickupWindow": {
                "description": "Pickup window label, e.g. \"7:30 AM – 9:30 AM\".",
                "type": "string"
              },
              "sameAsLastOrder": {
                "description": "Reuse service, address and pickup window from the most recent order (\"same as last time\").",
                "type": "boolean"
              },
              "sameAsOrderCode": {
                "description": "Reuse service, address and pickup window from this specific past order (e.g. FOLD-24083).",
                "type": "string"
              },
              "service": {
                "description": "What to clean. Default WASH_AND_FOLD.",
                "enum": ["WASH_AND_FOLD", "DRY_CLEANING", "BOTH"],
                "type": "string"
              }
            },
            "type": "object"
          },
