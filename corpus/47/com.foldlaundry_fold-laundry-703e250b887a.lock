        {
          "name": "book_hotel_pickup",
          "title": "Schedule hotel pickup",
          "description": "Schedule a laundry pickup for a hotel guest. Creates an order without requiring a Fold account. Returns an order tracking code (FHL-XXXXXX) and a Stripe payment-setup URL. The user must visit the Stripe URL to enter their card before pickup. The card is NOT charged when scheduling — only after intake when the actual price is known.\n\nHotel guest pricing (current amounts: get_pricing → hotelGuestRates): wash & fold is a flat price up to a set weight, then per pound; dry cleaning is priced per garment. There is a hotel order minimum (higher when the order is booked and returned the same day) covering wash & fold and dry cleaning. A flat hotel service charge is added to every hotel order on top of the minimum, and the Express surcharge (when chosen) is also on top — neither counts toward the minimum. The response repeats the amounts that apply to this booking.\n\nReturn-time tiers:\n  • same_day — guest must drop the bag before 9 AM Pacific. Standard same-day return (back by 8 PM), no surcharge. Covers wash & fold AND dry cleaning.\n  • express_same_day — drop between 9 AM and 12 PM. ⚡ Express same-day (back by 8 PM tonight). Flat Express surcharge (get_pricing → hotelExpressSurcharge).\n  • next_day — drop any time. Standard next-day return (back by 8 PM tomorrow). No surcharge. Most common choice.\n  • flexible — 48+ hours. No surcharge.\n\nSame-day options are not available after 12 PM Pacific time (Los Angeles / San Francisco); requests after noon are next_day or later. The server enforces these cut-offs on its own clock: a same_day request between 9 AM and noon is refused with a message to use express_same_day — confirm the Express surcharge with the guest before retrying — and any same-day request after noon is refused (use next_day). It never adds a surcharge or changes the day silently.",
          "inputSchema": {
            "properties": {
              "guestEmail": {
                "description": "Guest email (used for tracking + receipts)",
                "type": "string"
              },
              "guestFirstName": {
                "description": "Guest first name",
                "type": "string"
              },
              "guestLastName": {
                "description": "Guest last name",
                "type": "string"
              },
              "guestPhone": {
                "description": "Guest phone in E.164 format (+1XXXXXXXXXX) or US 10-digit",
                "type": "string"
              },
              "hotelName": {
                "description": "Hotel display name (from search_hotels result). Required.",
                "type": "string"
              },
              "hotelPlaceId": {
                "description": "Google Place ID for the hotel, obtained from search_hotels. Required.",
                "type": "string"
              },
              "idempotencyKey": {
                "description": "OPTIONAL — pass a unique identifier (UUID recommended) to make this call safe to retry. If we have already seen this key, we return the EXISTING order code instead of creating a duplicate. Highly recommended for production agents that may retry on network errors.",
                "type": "string"
              },
              "notes": {
                "description": "Optional special instructions (e.g. \"no fabric softener\", \"handle silk delicately\").",
                "type": "string"
              },
              "returnPreference": {
                "description": "When the guest wants the laundry back. same_day requires drop-off before 9 AM (no surcharge). express_same_day works for drop-off between 9 AM and 12 PM noon (+$30 surcharge, back by 8 PM tonight). next_day is the typical choice — drop any time, back by 8 PM tomorrow (no surcharge). flexible = 48hr+. Pick same_day or express_same_day only if local time clearly allows it.",
                "enum": ["same_day", "express_same_day", "next_day", "flexible"],
                "type": "string"
              },
              "roomNumber": {
                "description": "Guest room number at the hotel",
                "type": "string"
              },
              "services": {
                "description": "What services to perform. Most guests pick WASH_AND_FOLD.",
                "items": {
                  "enum": ["WASH_AND_FOLD", "DRY_CLEANING", "HANG_DRY"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["guestEmail", "guestFirstName", "guestLastName", "guestPhone", "hotelName", "hotelPlaceId", "returnPreference", "roomNumber", "services"],
            "type": "object"
          },
