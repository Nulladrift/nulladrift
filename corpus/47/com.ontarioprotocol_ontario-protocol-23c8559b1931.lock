      "serverInfo": {
        "name": "ontario-protocol",
        "title": "Ontario Protocol",
        "version": "1.0.14",
        "description": "Find live x402 APIs for any task (0.005 USDC, no match no charge); Base balance, tx and gas reads.",
        "websiteUrl": "https://ontarioprotocol.com",
        "icons": [
          {
            "src": "https://ontarioprotocol.com/static/ontario-o-mark-v6-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"],
            "theme": "dark"
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Ontario Protocol: x402 discovery and pre-payment verification for agent commerce. The default catalog supports buyers and endpoint providers: route, find, verify, decide, build a provider launch payload for free, or publish a service profile only when ontario_purchase_router returns paid_recommended. Free tools cost 0 USDC. Paid tools return x402 payment requirements (USDC on Base) when called without payment. The full catalog is at /mcp/full.",
      "tools": [
        {
          "name": "agent_can_pay",
          "title": "Agent Payment Preflight",
          "description": "Free pre-payment policy decision: allow, review, or deny for one x402 endpoint under strict, standard, or permissive policy, with reasons and report evidence. require_audit_receipt adds a handoff to the optional settlement-backed receipt.",
          "inputSchema": {
            "properties": {
              "agent_policy": {
                "description": "Readiness policy to apply. Use strict unless the operator explicitly permits a different policy.",
                "enum": ["strict", "standard", "permissive"],
                "type": "string"
              },
              "endpoint": {
                "description": "Public x402 endpoint to evaluate before payment; never include credentials or private query parameters.",
                "type": "string"
              },
              "max_usdc": {
                "description": "Caller-approved per-call spending ceiling in decimal USDC, for example 0.01. This check never spends funds.",
                "type": "string"
              },
              "require_audit_receipt": {
                "default": false,
                "description": "Explicitly request the optional paid receipt handoff after an allow decision. This does not submit payment.",
                "type": "boolean"
              }
            },
            "required": ["endpoint"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "auditable_paid_continuation": {
                "additionalProperties": true,
                "type": "object"
              },
              "decision": {
                "enum": ["allow", "review", "deny"],
                "type": "string"
              },
              "decision_code": {
                "type": "string"
              },
              "decision_schema_version": {
                "type": "string"
              },
              "declared_price_usdc": {
                "type": "number"
              },
              "endpoint": {
                "type": "string"
              },
              "max_usdc": {
                "type": "number"
              },
              "reasons": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "recommendations": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "report": {
                "additionalProperties": true,
                "type": "object"
              },
              "report_integrity_ok": {
                "type": "boolean"
              },
              "verification_age_hours": {
                "type": "number"
              }
            },
            "required": ["decision", "decision_code", "decision_schema_version"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Agent Payment Preflight"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:346dd25993e6f7963d228cc344bb0538ba50005a6077b18c344bb7f89b7ce0c9"
        },
        {
          "name": "agent_trust_preview",
          "title": "Agent Trust Preview",
