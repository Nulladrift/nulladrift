                      }
                    },
                    "required": ["decimals", "formatted", "raw", "symbol"],
                    "type": "object"
                  },
                  "network": {
                    "const": "eip155:8453"
                  },
                  "read_at": {
                    "type": "string"
                  },
                  "schema": {
                    "const": "ontario.base_balances.v1"
                  },
                  "source": {
                    "const": "Base RPC"
