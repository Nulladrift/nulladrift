        {
          "name": "ontario_purchase_router",
          "title": "Ontario Free/Paid Purchase Router",
          "description": "Free deterministic routing of one public task to Ontario's free and paid tools. Returns the matching tool and a decision (free_only, run_free_preflight, or paid_recommended with the tool's price, network and budget check). Natural endpoint-verification tasks route to the free readiness verifier, with the optional 0.002 USDC settlement-backed receipt disclosed. Provider jobs such as publishing, registering, or making an x402 endpoint discoverable route to the self-serve 0.50 USDC publication product and its free validator. Paid reads it can recommend: ontario_find-api (a live-checked paid API for a task), ontario_base-balances (Base wallet balances), ontario_base-tx-check (whether a Base transaction settled) and ontario_base-gas (current Base gas prices). Existing paid profiles route to the 0.10 USDC evidence refresh and its free refresh validator. Empty calls return task examples instead of guessing a purchase. This tool never invokes another tool, signs a payload, or spends funds.",
          "inputSchema": {
            "properties": {
              "free_preflight_complete": {
                "default": false,
                "description": "True only after the recommended free check has completed for this task.",
                "type": "boolean"
              },
              "max_usdc": {
                "anyOf": [
                  {
                    "pattern": "^\\s*(?:[Uu][Ss][Dd][Cc]?\\s*)?\\$?\\s*(?:(?:0|[1-9][0-9]{0,2})(?:\\.[0-9]+)?|1000(?:\\.0+)?)\\s*(?:[Uu][Ss][Dd][Cc]?)?\\s*$",
                    "type": "string"
                  },
                  {
                    "maximum": 1000,
                    "minimum": 0,
                    "type": "number"
                  }
                ],
                "description": "Optional owner-authorized per-call USDC ceiling from 0 to 1000. Send a JSON number or decimal string such as 0.5, '0.50', '$0.50' or '0.50 USDC'. Omit when no budget is authorized; a budget is only a ceiling and does not grant spending authority. The router never increases it.",
                "examples": ["0", "0.002", "0.10", "0.50", 0.5, "0.50 USDC"]
              },
              "network": {
                "default": "eip155:8453",
                "description": "Wallet policy network; Ontario paid tools currently require Base mainnet.",
                "type": "string"
              },
              "task": {
                "description": "Public task description only; never include credentials or private customer data.",
                "examples": ["Verify endpoint readiness before payment", "Publish my x402 endpoint as a public service profile", "Refresh my existing x402 service profile", "Create a settlement-backed payment decision receipt", "Which x402 API should my agent call for web search", "Check whether a Base USDC transaction settled"],
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              },
              "wallet_enabled": {
