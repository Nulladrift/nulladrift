                        }
                      },
                      "required": ["address", "decimals", "formatted", "raw", "source", "symbol"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "required": ["address", "block", "native", "network", "read_at", "schema", "source", "tokens"],
                "type": "object"
              }
