        {
          "name": "ontario_base-tx-check",
          "title": "Base Transaction Check",
          "description": "Verify Base transaction by hash: status, block, timestamp and confirmations, with USDC and ERC-20 Transfers decoded (token, from, to, amount; up to 100 listed, transfers_total gives the full count), any EIP-3009 authorization used, and match flags for an expected payTo and amount, so an x402 payment receipt or PAYMENT-RESPONSE can be checked as settled. Required: hash. $0.002 USDC on Base. Transaction not found, no charge. No account, no API key. Base mainnet only. [PAID: 0.002 USDC via x402 on Base. Two-step flow: a call without payment returns MCP PaymentRequired; the retry carries the signed PaymentPayload in params._meta['x402/payment']. The legacy _x402_payment base64 argument is also supported. Signing happens in the caller's wallet.]",
