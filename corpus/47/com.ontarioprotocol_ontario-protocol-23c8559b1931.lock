        },
        {
          "name": "bazaar_buyer_intent_gap",
          "title": "Bazaar Buyer Intent Gap",
          "description": "Free read-only provider audit that runs Coinbase's indexing preflight and measures one public x402 endpoint across five live CDP Bazaar buyer-search variations. Returns retrieval coverage, observed sample ranks, alternatives, public 30-day call and unique-payer observations, Base USDC price bands, HTTP 402 and metadata readiness, and the activation boundary. Public quality counts may include owner-funded calls and are not revenue. It never signs or settles.",
          "inputSchema": {
            "properties": {
              "buyer_queries": {
                "description": "Optional explicit portfolio of up to five public buyer phrases. When omitted, Ontario generates four deterministic variants from buyer_query.",
                "items": {
                  "maxLength": 160,
                  "minLength": 3,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "buyer_query": {
                "description": "Public task phrase a funded agent could use in CDP Bazaar search; never include credentials or private customer text.",
                "maxLength": 160,
                "minLength": 3,
                "type": "string"
              },
              "target_url": {
                "description": "Public x402 paid endpoint whose buyer visibility should be measured.",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["buyer_query", "target_url"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "buyer_fit": {
                "type": "object"
              },
              "buyer_intent": {
                "type": "object"
              },
              "buyer_intent_portfolio": {
                "type": "object"
              },
              "catalog_visibility": {
                "type": "object"
              },
              "cdp_validation": {
                "type": "object"
              },
              "checked_at": {
                "format": "date-time",
                "type": "string"
              },
              "checks": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "grade": {
                "enum": ["metadata_ready", "close_to_metadata_ready", "needs_work"]
              },
              "max_score": {
                "const": 100
              },
              "next_actions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "report_id": {
                "pattern": "^bazaar_[a-f0-9]{18}$",
                "type": "string"
              },
              "schema": {
                "const": "ontario.coinbase_bazaar_readiness.v1"
              },
              "score": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "settlement_activation": {
                "description": "Observed indexing and activation state, not a promise of placement or demand.",
                "properties": {
                  "activation_required": {
                    "type": "boolean"
                  },
                  "catalog_placement_verified": {
                    "type": "boolean"
                  },
                  "free_check_attempted_settlement": {
                    "const": false
                  }
                },
                "required": ["activation_required", "catalog_placement_verified", "free_check_attempted_settlement"],
                "type": "object"
              },
              "status": {
                "const": "complete"
              },
              "target_url": {
                "format": "uri",
                "type": "string"
              },
              "trust_boundary": {
                "required": ["checks", "does_not", "limits", "methodology"],
                "type": "object"
              }
            },
            "required": ["buyer_intent_portfolio", "catalog_visibility", "checked_at", "checks", "grade", "report_id", "schema", "score", "settlement_activation", "status", "target_url", "trust_boundary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Bazaar Buyer Intent Gap"
          },
          "behavior": {
            "destructive": false,
