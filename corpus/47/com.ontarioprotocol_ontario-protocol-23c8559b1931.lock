        {
          "name": "ontario_base-balances",
          "title": "Base Wallet Balances",
          "description": "Base wallet balance: ETH, USDC and about 25 widely held Base tokens for any address, plus up to 20 ERC-20 token contracts you name, each with symbol, decimals, raw and formatted amount and the block number read, live from Base mainnet RPC. Required: address. $0.002 USDC on Base. Failed read, no charge. No account, no API key. Base mainnet only; no prices or USD values; tokens outside the list and your extras are not discovered. [PAID: 0.002 USDC via x402 on Base. Two-step flow: a call without payment returns MCP PaymentRequired; the retry carries the signed PaymentPayload in params._meta['x402/payment']. The legacy _x402_payment base64 argument is also supported. Signing happens in the caller's wallet.]",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "_x402_payment": {
                "description": "base64 x402 PaymentPayload (USDC on Base); obtain the requirements by calling this tool without it first.",
                "type": "string"
              },
              "address": {
                "description": "Base wallet or contract address to read.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "tokens": {
                "description": "Optional comma-separated ERC-20 contract addresses to read as well, max 20.",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "outputSchema": {
            "anyOf": [
              {
                "properties": {
                  "buyer_guide": {
                    "format": "uri",
                    "type": "string"
                  },
                  "hint": {
                    "type": "string"
                  },
                  "payment_policy": {
                    "format": "uri",
                    "type": "string"
                  },
                  "payment_required": {
                    "const": true
                  },
                  "x402": {
                    "type": ["object", "string"]
                  }
                },
                "required": ["hint", "payment_required", "x402"],
                "type": "object"
              },
              {
                "additionalProperties": true,
                "properties": {
                  "address": {
                    "type": "string"
                  },
                  "block": {
                    "type": "integer"
                  },
                  "block_timestamp": {
                    "type": ["string", "null"]
                  },
                  "coverage": {
                    "type": "object"
                  },
                  "coverage_note": {
                    "type": "string"
                  },
                  "native": {
                    "properties": {
                      "decimals": {
                        "const": 18
                      },
                      "formatted": {
                        "type": "string"
                      },
                      "raw": {
                        "type": "string"
                      },
                      "symbol": {
