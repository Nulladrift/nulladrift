        {
          "name": "find_x402_tool",
          "title": "Find a task-matched x402 tool",
          "description": "Free buyer-side search across Ontario's fresh strict-ready paid profiles, Agentic Market, and Coinbase CDP Bazaar. Returns unverified marketplace candidates ranked by task relevance plus bounded source-reported recent activity, with optional Base/USDC budget filtering; nothing is probed, so listings may be dead or mispriced. ontario_find-api returns live-checked candidates. Paid Ontario publication adds no ranking score. Provider-side publication queries return the free listing validator and the 0.50 USDC publication workflow.",
          "inputSchema": {
            "properties": {
              "active_only": {
                "default": true,
                "description": "When true, require recent source-reported activity or fresh strict-ready Ontario profile evidence.",
                "type": "boolean"
              },
              "limit": {
                "default": 5,
                "description": "Maximum number of task-matched candidates to return, from 1 to 10.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "max_usdc": {
                "description": "Optional hard USDC price ceiling for returned candidates.",
                "type": "string"
              },
              "network": {
                "description": "Optional network filter, for example eip155:8453 or base.",
                "type": "string"
              },
              "query": {
                "description": "Public task text only; never include credentials or private customer data.",
                "maxLength": 160,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "candidate_status": {
                "type": "string"
              },
              "candidates": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "count": {
                "type": "integer"
              },
              "intent": {
                "description": "provider_publication when provider-side listing intent is routed to the listing validation and publication workflow.",
                "type": "string"
              },
              "provider_path": {
                "additionalProperties": true,
                "description": "Machine-actionable free validation, optional pending submission, and gated paid publication sequence.",
                "type": "object"
              },
              "query": {
                "type": "string"
              },
              "schema": {
                "const": "ontario.x402_tool_router.v1"
              },
              "selection_method": {
                "type": "string"
              },
              "trust_boundary": {
                "type": "string"
              }
            },
            "required": ["candidates", "count", "query", "schema", "trust_boundary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find a task-matched x402 tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:caae0cb55276591056254daf69cae736cd17c36c7bc7792e36443d5f4b641cc2"
        },
