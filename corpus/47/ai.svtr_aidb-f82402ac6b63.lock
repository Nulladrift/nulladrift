        },
        {
          "name": "get_recent_funding_events",
          "title": "Recent AI Funding Events",
          "description": "最近 7 天有公开来源的 AI 融资事件（公开档位时间窗），可按赛道/行业主题标签/阶段/公司名等单一维度筛选。Sourced AI funding events from the last 7 days (public-tier window), filterable by one dimension (sector, industry topic tag such as AI4S, stage, company, country, year).",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "Company name filter.",
                "type": "string"
              },
              "country": {
                "description": "HQ country: Chinese name (美国), English name (United States) or ISO code (US).",
                "type": "string"
              },
              "lang": {
                "description": "Output language, default zh (Chinese).",
                "enum": ["zh", "en"],
                "type": "string"
              },
              "sector": {
                "description": "SVTR standard sector. English names (e.g. Robotics, Life Sciences) are also accepted.",
                "enum": ["算力", "数据", "训练与推理栈", "互连", "大模型", "垂类模型", "开发平台", "智能体", "优化测评", "生命科学", "企业服务", "金融服务", "安全合规", "机器人", "零售营销", "开发者", "效率工具", "社交文娱", "双碳环保", "垂类行业", "法律服务", "教育培训", "交通物流", "国防安防", "地产科技", "工业制造", "智能硬件"],
                "type": "string"
              },
              "stage": {
                "description": "Normalized funding stage. English names (e.g. Seed, Series A) are also accepted.",
                "enum": ["天使轮", "Pre-Seed", "种子轮", "A轮", "B轮", "C轮", "D轮及以后", "Pre-IPO轮", "IPO", "战略投资", "债务/可转债", "政府/科研资助", "二级/老股转让", "代币融资", "股权+债务", "未披露"],
                "type": "string"
              },
              "tag": {
                "description": "SVTR industry topic tag of the funded company (e.g. AI4S, 智能体, 人形机器人; see svtr.ai/orgs). Narrower than sector.",
                "type": "string"
              },
              "year": {
                "description": "Filter by announced year.",
                "maximum": 2030,
                "minimum": 2020,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
