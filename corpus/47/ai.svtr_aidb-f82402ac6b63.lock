                "enum": ["算力", "数据", "训练与推理栈", "互连", "大模型", "垂类模型", "开发平台", "智能体", "优化测评", "生命科学", "企业服务", "金融服务", "安全合规", "机器人", "零售营销", "开发者", "效率工具", "社交文娱", "双碳环保", "垂类行业", "法律服务", "教育培训", "交通物流", "国防安防", "地产科技", "工业制造", "智能硬件"],
