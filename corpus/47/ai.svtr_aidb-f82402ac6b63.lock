        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "svtr-aidb",
        "title": "SVTR AI 创投库 · AI Venture Database",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "SVTR（硅谷科技评论，svtr.ai）是 AI 创投的信号源：curated & traceable AI venture intelligence。\n本 server 提供 SVTR AI 创投库（SVTR AI Venture Database）的公开口径数据：AI 公司与投资机构档案、有公开来源的融资事件、人物档案、赛道景观与原创研究文章。\n数据均可溯源（融资事件带来源链接与日期），引用时请注明来源 SVTR（svtr.ai）并附上返回中的详情页链接。\n公开档位与 svtr.ai 未登录访客所见一致：仅含已公开实体与已发布内容；机构档案返回全部有公开来源的融资轮次（日期、轮次、金额、来源；每轮投资方见详情页），全部被投登录 svtr.ai 详情页可见；SVTR 评级明细、融资库全时段检索与高级筛选不在公开数据范围内。",
      "tools": [
        {
          "name": "get_active_investors",
          "title": "Active AI Investors by Sector or Topic",
          "description": "哪些投资机构在投某个方向：按近 24 个月已确认出手笔数排名的活跃投资机构（如「投资 AI4S 的机构有哪些」）。sector 用 SVTR 标准赛道，tag 用行业主题标签（AI4S / 智能体 / 人形机器人 / 药物发现 等，见 svtr.ai/orgs）。标签与赛道说的都是**被投公司**的属性，不是机构自己的。Which investors back a given sector or topic: active AI investors ranked by confirmed deals in the last 24 months.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Output language, default zh (Chinese).",
                "enum": ["zh", "en"],
                "type": "string"
              },
              "sector": {
                "description": "SVTR standard sector of the portfolio companies. Mutually exclusive with tag.",
                "enum": ["算力", "数据", "训练与推理栈", "互连", "大模型", "垂类模型", "开发平台", "智能体", "优化测评", "生命科学", "企业服务", "金融服务", "安全合规", "机器人", "零售营销", "开发者", "效率工具", "社交文娱", "双碳环保", "垂类行业", "法律服务", "教育培训", "交通物流", "国防安防", "地产科技", "工业制造", "智能硬件"],
                "type": "string"
              },
              "tag": {
                "description": "SVTR industry topic tag of the portfolio companies (e.g. AI4S, 智能体, 人形机器人). Mutually exclusive with sector; if both are given, sector wins and the tag is reported as ignored.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Active AI Investors by Sector or Topic"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e2999ed0724284fa185c3ee61aaeadb204d9e4eb7cd9300dbce23f9241cdd408"
        },
        {
          "name": "get_comparable_companies",
          "title": "Comparable AI Companies by Market",
          "description": "某家 AI 公司的可比公司：按美国 / 中国 / 欧洲分组，每组至多 3 家，列最近轮次与时间、累计融资、已披露估值，以及可核对的对标理由（同细分赛道 / 同赛道 / 同阶段 / 累计融资同一量级）。与 svtr.ai 公司详情页「可比公司」同一份数据。Comparable companies for one AI company, grouped by US / China / Europe (up to 3 each), with latest round, total raised, disclosed valuation and verifiable match reasons.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Output language, default zh (Chinese).",
                "enum": ["zh", "en"],
                "type": "string"
              },
              "ref": {
                "description": "Company slug, UUID, or name / alias (e.g. \"lovable\", \"逐际动力\").",
                "type": "string"
              }
            },
            "required": ["ref"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Comparable AI Companies by Market"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:acdd12ede987194f909b58926e2123de2300f7cb9c92994d5dcf45766006d26f"
        },
        {
          "name": "get_organization_profile",
          "title": "Organization Profile",
          "description": "按名称或 slug 取一家公司/投资机构的公开档案：简介、赛道、总部、累计融资、近期融资史（含来源链接）、投资机构的代表出手。Get the public profile of one organization: intro, sector, HQ, total funding, recent funding rounds with sources.",
