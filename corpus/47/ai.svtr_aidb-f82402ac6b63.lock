        {
          "name": "search_organizations",
          "title": "Search AI Companies & Investors",
          "description": "搜索 SVTR AI 创投库的公司与投资机构（按名称/别名，如 \"Anthropic\"、\"a16z\"）。Search AI companies and investors in the SVTR AI Venture Database by name or alias.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Output language, default zh (Chinese).",
                "enum": ["zh", "en"],
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 5).",
