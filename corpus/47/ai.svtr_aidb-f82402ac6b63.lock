        },
        {
          "name": "get_sector_landscape",
          "title": "AI Sector Funding Landscape",
          "description": "AI 赛道融资景观聚合统计：总额/笔数/中位数，全库赛道 Top10 或单赛道的阶段分布。仅聚合数字，无行级数据。Aggregated funding landscape: totals, top sectors, or stage breakdown for one sector.",
