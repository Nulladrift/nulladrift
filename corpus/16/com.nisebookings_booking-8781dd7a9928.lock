        {
          "name": "api_request",
          "title": "Raw management API request",
          "description": "Any /api/v1 management API call not covered by a dedicated tool. path is relative to /api/v1 (e.g. \"/services/<uuid>/extras\"), ids in place of {…}; put query parameters in query, the JSON body in body (camelCase). Same scopes and errors as the API: {error: {code, message, fields}}. Lists take limit ≤ 100 / offset and return {data, total}. Not for /public/ (use find_slots). Routes:\nGET /me\nGET POST /categories\nGET PATCH DELETE /categories/{id}\nGET POST /services\nGET PATCH DELETE /services/{id}\nGET POST /services/{id}/extras\nGET PATCH DELETE /services/{id}/extras/{extraId}\nGET PUT /services/{id}/fields\nGET PUT /services/{id}/parts\nGET POST /staff\nGET PATCH DELETE /staff/{id}\nGET PUT /staff/{id}/schedule\nGET /staff/{id}/services\nPUT DELETE /staff/{id}/services/{serviceId}\nGET POST /holidays\nDELETE /holidays/{id}\nGET PUT /business-hours\nGET PATCH /settings\nDELETE /sandbox\nPUT DELETE /settings/mollie-key\nGET POST /notifications\nGET /notifications/codes\nGET PATCH DELETE /notifications/{id}\nGET /outbox\nGET POST /coupons\nPOST /coupons/generate\nGET PATCH DELETE /coupons/{id}\nGET POST /events\nGET PATCH DELETE /events/{id}\nGET /events/{id}/attendees\nGET PUT /events/{id}/staff\nGET POST /events/{id}/ticket-types\nGET PATCH DELETE /events/{id}/ticket-types/{ticketTypeId}\nPOST /attendees/{id}/cancel\nGET POST /packages\nGET /packages/{id}\nGET POST /customers\nGET PATCH DELETE /customers/{id}\nGET POST /appointments\nGET PATCH DELETE /appointments/{id}\nPOST /appointments/{id}/bookings\nGET /bookings\nGET PATCH DELETE /bookings/{id}\nPOST /bookings/{id}/give-seat\nGET /payments\nGET /payments/{id}\nPOST /payments/{id}/complete\nPOST /payments/{id}/refund\nPOST /projects\nGET POST /webhooks\nGET /webhooks/events\nGET PATCH DELETE /webhooks/{id}\nPOST /webhooks/{id}/rotate-secret\nPOST /webhooks/{id}/test\nGET /webhooks/{id}/deliveries\nPOST /webhooks/{id}/deliveries/{deliveryId}/retry",
          "inputSchema": {
            "properties": {
              "body": {
                "description": "JSON body for POST/PATCH/PUT",
                "type": "object"
              },
              "method": {
                "enum": ["GET", "POST", "PATCH", "PUT", "DELETE"],
                "type": "string"
              },
              "path": {
                "description": "Relative to /api/v1, e.g. /coupons",
                "type": "string"
              },
              "query": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean"]
                },
                "description": "Query parameters",
                "type": "object"
              }
            },
            "required": ["method", "path"],
            "type": "object"
          },
