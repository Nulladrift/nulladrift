      "instructions": "Manage one booking tenant (the one owning your API key): catalogue, staff, schedules, customers, appointments, payments, events, coupons. Start with whoami to see the tenant and your scopes; use find_slots before booking; api_request reaches any other /api/v1 route. Lists page with limit (≤100) and offset and return total.",
