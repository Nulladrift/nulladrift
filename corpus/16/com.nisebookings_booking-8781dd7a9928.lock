        {
          "name": "create_appointment",
          "title": "Create appointment",
          "description": "Book like the admin: one appointment with one booking. Give customerId or customer {name, email, phone}. Without end the service duration is used; without status the tenant default. A day service (rental, durationDays > 0) starts at the local midnight (00:00) and without end spans its number of days. The staff member must offer the service. Admin checks (overlap, duration, schedule, holiday) return 422 code \"warnings\" with fields: explain them to the user and retry with force: true only if they agree. Hard limits are 409 capacity_exceeded / slot_unavailable. Response includes bookingId (use it for update_booking). With recurrence the call books the whole recurring series at once instead. To find free times use find_slots. Scope bookings:write.",
          "inputSchema": {
            "properties": {
              "customer": {
                "description": "New customer inline; an existing customer with this e-mail is reused",
                "properties": {
                  "email": {
                    "type": ["string", "null"]
                  },
                  "name": {
                    "type": "string"
                  },
                  "phone": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "customerId": {
                "format": "uuid",
                "type": "string"
              },
              "end": {
                "description": "ISO 8601 with offset, e.g. 2026-10-14T09:00:00+02:00",
                "format": "date-time",
                "type": "string"
              },
              "force": {
                "description": "Save despite warnings (422 code warnings)",
                "type": "boolean"
              },
              "internalNote": {
                "type": "string"
              },
              "notify": {
                "description": "true mails the customer like the admin \"inform the customer\" checkbox; default false",
                "type": "boolean"
              },
              "packageId": {
                "description": "Book a visit of this package",
                "format": "uuid",
                "type": "string"
              },
              "persons": {
                "description": "Default 1",
                "maximum": 999,
                "minimum": 1,
                "type": "integer"
              },
              "recurrence": {
                "description": "Create the whole series in one call: one appointment per occurrence (max 52) sharing one seriesId, every occurrence checked like a single creation. The response adds seriesId and appointmentIds; scope following|series then works on it.",
                "properties": {
                  "count": {
                    "description": "Occurrences including the first; count or until is required",
                    "maximum": 52,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "every": {
                    "description": "Every n days (daily) or weeks (weekly/biweekly); default 1",
                    "maximum": 30,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "freq": {
                    "enum": ["daily", "weekly", "biweekly", "monthly"],
                    "type": "string"
                  },
                  "monthly": {
                    "description": "Day of the month, or the nth weekday of the month (nth -1 = last)",
                    "oneOf": [
                      {
                        "properties": {
                          "day": {
                            "maximum": 31,
                            "minimum": 1,
                            "type": "integer"
                          }
                        },
                        "required": ["day"],
                        "type": "object"
                      },
                      {
                        "properties": {
                          "nth": {
                            "enum": [1, 2, 3, 4, -1],
                            "type": "integer"
                          },
                          "weekday": {
                            "description": "1 = Monday … 7 = Sunday",
                            "maximum": 7,
                            "minimum": 1,
                            "type": "integer"
                          }
                        },
                        "required": ["nth", "weekday"],
                        "type": "object"
                      }
                    ]
                  },
                  "on": {
                    "description": "Weekdays for weekly/biweekly; default the weekday of start",
                    "items": {
                      "description": "1 = Monday … 7 = Sunday",
                      "maximum": 7,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "type": "array"
                  },
                  "until": {
                    "description": "Last occurrence date, inclusive; count or until is required",
                    "format": "date",
                    "type": "string"
                  }
                },
                "required": ["freq"],
                "type": "object"
              },
              "serviceId": {
                "format": "uuid",
                "type": "string"
              },
              "staffId": {
                "format": "uuid",
                "type": "string"
              },
              "start": {
                "description": "ISO 8601 with offset, e.g. 2026-10-14T09:00:00+02:00",
                "format": "date-time",
                "type": "string"
              },
              "status": {
                "enum": ["pending", "approved", "cancelled", "rejected", "done", "waitlisted"],
                "type": "string"
              }
            },
            "required": ["serviceId", "staffId", "start"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:98cafc78e3f5fea9aebc3d5b3c0e3b8d65fd21f93fd1f72256e32cf7da76cc93"
        },
