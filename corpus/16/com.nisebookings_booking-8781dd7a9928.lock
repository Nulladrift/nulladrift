        {
          "name": "create_webhook",
          "title": "Create webhook endpoint",
          "description": "Register a URL that receives signed POSTs (Standard Webhooks: webhook-id, webhook-timestamp, webhook-signature \"v1,<base64 HMAC-SHA256>\" over \"id.timestamp.body\" keyed with the base64 part of the secret after whsec_). Payloads are thin ({id, type, createdAt, tenantId, data: ids + status, previousStatus, start}): fetch details via the API. url must be public https (private/loopback addresses are refused, 422 on url). events: booking.created, booking.updated, booking.cancelled, ticket.created, ticket.approved, ticket.cancelled, payment.completed, payment.failed, payment.refunded. Returns the endpoint plus `secret` (whsec_…) ONCE: store it now. Max 10 endpoints. Retries: 1m, 5m, 30m, 2h, 12h, 24h. Then call test_webhook. Scope settings:write.",
