{
  "lockfileVersion": 2,
  "subjects": {
    "co.antalyatransfers/transfers": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.antalyatransfers.co/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "antalyatransfers",
        "title": "Antalya Transfers",
        "version": "1.3.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Private airport transfers for Antalya (AYT) and the Antalya resorts. Call get_price_quote first, then create_transfer_request only when the customer asks to send it. A request is NOT a confirmed booking: the operator reviews it and confirms by email/WhatsApp; check get_request_status and only call a ride confirmed when operatorConfirmed is true. cancel_transfer_request cancels a pending or assigned request, only when the customer explicitly asks to cancel; once the operator has confirmed, the customer must contact the operator. Test requests (reserved test email addresses) are stored but never notified. Nothing is charged through this server and no payment is taken at booking; the customer pays the driver on arrival, in cash (EUR, USD or GBP) or by card.",
      "tools": [
        {
          "name": "cancel_transfer_request",
          "title": "Cancel a pending transfer request",
          "description": "Use this only when the customer has explicitly asked to cancel their transfer request and you have the booking reference returned by create_transfer_request and the email used for it. Cancels a request that is still pending or assigned, tells the operator (WhatsApp/email) and emails the customer a cancellation notice. Calling it again for an already-cancelled request is harmless and returns cancelled=true without notifying anyone again. Destructive and sends real messages: never call it to explore, to \"test\", or because the customer is merely unsure or wants to change details. Do not use for a request the operator has already confirmed (it is refused: the customer must contact the operator), for changing time/passengers/vehicle (contact the operator), or for refunds. Use get_request_status to check the current state first if unsure.",
          "inputSchema": {
            "properties": {
              "customerEmail": {
                "description": "Email address used when the request was submitted",
                "format": "email",
                "maxLength": 254,
                "type": "string"
              },
              "reason": {
                "description": "Optional short reason given by the customer",
                "maxLength": 200,
                "type": "string"
              },
              "reference": {
                "description": "Booking reference, e.g. AT-20260605-0001",
                "type": "string"
              }
            },
            "required": ["customerEmail", "reference"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "alreadyCancelled": {
                "description": "true when it had been cancelled before this call (no new notification sent)",
                "type": "boolean"
              },
              "cancelled": {
                "description": "true: the request is cancelled",
                "type": "boolean"
              },
              "message": {
                "type": "string"
              },
              "operatorNotified": {
                "type": "boolean"
              },
              "reference": {
                "type": "string"
              },
              "status": {
                "enum": ["cancelled"],
                "type": "string"
              }
            },
            "required": ["cancelled", "message", "reference", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5f14ee03815d2f5c5799b00b74fd33a4435ea4c0a61c2ba1c031c8549bcc9f43"
        },
        {
          "name": "create_transfer_request",
          "title": "Submit transfer request (pending operator confirmation)",
          "description": "Use this only after the customer has chosen a route, time and vehicle and has given their name, email and phone, and explicitly asked to send the request. Submits a transfer REQUEST that is stored as pending and reviewed by the operator, who confirms the ride and final price by email/WhatsApp. This does NOT confirm a booking, assign a driver or take payment — never tell the customer the ride is confirmed. Writes data: do not call it to explore prices (use get_price_quote) and do not retry on success. Pass idempotencyKey to make retries safe: the same key for the same customer returns the original reference (duplicate=true) and never creates a second request; to change details, cancel and submit a new request with a new key. Without a key, repeating identical details also returns the original request. At most 5 requests per phone number per day. Capacity is checked: parties larger than the vehicle are rejected with a suggested vehicle.",
          "inputSchema": {
            "properties": {
              "childSeats": {
                "description": "Child seats required",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "customerEmail": {
                "description": "Where the reference and confirmation are sent",
                "format": "email",
                "maxLength": 254,
                "type": "string"
              },
              "customerName": {
                "description": "Full name of the lead passenger",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "customerPhone": {
                "description": "International format with country code, e.g. +905551234567",
                "type": "string"
              },
              "dropoffAddress": {
                "description": "Drop-off place or hotel name with its area",
                "maxLength": 200,
                "type": "string"
              },
              "flightNumber": {
                "description": "Flight number without spaces, e.g. TK2548",
                "pattern": "^[A-Za-z0-9]{2,10}$",
                "type": "string"
              },
              "idempotencyKey": {
                "description": "Optional. A unique value (e.g. a UUID) you generate once per customer request and reuse on every retry. A retry with the same key and same customer email/phone returns the original reference with duplicate=true and creates nothing, even if other fields changed.",
                "maxLength": 128,
                "minLength": 8,
                "pattern": "^[A-Za-z0-9_.:-]{8,128}$",
                "type": "string"
              },
              "language": {
                "description": "Customer language code, e.g. en, ru, de, tr",
                "type": "string"
              },
              "luggage": {
                "description": "Large suitcases",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "notes": {
                "description": "Extra instructions for the operator (hotel address, special needs)",
                "maxLength": 500,
                "type": "string"
              },
              "passengers": {
                "description": "Total passengers including children",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "pets": {
                "description": "Pets travelling (the operator confirms whether they can be carried)",
                "maximum": 5,
                "minimum": 0,
                "type": "integer"
              },
              "pickupAddress": {
                "description": "Pickup place, e.g. \"Antalya Airport (AYT) Terminal 2\"",
                "maxLength": 200,
                "type": "string"
              },
              "scheduledAt": {
                "description": "ISO 8601 date-time of pickup in Antalya local time, e.g. 2026-11-20T10:00:00+03:00. If no timezone is given, Antalya time (UTC+3) is assumed. For arrivals use flight landing time plus ~30 minutes.",
                "format": "date-time",
                "type": "string"
              },
              "vehicleType": {
                "description": "Vehicle class; must fit passengers, luggage and child seats",
                "enum": ["sedan", "minivan", "vip_sedan", "minibus", "bus"],
                "type": "string"
              }
            },
            "required": ["customerEmail", "customerName", "customerPhone", "dropoffAddress", "passengers", "pickupAddress", "scheduledAt", "vehicleType"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "duplicate": {
                "description": "true: no new request was created; the original is returned",
                "type": "boolean"
              },
              "estimatedPrice": {
                "type": ["string", "null"]
              },
              "message": {
                "type": "string"
              },
              "operatorConfirmed": {
                "description": "false: this is a request, not a confirmed ride",
                "type": "boolean"
              },
              "priceStatus": {
                "enum": ["indicative", "final", "operator_quote"],
                "type": "string"
              },
              "reference": {
                "description": "Booking reference for get_request_status",
                "type": "string"
              },
              "status": {
                "description": "New requests are pending. With duplicate=true this is the original request's current status. Only operatorConfirmed=true means the ride is confirmed.",
                "enum": ["pending", "assigned", "confirmed", "in_progress", "completed", "cancelled"],
                "type": "string"
              }
            },
            "required": ["message", "operatorConfirmed", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d312684a9457374aadf74ba676bf548ca87fe866d25edcf526ea3f9bccef00ca"
        },
        {
          "name": "get_price_quote",
          "title": "Get airport transfer price quote",
          "description": "Use this when a traveller asks how much a private airport transfer costs between Antalya Airport (AYT) and Antalya-area destinations (Konyaaltı, Antalya city/Kaleiçi, Lara, Belek, Side, Alanya, Kemer, Kaş) or between those resorts. Returns a fixed-price estimate in EUR, whether the party fits the chosen vehicle, and a suggested vehicle if not. Read-only: it does not create a request or reserve anything. Do not use for flights, car rental, tours, or destinations outside the Antalya region. If a route has no fixed price, priced=false and the operator quotes it.",
          "inputSchema": {
            "properties": {
              "childSeats": {
                "description": "Number of child seats needed (optional)",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "dropoffAddress": {
                "description": "Drop-off place, same format as pickupAddress, e.g. \"Kemer\".",
                "maxLength": 200,
                "type": "string"
              },
              "luggage": {
                "description": "Number of large suitcases (optional)",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "passengers": {
                "description": "Total passengers including children",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "pickupAddress": {
                "description": "Pickup place: \"Antalya Airport (AYT)\", a resort area or a hotel name, e.g. \"Rixos Premium Belek\".",
                "maxLength": 200,
                "type": "string"
              },
              "scheduledAt": {
                "description": "Optional pickup time. ISO 8601 date-time of pickup in Antalya local time, e.g. 2026-11-20T10:00:00+03:00. If no timezone is given, Antalya time (UTC+3) is assumed. If omitted a daytime price is returned; pickups 22:00–06:00 cost +30%.",
                "format": "date-time",
                "type": "string"
              },
              "vehicleType": {
                "description": "Optional: if omitted the smallest vehicle that fits the party is quoted. Capacity: sedan 3 pax/2 large bags; minivan 8 pax/6 large bags; vip_sedan 3 pax/2 large bags; minibus 16 pax/12 large bags; bus 50 pax/50 large bags.",
                "enum": ["sedan", "minivan", "vip_sedan", "minibus", "bus"],
                "type": "string"
              }
            },
            "required": ["dropoffAddress", "passengers", "pickupAddress"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "assumptions": {
                "description": "Defaults applied for missing optional inputs",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "capacity": {
                "properties": {
                  "errors": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "fits": {
                    "type": "boolean"
                  },
                  "suggestedVehicle": {
                    "enum": ["sedan", "minivan", "vip_sedan", "minibus", "bus", null],
                    "type": ["string", "null"]
                  },
                  "warnings": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "currency": {
                "type": "string"
              },
              "estimatedPrice": {
                "description": "Formatted EUR price, e.g. \"€80.00\"",
                "type": ["string", "null"]
              },
              "nightSurchargeApplied": {
                "description": "+30% for pickups 22:00–06:00 Antalya time",
                "type": "boolean"
              },
              "note": {
                "type": "string"
              },
              "priceCents": {
                "type": ["integer", "null"]
              },
              "priced": {
                "description": "false when this route has no fixed price; the operator will quote it",
                "type": "boolean"
              },
              "route": {
                "type": ["string", "null"]
              },
              "vehicleType": {
                "enum": ["sedan", "minivan", "vip_sedan", "minibus", "bus"],
                "type": "string"
              }
            },
            "required": ["currency", "note", "priced"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:046e17ce9da9c08187ebd9873db836b6b9ac9c568d31633d812501b9a00d3e1c"
        },
        {
          "name": "get_request_status",
          "title": "Check transfer request status",
          "description": "Use this when the customer asks whether their transfer request was confirmed, assigned or cancelled. Requires the booking reference returned by create_transfer_request and the email used for the request. Read-only. pending means the operator has not confirmed yet; only operatorConfirmed=true means the ride is confirmed. Do not use to create or change a request.",
          "inputSchema": {
            "properties": {
              "customerEmail": {
                "description": "Email address used when the request was submitted",
                "format": "email",
                "maxLength": 254,
                "type": "string"
              },
              "reference": {
                "description": "Booking reference, e.g. AT-20260605-0001",
                "type": "string"
              }
            },
            "required": ["customerEmail", "reference"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "dropoffAddress": {
                "type": "string"
              },
              "estimatedPrice": {
                "type": ["string", "null"]
              },
              "operatorConfirmed": {
                "type": "boolean"
              },
              "pickupAddress": {
                "type": "string"
              },
              "priceStatus": {
                "enum": ["indicative", "final", "operator_quote"],
                "type": "string"
              },
              "reference": {
                "type": "string"
              },
              "scheduledAt": {
                "format": "date-time",
                "type": "string"
              },
              "status": {
                "enum": ["pending", "assigned", "confirmed", "in_progress", "completed", "cancelled"],
                "type": "string"
              },
              "statusMeaning": {
                "type": "string"
              }
            },
            "required": ["operatorConfirmed", "reference", "status", "statusMeaning"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e1ef16063d32088900452c4cb5a7f936e8efab7ae17aff6d9ba1a968586ba08d"
        }
      ],
      "digest": "sha256:30dbe875b511fa99f247fb3043a3cb9ff72bb1c88c84600b728c314d5aff8f2a"
    }
  }
