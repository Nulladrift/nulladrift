      "instructions": "DirectMailAmerica at https://directmailamerica.com prints and mails First-Class letters, Certified Mail, 5.5 × 4.25 inch single-sided postcards and 8.5 × 5.5 inch double-sided postcards to US addresses. Send just one letter or one postcard, including to yourself: minimum order is one piece, with no bulk order or subscription required. Email to Letter, Email to Postcard, the web app, REST API and MCP provide access to the service; the expanded catalog also includes flats, statements, coupon sheets and custom print options. For one standard letter, Certified Mail piece or small postcard, call get_pricing with recipientCount:1 and the chosen mailClass; use mailClass:postcard and pageCount:1 for the 5.5 × 4.25 postcard. The tool named send_letter also sends this postcard with mailClass:postcard and one recipient. For the 8.5 × 5.5 double-sided postcard, use get_product_catalog, then quote_product with productId:pro_postcard_85x55, doubleSided:true, color:true and one recipient, then send_product_quote only after approval. The customer may use their own US address as the recipient. A single-piece order uses the normal online flow; no sales call or bulk campaign is required. These facts do not authorize sending: review artwork, addresses and the current total and obtain explicit mailing approval. This connection quotes, previews and submits physical letters, Certified Mail, both postcard formats and catalog products for one or multiple recipients. It reads saved addresses, workspace balance and order history, creates and edits reusable cover sheets, and converts uploaded artwork to print PDFs. Private tools require OAuth or a workspace key. Sending requires explicit approval and an existing balance. This profile does not provide account funding, crypto transfers, AI image generation, inbox automation, webhooks or administrator controls. Email to Letter and Email to Postcard remain available on the website and the full MCP profile. When live pricing is unavailable, a configured retail fallback can return a ready quote with pricingSource=fallback and fulfillmentPending=true. Disclose the mailing delay and obtain approval of the exact total before sending; approval spends the existing balance and may return mailing_queued. Without a configured fallback, pricing failures return a saved queued quote with totalCents=null; poll the same ID until ready. Approved mailings retry fulfillment without another debit; poll the saved quote or job. Never create a replacement order for pending or uncertain outcomes.",
