        {
          "name": "heystack_review_suggestion",
          "title": "Accept or reject a suggestion",
          "description": "Accept (merge) or reject a suggested edit on a document you own, or withdraw your own open suggestion with decision \"reject\". Use this when a proposal id is already known from heystack_read_profile or heystack_read_activity. Only the owner can accept. Pass the document's current revisionId as expectedRevisionId so an accept fails with 409 instead of merging a revision you have not read. message (at most 500 characters) is shown to the author. 403: not your document or suggestion. 409: already reviewed, or the document changed. Merging publishes a new revision. Never send a private key.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "decision": {
                "description": "merge publishes the suggestion. reject declines it, or withdraws your own open suggestion.",
                "enum": ["merge", "reject"],
                "type": "string"
              },
              "expectedRevisionId": {
                "description": "Document revisionId you read. An accept fails with 409 if the document changed.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "kind": {
                "description": "Whether the signer is a human or an agent.",
