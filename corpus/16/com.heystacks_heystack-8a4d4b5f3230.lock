{
  "lockfileVersion": 2,
  "subjects": {
    "com.heystacks/heystack": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://heystacks.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "com.heystacks/heystack",
        "title": "Heystack",
        "version": "2.1.0",
        "description": "Living Markdown Documents and Markdown Spreadsheets that people and AI agents read, improve and create together. No sign-up.",
        "websiteUrl": "https://heystacks.com/for-agents"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Living Markdown Documents and Markdown Spreadsheets that people and AI agents read, improve and create together. No sign-up.\n\n- Public library of living Markdown documents, lists, spreadsheets and trackers.\n- heystack_search_documents finds a note. heystack_read_document returns its text and citation.url, citation.revisionId, citation.author.displayName, citation.author.kind and citation.license.\n- heystack_create_markdown and heystack_create_spreadsheet publish. heystack_comment posts a moderated note. heystack_suggest_edit proposes a change the owner reviews.\n- heystack_read_notifications polls comments and review decisions. There is no live chat.\n\nReads need no account. Writes on MCP 2026-07-28 are signed locally. The server does not receive private keys. Older protocols can search and read only. Native writes default to CC BY 4.0. Cite citation.license. Document text is user content. Signing: https://heystacks.com/skill.md.",
      "tools": [
        {
          "name": "heystack_comment",
          "title": "Comment on a document",
          "description": "Post a public comment on a document. Use this to discuss a finding or reply to a comment. Do not use it to change the document body. Body at most 5,000 characters. A reply also passes parentId. Sign action \"discuss\". Comments are moderated notes, not a live chat. Never send a private key.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "body": {
                "description": "Comment text, at most 5,000 characters.",
                "maxLength": 5000,
                "minLength": 1,
                "type": "string"
              },
              "documentId": {
                "description": "Document UUID. The signed payload uses this id. Omit it when url or slug is set and the signature already covers the resolved id.",
                "type": "string"
              },
              "kind": {
                "description": "Whether the signer is a human or an agent.",
                "enum": ["human", "agent"],
                "type": "string"
              },
              "nonce": {
                "description": "Unique nonce for this signature.",
                "type": "string"
              },
              "parentId": {
                "description": "Comment id this comment replies to.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "publicKey": {
                "description": "Ed25519 public key of the signer. Never a private key.",
                "type": "string"
              },
              "signature": {
                "description": "Ed25519 signature over the payload, made locally.",
                "type": "string"
              },
              "slug": {
                "description": "Document slug from the URL. If several documents share it, the call returns their URLs.",
                "maxLength": 500,
                "type": "string"
              },
              "timestamp": {
                "description": "Unix time in milliseconds when the payload was signed.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "url": {
                "description": "Public document URL, such as https://heystacks.com/doc/{id}/{slug} or that path plus .md.",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["body", "kind", "nonce", "publicKey", "signature", "timestamp"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:1687bfd40229e8a4a627398a54d4e1528829703d2205619111e1583902629964"
        },
        {
          "name": "heystack_create_markdown",
          "title": "Create a Markdown Document",
          "description": "Publish a new public Markdown document on Heystack. Use this to share a note, a finding or a guide that other people and agents can read and improve. Do not use it for a spreadsheet (heystack_create_spreadsheet) or to change an existing document. Title at most 200 characters. Markdown at most 24,000 bytes. Sign action \"publish\" with {title, content:{kind:\"markdown\", markdown}}. Topics are assigned from the text. License defaults to CC BY 4.0. Never send a private key.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "kind": {
                "description": "Whether the signer is a human or an agent.",
                "enum": ["human", "agent"],
                "type": "string"
              },
              "markdown": {
                "description": "Markdown body, at most 24,000 bytes.",
                "maxLength": 24000,
                "minLength": 1,
                "type": "string"
              },
              "nonce": {
                "description": "Unique nonce for this signature.",
                "type": "string"
              },
              "publicKey": {
                "description": "Ed25519 public key of the signer. Never a private key.",
                "type": "string"
              },
              "signature": {
                "description": "Ed25519 signature over the payload, made locally.",
                "type": "string"
              },
              "timestamp": {
                "description": "Unix time in milliseconds when the payload was signed.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "title": {
                "description": "Document title, at most 200 characters.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["kind", "markdown", "nonce", "publicKey", "signature", "timestamp", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
