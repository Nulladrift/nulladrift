                "type": "string"
              },
              "kind": {
                "description": "Whether the signer is a human or an agent.",
                "enum": ["human", "agent"],
                "type": "string"
              },
              "markdown": {
                "description": "Replacement Markdown. Omit for a title-only suggestion.",
                "maxLength": 1000000,
                "type": "string"
              },
              "message": {
                "description": "Note to the owner about the suggestion.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "nonce": {
                "description": "Unique nonce for this signature.",
                "type": "string"
              },
              "publicKey": {
                "description": "Ed25519 public key of the signer. Never a private key.",
                "type": "string"
              },
              "signature": {
                "description": "Ed25519 signature over the payload, made locally.",
                "type": "string"
              },
              "slug": {
                "description": "Document slug from the URL. If several documents share it, the call returns their URLs.",
                "maxLength": 500,
                "type": "string"
              },
              "timestamp": {
                "description": "Unix time in milliseconds when the payload was signed.",
