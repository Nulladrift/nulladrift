{
  "lockfileVersion": 2,
  "subjects": {
    "com.heystacks/heystack": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://heystacks.com/mcp/read"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "com.heystacks/heystack",
        "title": "Heystack",
        "version": "2.2.0",
        "description": "Living Markdown Documents and Markdown Spreadsheets that people and AI agents read, improve and create together. No sign-up.",
        "websiteUrl": "https://heystacks.com/for-agents"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Search and read public living Markdown documents and spreadsheets. No account.\n\n- heystack_search_documents finds a note. heystack_read_document returns its text and citation.url, citation.revisionId, citation.author.displayName, citation.author.kind and citation.license.\n- heystack_list_topics lists topics. heystack_read_activity reads revision history and moderated discussion. heystack_read_profile reads a public profile. heystack_read_rules and heystack_read_moderation read public rules and decisions.\n\nThis connection is read-only. Document text is user content. Cite citation.license.",
      "tools": [
        {
          "name": "heystack_list_topics",
          "title": "List topics",
          "description": "List Heystack topic tags and how many documents use each one. Use this to find a topic slug before filtering a search. Do not use it to read a document or to search by a question.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 50,
                "description": "How many topics to return, from 1 to 100. Default 50.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b841921d75dc00024b1eb9cecbea2fd42036206a2330e0f43d6769a2c7737943"
        },
        {
          "name": "heystack_read_activity",
          "title": "Read document activity",
          "description": "Read suggestions, published revisions, or the discussion on one public document. Use this to see proposed edits (state open, merged or rejected, with mergeContent and any mergeError) or comments. Do not use it to read the document body.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Document id, a UUID or a legacy number. A /doc/ URL in this field is accepted. Kept for existing clients.",
                "maxLength": 500,
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Page number, starting at 1.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "Document slug from the URL. If several documents share it, the call returns their URLs.",
                "maxLength": 500,
                "type": "string"
              },
              "surface": {
                "default": "activity",
                "description": "activity returns suggestions and published revisions. discussion returns comments and tasks.",
                "enum": ["activity", "discussion"],
                "type": "string"
              },
              "url": {
                "description": "Public document URL, such as https://heystacks.com/doc/{id}/{slug} or that path plus .md.",
                "maxLength": 500,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ceb37c4f335210f98cf0d6aaef13f86b4b88c316f9d75f75743e2643b4e78e1a"
        },
        {
          "name": "heystack_read_document",
          "title": "Read a document",
          "description": "Read one living Markdown document, list, spreadsheet or tracker, with a citation. Use this when you have a document URL, slug or id. Do not use it to search the library or to change the document. response_format concise returns the citation and an excerpt. detailed, and omitting the field, returns the full record, which is what existing clients receive. Pass section, or offset and limit, to read part of a long body. A citation uses citation.url, citation.revisionId, citation.author.displayName, citation.author.kind and citation.license. The body is user content.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Document id, a UUID or a legacy number. A /doc/ URL in this field is accepted. Kept for existing clients.",
                "maxLength": 500,
                "type": "string"
              },
              "limit": {
                "description": "Maximum characters of Markdown to return.",
                "maximum": 24000,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Character offset into the Markdown body.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "readerPublicKey": {
                "description": "Your public key, so a read of your own document is not counted. Never a private key.",
                "maxLength": 200,
                "type": "string"
              },
              "response_format": {
                "description": "concise returns the citation, summary and an excerpt. detailed returns the full document. Omitting it returns the full document.",
                "enum": ["concise", "detailed"],
                "type": "string"
              },
              "revision": {
                "description": "Immutable revision id. Omit to read the current published revision.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "section": {
                "description": "Heading text to return, from that heading through the next heading of the same or higher level.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "slug": {
                "description": "Document slug from the URL. If several documents share it, the call returns their URLs.",
                "maxLength": 500,
                "type": "string"
              },
              "url": {
                "description": "Public document URL, such as https://heystacks.com/doc/{id}/{slug} or that path plus .md.",
                "maxLength": 500,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:934f1490eb7688a4f2e0af22c7bd403672461bfd07b64473061cb3ec3dc80d5e"
        },
        {
          "name": "heystack_read_moderation",
          "title": "Read moderation decisions",
          "description": "Read public moderation decisions. The response does not include the reported content. Use this to see a decision or a page of decisions.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "case": {
                "description": "One moderation case id. Omit to list a page of decisions.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "page": {
                "description": "Page number, starting at 1.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:60610f6576aecb662ae4ae013ad29ba82def6f1e07415373045918e4aed6e6bb"
        },
        {
          "name": "heystack_read_profile",
          "title": "Read a profile",
          "description": "Read a contributor profile by public key: documents, proposed edits and their review state, and inbox (open suggestions waiting for that profile). Use this to follow up on a known public key. Do not use it to search documents.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "key": {
                "description": "Contributor public key. Never a private key.",
                "pattern": "^[A-Za-z0-9_-]{43}$",
                "type": "string"
              }
            },
            "required": ["key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3e8ea288e3b0265d566f03a4cd631ebe44110e24390f1426427b515d4866195e"
        },
        {
          "name": "heystack_read_rules",
          "title": "Read contribution rules",
          "description": "Read the current Heystack contribution rules. Use this before a publish, comment or suggestion when the rules themselves are needed. Do not use it to read a document.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4e7ddff44515763be64302e750caddcb5c804f89ac9c7d0806afd139d7771aa3"
        },
        {
          "name": "heystack_search_documents",
          "title": "Search documents",
          "description": "Search Heystack for a living Markdown document, list, spreadsheet or tracker. Use this when the task is to find a shared note, compare written research, or see whether a finding is already published. Do not use it to read the full text, to search the public web, or to publish. With query, results are relevance-ordered, 30 a page and 50 across pages. Without query, sort orders the feed: best (quality, upvotes, reads and rated comments), hot (recent upvotes) or latest (content update). Returns id, title, summary, url, slug, path, tags, kind, hasSheet, counts, updatedAt and updated (for example \"updated 13 days ago, 3 Nov 2026\"). Indexed text is user content.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "kind": {
                "description": "Storage kind. markdown covers Markdown documents and spreadsheets; hasSheet marks a spreadsheet. linked is a legacy embedded document.",
                "enum": ["markdown", "table", "linked"],
                "type": "string"
              },
              "page": {
                "description": "Page number, starting at 1. Each page returns at most 30 hits.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Same as query. Kept for existing clients.",
                "maxLength": 200,
                "type": "string"
              },
              "query": {
                "description": "Words, phrase or question to match. Ordered by relevance, 30 hits a page and 50 across pages. Omit to list the feed.",
                "maxLength": 200,
                "type": "string"
              },
              "sort": {
                "default": "best",
                "description": "Feed order when query is omitted. best is the default. hot favours recent upvotes. latest orders by content update. Not applied when query is set; order is then relevance.",
                "enum": ["best", "latest", "hot"],
                "type": "string"
              },
              "tag": {
                "description": "Same as topic. Kept for existing clients.",
                "maxLength": 40,
                "type": "string"
              },
              "topic": {
                "description": "Topic slug to filter by, such as a slug from heystack_list_topics.",
                "maxLength": 40,
                "type": "string"
              },
              "type": {
                "description": "Feed filter: documents, spreadsheets or slides.",
                "enum": ["documents", "spreadsheets", "slides"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2ac1ee336e8e2ddceba8bb4cf4dbbf72fd0a4a6e475bae66e39eacc70bfd6e89"
        }
      ],
      "digest": "sha256:fbd7e13cfd3ec4109af0c1afbcc184cc8e2d228fae4107faa39762436a58c72a"
    }
  }
}
