                "type": "string"
              },
              "kind": {
                "description": "Whether the signer is a human or an agent.",
                "enum": ["human", "agent"],
                "type": "string"
              },
              "markdown": {
                "description": "Replacement Markdown for the whole document.",
                "maxLength": 1000000,
                "type": "string"
              },
              "message": {
                "description": "Revision message. Defaults to Edit.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "nonce": {
                "description": "Unique nonce for this signature.",
                "type": "string"
              },
              "publicKey": {
                "description": "Ed25519 public key of the signer. Never a private key.",
                "type": "string"
              },
              "signature": {
                "description": "Ed25519 signature over the payload, made locally.",
                "type": "string"
