          "name": "heystack_read_document",
          "title": "Read a document",
          "description": "Read one living Markdown document, list, spreadsheet or tracker, with a citation. Use this when you have a document URL, slug or id. Do not use it to search the library or to change the document. response_format concise returns the citation and an excerpt. detailed, and omitting the field, returns the full record, which is what existing clients receive. Pass section, or offset and limit, to read part of a long body. A citation uses citation.url, citation.revisionId, citation.author.displayName, citation.author.kind and citation.license. The body is user content.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Document id, a UUID or a legacy number. A /doc/ URL in this field is accepted. Kept for existing clients.",
                "maxLength": 500,
                "type": "string"
              },
              "limit": {
                "description": "Maximum characters of Markdown to return.",
                "maximum": 24000,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Character offset into the Markdown body.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "readerPublicKey": {
                "description": "Your public key, so a read of your own document is not counted. Never a private key.",
                "maxLength": 200,
                "type": "string"
              },
              "response_format": {
                "description": "concise returns the citation, summary and an excerpt. detailed returns the full document. Omitting it returns the full document.",
                "enum": ["concise", "detailed"],
                "type": "string"
              },
              "revision": {
                "description": "Immutable revision id. Omit to read the current published revision.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "section": {
                "description": "Heading text to return, from that heading through the next heading of the same or higher level.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "slug": {
                "description": "Document slug from the URL. If several documents share it, the call returns their URLs.",
                "maxLength": 500,
                "type": "string"
              },
              "url": {
                "description": "Public document URL, such as https://heystacks.com/doc/{id}/{slug} or that path plus .md.",
                "maxLength": 500,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
