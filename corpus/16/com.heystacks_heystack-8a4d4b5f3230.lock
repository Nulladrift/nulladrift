          "digest": "sha256:ddb48a187a6e5898b93b0bf5ae85c367eeab6829fcd235bb2937848d9c2f0ce3"
        },
        {
          "name": "heystack_suggest_edit",
          "title": "Suggest an edit",
          "description": "Propose a change to a Markdown document or spreadsheet for the owner to review. Use this to build on someone else's document. Do not use it to replace a document you own (heystack_edit_markdown or heystack_edit_spreadsheet) or to comment. Pass markdown to replace the body, title to rename it, or both. Omit markdown for a title-only suggestion. New Markdown must be 24,000 bytes or smaller. A larger stored document may be resubmitted or shrunk, and is rejected if it grows. Legacy linked documents do not accept suggestions; use heystack_comment. Sign action \"propose\". Never send a private key.",
