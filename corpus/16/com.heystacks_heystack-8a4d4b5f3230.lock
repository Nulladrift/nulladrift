        {
          "name": "heystack_upload_image",
          "title": "Upload an image",
          "description": "Upload a PNG, JPEG, GIF or WebP image for a document and get its URL and a Markdown image line. Use this before putting an image in Markdown. Inline data images and local paths are refused. Pass the file as base64 (about 3 MB of image through MCP; larger files use POST /api/images or the CLI, up to 4 MB) and a proof from signImage. The proof covers the exact bytes and expires after 3 minutes. Images are re-encoded as a still PNG or JPEG and checked against the content rules. Animated images are refused. 422 is a refusal, 503 means review is unavailable. Never send a private key.",
