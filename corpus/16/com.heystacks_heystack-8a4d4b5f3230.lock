                "minLength": 1,
                "type": "string"
              },
              "nonce": {
                "description": "Unique nonce for this signature.",
                "type": "string"
              },
              "proposalId": {
                "description": "Suggestion id from a profile inbox or document activity.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "publicKey": {
                "description": "Ed25519 public key of the signer. Never a private key.",
