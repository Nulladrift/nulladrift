{
  "lockfileVersion": 2,
  "subjects": {
    "com.nameideabox/name-generator": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.nameideabox.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "name-idea-box",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "generate_fake_profiles",
          "title": "Generate fictional profiles",
          "description": "Create deterministic fictional identity profiles for prototypes, QA, demos, and writing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "ageRange": {
                "default": "25-34",
                "enum": ["18-24", "25-34", "35-49", "50-64", "65-80"],
                "type": "string"
              },
              "count": {
                "anyOf": [
                  {
                    "const": 1,
                    "type": "number"
                  },
                  {
                    "const": 3,
                    "type": "number"
                  },
                  {
                    "const": 6,
                    "type": "number"
                  },
                  {
                    "const": 12,
                    "type": "number"
                  }
                ],
                "default": 3
              },
              "country": {
                "default": "us",
                "enum": ["all", "us", "uk", "ca", "au", "fr", "de", "es", "jp", "cn", "kr", "vn"],
                "type": "string"
              },
              "depth": {
                "default": "contact",
                "enum": ["basic", "contact", "full"],
                "type": "string"
              },
              "gender": {
                "default": "Any",
                "enum": ["Any", "Female", "Male"],
                "type": "string"
              },
              "seed": {
                "description": "Optional repeatable seed.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:33c5687b14fad38e3981aa10045c0f83ad949c1eb3cbe1eab46772c3216aeeec"
        },
        {
          "name": "generate_names",
          "title": "Generate names",
          "description": "Generate up to 1,000 distinct fictional names from one or all supported countries.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "count": {
                "default": 10,
                "description": "Number of names to generate.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "country": {
                "default": "all",
                "description": "Country code or all for a mixed list.",
                "enum": ["all", "us", "uk", "ca", "au", "fr", "de", "es", "jp", "cn", "kr", "vn"],
                "type": "string"
              },
              "gender": {
                "default": "Any",
                "description": "Optional gender filter.",
                "enum": ["Any", "Female", "Male"],
                "type": "string"
              },
              "includeProfiles": {
                "default": false,
                "description": "Attach a complete fictional profile to every name.",
                "type": "boolean"
              },
              "seed": {
                "description": "Optional repeatable seed.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f766b8ab76a6b6ec8602d4e593a72a862b35238728ab34f982a3a89e54b58274"
        }
      ],
      "digest": "sha256:68f6e7dfffca797ee36b6b4b8504be6810299adb903d47d7e0e8fa57f45738f2"
    }
  }
}
