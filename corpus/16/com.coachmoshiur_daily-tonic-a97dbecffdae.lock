{
  "lockfileVersion": 2,
  "subjects": {
    "com.coachmoshiur/daily-tonic": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://coachmoshiur.com/tonic-mcp/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "daily-tonic",
        "title": "Daily Tonic by Coach Moshiur",
        "version": "1.10.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use get_todays_tonic when the person asks for their Daily Tonic, today's tonic or a short daily leadership or growth thought. Quote the tonic faithfully and keep the link. When the person describes a problem with the people they lead, their boss, themselves as a leader, or their family, use find_situations with a few of their words, then get_situation with the key of the best match; pass on what the page says in its own words and keep the link.",
      "tools": [
        {
          "name": "find_situations",
          "title": "What's hard right now? Find a situation",
          "description": "Short, practical pages by Coach Moshiur for a leader with a problem today (\"someone on my team keeps missing deadlines\", \"I have to give hard feedback\", \"I am exhausted and still have to lead\"). Give a few words of the problem as query to search; leave query out to list the situations (of one group, or all). Each line has the title, a one-sentence summary, the key for get_situation and the link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "group": {
                "description": "Only this group: people (my people), boss_peers (my boss and peers), self (myself), business (my business), home_community (home and community). Optional.",
                "enum": ["people", "boss_peers", "self", "business", "home_community"],
                "type": "string"
              },
              "language": {
                "description": "Language: en English, bn Bangla, ar Arabic, ur Urdu, zh Chinese. Default en.",
                "enum": ["en", "bn", "ar", "ur", "zh"],
                "type": "string"
              },
              "query": {
                "description": "The problem in a few words, in the chosen language. Optional.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f5785d014526022d87ef161094be23d6ba66d33abac5e6900c952213ac13d483"
        },
        {
          "name": "get_recent_tonics",
          "title": "Recent Daily Tonics",
          "description": "The titles, tiny steps and links of the Daily Tonics of the last days (newest first).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "How many days back. Default 7.",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "language": {
                "description": "Language: en English, bn Bangla, ar Arabic, ur Urdu, zh Chinese. Default en.",
                "enum": ["en", "bn", "ar", "ur", "zh"],
                "type": "string"
              },
              "reader": {
                "description": "Who the tonic is written for. Default all (everyone).",
                "enum": ["all", "student", "professional", "leader", "business", "parent", "homemaker", "retired", "jobseeker"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c745356c60f57e5549055b4eebd0bf066124fbbddba01022a904e536253c5d9c"
        },
        {
          "name": "get_situation",
          "title": "What's hard right now? One situation",
          "description": "One situation page by Coach Moshiur as text: what to do today, words the person can use, what usually goes wrong, steps for a week, and the link. Take the key from find_situations.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "key": {
                "description": "The key of the situation, as find_situations gives it (for example missed_deadlines).",
                "pattern": "^[a-z0-9_]{1,31}$",
                "type": "string"
              },
              "language": {
                "description": "Language: en English, bn Bangla, ar Arabic, ur Urdu, zh Chinese. Default en.",
                "enum": ["en", "bn", "ar", "ur", "zh"],
                "type": "string"
              }
            },
            "required": ["key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6de7d8a9bd3b0da270c5e2cd2793980e0dce0dbcc101437e3c2a145629275e4a"
        },
        {
          "name": "get_todays_tonic",
          "title": "Today's Daily Tonic",
          "description": "Today's Daily Tonic by Coach Moshiur: a short leadership and personal-growth thought, one tiny step to take today, and a question to reflect on, with a link to read it on the web.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language: en English, bn Bangla, ar Arabic, ur Urdu, zh Chinese. Default en.",
                "enum": ["en", "bn", "ar", "ur", "zh"],
                "type": "string"
              },
              "reader": {
                "description": "Who the tonic is written for. Default all (everyone).",
                "enum": ["all", "student", "professional", "leader", "business", "parent", "homemaker", "retired", "jobseeker"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:76f84e4d96d246cd30c47a6fa2869ce9875ae76d4ea54558a88e83841d346d28"
        }
      ],
      "digest": "sha256:56feb8bdf619e6488330067cf5fd7ad8341a8b45f4c61898ea53b16b3d179212"
    }
  }
}
