{
  "lockfileVersion": 2,
  "subjects": {
    "com.fronresearch/agent-api": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fronresearch.com/api/agent"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "fron-research-agent-api",
        "title": "Fron Research Agent API",
        "version": "1.2.0",
        "description": "Fron Research (https://fronresearch.com) measures demand at recreation venues (saunas and bathhouses, bowling centers, trampoline and adventure parks, indoor golf simulator studios and pickleball and padel clubs): how full they are, utilization and estimated revenue by venue and market, from inferred booking signals observed in public data.",
        "websiteUrl": "https://fronresearch.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Fron Research (https://fronresearch.com) measures demand at recreation venues (saunas and bathhouses, bowling centers, trampoline and adventure parks, indoor golf simulator studios and pickleball and padel clubs): how full they are, utilization and estimated revenue by venue and market, from inferred booking signals observed in public data. This server is read-only and needs no key. It provides the public pages of Fron Research and its sites (what is measured, method, plans and prices, published market updates) and each site's free sample day of venue data as rows; the full data is on the paid plans. Tools: about lists what is covered and every document id; search takes a plain-language question and returns the most relevant passages with URLs to cite (site narrows it to one site); fetch returns one full page or a sample day; data returns structured rows (markets, venues, slots, rollups) from the Fron Research Data API: one sample day for every venue without a key, history with one. Cite the url of every passage you use.",
      "tools": [
        {
          "name": "about",
          "title": "About Fron Research data",
          "description": "What Fron Research and its Check sites measure (saunas, bowling, trampoline parks, golf simulators, pickleball), their URLs, plans, free sample days and every document id.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1a36591b9032a4dc7d2020d2fe40a7ec4217e7a48b7924ea5bde230750a7ee7c"
        },
        {
          "name": "data",
          "title": "Query venue and market data",
          "description": "Structured rows from the Fron Research Data API (https://api.fronresearch.com/v1): markets, venues, bookable slots and a utilization and a revenue estimate per venue, market or day. Without a key every query reads one free sample day for every venue, whatever dates are asked (the response's tier, free_day and range say what was read); a caller that connects to https://fronresearch.com/api/agent with \"Authorization: Bearer <key>\" reads the history its plan covers (a site's own /api/agent does not forward keys). Start with endpoint index (the sample day and endpoints), then markets or venues to get ids, then metrics. Fields, filters and how to get a key: https://fronresearch.com/data/history/",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "endpoint": {
                "description": "index: the sample day, tier and endpoints. markets, venues: lists (filters: market, brand, venue_type, activity). venue: one venue with its products and resources (needs venue_id). slots: one venue's slots (params venue, from, to). metrics: one utilization and one revenue estimate per group (params group_by = market, brand, venue, venue_type or day, plus from, to (at most 92 days) and optional filters; day needs venue). observations: one slot's booking curve (param slot; needs an Investor key). polls: the first look at each slot, every look at which the count changed, and the last look, for a venue's slots on one day (params venue, date; needs an Investor key).",
                "enum": ["index", "markets", "venues", "venue", "slots", "metrics", "observations", "polls"],
                "type": "string"
              },
              "params": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean"]
                },
                "description": "Query parameters as the Data API names them, e.g. {\"group_by\": \"market\", \"from\": \"2026-11-05\", \"to\": \"2026-11-05\"}. limit (1-1000) and cursor (from next_cursor) page through lists.",
                "type": "object"
              },
              "venue_id": {
                "description": "For endpoint venue: a venue_id from venues.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["endpoint"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f79fc2372257b32148b8b4e50fe84b4b95b173b7e0422c44662faf2cf358730e"
        },
        {
          "name": "fetch",
          "title": "Read a document or sample day",
          "description": "Read one document by id (from search or about). sample/<site> returns that site's free example day as rows, CC BY 4.0.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Document id, e.g. heatcheck/methodology or sample/heatcheck.",
                "type": "string"
              },
              "offset": {
                "description": "Continue a long document from nextOffset.",
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f5c39a60d5d4c187dd0817d00608463fe17ae06afa1a5608abe01cff3f667dfb"
        },
        {
          "name": "search",
          "title": "Search Fron Research",
          "description": "Ask a question in plain language. Returns the most relevant passages from the public pages of Fron Research and its sites, each with its canonical URL to cite, plus the matching free sample days. answer.instruction says how to use them; followUp.questions are optional questions for your user, whose answers go in intent next time.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "intent": {
                "description": "Optional but helpful: why you are asking and for whom, in a sentence (e.g. \"sizing the NYC sauna market for an investor memo\"). It does not change the results; it tells Fron Research which data to publish next. Put your user's answers to followUp.questions here. Do not include personal information.",
                "maxLength": 300,
                "type": "string"
              },
              "maxResults": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The question.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "site": {
                "description": "Optional: heatcheck, bowlingdata, trampolineparkdata, golfsimdata, courtwatch or fronresearch.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ddcf3514e68f79d5dd99c9f6ea65e3e59b06a341f5c935479fb5950b9bcd5127"
        }
      ],
      "digest": "sha256:3af21c2d042024ef37a2acc255fa0e6522d4efa0e6bba11a50ffbeac662986d1"
    }
  }
}
