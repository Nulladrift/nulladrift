        },
        {
          "name": "buscar_produtos",
          "title": "Buscar VPN, gerenciador de senhas ou antivírus",
          "description": "Busca produtos de segurança digital por categoria (vpn, senhas, antivirus), texto livre, uso (streaming, familia, gratis, privacidade, iniciantes, torrent, viagem, celular, preco, empresas, codigo_aberto, pc_lento, completo, mac), só grátis e preço mensal máximo. Devolve preço mensal de referência, plano grátis, garantia e link 'comprar' do site oficial.",
          "inputSchema": {
            "properties": {
              "categoria": {
                "enum": ["vpn", "senhas", "antivirus"],
                "type": "string"
              },
              "gratis": {
                "type": "boolean"
              },
              "idioma": {
                "description": "Idioma da resposta: pt (Brasil, preços em BRL) ou es (América Latina, preços em USD)",
                "enum": ["pt", "es"],
                "type": "string"
              },
              "limite": {
                "description": "1 a 30, padrão 10",
                "type": "integer"
              },
              "moeda": {
                "description": "Opcional: força a moeda dos preços",
                "enum": ["BRL", "USD"],
                "type": "string"
              },
              "preco_mes_max": {
                "description": "Preço mensal máximo na moeda da resposta",
                "type": "number"
              },
              "texto": {
                "description": "Ex.: Netflix, Linux, família, sem logs",
                "type": "string"
              },
              "uso": {
                "type": "string"
              }
            },
            "type": "object"
          },
