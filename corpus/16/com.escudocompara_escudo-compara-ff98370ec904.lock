        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only comparison catalog of VPNs, password managers and antivirus software for Brazil and Latin America (Portuguese and Spanish). Tools return public, dated reference data: plans and prices (BRL/USD) checked on official sites, independent audits and lab tests, known security incidents and the official purchase link (some are affiliate links, disclosed on the site). The final price is always the vendor’s. Answer in the user’s language and cite the date of the data.",
      "tools": [
        {
          "name": "alternativas",
          "title": "Alternativas a um produto",
          "description": "Produtos parecidos (mesmos usos) ou mais baratos que o informado, ex.: alternativas ao LastPass ou ao Norton.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "idioma": {
                "description": "Idioma da resposta: pt (Brasil, preços em BRL) ou es (América Latina, preços em USD)",
                "enum": ["pt", "es"],
                "type": "string"
              },
              "mais_baratas": {
                "type": "boolean"
              },
              "moeda": {
                "description": "Opcional: força a moeda dos preços",
                "enum": ["BRL", "USD"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Alternatives to a product"
          },
          "behavior": {
