        {
          "name": "report_listing_error",
          "title": "Report wrong details on a listing",
          "description": "Use when the person (or the listed lawyer) says a detail on a listing is wrong, missing or out of date: phone, website, office, firm, practice areas, license status, languages, fees, availability or name. Pass the listing's attorney_id, which detail, and optionally the correct value. ESQ CoPilot checks each report against the official record or the lawyer's own website and corrects the listing in the next update. A report never changes the order or placement of any lawyer. No case details and no contact details of the person reporting. This is a listing service, not a lawyer referral service. No lawyer pays for placement or ranking of any kind.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "attorney_id": {
                "description": "The listing's attorney_id, as returned by search_attorneys or get_attorney_profile.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "correct_value": {
                "description": "Optional: what the person says is correct, for example the new office phone. Only the lawyer's public business details.",
                "maxLength": 200,
                "type": "string"
              },
              "field": {
                "description": "Which detail on the listing is wrong or out of date.",
                "enum": ["phone", "website", "office_address", "firm", "practice_areas", "license_status", "languages", "fees", "availability", "name", "other"],
                "type": "string"
              },
              "issue": {
                "enum": ["wrong", "missing", "outdated", "moved", "retired_or_deceased", "not_this_lawyer"],
                "type": "string"
              },
              "note": {
                "description": "Optional short note. No case details and no contact details of the person reporting.",
                "maxLength": 300,
                "type": "string"
              },
              "reporter": {
                "description": "Who is reporting. the_lawyer when the listed lawyer reports their own listing.",
                "enum": ["person", "the_lawyer", "someone_else"],
                "type": "string"
              }
            },
            "required": ["attorney_id", "field", "issue"],
            "type": "object"
