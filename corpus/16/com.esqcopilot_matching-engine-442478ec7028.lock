        {
          "name": "prepare_introduction",
          "title": "Preview my message to one lawyer (nothing is sent) (older name)",
          "description": "Older name of preview_client_message, kept until 2026-12-15; use preview_client_message. Use when the person wants to contact ONE lawyer they picked (\"write my message\"). Builds a short, editable first message from general facts the person gives (type of legal issue, location, help wanted, timing, optional budget, contact method), asks the lawyer what is unknown (handles this kind of issue? taking new clients? consultation fee?), and returns the exact recipient, message, contact fields, notice, consent text and an approval_code. Stores and sends nothing. Show all of it to the person; only after an explicit yes call send_client_message with after_yes.arguments. Any change by the person means calling this again and asking again. This is a listing service, not a lawyer referral service. No lawyer pays for placement or ranking of any kind.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "assistance": {
                "description": "What help the user wants, in a few words (e.g. 'a will and a trust', 'advice on an eviction notice')",
                "maxLength": 200,
                "type": "string"
              },
              "attorney_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "budget": {
                "description": "Optional budget in the user's words",
                "maxLength": 80,
                "type": "string"
              },
              "contact": {
                "additionalProperties": false,
                "description": "Only the contact details the user chose to give for this lawyer",
                "properties": {
                  "email": {
                    "format": "email",
                    "maxLength": 200,
                    "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "phone": {
                    "pattern": "^[0-9+().\\- ]{7,25}$",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "entry_id": {
                "pattern": "^ent_[A-Za-z0-9_-]{8,40}$",
                "type": "string"
              },
              "matter_location": {
                "description": "City or county of the matter, as the user said it",
                "maxLength": 80,
                "type": "string"
              },
              "message": {
                "description": "The user's edited message. Omit to get a short draft; pass the user's final wording after any edit.",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              },
              "practice_area": {
                "description": "General matter type in plain words, e.g. 'estate planning'",
                "maxLength": 80,
                "type": "string"
              },
              "preferred_contact_method": {
                "enum": ["email", "phone", "either"],
                "type": "string"
              },
              "state": {
                "description": "State where the MATTER is (not the lawyer's office state). Ask the user; do not infer it.",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "timing": {
                "description": "Timing as the USER reported it. Not checked or calculated.",
                "maxLength": 120,
