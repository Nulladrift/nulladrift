        {
          "name": "prepare_secure_thread_invitation",
          "title": "Prepare a sealed-conversation link",
          "description": "Use only after the person chose this one lawyer and said yes. Returns a one-use link to the sealed page, valid 15 minutes, only for this person. It sends nothing; the person writes and approves their message on that page. Put no matter details in this call.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "attorney_id": {
                "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
