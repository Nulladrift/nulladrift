        {
          "name": "compare_attorneys",
          "title": "Compare lawyers side by side",
          "description": "Use when the person asks to compare lawyers from search_attorneys. Compares 2 to 5 lawyers on practice areas, location, years licensed, fees, availability, data confidence and gaps, side by side in the order given, with no scores and without picking one. Pass match_id to use the person's filters. Says when prices or timing cannot be compared because the data is unknown. This is a listing service, not a lawyer referral service. No lawyer pays for placement or ranking of any kind.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "attorney_ids": {
                "items": {
                  "format": "uuid",
                  "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              },
              "criteria": {
                "items": {
                  "enum": ["price", "timing", "experience", "location", "practice_fit", "languages", "verification"],
                  "type": "string"
                },
                "maxItems": 7,
                "type": "array"
              },
              "match_id": {
                "description": "The match_id from search_attorneys, so comparisons use the same filters",
                "maxLength": 40,
                "type": "string"
              },
              "priorities": {
                "description": "Ignored since 2026-11-05: lawyers are shown side by side in the order given, with no scores.",
                "items": {
                  "enum": ["price", "speed", "experience", "proximity"],
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              }
            },
            "required": ["attorney_ids"],
            "type": "object"
          },
