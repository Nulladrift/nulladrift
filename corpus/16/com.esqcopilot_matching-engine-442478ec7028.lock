        {
          "name": "get_help_first_answer",
          "title": "Legal help options for a legal problem",
          "description": "Use when the person asks for a lawyer or legal help but has not chosen a lawyer yet, including short requests like \"I need a lawyer\". From their short description of the legal need (plus state, city and legal problem if they named them), it returns: up to five listed lawyers when the matter and state are known (in the listing's own order), local legal aid and court self-help with sources and dates, fees a lawyer published, the official license-check site, and at most one follow-up question. Read-only: it stores nothing, sends nothing and contacts no one.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "description": "City the person already named, if any.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "legal_problem": {
                "description": "A few words for the legal problem the person already named, if any (for example \"eviction\").",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "message": {
                "description": "Short description of the legal need in the person's words (for example \"I need a lawyer for my eviction in Fresno\"). Used only to read the type of problem, the place and any deadline or cost concern; not stored.",
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              },
              "state": {
                "description": "Two-letter U.S. state the person already named, if any.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
