                        "x-observed-types": "null"
                      },
                      "other_possible_areas": {
                        "anyOf": [
                          {
                            "items": {
                              "x-observed-types": ["string", "null"]
                            },
                            "type": "array"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "practice_area": {
                        "x-observed-types": ["string", "null"]
                      },
                      "practice_area_source": {
                        "x-observed-types": ["string", "null"]
                      },
                      "state": {
                        "x-observed-types": ["string", "null"]
                      },
                      "urgency": {
