                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "subpractice_area": {
                "maxLength": 80,
                "type": "string"
              },
              "urgency": {
                "enum": ["emergency", "critical_deadline", "soon", "routine", "long_term"],
                "type": "string"
              },
              "verbosity": {
