                "type": "string"
              },
              "sort": {
                "description": "The order the person picked: nearest_office (default: same city, then same ZIP area, then the rest), last_name, years_licensed (most first, where the admission date is on record), free_consultation_first, published_fees_first or availability_reported_first. Equal listings keep a fixed shuffle. The order never says one lawyer is better.",
                "enum": ["nearest_office", "last_name", "years_licensed", "free_consultation_first", "published_fees_first", "availability_reported_first"],
                "type": "string"
              },
              "state": {
