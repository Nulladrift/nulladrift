                "minimum": 0,
                "type": "number"
              },
              "min_years_licensed": {
                "maximum": 60,
                "minimum": 0,
                "type": "integer"
              },
              "page": {
                "description": "Page of the full list, from 1; default 1. Every listing that meets the filters can be reached page by page.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "payment_plan_needed": {
                "type": "boolean"
              },
              "practice_area": {
                "description": "Practice area, e.g. 'Landlord-Tenant Law', 'Family Law', 'Criminal Law'",
                "maxLength": 80,
                "type": "string"
              },
              "preference_set_id": {
                "description": "Saved filters from update_listing_criteria",
                "maxLength": 40,
                "type": "string"
              },
              "priorities": {
                "description": "Older way to pick an order; used only when sort is not given (price: published_fees_first, speed: availability_reported_first, experience: years_licensed, proximity: nearest_office).",
                "items": {
                  "enum": ["price", "speed", "experience", "proximity"],
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "procedural_stage": {
                "enum": ["not_started", "pre_filing", "filed", "hearing_scheduled", "trial", "post_judgment", "appeal", "transaction", "unknown"],
                "type": "string"
              },
              "reduced_fee_eligible": {
                "description": "User may qualify for pro bono, legal aid or reduced fees",
                "type": "boolean"
              },
              "remote_ok": {
                "description": "User is willing to work with a lawyer remotely (phone or video) anywhere in the state",
                "type": "boolean"
              },
              "representation_start_by": {
                "description": "Date as YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "service_needed": {
                "enum": ["advice_consultation", "negotiation", "document_preparation", "litigation", "ongoing_representation", "unknown"],
                "type": "string"
              },
              "sort": {
                "description": "The order the person picked: nearest_office (default: same city, then same ZIP area, then the rest), last_name, years_licensed (most first, where the admission date is on record), free_consultation_first, published_fees_first or availability_reported_first. Equal listings keep a fixed shuffle. The order never says one lawyer is better.",
                "enum": ["nearest_office", "last_name", "years_licensed", "free_consultation_first", "published_fees_first", "availability_reported_first"],
                "type": "string"
              },
              "state": {
                "description": "US state, two-letter code or name, e.g. CA or California",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "subpractice_area": {
                "maxLength": 80,
                "type": "string"
              },
              "urgency": {
                "enum": ["emergency", "critical_deadline", "soon", "routine", "long_term"],
                "type": "string"
              },
              "verbosity": {
                "description": "compact (default): shared notes once at the top and each lawyer's own facts; full adds every source detail per lawyer",
                "enum": ["compact", "full"],
                "type": "string"
              },
              "zip": {
                "description": "5-digit ZIP code, only if the user agreed to share it",
                "pattern": "^\\d{5}$",
                "type": "string"
              }
            },
