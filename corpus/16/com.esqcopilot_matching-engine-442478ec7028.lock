        {
          "name": "prepare_case_brief",
          "title": "Prepare my CaseBrief for a lawyer conversation (nothing is saved)",
          "description": "Use when the person wants to get ready to talk to a lawyer about their own matter, e.g. \"help me organize my eviction case before I call a lawyer\" or \"what should I bring to a consultation about unpaid overtime\". Organizes ONLY what the person says into an editable brief: their original words (kept unchanged), matter type, confirmed state and city, dated chronology, people involved by role, evidence checklist, consultation questions, deadlines exactly as the person reported them, and a short redacted outreach summary. Each item is labeled (user_says, user_has, suggestion, unknown). Asks for missing details one or two at a time. Never infers facts, deadlines or the state; flags ID numbers, account numbers and health details and leaves them out of the summary. Stores nothing and sends nothing: to contact a lawyer the person picks, use preview_client_message. action discard drops it. Do NOT use for general legal questions, homework, news or when the person only wants information about the law. This is a listing service, not a lawyer referral service. No lawyer pays for placement or ranking of any kind.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "action": {
                "description": "create (default), update after the person edits anything, preview to show the outreach summary, discard to drop the brief",
                "enum": ["create", "update", "preview", "discard"],
                "type": "string"
              },
              "brief_id": {
                "description": "The brief_id from an earlier answer, so the same brief is updated",
                "pattern": "^cb_[A-Za-z0-9]{10,24}$",
                "type": "string"
              },
              "evidence_have": {
                "description": "Documents or items the person says they have",
                "items": {
                  "maxLength": 160,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "facts": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "date": {
                      "description": "YYYY-MM-DD or YYYY-MM, only as the person said it",
                      "pattern": "^\\d{4}-\\d{2}(-\\d{2})?$",
                      "type": "string"
                    },
                    "date_is_approximate": {
                      "type": "boolean"
                    },
                    "label": {
                      "enum": ["user_says", "user_has", "unknown"],
                      "type": "string"
                    },
                    "text": {
                      "maxLength": 500,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["text"],
                  "type": "object"
                },
                "maxItems": 30,
                "type": "array"
              },
              "include_names_in_outreach": {
                "description": "Default false: other people's names are replaced by their role",
                "type": "boolean"
              },
              "matter": {
                "additionalProperties": false,
                "properties": {
                  "alternative_types": {
                    "items": {
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 3,
                    "type": "array"
                  },
                  "city": {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  "client_side": {
                    "enum": ["tenant", "landlord", "employee", "employer", "buyer", "seller", "plaintiff", "defendant", "other", "unknown"],
                    "type": "string"
                  },
                  "county": {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  "objective": {
                    "description": "What the person wants to happen, in their words",
                    "maxLength": 300,
                    "minLength": 1,
                    "type": "string"
                  },
                  "procedural_stage": {
                    "enum": ["not_started", "notice_received", "pre_filing", "filed", "hearing_scheduled", "trial", "post_judgment", "appeal", "unknown"],
                    "type": "string"
                  },
                  "state": {
                    "description": "State where the MATTER is. Ask; never guess it from where the person is.",
                    "maxLength": 40,
                    "minLength": 2,
                    "type": "string"
                  },
                  "state_confirmed_by_user": {
                    "description": "True only after the person confirmed the state",
                    "type": "boolean"
                  },
                  "type": {
                    "description": "Type of legal issue in the person's words, e.g. 'eviction notice', 'unpaid overtime', 'car keeps breaking down'",
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "next_steps": {
                "description": "Next steps the person wrote. ESQ CoPilot does not add legal steps.",
                "items": {
                  "maxLength": 200,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "original_statement": {
                "description": "The person's own first description, word for word. Never rewrite it; pass it back unchanged on every update.",
                "maxLength": 4000,
                "minLength": 10,
                "type": "string"
              },
              "participants": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "description": "Optional. Names stay out of the outreach summary unless the person asks to include them.",
                      "maxLength": 160,
                      "minLength": 1,
                      "type": "string"
                    },
                    "role": {
                      "enum": ["me", "other_side", "employer", "landlord", "seller_or_dealer", "manufacturer", "witness", "agency", "court", "other"],
                      "type": "string"
                    }
                  },
                  "required": ["role"],
                  "type": "object"
                },
                "maxItems": 12,
                "type": "array"
              },
              "questions": {
                "description": "The person's own consultation questions, or the suggested ones after the person edited them",
                "items": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 15,
                "type": "array"
              },
              "redact": {
                "description": "Words the person wants left out of the outreach summary",
                "items": {
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "urgency": {
                "description": "As the person said it",
                "enum": ["emergency", "critical_deadline", "soon", "routine", "unknown"],
                "type": "string"
              },
              "user_reported_deadline": {
                "additionalProperties": false,
                "description": "A date the PERSON reported (court date, notice period). Not checked or calculated.",
                "properties": {
                  "date": {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "what": {
                    "maxLength": 160,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
          },
