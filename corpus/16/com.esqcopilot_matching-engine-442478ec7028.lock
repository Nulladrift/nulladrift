        {
          "name": "update_listing_criteria",
          "title": "Save or change search filters",
          "description": "Save or change search filters (location, budget, timing, practice area, language, sort priorities) for this conversation. No personal contact details. Deleted automatically after 24 hours. This is a listing service, not a lawyer referral service. No lawyer pays for placement or ranking of any kind.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "clear_fields": {
                "items": {
                  "maxLength": 40,
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              },
              "criteria": {
                "additionalProperties": false,
                "description": "Fields to set or change. Do not include names, emails or phone numbers.",
                "properties": {
                  "accessibility_needs": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "billing_preference": {
                    "enum": ["hourly", "flat_fee", "contingency", "retainer", "any"],
                    "type": "string"
                  },
                  "budget_max": {
                    "description": "Total budget the user mentioned, in US dollars",
                    "maximum": 10000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "budget_min": {
                    "maximum": 10000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "category": {
                    "enum": ["civil", "criminal", "administrative", "transactional", "family", "other"],
                    "type": "string"
                  },
                  "city": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "client_side": {
                    "description": "Which side the user is on. ESQ Matching Engine has no record of which side lawyers usually represent, so results carry a warning to ask.",
                    "enum": ["tenant", "landlord", "employee", "employer", "plaintiff", "defendant", "buyer", "seller", "other", "unknown"],
                    "type": "string"
                  },
                  "communication": {
                    "enum": ["phone", "email", "video", "in_person", "any"],
                    "type": "string"
                  },
                  "consultation_by": {
                    "description": "Latest date the user wants a first consultation",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "county": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "court": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "deadline_date": {
                    "description": "A deadline the USER reported (hearing, filing, response). ESQ Matching Engine does not verify or calculate deadlines.",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "deadline_type": {
                    "enum": ["hearing", "filing", "response", "other"],
                    "type": "string"
                  },
                  "description": {
                    "description": "Short description of the legal need in the user's words. Used only to pick a practice area and to notice a cost concern (then free and low-cost options are shown); not stored.",
                    "maxLength": 2000,
                    "type": "string"
                  },
                  "exclude_attorney_ids": {
                    "items": {
                      "format": "uuid",
                      "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                      "type": "string"
                    },
                    "maxItems": 50,
                    "type": "array"
                  },
                  "include_unconfirmed_practice_area": {
                    "description": "Also include licensed lawyers whose practice areas are not on record (labeled clearly)",
                    "type": "boolean"
                  },
                  "language_required": {
                    "description": "True if the language is essential, not just preferred",
                    "type": "boolean"
                  },
                  "languages": {
                    "items": {
                      "maxLength": 40,
                      "type": "string"
                    },
                    "maxItems": 5,
                    "type": "array"
                  },
                  "matter_type": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "max_consultation_fee": {
                    "description": "0 means the user wants a free first consultation",
                    "maximum": 10000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "min_years_licensed": {
                    "maximum": 60,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "payment_plan_needed": {
                    "type": "boolean"
                  },
                  "practice_area": {
                    "description": "Practice area, e.g. 'Landlord-Tenant Law', 'Family Law', 'Criminal Law'",
                    "maxLength": 80,
                    "type": "string"
                  },
                  "priorities": {
                    "description": "Older way to pick an order; used only when sort is not given (price: published_fees_first, speed: availability_reported_first, experience: years_licensed, proximity: nearest_office).",
                    "items": {
                      "enum": ["price", "speed", "experience", "proximity"],
                      "type": "string"
                    },
                    "maxItems": 4,
                    "type": "array"
                  },
                  "procedural_stage": {
                    "enum": ["not_started", "pre_filing", "filed", "hearing_scheduled", "trial", "post_judgment", "appeal", "transaction", "unknown"],
                    "type": "string"
                  },
                  "reduced_fee_eligible": {
                    "description": "User may qualify for pro bono, legal aid or reduced fees",
                    "type": "boolean"
                  },
                  "remote_ok": {
                    "description": "User is willing to work with a lawyer remotely (phone or video) anywhere in the state",
                    "type": "boolean"
                  },
                  "representation_start_by": {
                    "description": "Date as YYYY-MM-DD",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "service_needed": {
                    "enum": ["advice_consultation", "negotiation", "document_preparation", "litigation", "ongoing_representation", "unknown"],
                    "type": "string"
                  },
                  "state": {
                    "description": "US state, two-letter code or name, e.g. CA or California",
                    "maxLength": 40,
                    "minLength": 2,
                    "type": "string"
                  },
                  "subpractice_area": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "urgency": {
                    "enum": ["emergency", "critical_deadline", "soon", "routine", "long_term"],
                    "type": "string"
                  },
                  "zip": {
                    "description": "5-digit ZIP code, only if the user agreed to share it",
                    "pattern": "^\\d{5}$",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "preference_set_id": {
                "description": "Omit to create a new set",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["criteria"],
            "type": "object"
