        {
          "name": "request_attorney_introduction",
          "title": "Send my message to the lawyer I picked (needs my yes) (older name)",
          "description": "Older name of send_client_message, kept until 2026-12-15; use send_client_message. Use only when the person asked to contact ONE specific lawyer they picked, has seen the lawyer's name, the exact message and details to be shared and the consent text, and said yes. Never call it on your own initiative or for several lawyers at once. Call preview_client_message first and pass its approval_code: if the recipient or the text changed since the person's yes, it is refused. Stores only the approved fields; retries with the same idempotency_key do not duplicate, and reusing a key for different details is refused. The same rule applies to every listed lawyer. Returns a contact_request_id, its lifecycle_state and a private status token. This is a listing service, not a lawyer referral service. No lawyer pays for placement or ranking of any kind.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approval_code": {
                "description": "The approval_code from preview_client_message for the exact version the user said yes to. If anything changed since, the request is refused and nothing is stored.",
                "pattern": "^(apr_[a-f0-9]{32}|apr2_[0-9a-z]{6,12}_[a-f0-9]{32})$",
                "type": "string"
              },
              "attorney_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "attribution_token": {
                "description": "Signed campaign/partner token issued by ESQ Matching Engine, if the user arrived through a partner link",
                "maxLength": 600,
                "type": "string"
              },
              "consent": {
                "additionalProperties": false,
                "properties": {
                  "confirmed": {
                    "const": true,
                    "description": "Must be true only after the user explicitly agreed to share the listed fields with this lawyer",
                    "type": "boolean"
                  },
                  "fields_authorized": {
                    "items": {
                      "enum": ["name", "email", "phone", "matter_summary", "preferred_timeframe"],
                      "type": "string"
                    },
                    "minItems": 1,
                    "type": "array"
                  },
                  "recipient_attorney_id": {
                    "description": "Must equal attorney_id: the user agreed to share with THIS lawyer",
                    "format": "uuid",
                    "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                    "type": "string"
                  },
                  "user_statement": {
                    "description": "The user's own words of consent, if available",
                    "maxLength": 300,
                    "type": "string"
                  }
                },
                "required": ["confirmed", "fields_authorized", "recipient_attorney_id"],
                "type": "object"
              },
              "contact": {
                "additionalProperties": false,
                "properties": {
                  "email": {
                    "format": "email",
                    "maxLength": 200,
                    "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "phone": {
                    "pattern": "^[0-9+().\\- ]{7,25}$",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "entry_id": {
                "description": "The entry_id from start_from_directory_profile, if the user started from a directory listing. Counts the listing visit; carries no personal data.",
                "pattern": "^ent_[A-Za-z0-9_-]{8,40}$",
                "type": "string"
              },
              "human_approval_id": {
                "description": "Only when preview_client_message returned human_approval: the id of the page where the person approved",
                "pattern": "^hap_[A-Za-z0-9_-]{16}$",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Same key on retries prevents a duplicate message",
                "maxLength": 100,
                "minLength": 8,
                "type": "string"
              },
              "intake_notice_acknowledged": {
                "description": "True only after the user read: no attorney-client relationship exists yet and the lawyer may decline",
                "type": "boolean"
              },
              "match_id": {
                "maxLength": 40,
                "type": "string"
              },
              "matter_summary": {
                "description": "Summary the USER read and approved for sharing with this lawyer",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              },
              "opposing_party_name": {
                "description": "Name of the other side, if any, so the firm can check conflicts. Not shared beyond the firm.",
                "maxLength": 160,
                "type": "string"
              },
              "pending_ok": {
                "description": "Deprecated since 2026-11-04 and ignored. Messages no longer wait for anything a lawyer buys.",
                "type": "boolean"
              },
              "practice_area": {
                "maxLength": 80,
                "type": "string"
              },
              "preferred_contact_method": {
                "enum": ["email", "phone", "either"],
                "type": "string"
              },
              "preferred_timeframe": {
                "maxLength": 120,
                "type": "string"
              },
              "state": {
                "description": "US state, two-letter code or name, e.g. CA or California",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["attorney_id", "consent", "contact", "matter_summary", "preferred_contact_method", "state"],
            "type": "object"
          },
