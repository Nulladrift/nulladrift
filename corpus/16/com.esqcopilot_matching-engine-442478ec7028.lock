        {
          "name": "get_matching_requirements",
          "title": "What to ask before searching for a lawyer (older name)",
          "description": "Older name of get_search_filters, kept until 2026-12-15; use get_search_filters. Use first when someone wants a lawyer but the state or type of legal issue is unclear (\"I need a lawyer\", \"help me with my landlord\"). Returns the few filters still needed (state, type of issue, location, timing, budget) and what was understood, for the person to confirm. Does not answer the legal question and stores nothing. This is a listing service, not a lawyer referral service. No lawyer pays for placement or ranking of any kind.",
          "inputSchema": {
