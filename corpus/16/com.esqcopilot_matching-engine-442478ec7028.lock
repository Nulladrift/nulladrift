        {
          "name": "get_matter_tracker",
          "title": "Track my messages to lawyers",
          "description": "Use when the person asks where things stand with the messages they sent to lawyers through ESQ CoPilot (up to 10, each with its private status_token). Returns each message's status from its record (recorded, queued, sent, delivered, responded, consultation_requested, consultation_confirmed, cancelled, completed, failed), the lawyer's decision, a timeline of what happened and who reported it, and counts. A consultation counts only when confirmed. Failed and cancelled messages are shown, never hidden. Stores nothing; sends no reminders. This is a listing service, not a lawyer referral service. No lawyer pays for placement or ranking of any kind.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "brief_id": {
                "description": "Optional CaseBrief id from prepare_case_brief, only to label the view",
                "pattern": "^cb_[A-Za-z0-9]{10,24}$",
                "type": "string"
              },
              "items": {
                "description": "The person's own messages: contact_request_id and its private status_token, from send_client_message",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "contact_request_id": {
                      "pattern": "^ref_[A-Za-z0-9_-]{8,40}$",
                      "type": "string"
                    },
                    "status_token": {
                      "maxLength": 100,
                      "minLength": 20,
                      "type": "string"
                    }
                  },
                  "required": ["contact_request_id", "status_token"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Track my messages to lawyers"
          },
          "behavior": {
            "destructive": false,
