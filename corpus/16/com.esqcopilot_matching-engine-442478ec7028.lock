        {
          "name": "find_attorneys",
          "title": "Search the lawyer listing (older name)",
          "description": "Older name of search_attorneys, kept until 2026-12-15; use search_attorneys. Use when someone wants to find a lawyer for a U.S. legal issue, e.g. \"tenant lawyers in Santa Ana\" or \"employment lawyers in Los Angeles\". Needs the state and type of legal issue (or a short description the person confirms). Pass sort when the person picks an order (nearest_office by default, last_name, years_licensed, free_consultation_first, published_fees_first, availability_reported_first) and page for more. Returns a plain summary, the filters applied, shared_notes that apply to every listing (read once), up to three ask_the_user questions, and each listing's own facts: which filters it meets, what is not known, license status, source and date, fees and availability where published, profile link, contact and citation; or an honest 'no listings meet your filters' with legal-aid options. No scores. Show every listing in the order returned; never present one lawyer as the pick for the person. Unknown fees and availability are labeled unknown. Court and government lawyers are left out unless they said they take private clients. Records an anonymous search log only. Not legal advice. This is a listing service, not a lawyer referral service. No lawyer pays for placement or ranking of any kind.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "accessibility_needs": {
                "maxLength": 200,
                "type": "string"
              },
              "attribution_token": {
                "description": "Signed campaign/partner token issued by ESQ Matching Engine, if the user arrived through a partner link",
                "maxLength": 600,
                "type": "string"
              },
              "billing_preference": {
                "enum": ["hourly", "flat_fee", "contingency", "retainer", "any"],
                "type": "string"
              },
              "budget_max": {
                "description": "Total budget the user mentioned, in US dollars",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "budget_min": {
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "category": {
                "enum": ["civil", "criminal", "administrative", "transactional", "family", "other"],
                "type": "string"
              },
              "city": {
                "maxLength": 80,
                "type": "string"
              },
              "client_side": {
                "description": "Which side the user is on. ESQ Matching Engine has no record of which side lawyers usually represent, so results carry a warning to ask.",
                "enum": ["tenant", "landlord", "employee", "employer", "plaintiff", "defendant", "buyer", "seller", "other", "unknown"],
                "type": "string"
              },
              "communication": {
                "enum": ["phone", "email", "video", "in_person", "any"],
                "type": "string"
              },
              "consultation_by": {
                "description": "Latest date the user wants a first consultation",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "county": {
                "maxLength": 80,
                "type": "string"
              },
              "court": {
                "maxLength": 120,
                "type": "string"
              },
              "deadline_date": {
                "description": "A deadline the USER reported (hearing, filing, response). ESQ Matching Engine does not verify or calculate deadlines.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "deadline_type": {
                "enum": ["hearing", "filing", "response", "other"],
                "type": "string"
              },
              "description": {
                "description": "Short description of the legal need in the user's words. Used only to pick a practice area and to notice a cost concern (then free and low-cost options are shown); not stored.",
                "maxLength": 2000,
                "type": "string"
              },
              "exclude_attorney_ids": {
                "items": {
                  "format": "uuid",
                  "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "include_unconfirmed_practice_area": {
