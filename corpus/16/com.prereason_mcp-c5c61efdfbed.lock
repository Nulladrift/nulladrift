        "name": "prereason",
        "title": "PreReason",
        "version": "1.0.0",
        "description": "Financial market context for AI agents: macro, rates, bonds, FX, commodities, companies and Bitcoin.",
        "websiteUrl": "https://www.prereason.com",
        "icons": [
          {
            "src": "https://www.prereason.com/logos/logo-128.png",
            "mimeType": "image/png",
            "sizes": ["128x128"]
          },
          {
            "src": "https://www.prereason.com/logos/logo-256.png",
            "mimeType": "image/png",
