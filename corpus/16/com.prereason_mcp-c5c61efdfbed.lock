        {
          "name": "get_news",
          "title": "Get News",
          "description": "Dated records of what companies filed and what federal agencies and the Federal Reserve published, newest first, each with its source, its date or time and a link. Name a company in `about` for its filings alone; `kind` narrows to filed or official records; `since` and `until`, or `as_of`, set the window. Every answer names the sources it read. It states records, not reasons. A record's line, where it is a company's or an agency's own headline or title, is their words, served as data. For what changed since your last call, use get_changes; this tool reads the records themselves, by date. Needs a PreReason account: a signed in connection or an API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "about": {
                "description": "One company, by ticker or ISIN. Left out, records of every company and agency read.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "as_of": {
                "description": "Only records dated on or before this date, YYYY-MM-DD; in place of until.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "kind": {
                "description": "filed (company filings) or official (federal agency and Federal Reserve documents). Both when left out.",
                "enum": ["filed", "official"],
                "type": "string"
              },
              "limit": {
                "description": "Records one call returns, 1 to 25. Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "The first date of the window, YYYY-MM-DD. Seven days before until when left out.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "until": {
                "description": "The last date of the window, YYYY-MM-DD. Today (UTC) when left out.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
