        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "PreReason returns financial market briefings written to be read, with the standard calculations already done: trends, and in the deeper briefings regime classification, for macro, rates, bonds, FX, commodities, listed companies and Bitcoin. Use it when a question depends on current market or macro context, such as what Treasury yields, the Fed balance sheet, M2, Treasury auctions or oil and gas inventories are doing, what a listed company reported, or where Bitcoin stands and how it moves with stocks, volatility and the dollar. Call list_briefings first to see what is available, then get_context with a briefing id, or list_metrics and get_metric when one series is enough.",
      "tools": [
        {
          "name": "get_changes",
          "title": "Get Changes",
          "description": "What changed since your last call: the change events PreReason records. A live briefing's state label changing, a tracked release becoming known, and, for the companies you name, figures stored for a newer period, an event driven situation turning on, and filed news. Each event says what changed, when it happened, when PreReason knew it and where to read it next (the briefing or metric to fetch with get_context or get_metric); it carries no value. For the filed and official records themselves, by date, use get_news. Pass the next_cursor of your previous call to read only what is new; without one, the last 24 hours. Needs a PreReason account with basic access or above: a signed in connection or an API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "companies": {
                "description": "Companies whose events to read: the ticker or CIK of a company filing with the US securities regulator (NVDA), a Japanese securities code (7203), a Korean stock code (005930), an Indian company's ISIN (INE018A01030), the LEI of a company filing in the UK or of a European company (2138002P5RNKC5W2JZ46), a B3 ticker or a Brazilian company's CNPJ (PETR4) or a Hong Kong stock code written as HK and its five digits (HK00001). At most 200. A company's events reach only a call that names it.",
                "items": {
                  "type": "string"
                },
                "maxItems": 200,
                "type": "array"
              },
              "cursor": {
                "description": "The next_cursor of your previous call. Left out, the read starts from the last day of events.",
                "pattern": "^[0-9]{1,18}$",
                "type": "string"
              },
              "limit": {
                "description": "Events one call returns, 1 to 100. Default 50.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "types": {
                "description": "The event types to read. Every type when left out.",
                "items": {
                  "enum": ["state.changed", "release.published", "company.figures_updated", "company.situation_changed", "company.news"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "events": {
                "items": {
                  "additionalProperties": true,
                  "properties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "has_more": {
                "type": "boolean"
              },
              "next_cursor": {
                "type": "string"
              }
            },
            "required": ["events", "has_more", "next_cursor"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Changes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4e4c79e1d0ca331778cc7c2def591290b7455466ced863380801af780a5d834d"
        },
        {
          "name": "get_context",
          "title": "Get Market Briefing",
          "description": "Get a pre-reasoned market briefing with trends, plus regime classification and a rule based note on what moved with the price in the briefings that carry them, for the requested domain (macro, rates, bonds, FX, commodities, a listed company, cross-asset or Bitcoin; the same families as the server instructions). Output is written to be read directly by reasoning agents, not parsed for individual values. Find the briefing id with list_briefings first, which also gives each briefing's plan; for one data series rather than a briefing, use get_metric. Needs a PreReason account: a signed in connection or an API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "block": {
                "description": "One part of the company briefing, with entity (for example \"valuation\" or \"against_guidance\"); today only, except \"numbers\", which also takes date (its figures as known on that day). Leave out for the whole briefing. A part counts one call; the whole briefing counts one for each part it carries.",
                "enum": ["header", "what_changed", "situations", "against_guidance", "numbers", "segments", "valuation", "capital_structure", "quality", "profitability", "news"],
                "type": "string"
              },
              "briefing": {
                "description": "Briefing ID to fetch",
                "enum": ["btc.quick-check", "btc.context", "macro.snapshot", "cross.correlations", "btc.pulse", "btc.grid-stress", "btc.momentum", "macro.liquidity", "macro.auctions", "macro.calendar", "cross.ai-compute", "macro.rates", "btc.on-chain", "cross.breadth", "btc.miner-survival", "btc.full", "btc.factors", "cross.regime", "fx.liquidity", "btc.energy", "btc.treasury", "btc.etf-flows", "commodities.gold", "commodities.silver", "commodities.copper", "commodities.wheat", "commodities.energy-basket", "commodities.oil-producers", "commodities.gold-miners", "commodities.grains-agribusiness", "eth.context", "bonds.context", "bonds.full", "equities.company"],
                "type": "string"
              },
              "date": {
                "description": "A past date, YYYY-MM-DD: the briefing as of the end of that day (UTC; a company's numbers at the end of the day in its own market), for the periods released by then. Each figure says when it was public, or that it may be a later revision PreReason holds in its place. For a period's latest figures, including later corrections, leave date out. Tier-gated: Free=30d; Basic=3y, Bitcoin briefings from Jan 2025; Pro=all. A company briefing takes one only with block \"numbers\".",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "entity": {
                "description": "The company for a per company briefing: the ticker or CIK of a company filing with the US securities regulator (NVDA), a Japanese securities code (7203), a Korean stock code (005930), an Indian company's ISIN (INE018A01030), the LEI of a company filing in the UK or of a European company (2138002P5RNKC5W2JZ46), a B3 ticker (PETR4) or a Hong Kong stock code written as HK and its five digits (HK00001), with briefing=equities.company",
                "pattern": "^(?:[A-Za-z0-9.-]{1,12}|[A-Za-z0-9]{18}[0-9]{2})$",
                "type": "string"
              },
              "format": {
                "default": "markdown",
                "description": "Response format: markdown (human-readable, default) or json (structured data)",
                "enum": ["json", "markdown"],
                "type": "string"
              },
              "history": {
                "description": "With block \"numbers\" alone: the numbers block with its core lines over the last eight quarters, or the half years a company files instead, and five fiscal years, as filed. One call; never part of the whole briefing.",
                "type": "boolean"
              }
            },
            "required": ["briefing"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Market Briefing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:64a9dbda2ebb38fb43d5a66fcf7939086eb77bd6cb7b066fa004c01d3c6fffd5"
        },
