  "subjects": {
    "com.gitshine/gitshine": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://gitshine.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "gitshine",
        "title": "GitShine",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "GitShine reads public GitHub data for any username. Use get_github_stats for a profile's all-time numbers, get_github_wrapped for one year, compare_github_profiles to put two side by side, get_readme_card for the Markdown line that adds an animated card to a profile README (several layouts and themes), get_repo_card for a card in a project's README (repository, star history or contributors), and get_org_card for a card in an organization's profile README. Answers are Markdown with links to the matching gitshine.com page; cite those links.",
      "tools": [
        {
          "name": "compare_github_profiles",
          "title": "Compare two GitHub profiles",
          "description": "Two GitHub users' year side by side: contributions, active days, streaks, busiest month, work by type and top language.",
          "inputSchema": {
            "properties": {
              "a": {
                "description": "A GitHub username, @handle or profile URL (organizations aren't supported).",
                "type": "string"
              },
              "b": {
                "description": "A GitHub username, @handle or profile URL (organizations aren't supported).",
                "type": "string"
              },
              "year": {
                "description": "Calendar year, from the year the account was created to this year. Defaults to this year.",
                "type": "integer"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5a39ca6637f31f0247e7e555de42053780037b3fdf6db5e5e1a57eab578f97b2"
        },
        {
          "name": "get_github_stats",
          "title": "GitHub stats",
          "description": "A GitHub user's stats: contributions in the last 12 months and all time (year by year), longest and current streak, biggest day, commits/PRs/reviews/issues since joining, top languages by code size and most-starred repositories.",
          "inputSchema": {
            "properties": {
              "username": {
                "description": "A GitHub username, @handle or profile URL (organizations aren't supported).",
                "type": "string"
              }
            },
            "required": ["username"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:78974070b54a1e7421fe0e1a426862c29bae2640d59acfc24fafd40a856fc2cc"
        },
        {
          "name": "get_github_wrapped",
          "title": "GitHub Wrapped",
          "description": "A GitHub user's year in review: contributions and active days, longest streak, busiest day, month and weekday, top repositories and languages, achievements and a one-line persona.",
          "inputSchema": {
            "properties": {
              "username": {
                "description": "A GitHub username, @handle or profile URL (organizations aren't supported).",
                "type": "string"
              },
              "year": {
                "description": "Calendar year, from the year the account was created to this year. Defaults to this year.",
                "type": "integer"
              }
            },
            "required": ["username"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a68a2e9f0ec5716bbb41297a45e187577adf2ac010f788192f9dbb761fc8acba"
        },
        {
          "name": "get_org_card",
          "title": "Organization card",
          "description": "The Markdown line for a GitShine card in a GitHub organization's profile README: total stars, top three repositories, how many are active this month and the main languages. Includes steps for adding it.",
          "inputSchema": {
            "properties": {
              "organization": {
                "description": "The organization's login, like vercel, or its GitHub URL.",
                "type": "string"
              },
              "theme": {
                "enum": ["auto", "dark", "light", "night", "transparent", "dimmed", "tokyonight", "dracula", "catppuccin"],
                "type": "string"
              }
            },
            "required": ["organization"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:33aac53a78d98ceec8658c6b505e362d22c308f1082d5deca46d313e65ff000e"
        },
        {
          "name": "get_readme_card",
          "title": "README stats card",
          "description": "The Markdown line that puts GitShine's animated stats card (contribution graph, streaks, stars, top languages) on a GitHub profile README, with step-by-step instructions for adding it. Free, no token.",
          "inputSchema": {
            "properties": {
              "layout": {
                "description": "full (default): graph, totals, streaks and languages. Half width (pair two side by side): compact (streak), languages, week (contributions by weekday), repos (most-starred repositories). Full width: years (a bar per year), sky (the year as a night sky), wrapped (this year so far).",
                "enum": ["full", "compact", "languages", "week", "repos", "years", "sky", "wrapped"],
                "type": "string"
              },
              "theme": {
                "description": "auto (default) follows the viewer's light or dark mode; transparent has no background; dimmed, tokyonight, dracula and catppuccin are editor palettes.",
                "enum": ["auto", "dark", "light", "night", "transparent", "dimmed", "tokyonight", "dracula", "catppuccin"],
                "type": "string"
              },
              "username": {
                "description": "A GitHub username, @handle or profile URL (organizations aren't supported).",
                "type": "string"
              }
            },
            "required": ["username"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:64d421dbf8cd88dfbf1e273e9e7529d6867a8f25310d9d0ebab974d6d91ac98e"
        },
        {
          "name": "get_repo_card",
          "title": "Repository card",
          "description": "The Markdown line for a GitShine card in a project's README, for any public GitHub repository. card=repo (default): stars, description, a year of weekly commits, open issues and pull requests. card=stars: star history, stars over time since the first one. card=contributors: avatars of the people who contributed. Includes steps for adding it.",
          "inputSchema": {
            "properties": {
              "card": {
                "description": "Which card: repo, stars or contributors.",
                "enum": ["repo", "stars", "contributors"],
                "type": "string"
              },
              "repository": {
                "description": "owner/name, or the repository's GitHub URL.",
                "type": "string"
              },
              "theme": {
                "enum": ["auto", "dark", "light", "night", "transparent", "dimmed", "tokyonight", "dracula", "catppuccin"],
                "type": "string"
              }
            },
            "required": ["repository"],
            "type": "object"
          },
