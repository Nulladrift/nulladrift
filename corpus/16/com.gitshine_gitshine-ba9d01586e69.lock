      "serverInfo": {
        "name": "gitshine",
        "title": "GitShine",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "GitShine reads public GitHub data for any username (not organizations). Use get_github_stats for a profile's all-time numbers, get_github_wrapped for one year, compare_github_profiles to put two side by side, and get_readme_card for the Markdown line that adds an animated stats card to a profile README. Answers are Markdown with links to the matching gitshine.com page; cite those links.",
      "tools": [
        {
          "name": "compare_github_profiles",
          "title": "Compare two GitHub profiles",
          "description": "Two GitHub users' year side by side: contributions, active days, streaks, busiest month, work by type and top language.",
          "inputSchema": {
            "properties": {
              "a": {
                "description": "A GitHub username, @handle or profile URL (organizations aren't supported).",
                "type": "string"
              },
              "b": {
                "description": "A GitHub username, @handle or profile URL (organizations aren't supported).",
                "type": "string"
              },
              "year": {
                "description": "Calendar year, from the year the account was created to this year. Defaults to this year.",
                "type": "integer"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5a39ca6637f31f0247e7e555de42053780037b3fdf6db5e5e1a57eab578f97b2"
        },
        {
          "name": "get_github_stats",
          "title": "GitHub stats",
          "description": "A GitHub user's stats: contributions in the last 12 months and all time (year by year), longest and current streak, biggest day, commits/PRs/reviews/issues since joining, top languages by code size and most-starred repositories.",
          "inputSchema": {
            "properties": {
              "username": {
                "description": "A GitHub username, @handle or profile URL (organizations aren't supported).",
                "type": "string"
              }
            },
            "required": ["username"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:78974070b54a1e7421fe0e1a426862c29bae2640d59acfc24fafd40a856fc2cc"
        },
        {
          "name": "get_github_wrapped",
          "title": "GitHub Wrapped",
          "description": "A GitHub user's year in review: contributions and active days, longest streak, busiest day, month and weekday, top repositories and languages, achievements and a one-line persona.",
          "inputSchema": {
            "properties": {
              "username": {
                "description": "A GitHub username, @handle or profile URL (organizations aren't supported).",
                "type": "string"
              },
              "year": {
                "description": "Calendar year, from the year the account was created to this year. Defaults to this year.",
                "type": "integer"
              }
            },
            "required": ["username"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a68a2e9f0ec5716bbb41297a45e187577adf2ac010f788192f9dbb761fc8acba"
        },
        {
          "name": "get_readme_card",
          "title": "README stats card",
          "description": "The Markdown line that puts GitShine's animated stats card (contribution graph, streaks, stars, top languages) on a GitHub profile README, with step-by-step instructions for adding it. Free, no token.",
          "inputSchema": {
            "properties": {
              "layout": {
                "description": "compact is a smaller streak card.",
                "enum": ["full", "compact"],
                "type": "string"
              },
              "theme": {
                "description": "auto (default) follows the viewer's light or dark mode.",
                "enum": ["auto", "dark", "light", "night"],
                "type": "string"
              },
              "username": {
                "description": "A GitHub username, @handle or profile URL (organizations aren't supported).",
                "type": "string"
              }
            },
            "required": ["username"],
            "type": "object"
          },
