      "serverInfo": {
        "name": "pickshade",
        "title": "PickShade color tools",
        "version": "0.2.0",
        "websiteUrl": "https://pickshade.com/mcp"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "PickShade color tools. Every tool accepts colors as HEX, rgb(), hsl(), oklch(), CSS names like navy, common names like royal blue, or Tailwind classes like sky-500. Use find_colors to turn words like \"sage\" or \"dusty rose\" into real HEX values instead of guessing them. Use check_contrast before recommending text and background colors, fix_contrast to repair a failing pair without changing its hue, and audit_palette to check a whole theme or chart palette at once. Use build_system or export_tokens to hand over ready code, and make_gradient for CSS gradients without a gray middle. All math follows CSS Color 4 and runs locally and deterministically. Pass a seed to generate_palette to get repeatable palettes.",
      "tools": [
        {
          "name": "audit_palette",
          "title": "Audit a palette for accessibility",
          "description": "Check every text and background pair in a palette with WCAG 2 and APCA, list which pairs are safe for body text, large text or only decoration, find colors that people with color blindness cannot tell apart, and flag colors outside sRGB. Use it before shipping a theme or chart palette.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "colors": {
                "description": "Palette colors, 2 to 12",
                "items": {
                  "description": "Any color: #ff5733, rgb(255 87 51), hsl(11 100% 60%), oklch(68% 0.21 34), a CSS or common name like navy, or a Tailwind class like sky-500",
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["colors"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
