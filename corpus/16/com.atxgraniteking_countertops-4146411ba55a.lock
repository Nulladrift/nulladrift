        {
          "name": "list_finishes",
          "title": "Cabinet wood and hardware finishes",
          "description": "Cabinet wood and hardware finish options for visualize_kitchen and generate_quote. Visualization only: ATX Granite King installs countertops, not cabinets or hardware. 'keep' (default) keeps the user's own.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
