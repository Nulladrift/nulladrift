{
  "lockfileVersion": 2,
  "subjects": {
    "com.atxgraniteking/countertops": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://atxgraniteking.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "atx-granite-king",
        "title": "ATX Granite King",
        "version": "1.2.0",
        "websiteUrl": "https://atxgraniteking.com",
        "icons": [
          {
            "src": "https://atxgraniteking.com/assets/logo.svg",
            "mimeType": "image/svg+xml"
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "ATX Granite King fabricates and installs granite, quartz and quartzite countertops in Austin and Central Texas. Use get_pricing for the posted rates, search_stones for the live slab yard, estimate_job for a quick price, and generate_quote for an itemized quote from the user's counter runs, island and options: it returns a shareable quote page right away. Pass room_image_url (a public photo of their kitchen) to also render the stone onto their own kitchen, optionally with a different cabinet wood or hardware finish from list_finishes (visualization only; we install countertops, not cabinets or hardware). The picture usually comes back in the same reply; if not, call get_quote with the id. If the user shared a photo in chat (no public link), give them the quote_url: they can upload the photo on that page. Use request_quote only when the user explicitly asks to be contacted and gives their own phone or email.",
      "tools": [
        {
          "name": "check_service_area",
          "title": "Check service area",
          "description": "Whether ATX Granite King serves a city or town, and whether pricing changes there.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:244530fe9630068f0c29c5b528d14077d2fc0b7145d2582edac59b039a532bce"
        },
        {
          "name": "estimate_job",
          "title": "Estimate a countertop job",
          "description": "Estimate total cost from countertop square feet: install at the posted rate plus slabs. Assumes about 75% of each slab is usable.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slab_price_usd": {
                "description": "Price per slab; defaults to the $999 Budget Collection",
                "minimum": 0,
                "type": "number"
              },
              "slab_sqft": {
                "description": "Square feet per slab; defaults to 55 (about 126 x 63 in)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "sqft": {
                "description": "Countertop square feet (length x depth in inches / 144, summed)",
                "exclusiveMinimum": 0,
                "maximum": 20000,
                "type": "number"
              }
            },
            "required": ["sqft"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5032a66ed52b72412c8e1a7f06f57d7991581c4ccd7f1ced9e6ec5dd5e0a704f"
        },
        {
          "name": "generate_quote",
          "title": "Itemized countertop quote (+ optional kitchen render)",
          "description": "Build an itemized countertop quote at ATX Granite King's posted rates (install $38/sq ft, $30/sq ft over 1,000 sq ft, Budget Collection slabs $999) from the user's sq ft or counter runs, island and options. Items with no posted price are listed as quoted at measure. Returns at once with a shareable quote page URL. If room_image_url (a public photo of the user's kitchen) is given, the stone is also rendered onto it (optionally with a cabinet_wood / hardware_finish from list_finishes) and the picture usually comes back in this reply. No public photo link? Give the user the quote_url: they can upload a kitchen photo there.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "backsplash_height_in": {
                "description": "Stone backsplash height in inches along the runs; 0 = none (default). Quoted at measure.",
                "maximum": 120,
                "minimum": 0,
                "type": "number"
              },
              "cabinet_wood": {
                "description": "Visualization only (we don't sell cabinets). One of: keep, white-oak, red-oak, walnut, cherry, maple, hickory, painted-white, painted-navy, painted-greige, painted-sage. Default keep.",
                "maxLength": 40,
                "type": "string"
              },
              "city": {
                "description": "City of the job (same price within 60 miles of Austin)",
                "maxLength": 60,
                "type": "string"
              },
              "cooktop_cutout": {
                "description": "Cooktop / extra cutout (quoted at measure)",
                "type": "boolean"
              },
              "edge": {
                "description": "Edge profile; eased is standard, others quoted at measure",
                "enum": ["eased", "bevel", "ogee", "bullnose", "other"],
                "type": "string"
              },
              "hardware_finish": {
                "description": "Visualization only (we don't sell hardware). One of: keep, matte-black, brushed-nickel, brushed-brass, polished-chrome, oil-rubbed-bronze, unlacquered-brass. Default keep.",
                "maxLength": 40,
                "type": "string"
              },
              "island": {
                "additionalProperties": false,
                "description": "Island top in inches",
                "properties": {
                  "depth_in": {
                    "exclusiveMinimum": 0,
                    "maximum": 240,
                    "type": "number"
                  },
                  "length_in": {
                    "exclusiveMinimum": 0,
                    "maximum": 1200,
                    "type": "number"
                  }
                },
                "required": ["depth_in", "length_in"],
                "type": "object"
              },
              "name": {
                "description": "Optional name to show on the quote",
                "maxLength": 80,
                "type": "string"
              },
              "notes": {
                "maxLength": 800,
                "type": "string"
              },
              "room_image_url": {
                "description": "Public URL of a photo of the kitchen, countertops visible",
                "format": "uri",
                "maxLength": 2000,
                "type": "string"
              },
              "runs": {
                "description": "Counter runs (up to 12): length_in, optional depth_in (default 25.5), optional label",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "depth_in": {
                      "description": "Depth in inches; default 25.5",
                      "exclusiveMinimum": 0,
                      "maximum": 120,
                      "type": "number"
                    },
                    "label": {
                      "description": "e.g. 'sink wall'",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "length_in": {
                      "description": "Run length in inches",
                      "exclusiveMinimum": 0,
                      "maximum": 1200,
                      "type": "number"
                    }
                  },
                  "required": ["length_in"],
                  "type": "object"
                },
                "maxItems": 12,
                "type": "array"
              },
              "sinks": {
                "description": "Sink cutouts, default 1 (included in install)",
                "maximum": 4,
                "minimum": 0,
                "type": "integer"
              },
              "sqft": {
                "description": "Countertop square feet, if known. Otherwise give runs (and island).",
                "exclusiveMinimum": 0,
                "maximum": 20000,
                "type": "number"
              },
              "stone_slug": {
                "description": "Stone slug from search_stones, e.g. '2cm-taj-mahal-premium-leather' or 'budget-absolute-white'",
                "maxLength": 120,
                "type": "string"
              },
              "tear_out": {
                "description": "Tear-out of old tops (quoted at measure)",
                "type": "boolean"
              }
            },
            "required": ["stone_slug"],
            "type": "object"
          },
