          },
          "digest": "sha256:fd11ac77488338cc4db4f76893308fca155afe35e795836fd9a07fcd400d1da1"
        },
        {
          "name": "visualize_kitchen",
          "title": "See a stone on your kitchen",
          "description": "Render a slab from the Austin yard onto a photo of the user's own kitchen or bath, and return the image with a price estimate. Pass a public image URL of the room (JPEG/PNG/WebP) and a stone slug from search_stones. Rendering takes about 30-90 seconds; if it is not ready in time, call get_visualization with the returned id. Optional cabinet_wood / hardware_finish (from list_finishes) preview a different cabinet finish or hardware; visualization only, we don't sell cabinets or hardware.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cabinet_wood": {
                "description": "Visualization only (we don't sell cabinets). One of: keep, white-oak, red-oak, walnut, cherry, maple, hickory, painted-white, painted-navy, painted-greige, painted-sage. Default keep.",
                "maxLength": 40,
                "type": "string"
              },
              "hardware_finish": {
                "description": "Visualization only (we don't sell hardware). One of: keep, matte-black, brushed-nickel, brushed-brass, polished-chrome, oil-rubbed-bronze, unlacquered-brass. Default keep.",
                "maxLength": 40,
                "type": "string"
              },
              "room_image_url": {
                "description": "Public URL of a photo of the room, countertops visible",
                "format": "uri",
                "type": "string"
              },
              "sqft": {
                "description": "Countertop square feet, for the price estimate",
                "exclusiveMinimum": 0,
                "maximum": 5000,
                "type": "number"
              },
              "stone_slug": {
                "description": "Stone slug from search_stones, e.g. '2cm-taj-mahal-premium-leather'",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["room_image_url", "stone_slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
