        },
        {
          "name": "request_quote",
          "title": "Request a quote",
          "description": "Send a countertop quote request to the ATX Granite King crew. Only call this when the user explicitly asks to be contacted and has given their own phone or email.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "maxLength": 60,
                "type": "string"
              },
              "details": {
                "maxLength": 800,
                "type": "string"
              },
              "email": {
                "format": "email",
                "maxLength": 120,
                "type": "string"
              },
              "name": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "maxLength": 30,
                "type": "string"
              },
              "sqft": {
                "exclusiveMinimum": 0,
                "maximum": 20000,
                "type": "number"
              },
              "stone": {
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:254b146d235e3321e92a1a4ceaac6a2b95ea232f2b5f4c10fb2ad2d42dd88f56"
        },
        {
          "name": "search_stones",
          "title": "Search the slab yard",
          "description": "Search granite, quartz, quartzite, marble and other slabs currently on the Austin yard, including $999 Budget Collection slabs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "budget_only": {
                "description": "Only $999 Budget Collection slabs",
                "type": "boolean"
              },
              "color": {
                "description": "White, Gray, Black, Cream, Brown, Green, Blue, ...",
                "maxLength": 30,
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "material": {
                "description": "Granite, Quartz, Quartzite, Marble, Porcelain, Dolomite, ...",
                "maxLength": 30,
                "type": "string"
              },
              "query": {
                "description": "Words in the stone name, e.g. 'taj mahal' or 'black'",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
