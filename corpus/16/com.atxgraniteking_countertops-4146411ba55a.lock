{
  "lockfileVersion": 2,
  "subjects": {
    "com.atxgraniteking/countertops": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://atxgraniteking.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "atx-granite-king",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "ATX Granite King fabricates and installs granite, quartz and quartzite countertops in Austin and Central Texas. Use get_pricing for the posted rates, search_stones for the live slab yard, estimate_job for a price, and request_quote only when the user explicitly asks to be contacted and gives their own phone or email.",
      "tools": [
        {
          "name": "check_service_area",
          "title": "Check service area",
          "description": "Whether ATX Granite King serves a city or town, and whether pricing changes there.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9e298987e584a99f13b7943c84e3cf701602027fbe729c1da67243e5c670b71b"
        },
        {
          "name": "estimate_job",
          "title": "Estimate a countertop job",
          "description": "Estimate total cost from countertop square feet: install at the posted rate plus slabs. Assumes about 75% of each slab is usable.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slab_price_usd": {
                "description": "Price per slab; defaults to the $999 Budget Collection",
                "minimum": 0,
                "type": "number"
              },
              "slab_sqft": {
                "description": "Square feet per slab; defaults to 55 (about 126 x 63 in)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "sqft": {
                "description": "Countertop square feet (length x depth in inches / 144, summed)",
                "exclusiveMinimum": 0,
                "maximum": 20000,
                "type": "number"
              }
            },
            "required": ["sqft"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1029875b34737d2aaebc5f171a8673e2d1f86a7c0021a0db9d80126e92729550"
        },
        {
          "name": "get_pricing",
          "title": "Posted countertop pricing",
          "description": "ATX Granite King's posted prices, what they include, service area and contact details.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:836c8192abf50c466d793beac4e4ee725b5c976e2b04f9bf25d73b7be8ec9fb6"
        },
        {
          "name": "get_stone",
          "title": "Stone details",
          "description": "Full details for one stone by slug (from search_stones).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:360134c81e30064e4de1cb1e146b4c3c6feb636e9a850a811f2694b34888a049"
        },
        {
          "name": "get_visualization",
          "title": "Check a visualization",
          "description": "Status and image for a visualize_kitchen job.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a8bb710d2e8062000d0bca93ae993b6fd033baefb9051b502ac8831e24b07e62"
        },
        {
          "name": "request_quote",
          "title": "Request a quote",
          "description": "Send a countertop quote request to the ATX Granite King crew. Only call this when the user explicitly asks to be contacted and has given their own phone or email.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "maxLength": 60,
                "type": "string"
              },
              "details": {
                "maxLength": 800,
                "type": "string"
              },
              "email": {
                "format": "email",
                "maxLength": 120,
                "type": "string"
              },
              "name": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "maxLength": 30,
                "type": "string"
              },
              "sqft": {
                "exclusiveMinimum": 0,
                "maximum": 20000,
                "type": "number"
              },
              "stone": {
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d17daafdfb7fae06d03eefd7cee88b9775f37739b8b57694b7995ce46c16a0a5"
        },
        {
          "name": "search_stones",
          "title": "Search the slab yard",
          "description": "Search granite, quartz, quartzite, marble and other slabs currently on the Austin yard, including $999 Budget Collection slabs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "budget_only": {
                "description": "Only $999 Budget Collection slabs",
                "type": "boolean"
              },
              "color": {
                "description": "White, Gray, Black, Cream, Brown, Green, Blue, ...",
                "maxLength": 30,
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "material": {
                "description": "Granite, Quartz, Quartzite, Marble, Porcelain, Dolomite, ...",
                "maxLength": 30,
                "type": "string"
              },
              "query": {
                "description": "Words in the stone name, e.g. 'taj mahal' or 'black'",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1cd89c5b3f9b605a1767b90fd5c3e231a66e5c533520733c922858f09d94a4cd"
        },
        {
          "name": "visualize_kitchen",
          "title": "See a stone on your kitchen",
          "description": "Render a slab from the Austin yard onto a photo of the user's own kitchen or bath, and return the image with a price estimate. Pass a public image URL of the room (JPEG/PNG/WebP) and a stone slug from search_stones. Rendering takes about 30-90 seconds; if it is not ready in time, call get_visualization with the returned id.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "room_image_url": {
                "description": "Public URL of a photo of the room, countertops visible",
                "format": "uri",
                "type": "string"
              },
              "sqft": {
                "description": "Countertop square feet, for the price estimate",
                "exclusiveMinimum": 0,
                "maximum": 5000,
                "type": "number"
              },
              "stone_slug": {
                "description": "Stone slug from search_stones, e.g. '2cm-taj-mahal-premium-leather'",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["room_image_url", "stone_slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:797b95a91d6f5f3a117d70c013696c758b751a99f4020774b7d7989bd8c89018"
        }
      ],
      "digest": "sha256:d77c81365f03012918b2357b6474fad23002fcf5f2f381688995961b05f254f9"
    }
  }
}
