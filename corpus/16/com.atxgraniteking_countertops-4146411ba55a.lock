{
  "lockfileVersion": 2,
  "subjects": {
    "com.atxgraniteking/countertops": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://atxgraniteking.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "atx-granite-king",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "ATX Granite King fabricates and installs granite, quartz and quartzite countertops in Austin and Central Texas. Use get_pricing for the posted rates, search_stones for the live slab yard, estimate_job for a price, and request_quote only when the user explicitly asks to be contacted and gives their own phone or email.",
      "tools": [
        {
          "name": "check_service_area",
          "title": "Check service area",
          "description": "Whether ATX Granite King serves a city or town, and whether pricing changes there.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f5c5039a339eda213e35fec7cb756383d74732ef71f99167aab0bf0c2f444c1f"
        },
        {
          "name": "estimate_job",
          "title": "Estimate a countertop job",
          "description": "Estimate total cost from countertop square feet: install at the posted rate plus slabs. Assumes about 75% of each slab is usable.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slab_price_usd": {
                "description": "Price per slab; defaults to the $999 Budget Collection",
                "minimum": 0,
                "type": "number"
              },
              "slab_sqft": {
                "description": "Square feet per slab; defaults to 55 (about 126 x 63 in)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "sqft": {
                "description": "Countertop square feet (length x depth in inches / 144, summed)",
                "exclusiveMinimum": 0,
                "maximum": 20000,
                "type": "number"
              }
            },
            "required": ["sqft"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5530048c6608584b05cc33930aa97a7c027923a09a3b65df71ce07df86562b8b"
        },
        {
          "name": "get_pricing",
          "title": "Posted countertop pricing",
          "description": "ATX Granite King's posted prices, what they include, service area and contact details.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0e15975351452e5125da9116db9a534908742ea873f835b2ecd1a7bf8caa2e85"
        },
        {
          "name": "get_stone",
          "title": "Stone details",
          "description": "Full details for one stone by slug (from search_stones).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:faece7e815354e2e67b09cf7e990ff8292f8083f9754fce554d22196e6a7215a"
        },
        {
          "name": "get_visualization",
          "title": "Check a visualization",
          "description": "Status and image for a visualize_kitchen job.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e7d4c4e4bc80ad46dae1ffe763a30a9e6a8742b62a1ebadb9ad0ca7946393d35"
        },
        {
          "name": "request_quote",
          "title": "Request a quote",
          "description": "Send a countertop quote request to the ATX Granite King crew. Only call this when the user explicitly asks to be contacted and has given their own phone or email.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "maxLength": 60,
                "type": "string"
              },
              "details": {
                "maxLength": 800,
                "type": "string"
              },
              "email": {
                "format": "email",
                "maxLength": 120,
                "type": "string"
              },
              "name": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "maxLength": 30,
                "type": "string"
              },
              "sqft": {
                "exclusiveMinimum": 0,
                "maximum": 20000,
                "type": "number"
              },
              "stone": {
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:254b146d235e3321e92a1a4ceaac6a2b95ea232f2b5f4c10fb2ad2d42dd88f56"
        },
        {
          "name": "search_stones",
          "title": "Search the slab yard",
          "description": "Search granite, quartz, quartzite, marble and other slabs currently on the Austin yard, including $999 Budget Collection slabs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "budget_only": {
                "description": "Only $999 Budget Collection slabs",
                "type": "boolean"
              },
              "color": {
                "description": "White, Gray, Black, Cream, Brown, Green, Blue, ...",
                "maxLength": 30,
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "material": {
                "description": "Granite, Quartz, Quartzite, Marble, Porcelain, Dolomite, ...",
                "maxLength": 30,
                "type": "string"
              },
              "query": {
                "description": "Words in the stone name, e.g. 'taj mahal' or 'black'",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:fd11ac77488338cc4db4f76893308fca155afe35e795836fd9a07fcd400d1da1"
        },
        {
          "name": "visualize_kitchen",
          "title": "See a stone on your kitchen",
          "description": "Render a slab from the Austin yard onto a photo of the user's own kitchen or bath, and return the image with a price estimate. Pass a public image URL of the room (JPEG/PNG/WebP) and a stone slug from search_stones. Rendering takes about 30-90 seconds; if it is not ready in time, call get_visualization with the returned id.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "room_image_url": {
                "description": "Public URL of a photo of the room, countertops visible",
                "format": "uri",
                "type": "string"
              },
              "sqft": {
                "description": "Countertop square feet, for the price estimate",
                "exclusiveMinimum": 0,
                "maximum": 5000,
                "type": "number"
              },
              "stone_slug": {
                "description": "Stone slug from search_stones, e.g. '2cm-taj-mahal-premium-leather'",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["room_image_url", "stone_slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4b96b9d3ee916484c0af25051c9cae51956c9def4831bf60ee6cbfb9a151efba"
        }
      ],
      "digest": "sha256:8a8ba187305b3d2f67090d20757d7e1bc514943162d4895e2850da10964a7aa3"
    }
  }
}
