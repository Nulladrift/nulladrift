        },
        {
          "name": "summarize_facilities",
          "title": "Summarize nursing home statistics",
          "description": "Aggregate numeric ProviderInfo fields (n, mean, min, max; optional median) across certified nursing homes. Facility-equal means, not bed-weighted. Missing values are excluded per metric. Not causal. A named home still needs a single-facility lookup.",
          "inputSchema": {
            "properties": {
              "abuse_icon": {
                "type": "string"
              },
              "city": {
                "description": "City filter. Requires state.",
                "type": "string"
              },
              "filedate": {
                "description": "Optional monthly snapshot (YYYY-MM-DD or YYYY-MM). Defaults to the latest loaded file.",
                "type": "string"
              },
              "group_by": {
                "description": "Omit for one national (or filter-scoped) row per metric. ownership_kind is Government | For profit | Non profit.",
                "enum": ["ownership", "ownership_kind", "state", "overall_rating", "staffing_rating", "survey_rating", "quality_rating", "sffstatus", "abuse_icon", "icon_hi_perf"],
                "type": "string"
              },
              "icon_hi_perf": {
                "description": "CMS high-performing icon. Y keeps homes currently eligible for a Risk-Based Survey.",
                "type": "string"
              },
              "include_median": {
                "description": "When true, each stats object also includes median. Default false.",
                "type": "boolean"
              },
              "max_overall_rating": {
                "type": "integer"
              },
              "metrics": {
                "description": "Metric keys: tothrd, rnhrd, weekend_tothrd, weekend_rnhrd, totalnursingstaffturnover, registerednurseturnover, weighted_all_cycles_score, overall_rating, survey_rating, staffing_rating, quality_rating, bedcert, restot, fine_tot, fine_cnt, occupancy (and documented synonyms).",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "min_overall_rating": {
                "type": "integer"
              },
              "ownership": {
                "description": "CMS ownership type. Prefixes For profit, Non profit, and Government match that kind. Applied before aggregation.",
                "type": "string"
              },
              "sffstatus": {
                "type": "string"
              },
              "state": {
                "type": "string"
              },
              "zip": {
                "type": "string"
              }
            },
            "required": ["metrics"],
            "type": "object"
          },
          "annotations": {
