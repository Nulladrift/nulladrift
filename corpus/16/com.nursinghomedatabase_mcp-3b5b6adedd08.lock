              },
              "city": {
                "type": "string"
              },
              "filedate": {
                "description": "Optional monthly snapshot (YYYY-MM-DD or YYYY-MM). Defaults to the latest loaded file.",
                "type": "string"
              },
              "limit": {
                "type": "integer"
              },
              "max_overall_rating": {
                "type": "integer"
              },
              "min_overall_rating": {
                "type": "integer"
              },
              "offset": {
                "type": "integer"
              },
              "ownership": {
                "description": "CMS ownership type. Case-insensitive. Prefixes For profit, Non profit, and Government match that kind. Exact values from list_distinct_values field=ownership, e.g. \"For profit - Limited Liability company\".",
                "type": "string"
              },
              "q": {
                "type": "string"
              },
              "radius_miles": {
                "type": "number"
              },
              "sort": {
                "enum": ["overall_rating", "survey_rating", "quality_rating", "staffing_rating", "distance", "tothrd", "total_nurse_hours", "totalnursingstaffturnover", "nurse_turnover", "weighted_all_cycles_score", "survey_score"],
                "type": "string"
              },
              "state": {
                "type": "string"
              },
              "zip": {
