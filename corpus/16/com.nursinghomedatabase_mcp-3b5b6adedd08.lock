        {
          "name": "get_facility",
          "title": "Get nursing home details",
          "description": "Get one certified skilled nursing facility by CMS CCN (provnum) or web slug. Returns the same decision fields as search_facilities: ratings, nurse hours (HPRD), nurse/RN turnover, weighted inspection score, beds, fines, abuse/SFF flags, and maps deep-links. Use data_as_of as the CMS vintage; do not invent ratings or hours that are missing. Defaults to the latest monthly snapshot; pass filedate from list_file_dates for a prior month.",
          "inputSchema": {
            "properties": {
              "filedate": {
                "description": "Optional monthly snapshot (YYYY-MM-DD or YYYY-MM). Defaults to the latest loaded file.",
                "type": "string"
              },
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get nursing home details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:82479502315413439b4536a08f0dcf84295b10cf90bab16f8aa360823012d95e"
        },
        {
          "name": "get_facility_changes",
          "title": "Show what changed",
          "description": "Monitor one skilled nursing facility across two CMS monthly files. Defaults to latest vs the prior snapshot. Returns field-level diffs for stars, nurse hours, turnover, inspection score, abuse icon, high-performing icon, fines, and occupancy. Care Compare shows this month only — rerun after the next file.",
          "inputSchema": {
            "properties": {
              "from": {
                "description": "Earlier filedate YYYY-MM-DD. Omit to use the snapshot before to.",
                "type": "string"
              },
              "id": {
                "description": "CMS CCN (provnum) or web slug",
                "type": "string"
              },
              "to": {
                "description": "Later filedate. Omit to use the latest CMS file.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Show what changed"
          },
