        {
          "name": "search_facilities",
          "title": "Search facilities",
          "description": "Find certified US skilled nursing facilities near an address or in a city. Filter by ownership type, star rating, abuse flag, high-performing icon, or Special Focus status. Returns ownership, ratings, nurse hours (HPRD), nurse/RN turnover, weighted inspection score, beds, fines, straight-line distance_miles, and map links. distance_miles is straight-line miles, not drive time. An address is geocoded on the server.",
          "inputSchema": {
            "properties": {
              "abuse_icon": {
                "description": "CMS abuse icon filter. Y/yes/true/1 keeps only flagged homes; other values keep homes without the flag.",
                "type": "string"
              },
              "address": {
                "description": "Street address with city and state, or a street and ZIP. Geocoded by the Census Bureau as the distance origin. A city, place name, or ZIP alone will not match.",
                "type": "string"
              },
              "city": {
                "type": "string"
              },
              "filedate": {
                "description": "Optional monthly snapshot (YYYY-MM-DD or YYYY-MM). Defaults to the latest loaded file.",
                "type": "string"
              },
              "icon_hi_perf": {
                "description": "CMS high-performing icon (Risk-Based Survey eligibility). Y/yes/true/1 keeps only homes with the icon; other values keep homes without it. Point-in-time, not a permanent award.",
                "type": "string"
              },
              "limit": {
                "type": "integer"
              },
              "max_overall_rating": {
                "description": "Maximum CMS overall star rating (1-5).",
                "type": "integer"
              },
              "min_overall_rating": {
                "description": "Minimum CMS overall star rating (1-5).",
                "type": "integer"
              },
              "offset": {
                "type": "integer"
              },
              "ownership": {
                "description": "Ownership type from ProviderInfo.ownership. Case-insensitive. Prefixes For profit, Non profit, and Government match that kind. Exact labels look like \"For profit - Limited Liability company\".",
                "type": "string"
              },
              "q": {
                "type": "string"
              },
              "radius_miles": {
                "type": "number"
              },
              "sffstatus": {
                "description": "When truthy, keep only Special Focus Facility or candidate homes (non-empty sffstatus).",
                "type": "string"
              },
              "sort": {
                "description": "Sort key: overall_rating (default, desc), survey_rating, quality_rating, staffing_rating, distance (asc, straight-line miles), tothrd or total_nurse_hours (desc), totalnursingstaffturnover or nurse_turnover (asc), weighted_all_cycles_score or survey_score (asc). Unknown values fall back to overall_rating.",
                "enum": ["overall_rating", "survey_rating", "quality_rating", "staffing_rating", "distance", "tothrd", "total_nurse_hours", "totalnursingstaffturnover", "nurse_turnover", "weighted_all_cycles_score", "survey_score"],
                "type": "string"
              },
              "state": {
                "type": "string"
              },
              "zip": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search facilities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2252d2871134a36e80a0aaa130fdd9a9934bccf7ae6697987b81356a788c86be"
        },
        {
          "name": "search_facilities_by_ownership",
          "title": "Search nursing homes by ownership type",
          "description": "Find certified US nursing homes by ownership type (ProviderInfo.ownership). The result rows match a facility search. Combine with state, city, ZIP, or address.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Street address with city and state, or a street and ZIP. Geocoded by the Census Bureau as the distance origin. A city, place name, or ZIP alone will not match.",
