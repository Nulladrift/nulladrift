      },
      "instructions": "Nursing Home Database covers every Medicare and Medicaid certified skilled nursing facility in the United States, with a stored monthly history. It answers who operates a home, what else that owner runs, what changed between months in ratings, staffing, turnover, inspections, and fines, and how homes within a straight-line radius compare. A facility is identified by its CMS certification number or the site slug. Results default to the latest monthly file. Earlier months are separate snapshots. An address used for a radius search is geocoded on the server. Figures are informational and are not medical, legal, or placement advice.",
      "tools": [
        {
          "name": "compare_facilities",
          "title": "Compare facilities",
          "description": "Compare up to 25 certified skilled nursing facilities by CMS CCN or web slug. Returns ratings, nurse hours, turnover, inspection score, beds, fines, and map links in one table.",
          "inputSchema": {
            "properties": {
              "filedate": {
                "description": "Optional monthly snapshot (YYYY-MM-DD or YYYY-MM). Defaults to the latest loaded file.",
                "type": "string"
              },
              "ids": {
                "description": "CMS CCNs (provnum) or web slugs. Max 25.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare facilities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6971d509ed4d07f67e625200186b3664a8e5d6f59faa6e35c1560f6c3288114d"
        },
