        {
          "name": "list_distinct_values",
          "title": "List filter values",
          "description": "List distinct ProviderInfo values and counts for a field. Omit field to see the catalog. ownership returns the ownership labels. city requires state.",
          "inputSchema": {
            "properties": {
              "field": {
                "description": "ProviderInfo field. Omit to list allowed fields. ownership returns the ownership labels.",
                "enum": ["ownership", "state", "city", "sffstatus", "abuse_icon", "icon_hi_perf", "certification", "inhosp", "ccrc_facil", "overall_rating", "survey_rating", "quality_rating", "staffing_rating", "oldsurvey", "chow_last_12mos", "chainname", "chain_name", "chainid", "chain_id"],
                "type": "string"
              },
              "filedate": {
                "description": "Optional monthly snapshot (YYYY-MM-DD or YYYY-MM). Defaults to the latest loaded file.",
                "type": "string"
              },
              "state": {
                "description": "Optional two-letter state. Required when field=city.",
                "type": "string"
              }
            },
            "type": "object"
          },
