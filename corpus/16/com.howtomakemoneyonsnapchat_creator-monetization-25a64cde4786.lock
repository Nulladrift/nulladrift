      "instructions": "Independent; not affiliated with, endorsed by, or sponsored by Snap Inc. Canonical host: https://howtomakemoneyonsnapchat.com. The calculation and rule tools are read-only. watch_save_checkin writes: it saves numbers to the key's Eligibility Watch. watch_get_status only reads. Anonymous access works with no API key. A free key from POST /v1/keys raises the rate limit and collects no email; send it as Authorization: Bearer or X-API-Key. Caller supplies every metric. Results are sourced facts or deterministic calculations, never an official Snap decision.",
      "tools": [
        {
          "name": "calculate_gap",
          "description": "CALCULATION. Use this when you need the exact numeric shortfall, percent complete, and binding constraint for a creator's caller-supplied metrics. Do not use it for the pace to close that gap (calculate_growth_pace) or for a per-requirement pass/fail list (check_eligibility).",
          "inputSchema": {
            "$id": "https://howtomakemoneyonsnapchat.com/schemas/v1/calculate_gap.input.schema.json",
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "description": "CALCULATION tool. Exact shortfall for each numeric entry requirement of the Monetization Program: absolute amount and percent complete, and which gap is the binding constraint. Ongoing requirements for enrolled creators are reported separately only when already_enrolled=true. Caller metrics are checked for plausibility. spotlight_view_time_hours_28d above view_time_hours_28d returns VALUE_INCONSISTENT. view_time_hours_28d above 28 days × 24 hours × followers × 0.5 is a warning that the figure is unusually high for your follower count, please check for a typo. The warning also says view time can come from non-followers. followers of 0 with hours above 0 is the same kind of warning, never an error.",
            "properties": {
              "already_enrolled": {
                "default": false,
                "description": "Set true only if the creator is already enrolled in the Monetization Program. Default false: only entry (invitation) requirements are evaluated. When true, ongoing requirements for enrolled creators are reported in a separate section.",
                "type": "boolean"
              },
              "include_recommendations": {
                "default": true,
                "type": "boolean"
              },
              "metrics": {
                "additionalProperties": false,
                "description": "Metrics supplied by the caller (the creator or their agent). We never look metrics up ourselves; Snap offers no public analytics for arbitrary usernames. All fields optional; missing fields produce `unknowns`, never guesses. Data minimization: no age, birthdate, name, or username is accepted; creator age is never stored. Caller metrics are checked for plausibility. spotlight_view_time_hours_28d above view_time_hours_28d returns VALUE_INCONSISTENT. view_time_hours_28d above 28 days × 24 hours × followers × 0.5 is a warning that the figure is unusually high for your follower count, please check for a typo. The warning also says view time can come from non-followers. followers of 0 with hours above 0 is the same kind of warning, never an error.",
                "minProperties": 1,
                "properties": {
                  "active_posting_days_28d": {
                    "maximum": 28,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "country": {
                    "description": "Country of residence. ISO 3166-1 alpha-2 (US), alpha-3 (USA), or the English name on the reviewed country map (United States). Unlisted territories stay unknown.",
                    "maxLength": 80,
                    "minLength": 2,
                    "type": "string"
                  },
                  "followers": {
                    "maximum": 10000000000,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "is_snap_star": {
                    "description": "Self-reported Snap Star status. Cannot be verified by us; treated as a user confirmation.",
                    "type": "boolean"
                  },
                  "meets_age_requirement": {
                    "description": "Whether the creator meets the age requirement (18 or the local age of majority). true/false as stated by the caller; null = unknown and returns requires_user_confirmation. Data minimization: we never ask for or store a creator's age or birthdate.",
                    "type": ["boolean", "null"]
                  },
                  "posts_per_month": {
                    "maximum": 100000,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "spotlight_view_time_hours_28d": {
                    "description": "Spotlight view time in hours over the last 28 days.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "view_time_hours_28d": {
                    "description": "Total view time in hours over the last 28 days, as shown in Snapchat Insights.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "program": {
                "default": "unified_monetization_program",
                "description": "Programs the calculation tools evaluate in v1. Other in-scope programs (payouts, tax, snap_star, creator_monetization_policy, recommendation_eligibility, brand_partnerships) are served as FACTs by get_monetization_requirements; Snap Star status is evaluated as a prerequisite inside unified_monetization_program.",
                "enum": ["unified_monetization_program"],
                "type": "string"
              }
            },
            "required": ["metrics"],
            "title": "calculate_gap input",
            "type": "object"
