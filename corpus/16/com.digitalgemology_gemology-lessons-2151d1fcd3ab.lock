      "instructions": "Digital Gemology's free gemology lessons: the four Cs, the anatomy of a diamond, reading a grading report, diamond versus moissanite, the bow-tie effect and more, written from the site's own measurements. Use search_lessons to find lessons, get_lesson to read one in full as Markdown, explain_term to quote what the lessons say about a term, and list_courses for the courses and their lessons. Quote briefly, credit Digital Gemology and link the lesson page; each lesson links a free quiz and the tools it uses.",
      "tools": [
        {
          "name": "explain_term",
          "title": "Explain a term",
          "description": "What the lessons say about one gemology term (for example 'table', 'crown angle', 'fluorescence', 'girdle'): the passages that use it, each with the lesson it comes from.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "term": {
                "description": "The term, one or a few words.",
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain a term"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8150a6da6b7dca710897bc269730c97c206e538776e1c925b4ad1bf2ba3476d5"
        },
        {
          "name": "get_lesson",
          "title": "Read a lesson",
          "description": "One lesson in full, as Markdown, with its page, course, quiz and the tools and cuts it uses. Give the lesson's page path or its title.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lesson": {
                "description": "The lesson's page path (for example '/learn/four-cs/the-four-cs-explained') or its title.",
