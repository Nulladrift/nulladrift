        {
          "name": "setup",
          "description": "Set verifAIed up for a repository. **Free.** Call this first after\nthe verifAIed MCP is connected, and again after each step.\n\nPass the repository as ``owner/repo`` from the git remote (a repo UUID\nalso works) and the current git branch; the default branch is used\nwhen ``branch`` is omitted.\n\nReturns an ordered checklist. Each step has a ``status``:\n\n  - ``done``: the server saw the result (a committed file, an\n    analysis for the branch). No action.\n  - ``todo``: required and not done. ``commands`` and ``files`` say\n    exactly what to run and write.\n  - ``check_locally``: required, but only your machine can tell (the\n    CLI on PATH, the CLI's login). Run ``verify``; carry the step out\n    if it fails.\n  - ``recommended``: not required; verifAIed asks you to offer it to\n    the user rather than skip it.\n  - ``optional``: not required; mention it once.\n\n``next_step`` names the step to do now and ``complete`` is true when\nno required step is left. A step with ``needs_user`` true needs a\nperson — for ``cli_token``, to approve the ``verifaied login`` you run\nin the browser. This tool never mints or returns a token.\n\nThis tool reads the repository through the GitHub App and never\nchanges it. You write the files; the user commits them. ``facts``\nsays what was read, and ``facts.github_reachable`` is false when the\ntree could not be read, in which case every step the tree would have\nsettled is ``check_locally``.",
          "inputSchema": {
            "properties": {
              "branch": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Branch"
              },
              "repository": {
                "title": "Repository",
                "type": "string"
              }
            },
            "required": ["repository"],
            "title": "setupArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:75ffcdaa4b4fd6e2544ab03eaa1824e6d4c125fc70cddb69d2e84428d29cab7c"
        },
        {
          "name": "upload_local_coverage",
          "description": "Upload local coverage + current source and get back what's still\nuntested — the core self-correction loop for writing tests without\nwaiting on CI. Works for Python (pytest-cov) and TypeScript/JavaScript\n(vitest + Istanbul).\n\n``coverage_kind`` selects the dimension: ``\"unit\"`` (default) is the\ntest-suite coverage flow described here; ``\"browser\"`` records an\nindependent per-function *browser-session* dimension from a real browser\nrun — any coverage format (Istanbul for a frontend harvest, pytest-cov\nfor a coverage-instrumented backend serving the browser's requests), no\njunit. A branch's browser coverage is the **union** of what each\nproducer last reached — its wrapped suite, and each recorded test's\nlatest replay — and this upload replaces only the contribution of the\nproducer it belongs to, per language (a TS-only browser upload never\nzeroes the Python dimension, and vice versa). It surfaces as\n``browser_state``\n(``exercised``/``partial``/``unexercised``) + ``browser_line_coverage_pct``\non each function and as the ``unexercised_browser`` gap in\n``check_done``, and never changes unit state.\n\nBrowser and manual uploads are also recorded in the branch's session\nledger, so the Tests page can say what produced them. Pass\n``session_id`` if you opened one; otherwise this upload becomes its own\nsession, attributed to ``agent`` — you.\n\nRun your tests with coverage locally first:\n  - Python:  ``pytest --cov --cov-branch --cov-context=test`` then\n    ``coverage json --show-contexts -o coverage.json`` (pytest-cov's\n    own ``--cov-report=json`` drops the per-test contexts)\n  - TS/JS:   ``vitest run --coverage --coverage.provider=istanbul\n    --coverage.reporter=json`` → ``coverage/coverage-final.json``\n\nPass a ``files`` map of {source_path: contents} for the files under\ntest, plus **exactly one** of:\n  - ``coverage_json`` — a single parsed report (pytest-cov or Istanbul).\n  - ``coverage_reports`` — a list of parsed reports, merged with\n    same-file-later-wins; use this to send both a pytest-cov and a\n    vitest report in one upload for a mixed-language repo.\n\nIMPORTANT: the keys of ``files`` must exactly match the file paths the\ncoverage report records (relative to the directory the tests ran from).\nIf they don't, nothing matches and ``functions_matched`` comes back 0.\n\nStored and returned paths are always repo-rooted. If your tests ran\nfrom a subdirectory of the repo (a monorepo package), pass\n``path_prefix`` — the repo-root-relative directory the tests ran from\n(e.g. ``\"backend\"``; ``\"\"`` if they ran at the repo root). Omit it and\nthe server resolves the prefix against the repo tree best-effort, else\nstores paths as sent. All reports in one call share one root — split a\nmulti-root upload into one call per root.\n\n``functions_matched`` and the untested/partial lists count whole\nfunctions only; React sub-units matched by the same upload are reported\nseparately as ``units_matched``, so those numbers stay comparable\nacross uploads and against a repo's own sense of its size.\n\nUploads are merged per language, so a TS upload never wipes a branch's\nPython coverage (``functions_preserved`` reports how many rows were\nkept). Upserts a single local analysis per branch, kept separate from\nany CI run. Returns the coverage summary plus the untested/partial\nfunctions and failing tests so you can fix them directly; the function\n``id``s work with ``get_function_detail`` and ``get_generated_prompt``.\n\n``repository_id`` is the GitHub ``owner/repo`` (a repo UUID also\nworks) — the same reference every other tool here takes.",
