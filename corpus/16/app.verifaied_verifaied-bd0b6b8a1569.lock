      "instructions": "verifAIed checks the work a coding agent says it finished: that the code it changed is tested, and that the feature works in a real browser. Call `setup` first for a repository that is new to verifAIed. After changing code, upload coverage and call `check_done`; close the gaps it lists and call it again, and stop only when it answers done. For any question about how verifAIed works or how to use a feature — from the user or your own — call `docs` and answer from what it returns.",
      "tools": [
        {
          "name": "check_done",
          "description": "Am I done? The stop condition for a coding loop. **Free — no\nsubscription, no token budget, no rate limit.**\n\nComposes what verifAIed already knows about a branch — failing tests\nplus the coverage of the functions you changed — into a single verdict\nyou can gate on:\n\n  - ``done`` (bool): ``true`` only when there are no gaps at all. This\n    is the strict signal to stop.\n  - ``status``: ``\"done\"`` | ``\"done-with-warnings\"`` | ``\"not-done\"``.\n    ``done-with-warnings`` means the only remaining gaps are ones the\n    repo owner marked non-blocking — read this yourself if you want to\n    stop early.\n  - ``scope``: ``\"changed-functions\"`` when a default-branch base\n    exists (only added/modified functions are judged), else\n    ``\"all-functions\"``.\n  - ``gaps``: each remaining problem with a ``ref``, the id to act on\n    (``function_id``/``test_id``), and a ``next_action`` pointing at\n    ``get_baseline_prompt`` (free) or ``fix_branch`` (paid). Gap kinds:\n\n      - ``failing_test`` — a test that failed or errored.\n      - ``untested_function`` / ``partial_function`` — a changed\n        function with no coverage, or only some.\n      - ``unexercised_browser`` — a changed function that no browser\n        reached, in either the browser-coverage or the manual\n        dimension. Only judged once one of them exists.\n      - ``visually_unreviewed`` — a changed component nobody has\n        looked at. ``intent_mismatch`` — somebody looked and it\n        didn't do what the change claimed. Both only judged once the\n        branch has at least one ``verify_ui`` verdict.\n      - ``unverified_recorded_test`` — a recorded test this branch\n        has never run, or whose last run failed. Re-run it with\n        ``verifaied test run \"<feature path>/<name>\"`` — the feature\n        path is optional and may nest. Branch-wide, not\n        diff-scoped. Absent entirely for a repo with no recorded\n        tests.\n      - ``visual_defect`` — something ``verifaied audit`` measured in\n        the rendered page (overflow, contrast, a broken image, a\n        console error), from the most recent audit of the branch.\n        **The one kind that is a warning by default**, so it routes to\n        ``done-with-warnings`` rather than blocking unless the repo\n        owner turned it on. Only judged once the branch has been\n        audited at least once.\n\n    Gaps are ordered so a component's own\n    gaps are immediately followed by its handlers' and render\n    branches'; a sub-unit gap carries ``parent_ref`` (the parent's\n    ``file::Name``) so you can group or indent them without parsing\n    refs. The clustering is presentation only — every gap is still\n    individually actionable by its own ``ref`` / ``function_id``.\n  - ``not_checked``: signals that couldn't be evaluated (e.g. failing\n    tests when no junit.xml was uploaded, or ``unexercised_browser``\n    when functions exist but no browser coverage was uploaded) —\n    surfaced so a green verdict is never silently green.\n\nPagination: ``gaps`` is capped at ``max_gaps`` per call (default 50) to\nstay within tool-result limits — a low-coverage branch can have hundreds.\n``done``, ``status``, ``scope`` and ``gaps_total`` ALWAYS reflect the full\ngap set, never just the returned page, so a truncated page is never\nmistaken for a clean branch. When more gaps remain, ``has_more`` is\n``true``, ``next_offset`` is the offset to pass next, and ``note`` spells\nout how to fetch the rest — call again with that ``offset`` until\n``has_more`` is ``false``.\n\nThe intended loop: run your tests with coverage (pytest → coverage.json,\nor ``vitest run --coverage --coverage.provider=istanbul`` →\ncoverage/coverage-final.json) → ``upload_local_coverage`` →\n``check_done`` → fix each gap (``get_baseline_prompt`` / ``fix_branch``)\n→ re-upload → repeat until ``done`` is ``true``.\n\n``repository`` is the GitHub 'owner/repo' (a repo UUID also works);\n``branch`` defaults to the repository's default branch. Errors with an\nactionable message when no analysis exists for the branch yet — upload\ncoverage first.",
          "inputSchema": {
            "properties": {
              "branch": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Branch"
              },
              "max_gaps": {
                "default": 50,
                "title": "Max Gaps",
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "title": "Offset",
                "type": "integer"
              },
              "repository": {
                "title": "Repository",
                "type": "string"
              }
            },
            "required": ["repository"],
            "title": "check_doneArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:175637f10e6eed1a45553d6e133ca36a994e4f0daddd8f5e14113deb406c4d9a"
        },
        {
          "name": "clear_manual_coverage",
          "description": "Reset the accumulated **manual-recording** dimension for a branch.\n\nManual uploads are **additive**: each ``upload_local_coverage`` with\n``coverage_kind=\"manual\"`` unions that hand-driven session into the\nbranch's manual dimension, so you can build a pass up one flow at a\ntime. Call this to wipe that accumulation and start over — every\nfunction goes back to Unexercised. The branch's ``manual_languages`` are\nkept, so the Manual Recording view stays visible; only the per-function\ncoverage is cleared.\n\nThis does **not** touch browser coverage (``coverage_kind=\"browser\"``),\nwhich has no clear at all: every producer there replaces its own\ncontribution on its next run, so nothing accumulates to be reset.\n\n``repository`` is the GitHub 'owner/repo' (a repo UUID also works);\n``branch`` defaults to the repository's default branch. Errors when the\nbranch has no local analysis to clear. Returns ``cleared_functions`` —\nthe number of function rows reset.",
          "inputSchema": {
            "properties": {
              "branch": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Branch"
              },
              "repository": {
                "title": "Repository",
                "type": "string"
              }
            },
            "required": ["repository"],
            "title": "clear_manual_coverageArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:90cdae0188b6fe70eba164c5ce6c811cb38df52661e1c21a3f438acaa7a78d4c"
        },
        {
          "name": "docs",
          "description": "The verifAIed documentation, for you and for the user's questions.\n**Free.** Call this whenever the user asks how something in verifAIed\nworks or how to do something with it, and whenever you are unsure what\na tool, a command, a gap or an error means.\n\nThree ways to call it:\n\n  - no arguments: the table of contents — every page with a one-line\n    summary — and how to use the rest.\n  - ``query``: the question, or a few words of it. Returns the\n    sections that match best, each with its own text, so one call is\n    usually enough to answer from. A hit marked ``truncated`` was cut\n    short: read its page for the rest. Start here when you do not\n    know which page holds the answer.\n  - ``page``: one whole page as Markdown. Pass a name from the contents\n    (the first page is ``overview``); a title or a documentation URL\n    also works.\n\nPass ``page`` or ``query``, not both.\n\nAnswer from the returned text rather than from memory, and give the\nuser the page's ``url`` so they can read it themselves. A page with no\n``url`` is one of the notes for agents: tell the user what it says,\nthere is no link to give. When nothing\nmatches, the documentation does not cover it: tell the user that, and\ndo not infer an answer from what is missing. Pages in the\ngroup \"For agents\" are reference written for you and are not on the\nwebsite: ``agents/gaps`` (what every check_done gap means and what\ncloses it), ``agents/errors`` (what an error or refusal means and the\nfix) and ``agents/formats`` (exact file and JSON formats, exit codes).\n\nEvery answer carries ``account``: the user's plan, and on the free\nplan a note on what is refused, so you do not suggest a feature this\naccount cannot use. The table of contents has the full list of paid\ntools.\n\nThis is the one tool that works with no account: a connection without\ncredentials can read the documentation, and its ``account`` is null.\nEvery other tool needs the user to sign in first.",
          "inputSchema": {
            "properties": {
              "page": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Page"
              },
              "query": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Query"
              }
            },
            "title": "docsArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0f87d846765d079957d01048272c06d674d8a5ef95afd3af5d0f528349552fc1"
        },
        {
          "name": "fix_branch",
          "description": "Return the fix-it prompt the web UI's 'Generate prompt for\neverything wrong' button produces for a branch — the common-case\none-shot for \"fix everything broken here\". Resolves the repo +\nbranch, finds the latest analysis, generates (or fetches a cached)\nbulk prompt, and waits up to ``wait_seconds`` for completion.\n\n``repository`` is required — pass the GitHub 'owner/repo' for the\nproject the user is working in. You (the MCP client) almost always\nknow this from the working directory's git remote, the open\nworkspace, or the conversation; pass it explicitly rather than\ncalling ``list_repositories`` first. A repo UUID is also accepted\nfor callers that already have one.\n\n``branch`` defaults to the repository's default branch.\n\n``scope`` selects what to aggregate (default ``\"everything\"``):\n  - ``untested`` — all functions with no tests yet\n  - ``partial`` — all functions only partially covered\n  - ``failing`` — all failing tests\n  - ``everything`` — failing tests + all untested + partial functions\n  - ``frontend`` — TypeScript components grouped with the handlers and\n    render branches inside them that nothing exercises yet;\n    Playwright/React-Testing-Library oriented rather than a flat\n    function list\n\nReturns the same shape as ``get_bulk_prompt`` — on cache hit /\ncompleted generation, ``{status: \"completed\", prompt_text, ...}``;\non timeout, ``{status: \"pending\", generation_id}`` so you can\nresume via ``wait_for_prompt``.",
          "inputSchema": {
            "properties": {
              "branch": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Branch"
              },
              "force": {
                "default": false,
                "title": "Force",
                "type": "boolean"
              },
              "repository": {
                "title": "Repository",
                "type": "string"
              },
              "scope": {
                "default": "everything",
                "title": "Scope",
                "type": "string"
              },
              "wait_seconds": {
                "default": 120,
                "title": "Wait Seconds",
                "type": "integer"
              }
            },
            "required": ["repository"],
            "title": "fix_branchArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ca29ed69ee1966d3902ad7bc8e6717b51abf80203676054bb5f62ee75bf146e8"
        },
        {
          "name": "get_baseline_prompt",
          "description": "Get a ready-to-use test prompt for one function. **Free — no\nsubscription, no token budget, no rate limit.**\n\nRendered deterministically from the function's AST plus its coverage\nrows: the signature, what to call, which exact lines never execute,\nwhich branches only go one way, what it raises, and which tests\nalready touch it. Use this as the default way to turn \"this function\nis untested\" into \"here is what to write\".\n\n``get_generated_prompt`` is the paid, LLM-polished counterpart — it\nadds repo conventions and richer context, but this one is free and\nalways available, and for most functions it is enough to write the\ntest from.\n\nAlso accepts a React sub-unit id. The prompt then matches what the\nunit is: fire this handler on this element and assert the effect, or\nrender the component in the state that takes this branch. ``kind``\nand ``display_label`` come back alongside the prompt.\n\nErrors if the function is already fully covered — there is nothing to\nprompt for. The exception is a covered function that no browser test and\nno recorded manual session has reached: that still has a real ask (drive\nit in a browser), so it returns a prompt saying exactly that.",
          "inputSchema": {
            "properties": {
              "function_id": {
                "title": "Function Id",
                "type": "string"
              }
            },
            "required": ["function_id"],
            "title": "get_baseline_promptArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6d1688b6083c5068a301b7213ced56363230add3a5017a03735fee6f13827f80"
        },
        {
          "name": "get_bulk_prompt",
          "description": "Return a single meta-prompt covering many items in an analysis.\n\n``scope`` selects which slice to aggregate:\n  - ``untested`` — all functions with no tests yet\n  - ``partial`` — all functions only partially covered\n  - ``failing`` — all failing tests\n  - ``everything`` — failing tests plus all untested + partial functions\n  - ``frontend`` — TypeScript components grouped with the handlers and\n    render branches inside them that nothing exercises yet;\n    Playwright/React-Testing-Library oriented rather than a flat\n    function list\n\nCache hits return immediately; cache misses enqueue a fresh\ngeneration and poll for up to ``wait_seconds``. On timeout the\ncaller gets the ``generation_id`` and can call ``wait_for_prompt``\nto keep waiting.\n\nFor the common 'fix everything wrong on a branch' workflow, prefer\n``fix_branch`` — it takes 'owner/repo' directly and saves the\nlist_repositories → list_analyses chain.",
          "inputSchema": {
            "properties": {
              "analysis_id": {
                "title": "Analysis Id",
                "type": "string"
              },
              "force": {
                "default": false,
                "title": "Force",
                "type": "boolean"
              },
              "scope": {
                "title": "Scope",
                "type": "string"
              },
              "wait_seconds": {
                "default": 30,
                "title": "Wait Seconds",
                "type": "integer"
              }
            },
            "required": ["analysis_id", "scope"],
            "title": "get_bulk_promptArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b35efa966205a3b76cab296029a6b0bcf16e0d3d0e8f8fba5057e69bc6fca965"
        },
