        {
          "name": "list_analyses",
          "description": "List analyses for the given repository, newest first.\n\n``repository_id`` is the GitHub ``owner/repo`` (a repo UUID also\nworks). Mirrors the BranchView's per-branch state. ``commit_sha`` is\nthe commit the analysis was refreshed against.\n\nFor the common 'fix everything wrong on a branch' workflow, prefer\n``fix_branch`` — it resolves the latest analysis for you.",
