        {
          "name": "verify_ui",
          "description": "Judge a screenshot of the running UI. **Paid.**\n\nYou drive the browser; verifAIed judges what you got. Take a\nscreenshot of the change you just made, say what it was supposed to\ndo, and this returns a verdict — plus records it, so ``check_done``\ncan hold the branch to it.\n\nTwo modes:\n\n- With ``intent`` (recommended): checks one claim. \"The error state now\n  shows a Retry button\" → ``pass`` / ``fail`` / ``unclear``, with a\n  confidence and the reasoning. ``unclear`` is a real answer, used when\n  the screenshot doesn't show the region the claim is about — treat it\n  as \"screenshot the right thing and ask again\", not as a pass.\n- Without ``intent``: a rubric review (layout, hierarchy, legibility,\n  consistency, obvious broken state) returning ``clean`` or ``issues``\n  with a defect list.\n\n``target`` attaches the verdict to one component as\n``path/to/File.tsx::ComponentName``, which is what clears that\ncomponent's ``visually_unreviewed`` gap. A target that doesn't resolve\nis not an error: the verdict is still recorded against the branch and\nthe response carries a ``warning`` saying so.\n\n``screenshot_base64`` is the raw image bytes, base64-encoded (a\n``data:`` URL prefix is fine). PNG, JPEG, GIF or WebP; a viewport-sized\ncapture is plenty and anything over ~1.5MB of base64 is rejected with a\nresize hint. Pass ``console_errors`` when you have them — a visual\ndefect and a console error are very often the same bug.\n\nThe screenshot **is stored** as session evidence: each call opens a\none-moment session in the branch's ledger and attaches the image to it,\nso the Tests page can show the frame the verdict was about. The\nreasoning text is still the record — the picture is the receipt.\n\nFailing an intent check creates an ``intent_mismatch`` gap; a changed\ncomponent with no verdict creates ``visually_unreviewed``. Both\nactivate only once this branch has at least one verdict, so a repo that\ndoesn't use this tool never sees them.",
