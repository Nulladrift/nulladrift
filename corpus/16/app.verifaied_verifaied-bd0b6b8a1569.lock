        {
          "name": "list_untested_functions",
          "description": "List functions in an analysis, filtered by coverage state.\n\n``state_filter`` is a comma-separated subset of\n``untested,partial,covered``. Default skips fully-covered functions\n— those are typically what an agent looking for \"tests to write\"\ncares about.\n\nRows include React sub-units — an inline JSX handler\n(``Component.<onSubmit>``, ``kind=\"handler\"``) or a conditional render\nbranch (``Component.<branch#1>``, ``kind=\"render_branch\"``) — because\n\"this component's error state never rendered\" is usually the actionable\ngap, not \"this component is 80% covered\". Filter on ``kind`` in\n``(\"function\", \"component\")`` when you want whole functions only.",
