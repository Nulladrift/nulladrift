      "tools": [
        {
          "name": "get_category_series",
          "description": "Get all FRED series within a specific category.\n\n    FRED organizes data into a hierarchy of categories. Use this to browse\n    available series within a topic area. Common category IDs:\n    - 32991: Money, Banking, & Finance\n    - 10: Population, Employment, & Labor Markets\n    - 32992: National Accounts (GDP)\n    - 1: Production & Business Activity\n    - 32455: Prices (CPI, PPI)\n    - 97: Housing\n\n    Args:\n        category_id: FRED category identifier (integer).\n    ",
          "inputSchema": {
            "properties": {
              "category_id": {
                "title": "Category Id",
                "type": "integer"
              }
            },
            "required": ["category_id"],
            "title": "get_category_seriesArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_category_seriesOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:915750c988d5cd59e13b840b7ef06057a4292944ae518165f72014dbf80a8fb2"
        },
        {
          "name": "get_release_dates",
          "description": "Get release dates for a specific FRED data release.\n\n    Returns the dates when a particular data release was published. Useful\n    for tracking when economic indicators are updated. Common release IDs:\n    - 10: Consumer Price Index\n    - 46: Producer Price Index\n    - 50: Employment Situation (jobs report)\n    - 53: Gross Domestic Product\n    - 17: Federal Reserve H.15 (interest rates)\n    - 21: Federal Reserve H.6 (money stock)\n\n    Args:\n        release_id: FRED release identifier (integer).\n    ",
          "inputSchema": {
            "properties": {
              "release_id": {
                "title": "Release Id",
                "type": "integer"
              }
            },
            "required": ["release_id"],
            "title": "get_release_datesArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_release_datesOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a968b49e4325f6cafd9d91aa66696bef9716c21428230e37d9b888571e3a7f5c"
        },
        {
          "name": "get_series_info",
          "description": "Get metadata and details for a specific FRED series.\n\n    Returns comprehensive information about a series including its title,\n    frequency, units, seasonal adjustment, source, and date range. Use this\n    to understand what a series measures before pulling observations.\n\n    Args:\n        series_id: FRED series identifier (e.g. 'UNRATE', 'GDP', 'CPIAUCSL').\n    ",
          "inputSchema": {
            "properties": {
              "series_id": {
                "title": "Series Id",
                "type": "string"
              }
            },
            "required": ["series_id"],
            "title": "get_series_infoArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_series_infoOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6c59b9016046df246c3d6d6d3f1d0b0d93526709e704fd35b75d5530c5393e15"
        },
        {
          "name": "get_series_observations",
          "description": "Get time series observations (data points) for a FRED series.\n\n    Returns the actual data values for an economic indicator over time.\n    Use search_series first to find the series_id, or use well-known IDs\n    like UNRATE, GDP, CPIAUCSL, FEDFUNDS, MORTGAGE30US.\n\n    For state unemployment, use state abbreviation + 'UR' (e.g. WAUR for\n    Washington, CAUR for California).\n\n    Results are sorted most-recent-first. For long series (e.g. daily data\n    since 1954), use start_date/end_date to narrow the window or increase\n    the limit up to 10000.\n\n    Args:\n        series_id: FRED series identifier (e.g. 'UNRATE', 'GDP', 'CPIAUCSL').\n        start_date: Optional start date in YYYY-MM-DD format (e.g. '2020-01-01').\n        end_date: Optional end date in YYYY-MM-DD format (e.g. '2024-12-31').\n        limit: Maximum observations to return (default 1000, max 10000).\n    ",
          "inputSchema": {
            "properties": {
              "end_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "End Date"
              },
              "limit": {
                "default": 1000,
                "title": "Limit",
                "type": "integer"
              },
              "series_id": {
                "title": "Series Id",
                "type": "string"
              },
              "start_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Start Date"
              }
            },
            "required": ["series_id"],
            "title": "get_series_observationsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_series_observationsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a5b21d6c8ab5a1f0c640b03ec669d05a8dc9e365e6136e1b03de4bc9bf94c487"
        },
        {
          "name": "search_series",
          "description": "Search for FRED economic data series by keyword.\n\n    Use this to find series IDs for economic indicators. For example,\n    search 'unemployment rate' to find UNRATE, or 'gross domestic product'\n    to find GDP. Returns series metadata including ID, title, frequency,\n    units, and date range.\n\n    Common series: UNRATE (unemployment), GDP (gross domestic product),\n    CPIAUCSL (consumer price index), FEDFUNDS (federal funds rate),\n    MORTGAGE30US (30-year mortgage rate), MEHOINUSA672N (median household income).\n\n    Args:\n        search_text: Keywords to search for (e.g. 'unemployment rate', 'GDP', 'inflation').\n        limit: Maximum number of results to return (default 10, max 1000).\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "search_text": {
                "title": "Search Text",
                "type": "string"
              }
            },
            "required": ["search_text"],
            "title": "search_seriesArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "search_seriesOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:de3803204cb33ad6e2d6f33ce1ae52033931a132bc55238f4fde1e6312a7afe3"
        }
      ],
      "digest": "sha256:89ca455950353a0a0880d54f99009d62ca790839efb4374a70e3ba085afffa5e"
    }
  }
