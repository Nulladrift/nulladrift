        "name": "app.provanza/public-delivery-evidence",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use this server for public carrier evidence guidance or a fictional proof-of-delivery demo. Do not send real shipments, postal codes, credentials, or customer data.",
      "tools": [
        {
          "name": "lookup_carrier_evidence",
          "description": "Look up a documented carrier, market, and service example. Returns the issuer, evidence provenance, input requirements, availability guidance, and sources. The directory does not determine whether a particular shipment has proof.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "carrier": {
                "enum": ["dhl", "fedex", "ups", "gls", "dpd", "seur", "chronopost", "brt", "speedy", "jadlog", "delivered-evidence"],
                "type": "string"
              },
              "locale": {
                "enum": ["en", "es", "de", "fr"],
                "type": "string"
              }
            },
            "required": ["carrier"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:48f16277154090b49ab00fba382c33e62b69e520cb0deab9e358671e5e74382d"
        },
        {
          "name": "run_fictional_pod_demo",
          "description": "Replay a fixed fictional batch and return the three outcomes, the public fixture URL, and the marked sample PDF URL. Creates no shipment requests or charges.",
