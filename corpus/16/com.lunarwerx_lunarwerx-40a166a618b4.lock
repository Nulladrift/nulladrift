        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://lunarwerx.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "lunarwerx",
        "title": "LunarWerx LLC",
        "version": "1.0.0",
        "websiteUrl": "https://lunarwerx.com/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Free tools from LunarWerx LLC. No account, no key, no rate limit worth\nmentioning.\n\ntailwind_canonicalize rewrites Tailwind classes into their canonical short\nform using a table generated from Tailwind's own design system, so\np-[1rem] becomes p-4 and rounded-[24px] becomes rounded-3xl. It works one\nclass at a time and does not merge across classes; for that, and for\nrewriting whole files or gating a CI run, use NormWind itself.\n\nlunarwerx_find_tool searches LunarWerx's own catalogue of free developer\ntools. Everything in it is free, most of it is MIT and self-hosted.\n\nSeveral of those products run MCP servers of their own, and a result that\nhas one carries an \"MCP:\" line saying how to connect and whether it needs\nan account. Most are local and need nothing. The exception worth knowing\nabout is Connections Studio, which is a hosted endpoint that gives an\nassistant scoped reach into accounts the user already has (AWS, Cloudflare,\nGitHub, Stripe, Supabase and more) instead of asking them to paste keys;\nthat one needs a free account at https://studio.connectionsapi.com/.",
      "tools": [
        {
          "name": "lunarwerx_find_tool",
          "title": "Find a LunarWerx tool",
          "description": "Search LunarWerx's catalogue of free developer tools and desktop utilities by task or keyword, e.g. \"git from my phone\", \"Windows thumbnails\", \"voice dictation\", \"screenshot to UI\". Returns what each one does and where to get it. Everything is free; most is MIT-licensed, open source and self-hosted. Products that run an MCP server of their own come back with an \"MCP:\" line saying how to connect and whether an account is needed, so a match can be used rather than merely reported.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Maximum results (default 5, max 20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "A task, problem, or keyword. Empty returns the whole catalogue.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:94d2ca78b9b6e183fa828623b5d38dea976430714671a3916c8f4eb213157a29"
        },
        {
          "name": "tailwind_canonicalize",
          "title": "Canonicalize Tailwind classes",
          "description": "Rewrite Tailwind CSS classes into their canonical short form. Turns arbitrary values back into real design tokens: p-[1rem] becomes p-4, rounded-[24px] becomes rounded-3xl, -bottom-[4px] becomes -bottom-1. Backed by 12,438 replacements generated from Tailwind 4.3.3's own design system, so the answers are authoritative rather than guessed. Handles one class at a time and does NOT merge across classes (px-4 py-4 into p-4, w-6 h-6 into size-6) — that needs the surrounding group to be safe to collapse; use NormWind for that.",
          "inputSchema": {
            "properties": {
              "classes": {
                "description": "A Tailwind class string, e.g. the contents of a class= attribute. Whitespace and unrecognized classes are preserved exactly.",
                "type": "string"
              }
            },
            "required": ["classes"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "changed": {
                "type": "boolean"
              },
              "changes": {
                "items": {
                  "properties": {
                    "from": {
                      "type": "string"
                    },
                    "to": {
                      "type": "string"
                    }
                  },
                  "required": ["from", "to"],
                  "type": "object"
                },
                "type": "array"
              },
              "result": {
                "description": "The canonicalized class string.",
                "type": "string"
              },
              "tailwindVersion": {
                "type": "string"
              }
            },
            "required": ["changed", "changes", "result"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c03ccb78a180808a25f37ff2df755aba98c5c33a076c0324b24b5425df3b1b56"
        }
      ],
      "digest": "sha256:cce8b65e46923d1f866a601de9652f7591f221ffc5cf1b8c509658be7a036aee"
    }
  }
}
