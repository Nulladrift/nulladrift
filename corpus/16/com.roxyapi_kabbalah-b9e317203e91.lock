        {
          "name": "post_kabbalah_compatibility",
          "title": "Compare two names - gematria name compatibility API with every component published",
          "description": "Score two names against each other in gematria and return both profiles, the ciphers they agree on, and a composite with every component and its maximum published beside it. Equal value under the standard reading is the one relation the classical method actually works with and it carries the largest weight; the rest of the composite is ours and the response says so, so a caller can recompute or ignore it. Built for name compatibility features, relationship content and any product that wants a number it can show the arithmetic for.",
          "inputSchema": {
            "examples": [
              {}
            ],
            "properties": {
              "compact": {
                "default": false,
                "description": "Set true for the same data in a compact shape: arrays of same-shaped objects arrive columnar as {\"__cols\":[names],\"__rows\":[[values]]}. Lossless, typically 40 to 52 percent fewer tokens.",
                "type": "boolean"
              },
              "firstName": {
                "description": "First name in Latin script. Send firstNameHebrew instead to control the spelling.",
                "example": "Sarah",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "firstNameHebrew": {
                "description": "First name already in Hebrew, which skips the transliteration step.",
                "example": "שרה",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.",
                "enum": ["en", "tr", "de", "es", "hi", "pt", "fr", "ru", "zh-Hans", "zh-Hant"],
                "example": "en",
                "type": "string"
              },
              "misparGadol": {
                "default": "finals-500-900",
                "description": "Which method the name mispar gadol means, because the sources use it for two. Use finals-500-900 to score the five word final letters as 500 to 900, or milui to score each letter as the value of its own spelled out name.",
                "enum": ["finals-500-900", "milui"],
                "example": "finals-500-900",
                "type": "string"
              },
              "secondName": {
                "description": "Second name in Latin script. Send secondNameHebrew instead to control the spelling.",
                "example": "David",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "secondNameHebrew": {
                "description": "Second name already in Hebrew, which skips the transliteration step.",
                "example": "דוד",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "transliteration": {
                "default": "letter-map-mathers",
                "description": "How a Latin name is written in Hebrew before it is scored. Two members. letter-map-mathers is the 1887 Hermetic letter map, with e read as its author practised it: a point inside a word and alef at the start of one. It writes no c, f, w or x, so a name carrying one of them outside a two letter group returns 400 naming the letter. letter-map-modern follows the modern Israeli transcription rules for the sound each Latin letter carries in English and French spelling, covers every Latin letter, drops the geresh and does not double vav or yod, so send textHebrew for the ktiv male form. Every form states the readings it used in rule. Phonetic Ashkenazi and Sephardi schemes are not offered because no two references agree on a rule for that direction.",
                "enum": ["letter-map-mathers", "letter-map-modern"],
                "example": "letter-map-mathers",
                "type": "string"
              }
