                "maximum": 72,
                "minimum": 1,
                "type": "integer"
              },
              "longitude": {
                "description": "Ecliptic longitude in degrees, 0 inclusive to 360 exclusive, measured from 0 Aries. Returns the single name governing that degree instead of the list. 360 is rejected because it is the same point as 0 and the arcs are half open at the top.",
