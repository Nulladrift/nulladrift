      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "SoChain gives live and historical data for Bitcoin (BTC), Litecoin (LTC), Dogecoin (DOGE), Zcash (ZEC) and their testnets (BTCTEST, LTCTEST, DOGETEST, ZECTEST; on Zcash, the transparent side: t-addresses, and shielded value only as it enters or leaves the shielded pools). Amounts are exact decimal strings in whole coins (8 decimals); times are unix seconds; prices are USD (testnet coins are worth $0). A transaction is usually treated as final after 6 confirmations on Bitcoin. Use search when you don't know whether a string is an address, a transaction ID or a block. For accounting questions, get_transactions takes date and direction filters and get_balance a past date (dates are UTC; a balance on a date is the one at its end); filtered results page by cursor, and a short page with a next_cursor isn't the end.",
      "tools": [
        {
          "name": "get_address_poisoning",
          "title": "Address Poisoning Check",
          "description": "Whether an address was targeted by address poisoning: look-alike addresses that sent it dust, imitating an address it really paid or was paid by, so a careless copy from its history pays the scammer. Each finding names the look-alike, whom it imitates and the real payment.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "An address on that network.",
                "type": "string"
              },
              "limit": {
                "description": "Findings, default 50, newest first.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "network": {
                "description": "Network: BTC, LTC, DOGE, ZEC, BTCTEST, LTCTEST, DOGETEST or ZECTEST.",
                "enum": ["BTC", "LTC", "DOGE", "ZEC", "BTCTEST", "LTCTEST", "DOGETEST", "ZECTEST"],
                "type": "string"
              }
            },
            "required": ["address", "network"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "address": {
                "type": "string"
              },
              "building": {
                "type": "boolean"
              },
              "findings": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["address", "building", "findings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Address Poisoning Check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:03f86a60f44984a72c188a64c32b569d37691f66fed90d1ec08adc2027559dc9"
        },
