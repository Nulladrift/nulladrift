        {
          "name": "get_chart",
          "title": "Chart Series",
          "description": "A chart series: tx_count, fees_total, fees_median, block_size, difficulty, hashrate, supply, price_usd, tx_per_min, block_interval, mempool_txs, mempool_bytes, pool_share, holder_share, new_addresses, active_addresses, transfers, lookalikes, on LTC and LTCTEST mweb_pool (coins in MWEB) and mweb_flows (peg-ins and peg-outs), and on ZEC and ZECTEST zcash_pools (the value in each Zcash pool). Intervals: block (last 1,000 blocks), hour (90 days), day (full history), minute (last hour; tx_per_min and mempool series only).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "Optional, price_usd only: the price in this currency instead of USD.",
                "enum": ["AUD", "BRL", "CAD", "CHF", "CNY", "CZK", "DKK", "EUR", "GBP", "HKD", "HUF", "IDR", "ILS", "INR", "ISK", "JPY", "KRW", "MXN", "MYR", "NOK", "NZD", "PHP", "PLN", "RON", "SEK", "SGD", "THB", "TRY", "USD", "ZAR"],
                "type": "string"
              },
              "from": {
                "description": "Optional start: block height for the block interval, else unix time.",
                "type": "integer"
              },
              "interval": {
                "description": "Each point's span: block (the last 1,000 blocks), minute (the last hour), hour (90 days) or day (the full history).",
                "enum": ["block", "minute", "hour", "day"],
                "type": "string"
              },
              "network": {
                "description": "Network: BTC, LTC, DOGE, ZEC, BTCTEST, LTCTEST, DOGETEST or ZECTEST.",
                "enum": ["BTC", "LTC", "DOGE", "ZEC", "BTCTEST", "LTCTEST", "DOGETEST", "ZECTEST"],
                "type": "string"
              },
              "series": {
                "description": "The series, as listed above: mweb_pool and mweb_flows on Litecoin only, zcash_pools on Zcash only.",
                "enum": ["tx_count", "fees_total", "fees_median", "block_size", "difficulty", "hashrate", "supply", "price_usd", "tx_per_min", "block_interval", "pool_share", "lookalikes", "mempool_txs", "mempool_bytes", "holder_share", "new_addresses", "active_addresses", "transfers", "mweb_pool", "mweb_flows", "zcash_pools"],
                "type": "string"
              },
              "to": {
                "description": "Optional end, same units as from.",
                "type": "integer"
              }
            },
            "required": ["interval", "network", "series"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "interval": {
                "type": "string"
              },
              "points": {
                "items": {
                  "properties": {
                    "height": {
                      "type": "integer"
                    },
                    "provisional": {
                      "type": "boolean"
                    },
                    "t": {
