                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous page; it carries the filters.",
                "type": "string"
              },
              "direction": {
                "description": "in: the balance went up; out: it went down (a payment with change counts once, as out). Default both.",
                "enum": ["in", "out", "both"],
                "type": "string"
              },
              "from_height": {
                "description": "Oldest block to include.",
                "minimum": 0,
                "type": "integer"
              },
              "from_time": {
                "description": "Start (a date means from its first second): unix seconds, a date like 2025-12-31 (UTC) or a timestamp like 2025-12-31T23:59:59Z.",
                "type": "string"
              },
              "network": {
                "description": "Network: BTC, LTC, DOGE, ZEC, BTCTEST, LTCTEST, DOGETEST or ZECTEST.",
                "enum": ["BTC", "LTC", "DOGE", "ZEC", "BTCTEST", "LTCTEST", "DOGETEST", "ZECTEST"],
                "type": "string"
              },
              "page": {
                "description": "Page number (10 per page). Default 1.",
                "minimum": 1,
                "type": "integer"
              },
              "page_size": {
                "description": "Rows per page, default 10.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "to_height": {
                "description": "Newest block to include.",
                "minimum": 0,
                "type": "integer"
              },
              "to_time": {
                "description": "End (a date means to its last second): unix seconds, a date like 2025-12-31 (UTC) or a timestamp like 2025-12-31T23:59:59Z.",
                "type": "string"
