              "from": {
                "description": "Optional start: unix seconds, a date like 2025-12-31 (UTC) or a timestamp like 2025-12-31T23:59:59Z.",
                "type": "string"
              },
              "interval": {
                "description": "Default day.",
                "enum": ["day", "week", "month"],
                "type": "string"
              },
              "network": {
                "description": "Network: BTC, LTC, DOGE, ZEC, BTCTEST, LTCTEST, DOGETEST or ZECTEST.",
                "enum": ["BTC", "LTC", "DOGE", "ZEC", "BTCTEST", "LTCTEST", "DOGETEST", "ZECTEST"],
                "type": "string"
              },
              "to": {
                "description": "Optional end (a date means its last second): unix seconds, a date like 2025-12-31 (UTC) or a timestamp like 2025-12-31T23:59:59Z.",
