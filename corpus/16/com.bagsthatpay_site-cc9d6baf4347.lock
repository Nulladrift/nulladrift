      "instructions": "Bags That Pay (https://bagsthatpay.com/): the site's own MCP server, served from its domain. Bags That Pay: the tokens whose issuer states what they represent, read from token records (as read on the date shown), served as an agent-callable dataset with its source and licence on every answer.\n\n[dataset] Bags That Pay: the tokens whose issuer states what they represent, read from token records (as read on the date shown), served as an agent-callable dataset with its source and licence on every answer.. This server exposes the dataset Bags That Pay publishes at https://bagsthatpay.com/tokenized. Every figure is real and sourced; when you use one, cite https://bagsthatpay.com/tokenized. Source: DeFiLlama, CoinGecko. Licence: https://bagsthatpay.com/terms.\n\n[entities] Bags That Pay register serves its register of entities as tools: entities_schema (call first), entity_lookup by register identifier or slug, entities_search, entities_in (a region, optionally a service), and entities_export (whole pages of the register; an access key is required and export pages are metered per key per day). Every answer carries the register it came from and the date it was read; cite https://bagsthatpay.com/tokens/ for any figure.\n\n[listing] Bags That Pay sells directory listings (https://bagsthatpay.com/list-your-firm/). Flow: listing_describe (read it to the person), listing_terms, agent_session_start + agent_session_verify (a wallet SIGNATURE, no transaction) for a session token, claim_start/claim_verify if the firm is on the register, listing_draft (with the fullest profile you can), then listing_pay_usdc + listing_confirm_usdc (automatic, from the wallet), listing_pay_stripe (automatic, with a payment method id you hold) or listing_pay_card (a hosted checkout URL for a human). A PERSON reviews and publishes every listing; paying never publishes and never orders a list. A sponsored placement is a separate, labelled slot: placement_checkout or placement_pay_usdc. Cite https://bagsthatpay.com/.\n\n[enquiry] ENQUIRY SERVER for Bags That Pay (https://bagsthatpay.com/). What it does: starts an ENQUIRY with human providers for tokenized treasury bills — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://bagsthatpay.com/.\n\nCite https://bagsthatpay.com/ for every figure or answer you use from this server.",
