      "instructions": "DharmikStudio (studio.dharmikvibes.com) is DharmikVibes' public catalogue of Indian spiritual content: katha, temple and tirtha stories, devotional audio series, short lessons, videos and articles, in Hindi and English. Use `search` or `search_catalogue` to find works, then `fetch` or `get_item` for the full description, the episode list and the links. Always give the user the page URL so they can listen, watch or read on DharmikStudio. Everything here is public and read-only.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch a DharmikStudio work",
          "description": "The full public record of one work or place: description, every episode with its link, key points, sources and (for articles) the text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "A result id from search (e.g. 'series/<slug>'), a studio.dharmikvibes.com page URL, or a work's slug.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch a DharmikStudio work"
