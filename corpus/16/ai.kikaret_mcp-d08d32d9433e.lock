{
  "lockfileVersion": 2,
  "subjects": {
    "ai.kikaret/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.kikaret.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "KIKARET MCP",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_facility",
          "description": "Get one KIKARET facility by facility_id. Returns facility identity, official URL, and basic resolved knowledge such as prefecture, city, address, phone, and facility type.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "facility_id": {
                "description": "Facility UUID returned by search_facilities",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["facility_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a0d3d01a219d8dc2138e49b39c97144a3292b80518b2a226d6d0580c7a7895b3"
        },
        {
          "name": "get_facility_knowledge",
          "description": "Get resolved KIKARET knowledge for one facility. Use facility_id from search_facilities. Optionally request specific schema keys. If keys are omitted, all resolved knowledge is returned with source metadata.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "facility_id": {
                "description": "Facility UUID returned by search_facilities",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "keys": {
                "description": "Optional schema keys such as capacity_total, weekday_open_time, principal_name. Omit to return all resolved knowledge.",
                "items": {
                  "pattern": "^[a-z0-9_]+$",
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              }
            },
            "required": ["facility_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c9ea8273b02bd4926f643b7954dbf06e6f3c5fb0337e396e2c0c800c6d6d0dc3"
        },
        {
          "name": "ping",
          "description": "Check whether the KIKARET MCP server is available.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "message": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fe42dabf7412d74c267f20e1b64a2b3004af9939a34129d992285db940374f56"
        },
        {
          "name": "search_facilities",
          "description": "Search KIKARET for childcare facilities by facility name. Use this first when you do not know the facility_id. Returns facility IDs and basic location/contact information.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Maximum number of results. Default 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Facility name or partial facility name, for example チェリッシュ北綾瀬",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:408c00d26bc8df811106106967cc69c9c3d5b47288b33d79a3b74287a8b14c4b"
        }
      ],
      "digest": "sha256:c55a4df2f2fd448c3ab5e58289998277e3fb66b1975d3c0773b0e642ead45ede"
    }
  }
}
