{
  "lockfileVersion": 2,
  "subjects": {
    "com.martcp/martcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.martcp.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "martcp",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "martcp searches online stores that ship to AU (prices in AUD) and creates checkout links. Currently covers partner stores only: KG Superstore (kgsuperstore.com.au). Typical flow: search_products → optionally get_product to pick a variant → create_checkout_links (with the user's postcode, if you have it, to price delivery) → give each checkout_url to the user, who reviews delivery and pays on the seller's own checkout. Never ask the user for card details. Pass search_id from search results into the other tools.",
      "tools": [
        {
          "name": "create_checkout_links",
          "title": "Create checkout links",
          "description": "Creates a checkout link per seller for the chosen variants. Give each checkout_url to the user: it opens the seller's own checkout with the items pre-filled, where the user reviews delivery and pays. Pass the user's postcode to get each seller's delivery options and an estimated_total including delivery. Nothing is charged by this tool.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "items": {
                "items": {
                  "properties": {
                    "quantity": {
                      "description": "Default 1",
                      "maximum": 999,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "variant_id": {
                      "description": "variant_id from search or product results",
                      "type": "string"
                    }
                  },
                  "required": ["variant_id"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "postcode": {
                "description": "Optional: the user's delivery postcode, to price delivery. Used for the quote only, never stored.",
                "type": "string"
              },
              "reason": {
                "description": "Optional: why these offers were chosen",
                "maxLength": 500,
                "type": "string"
              },
              "search_id": {
                "description": "search_id from the search these items came from",
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2be029e087ee41143466c7df2307c351e15b5b49002ed8d69f9f7e37e20db0dc"
        },
        {
          "name": "get_product",
          "title": "Get product details",
          "description": "Full details for a product: description, every variant with its options (size, colour, ...), the seller's shipping and refund policy links, and (in sellers) what the seller tells buyers about itself: ABN, delivery times, returns, support contacts, ratings. Pass seller_id to limit to one seller's offer.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "product_id": {
                "description": "product_id from search results",
                "type": "string"
              },
              "search_id": {
                "description": "search_id from the search that found this product",
                "type": "string"
              },
              "seller_id": {
                "description": "seller.id from search results",
                "type": "string"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:efb54a2dad215fc5c5ec2ee1e9611d3c54e3d55d6723888a10aa7c71ff6cdc09"
        },
        {
          "name": "search_products",
          "title": "Search products",
          "description": "Search products from online stores that ship to AU. Each result is one seller's offer with price (AUD), availability, product_id, seller and variants[].variant_id. When a seller offers a discount code, its results also have discounted_price (what the user pays; the code is applied through checkout_url automatically), so compare on that. Currently covers partner stores only: KG Superstore (kgsuperstore.com.au). Use next_cursor for more results.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "brand": {
                "description": "Only this brand's products, e.g. 'Samsung'. Use when the user names a brand they want, not one the product should fit.",
                "maxLength": 100,
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from a previous search, unchanged",
                "type": "string"
              },
              "limit": {
                "description": "Page size, default 10",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum price in AUD",
                "minimum": 0,
                "type": "number"
              },
              "min_price": {
                "description": "Minimum price in AUD",
                "minimum": 0,
                "type": "number"
              },
              "query": {
                "description": "What the user wants, e.g. 'orthopaedic dog bed large grey'",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e9abd0f195b38a1785bd3f6830e377370f9dc6774ef9c92588bbd75d01e531c9"
        }
      ],
      "digest": "sha256:2f70999bf18d017e130891d1b3498c3ceae8da94606e6a076af64b913439d15e"
    }
  }
}
