        {
          "name": "get_statute",
          "title": "Read a North Carolina (NC) General Statutes section",
          "description": "Full text of one North Carolina (NC) General Statutes section, by citation.\n\nUse for \"what does G.S. 14-72.1 say\". Accepts any spelling — \"14-72.1\", \"G.S. 14-72.1\",\n\"§ 14-72.1\". Returns catchline, body, history note, and when it was first enacted and\nlast amended. `as_of` gives the text observed on a past date; `pending` lists variants\nenacted but not yet effective.\n\nCarries `codified_through`, `session_laws_through` and a `legislation_note` naming any\nenacted act that touches this section outside the codified text. An uncodified override\n(\"Notwithstanding G.S. ...\") is never codified, so it is reported regardless of the\nwatermark. PENDING BILLS ARE NOT COVERED — a ratified bill is not law and appears in\nneither source, so an empty note is not evidence nothing passed.\n\n`as_of` RESOLVES AGAINST OBSERVED VERSIONS, NOT EFFECTIVE DATES — it answers \"what did\nthis database hold on that date\", so it cannot reach text from before the first ingest\nrun. For \"what took effect on 1 October\" use recent_law_changes(source=\"effective\").\n\nSection-level only — ask for \"20-141\", not \"20-141(j1)\". The Rules of Evidence and of\nCivil Procedure are each one statute (G.S. 8C-1, G.S. 1A-1) holding many rules; ask for a\nrule as \"8C-1, Rule 104\" or \"1A-1, Rule 12\" (N.C. R. Evid. / N.C. R. Civ. P. forms work).\nAsking for 8C-1 or 1A-1 itself lists the rules. For WHEN it changed use\namendment_history; for WHAT changed use diff_statute.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "citation": {
                "description": "One NC General Statutes SECTION, or one rule of the Rules of Evidence or Civil Procedure (\"8C-1, Rule 104\", \"N.C. R. Civ. P. 12\"). Any spelling works; subsections do not — ask for 20-141, not 20-141(j1), and 1A-1, Rule 12, not Rule 12(b)(6).",
                "examples": ["14-72.1", "G.S. 14-72.1", "§ 14-72.1", "15A-145.5", "8C-1, Rule 104"],
                "type": "string"
              },
              "max_chars": {
                "default": 12000,
                "type": "integer"
              },
              "pending": {
                "default": false,
                "type": "boolean"
              }
            },
            "required": ["citation"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a North Carolina (NC) General Statutes section"
