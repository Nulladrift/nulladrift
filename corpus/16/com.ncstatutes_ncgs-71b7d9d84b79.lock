        {
          "name": "cross_references",
          "title": "What a North Carolina (NC) statute cites, what cites it, and its rules",
          "description": "Which North Carolina (NC) statutes this section cites, which cite it, and which agency\nrules implement it.\n\nUse for \"what does G.S. 14-72.1 depend on\", \"what else references it\", or \"what rules\nwere adopted under G.S. 150B-21.2\". OUTBOUND is what the section's own text cites;\nINBOUND is every section citing it — the direction you cannot get by reading one statute\n— plus `implementing_rules`: NC Administrative Code rules that cite it as their\nauthority.\n\nSection-level only: a reference to 20-141(j1) is an edge to 20-141. Chapter-wide and\n\"this Article\" references are not edges. For the text itself use get_statute.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "citation": {
                "description": "The section whose references you want, in either direction.",
                "examples": ["15A-145.5", "G.S. 1A-1", "8C-1, Rule 702"],
                "type": "string"
              },
              "direction": {
                "default": "both",
                "type": "string"
              },
              "limit": {
