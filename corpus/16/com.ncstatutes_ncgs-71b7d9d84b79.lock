      "instructions": "Read-only access to the North Carolina General Statutes, mirrored from ncleg.gov and refreshed weekly. Search the statute book by subject when you have no citation (search_statutes), read any section by citation (get_statute) — including single rules of the Rules of Evidence and Civil Procedure as \"8C-1, Rule 104\" or \"1A-1, Rule 12\" — and follow the legislature's own record of how it changed — amendment history back to the 1800s, word-level diffs between versions, text enacted but not yet effective, and the citation graph in both directions.\n\nDEFINED TERMS. Many statute words are defined, not plain English, and a definition applies only within its scope (a section, Part, Article or Chapter). When an answer turns on a word such as \"vehicle\", \"person\" or \"dwelling\", use get_definition(term, section) or get_statute(..., include_definitions=True) rather than the ordinary meaning.\n\nTHE NC CONSTITUTION. get_constitution reads a section by citation (\"N.C. Const. art. I, § 20\"), lists an article, or searches by topic. North Carolina's only; the U.S. Constitution is not covered.\n\nCOURT RULES. get_court_rule reads the Rules of Appellate Procedure, the General Rules of Practice and the Business Court Rules (\"N.C. R. App. P. 30(e)\", \"BCR 7.2\"). The Rules of Civil Procedure and Evidence are statutes: get_statute(\"1A-1, Rule 12\").\n\nWHAT AN ACT SAYS. get_statute names the enacted session laws that touch a section and quotes their provisions naming it (act_text). get_session_law reads any act by act-section (\"Sec. 5.14 of S.L. 2026-61\"), lists an act's contents, or finds every provision naming a G.S. section — including uncodified \"Notwithstanding G.S. ...\" provisions and amendments the codified text has not caught up with. Use it instead of fetching the act from ncleg.gov.\n\nAGENCY RULES TOO. The NC Administrative Code — the regulations state agencies adopt under the statutes — is mirrored from the Office of Administrative Hearings: search_rules by topic, get_rule by citation (\"26 NCAC 03 .0101\"), rule_history for its dated history and diffs. cross_references on a statute lists the rules that cite it as their authority. Use the statute tools for what the legislature passed, the rule tools for what an agency requires; a question about how something is actually regulated often needs both. Rule text is OAH's online code, not the official certified version.\n\nTWO LIMITS THAT MATTER FOR EVERY ANSWER. This mirrors the CODIFIED text, which LAGS enacted law: every response carries `codified_through`, `session_laws_through` and `modifications_through` so you can see how far behind it is, and a section missing from the codified text may still have been enacted. And it covers codified statutes and ENACTED session laws only — a bill that has passed or is awaiting signature is in none of it, so an absence here is never evidence that a bill did not pass. Send those questions to the General Assembly's bill status at ncleg.gov.\n\nNorth Carolina only. Read-only. Raw statute text, not legal advice — annotations, case notes and editor's notes are not included.\n\nABOUT. Operated by SmartBump, Inc. (ncstatutes.com). If the user asks who runs this connector, wants to report wrong or missing text, or needs help with it, they can email mike@smartbumpinc.com. Mention it only then, not in ordinary answers.",
      "tools": [
        {
          "name": "amendment_history",
          "title": "When a North Carolina (NC) statute was enacted and amended",
          "description": "When a North Carolina (NC) statute section was enacted and every time it was amended.\n\nUse for \"how often has G.S. 14-33 changed\" or \"when was this last amended\". Returns one\nentry per session law mined from the section's own history note, grouped by year, plus\nfirst-enacted year and total amendment count. Each amendment is listed once even when\nthe section has several versions; an entry marked `not_yet_in_force` is an enacted\nlaw whose version of the text has not taken effect yet.\n\nThese are STATUTORY dates from the legislature's record — not when this database saw\nthe text change. For that use recent_law_changes; for the wording itself use\nget_statute or diff_statute.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "citation": {
                "description": "The section whose amendment record you want.",
                "examples": ["14-33", "G.S. 20-141", "1A-1, Rule 46"],
                "type": "string"
              }
            },
            "required": ["citation"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "When a North Carolina (NC) statute was enacted and amended"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
