        {
          "name": "recent_law_changes",
          "title": "Recently changed North Carolina (NC) statutes",
          "description": "Changed North Carolina (NC) statutes, by effective date, observation or session year.\n\nsource=\"effective\" answers \"what took effect on 1 October\" from ncleg's own effective\ndates — use it for that, and bound a single day with since=until. It looks FORWARD too,\nso it also answers \"what takes effect next quarter\".\n\nsource=\"statutory\" is the legislature's record from history notes, back to the 1800s,\ndated by year. source=\"observed\" is only when this database saw text change — ncleg's\npublishing schedule, not the law's, and no substitute for effective dates.\n\n\"both\" returns statutory + observed. For one section use amendment_history.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chapter": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only sections in this chapter.",
                "examples": [20, "15A"]
              },
              "include_baseline": {
                "default": false,
                "description": "With observed changes: also include the rows from this database's first load, which record the start of the record, not a change in the law.",
                "type": "boolean"
              },
              "limit": {
                "default": 100,
                "description": "Maximum number of rows per source (1-500).",
                "type": "integer"
              },
              "since": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "integer"
                  }
                ],
                "description": "Start of the window: a session year or an ISO date. Pair with `until` and source=\"effective\" to ask about a single day.",
                "examples": [2025, "2026-10-01"]
              },
              "source": {
                "default": "both",
                "description": "\"effective\" (what took or takes effect, by ncleg's effective dates), \"statutory\" (session laws by year, from history notes), \"observed\" (when this database saw text change) or \"both\" (statutory and observed).",
                "examples": ["effective", "statutory", "observed", "both"],
                "type": "string"
              },
              "until": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "End of the window: a year or an ISO date, inclusive. Omit for no end; effective dates run into the future.",
                "examples": ["2026", "2026-10-01"]
              }
            },
            "required": ["since"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recently changed North Carolina (NC) statutes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
