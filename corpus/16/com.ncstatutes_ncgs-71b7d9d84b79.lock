          "digest": "sha256:1bbf632f7ae99a3d3c2c93521774f496215ad7058ff06d4ee1699c44b29cc105"
        },
        {
          "name": "search_rules",
          "title": "Search North Carolina (NC) Administrative Code rules by topic",
          "description": "Search North Carolina Administrative Code (NCAC) rules — state agency regulations — by topic.\n\nUse when you know the subject but not the rule: \"how long to file a contested case\",\n\"child care staff ratios\", \"septic permit requirements\". Narrow with `title` (\"15A\") or\n`chapter` (\"15A NCAC 18A\", or \"18A\" together with `title`). If you have a citation, use\nget_rule instead.\n\nReturns ranked rules with highlighted fragments; read one with get_rule. Results are\nordered the same way as search_statutes: by how many search words a rule contains, then\nhow much of its heading they make up, then rank. For the General Statutes the legislature\npasses, use search_statutes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chapter": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only rules in this chapter: \"15A NCAC 18A\", or \"18A\" together with `title`.",
                "examples": ["15A NCAC 18A"]
              },
              "include_repealed": {
                "default": false,
                "description": "Also return repealed and expired rules.",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of rules to return (1-25).",
                "type": "integer"
              },
              "query": {
                "description": "Topic, keyword or phrase. Supports quoted \"exact phrases\", -excluded terms and `or`.",
                "examples": ["contested case hearing filing deadline", "septic system permit"],
                "type": "string"
              },
              "title": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only rules in this NCAC title.",
                "examples": ["15A", 26]
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search North Carolina (NC) Administrative Code rules by topic"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
