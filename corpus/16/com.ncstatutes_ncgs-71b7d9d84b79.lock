        },
        {
          "name": "get_constitution",
          "title": "Read or search the North Carolina (NC) Constitution",
          "description": "The North Carolina (NC) Constitution — read a section by citation, list an article, or\nsearch it by topic.\n\nUse for \"what does the NC Constitution say about ...\" and for any \"N.C. Const.\" citation.\nGive `citation` (\"N.C. Const. art. I, § 20\", \"Article I, Section 20\", \"Art. IX, sec. 2\",\n\"Section 20 of Article I\") or `article` + `section`; an article alone (\"Article IV\")\nlists its sections. Give `query` instead to search the text by topic.\n\nA section returns its heading, text, the statutes that cite it, and when ncleg's text\nlast changed. Amendments awaiting a referendum are printed by ncleg as two versions —\n\"(Effective until contingency met)\" and \"(Effective once contingency met)\" — and come\nback as `variants`, the one in force first, with ncleg's note on the contingency.\n\nThis is ncleg's online text, not an official certified copy, and it carries no\namendment history: stored versions begin with the first crawl. For the U.S. Constitution\nthis server has nothing; for statutes use get_statute.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "article": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Article number, Roman or Arabic, with or without `section`.",
                "examples": ["I", 9]
              },
              "citation": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A section or article of the NC Constitution in any common form.",
                "examples": ["N.C. Const. art. I, § 20", "Article I, Section 20", "Art. IX, sec. 2", "Article IV", "Preamble"]
              },
              "limit": {
                "default": 10,
                "description": "With `query`: maximum number of sections to return (1-25).",
                "type": "integer"
              },
              "max_chars": {
                "default": 12000,
                "description": "Cut each section's text at this many characters (default 12000). A cut is flagged `truncated`.",
                "type": "integer"
              },
              "query": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Topic search across the Constitution when there is no citation.",
                "examples": ["right to a jury trial", "public schools funding"]
              },
              "section": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Section number within `article`.",
                "examples": [20]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read or search the North Carolina (NC) Constitution"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:18115144b05a22151ee9098caac2bc032afec1fbd5e984ead5338cbf43b00148"
        },
        {
          "name": "get_court_rule",
          "title": "North Carolina (NC) appellate, practice and Business Court rules",
          "description": "North Carolina (NC) court rules that are NOT in the General Statutes: the Rules of\nAppellate Procedure, the General Rules of Practice for the Superior and District Courts,\nand the Business Court Rules.\n\nGive `citation` in any common form — \"N.C. R. App. P. 30(e)\", \"App. R. 30\", \"Appellate\nRule 28(b)(6)\", \"Rule 2 of the General Rules of Practice\", \"BCR 7.2\", \"Business Court\nRule 7.2\" — or `rule_set` + `rule`. A pinpoint returns that subdivision's text (`pinpoint`)\nalongside the whole rule. `rule_set` alone lists its rules; `query` searches by topic.\n\nThe Rules of Civil Procedure and of Evidence are General Statutes (G.S. 1A-1, 8C-1): use\nget_statute(\"1A-1, Rule 12\"). The Rules of Professional Conduct are NC Administrative Code\n(27 NCAC 02): use get_rule. Local rules are not covered.\n\nVersions are dated by codification, not by each amendment's effective date; the\nAppellate Rules go back to the January 2019 codification.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "citation": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A court rule in any common form, with or without a pinpoint.",
                "examples": ["N.C. R. App. P. 30(e)", "App. R. 28(b)(6)", "BCR 7.2", "Rule 2 of the General Rules of Practice"]
              },
              "limit": {
                "default": 10,
                "description": "With `query`: maximum number of rules to return (1-25).",
                "type": "integer"
              },
              "max_chars": {
                "default": 12000,
                "description": "Cut the rule's text, and its commentary, at this many characters (default 12000).",
                "type": "integer"
              },
              "query": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Topic search when there is no citation.",
                "examples": ["unpublished opinions citation"]
              },
              "rule": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Rule number within `rule_set`.",
                "examples": ["30(e)", "7.2", 2]
              },
              "rule_set": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "\"app\" (Appellate Procedure), \"gen\" (General Rules of Practice) or \"bcr\" (Business Court); with `rule`, or to narrow `query`.",
                "examples": ["app", "Business Court"]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "North Carolina (NC) appellate, practice and Business Court rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:d5ee4a4d4aa00bafd9d77f431bb73b0424af87693634f16f74225d5715a6b02a"
        },
        {
          "name": "get_definition",
          "title": "What a term means in North Carolina (NC) statutes, where it applies",
          "description": "What a term means in the North Carolina (NC) General Statutes — the statutory\ndefinition, and where it applies.\n\nUse whenever a statute's outcome turns on a word that may be DEFINED rather than plain\nEnglish (\"motor vehicle\", \"impairing substance\", \"person\", \"dwelling\"). With `section`,\nreturns only the definitions whose scope covers that section, most specific first\n(section > listed sections > Subpart > Part > Subchapter > Article > Chapter > statewide\nrules of construction in G.S. 12-3), each with `why` it applies. Without `section`,\nreturns every definition of the term grouped by scope — which differ: \"board\" means a\ndifferent body in each chapter that defines it.\n\nMatching: the exact term first, then case and plural folded, then the term inside a\nlonger defined phrase (flagged `fuzzy`). A definition that only says \"has the meaning in\nG.S. X\" is resolved one step to that section's definition.\n\nDefinitions are extracted automatically from the statute text; some lead-ins (\"As used\nin this act\") cannot be tied to a scope and are reported as such, never guessed. Read\nthe defining section before relying on a definition. get_statute(include_definitions=\nTrue) lists every defined term a section uses.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chapter": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Limit to definitions made in or scoped to one chapter.",
                "examples": ["20"]
              },
              "section": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The section whose text uses the term. Returns ONLY the definitions that legally apply there, most specific first. Strongly recommended.",
                "examples": ["20-138.1", "G.S. 14-72"]
              },
              "term": {
                "description": "The defined word or phrase, as it reads in the statute. Case and plural do not matter.",
                "examples": ["impairing substance", "motor vehicle", "person", "board"],
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What a term means in North Carolina (NC) statutes, where it applies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:fa7f5220cf99e7d92547cbfffe19f1c1770769713e5ef96591ee79f5ff3307fb"
        },
        {
          "name": "get_rule",
          "title": "Read a North Carolina (NC) Administrative Code rule",
          "description": "Read a North Carolina Administrative Code (NCAC) rule — a state agency regulation.\n\nReturns the rule's text, heading, status (current, temporary, emergency, repealed,\nexpired, transferred or reserved), its history (adopted, amended, …, by date), the G.S.\nsections it cites as AUTHORITY, and links to the rule on OAH. Give a chapter instead\n(\"26 NCAC 03\") to list that chapter's rules.\n\nUse for agency rules; use get_statute for the General Statutes the legislature passes.\nTo find which rules implement a statute, use cross_references on the statute.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "citation": {
                "description": "An NCAC rule citation, or a chapter to list its rules. Loose forms are fine: \"26 NCAC 3 .101\", \"10a ncac 27g .0104\", \"26 NCAC 03\". The State Bar's rules are \"27 NCAC 02 Rule 1.1\" or \"RPC 1.1\"; the Utilities Commission's are \"R8-49\".",
                "examples": ["26 NCAC 03 .0101", "10A NCAC 27G .0104", "26 NCAC 03"],
                "type": "string"
              },
              "max_chars": {
                "default": 12000,
                "description": "Cut the rule text at this many characters (default 12000). A cut is flagged, with the length to retry with.",
                "type": "integer"
              }
            },
            "required": ["citation"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a North Carolina (NC) Administrative Code rule"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:fc1d9b4c28e61927923469bf1037510b5e2909dcdb9996bd96dc186bde7eb416"
        },
        {
          "name": "get_session_law",
          "title": "Read a North Carolina (NC) session law, by act-section",
          "description": "The text of North Carolina (NC) session laws — the enacted acts — by act-section.\n\nUse when an answer turns on what an ACT says rather than the codified statute: \"what does\nSec. 5.14 of S.L. 2026-61 do\", an uncodified \"Notwithstanding G.S. 143-129 …\" provision,\nan amendment to one subsection the codified text has not caught up with, or when an act\ntakes effect. get_statute names acts touching a section; this reads them.\n\n- `session_law` alone: the act's title, effective date, the chapters it creates or\n  repeals, and its table of contents (each act-section's number, caption and the G.S.\n  sections it names), paged by `limit`/`offset`.\n- `session_law` + `section`: the full text of that act-section (\"5.14\" gives 5.14.(a),\n  (b), …).\n- `citation` (a G.S. section), with or without `session_law`: every provision naming it,\n  newest act first.\n- `query`: provisions containing all the words, in one act or across all of them.\n\nAmended text is marked as the act prints it: [-deleted-] {+inserted+}. Covers the acts\nof the current biennium (2025-) that ncleg has published; a bill not yet law is not\nhere. This is the act's own text, not the codified statute — use get_statute for that.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "citation": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A G.S. section: return the act provisions that name it — amendments of one subsection, uncodified \"Notwithstanding G.S. …\" provisions, effective-date clauses. Without `session_law`, searches every act.",
                "examples": ["143-129", "G.S. 20-141"]
              },
              "limit": {
                "default": 20,
                "description": "Maximum entries (1-50): act-sections in an act's contents, or provisions found by `citation` or `query`.",
                "type": "integer"
              },
              "max_chars": {
                "default": 15000,
                "description": "Total characters of provision text in the answer (default 15000). A cut provision says so.",
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Skip this many act-sections of an act's contents; pass the previous answer's `next_offset`.",
                "type": "integer"
              },
              "query": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Words that must all appear in the provision. Within `session_law` when given, else across every act.",
                "examples": ["procurement threshold", "extraterritorial jurisdiction"]
              },
              "section": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "An act-section number as the act prints it. \"5.14\" returns every lettered part (5.14.(a), (b), …); \"5.14(a)\" one of them.",
                "examples": ["5.14", "1.6(b)", "33"]
              },
              "session_law": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The act, as \"S.L. 2026-61\", \"Session Law 2026-61\" or \"2026-61\". May carry its section: \"S.L. 2026-61, s. 5.14\" or \"Sec. 5.14 of S.L. 2026-61\".",
                "examples": ["S.L. 2026-61", "2026-41", "Sec. 1.6 of S.L. 2026-61"]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a North Carolina (NC) session law, by act-section"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:a479446fdebed5c9489abb343e33b0847b62edef774746fe347e2b99baa2e7c8"
        },
        {
          "name": "get_statute",
          "title": "Read a North Carolina (NC) General Statutes section",
          "description": "Full text of one North Carolina (NC) General Statutes section, by citation.\n\nUse for \"what does G.S. 14-72.1 say\". Accepts any spelling — \"14-72.1\", \"G.S. 14-72.1\",\n\"§ 14-72.1\". Returns catchline, body, history note, and when it was first enacted and\nlast amended. `as_of` gives the text observed on a past date; `pending` lists variants\nenacted but not yet effective.\n\nCarries `codified_through`, `session_laws_through` and a `legislation_note` naming any\nenacted act that touches this section outside the codified text. An uncodified override\n(\"Notwithstanding G.S. ...\") is never codified, so it is reported regardless of the\nwatermark. PENDING BILLS ARE NOT COVERED — a ratified bill is not law and appears in\nneither source, so an empty note is not evidence nothing passed.\n\n`as_of` RESOLVES AGAINST OBSERVED VERSIONS, NOT EFFECTIVE DATES — it answers \"what did\nthis database hold on that date\", so it cannot reach text from before the first ingest\nrun. For \"what took effect on 1 October\" use recent_law_changes(source=\"effective\").\n\n`include_definitions=True` adds the defined terms the section uses, each with the\ndefinition that governs it here (most specific scope) — use it whenever the outcome turns\non a word like \"vehicle\", \"person\" or \"dwelling\". get_definition looks up one term.\n\nSection-level only — ask for \"20-141\", not \"20-141(j1)\". The Rules of Evidence and of\nCivil Procedure are each one statute (G.S. 8C-1, G.S. 1A-1) holding many rules; ask for a\nrule as \"8C-1, Rule 104\" or \"1A-1, Rule 12\" (N.C. R. Evid. / N.C. R. Civ. P. forms work).\nAsking for 8C-1 or 1A-1 itself lists the rules. For WHEN it changed use\namendment_history; for WHAT changed use diff_statute.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A date (YYYY-MM-DD): the text this database recorded as in force at the end of that day, instead of today's. Records begin with the first ingest run.",
                "examples": ["2026-01-01"]
              },
              "citation": {
                "description": "One NC General Statutes SECTION, or one rule of the Rules of Evidence or Civil Procedure (\"8C-1, Rule 104\", \"N.C. R. Civ. P. 12\"). Any spelling works; subsections do not — ask for 20-141, not 20-141(j1), and 1A-1, Rule 12, not Rule 12(b)(6).",
                "examples": ["14-72.1", "G.S. 14-72.1", "§ 14-72.1", "15A-145.5", "8C-1, Rule 104"],
                "type": "string"
              },
              "include_definitions": {
                "default": false,
                "description": "Also list the statutory definitions that govern this section and whose terms appear in its text (e.g. \"impairing substance\" in 20-138.1, defined in 20-4.01 for all of Chapter 20).",
                "type": "boolean"
              },
              "max_chars": {
                "default": 12000,
                "description": "Cut the body at this many characters (default 12000). A cut is flagged `truncated`, with the length to retry with.",
                "type": "integer"
              },
              "pending": {
                "default": false,
                "description": "True lists every variant of the section, including text enacted with a future effective date, each marked in_force_today.",
                "type": "boolean"
              }
            },
            "required": ["citation"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a North Carolina (NC) General Statutes section"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:f7ad237cbfe595d2381e731b2f1bf3acfb36b20455ab37e1ae9250c4dfd8eeb4"
        },
        {
          "name": "pending_changes",
          "title": "North Carolina (NC) statute changes enacted but not yet effective",
          "description": "North Carolina (NC) statute text already enacted but not yet effective.\n\nUse for \"what changes to Chapter 14 are coming\". Returns each section's current text\nalongside the future variant, its effective date, and by default a diff of the two.\nDistinguishes an AMENDMENT (current text exists) from a NEW SECTION (nothing in force\nyet, so no diff).\n\nOnly counts variants dated in the future. For text in force now use get_statute; for\nalready-enacted history use amendment_history or recent_law_changes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chapter": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only sections in this chapter.",
                "examples": [14, "15A"]
              },
              "citation": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only this section.",
                "examples": ["20-141"]
              },
              "include_diff": {
                "default": true,
                "description": "Include a diff of the current text against the pending text for each amended section.",
                "type": "boolean"
              },
              "limit": {
                "default": 50,
                "description": "Maximum number of sections to return (1-500).",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "North Carolina (NC) statute changes enacted but not yet effective"
          },
