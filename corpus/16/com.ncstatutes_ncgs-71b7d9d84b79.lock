          "digest": "sha256:47265bbd260406974566aadb277c60266f7ded5bba709eed09cadc78009e8add"
        },
        {
          "name": "diff_statute",
          "title": "Diff two versions of a North Carolina (NC) statute",
          "description": "Word-level diff of a North Carolina (NC) statute section between two versions.\n\n`mode=\"pending\"` compares the text in force against an enacted-but-not-yet-effective\nvariant — use this for \"what will change on 1 October\". `mode=\"observed\"` compares\nversions this database has actually recorded, optionally between two dates.\n\nCANNOT show text from before the ingest's first observation: observed history begins\nthen, so most sections have only one version and return diff: null. For earlier change\ndates use amendment_history; for pending text use pending_changes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "citation": {
                "description": "The section to diff. Add mode=\"pending\" to compare today's text against an enacted-but-not-yet-effective version.",
                "examples": ["14-78", "G.S. 14-33", "1A-1, Rule 12"],
                "type": "string"
              },
              "format": {
                "default": "unified",
                "description": "\"unified\" (a line diff), \"html\" (word-level <del>/<ins> markup) or \"both\".",
                "examples": ["unified", "html", "both"],
                "type": "string"
              },
              "from_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "With mode \"observed\": the earlier date (YYYY-MM-DD), compared with the version at to_date. Omit both dates to compare the latest two recorded versions.",
                "examples": ["2026-01-01"]
              },
              "mode": {
                "default": "observed",
                "description": "\"observed\" compares versions this database recorded; \"pending\" compares today's text with text enacted but not yet in effect.",
                "examples": ["observed", "pending"],
                "type": "string"
              },
              "to_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "With mode \"observed\": the later date (YYYY-MM-DD).",
                "examples": ["2026-10-01"]
              }
            },
            "required": ["citation"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Diff two versions of a North Carolina (NC) statute"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
