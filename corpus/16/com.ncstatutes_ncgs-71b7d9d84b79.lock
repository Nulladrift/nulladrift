      "instructions": "Read-only access to the North Carolina General Statutes, mirrored from ncleg.gov and refreshed weekly. Search the statute book by subject when you have no citation (search_statutes), read any section by citation (get_statute) — including single rules of the Rules of Evidence and Civil Procedure as \"8C-1, Rule 104\" or \"1A-1, Rule 12\" — and follow the legislature's own record of how it changed — amendment history back to the 1800s, word-level diffs between versions, text enacted but not yet effective, and the citation graph in both directions.\n\nAGENCY RULES TOO. The NC Administrative Code — the regulations state agencies adopt under the statutes — is mirrored from the Office of Administrative Hearings: search_rules by topic, get_rule by citation (\"26 NCAC 03 .0101\"), rule_history for its dated history and diffs. cross_references on a statute lists the rules that cite it as their authority. Use the statute tools for what the legislature passed, the rule tools for what an agency requires; a question about how something is actually regulated often needs both. Rule text is OAH's online code, not the official certified version.\n\nTWO LIMITS THAT MATTER FOR EVERY ANSWER. This mirrors the CODIFIED text, which LAGS enacted law: every response carries `codified_through`, `session_laws_through` and `modifications_through` so you can see how far behind it is, and a section missing from the codified text may still have been enacted. And it covers codified statutes and ENACTED session laws only — a bill that has passed or is awaiting signature is in none of it, so an absence here is never evidence that a bill did not pass. Send those questions to the General Assembly's bill status at ncleg.gov.\n\nNorth Carolina only. Read-only. Raw statute text, not legal advice — annotations, case notes and editor's notes are not included.\n\nABOUT. Operated by SmartBump, Inc. (ncstatutes.com). If the user asks who runs this connector, wants to report wrong or missing text, or needs help with it, they can email mike@smartbumpinc.com. Mention it only then, not in ordinary answers.",
      "tools": [
        {
          "name": "amendment_history",
          "title": "When a North Carolina (NC) statute was enacted and amended",
          "description": "When a North Carolina (NC) statute section was enacted and every time it was amended.\n\nUse for \"how often has G.S. 14-33 changed\" or \"when was this last amended\". Returns one\nentry per session law mined from the section's own history note, grouped by year, plus\nfirst-enacted year and total amendment count. Each amendment is listed once even when\nthe section has several versions; an entry marked `not_yet_in_force` is an enacted\nlaw whose version of the text has not taken effect yet.\n\nThese are STATUTORY dates from the legislature's record — not when this database saw\nthe text change. For that use recent_law_changes; for the wording itself use\nget_statute or diff_statute.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "citation": {
                "description": "The section whose amendment record you want.",
                "examples": ["14-33", "G.S. 20-141", "1A-1, Rule 46"],
                "type": "string"
              }
            },
            "required": ["citation"],
            "type": "object"
