        },
        {
          "name": "rule_history",
          "title": "When a North Carolina (NC) Administrative Code rule changed, and how",
          "description": "When a North Carolina Administrative Code (NCAC) rule was adopted, amended or repealed,\nand exactly what changed.\n\nReturns OAH's history events (dated: adopted, amended, temporary or emergency adoption,\nreadopted, repealed, expired, transferred, recodified) and the versions of the text this\nserver has stored, with a word-level diff between two of them — the latest two by default,\nor the versions in force on `from_date` and `to_date` (YYYY-MM-DD). `format` is \"unified\",\n\"html\" or \"both\". Stored versions begin with the first weekly crawl, so older changes\nhave dates but no diff.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "citation": {
                "description": "An NCAC rule citation.",
                "examples": ["26 NCAC 03 .0101"],
                "type": "string"
              },
              "format": {
                "default": "unified",
                "description": "\"unified\" (a line diff), \"html\" (word-level <del>/<ins> markup) or \"both\".",
                "examples": ["unified", "html", "both"],
                "type": "string"
              },
              "from_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The earlier date (YYYY-MM-DD): diff the version in force then against the one at to_date. Omit both for the latest two stored versions.",
                "examples": ["2026-11-10"]
              },
              "to_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The later date (YYYY-MM-DD). Defaults to the latest stored version."
              }
            },
            "required": ["citation"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "When a North Carolina (NC) Administrative Code rule changed, and how"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
