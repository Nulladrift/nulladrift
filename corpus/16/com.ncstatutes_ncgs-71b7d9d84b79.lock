        {
          "name": "chapter_activity",
          "title": "Legislative activity across a North Carolina (NC) statute chapter",
          "description": "How much legislative churn a North Carolina (NC) statute chapter has seen.\n\nUse for \"which parts of Chapter 14 keep changing\". Returns amendment counts by year,\nthe most-amended sections with their totals, and counts of pending and repealed\nsections. Omit `chapter` for a corpus-wide view.\n\nCounts are STATUTORY, from history notes — not observations. For one section use\namendment_history; for upcoming text use pending_changes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chapter": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The chapter. Omit for every chapter.",
                "examples": [14, "15A"]
              },
              "since_year": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Count amendments from this year on (default: five years ago).",
                "examples": [2015]
              },
              "top": {
                "default": 20,
                "description": "How many of the most-amended sections to list (1-100).",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Legislative activity across a North Carolina (NC) statute chapter"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:f4f8a55bea7d444f5297d124afd6134751d1ae6b18936ffe9b88467526828d97"
        },
        {
          "name": "cross_references",
          "title": "What a North Carolina (NC) statute cites, what cites it, and its rules",
          "description": "Which North Carolina (NC) statutes this section cites, which cite it, and which agency\nrules implement it.\n\nUse for \"what does G.S. 14-72.1 depend on\", \"what else references it\", or \"what rules\nwere adopted under G.S. 150B-21.2\". OUTBOUND is what the section's own text cites;\nINBOUND is every section citing it — the direction you cannot get by reading one statute\n— plus `implementing_rules`: NC Administrative Code rules that cite it as their\nauthority.\n\nSection-level only: a reference to 20-141(j1) is an edge to 20-141. Chapter-wide and\n\"this Article\" references are not edges. For the text itself use get_statute.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "citation": {
                "description": "The section whose references you want, in either direction.",
                "examples": ["15A-145.5", "G.S. 1A-1", "8C-1, Rule 702"],
                "type": "string"
              },
              "direction": {
                "default": "both",
                "description": "\"outbound\" (what this section cites), \"inbound\" (what cites it, with implementing rules) or \"both\".",
                "examples": ["outbound", "inbound", "both"],
                "type": "string"
              },
              "limit": {
                "default": 100,
                "description": "Maximum number of references per direction (1-500).",
                "type": "integer"
              }
            },
            "required": ["citation"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What a North Carolina (NC) statute cites, what cites it, and its rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
