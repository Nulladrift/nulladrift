        {
          "name": "search_statutes",
          "title": "Search North Carolina (NC) statutes by topic or keyword",
          "description": "Search North Carolina (NC) statutes by topic, keyword or phrase.\n\nUse this when you know the SUBJECT but not the citation — \"what's the NC law about\nleaving a dog in a hot car\", \"failure to appear penalty\", \"when can I expunge a\nmisdemeanor\". If you already have a citation, use get_statute instead.\n\nReturns ranked sections with highlighted fragments showing why each matched, not full\ntext: pick the one you want and call get_statute for it.\n\nSupports quoted \"exact phrases\", -excluded terms and `or`. `match_mode` says how the\nquery was read: \"all_terms\" (every word), \"all_terms_with_synonyms\" (every word, but the\nwords as typed matched nothing or only weakly, so statutory synonyms were accepted —\n\"car\" for \"motor vehicle\", \"leaving\" for \"confined\"; listed in `synonyms_used`),\n\"any_of\" (the query used `or`), \"any_terms\" (nothing matched every word, so any word or\nsynonym was accepted) or \"citation\" (the query was a bare citation, so it was looked up\ndirectly; when the section doesn't exist, the nearest real sections by number come back\nas `suggestions`).\nThe loose modes only return sections that contain at least one of your words. Results\nare ordered by `terms_matched` — how many of the search words a section contains, a\nquoted phrase counting only when it appears as a phrase — then by\n`catchline_terms_matched`, how many are in the section's own heading, then by\n`catchline_coverage`, how much of that heading the search words make up (1.0 is an\nexact title, so \"DWI\" finds \"Impaired driving\" before longer sections that merely\nmention it), then by rank. Court shorthand is expanded\nautomatically and case-insensitively — FTA, DWLR, PJC, AWDW and similar become the\nstatutory wording, because the statute book spells the phrase out and never uses the\nabbreviation. The expansion is reported back as `expanded_query`. Shorthand that names\none offense lists that offense's section first, marked `primary_for` (FTA → 15A-543,\nDWI → 20-138.1).\n\nSearches the law in force today, at section level. A low top rank means the corpus\nprobably has no section on point — NC simply has no statute on some subjects, and\nsaying so is a better answer than the nearest loose word match.",
