      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "tw-food-oracle",
        "title": "美食神仙籤筒",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "臺灣「今天吃什麼」美食抽籤（繁體中文）：選神明、餐別、美食種類與預算抽籤；給座標可找附近營業中店家。店家資料來自 OpenStreetMap（或 Google 地圖），附 Google 地圖與 Uber Eats 連結。",
      "tools": [
        {
          "name": "draw_food_fortune",
          "description": "美食神仙籤筒：今天吃什麼？依神明、餐別、美食種類與預算抽籤，回傳原創籤詩、料理；提供臺灣座標時，另從附近營業中的店家抽一間（附 Google 地圖與 Uber Eats 連結）。",
          "inputSchema": {
            "properties": {
              "budget": {
                "description": "總預算（新臺幣）",
                "type": "number"
              },
              "category": {
                "description": "美食種類 id 或名稱，auto＝神明決定",
                "type": "string"
              },
              "deity": {
                "description": "神明 id 或名稱：mazu(媽祖)、guangong(關聖帝君)、tudigong(福德正神)、yuelao(月下老人)、wenchang(文昌帝君)、guanyin(觀世音菩薩)、baosheng(保生大帝)、xuantian(玄天上帝)、chenghuang(城隍爺)、caishen(財神爺)",
                "type": "string"
              },
              "lat": {
                "type": "number"
              },
              "lon": {
                "type": "number"
              },
              "meal": {
                "enum": ["breakfast", "lunch", "snack", "dinner", "latenight"],
                "type": "string"
              },
              "people": {
                "type": "integer"
              },
              "radius": {
                "description": "公尺，預設 1500，最大 5000",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:06ba7290d78b038c69cab3da03b9ec1c96ab18e133daa537824430ca5673c162"
        },
        {
          "name": "find_nearby_restaurants",
          "description": "查臺灣某座標附近、符合美食種類且營業中（或未標示營業時間）的店家，依距離排序，附 Google 地圖與 Uber Eats 連結。",
          "inputSchema": {
            "properties": {
              "category": {
                "type": "string"
              },
              "lat": {
                "type": "number"
              },
              "lon": {
                "type": "number"
              },
              "radius": {
                "type": "integer"
              }
            },
            "required": ["category", "lat", "lon"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bbbcdf1617405b57c815af332dcc3a0330ed537a2071a8a1725444433946d08f"
        },
        {
          "name": "list_deities",
          "description": "列出 10 位臺灣知名廟宇主神（媽祖、關聖帝君、土地公、月老、文昌帝君、觀音、保生大帝、玄天上帝、城隍爺、財神）與各自的美食風格。",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4af49a10089037ff752641ba219146530b7864fded06dcb6558b37d189e775a6"
        },
        {
          "name": "list_food_categories",
          "description": "列出 Uber Eats 常見的美食種類（台式早餐、便當、牛肉麵、火鍋、拉麵、手搖飲…），可依餐別與總預算篩選，附一般價格帶。",
          "inputSchema": {
            "properties": {
              "budget": {
                "type": "number"
              },
              "meal": {
                "enum": ["breakfast", "lunch", "snack", "dinner", "latenight"],
                "type": "string"
              },
              "people": {
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
