        {
          "name": "create_document",
          "title": "Create a document",
          "description": "Use this when the person wants a new document or board in a repository. Creates a Markdown document (a path ending in .md or .markdown) with the starting text you give, or an empty board (a path ending in .canvas), at the path you choose. A path that has a file already is refused, and nothing changes. The new file is saved on GitHub as a draft review of its own, as the first save of a new document is in the editor, and the main branch is untouched until the person publishes it. The result gives the handle the other tools take: open_document shows it in the editor, and edit, insert and board_change change it.",
          "inputSchema": {
            "properties": {
              "branch": {
                "description": "Only if the person named a branch. Leave it out for the repository's main one.",
                "maxLength": 300,
                "type": "string"
              },
              "path": {
                "description": "The new file's path in the repository: docs/plan.md for a document, planning/roadmap.canvas for a board. A path that has a file already is refused.",
                "maxLength": 1024,
                "type": "string"
              },
              "repo": {
                "description": "The repository as owner/name, such as acme/docs.",
                "maxLength": 300,
                "type": "string"
              },
              "text": {
                "description": "A document's starting Markdown. Leave it out for an empty document. A board starts empty.",
                "maxLength": 200000,
                "type": "string"
              }
            },
            "required": ["path", "repo"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a document"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["docs:edit"],
                "type": "oauth2"
              }
