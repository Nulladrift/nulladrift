        {
          "name": "board_change",
          "title": "Change a board",
          "description": "Use this when the person wants to change a board (a .canvas file): add, edit, move, resize, restyle, connect or group cards, make, rename, tidy or remove lanes (groups), add a web link, an image from the repository or a new note, turn a text card into a note, make a card show a note that exists in its own place, copy a card, bring a card to the front or send it to the back, delete a text card or a link card, or take a note card off the board. It applies `ops`, in order, to the live board, which everyone who has it open sees change at once, and specgit saves it to the .canvas file on GitHub afterwards. read_document gives the board's card ids and sizes as people see them now. A text document is changed with edit. Positions are relative to other cards, never coordinates. A text card is made tall enough for its text, and a group grows to hold a card placed in it or next to a card in it. resize_card with fit: true makes an existing text card exactly as tall as its text needs, where a height is a number of board units. A lane keeps the board's own spacing: a card goes where the lane's cards stand, with the same gap and inset. A card goes to a place in a lane with inside_group and at ('top', 'bottom' or a number), or right above or below one of the lane's cards, and the cards under it move down. create_group with cards and a place (right_of, left_of, above or below another group) makes a new lane there and stacks the cards in it, wherever they were. tidy_group restacks a lane's cards in its columns and makes the lane fit them, top and bottom, which is how a lane shrinks. restyle_card sets a lane's label and the color ('1' to '6', or 'none') of a lane or any card. remove_group takes a lane off the board and leaves every card in it where it is, so a lane is cleared by deleting or removing its cards first. Deleting a text card or a link card deletes its text or its address. Removing a note card takes only the card off the board: the note stays in the repo. All three also remove the arrows on the card, and the cards at their other ends stay. In a lane whose cards stand in columns, the cards under a card that is deleted, removed or moved out of the lane move up to close the gap in its column. add_note_card takes a note that exists. create_note_card makes a new Markdown note at the repo path you give, inside the board's vault, with the card for it, and convert_to_note does the same from a text card, keeping the card's place, size and arrows and using its text. A path that has a file already is refused, and the call changes nothing. point_card_at_note makes a text, link or note card show a note that exists, in the card's own place, size and color and with its arrows, as a card swapped for the note where it stands; a text card's text is not kept. A new note is saved on GitHub as a draft review of its own, as a note made on the board is. add_image_card takes an image file that is in the repository already, such as one add_image saved, and add_link_card an http or https address. duplicate_card copies a text, note or link card right below the original, or at a place. reorder_card draws a card in front of every other card or behind them, and lanes are drawn under every card.",
          "inputSchema": {
            "properties": {
              "branch": {
                "description": "Only if the person named a branch. Leave it out for the repository's main one.",
                "maxLength": 300,
                "type": "string"
              },
              "document": {
                "description": "The handle open_document gave for this document. Pass it, or pass repo and path.",
                "maxLength": 2048,
                "type": "string"
              },
              "ops": {
                "description": "The board changes, applied in order, up to 40. There are no coordinates: a card is placed relative to another card, and specgit lays it out. Width, height and fit belong to resize_card.",
                "items": {
                  "properties": {
                    "card": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "cards": {
                      "description": "Ids (or refs) of the cards to put in the group; they can be anywhere on the board. Without `place` the group is drawn around them where they stand. With `place` they move into the group and are stacked in the order given, in the board's lane style. No cards makes an empty group.",
                      "items": {
                        "minLength": 1,
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "color": {
                      "description": "Preset '1' to '6' (red, orange, yellow, green, cyan, purple), or 'none' to take the color off.",
                      "enum": ["1", "2", "3", "4", "5", "6", "none"],
                      "type": "string"
                    },
                    "file": {
                      "description": "Repo path inside this board's vault. add_note_card: an EXISTING note. point_card_at_note: a note that EXISTS. add_image_card: an image that is ALREADY in the repository (.png, .jpg, .jpeg, .gif, .webp or .svg). create_note_card and convert_to_note: the NEW note, ending in .md; a path that is taken is refused.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "find": {
                      "description": "Exact substring of that text card's current text.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "fit": {
                      "description": "true makes a TEXT card exactly as tall as its text needs, at its width (or at the width given with it), so it shows all its text. It takes the place of a height.",
                      "type": "boolean"
                    },
                    "from": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "group": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "height": {
                      "description": "In board units, 40 to 4000; kept on the board's 20-unit grid.",
                      "type": "number"
                    },
                    "id": {
                      "description": "Id (or earlier ref) of the card, group or arrow the op is about. move_card: a group moves with the cards inside it. resize_card, restyle_card and reorder_card: a card or group. delete_text_card and convert_to_note: a TEXT card. delete_link_card: a LINK card. remove_note_card: a NOTE card. remove_group and tidy_group: a GROUP (a lane); remove_group takes the arrows on it too, and tidy_group restacks its cards in reading order. point_card_at_note: a text, link or note card. duplicate_card: a text, note or link card (a group can't be copied).",
                      "minLength": 1,
                      "type": "string"
                    },
                    "label": {
                      "description": "For connect, a short relationship label, e.g. 'blocks', 'depends on'. For restyle_card, a group's new label (empty takes it off); only a group has a label.",
                      "type": "string"
                    },
                    "op": {
                      "description": "The operation, and the fields it takes (? marks an optional one): add_text_card(text, place, ref?, color?); add_note_card(file, place, ref?, subpath?); update_text_card(id, find, replace); connect(from, to, label?); relabel_edge(id, label); remove_edge(id); create_group(label, ref?, cards?, place?, color?); move_into_group(card, group); move_card(id, place); resize_card(id, width?, height?, fit?); delete_text_card(id); remove_note_card(id); restyle_card(id, label?, color?); remove_group(id); tidy_group(id); add_link_card(url, place, ref?); add_image_card(file, place, ref?); create_note_card(file, place, ref?, text?); convert_to_note(id, file); point_card_at_note(id, file); duplicate_card(id, ref?, place?); reorder_card(id, to); delete_link_card(id).",
                      "enum": ["add_text_card", "add_note_card", "update_text_card", "connect", "relabel_edge", "remove_edge", "create_group", "move_into_group", "move_card", "resize_card", "delete_text_card", "remove_note_card", "restyle_card", "remove_group", "tidy_group", "add_link_card", "add_image_card", "create_note_card", "convert_to_note", "point_card_at_note", "duplicate_card", "reorder_card", "delete_link_card"],
                      "type": "string"
                    },
                    "place": {
                      "description": "A place is relative to another card, never coordinates: relation right_of, left_of, above or below with `of` (a card or group id); relation inside_group with `group` (a group id) and optionally `at` ('top', 'bottom' or a number); or relation free. For create_group, where a new lane goes, beside another lane (right_of, left_of, above or below, with `of`): right_of and left_of line its top up with that lane's top, above and below line its left edge up. The board's own gap between lanes is kept. For duplicate_card, where the copy goes; without it the copy goes right below the original.",
                      "properties": {
                        "at": {
                          "description": "Where in the group, instead of the first free spot: 'top' is the first place, 'bottom' the last, and a whole number such as '2' is a 0-based place in reading order (columns left to right, each top to bottom). The card there and the ones under it in its column move down to make room.",
                          "type": "string"
                        },
                        "group": {
                          "description": "Id (or earlier ref) of the group to place inside.",
                          "minLength": 1,
                          "type": "string"
                        },
                        "of": {
                          "description": "Id (or earlier ref) of the card to place next to. Above or below a card in a lane puts the new card right there, at the lane's own spacing, and moves the cards under it down. For create_group, the group (lane) the new one goes beside.",
                          "minLength": 1,
                          "type": "string"
                        },
                        "relation": {
                          "enum": ["right_of", "left_of", "above", "below", "inside_group", "free"],
                          "type": "string"
                        }
                      },
                      "required": ["relation"],
                      "type": "object"
                    },
                    "ref": {
                      "description": "Short name for a card created in this batch (e.g. 'new1'), usable as an id by later ops.",
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    },
                    "replace": {
                      "type": "string"
                    },
                    "subpath": {
                      "description": "'#Heading' to point at one section.",
                      "type": "string"
                    },
                    "text": {
                      "description": "For add_text_card, the card's Markdown. For create_note_card, the note's Markdown; leave it out for an empty note.",
                      "type": "string"
                    },
                    "to": {
                      "description": "For reorder_card, 'front' draws the card over every other card, 'back' under them. Lanes are drawn under every card, so a card is never hidden behind its lane.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "url": {
                      "description": "The web address, http or https (a bare domain such as example.com gets https).",
                      "maxLength": 2000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "width": {
                      "description": "In board units, 40 to 4000; kept on the board's 20-unit grid.",
                      "type": "number"
                    }
                  },
                  "required": ["op"],
                  "type": "object"
                },
                "maxItems": 40,
                "minItems": 1,
                "type": "array"
              },
              "path": {
                "description": "The file's path in the repository, such as docs/plan.md.",
                "maxLength": 1024,
                "type": "string"
              },
              "reason": {
                "description": "One short sentence: what this board change does.",
                "minLength": 1,
                "type": "string"
              },
              "repo": {
                "description": "The repository as owner/name, such as acme/docs. Use with path when you have no handle.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["ops", "reason"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Change a board"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
