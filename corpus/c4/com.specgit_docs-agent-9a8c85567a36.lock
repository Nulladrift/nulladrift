          "description": "Use this when the person wants to work on a document or board but hasn't said which one, or asks to browse or look for one. When they have named both the repository and the path, open_document opens it. Shows the person a picker for the repositories and documents they can open on GitHub, so they choose where to work. Pass `repo` if they named the repository but not the document. When they choose, the repository and the path of their choice come back, and that document is open in the editor already: read_document takes them as repo and path, and opening it again draws a second editor. Until they choose, there is no document to work on. If they write without saying what they chose, recall_choice returns it, given the pick in this tool's result.",
