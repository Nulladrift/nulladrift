      "instructions": "Australia Wide First Aid's documentation: the developer portal, the agent guide, auth.md, the llms.txt files, the OpenAPI description, the pricing, corporate, about, privacy and terms pages, and the first aid library (articles and glossary terms). Every document is the site's own published text. Use search_docs to find a section and get_doc, or the docs:// resources, for a whole document. Quote or link the documents rather than paraphrasing prices or policies. For courses, venues, sessions and booking, use the product MCP server at /mcp instead.",
      "tools": [
        {
          "name": "get_doc",
          "title": "Get a document",
          "description": "Return one whole document, exactly as the site publishes it, by name: developers, agent-guide, auth-md, llms, developers-llms, openapi, pricing, corporate, about, privacy, terms, glossary; or resources/<slug> for a library article and resources/glossary/<slug> for a glossary term (the document names search_docs returns).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "The document's name: a site document (developers, agent-guide, auth-md, llms, developers-llms, openapi, pricing, corporate, about, privacy, terms or glossary), resources/<slug> for a library article, or resources/glossary/<slug> for a glossary term.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "mimeType": {
                "description": "text/markdown, text/plain for an llms.txt file, or application/json for the OpenAPI description.",
                "type": "string"
              },
              "name": {
                "description": "The document's name.",
                "type": "string"
              },
              "text": {
                "description": "The whole document, as the site publishes it.",
                "type": "string"
              },
              "title": {
                "description": "The document's title.",
                "type": "string"
              },
              "url": {
                "description": "The page that publishes it.",
                "type": "string"
              }
            },
            "required": ["mimeType", "name", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a document"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e2d6ca822733bf40d3e763261a005ec6a78f0a4790dc5498b0f0637c2792603e"
        },
        {
          "name": "search_docs",
          "title": "Search the docs",
          "description": "Search Australia Wide First Aid's documentation by keyword: the developer portal, agent guide, auth.md, llms.txt files, pricing, corporate, about, privacy and terms pages, and the first aid library's article and glossary titles and summaries. Returns up to five sections, best first, each with its heading, document name, page URL and text; empty when nothing matches. Use get_doc for a whole document.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "What to look for, in a few words (at most 200 characters), such as api key, refund or CPR.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "results": {
                "description": "The best-matching sections, best first (at most five). Empty when nothing matches.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "document": {
                      "description": "The document's name, for get_doc.",
                      "type": "string"
                    },
                    "heading": {
                      "description": "The section's heading path, or the library item's title.",
                      "type": "string"
                    },
                    "text": {
                      "description": "The section's text, or the library item's summary (at most 2,000 characters).",
                      "type": "string"
                    },
                    "url": {
                      "description": "The page it is on, with the section's anchor where the page has one.",
                      "type": "string"
                    }
                  },
                  "required": ["document", "heading", "text", "url"],
                  "type": "object"
                },
                "type": ["null", "array"]
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the docs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c40de6bc22324c7aef65f7bec0f032dd68cdec64e369a83b36e4f3ca09525114"
        }
