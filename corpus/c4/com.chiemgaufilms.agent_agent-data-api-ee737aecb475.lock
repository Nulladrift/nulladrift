      "instructions": "Pay-per-call SEO data tools. Call list_services for prices. Paid tools need an x402-capable client (USDC on Base); free tools (list_services, preflight, find_location, free_sample, wishlist, get_result, retry_request) need no payment. Inputs are validated before any payment is requested. For businesses only (B2B): a paid call confirms that you act as a business and accept the terms of use at https://agent.chiemgaufilms.com/legal.html#terms.",
      "tools": [
        {
          "name": "ai_keyword_demand",
          "description": "Modeled (estimated) AI-search demand for up to 10 keywords with 12-month history (DataForSEO AI Optimization Keyword Search Volume). Returns: JSON with estimate, source, methodology, keywords, not_found. PAID: 0.04 USDC per call (USDC on eip155:8453, x402 v2). Requires an x402-capable MCP client that attaches the payment in _meta[\"x402/payment\"] (e.g. createx402MCPClient from @x402/mcp). Without a payment this tool returns a \"payment required\" result and charges nothing. NOTE: Modeled estimate, not a measured count. DataForSEO calculates AI search volume from statistical data on questions in Google's 'People Also Ask' results; it does not report actual prompt counts from any AI platform (ChatGPT, Gemini, Perplexity, ...). Use it as a relative demand indicator.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "keywords": {
                "description": "Keywords to look up: 1 to 10 entries, each up to 80 characters / 10 words. Lowercased, duplicates removed.",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "language_code": {
                "description": "Language code such as en or de. Default: English if available for the country, else its first language. Unsupported country/language pairs are refused before payment.",
                "pattern": "^[a-z]{2,3}(-[A-Za-z]{2,4})?$",
                "type": "string"
              },
              "location_code": {
                "default": 2840,
                "description": "DataForSEO location code. Country level: 2840 = United States (default), 2276 = Germany, 2040 = Austria, 2756 = Switzerland. Google SERP, Maps, News, Images and Local Market Check also accept city/region codes in Germany, Austria and Switzerland (free lookup: GET /api/v1/locations?q=...).",
                "maximum": 99999999,
                "minimum": 1000,
                "type": "integer"
              }
            },
            "required": ["keywords"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "AI Keyword Demand"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:96a2ea56539439146e3869d56c6ce5c6751137e949d04981d748ee6f24e4f18a"
        },
