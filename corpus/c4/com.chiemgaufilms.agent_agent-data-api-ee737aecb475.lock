        {
          "name": "content_month_plan",
          "description": "Plan a content month for an agency: up to 30 posts with topics, publish dates and linked production dates, bundled shoot days, holidays per region, conflicts and an .ics file. EN/DE. Returns: JSON with language, plan_id, period, today, summary, posts, shoot_days, conflicts, warnings, posts_for_reschedule, next_step, holiday_region, holidays, calendar_file_ics, coverage. PAID: 0.05 USDC per call (USDC on eip155:8453, x402 v2). Requires an x402-capable MCP client that attaches the payment in _meta[\"x402/payment\"] (e.g. createx402MCPClient from @x402/mcp). Without a payment this tool returns a \"payment required\" result and charges nothing. NOTE: Rule-based, German or English (language), no AI model, stateless. Send periods, counts, weekdays and your already booked dates only, no personal data. Topics are suggestions from built-in recipes, not a content strategy. Nothing is written to any calendar; the .ics text is yours to import.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "avoid_weekends": {
                "default": true,
                "type": "boolean"
              },
              "break_minutes": {
                "default": 15,
                "maximum": 60,
                "minimum": 0,
                "type": "integer"
              },
              "categories": {
                "default": ["produkt", "mitarbeiter", "bts"],
                "items": {
                  "enum": ["produkt", "mitarbeiter", "bts", "wissen", "kunde", "unternehmen", "recruiting"],
                  "type": "string"
                },
                "maxItems": 7,
                "minItems": 1,
                "type": "array"
              },
              "existing_publish_dates": {
                "default": [],
                "description": "Publish dates already taken.",
                "items": {
                  "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                  "type": "string"
                },
                "maxItems": 60,
                "type": "array"
              },
              "existing_shoot_dates": {
                "default": [],
                "description": "Shoot days already booked.",
                "items": {
                  "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                  "type": "string"
                },
                "maxItems": 60,
                "type": "array"
              },
              "from": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "holiday_region": {
                "default": "none",
                "enum": ["none", "DE-BW", "DE-BY", "DE-BE", "DE-BB", "DE-HB", "DE-HH", "DE-HE", "DE-MV", "DE-NI", "DE-NW", "DE-RP", "DE-SL", "DE-SN", "DE-ST", "DE-SH", "DE-TH", "AT", "CH"],
                "type": "string"
              },
              "language": {
                "default": "de",
                "description": "de (default) or en",
                "enum": ["de", "en"],
                "type": "string"
              },
              "lunch_minutes": {
                "default": 45,
                "maximum": 90,
                "minimum": 0,
                "type": "integer"
              },
              "max_day_minutes": {
                "default": 480,
                "maximum": 720,
                "minimum": 240,
                "type": "integer"
              },
              "max_shoots_per_day": {
                "default": 3,
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "media_type": {
                "enum": ["reel", "video", "post", "story", "carousel"],
                "type": "string"
              },
              "min_shoot_lead_days": {
                "default": 3,
                "maximum": 14,
                "minimum": 0,
                "type": "integer"
              },
              "mix_counts": {
                "additionalProperties": false,
                "description": "Posts per category; overrides posts_per_week and categories.",
                "properties": {
                  "bts": {
                    "maximum": 30,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "kunde": {
                    "maximum": 30,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "mitarbeiter": {
                    "maximum": 30,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "produkt": {
                    "maximum": 30,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "recruiting": {
                    "maximum": 30,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "unternehmen": {
                    "maximum": 30,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "wissen": {
                    "maximum": 30,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "phase_offsets": {
                "additionalProperties": false,
                "default": {
                  "concept": 7,
                  "edit": 2,
                  "review": 1,
                  "shoot": 4
                },
                "description": "Days before publish.",
                "properties": {
                  "concept": {
                    "default": 7,
                    "maximum": 60,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "edit": {
                    "default": 2,
                    "maximum": 60,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "review": {
                    "default": 1,
                    "maximum": 60,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "shoot": {
                    "default": 4,
                    "maximum": 60,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "posts_per_week": {
                "default": 3,
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              },
              "production_weekdays": {
                "default": ["tue", "thu"],
                "items": {
                  "enum": ["mon", "tue", "wed", "thu", "fri", "sat", "sun"],
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "publish_weekdays": {
                "default": ["mon", "wed", "fri"],
                "items": {
                  "enum": ["mon", "tue", "wed", "thu", "fri", "sat", "sun"],
                  "type": "string"
                },
                "maxItems": 7,
                "minItems": 1,
                "type": "array"
              },
              "seed": {
                "default": 0,
                "maximum": 99,
                "minimum": 0,
                "type": "integer"
              },
              "start_time": {
                "default": "09:00",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "to": {
                "description": "At most 62 days after from.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "today": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Content Month Plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:13b8b75d8c86b18e776ec7d1aa227e5c3a87a14a237eedd876fa881bc30ba520"
        },
        {
          "name": "content_plan_shift",
          "description": "Move one date in a content calendar and let the linked dates follow: concept, shoot, edit, review and publish stay in order, a shared shoot day moves all its posts together, finished steps never move. Returns the change list, conflicts, blocked steps, a confirmation flag and the updated posts. Stateless: you send up to 40 posts, nothing is stored. Returns: JSON with language, move, changes, blocked, conflicts, group_change, detached_from_group, needs_confirmation, summary, posts, coverage. PAID: 0.02 USDC per call (USDC on eip155:8453, x402 v2). Requires an x402-capable MCP client that attaches the payment in _meta[\"x402/payment\"] (e.g. createx402MCPClient from @x402/mcp). Without a payment this tool returns a \"payment required\" result and charges nothing. NOTE: Pure date arithmetic, German or English messages (language), no AI model. Send keys, optional short titles and dates only, no personal data. A confirmation flag means you should review the change list before you apply it to your own calendar; nothing is written anywhere by this service.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "holiday_region": {
                "default": "none",
                "enum": ["none", "DE-BW", "DE-BY", "DE-BE", "DE-BB", "DE-HB", "DE-HH", "DE-HE", "DE-MV", "DE-NI", "DE-NW", "DE-RP", "DE-SL", "DE-SN", "DE-ST", "DE-SH", "DE-TH", "AT", "CH"],
                "type": "string"
              },
              "language": {
                "default": "de",
                "description": "de (default) or en",
                "enum": ["de", "en"],
                "type": "string"
              },
              "move": {
                "additionalProperties": false,
                "properties": {
                  "new_date": {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "post_key": {
                    "maxLength": 40,
                    "minLength": 1,
                    "type": "string"
                  },
                  "publish_mode": {
                    "default": "shift_all",
                    "description": "Publish moves: also shift the unfinished steps by the same number of days, or only the publish date.",
                    "enum": ["shift_all", "only_publish"],
                    "type": "string"
                  },
                  "shoot_mode": {
                    "default": "group",
                    "description": "Shoot step of a grouped post: move the whole shoot day, or detach this post from the group.",
                    "enum": ["group", "detach"],
                    "type": "string"
                  },
                  "step": {
                    "enum": ["concept", "shoot", "edit", "review", "publish"],
                    "type": "string"
                  }
                },
                "required": ["new_date", "post_key", "step"],
                "type": "object"
              },
              "posts": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "concept": {
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "done": {
                      "description": "Steps that are already finished; they are never moved.",
                      "items": {
                        "enum": ["concept", "shoot", "edit", "review"],
                        "type": "string"
                      },
                      "maxItems": 4,
                      "type": "array"
                    },
                    "edit": {
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "key": {
                      "maxLength": 40,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9_-]+$",
                      "type": "string"
                    },
                    "publish": {
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "review": {
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "shoot": {
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "shoot_group": {
                      "description": "Posts with the same value share one shoot day and move together.",
                      "maxLength": 40,
                      "minLength": 1,
                      "pattern": "^[^\\x00-\\x1f\\x7f]+$",
                      "type": "string"
                    },
                    "title": {
                      "description": "Optional label echoed in messages. No personal data.",
                      "maxLength": 120,
                      "minLength": 1,
                      "pattern": "^[^\\x00-\\x1f\\x7f]+$",
                      "type": "string"
                    }
                  },
                  "required": ["key", "publish"],
                  "type": "object"
                },
                "maxItems": 40,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["move", "posts"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Content Plan Re-Schedule"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:91630f20591028d355c80e0b4d9d41b4a26d8b9fae3d31e91a78b25bd8f9331b"
        },
