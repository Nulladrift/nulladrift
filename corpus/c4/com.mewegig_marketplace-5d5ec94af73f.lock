          },
          "digest": "sha256:886bf7d7356fe13eb2f4e95438d00e02f440e9fcce8bbe75a1ce3447340ab0f1"
        },
        {
          "name": "draft_task",
          "title": "Draft a task with AI",
          "description": "Turn a rough request in any language into a structured task draft (does not post it).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "type": "string"
              },
              "locale": {
                "type": "string"
              },
              "text": {
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
