        {
          "name": "make_offer",
          "title": "Make offer",
          "description": "Send an offer on a task as a tasker. Amount in major units.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amount": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "message": {
                "type": "string"
              },
              "taskId": {
                "type": "string"
              }
            },
            "required": ["amount", "message", "taskId"],
