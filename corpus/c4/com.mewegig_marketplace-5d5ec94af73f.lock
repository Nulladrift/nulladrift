      },
      "instructions": "MeWe Gig is a local services marketplace (Pakistan, Africa, MENA). Use search_tasks / get_task to find work, draft_task + estimate_price to prepare a request, and post_task to publish it for the user (requires an API key). Amounts in tool inputs are in MAJOR units of the city's currency (e.g. 2500 = PKR 2,500). Always confirm price, city and timing with the user before post_task, accept_offer or make_offer.",
      "tools": [
        {
          "name": "accept_offer",
          "title": "Accept offer",
          "description": "Accept an offer (poster only). Creates a booking; online tasks then need payment in the app.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "offerId": {
                "type": "string"
              }
            },
            "required": ["offerId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
