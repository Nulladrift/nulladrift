        },
        {
          "name": "post_task",
          "title": "Post a task",
          "description": "Publish a task on behalf of the API-key owner. Confirm details with the user first. Budget in major units.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "type": "string"
              },
              "budget": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "budgetType": {
                "default": "fixed",
                "enum": ["fixed", "hourly"],
                "type": "string"
              },
              "category": {
                "type": "string"
              },
              "city": {
                "type": "string"
              },
              "description": {
                "type": "string"
              },
              "dueAt": {
                "description": "ISO date",
                "type": "string"
              },
              "dueType": {
                "default": "flexible",
                "enum": ["flexible", "on_date", "before_date"],
                "type": "string"
              },
              "hours": {
                "type": "number"
              },
              "lat": {
                "type": "number"
              },
              "lng": {
                "type": "number"
              },
              "locationType": {
                "default": "in_person",
                "enum": ["in_person", "remote"],
                "type": "string"
              },
              "paymentPref": {
                "default": "online",
                "enum": ["online", "cash"],
                "type": "string"
              },
              "title": {
                "type": "string"
              }
            },
            "required": ["budget", "category", "description", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:3ad9a10eea3911db5e4628517a527deb6be361bcf4ed4c660b98924b277d9423"
        },
        {
          "name": "search_tasks",
          "title": "Search tasks",
          "description": "Search open tasks by text, category, city, location radius, remote-only and budget (major units).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "category slug, e.g. plumbing",
                "type": "string"
              },
              "city": {
                "description": "city slug, e.g. lahore",
                "type": "string"
              },
              "lat": {
                "type": "number"
              },
              "lng": {
                "type": "number"
              },
              "maxBudget": {
                "type": "number"
              },
              "minBudget": {
                "type": "number"
              },
              "page": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "q": {
                "type": "string"
              },
              "radiusKm": {
                "type": "number"
              },
              "remote": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
