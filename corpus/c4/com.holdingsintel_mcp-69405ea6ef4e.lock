      "instructions": "HoldingsIntel shows what smart money is doing in US stocks: hedge fund 13F holdings, insider trades, activist stakes and Congress trades, each from its SEC or STOCK Act filing. Start with analyze_stock for a ticker, search_filers or analyze_fund for a fund or manager, analyze_politician for a member of Congress and find_signals for new ideas. Link each answer's web_url so the reader can open the full view and its filings.",
      "tools": [
        {
          "name": "analyze_fund",
          "title": "Analyze Fund",
          "description": "Returns a filing-bound hedge-fund profile with current rating, DNA, and tracked-holdings in-profit enrichment when available.\n\nWHEN TO USE: User asks about a specific hedge fund's profile, performance, investing style, or recent disclosed moves.\nExamples:\n  - \"How is Renaissance Technologies performing?\"\n  - \"What's Berkshire Hathaway's investing archetype?\"\n  - \"What did Bridgewater buy last quarter?\"\n\nWHEN NOT TO USE:\n  - Use analyze_stock when the subject is a stock, not a fund\n  - Use compare_funds to compare multiple funds\n  - Use get_fund_holdings for all disclosed positions currently processed for the fund\n\nRETURNS: One filing-bound portfolio quarter with compact component-filing sources, AUM, position count, and moves; plus explicitly scoped current all-history rating, DNA, and tracked-holdings in-profit share when available. The performance estimate covers qualifying disclosed holdings, excludes exited and unpriceable positions, and is not a fund return. Missing enrichments are identified in data_status.\n\nCITE: When you present these results, link `web_url` (the page with the full view) and cite record-level `source_url` filing or disclosure links when present.",
