            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "allOf": [
              {
                "if": {
                  "required": ["sector"]
                },
                "then": {
                  "properties": {
                    "type": {
                      "const": "convergence"
                    }
                  }
                }
              },
              {
                "if": {
                  "required": ["quarter"]
                },
                "then": {
                  "properties": {
                    "type": {
                      "not": {
                        "const": "convergence"
                      }
                    }
                  }
                }
              },
              {
                "if": {
                  "required": ["min_score"]
                },
                "then": {
                  "properties": {
                    "type": {
                      "not": {
                        "const": "early_birds"
                      }
                    }
                  }
                }
              }
            ],
            "properties": {
              "cursor": {
                "maxLength": 500,
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "min_score": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "quarter": {
                "pattern": "^\\d{4}-Q[1-4]$",
                "type": "string"
              },
              "sector": {
                "maxLength": 50,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9 &/\\-]+$",
                "type": "string"
