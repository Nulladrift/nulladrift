        {
          "name": "get_13f_activity",
          "title": "13F Activity",
          "description": "Returns every available changed 13F position for exactly one fund or one stock in one quarter, using cursor pagination.\n\nWHEN TO USE: The user asks what a fund bought, added to, trimmed, or exited; or which institutions changed a named stock position.\n\nPARAMETERS:\n  - provide exactly one of cik_or_name or ticker_or_cusip\n  - quarter: required YYYY-QN filing quarter\n  - change_types: any unique subset of new, increased, decreased, exited, initial (default: the four changes)\n  - instrument_type: stocks, options, bonds, or all\n  - cursor: pass the previous next_cursor to continue\n\nAll filters are applied before pagination. Ticker scope expands only within one issuer prefix, exposes the exact CUSIP set used, and requires an exact CUSIP when ticker data collides across issuers. New/increased/decreased/exited map directly to filing-derived NEW/INCREASED/DECREASED/SOLD changes; unchanged positions are never included. Initial (only when requested) returns positions from a fund's first quarter on file: holdings with nothing earlier to compare, never buys.\n\nWHEN NOT TO USE:\n  - Use get_stock_holders for all active owners of one stock, including unchanged positions\n  - Use get_fund_holdings for all currently processed positions in a fund's portfolio, including unchanged positions\n\nRETURNS: Deterministically paginated filing-derived changes with fund and security identity, current/prior position values, deltas, conviction, and quarter-end price provenance. No source-wide total is claimed.\n\nCITE: When you present these results, link `web_url` (the page with the full view) and cite record-level `source_url` filing or disclosure links when present.",
