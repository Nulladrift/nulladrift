          "name": "get_insider_trades",
          "title": "Insider Trades",
          "description": "Returns completed current corporate-insider non-derivative Form 4 transactions filed since August 24, 2026. With no identity filter, returns the global recent-filing feed; optionally filter by one stock or one insider.\n\nWHEN TO USE: User asks whether insiders are buying or selling a stock, or wants a specific executive's trades.\nExamples:\n  - \"Are insiders buying NVDA?\"\n  - \"Show recent open-market insider purchases\"\n\nPARAMETERS:\n  - ticker_or_cusip or insider_name: optional, at most one. Ticker collisions return candidates; retry with an exact CUSIP\n  - direction: optional buy, sell or other\n  - trade_class: optional open_market, placement, grant_like or other\n  - filed_from / filed_to: optional inclusive SEC filing dates (YYYY-MM-DD) from 2026-08-24, earlier ones fail; filed_from must be on or before filed_to\n  - limit / cursor: page size and cursor; a limit above the caller's tier fails, never shrinks\n\nWHEN NOT TO USE:\n  - Use analyze_stock for the stock's Smart Money Verdict, which already folds insiders in\n  - Use get_activist_stakes for 5%+ ownership stake filings\n\nRETURNS: Cursor-paginated Form 4 records, common and non-common, each with transaction code, direction, security, every reporting owner and role, shares, price, value and its basis, post-transaction ownership, amendment status, dates, filing identifiers and source link. Joint filings, including accessions split at EDGAR's reporting-person limit, appear once per transaction with all owners; an incomplete split group fails visibly. Only P/S common-equity codes feed conviction scoring. Stock filters add issuer-ticker rows not yet linked to a CUSIP (cusip null, noted in data_status). With a stock or insider filter, unavailable_filings lists in-scope filings whose share count the SEC document leaves unreadable, each with date, detail and SEC link; empty for the global feed.\n\nCITE: When you present these results, link `web_url` (the page with the full view) and cite record-level `source_url` filing or disclosure links when present.",
