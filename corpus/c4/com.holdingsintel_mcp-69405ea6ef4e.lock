        {
          "name": "analyze_stock",
          "title": "Analyze Stock",
          "description": "Returns the Smart Money Verdict for a single stock: a synthesized signal from 13F institutional positioning, Form 4 insider trades, 13D/13G activist filings, and STOCK Act congressional trades.\n\nWHEN TO USE: User asks about an individual stock's institutional positioning, smart money sentiment, hedge fund activity, insider buying/selling, or recent moves.\nExamples:\n  - \"Is smart money buying NVDA?\"\n  - \"What do hedge funds think about META?\"\n  - \"Has anyone famous been accumulating AAPL?\"\n  - \"Show me institutional activity on TSLA\"\n\nIDENTITY: Exact CUSIPs resolve directly (including explicit aliases). A ticker that maps to multiple canonical securities returns candidates instead of choosing one; retry with an exact CUSIP.\n\nWHEN NOT TO USE:\n  - Use find_signals when the user is screening across multiple stocks (\"show me stocks where smart money is bullish\")\n  - Use analyze_fund when the subject is a fund/hedge fund, not a stock\n  - Use search_securities first for a company name or ambiguous identifier, then pass its ticker/CUSIP here\n\nRETURNS: Resolved security identity and listing-status detail, verdict label and confidence, four source-specific signals, the exact 13F quarter and per-stream disclosure-through dates, top holders, recent institutional moves, and the latest fetched Congress, OGE executive, Form 4, and 13D/G evidence. Reported-symbol-only evidence is labeled and remains visible but never affects the CUSIP-scoped score.\n\nCITE: When you present these results, link `web_url` (the page with the full view) and cite record-level `source_url` filing or disclosure links when present.",
