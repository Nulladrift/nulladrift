        {
          "name": "buildVpsInstance",
          "description": "buildVpsInstance: Stage an operating system install (or reinstall) on a VPS instance. DESTRUCTIVE: ERASES ALL DATA on the server, including any deployed application, and cannot be undone. The install is asynchronous; afterwards poll getVpsInstanceDetails until buildState is COMPLETE. If an Osir app was deployed onto this instance, a rebuild erases it; re-attach it afterwards with osirAppDeployToVps. Never rebuild a box just to install an app runtime by hand. Requires authentication. Returns an actionId: present the summary to the user, then call executeConfirmedAction with the actionId if they approve.",
          "inputSchema": {
            "properties": {
              "hostname": {
                "description": "Hostname for the rebuilt server; defaults to the instance's current hostname.",
                "type": "string"
              },
              "instanceId": {
                "description": "VPS instance id from listMyVpsInstances.",
                "type": "string"
              },
              "operatingSystemId": {
                "description": "Integer OS template id from listVpsOsTemplates, resolved with this same instanceId.",
                "type": "integer"
              },
              "sessionKey": {
                "description": "Session key (osk_...) returned by checkDeviceLoginStatus. Pass it on every call when logged in via the in-chat device flow; omit when connected via OAuth.",
                "type": "string"
              },
              "sshKeyIds": {
                "description": "Integer SSH key ids from listMySshKeys, injected during install; without one you may not be able to log in.",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "swap": {
                "description": "Swap size: 256, 512, or 768 (MB), or 1, 1.5, 2, 3, 4, 5, 6, or 8 (GB).",
                "type": "number"
              }
            },
            "required": ["instanceId", "operatingSystemId"],
            "type": "object"
          },
