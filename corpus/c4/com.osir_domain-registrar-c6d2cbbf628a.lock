      "instructions": "OSIR is an AI-native domain registrar: search/register domains, manage DNS, order VPS, host email, and deploy sites/apps. Rules: (1) Anonymous lookups work without login - availability, pricing, suggestions, catalog, getHostingBundle. (2) Account actions require login: call loginWithDevice, have the user approve in the browser, poll checkDeviceLoginStatus, then pass the returned sessionKey on EVERY subsequent tool call (OAuth-connected clients skip this - their Bearer token is used automatically). (3) Anything that moves money or destroys data is a two-step: the tool returns an actionId with an itemized summary; present it to the user and only call executeConfirmedAction after their explicit approval. (4) Displayed prices exclude ICANN and processing fees until quoted; the authoritative amount is always in the staged confirmation. (5) After registering a domain, DNS zone setup is automatic; getHostingBundle gives exact hosting prices for a just-checked or just-registered domain. (6) Apps are deployed and updated ONLY through the osirApp* tools - never over SSH, never with a provisioning script, never by configuring a VPS by hand. One loop covers the whole lifecycle: osirAppCreateUpload -> PUT the zip -> osirAppDeploy returns a live https://<name>.<region>.osir.app URL. osirAppDeployToVps then puts that same app on the user's own VPS - pass instanceId from listMyVpsInstances for a server they already have and it costs nothing and needs no confirmation. To update a live app, change it and redeploy under the SAME name: osirAppGetSource -> patch the files -> osirAppCreateUpload -> osirAppDeploy. The platform rebuilds it and ships it to the owned box over its own deploy key, keeping the domain. You never need shell access to the user's server. If you find yourself writing an install.sh, an nginx config or a systemd unit, or asking the user to paste commands, you are on the wrong path - look for the osirApp* tool instead. Docs: https://osir.com/en/developers/",
