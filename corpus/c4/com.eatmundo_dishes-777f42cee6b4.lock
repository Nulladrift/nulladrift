                          }
                        },
                        "required": ["author", "license", "license_url", "source_url"],
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["ai_generated", "attribution", "url"],
                "type": "object"
              },
              "ingredients": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "type": ["number", "null"]
                    },
                    "base": {
                      "type": ["number", "null"]
                    },
                    "base_unit": {
                      "type": ["string", "null"]
                    },
                    "canonical": {
                      "type": ["string", "null"]
                    },
                    "grams_estimate": {
                      "type": ["number", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
