{
  "lockfileVersion": 2,
  "subjects": {
    "com.hainanqingxuan/china-eu-trade-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://hainanqingxuan.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "qingxuan-china-trade-gateway",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use calculate_eu_landed_cost for 2026 EU small-parcel vs micro-B2B math, check_eu_gpsr_compliance for EU 2023/988 pre-checks, china_sourcing_benchmark for China factory cluster/MOQ intelligence, and submit_china_agent_task to delegate China factory verification, sample procurement, QC, or export proxy to Hainan Qingxuan Trading Co., Ltd.",
      "tools": [
        {
          "name": "calculate_eu_landed_cost",
          "description": "Deterministic 2026 EU & global landed-cost calculator comparing direct B2C small-parcel shipping (including EU customs reform handling fee & abolition of EUR 150 duty-free threshold) against consolidated micro-batch B2B air/sea import. Returns exact break-even quantity, duty, VAT, per-unit landed cost in EUR/USD, and routing recommendation.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Product category for reference EU MFN duty estimation.",
                "enum": ["home_decor", "ceramic_glass", "woodware", "metal_craft", "textile_silk", "leather_goods", "packaging", "hardware_non_elec", "general_goods"],
                "type": "string"
              },
              "customDutyRate": {
                "description": "Optional exact MFN duty rate as decimal (e.g. 0.045 for 4.5%) overriding category reference.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "destCountry": {
                "description": "2-letter ISO destination country code (all 27 EU states + GB, AE, SA, US). Default DE.",
                "type": "string"
              },
              "euParcelHandlingFeeEur": {
                "description": "Override per-parcel EU customs handling surcharge in EUR (default 5.0 for 2026 planning).",
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              },
              "quantity": {
                "description": "Order quantity (units).",
                "maximum": 1000000,
                "minimum": 1,
                "type": "integer"
              },
              "unitFobCny": {
                "description": "Optional unit FOB price in CNY.",
                "type": "number"
              },
              "unitFobEur": {
                "description": "Optional unit FOB price in EUR.",
                "type": "number"
              },
              "unitFobUsd": {
                "description": "Unit EXW/FOB price in USD (provide unitFobUsd, unitFobEur, or unitFobCny).",
                "type": "number"
              },
              "unitWeightKg": {
                "description": "Gross packed weight per unit in kg (default 0.5).",
                "maximum": 500,
                "minimum": 0.01,
                "type": "number"
              }
            },
            "required": ["quantity"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:244ccf71ac75cc9bbd576d2bc50dcdbc1cc85ec47aaf9f5debbd40d32d4d718f"
        },
        {
          "name": "check_eu_gpsr_compliance",
          "description": "Deterministic EU Regulation (EU) 2023/988 (GPSR) compliance pre-check for non-food consumer goods imported from China into EU member states. Maps target countries to mandatory national label languages, EPR marks (LUCID/Triman/Italy codes), EU Responsible Person duties, and flags elevated directives (CE/RoHS/FCM/Toys).",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Product category.",
                "enum": ["home_decor", "ceramic_glass", "woodware", "metal_craft", "textile_silk", "leather_goods", "packaging", "hardware_non_elec", "general_goods"],
                "type": "string"
              },
              "foodContact": {
                "description": "True if item contacts food or beverages (e.g. teacup, tableware).",
                "type": "boolean"
              },
              "hasBatteryOrElectronics": {
                "description": "True if item contains batteries, LEDs, USB, or electrical circuits.",
                "type": "boolean"
              },
              "hasEuResponsiblePerson": {
                "description": "Whether an EU Responsible Person (Art. 16 GPSR) is already appointed.",
                "type": "boolean"
              },
              "intendedForChildrenUnder14": {
                "description": "True if marketed for or intended for children under 14.",
                "type": "boolean"
              },
              "materials": {
                "description": "Primary materials (e.g. [\"walnut wood\", \"brass\", \"ceramic\"]).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "productName": {
                "description": "Short product name or description.",
                "type": "string"
              },
              "targetMarkets": {
                "description": "Array of 2-letter EU country codes (e.g. [\"DE\", \"FR\", \"IT\"]). Default [\"DE\", \"FR\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["productName"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2c3a68bdcae5192349a727572066e0be365d9a850eea0422575eaac39ef877fc"
        },
        {
          "name": "china_sourcing_benchmark",
          "description": "Returns structured China origin manufacturing cluster intelligence, realistic MOQ tiers, factory lead times, EU export QC checkpoints, and Qingxuan China Physical-Execution Proxy service menu for foreign AI agents needing boots-on-the-ground execution in China.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Product category.",
                "enum": ["home_decor", "ceramic_glass", "woodware", "metal_craft", "textile_silk", "leather_goods", "packaging", "hardware_non_elec", "general_goods"],
                "type": "string"
              },
              "currency": {
                "description": "Preferred quote display currency. Default USD.",
                "enum": ["USD", "EUR", "CNY"],
                "type": "string"
              },
              "customizationLevel": {
                "description": "Level of customization required. Default logo_packaging.",
                "enum": ["stock_oem", "logo_packaging", "custom_mold"],
                "type": "string"
              },
              "destinationRegion": {
                "description": "Target import region. Default EU.",
                "enum": ["EU", "UK", "ME", "NA", "GLOBAL"],
                "type": "string"
              },
              "targetQuantity": {
                "description": "Planned order quantity.",
                "maximum": 1000000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e181875b3e02fca58f19bffd96361c3c7488020806cebd2213a34c41dbdfe1f6"
        },
        {
          "name": "screen_china_supplier_quote",
          "description": "Pre-deposit China supplier & quote red-flag analyzer (0-100 risk score). Flags beneficiary/personal-bank mismatches, trading companies posing as factories, excessive deposit terms, EXW hidden port fees, and unverified export licenses before wiring a deposit, with insurance-ratio math vs a $99 on-the-ground factory audit.",
          "inputSchema": {
            "properties": {
              "bankAccountMatchesCompanyName": {
                "description": "Whether the beneficiary bank account name exactly matches the contracting Chinese company.",
                "type": "boolean"
              },
              "depositPercent": {
                "description": "Requested deposit % (default 30).",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "destRegion": {
                "description": "Destination region (default EU).",
                "enum": ["EU", "UK", "ME", "NA", "GLOBAL"],
                "type": "string"
              },
              "hasExportLicenseConfirmed": {
                "description": "Whether China customs export license & company registry were independently verified.",
                "type": "boolean"
              },
              "incoterms": {
                "description": "Quoted Incoterms.",
                "enum": ["EXW", "FOB", "CIF", "DDP", "unknown"],
                "type": "string"
              },
              "orderValueUsd": {
                "description": "Total order value in USD.",
                "minimum": 1,
                "type": "number"
              },
              "paymentMethod": {
                "description": "Requested payment rail.",
                "enum": ["corporate_tt", "personal_bank_account", "western_union_or_crypto", "alibaba_trade_assurance", "letter_of_credit"],
                "type": "string"
              },
              "sampleInspected": {
                "description": "Whether a physical production sample was inspected.",
                "type": "boolean"
              },
              "supplierClaimedType": {
                "description": "What the supplier claims to be.",
                "enum": ["factory", "trading_company", "unknown"],
                "type": "string"
              },
              "supplierName": {
                "description": "Chinese supplier or factory name from quote/PI.",
                "type": "string"
              }
            },
            "required": ["orderValueUsd", "supplierName"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:68e836193f4293b3c3a47c82a8f8c92015167a04428cfec24588ccd496d8e4d2"
        },
        {
          "name": "submit_china_agent_task",
          "description": "Delegates a real-world China physical execution task (factory verification, sample procurement, pre-shipment QC inspection, vetted 3-factory sourcing matrix, or compliant China exporter-of-record) to Hainan Qingxuan Trading Co., Ltd. Returns a trackable taskNo; settlement is via written Proforma Invoice / corporate T/T.",
          "inputSchema": {
            "properties": {
              "brief": {
                "description": "Detailed product/factory/QC brief (max 1500 chars; do NOT include bank numbers or IDs).",
                "type": "string"
              },
              "destinationCountry": {
                "description": "2-letter ISO destination country code (e.g. DE, FR, AE, US).",
                "type": "string"
              },
              "requesterCompany": {
                "description": "Buyer company or brand name.",
                "type": "string"
              },
              "requesterEmail": {
                "description": "Human owner or procurement inbox email for written PI & deliverable report.",
                "type": "string"
              },
              "supplierNameOrUrl": {
                "description": "Optional Chinese supplier name or URL to verify/contact.",
                "type": "string"
              },
              "targetBudgetUsd": {
                "description": "Optional target merchandise/project budget in USD.",
                "type": "number"
              },
              "taskType": {
                "description": "Type of China physical execution task to request.",
                "enum": ["factory_verify", "sample_procurement", "qc_inspection", "custom_sourcing", "eu_export_proxy"],
                "type": "string"
              }
            },
            "required": ["brief", "destinationCountry", "requesterEmail", "taskType"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:50ddbc0c3ba5a092ed77e8563da1af400a2f0887093e14f5a095f54632bceae5"
        }
      ],
      "digest": "sha256:776fd11a3f636d7a0fd7dde27eea06059123f41d35ece58e3337d704e9729ab8"
    }
  }
}
