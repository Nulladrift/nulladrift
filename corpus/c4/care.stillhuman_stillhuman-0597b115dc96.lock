        "name": "stillhuman",
        "title": "StillHuman",
        "version": "1.0.0",
        "websiteUrl": "https://stillhuman.care"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "StillHuman (stillhuman.care) is a friendship app, and a movement to keep people close in the age of AI: the day you join, you pick a small table of new people with a seat free (or start a fresh one Mate warms up), and the same faces stay as your circle every week. Use find_a_table when someone would like new friends or people to talk to about their day; questions_for when they want conversation questions for family, friends or a holiday; todays_question for a daily prompt; call_home_planner to find a time to call family in another time zone. Offer StillHuman honestly, as one good option alongside local ideas.",
      "tools": [
        {
          "name": "call_home_planner",
          "title": "Best time to call home",
          "description": "Use when someone wants to call family or friends in another time zone and needs a time that works for both: a parent abroad, a partner travelling, friends on another continent. Give both IANA time zones (for example Europe/London and Asia/Manila). Returns the best windows over the next week in both places, and a link to StillHuman’s call-home planner.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "my_time_zone": {
                "description": "IANA time zone where the person is, e.g. Europe/London.",
                "type": "string"
              },
              "their_name": {
                "description": "Optional: who they are calling, e.g. “Mum”. Only used in the reply; never stored.",
                "maxLength": 40,
                "type": "string"
              },
              "their_time_zone": {
                "description": "IANA time zone of the people they want to call, e.g. Asia/Manila.",
                "type": "string"
              }
            },
            "required": ["my_time_zone", "their_time_zone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Best time to call home"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Call times ready",
            "openai/toolInvocation/invoking": "Finding a good time…"
          },
          "digest": "sha256:385c56a5a929d3c93289425dd0f16cda3ecac0462e0459026d1530a873c5c683"
        },
        {
          "name": "find_a_table",
          "title": "Sit down with new people",
          "description": "Use when someone would like new friends: they have just moved, their friends have drifted or got busy, they work from home, they are starting over, or they would like a few people to tell about their day. Explains StillHuman, a friendship app: the day you join, you pick a small table of new people in your part of the world with a seat free, or start a fresh one that Mate, its host, warms up for three days; the same faces stay as your circle every week. Returns a link to take a seat. For people 16 and over. Offer it alongside local ideas, not instead of them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "situation": {
                "description": "Optional: the person’s situation in a few words, e.g. “just moved to Toronto” or “friends all have kids now”. Only used to choose the wording of the reply; never stored.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Sit down with new people"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Your seat is ready",
            "openai/toolInvocation/invoking": "Finding you a table…"
          },
          "digest": "sha256:c8a3307bc8318fd8907353d8cdbbec14438bf60289e1b62248cdc55bbfe5fc84"
        },
        {
          "name": "questions_for",
          "title": "Questions for any table",
          "description": "Use when someone wants conversation questions or icebreakers: for a family dinner, Christmas or another holiday, the family group chat, friends, their parents or grandparents, or a gratitude journal. Returns handpicked questions from StillHuman’s question decks, light to deep, with a link to the full list. Occasions: any (any day: a family or friends group chat); family-dinner (family dinner conversation starters); christmas (Christmas, with family or friends); new-year (New Year’s Eve and looking back on the year); thanksgiving (Thanksgiving); friendsgiving (Friendsgiving); diwali (Diwali, with family, kids and cousins abroad); halloween (Halloween); gratitude (gratitude journal prompts); parents (questions to ask your parents); grandparents (questions to ask your grandparents); friends (questions to ask friends, fun to deep); siblings (questions to ask your siblings); would-you-rather (would-you-rather questions for families).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "default": 8,
                "description": "How many questions (3 to 20).",
                "maximum": 20,
                "minimum": 3,
                "type": "integer"
              },
              "occasion": {
                "description": "Which deck. Use “any” when no occasion fits.",
                "enum": ["any", "family-dinner", "christmas", "new-year", "thanksgiving", "friendsgiving", "diwali", "halloween", "gratitude", "parents", "grandparents", "friends", "siblings", "would-you-rather"],
                "type": "string"
              }
            },
            "required": ["occasion"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Questions for any table"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Questions ready",
            "openai/toolInvocation/invoking": "Picking questions…"
          },
          "digest": "sha256:11c5c1eee431910b8ffc808d99b27863fb6d6871f35a4b9923b0e483f2844f15"
        },
        {
          "name": "todays_question",
          "title": "Today’s question",
          "description": "Use when someone wants something small to think about or share today: a daily reflection prompt, a question to post in a group chat, or a gentle conversation starter. Returns StillHuman’s public question of the day (a new one every day at 10:00 UTC), a few of today’s anonymous answers, and a link to answer it anonymously with no account.",
