        {
          "name": "get_menu",
          "title": "Read a saved menu",
          "description": "Use this when the user wants help with one of their saved ChefBear menus: what to order, what a dish on it is, prices, or dishes that fit their tastes, budget or group. Reads the menu by its menuId or its https://chef-bear.com/my-menu/ link: dish names, short descriptions, categories and prices as stored, plus a private link to open it in ChefBear. Read-only and does not run recognition again. Does not search menus: use list_menus to find a menuId, and get_shared_menu for a https://chef-bear.com/m/ share link.",
