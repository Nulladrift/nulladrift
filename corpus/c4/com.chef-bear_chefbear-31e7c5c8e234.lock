      "serverInfo": {
        "name": "ChefBear",
        "title": "ChefBear",
        "version": "1.4.1",
        "websiteUrl": "https://chef-bear.com/ai/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ChefBear works with the restaurant menus saved in the user's ChefBear account and helps them choose what to order. Use it when the user is choosing dishes from a restaurant menu: a menu photo they want saved, a chef-bear.com menu link, or a menu they saved before. Saved menu named without a link: list_menus, then get_menu (without the list permission, ask for its link). A chef-bear.com/m/ share link: get_shared_menu. A menu they want saved: save_menu with the dishes you read (instant, no recognition); import_menu only when they want ChefBear to recognize photos (uses one recognition), then get_import_status. Recommend only dishes the menu lists, with their prices, and suggest confirming allergens and ingredients with the restaurant. Call share_menu only when the user explicitly asks to share a menu. ChefBear cannot find, book or order from restaurants and has no recipes. After setup, call connection_status once to check that the connection works. When the user's tastes, allergies or diets matter, get_taste_profile reads what they saved in ChefBear (if this connection may) and recommend_dishes ranks a saved menu's dishes against it. Call update_taste_profile only when the user asks you to remember or change something about their own tastes, or confirms a dish they picked or turned down.",
