        {
          "name": "import_menu",
          "title": "Import menu photos",
          "description": "Use this when the user wants a restaurant menu saved to their ChefBear account from photos they provide: to keep it, get it as a structured menu in their language, share it, or open it in the ChefBear app. Creates a private ChefBear menu from 1 to 5 menu photos, given as uploaded files where the app supports file inputs (files) or as public https:// image links (photoUrls). Uses one recognition from the user's ChefBear allowance, so don't call it just to answer a question about a photo already in the conversation unless the user wants it saved. Returns a jobId; recognition usually takes 20 to 60 seconds, then get_import_status returns the menuId. Does not create images or public links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "files": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "download_url": {
                      "type": "string"
                    },
                    "file_id": {
                      "type": "string"
                    },
                    "file_name": {
                      "type": "string"
                    },
                    "mime_type": {
                      "type": "string"
                    }
                  },
                  "required": ["download_url", "file_id"],
                  "type": "object"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "language": {
                "description": "Language for dish names and descriptions: en, zh-Hans, zh-Hant, es, vi, ko or ja (zh, zh-TW and similar forms also work). When omitted, ChefBear uses the conversation's language if the app reports one of these, else en.",
                "type": "string"
              },
              "photoUrls": {
                "description": "Public https:// links to the menu photos the user provided (JPEG, PNG, WebP, HEIC or AVIF, up to 15 MB each).",
                "items": {
                  "maxLength": 2048,
                  "pattern": "^https://",
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "requestId": {
                "description": "A new unique ID for this import, such as a UUID. Repeating the same requestId with the same photos returns the same job instead of importing twice.",
                "pattern": "^[A-Za-z0-9_-]{1,128}$",
                "type": "string"
              }
            },
            "required": ["requestId"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "jobId": {
                "type": "string"
              }
            },
            "required": ["jobId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Import menu photos"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/fileParams": ["files"],
            "openai/toolInvocation/invoked": "Menu import started",
            "openai/toolInvocation/invoking": "Sending menu photos to ChefBear…",
            "securitySchemes": [
              {
                "scopes": ["menus:import"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:b0660d9852b415ec8ea22b941e673111890010619e64a139263c2e252d5a0909"
        },
        {
          "name": "list_menus",
          "title": "List saved menus",
          "description": "Use this when the user refers to a menu they saved or scanned in ChefBear without giving its link or menuId (for example \"the menu I scanned last night\" or \"my ChefBear menus\"), or asks which menus they have saved in ChefBear. Lists the user's saved ChefBear menus, newest first: menuId, name, restaurant type, number of dishes, up to three dish names, when it was saved, whether a public link is on, and a private link to open it. Read-only. Returns no dish details, taste profile, orders or photos; call get_menu with the chosen menuId. Needs the \"See a list of your saved menus\" permission, which connections approved before it existed or in older ChefBear apps don't have.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "The nextCursor from an earlier list_menus result, to see older menus.",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "limit": {
                "description": "How many menus to return, newest first. Defaults to 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "menus": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "createdAt": {
                      "description": "When the menu was saved, ISO 8601 UTC.",
                      "type": "string"
                    },
                    "dishCount": {
                      "type": "integer"
                    },
                    "language": {
                      "type": "string"
                    },
                    "menuId": {
                      "type": "string"
                    },
                    "menuUrl": {
                      "type": "string"
                    },
                    "restaurantType": {
                      "type": "string"
                    },
                    "sampleDishes": {
                      "items": {
                        "type": "string"
                      },
                      "maxItems": 3,
                      "type": "array"
                    },
                    "shared": {
                      "type": "boolean"
                    },
                    "title": {
                      "type": "string"
                    },
                    "updatedAt": {
                      "description": "When the menu last changed, ISO 8601 UTC.",
                      "type": "string"
                    }
                  },
                  "required": ["createdAt", "dishCount", "language", "menuId", "menuUrl", "restaurantType", "sampleDishes", "shared", "title", "updatedAt"],
                  "type": "object"
                },
                "type": "array"
              },
              "nextCursor": {
                "type": ["string", "null"]
              }
            },
            "required": ["menus", "nextCursor"],
            "type": "object"
          },
          "annotations": {
