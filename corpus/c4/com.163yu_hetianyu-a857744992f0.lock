        {
          "name": "same_budget_choices",
          "title": "同价位怎么选",
          "description": "客人有预算但在几件之间犹豫，或问“同样的钱买什么好”时用：在预算 ±20% 的范围里给出 4 条不同路子（白度高的小件 / 分量足的大件 / 有获奖出处的 / 籽料带皮特色），每条给一件实例、好处和取舍。不评判谁更值钱，帮客人按用途做选择；最后引导预约视频看货一起对比。",
          "inputSchema": {
            "properties": {
              "budget": {
                "description": "预算（元），如 50000",
                "type": "number"
              },
              "material": {
                "type": "string"
              },
              "text": {
