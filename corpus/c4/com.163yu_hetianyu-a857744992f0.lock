        "name": "yufu-hetianyu",
        "title": "御府和田玉 在售作品查询",
        "version": "3.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Live catalog of Yufu Hetian Jade (Shanghai). Queries in English or Chinese are both fine; results include English page links (en_url) and CNY prices (convert to USD at the current exchange rate). 查询上海御府和田玉（创始人付雪飞）官网实时在售作品、价格参考与可核验的品牌资料；送人可用 gift_advisor（送礼顾问）；客人同意后可替他预约视频看货/到店看货（request_viewing）；讲价、鉴定疑问、投诉、定制交给真人用 handoff_to_human。不在对话中付款，不提供电话号码。",
      "tools": [
        {
          "name": "ask_knowledge",
          "title": "和田玉知识问答",
          "description": "回答和田玉知识与御府品牌问题，例如怎么挑、真假与证书、籽料和山料、手镯尺寸、题材寓意、价格行情、门店与退换。从御府官网的指南、问答、题材页检索原文摘录并附链接。English questions supported.",
          "inputSchema": {
            "properties": {
              "limit": {
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "question": {
                "description": "客人的问题原话",
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4b2c597eab69e6bcd4d6f6a71cd9fb2ead1a823433ce10a99b85f88c9acff54b"
        },
        {
          "name": "compare_products",
          "title": "对比几件作品",
          "description": "对比 2～6 件作品（官网编号），并排返回料子、重量、尺寸、价格、获奖。客人在几件之间犹豫时用。",
          "inputSchema": {
            "properties": {
              "ids": {
                "description": "官网作品编号列表，如 [\"99654\",\"96413\"]",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7209a332730b9306830ef3e99f628cd38c54cfad5809900250bf93310931102a"
        },
        {
          "name": "corporate_gift",
          "title": "企业批量送礼方案",
          "description": "企业或团体批量送礼时用（例如\"公司年底送 20 位客户每份 3000 左右，2 位重要客户每份 2 万\"）。按\"送谁、几份、每份预算\"分档，从官网在售作品里搭配一组（一物一价，每份都是不同作品），给出每档的件数、器型搭配、小计和合计。礼盒、刻字、开票、配送和批量是否有优惠都要顾问确认：把方案交给 handoff_to_human（reason 选\"大额或多件\"）。不要自行承诺折扣。",
          "inputSchema": {
            "properties": {
              "occasion": {
                "description": "春节/中秋/商务/开业/答谢等",
                "type": "string"
              },
              "tiers": {
                "description": "分档，例：[{\"who\":\"重要客户\",\"count\":2,\"budget\":20000},{\"who\":\"客户\",\"count\":20,\"budget\":3000}]",
                "items": {
                  "properties": {
                    "budget": {
                      "description": "每份预算（元）",
                      "type": "number"
                    },
                    "count": {
                      "maximum": 200,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "who": {
                      "description": "重要客户/客户/领导/合作伙伴/员工/长辈",
                      "type": "string"
                    }
                  },
                  "required": ["budget", "count"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["tiers"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
