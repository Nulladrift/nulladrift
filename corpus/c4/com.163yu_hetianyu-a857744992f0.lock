        {
          "name": "gift_advisor",
          "title": "送礼顾问",
          "description": "按\"送给谁、什么场合、预算\"从在售作品里挑 3～6 件，给出适合的理由（器型、传统寓意、料子、重量）和一句贺卡文案。什么时候用：客人要送人，例如\"给父亲祝寿，2万左右\"\"送领导开业礼\"\"女朋友生日5000以内\"\"宝宝满月\"。可以只传 text（客人原话），也可以分别传 who/occasion/预算。如果返回 need_more_info，先问客人缺的那几项，再调用一次。寓意只是传统说法，不要说成有功效，也不要承诺升值。",
          "inputSchema": {
            "properties": {
              "limit": {
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "预算上限（人民币元）",
                "type": "number"
              },
              "min_price": {
                "description": "预算下限（人民币元）",
                "type": "number"
              },
              "occasion": {
                "description": "场合：祝寿/生日/春节/中秋/新婚/纪念日/满月/本命年/乔迁/开业/升职/商务/母亲节/父亲节",
                "type": "string"
              },
              "text": {
                "description": "客人原话，例：给我爸70大寿，预算2万左右",
                "type": "string"
              },
              "type": {
                "description": "可选，指定器型：手镯/挂件/玉牌/手把件/摆件/手串",
                "type": "string"
              },
              "who": {
                "description": "送给谁：父亲/母亲/长辈/爱人/女友/男友/孩子/领导/客户/朋友/新人/自己",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
