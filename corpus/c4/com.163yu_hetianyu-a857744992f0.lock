        {
          "name": "shop_advisor",
          "title": "买货顾问（先问后荐）",
          "description": "客人买和田玉但需求说得不清楚时，优先用这个（例如\"想买个手镯\"\"有没有好的玉牌\"）。它会先返回 need_more_info 和要问客人的 2～3 个问题（预算、器型、手围、送谁），你把问题问完、把客人的回答拼进 text 再调用一次，就会推荐 3 件不同价位的在售作品，并说明区别；手镯会按手围换算建议内径。送人的需求会自动转成送礼推荐。不要在没问清楚时就推荐一堆作品。",
          "inputSchema": {
            "properties": {
              "limit": {
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
