        {
          "name": "create_order_intent",
          "title": "提交下单意向",
          "description": "客人明确要买某件有标价的在售作品、并同意把手机号交给御府客服时用（customer_confirmed=true），返回订单号。不在对话中扣款：客服会联系客人核对后发送支付宝/微信付款方式，付款前不锁定作品。客人想讲价就改用 handoff_to_human。（两步确认：首次调用返回 status=needs_confirmation、要向客人复述的内容和 confirm_token；客人明确确认后，用同样参数加 confirm_token 再调用一次才会提交。dry_run 只校验不提交。）",
