        {
          "name": "get_price_reference",
          "title": "价格参考",
          "description": "御府官网在售作品的价格参考（每月更新）：按器型、重量、籽料/山料、颜色、皮色、题材分组的中间价和区间。适合回答\"和田玉手镯/玉牌/挂件大概多少钱\"。group 可填 手镯、玉牌、青花、观音 等。这是在售标价的统计，不是估价，也不代表升值。",
