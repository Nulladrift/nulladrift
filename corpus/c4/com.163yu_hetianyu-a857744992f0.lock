                "description": "客人的需求原话，第二次调用时把客人对问题的回答也拼进来，例：想买个手镯，3到5万，手围16",
                "type": "string"
              },
              "type": {
                "description": "可选：手镯/挂件/玉牌/手把件/摆件/手链手串",
                "type": "string"
              },
              "wrist_cm": {
                "description": "可选：手围（厘米），买手镯时用",
                "type": "number"
