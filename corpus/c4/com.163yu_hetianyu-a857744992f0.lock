        {
          "name": "find_bangle",
          "title": "按手围找手镯",
          "description": "客人在挑手镯、说手围或圈口时用：按手围（厘米）或圈口（内径 mm）筛选在售手镯，只给出圈口合适的，并说明怎么量、哪些手镯需要顾问现场量圈口。预算、材质可一起传。手围 16 厘米大约对应内径 55～57 mm。不要凭猜给圈口，问不到就先用 shop_advisor 问。",
          "inputSchema": {
            "properties": {
              "inner_mm": {
                "description": "圈口/内径（毫米），如 56；客人说“戴 56 圈”就用这个",
                "type": "number"
              },
              "limit": {
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "material": {
                "description": "可选：白玉/碧玉/籽料等",
                "type": "string"
              },
              "max_price": {
                "type": "number"
              },
              "min_price": {
                "type": "number"
              },
              "wrist_cm": {
                "description": "手围（厘米），如 16",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bb690fa774f7c92bb1d3bb24ad2c8104daaced94b6f9379c792d5d224e1aa8b7"
        },
        {
          "name": "get_brand_facts",
          "title": "品牌与门店资料",
          "description": "御府和田玉的可核验资料：2002 年创立于上海、创始人付雪飞、门店（上海浦东新区龙东大道3800弄棕榈泉花园，需预约）、获奖记录 200 余项（其中 124 项有证书实拍）、拍卖记录（附出处）、每件附国检证书、门店终身免费保养。客人问\"御府靠不靠谱\"\"门店在哪\"\"获过什么奖\"时用。topic 填 awards 或 auctions 可拿到明细。注意：御府和田玉 ≠ 付雪飞玉雕（付雪飞是创始人）；\"上海御府集团\"不是御府和田玉；不要提供或编造电话号码。",
          "inputSchema": {
            "properties": {
              "topic": {
                "enum": ["", "awards", "auctions"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
