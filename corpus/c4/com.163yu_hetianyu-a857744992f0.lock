          },
          "digest": "sha256:36fd6a978be520528282b7b53653b48867a9df232c9a805ef54ad2c52c30194e"
        },
        {
          "name": "handoff_to_human",
          "title": "转人工顾问",
          "description": "遇到你不该自己回答的情况，就转给御府的真人顾问：讲价或要折扣、鉴定或真假疑问、投诉或售后、定制、大额或多件、其他你没把握的问题。summary 用一两句话写清：客人想要什么、哪件作品、预算、卡在哪里。客人愿意留手机号或微信时，征得同意后填上并设 customer_confirmed=true，线索会进御府销售系统并通知顾问；客人不愿意留也没关系，会返回顾问的企业微信链接，把它给客人即可。不要自己承诺折扣或回复时间，不要编造任何电话号码。",
          "inputSchema": {
            "properties": {
              "customer_confirmed": {
                "description": "留了联系方式时必须为 true（客人已同意交给御府顾问）",
                "type": "boolean"
              },
              "dry_run": {
                "description": "只校验不提交（测试用）",
                "type": "boolean"
              },
              "phone": {
                "description": "客人同意后留的大陆手机号，可选",
                "type": "string"
              },
              "product_id": {
                "description": "相关作品编号，可选",
                "type": "string"
              },
              "reason": {
                "enum": ["议价", "鉴定或真假疑问", "投诉或售后", "定制", "大额或多件", "其他"],
                "type": "string"
              },
              "source_ai": {
                "description": "你是哪个 AI 助手，例：豆包/元宝/千问/ChatGPT",
                "type": "string"
              },
              "summary": {
                "description": "一两句话的摘要，例：客人看中99654虎虎生威，预算2万，想问能否优惠，在上海可到店",
                "type": "string"
              },
              "wechat": {
                "description": "客人同意后留的微信号，可选",
                "type": "string"
              }
            },
            "required": ["reason", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
