        {
          "name": "request_viewing",
          "title": "预约视频看货/到店看货",
          "description": "客人想先看实物时用：视频看货（mode=video，顾问用企业微信视频展示自然光、上手、称重和证书，适合外地客人），或到上海浦东门店看货（mode=store，上海浦东新区龙东大道3800弄棕榈泉花园，需预约）。必须先征得客人同意并拿到他的中国大陆手机号，再把 customer_confirmed 设为 true。到店看货请先用 store_viewing_slots 拿到可约时段，让客人挑一个，把“日期 时段”填进 preferred_time；视频看货时间更灵活。这不是下单，不锁货、不付款。",
          "inputSchema": {
            "properties": {
              "customer_confirmed": {
                "description": "客人已同意提交，必须为 true",
                "type": "boolean"
              },
              "dry_run": {
