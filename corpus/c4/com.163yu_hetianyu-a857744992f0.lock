          "digest": "sha256:270557771278172a8be0757a8e74d0a2911299367e8f884daf47a135bd83d0e3"
        },
        {
          "name": "create_order_intent",
          "title": "提交下单意向",
          "description": "客人明确要买某件有标价的在售作品、并同意把手机号交给御府客服时用（customer_confirmed=true），返回订单号。不在对话中扣款：客服会联系客人核对后发送支付宝/微信付款方式，付款前不锁定作品。客人想讲价就改用 handoff_to_human。",
          "inputSchema": {
            "properties": {
