        {
          "name": "search_aec_knowledge",
          "title": "Search AEC Knowledge",
          "description": "Search the Atlasly AEC knowledge graph: official data source registry, jurisdiction planning frameworks, technical standards, calculation tools, and domain records. kind=sources returns official datasets by jurisdiction. kind=jurisdictions returns policy frameworks (NPPF, NPF4, PPW, etc.). kind=standards returns technical standards (daylight, fire, acoustic, energy performance). kind=calculators returns calculation specs. Use verified_only=true to exclude unverified seed records. Unverified candidates are labelled and must not be cited as authoritative. To find which Atlasly tool to call, use search_tools instead. Chaining: every response returns site_ref; pass it unchanged into another Atlasly tool to reuse the canonical site, coordinates, boundary confidence, LPA, evidence links, and project context.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "authority_level": {
                "enum": ["official_government", "official_local_authority", "official_statutory_body", "official_standard_body", "academic", "industry_guidance", "third_party_reference", "unknown"],
                "type": "string"
              },
              "category": {
                "description": "Optional category/domain filter, e.g. planning, flood, heritage, ecology, transport, climate",
                "minLength": 2,
                "type": "string"
              },
              "country": {
                "description": "Optional country/code filter, e.g. GB, US, England, Scotland",
                "minLength": 2,
                "type": "string"
              },
              "debug": {
                "description": "Include ranking/debug metadata in structured output",
                "type": "boolean"
              },
              "include_calculators": {
                "type": "boolean"
              },
              "include_candidates": {
                "description": "Include unverified source candidates as labelled background context",
                "type": "boolean"
              },
              "include_domains": {
                "type": "boolean"
              },
              "include_standards": {
                "type": "boolean"
              },
              "jurisdiction": {
                "description": "Optional country or jurisdiction filter",
                "minLength": 2,
                "type": "string"
              },
              "kind": {
                "enum": ["all", "sources", "standards", "jurisdictions", "calculators", "domains"],
                "type": "string"
              },
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search text, such as NPPF, daylight, fire, India, ADA, or U-value",
                "minLength": 2,
                "type": "string"
