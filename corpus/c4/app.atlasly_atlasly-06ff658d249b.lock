                  "version": {
                    "const": "1",
                    "type": "string"
                  }
                },
                "required": ["boundary_confidence", "boundary_id", "canonical_address", "coordinates", "id", "jurisdiction", "local_planning_authority", "project_id", "source_links", "status", "version"],
                "type": "object"
              },
              "title": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["format", "layers"],
            "type": "object"
