        {
          "name": "export_site_boundary",
          "title": "Export Site Boundary",
          "description": "Purpose: validate and export a supplied WGS84 boundary as GeoJSON or SVG. When to use: when the user provides a Polygon, MultiPolygon or Feature and wants a portable boundary file. Returns: actual file contents, filename, MIME type, geometry checks and limitations; the workspace supports host-mediated download. Limitations: only supplied 2D boundary geometry, no buildings, roads, terrain, constraints or ownership verification; SVG is illustrative and not to scale; reject projected coordinates until reprojected to WGS84. Parameter guidance: pass boundary_geojson, format geojson or svg, and optional title. Do not invent a boundary from an address. Chaining: every response returns site_ref; pass it unchanged into another Atlasly tool to reuse the canonical site, coordinates, boundary confidence, LPA, evidence links, and project context.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "boundary_geojson": {},
              "format": {
                "enum": ["geojson", "svg"],
                "type": "string"
              },
              "site_ref": {
                "description": "Canonical site_ref returned by any previous Atlasly tool. Pass it unchanged to chain the same resolved site into this call; address, search_area, or project_id will be filled from it when omitted.",
                "properties": {
