                        "required": ["lat", "lng"],
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "country_code": {
                    "pattern": "^[a-z]{2}$",
                    "type": "string"
                  },
                  "id": {
                    "type": ["string", "null"]
                  },
                  "jurisdiction": {
                    "type": ["string", "null"]
                  },
                  "local_planning_authority": {
                    "type": ["string", "null"]
