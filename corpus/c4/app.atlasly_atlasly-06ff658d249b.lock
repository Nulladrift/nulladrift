        {
          "name": "estimate_planning_costs",
          "title": "Estimate Planning Costs",
          "description": "Purpose: estimate England planning application fees, CIL coverage/liability status, and likely S106 heads for early feasibility and viability checks. When to use: use when a user asks for planning fees, CIL, S106, planning obligations, or rough pre-application cost exposure; use get_local_plan_policies for policy citations. Returns: planning_fee with calculation basis, unverified CIL schedule/rate/total, typical S106 review heads, caveats, sources, and next actions. Limitations: England-focused narrow fee estimate using the cited April 2026 schedule; outline applications require unavailable site/category inputs and return no fee; CIL schedules and rates remain unverified; it does not replace LPA fee calculators, exact CIL charging schedules, relief checks, indexation, or legal/quantity-surveyor advice. Parameter guidance: provide address, development_type, and either residential_units for housing or gross_floor_area_sqm for non-residential/change-of-use schemes; set application_type when the category is known; no outline estimate is supported. Chaining: every response returns site_ref; pass it unchanged into another Atlasly tool to reuse the canonical site, coordinates, boundary confidence, LPA, evidence links, and project context.",
