        {
          "name": "get_nearby_mapped_places",
          "title": "Nearby Mapped Places",
          "description": "Purpose: find mapped nearby schools, shops and services worldwide. When to use: compare local place context around a known site, or prepare mapped points for QGIS. Returns: selected OpenStreetMap point categories from fixed regional sources, straight-line distances in metres, per-layer coverage, source references, an inspectable map and GeoJSON. Limitations: community mapping, not official access evidence or a complete inventory; source freshness, entrances, opening hours and public/wheelchair access are unverified. No walking routes, travel times, parks, bus stops, rail stations or transit frequency; do not infer a walk score or 15-minute-city verdict. Parameter guidance: supply address with country, a prior site_ref, or WGS84 coordinates {lat,lng} with explicit country_code. Non-UK address lookup requires the configured service. Persona selects default category groups; explicit categories can request only mapped schools, hospitals or other supported point types. Radius is 250 to 1000 metres. Missing data means unknown, never absence of services. Chaining: every response returns site_ref; pass it unchanged into another Atlasly tool to reuse the canonical site, coordinates, boundary confidence, LPA, evidence links, and project context.",
