          "description": "Check first-pass UK planning constraints at a site: flood zone, listed buildings, World Heritage Sites, registered parks and gardens, scheduled monuments, registered battlefields, archaeological priority areas, conservation areas, Article 4 Directions, Tree Preservation Orders, environmental designations (SSSI, AONB, Green Belt, ancient woodland), historic landfill, and ground conditions. UK-only: non-UK addresses return a coverage error. Supply include[] to query specific constraint types only. Returns per-category evidence states, actual query scope, sample flags and gaps. Failed/unreadable results stay unknown; no clear-site opportunity or statutory-completeness claim. Source freshness and full red-line intersections are unverified. All requested categories unresolved returns CONSTRAINT_EVIDENCE_UNAVAILABLE. A regional ground lookup is not a full-radius screen. Use after analyze_site when per-constraint detail is needed. Chaining: every response returns site_ref; pass it unchanged into another Atlasly tool to reuse the canonical site, coordinates, boundary confidence, LPA, evidence links, and project context.",
