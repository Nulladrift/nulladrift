        {
          "name": "get_flood_risk",
          "title": "Get Flood Risk",
          "description": "Purpose: retrieve reported flood point evidence with source-state and coverage limits. When to use: first-pass flood evidence before authority/site-specific review. Returns: UK reported zone/native SEPA likelihood and gaps; US native FEMA context if configured. Limitations: no whole-site/access determination, no UK 3a/3b subtype acceptance, no generated risk/FRA/sequential/exception outcome; low river-sea context never means no flooding. Failed UK sources return FLOOD_EVIDENCE_UNAVAILABLE and unknown facts. Source freshness/completeness and current applicability remain unverified; NI/outside coverage use explicit fallback. Parameter guidance: full address or prior resolved site_ref; use local flood authorities for unsupported jurisdictions. Chaining: every response returns site_ref; pass it unchanged into another Atlasly tool to reuse the canonical site, coordinates, boundary confidence, LPA, evidence links, and project context.",
