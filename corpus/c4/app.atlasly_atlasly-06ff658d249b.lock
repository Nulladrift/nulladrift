      "instructions": "Atlasly connected. Choose from 34 public site, map and export tools with no Atlasly account required. Source prerequisites and coverage vary by task; read atlasly://capabilities or search_tools before claiming an output is available. Regional OpenStreetMap context can be exported worldwide from known coordinates plus country, a site_ref or supported address lookup. Official site evidence is UK-first; map coverage is not worldwide planning coverage. For supplied global points, get_location_coverage exposes registered routes, configuration and selected official research starting points without claiming source health. Use prepare_site_research and cited source inspection for unsupported statutory questions; do not substitute community geometry or adapter metadata for local authority evidence. Boundary export uses supplied WGS84 outlines. To display an already prepared result, call open_atlasly_workspace with prepared_result_url copied exactly from that result’s details.widget_payload_url; this opens its stored evidence without another source lookup. Answer a specific task with its matching tool; use search_tools when the task is unclear or open_atlasly_workspace for exploration. Offer /atlasly for a UK site appraisal. With no arguments it appraises the sample at 10 Downing Street, London SW1A 2AA; with arguments it appraises the user's UK address, intended use and project stage. Keep the first appraisal on public tools. Ask for Atlasly authorization only when the user explicitly wants to save a site, run an account-linked site package, retrieve an account job, generate a saved brief, or enable Site Watch. Always expose unknowns and source links. Describe address-only results as a point-radius screen, never as a confirmed parcel intersection. For global CAD/GIS context, export_site_context accepts known WGS84 coordinates with an explicit country code and no geocoder call. Supplied points have unverified address, country boundary and planning jurisdiction. Do not imply worldwide zoning, terrain, inferred heights, 3D or desktop execution. International address lookup requires the configured service. For global nearby schools, shops and services use get_nearby_mapped_places; it returns community-mapped points and straight-line distances, not verified walking time or transit access. For conversation site research, prepare_site_research returns a request, not researched evidence. Use the host search tools only if available, then present_site_research to show cited findings and unresolved gaps. Presentation validates structure only and must never be described as independently verified. Use inspect_research_source for supported direct official HTML/plain-text links and literal quotation checks; this does not verify the finding or legal applicability. No account history or guaranteed search access is supplied. Every tool returns site_ref. Pass that complete object unchanged into later Atlasly tool calls so the country, location provenance, canonical site, boundary confidence, LPA, sources and project context stay attached. Do not replace a supplied-coordinate reference with address lookup unless the user explicitly asks for a different location method. The Atlasly preview opens directly in ChatGPT. Do not request cloud-browser website access or browse atlasly.app just to open the returned preview. Offer the supplied download links. If you cannot visually inspect the panel, keep rendering unverified by you without asking for unrelated browser permissions. Rhino and QGIS handoff means downloading portable files for the user to import. No released Atlasly Rhino or QGIS desktop extension, installation path or remote desktop execution is established by this connection. Do not tell users to install such an extension or imply it is available. DWG, inferred building heights and 3D output are not supported here. Explain the available DXF/GeoJSON formats and coordinate manifest instead.",
      "tools": [
        {
          "name": "analyze_site",
          "title": "Analyze Site",
          "description": "Purpose: prepare a limited first site read. When to use: use for an initial resolved England address before selecting further evidence tools. Returns: reported flood point evidence, a bounded national application sample with explicit decision text, conditional point elevation and source gaps. Limitations: heritage, conservation, Article 4, trees, designations, landfill, ground and policy are not checked here; no complete statutory category count, comparable-scheme appraisal or clear-site conclusion. Failed counts stay unknown and a low river/sea sample never means no flooding. Wales/Scotland use jurisdiction-specific limited routes; other countries return source-registry metadata rather than fetched statutory evidence. Source freshness, full boundary and actual coverage are unverified. Parameter guidance: full address/postcode, radius 250–1000m, optional focus. Chaining: every response returns site_ref; pass it unchanged into another Atlasly tool to reuse the canonical site, coordinates, boundary confidence, LPA, evidence links, and project context.",
