        {
          "name": "run_site_package",
          "title": "Start Site Package",
          "description": "Purpose: request a background Atlasly site package for a resolved site. When to use: only after the user explicitly asks to start a package and connects an account with atlasly.site_package.run permission. Inputs: address, optional search radius in metres and an optional existing project_id; account ownership and entitlement are enforced by the package service. Side effect: submits a new job to the Atlasly package service, which may retrieve independently published source data. Repeated calls can create separate jobs. Returns: accepted job_id and an Atlasly link, not a finished report or download. Use get_job_status to inspect completion, failed steps and reported files. Source coverage, export formats, delivery time and native import are unverified at acceptance. No global planning clearance, terrain, 3D or guaranteed CAD/GIS deliverable. For an immediate bounded buildings/roads export, use export_site_context instead. Chaining: every response returns site_ref; pass it unchanged into another Atlasly tool to reuse the canonical site, coordinates, boundary confidence, LPA, evidence links, and project context.",
