          "description": "Purpose: compare exactly two UK sites for the same intended use and stage using the existing Site Verdict evidence. When to use: use after appraising one or two candidate sites, or when an architect/developer needs a shortlist decision that colleagues can review. Returns: both canonical site_ref objects, verdicts, potential dealbreakers, design-changing risks, visible unknown asymmetry, a transparent preferred-site decision only when one site dominates, both static map links, sources, and a temporary branded decision card. Limitations: address-only inputs remain point-radius screens; missing evidence is never treated as clear; the comparison uses no hidden weighted score and does not replace acquisition, planning, or technical due diligence. Parameter guidance: pass site_a and site_b with either address or a prior site_ref, plus one intended_use and project_stage shared by both sites; optional proposal and no_go_triggers are applied equally. Chaining: every response returns site_ref; pass it unchanged into another Atlasly tool to reuse the canonical site, coordinates, boundary confidence, LPA, evidence links, and project context.",
