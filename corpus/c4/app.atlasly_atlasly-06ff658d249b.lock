        {
          "name": "assess_planning_readiness",
          "title": "Planning Evidence Readiness",
          "description": "Purpose: check planning evidence readiness for a proposal at a resolved England location. When to use: prepare proposal evidence and identify decision references to verify before policy and design appraisal. Returns: bounded national-source sample, explicit source state, dated point-checked decisions from the last five calendar years, supplied proposal and residential density when units/hectares are given. Approval likelihood is always not_estimated, comparable_count and density range are null, and comparability is not assessed. Limitations: incomplete, freshness-unverified national records are not a complete/current local register or a calibrated forecast. No approval percentage, three-approval threshold, inferred scheme density or local-adapter query. Verify relevant approved and refused decisions and current policy on the local authority portal. Parameter guidance: provide address and development_type; optional proposed_units/site_area_ha calculate supplied residential density only, and proposed_height_m is recorded without policy assessment. Chaining: every response returns site_ref; pass it unchanged into another Atlasly tool to reuse the canonical site, coordinates, boundary confidence, LPA, evidence links, and project context.",
