                "maxItems": 11,
                "minItems": 1,
                "type": "array"
              },
              "coordinates": {
                "description": "User-supplied WGS84 point {lat, lng}. Send with country_code. The point is not reverse-geocoded, so its address and planning jurisdiction stay unverified.",
