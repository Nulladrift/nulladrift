        {
          "name": "export_site_context",
          "title": "Export Site Context",
          "description": "Purpose: retrieve source geometry and prepare a portable site-context file. When to use: when the user wants OpenStreetMap buildings, roads, water, green space and land use worldwide or available UK flood/heritage geometry around a location for QGIS, Rhino or CAD. Returns: actual GeoJSON, SVG or 2D DXF file contents, or a ZIP containing all three from one retrieval, source preview, per-layer coverage, and a companion manifest with CRS, local origin, attribution and limitations. DXF is local WGS84 UTM metres, not longitude/latitude; polygon holes are separate closed polylines. Limitations: community OSM geometry is not a survey; no inferred heights, terrain, DWG, 3D or desktop execution; basemap geometry is generalized and clipped to the request area; other sources retain touching features by default; an optional supplied outline can clip geometry with explicit omissions and an original-source audit companion. England flood checks the address point, not all nearby polygons. Missing layers remain explicit and can produce a partial export. Parameter guidance: supply address including city/country, prior site_ref, or user-supplied coordinates {lat,lng} with country_code. Coordinate mode does not verify the address or planning jurisdiction and only retrieves regional context. Pass a two-letter country code for non-UK address lookup and every supplied point (for example in, us, fr, au), selected layers, format and optional 250–1000m radius/title. Do not treat missing geometry as a clear planning result. Chaining: every response returns site_ref; pass it unchanged into another Atlasly tool to reuse the canonical site, coordinates, boundary confidence, LPA, evidence links, and project context.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "address": {
                "description": "Site address or postcode, with town and country outside the UK. Alternatively pass site_ref from an earlier result; do not send both for different locations.",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              },
              "boundary": {
                "description": "User-supplied simple WGS84 outline inside the search radius. Selects whole touching features by default; boundary_mode clip intersects geometry. Does not verify ownership. No holes or self-intersections.",
                "properties": {
                  "coordinates": {
                    "items": {
                      "items": {
                        "items": false,
                        "maxItems": 2,
                        "minItems": 2,
                        "prefixItems": [
                          {
                            "maximum": 180,
                            "minimum": -180,
                            "type": "number"
                          },
                          {
                            "maximum": 90,
                            "minimum": -90,
                            "type": "number"
                          }
                        ],
                        "type": "array"
                      },
                      "maxItems": 129,
                      "minItems": 4,
                      "type": "array"
                    },
                    "maxItems": 1,
                    "minItems": 1,
                    "type": "array"
                  },
                  "type": {
                    "const": "Polygon",
                    "type": "string"
                  }
                },
                "required": ["coordinates", "type"],
                "type": "object"
              },
              "boundary_mode": {
                "description": "Defaults to retaining whole touching features. clip intersects geometry with the supplied outline; requires boundary. Planar WGS84, not a legal boundary/survey or completeness check.",
                "enum": ["whole_features", "clip"],
                "type": "string"
              },
              "coordinates": {
                "description": "User-supplied WGS84 point. Provide an explicit country_code; omit site_ref. No address lookup or jurisdiction verification is performed.",
                "properties": {
                  "lat": {
                    "maximum": 84,
                    "minimum": -80,
                    "type": "number"
                  },
                  "lng": {
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  }
                },
                "required": ["lat", "lng"],
                "type": "object"
              },
              "country_code": {
                "description": "ISO two-letter country code. Required for non-UK addresses and all supplied coordinates; defaults to gb only for legacy address calls. Preserve the returned site_ref country.",
                "pattern": "^[a-z]{2}$",
                "type": "string"
              },
              "diagram_style": {
                "description": "SVG display preset only; exported CAD/GIS geometry is unchanged. Figure-ground preserves courtyard holes; street diagram shows sampled road geometry, not routing.",
                "enum": ["linework", "figure_ground", "street_network"],
                "type": "string"
              },
              "format": {
                "enum": ["geojson", "dxf", "svg", "zip"],
                "type": "string"
              },
              "layers": {
                "items": {
                  "enum": ["buildings", "roads", "water", "green", "landuse", "flood", "heritage"],
                  "type": "string"
                },
                "maxItems": 7,
                "minItems": 1,
                "type": "array"
              },
              "radius_meters": {
                "description": "Search radius in metres around the site. Requests above the caller's limit (1,000 m without an account, 2,000 m with one) are reduced or rejected.",
                "maximum": 1000,
                "minimum": 250,
                "type": "integer"
              },
              "site_ref": {
                "description": "Canonical site_ref returned by any previous Atlasly tool. Pass it unchanged to chain the same resolved site into this call; address, search_area, or project_id will be filled from it when omitted.",
                "properties": {
                  "address_aliases": {
                    "items": {
                      "maxLength": 300,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 4,
                    "type": "array"
                  },
