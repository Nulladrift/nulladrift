        {
          "name": "get_refund_checklist",
          "title": "Get a refund preparation checklist",
          "description": "Returns the records to gather, the checks to make, the next step and the relevant guides for one stage of a service-export GST refund claim and one preparation topic. Use it when someone asks what to prepare or check.",
