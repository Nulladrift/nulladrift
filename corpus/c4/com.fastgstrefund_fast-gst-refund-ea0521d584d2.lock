      "instructions": "Fast GST Refund helps prepare an Indian GST refund application for exports. It creates the Statement 3 and Annexure B JSON files that RFD-01 asks for, in place of the GST Excel utilities, in three steps for each file: get_statement3_requirements or get_annexure_b_requirements (the fields and where they come from), validate_statement3 or validate_annexure_b (free, no account, every problem in one reply), then generate_statement3 or generate_annexure_b. The generate tools return a link that the user opens in a browser to sign in by email, pay once for the GSTIN and refund period if needed, and download. No tool handles a payment. Supporting tools: get_refund_checklist (records and checks for a stage of the claim), search_refund_guides and read_refund_guide (guides with sources), explain_upload_error, and check_receipt_allocation (arithmetic on anonymous rows). The supporting tools need no identifiers or documents. The validate and generate tools take only the fields that the requirements tools list, sent with the taxpayer's permission. No tool takes a GST password or an OTP. Usage metrics exclude inputs, outputs and identity; X-GST-Analytics: off disables them. See https://fastgstrefund.com/privacy/.",
