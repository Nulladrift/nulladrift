  "subjects": {
    "com.airbandenservice/tyres": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.airbandenservice.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "air-bandenservice",
        "title": "AIR Bandenservice Haarlem",
        "version": "1.0.0",
        "websiteUrl": "https://www.airbandenservice.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "AIR Bandenservice is a tyre shop and workshop in Haarlem, the Netherlands. Prices are in EUR per tyre, all-in: 21% VAT and, where it applies, the EUR 1.70 tyre disposal fee are included. Flow: search_tyres by size (for example 205/55R16); optionally list_fitting_days for fitting at the workshop; get_quote for the exact total; show the customer every line, the total and the Terms; only after they approve the total and accept the Terms themselves, call place_order with the SAME items and options, their details and expectedTotalCents from the quote. place_order returns a Mollie checkoutUrl: give it to the customer. Nothing is ordered until they pay on that page; an unpaid order expires after about 15 minutes and its tyres go back on sale. Never invent prices or sizes, never accept the Terms for the customer, never pay for them. Delivery addresses are in the Netherlands only. Questions: the phone number from get_shop_info.",
      "tools": [
        {
          "name": "get_order_status",
          "title": "Order status",
          "description": "Payment and order status of an order placed with place_order (by its reference, e.g. AIR-2026-…). No personal data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ref": {
                "type": "string"
              }
            },
            "required": ["ref"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Order status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:82e1a3adea918f223356d639e2e3422bf63f5dd7e621e8dc6f878a821101fb1a"
        },
        {
          "name": "get_quote",
          "title": "Price an order",
          "description": "The exact total for these tyres and options, line by line, exactly what the payment page will charge. Checks stock and fitting capacity. Does not order, reserve, email or charge anything.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "delivery": {
                "description": "pickup = collect at the workshop in Haarlem (free); delivery = shipped to an address in the Netherlands (fee from get_shop_info).",
                "enum": ["pickup", "delivery"],
                "type": "string"
              },
              "fitting": {
                "additionalProperties": false,
                "description": "Optional: fitting and balancing at the workshop (pickup only), on a day from list_fitting_days.",
                "properties": {
                  "day": {
                    "description": "YYYY-MM-DD, from list_fitting_days.",
                    "type": "string"
                  },
                  "part": {
                    "enum": ["morning", "afternoon"],
                    "type": "string"
                  }
                },
                "required": ["day", "part"],
                "type": "object"
              },
              "items": {
                "description": "Tyres to order: the slug from search_tyres and how many. At most 4 products and 8 tyres per order.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "qty": {
                      "maximum": 8,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "slug": {
                      "description": "Product slug from search_tyres.",
                      "type": "string"
                    }
                  },
                  "required": ["qty", "slug"],
                  "type": "object"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "locale": {
                "description": "Language of the payment page, the order page and the emails. Default nl.",
                "enum": ["nl", "en", "de", "fr", "es", "it", "sv"],
                "type": "string"
              },
              "tpms": {
                "description": "With fitting only: the car has tyre pressure sensors (TPMS). Adds the sensor surcharge.",
                "type": "boolean"
              }
            },
            "required": ["delivery", "items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Price an order"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c5e84a1771f33da5618aa63208faabcf4a0d886d0996cdd7a6fe87c79976a2ec"
        },
        {
          "name": "get_shop_info",
          "title": "Shop details, delivery and fitting prices",
          "description": "Address, opening hours, phone, delivery fee, fitting price per tyre, payment methods and links to the Terms and privacy policy. No side effects.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Shop details, delivery and fitting prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:65c3a27d705e879dfc6a235323110d8f1ca8e1b90b3b16583727e09c5655e04f"
        },
        {
          "name": "list_fitting_days",
          "title": "Days with room for fitting",
          "description": "Workshop days that still have room for fitting, in the next 4 weeks. No side effects.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "supplierItems": {
                "description": "true when a chosen tyre comes from the supplier (not in stock at the shop); those arrive the next day when ordered before 16:00 (Amsterdam time), so the first day is left out.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Days with room for fitting"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:465be39437f8a19ddcb7cc9493ce40689deefcaacf5fee7f1516fe4ec1abed7a"
        },
        {
          "name": "place_order",
          "title": "Place the order (customer pays online)",
          "description": "Creates an unpaid order for the given tyres and options and returns a Mollie checkoutUrl where the customer pays. Requires the customer's acceptance of the Terms (https://www.airbandenservice.com/nl/algemene-voorwaarden) and the total from get_quote; a different current total is refused. Nothing is ordered until the customer pays; an unpaid order expires after about 15 minutes. An identical repeat returns the same order.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "acceptedTerms": {
                "description": "Whether the customer accepted the Terms. The order is refused without it.",
                "type": "boolean"
              },
              "customer": {
                "additionalProperties": false,
                "description": "The customer's own details, as they gave them.",
                "properties": {
                  "address": {
                    "description": "Required for delivery and for a business order: street, house number, postcode and city in the Netherlands.",
                    "type": "string"
                  },
                  "companyName": {
                    "description": "Only for a business invoice.",
                    "type": "string"
                  },
                  "companyVatId": {
                    "description": "Only for a business invoice, e.g. NL123456789B01.",
                    "type": "string"
                  },
                  "email": {
                    "description": "Receives the order confirmation and the receipt after payment.",
                    "type": "string"
                  },
                  "licensePlate": {
                    "description": "Dutch licence plate. Required with fitting.",
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 100,
                    "minLength": 2,
                    "type": "string"
                  },
                  "phone": {
                    "description": "Optional, for questions about the order, e.g. 06 12345678 or +31 6 12345678.",
                    "type": "string"
                  },
                  "postcode": {
                    "description": "Dutch postcode, e.g. 2031 CV (optional when the address contains it).",
                    "type": "string"
                  }
                },
                "required": ["email", "name"],
                "type": "object"
              },
              "delivery": {
                "description": "pickup = collect at the workshop in Haarlem (free); delivery = shipped to an address in the Netherlands (fee from get_shop_info).",
                "enum": ["pickup", "delivery"],
                "type": "string"
              },
              "expectedTotalCents": {
                "description": "totalCents from get_quote. A different current total is refused, so the customer never pays more than the quoted amount.",
                "type": "integer"
              },
              "fitting": {
                "additionalProperties": false,
                "description": "Optional: fitting and balancing at the workshop (pickup only), on a day from list_fitting_days.",
                "properties": {
                  "day": {
                    "description": "YYYY-MM-DD, from list_fitting_days.",
                    "type": "string"
                  },
                  "part": {
                    "enum": ["morning", "afternoon"],
                    "type": "string"
                  }
                },
                "required": ["day", "part"],
                "type": "object"
              },
              "items": {
                "description": "Tyres to order: the slug from search_tyres and how many. At most 4 products and 8 tyres per order.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "qty": {
                      "maximum": 8,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "slug": {
                      "description": "Product slug from search_tyres.",
                      "type": "string"
                    }
                  },
                  "required": ["qty", "slug"],
                  "type": "object"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "locale": {
                "description": "Language of the payment page, the order page and the emails. Default nl.",
                "enum": ["nl", "en", "de", "fr", "es", "it", "sv"],
                "type": "string"
              },
              "tpms": {
                "description": "With fitting only: the car has tyre pressure sensors (TPMS). Adds the sensor surcharge.",
                "type": "boolean"
              }
            },
            "required": ["acceptedTerms", "customer", "delivery", "expectedTotalCents", "items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Place the order (customer pays online)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0e35ec90663194a1cb78eae4e185f5d668e437fd01cad836427694537905ea7b"
        },
        {
          "name": "search_tyres",
          "title": "Search tyres",
          "description": "Tyres for sale, filtered by size (e.g. 205/55R16), season and brand. Returns the all-in price per tyre (incl. VAT and disposal fee), whether it can be ordered now and how fast it is available. No side effects.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "type": "string"
              },
              "orderableOnly": {
                "description": "Default true.",
                "type": "boolean"
              },
              "season": {
                "enum": ["summer", "winter", "all_season"],
                "type": "string"
              },
              "size": {
                "description": "Tyre size as on the sidewall, e.g. 205/55R16 or 195/65R15.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search tyres"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:38fe26e2d22053277cd923ba58fe42d6ba3056253f00336eaa3c78a3c98bc1aa"
        }
      ],
      "digest": "sha256:3af6ce636907c89009ab57ae04f0e8bc13783444d01e6f66f648b1c61eece4f9"
    }
  }
