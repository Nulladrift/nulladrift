      "instructions": "PlugMCP directory: search 70,000+ MCP servers and agent skills, then install one. Start with recommend_servers when the user describes a task, or search_servers when they name a product. Then call get_install with the user's client for the exact config. Results are compact cards with trust signals (official, verified, stars, health, auth). Page with cursor. Free without a key: 20 calls a day per address, 5 a minute. A free PlugMCP key gives 400 a day, 15 a minute and 60 an hour: https://plugmcp.ai/directory-mcp",
