        {
          "name": "search_servers",
          "title": "Search MCP servers",
          "description": "Find MCP servers by product name, publisher, or topic. Ranked by relevance (exact name, then publisher, then tags and description); the product's own server comes first when there is one (jira finds Atlassian's), duplicates merged. Returns compact cards with trust signals; call get_install next. When the user describes a job rather than a product, recommend_servers is one call instead of two.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category slug: developer-tools, design-tools, databases, browser-automation, web-scraping, cloud-infrastructure, devops, productivity, communication, knowledge-memory, search, finance, security, data-science-ml, marketing, e-commerce, content-management, collaboration, analytics-monitoring, voice-agents, telephony, speech, autonomous-agents, project-management, documentation, game-development, mobile-development, social-media. list_categories has counts.",
                "type": "string"
              },
              "client": {
                "description": "Only servers that work in this client (chatgpt keeps remote servers only). With fields=[install], adds the snippet for it.",
                "enum": ["cursor", "claude-code", "claude-desktop", "vscode", "windsurf", "chatgpt", "codex", "gemini-cli", "grok", "grok-bot", "json"],
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous page.",
                "type": "string"
              },
              "fields": {
                "description": "Extra card fields. install (needs client) and tools_count need a PlugMCP key.",
                "items": {
                  "enum": ["categories", "sources", "tools_count", "install"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "limit": {
                "description": "Results per page. Default 8. Without a key at most 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "official_only": {
                "description": "Only servers published by the product they connect to.",
                "type": "boolean"
              },
              "query": {
                "description": "Product, publisher, or topic, for example github, postgres, send email. Empty lists the most used servers.",
                "type": "string"
              },
              "remote_only": {
                "description": "Only hosted servers with a remote URL, no local install.",
                "type": "boolean"
              },
              "response_format": {
                "description": "json (default) or markdown for a human-readable text block. structuredContent is always JSON.",
                "enum": ["json", "markdown"],
                "type": "string"
              },
              "verified_only": {
                "description": "Only servers that passed the live health check.",
                "type": "boolean"
              },
              "voice_ready": {
                "description": "Only servers suited to voice agents.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "type": "integer"
              },
              "hint": {
                "type": "string"
              },
              "next_cursor": {
                "type": ["string", "null"]
              },
              "query": {
                "type": "string"
              },
              "servers": {
                "items": {
                  "properties": {
                    "added_at": {
