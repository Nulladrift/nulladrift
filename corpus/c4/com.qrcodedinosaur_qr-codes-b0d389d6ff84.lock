{
  "lockfileVersion": 2,
  "subjects": {
    "com.qrcodedinosaur/qr-codes": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://qrcodedinosaur.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "QRCodeDinosaur.com",
        "title": "QR Code Dinosaur QR codes",
        "version": "1.0.1",
        "websiteUrl": "https://qrcodedinosaur.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Create QR codes for any URL at QRCodeDinosaur.com. Creating codes is free and needs no account.\nPro ($9/month) adds full scan history and changing where a code points after it is printed. Nothing here charges money: start_pro_subscription only returns a checkout link the user opens and pays through themselves. Tell the user the price before giving them the link.\nWithout an API key, codes belong to no one until the user opens the claimUrl that create_qr_code returns. An API key (Authorization: Bearer qrcd_..., ask hello@qrcodedinosaur.com) files codes under its owner and is needed for update_destination.",
      "tools": [
        {
          "name": "create_qr_code",
          "title": "Create a QR code",
          "description": "Free. Creates a QR code for a URL and returns a hosted PNG (imageUrl), optional SVG markup, and for \"direct\" codes a pageUrl your user can open to view and download it. Use variant \"redirect\" for a code that counts scans and, with Pro, can be pointed somewhere else later. Without an API key the result has a claimUrl: give it to your user so the code is added to their QR codes (it works for 30 days). Unsafe or non-public links are refused.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "format": {
                "description": "\"png\" (default) returns a hosted PNG. \"svg\" also returns the SVG markup.",
                "enum": ["png", "svg"],
                "type": "string"
              },
              "url": {
                "description": "Where the QR code should send people. https:// is added if no scheme is given.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              },
              "variant": {
                "description": "\"direct\" (default) encodes the URL itself. \"redirect\" encodes a scan link that counts scans and can be changed later with Pro.",
                "enum": ["direct", "redirect"],
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:70c9c5b4848edca7911d08d713689b253c2f4bb552fd9c59e9be2e1f7e8e88ff"
        },
        {
          "name": "get_plan_status",
          "title": "Get plan status",
          "description": "Free. With an API key, whether the key's owner has Pro and when it renews. Without one, what the free and Pro plans include and cost (Pro is $9/month).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:57e7b75d756513d42934b9d455a027d7e1120e2d09164ffd7cc6c8d3b81321fc"
        },
        {
          "name": "get_scan_analytics",
          "title": "Get scan analytics",
          "description": "Free. How many times a QR code was scanned, in total and per day. Only \"redirect\" codes count scans. If the code's owner is on the free plan, only the last 7 days are included; Pro ($9/month) keeps the full history.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "QR code ID from create_qr_code, e.g. \"QR-ABCD1234EF\".",
                "maxLength": 50,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a5a3cda9afa0c957a709e6c82843b85ea98c7087e8e4485d3d77f11096083f03"
        },
        {
          "name": "start_pro_subscription",
          "title": "Get a Pro checkout link",
          "description": "Pro costs $9/month. This tool charges nothing: it returns a checkoutUrl for your user to open and pay through with Stripe in their own browser. Tell them the price first. Without an API key, Pro goes to the browser that opens the link and covers every QR code in it, including ones they add with a claimUrl. With a key, it subscribes the key's owner. Cancelling is done by the person on the site.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "email": {
                "description": "Your user's email, filled in at checkout for them.",
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a84bcde3c925134bcc5d2973d8f50b24381508a45a804b807048391e95608402"
        },
        {
          "name": "update_destination",
          "title": "Change where a QR code points",
          "description": "Pro only ($9/month), and needs an API key whose owner has Pro and owns the code. Points a \"redirect\" QR code at a new URL without reprinting it. Without a key, tell your user they can do this on QRCodeDinosaur.com after claiming the code and subscribing (see start_pro_subscription).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "QR code ID, e.g. \"QR-ABCD1234EF\". Must be a \"redirect\" code to have any effect on scans.",
                "maxLength": 50,
                "minLength": 1,
                "type": "string"
              },
              "url": {
                "description": "The new destination, an http or https URL.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8e13024bdb9424066cf9b4d2ddf980a344526106111bca793b550e8057aa1a33"
        }
      ],
      "digest": "sha256:aad9bf86a97348dd04e728c486eaa209e8baf4b715e3b2518d6f30c355fffc66"
    }
  }
}
