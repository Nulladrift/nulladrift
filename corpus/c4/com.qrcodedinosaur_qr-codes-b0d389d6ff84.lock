      },
      "transport": {
        "type": "http",
        "url": "https://qrcodedinosaur.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "QRCodeDinosaur.com",
        "title": "QR Code Dinosaur QR codes",
        "version": "1.0.9",
        "websiteUrl": "https://qrcodedinosaur.com",
        "icons": [
          {
            "src": "https://qrcodedinosaur.com/icon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          },
          {
            "src": "https://qrcodedinosaur.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://qrcodedinosaur.com/qr-code-dinosaur-logo-1024.png",
            "mimeType": "image/png",
            "sizes": ["1024x1024"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Creates QR codes for URLs on QRCodeDinosaur.com and reports how often they are scanned. Creating codes is free and needs no account.\ncreate_qr_code, get_scan_analytics, get_plan_status and start_pro_subscription work without an API key. update_destination is listed only when the request carries an API key.\nWithout an API key, a new code has no owner until someone opens the claimUrl in the create_qr_code result. With a key (sent as Authorization: Bearer qrcd_...; keys are issued by hello@qrcodedinosaur.com), codes belong to the key's owner.\nPro costs $9/month. update_destination requires it, and it keeps the full scan history; without Pro, scan analytics cover the last 7 days.\nNo tool takes payment. start_pro_subscription is free to call: it returns the Pro price and a link to a Stripe checkout page, and a subscription starts only if a person opens the link and completes checkout.",
      "tools": [
        {
          "name": "create_qr_code",
          "title": "Create a QR code",
          "description": "Free. Creates a scannable QR code from a website URL, such as a restaurant menu, event page, business website or product link, with no account or API key required. Encodes the URL as a QR symbol and returns the PNG image, a hosted copy of it (imageUrl), the SVG markup when format is \"svg\", and for \"direct\" codes a pageUrl where the code can be viewed and downloaded for sharing or printing. Requires a destination URL; supports public HTTP/HTTPS links, not Wi-Fi credentials, contact cards, arbitrary text or decoding an existing QR image. \"redirect\" codes encode a scan link (scanUrl) that counts scans, and their destination can be changed later by an owner with Pro. Without an API key the result includes a claimUrl, valid for 30 days, that adds the code to the QR codes of whoever opens it on QRCodeDinosaur.com. Unsafe links and links to private or internal hosts are refused with an error that names the reason.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "format": {
                "description": "\"png\" (default) returns a hosted PNG. \"svg\" also returns the SVG markup.",
                "enum": ["png", "svg"],
                "type": "string"
              },
              "url": {
                "description": "Destination website URL to encode, e.g. https://example.com/menu. Required; https:// is added if no scheme is given.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              },
              "variant": {
                "description": "\"direct\" (default) encodes the URL itself. \"redirect\" encodes a scan link that counts scans and whose destination can be changed later.",
                "enum": ["direct", "redirect"],
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a QR code"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:274755b00fd0ea1c03931e8afe3f5e6c0cc16e5034af38248c84bccee2ca0e02"
        },
        {
          "name": "get_plan_status",
          "title": "Get plan status",
          "description": "Free. With an API key, returns whether the key's owner has Pro, the subscription status and when the current period ends. Without a key, returns what the free and Pro plans include and the Pro price ($9/month).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get plan status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:bd895c925276b13cc72e2327cbb01c70418f1ca05ca035a00e065dc878ecadc5"
        },
        {
          "name": "get_scan_analytics",
          "title": "Get scan analytics",
          "description": "Free. Returns how many times a QR code was scanned, in total and per UTC day. Only \"redirect\" codes record scans. Needs no API key: the counts for a code can be read by anyone with its ID. If the code's owner does not have Pro ($9/month), only the last 7 days are included (historyDays in the result); with Pro, the full history is.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "QR code ID from create_qr_code, e.g. \"QR-ABCD1234EF\".",
                "maxLength": 50,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get scan analytics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:08f8ee9d04a0c5ab3823e6a3083f3210e9536f29c1e88e4998b0594c8e648c31"
        },
        {
          "name": "start_pro_subscription",
          "title": "Get a Pro checkout link",
          "description": "Pro costs $9/month. Returns a checkoutUrl for the Pro subscription, with the plan and its price. Getting the link is free: it charges nothing and changes no account; a subscription starts only if a person opens the link and completes Stripe checkout in their browser. Without an API key, Pro applies to the browser that completes checkout, including codes added to it with a claimUrl; with a key, it applies to the key's owner. If the key's owner already has Pro, returns alreadyPro: true and no link.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "email": {
                "description": "Email to fill in on the checkout page.",
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a Pro checkout link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6d5264fe0b4896b2a54d9dacb75d13b37b0d0b29e432643fa4f1fe5ab96c4306"
        }
      ],
      "digest": "sha256:756729bc6695fa775c11d8203ac1e81c5377842dfedb6e2e9328f6d0e8addcbd"
    }
  }
