        {
          "name": "run_public_task",
          "title": "공식 데이터 작업 실행",
          "description": "공식 출처를 읽어 수치·기준 기간·단위·원문 URL·조회 시각·계산 방법을 JSON으로 반환합니다. taskId: us-cpi(미국 전체 CPI 전년 대비), exchange-rates(base/quote 통화), gdp-growth(countries ISO3 2~6개). 최신 가용 자료만 지원합니다. 연간/월간, 참고 환율/실시간 환율을 혼동하지 마세요. 결측·접속 실패는 완료로 표시하지 않습니다. 키 없이 무료이며 캐시를 이용합니다. 범용 웹 브라우저나 주문·결제 기능이 아닙니다.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
