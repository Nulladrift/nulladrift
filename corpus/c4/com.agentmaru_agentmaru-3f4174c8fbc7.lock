          "description": "Find a supported task: US CPI, ECB exchange rates, annual GDP, HARPEX container charter rates, Korean company export estimates (current KED PER candidates only). 한국어·영어로 관련 후보를 찾습니다. capabilities[].nextCall은 도구와 입력 예시입니다. 문장의 국가·기간·통화·선형을 자동 적용하지 않습니다. 직접 실행과 원문 조사 안내를 구분하고 한시 공개·자료 범위를 확인하세요.",
