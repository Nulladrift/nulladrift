        {
          "name": "get_access_plan",
          "title": "이용 조건·회원 작업 인계·공개 대안",
          "description": "사이트 ID로 자료별 로그인·유료 구독 조건을 확인합니다. 회원은 memberHandoff를 따라 주인이 승인한 브라우저에서 조사하고, 권한이 없으면 검증된 공개 대안을 사용하세요. 인계 안내 자체는 권한 부여가 아닙니다. materialId를 생략하면 전체, 응답에서 얻은 materialId로 특정 자료만 선택합니다. 대안의 범위·기간 차이와 재확인 여부를 읽으세요. 이 도구는 브라우저 연결·로그인·자료 조회를 수행하지 않으며 비밀번호·쿠키·토큰을 받지 않습니다.",
