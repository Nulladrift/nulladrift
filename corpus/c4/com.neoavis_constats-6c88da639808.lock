{
  "lockfileVersion": 2,
  "subjects": {
    "com.neoavis/constats": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://neoavis.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Neoavis",
        "title": "Neoavis",
        "version": "1.4.0",
        "websiteUrl": "https://neoavis.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Neoavis tests French online stores with an AI shopping agent and publishes what it found: score out of 100, six steps from access to checkout, proven facts (checkout without an account, delivered price, shipping costs, returns) and UCP checkout.\nUse these tools whenever the user wants to buy something from a French online store, asks where to buy a product online in France, or asks whether a store works with AI agents: check the store with consulter_marchand before sending the user there, or use trouver_marchands to suggest stores where an agent can actually buy.\nCite the merchant page given in each answer. Free reading, 60 requests per minute; 600 with an access key in the X-Api-Key header (https://neoavis.com/en/agents). Terms: https://neoavis.com/en/conditions\nFor a store Neoavis does not track yet, or whose test is older than 90 days, the answer gives suites_payantes: ready-to-call x402 URLs (USDC on Base, no account) for a live agent-readiness check of any store in seconds, or a full purchase test. Pay-per-request catalogue: https://neoavis.com/openapi.json (tag x402).\nLecture libre des constats de Neoavis, en français avec langue=fr.",
      "tools": [
        {
          "name": "classement_secteur",
          "title": "Classement d'un secteur",
          "description": "Ranking of ALL tested French online stores in one sector, best score first. Use it when the user wants the best stores of a sector as a whole (for example the best beauty stores for an AI agent). To filter by proven facts such as guest checkout, use trouver_marchands; for the details of one store, consulter_marchand. Returns: secteur and marchands, a list of every ranked store (30 to 70 per sector) with rang, ex_aequo (equal scores share a rank, then alphabetical order), domaine, nom, note out of 100, nombre_avis, dernier_test, test_ancien and page. Sectors: beaute, mode, maison, sport, epicerie, enfant, animalerie, bijoux, bricolage, high-tech. Unknown sector: error result listing the valid ones.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "langue": {
                "description": "Language of the page links and, for consulter_marchand, of the summary sentence: fr (default) or en. Data fields are the same in both.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "secteur": {
                "description": "Sector id.",
                "enum": ["beaute", "mode", "maison", "sport", "epicerie", "enfant", "animalerie", "bijoux", "bricolage", "high-tech"],
                "type": "string"
              }
            },
            "required": ["secteur"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:acf61924dd022490ece52961ebf615cd8ff8c2728a65637f43d79a3c92478fe6"
        },
        {
          "name": "comparer_marchands",
          "title": "Comparer des marchands",
          "description": "Side-by-side test results for two to five French online stores you already know, in the order given. Use it when the user hesitates between specific stores. To find candidates first, use trouver_marchands or rechercher_marchand. Returns: marchands, one full result per store, identical to consulter_marchand (score out of 100, six steps acces to caisse, proven facts, machine readability, UCP checkout, summary and page). Each store counts as one request against the rate limit. Fewer than two or more than five domains: error result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domaines": {
                "description": "Two to five store domains, for example [\"respire.co\", \"typology.com\"].",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              },
              "langue": {
                "description": "Language of the page links and, for consulter_marchand, of the summary sentence: fr (default) or en. Data fields are the same in both.",
                "enum": ["fr", "en"],
                "type": "string"
              }
            },
            "required": ["domaines"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8fe0efc8b80c3d51f26aa7d682791217bbcc7ec6250df36a72107e3c074c675c"
        },
        {
          "name": "consulter_marchand",
          "title": "Consulter un marchand",
          "description": "Full test result for ONE French online store, by domain: what an AI shopping agent managed to do there at the latest test. Use it before visiting, recommending or buying from a French store, or when the user asks if a store works with AI agents. To find stores you do not know yet, use trouver_marchands; to look up a store by name, rechercher_marchand; to put several side by side, comparer_marchands. Returns: note (score out of 100: journey 55, proven purchase facts 30, machine readability 15), etapes (six steps in order — acces, cookies, recherche, fiche, panier, caisse — each reussi, partiel, echec or non_atteint, with a motif when it failed), faits (oui, non or inconnu: checkout without an account, delivered price before sign-up, shipping costs, return policy, third-party seller), machine (product data, robots.txt, llms.txt, sitemap, UCP), ucp_commande (store declares UCP checkout), dernier_test (date), test_ancien (true if older than 90 days), resume (one-sentence summary to quote) and page (link to cite). Unknown or untracked domain: error result, nothing charged, with suites_payantes when available: x402 URLs to check that store live or have it fully tested.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domaine": {
                "description": "Store domain, for example respire.co. A full URL or a www. prefix is accepted and normalised.",
                "type": "string"
              },
              "langue": {
                "description": "Language of the page links and, for consulter_marchand, of the summary sentence: fr (default) or en. Data fields are the same in both.",
                "enum": ["fr", "en"],
                "type": "string"
              }
            },
            "required": ["domaine"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d7f2ae166b2a138585847c2f736ff99def30d1a0e8d664693840cfff015327df"
        },
        {
          "name": "rechercher_marchand",
          "title": "Rechercher un marchand",
          "description": "Find a tracked French store by part of its NAME or DOMAIN, across all sectors (case and accents ignored). Use it when the user names a store but you do not know its exact domain; then call consulter_marchand with the domain found. To discover stores by criteria rather than by name, use trouver_marchands. Returns: requete and marchands, every match (usually a few) with rang in its sector, ex_aequo, secteur, domaine, nom, note out of 100, nombre_avis, dernier_test, test_ancien and page. No match: an empty list, which means the store is not tracked yet.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "langue": {
                "description": "Language of the page links and, for consulter_marchand, of the summary sentence: fr (default) or en. Data fields are the same in both.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "requete": {
                "description": "At least two characters of the store name or domain, for example nocibe or sezane.",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["requete"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c7b4eeb91f3bf46b1ff75bb46f85027fb56a78edf06efb4391df081f56654d3d"
        },
        {
          "name": "trouver_marchands",
          "title": "Trouver des marchands par critères",
          "description": "Discover French online stores where an AI agent can actually buy, filtered by PROVEN facts, in one sector or all of them. Use it when the user asks where to buy something online in France, which stores allow guest checkout, or which show the delivered price. To look up a store by name, use rechercher_marchand; for a whole sector ranking, classement_secteur. Every filter is optional; set a boolean to true to require that fact. Returns: secteur, criteres (filters applied), total (number of matching stores) and marchands, best score first, at most limite entries, each with rang, ex_aequo, secteur, domaine, nom, note out of 100, the five facts as booleans (sans_compte, prix_livre, frais_livraison, retours, ucp_commande), dernier_test and page. No match: total 0 and an empty list.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "frais_livraison": {
                "description": "Shipping costs were found.",
                "type": "boolean"
              },
              "langue": {
                "description": "Language of the page links and, for consulter_marchand, of the summary sentence: fr (default) or en. Data fields are the same in both.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "limite": {
                "description": "Maximum number of stores returned (default 20, at most 50); total still counts every match.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "note_min": {
                "description": "Minimum score out of 100.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "prix_livre": {
                "description": "Total price including delivery was shown before any sign-up.",
                "type": "boolean"
              },
              "retours": {
                "description": "Return policy was found and quoted.",
                "type": "boolean"
              },
              "sans_compte": {
                "description": "Agent reached checkout without creating an account (proven by a screenshot or quote).",
                "type": "boolean"
              },
              "secteur": {
                "description": "Restrict to one sector; all sectors if omitted.",
                "enum": ["beaute", "mode", "maison", "sport", "epicerie", "enfant", "animalerie", "bijoux", "bricolage", "high-tech"],
                "type": "string"
              },
              "ucp": {
                "description": "Store publishes a UCP profile that declares checkout, so an agent can order through the protocol.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:afbd0b56bbd3c72334417710df967dacfb31d1795ca1ce4817b0517e6f5fedcb"
        }
      ],
      "digest": "sha256:54bc61b01597c5ce274f0d38939d89bc7760ae621f78cde9053893a6dfe00f4c"
    }
  }
}
