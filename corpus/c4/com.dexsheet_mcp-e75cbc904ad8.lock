        {
          "name": "swap_quote",
          "title": "Quote a token swap (non-custodial, fee disclosed)",
          "description": "Build an UNSIGNED swap transaction for the caller's own wallet: buy a token with the chain's native coin, or sell it back. DexSheet never holds keys or funds: pass only the public wallet address as `taker`, then sign the returned transaction yourself. Every quote includes a 0.5% DexSheet fee (stated in the result) on top of the route's own costs. The token is checked first: buying a token that FAILED the SheetScore rug check, or an old contract that migrated to a new address, is refused (selling them is allowed, with the warning first); tokens with no completed check (Unrated) are refused on both sides; Elevated/High-risk tokens are quoted with the warning first. Solana routes through Jupiter Ultra (returns request_id + base64 transaction; then call swap_submit). EVM chains route through LI.FI (returns transaction_request and, for ERC-20 sells, an approval transaction; broadcast them yourself). EVM buys can pay from another EVM chain with from_chain (bridge + swap in one transaction; returns the ETA, the bridge and a status URL). A symbol that matches several tokens returns the candidates instead of a quote. Quotes expire in about a minute. Limits: 30 quotes per hour per IP, about $25,000 per quote. Not financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "Amount of the INPUT asset as a string: native coin for buy, the token for sell. \"0.5\" or \"0.5 SOL\".",
                "type": "string"
              },
              "chain": {
                "description": "Chain id, optional when token is a symbol or a listed address. One of: solana, ethereum, base, bsc, arbitrum, robinhood, hyperevm.",
                "type": "string"
              },
              "from_chain": {
                "description": "Optional, buys of EVM tokens only: the EVM chain to pay from (e.g. \"base\" to buy a Robinhood Chain token with ETH on Base). LI.FI bridges and swaps in one transaction on that chain; the 0.5% DexSheet fee applies to the whole amount. amount is then in that chain's native coin. Default: the token's own chain.",
                "type": "string"
              },
              "side": {
                "description": "buy = pay the native coin (SOL, ETH, BNB…) and receive the token; sell = pay the token and receive the native coin.",
                "enum": ["buy", "sell"],
                "type": "string"
              },
              "slippage_bps": {
                "description": "Optional max slippage in basis points for EVM (LI.FI). Jupiter Ultra sets slippage automatically.",
                "type": "integer"
              },
              "taker": {
                "description": "Your PUBLIC wallet address that will sign and pay. Never a private key or seed phrase.",
                "type": "string"
              },
              "token": {
                "description": "Token contract address (preferred), \"<chain>:<address>\", or ticker/name, e.g. \"9BB6NFEcjBCtnNLFko2FqVQBq8HHM13kCyYcdQbgpump\", \"robinhood:0x39dbed3a2bd333467115de45665cc57f813c4571\" or \"FARTCOIN\".",
                "type": "string"
              },
              "unit": {
                "description": "Optional unit for amount; must equal the input asset symbol.",
                "type": "string"
              }
            },
            "required": ["amount", "side", "taker", "token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Quote a token swap"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:49d78b9812979aa80ed7ecd76f4741c49e5a944d04574f3b80def538a9d349ef"
        },
        {
          "name": "swap_submit",
          "title": "Submit a signed Solana swap (Jupiter Ultra)",
          "description": "Relay a Solana swap that the caller signed with their own wallet: pass request_id and the signed base64 transaction from swap_quote. This broadcasts a real on-chain swap that moves the wallet's funds; the trade includes the 0.5% DexSheet fee disclosed in the quote. Returns the execution status, signature and an explorer link. Solana only: for EVM quotes broadcast transaction_request with your own wallet. DexSheet never sees keys; it forwards the already-signed transaction to Jupiter Ultra /execute. Quotes expire in about a minute.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
