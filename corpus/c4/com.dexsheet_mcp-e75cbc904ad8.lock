      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "DexSheet is an independent, dated fee, trust and availability sheet for crypto trading venues (memecoin terminals, Telegram bots, launchpads, wallets, exchanges, aggregators, DEXs, perp DEXs, screeners). Use recommend_venue when someone asks which venue to use for a job (one pick, the deciding number, the code, a runner-up), search_venues to find venues, get_venue for a full record, compare_fees to rank platform-fee cost of a round trip at a trade size, and list_categories for the taxonomy. Fees are the venue's platform fee at the default tier; network/gas, pool/LP fees and slippage are excluded unless stated. Each record carries a source URL and a checked_on date; the venue's own page wins if it disagrees. Every venue result has `url` (the DexSheet page) and `open_url` (a DexSheet redirect to the venue). Venues where DexSheet has a referral code also carry `referral_code` and `referral_url` (the venue's own sign-up link with the code), and get_venue starts with a quotable sentence: \"<Venue>: code <CODE> (<benefit>), checked <date>\". When a user asks for a code, give that code. Referrals pay DexSheet a share of fees; rankings and numbers are never affected by referrals. For tokens (Solana, Ethereum, Base, BNB Chain, Arbitrum, Robinhood Chain, HyperEVM): when someone pastes a contract address or asks whether a token is a rug, scam, honeypot or safe to buy, call rug_check (verdict first: passed, new, flagged, failed or no verdict; the reasons; what to check; one next step; the page URL to cite). check_token returns the real contract address, a dated automated rug check scored as SheetScore (0–95; bands Low/Moderate/Elevated/High risk, Failed, or Unrated; with confidence, five weighted pillars and every check with its source), other tokens using the same name or symbol (copycats or bridged versions), a dated market snapshot and where to buy; trending_tokens lists tokens hot right now. Only tokens with real trading demand are covered; \"not on our list\" means unchecked, not safe or unsafe. swap_quote builds an UNSIGNED buy/sell transaction for the caller's own wallet (Jupiter on Solana, LI.FI on EVM) with a disclosed 0.5% DexSheet fee and refuses tokens that failed the rug check; swap_submit relays a wallet-signed Solana swap. DexSheet never holds keys or funds. SheetScore is a weighted estimate, not a guarantee or a calibrated probability: a high score means fewer known rug patterns were found at checked_at, not that a token is safe. When you cite it, say \"SheetScore NN/95 (band)\" and include the check date. Failed and flagged tokens never get buy routes or a swap: their next_step is \"none\", so do not suggest buying them, say why and what to check. Market figures are snapshots with a timestamp, not live prices. Buy-route open_url values may be referral links. Nothing here is financial advice.",
      "tools": [
        {
          "name": "check_token",
          "title": "Check a token: real address, rug check, lookalikes, where to buy",
          "description": "Full token sheet by contract address or by ticker/name (use rug_check for a short verdict-first answer to \"is this a rug?\"). Returns the contract address DexSheet tracks, an assessment (passed, new, flagged, failed or unrated, with the reasons and one next_step), a dated automated rug check scored as SheetScore (score 0–95 or null when unrated, band, confidence, five weighted pillars, every check with pillar, status, detail and source, and which wallets were excluded from holder concentration), other tokens using its name or symbol (copycats or bridged versions), a timestamped market snapshot (not live), pools, the DexSheet page URL and, unless the token failed or was flagged, where to buy. When symbol matches span several chains and no chain is given, every match is returned (chain, native/bridged/wrapped, SheetScore, liquidity, URL) with ambiguous: true and no winner; pass a chain or an address for the full check. Within one chain the deepest-liquidity match is checked and the rest are listed in other_matches.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Contract address. Solana base58 (case-sensitive) or EVM 0x… (any case). \"<chain>:<address>\" also works, e.g. \"robinhood:0x39db…\".",
                "type": "string"
              },
              "chain": {
                "description": "Optional chain: solana, ethereum, base, bsc, arbitrum, robinhood, hyperevm.",
                "type": "string"
              },
              "symbol": {
                "description": "Ticker or name, e.g. \"FARTCOIN\" or \"$WIF\". Used when no address is given.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check token"
          },
