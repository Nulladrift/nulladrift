          "digest": "sha256:6f9f58b4ecbc39782cc5c12b4ec21bbd6d0afdbc63cdd883b85c7d34c16e8839"
        },
        {
          "name": "compare_fees",
          "title": "Compare round-trip platform fees",
          "description": "Compute the platform-fee cost in USD of a buy plus sell round trip at a given trade size for spot-comparable venues (terminal, telegram-bot, launchpad, wallet, exchange, aggregator with a published round trip), sorted cheapest first. Network/gas fees, pool/LP fees and slippage are excluded. For perp-dex venues (when selected by category or slugs) taker and maker fees are reported instead. Live venues only unless slugs are given explicitly.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "apply_referral_discount": {
                "default": true,
                "description": "Apply the venue's published referee fee discount (when it has a numeric one) to the platform fee. Default true.",
                "type": "boolean"
              },
              "category": {
                "description": "Compare only this category. \"perp-dex\" returns taker/maker fees.",
                "enum": ["aggregator", "dex", "exchange", "launchpad", "perp-dex", "prediction-market", "screener", "tax-tool", "telegram-bot", "terminal", "wallet"],
                "type": "string"
              },
              "size_usd": {
                "description": "Trade size in USD (one side), e.g. 1000.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "slugs": {
                "description": "Compare only these venue slugs.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["size_usd"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare fees"
          },
