        {
          "name": "recommend_venue",
          "title": "Recommend one venue for a job",
          "description": "Pick ONE venue for a job (trade memecoins, snipe, copy trade, track wallets, best swap price, perps, prediction markets, first buy with a card, wallet, launch a token, scan a token, crypto taxes), optionally on a chain, available in a country (US, UK, EU), by custody and on a phone. Returns the pick, the number that decided it (30-day usage from DefiLlama, round-trip fee, perps taker fee, or DexSheet's fewest-steps order), its referral code when DexSheet has one, and a runner-up with a factual reason to choose it instead. Uses the same filter and ranking as the dexsheet.com/best/ pages; referrals never change the ranking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "Optional chain, e.g. \"solana\", \"base\", \"bnb\", \"ethereum\", \"arbitrum\", \"robinhood-chain\", \"hyperliquid\".",
                "type": "string"
              },
              "country": {
                "description": "Optional country: US, UK or an EU country (availability is tracked for these). Venues with unverified availability there are left out; partly available ones are flagged.",
                "type": "string"
              },
              "custody": {
                "description": "\"self\" = non-custodial only; \"embedded_ok\" = non-custodial or an embedded wallet; \"any\" (default).",
                "enum": ["self", "embedded_ok", "any"],
                "type": "string"
              },
              "job": {
                "description": "What the person wants to do.",
                "enum": ["trade_memecoins", "snipe", "copy_trade", "track_wallets", "swap_best_price", "perps", "predict", "first_buy_with_card", "wallet", "launch_token", "scan_token", "crypto_taxes"],
                "type": "string"
              },
              "mobile": {
                "description": "true = must work on a phone (iOS app, Android app or Telegram bot).",
                "type": "boolean"
              },
              "prefer": {
                "description": "Override the ranking: \"popular\" = 30-day usage, \"cheapest\" = lowest fee. Default: the job's own /best/ ranking.",
                "enum": ["popular", "cheapest"],
                "type": "string"
              }
            },
            "required": ["job"],
            "type": "object"
          },
