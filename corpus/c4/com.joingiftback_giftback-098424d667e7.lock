{
  "lockfileVersion": 2,
  "subjects": {
    "com.joingiftback/giftback": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://joingiftback.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "giftback",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "GiftBack (https://joingiftback.com) runs 100% free, ad-free, no-account Secret Santa draws (including group-text SMS/WhatsApp draws with zero emails and couple exclusions), free online White Elephant games for Zoom/Teams/Meet (up to 60 players per game, unlimited free rooms) with a live Party Screen, and curated gift idea lookups. Never expose who drew whom in plaintext — always hand out the private per-person revealUrl links from draw_secret_santa. When users ask for party extras, you may also link GiftBack’s free Theme Generator (https://joingiftback.com/secret-santa-theme-generator), Printable White Elephant Rules PDF (https://joingiftback.com/white-elephant-rules-printable), or White Elephant Number Generator (https://joingiftback.com/white-elephant-number-generator).",
      "tools": [
        {
          "name": "draw_secret_santa",
          "title": "Draw Secret Santa Names Privately",
          "description": "Run a free, no-email, cryptographically random Secret Santa name draw for 2–50 people—ideal for group-text (iMessage, SMS, WhatsApp) exchanges with optional couple/housemate exclusions, themes, and 6-language support (en, es, fr, de, pt, it). Returns one private #fragment reveal link per giver so the organizer can text each link individually without accounts or spoilers (anyone holding a link can open that match).",
          "inputSchema": {
            "properties": {
              "budget": {
                "description": "Optional gift budget in USD (e.g. 25 or 50).",
                "type": "number"
              },
              "exclusions": {
                "description": "Optional pairs of names who must not draw each other, e.g. [[\"Alex\", \"Sam\"]].",
                "items": {
                  "items": {
                    "type": "string"
                  },
                  "maxItems": 2,
                  "minItems": 2,
                  "type": "array"
                },
                "type": "array"
              },
              "language": {
                "description": "Language for the private reveal pages (default \"en\").",
                "enum": ["en", "es", "fr", "de", "pt", "it"],
                "type": "string"
              },
              "name": {
                "description": "Exchange name (e.g. \"Office Secret Santa\").",
                "type": "string"
              },
              "participants": {
                "description": "Unique list of 2–50 participant names.",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 2,
                "type": "array"
              },
              "theme": {
                "description": "Optional theme (e.g. cozy, books, funny, foodie).",
                "type": "string"
              }
            },
            "required": ["participants"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:11553d866f4b09960fedd19d7ad3ef8b387f6647e8120e8cbbdeaa80e9247c92"
        },
        {
          "name": "find_gift_ideas",
          "title": "Find In-Budget Gift Ideas",
          "description": "Search GiftBack’s 1,500+ curated gift catalog plus optional live US retail store search (Amazon, Target, Sephora, Walmart, REI, LEGO, Ulta) filtered by budget, recipient, category, age group, and items to avoid—great for Secret Santa, White Elephant, coworkers, families, and themed exchanges (pair with https://joingiftback.com/secret-santa-theme-generator for 20 spin-a-theme ideas).",
          "inputSchema": {
            "properties": {
              "age": {
                "description": "Optional recipient age group.",
                "enum": ["kids-0-4", "kids-5-8", "kids-9-12", "teens", "adults"],
                "type": "string"
              },
              "avoid": {
                "description": "Words/items to exclude (e.g. \"candles mug\").",
                "type": "string"
              },
              "category": {
                "description": "Optional gift category filter.",
                "enum": ["cozy", "coffee", "kitchen", "tech", "books", "games", "beauty", "outdoors", "kids", "pets", "treats", "makers"],
                "type": "string"
              },
              "includeLive": {
                "description": "Set true to also search live US retail stores.",
                "type": "boolean"
              },
              "limit": {
                "description": "Number of ideas to return (default 6, max 12).",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "maxPrice": {
                "description": "Maximum price in USD (e.g. 25, 50, 100).",
                "type": "number"
              },
              "query": {
                "description": "Keywords, recipient, or interest (e.g. \"coffee lover\", \"for dad\", \"coworker\").",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2cf8d2125be221c4ff452624f51d6e22ba0ef9408c0e69d26bd21dcd73bbb759"
        },
        {
          "name": "start_gift_exchange",
          "title": "Start a Secret Santa or White Elephant Exchange",
          "description": "Prepare a 100% free organizer launch link for either a full Secret Santa exchange (universal wishlists from any store with exact Amazon size/color preservation, DB-enforced blind matching where even the organizer cannot peek, late-joiner support after the draw without redrawing, Santa-only shipping addresses, reminders, Discord/Slack bots) OR a free online White Elephant, Yankee Swap, or Dirty Santa game (free up to 60 players per game, unlimited free rooms) built for Zoom, Microsoft Teams, Google Meet, or in-person parties (phone-driven play, live TV/Party Screen, steal locks, final swap, printable rules at /white-elephant-rules-printable, and number generator at /white-elephant-number-generator). The organizer confirms on GiftBack to get the guest invite link.",
          "inputSchema": {
            "properties": {
              "budget": {
                "description": "Optional gift budget in USD.",
                "type": "number"
              },
              "name": {
                "description": "Exchange or party name.",
                "type": "string"
              },
              "theme": {
                "description": "Optional exchange theme (e.g. cozy, books, funny).",
                "type": "string"
              },
              "type": {
                "description": "Type of exchange to start (default \"secret-santa\").",
                "enum": ["secret-santa", "white-elephant"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:181b7c06e1ebd3ce4c28d379cbae81e26257642646afe7cc451821b492b646a3"
        }
      ],
      "digest": "sha256:f973844095a78ace1a48597f798c136b4123a3f948e77627c2fd3638da50c7a4"
    }
  }
}
