          },
          "digest": "sha256:11553d866f4b09960fedd19d7ad3ef8b387f6647e8120e8cbbdeaa80e9247c92"
        },
        {
          "name": "draw_white_elephant_order",
          "title": "Draw White Elephant / Yankee Swap / Dirty Santa Turn Order",
          "description": "Instantly draw a cryptographically fair White Elephant, Yankee Swap, or Dirty Santa turn order for 2–60 unique players with zero accounts or paywalls. Returns a numbered turn order, official rule summary (Player #1 opens first and gets one final swap when enabled; default 3 steals before a gift locks, no immediate steal-back), plus ready-to-use links for GiftBack’s free live online game (/white-elephant, up to 60 players per game, unlimited free rooms), number generator (/white-elephant-number-generator), and printable rules PDF (/white-elephant-rules-printable).",
          "inputSchema": {
            "properties": {
              "budget": {
                "description": "Optional gift budget in USD (e.g. 25 or 50).",
                "type": "number"
              },
              "finalSwap": {
                "description": "Whether Player #1 gets one final swap at the end of the game (default true).",
                "type": "boolean"
              },
              "gameName": {
                "description": "Optional game or party name (default \"White Elephant\").",
                "maxLength": 60,
                "type": "string"
              },
              "players": {
                "description": "Unique list of 2–60 player names.",
                "items": {
                  "type": "string"
                },
                "maxItems": 60,
                "minItems": 2,
                "type": "array"
              },
              "variant": {
                "description": "Game variant label (default \"white-elephant\").",
                "enum": ["white-elephant", "yankee-swap", "dirty-santa"],
                "type": "string"
              }
            },
            "required": ["players"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:db15ca489a56000e46fa54929ec833a5aace4317a092c4bd8534035cb39a1c89"
        },
        {
          "name": "find_gift_ideas",
          "title": "Find In-Budget Gift Ideas",
          "description": "Search GiftBack’s 1,500+ curated gift catalog plus optional live US retail store search (Amazon, Target, Sephora, Walmart, REI, LEGO, Ulta) filtered by budget, recipient, category, age group, and items to avoid—great for Secret Santa, White Elephant, coworkers, families, and themed exchanges (pair with https://joingiftback.com/secret-santa-theme-generator for 20 spin-a-theme ideas).",
          "inputSchema": {
            "properties": {
              "age": {
                "description": "Optional recipient age group.",
                "enum": ["kids-0-4", "kids-5-8", "kids-9-12", "teens", "adults"],
                "type": "string"
              },
              "avoid": {
                "description": "Words/items to exclude (e.g. \"candles mug\").",
                "type": "string"
              },
              "category": {
                "description": "Optional gift category filter.",
                "enum": ["cozy", "coffee", "kitchen", "tech", "books", "games", "beauty", "outdoors", "kids", "pets", "treats", "makers"],
                "type": "string"
              },
              "includeLive": {
                "description": "Set true to also search live US retail stores.",
                "type": "boolean"
              },
              "limit": {
                "description": "Number of ideas to return (default 6, max 12).",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "maxPrice": {
                "description": "Maximum price in USD (e.g. 25, 50, 100).",
                "type": "number"
              },
              "query": {
                "description": "Keywords, recipient, or interest (e.g. \"coffee lover\", \"for dad\", \"coworker\").",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
