            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2cf8d2125be221c4ff452624f51d6e22ba0ef9408c0e69d26bd21dcd73bbb759"
        },
        {
          "name": "plan_wedding_registry_budget",
          "title": "Plan Wedding Registry Cash-Fund Fees & Budget Savings",
          "description": "Calculate exact 2026 wedding cash-fund fees across 6 major registries—GiftBack ($0), Zola (2.5%), The Knot (2.5%), Blueprint Registry (2.5% + optional 2.5% early-withdrawal penalty), WithJoy (3.5%), and Honeyfund (3.5% + $0.59/guest)—plus a suggested Honeymoon/Home fund split, private noindex guarantee, and links to /wedding-registry and /research/wedding-cash-fund-fee-audit.",
          "inputSchema": {
            "properties": {
              "early_withdrawal": {
                "description": "Set true if the couple plans to withdraw cash before the wedding date (adds Blueprint Registry’s extra 2.5% penalty; default false).",
                "type": "boolean"
              },
              "guest_count": {
                "description": "Estimated number of contributing guests (used to calculate Honeyfund’s $0.59/guest fee, e.g. 80).",
                "maximum": 2000,
                "minimum": 1,
                "type": "integer"
              },
              "total_fund_usd": {
                "description": "Target total wedding cash fund in USD (e.g. 10000).",
                "maximum": 500000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["guest_count", "total_fund_usd"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eeac7838740e53d6e00db9467c807f3ec127e2ea109b80a4e7543dccbfd405d9"
        },
        {
          "name": "start_gift_exchange",
          "title": "Start a Secret Santa or White Elephant Exchange",
          "description": "Prepare a 100% free organizer launch link for either a full Secret Santa exchange (universal wishlists from any store with exact Amazon size/color preservation, DB-enforced blind matching where even the organizer cannot peek, late-joiner support after the draw without redrawing, Santa-only shipping addresses, reminders, Discord/Slack bots) OR a free online White Elephant, Yankee Swap, or Dirty Santa game (free up to 60 players per game, unlimited free rooms) built for Zoom, Microsoft Teams, Google Meet, or in-person parties (phone-driven play, live TV/Party Screen, steal locks, final swap, printable rules at /white-elephant-rules-printable, and number generator at /white-elephant-number-generator). The organizer confirms on GiftBack to get the guest invite link.",
          "inputSchema": {
            "properties": {
              "budget": {
                "description": "Optional gift budget in USD.",
                "type": "number"
              },
              "name": {
                "description": "Exchange or party name.",
                "type": "string"
              },
              "theme": {
                "description": "Optional exchange theme (e.g. cozy, books, funny).",
                "type": "string"
              },
              "type": {
                "description": "Type of exchange to start (default \"secret-santa\").",
                "enum": ["secret-santa", "white-elephant"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
