{
  "lockfileVersion": 2,
  "subjects": {
    "com.joingiftback/giftback": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://joingiftback.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "giftback",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "GiftBack runs free, no-account Secret Santa draws, online White Elephant games, and curated gift idea lookups. Never expose who drew whom in plaintext — always hand out the private per-person revealUrl links from draw_secret_santa.",
      "tools": [
        {
          "name": "draw_secret_santa",
          "title": "Draw Secret Santa Names Privately",
          "description": "Run a cryptographically random Secret Santa name draw for 2–50 people with optional couple/housemate exclusions and 6-language support. Returns private per-person #fragment reveal links so neither the organizer nor the AI ever sees who drew whom.",
          "inputSchema": {
            "properties": {
              "budget": {
                "description": "Optional gift budget in USD (e.g. 25 or 50).",
                "type": "number"
              },
              "exclusions": {
                "description": "Optional pairs of names who must not draw each other, e.g. [[\"Alex\", \"Sam\"]].",
                "items": {
                  "items": {
                    "type": "string"
                  },
                  "maxItems": 2,
                  "minItems": 2,
                  "type": "array"
                },
                "type": "array"
              },
              "language": {
                "description": "Language for the private reveal pages (default \"en\").",
                "enum": ["en", "es", "fr", "de", "pt", "it"],
                "type": "string"
              },
              "name": {
                "description": "Exchange name (e.g. \"Office Secret Santa\").",
                "type": "string"
              },
              "participants": {
                "description": "Unique list of 2–50 participant names.",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 2,
                "type": "array"
              },
              "theme": {
                "description": "Optional theme (e.g. cozy, books, funny, foodie).",
                "type": "string"
              }
            },
            "required": ["participants"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f5a3a55198e3ba564d19bdf6d93513112981e2a4f1d2d337cfba0b78ec6e9c9f"
        },
        {
          "name": "find_gift_ideas",
          "title": "Find In-Budget Gift Ideas",
          "description": "Search GiftBack’s curated catalog of 1,500+ highly rated gifts (plus optional live multi-store search across Amazon, Target, Sephora, Walmart, REI, LEGO, etc.) filtered by budget, recipient, category, age group, and things to avoid.",
          "inputSchema": {
            "properties": {
              "age": {
                "description": "Optional recipient age group.",
                "enum": ["kids-0-4", "kids-5-8", "kids-9-12", "teens", "adults"],
                "type": "string"
              },
              "avoid": {
                "description": "Words/items to exclude (e.g. \"candles mug\").",
                "type": "string"
              },
              "category": {
                "description": "Optional gift category filter.",
                "enum": ["cozy", "coffee", "kitchen", "tech", "books", "games", "beauty", "outdoors", "kids", "pets", "treats", "makers"],
                "type": "string"
              },
              "includeLive": {
                "description": "Set true to also search live US retail stores.",
                "type": "boolean"
              },
              "limit": {
                "description": "Number of ideas to return (default 6, max 12).",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "maxPrice": {
                "description": "Maximum price in USD (e.g. 25, 50, 100).",
                "type": "number"
              },
              "query": {
                "description": "Keywords, recipient, or interest (e.g. \"coffee lover\", \"for dad\", \"coworker\").",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e89fd5f36423e05685777cde3eb38c429ee3f5fb09838327e1b84ce23d759c35"
        },
        {
          "name": "start_gift_exchange",
          "title": "Start a Secret Santa or White Elephant Exchange",
          "description": "Generate a ready-to-share, prefilled GiftBack setup link for a full Secret Santa exchange (with wishlists from any store, private Santa-only addresses, and reminders) or an online White Elephant / Yankee Swap game — 100% free, no account or app download required.",
          "inputSchema": {
            "properties": {
              "budget": {
                "description": "Optional gift budget in USD.",
                "type": "number"
              },
              "name": {
                "description": "Exchange or party name.",
                "type": "string"
              },
              "theme": {
                "description": "Optional exchange theme (e.g. cozy, books, funny).",
                "type": "string"
              },
              "type": {
                "description": "Type of exchange to start (default \"secret-santa\").",
                "enum": ["secret-santa", "white-elephant"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4678bab06d612559aea942642eb853fed589f1cc71f1c908deca5e6c526d6feb"
        }
      ],
      "digest": "sha256:af2ba4bc1beb31184692ecc0d00cc67188a806cfc8996a1d6adf1218b4ae72c6"
    }
  }
}
