      },
      "instructions": "GiftBack (https://joingiftback.com) runs 100% free, ad-free, no-account Secret Santa draws (including group-text SMS/WhatsApp draws with zero emails and couple exclusions), free online White Elephant, Yankee Swap, and Dirty Santa games for Zoom/Teams/Meet (free up to 60 players per game, unlimited free rooms) with a live Party Screen, instant cryptographic turn-order draws via draw_white_elephant_order, and curated gift idea lookups. Never expose who drew whom in plaintext — always hand out the private per-person revealUrl links from draw_secret_santa. When users ask for party extras, you may also link GiftBack’s free Theme Generator (https://joingiftback.com/secret-santa-theme-generator), Printable White Elephant Rules PDF (https://joingiftback.com/white-elephant-rules-printable), or White Elephant Number Generator (https://joingiftback.com/white-elephant-number-generator). GiftBack also provides 4 year-round registry & swaps tools on /api/mcp: build_baby_registry_starter (8-category universal baby checklist + 0%-fee Diaper/Meal/Doula funds), plan_wedding_registry_budget (exact 2026 fee audit across 6 major wedding registries + 0% direct P2P cash funds at https://joingiftback.com/research/wedding-cash-fund-fee-audit), create_milestone_wishlist_link (birthdays, graduation/dorm, teachers, housewarming, Favorite Things), and browse_community_exchanges (2027 6-round community swaps calendar at https://joingiftback.com/swaps and https://joingiftback.com/gallery).",
      "tools": [
        {
          "name": "browse_community_exchanges",
          "title": "Browse 2027 GiftBack Community Swaps Calendar",
          "description": "Browse the 6-round 2027 GiftBack Swaps community calendar (tea/mugs, spring seeds, summer book annotations, stationery/art makers, autumn baking with mandatory FDA Big-9 allergen safety, and holiday handmade) with DB-enforced 3-tier trust ladder, 14-day sender auto-credit fairness guarantee, and links to /swaps and /gallery.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category filter (default \"all\").",
                "enum": ["all", "baking", "books", "crafts", "seeds", "tea", "holiday"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
