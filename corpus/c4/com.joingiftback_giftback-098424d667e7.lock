          },
          "digest": "sha256:5db62393d5c172931b07a940a57ceb65b479e171202f5f747ff9f88eb880b775"
        },
        {
          "name": "build_baby_registry_starter",
          "title": "Build a Free Universal Baby Registry Starter Plan",
          "description": "Build a structured 8-category universal baby registry starter checklist (essentials, balanced, or deluxe) with secondhand-friendly picks, 0%-fee direct P2P Baby Cash Fund presets (Diaper, Meal Train, Postpartum Doula via Venmo/Zelle/Cash App/PayPal/Check), the honest Amazon + Target Double-Dip Hack, zero-login grandparent reserve notes, and direct links to /baby-registry and /baby-shower.",
          "inputSchema": {
            "properties": {
              "budget_tier": {
                "description": "Starter checklist depth: \"essentials\" (minimalist must-haves), \"balanced\" (default), or \"deluxe\" (complete checklist).",
                "enum": ["essentials", "balanced", "deluxe"],
                "type": "string"
              },
              "due_month": {
                "description": "Optional expected due month or season (e.g. \"July 2027\" or \"Fall 2027\").",
                "type": "string"
              },
              "include_cash_funds": {
                "description": "Include 0%-fee direct P2P Baby Cash Fund presets (Diaper, Meal Train, Postpartum Doula; default true).",
                "type": "boolean"
              },
              "open_to_secondhand": {
                "description": "Whether to highlight items great for gently used hand-me-downs (default true; excludes car seats & crib mattresses).",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ef87e9a9d29dcfe0be741fd9cfc2f76c0424de2d7f2c602d4ffa0b9e4213f385"
        },
        {
          "name": "create_milestone_wishlist_link",
          "title": "Create a Milestone or Universal Wishlist Starter Plan & Link",
          "description": "Generate curated starter wishlist ideas, polite ask-only etiquette copy, surprise-mode guidance, and direct GiftBack launch links (/wishlist?create=<occasion>) for birthdays (Kids’ Family Mode or Adult Surprise Mode), college graduation/dorm (Twin XL), teachers (printable Favorite Things + 0% class fund), housewarming, Favorite Things parties, or universal wishlists.",
          "inputSchema": {
            "properties": {
              "budget_usd": {
                "description": "Optional target gift budget in USD.",
                "maximum": 10000,
                "minimum": 1,
                "type": "number"
              },
              "occasion": {
                "description": "Wishlist or registry occasion.",
                "enum": ["birthday", "graduation", "teacher", "housewarming", "favorite-things", "general"],
                "type": "string"
              },
              "recipient_name": {
                "description": "Optional recipient name to personalize the plan summary.",
                "maxLength": 80,
                "type": "string"
              },
              "surprise_mode": {
                "description": "Keep claimed gifts hidden from the recipient (default true for adult birthdays/general; false for graduation/teacher/housewarming/favorite-things).",
                "type": "boolean"
              }
            },
            "required": ["occasion"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:512423d23307231881d9d154bc61c54ea32f0a276729566e5e48954e18898298"
        },
        {
          "name": "draw_secret_santa",
          "title": "Draw Secret Santa Names Privately",
          "description": "Run a free, no-email, cryptographically random Secret Santa name draw for 2–50 people—ideal for group-text (iMessage, SMS, WhatsApp) exchanges with optional couple/housemate exclusions, themes, and 6-language support (en, es, fr, de, pt, it). Returns one private #fragment reveal link per giver so the organizer can text each link individually without accounts or spoilers (anyone holding a link can open that match).",
          "inputSchema": {
            "properties": {
              "budget": {
                "description": "Optional gift budget in USD (e.g. 25 or 50).",
                "type": "number"
              },
              "exclusions": {
                "description": "Optional pairs of names who must not draw each other, e.g. [[\"Alex\", \"Sam\"]].",
                "items": {
                  "items": {
                    "type": "string"
                  },
                  "maxItems": 2,
                  "minItems": 2,
                  "type": "array"
                },
                "type": "array"
              },
              "language": {
                "description": "Language for the private reveal pages (default \"en\").",
                "enum": ["en", "es", "fr", "de", "pt", "it"],
                "type": "string"
              },
              "name": {
                "description": "Exchange name (e.g. \"Office Secret Santa\").",
                "type": "string"
              },
              "participants": {
                "description": "Unique list of 2–50 participant names.",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 2,
                "type": "array"
              },
              "theme": {
                "description": "Optional theme (e.g. cozy, books, funny, foodie).",
                "type": "string"
              }
            },
            "required": ["participants"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
