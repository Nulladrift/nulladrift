        {
          "name": "track_shipment",
          "title": "Track an existing shipment",
          "description": "Reads a booked Plain Freight shipment from its tracking link. Input: the tracking link from the booking email (https://plainfreight.com/track/<token>) or the bare token; the token is the credential, so only someone the customer shared the link with can read the record. Returns the shipment reference, the current stage on the 10-stage lifecycle (Booking through Delivered), shipment details and the dated event log. Read-only; changes to a booking go by email to info@plainfreight.com with the shipment reference.",
          "inputSchema": {
            "properties": {
              "tracking_link": {
                "description": "The tracking URL from the booking email (https://plainfreight.com/track/<token>), or the token by itself",
                "type": "string"
              }
            },
            "required": ["tracking_link"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "carrier": {
