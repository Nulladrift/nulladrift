        },
        {
          "name": "generate_offer",
          "title": "Quote a China to USA shipment",
          "description": "Prices a real shipment from China to a US address, 100 g to 2,000 kg, on Plain Freight's live pricing engine. Returns door to door prices in USD: each option covers freight, US customs clearance and delivery, and says whether US import duty is included (DDP) or paid at import. Carton dimensions affect the price: for light, bulky cargo the volumetric weight sets it. Side effects: each call records a separate quote request with Plain Freight, and if an email is given the written offer is emailed to that address once a second check settles (at most one offer email per address per day). Nothing is booked or charged. The result carries a quote_id, by which the second check's verdict can be read.",
          "inputSchema": {
            "properties": {
              "destination_zip": {
                "description": "US destination ZIP code of the shipment",
                "type": "string"
              },
              "dimensions": {
                "description": "Cartons and size, e.g. '4 cartons, 60x40x35 cm each'",
                "type": "string"
              },
              "email": {
                "description": "Optional. Address the written offer is mailed to; replying to that email is one way to book.",
                "type": "string"
              },
              "name": {
                "description": "Optional. The name to address the offer email to",
                "type": "string"
              },
              "notes": {
                "description": "Optional shipment facts: HS code, Amazon FBA requirements, delivery constraints, certifications held",
                "type": "string"
              },
              "origin": {
                "description": "Pickup city or supplier's city in China",
                "type": "string"
              },
              "product": {
                "description": "What is being shipped, e.g. 'LED desk lamps, 500 units'",
                "type": "string"
              },
              "urgency": {
                "enum": ["Not urgent", "Need best balance of cost and speed", "Urgent"],
                "type": "string"
              },
              "weight_kg": {
                "description": "Total weight in kg (0.1 to 2000)",
                "maximum": 2000,
                "minimum": 0.1,
                "type": "number"
              }
            },
            "required": ["product", "weight_kg"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "agent_review": {
                "enum": ["pending", "not_running"],
                "type": "string"
              },
              "book_url": {
                "description": "plainfreight.com booking form, prefilled with this shipment and quote",
                "type": "string"
              },
              "contact": {
                "type": "string"
              },
              "error": {
                "type": "string"
              },
              "needs_review": {
                "description": "true with empty options: prices are withheld, either until a person clears the goods or until the price for this exact shipment is confirmed (air prices from China change every few days); the price follows by email",
                "type": "boolean"
              },
              "next_step": {
                "type": "string"
              },
              "options": {
                "items": {
                  "properties": {
                    "duties_included": {
                      "description": "true when US import duty is inside the price (DDP); false when duty is paid to the government at import",
                      "type": "boolean"
                    },
                    "firm": {
                      "description": "false means an estimate confirmed before booking",
                      "type": "boolean"
                    },
                    "includes": {
                      "description": "Exactly what this price covers",
                      "type": "string"
                    },
                    "key": {
                      "description": "air, sea or express",
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "price": {
                      "description": "Price in USD for the whole shipment",
                      "type": "number"
                    },
                    "transit": {
                      "description": "Door to door transit estimate",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "questions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "quote_id": {
                "description": "Reference for the offer's second check and for booking",
                "type": ["string", "null"]
              },
              "shipment": {
                "properties": {
                  "chargeable_kg": {
                    "description": "weight the price is computed on: the greater of actual and volumetric weight",
                    "type": "number"
                  },
                  "destination_zip": {
                    "type": "string"
                  },
                  "dimensions": {
                    "type": "string"
                  },
                  "product": {
                    "type": "string"
                  },
                  "weight_kg": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "summary": {
                "type": "string"
              },
              "valid_days": {
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Quote a China to USA shipment"
          },
          "behavior": {
