      },
      "capabilities": {
        "resources": {},
        "tools": {}
      },
      "instructions": "Plain Freight ships goods from China to US addresses, 100 g to 2,000 kg, door to door. estimate_price gives a rough cost and check_goods says whether goods can be priced at once or need a person first; both record nothing and need no email. generate_offer prices a shipment for real (freight, US customs clearance, delivery; each option says whether import duty is included) and records a quote request. A second check of each offer runs for a few seconds after it and can add questions or hold prices for a person to review (needs_review, which with empty options can also mean the price for this shipment is being confirmed and will arrive by email); check_offer_status reads its result by quote_id, and settled is true once it has finished. track_shipment reads a booked shipment from its tracking link. No tool books or charges anything. Rate limits: 20 offers per hour per IP and 4 per email address. The email field is optional: when given, the written offer is mailed there, and replying to it, or the book_url form, is how a customer books. Human contact: info@plainfreight.com. Docs: https://plainfreight.com/for-agents",
      "tools": [
        {
          "name": "check_goods",
          "title": "Check if goods can be shipped",
          "description": "Checks whether Plain Freight can ship a product from China to the US, and which documents it needs. Records nothing. Input: the product description. Returns a verdict: instant_offer or branded_rate (priced at once, each on its applicable rate) or person_checks_first (for example batteries, chemicals, food, cosmetics, seeds, vapes or weapons: a person reviews the goods before any price), with a plain explanation and the documents or details to have ready. It applies the same goods screen as Plain Freight's offers; it is not legal or customs advice.",
          "inputSchema": {
            "properties": {
              "product": {
                "description": "The product, in the user's words (materials and whether it has a battery help)",
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "category": {
                "type": ["string", "null"]
              },
              "error": {
                "type": "string"
              },
              "explanation": {
                "type": "string"
              },
              "have_ready": {
                "description": "Documents or details the person will ask for",
                "type": ["string", "null"]
              },
              "next_step": {
                "type": "string"
              },
              "verdict": {
                "description": "instant_offer: priced at once; branded_rate: priced at once on its applicable rate; person_checks_first: no price until a person reviews the goods",
                "enum": ["instant_offer", "branded_rate", "person_checks_first"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check if goods can be shipped"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Goods checked",
            "openai/toolInvocation/invoking": "Checking the goods"
          },
          "digest": "sha256:49a1e89c89b1c64a42896e23bf4938176e0c1bb387fe369f2c79070faff54527"
        },
        {
          "name": "check_offer_status",
          "title": "Check an offer's second review",
          "description": "Reads the result of the second check on a Plain Freight offer, by the offer's quote_id. Read-only. Returns settled (true once the check finished), possibly updated options and summary, follow-up questions whose answers change the price or customs channel, the offer email status, and needs_review. When needs_review is true with empty options, prices are withheld: either a person at Plain Freight reviews the goods (for example batteries, food or chemicals), or the price for this exact shipment is being confirmed because air prices from China change every few days. In both cases Plain Freight follows up by email.",
          "inputSchema": {
            "properties": {
              "quote_id": {
                "description": "The quote_id of a Plain Freight offer (a UUID)",
                "type": "string"
              }
            },
            "required": ["quote_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "email": {
                "description": "Offer email status: sent, queued, deferred, skipped or failed",
                "type": ["string", "null"]
              },
              "error": {
                "type": "string"
              },
              "needs_review": {
                "description": "true with empty options: prices are withheld, either until a person clears the goods or until the price for this exact shipment is confirmed (air prices from China change every few days); the price follows by email",
                "type": "boolean"
              },
              "options": {
                "items": {
                  "properties": {
                    "duties_included": {
                      "description": "true when US import duty is inside the price (DDP); false when duty is paid to the government at import",
                      "type": "boolean"
                    },
                    "firm": {
                      "description": "false means an estimate confirmed before booking",
                      "type": "boolean"
                    },
                    "includes": {
                      "description": "Exactly what this price covers",
                      "type": "string"
                    },
                    "key": {
                      "description": "air, sea or express",
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "price": {
                      "description": "Price in USD for the whole shipment",
                      "type": "number"
                    },
                    "transit": {
                      "description": "Door to door transit estimate",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "questions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "quote_id": {
                "type": "string"
              },
              "settled": {
                "type": "boolean"
              },
              "text": {
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check an offer's second review"
