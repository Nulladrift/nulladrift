        },
        {
          "name": "estimate_price",
          "title": "Estimate China to USA shipping cost",
          "description": "Rough price estimate for shipping goods from China to a US address, 100 g to 2,000 kg. Records nothing, contacts no one and needs no email. Inputs: total weight, and optionally the product and carton sizes or total volume. Returns estimated door to door prices in USD for air (and sea from 10 kg chargeable weight), the chargeable weight used (the greater of actual weight and carton volume in cm3 / 6,000), transit estimates, and whether US import duty is included. Figures come from Plain Freight's pricing engine for densely packed goods, priced on the applicable rate; goods that need a review get no figure. The exact ZIP code, pickup city and cartons can move the price, so the result is an estimate, not an offer. While air prices from China are changing every few days, the result says so and the exact price is confirmed per shipment before shipping.",
          "inputSchema": {
            "properties": {
              "carton_count": {
                "description": "Number of cartons of that size",
                "minimum": 1,
                "type": "integer"
              },
              "carton_height_cm": {
                "description": "One carton's height in cm",
                "type": "number"
              },
              "carton_length_cm": {
                "description": "One carton's length in cm",
                "type": "number"
              },
              "carton_width_cm": {
                "description": "One carton's width in cm",
                "type": "number"
              },
              "product": {
                "description": "What is being shipped, in a few words (sets the goods rate)",
                "type": "string"
              },
              "total_cbm": {
                "description": "Total volume in cubic meters, if known instead of carton sizes",
                "type": "number"
              },
              "weight_kg": {
                "description": "Total actual weight of the shipment in kg",
                "maximum": 2000,
                "minimum": 0.1,
                "type": "number"
              }
            },
            "required": ["weight_kg"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "actual_kg": {
                "type": "number"
              },
              "chargeable_kg": {
                "type": "number"
              },
              "error": {
                "type": "string"
              },
              "estimate": {
                "description": "Always true: a rough figure, not an offer",
                "type": "boolean"
              },
              "goods": {
                "properties": {
                  "category": {
                    "type": ["string", "null"]
                  },
                  "explanation": {
                    "type": "string"
                  },
                  "have_ready": {
                    "description": "Documents or details the person will ask for",
                    "type": ["string", "null"]
                  },
                  "verdict": {
                    "description": "instant_offer: priced at once; branded_rate: priced at once on its applicable rate; person_checks_first: no price until a person reviews the goods",
                    "enum": ["instant_offer", "branded_rate", "person_checks_first"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "next_step": {
                "type": "string"
              },
              "options": {
                "items": {
                  "properties": {
                    "duty_included": {
                      "type": "boolean"
                    },
                    "estimate_usd": {
                      "description": "Estimated price in USD for the whole shipment",
                      "type": "number"
                    },
                    "label": {
                      "type": "string"
                    },
                    "mode": {
                      "enum": ["air", "sea"],
                      "type": "string"
                    },
                    "per_kg_usd": {
                      "type": "number"
                    },
                    "transit": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "priced_as": {
                "enum": ["general", "branded", "toy"],
                "type": "string"
              },
              "priced_on": {
                "description": "Date the pricing engine produced these figures",
                "type": "string"
              },
              "volumetric_kg": {
                "type": ["number", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate China to USA shipping cost"
