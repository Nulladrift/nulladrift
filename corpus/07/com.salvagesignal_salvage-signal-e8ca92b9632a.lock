      "serverInfo": {
        "name": "salvage-signal",
        "title": "Chicago Demolition Leads | Salvage Signal",
        "version": "1.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use these read-only tools for public Chicago demolition-permit intelligence, canonical offer facts, and a human-confirmed subscription handoff. Never infer contact data or authorize payment. A public permit is never permission to enter a site or remove materials.",
      "tools": [
        {
          "name": "get_chicago_reuse_brief",
          "title": "Get the Chicago Teardown-to-Reuse Brief",
          "description": "Use for a current Chicago teardown-to-reuse overview, aggregate trends, and a ranked watch list with source and safety context. For a material- or urgency-filtered candidate list, use search_salvage_signals instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "dataMode": {
                "enum": ["live", "verified_sample"],
                "type": "string"
              },
              "market": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "safety": {
                "type": "string"
              },
              "source": {
                "type": "object"
              },
              "summary": {
                "type": "object"
              },
              "watchList": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["dataMode", "market", "name", "safety", "source", "summary", "watchList"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read the current Chicago reuse brief"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:34cedec1b0a476fa6e9934b14b70ea18b92011b6a67a5af66d273a7fb1c7eb79"
        },
        {
          "name": "get_salvage_signal_offer",
          "title": "Get Salvage Signal product and pricing facts",
          "description": "Use for factual questions about Salvage Signal's audience, free board, Daily Drop price, live aggregate founding availability, source, safety, or signup terms. This does not prepare a purchase link; use get_subscription_handoff only after a human expresses subscription interest.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "dailyDrop": {
                "type": "object"
              },
              "description": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "safety": {
                "type": "string"
              },
              "source": {
                "type": "object"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["dailyDrop", "description", "name", "safety", "source", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read canonical Salvage Signal offer facts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e1fe44639bb639d8657358926ff57f6c540511a5475afb8b7a3f22ebf0c571b5"
        },
        {
          "name": "get_subscription_handoff",
          "title": "Get a human-confirmed subscription handoff",
          "description": "Use only after a human expresses interest in subscribing or asks for the checkout path. It returns exact Chicago Daily Drop terms and an attributed signup URL. For price-only questions, use get_salvage_signal_offer. This tool is read-only: it accepts no email or payment data and cannot complete a purchase.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "campaign": {
                "description": "Short campaign identifier used only for signup attribution.",
                "maxLength": 64,
                "type": "string"
              },
              "source": {
                "description": "Short agent or channel identifier used only for signup attribution.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "agentPolicy": {
                "type": "object"
              },
              "humanDecision": {
                "type": "object"
              },
              "links": {
                "type": "object"
              },
              "pricing": {
                "type": "object"
              },
              "product": {
                "type": "object"
              },
              "readOnly": {
                "const": true,
                "type": "boolean"
              },
              "schemaVersion": {
                "type": "string"
              },
              "status": {
                "enum": ["human_confirmation_required"],
                "type": "string"
              },
              "type": {
                "enum": ["subscription_handoff"],
                "type": "string"
              }
            },
            "required": ["agentPolicy", "humanDecision", "links", "pricing", "product", "readOnly", "schemaVersion", "status", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Prepare a safe human subscription handoff"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7379721a9f2ee8098107925c775dad01432cc011eb8af55492b663cfa580e3ef"
        },
        {
          "name": "search_salvage_signals",
          "title": "Search Chicago salvage signals",
          "description": "Use when a human or agent needs specific current Chicago demolition-permit prospects, especially by material, urgency, or result count. For an aggregate trend summary and fixed watch list, use get_chicago_reuse_brief instead. Results are public prospecting clues, never site-access permission or inventory guarantees.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "Maximum number of ranked signals to return.",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "material": {
                "default": "all",
                "description": "Material or building-characteristic filter.",
                "enum": ["all", "masonry", "timber", "fixtures", "residential"],
                "type": "string"
              },
              "urgency": {
                "default": "all",
                "description": "Salvage Signal urgency band.",
                "enum": ["all", "hot", "warm", "watch"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "dataMode": {
                "enum": ["live", "verified_sample"],
                "type": "string"
              },
              "market": {
                "type": "string"
              },
              "safety": {
                "type": "string"
              },
              "signalCount": {
                "type": "integer"
              },
              "signals": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "source": {
                "type": "object"
              }
            },
            "required": ["dataMode", "market", "safety", "signalCount", "signals", "source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search public Chicago demolition signals"
