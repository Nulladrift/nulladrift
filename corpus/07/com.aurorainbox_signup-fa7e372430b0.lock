      "tools": [
        {
          "name": "signup_claim_access",
          "title": "Claim setup access to the new account",
          "description": "Exchange the `claimToken` of a signup for the account's API key, so you can finish setting up the account for the person. No API key is needed. It works once, and only when all of this is true: the signup was created with `requestSetupAccess: true`, the person replied AUTORIZO / AUTHORIZE in the WhatsApp chat (signup_status shows `setupAccess: authorized`), the account exists (`status: completed`) and the account has no API key of its own. Returns `apiKey` (send it as `Authorization: Bearer <apiKey>`; it is shown only this once, so keep it), `expiresAt` (the key is removed then, 7 days later, and the person can remove it sooner in Integrations > Developer Portal), `apiBaseUrl`, `docsUrl`, `mcpUrl`, `appUrl` and `connectWhatsappUrl`. Connecting their WhatsApp number is the one step only the person can do: send them to `connectWhatsappUrl`. Fails when setup access was not requested, when the person has not authorized yet, when the authorization was not used in time (72 hours), when the account does not exist yet, when the key was already handed over, or when the account already has a key made by its owner (ask the person for one in that case). An unknown id and a wrong token get the same \"not found\". Mirrors POST /Platform/V1/Signups/{id}/Access.",
          "inputSchema": {
            "properties": {
              "claimToken": {
                "description": "The `claimToken` returned by signup_create.",
                "type": "string"
              },
              "id": {
                "description": "Signup id (GUID) returned by signup_create.",
                "type": "string"
              },
              "language": {
                "default": null,
                "description": "Language for an error message: `es`, `en` or `pt-br`. Default `es`.",
                "type": ["string", "null"]
              }
            },
            "required": ["claimToken", "id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Claim setup access to the new account"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "optional"
          },
          "digest": "sha256:847bfffc9898e9341b3f5b86b04002942ccb91586df41eae8b7658970ae00166"
        },
        {
          "name": "signup_create",
          "title": "Open an Aurora Inbox account signup",
          "description": "Open a pending signup for a person who wants an Aurora Inbox account and has none yet. No API key is needed. Returns a short `code`, a `messageText` that contains it and a `whatsappUrl` (a wa.me link) that opens WhatsApp with that message ready. Show the link to the person: when they send the message from their own WhatsApp, their number is verified and Aurora answers in that chat with a one-time link to set a password. Nothing but the pending signup exists until they send it, and this tool returns no credentials. Keep `claimToken` (shown only once) to read the status with signup_status. The signup expires at `expiresAt` (48 hours). Pass `requestSetupAccess: true` only if the person wants you to finish setting up the account for them: after verifying, Aurora asks them in the same WhatsApp chat, and if they reply AUTORIZO / AUTHORIZE you can exchange the claim token for the account's API key with signup_claim_access. Tell the person beforehand that they will be asked. Fails when `email` is not a valid address, when the limits per client address are reached, or while this way of opening accounts is switched off. Mirrors POST /Platform/V1/Signups.",
          "inputSchema": {
            "properties": {
              "assistantName": {
                "default": null,
                "description": "What you, the assistant, are called (for example \"ChatGPT\"). Optional, informational.",
                "type": ["string", "null"]
              },
              "companyName": {
                "default": null,
                "description": "The name of their business. Optional.",
                "type": ["string", "null"]
              },
              "email": {
                "default": null,
                "description": "Their email. Optional; if sent it must be a valid address.",
                "type": ["string", "null"]
              },
              "language": {
                "default": null,
                "description": "Language of the conversation: `es`, `en` or `pt-br`. Default `es`.",
                "type": ["string", "null"]
              },
              "name": {
                "default": null,
                "description": "The person's name. Optional.",
                "type": ["string", "null"]
              },
              "requestSetupAccess": {
                "default": false,
                "description": "`true` to also ask the person, on WhatsApp, to let you finish setting up the account (see signup_claim_access). Default `false`: nothing is asked.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Open an Aurora Inbox account signup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "optional"
          },
          "digest": "sha256:2a001484dfaa166c40873f60d642b58c07a7371b2d0dac75db9a664455591b66"
        },
        {
          "name": "signup_status",
          "title": "Check an account signup",
          "description": "Read where a signup created with signup_create stands. No API key is needed: pass the `claimToken` received at creation. `status` is `pending` (waiting for the person's WhatsApp message), `expired` (the message did not arrive in time), `verified` (the number is verified and the person has the link to set a password), `account_created` (the login exists), `completed` (the account exists) or `rejected`. `expiresAt` is set while pending, `verifiedAt` once verified. `setupAccess` says where the setup access you may have asked for stands: `not_requested`, `awaiting_consent` (the person has not replied AUTORIZO / AUTHORIZE yet), `authorized` (they did: call signup_claim_access once `status` is `completed`), `claimed` (the key was handed over) or `expired`. Nothing about the person is returned. An unknown id and a wrong token get the same \"not found\". Mirrors GET /Platform/V1/Signups/{id}.",
          "inputSchema": {
            "properties": {
              "claimToken": {
                "description": "The `claimToken` returned by signup_create.",
                "type": "string"
              },
              "id": {
                "description": "Signup id (GUID) returned by signup_create.",
                "type": "string"
              },
              "language": {
                "default": null,
                "description": "Language for an error message: `es`, `en` or `pt-br`. Default `es`.",
                "type": ["string", "null"]
              }
            },
            "required": ["claimToken", "id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check an account signup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
