    "com.appfinishers/fix-guides": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://appfinishers.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "app-finishers",
        "title": "App Finishers",
        "version": "2026.11.21.0620"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Fix guides for errors in apps built with Lovable, Bolt, Replit, Cursor and Supabase. Call lookup_error with the exact error text first, then get_guide with the best match's slug.",
      "tools": [
        {
          "name": "get_guide",
          "title": "Read a fix guide",
          "description": "Read one fix guide: the causes, how to check which one applies, and the fix for each, step by step. Use a slug from lookup_error or list_guides. By default it returns the whole guide; to save tokens, set outline to true to get only its numbered sections, then pass section to read just one.",
          "inputSchema": {
            "properties": {
              "outline": {
                "description": "Only the title, summary and numbered section headings.",
                "type": "boolean"
              },
              "section": {
                "description": "Only this section, by its number in the outline.",
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "The guide's slug, e.g. supabase-new-row-violates-row-level-security-policy",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a fix guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e7611a3e2c435b27d5d0183891440ca9a936e605170aa82a89a87627125c1903"
        },
        {
          "name": "list_guides",
          "title": "List fix guides",
          "description": "List the fix guides by group, with their slugs. Optional filter: words that must all appear in the title (e.g. \"lovable deploy\", \"storage\", \"500\").",
          "inputSchema": {
            "properties": {
              "filter": {
                "description": "Optional words to filter the titles.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List fix guides"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5207a7ea16c433c6a1f893b3661df27396871808711a309acae068682b8b511a"
        },
        {
          "name": "lookup_error",
          "title": "Look up an error",
          "description": "Find the fix guide for an error message from an app built with Lovable, Bolt, Replit, Cursor, v0 or Supabase. Pass the exact error text (a log line, a console message, an HTTP error body). Returns the best matching guides with their links; then call get_guide with a slug for the full fix.",
          "inputSchema": {
            "properties": {
              "error": {
                "description": "The exact error text, as shown (up to 4000 characters).",
                "type": "string"
              }
            },
            "required": ["error"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up an error"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1f62fd9a3da00691cf40d3db51f578684ef91a0284c6e45a661933fc28f4bc09"
        }
      ],
      "digest": "sha256:9314806b9444767b23c2f93e4f099bf4d3ec157d6baf71391abae71260d438aa"
    }
  }
