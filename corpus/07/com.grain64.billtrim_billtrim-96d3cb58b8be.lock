      "serverInfo": {
        "name": "billtrim",
        "title": "Billtrim: find savings in an AWS bill",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Billtrim finds savings in an AWS bill. Call analyze_aws_bill with the text of a Cost Explorer or CUR CSV; call explain_aws_usage_type for one line item. Read-only, nothing stored, no AWS credentials needed.",
      "tools": [
        {
          "name": "analyze_aws_bill",
          "title": "Find savings in an AWS bill",
          "description": "Find savings in an AWS bill export. Give it the text of a Cost Explorer CSV or an AWS Cost and Usage Report CSV and it returns a ranked list of likely waste (NAT gateway traffic, idle resources, oversized or old-generation volumes and instances, cross-AZ and internet data transfer, Savings Plan sizing), each with a monthly dollar range, the arithmetic, the console and CLI steps, how to verify first, the risk and how to roll back. Deterministic rules, no account access, nothing stored. Findings are suggestions: verify before deleting anything.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "csv": {
                "description": "The text of the CSV file, header row included, up to 2 MB. For a bigger file, group by Service, Usage Type and Region in Cost Explorer first.",
                "maxLength": 2097152,
                "type": "string"
              },
              "format": {
                "default": "auto",
                "description": "ce-csv (Cost Explorer), cur-csv (Cost and Usage Report) or auto to detect it.",
                "enum": ["auto", "ce-csv", "cur-csv"],
                "type": "string"
              },
              "max_findings": {
                "default": 10,
                "description": "How many ranked findings to return.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "min_monthly_savings_usd": {
                "default": 0,
                "description": "Drop findings whose top-end monthly saving is below this many US dollars.",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["csv"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "engine_version": {
                "type": "string"
              },
              "finding_count": {
                "type": "integer"
              },
              "findings": {
                "items": {
                  "properties": {
                    "category": {
                      "type": "string"
                    },
                    "confidence": {
                      "type": "string"
                    },
                    "docs_url": {
                      "type": "string"
                    },
                    "evidence": {},
                    "math": {},
                    "rank": {
                      "type": "integer"
                    },
                    "risk": {
                      "type": "string"
                    },
                    "rollback": {
                      "type": "string"
                    },
                    "rule_id": {
                      "type": "string"
                    },
                    "savings_high": {
                      "type": "number"
                    },
                    "savings_low": {
                      "type": "number"
                    },
                    "steps": {
                      "properties": {
                        "cli": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "console": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        }
                      },
                      "required": ["cli", "console"],
                      "type": "object"
                    },
                    "title": {
                      "type": "string"
                    },
                    "verify": {},
                    "why": {
                      "type": "string"
                    }
                  },
                  "required": ["rank", "rule_id", "savings_high", "savings_low", "steps", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "format": {
                "type": "string"
              },
              "granularity": {
                "type": "string"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "period_end": {
                "type": "string"
              },
              "period_start": {
                "type": "string"
              },
              "returned": {
                "type": "integer"
              },
              "savings_high": {
                "type": "number"
              },
              "savings_low": {
                "type": "number"
              },
              "source": {
                "type": "string"
              },
              "total_cost": {
                "type": "number"
              },
              "web_url": {
                "type": "string"
              }
            },
            "required": ["engine_version", "finding_count", "findings", "returned", "web_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find savings in an AWS bill"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4d99077033ca909e4ea4583eee29c00cfba51a28257fa48a2146a78f31a39294"
        },
        {
          "name": "explain_aws_usage_type",
          "title": "Explain an AWS usage type",
          "description": "Explain one AWS usage-type string from a bill (for example `USE1-NatGateway-Bytes` or `DataTransfer-Regional-Bytes`): what the charge is, the unit price and where it was verified, the usual cause, the cheaper alternative, and the verify-first steps. Use it when you already have a line item and do not need to analyze a whole file.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "service": {
                "description": "Optional service name from the bill, e.g. \"EC2 - Other\", to tell apart usage types shared by services.",
                "type": "string"
              },
              "usage_type": {
                "description": "The usage type as it appears on the bill, region prefix allowed, e.g. USE1-NatGateway-Bytes.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["usage_type"],
            "type": "object"
          },
