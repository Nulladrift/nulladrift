            "readOnly": false
          },
          "digest": "sha256:d8e0491d69b4e5c3d630eda5deffd931d971289a3f75ff3edf6350ea933e2166"
        },
        {
          "name": "verify_phone",
          "description": "Check one phone number (245 countries and territories, offline data): E.164 and national format, country, region, time zones, line type, risk_score and accept/review/reject. No live carrier lookup; US/Canada VoIP is not detected. Free: 30 checks per day.",
          "inputSchema": {
            "properties": {
              "default_country": {
                "default": "US",
                "title": "Default Country",
                "type": "string"
              },
              "phone": {
                "title": "Phone",
                "type": "string"
              }
            },
            "required": ["phone"],
