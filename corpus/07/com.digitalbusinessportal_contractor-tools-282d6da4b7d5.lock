            "readOnly": false
          },
          "digest": "sha256:8a9a9b72611c45d0a6f5b100f8f2c69208522d8b57f7e2695a0578e174d1f4ec"
        },
        {
          "name": "verify_email",
          "description": "Check one email address for signup-abuse risk: known disposable domain, mail server (MX) present, role mailbox (info@), free provider, and a typo suggestion (gmial.com -> gmail.com). Returns risk_score and accept/reject. Free: 20 checks per day.",
          "inputSchema": {
            "properties": {
              "email": {
                "title": "Email",
                "type": "string"
              }
            },
            "required": ["email"],
            "title": "verify_emailArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
