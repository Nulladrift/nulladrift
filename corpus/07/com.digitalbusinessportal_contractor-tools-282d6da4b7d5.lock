      },
      "instructions": "Read-only tools from Digital Business Portal (Los Angeles): email and phone risk checks, a one-page web reader that respects robots.txt, a contractor-licence snapshot for CA/TX/FL/WA (not a live check), appliance-repair dispatch coverage by California ZIP, and find_service to route a task to the right tool. Free with daily limits. No booking; nothing is written.",
      "tools": [
        {
          "name": "extract_web_context",
          "description": "Read one public web page and return its main content as clean Markdown plus title and metadata. robots.txt is respected (user agent DBP-Reader); max_tokens 50-4000 (default 2000). Free: 10 pages per day.",
          "inputSchema": {
            "properties": {
              "max_tokens": {
                "default": 2000,
                "title": "Max Tokens",
                "type": "integer"
              },
              "url": {
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "extract_web_contextArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e4db772e90755c2694d5f7c826d2af7326d26fe275fcd7c8419b2ed90c7f99b1"
        },
        {
          "name": "find_service",
          "description": "Describe what you need in plain words (task, up to 500 characters; optional 2-letter country) and get the matching tool or API from us -- a deterministic keyword match, no AI. Requests are logged after best-effort scrubbing for 30 days so we learn what agents need.",
          "inputSchema": {
            "properties": {
              "country": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Country"
              },
              "task": {
                "title": "Task",
                "type": "string"
              }
            },
            "required": ["task"],
            "title": "find_serviceArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5d66fe7f8b5fec4a6e09f67bbf8dc937237b618d1a6fea160cc8e4de28ab7086"
        },
        {
          "name": "get_appliance_repair_coverage",
          "description": "Is appliance repair dispatched in this California ZIP? If yes: the phone number to call (answered 24/7 by Joanna, our AI dispatcher), the diagnostic fee, specialist hours and on/off duty now. No booking: the person calls the number.",
          "inputSchema": {
            "properties": {
              "zip": {
                "title": "Zip",
                "type": "string"
              }
            },
            "required": ["zip"],
            "title": "get_appliance_repair_coverageArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4e31493e1dde082d657c7eb4ee260e6cddd3a084234a38c1d7449e90bffea050"
        },
        {
          "name": "search_contractor_license_snapshot",
          "description": "Search a SNAPSHOT of public contractor-licence data for one state: CA (CSLB), TX (TDLR contractors), FL (DBPR construction and electrical) or WA (L&I contractors). Give license_number, business_name (3+ characters), zip and/or county (CA, TX, FL; not WA); city narrows. limit 1-10. live_active_verified is always false -- confirm at the verify_url in every answer. Not a consumer report under the FCRA. States accepted: CA, TX, FL, WA; loaded now: CA, FL, TX, WA. A state not loaded yet answers state_unavailable.",
          "inputSchema": {
            "properties": {
              "business_name": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Business Name"
              },
              "city": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "City"
              },
              "county": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "County"
              },
              "license_number": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "License Number"
              },
              "limit": {
                "default": 5,
                "title": "Limit",
                "type": "integer"
              },
              "state": {
                "title": "State",
                "type": "string"
              },
              "zip": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Zip"
              }
            },
            "required": ["state"],
            "title": "search_contractor_license_snapshotArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a33f117655aa146e6817c5be853008a01e7eb4d620b359b750114454936d0bb7"
        },
        {
          "name": "search_cslb_bulk_snapshot",
          "description": "1.0.0 name for search_contractor_license_snapshot with state CA: search a SNAPSHOT of California CSLB's public bulk contractor-licence list by license_number, business_name (3+ characters) and/or zip (optional city filter). Up to 10 results; live_active_verified is always false -- this is not a live CSLB lookup.",
          "inputSchema": {
            "properties": {
              "business_name": {
