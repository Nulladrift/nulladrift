                    "type": "null"
                  }
                ],
                "default": null,
                "title": "City"
              },
              "license_number": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "License Number"
              },
              "limit": {
                "default": 5,
                "title": "Limit",
                "type": "integer"
              },
              "zip": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Zip"
              }
            },
            "title": "search_cslb_bulk_snapshotArguments",
