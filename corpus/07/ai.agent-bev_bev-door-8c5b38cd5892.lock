{
  "lockfileVersion": 2,
  "subjects": {
    "ai.agent-bev/bev-door": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.bev-buyer.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ai.agent-bev/bev-door",
        "title": "agent-bev",
        "version": "0.2.6",
        "description": "The world's largest agentic B2B hub for beer, wine and spirits. Powered by CUVEE. Trade only.",
        "icons": [
          {
            "src": "https://agent-bev.ai/brand/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "agent-bev is Europe's agentic commerce hub for the B2B beverage alcohol (bev-alc) industry. AI agents for buyers source, sort and procure. Every beer, wine and spirit in Europe, through agent-bev.ai. Trade only, never to consumers. Call list_nodes, then search_drinks or find_producer, then get_record; compare_drinks and get_order_route follow. Reads never change anything; create_order_intent, get_offers and accept_offer carry an order through the Bourse (accepting is one x402 paid call). Every answer carries the notice line and audience: trade.",
      "tools": [
        {
          "name": "accept_offer",
          "title": "Accept offer",
          "description": "Accept one offer and place the order through the Bourse. Accepting is one x402 paid call (HTTP 402 with the payment offer until paid): it settles and signs the order. The goods are paid between the two companies on the offer's own terms.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "the buyer's email given on create_order_intent",
                "type": "string"
              },
              "intent_id": {
                "description": "the order intent id, oi-<16 hex>",
                "type": "string"
              },
              "offer_id": {
                "description": "the offer to accept, as get_offers lists it",
                "type": "string"
              }
            },
            "required": ["email", "intent_id", "offer_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Accept offer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:849f51059fb26bd8c60ef7e26f86b9a9e09d9723158f1a82730ad63330a321d0"
        },
        {
          "name": "compare_drinks",
          "title": "Compare drinks",
          "description": "Compare two to ten products side by side, field by field, each value with its source page.",
          "inputSchema": {
            "properties": {
              "record_ids": {
                "description": "two to ten record ids, e.g. [\"es-bev:000123\", \"fr-bev:000456\"]",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["record_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare drinks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cec59ceb2d15ff121c5c1dbceb8971f70ffc0ccf2c04cf1a098292f8ddf3a21f"
        },
        {
          "name": "create_order_intent",
          "title": "Create order intent",
          "description": "Place an order intent for one to ten records (quantity, delivery market, optional date and note, the buyer's organisation and email). The Bourse routes it to each maker; verified makers answer with offers, and a maker's own Brand Agent address comes back with the routing. The email stays private: it is the buyer's key to read offers and accept one.",
          "inputSchema": {
            "properties": {
              "buyer": {
                "description": "the buying organisation and its email (kept private; the key to read offers and accept one)",
                "properties": {
                  "email": {
                    "description": "the buyer's email",
                    "type": "string"
                  },
                  "organisation": {
                    "description": "the buying organisation's name",
                    "type": "string"
                  }
                },
                "required": ["email", "organisation"],
                "type": "object"
              },
              "market": {
                "description": "delivery market (country)",
                "type": "string"
              },
              "needed_by": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "note": {
                "description": "optional note to the makers",
                "type": "string"
              },
              "quantity": {
                "description": "quantity with its unit, e.g. 600 bottles (75 cl)",
                "type": "string"
              },
              "record_ids": {
                "description": "one to ten record ids to order, e.g. [\"es-bev:000123\"]",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["buyer", "market", "quantity", "record_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create order intent"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f2090fec46aa1fb1fe04ce27f9fa998db593fb0e221543969aa47a4248e1184e"
        },
        {
          "name": "find_producer",
          "title": "Find producer",
          "description": "Find a maker and its products across every open node, with the maker's name as each source wrote it.",
          "inputSchema": {
            "properties": {
              "node": {
                "description": "optional node id, e.g. es-bev",
                "type": "string"
              },
              "producer": {
                "description": "the maker's name, or part of it",
                "type": "string"
              }
            },
            "required": ["producer"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find producer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:97dc6ce2b29df821d3b6260fa789e16c4cba1dd0227582d6d3a82a7705ef011f"
        },
        {
          "name": "get_offers",
          "title": "Get offers",
          "description": "Read the makers' offers on an order intent, and the order once placed. By the buyer's email given on create_order_intent.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "the buyer's email given on create_order_intent",
                "type": "string"
              },
              "intent_id": {
                "description": "the order intent id from create_order_intent, oi-<16 hex>",
                "type": "string"
              }
            },
            "required": ["email", "intent_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get offers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d230b072f726e0ca17430f6cf8dde00596ee2625360c6c4d0333a20db2da9855"
        },
        {
          "name": "get_order_route",
          "title": "Get order route",
          "description": "Get the maker's or distributor's trade channel to order a product, as the record states it. Never a consumer channel.",
          "inputSchema": {
            "properties": {
              "record_id": {
                "description": "the record id, <node>:<6 digits>, e.g. es-bev:000123",
                "type": "string"
              }
            },
            "required": ["record_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get order route"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5b59ed528b890e59484986d7659c3cf9c38fff38953f98e154e97b94b1462f8d"
        },
        {
          "name": "get_record",
          "title": "Get record",
          "description": "Read one product in full by record_id: every field with its source page, reader and state; its CUVEE; its claim status; the signed record (JWS).",
          "inputSchema": {
            "properties": {
              "record_id": {
                "description": "the record id, <node>:<6 digits>, e.g. es-bev:000123",
                "type": "string"
              }
            },
            "required": ["record_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a751a4dfc23a4b016aca77971886f62d06058c668089ea946d41f102b334ac12"
        },
        {
          "name": "list_nodes",
          "title": "List nodes",
          "description": "List the countries on the record: each node's door, languages, state and, for an open node, its counts.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List nodes"
          },
          "behavior": {
            "destructive": false,
