          },
          "digest": "sha256:5a7ac62f5cc4c29330a6231df4a4a08b2094f3eb328c2163f65a5c9899eca519"
        },
        {
          "name": "search_drinks",
          "title": "Search drinks",
          "description": "Find beers, wines, spirits, ciders and ready-to-drink drinks by name, style, origin or category across every open country node. Returns record ids with each record's CUVEE.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "optional category to keep: beer, wine, spirits, cider_perry or rtd (ready-to-drink)",
                "enum": ["beer", "wine", "spirits", "cider_perry", "rtd"],
                "type": "string"
              },
              "limit": {
                "description": "optional number of results, 1 to 100",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "node": {
                "description": "optional node id, e.g. es-bev",
                "type": "string"
              },
              "query": {
                "description": "name, style, origin or category",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
