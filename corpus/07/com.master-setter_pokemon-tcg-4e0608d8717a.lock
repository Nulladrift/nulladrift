{
  "lockfileVersion": 2,
  "subjects": {
    "com.master-setter/pokemon-tcg": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.master-setter.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "master-setter-pokemon-tcg",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Pokémon TCG catalog: 199,314 cards / 276,657 printings / 14 languages. Names are in each card's own language. No key yet? Call get_api_key with an email, then reconnect with Authorization: Bearer <key>.",
      "tools": [
        {
          "name": "get_api_key",
          "description": "Create a free API key (English cards, 250 requests/month) for an email address. Free keys are for PERSONAL, NON-COMMERCIAL use only: confirm that with the user before setting personal_use=true. Commercial use, other languages, printings and images need a paid plan (POST /v1/billing). Pass the key as Authorization: Bearer <key>.",
          "inputSchema": {
            "properties": {
              "email": {
                "format": "email",
                "type": "string"
              },
              "personal_use": {
                "description": "true = the user agrees the free key is for personal, non-commercial use (https://api.master-setter.com/terms)",
                "type": "boolean"
              }
            },
            "required": ["email", "personal_use"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:28299b6ff947ff12d157e59ea4dfa14032d6a8328b9a8cf68cbfbcfa933b984a"
        },
        {
          "name": "get_card",
          "description": "One card by id (e.g. en-base1-4, ko-sv4a-190) with all of its printings/variants (1st Edition, holo, reverse holo…).",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:001c7aff5aa01f7f885cb95246424070853253d91616d25a3cc4e316e2fb4205"
        },
        {
          "name": "get_set",
          "description": "One set by id (e.g. ko-sv4a) with card_count computed from the cards actually present.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8c2f4ecec31abcaa6f7be92fc06483e242413a1e89465d7abc82e1ef0d8864d1"
        },
        {
          "name": "list_cards_in_set",
          "description": "Every card in a set, ordered by number (e.g. set ja-sv4a, th-sv1v, zh-tw-sv1s).",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 50,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              },
              "set": {
                "type": "string"
              }
            },
            "required": ["set"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c07b4d3593a0d918c0dd378d8d1d8d3a67ed909c5aca364912c5466920da3de9"
        },
        {
          "name": "list_sets",
          "description": "Sets (expansions, promos, decks) for a language, newest first. 14 languages; deepest coverage of Korean, Thai, Indonesian and Chinese.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Language code: en English, ja Japanese, ko Korean, zh-tw Traditional Chinese, zh-cn Simplified Chinese, th Thai, id Indonesian, fr, it, de, es, pt, es-mx, ru, pl, nl.",
                "enum": ["en", "ja", "fr", "it", "de", "es", "ko", "pt", "zh-tw", "id", "th", "zh-cn", "es-mx", "ru", "pl", "nl"],
                "type": "string"
              },
              "limit": {
                "default": 50,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f2ebf77314507d89ddc97c1516c81263be61f16ce415c889dd0bc2cb9b57851e"
        },
        {
          "name": "search_cards",
          "description": "Search Pokémon TCG cards by name. Names are stored in each card's own language (search Korean cards with Korean, e.g. 피카츄; Japanese with ピカチュウ). Filter with lang.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Language code: en English, ja Japanese, ko Korean, zh-tw Traditional Chinese, zh-cn Simplified Chinese, th Thai, id Indonesian, fr, it, de, es, pt, es-mx, ru, pl, nl.",
                "enum": ["en", "ja", "fr", "it", "de", "es", "ko", "pt", "zh-tw", "id", "th", "zh-cn", "es-mx", "ru", "pl", "nl"],
                "type": "string"
              },
              "limit": {
                "default": 50,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:094ef7912f4227617eb57ac41418908e74241286220c7f608e2c5f891198bc45"
        }
      ],
      "digest": "sha256:8b5d22d554f3ab24e292761231d57bd01ac51fe81249b0d007cf5b13c97a06e4"
    }
  }
}
