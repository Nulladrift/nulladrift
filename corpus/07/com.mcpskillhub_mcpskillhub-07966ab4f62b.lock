{
  "lockfileVersion": 2,
  "subjects": {
    "com.mcpskillhub/mcpskillhub": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcpskillhub.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "mcpskillhub",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "compare_servers",
          "title": "Compare MCP servers",
          "description": "Side-by-side context tokens, security, freshness and stars for 2-5 servers.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slugs": {
                "items": {
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:037f091d09e250af14c94117a1503268541f9fb167785e8a0372d547a5f2040b"
        },
        {
          "name": "get_server",
          "title": "Get MCP server details",
          "description": "Full details for one server by slug: install snippets per client, env vars, packages, scores.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7825a12fddcb6cbb51f1c7f9a944a72de47d7bae36aab4d12ed0462c9c4a3798"
        },
        {
          "name": "search_servers",
          "title": "Search MCP servers",
          "description": "Find MCP servers by keyword. Returns measured context-token cost, security score and freshness.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "category slug, e.g. database",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "transport": {
                "type": "string",
                "enum": ["stdio", "remote"]
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6ce282ef3ea8533f05fd8a3e887f4069ed5e1611ad8ac1b7837d9db90c65d3b6"
        }
      ],
      "digest": "sha256:7893f909b76bf3b4da034db0e7b60bb3e29a60ca56f0f9e982c6c9bcc96956e1"
    }
  }
}
