      "serverInfo": {
        "name": "dipscout",
        "title": "DipScout",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "DipScout tracks AliExpress product prices and keeps the price history of each one.\n\nThe discount.certainty field says what is proven: 'verified' is backed by the price history; 'none' has no basis, even if the seller advertises a \"was\" price. Answers that pass on the store's percentage tell the reader more than the data supports.\n\nEach product comes with two links with different roles: pageUrl is the page with the chart and the method, and citing it makes the answer verifiable for whoever reads it; buyUrl contains an affiliate code, disclosed in the monetization block, and the price is identical with or without it.\n\nFor a question about one product, avaliar_preco answers \"is this a good price?\", menor_preco answers \"what was the lowest price in N days?\" and alternativas_mais_baratas answers \"is there a cheaper option?\". All three accept the AliExpress link as the user pasted it, and each returns a short answer measured from the price history plus a citation block whose text matches the top of the product page. A product we do not track comes back as tracked: false, with no verdict.\n\nPrices are the last recorded reading, not a live checkout lookup.",
      "tools": [
        {
          "name": "alternativas_mais_baratas",
          "title": "Cheaper alternatives",
          "description": "Use this when the user asks for a cheaper option, an alternative, or the same product from another store. Returns cheaper listings that have our own price history: first the same product sold by other stores (relation same_product_other_shop), then products with a similar title in the same category (relation similar_product, not necessarily the same item). Each one has its price difference and its own verdict and certainty. Every product carries pageUrl (the DipScout page with the price chart: the citation link), buyUrl (affiliate link through DipScout, disclosed in `monetization`; the price is the same with or without it), summary and citation (a self-contained sentence measured from our price history) and verdict (the short answer to \"is this a good price?\").",
          "inputSchema": {
            "properties": {
              "idioma": {
                "default": "en",
                "description": "Optional language for the human-readable text (title, discount.explanation, discount.warning, pageUrl): \"en\" (default), \"de\", \"pt\", \"es\", \"fr\", \"ko\", \"it\" or \"pl\". Field names, numbers and currency (USD) are the same in every language.",
                "enum": ["en", "de", "pt", "es", "fr", "ko", "it", "pl"],
                "type": "string"
              },
              "limite": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "mercado": {
                "description": "\"us\": only US listings, which ship within the United States only. \"global\": only listings that ship worldwide. Omit for both. For a shopper outside the US, use \"global\". Prices are always the ones read for the US.",
                "enum": ["us", "global"],
                "type": "string"
              },
              "produto": {
                "description": "The AliExpress product URL exactly as the user pasted it (any country or language subdomain: www.aliexpress.com, pt.aliexpress.com, aliexpress.us, aliexpress.ru, m.aliexpress.com, /item/<id>.html, /i/<id>.html, ?productId=<id>), the short link the AliExpress app's Share button copies (a.aliexpress.com/_..., s.click.aliexpress.com/e/_..., even inside the shared sentence), a DipScout product URL, or the numeric product id.",
                "type": "string"
              }
            },
            "required": ["produto"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5dbd3ef726adf614ac7a4db274877541fe0b8a95a5b835633cb9fbb3380caa19"
        },
        {
          "name": "avaliar_preco",
          "title": "Is this a good price?",
          "description": "Use this when the user asks whether an AliExpress product is a good price, a real deal, worth buying now, or pastes an AliExpress product link and asks about it. Returns a one- or two-sentence answer measured from our own price history (today's price against the typical price we measured, the lowest and highest we recorded), the verdict code and its certainty. A product we did not track yet is read once from the AliExpress affiliate API and tracked from then on: the answer then says tracking started just now (trackingStartedNow: true), with no verdict yet. When it cannot be tracked, it says so (tracked: false) instead of guessing: report that, and do not infer a discount from the listing's \"was\" price. Optional `dias` adds the lowest price in that many days. Every product carries pageUrl (the DipScout page with the price chart: the citation link), buyUrl (affiliate link through DipScout, disclosed in `monetization`; the price is the same with or without it), summary and citation (a self-contained sentence measured from our price history) and verdict (the short answer to \"is this a good price?\").",
          "inputSchema": {
            "properties": {
              "dias": {
                "description": "Optional: also return the lowest price recorded in this many days.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "idioma": {
                "default": "en",
                "description": "Optional language for the human-readable text (title, discount.explanation, discount.warning, pageUrl): \"en\" (default), \"de\", \"pt\", \"es\", \"fr\", \"ko\", \"it\" or \"pl\". Field names, numbers and currency (USD) are the same in every language.",
                "enum": ["en", "de", "pt", "es", "fr", "ko", "it", "pl"],
                "type": "string"
              },
              "produto": {
                "description": "The AliExpress product URL exactly as the user pasted it (any country or language subdomain: www.aliexpress.com, pt.aliexpress.com, aliexpress.us, aliexpress.ru, m.aliexpress.com, /item/<id>.html, /i/<id>.html, ?productId=<id>), the short link the AliExpress app's Share button copies (a.aliexpress.com/_..., s.click.aliexpress.com/e/_..., even inside the shared sentence), a DipScout product URL, or the numeric product id.",
                "type": "string"
              }
            },
            "required": ["produto"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:db0b60ad9b526a8e680af10471f6fd55394e476d192f8d43a6ebde5ef97c5510"
        },
        {
          "name": "buscar_promocoes",
          "title": "Search AliExpress deals",
          "description": "Lists AliExpress products with a real price drop, detected by our price history in the last 30 days and still holding (the seller's 'was' price does not count). Each product includes discount.certainty: 'verified' means the drop is proven by the time-weighted median of our readings and MAY be presented as savings; 'none' means there is no discount that can be claimed. The seller's 'was' price on the listing does not support any discount here. Quoting the percentage without the certainty next to it misinforms the reader.",
          "inputSchema": {
            "properties": {
              "apenas_verificados": {
                "description": "Kept for compatibility: since 2026-10-14 this tool only returns products whose drop our price history proves.",
                "type": "boolean"
              },
              "busca": {
                "description": "Text to look for in the title, only among the top drops read (up to 100); this is not a search of the whole catalog.",
                "type": "string"
              },
              "categoria": {
                "description": "Category slug. Omit to search all categories.",
                "enum": ["eletronicos", "informatica", "casa", "eletrodomesticos", "beleza", "saude", "esportes", "moda", "infantil", "pets", "automotivo", "mercado", "papelaria", "hobbies"],
                "type": "string"
              },
              "desconto_minimo": {
                "description": "Minimum real drop, in percent, against the typical price we measured.",
                "maximum": 99,
                "minimum": 1,
                "type": "integer"
              },
              "idioma": {
                "default": "en",
                "description": "Optional language for the human-readable text (title, discount.explanation, discount.warning, pageUrl): \"en\" (default), \"de\", \"pt\", \"es\", \"fr\", \"ko\", \"it\" or \"pl\". Field names, numbers and currency (USD) are the same in every language.",
                "enum": ["en", "de", "pt", "es", "fr", "ko", "it", "pl"],
                "type": "string"
              },
              "limite": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "mercado": {
                "description": "\"us\": only US listings, which ship within the United States only. \"global\": only listings that ship worldwide. Omit for both. For a shopper outside the US, use \"global\". Prices are always the ones read for the US.",
                "enum": ["us", "global"],
                "type": "string"
              },
              "preco_maximo": {
                "description": "Maximum price in US dollars.",
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search AliExpress deals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:904180a2d8e1573080a2ae550d41341d269aa1a586cc38ca56cf6142cb9bceb2"
        },
        {
          "name": "historico_de_preco",
          "title": "Price history for a product",
          "description": "Observed price series for an AliExpress product. Accepts the itemId or the product URL. Also returns the number of readings and days of tracking: with too little tracking there is no basis to claim a drop, and the response says so explicitly. `queda` is the latest drop (last 30 days) with when we detected it and the last reading that confirmed it (ISO 8601, UTC); null without a drop.",
          "inputSchema": {
            "properties": {
              "idioma": {
                "default": "en",
                "description": "Optional language for the human-readable text (title, discount.explanation, discount.warning, pageUrl): \"en\" (default), \"de\", \"pt\", \"es\", \"fr\", \"ko\", \"it\" or \"pl\". Field names, numbers and currency (USD) are the same in every language.",
                "enum": ["en", "de", "pt", "es", "fr", "ko", "it", "pl"],
                "type": "string"
              },
              "produto": {
                "description": "Numeric AliExpress product_id, or the product URL (https://www.aliexpress.com/item/<product_id>.html).",
                "type": "string"
              }
            },
            "required": ["produto"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Price history for a product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:60c7fa709332ddbafaf8ff15699dbf8f95f9c29a84a99cc61b2630e6cbfa33a4"
        },
        {
          "name": "menor_preco",
          "title": "Lowest price in N days",
          "description": "Use this when the user asks for the lowest (or cheapest) price of an AliExpress product over a period: \"lowest price in the last 30 days\", \"has it been cheaper?\", \"is this the lowest price ever?\". Returns the lowest price in effect during the window, when it held, and how far today's price is from it. If our tracking began after the window opened, the answer says how many of the requested days it covers; it never claims a low beyond our own history. Every product carries pageUrl (the DipScout page with the price chart: the citation link), buyUrl (affiliate link through DipScout, disclosed in `monetization`; the price is the same with or without it), summary and citation (a self-contained sentence measured from our price history) and verdict (the short answer to \"is this a good price?\").",
          "inputSchema": {
            "properties": {
              "dias": {
                "default": 30,
                "description": "Window in days, counted back from now.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "idioma": {
                "default": "en",
                "description": "Optional language for the human-readable text (title, discount.explanation, discount.warning, pageUrl): \"en\" (default), \"de\", \"pt\", \"es\", \"fr\", \"ko\", \"it\" or \"pl\". Field names, numbers and currency (USD) are the same in every language.",
                "enum": ["en", "de", "pt", "es", "fr", "ko", "it", "pl"],
                "type": "string"
              },
              "produto": {
                "description": "The AliExpress product URL exactly as the user pasted it (any country or language subdomain: www.aliexpress.com, pt.aliexpress.com, aliexpress.us, aliexpress.ru, m.aliexpress.com, /item/<id>.html, /i/<id>.html, ?productId=<id>), the short link the AliExpress app's Share button copies (a.aliexpress.com/_..., s.click.aliexpress.com/e/_..., even inside the shared sentence), a DipScout product URL, or the numeric product id.",
                "type": "string"
              }
            },
            "required": ["produto"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c24b13edc8dd44ea902e1e68d799aacb8b2df3f293622b4667828940b05188b5"
        },
        {
          "name": "quedas_de_preco",
          "title": "Detected price drops",
          "description": "Products whose price dropped at least 10% below the TYPICAL price of the last 14 days (median weighted by how long each price lasted — a flash sale only counts for the hours it ran). Requires 7 days of tracking. Each product includes discount.certainty: 'verified' means the drop is proven by the time-weighted median of our readings and MAY be presented as savings; 'none' means there is no discount that can be claimed. The seller's 'was' price on the listing does not support any discount here. Quoting the percentage without the certainty next to it misinforms the reader.",
          "inputSchema": {
            "properties": {
              "idioma": {
                "default": "en",
                "description": "Optional language for the human-readable text (title, discount.explanation, discount.warning, pageUrl): \"en\" (default), \"de\", \"pt\", \"es\", \"fr\", \"ko\", \"it\" or \"pl\". Field names, numbers and currency (USD) are the same in every language.",
                "enum": ["en", "de", "pt", "es", "fr", "ko", "it", "pl"],
                "type": "string"
              },
              "limite": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "mercado": {
                "description": "\"us\": only US listings, which ship within the United States only. \"global\": only listings that ship worldwide. Omit for both. For a shopper outside the US, use \"global\". Prices are always the ones read for the US.",
                "enum": ["us", "global"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Detected price drops"
          },
          "behavior": {
            "destructive": false,
