        {
          "name": "search",
          "title": "Search Vibe Support",
          "description": "Find notices, showcase entries and Toolbox tools by a few words, for example 'stripe refund', 'delete user data', 'supabase access rules' or 'multiplayer game'. Use this first when you know what the person is about to do. Returns the best matches with their ids; call get_notice for one in full.",
          "inputSchema": {
