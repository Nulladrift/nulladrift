            "readOnly": true
          },
          "digest": "sha256:2e74fa8dcc69968615070aa1302baef24d55cfd7d6d4178dfd15db6359896552"
        },
        {
          "name": "list_toolbox",
          "title": "Ready-made tools and add-ons",
          "description": "Tools that already exist, add-ons for AI coding tools, safety tools, and popular tools to be careful with. Each has a plain description, its licence, when it was last updated and any caution. Being listed is not a safety check.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
