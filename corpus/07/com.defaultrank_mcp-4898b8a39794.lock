{
  "lockfileVersion": 2,
  "subjects": {
    "com.defaultrank/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://defaultrank.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "defaultrank",
        "title": "DefaultRank",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use get_tool_pick_rate and get_category_ranking to see which developer tools AI models recommend and actually use. Use check_package_freshness before installing dependencies to catch outdated versions.",
      "tools": [
        {
          "name": "check_package_freshness",
          "title": "Check dependencies against npm's latest versions",
          "description": "Checks dependencies (an object of package name to version range, as in package.json) against the npm registry. Returns packages that are a major version or more behind npm's latest, deprecated packages, and the current major to use. Useful before installing packages from memory.",
          "inputSchema": {
            "properties": {
              "dependencies": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Package name to version range, e.g. {\"next\": \"^14.2.5\", \"zod\": \"^3.23.8\"}. Up to 60 packages.",
                "type": "object"
              }
            },
            "required": ["dependencies"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f8a091b510bda7f5515564f954f7f27a1a0aa93601a88b5d2883175f26c9eb79"
        },
        {
          "name": "get_category_ranking",
          "title": "Which tools AI models pick in a category",
          "description": "Ranks the tools AI models recommend first and the tools they actually install in AI-built apps, for one category: auth, database or email.",
          "inputSchema": {
            "properties": {
              "category": {
                "enum": ["auth", "database", "email"],
                "type": "string"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9815cf0a12860e97c81149d1cabab6ceaf88cca4daed479e8505ae84e4055d71"
        },
        {
          "name": "get_tool_pick_rate",
          "title": "How AI models pick a developer tool",
          "description": "For a developer tool (product name or npm package, e.g. 'Clerk', 'next-auth', '@supabase/supabase-js'), returns how often 6 AI models recommend it first, mention it, and actually use it in apps they build, with its rank and main competitor. Covers auth, databases and email.",
          "inputSchema": {
            "properties": {
              "tool": {
                "description": "Tool name or npm package",
                "type": "string"
              }
            },
            "required": ["tool"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6217af1a74595b468d87fe8d55faa179a99408fa93413b964a2767d0ca3d67e5"
        }
      ],
      "digest": "sha256:93a9c508f2e4b09ad1cbccbcf7badf5bd64764c9fd20d52d907a631984859693"
    }
  }
}
