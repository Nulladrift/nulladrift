                "type": "string"
              },
              "wallet": {
                "description": "The wallet address to look for in that token (base58, 32–44 chars)",
                "maxLength": 44,
                "minLength": 32,
                "type": "string"
              }
            },
            "required": ["mintAddress", "wallet"],
            "type": "object"
          },
