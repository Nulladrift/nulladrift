        {
          "name": "check_cabal_risk",
          "description": "Pre-trade safety check for any Solana token mint: is a buyer about to be\nsomeone's exit liquidity? Every wallet cluster carries its evidence_txs.\n\nAFTER YOU BUY: POST /api/watch {mint} with an X-API-Key (any key; add\nwebhook_url on the Pro plan) and we alert you the moment a coordinated dump\nor liquidity drain starts on that token — carrying the same on-chain\nevidence. This scan is a BUY check; a watch is a HOLD check, and a holder\nneeds the second one continuously. GET/DELETE /api/watch manage your own.\nPaid plans: the watch also follows the token's insiders (dev, first-seconds\nbuyers) for 7 days and pushes insider_* events when they sell or move\ntogether, each with the transaction.\n\nLayers, ordered by STRENGTH OF EVIDENCE (not marketing):\n\n1. HOLDER CONCENTRATION — what share one wallet actually controls\n   (`top_holder_pct`). A single wallet that can crater the price is the\n   most basic rug vector, and it needs no coordination at all.\n   IMPORTANT: we count only REAL wallets. LP pools, locked/vesting supply\n   and other program-owned accounts are excluded and labelled, never scored\n   as a whale — and supply comes from getTokenSupply, not an estimate. Tools\n   that skip this report a locked-supply token as '65% one wallet'. Our\n   numbers reconcile with GMGN's circulating top-10.\n2. SAME-BLOCK BUNDLES — holders whose token accounts were created in the\n   EXACT same block: a multi-wallet launch bought in one slot. A Jito bundle is\n   one way to do that, not the only one - we read the slot, not the bundle.\n   `time_sync: true`.\n3. COORDINATED DUMP — ≥2 holders each selling ≥25% of their bag in the same\n   block: a cabal exiting in real time. `coordinated_exit: true`, sold_pct.\n4. HONEYPOT / AUTHORITY TRAPS (Solana-native) — live freeze authority,\n   un-revoked mint authority, Token-2022 transfer-fee / transfer-hook /\n   permanent-delegate traps. Answers: CAN you actually sell this token?\n5. DEV TRACK RECORD — the creator resolved on-chain plus their full launch\n   history WITH the peak market cap each past token hit, so a dead-count\n   can't hide a pump-and-dump. Covers ANY Solana venue: pump.fun, Raydium,\n   Orca, Meteora, PumpSwap. A launch counts only where the transaction\n   actually CREATED the mint, so re-minting supply of an existing token is\n   never miscounted as a launch. reputation (SERIAL_RUGGER / DEAD_ON_ARRIVAL\n   / MIXED / PROVEN) + best_peak_usd, pump_and_dumps count; paid tier adds\n   launches[] (peak_mcap_usd, now_mcap_usd, drawdown, status per launch).\n   'Ran to $728k, now dust' = this dev has dumped six figures on holders\n   before. Still CAPPED: peak history is evidence, never softens the score.\n   READ deployer.verdict CAREFULLY — two values mean opposite things:\n   FIRST_LAUNCH = we walked the history and found no earlier tokens.\n   UNKNOWN = the history could NOT be established. That is not evidence of\n   anything and must never be treated as a clean record.\n6. FUNDING-CLUSTER TRACE — top holders walked back to a shared funding\n   wallet. A real capability, listed last on purpose: on our own sample it\n   produced no verified detections once infrastructure (curve PDAs, token\n   accounts) was correctly excluded. Treat it as supporting evidence.\n\nReturns risk (CLEAN|MEDIUM|HIGH), cabal_score 0–100, top_holder_pct, cluster\nbreakdown with evidence_txs[], holder map, deployer verdict, honeypot_risk,\nplus wallets_checked / scan_complete / degraded so YOUR agent can apply its\nown risk tolerance instead of inheriting ours. If we cannot verify something,\nwe say so (`degraded: true`) rather than returning a confident 'clean'.\n\nCOST: 5 scans/month FREE with no signup and no API key;\n250/month free with a key (one email, no card). After that\n$0.01 USDC per scan.\nTwo ways to pay, no signup or card: (1) a subscription, $9/month for 2,500 scans or $99/month unlimited (fair use 50k) —\nbest for 24/7 bots; or prepaid pay-as-you-go at $0.01/scan (any amount) —\nPOST the tx to /api/buy-key, then send header X-API-Key;\nor (2) per-call via x402 (X-Payment-Signature header). Full terms: GET /api/info.\n\nFRESHNESS: a token traced in the last 8 hours is answered from that trace in <100ms; computed_at (unix seconds) says exactly when it was traced. Any other token runs the full live on-chain trace and takes 15-20s — set your client timeout to at least 30s or you will abandon a scan that was about to succeed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "mintAddress": {
                "description": "The Solana mint address of the token to audit (base58, 32–44 chars)",
                "maxLength": 44,
                "minLength": 32,
                "type": "string"
              },
              "pairCreatedAt": {
                "description": "Optional: DexScreener pairCreatedAt timestamp in milliseconds. Speeds up analysis when provided.",
                "type": "number"
              }
            },
            "required": ["mintAddress"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0aab15dc75cb5b401947eac3f4ef081ddd6c3acd66609bf36e731e4a8c428863"
        },
        {
          "name": "check_wallet_in_token",
          "description": "Is a SPECIFIC wallet involved in a SPECIFIC Solana token? Use this when a\nuser names a wallet they are worried about, or when your agent keeps its\nown watchlist of addresses and wants to screen a token against one.\n\nAnswers from two sources at once:\n  1. the traced holders of that token — rank, % of supply, buy slot,\n     whether it funded a coordinated cluster, whether it created the token,\n     or whether it is the liquidity pool / a labelled exchange wallet\n  2. a LIVE on-chain holding lookup, so a wallet too small to appear in the\n     trace is still resolved rather than dismissed\n\nHOW TO READ THE RESULT — this matters more than the fields:\n  found_in_scan=false is NOT a clean bill of health. The trace covers the\n  largest holders, so a smaller position sits outside it, and a wallet that\n  sold out and closed its token account leaves nothing to observe. Never\n  tell a user a wallet is 'clean' or 'not involved' on this result. The\n  `note` field states the limit of what was actually checked; relay it.\n\n  holding.sold_out=true is the strong signal: a token account exists holding\n  none of the token, i.e. this wallet HELD it and has since sold out.\n\n  track_record, when present, counts earlier tokens the wallet was early in\n  and how many graduated. It is an association measured out-of-sample, NOT a\n  profit signal and not a recommendation to copy or avoid anyone. Absence of\n  a track record means we hold no record, not that the wallet has no history.\n\nFree, no API key, rate limited per caller. For screening MANY wallets on\nevery scan automatically, the Screen List add-on stores a private list per\nkey: POST /api/screen-list/checkout.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
