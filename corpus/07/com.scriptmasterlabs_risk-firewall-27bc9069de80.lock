{
  "lockfileVersion": 2,
  "subjects": {
    "com.scriptmasterlabs/risk-firewall": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://risk-firewall.scriptmasterlabs.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "sml-risk-firewall",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "catalog",
          "description": "Machine-readable catalog with prices and 402 terms",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6bdda3f33bca5735698884d83e528bf08211be400090535904a5e909b1190ec7"
        },
        {
          "name": "risk-evaluate",
          "description": "Order and batch risk evaluation ($0.005 via x402 at POST https://risk-firewall.scriptmasterlabs.com/v1/risk/evaluate). Submit policy, timestamped account snapshot and 1–100 proposed orders. Returns PASS, REJECT or INSUFFICIENT_DATA, exact USD calculations and machine-readable rule codes. All money and quantity inputs are decimal strings. Live instrument validation and fresh provider quotes are required before payment. Account snapshot provenance remains explicit.",
          "inputSchema": {
            "properties": {
              "orders": {
                "items": {
                  "allOf": [
                    {
                      "if": {
                        "properties": {
                          "assetType": {
                            "const": "option"
                          }
                        }
                      },
                      "then": {
                        "required": ["adjusted", "expiresAt", "multiplier", "optionSymbol", "positionEffect", "right"]
                      }
                    }
                  ],
                  "properties": {
                    "adjusted": {
                      "const": false,
                      "type": "boolean"
                    },
                    "assetType": {
                      "enum": ["equity", "spot", "option"],
                      "type": "string"
                    },
                    "expiresAt": {
                      "format": "date-time",
                      "type": "string"
                    },
                    "feesUsd": {
                      "pattern": "^(0|[1-9][0-9]{0,12})(\\.[0-9]{1,6})?$",
                      "type": "string"
                    },
                    "id": {
                      "maxLength": 128,
                      "minLength": 1,
                      "type": "string"
                    },
                    "limitPriceUsd": {
                      "pattern": "^(0|[1-9][0-9]{0,12})(\\.[0-9]{1,6})?$",
                      "type": "string"
                    },
                    "multiplier": {
                      "const": 100,
                      "type": "integer"
                    },
                    "optionSymbol": {
                      "description": "OCC symbol required for broker submission of an option order",
                      "type": "string"
                    },
                    "positionEffect": {
                      "const": "open",
                      "type": "string"
                    },
                    "quantity": {
                      "pattern": "^(0|[1-9][0-9]{0,12})(\\.[0-9]{1,6})?$",
                      "type": "string"
                    },
                    "right": {
                      "enum": ["call", "put"],
                      "type": "string"
                    },
                    "side": {
                      "enum": ["buy"],
                      "type": "string"
                    },
                    "symbol": {
                      "type": "string"
                    }
                  },
                  "required": ["assetType", "feesUsd", "id", "limitPriceUsd", "quantity", "side", "symbol"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "policy": {
                "properties": {
                  "expirationBufferMinutes": {
                    "maximum": 10080,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "maxContractsPerOrder": {
                    "maximum": 100000,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "maxDailyLossUsd": {
                    "pattern": "^(0|[1-9][0-9]{0,12})(\\.[0-9]{1,6})?$",
                    "type": "string"
                  },
                  "maxExposureUsd": {
                    "pattern": "^(0|[1-9][0-9]{0,12})(\\.[0-9]{1,6})?$",
                    "type": "string"
                  },
                  "maxOrderUsd": {
                    "pattern": "^(0|[1-9][0-9]{0,12})(\\.[0-9]{1,6})?$",
                    "type": "string"
                  },
                  "maxQuoteAgeSeconds": {
                    "description": "Defaults to maxSnapshotAgeSeconds",
                    "maximum": 300,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "maxSnapshotAgeSeconds": {
                    "maximum": 300,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "version": {
                    "maxLength": 128,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["expirationBufferMinutes", "maxContractsPerOrder", "maxDailyLossUsd", "maxExposureUsd", "maxOrderUsd", "maxSnapshotAgeSeconds", "version"],
                "type": "object"
              },
              "snapshot": {
                "properties": {
                  "asOf": {
                    "description": "UTC timestamp ending in Z",
                    "format": "date-time",
                    "type": "string"
                  },
                  "buyingPowerUsd": {
                    "pattern": "^(0|[1-9][0-9]{0,12})(\\.[0-9]{1,6})?$",
                    "type": "string"
                  },
                  "dailyLossUsd": {
                    "pattern": "^(0|[1-9][0-9]{0,12})(\\.[0-9]{1,6})?$",
                    "type": "string"
                  },
                  "exposureUsd": {
                    "pattern": "^(0|[1-9][0-9]{0,12})(\\.[0-9]{1,6})?$",
                    "type": "string"
                  },
                  "reservedUsd": {
                    "pattern": "^(0|[1-9][0-9]{0,12})(\\.[0-9]{1,6})?$",
                    "type": "string"
                  }
                },
                "required": ["asOf", "buyingPowerUsd", "dailyLossUsd", "exposureUsd", "reservedUsd"],
                "type": "object"
              }
            },
            "required": ["orders", "policy", "snapshot"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2bd366a8a23505b3375b4e32a916e62fee2dc496b1d090d357da908332ecb3da"
        }
      ],
      "digest": "sha256:64415d89926f7e8d8260b53bdfd80cfb2ce169bfa3a47e778de3307c3b7f76bf"
    }
  }
}
