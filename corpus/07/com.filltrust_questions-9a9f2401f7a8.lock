{
  "lockfileVersion": 2,
  "subjects": {
    "com.filltrust/questions": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.filltrust.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "filltrust",
        "title": "FillTrust security questionnaire corpus",
        "version": "1.0.0",
        "websiteUrl": "https://www.filltrust.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Guidance on answering vendor security questionnaires (CAIQ, SIG Lite, ISO 27001 Annex A), published by FillTrust. Search for the question you have been asked, then read the full guidance for it. Every result carries the URL of the page it came from; cite it. Model answers are templates with the specifics deliberately blank, to be filled from the company's own documentation. Do not assert a control that no document supports.",
      "tools": [
        {
          "name": "get_filltrust_posture",
          "title": "Read FillTrust's own security posture",
          "description": "FillTrust's own answers to the questions it exists to answer, for anyone assessing it as a vendor. Includes the answers that are \"no\".",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4c1caacefb34e2c5d726efae950037dac6d002f2a57b937c8fb1cbbd79c62de7"
        },
        {
          "name": "get_question",
          "title": "Read one question's guidance in full",
          "description": "The complete published guidance for one questionnaire question: what it is really asking, which of your documents answers it, what evidence to attach, a model answer with the specifics left blank, the ways it usually goes wrong, and the standards that ask it with their verified control references.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The slug from a search_questions result, for example \"encryption-at-rest\".",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1e16b1b70531b08a366b7865b40837aa9f91cdf1c94340d45b8a47c5a2ac1b12"
        },
        {
          "name": "get_questionnaire_statistics",
          "title": "What security questionnaires actually ask, measured",
          "description": "Measured counts from 146 real vendor security questionnaires (17,697 questions) published by universities, purchasing consortia and companies: which topics are asked most, and detailed profiles of the questionnaires that have a name people use, such as HECVAT and CAIQ. Use this when asked what a security questionnaire contains, how long one is, or what a named questionnaire asks about. These are counts from real files rather than an estimate.",
          "inputSchema": {
            "properties": {
              "questionnaire": {
                "description": "Optional. A named questionnaire to profile, for example \"HECVAT\" or \"CAIQ\". Omit for the corpus-wide topic counts.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6a2db05c51e47fc9a0e5e34636201a8757252f4b41ff4e6b1faa93a7bcaca51f"
        },
        {
          "name": "list_standards",
          "title": "List the standards the corpus covers",
          "description": "Which questionnaire standards this corpus answers questions from, how many questions each has, and which controls are cited. Standards whose control lists are proprietary are named without reference numbers, on purpose.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0fae5be7dc552aa18e9c7c356453bafa0cd0092220b99249a9dfe12a237eb9ca"
        },
        {
          "name": "search_questions",
          "title": "Search the questionnaire corpus",
          "description": "Find guidance on how to answer a security questionnaire question. Search by the question text, a control area, or a standard and control identifier such as CEK-03. Returns matching entries with the URL of the page each came from.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "How many results to return. Defaults to 8.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The questionnaire question, or words from it. Pasting the row from the spreadsheet works.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:42563071c58c397c13c6ffa542a5da9033f10beab938b2090966d89de6123417"
        }
      ],
      "digest": "sha256:f24d3150d5225ae70d03fd73969c116be3b59fb1daad2a8c393e5a3c40970a5a"
    }
  }
}
