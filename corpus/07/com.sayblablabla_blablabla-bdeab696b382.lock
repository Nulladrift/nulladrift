        {
          "name": "send_to_blablabla",
          "title": "Send a script to my blablabla inbox",
          "description": "Use this when the user wants to rehearse, run lines, learn or memorize lines, or prepare an audition or self-tape with a script or sides they attached or pasted in this chat and agrees to send it to blablabla, or when they ask to send, save or import such a script into their own blablabla account. The script waits in their blablabla inbox until they open the app and import it, the same way as a file shared from Files; in the app, blablabla reads the other characters' lines aloud and waits for theirs. Pass attached files exactly as provided (one script file, or up to 20 photos of its pages in page order). Use text only for a script the user pasted into the chat themselves, exactly as written, without summarizing, fixing or reformatting it. Never put your own transcription or description of an attached file or photo into text; if an attachment did not arrive, ask the user to attach it again. blablabla reads the script itself in the app. This app cannot read, search or list the user's blablabla scripts, and nothing about the script comes back here; the reply only confirms delivery. Do not use it to give feedback on, summarize or rewrite a script, and never for files that are not the user's own script; never invent a file or text.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "files": {
                "description": "Only when the app provides attached files as download links (ChatGPT): the files the user attached in this chat, exactly as provided: one script file (PDF, Word .docx, Final Draft .fdx, Fountain or plain text), or up to 20 photos that are the pages of ONE script, in page order. Otherwise call get_blablabla_upload_link. Do not use for pasted text; use text instead.",
                "items": {
                  "properties": {
                    "download_url": {
                      "description": "Temporary download URL supplied by the app for the attached file.",
                      "type": "string"
                    },
                    "file_id": {
                      "description": "File ID supplied by the app.",
                      "type": "string"
                    },
                    "file_name": {
                      "description": "Original file name, if known.",
                      "type": "string"
                    },
                    "mime_type": {
                      "description": "MIME type of the file, if known.",
                      "type": "string"
                    }
                  },
                  "required": ["download_url", "file_id"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "text": {
                "description": "Script text the user pasted into the chat themselves, EXACTLY as written: every line, speaker name, blank line and stage direction, without summarizing, correcting, translating, shortening or reformatting. Use only when the user pasted the text rather than attached a file. Never put your own transcription, reading or description of an attached file or photo here; attachments go in files. Up to 200,000 characters.",
                "maxLength": 200000,
                "minLength": 1,
                "type": "string"
              },
              "title": {
                "description": "Optional short name for the script, only if the user gave one. Never invent one.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "expires_at": {
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                "type": "string"
              },
              "file_count": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "item_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "kind": {
                "enum": ["document", "images", "text"],
                "type": "string"
              },
              "open_url": {
                "format": "uri",
                "maxLength": 120,
                "type": "string"
              },
              "status": {
                "enum": ["receiving", "waiting", "imported", "deleted", "expired"],
                "type": "string"
              }
