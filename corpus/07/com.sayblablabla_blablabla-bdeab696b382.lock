        {
          "name": "list_practice_monologues",
          "title": "Find practice monologues",
          "description": "Use this when an actor wants a solo monologue for reading, memorization, a cold read or selftape practice. Returns published original and public-domain pieces in the requested script language with one role, genre, age range, difficulty, estimated speaking duration, author and each piece's license. Use get_practice_monologue with the same locale to read a chosen piece. An empty list means no piece matches; never invent or cut text to meet a limit. Do not use for two-person scenes, private audition sides, unlisted play excerpts, automatic translation or casting judgments. Rights information applies only to the identified text or edition. This reading-only tool does not offer a verified native opening link or a live voice reader inside this chat.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "age_range": {
                "description": "Requested authored playing-age category: teen, adult or child. This filters material; it does not assess the actor's casting suitability.",
                "enum": ["teen", "adult", "child"],
                "type": "string"
              },
              "difficulty": {
                "description": "Requested practice difficulty: beginner, intermediate or advanced.",
                "enum": ["beginner", "intermediate", "advanced"],
                "type": "string"
              },
              "genre": {
                "description": "Requested genre: comedy or drama. Omit if the actor has no preference.",
                "enum": ["comedy", "drama"],
                "type": "string"
              },
              "locale": {
                "default": "en",
