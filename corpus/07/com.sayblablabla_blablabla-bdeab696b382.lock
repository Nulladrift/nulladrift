        {
          "name": "prepare_rehearsal_plan",
          "title": "Plan line learning and cast preparation",
          "description": "Use this when an actor asks to learn my lines, run lines or get off book; choose a personal task for their stated cue listening, memorization, cold read or selftape preflight need. Also use for an existing theatre or film/TV production cast's preparation, or an agent's or manager's clients' everyday rehearsal and audition preparation. Match the goal to the group and use their available days and daily minutes; label omitted values as examples. Accepts bounded planning metadata only. Do not use for casting decisions, private script import, rehearsal surveillance, account access, saved sessions or subscription purchases; it does not judge readiness or grant access.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "actor_count": {
                "description": "Number of cast members or represented clients; omit for an individual actor",
                "maximum": 5000,
                "minimum": 1,
                "type": "integer"
              },
              "daily_minutes": {
                "description": "Minutes each actor/client can practise daily, from 5 to 90; omit for a labeled 20-minute example. Every routine totals this time.",
                "maximum": 90,
                "minimum": 5,
                "type": "integer"
              },
              "days_available": {
                "description": "Available practice days, supplied by the user; an omitted value produces a clearly labeled seven-day example",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "deadline": {
                "description": "Real deadline date, for example 2026-10-12. Recorded as context only; does not calculate days_available or guarantee readiness. Supply available practice days separately.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "goal": {
                "description": "personal_lines for an individual actor learning or running lines; theatre_rehearsal for an existing theatre cast; production_cast_preparation for an existing film/TV production cast; agency_client_preparation for agents/managers supporting represented clients. Casting candidates use personal_lines, not shared cast preparation.",
                "enum": ["personal_lines", "theatre_rehearsal", "production_cast_preparation", "agency_client_preparation"],
                "type": "string"
              },
              "languages": {
                "description": "Script/practice languages, for example [en, da]; omit for a labeled English example. These are planning preferences, not automatic translations or proof of published audio.",
                "items": {
                  "enum": ["en", "ar", "ca", "cs", "da", "de", "el", "es", "es-mx", "fi", "fr", "fr-ca", "he", "hi", "hr", "hu", "id", "it", "ja", "ko", "ms", "nl", "no", "pl", "pt-br", "pt-pt", "ro", "ru", "sk", "sv", "th", "tr", "uk", "vi", "zh-hans", "zh-hant"],
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "personal_task": {
                "description": "For personal_lines only: cue_listening for missed partner cues; memorization for exact line recall; cold_read for unfamiliar material; self_tape_preflight for rehearsal and landscape camera checks. Use only the actor's stated need; omit for the general routine. Never infer readiness.",
                "enum": ["cue_listening", "memorization", "cold_read", "self_tape_preflight"],
                "type": "string"
              },
              "production_count": {
                "description": "Number of existing productions; omit for an individual or agency routine. This does not create productions or casting calls.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "rights_status": {
                "description": "The user's stated permission to use/share/voice material. This is planning context, not a rights or account-access verification.",
                "enum": ["confirmed", "needs_check", "unknown"],
                "type": "string"
              },
              "script_status": {
                "description": "The user's stated script status: approved material ready, material still needing review, or no material. This tool does not inspect or verify a script.",
                "enum": ["ready", "needs_review", "not_available"],
                "type": "string"
              }
            },
            "required": ["goal"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "assumptions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "audience": {
                "enum": ["actor", "production_cast", "agency_clients"],
                "type": "string"
              },
