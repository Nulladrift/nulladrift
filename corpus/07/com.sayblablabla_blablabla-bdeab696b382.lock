                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "action": {
                      "type": "string"
                    },
                    "minutes": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "purpose": {
                      "type": "string"
                    }
                  },
                  "required": ["action", "minutes", "purpose"],
                  "type": "object"
                },
                "type": "array"
              },
              "deadline": {
                "type": "string"
              },
              "goal": {
                "description": "personal_lines for an individual actor learning or running lines; theatre_rehearsal for an existing theatre cast; production_cast_preparation for an existing film/TV production cast; agency_client_preparation for agents/managers supporting represented clients. Casting candidates use personal_lines, not shared cast preparation.",
                "enum": ["personal_lines", "theatre_rehearsal", "production_cast_preparation", "agency_client_preparation"],
                "type": "string"
              },
              "languages": {
                "items": {
