        {
          "name": "get_blablabla_upload_link",
          "title": "Get a one-time link to upload a script",
          "description": "Use when the user wants to send a script file, or photos of its pages, to blablabla but this app cannot pass the file to send_to_blablabla (it has no download link for it, or send_to_blablabla said no usable file arrived). Returns a one-time link on sayblablabla.com. Give the user upload_url exactly as returned and tell them to open it within 15 minutes, choose the file or photos there and tap Send. The file goes straight into their own blablabla inbox and never passes through this chat. Check the result later with get_blablabla_inbox_status and the link_id. For pasted text use send_to_blablabla instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "The language of this conversation, for example en or da, so the upload page speaks it.",
