{
  "lockfileVersion": 2,
  "subjects": {
    "com.sharpsyn/public": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://sharpsyn.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "SharpSyn",
        "version": "1.28.1",
        "websiteUrl": "https://sharpsyn.com"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "SharpSyn (sharpsyn.com) is a sourcing platform for fine chemicals, intermediates and APIs. Use these tools to find a compound by name, CAS number or InChIKey, read what SharpSyn knows about it - verified suppliers (count, regions, grades), price range per kg with a confidence label, cradle-to-gate carbon footprint (PCF) with tier and source - and give the user a link to request quotes. Cite the compound's page URL. Prices and CO2 values are indicative, never offers.",
      "tools": [
        {
          "name": "get_compound",
          "description": "Everything SharpSyn publishes about one compound, given its CAS number,\n    InChIKey or name: identifiers, structure (SMILES, InChI), number of verified\n    suppliers with regions, grades and lead times, price range per kg with its\n    confidence label and data date, the cradle-to-gate carbon footprint with\n    tier, source and uncertainty, and the page URL to cite. If the compound has\n    no public page, says so and gives a link where the user can still ask\n    suppliers for it.",
          "inputSchema": {
            "properties": {
              "identifier": {
                "title": "Identifier",
                "type": "string"
              }
            },
            "required": ["identifier"],
            "title": "get_compoundArguments",
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get compound"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:519d1de5d6168c3e62affca89d1e71ef2aa8f8011c09b7fe3fb6cdc57d6e70cb"
        },
        {
          "name": "list_suppliers",
          "description": "Suppliers listed publicly on SharpSyn (companies that asked to be listed),\n    optionally only those in one country or offering one compound (CAS, InChIKey\n    or name). Returns company name, country, website, number of public listings\n    and the profile URL.",
          "inputSchema": {
            "properties": {
              "compound": {
                "default": "",
                "title": "Compound",
                "type": "string"
              },
              "country": {
                "default": "",
                "title": "Country",
                "type": "string"
              }
            },
            "title": "list_suppliersArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "title": "Result",
                "type": "array"
              }
            },
            "required": ["result"],
            "title": "list_suppliersOutput",
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List suppliers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c7e8efcd2d22b83a1d199d250274a8aef78ab74d62debe1781497a8a2efe24ff"
        },
        {
          "name": "request_quote_link",
          "description": "A link the user opens to ask SharpSyn's suppliers for a quote on a\n    compound (CAS number, InChIKey or name). Nothing is sent by calling this:\n    the user fills in quantities and sends the request themselves.",
          "inputSchema": {
            "properties": {
              "identifier": {
                "title": "Identifier",
                "type": "string"
              }
            },
            "required": ["identifier"],
            "title": "request_quote_linkArguments",
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Quote request link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:73ab406dc358e2b1f4baec4ae21c90e9904157f8b35c3c408c4b84a9a1e16b03"
        },
        {
          "name": "search_compounds",
          "description": "Find compounds on SharpSyn by name, synonym, CAS number, InChIKey or\n    molecular formula. Returns name, CAS, InChIKey, page URL and a summary of\n    suppliers, price and carbon footprint for each match, best matches first.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "search_compoundsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "title": "Result",
                "type": "array"
              }
            },
            "required": ["result"],
            "title": "search_compoundsOutput",
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search compounds"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ca18cd289399cd520ffcf40a54edfb3d0cea4c82c1f2ebd4898779f27edfa937"
        },
        {
          "name": "value_chain",
          "description": "What a compound is made from (direction 'up', its precursors) or what\n    it is used to make ('down', derived products), following main industrial\n    routes for `depth` steps (1 to 4). Each entry has its name, CAS and page\n    URL where SharpSyn has one.",
          "inputSchema": {
            "properties": {
              "depth": {
                "default": 1,
                "title": "Depth",
                "type": "integer"
              },
              "direction": {
                "default": "up",
                "title": "Direction",
                "type": "string"
              },
              "identifier": {
                "title": "Identifier",
                "type": "string"
              }
            },
            "required": ["identifier"],
            "title": "value_chainArguments",
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Value chain"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:10b84bfff10f18cfc8ca86409371aba9bb8809e5da963f5dc50e9d782c31190d"
        },
        {
          "name": "where_is_it_made",
          "description": "Where a compound is produced, from the SharpSyn Chemical World Map:\n    the known production sites (name, operator, country, coordinates), how\n    they spread over countries (share per country, single-site warning), the\n    confidence and source of each entry, and the page and map links to cite.\n    Site products from public research are estimates; operators marked\n    'unclaimed' have profiles built from public sources, not managed by them.\n    Each site has the status of the line (operating, closure_announced, idle,\n    planned, under_construction, closed, with dates), the operator of that\n    line and its capacity (t/a with basis, year and reference substance).\n    By default only lines producing now; include_inactive adds the rest.\n    Shares per country by site count and by capacity, and the coverage: how\n    many sites are known, how many with capacity, and what share of world\n    production that is where the world production is on record.",
          "inputSchema": {
            "properties": {
              "identifier": {
                "title": "Identifier",
                "type": "string"
              },
              "include_inactive": {
                "default": false,
                "title": "Include Inactive",
                "type": "boolean"
              }
            },
            "required": ["identifier"],
            "title": "where_is_it_madeArguments",
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Where is it made"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:821f203dd641be6630ed02d48191ee854db51213054accfb3b8957df69f4863f"
        }
      ],
      "digest": "sha256:a8f31a30260543765c7493de84e0d81020db14d2ac6dfa2084a42192817f6a63"
    }
  }
}
