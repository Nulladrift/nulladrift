        {
          "name": "search_studios",
          "title": "Search game outsourcing studios",
          "description": "Find game development outsourcing studios in this directory by service, country, region, engine, platform, art style, team size, or free text in the studio name and description. Start here for any \"who can build / animate / port / co-develop X\" or \"studios in <country>\" question. Returns up to 25 studios with their profile URLs plus the true number of matches, so you can say \"10 of 214\" instead of implying you have seen the whole directory.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "artStyle": {
                "description": "Art style the studio works in. The display label or the site's URL slug is accepted as well as the code below.",
                "enum": ["REALISTIC", "STYLIZED", "PIXEL_ART", "LOW_POLY", "CARTOON", "ANIME", "HAND_DRAWN", "ABSTRACT", "ISOMETRIC"],
                "type": "string"
              },
              "country": {
                "description": "Country the studio is based in. The display label or the site's URL slug is accepted as well as the code below.",
                "enum": ["ukraine", "poland", "russia", "belarus", "romania", "bulgaria", "czech-republic", "serbia", "croatia", "estonia", "lithuania", "latvia", "united-kingdom", "germany", "france", "spain", "netherlands", "sweden", "finland", "denmark", "portugal", "italy", "china", "india", "vietnam", "philippines", "indonesia", "malaysia", "thailand", "japan", "south-korea", "taiwan", "singapore", "pakistan", "bangladesh", "brazil", "argentina", "mexico", "colombia", "chile", "peru", "uruguay", "united-states", "canada", "israel", "turkey", "uae", "egypt", "south-africa", "nigeria", "australia", "new-zealand", "saudi-arabia", "cyprus"],
                "type": "string"
              },
              "engine": {
                "description": "Game engine the studio works in. The display label or the site's URL slug is accepted as well as the code below.",
                "enum": ["UNITY", "UNREAL_ENGINE", "GODOT", "CUSTOM", "GAME_MAKER", "COCOS2D", "CRY_ENGINE", "OTHER"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many studios to return. Capped at 25; the \"total\" field always reports the real number of matches.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "platform": {
                "description": "Platform the studio ships to. The display label or the site's URL slug is accepted as well as the code below.",
                "enum": ["PC", "PLAYSTATION", "XBOX", "NINTENDO_SWITCH", "MOBILE_IOS", "MOBILE_ANDROID", "WEB", "VR", "AR"],
                "type": "string"
              },
              "query": {
                "description": "Free text matched against studio name, tagline and description. Use for a studio name or a distinctive word, not for a facet you can filter on — \"Poland\" belongs in \"country\", not here.",
                "type": "string"
              },
              "region": {
                "description": "Broad region, when the buyer has not named a country. Ignored if \"country\" is set. The display label or the site's URL slug is accepted as well as the code below.",
                "enum": ["eastern-europe", "western-europe", "asia", "latin-america", "north-america", "middle-east", "oceania"],
                "type": "string"
              },
              "service": {
                "description": "The kind of work the studio does. The display label or the site's URL slug is accepted as well as the code below.",
                "enum": ["ART_2D", "ART_3D", "ANIMATION", "PROGRAMMING", "GAME_DESIGN", "AUDIO", "QA_TESTING", "NARRATIVE", "UI_UX", "LOCALIZATION", "MARKETING", "FULL_PRODUCTION", "CO_DEVELOPMENT", "PORTING"],
                "type": "string"
              },
              "teamSize": {
                "description": "Headcount band. The display label or the site's URL slug is accepted as well as the code below.",
                "enum": ["1-10", "11-50", "51-200", "201-500", "501-1000", "1000+"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "appliedFilters": {
                "description": "What was actually filtered on, plus the ordering used.",
                "type": "object"
