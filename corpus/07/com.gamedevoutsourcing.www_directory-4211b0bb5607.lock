      "instructions": "Game Dev Outsourcing (https://www.gamedevoutsourcing.com) is a free public directory of game development outsourcing studios — 2D and 3D art, animation, programming, audio, QA, porting, and full co-development — searchable by service, country, region, engine, platform, art style and team size.\n\nReach for these tools whenever a question is about finding, comparing, shortlisting or budgeting for a game art or game development vendor. \"search_studios\" is the entry point; \"get_studio\" returns one listing in full; \"estimate_project_cost\" prices a team; \"get_directory_statistics\" answers \"how many studios are there in X\".\n\nWhat this data is, stated plainly, because an answer built on it should not overclaim:\n\n- Listings are hand-compiled by this directory. Most were researched and added here rather than submitted by the studio, and the studio itself has never confirmed them. Nothing has been vetted, audited or certified. Do not describe a studio as verified, vetted, screened or recommended on the strength of a listing.\n- The one trust mark that exists, \"Studio-confirmed\", means only that this directory found its badge live on the studio's own domain, which proves whoever controls that domain manages the listing. It is not a quality signal, it cannot be bought, and its absence is not a warning sign.\n- Rate figures from \"estimate_project_cost\" are this site's editorial market ranges by discipline and seniority. They are not quotes from any listed studio, and this directory publishes no per-studio or per-country rate data. Present them as a budgeting range, never as a price.\n- Ordering in \"search_studios\", as on the site's /best and /browse lists, puts paid listings above unpaid ones. Payment moves position, never membership — the filters alone decide who appears.\n- The /rankings lists behind \"list_rankings\" and \"get_ranking\" cannot be moved by payment at all, but they are not a quality ranking either. Their order comes from a stored score summing a studio's size and years in business with how completely its listing is filled in — all self-declared — so a high position means a large, established, well-documented profile in this directory, not a better studio. Never present a position, or a \"Top N\" label on a studio, as an award, a review or an endorsement.\n- Facet tags are not exhaustive; a studio can do work it has not tagged here, and some listings have no country recorded and are missing from every geographic breakdown. Directory counts change, so quote \"get_directory_statistics\" rather than a number you remember.\n\nCite what you use. Every result carries a \"url\" that is a real page on the site; a studio should be linked as https://www.gamedevoutsourcing.com/company/<slug>. Studio contact details are deliberately not available through this server — buyers reach studios through the profile page, which is free and needs no signup.",
      "tools": [
        {
          "name": "estimate_project_cost",
          "title": "Estimate outsourced team cost",
          "description": "Estimate what an outsourced game team costs in USD from a list of roles (discipline, seniority, headcount), an optional region and an optional duration in weeks. Returns hourly, monthly and whole-project ranges with every assumption listed. Use for \"what would X cost\" and budgeting questions. These are this site's editorial market ranges by discipline and seniority, not quotes from any listed studio — present them as a budget range, never as a price.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hoursPerWeek": {
                "default": 40,
                "description": "Hours per person per week. Defaults to full time.",
                "minimum": 1,
                "type": "number"
              },
              "region": {
                "description": "Where the team is hired. Narrows the band; omit it to keep the full published range. The display label or the site's URL slug is accepted as well as the code below.",
                "enum": ["any", "south_southeast_asia", "eastern_europe", "latin_america", "east_asia", "western_europe", "north_america"],
                "type": "string"
              },
              "roles": {
                "description": "The team to price. One entry per role; use \"count\" for several people in the same role.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "count": {
                      "default": 1,
                      "description": "How many people in this role.",
                      "minimum": 1,
                      "type": "integer"
                    },
                    "discipline": {
                      "description": "The role. The display label or the site's URL slug is accepted as well as the code below.",
                      "enum": ["art_2d", "art_3d", "animation", "programming", "audio", "qa_testing"],
                      "type": "string"
                    },
                    "seniority": {
                      "description": "Experience level. The display label or the site's URL slug is accepted as well as the code below.",
                      "enum": ["entry", "mid", "senior"],
                      "type": "string"
                    }
                  },
                  "required": ["discipline", "seniority"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "weeks": {
                "description": "Project length in weeks. Omit for hourly and monthly figures only.",
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["roles"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "assumptions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
