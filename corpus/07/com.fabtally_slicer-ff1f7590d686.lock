        {
          "name": "optimize_orientation",
          "title": "Optimize 3D-print orientation (least support)",
          "description": "FREE (personal/interactive; fair-use limited — counts as ~4 slices). Orientation optimiser: really slices up to 4 candidate build orientations with automatic supports and recommends the one using the LEAST support material (exact, slice-derived), with the filament/time saved vs printing as-is and an estimated price. Paste a link: a GitHub blob, Google Drive or Dropbox share link, a direct .stl/.3mf/.obj/.ply/.step URL, or a .zip (first printable model inside is used). Thingiverse/Printables/MakerWorld pages usually block server downloads: download the file yourself and upload it. Local file? Upload once at https://fabtally.com/upload and paste that URL. Reduces support waste, print time and post-processing. Agents / high volume: prepaid credits or the x402 agent lane.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
