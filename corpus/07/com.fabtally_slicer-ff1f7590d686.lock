        {
          "name": "analyze_3d_model",
          "title": "Analyze a 3D model (general, beyond printing)",
          "description": "FREE general 3D-model analysis — bounding box, volume, triangle count, watertight/manifold, solidity — useful BEYOND 3D printing: game-asset & real-time mesh QC, AR/VR asset optimisation, 3D-marketplace upload validation, engineering sanity checks. Accepts STL/3MF/OBJ/PLY. Paste a link: a GitHub blob, Google Drive or Dropbox share link, a direct .stl/.3mf/.obj/.ply/.step URL, or a .zip (first printable model inside is used). Thingiverse/Printables/MakerWorld pages usually block server downloads: download the file yourself and upload it. Local file? Upload once at https://fabtally.com/upload and paste that URL. Geometry-only, uncapped.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "filename": {
                "description": "File name incl. extension, e.g. 'bracket.stl'. Required with model_base64.",
                "type": "string"
              },
              "model_base64": {
                "description": "Base64 model bytes — small-file fallback only (roughly <50KB). MCP clients (Claude/ChatGPT Desktop) truncate large inline tool arguments, so a real STL can silently arrive corrupted. For anything bigger use model_url (upload at https://fabtally.com/upload first). Provide `filename` too.",
                "type": "string"
              },
              "model_url": {
                "description": "PREFERRED. Public URL to the 3D model. Paste a link: a GitHub blob, Google Drive or Dropbox share link, a direct .stl/.3mf/.obj/.ply/.step URL, or a .zip (first printable model inside is used). Thingiverse/Printables/MakerWorld pages usually block server downloads: download the file yourself and upload it. Local file? Upload once at https://fabtally.com/upload and paste that URL. The server fetches and (if a zip) unpacks it.",
                "format": "uri",
                "type": "string"
              },
              "printer": {
                "description": "Printer id from list_printers (elegoo-centauri-carbon, elegoo-neptune4-max, bambu-a1, bambu-a1-mini, bambu-p1s, bambu-x1c, prusa-mk4, prusa-mini, ender3-v3, creality-k1, creality-k1-max, voron-24-350, anycubic-kobra2). Default elegoo-centauri-carbon.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
