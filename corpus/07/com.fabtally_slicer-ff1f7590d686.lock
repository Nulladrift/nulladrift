        {
          "name": "check_printability",
          "title": "Check 3D-print printability (DFM)",
          "description": "FREE 3D-printing DFM / printability check for an STL/3MF/OBJ/PLY model. Paste a link: a GitHub blob, Google Drive or Dropbox share link, a direct .stl/.3mf/.obj/.ply/.step URL, or a .zip (first printable model inside is used). Thingiverse/Printables/MakerWorld pages usually block server downloads: download the file yourself and upload it. Local file? Upload once at https://fabtally.com/upload and paste that URL. Default (full=false): a fast geometry-only read — printable verdict (yes/with-warnings/no), watertight/manifold, dimensions & volume, fits-on-bed, wall-thickness estimate vs the 0.4mm nozzle, overhang heuristic. Set full=true for the complete report with EXACT support-material grams/time and infill material-saving deltas from REAL slices (every field labelled exact vs heuristic). Both are FREE for personal/interactive use (fair-use limits); agents/high-volume use prepaid credits or the x402 lane.",
