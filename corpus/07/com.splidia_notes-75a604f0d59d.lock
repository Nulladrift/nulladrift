      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.splidia/notes",
        "title": "SPLIDIA — Fibre, Networks and Data Centres",
        "version": "1.2.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Server MCP read-only di SPLIDIA (splidia.com), marchio del gruppo CSIDIA S.r.l.: giunzione e certificazione della fibra ottica, progettazione di reti ottiche, cablaggio di data center, reti industriali, IT e AI applicata alle infrastrutture. Su questo endpoint i tool rispondono per impostazione predefinita sui contenuti e sui servizi di SPLIDIA: usa 'capabilities' per il catalogo dei servizi, 'match_use_case' per capire quale servizio risolve un'esigenza descritta a parole, 'search' e 'fetch' per gli articoli tecnici. Per estendere la risposta all'intero gruppo (inclusa csidia.com: AI privata con modelli a pesi aperti addestrati sul compito del cliente) passa site: 'all'.",
      "tools": [
        {
          "name": "capabilities",
          "title": "CSIDIA group services and profile",
          "description": "Profilo del gruppo CSIDIA e catalogo dei servizi: chi siamo, posizionamento, capacità (cosa facciamo, risultati, settori, modelli di erogazione, pagina, articoli correlati), settori, vincoli e come iniziare. csidia = AI privata con modelli a pesi aperti addestrati o rifiniti sul compito del cliente, sull'infrastruttura di CSIDIA o sulla sua; splidia = fibra ottica/reti/data center. / Profile of the CSIDIA group and its service catalogue: positioning, capabilities, sectors, delivery models, constraints and how to start. csidia = private AI with open-weight models trained or fine-tuned for the client's task; splidia = optical fibre, networks, data centres.",
          "inputSchema": {
            "properties": {
              "capability_id": {
                "description": "Dettaglio di una sola capacità, per id (es. 'conformita-documentale-assistita') / detail for a single capability id",
                "type": "string"
              },
              "detail": {
                "description": "false (default) = una riga per capacità, risposta compatta; true = descrizione completa, risultati, domande tipiche e articoli correlati / false (default) = one line per capability; true = full detail",
                "type": "boolean"
              },
              "language": {
                "description": "Lingua dei testi (default it) / text language",
                "enum": ["it", "en"],
                "type": "string"
              },
              "site": {
                "description": "Marchio di cui restituire il profilo (default all) / brand to profile",
                "enum": ["all", "csidia", "splidia"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1e597e84538d811d3d81e0c5ceb3457ce8f885cdab65ed178e5ef43a912c5f60"
        },
        {
          "name": "fetch",
          "title": "Fetch a full article",
          "description": "Ritorna il testo integrale di un articolo dato il suo id (l'URL restituito da 'search'). / Returns the full text of an article given its id (the URL returned by 'search').",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Id/URL dell'articolo",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fda3af0deb876db6bfbb61c513573b2b6a49235621491eb5a109036de4b73e1b"
        },
        {
          "name": "match_use_case",
          "title": "Match a need to CSIDIA capabilities",
          "description": "Data la descrizione libera di un'esigenza operativa, restituisce le capacità del gruppo CSIDIA più pertinenti, con il perché (termini che hanno fatto match), il sito di riferimento, il modello di erogazione, gli articoli correlati e il passo successivo. Se non c'è corrispondenza lo dice e restituisce il profilo sintetico. / Given a free-text operational need, returns the most relevant CSIDIA capabilities with the reason for the match, reference site, delivery model, related articles and next step.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Lingua dei testi (default it) / text language",
                "enum": ["it", "en"],
                "type": "string"
              },
              "limit": {
                "description": "Numero massimo di capacità (default 3)",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "need": {
                "description": "Descrizione libera dell'esigenza o del problema / free-text description of the need",
                "type": "string"
              },
              "sector": {
                "description": "Settore di riferimento, id o nome (es. manufacturing, energy, logistics, public-sector, healthcare, defence, telecomunicazioni, data-center, industria) / sector id or name",
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:85dca7d0d1759a81dc32ae0d04e5369301dfbc37be2694bf27e309e540d13da7"
        },
        {
          "name": "search",
          "title": "Search CSIDIA group articles",
          "description": "Cerca negli articoli (Note operative) di csidia.com (AI privata: modelli a pesi aperti addestrati sul compito del cliente, conformità, dati riservati) e splidia.com (fibra ottica, reti, data center). Ritorna una lista di risultati con id da passare a 'fetch'. / Searches the operational notes of csidia.com (private AI: open-weight models trained for the client's task) and splidia.com (optical fibre, networks, data centres). Returns results whose id can be passed to 'fetch'.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Filtro lingua (default all)",
                "enum": ["all", "it", "en"],
                "type": "string"
              },
              "limit": {
                "description": "Numero massimo di risultati (default 8)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Termini di ricerca / search terms",
                "type": "string"
              },
              "site": {
                "description": "Filtro sito (default all)",
                "enum": ["all", "csidia", "splidia"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:24588a8d754769e3bfb6f348f81436dfa044ee0d2f5b58c9f5bccb4b801ceea2"
        }
      ],
