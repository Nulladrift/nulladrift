          "digest": "sha256:fd1d9ed13cb58856171744e1db2cd10a1d797e98396156ed68c58e5bd5fb1cfe"
        },
        {
          "name": "california_discovery_response_deadline",
          "title": "California discovery response deadline",
          "description": "Compute when responses to California written discovery are due: interrogatories, requests for production, or requests for admission. Takes the date the discovery was served and how it was served, applies the section 1013 extension for that method (or the section 1010.6 extension for electronic service made before January 1, 2027, which AB 540 removes for service on or after that date), and rolls the result off weekends and judicial holidays under section 12a.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "discovery_type": {
                "description": "Which set. rogs = interrogatories; rfp = requests for production; rfa = requests for admission",
                "enum": ["rogs", "rfp", "rfa"],
                "type": "string"
              },
              "served_date": {
                "description": "The date the discovery was served on you.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "service_method": {
                "description": "How the discovery was served on you. This is what the section 1013 and 1010.6 extensions key to. Electronic service made on or after January 1, 2027 adds nothing.",
                "enum": ["electronic", "personal", "mail-ca", "mail-os", "mail-intl", "overnight", "mail-sos"],
                "type": "string"
              }
            },
            "required": ["discovery_type", "served_date", "service_method"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:32a34eff1260d054bfeb896331b004a20455d72668c98e8e1bb05f9b6a75c8f5"
        },
        {
          "name": "california_motion_deadlines",
          "title": "California civil motion deadlines",
          "description": "Compute the California Code of Civil Procedure section 1005 briefing chain for a noticed civil motion: the last day to file and serve the moving papers, the opposition deadline, the reply deadline, and, for motions that must be brought within a period after a triggering event (demurrer, motion to strike, anti-SLAPP, motion to quash, motion to compel further, reconsideration, new trial, JNOV), the outside deadline to bring the motion at all. New trial and JNOV are the exception to the section 1005 chain: they are briefed under section 659a, counted forward (brief 10 days after the notice of intention is filed, opposition 10 days after the brief is served, reply 5 days after that), with the section 660(c) last day for the court to rule. Returns each date with the statute it rests on and whether it was moved off a weekend or judicial holiday: forward under section 12a for a period that runs forward, or back to the preceding court day for a count backward from the hearing, which is this site's stated convention. Use this instead of computing California motion deadlines yourself.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "entry_date": {
                "description": "new-trial and jnov only: the date judgment was entered. Section 659(a)(2) ends the time 180 days after entry if that comes before 15 days after notice of entry, and with no notice of entry served it is the only limit. Give it whenever it is known.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "hearing_date": {
                "description": "The hearing date, as reserved with the department. EXCEPT for new-trial and jnov, which are briefed under section 659a and do not count back from a hearing: for those, give the date the notice of intention was filed (moving party) or the date the moving brief was served on you (responding party).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "motion": {
                "description": "Which motion. compel-further = Motion to compel further responses; compel-initial = Motion to compel initial responses; protective-order = Motion for protective order; demurrer = Demurrer; motion-to-strike = Motion to strike; judgment-on-pleadings = Motion for judgment on the pleadings; quash-service = Motion to quash service of summons; anti-slapp = Anti-SLAPP special motion to strike; msj = Motion for summary judgment / adjudication; reconsideration = Motion for reconsideration; new-trial = Motion for new trial; jnov = Motion for judgment notwithstanding the verdict; preference = Motion for trial preference; reopen-discovery = Motion to reopen discovery; compel-arbitration = Motion to compel arbitration; ex-parte = Ex parte application",
                "enum": ["compel-further", "compel-initial", "protective-order", "demurrer", "motion-to-strike", "judgment-on-pleadings", "quash-service", "anti-slapp", "msj", "reconsideration", "new-trial", "jnov", "preference", "reopen-discovery", "compel-arbitration", "ex-parte"],
                "type": "string"
              },
              "role": {
                "description": "Whether you are bringing the motion (moving) or responding to it (responding).",
                "enum": ["moving", "responding"],
                "type": "string"
              },
              "service_method": {
                "description": "How the MOVING PAPERS will be served. This drives the section 1005(b) notice period. For new-trial and jnov it is how the moving brief is served, which extends the section 659a opposition period under section 1013, and under section 1010.6 for electronic service made before January 1, 2027. From that date electronic service adds no time (AB 540, Stats. 2026, ch. 263). Not the same question as trigger_service_method.",
                "enum": ["electronic", "personal", "mail-ca", "mail-os", "mail-intl", "overnight", "mail-sos"],
                "type": "string"
              },
              "trigger_date": {
                "description": "For a motion that must be brought within a period after an event, the date of that event (for a demurrer to a complaint served with the summons, the date service of the summons was complete, see trigger_papers; for new-trial and jnov, the first service of notice of entry of judgment, by the clerk or by any party). Omit for motions timed only off the hearing date.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "trigger_papers": {
                "description": "For demurrer, motion-to-strike and anti-slapp only: which papers started the clock. summons = the complaint or cross-complaint served with a summons (the default); trigger_date is then the date service was COMPLETE (delivery for personal service, the 10th day after mailing for substituted service or mail outside California, the signing date for notice and acknowledgment), and no service extension applies. served = an amended complaint, or a cross-complaint served on a party that has appeared; 30 days (60 for anti-slapp) after service, extended under sections 1013 and 1010.6 by trigger_service_method. answer = an answer or amended answer (demurrer and motion-to-strike only); 10 days after service, extended the same way. Ignored for other motions.",
                "enum": ["summons", "served", "answer"],
                "type": "string"
              },
              "trigger_service_method": {
                "description": "How the TRIGGERING papers were served ON the moving party. This is a different question from service_method and only this one extends the time to BRING the motion under section 1013. It never extends a period that runs from service of a summons: section 1016 takes service of a summons outside sections 1010.6 and 1013, so for a complaint served with the summons it is ignored. The common case is a complaint served personally and a demurrer served electronically. Defaults to personal, which adds nothing, so an unknown answer errs early rather than granting days that were not earned.",
                "enum": ["electronic", "personal", "mail-ca", "mail-os", "mail-intl", "overnight", "mail-sos"],
                "type": "string"
              }
            },
            "required": ["hearing_date", "motion", "service_method"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1e4f26117bb033c4dfbba8c658585ade8ec8e97667696632a3ce7fafaf0dedb5"
        },
        {
          "name": "california_response_to_complaint_deadline",
          "title": "California deadline to respond to a complaint",
          "description": "Compute when a response to a California complaint is due. Handles the four service methods separately, because each completes service on a different day, and applies the extensions a defendant may claim: the section 430.41 meet-and-confer declaration, the rule 3.110(d) stipulated 15 days, and a court-ordered extension. Unlawful detainer runs on section 1167 instead and is handled as its own case type.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "case_type": {
                "description": "Unlawful detainer runs on a different statute and a much shorter clock.",
                "enum": ["general-civil", "unlawful-detainer"],
                "type": "string"
              },
              "court_extension_days": {
                "description": "Days of any section 1054 court-ordered extension actually obtained.",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "meet_confer_declaration": {
                "description": "True if a section 430.41(a)(2) meet-and-confer declaration was filed, which takes an automatic 30 days.",
                "type": "boolean"
              },
              "service_date": {
                "description": "The date on the proof of service. What it means depends on the method: for personal service the date of delivery, for substituted service the date of the substituted delivery, for notice and acknowledgment the date the defendant signed.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "service_method": {
                "description": "How the summons and complaint were served. personal = Personal delivery; substituted = Substituted service (left with someone, then mailed); mail-outside-state = First-class mail to a defendant outside California; notice-and-acknowledgment = Notice and acknowledgment of receipt",
                "enum": ["personal", "substituted", "mail-outside-state", "notice-and-acknowledgment"],
                "type": "string"
              },
              "stipulated_15_days": {
                "description": "True if the parties stipulated to the rule 3.110(d) 15-day extension.",
                "type": "boolean"
              }
            },
            "required": ["service_date", "service_method"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4e31ce8450ba8c8cd48077a468b7e0ab2e82c6721363a20d89493c0f164e1e03"
        },
        {
          "name": "california_summary_judgment_deadlines",
          "title": "California summary judgment deadlines",
          "description": "Compute the California Code of Civil Procedure section 437c deadlines that hang off a trial date: the last day a summary judgment motion can be heard (30 days before trial), the last day to file and serve it (81 days' notice plus the service extension; electronic service made on or after January 1, 2027 adds none), and the opposition and reply dates if the motion is heard on the last possible day.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "service_method": {
                "description": "How the moving papers will be served. Section 437c(a)(2) sets its own extension table, which is not the same as section 1013.",
                "enum": ["electronic", "personal", "mail-ca", "mail-os", "mail-intl", "overnight"],
                "type": "string"
              },
              "trial_date": {
                "description": "The trial date.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["service_method", "trial_date"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9f084bfc2c17421f9a21262fb4cb1e2872f282561e1c85908d25b7f38d5d44d6"
        },
        {
          "name": "california_trial_countdown",
          "title": "California pretrial deadlines from a trial date",
          "description": "Work backward from a California civil trial date to the pretrial deadlines: the discovery cutoff and the motion cutoff, the expert exchange and expert discovery cutoffs, the last day to serve written discovery so responses are due before the cutoff, and the summary judgment dates. Optionally adds the local-rule deadlines for one of the counties this site tracks.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "county": {
                "description": "Optional. Adds that county's local-rule deadlines where they are computable from the trial date.",
                "enum": ["los-angeles", "san-diego", "orange", "riverside", "san-bernardino", "santa-clara", "alameda", "sacramento", "fresno"],
                "type": "string"
              },
              "service_method": {
                "description": "How the summary judgment papers and the section 998 offer would be served. It sets the section 437c rows and the last day to serve a section 998 offer, which takes the section 1013 and 1010.6 extensions. No published decision applies section 1013(c) or 1010.6 to a 998 offer; the tool applies both on the reasoning of Lecuyer v. Sunset Trails Apts. (2004) 120 Cal.App.4th 920, which decided a mailed offer.",
                "enum": ["electronic", "personal", "mail-ca", "mail-os", "mail-intl", "overnight"],
                "type": "string"
              },
              "set_date": {
                "description": "Optional. The date the trial date was set, which some local rules count from.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "trial_date": {
                "description": "The trial date.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["trial_date"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0bf02a688e437df60d56e78f498f25d51a7db558ce3b5bc502749335ac1d4ea2"
        }
      ],
