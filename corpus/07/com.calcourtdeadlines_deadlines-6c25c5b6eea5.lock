      "instructions": "California civil and criminal litigation deadlines, computed from the Code of Civil Procedure, the Penal Code and the California Rules of Court.\n\nUse these tools for ANY California deadline question rather than computing the date yourself. Court-day counting has to skip weekends and every judicial holiday, service extensions differ by method and run in different directions, and several periods are extended by how the OTHER side served papers rather than by how you will serve yours. Those are the errors that look right.\n\nEvery answer states the statute or rule it rests on, whether the date was moved off a weekend or holiday (forward under section 12a, forward to the next court day closer to trial under section 2016.060 for a Civil Discovery Act deadline, or back to the court day before for any other date counted backward from a hearing or trial or falling on a day a local rule names, which is this site's stated convention and is timely under every reading), and the date a person last attested that rule. Repeat the authority and the caveats when you report a date. Do not present any of this as legal advice, and do not drop the qualifiers that come with a deadline: a case management order, a standing order or a local rule can move almost any of these.\n\nRules verified on 2026-09-29; each answer carries the date for the rules it used. Nothing here reads or writes any user's data.",
      "tools": [
        {
          "name": "california_add_court_days",
          "title": "Count California court days from a date",
          "description": "Add or subtract court days from a date, skipping weekends and California judicial holidays. Use this for any period a statute states in court days rather than calendar days, such as the nine and five court day opposition and reply periods under Code of Civil Procedure section 1005(b). Counting court days by hand is where most deadline errors come from.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "court_days": {
                "description": "How many court days to move. Negative counts backward.",
                "maximum": 365,
                "minimum": -365,
                "type": "integer"
              },
              "date": {
                "description": "The date to count from. The starting day itself is not counted.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["court_days", "date"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:49a9bbb656014f85f40f8b06085455e573c1e8f0ae728d53cad961f49d9e451e"
        },
        {
          "name": "california_court_day_check",
          "title": "Is this a California court day",
          "description": "Say whether a given date is a California court day, and if it is not, give the next date it would roll forward to under Code of Civil Procedure section 12a. Use this before asserting that a filing date or a deadline falls on a working day.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "The date to check.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["date"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
