          "digest": "sha256:e934acb209f15c3bea9104d6e51e01d79692f151421299c2714b4a278734a29b"
        },
        {
          "name": "california_court_holidays",
          "title": "California court holidays for a year",
          "description": "List every California judicial holiday for a given year, with the date it is observed. These are the days excluded when counting court days and the days a deadline rolls off under Code of Civil Procedure section 12a. Includes the weekend-observed shifts, which are the ones most often got wrong.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "year": {
                "description": "Four-digit year.",
                "maximum": 2100,
                "minimum": 2000,
                "type": "integer"
              }
            },
            "required": ["year"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
