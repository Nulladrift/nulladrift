        {
          "name": "biz_order_status",
          "title": "Check pickup order payment",
          "description": "Read the CURRENT state of a pickup order placed through this connector, by its confirmation code (the LBB-XXXXXX style code biz_order returned). It answers with the order state, the payment state, whether it is PAID, the pickup window, the business name and the total, and nothing else: no customer name, no items and no payment link. Use it after a customer has been sent to a checkout page, to tell them whether the payment has landed and the order is placed. It changes nothing. A code that names no order comes back not found.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "confirmationCode": {
                "description": "The order confirmation code, e.g. LBB-KKA8Y2. Case does not matter.",
                "type": "string"
              }
            },
            "required": ["confirmationCode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check pickup order payment"
          },
          "behavior": {
