                "description": "For guest_add: the guest's number.",
                "maxLength": 40,
                "type": "string"
              },
              "question": {
                "description": "For faq_answer: the question.",
                "maxLength": 200,
                "type": "string"
              },
              "section": {
                "description": "Which part of the event, instead of `field`.",
                "enum": ["booth_geo", "booth_menu", "booth_text", "event_about_paragraphs", "event_about_title", "event_accent", "event_address", "event_cover", "event_dates", "event_description", "event_faq", "event_meet_tab", "event_name", "event_organizer", "event_organizer_logo", "event_recurrence", "event_start_time", "event_subtitle", "event_venue", "personal_accent", "personal_arrival_note", "personal_dress_code", "personal_faq", "personal_hosts", "personal_links", "personal_people", "personal_places", "personal_registry", "personal_story", "session_booth", "session_room", "session_speakers", "session_text", "session_time", "session_title", "speaker_links", "speaker_name", "speaker_profile"],
                "type": "string"
