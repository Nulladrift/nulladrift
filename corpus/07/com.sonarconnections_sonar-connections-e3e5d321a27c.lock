                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["eventIdOrName", "ops", "siteId"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "anyOf": [
              {
                "required": ["applied", "changes", "ok"]
              },
              {
                "properties": {
                  "ok": {
