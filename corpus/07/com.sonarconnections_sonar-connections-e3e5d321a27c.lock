              },
              "confirm": {
                "description": "Absent on the first call, which changes nothing. true, together with confirmToken, applies it.",
                "type": "boolean"
              },
              "confirmToken": {
                "description": "The token the first call returned. Needed when confirm is true.",
                "type": "string"
              },
              "eventId": {
                "description": "The event id or public slug the booth is at.",
                "type": "string"
              }
            },
            "required": ["boothId", "eventId"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "anyOf": [
