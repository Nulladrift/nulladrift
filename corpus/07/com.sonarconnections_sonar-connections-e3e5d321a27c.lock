                "type": "string"
              },
              "boothId": {
                "description": "The booth id.",
                "maxLength": 128,
                "type": "string"
              },
              "confirm": {
                "description": "Absent previews; true sends.",
                "type": "boolean"
              },
              "eventIdOrName": {
                "description": "The event id or name as the organizer spells it.",
                "type": "string"
              },
              "intent": {
                "description": "Buyer, Vendor, Networker or Social.",
