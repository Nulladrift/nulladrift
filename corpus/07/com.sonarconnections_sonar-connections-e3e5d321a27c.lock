                            },
                            "required": ["href", "label"],
                            "type": "object"
                          }
                        ]
                      },
                      "maxItems": 8,
                      "type": "array"
                    },
                    "navLabel": {
                      "maxLength": 24,
                      "type": "string"
                    },
                    "node": {
                      "description": "Block or band id or label.",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "op": {
                      "description": "set_layout puts a row in `columns` 1 to 3; move and insert may go `rightOf` or `leftOf` a block.",
                      "enum": ["move", "insert", "remove", "remove_page", "set_text", "set_link", "set_style", "set_theme", "add_page", "rename_page", "reorder_nav", "set_layout"],
                      "type": "string"
                    },
                    "page": {
                      "maxLength": 60,
                      "type": "string"
