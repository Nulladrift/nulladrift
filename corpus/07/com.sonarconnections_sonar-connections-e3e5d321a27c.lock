              },
              "entryTitle": {
                "description": "For schedule_time: the row title as spelled.",
                "maxLength": 200,
                "type": "string"
              },
              "eventIdOrName": {
                "description": "The event id or the event name as the hosts spell it.",
                "type": "string"
