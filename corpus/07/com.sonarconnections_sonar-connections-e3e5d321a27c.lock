        {
          "name": "biz_order",
          "title": "Place a pickup order",
          "description": "Places a pickup pre-order at a business served through this connector: placing an order, a pickup order, or the checkout after biz_menu. Needs `items` and a `pickupWindowId` from biz_menu and the collector's first name; no phone, email, surname or card is collected. Businesses served here: Long Beach Brunch Bakehouse (longbeachbrunch, a neighborhood bakery and coffee bar). Reachable here but not through this tool: Velvet and Clay (velvetandclay), Brightpoint Dental (brightpointdental), Make Collectives (makecollectives) and Kristin Dunn Bookbinding and Design (kdbooks) take no pickup orders. Most orders are paid at pickup; where the reply is HELD, its `payUrl` is the only payment link this connector issues: give it exactly as returned. `isDemo` true reserves nothing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "business": {
                "description": "Which business, by name or id. Available: Long Beach Brunch Bakehouse (longbeachbrunch). The default (velvetandclay) takes no pickup orders, so NAME THE BUSINESS: an omitted argument is refused. An unclear name is REFUSED with the list, not answered about a different business.",
                "type": "string"
              },
              "businessId": {
                "description": "Alias for `business`; ignored when `business` is given.",
                "type": "string"
              },
              "firstName": {
                "description": "First name only.",
                "type": "string"
              },
              "items": {
                "description": "Order lines, at least one.",
                "items": {
                  "properties": {
                    "id": {
                      "description": "Item id from biz_menu.",
                      "type": "string"
                    },
                    "qty": {
                      "description": "Quantity.",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    }
                  },
                  "required": ["id", "qty"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "description": "Optional note, 140 characters; contact details are removed.",
                "type": "string"
              },
              "pickupWindowId": {
                "description": "Window id from biz_menu.",
                "type": "string"
              }
            },
            "required": ["firstName", "items", "pickupWindowId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Place a pickup order"
          },
          "behavior": {
            "destructive": false,
