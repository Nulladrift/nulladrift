            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "business": {
                "description": "Which business, by name or id. Available: Long Beach Brunch Bakehouse (longbeachbrunch). The default (velvetandclay) has no pickup menu here, so NAME THE BUSINESS: an omitted argument is refused. An unclear name is REFUSED with the list, not answered about a different business.",
                "type": "string"
              },
              "businessId": {
                "description": "Alias for `business`; ignored when `business` is given.",
                "type": "string"
              },
              "date": {
                "description": "Optional YYYY-MM-DD; today in the business timezone.",
                "type": "string"
