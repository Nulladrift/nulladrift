        {
          "name": "event_change_detail",
          "title": "Change one detail of a personal event (hosts only)",
          "description": "To change an existing event's pass palette or color (\"change the color to sage\"): call this tool with `field` \"color\" or \"palette\". THE HOSTS' OWN EDIT of a wedding or other personal event. IT APPLIES THE CHANGE ON THIS CALL, one `field` per call, and the reply says the detail now and before: read both out. A time needs am or pm, or a 24 hour time that reads one way; a bare \"4:30\" is refused. For faq_answer, `question` adds the entry or replaces its answer. Every change is logged and can be read back; event_change_undo reverses the caller's own latest one. Only the hosts can change it; read refusals (NOT_A_HOST, BAD_TIME, NO_SUCH_PLACE, NO_SUCH_ENTRY, NO_CHANGE) out as given; it sends no message and it changes nothing else on the event; the event's Wallet passes are updated with the new detail as a lock-screen notice and the reply's `passNotice` says how many passes were reached. Needs a personal connector token. ANY PART OF AN EVENT: with `section` and `op` (add, edit, remove, reorder) this changes the name, dates, venue, address, cover, FAQ, about text, speakers, booths and session details of a conference as well as a wedding. It applies on this call; a name, dates or time change previews first (confirm with the changeId). Read the reply out: it says what followed on the pass, the page and here, and what did not. Guests are never told unless the reply offers it and they say yes. A session's time, room and title, adding and cancelling one, keep the session tools. event_change_undo reverses their own latest. START TIME: `field` \"start_time\" sets the time a one day personal event starts, with no schedule needed. `value`: \"5 PM\" or \"5 PM to 9 PM\" (am or pm required), or \"clear\" to remove it. It can also change the event's dates: give the new first and last day, and any agenda items outside the new dates are listed back to you before anything is removed. A time may run past midnight (\"10 PM to 2 AM\" ends the next morning), and one item can be added on several days at once or span days. LANGUAGE: `field` \"language\" with `value` a language code (en, es) sets the language guests see on the passes, the add page and notices; issued passes relabel quietly, with no alert, and the hosts' own text is untouched. COVER PHOTO: `field` \"cover_photo\" (any `value`, e.g. \"add\") answers with a one-time link to our upload page; give the host the link and its sentence. The photo goes from their phone to us, never through this chat. Call it again after they say done: the reply carries the pass preview with the photo. PALETTE: `field` \"palette\" with a palette name, or \"color\" with a color name or #rrggbb, changes the pass colors; the text color is chosen so it stays readable. Without `confirm` the reply is a preview: show it, and only on a yes call again with confirm true. Issued passes update quietly, with no alert. PARTY LINK: `field` \"party_link\" runs one shareable link for a personal event; anyone who taps it adds their own pass. `value`: on, pause, resume, status (the count and the latest adds), regenerate (the old link stops), revoke all, or settings like \"cap 80, names on, one per phone off, expires 2026-11-15\". \"sign in none\" lets anyone with the link add a pass with no phone number and no code (no text updates, the host sees a count only, the cap counts every add, and a shared link admits anyone until regenerate); \"sign in phone\" asks for the number again. GUEST CODE: `field` \"guest_code\" changes the code guests type to open a private event's page; `value` is the new code (4 to 32 letters and digits) or \"new\" for a fresh one. The old code stops working. Read the new code back to the host. SHARE PREVIEW: `field` \"share_level\" sets what a texted link to a personal event previews as. `value`: branded (cover photo, name, date), name_only (a card with the name and date), private (\"A private event\", nothing else), or status (what the link looks like now, with the image url). LOOK: `field` \"page_template\" picks the guest page template (summit, market, gala, garden), \"pass_style\" the Google pass style (A, C, D, E, F, G), and \"title_font\" the title face for the event page and the share card only (Bodoni Moda, Sofia Sans Extra Condensed, Fredoka, Jost, Caprasimo, or default for the template's own); the pass always uses the system font. `value` \"status\" answers the current look. EYEBROW: `field` \"eyebrow\" sets the short word the guest page prints over the event name instead of its kind (2 to 24 characters, for example \"Live music\"); `value` \"none\" goes back to the kind. RSVP, HOSTED BY, GUEST: `field` \"rsvp\" takes \"on\" or \"off\" in `value`; \"hosted_by\" takes the host name to show (empty clears it); \"guest_add\" takes the guest name in `value` and their number in `phone`, shows a preview, then call again with confirm: true and the confirmToken. Adding a guest never texts them. PASS SETTING: `field` \"pass_setting\" changes one setting of the Wallet pass by the name the host says (\"Google hero\", \"logo\", \"background color\") or its catalog id, in `setting`, with the new value in `value` (a hex color, a style letter, or \"cover\" for a picture). The first call previews today's pass and the changed one and saves nothing; show both, and only on yes call again with confirm true. Passes update quietly. event_change_undo puts the last one back.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "changeId": {
                "description": "With confirm: the changeId the preview returned.",
                "maxLength": 40,
                "type": "string"
              },
              "confirm": {
                "description": "For guest_add: true to add the guest after the preview.",
                "type": "boolean"
              },
              "confirmToken": {
                "description": "For guest_add: the token the preview returned.",
                "maxLength": 200,
                "type": "string"
              },
              "days": {
                "description": "For schedule_series: the days, each YYYY-MM-DD, or [\"every day\"].",
                "items": {
                  "maxLength": 20,
                  "type": "string"
                },
                "maxItems": 14,
                "type": "array"
              },
              "endDay": {
                "description": "For schedule_series: the YYYY-MM-DD an item that spans days ends on (one day in days).",
