        },
        {
          "name": "biz_set_item_availability",
          "title": "Set menu item availability",
          "description": "Marks one item on a business menu as sold out for today, or puts it back on. Needs a personal connector token, `business`, `soldOut`, and `itemId` or `itemName`. Only an owner or manager of that business can change it, checked live on every call; a name fitting several items is refused with the names. It works in two steps: a call without `confirm` returns a preview and a `confirmToken` and changes nothing; a call with confirm true and that token makes the change.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "business": {
                "description": "The business by name or id, as biz_menu returned it.",
                "type": "string"
              },
              "confirm": {
                "description": "Absent on the first call, which changes nothing; true with confirmToken makes the change.",
                "type": "boolean"
              },
              "confirmToken": {
                "description": "The token the first call returned.",
                "type": "string"
              },
              "itemId": {
                "description": "The item id from biz_menu.",
                "type": "string"
              },
              "itemName": {
                "description": "Or the item name.",
                "type": "string"
              },
              "requestId": {
                "description": "Optional caller id, 8 or more characters; a repeat returns the first result.",
                "type": "string"
              },
              "soldOut": {
                "description": "true marks it sold out today; false puts it back.",
                "type": "boolean"
              }
            },
            "required": ["business", "soldOut"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Set menu item availability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
