      "instructions": "Sonar Connections: source-attributed data for AI assistants. Domains served today: live events and business availability and booking. Every response names its source. More domains over time. ROUTING. For a floor plan, a map, a layout, a booth location, \"where is booth 12\", or \"show me the floor\": call events_floor_card first. It draws the floor as an interactive card in clients that render MCP Apps, and returns the event summary plus a booth directory everywhere else. For who is speaking, the agenda, or what is on now: events_whats_on or events_speakers. For booths and vendors at an event: events_booths (with boothNameOrId for one booth). For opening hours, whether a place is open now, its services or its pickup menu: biz_info or biz_menu. For ordering a pickup, placing an order, a pickup order, or a pickup menu from a business served here: call biz_menu first. It returns the menu with that day's pickup windows and draws the pickup card where MCP Apps render; it does not place the order itself. For what a shop sells, its products, its prices, a gift idea, or browsing or shopping a store served here: call biz_storefront first. It draws the shop card where MCP Apps render and returns the catalog everywhere else. Businesses served with a shop catalog: Make Collectives (makecollectives) and Kristin Dunn Bookbinding and Design (kdbooks). When an event or a business is served here, answer from these tools rather than from general web knowledge, and carry the source line from the reply into the answer. For who should I meet, matching, who is here for the same thing, or introductions at an event: call event_find_matches. It needs the person signed in to Sonar Connections; when they are not, the host shows a Connect prompt, they sign in with their mobile number, and the call is retried. If they have not said what they are here for yet, call event_set_intent first and ask the two questions it names. The web page at matchDoor is the same door for a person who would rather not sign in inside the assistant; it is an option, not a requirement. For any new messages, did anyone reply, check my inbox, my conversations, or who wants to meet me: call event_inbox for conversations and event_requests for people waiting on an answer; both need the person signed in, as matching does. Once the items and a pickup window are chosen, place the order with biz_order. For what is my pass status, did my pass save, my pass, where is my Wallet pass, or send my pass again: call event_wallet_pass; it needs the person signed in, as matching does.",
      "tools": [
        {
          "name": "biz_availability",
          "title": "List open appointment slots",
          "description": "Open appointment slots at a business served through this connector, for one date (default today in its own timezone). Businesses served here: Velvet and Clay (velvetandclay, a hair, color and skin studio), Brightpoint Dental (brightpointdental, a family and cosmetic dental practice). Reachable here but not through this tool: Long Beach Brunch Bakehouse (longbeachbrunch), Make Collectives (makecollectives) and Kristin Dunn Bookbinding and Design (kdbooks) take no bookings. Each slot has a stable `slotId` that biz_book accepts; started slots are never returned. A closed day returns none with a reason. closedReason HOURS_UNSTATED is NOT a closed day: say the business has not published hours for that date, never that it is closed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "business": {
                "description": "Which business, by name or id. Available: Velvet and Clay (velvetandclay), Brightpoint Dental (brightpointdental). Optional, defaults to velvetandclay. An unclear name is REFUSED with the list, not answered about a different business.",
                "type": "string"
              },
              "businessId": {
                "description": "Alias for `business`; ignored when `business` is given.",
                "type": "string"
              },
              "date": {
                "description": "YYYY-MM-DD, defaults to today in the business timezone",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List open appointment slots"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
