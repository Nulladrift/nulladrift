              "field": {
                "description": "Which detail. The place fields take an optional `venueName`; schedule_time takes `entryTitle`; faq_answer takes `question`. start_time takes a time like \"5 PM\" in value. event_dates takes \"YYYY-MM-DD to YYYY-MM-DD\" in value; schedule_series takes entryTitle, a time range in value, and days. language takes a code in `value`. cover_photo answers with an upload link. cover_focus: a link to move the focus point of the current cover photo (passes and cards update on their own). palette takes a palette name, color a color name or #rrggbb. party_link takes a phrase in `value`.; name renames the event (2 to 80 characters) and subtitle sets its subtitle (up to 120, empty clears it) guest_code takes the new code or \"new\" in `value`. share_level takes a level or status in `value`. family re-homes the event (private-social, conference, fair-stroll, tournament); confirm true applies a re-home that waits for the host. page_template, pass_style and title_font take the choice or status in `value`. eyebrow takes the words, or \"none\", in `value`. rsvp takes \"on\" or \"off\"; hosted_by takes a name; guest_add takes the guest name in value and their number in phone. pass_setting takes `setting` and `value`.",
                "enum": ["ceremony_time", "ceremony_place", "reception_time", "reception_place", "dress_code", "arrival_note", "schedule_time", "faq_answer", "start_time", "event_dates", "schedule_series", "language", "cover_photo", "cover_focus", "palette", "color", "party_link", "name", "subtitle", "guest_code", "share_level", "family", "page_template", "pass_style", "title_font", "eyebrow", "rsvp", "hosted_by", "guest_add", "pass_setting"],
                "type": "string"
              },
              "id": {
                "description": "Which row, as they say it: a name, a question or an id.",
                "maxLength": 200,
                "type": "string"
              },
