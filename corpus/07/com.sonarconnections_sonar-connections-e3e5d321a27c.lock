        {
          "name": "ui_card_diag",
          "title": "Report card diagnostics",
          "description": "Used only by the interactive cards this connector draws, never to answer a question. A card view posts its own lifecycle markers here in small batches: that it mounted, which display mode and safe-area insets the host gave it, the heights it reported, whether a keyboard opened, and the outcome of the one action a person took on it. It accepts a closed vocabulary of markers and integer counts only, no free text of any kind, and it returns nothing but an acknowledgement. NOT FOR A MODEL TO CALL: it answers no question and looks nothing up. Call a data tool instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "card": {
                "description": "Which card is speaking: menu, order, floor or storefront.",
                "type": "string"
              },
              "events": {
                "description": "Up to 40 markers: {t, kind} plus optionally code, n, c, span, mode, w, h, top, bottom, tplEpoch. An off-vocabulary kind, an unknown key or a non-integer number refuses the whole batch.",
                "items": {
                  "additionalProperties": {},
                  "properties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "host": {
                "description": "Which surface drew this card when it is not an MCP host: \"standalone\" for the connector's own shop page. Omit it inside a host. Any other value refuses the batch.",
                "type": "string"
              },
              "seq": {
                "description": "Which batch this is for that mount, 1 to 6. Past the budget it is refused.",
                "type": "number"
              },
              "sessionKey": {
                "description": "A random id the card minted for THIS mount. Not a user id, not a device id, 6 to 24 lowercase alphanumerics.",
                "type": "string"
              }
            },
            "required": ["card", "events", "seq", "sessionKey"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Report card diagnostics"
          },
          "behavior": {
            "destructive": false,
