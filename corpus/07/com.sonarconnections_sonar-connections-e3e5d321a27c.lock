            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "eventIdOrName": {
                "description": "The event id or name as the organizer spells it.",
                "type": "string"
              },
              "ops": {
                "description": "The operations, applied together or not at all.",
                "items": {
                  "properties": {
                    "after": {
                      "maxLength": 60,
                      "type": "string"
                    },
                    "before": {
                      "maxLength": 60,
                      "type": "string"
                    },
                    "columns": {
                      "maximum": 3,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "field": {
                      "maxLength": 20,
                      "type": "string"
                    },
                    "href": {
                      "description": "https, mailto, #<id> or page:<page id>.",
                      "maxLength": 500,
                      "type": "string"
                    },
                    "index": {
                      "maximum": 60,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "into": {
                      "maxLength": 60,
                      "type": "string"
                    },
                    "keepHeading": {
                      "description": "true whenever the person indicates, in ANY words, that the page heading should stay as it was (keep the heading, leave the title, keep it as is, leave the heading alone, just the menu).",
                      "type": "boolean"
                    },
                    "kind": {
                      "maxLength": 20,
                      "type": "string"
                    },
                    "leftOf": {
                      "maxLength": 60,
                      "type": "string"
                    },
                    "nav": {
                      "items": {
                        "anyOf": [
                          {
                            "maxLength": 32,
                            "type": "string"
                          },
                          {
                            "properties": {
                              "href": {
                                "maxLength": 500,
