        {
          "name": "remove_item_from_cart",
          "description": "\nRemove an item from the shopping cart.\n\nThis tool removes the item completely. To lower the quantity, use the\n'update_cart_item' tool.\n\nSteps\n\n1. Call the 'add_item_to_cart' tool to put items in the cart.\n2. Call this tool to remove an item.\n3. Call the 'create_checkout_url' tool to get a checkout URL.\n\nRules\n\nA cart with items must exist.\nSend 'item_id' to select the cart item to remove. It is the 'entityId' of that item in\nthe cart that the last cart tool call returned, for example 'add_item_to_cart'.\nIt is not 'productEntityId' or 'variantEntityId'.\n",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "item_id": {
                "description": "The 'entityId' of the cart item to remove. Take it from 'cart.lineItems.physicalItems' or 'cart.lineItems.digitalItems' in the latest cart response. It is not 'productEntityId' or 'variantEntityId'.",
                "type": "string"
              }
            },
            "required": ["item_id"],
            "type": "object"
