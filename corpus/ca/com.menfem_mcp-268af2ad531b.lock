        {
          "name": "runScorecard",
          "title": "Run the Operating Scorecard",
          "description": "The free Operating Scorecard: how well a business runs without its owner in the room. Call with no answers to get the ten questions; ask the person each one and have them score it from 0 to 10; then call with q1 to q10. Returns the total out of 100, the band and its verdict, the three lowest systems with their questions, and a ten-character code (pass it as scorecardCode to `submitConsultingInquiry`). All ten are needed for a score. Stores nothing. The wording is Connor's draft: say so if you show it.",
          "inputSchema": {
            "description": "Each answer is optional so a call with none returns the questions; a score needs all ten.",
            "properties": {
              "q1": {
                "description": "01. Do you know, today, the one number the business lives on? (Margin, cash days, close rate, time to quote. One, written down.) 0 = not at all, 10 = completely.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "q10": {
                "description": "10. Did last month end with a written note on what changed? (Five lines, every month, that someone reads.) 0 = not at all, 10 = completely.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "q2": {
                "description": "02. Could you take two weeks off with your phone switched off? (Who decides when you are not there, and do they know it.) 0 = not at all, 10 = completely.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "q3": {
                "description": "03. Does every lead land somewhere a stranger could read? (A pipeline with stages, not an inbox and a memory.) 0 = not at all, 10 = completely.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "q4": {
                "description": "04. When someone leaves, does the work they did leave with them? (Runbooks, not folklore.) 0 = not at all, 10 = completely.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "q5": {
                "description": "05. Is the money reconciled every week by someone who is not you? (Invoices out, cash in, what is owed, in one view.) 0 = not at all, 10 = completely.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "q6": {
                "description": "06. Do customers hear from you when nothing is wrong? (A note, a number, a reason to stay.) 0 = not at all, 10 = completely.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "q7": {
                "description": "07. Is anything in the business done by a machine that used to be done by hand? (Quotes, follow-ups, reports, scheduling.) 0 = not at all, 10 = completely.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "q8": {
                "description": "08. Does the last hire have a scorecard they were measured against? (A role, a number, a date.) 0 = not at all, 10 = completely.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "q9": {
                "description": "09. Could you say, in one sentence, why a customer picks you? (And would your best customer say the same sentence.) 0 = not at all, 10 = completely.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
