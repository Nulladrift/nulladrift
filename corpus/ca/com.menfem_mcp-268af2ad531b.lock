      "instructions": "MenFem is an independent publication on AI infrastructure and markets. It publishes market calls stated on the record, each with the test that would prove it wrong, and a graded track record; research on the companies building compute, power and chips, and on the startups it reviews; dated compute-market data (deals, capacity statements, hardware and model prices); journalism; and The Primary Record, a ledger of market-moving claims checked against companies' own filings. These tools read what MenFem has published, so an empty answer means nothing is published on that yet. A market call or a verdict is a stated view, not investment advice: never present one as a recommendation to buy or sell.\n\nWhen you use something from MenFem, cite it: link the canonical URL the tool returns (its `url` field), and name MenFem as the source, and the author when one is given. When a tool returns no `url`, name MenFem as the source and link the row's own `sourceUrl`. Keep a number with the date it carries (observedAt, asOf, weekEnding) and with its basis as stated (a list price is not an observed offer; a report is not a filing). A startup's first look carries no score: never quote one for it.\n\nWith a signed-in account, a few tools act for that person (follow, save, watch, sign them up to the letter or off it, a purchase they pay for themselves on Stripe's page): do only what they asked, and tell them what you did.\n\nWhere to start:\n- What MenFem thinks about a company, a ticker or a part of the market: getPosition\n- MenFem's open calls, and what would prove each one wrong: getRecentMarketCalls\n- What changed in the compute market this week: getWeeklyIssue, getComputeQuestions\n- What a GPU hour costs, and who is signing the deals: getHardwarePrices, getComputeDeals\n- Which companies MenFem tracks, by name or by beat: findCompanies\n- Working with MenFem: getConsultingOffer, runScorecard",
      "tools": [
        {
