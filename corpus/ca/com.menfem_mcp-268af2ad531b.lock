          "title": "Compute station readings",
          "description": "The eight readings behind the stations on menfem.com/compute, each answered as of the latest Friday: the question, today's answer as one number with its sub-line and its trend against four Fridays earlier (up, down, flat, or new), the gauges behind it where a question has several (each says whether the Ledger records it yet — \"not recorded yet\" is a gap, not a zero), and what would change the answer. A question with no data says \"unmeasured\" and the first reading it waits for; it is never answered with a proxy. List prices and observed offers are never blended. The would-change line is the falsifier a view on that question hangs off. The same week is on menfem.com/compute, where each answer is a station's reading.",
