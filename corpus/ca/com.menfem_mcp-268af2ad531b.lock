          "description": "MenFem's compute Ledger: the published deals behind the compute market — capacity contracts, loans against GPUs, backstops, equity stakes, site leases, chip supply, power deals and acquisitions — newest announcement first. Each row carries the day it was announced, its parties and their roles, the headline value as disclosed (US$ millions; null when undisclosed), term, rate and size where stated, and the source URL with its kind. A REPORTED row is a news report and is never upgraded to fact without a filing. maturesAt is start plus term, derived here, not reported. Drafts are never returned. A row is a summary by default, without its notes; pass detail: \"full\" for them.",
