          "title": "MenFem's position on a company, ticker or beat",
          "description": "What MenFem currently holds on a company, a ticker or a beat, assembled from the published record with no model and no generated prose: its open market calls (with the falsifier) and the latest resolved ones with their grades, the Primary Record claims about it with their status, and the newest pieces with their verdict and tell. Every item carries its canonical url and its markdown twin (mdUrl). The subject resolves, in order, to a published company by slug, ticker or name (or its Subject record), a company beat such as 'datacenters', or a ticker that calls or claims carry. When nothing matches, `found` is false and `suggestions` names companies whose name contains the text. A market call or a verdict is a stated view, not investment advice.",
