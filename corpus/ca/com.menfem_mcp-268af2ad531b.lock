        {
          "name": "getComputeCount",
          "title": "The Friday Count",
          "description": "The Friday Count from MenFem's capacity claims register: how much AI data-centre power was stated as switched on or delivered in a week, from dated statements in company filings and releases and from ERCOT, Texas first. Published statements only. Families are separate readings, each with its own date and source URL — what was filed (switchedOn = ENERGIZED statements, delivered = DELIVERED statements, lateFinds listed apart), the next promise still due, promises falling due and slipping, Epoch AI's estimate (basis EPOCH_ESTIMATE, a covered total, never a world total), ERCOT's meter and gas-queue readings, and EIA-860M gas generation slippage. They are never added together, and megawatts are never summed across bases: every figure carries its basis (critical-it, it-load, gross, contracted-power, nameplate, up-to, unstated, observed-peak; see bases) and every item its source URL and kind. An announcement never counts as capacity. A zero is a counted zero. The footer is part of the answer: \"No survey exists. This is a count of statements with sources, not of silicon.\" Built by the same function as the week's issue (getWeeklyIssue).",
          "inputSchema": {
            "properties": {
              "week": {
                "description": "The Friday the week ends on, YYYY-MM-DD. Omit for the latest closed Friday.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "bases": {
                "additionalProperties": {},
                "properties": {},
                "type": "object"
              },
              "footer": {
                "type": "string"
              },
              "reading": {
                "type": "string"
              },
              "url": {
                "type": ["string", "null"]
              }
