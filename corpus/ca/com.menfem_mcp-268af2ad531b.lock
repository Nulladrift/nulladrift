        {
          "name": "getHardwarePrices",
          "title": "Hardware prices",
          "description": "The latest cron-written price for every (SKU, provider, term, region) of one hardware-price kind — GPU rental $/GPU-hour, GPU used-market, DRAM spot, HBM contract, NAND spot. Each row says its `term` (SPOT, ON_DEMAND, RESERVED_1Y/3Y/5Y …) and its `basis`: OBSERVED_OFFER is what a marketplace host is asking (Vast), LIST is a provider's own published rate card (Azure, region eastus). The two are different claims — never blend or average a list price with an observed offer. Pass `term` and/or `basis` to narrow. Every row is fetched keyless from a public endpoint; a SKU nobody priced this week keeps its last real week (visible via `weekEnding`) rather than disappearing.",
