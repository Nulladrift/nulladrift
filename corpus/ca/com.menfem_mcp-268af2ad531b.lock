        {
          "name": "getComputeWeek",
          "title": "Compute board week",
          "description": "One week (Saturday to Friday) of MenFem's compute board: the Vast.ai H100 SXM observed median for the week and its change on the week before (observed offers both ends), Azure’s H100 list-price ladder for the week with the first week of an unchanged run (list prices only — the two are never combined into one number), the Ledger deals announced that week (dealsAnnounced — a deal belongs to the week it was announced, whenever the Ledger logged it), the rows the Ledger caught up on that week but announced earlier (dealsAddedLate — a backfill, never counted as the week's market), and Connor's take once he has published it. inProgress is true for the week that has not closed — its numbers are so far. weeks lists every week on the board, newest first. report is The Compute Week, MenFem’s weekly report for that week (title, url, excerpt), or null when none is published for it. The same week is on menfem.com/compute.",
