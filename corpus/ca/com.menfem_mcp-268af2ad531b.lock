        {
          "name": "getComputeCampuses",
          "title": "Compute campuses",
          "description": "MenFem's capacity register: the campuses in the register (Texas first) with their published statements, state and promise outcomes, as of today. Each campus carries its stages (the furthest the source statements reach, with megawatts per basis — never one figure across bases), every dated statement with its verbatim quote, basis, source URL and source kind, and its promises read to an outcome (DUE, KEPT, PARTIAL, SLIPPED, NO_STATEMENT, WITHDRAWN or UNREAD — \"Not read\" is never \"no statement found\"), with the dates, the grace and the statements that settled each. Epoch AI's per-site estimate sits beside a campus as its own figure (basis EPOCH_ESTIMATE) and never settles a promise. campuses are those with a statement; quiet are registry campuses with none yet. company holds a company's own totals and region ERCOT's readings, both kept apart from the campuses. An announcement never counts as capacity; a campus with no statement in 120 days is marked unverified, not hidden. Published statements only. Filter by campusSlug (one campus; company and region are then left out) and/or party (campuses with a statement by that company, with its company and ERCOT lines; the filter picks campuses and never trims a campus's own statements). The answer is a summary by default, without the verbatim statements; pass campusSlug for one campus in full, or detail: \"full\".",
          "inputSchema": {
            "properties": {
              "campusSlug": {
                "description": "Only this campus, by its register slug (e.g. 'helios'). One of: stargate-abilene, crusoe-abilene-expansion, coreweave-denton, meta-temple, helios, google-midlothian, google-red-oak, microsoft-sat40, microsoft-sat14, vantage-tx1, goodnight, stargate-shackelford, stargate-milam, barber-lake, abernathy, iren-childress, beacon-point, colchis, muskie.",
                "type": "string"
              },
              "detail": {
                "default": "summary",
                "description": "summary (default) leaves out each campus's statements and their quotes, its sources, aliases, deal slugs and grid, and trims promises and company and region rows to the figure, its basis, the outcome and the source; full returns them all. A campusSlug answer is always full.",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "party": {
                "description": "Only statements made by this party: a company slug as the claims carry it (e.g. 'galaxy-digital', 'coreweave'), or 'ercot'.",
                "type": "string"
              }
            },
            "type": "object"
          },
