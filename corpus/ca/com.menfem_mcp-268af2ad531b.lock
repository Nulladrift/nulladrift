        {
          "name": "submitConsultingInquiry",
          "title": "Ask about consulting",
          "description": "File a consulting inquiry with MenFem for the person you act for: their business, the one number they want moved and who owns it. Connected to a MenFem account, it is filed under the account's own email and reaches Connor now. Without an account, give the person's email: MenFem emails them a link, and the inquiry reaches Connor only after they click it (inquiry: HELD). It books nothing: the answer carries the booking link and its rule (any weekday from 14:00 UK), and preferredTimes rides the inquiry for Connor to confirm.",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "The company.",
                "maxLength": 160,
                "type": "string"
              },
              "door": {
                "description": "An owner-led business, or a startup.",
                "enum": ["business", "startup"],
                "type": "string"
              },
              "email": {
                "description": "The person's email. Required without a MenFem account; ignored for a connected account, whose own email is used.",
                "type": "string"
              },
              "idempotencyKey": {
                "description": "Optional, for a connected account. Your key for a retry, 1-128 printable characters: a second call with the same key gets the first answer back.",
                "type": "string"
              },
              "industry": {
                "description": "Optional. The trade, in their words.",
                "maxLength": 120,
                "type": "string"
              },
              "message": {
                "description": "Optional. Anything else.",
                "maxLength": 2000,
                "type": "string"
              },
              "name": {
                "description": "The person's name.",
                "maxLength": 120,
                "type": "string"
              },
              "numberOwner": {
                "description": "Who owns that number (at least 2 characters).",
                "maxLength": 200,
                "type": "string"
              },
              "numberToMove": {
                "description": "The one number they want moved, in their words (at least 2 characters).",
                "maxLength": 500,
                "type": "string"
              },
              "preferredTimes": {
                "description": "Optional. When they could take a call (weekdays from 14:00 UK). Connor confirms every call himself.",
                "maxLength": 300,
                "type": "string"
              },
              "referredBy": {
                "description": "Optional. Who sent them.",
                "maxLength": 200,
                "type": "string"
              },
              "revenueBand": {
                "description": "Annual revenue band.",
                "enum": ["pre-revenue", "under-1m", "1-5m", "5-20m", "20-50m", "over-50m"],
                "type": "string"
              },
              "scorecardCode": {
                "description": "Optional. The code the Scorecard returned, when you ran it for them.",
                "maxLength": 120,
                "type": "string"
              },
              "tried": {
                "description": "Optional. What they have tried so far.",
                "maxLength": 1000,
                "type": "string"
              },
              "when": {
                "description": "Optional. When they want to start.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["company", "door", "name", "numberOwner", "numberToMove", "revenueBand"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "booking": {
                "additionalProperties": {},
                "properties": {
                  "rule": {
                    "type": "string"
                  },
                  "url": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["rule", "url"],
                "type": "object"
              },
              "confirmBy": {
                "type": ["string", "null"]
              },
              "email": {
                "type": "string"
              },
              "inquiry": {
                "enum": ["NEW", "HELD"],
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "status": {
                "const": "ok",
                "type": "string"
              }
            },
            "required": ["booking", "confirmBy", "email", "inquiry", "message", "status"],
            "type": "object"
          },
