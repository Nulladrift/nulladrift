                "description": "Destination IATA code from Itaka's charter network, e.g. AYT, HER, FNC.",
                "minLength": 3,
                "type": "string"
              },
              "flight_type": {
                "description": "Trip type. Default returnTicket.",
                "enum": ["returnTicket", "oneWayTicket"],
                "type": "string"
              },
              "no_cache": {
                "description": "Force a fresh fetch and bypass this server's result cache. Default false.",
                "type": "boolean"
              },
              "origin": {
