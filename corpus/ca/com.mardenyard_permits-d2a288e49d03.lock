{
  "lockfileVersion": 2,
  "subjects": {
    "com.mardenyard/permits": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mardenyard.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "permitdigest",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Daily public building permits from US cities, cleaned. Values are permit-declared, never prices. Every response carries coverage (what is and is not included) and derived (fields inferred rather than read). Start with coverage, then search_permits.",
      "tools": [
        {
          "name": "coverage",
          "description": "Which jurisdictions are covered, how fresh each is, and approximate weekly permit volume.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "jurisdiction": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:48a3f00d219cc9f244a840073ced0e34d8ac4037b421a4394a2cd4b9167b9a8a"
        },
        {
          "name": "permit_detail",
          "description": "Scope, permit-declared value, status, dates, contractor and the raw source fields for one permit.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "jurisdiction/source permit id, e.g. chicago/B200517005",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c2111af135554b08d7b65b91822f03fdaa14faaa7a77f9ad75fc56ac58ed1868"
        },
        {
          "name": "search_permits",
          "description": "Permits by area (jurisdiction, ZIP, community area), trade, minimum permit-declared value, date range and confidence floor, with a short brief.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "community_area": {
                "description": "Chicago community area number",
                "type": "string"
              },
              "days": {
                "description": "Issued in the last N days (default 7; anonymous max 7)",
                "type": "integer"
              },
              "from": {
                "description": "Issued on or after, YYYY-MM-DD",
                "type": "string"
              },
              "jurisdiction": {
                "description": "Jurisdiction slug: chicago, austin, los-angeles, seattle",
                "type": "string"
              },
              "limit": {
                "description": "Max rows (anonymous 5, keyed 50)",
                "type": "integer"
              },
              "min_confidence": {
                "description": "Trade confidence floor, 0-1",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "min_value": {
                "description": "Minimum permit-declared value; only permits with a reliable value match",
                "type": "number"
              },
              "to": {
                "description": "Issued on or before, YYYY-MM-DD",
                "type": "string"
              },
              "trade": {
                "enum": ["roofing", "solar", "hvac", "pool", "demolition", "windows", "electrical", "plumbing"],
                "type": "string"
              },
              "zip": {
                "description": "5-digit site ZIP (not available for Chicago)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c2688338ed802c9e05bda9d30076ee576fdbfe7d62ab0c56391f6fb32162d982"
        },
        {
          "name": "watch_area",
          "description": "A standing watch on the same criteria that delivers each day's new permits.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "community_area": {
                "description": "Chicago community area number",
                "type": "string"
              },
              "days": {
                "description": "Issued in the last N days (default 7; anonymous max 7)",
                "type": "integer"
              },
              "delivery": {
                "enum": ["email", "none"],
                "type": "string"
              },
              "from": {
                "description": "Issued on or after, YYYY-MM-DD",
                "type": "string"
              },
              "jurisdiction": {
                "description": "Jurisdiction slug: chicago, austin, los-angeles, seattle",
                "type": "string"
              },
              "limit": {
                "description": "Max rows (anonymous 5, keyed 50)",
                "type": "integer"
              },
              "min_confidence": {
                "description": "Trade confidence floor, 0-1",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "min_value": {
                "description": "Minimum permit-declared value; only permits with a reliable value match",
                "type": "number"
              },
              "name": {
                "type": "string"
              },
              "to": {
                "description": "Issued on or before, YYYY-MM-DD",
                "type": "string"
              },
              "trade": {
                "enum": ["roofing", "solar", "hvac", "pool", "demolition", "windows", "electrical", "plumbing"],
                "type": "string"
              },
              "trades": {
                "items": {
                  "$ref": "#/properties/trade"
                },
                "type": "array"
              },
              "zip": {
                "description": "5-digit site ZIP (not available for Chicago)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1c9351e60a261726b905c71d68136a024bda404dae1b568fb168a45432c5a1f9"
        }
      ],
      "digest": "sha256:9c22edf957b8d2d8704be544934f0d0e3d74ed58f31034590504d74569f885f5"
    }
  }
}
