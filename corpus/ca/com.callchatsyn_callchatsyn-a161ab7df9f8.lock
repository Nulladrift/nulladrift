{
  "lockfileVersion": 2,
  "subjects": {
    "com.callchatsyn/callchatsyn": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://callchatsyn.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "callchatsyn",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "answer_customer_question",
          "title": "Answer a customer question",
          "description": "Answer a customer's message for one small business using only that business's own FAQs and order records. Rule-based, not generated, so it never invents prices or opening hours; English and Chinese are detected automatically. Read-only: it never books or changes anything. Use it first for any customer message. If it returns intent 'appointment', call list_open_times next; if matched is false or intent is 'human_handoff', tell the customer a person will follow up. Authenticates with the connection's API key (Authorization: Bearer ccs_live_…); without a key it answers as a public demo business. Returns JSON { intent, lang, matched, reply, next? }.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "message": {
                "description": "The customer's message exactly as they wrote it (1-2,000 characters, English or Chinese). Don't rephrase or translate it.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:113eb371fb608a523acdbc0303442cedc4b96d3a6f48d2466c40d51d57da186d"
        },
        {
          "name": "book_appointment",
          "title": "Book an appointment",
          "description": "Book one appointment for a customer. This creates a real booking: the business is notified, and if it has connected Cal.com the booking is created there too. With the demo key it's a dry run that books nothing. Not idempotent: booking the same time twice fails the second time. Only call it after the customer has confirmed the time and service; needs a 'start' from list_open_times and the customer's email or phone. Errors: 404 the time is no longer offered (call list_open_times again), 409 it was just taken, 400 missing start, service, or both email and phone, or the business's connected calendar needs a detail the customer didn't give (the message says which, e.g. an email). Returns JSON { booked, id, start, label }; keep 'id' if the customer may want to cancel.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "email": {
                "description": "The customer's email. Give email or phone (at least one is required).",
                "type": "string"
              },
              "name": {
                "description": "The customer's name as they gave it; shown to the business.",
                "type": "string"
              },
              "phone": {
                "description": "The customer's phone in international format, e.g. +6591234567. Give email or phone (at least one is required).",
                "type": "string"
              },
              "remarks": {
                "description": "Optional note for the business, up to 500 characters (e.g. 'first visit').",
                "maxLength": 500,
                "type": "string"
              },
              "service": {
                "description": "What the customer is booking; use one of the 'services' returned by list_open_times.",
                "minLength": 1,
                "type": "string"
              },
              "start": {
                "description": "The exact 'start' value returned by list_open_times (ISO 8601 UTC), unchanged.",
                "type": "string"
              }
            },
            "required": ["service", "start"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:13442f96109055fb8b427aff15146f456d50e04671c4821d0f5323075be5a10e"
        },
        {
          "name": "cancel_appointment",
          "title": "Cancel an appointment",
          "description": "Cancel one of the business's bookings by the 'id' that book_appointment returned. This changes data: the time becomes free again, and if the business has connected Cal.com the booking is cancelled there too (Cal.com emails the customer). Only call it after the customer has clearly asked to cancel that specific booking. To reschedule, cancel and then book a new time from list_open_times. With the demo key it's a dry run. Errors: 404 no such booking for this business, 409 already cancelled, 400 not a booking id. Returns JSON { cancelled, id, start }.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "The booking 'id' returned by book_appointment (a UUID).",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ce11d45ae791f1fe9874b273493773927bf2b0dd8e32c7652bf3d51d56880f84"
        },
        {
          "name": "list_open_times",
          "title": "List open appointment times",
          "description": "List the business's next open appointment times: up to 5, soonest first, within the next 7 days, labelled in the business's time zone, plus its services and locations. Read-only. Call it before book_appointment and whenever a customer asks when they can come in. Times come from the business's CallChatSyn hours or from its connected Cal.com calendar. Returns JSON { slots: [{ start, label }], services, locations }; pass a slot's 'start' to book_appointment unchanged. An empty slots list means nothing is open this week.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "description": "Language of the human-readable labels: 'en' (default) or 'zh'. Times themselves are always ISO 8601 UTC.",
                "enum": ["en", "zh"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:755d434f8763d04f6e1d197cb84833fc1d5b476132aa96fcab84e70f44329eae"
        }
      ],
      "digest": "sha256:0d9e2ce10eb92fec6c0bd62767f04a6170bbbfb3de4ef54148521dd80f015637"
    }
  }
}
