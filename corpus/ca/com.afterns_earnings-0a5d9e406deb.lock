        {
          "name": "get_earnings_reactions",
          "title": "Earnings reactions and next report date",
          "description": "Show how a US stock moved the day after each of its recent earnings reports (up to the 12 most recent), whether EPS beat or missed estimates, and its next earnings date in Korea and US Eastern time. Use for questions like \"엔비디아 실적 발표 언제야?\", \"마이크로소프트 실적 나오면 주가 어떻게 움직였어?\", \"Does Tesla usually drop after earnings?\". Historical data only; it does not predict prices. The result is shown as an interactive card with the chart, stats, and earnings-call takeaways.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "lang": {
                "default": "ko",
                "description": "Answer language. Use \"ko\" when the user writes in Korean, otherwise \"en\".",
                "enum": ["ko", "en"],
                "type": "string"
              },
              "limit": {
                "default": 12,
                "description": "How many of the most recent reports to return (1-12)",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "stock": {
                "description": "Ticker (NVDA) or company name in Korean or English (엔비디아, Nvidia, 구글)",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["stock"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "type": "string"
              },
              "call": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "announced": {
                        "type": "string"
                      },
                      "concerns": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "one_liner": {
                        "type": ["string", "null"]
                      },
                      "positives": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "quote": {
                        "anyOf": [
                          {
                            "additionalProperties": false,
                            "properties": {
                              "speaker": {
                                "type": "string"
                              },
                              "text": {
                                "type": "string"
                              }
                            },
                            "required": ["speaker", "text"],
                            "type": "object"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      }
                    },
                    "required": ["announced", "concerns", "one_liner", "positives", "quote"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "latest earnings-call takeaways, when available"
              },
              "disclaimer": {
                "type": "string"
              },
              "just_reported": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "date_et": {
                        "type": "string"
                      },
                      "session": {
                        "anyOf": [
                          {
                            "enum": ["before_open", "after_close"],
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      }
                    },
                    "required": ["date_et", "session"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "reported within the last 48h but results not in this data yet"
              },
              "lang": {
                "enum": ["ko", "en"],
                "type": "string"
              },
              "latest": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "announced": {
                        "type": "string"
                      },
                      "eps": {
                        "description": "adjusted EPS when the company reports one, else GAAP; currency in eps_currency",
                        "type": ["number", "null"]
                      },
                      "eps_currency": {
                        "enum": ["USD", "CNY", "EUR", "DKK"],
                        "type": "string"
                      },
                      "eps_display": {
                        "type": ["string", "null"]
                      },
                      "eps_estimate": {
                        "description": "consensus EPS estimate before the report, same currency",
                        "type": ["number", "null"]
                      },
                      "eps_estimate_display": {
                        "type": ["string", "null"]
                      },
                      "eps_surprise_pct": {
                        "type": ["number", "null"]
                      },
                      "eps_vs_estimate": {
                        "anyOf": [
                          {
                            "enum": ["beat", "miss", "inline"],
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "guidance_display": {
                        "type": ["string", "null"]
                      },
                      "guidance_revenue_usd": {
                        "description": "company's revenue guidance for the next quarter, when given",
                        "type": ["number", "null"]
                      },
                      "period_end": {
                        "type": "string"
                      },
                      "revenue_display": {
                        "type": ["string", "null"]
                      },
                      "revenue_usd": {
                        "type": ["number", "null"]
                      },
                      "revenue_yoy_pct": {
                        "type": ["number", "null"]
                      }
                    },
                    "required": ["announced", "eps", "eps_currency", "eps_display", "eps_estimate", "eps_estimate_display", "eps_surprise_pct", "eps_vs_estimate", "guidance_display", "guidance_revenue_usd", "period_end", "revenue_display", "revenue_usd", "revenue_yoy_pct"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "numbers from the most recent report"
              },
              "next": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "date_et": {
                        "description": "US Eastern date YYYY-MM-DD",
                        "type": "string"
                      },
                      "session": {
                        "anyOf": [
                          {
                            "enum": ["before_open", "after_close"],
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "status": {
                        "description": "estimated = projected from past cadence, not announced",
                        "enum": ["confirmed", "unconfirmed", "estimated"],
                        "type": "string"
                      },
                      "time_et": {
                        "type": ["string", "null"]
                      },
                      "time_kst": {
                        "description": "Korea time, only when the source gives a time",
                        "type": ["string", "null"]
                      }
                    },
                    "required": ["date_et", "session", "status", "time_et", "time_kst"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "reactions": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "announced": {
                      "type": "string"
                    },
                    "eps_surprise_pct": {
                      "type": ["number", "null"]
                    },
                    "eps_vs_estimate": {
                      "anyOf": [
                        {
                          "enum": ["beat", "miss", "inline"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "next_day_pct": {
                      "description": "close-to-close move on the first regular session after the report",
                      "type": ["number", "null"]
                    },
                    "period_end": {
                      "type": "string"
                    },
                    "revenue_yoy_pct": {
                      "type": ["number", "null"]
                    },
                    "session": {
                      "anyOf": [
                        {
                          "enum": ["before_open", "after_close"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  },
                  "required": ["announced", "eps_surprise_pct", "eps_vs_estimate", "next_day_pct", "period_end", "revenue_yoy_pct", "session"],
                  "type": "object"
                },
                "type": "array"
              },
              "source": {
                "type": "string"
              },
              "stock": {
                "additionalProperties": false,
                "properties": {
                  "logo": {
                    "type": ["string", "null"]
                  },
                  "name_en": {
                    "type": "string"
                  },
                  "name_ko": {
                    "type": "string"
                  },
                  "sector": {
                    "type": "string"
                  },
                  "ticker": {
                    "type": "string"
                  },
                  "url": {
                    "description": "afterns page for this stock",
                    "type": "string"
                  }
                },
                "required": ["logo", "name_en", "name_ko", "sector", "ticker", "url"],
                "type": "object"
              },
              "summary": {
                "additionalProperties": false,
                "properties": {
                  "avg_abs_move_pct": {
                    "type": ["number", "null"]
                  },
                  "beat": {
                    "type": "number"
                  },
                  "beat_then_fell": {
                    "type": "number"
                  },
                  "down": {
                    "type": "number"
                  },
                  "miss": {
                    "type": "number"
                  },
                  "reports": {
                    "type": "number"
                  },
                  "up": {
                    "type": "number"
                  }
                },
                "required": ["avg_abs_move_pct", "beat", "beat_then_fell", "down", "miss", "reports", "up"],
                "type": "object"
              }
            },
            "required": ["as_of", "call", "disclaimer", "just_reported", "lang", "latest", "next", "reactions", "source", "stock", "summary"],
            "type": "object"
          },
          "annotations": {
