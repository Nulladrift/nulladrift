      "tools": [
        {
          "name": "get_earnings_calendar",
          "title": "Earnings calendar",
          "description": "List upcoming US earnings reports for a date range (up to 14 days, US Eastern dates), largest and most-watched companies first. Optional group: bigtech, semiconductors, software, memory, healthcare, space. Use for \"이번 주 실적 발표 일정\", \"다음 주 빅테크 실적 언제야?\", \"Which chip stocks report next week?\". Defaults to the next 7 days. The result is shown as a calendar card.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "from": {
                "description": "YYYY-MM-DD, US Eastern. Default: today",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "group": {
                "description": "Only this group of companies, e.g. \"bigtech\" or \"semiconductors\". Omit for all companies",
                "enum": ["bigtech", "semiconductors", "software", "memory", "healthcare", "space"],
                "type": "string"
              },
              "lang": {
                "default": "ko",
                "description": "Answer language. Use \"ko\" when the user writes in Korean, otherwise \"en\".",
                "enum": ["ko", "en"],
                "type": "string"
              },
              "to": {
                "description": "YYYY-MM-DD, US Eastern. Default: from + 6 days",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "disclaimer": {
                "type": "string"
              },
              "from": {
                "type": "string"
              },
              "group": {
                "type": ["string", "null"]
              },
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "logo": {
                      "type": ["string", "null"]
                    },
                    "name_en": {
                      "type": "string"
                    },
                    "name_ko": {
                      "type": "string"
                    },
                    "next": {
                      "additionalProperties": false,
                      "properties": {
                        "date_et": {
                          "description": "US Eastern date YYYY-MM-DD",
                          "type": "string"
                        },
                        "session": {
                          "anyOf": [
                            {
                              "enum": ["before_open", "after_close"],
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "status": {
                          "description": "estimated = projected from past cadence, not announced",
                          "enum": ["confirmed", "unconfirmed", "estimated"],
                          "type": "string"
                        },
                        "time_et": {
                          "type": ["string", "null"]
                        },
                        "time_kst": {
                          "description": "Korea time, only when the source gives a time",
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["date_et", "session", "status", "time_et", "time_kst"],
                      "type": "object"
                    },
                    "sector": {
                      "type": "string"
                    },
                    "ticker": {
                      "type": "string"
                    },
                    "url": {
                      "description": "afterns page for this stock",
                      "type": "string"
                    }
                  },
                  "required": ["logo", "name_en", "name_ko", "next", "sector", "ticker", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "lang": {
                "enum": ["ko", "en"],
                "type": "string"
              },
              "to": {
                "type": "string"
              },
              "total": {
                "description": "all matching reports; items may be fewer",
                "type": "number"
              }
            },
            "required": ["disclaimer", "from", "group", "items", "lang", "to", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Earnings calendar"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://afterns/calendar-b5bcf0c2.html",
            "ui": {
              "resourceUri": "ui://afterns/calendar-b5bcf0c2.html"
            }
          },
          "digest": "sha256:4d7fa72ff1eab57801fc2b22329df12d21c2d0a4cd5554848aceadd0b68f28c4"
        },
        {
          "name": "get_earnings_call_summary",
          "title": "Latest earnings call summary",
          "description": "Summarize what management said on a US company's latest earnings call or release: one-line takeaway, positives, concerns, and up to three quotes (Korean translation with the English original). Use for \"아마존 어닝콜 핵심만 알려줘\", \"What did Nvidia's CEO say last quarter?\". Available for about 220 major companies.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "lang": {
                "default": "ko",
                "description": "Answer language. Use \"ko\" when the user writes in Korean, otherwise \"en\".",
                "enum": ["ko", "en"],
                "type": "string"
              },
              "stock": {
                "description": "Ticker (NVDA) or company name in Korean or English (엔비디아, Nvidia, 구글)",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["stock"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "announced": {
                "type": "string"
              },
              "concerns": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "disclaimer": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "one_liner": {
                "type": ["string", "null"]
              },
              "positives": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "quotes": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "original_en": {
                      "type": ["string", "null"]
                    },
                    "speaker": {
                      "type": "string"
                    },
                    "text": {
                      "type": "string"
                    }
                  },
                  "required": ["original_en", "speaker", "text"],
                  "type": "object"
                },
                "type": "array"
              },
              "source": {
                "enum": ["earnings_call", "press_release"],
                "type": "string"
              },
              "stock": {
                "additionalProperties": false,
                "properties": {
                  "logo": {
                    "type": ["string", "null"]
                  },
                  "name_en": {
                    "type": "string"
                  },
                  "name_ko": {
                    "type": "string"
                  },
                  "sector": {
                    "type": "string"
                  },
                  "ticker": {
                    "type": "string"
                  },
                  "url": {
                    "description": "afterns page for this stock",
                    "type": "string"
                  }
                },
                "required": ["logo", "name_en", "name_ko", "sector", "ticker", "url"],
                "type": "object"
              }
            },
            "required": ["announced", "concerns", "disclaimer", "note", "one_liner", "positives", "quotes", "source", "stock"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Latest earnings call summary"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:db6532307caf38f34bdc7b6e8aabfd8c6bf7dc21b89f448f9fd7b5d31af24660"
