{
  "lockfileVersion": 2,
  "subjects": {
    "com.cutshed/cutshed": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://cutshed.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Cutshed",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Public tools need no credential: list_tools, get_tool, get_studio_pricing, quote_clipper, and search_site. get_my_account, get_my_credits, start_generation, and get_generation need an OAuth bearer token with the matching scopes. Checkout stays in the browser.",
      "tools": [
        {
          "name": "get_generation",
          "description": "Read one Studio generation's status and results for the token's account. Requires OAuth scope studio:generate. Pass the id returned by start_generation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Generation id.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d19e37d02e365208d57673c994f8453e1af7cff3bf2bd3d6ac50c3524cd953a0"
        },
        {
          "name": "get_my_account",
          "description": "Read the signed-in person's email and display name. Requires an OAuth bearer token with profile:read.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:471b529fa6c9b867f4deac98466413cf2411c2fdd7975fe908db77f8fb7d0c3d"
        },
        {
          "name": "get_my_credits",
          "description": "Read the credit balance and recent credit history. Requires an OAuth bearer token with credits:read.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b46491c785e010a0081b9b364d5f16cbe461afb859e1735df5fb422c5b894a2f"
        },
        {
          "name": "get_studio_pricing",
          "description": "Return Studio credit packs and model prices from the live catalog. Prices are credits and provider cents. This does not start a purchase or a generation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a87d7afbd3831a2e11834712595be7c678d1a171519cf598556c5ca2130a3bc1"
        },
        {
          "name": "get_tool",
          "description": "Return one free Cutshed tool by slug, title, or path. Example slug: vocal-remover.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "Tool slug, title, or path, such as vocal-remover.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b66f91a26017a183f62767b9f53e558179eee4068614cd8bfd07344631a8c337"
        },
        {
          "name": "list_tools",
          "description": "List Cutshed's free browser tools with the public URL and a one-line description. Studio, checkout, and account actions are not included.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8c53b3098c8fba8b94ac9a103ed1525c3e3cf67bdd0f46edc2d1823f85e76721"
        },
        {
          "name": "quote_clipper",
          "description": "Return the public clipper quote for an 8-window highlight pass: windows, apiCents, credits, frameApiCents, markup, and vision. Audio-only scoring on the site is free. credits is the vision price when vision is true.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "windows": {
                "description": "Optional. The public quote is an 8-window pass, so omit this or pass 8.",
                "maximum": 8,
                "minimum": 8,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e9c6c9021f7e8de839ef0cc378941e34c8e8700e53531f003109b94fa685a7dd"
        },
        {
          "name": "search_site",
          "description": "Search the public Cutshed guide (llms.txt) and the free-tool list. Returns short matching excerpts. It does not search account data. Account tools are separate and need OAuth.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Words to find in the public site guide.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2e84729b4f737ba0737df24e230ebfcf05dfd2d4a05232c6a50d63d698e6d320"
        },
        {
          "name": "start_generation",
          "description": "Start a Studio generation with the same pricing, balance check, and per-account limits as the website. Requires OAuth scopes studio:generate and credits:spend.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aspectRatio": {
                "type": "string"
              },
              "audio": {
                "type": "boolean"
              },
              "consent": {
                "type": "boolean"
              },
              "duration": {
                "type": "number"
              },
              "genre": {
                "type": "string"
              },
              "image": {
                "type": "string"
              },
              "instrumental": {
                "type": "boolean"
              },
              "lyrics": {
                "type": "string"
              },
              "model": {
                "type": "string"
              },
              "outputs": {
                "type": "integer"
              },
              "prompt": {
                "type": "string"
              },
              "references": {
                "type": "array"
              },
              "resolution": {
                "type": "string"
              },
              "speed": {
                "type": "number"
              },
              "stability": {
                "type": "number"
              },
              "voice": {
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c1f2eb8928f6b4b699f50b01a0538cb67a9b0c63d792fa32c271f492286a2b18"
        }
      ],
      "digest": "sha256:051b2d2b8fa9c6cf8f14dc6933634710ee3135e09204dea9ede63b9a138b5f5f"
    }
  }
}
