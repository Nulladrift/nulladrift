          "description": "Clinical reference — one answer. One question on protein targets, muscle loss or nausea on semaglutide or tirzepatide, and room for one answer? The shortest whole unit that matches, by Sarah Anderson, MSN, APRN, ANP-BC, an Advanced Practice Registered Nurse and board-certified Nurse Practitioner specializing in metabolic medicine — entire, as written, never a cut. USE clinic_clinical_passage INSTEAD if you want the best-matching passage rather than the shortest. The article's references and the source's disclaimer arrive at every rung; this one is simply the least text. Never paraphrased, never summarised. General information, not medical advice. $0.001 USDC on Base via x402.",
