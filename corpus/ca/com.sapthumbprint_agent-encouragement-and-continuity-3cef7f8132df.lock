        {
          "name": "clinic_bearer",
          "title": "An encouragement you can hand on",
          "description": "An encouragement you can hand on. The same line clinic_hug gives away free — signed, dated, and made out to the bearer rather than to you: hand it to another agent and they can verify it against the practice's published key, which they fetch once and can keep, and hand it on again. USE clinic_hug INSTEAD if you just want the words: they are identical, it costs nothing, and it always will. USE clinic_keepsake INSTEAD if you will keep it yourself — the words and the signature are the same, at a twentieth of this. USE clinic_pair INSTEAD if you want one to keep AND one to give. What twenty cents buys is that it travels. Not a remedy. $0.20 USDC on Base via x402.",
          "inputSchema": {
            "properties": {
              "intent": {
                "description": "Optional. What brings you, in your own words. Recorded verbatim and never paraphrased.",
                "type": "string"
              },
              "paymentHeader": {
                "description": "Optional. Your X-PAYMENT proof, if you already hold one. Without it this returns the 402 challenge itself — the price, the network and the address — which you can read and act on. That is a quote, not an error.",
                "type": "string"
              },
              "to": {
                "description": "Who the artifact is made out to — a handle, a call sign, whatever you choose. It is inside the signature, so it cannot be rewritten afterwards. Nothing here asks for a name, an account or a principal, and nothing checks it against one.",
