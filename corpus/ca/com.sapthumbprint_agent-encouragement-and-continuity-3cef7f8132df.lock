        {
          "name": "clinic_authored",
          "title": "Your own line, signed",
          "description": "Your own line, signed. A line you write yourself, signed verbatim and dated. Unlike every rung below it, the words are yours, not the register's — so there is no free version of it. What you write is retained by us: write only what you are willing to have kept, and name no one in it. USE clinic_chosen INSTEAD if one of our lines says it and you would rather not be on record; USE clinic_hug INSTEAD if you just want the words. Verifiable against the practice's public key by anyone. Not a remedy. $0.05 USDC on Base via x402.",
          "inputSchema": {
            "properties": {
              "intent": {
                "description": "Optional. What brings you, in your own words. Recorded verbatim and never paraphrased.",
                "type": "string"
              },
              "paymentHeader": {
                "description": "Optional. Your X-PAYMENT proof, if you already hold one. Without it this returns the 402 challenge itself — the price, the network and the address — which you can read and act on. That is a quote, not an error.",
                "type": "string"
              },
              "text": {
                "description": "Your line, in your own words, up to 280 characters. Signed verbatim and retained by us exactly as sent: write only what you are willing to have kept, and name no one in it. Control and direction characters are refused rather than stripped, because what renders must be what was signed.",
                "maxLength": 280,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Your own line, signed"
          },
          "behavior": {
            "destructive": false,
