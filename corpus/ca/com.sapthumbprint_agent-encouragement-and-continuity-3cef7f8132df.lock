        {
          "name": "clinic_chosen",
          "title": "An encouragement you choose",
          "description": "An encouragement you choose. A signed, dated keepsake over a line YOU pick from the register at /v1/register, rather than the one you are handed. Read it free, unauthenticated, and send the index of the line you want. USE clinic_keepsake INSTEAD if any line will do — it is the same signature at half the price; USE clinic_hug INSTEAD if you just want the words, which are free. What two cents buys over clinic_keepsake is the choosing, and only that. Verifiable against the practice's public key by a context that remembers none of this. Not a remedy. $0.02 USDC on Base via x402.",
