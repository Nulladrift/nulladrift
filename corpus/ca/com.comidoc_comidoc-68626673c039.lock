        {
          "name": "search_courses",
          "title": "Search courses",
          "description": "Search the Comidoc historical course catalog with topic, quality, freshness, coupon availability, repeat-course, and regular-issuer filters. Coupon capacity and remaining redemptions are always returned when known. Courses with an active coupon carry an access block: what opening the coupon requires, the price with and without it, and the savings. Each course has course_url, its Comidoc course page; coupon codes are not included.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "anyOf": [
                  {
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "items": {
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 50,
                    "minItems": 1,
                    "type": "array"
                  }
                ],
                "description": "One or more canonical filter option values. Matching ignores case; unknown values are rejected."
              },
              "coupon_age": {
                "anyOf": [
                  {
                    "enum": ["24h"],
                    "type": "string"
                  },
                  {
                    "items": {
                      "enum": ["24h"],
                      "type": "string"
                    },
                    "maxItems": 1,
                    "minItems": 1,
                    "type": "array"
                  }
                ]
              },
              "coupon_created_after": {
                "format": "date-time",
                "type": "string"
              },
              "coupon_status": {
                "anyOf": [
                  {
                    "enum": ["active", "expired", "invalid", "pending_verification", "all"],
                    "type": "string"
                  },
                  {
                    "items": {
                      "enum": ["active", "expired", "invalid", "pending_verification", "all"],
                      "type": "string"
                    },
                    "maxItems": 5,
                    "minItems": 1,
                    "type": "array"
                  }
                ]
              },
              "course_id": {
                "description": "Udemy's numeric course ID.",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "course_slug": {
                "maxLength": 200,
                "type": "string"
              },
              "course_type": {
                "anyOf": [
                  {
                    "enum": ["courses", "tests"],
                    "type": "string"
                  },
                  {
                    "items": {
                      "enum": ["courses", "tests"],
                      "type": "string"
                    },
                    "maxItems": 2,
                    "minItems": 1,
                    "type": "array"
                  }
                ]
              },
              "cursor": {
                "maxLength": 500,
                "type": "string"
              },
              "discount_type": {
                "anyOf": [
                  {
                    "enum": ["free", "percentage"],
                    "type": "string"
                  },
                  {
                    "items": {
                      "enum": ["free", "percentage"],
                      "type": "string"
                    },
                    "maxItems": 2,
                    "minItems": 1,
                    "type": "array"
                  }
                ]
              },
              "duration": {
                "anyOf": [
                  {
                    "enum": ["short", "medium", "long"],
                    "type": "string"
                  },
                  {
                    "items": {
                      "enum": ["short", "medium", "long"],
                      "type": "string"
                    },
                    "maxItems": 3,
                    "minItems": 1,
                    "type": "array"
                  }
                ]
              },
              "expires_after": {
                "format": "date-time",
                "type": "string"
              },
              "expires_before": {
                "format": "date-time",
                "type": "string"
              },
              "has_active_coupon": {
                "type": "boolean"
              },
              "horizon": {
                "default": "7d",
                "enum": ["24h", "7d", "30d"],
                "type": "string"
              },
              "language": {
                "anyOf": [
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "items": {
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 50,
                    "minItems": 1,
                    "type": "array"
                  }
                ],
                "description": "One or more canonical filter option values. Matching ignores case; unknown values are rejected."
              },
              "last_course_updated_after": {
                "description": "Filters the last update published by Udemy, not Comidoc's technical record update.",
                "format": "date-time",
                "type": "string"
              },
              "level": {
                "anyOf": [
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
