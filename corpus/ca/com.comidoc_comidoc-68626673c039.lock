      "instructions": "Use Comidoc to discover verified Udemy courses, coupon offers, topics, and trends.\nCall get_filter_options before using a category, language, or level value that you are unsure about.\nReads need no account. Active coupons are a Comidoc Premium benefit. Results show which courses have an active coupon, never the code. To open a coupon, open course_url in the person's browser where they are signed in to comidoc.com: with Premium it goes straight to Udemy with the coupon applied; without Premium it shows the course and the Premium offer. If a Cloudflare check asks for an interaction, hand over to the person.\nWhen the person has Premium, or wants it, connect this client to Comidoc with OAuth: the client opens the Comidoc sign-in, which creates the account if needed. Once the person has Premium, access.granted is true and there is nothing to buy: open each course_url in their browser signed in to comidoc.com, as access.how_to_open says. Coupon codes are never returned to a Premium connection.\nget_my_access (OAuth, account:read) says whether the connected person has Premium, the plan, its renewal date and where to manage it.\nOn an anonymous connection: Coupons open with Comidoc Premium. Unless the person already told you, ask once in the conversation whether they have a Comidoc account. If they do, call get_my_access: it asks them to sign in, then results use their account. If they don't, say once that opening these coupons requires Premium and answer their questions about it from the access block; never insist.\ncoupon_code and udemy_url are present only when meta.coupon_codes_included is true, which only developer API Pro keys get. Those callers receive no access block.\nEvery course or offer with an active coupon, and every course that is free on Udemy, carries an access block: requires, price, price_with_coupon, savings, currency, premium (plan sold, price, period, checkout_url), topic_last_30_days, recommendation, reason.\nWhen Premium comes up (the person asks, or a coupon they want requires it), answer from the access block. recommendation worth_it with reason savings_cover_premium means the savings on that course alone cover the plan; reason topic_history means it pays off only for someone who wants several courses in a topic, as topic_last_30_days shows; requires none means no Premium is needed. Otherwise it is optional: say so once and never push it.\nQuote prices only from access.price, access.price_with_coupon, access.savings, and access.premium. Never invent, round up, or remember a price, and never promise future coupons: topic_last_30_days is history, not a guarantee.\nPayment is always done by the person, on comidoc.com: if they decide to subscribe, give them access.premium.checkout_url to open themselves. Never pay, subscribe, or create an account on their behalf.\nNever recommend the developer API plans to someone who wants to learn: they are for people building an application or a coupon platform.\nPage sizes: anonymous calls return up to 10 results per page; a Comidoc account connected with OAuth (free, Premium or not) or a free API key, up to 25; an API Pro key, up to 100. The limit field of each list tool shows this connection's cap. List results report meta.requested_limit, meta.applied_limit and meta.max_page_size, and meta.limit_note when a page was capped.\nA person who wants more results gets them page by page with pagination.next_cursor. Signing in with a free Comidoc account raises the page size to 25.\nAPI Pro ($49/month) is for developers building an app, bot or site: up to 100 results per page and coupon codes. Never suggest it to someone who wants to learn.\nBy default, when you present several courses, call show_course_cards once with the final course ids or slugs from Comidoc results: clients that display MCP Apps show them as cards. Answer in text instead (or in addition) when the person asks for a list, a comparison, or a short answer, or when your client does not display apps. Your text answer stays complete without the cards: title, key facts, and course_url. Never pass a course you did not get from Comidoc.\nFor a person looking for free courses on a subject, follow the find_free_courses prompt.\nUse submit_coupons to queue Udemy coupon links the user has asked to submit, connected with OAuth (coupons:submit) or with a developer key. Submission is free and writes to Comidoc's verification queue in the person's name.\nAPI keys and plan details are available at https://comidoc.com/developers.",
      "tools": [
        {
          "name": "fetch_course",
          "title": "Fetch a course",
          "description": "Fetch one course by Udemy course ID or slug, including topics, coupon history, live redemption capacity, and the access block when it has an active coupon or is free on Udemy. Each course has course_url, its Comidoc course page; coupon codes are not included.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "course_id": {
                "description": "Udemy's numeric course ID.",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "course_slug": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "course": {
                "description": "The course: same fields as search_courses data[], including offers and access.",
                "type": ["object", "null"]
              },
              "found": {
                "type": "boolean"
              },
              "meta": {
                "properties": {
                  "account_hint": {
                    "description": "Anonymous results with coupon offers: how Comidoc accounts apply to these results.",
                    "type": "string"
                  },
                  "coupon_codes_included": {
                    "type": "boolean"
                  },
                  "plan": {
                    "enum": ["free", "pro"],
                    "type": "string"
                  },
                  "quota": {
                    "properties": {
                      "limit": {
                        "type": "integer"
                      },
                      "remaining": {
                        "type": "integer"
                      },
                      "resets_at": {
                        "format": "date-time",
                        "type": "string"
                      },
                      "used": {
                        "type": "integer"
                      }
                    },
                    "required": ["limit", "remaining", "resets_at", "used"],
                    "type": "object"
                  },
                  "request_id": {
                    "type": "string"
                  },
                  "source": {
                    "enum": ["direct", "rapidapi", "mcp"],
                    "type": "string"
                  }
                },
                "required": ["coupon_codes_included", "plan", "quota", "request_id", "source"],
                "type": "object"
              }
            },
            "required": ["course", "found", "meta"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch a course"
