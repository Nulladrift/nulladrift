        {
          "name": "get_trending_courses",
          "title": "Get trending courses",
          "description": "Return temporal course trends for 24 hours, 7 days, or 30 days with score version, rank movement, signals, and coupon availability.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "horizon": {
                "default": "7d",
                "enum": ["24h", "7d", "30d"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Results per page. This connection returns at most 10. Page sizes: anonymous 10, signed-in Comidoc account or free API key 25, API Pro key 100. A larger value is reduced to 10 and meta.limit_note says so; trend lists have no next page.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "calculated_at": {
                "format": "date-time",
                "type": ["string", "null"]
              },
              "data": {
                "items": {
                  "properties": {
                    "course": {
                      "description": "The course: same fields as search_courses data[], including offers and access.",
                      "type": "object"
                    },
                    "rank": {
                      "type": "integer"
                    },
                    "rank_change": {
                      "type": ["integer", "null"]
                    },
                    "score_version": {
                      "type": "string"
                    },
                    "signals": {},
                    "trend_score": {
                      "type": "number"
                    }
                  },
                  "required": ["course", "rank", "rank_change", "score_version", "signals", "trend_score"],
                  "type": "object"
                },
                "type": "array"
              },
              "meta": {
                "properties": {
                  "account_hint": {
                    "description": "Anonymous results with coupon offers: how Comidoc accounts apply to these results.",
                    "type": "string"
                  },
                  "applied_limit": {
                    "type": "integer"
                  },
                  "coupon_codes_included": {
                    "type": "boolean"
                  },
                  "limit_note": {
                    "description": "Present only when applied_limit is lower than requested_limit: how to get the rest.",
                    "type": "string"
                  },
                  "max_page_size": {
                    "type": "integer"
                  },
                  "plan": {
                    "enum": ["free", "pro"],
                    "type": "string"
                  },
                  "quota": {
                    "properties": {
                      "limit": {
                        "type": "integer"
                      },
                      "remaining": {
                        "type": "integer"
                      },
                      "resets_at": {
                        "format": "date-time",
                        "type": "string"
                      },
                      "used": {
                        "type": "integer"
                      }
                    },
                    "required": ["limit", "remaining", "resets_at", "used"],
                    "type": "object"
                  },
                  "request_id": {
                    "type": "string"
                  },
                  "requested_limit": {
                    "type": "integer"
                  },
                  "source": {
                    "enum": ["direct", "rapidapi", "mcp"],
                    "type": "string"
                  }
                },
                "required": ["applied_limit", "coupon_codes_included", "max_page_size", "plan", "quota", "request_id", "requested_limit", "source"],
                "type": "object"
              },
              "score_version": {
                "type": "string"
              }
            },
            "required": ["calculated_at", "data", "meta", "score_version"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get trending courses"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b598e90100ebaaebd88660e638e556570bd35a206780f99609130768ff33d79b"
        },
