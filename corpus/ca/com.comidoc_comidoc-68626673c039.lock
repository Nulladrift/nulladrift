        {
          "name": "get_my_access",
          "title": "Get my Premium access",
          "description": "The connected person's Comidoc Premium status: whether it is active, the plan, its renewal date, credits left, and the page where they manage it. Requires an OAuth connection with account:read; nothing sensitive is returned. Without a connection, the server answers 401 with an OAuth challenge.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "manage_url": {
                "description": "Page where the person manages or cancels Premium, signed in on comidoc.com.",
                "format": "uri",
                "type": "string"
              },
              "meta": {
                "properties": {
                  "coupon_codes_included": {
                    "type": "boolean"
                  },
                  "plan": {
                    "enum": ["free", "pro"],
                    "type": "string"
                  },
                  "quota": {
                    "properties": {
                      "limit": {
                        "type": "integer"
                      },
                      "remaining": {
                        "type": "integer"
                      },
                      "resets_at": {
                        "format": "date-time",
                        "type": "string"
                      },
                      "used": {
                        "type": "integer"
                      }
                    },
                    "required": ["limit", "remaining", "resets_at", "used"],
                    "type": "object"
                  },
                  "request_id": {
                    "type": "string"
                  },
                  "source": {
                    "enum": ["direct", "rapidapi", "mcp"],
                    "type": "string"
                  }
                },
                "required": ["coupon_codes_included", "plan", "quota", "request_id", "source"],
                "type": "object"
              },
              "premium": {
                "properties": {
                  "access": {
                    "description": "unlimited: every course_url goes straight to Udemy with the coupon applied in the person's browser signed in to comidoc.com. credits: one credit per coupon opened. none: no Premium, course_url shows the Premium offer. Coupon codes are not included.",
                    "enum": ["unlimited", "credits", "none"],
                    "type": "string"
                  },
                  "access_ends_at": {
                    "description": "When Premium ends if it does not renew; null for lifetime or renewing plans.",
                    "format": "date-time",
                    "type": ["string", "null"]
                  },
                  "active": {
                    "description": "Whether the person has Comidoc Premium right now.",
                    "type": "boolean"
                  },
                  "credits_remaining": {
                    "type": ["integer", "null"]
                  },
                  "plan": {
                    "enum": ["premium_monthly", "premium_seven_days", "premium_lifetime", "premium_wallet", "premium_gift", null],
                    "type": ["string", "null"]
                  },
                  "renews": {
                    "type": ["boolean", "null"]
                  },
                  "renews_at": {
                    "format": "date-time",
                    "type": ["string", "null"]
                  }
                },
                "required": ["access", "access_ends_at", "active", "credits_remaining", "plan", "renews", "renews_at"],
                "type": "object"
              },
              "premium_offer": {
                "description": "The plan currently sold, only when the person has no Premium.",
                "properties": {
                  "checkout_url": {
                    "format": "uri",
                    "type": "string"
                  },
                  "currency": {
                    "const": "USD",
                    "type": "string"
                  },
                  "period": {
                    "const": "month",
                    "type": "string"
                  },
                  "price": {
                    "type": "number"
                  }
                },
                "required": ["checkout_url", "currency", "period", "price"],
                "type": ["object", "null"]
              }
            },
            "required": ["manage_url", "meta", "premium", "premium_offer"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get my Premium access"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
