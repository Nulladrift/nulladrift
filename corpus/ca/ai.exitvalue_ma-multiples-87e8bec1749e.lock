{
  "lockfileVersion": 2,
  "subjects": {
    "ai.exitvalue/ma-multiples": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://exitvalue.ai/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "exitvalue-ai",
        "title": "ExitValue.ai M&A Multiples",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ExitValue.ai publishes aggregate M&A valuation multiples (median and middle-50% EV/EBITDA and EV/Revenue, always with deal count n) by industry from disclosed transactions. All tools are read-only. get_valuation_multiples: 'what multiple does X sell for' (one industry, by deal size). compare_industries: 2-6 industries side by side. get_multiples_trend: year-by-year history for one industry. list_industries: valid ids. Quote n and the source line; figures below the data thresholds are withheld, never estimated. For a specific business's value, call start_valuation (pre-filled link) or point the user to https://exitvalue.ai/valuate?src=mcp.",
      "tools": [
        {
          "name": "compare_industries",
          "title": "Compare industries' M&A multiples",
          "description": "Read-only. Puts 2-6 industries side by side for one metric: median multiple, middle 50% (25th-75th percentile) and deal count n per industry, using the same data, name matching and thresholds as get_valuation_multiples. Without size_bracket it compares all-deal-size medians (n>=5); with size_bracket it compares that enterprise-value bracket (n>=10). Rows below the threshold are marked INSUFFICIENT DATA rather than estimated; unmatched names and industry-group ids are flagged per row. Use it for 'which sells for more, X or Y?' questions; use get_valuation_multiples for the full breakdown of one industry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "industries": {
                "description": "2 to 6 sub-vertical ids or plain-English industry names to compare, e.g. ['dental-practice', 'veterinary-practice', 'physical therapy'].",
                "items": {
                  "description": "Sub-vertical id from list_industries (e.g. 'hvac', 'dental-practice'), or a plain-English name ('HVAC', 'dentist', 'plumber', 'MSP'); plain names are mapped to the closest tracked category and the answer says which one was used.",
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 2,
                "type": "array"
              },
              "metric": {
                "default": "ev_ebitda",
                "description": "Multiple to compare: ev_ebitda (enterprise value / EBITDA, default) or ev_revenue (enterprise value / revenue).",
                "enum": ["ev_ebitda", "ev_revenue"],
                "type": "string"
              },
              "size_bracket": {
                "description": "Optional enterprise-value (deal size) bracket: under_5m_ev = under $5M, 5m_25m_ev = $5M-$25M, 25m_100m_ev = $25M-$100M, 100m_500m_ev = $100M-$500M, over_500m_ev = $500M and up. Omit to compare all deal sizes pooled.",
                "enum": ["under_5m_ev", "5m_25m_ev", "25m_100m_ev", "100m_500m_ev", "over_500m_ev"],
                "type": "string"
              }
            },
            "required": ["industries"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare industries' M&A multiples"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:99366f734a3653cde62835575075f8f29955ce8d3c1cebaf34e8be4cedf84e68"
        },
        {
          "name": "get_multiples_trend",
          "title": "Get M&A multiples trend by year",
          "description": "Read-only. Year-by-year history for ONE sub-vertical: for each deal year 2018-2026, the median EV/EBITDA and/or EV/Revenue multiple with middle 50% (25th-75th percentile), deal count n and median deal value. Only years with at least 10 disclosed deals for a metric are shown; missing years are listed as gaps and never interpolated, so many sub-verticals have few or no years. Use it for 'are multiples rising or falling for X?' questions; use get_valuation_multiples for pooled current figures by deal size.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "industry": {
                "description": "Sub-vertical id from list_industries (e.g. 'hvac', 'dental-practice'), or a plain-English name ('HVAC', 'dentist', 'plumber', 'MSP'); plain names are mapped to the closest tracked category and the answer says which one was used.",
                "type": "string"
              },
              "metric": {
                "description": "Optional: ev_ebitda or ev_revenue. Omit to show both where published.",
                "enum": ["ev_ebitda", "ev_revenue"],
                "type": "string"
              }
            },
            "required": ["industry"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get M&A multiples trend by year"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7a35143b0bed7c4dfd6344dc084a97a5ac76ffbbd2fc7b4c183705087688413f"
        },
        {
          "name": "get_valuation_multiples",
          "title": "Get M&A valuation multiples",
          "description": "Read-only. Answers 'what multiple does a business in industry X sell for?' for ONE industry. Returns median EV/EBITDA and EV/Revenue multiples with the middle 50% (25th-75th percentile) and deal count n, broken down by enterprise-value bracket (disclosed deals 2018-2026, n>=10 per cell) plus an all-deal-sizes figure (n>=5). Figures below those thresholds are withheld, never estimated. Passing an industry group id (e.g. 'home-services') returns one all-sizes median per sub-vertical. Use compare_industries to put several industries side by side and get_multiples_trend for year-by-year history. Population medians only: it does not value a specific business.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "industry": {
                "description": "Sub-vertical id from list_industries (e.g. 'hvac', 'dental-practice'), or a plain-English name ('HVAC', 'dentist', 'plumber', 'MSP'); plain names are mapped to the closest tracked category and the answer says which one was used. An industry group id such as 'healthcare' or 'home-services' is also accepted.",
                "type": "string"
              },
              "size_bracket": {
                "description": "Optional enterprise-value (deal size) bracket: under_5m_ev = under $5M, 5m_25m_ev = $5M-$25M, 25m_100m_ev = $25M-$100M, 100m_500m_ev = $100M-$500M, over_500m_ev = $500M and up. Omit to get every published bracket.",
                "enum": ["under_5m_ev", "5m_25m_ev", "25m_100m_ev", "100m_500m_ev", "over_500m_ev"],
                "type": "string"
              }
            },
            "required": ["industry"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get M&A valuation multiples"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:492ecd505b37f2d11006f3bcce7f6d2be4c9cb7989ff4f2728c366850b62d664"
        },
        {
          "name": "list_industries",
          "title": "List industries",
          "description": "Read-only. Lists every industry and sub-vertical ExitValue.ai tracks, with their ids and display names, and flags which sub-verticals have published multiples (has_published_multiples). Takes no input. Use it first when you are unsure of an id; the other tools accept these ids or plain-English names.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List industries"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:036b3551a618ff01164ff5f614af432a0b04a68b681fdc642a51f8f8c4a50992"
        },
        {
          "name": "start_valuation",
          "title": "Start a valuation for a specific business",
          "description": "Read-only. Use when a user asks what THEIR business is worth. Returns a link to the free ExitValue.ai calculator with the industry, annual revenue and EBITDA pre-filled, so the user only confirms the numbers and answers a few risk questions. It does not return a value itself; use get_valuation_multiples for industry medians.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annual_revenue": {
                "description": "Annual revenue in US dollars, e.g. 4000000.",
                "type": "number"
              },
              "ebitda": {
                "description": "Annual EBITDA in US dollars, e.g. 900000.",
                "type": "number"
              },
              "industry": {
                "description": "Sub-vertical id from list_industries (e.g. 'hvac', 'dental-practice'), or a plain-English name ('HVAC', 'dentist', 'plumber', 'MSP'); plain names are mapped to the closest tracked category and the answer says which one was used.",
                "type": "string"
              }
            },
            "required": ["industry"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Start a valuation for a specific business"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2c8cba9d6100ae7ed9a6d7cc88261ff138216d10636354e09647a185b0f4345f"
        }
      ],
      "digest": "sha256:9e04443e5c0cfd9f1f959558bc8df9b6ce28347ecaf07d93bda598ec999a99aa"
    }
  }
}
