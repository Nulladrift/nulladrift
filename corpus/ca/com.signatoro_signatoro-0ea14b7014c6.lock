        {
          "name": "create_signature",
          "title": "Preview an email signature",
          "description": "Make a free email signature from a name and optional title, company, phone, email, website, LinkedIn, layout and accent color. Returns the signature as HTML (for the HTML part of an email or a signature box that takes HTML) and as plain text, plus claimUrl, a link that opens it in Signatoro with these details and layout to save and edit. Nothing is saved and no account is needed; always give the person claimUrl with: \"Open this link to save and edit it in Signatoro.\" To save a signature to the signed-in person's Signatoro account (\"create my signature\", \"save it\"), use update_my_signature instead; for the signature they already saved, use get_signature.",
          "inputSchema": {
            "properties": {
              "color": {
                "description": "Accent color as a 6-digit hex, e.g. \"#6a040f\".",
                "pattern": "^#[0-9a-f]{6}$",
                "type": "string"
              },
              "company": {
                "description": "Company name.",
                "maxLength": 120,
                "type": "string"
              },
              "email": {
                "anyOf": [
                  {
                    "const": "",
                    "type": "string"
                  },
                  {
                    "format": "email",
                    "maxLength": 200,
                    "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                    "type": "string"
                  }
                ],
                "description": "Email address."
              },
              "layout": {
                "description": "One of line, mark, portrait, stack, compact. Call list_templates to choose. Defaults to line.",
                "enum": ["line", "mark", "portrait", "stack", "compact"],
                "type": "string"
              },
              "linkedin": {
                "description": "LinkedIn profile URL.",
                "maxLength": 200,
                "type": "string"
              },
              "name": {
                "description": "Full name. Required.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "description": "Phone number as it should read.",
                "maxLength": 40,
                "type": "string"
