              },
              "logoUrl": {
                "description": "Only a logo uploaded on signatoro.com is accepted; \"\" removes the logo.",
                "maxLength": 500,
                "type": "string"
              },
              "name": {
                "description": "Full name.",
                "maxLength": 120,
                "type": "string"
              },
              "phone": {
                "description": "Phone number as it should read.",
                "maxLength": 40,
