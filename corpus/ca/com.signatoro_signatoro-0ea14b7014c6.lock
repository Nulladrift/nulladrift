              "title": {
                "description": "Job title, e.g. \"Head of Operations\".",
                "maxLength": 120,
                "type": "string"
              },
              "website": {
                "description": "Website, e.g. \"northwind.co\".",
                "maxLength": 200,
                "type": "string"
