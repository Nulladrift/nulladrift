        {
          "name": "update_my_signature",
          "title": "Save or update my signature",
          "description": "Save or change the signed-in person's own signature on Signatoro: name, title, phone, address, email, website, LinkedIn, extra link, photo, review badge, booking button, layout, color and font. With nothing saved yet, this creates the signature. Give only the fields to change; the rest keep their saved values, and \"\" clears a field. Company brand items (logo, company colors, the company review badge or booking button) are set by the company owner on signatoro.com: fields the company controls are left unchanged and listed in ignored, with who changes them; tell the person. A connected mailbox (Zoho Mail) gets the new signature. Returns the updated signature as HTML and text with sender, the details as fields, and counts as one signature request like get_signature; with the month used up, the change is saved and the signature held back. When nothing changed, nothing is written or counted.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Address, one line as it should read.",
                "maxLength": 200,
                "type": "string"
              },
              "bookingLabel": {
                "description": "Button text, e.g. \"Book a call\".",
                "maxLength": 40,
                "type": "string"
              },
              "bookingProvider": {
                "anyOf": [
                  {
                    "const": "",
                    "type": "string"
                  },
                  {
                    "enum": ["calendly", "cal", "other"],
                    "type": "string"
                  }
                ],
                "description": "Booking button provider: calendly, cal, other, or \"\" to remove the button."
              },
              "bookingUrl": {
                "description": "Booking page URL. The button needs it.",
                "maxLength": 300,
                "type": "string"
              },
              "color": {
                "description": "Accent color as a 6-digit hex, e.g. \"#6a040f\".",
                "pattern": "^#[0-9a-f]{6}$",
                "type": "string"
              },
              "company": {
                "description": "Company name.",
                "maxLength": 120,
                "type": "string"
              },
              "email": {
                "anyOf": [
                  {
                    "const": "",
                    "type": "string"
                  },
                  {
                    "format": "email",
                    "maxLength": 200,
                    "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                    "type": "string"
                  }
                ],
                "description": "Email address."
              },
              "extraLinkLabel": {
                "description": "Text of one extra link, e.g. \"Book a demo\".",
                "maxLength": 40,
                "type": "string"
              },
              "extraLinkUrl": {
                "description": "URL of the extra link. Shown only with extraLinkLabel.",
                "maxLength": 300,
                "type": "string"
              },
              "font": {
                "description": "sans or serif.",
                "enum": ["sans", "serif"],
                "type": "string"
              },
              "layout": {
                "description": "One of line, mark, portrait, stack, compact. Call list_templates to choose.",
                "enum": ["line", "mark", "portrait", "stack", "compact"],
                "type": "string"
              },
              "linkedin": {
                "description": "LinkedIn profile URL.",
                "maxLength": 200,
