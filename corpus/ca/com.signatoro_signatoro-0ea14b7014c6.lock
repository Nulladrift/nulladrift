      "capabilities": {
        "tools": {}
      },
      "instructions": "Signatoro holds the email signature the signed-in person saved. get_signature returns it as html and text, with their sender details as fields, for appending after the body of an email they want signed, in place of a sign-off of your own. When the person's own instructions ask for their signature on every email, or to be asked about it, follow them. For the sender's own details in that email, use only the values in get_signature's sender; if one is missing, leave it out and say so - never guess. If the person has AI assistants or company AI agents with their own signatures, list_signatures lists them; when it is unclear which signature an email should carry, ask before sending. Signed in: update_my_signature changes the signature; company owners can list_members, add_member, update_member_field, remove_member and resend_invite. Without signing in: create_signature makes a free signature from a name and details (give the person its claimUrl: \"Open this link to save and edit it in Signatoro.\"), list_templates lists the layouts, get_install_steps gives the steps for a mail app. Parts a company controls (companyControlled in the result) are changed by its owner on signatoro.com: tell the person which parts and who changes them. remove_member cannot be undone: its first call only proposes the removal; call it again with the confirmation only after the person says yes.",
      "tools": [
        {
          "name": "add_member",
          "title": "Add a person to the company",
          "description": "Invite a person to the company by email, with their name, title and phone for their signature. They get an email with the invitation and their signature. Counts toward the company plan's people limit. Company owners only. For someone already in the company, use update_member_field; to send an invitation again, use resend_invite.",
