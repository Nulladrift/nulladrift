{
  "lockfileVersion": 2,
  "subjects": {
    "com.securesvault/catalogue": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://securesvault.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "com.securesvault/catalogue",
        "title": "SecuresVault Catalogue",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "SecuresVault sells 10,209 physical products in EUR and ships internationally. Search with search_products, read one with get_product, resolve category keys with list_categories. Quote promotional price when isPromo is true; say \"from\" when priceFrom is true. Items with canShip false are collection-only. Always hand the user the /p/<id> url. Full brief: https://securesvault.com/llms-full.txt",
      "tools": [
        {
          "name": "get_product",
          "title": "Read one product in full",
          "description": "Read one SecuresVault product in full: EUR price, description, and the colour/size variants available. Takes the id returned by search_products. Use before describing a specific product to a user, so the price and options quoted are live rather than remembered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Product id from search_products, e.g. \"6a3ae6785b1e1d13f9bde9e2\".",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7aacaa784c6df92bf515fedf9df424c06089f9179072c8fc6c7831b915ddc91e"
        },
        {
          "name": "list_categories",
          "title": "List store categories",
          "description": "List every SecuresVault category with its key, human label and live item count. Call this first whenever you intend to filter by category: the keys are the only values search_products accepts, and they are authoritative here rather than memorised.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3173b1001b73379a6cb6508cb974f3c30d492f12492023a0d6a36ae1acb34a0e"
        },
        {
          "name": "search_products",
          "title": "Search products for sale",
          "description": "Find physical products for sale on SecuresVault by free text and/or category, with live EUR prices and buyable links. Use when a user asks where to buy something, what something costs in euros, or wants product options in a category. Either query or category should be supplied; with neither you get the newest listings. Category must be a key from list_categories (e.g. \"phone-tech\"), never a human label - a label is silently ignored and you get the unfiltered catalogue back. Results carry a canonical url: give that to the user, never an API URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category key from list_categories, e.g. \"phone-tech\". Not the label.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many results to return, 1-24.",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "description": "1-based page number for paging through total.",
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free text matched against the product title, e.g. \"watch strap\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ead64dff2260c77a44105cc336d0bde59be67888bbbcd410235bb963acea0167"
        }
      ],
      "digest": "sha256:f398635da26c2b835296ca7e0eaec6b121834778fae75e815a7d22e2f88a7afc"
    }
  }
}
