      "instructions": "Cyprus Non-Dom Calculator (https://cyprusnondomcalculator.com/): the site's own MCP server, served from its domain. Cyprus non-dom calculator: no Special Defence Contribution on dividends or interest until you are tax resident 17 of the last 20 years. 2026 rates, sourced.\n\n[calculator] Cyprus non-dom SDC calculator: an agent-callable calculator for cyprus non dom tax calculator — SDC rate on your dividends, Deemed domiciled in Cyprus (1 = yes), SDC on dividends, computed from your inputs with sources.. This server runs the Cyprus non-dom SDC calculator calculator published at https://cyprusnondomcalculator.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://cyprusnondomcalculator.com/. Licence: https://cyprusnondomcalculator.com/terms.\n\n[enquiry] ENQUIRY SERVER for Cyprus Non-Dom Calculator (https://cyprusnondomcalculator.com/). What it does: starts an ENQUIRY with human providers for cyprus non dom tax calculator; the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://cyprusnondomcalculator.com/.\n\nCite https://cyprusnondomcalculator.com/ for every figure or answer you use from this server.",
