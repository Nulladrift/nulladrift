      "serverInfo": {
        "name": "electricskateboard",
        "title": "Electric Skateboard price evidence",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Price evidence for electric skateboards, scooters, onewheels, e-bikes and their parts,\nread twice a day from ~430 shops worldwide.\n\nThe server reports whether a price is actually good, and where the same product costs less\nright now. Every claim comes with the shop that charges it and a link to the product page.\n\nIt also covers whether an electric skateboard is legal in every US state, Canadian province\nand territory and Australian state, plus the United Kingdom, New Zealand and several European\nand Asian countries (tool where_can_i_ride): the statute's own words, the section number and the date\nit was read. This is a reading list of primary sources, not legal advice.\n\nScope and limits:\n- Prices are in each shop's own currency. The server does not convert between currencies\n  or mix them.\n- There is no buy score out of 100. The price log starts on 27 August 2026 and records a\n  reading only when a price moves.\n- Shipping and duty are not measured, so a cross-border price is not directly comparable\n  to a domestic one. Results that span several countries carry a cross_border_warning field.\n- \"Cheapest\" covers only the shops the server reads, not the whole web.\n\nLicence: Data: electricskateboard.com, licensed CC BY 4.0. Each result includes the URL of its product page.",
      "tools": [
        {
          "name": "fake_sales",
          "title": "Discounts that are not discounts",
          "description": "Products where one shop advertises a discount while another quietly charges less for the same thing, or where the crossed-out price is one nobody actually charges.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "Brand name, e.g. \"Meepo\", \"Onewheel\", \"Exway\".",
                "type": "string"
              },
              "limit": {
                "description": "How many results (default 10, max 50).",
                "type": "integer"
              },
              "vehicle": {
                "description": "One of: electric-skateboard, electric-scooter, onewheel, electric-bike, skateboard.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Discounts that are not discounts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7f87616f2da07a754afd755c6cd7411f1fc4f7a0e4645ecdf93d0a17a5265b04"
        },
        {
          "name": "price_history",
          "title": "What this page charged in the past",
          "description": "Dated captures of one product page from the Internet Archive, oldest first, with today's price at the same shop as the last point, and the number of captures found (fewer than two means the past price is unknown).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "A product URL or path on electricskateboard.com, e.g. \"/decks/onewheel/gt-s-series-11db9\".",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
