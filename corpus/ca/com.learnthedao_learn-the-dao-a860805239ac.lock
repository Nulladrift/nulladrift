      "tools": [
        {
          "name": "consult",
          "description": "Given what a person is actually facing — in their own words — find the chapter of the Tao Te Ching that speaks to it, and the one line to hold. Use this when someone describes a situation (a betrayal, burnout, forcing an outcome, never feeling satisfied) rather than asking about the text. Unlike search_chapters, this matches the SITUATION, not the words: \"a coworker took credit for my work\" reaches chapter 63, which shares no word with it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "situation": {
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["situation"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4b5ce96656d0e01b9f30fa293aa7d5233c8ae83acd12d86c7c76e72ba3860666"
        },
        {
          "name": "get_chapter",
          "description": "Get one chapter (1-81) in both public renderings: the public-domain James Legge (1891) translation and Dao De Kooi, an original rendering by David Kooi. Each carries its own attribution and a ready-to-use citation string. The Kooi rendering is NOT public domain.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "number": {
                "maximum": 81,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["number"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d82f097a17261bbe6078ffdf6148289f6451d1fb95306f06bd7a6a2378bc75a7"
        },
        {
          "name": "list_chapters",
          "description": "List all 81 chapters of the Tao Te Ching with their titles, plus the attribution blocks for each available rendering. Start here to orient.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7d550cd9f4bd8e19d5720a29fdef744f1d0a2bb5f27425bf08e1fbc33c42103a"
        },
        {
          "name": "search_chapters",
          "description": "Search the full corpus for a word or phrase and get the matching lines with their chapter numbers. Use this when the user half-remembers a line and you need to find where it is.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
