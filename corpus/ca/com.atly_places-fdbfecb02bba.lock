        {
          "name": "list_areas",
          "title": "Find areas",
          "description": "List supported areas\n\nCities, neighborhoods and states Atly covers — densest in the United States, with pockets in Mexico, Israel and Thailand — each with an `id` you can pass to\nsearch, a center, a bounding box when known, and how many places it holds. Filter with `q` (substring of\nthe name) and `level` (city, neighborhood, state). Results are ordered by place count.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "level": {
                "description": "Restrict to one level.",
                "enum": ["city", "neighborhood", "state"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum areas to return, at most 200; a larger value returns 200.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Area name or common abbreviation, e.g. \"san diego\", \"midtown\", \"nyc\". Exact and prefix matches rank first.",
