        {
          "name": "search_places",
          "title": "Search places",
          "description": "Find places for an intent near a location\n\nThe core call. Give one or more categories (exact names like \"Coffee\", or ids from `list_categories`; all must\nmatch) and a location — a city name or an `area_id` from `list_areas`, or coordinates with a radius — and get\nplaces ranked by Atly's score for those categories, each with quotable reasons from real reviews, a link to\ncite, a Google Maps link, whether it is open now, and when Atly added and last refreshed it. The first three\nalso carry hours, contact and good-to-know. Scores are 0–10 and\nrelative to other places in the same country; a place with no score is unmeasured, not bad. The order also\nweighs how many reviews back each category score (so it is not always by `score`) and, on a gluten-free ask,\nits `gluten_free.safety` rating. For most dishes and drinks, classes, tours and event or travel companies rank\nlower than the places that serve them, and `doc_notes` names any that moved; to get those, pass `place_type`. If no place matches every category, trailing\ncategories are dropped until something does (the first is never dropped), and `dropped_categories` says which.\nRanking considers the strongest 100 candidates by Atly's base score (400 with `place_type`); `dropped_categories`\nlists the dropped ones as you sent them.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "area_id": {
                "description": "An id from `list_areas`; the search covers that area's viewport. A city name also works (\"Austin\", \"Boise, ID\"): it resolves to the matching area, or, for a city with no area, to the extent of the places whose address is in it, only if Atly has at least five there (`list_areas` says whether it does); the response's `area` and doc_notes say what it resolved to. Give this or lat/lon, not both.",
                "maxLength": 120,
                "type": "string"
              },
              "categories": {
                "description": "Category names or ids, most important first. Every result matches all of them (after any relaxation). A name that is not exact is refused, with the close matches in the error.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "lat": {
                "type": "number"
              },
              "limit": {
                "description": "Places to return, at most 25; a larger value returns 25.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "type": "number"
              },
              "place_type": {
                "description": "Optional. Keep only places whose Google place type contains one of these words, matched as whole words: \"restaurant\" keeps \"Mexican restaurant\" and \"Pizza restaurant\", \"coffee\" keeps \"Coffee shop\", \"bar\" keeps \"Wine bar\" but not \"Barber shop\". A place matches on its main type (`place_type` in results) or any of its other Google types. Use it when the user asks for a kind of venue (\"gluten-free restaurants\"), not a dish or a feature. Google's types are literal: \"Cafe\" and \"Coffee shop\" are different, so for cafes pass both [\"cafe\", \"coffee\"]. The filter is applied to the strongest 400 places for the categories and never relaxed.",
                "items": {
                  "maxLength": 40,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "radius_km": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Used with lat/lon, in km. Held to 0.2-50 (doc_notes say so when it was)."
              }
            },
            "required": ["categories"],
            "type": "object"
          },
