        {
          "name": "get_place",
          "title": "Get place details",
          "description": "Everything about one place\n\nFull detail for a place id from `search_places`: profile, hours, scores for the categories reviewers mention most (up to 40), up to eight quotable\nstatements, good-to-know facts, gluten-free identity when known, and the canonical Atly URL to cite.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "A place id from search_places, or an atly.com place link (with or without https://) or its slug. In a REST path, URL-encode a link.",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "call_id": {
                "type": ["string", "null"]
              },
              "doc_notes": {
                "type": ["string", "null"]
              },
              "place": {
                "anyOf": [
                  {
                    "additionalProperties": {},
                    "properties": {
                      "added_at": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "When Atly added the place. Not a freshness date."
                      },
                      "address": {
                        "type": ["string", "null"]
                      },
                      "blurb": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "One-line editorial summary."
                      },
                      "business_status": {
                        "type": ["string", "null"]
                      },
                      "category_scores": {
                        "anyOf": [
                          {
                            "items": {
                              "additionalProperties": {},
                              "properties": {
                                "category_id": {
                                  "type": ["string", "null"]
                                },
                                "name": {
                                  "type": ["string", "null"]
                                },
                                "reviews": {
                                  "anyOf": [
                                    {
                                      "maximum": 9007199254740991,
                                      "minimum": -9007199254740991,
                                      "type": "integer"
                                    },
                                    {
                                      "type": "null"
                                    }
                                  ],
                                  "description": "Reviews that mention this category."
                                },
                                "score": {
                                  "anyOf": [
                                    {
                                      "type": "number"
                                    },
                                    {
                                      "type": "null"
                                    }
                                  ],
                                  "description": "This category's own 0–10 score. Absent when it fails the test score uses (the place is closed, has under 36 reviews, or too few of its reviews mention this category); reviews is still given. Show no score for it then."
                                }
                              },
                              "type": "object"
                            },
                            "type": "array"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "data_refreshed_at": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "When Atly last refreshed the place's data from its sources. Absent when unknown."
                      },
                      "distance_km": {
                        "anyOf": [
                          {
                            "type": "number"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "From the search center: the coordinates given, or the area's center (the middle of its bounding box when it has one)."
                      },
                      "gluten_free": {
                        "anyOf": [
                          {
                            "additionalProperties": {},
                            "properties": {
                              "dedicated_fryer": {
                                "anyOf": [
                                  {
                                    "enum": ["YES", "NO", "UNKNOWN", "NOT_APPLICABLE"],
                                    "type": "string"
                                  },
                                  {
                                    "type": "null"
                                  }
                                ]
                              },
                              "dedicated_kitchen": {
                                "anyOf": [
                                  {
                                    "enum": ["YES", "NO", "UNKNOWN", "NOT_APPLICABLE"],
                                    "type": "string"
                                  },
                                  {
                                    "type": "null"
                                  }
                                ]
                              },
                              "menu": {
                                "anyOf": [
                                  {
                                    "enum": ["DEDICATED_GF_MENU", "GF_OPTIONS_MARKED", "GF_OPTIONS_NOT_MARKED", "UNKNOWN"],
                                    "type": "string"
                                  },
                                  {
                                    "type": "null"
                                  }
                                ]
                              },
                              "safety": {
                                "anyOf": [
                                  {
                                    "enum": ["100% dedicated gluten-free", "celiac friendly (low risk of cross-contamination)", "accommodating (some risk of cross-contamination)", "discuss cross-contamination with staff"],
                                    "type": "string"
                                  },
                                  {
                                    "type": "null"
                                  }
                                ]
                              },
                              "trained_staff": {
                                "anyOf": [
                                  {
                                    "enum": ["YES", "NO", "UNKNOWN", "NOT_APPLICABLE"],
                                    "type": "string"
                                  },
                                  {
                                    "type": "null"
                                  }
                                ]
                              },
                              "verified_by_atly": {
                                "type": ["boolean", "null"]
                              }
                            },
                            "type": "object"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Present only for places with a gluten-free identity."
                      },
                      "good_to_know": {
                        "anyOf": [
                          {
                            "items": {
                              "type": "string"
                            },
                            "type": "array"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "google_rating": {
                        "type": ["number", "null"]
                      },
                      "hours": {
                        "anyOf": [
                          {
                            "items": {
                              "additionalProperties": {},
                              "properties": {
                                "close": {
                                  "type": "string"
                                },
                                "close_day": {
                                  "anyOf": [
                                    {
                                      "enum": ["sun", "mon", "tue", "wed", "thu", "fri", "sat"],
                                      "type": "string"
                                    },
                                    {
                                      "type": "null"
                                    }
                                  ]
                                },
                                "day": {
                                  "enum": ["sun", "mon", "tue", "wed", "thu", "fri", "sat"],
                                  "type": "string"
                                },
                                "open": {
                                  "type": "string"
                                }
                              },
                              "required": ["close", "day", "open"],
                              "type": "object"
                            },
                            "type": "array"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Weekly opening hours in the place's local time, one entry per opening (a day can have several). close 24:00 means it closes at midnight; close_day is set when it closes after midnight, on that day. In get_place and the first search results; absent when unknown."
                      },
                      "hours_updated_at": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "When the opening hours were last updated. Absent when there are no hours or no date. Over a year old (or absent with hours), say they may have changed and suggest checking with the place."
                      },
                      "id": {
                        "type": ["string", "null"]
                      },
                      "lat": {
                        "type": ["number", "null"]
                      },
                      "lon": {
                        "type": ["number", "null"]
                      },
                      "maps_url": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Google Maps link for the place (directions), from its Google place id. Not an Atly page: cite url for Atly."
                      },
                      "menu_url": {
                        "type": ["string", "null"]
                      },
                      "name": {
                        "type": ["string", "null"]
                      },
                      "open_now": {
                        "anyOf": [
                          {
                            "type": "boolean"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Open at the time of the response, by its hours and timezone; false when the place is closed temporarily or for good. Absent when its hours or timezone are unknown. As fresh as the hours: see hours_updated_at."
                      },
                      "phone": {
                        "type": ["string", "null"]
                      },
                      "place_type": {
                        "type": ["string", "null"]
                      },
                      "price": {
                        "type": ["string", "null"]
                      },
                      "reasons": {
                        "anyOf": [
                          {
                            "items": {
                              "additionalProperties": {},
                              "properties": {
                                "kind": {
                                  "anyOf": [
                                    {
                                      "type": "string"
                                    },
                                    {
                                      "type": "null"
                                    }
                                  ],
                                  "description": "What the statement is about: Specific Food, Specific Drink, Specific Alcohol (a named dish or drink), Food, Drink, Alcohol, Ambiance, Service, Amenity, Event, Establishment Features or Non-Specific Informative. Personal Experience (a reviewer's own story) appears at most once per requested category, only for one that no positive statement of those kinds names. A gluten-safety warning can be of any kind, such as Personal Experience, Ambiguous or Other."
                                },
                                "sentiment": {
                                  "anyOf": [
                                    {
                                      "enum": ["positive", "neutral", "negative"],
                                      "type": "string"
                                    },
                                    {
                                      "type": "null"
                                    }
                                  ]
                                },
                                "text": {
                                  "type": ["string", "null"]
                                }
                              },
                              "type": "object"
                            },
                            "type": "array"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Short first-person statements from real reviews, most useful first. Quote them."
                      },
                      "reservation_url": {
                        "type": ["string", "null"]
                      },
                      "review_count": {
                        "anyOf": [
                          {
                            "maximum": 9007199254740991,
                            "minimum": -9007199254740991,
                            "type": "integer"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "score": {
                        "anyOf": [
                          {
                            "type": "number"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Atly score 0–10, relative to other places in the same country. In get_place, the overall score. In search, the Atly app's blend of the overall score with the scores on the requested categories, so even with one category it can differ from that category's own category_scores score: quote score for how good the place is for the ask, the category's score for how reviewers rate that one thing. Absent when unmeasured (too few reviews, closed, or, in search, a requested category that too few of its reviews mention)."
                      },
                      "timezone": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "IANA timezone of the place."
                      },
                      "url": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Canonical Atly page. Link it when you cite. Absent when the place has no page yet."
                      },
                      "website": {
                        "type": ["string", "null"]
                      }
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "type": "object"
          },
