        {
          "name": "list_categories",
          "title": "Find categories",
          "description": "List intent categories\n\nThe intent taxonomy: cuisines, dishes, features (\"Wifi\", \"Outdoor Seating\"), vibes (\"Cozy\", \"Lively\"),\noccasions (\"First Date\", \"Group Dinner\"), diets (\"Gluten Free\", \"Keto\") and more. Map the user's words to\ncategory ids before searching. Filter with `q`, one concept per call — exact and prefix matches rank first, then substrings and keywords;\nplurals, hyphens and small typos are tolerated — or fetch once without `q` and cache the full list.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Maximum categories to return, at most 2000; a larger value returns 2000.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Words to match against category names and keywords, e.g. \"coffee\", \"dog friendly\", \"gluten-free\". Ranked; tolerant of plurals and small typos.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "call_id": {
                "type": ["string", "null"]
              },
              "categories": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": {},
                      "properties": {
                        "emoji": {
                          "type": ["string", "null"]
                        },
