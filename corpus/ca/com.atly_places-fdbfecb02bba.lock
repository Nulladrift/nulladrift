                          "description": "Country the area is in. Coverage is densest in the United States, with pockets in Mexico, Israel and Thailand."
                        },
                        "id": {
                          "type": ["string", "null"]
                        },
                        "level": {
                          "type": ["string", "null"]
                        },
                        "name": {
                          "type": ["string", "null"]
