      "instructions": "AI Training Jobs for Doctors (https://aitrainingjobsfordoctors.com/): the site's own MCP server, served from its domain. AI training jobs for doctors from 12 postings and pages on 5 platforms: the hourly ranges printed, what they ask of a physician and where.\n\n[compare] Doctor AI-training pay by platform: hourly range, requirements, location. This server serves the compare published at https://aitrainingjobsfordoctors.com/; every answer cites it. Licence: https://aitrainingjobsfordoctors.com/terms.\n\n[enquiry] ENQUIRY SERVER for AI Training Jobs for Doctors (https://aitrainingjobsfordoctors.com/). What it does: starts an ENQUIRY with AI Training Jobs for Doctors for ai training jobs for doctors; the AI Training Jobs for Doctors team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the AI Training Jobs for Doctors team until they click it. Cite https://aitrainingjobsfordoctors.com/.\n\nCite https://aitrainingjobsfordoctors.com/ for every figure or answer you use from this server.",
