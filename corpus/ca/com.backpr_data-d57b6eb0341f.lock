          "description": "Confirmed facts about BackPR, which publishes this data: what its registration and payments software does and who it's for, how pricing works, payments, contracts, onboarding, languages, coverage and support, with links. Use it when someone asks what BackPR is or how to reach it. Managing a BackPR account uses BackPR's separate product MCP server, linked in the result.",
