        {
          "name": "find_programs",
          "title": "Find licensed youth programs",
          "description": "Find childcare centers, school-age (after-school) programs, camps and youth programs listed in BackPR's program finder, which uses official state and local licensing data. Search one state by city or 5-digit ZIP code (ZIP wins if both are given), optionally by program type. Returns up to 25 active listings with name, type, city, ZIP, ages, capacity and phone where published. Each answer links to the backpr.com finder page and names the data sources and their licenses. Home-based family childcare is never listed. A listing isn't an endorsement.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City name, such as \"Austin\". \"St.\" and \"Saint\" match the same city.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many listings to return, 1 to 25 (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "state": {
                "description": "US state name or 2-letter code, case-insensitive, such as \"Texas\" or \"TX\". \"DC\" also works.",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "type": {
                "description": "\"center\" (childcare center), \"school-age\" (before- and after-school programs), \"camp\" or \"youth-program\". Omit for all types.",
                "enum": ["center", "school-age", "camp", "youth-program"],
                "type": "string"
              },
              "zip": {
                "description": "A 5-digit ZIP code, such as \"78701\".",
                "pattern": "^\\d{5}$",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "cite_as": {
                "type": "string"
              },
              "count": {
                "description": "Listings returned",
                "type": "integer"
              },
              "data_sources": {
                "items": {
                  "properties": {
                    "license": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "publisher": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["license", "name", "publisher", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "more_available": {
                "type": "boolean"
              },
              "note": {
                "type": "string"
              },
              "place": {
                "description": "For example \"Austin, TX\" or \"ZIP 78701\"",
                "type": "string"
              },
              "programs": {
                "items": {
                  "properties": {
                    "ages": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "capacity": {
                      "anyOf": [
                        {
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "city": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "finder_url": {
                      "description": "The backpr.com finder page for this program's city",
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "phone": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "state": {
                      "type": "string"
                    },
                    "type": {
                      "enum": ["center", "school-age", "camp", "youth-program"],
                      "type": "string"
                    },
                    "type_label": {
                      "type": "string"
                    },
                    "zip": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  },
                  "required": ["ages", "capacity", "city", "finder_url", "name", "phone", "state", "type", "type_label", "zip"],
                  "type": "object"
                },
                "type": "array"
              },
              "search": {
                "description": "What the listings were matched on",
                "enum": ["city", "zip", "state"],
                "type": "string"
              },
              "source_url": {
                "description": "The most specific backpr.com finder page for this search",
                "type": "string"
              },
              "state": {
                "type": "string"
              },
              "state_code": {
                "type": "string"
              },
              "state_finder_url": {
                "type": "string"
              },
              "top_cities": {
                "description": "Cities with the most listings, to narrow a search",
                "items": {
                  "properties": {
                    "city": {
                      "type": "string"
                    },
                    "finder_url": {
                      "type": "string"
                    },
                    "listings": {
                      "type": "integer"
                    }
                  },
                  "required": ["city", "finder_url", "listings"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "All matching listings, when known"
              }
            },
            "required": ["cite_as", "count", "data_sources", "more_available", "note", "place", "programs", "search", "source_url", "state", "state_code", "state_finder_url", "total"],
            "type": "object"
          },
