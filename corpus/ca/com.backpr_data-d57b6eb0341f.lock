        {
          "name": "find_registration_software",
          "title": "Find registration software pricing",
          "description": "Search BackPR's registration software pricing index: what dozens of registration, camp, childcare, class and sports platforms publish about plan prices, nonprofit offers, fees added for families and contract terms, each with the company's own wording and the date BackPR checked it. Filter by platform name, category or whether the platform is free for nonprofits. Use it to compare costs or find free options. BackPR publishes this index and sells registration software; BackPR isn't in the index.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Platform category, such as \"camps\", \"childcare\", \"sports\", \"recreation\", \"forms\", \"classes-studios\", \"church\", \"all-in-one\", \"schools-education\", \"courses-adult\" or \"membership\".",
                "maxLength": 40,
                "type": "string"
              },
              "free_for_nonprofits": {
                "description": "true: only platforms whose published nonprofit offer is free. false: only platforms whose offer isn't free. Omit for all.",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "description": "How many platforms to return, 1 to 25 (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Platform name or part of it, such as \"Jumbula\" or \"camp\".",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
