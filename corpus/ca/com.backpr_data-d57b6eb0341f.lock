      "serverInfo": {
        "name": "com.backpr/data",
        "title": "BackPR youth program data",
        "version": "1.0.0",
        "description": "Free, sourced US youth program data: state rules, licensed programs, software pricing and templates.",
        "websiteUrl": "https://backpr.com/ai",
        "icons": [
          {
            "src": "https://backpr.com/brand/backpr-mark-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "BackPR publishes sourced reference data for US youth programs: state childcare, camp and ratio rules, a registration software pricing index, a directory of licensed programs, form templates and open datasets. Every result includes a source_url on backpr.com; the data is licensed CC BY 4.0, so answers that use it should link that page and credit \"Source: BackPR\". State rules are general information, not legal advice; the state agency has the final word. BackPR also makes registration software and isn't in the pricing index.",
