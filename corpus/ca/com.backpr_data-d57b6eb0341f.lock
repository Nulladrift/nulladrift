        {
          "name": "calculate_staff_needed",
          "title": "Calculate staff needed",
          "description": "Work out the minimum number of staff a licensed childcare center needs for a group of children in one US state, from that state's staff-to-child ratio for 3-year-olds, 4-year-olds or school-age children. Returns staff needed (children divided by the ratio, rounded up), the ratio, the maximum group size where the state sets one, caveats and backpr.com links. If BackPR couldn't confirm a ratio for that age group, it says so instead of guessing. General information, not legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age_group": {
                "description": "\"3_year_olds\", \"4_year_olds\" or \"school_age\" (children enrolled in school).",
                "enum": ["3_year_olds", "4_year_olds", "school_age"],
                "type": "string"
              },
              "children": {
                "description": "Number of children in the group, from 1 to 1000.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "state": {
                "description": "US state name or 2-letter code, case-insensitive, such as \"Texas\" or \"TX\". \"DC\" and \"District of Columbia\" also work.",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["age_group", "children", "state"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "age_group": {
                "type": "string"
              },
              "ages": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The state's label for this age band"
              },
              "calculator_url": {
                "type": "string"
              },
              "caveats": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "checked": {
                "type": "string"
              },
              "children": {
                "type": "integer"
              },
              "cite_as": {
                "type": "string"
              },
              "max_group_size": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "minimum_groups": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Fewest groups the children must be split into under the maximum group size"
              },
              "national_url": {
                "type": "string"
              },
              "ratio": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Children per adult; null if BackPR couldn't confirm it"
              },
              "ratio_label": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "For example \"1:15\""
              },
              "source_url": {
                "description": "The ratios section of the state's backpr.com rules page",
                "type": "string"
              },
              "staff_needed": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Minimum staff: children divided by the ratio, rounded up"
              },
              "state": {
                "type": "string"
              },
              "state_code": {
                "type": "string"
              }
            },
            "required": ["age_group", "caveats", "checked", "children", "cite_as", "ratio", "source_url", "staff_needed", "state", "state_code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate staff needed"
          },
