              },
              "longestCut": {
                "type": "string"
              },
              "match": {
                "enum": ["straight", "half-drop", "random"],
                "type": "string"
              },
              "matchComparison": {
                "description": "The same walls with each pattern match; the match is printed on the roll label, so this is not a choice.",
                "items": {
                  "anyOf": [
                    {
                      "additionalProperties": false,
                      "properties": {
                        "linearYards": {
                          "$ref": "#/properties/cutTotalFt"
                        },
                        "match": {
                          "enum": ["straight", "half-drop", "random"],
                          "type": "string"
                        },
                        "matchWasteFt": {
                          "$ref": "#/properties/cutTotalFt"
                        },
                        "rollsToBuy": {
                          "$ref": "#/properties/rollsToBuy"
                        }
                      },
                      "required": ["linearYards", "match", "matchWasteFt", "rollsToBuy"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "error": {
                          "$ref": "#/properties/longestCut"
                        },
                        "match": {
                          "enum": ["straight", "half-drop", "random"],
                          "type": "string"
                        }
                      },
                      "required": ["error", "match"],
                      "type": "object"
                    }
                  ]
                },
                "type": "array"
              },
              "matchWasteFt": {
                "$ref": "#/properties/cutTotalFt"
              },
              "openingAreaSqFt": {
                "$ref": "#/properties/cutTotalFt"
              },
              "rolls": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "cuts": {
                      "items": {
                        "$ref": "#/properties/longestCut"
                      },
                      "type": "array"
                    },
                    "leftover": {
                      "$ref": "#/properties/longestCut"
                    },
                    "roll": {
                      "$ref": "#/properties/longestCut"
                    }
                  },
                  "required": ["cuts", "leftover", "roll"],
                  "type": "object"
                },
                "type": "array"
              },
              "rollsToBuy": {
                "type": "integer"
              },
              "shareUrl": {
                "$ref": "#/properties/longestCut"
              },
              "shareUrlComplete": {
                "type": "boolean"
              },
              "wallAreaSqFt": {
                "$ref": "#/properties/cutTotalFt"
              },
              "warnings": {
                "items": {
                  "$ref": "#/properties/longestCut"
                },
                "type": "array"
              },
              "wastePercent": {
                "$ref": "#/properties/cutTotalFt"
              }
            },
            "required": ["areaMethodRolls", "cutTotalFt", "cuts", "drops", "dropsPerRoll", "linearYards", "longestCut", "match", "matchComparison", "matchWasteFt", "openingAreaSqFt", "rolls", "rollsToBuy", "shareUrl", "shareUrlComplete", "wallAreaSqFt", "warnings", "wastePercent"],
            "type": "object"
