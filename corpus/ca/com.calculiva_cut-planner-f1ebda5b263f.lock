{
  "lockfileVersion": 2,
  "subjects": {
    "com.calculiva/cut-planner": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.calculiva.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "calculiva-cut-planner",
        "version": "0.1.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "build_order_sheet",
          "title": "Build one order sheet",
          "description": "Builds one consolidated order sheet from the flooring, trim and wallpaper plans of the same project (pass the same arguments as plan_flooring_order, plan_trim_order and plan_wallpaper_order): cartons, boards per stock length, rolls, total offcuts, the cut list by material and a CSV. Trim pieces of all walls and all types (battens, rails, chair rail, frames) are packed together on the stock boards, and the sheet compares that with one order per wall, each wall on its own best stock length (total length bought, then offcut, then boards).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "extraPercent": {
                "description": "Extra boards to buy, % of the boards in the cut plan. Default 10.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "flooring": {
                "description": "Flooring orders, one per plank product, with the plan_flooring_order arguments.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "allowancePercent": {
                      "description": "Flat waste allowance you would otherwise buy (e.g. 10): the answer says how many planks it misses.",
                      "maximum": 100,
                      "minimum": 0,
                      "type": "number"
                    },
                    "balancedRows": {
                      "description": "Split the partial row width between the first and last rows (default true).",
                      "type": "boolean"
                    },
                    "carryBetweenRooms": {
                      "description": "Offcuts of a room feed the next rooms (default true).",
                      "type": "boolean"
                    },
                    "clearance": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "Expansion gap on every wall, from the product instructions. Default 0. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                    },
                    "direction": {
                      "description": "horizontal = planks run along the room width (default); vertical = along the room length.",
                      "enum": ["horizontal", "vertical"],
                      "type": "string"
                    },
                    "firstStarter": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "Length of the first row starter; 0 = full plank. Default 0. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                    },
                    "kerf": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "Saw kerf, charged on each cut. Default 1/8 in. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                    },
                    "minJointSpacing": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "Minimum distance between end joints of adjacent rows; 0 disables the check. Default 0. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                    },
                    "minReuse": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "Shortest offcut worth carrying to another room. Default 0 (any offcut long enough). Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                    },
                    "minRowWidth": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "Minimum edge-row width; 0 disables the check. Default 0. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                    },
                    "minStarter": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "Minimum row starter length; 0 disables the check. Default 0. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                    },
                    "name": {
                      "description": "Name of this floor product, e.g. \"oak LVP\"",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "offset": {
                      "description": "End-joint stagger between rows, as a fraction of the plank: 1/3 (default), 1/2 or 0 (aligned).",
                      "enum": ["0", "1/3", "1/2"],
                      "type": "string"
                    },
                    "order": {
                      "description": "Laying order by room name; offcuts only flow forward. Default: the order of rooms.",
                      "items": {
                        "maxLength": 40,
                        "type": "string"
                      },
                      "maxItems": 12,
                      "type": "array"
                    },
                    "plankLength": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "Installed plank length (face), from the carton. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                    },
                    "plankWidth": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "Installed plank width (face), from the carton. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                    },
                    "planksPerBox": {
                      "description": "Planks per carton, from the carton label.",
                      "maximum": 1000,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "reuse": {
                      "description": "Cut a row end from the offcut of a row start in the same room (default true).",
                      "type": "boolean"
                    },
                    "rooms": {
                      "description": "Rooms to floor with the same plank, 1 to 12, in laying order unless order is given.",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "length": {
                            "anyOf": [
                              {
                                "maxLength": 80,
                                "minLength": 1,
                                "type": "string"
                              },
                              {
                                "minimum": 0,
                                "type": "number"
                              }
                            ],
                            "description": "Room length, wall to wall (overall outside dimension for an L). Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                          },
                          "name": {
                            "description": "Room name, e.g. \"living room\". Default \"room 1\", \"room 2\"…",
                            "maxLength": 40,
                            "type": "string"
                          },
                          "notch": {
                            "additionalProperties": false,
                            "description": "L-shaped room: the rectangle missing from one corner of width x length.",
                            "properties": {
                              "corner": {
                                "description": "Missing corner on the plan. Default top-right.",
                                "enum": ["top-right", "top-left", "bottom-right", "bottom-left"],
                                "type": "string"
                              },
                              "length": {
                                "anyOf": [
                                  {
                                    "maxLength": 80,
                                    "minLength": 1,
                                    "type": "string"
                                  },
                                  {
                                    "minimum": 0,
                                    "type": "number"
                                  }
                                ],
                                "description": "Length of the missing corner rectangle. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                              },
                              "width": {
                                "anyOf": [
                                  {
                                    "maxLength": 80,
                                    "minLength": 1,
                                    "type": "string"
                                  },
                                  {
                                    "minimum": 0,
                                    "type": "number"
                                  }
                                ],
                                "description": "Width of the missing corner rectangle. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                              }
                            },
                            "required": ["length", "width"],
                            "type": "object"
                          },
                          "width": {
                            "anyOf": [
                              {
                                "maxLength": 80,
                                "minLength": 1,
                                "type": "string"
                              },
                              {
                                "minimum": 0,
                                "type": "number"
                              }
                            ],
                            "description": "Room width, wall to wall (overall outside dimension for an L). Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                          }
                        },
                        "required": ["length", "width"],
                        "type": "object"
                      },
                      "maxItems": 12,
                      "minItems": 1,
                      "type": "array"
                    }
                  },
                  "required": ["plankLength", "plankWidth", "planksPerBox", "rooms"],
                  "type": "object"
                },
                "maxItems": 4,
                "type": "array"
              },
              "kerf": {
                "anyOf": [
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "minimum": 0,
                    "type": "number"
                  }
                ],
                "description": "Saw kerf, charged between two cuts on the same board. Default 1/8 in. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
              },
              "stockLengthsFt": {
                "description": "Board lengths you can buy, in feet (1 to 8 values, each up to 24). Default: 8, 10, 12 and 16 ft are compared and any of them can be recommended; pass the lengths your store sells to plan on those.",
                "items": {
                  "exclusiveMinimum": 0,
                  "maximum": 24,
                  "type": "number"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              },
              "trim": {
                "description": "Trim walls, one per wall, with the plan_trim_order arguments (stock, kerf and extra are set once below).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "baseboardHeight": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "Existing baseboard height; \"0\" if none. Default 5 1/4 in. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                    },
                    "battenCount": {
                      "description": "board-and-batten: number of battens. Omit to use battenSpacing.",
                      "maximum": 400,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "battenSpacing": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "board-and-batten: target gap between battens, used when battenCount is omitted. Default 12 in. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                    },
                    "battenWidth": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "board-and-batten: actual batten width (a 1x3 is 2 1/2 in). Default 2 1/2 in. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                    },
                    "bottomRailWidth": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "wainscoting stile-and-rail: bottom rail width. Default 5 1/2 in. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                    },
                    "capHeight": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "picture-frame-molding: height of the underside of the chair rail. Default 36 in. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                    },
                    "chairRailWidth": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "wainscoting: chair rail height (board width). Default 2 1/2 in. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                    },
                    "columns": {
                      "description": "picture-frame-molding: boxes across. Default 4.",
                      "maximum": 40,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "edge": {
                      "description": "board-and-batten: start and end the wall with a space (default) or with a batten.",
                      "enum": ["space", "batten"],
                      "type": "string"
                    },
                    "edgeBottom": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "picture-frame-molding: bottom margin. Default 4 in. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                    },
                    "edgeTop": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "picture-frame-molding: top margin. Default 4 in. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                    },
                    "edgeX": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "picture-frame-molding: side margin. Default 4 in. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                    },
                    "fullHeight": {
                      "description": "board-and-batten: battens run to the ceiling. Default false.",
                      "type": "boolean"
                    },
                    "gapX": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "picture-frame-molding: gap between boxes. Default 4 in. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                    },
                    "gapY": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "picture-frame-molding: gap between rows. Default 4 in. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                    },
                    "hasCap": {
                      "description": "picture-frame-molding: a chair rail caps the boxes (default true); false = boxes run to the ceiling.",
                      "type": "boolean"
                    },
                    "layout": {
                      "description": "board-and-batten: vertical battens (default) or a grid with horizontal rails.",
                      "enum": ["vertical", "grid"],
                      "type": "string"
                    },
                    "material": {
                      "description": "Board or molding the pieces are cut from; walls with the same material are packed together. Default \"trim boards\" (all walls together).",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "memberWidth": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "wainscoting: stile width, or side reveal between frames. Default 3 1/2 in. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                    },
                    "moldingWidth": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "wainscoting applied-frames (default 1 1/4 in) or picture-frame-molding (default 1 in): molding face width. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                    },
                    "name": {
                      "description": "Wall name, e.g. \"dining north wall\". Default \"wall 1\"…",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "openings": {
                      "description": "Up to 4 openings or obstacles on the wall; pieces that land on them are flagged and left out of the cut list.",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "label": {
                            "description": "Name shown in the plan, e.g. \"window\"",
                            "maxLength": 40,
                            "type": "string"
                          },
                          "position": {
                            "anyOf": [
                              {
                                "maxLength": 80,
                                "minLength": 1,
                                "type": "string"
                              },
                              {
                                "minimum": 0,
                                "type": "number"
                              }
                            ],
                            "description": "Distance from the left end of the wall to the left edge of the opening or obstacle. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                          },
                          "width": {
                            "anyOf": [
                              {
                                "maxLength": 80,
                                "minLength": 1,
                                "type": "string"
                              },
                              {
                                "minimum": 0,
                                "type": "number"
                              }
                            ],
                            "description": "Width of the opening or obstacle (window, door, outlet, switch). Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                          }
                        },
                        "required": ["position", "width"],
                        "type": "object"
                      },
                      "maxItems": 4,
                      "type": "array"
                    },
                    "panelCount": {
                      "description": "wainscoting: number of panels or frames. Omit to use panelWidth.",
                      "maximum": 60,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "panelWidth": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "wainscoting: target panel width, used when panelCount is omitted. Default 30 in. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                    },
                    "project": {
                      "description": "board-and-batten, wainscoting (applied frames or stile and rail) or picture-frame-molding (boxes of 45° mitered molding).",
                      "enum": ["board-and-batten", "wainscoting", "picture-frame-molding"],
                      "type": "string"
                    },
                    "railCount": {
                      "description": "board-and-batten grid: horizontal rails per bay. Default 2.",
                      "maximum": 20,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "revealVertical": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "wainscoting applied-frames: reveal above and below each frame. Default 3 1/2 in. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                    },
                    "rows": {
                      "description": "picture-frame-molding: rows of boxes. Default 1.",
                      "maximum": 10,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "style": {
                      "description": "wainscoting: applied molding frames (default) or stiles and rails.",
                      "enum": ["applied-frames", "stile-and-rail"],
                      "type": "string"
                    },
                    "topRailHeight": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "board-and-batten: height of the top of the top rail from the floor. Default 32 in. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                    },
                    "topRailWidth": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "board-and-batten top rail, or wainscoting stile-and-rail top rail width. Default 3 1/2 in. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                    },
                    "wainscotHeight": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "wainscoting: overall height from the floor, chair rail included. Default 32 in. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                    },
                    "wallHeight": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "Wall height, floor to ceiling. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
                    },
                    "wallWidth": {
                      "anyOf": [
                        {
