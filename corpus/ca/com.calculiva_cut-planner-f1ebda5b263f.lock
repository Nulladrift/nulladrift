                ],
                "description": "Existing baseboard height; \"0\" if none. Default 5 1/4 in. Length with its unit, e.g. \"12 ft 6 in\", \"12'6\\\"\", \"150 in\", \"3m80\"; a bare number is read as inches."
              },
              "battenCount": {
