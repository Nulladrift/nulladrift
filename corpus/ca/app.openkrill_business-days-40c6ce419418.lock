        {
          "name": "list_holidays",
          "title": "List bank holidays and school breaks",
          "description": "Use this when the user asks which public holidays, bank holidays, statutory holidays or school breaks a country, state or province has in a year, for example \"is Monday a bank holiday in Bavaria?\", \"public holidays in Vietnam in 2027\" or \"school holidays in Bavaria\". Pass the country code and the year, a region when the user names one, and kind school for school holidays, which are published for a limited set of countries. Public holidays come back with the date, weekday, English and local name, whether they apply nationwide or in listed regions, and whether they are a day off. Do not use it for religious or cultural festival dates without a country, trading-day calendars, or company holidays.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter ISO 3166-1 country code whose holidays apply, such as US, GB, DE, AU or VN.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "kind": {
                "description": "public (default) for public holidays, or school for school holidays, which exist for a limited set of countries.",
                "enum": ["public", "school"],
                "type": "string"
              },
              "region": {
                "description": "State, province or nation within the country, as a subdivision code such as DE-BY or BY (Bavaria), GB-SCT (Scotland), US-CA or AU-NSW. Optional.",
                "pattern": "^[A-Za-z0-9]{1,3}(-[A-Za-z0-9]{1,3})?$",
                "type": "string"
              },
              "year": {
                "description": "Calendar year, for example 2027.",
                "maximum": 2076,
                "minimum": 1976,
                "type": "integer"
              }
            },
            "required": ["country", "year"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "country": {
                "type": "string"
              },
              "kind": {
                "enum": ["public", "school"],
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "publicHolidays": {
                "items": {
                  "properties": {
                    "appliesTo": {
                      "anyOf": [
                        {
