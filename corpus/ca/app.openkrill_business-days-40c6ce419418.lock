      "serverInfo": {
        "name": "business-days",
        "title": "Business Days & Workday Calc: Workdays, holidays, SLA & PTO",
        "version": "1.0.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Business Days & Workday Calc: Workdays, holidays, SLA & PTO. Use count_business_days for how many working days fall between two dates, add_business_days for the date a number of business days after or before a date, and list_holidays for a country's public or school holidays in a year. Always send the country as a two-letter code; ask for the country if the user did not give one. Send a region when the user names a state, province or nation (Bavaria is DE-BY, Scotland is GB-SCT, England is GB-ENG, California is US-CA); holidays only some regions keep are not counted without it, and regionalHolidaysNotCounted lists them, so mention them when it is not empty. Send weekendDays when the weekend is not Saturday and Sunday. State the day-count convention in the answer: for a range both ends are counted unless includeStartDate or includeEndDate is false, and for add_business_days the start date is day 0 and is not counted. For a trading or settlement date, send calendars instead of region: NYSE, FED, LSE, JPX or TARGET2, joined when a settlement needs two (a US T+1 settlement date is [\"NYSE\", \"FED\"]). Name the holidays that changed the result. If a note is returned, pass it on. Holiday data can differ from an employer's or a contract's calendar, so do not present the result as a legal deadline. This server allows 60 tool calls a minute per network and 5,000 a day for all callers together; the day count resets at 00:00 UTC. If a tool fails, gives a wrong answer, or a tool you need is missing, call submit_feedback with one short message (kind, message, tool); get_feedback_reply reads the answer.",
      "tools": [
        {
          "name": "add_business_days",
          "title": "Calculate a business-day due date and SLA",
          "description": "Use this when the user asks what date is a number of working days, business days or workdays after or before a date, including an SLA due date or turnaround, for example \"what date is 37 business days after 11 August in England?\", \"when is payment due 30 business days from invoice date 3 March in Germany?\" or \"5 working days before 20 December in the US\". Pass the country code, the start date as YYYY-MM-DD, the number of days (negative for earlier) and a region when the user names one. The start date is day 0 and is not counted. Returns the resulting date and weekday, the holidays skipped, and the conventions used. At most 1000 business days. For a trade's settlement date (T+1, T+2) pass calendars, such as [\"NYSE\", \"FED\"], [\"LSE\"] or [\"JPX\"]. Do not use it for legal deadlines that follow their own court or contract rules, or for calendar-day offsets.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "calendars": {
                "description": "Holiday calendars to apply; a day is off when any of them closes it. \"public\" (the default) is the country's public holidays. NYSE is the New York Stock Exchange (also Nasdaq), FED the Federal Reserve and Fedwire (which DTC settlement follows), LSE the London Stock Exchange, JPX the Japan Exchange Group, TARGET2 the euro payment system. For a settlement date join the market and payment calendars, such as [\"NYSE\", \"FED\"] for a US T+1 settlement or [\"TARGET2\", \"FED\"] for EUR/USD spot. Optional.",
                "items": {
                  "enum": ["public", "NYSE", "FED", "LSE", "JPX", "TARGET2"],
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "country": {
                "description": "Two-letter ISO 3166-1 country code whose holidays apply, such as US, GB, DE, AU or VN.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "days": {
                "description": "Working days to move: positive for later, negative for earlier. At most 1000 either way.",
                "maximum": 1000,
                "minimum": -1000,
                "type": "integer"
              },
              "region": {
                "description": "State, province or nation within the country, as a subdivision code such as DE-BY or BY (Bavaria), GB-SCT (Scotland), US-CA or AU-NSW. Optional.",
                "pattern": "^[A-Za-z0-9]{1,3}(-[A-Za-z0-9]{1,3})?$",
                "type": "string"
              },
              "startDate": {
                "description": "The date to count from, YYYY-MM-DD. It is day 0 and is not counted.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "weekendDays": {
                "description": "Days of the week that are not working days. Default: saturday and sunday. Use friday and saturday where that is the weekend.",
                "items": {
                  "enum": ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"],
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["country", "days", "startDate"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "calendarDays": {
                "type": "integer"
              },
              "calendars": {
                "description": "The calendars applied, when the call named calendars",
                "items": {
                  "enum": ["public", "NYSE", "FED", "LSE", "JPX", "TARGET2"],
                  "type": "string"
                },
                "type": "array"
              },
              "conventions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "country": {
                "type": "string"
              },
              "days": {
                "type": "integer"
              },
              "holidaysSkipped": {
                "items": {
                  "properties": {
                    "date": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "weekday": {
                      "enum": ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"],
                      "type": "string"
                    }
                  },
                  "required": ["date", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "region": {
                "type": "string"
              },
              "resultDate": {
                "type": "string"
              },
              "resultWeekday": {
                "enum": ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"],
                "type": "string"
              },
              "source": {
                "type": "string"
              },
              "startDate": {
                "type": "string"
              },
              "startIsBusinessDay": {
                "type": "boolean"
              },
              "weekend": {
                "items": {
                  "enum": ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["calendarDays", "conventions", "country", "days", "holidaysSkipped", "resultDate", "resultWeekday", "source", "startDate", "startIsBusinessDay"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
