        {
          "name": "count_business_days",
          "title": "Count working days, workdays and PTO",
          "description": "Use this when the user asks how many working days, business days, workdays, office days or PTO days there are between two dates, or for a statutory holiday count, for example \"how many working days between 14 July and 18 August in Germany?\", \"how many working days are left in December in Ontario?\" or \"does 16 days of leave cover 5 to 31 December?\". Pass the country code, the start and end dates as YYYY-MM-DD, and a region when the user names a state or province. Both dates are counted by default (includeStartDate and includeEndDate change that). Weekends are Saturday and Sunday unless weekendDays is set. Returns the number of business days, calendar days and weekend days, the public holidays that fell on working days, the holidays only some regions keep, and the conventions used. For exchange trading days pass calendars, such as [\"NYSE\"], [\"LSE\"], [\"JPX\"] or [\"TARGET2\"]. Do not use it for hours, time zones, or date differences that do not exclude weekends and holidays.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "calendars": {
                "description": "Holiday calendars to apply; a day is off when any of them closes it. \"public\" (the default) is the country's public holidays. NYSE is the New York Stock Exchange (also Nasdaq), FED the Federal Reserve and Fedwire (which DTC settlement follows), LSE the London Stock Exchange, JPX the Japan Exchange Group, TARGET2 the euro payment system. For a settlement date join the market and payment calendars, such as [\"NYSE\", \"FED\"] for a US T+1 settlement or [\"TARGET2\", \"FED\"] for EUR/USD spot. Optional.",
                "items": {
                  "enum": ["public", "NYSE", "FED", "LSE", "JPX", "TARGET2"],
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "country": {
                "description": "Two-letter ISO 3166-1 country code whose holidays apply, such as US, GB, DE, AU or VN.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "endDate": {
                "description": "Last date of the range, YYYY-MM-DD. Not before startDate.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "includeEndDate": {
                "description": "Count endDate when it is a working day. Default true.",
                "type": "boolean"
              },
              "includeStartDate": {
                "description": "Count startDate when it is a working day. Default true.",
                "type": "boolean"
              },
              "region": {
                "description": "State, province or nation within the country, as a subdivision code such as DE-BY or BY (Bavaria), GB-SCT (Scotland), US-CA or AU-NSW. Optional.",
                "pattern": "^[A-Za-z0-9]{1,3}(-[A-Za-z0-9]{1,3})?$",
                "type": "string"
              },
              "startDate": {
                "description": "First date of the range, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "weekendDays": {
                "description": "Days of the week that are not working days. Default: saturday and sunday. Use friday and saturday where that is the weekend.",
                "items": {
                  "enum": ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"],
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["country", "endDate", "startDate"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "businessDays": {
                "type": "integer"
              },
              "calendarDays": {
                "type": "integer"
              },
              "calendars": {
                "description": "The calendars applied, when the call named calendars",
                "items": {
                  "enum": ["public", "NYSE", "FED", "LSE", "JPX", "TARGET2"],
                  "type": "string"
                },
                "type": "array"
              },
              "conventions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "country": {
                "type": "string"
              },
              "endDate": {
                "type": "string"
              },
              "holidaysOnWorkdays": {
                "items": {
                  "properties": {
                    "date": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "weekday": {
                      "enum": ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"],
                      "type": "string"
                    }
                  },
                  "required": ["date", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "includesEndDate": {
                "type": "boolean"
              },
              "includesStartDate": {
                "type": "boolean"
              },
              "note": {
                "type": "string"
              },
              "region": {
                "type": "string"
              },
              "regionalHolidaysNotCounted": {
                "items": {
                  "properties": {
                    "date": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "regions": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "weekday": {
                      "enum": ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"],
                      "type": "string"
                    }
                  },
                  "required": ["date", "name", "regions"],
                  "type": "object"
                },
                "type": "array"
              },
              "regionalHolidaysNote": {
                "type": "string"
              },
              "source": {
                "type": "string"
              },
              "startDate": {
                "type": "string"
              },
              "weekend": {
                "items": {
                  "enum": ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"],
                  "type": "string"
                },
                "type": "array"
              },
              "weekendDays": {
                "type": "integer"
              }
            },
            "required": ["businessDays", "calendarDays", "conventions", "country", "endDate", "holidaysOnWorkdays", "source", "startDate", "weekendDays"],
            "type": "object"
          },
