                        },
                        {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        }
                      ]
                    },
                    "date": {
                      "type": "string"
                    },
                    "dayOff": {
                      "type": "boolean"
                    },
                    "localName": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "types": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "weekday": {
                      "enum": ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"],
                      "type": "string"
                    }
                  },
                  "required": ["appliesTo", "date", "dayOff", "name", "types"],
                  "type": "object"
                },
                "type": "array"
              },
              "region": {
                "type": "string"
              },
              "schoolHolidays": {
                "items": {
                  "properties": {
                    "appliesTo": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        }
                      ]
                    },
                    "endDate": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "startDate": {
                      "type": "string"
                    }
                  },
                  "required": ["appliesTo", "endDate", "name", "startDate"],
                  "type": "object"
                },
                "type": "array"
              },
              "source": {
