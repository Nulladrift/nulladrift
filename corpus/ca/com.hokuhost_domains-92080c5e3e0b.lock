      "serverInfo": {
        "name": "hokuhost-domains",
        "title": "HokuHost Domains",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Buy and manage domain names at www.hokuhost.com (USD, renewal costs the same). Flow: search_domains → sign_in(email), ask the user for the emailed code → sign_in(email, code) → account(owner details) if missing → create_order. Orders are paid with the owner's saved card if one is set (setup_card, once), else they return payment_url: show it to the user, then get_order(order_id, wait=25). Never ask for card numbers.",
      "tools": [
        {
          "name": "account",
          "description": "Get the account (owner details, saved card, limits). Pass fields to set the domain owner (registrant) details; needed before the first order.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "type": "string"
              },
              "company": {
                "type": "string"
              },
              "company_no": {
                "type": "string"
              },
              "country": {
                "description": "2-letter code, e.g. US",
                "type": "string"
              },
              "full_name": {
                "type": "string"
              },
              "kind": {
                "enum": ["individual", "company"],
                "type": "string"
              },
              "phone": {
                "description": "with country code, e.g. +1 408 555 0100",
                "type": "string"
              },
              "postal": {
                "type": "string"
              },
              "state": {
                "type": "string"
              },
              "street": {
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7daa81f155c383afbcc765fb59251e506a38832702b53f4a99cdc7d5f196f0f4"
        },
        {
          "name": "create_order",
          "description": "Register 1–10 available domains for the owner. Pays with the saved card (then waits for the registry) or returns payment_url for the owner.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domains": {
                "description": "e.g. [\"pixelstudio.com\"]",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "pay": {
                "description": "auto (default): saved card if possible, else payment_url. link: always payment_url",
                "enum": ["auto", "link"],
                "type": "string"
              },
              "wait": {
                "description": "Seconds to wait for payment/registration to finish (max 25)",
                "maximum": 25,
                "minimum": 0,
                "type": "integer"
              },
              "years": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["domains"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
