        {
          "name": "release_radar",
          "title": "Get Release Radar, the daily AI releases",
          "description": "Get Release Radar, the day's AI releases from their makers' own posts. Use it for \"what did AI labs ship today?\", \"give me today's Release Radar\" or \"what AI releases came out on 2026-10-21?\". Optional: date as YYYY-MM-DD (a GMT+7 day; default the newest issue). Returns the issue's headline, lede, page url and up to 6 items, each from its maker's own blog, changelog or release feed, with a 0 to 100 score, a one-line reason it was picked and a link per source; the days that have an issue; and rulesUrl, the page that explains the scoring. A new issue comes out every day at 07:00 GMT+7.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {}
            ],
            "properties": {
              "date": {
                "description": "The issue's day as YYYY-MM-DD (GMT+7). Default: the newest issue.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "asOf": {
                "description": "When the returned issue's window closed",
                "type": ["string", "null"]
              },
              "as_of": {
                "description": "ISO 8601 time the data was published by its source or fetched from it. A cached answer keeps the time of its fetch.",
                "type": "string"
              },
              "available": {
                "description": "Days with a published issue, newest first",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "brief": {
                "properties": {
                  "date": {
                    "type": "string"
                  },
                  "headline": {
                    "type": "string"
                  },
                  "lede": {
                    "type": "string"
                  },
                  "stories": {
                    "items": {
                      "properties": {
                        "heading": {
                          "type": "string"
                        },
                        "links": {
                          "items": {
                            "properties": {
                              "name": {
                                "type": "string"
                              },
                              "own": {
                                "description": "The company's own post",
                                "type": "boolean"
                              },
                              "url": {
                                "type": "string"
                              }
                            },
                            "required": ["name", "own", "url"],
                            "type": "object"
                          },
                          "type": "array"
                        },
                        "score": {
                          "description": "0 to 100, by the written rules at rulesUrl",
                          "type": "integer"
                        },
                        "sources": {
                          "description": "Sources that published the item; a company counts once however many of its own feeds carry it",
                          "type": "integer"
                        },
                        "text": {
                          "type": "string"
                        },
                        "why": {
                          "description": "Why the item was picked, from the rules that gave it points",
                          "type": "string"
                        }
                      },
                      "required": ["heading", "links", "score", "sources", "text", "why"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "url": {
                    "type": "string"
                  },
                  "window": {
                    "properties": {
                      "from": {
                        "type": "string"
                      },
                      "to": {
                        "type": "string"
                      }
                    },
                    "required": ["from", "to"],
                    "type": "object"
                  }
                },
                "required": ["date", "headline", "lede", "stories", "url", "window"],
                "type": ["object", "null"]
              },
              "note": {
                "type": "string"
              },
              "rulesUrl": {
