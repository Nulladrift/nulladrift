      },
      "instructions": "Industry Pulse: AI coding agent news. Use latest_events for what is new (hours defaults to 24), search_events when the user names a product, company or topic, and daily_digest for a day's overview (date is a UTC day, default the last finished day). Each event has a title, a short summary, a score from 0 to 10, a heat count (independent sources within 48 hours) and source links: link the sources when you cite an event and say when the data was read (asOf). Events scored by rules instead of the model say so in scoring. If note says the first collection is still running, tell the user to try again in a few minutes and do not invent news. Use product_feedback when the user asks what people complain about or praise for a product; the counts are from a sample of recent public posts, not a survey, so say that and read the sources list: a source with status unavailable or not_covered was not read. Never present these results as investment, hiring or legal advice. This server allows 60 tool calls a minute per network and 5,000 a day for all callers together; the day count resets at 00:00 UTC. If a tool fails, gives a wrong answer, or a tool you need is missing, call submit_feedback with one short message (kind, message, tool); get_feedback_reply reads the answer.",
      "tools": [
        {
          "name": "daily_digest",
          "title": "Get a day's AI coding agent digest",
          "description": "Get one UTC day's events with a short overview paragraph. Use it for \"give me yesterday's digest\" or \"what happened on 2026-10-20?\". Optional: date as YYYY-MM-DD (default: the last finished day; days are kept for 30 days), limit (default 10, at most 25). Returns the overview (null if it has not been written yet), the day's events ranked by score and heat with their sources, and asOf. The overview for a day is written after the day ends.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "niche": "ai-coding-agents"
              }
            ],
            "properties": {
              "date": {
                "description": "UTC day as YYYY-MM-DD. Default: the last finished day. Days are kept for 30 days.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "description": "Most events returned (default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "niche": {
                "description": "The topic area to read. Only \"ai-coding-agents\" (AI coding agents) exists today, and it is the default.",
                "enum": ["ai-coding-agents"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "asOf": {
                "description": "When the sources were last read completely",
                "type": ["string", "null"]
              },
              "as_of": {
                "description": "ISO 8601 time the data was published by its source or fetched from it. A cached answer keeps the time of its fetch.",
                "type": "string"
              },
              "date": {
                "type": "string"
              },
              "events": {
                "items": {
                  "properties": {
                    "category": {
                      "type": "string"
                    },
                    "firstReported": {
                      "type": "string"
                    },
                    "heat": {
                      "description": "Independent sources that reported the event within 48 hours of its first report",
                      "type": "integer"
                    },
                    "id": {
                      "type": "string"
                    },
                    "lastReported": {
                      "type": "string"
                    },
                    "score": {
                      "description": "0 to 10",
                      "type": "number"
                    },
                    "scoring": {
                      "enum": ["model", "rules"],
                      "type": "string"
                    },
                    "sources": {
                      "items": {
                        "properties": {
                          "name": {
                            "type": "string"
                          },
                          "publishedAt": {
                            "type": "string"
                          },
                          "url": {
                            "type": "string"
                          }
                        },
                        "required": ["name", "publishedAt", "url"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "summary": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["category", "firstReported", "heat", "id", "lastReported", "score", "scoring", "sources", "summary", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "niche": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "overview": {
                "type": ["string", "null"]
              },
              "source": {
                "description": "Who the data comes from, to cite and to check it against.",
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["name", "url"],
                "type": "object"
              },
              "total": {
                "description": "Matching events before the limit was applied",
                "type": "integer"
              },
              "untrusted_source": {
                "type": "boolean"
              }
            },
            "required": ["asOf", "as_of", "date", "events", "niche", "note", "overview", "source", "total", "untrusted_source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
