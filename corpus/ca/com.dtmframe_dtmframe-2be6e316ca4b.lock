      "serverInfo": {
        "name": "dtmframe",
        "title": "DTMFRAME",
        "version": "0.1.0",
        "description": "DTMFRAMEの読み取り専用の公開データ（製品・版・販売条件・セール）と、条件付きの購入経路計算。購入の実行はありません。",
        "websiteUrl": "https://dtmframe.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
