                "minLength": 1,
                "pattern": "^[a-z0-9][a-z0-9_-]{0,159}$",
                "type": "string"
              },
              "cursor": {
                "description": "Opaque next_cursor of the previous page (bound to one published snapshot).",
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
