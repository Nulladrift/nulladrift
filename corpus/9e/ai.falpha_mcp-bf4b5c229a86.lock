                "title": "Direction",
                "type": "string"
              },
              "horizon": {
                "default": "hp2m",
                "description": "Holding period the reading is for, in trading days: hp5d (5), hp15d (15), hp2m (42, about two calendar months).",
                "enum": ["hp5d", "hp15d", "hp2m"],
                "title": "Horizon",
                "type": "string"
              },
              "min_sharpe": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Minimum realized Sharpe ratio a name needs to be included.",
                "title": "Min Sharpe"
              },
              "rank_by": {
