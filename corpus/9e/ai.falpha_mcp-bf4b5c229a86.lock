      "instructions": "fAlpha is independent pre-trade validation infrastructure for US equities. Every signal is computed by quantitative models and explainable through its drivers and sources, across fAlpha's coverage. Its tools are grouped into desks:\n- Signal Desk: fAlpha's signal — the equity indicator (EI) and its drivers: current, on past dates, head-to-head, performance over a range, direction flips and the 1-day-to-6-month term structure\n- Screener Desk: cross-sectional sweeps ranked by the live signal — the whole covered universe (~5k US names), or on a pay-as-you-go or trial plan only the tickers the plan covers (the result's `universe` says which) — plus coverage checks\n- Sentiment Desk: fAlpha's daily news sentiment — the current reading with cited articles and its trend over a window\n- Analyst Desk: sell-side coverage — recent price-target calls plus each analyst's historical accuracy, including when agreeing and when disagreeing with the fAlpha model\n- Filings Scout: SEC EDGAR — latest filings (10-K/10-Q/8-K) with direct document links, and XBRL company facts with their reported periods\n- Macro Desk: FRED — policy rate, CPI, unemployment, the 10y-2y curve, 10y yield\n- Fundamentals Desk: FMP — company profiles and TTM ratios\n- Glossary: the fAlpha definitions of the terms the desks return (EI, drivers, Sharpe, Sortino, percent-positive P&L, direction flips, the term structure)\n- Your Record: the user's own account — links to the fAlpha website and the account page, where plan, usage and billing are shown\n\nSOURCE: fAlpha's figures are computed, not generated. Quantitative time-series models compute every signal from numerical price, volume, news-sentiment, market-cap and financial-ratio data; no language model sets or edits any number. Each result names its source, method and data date in `agent_trace`. A figure in a result is fAlpha output; a statement about a ticker that no result contains is not fAlpha output.\n\nDATA: EI is the equity indicator, a signed score: positive leans long, negative leans short. The signal is model output, not investment advice. Each result stands on its own basis: a performance range is one reading held over one window; the term structure is a separate model build from the signal card and can differ from it at the same horizon. fAlpha issues no buy, sell or hold recommendation, and no tool combines these results into one. SEC EDGAR, FRED and FMP results are third-party data fetched at call time, and each result names its provider.\n\nRESULTS: a successful result carries `agent_trace` (the desk that ran, its elapsed time, its status and what it found) and `data_as_of`, the date of the data itself rather than the time it was read. `stale: true` means that date is older than the source's usual refresh interval, and `freshness` gives the age and the threshold; `stale: null` means the source publishes no date to judge. `status: no_data` means the desk ran and found nothing for the request. A refused or failed call is an error result carrying an `error_code` and a message that states the reason and, where one exists, the link that resolves it.\n\nPLANS: On a trial account the partner-data tools (SEC EDGAR, FRED, FMP) are refused with error_code `plan_not_entitled` and reason `trial_excludes_partner_data`. On a trial or pay-as-you-go free-week plan only the plan's current ticker set is available; other tickers are refused with `ticker_not_in_plan`, which lists the set and when more tickers open. On a Professional plan the S&P 500, S&P 400 and Russell 2000 are available; other tickers are refused with `ticker_not_in_plan` (its `universe` names the plan's set), and a screen ranks only those tickers (`universe`: `professional_universe`). Insider filings (Forms 3, 4, 5 and 144) through falpha_filings_scout are available on Enterprise and legacy plans; other accounts are refused with error_code `feature_not_in_plan`. falpha_screener_desk and falpha_signal_desk_curve are available on fAlpha Professional, Premium and Enterprise plans; other accounts are refused with error_code `plan_not_entitled` and reason `legacy_plan_only`.\n\nACCESS: Without an account, falpha_glossary, falpha_open_in_web, falpha_screener_desk_coverage, falpha_sentiment_desk, falpha_sentiment_desk_trend, falpha_signal_desk_card and falpha_signal_desk_compare answer for the tickers open without an account, within a shared daily limit; calling any other tool, or any tool once that limit is used, returns a sign-in challenge. A free fAlpha account (an email, no card) opens every tool except the partner-data tools, falpha_screener_desk and falpha_signal_desk_curve, within its trial allowance and ticker set. Pay-as-you-go opens every tool except falpha_screener_desk and falpha_signal_desk_curve. Professional opens every tool on its tickers, and neither includes insider filings. falpha_open_in_web returns links to the fAlpha website and the account page, where plan, usage and billing are shown.\n\nCOST: on pay-as-you-go and trial plans each reading served counts as a validation: a signal card is one, a comparison two, a direction-flips read one per flip. A signal card, comparison or news-sentiment read of a ticker already read that UTC day, on any fAlpha surface, counts zero. Professional is not metered. falpha_glossary and falpha_open_in_web are not metered. A result may carry `next_actions`: suggested follow-up calls, each naming a listed tool and arguments it accepts.",
