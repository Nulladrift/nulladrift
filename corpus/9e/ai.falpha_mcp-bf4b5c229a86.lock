        {
          "name": "falpha_signal_desk_card",
          "title": "Signal card",
          "description": "[Signal Desk] fAlpha's current model reading on one ticker, computed by quantitative models from numerical market data (no language model sets the number): the equity indicator (EI, signed: positive leans long, negative leans short) and the driver carrying the reading for the requested horizon and regime, the direction and EI at all three horizons for that regime (`horizons`), and the date the signal is for. The card view's Horizon and Regime controls switch the reading in place. For questions like 'what does the model say about NVDA'. Available without an account.",
          "inputSchema": {
            "properties": {
              "horizon": {
                "default": "hp2m",
                "description": "Holding period the reading is for, in trading days: hp5d (5), hp15d (15), hp2m (42, about two calendar months).",
                "enum": ["hp5d", "hp15d", "hp2m"],
                "title": "Horizon",
                "type": "string"
              },
              "regime": {
                "default": "neutral",
                "description": "Market backdrop the model conditions on: neutral (no market view), bull or bear.",
                "enum": ["neutral", "bull", "bear"],
                "title": "Regime",
                "type": "string"
              },
              "ticker": {
                "description": "US-listed equity symbol in fAlpha's covered universe, e.g. NVDA. falpha_screener_desk_coverage reports whether a symbol is covered.",
                "title": "Ticker",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "title": "falpha_signal_desk_cardArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "falpha_signal_desk_cardDictOutput",
