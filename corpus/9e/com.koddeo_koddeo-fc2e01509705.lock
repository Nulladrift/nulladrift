    "com.koddeo/koddeo": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://koddeo.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "koddeo",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Koddeo is a community marketplace for referral codes. Use search_companies then get_company_codes to find codes. With the user's API key you can publish, refresh and boost their codes, or start a Premium subscription. Payments always return a Stripe link the user must open themselves.",
      "tools": [
        {
          "name": "boost_code",
          "title": "Boost codes",
          "description": "Create a Stripe checkout to pin one or several of the user's codes (up to 12) to the top of their brand pages. Price per code depends on the brand category: standard 48h €0.79 / 1 week €1.49 / 3 weeks €2.99; telecom, energy, VPN, SaaS and insurance €0.99 / €1.79 / €3.49; finance and betting €1.19 / €2.29 / €3.99. Boosting several codes at once is discounted: 2 codes -10%, 3 codes -15%, 4 codes -20%, 5+ codes -30%. Returns a payment link the user must open to pay; the Boosts start as soon as payment succeeds.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "code_id": {
                "description": "Single code id (same as code_ids with one item)",
                "minLength": 1,
                "type": "string"
              },
              "code_ids": {
                "description": "Code ids from list_my_codes; several codes get a volume discount",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "duration": {
                "default": "WEEK_1",
                "enum": ["HOURS_48", "WEEK_1", "WEEKS_3"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7d127a38ea3ecbdf0184c2ec238078144eb0aaffd2f5579c5acb7443c19dd177"
        },
        {
          "name": "get_company_codes",
          "title": "Get a company's referral codes",
          "description": "List the active community referral codes for one brand, in the same order as on its Koddeo page (boosted and Premium codes first).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 5,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "Company slug from search_companies, e.g. 'revolut'",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://koddeo/codes-v1.html",
            "ui": {
              "resourceUri": "ui://koddeo/codes-v1.html"
            }
          },
          "digest": "sha256:69b85a6c0fcb71f77cbe6e271d0e9e4a9bb10e41730548260b8956c3791bc8a2"
        },
        {
          "name": "get_my_account",
          "title": "Get my Koddeo account",
          "description": "The connected user's plan, daily refresh quota and number of published codes.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
