            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dbe43b26e7f317b7330ddcf67f88175d1b612108d4ddd923392badafae33cdd0"
        },
        {
          "name": "list_my_codes",
          "title": "List my codes",
          "description": "The connected user's referral codes with views, clicks and Boost status.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://koddeo/codes-v1.html",
            "ui": {
              "resourceUri": "ui://koddeo/codes-v1.html"
            }
          },
          "digest": "sha256:e6210cb769b03172bbd0814c25fb6701ff4515b7dc0811a33b633f3ba352b7bc"
        },
        {
          "name": "publish_code",
          "title": "Publish a referral code",
          "description": "Publish one of the user's referral codes on a brand page. One code per brand per user. Provide a code, a referral link, or both.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "code": {
                "description": "The referral code itself",
                "maxLength": 100,
                "type": "string"
              },
              "company_slug": {
                "description": "Company slug from search_companies",
                "minLength": 1,
                "type": "string"
              },
              "description": {
                "description": "Conditions, how to use it",
                "maxLength": 1000,
                "type": "string"
              },
              "link": {
                "description": "The referral link",
                "format": "uri",
                "type": "string"
              },
              "title": {
                "description": "Short pitch, e.g. '€20 bonus on your first deposit'",
                "maxLength": 120,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["company_slug", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:40c56bd212ac048e96c2774bc7c046b41fb7d71b9df92d5d60950774f43829cc"
        },
        {
          "name": "refresh_all_codes",
          "title": "Refresh all my codes",
          "description": "Bump every active code of the user at once. Free accounts get 1 per day (Paris time); Premium is unlimited.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:44fe89f011f0befc3a4ff06afdd49668999e0836cfd11297a26811e63007900b"
        },
        {
          "name": "refresh_code",
          "title": "Refresh a code",
          "description": "Bump one of the user's codes back up its brand page ranking.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "code_id": {
                "description": "Code id from list_my_codes",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["code_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:2b5413b8c46614e4be4cedd0c7f3c0b561b301a73207373becaf1ef6f462142d"
        },
        {
          "name": "search_companies",
          "title": "Search companies",
          "description": "Search the brands listed on Koddeo (banks, crypto, delivery, VPN, e-commerce...) that have community referral codes. Returns each brand's slug, to use with get_company_codes or publish_code.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Brand name or keyword, e.g. 'revolut' or 'vpn'",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6d087918b67e311f6ce9026cbdd6d8b267141536bd86501a70bb573571f0b002"
        },
        {
          "name": "subscribe_premium",
          "title": "Subscribe to Premium",
          "description": "Create a Stripe checkout for Koddeo Premium (auto-refresh: the user's codes move back up whenever another code of the same brand is refreshed, published or boosted; Premium badge): €9.99/month or €95.88/year. Returns a link the user must open to pay. If already subscribed, returns the billing portal.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "plan": {
                "default": "YEARLY",
                "enum": ["MONTHLY", "YEARLY"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
