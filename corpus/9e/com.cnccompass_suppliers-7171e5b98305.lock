        {
          "name": "list_facets",
          "title": "List CNC Compass search filters",
          "description": "List the values search_suppliers can filter on, with how many published suppliers declare each.\n\n        Fields are process, material, finish, and location; pass `field` for one of them. Each value has\n        a stable `key`, a display `label`, a `records` count, and `implies` (broader keys a narrower one\n        also matches, such as aluminum-6061 implying aluminum). Pass a label or key as the matching\n        optional argument of search_suppliers. Locations are the city and province words that at least\n        three supplier addresses share, most common first; `omitted_values` counts the rarer ones, which\n        search_suppliers still matches. `index_records` is the number of published suppliers.\n        ",
          "inputSchema": {
            "properties": {
              "field": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
