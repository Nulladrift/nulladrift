        {
          "name": "search_suppliers",
          "title": "Search CNC Compass suppliers",
          "description": "Search published CNC Compass supplier records with a natural-language sourcing brief.\n\n        Returns the normalized brief, the fields the brief did not state, matched suppliers with\n        match reasons and source evidence, the filters applied with record counts, and paging\n        fields (offset, limit, has_more). A brief with no recognisable process, material, finish,\n        certification, or location returns no records and a follow-up question instead of the whole\n        index. A stated certification (ISO 9001, IATF 16949, ISO 13485, AS9100, ISO 14001, ISO 45001,\n        RoHS) returns only suppliers whose listing shows it. `query` is 3 to 5000 characters, `limit`\n        1 to 20, `offset` 0 to 1000. When you already know the buyer's material, process, finish,\n        certification, or location, pass them as the optional fields: each overrides the parsed value\n        (for example material=\"aluminum 6061\", process=\"CNC turning\", finish=\"anodizing\",\n        certification=\"IATF 16949\", location=\"Dongguan\"); a value the index cannot match is ignored\n        and listed in `retrieval.ignored_fields`.\n        ",
