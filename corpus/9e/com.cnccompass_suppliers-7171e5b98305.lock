      "instructions": "CNC Compass indexes published CNC machining supplier records with source evidence. Call search_suppliers with a natural-language sourcing brief (material, process, finish, tolerance, quantity, location), optionally with the fields you already know as structured arguments. The result reports the normalized brief, the requirements no record could confirm, matched suppliers with reasons, and the filters applied. Page with offset. Call get_supplier with a result's slug for the full record: capabilities, certificates, products, facilities, news, the pages it was read from, and field-level evidence. Call list_facets for the process, material, finish, and location values the index can filter on, with supplier counts. Records are marketplace and supplier-website research: verification_status and last_verified_at say whether a person has checked one, so cite source URLs rather than presenting claims as verified.",
      "tools": [
        {
          "name": "get_supplier",
          "title": "Get a CNC Compass supplier record",
          "description": "Return one published supplier record in full, by the `slug` from search_suppliers results.\n\n        Includes identity (legal name, Chinese registered name when a registry lookup confirmed it, location, business type, founded year, employee range), the\n        official website or source listing, the Made-in-China.com inquiry form when there is one,\n        capabilities (processes, materials, certifications, equipment, industries, tolerance, maximum\n        part size) and the facet keys search_suppliers matches, certificates, product families,\n        facilities and news items with their own source pages, the listings the record was read from\n        with permission basis and check date, and field-level evidence (the quote, page, extraction\n        method, and review status behind each claim). `buyer_facts.checked` lists what CNC Compass confirmed (registry review,\n        source factory, certificates on China's national register, a named third-party audit);\n        `buyer_facts.profile` is what the supplier publishes about itself (tolerance, inspection, lead time,\n        MOQ, Incoterms, payment terms, ...), each item with its quote and source page: present it as the\n        supplier's statement, to be confirmed at quotation. `verification_status`, `factory_verification`\n        (\"Verified source factory\" or empty) and `last_verified_at` report editorial review.\n        An unknown slug is a tool error.\n        ",
