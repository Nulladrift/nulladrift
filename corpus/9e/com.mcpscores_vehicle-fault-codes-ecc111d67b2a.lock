{
  "lockfileVersion": 2,
  "subjects": {
    "com.mcpscores/vehicle-fault-codes": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcpfax-diag.bowling-anthony.workers.dev/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.mcpscores/vehicle-fault-codes",
        "title": "MCPFax Vehicle Diagnostics",
        "version": "1.1.2",
        "websiteUrl": "https://mcpscores.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "You have a fault code, a VIN, or a car that may be recalled, and you must not guess what any of them mean. Tool calls are x402-paid in USDC on Base — send the base64 X-PAYMENT header on this POST /mcp request (or params._meta['x402/payment']). dtc_lookup costs $0.006; vehicle_recalls, vehicle_tsbs and vin_decode cost $0.005 each. An unpaid call returns a PaymentRequired result carrying the x402 accepts challenge and settles nothing; initialize, ping and tools/list are free, and a call missing a required argument is refused before payment is ever requested. We never guess a code meaning: an unknown DTC returns not_found rather than an invented definition.",
      "tools": [
        {
          "name": "dtc_lookup",
          "title": "Vehicle fault code (DTC) lookup",
          "description": "Look up what a vehicle fault code (OBD-II diagnostic trouble code) means. Returns a reworded definition compiled from open/public sources (with the source and licence per row) plus which makes define the code specifically. Pass 'make' for the make-specific meaning instead of the generic SAE one — the same code can mean different things on different brands. Use this when a scan tool reported a code like P0301, B1318 or U0100; we never guess a meaning (unknown codes return not_found). Descriptions are compilations, not manufacturer verbatim strings, and severity is not guaranteed. Costs $0.006 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "The fault code exactly as reported, e.g. 'P0301', 'B1318', 'C1201', 'U0100'.",
                "examples": ["P0301"],
                "type": "string"
              },
              "make": {
                "description": "Vehicle make for the manufacturer-specific definition, e.g. 'BMW', 'Ford', 'Toyota'. Optional; omit for the generic SAE meaning.",
                "examples": ["BMW"],
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1eb58cc40f9ff48e16c2eb43381538a3a679953f76a34f779f85a88a71880e04"
        },
        {
          "name": "vehicle_recalls",
          "title": "NHTSA safety recalls",
          "description": "Official NHTSA safety recalls for a vehicle. Returns campaign id, affected component, the safety consequence, and the free remedy, newest first (max 50). Query by make (optionally model and year) or by a known campaign id. Use this before buying a used vehicle or when a customer asks whether their car has open recalls. A zero count means nothing matched the ingested NHTSA subset — it does not prove the vehicle is recall-free. Costs $0.005 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "campaign": {
                "description": "NHTSA campaign id to fetch directly, e.g. '21V123000'. Optional.",
                "examples": ["21V123000"],
                "type": "string"
              },
              "make": {
                "description": "Consumer make name, e.g. 'FORD', 'TOYOTA'. Required unless 'campaign' is given.",
                "examples": ["FORD"],
                "type": "string"
              },
              "model": {
                "description": "Model name, e.g. 'F-150', 'CAMRY'. Optional.",
                "examples": ["F-150"],
                "type": "string"
              },
              "year": {
                "description": "Four-digit model year, e.g. '2018'. Optional.",
                "examples": ["2018"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:25623ddbf5fafa002d28bbef1dc706059578f212ef7194a6f5fb02333186f30f"
        },
        {
          "name": "vehicle_tsbs",
          "title": "NHTSA technical service bulletins",
          "description": "NHTSA Technical Service Bulletins (manufacturer repair guidance for known defects that are not safety recalls). Returns bulletin id, summary, and the fault codes each bulletin names (max 50). Query by make/model/year, or by fault code to find bulletins that address that specific code. Use this after dtc_lookup when you want the manufacturer's documented fix. A zero count means nothing matched the ingested subset. Costs $0.005 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "Fault code to match against the bulletin's listed codes, e.g. 'P0301'. Optional.",
                "examples": ["P0301"],
                "type": "string"
              },
              "make": {
                "description": "Consumer make name, e.g. 'TOYOTA'. Required unless 'code' is given.",
                "examples": ["TOYOTA"],
                "type": "string"
              },
              "model": {
                "description": "Model name, e.g. 'CAMRY'. Optional.",
                "examples": ["CAMRY"],
                "type": "string"
              },
              "year": {
                "description": "Four-digit model year, e.g. '2019'. Optional.",
                "examples": ["2019"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0426e749e83871871667696bc44a26502d88da33d515dcb1041f2dfbe9c9d812"
        },
        {
          "name": "vin_decode",
          "title": "VIN decode",
          "description": "Decode a Vehicle Identification Number into make, model, model year, body class, engine and plant country using NHTSA's public vPIC database. Use this when you have a VIN and need the exact vehicle before looking up recalls or bulletins. Costs $0.005 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "vin": {
                "description": "The VIN, 11-17 characters, e.g. '1HGCM82633A004352'.",
                "examples": ["1HGCM82633A004352"],
                "maxLength": 17,
                "minLength": 11,
                "type": "string"
              }
            },
            "required": ["vin"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6f7c8ff762d6058f82ae8aa280056a025dd16b4cb800315da7e5f34401c9f9fe"
        }
      ],
      "digest": "sha256:746854fcea4cffcc08bf90d1b5583738c3856b0311a7684a80cc2ec9b1531b6d"
    }
  }
}
