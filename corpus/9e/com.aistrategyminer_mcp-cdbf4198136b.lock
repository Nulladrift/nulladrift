                "type": "number"
              },
              "sl_max_pips": {
                "description": "Advanced: largest stop loss in pips, whole number 5-300; XAUUSD 200-10000 (at least sl_min_pips)",
                "type": "number"
              },
              "sl_min_pips": {
                "description": "Advanced: smallest stop loss in pips, whole number 5-300; XAUUSD 200-10000",
                "type": "number"
              },
              "sl_slippage_pips": {
                "description": "Stop-loss slippage in pips, 0-100",
                "type": "number"
              },
              "spread_pips": {
                "description": "Realistic costs: spread in pips, 0-50 (0-500 for XAUUSD, whose default is 60)",
                "type": "number"
              },
              "swap_long": {
                "description": "Realistic costs: swap for buys per lot per night, -1000 to 1000 (unit: swap_unit)",
                "type": "number"
              },
              "swap_short": {
                "description": "Realistic costs: swap for sells per lot per night, -1000 to 1000",
                "type": "number"
              },
              "swap_unit": {
                "description": "points or money (USD)",
                "type": "string"
              },
              "symbol": {
                "description": "e.g. USDJPY (EURUSD USDJPY AUDUSD USDCAD NZDUSD USDCHF EURGBP GBPUSD; add-on symbols AUDCAD AUDCHF AUDJPY AUDNZD CADCHF CADJPY CHFJPY EURAUD EURCAD EURCHF EURJPY GBPAUD GBPCAD GBPCHF GBPJPY GBPNZD NZDJPY XAUUSD (gold) XAGUSD (silver; 1 lot = 5000 oz, 1 pip = $0.01) USA500IDXUSD (S&P 500 index; 1 lot = 1 index unit, 1 pip = 1 point; data from 2019, no 8/10 years) USATECHIDXUSD (Nasdaq 100) USA30IDXUSD (Dow) DEUIDXEUR (DAX) GBRIDXGBP (FTSE 100) JPNIDXJPY (Nikkei 225; same index definition) LIGHTCMDUSD (WTI crude oil; 1 lot = 1000 barrels assumed, 1 pip = $0.01) BRENTCMDUSD (Brent crude oil; same definition) need a one-time price-data download in the generator)",
                "type": "string"
              },
              "target": {
                "description": "mql5, mql4, pine, ctrader or python",
                "type": "string"
              },
              "timeframe": {
                "description": "H1, H4, D1, M15 or M30 (M15 and M30 use up to 5 years)",
                "type": "string"
              },
              "tp_max_pips": {
                "description": "Advanced: largest take profit in pips, whole number 5-400; XAUUSD 200-10000 (at least tp_min_pips)",
                "type": "number"
              },
              "tp_min_pips": {
                "description": "Advanced: smallest take profit in pips, whole number 5-400; XAUUSD 200-10000",
                "type": "number"
              },
              "trials": {
                "description": "Trial limit: 1000, 2000, 5000, 10000, 20000, 50000, 100000 or 200000",
                "type": "number"
              },
              "triple_swap_day": {
                "description": "Triple-swap weekday, 1 (Mon) to 5 (Fri); the generator default is 3 (Wed)",
                "type": "number"
              },
              "years": {
                "description": "Test period in years: 2-5, or 8 or 10 (long period, Pro only; others get the fixed trial-run period)",
                "type": "number"
