              "parts_more": {
                "description": "Advanced: parts to pick more often (naming one that is off by default turns it on)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "parts_only": {
                "description": "Advanced: the only indicator parts the search may use (all others are off). Names: ma, rsi, bb, macd, stoch, donch, atr, stddev, wpr, cci, mom, roc, dpo, trix, dem, adx, adxw, rvi, ult, osma, ao, ac, bears, bulls, sar, ha, dema, tema, hma, env, kc, ama, frama, vidya, cons, perf, ichi, alli, gat, ohlc, st, qqe, vldmi, orb, obv, vol, ad, bwmfi, mfi, force, chaikin, vwap. The 46 parts after donch are off by default and slow the search",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
