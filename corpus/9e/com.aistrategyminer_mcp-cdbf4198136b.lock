                "description": "Advanced: largest indicator period, whole number 2-400 (at least period_min)",
                "type": "number"
              },
              "period_min": {
                "description": "Advanced: smallest indicator period, whole number 2-400",
                "type": "number"
              },
              "period_step": {
                "description": "Advanced: period step, whole number 1-400",
                "type": "number"
              },
              "rollover_hour": {
                "description": "Day change hour in server time, 0-23",
                "type": "number"
              },
              "seed": {
