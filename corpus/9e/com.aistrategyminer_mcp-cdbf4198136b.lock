      "instructions": "AIStrategyMiner Strategy Builder: design trading strategies (Expert Advisors) as a node flow, then open them in the visual Strategy Builder at aistrategyminer.com. Workflow: (1) list_templates and get_template to see real, working flows; (2) list_node_vocabulary for node types and their parameters; (3) compose a flow in the same shape as get_template returns; (4) validate_flow and fix every error; (5) create_builder_link and give the user the link. To start from a search instead of a design, open_strategy_miner returns a link that opens the Strategy Miner with the user's conditions filled in; it never runs the generator itself (the user runs it in the browser; anyone can mine a trial run at a smaller fixed size, while the full settings, the candidates' conditions, Open in Builder and the results hand-off are Pro). get_miner_results and the Hand to AI button are Pro only; a trial run has no Hand to AI button, so do not ask a user who is not on Pro for a result id. The user backtests the EA and downloads its source (Pro) inside the Strategy Builder, then compiles it in MetaEditor. This server never returns MQL5 source or compiled files. Flows are strategy designs, not trading advice. Do not describe results as profitable or guaranteed; tell the user to backtest before any live use.",
