        {
          "name": "impacted_as_planned",
          "description": "Impacted As-Planned (IAP) on an unprogressed as-planned\n            baseline. Implements AACE RP 29R-03 MIP 3.6 (Modeled /\n            Additive / Single Base) and SCL Protocol 2nd ed. §11.6(a).\n            Two modes.\n\n            **screen** (default): inserts each delay fragnet into the\n            as-planned baseline, first one at a time and then all together,\n            re-runs CPM, and reads the joint impact against verdict bands\n            (NO SIGNAL, LOW SIGNAL, MODERATE SIGNAL, STRONG SIGNAL, or\n            INDETERMINATE when the joint pass fails). Use it as a quick read\n            on whether a delay claim has legs before a fuller analysis. The\n            sum of the one-at-a-time impacts is reported beside the joint\n            impact; ``overstatement_days`` is the difference, from fragnets\n            that share a path. Check each ``per_fragnet[].status`` before\n            quoting a figure: a fragnet that failed on its own carries\n            ``status`` \"error\" and its ``error``, and is left out of the\n            one-at-a-time sum. The joint pass inserts every fragnet\n            together, so read ``joint.status`` and the \"iap-joint\" warnings\n            too: with a bad fragnet the joint pass can fail (verdict\n            INDETERMINATE) or run without the ties it could not insert.\n\n            **rebut**: tests an opposing expert's IAP submission. Supply at\n            least one of: ``opposing_impacted_xer_path`` or\n            ``opposing_impacted_xer_content`` (tier A: re-runs their\n            impacted schedule and diffs it against the baseline),\n            ``opposing[\"fragnets\"]`` (tier B: re-models their fragnets on\n            the baseline), or ``opposing[\"claimed_impact_days\"]`` (tier C:\n            their stated figure).\n\n            IAP does not look at what actually happened on site: it\n            measures the planned logic plus the inserted delays. The result\n            carries ``iap_method_caveat`` saying so, and a ``precondition``\n            block that flags a baseline carrying progress (not a pure\n            as-planned schedule). Every activity is laid out on one uniform\n            timeline with no weekends or holidays, each timeline day being\n            one working day of that activity's own calendar. Where every\n            unfinished activity is on one calendar, each impact is exact in\n            working days on it, apart from constraint dates and any stretch\n            before the data date, which the run places on the project's\n            default calendar. With more than one calendar, paths on\n            different calendars change length against each other on that\n            timeline, so float, the driving path and the impact can differ\n            from a calendar-aware run, and the impact is a mix of those\n            calendars' working days; the result lists the calendars\n            (``calendars_in_use``, and ``opposing_calendars_in_use`` for a\n            tier A file) and warns when there is more than one. The absolute\n            dates the run shows are not P6 calendar dates (``date_basis``):\n            quote the day counts, not the dates. For an impact measured on each event's own\n            contemporaneous baseline use ``time_impact_analysis_fragnet``\n            (MIP 3.7); for retrospective windows use\n            ``forensic_windows_analysis`` (MIP 3.3); for a subtractive\n            but-for use ``collapsed_as_built`` (MIP 3.8).\n\n            Args:\n                baseline_xer_path:    server-side as-planned baseline XER.\n                baseline_xer_content: full text of the as-planned baseline\n                                      XER (alternative for hosted/remote use).\n                                      Supply EXACTLY ONE of path/content.\n                fragnets: SCREEN (required): list of fragnet dicts, each\n                    with ``id``, ``name``, ``liability`` (responsible\n                    party), ``activities`` (list of {code, name,\n                    duration_days}; duration_days in working days) and\n                    ``ties`` (list of {from_code, to_code, type, lag_days};\n                    pred/succ are accepted aliases for from_code/to_code;\n                    type is FS, SS, FF or SF in any case, with or without\n                    P6's PR_ prefix; a missing type is FS and any other\n                    type is refused).\n                mode: \"screen\" (default) or \"rebut\" (case does not matter).\n                opposing: REBUT: dict of the opposing material, with any of\n                    ``fragnets`` (same shape as above),\n                    ``claimed_impact_days`` (number), ``claimed_finish``\n                    (YYYY-MM-DD), ``proj_id``, ``expert_name``,\n                    ``report_ref``. Other keys are refused. Pass the\n                    opposing impacted schedule through the two arguments\n                    below, not in this dict.\n                opposing_impacted_xer_path:    REBUT tier A: server-side\n                                               opposing impacted XER.\n                opposing_impacted_xer_content: REBUT tier A: full text of\n                                               the opposing impacted XER.\n                                               Supply at most ONE of this\n                                               path/content pair.\n                own_results: REBUT, optional: your own results from the\n                    primary methods in working days, {windows_days,\n                    tia_days, collapsed_days}, read beside the opposing\n                    figure.\n                proj_id: optional project selector inside a multi-project\n                    baseline XER.\n                screen_bands: SCREEN, optional: verdict band overrides,\n                    {low_pct, strong_pct, wd_floor_moderate}. Defaults\n                    2.0, 5.0 and 20; low_pct must stay below strong_pct.\n                baseline_name / opposing_name: optional file names to\n                    print in the report for XERs sent as content (a\n                    content upload has no file name of its own).\n                preparer / company: optional, printed on the report and\n                    dashboard as who prepared the analysis. Both are blank\n                    unless supplied.\n                output_dir: output dir for the HTML dashboard, TXT report\n                    and CSVs (tempdir if \"\").\n                project_name: optional override.\n\n            Limits for hosted use: 500 fragnets on each side, and 5,000\n            inserted activities and 20,000 ties across all of them.\n\n            Returns:\n                {\n                  \"mode\": \"screen\" | \"rebut\",\n                  \"method\": \"Impacted As-Planned — AACE 29R-03 §3.6 / MIP 3.6 ...\",\n                  \"baseline\": {project_finish, plan_start,\n                               baseline_duration_wd, critical_count, ...},\n                  \"precondition\": {progressed_count, total_count,\n                                   pure_as_planned},\n                  \"per_fragnet\": [{fragnet_id, status, error,\n                                   impact_days, impact_working_days, ...}],  # SCREEN\n                  \"joint\": {status, impact_days, impact_working_days, ...},  # SCREEN\n                  \"sum_isolated_days\": int,           # SCREEN\n                  \"sum_isolated_working_days\": int,   # SCREEN\n                  \"overstatement_days\": int,          # SCREEN: sum minus joint\n                  \"screen_verdict\": {band, pct, joint_wd, bands_used, basis},  # SCREEN\n                  \"rebut\": {...},         # REBUT: tiers A/B/C and findings\n                  \"critique\": {...},\n                  \"iap_method_caveat\": str,\n                  \"date_basis\": str,\n                  \"day_unit_basis\": str,  # what every day count counts\n                  \"calendars_in_use\": [str] | None,  # None: could not be read\n                  \"opposing_calendars_in_use\": [str] | None,  # REBUT tier A\n                  \"output_files\": {report, events_csv, dashboard, ...},\n                  \"warnings\": [...],\n                  \"baseline_sha256\": str, \"baseline_sha256_basis\": str,\n                  \"opposing_impacted_sha256\": str,        # REBUT tier A\n                  \"opposing_impacted_sha256_basis\": str,  # REBUT tier A\n                }\n            ",
          "inputSchema": {
            "properties": {
              "baseline_name": {
                "default": "",
                "title": "Baseline Name",
