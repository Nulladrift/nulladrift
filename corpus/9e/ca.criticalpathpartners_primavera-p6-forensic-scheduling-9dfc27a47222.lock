        {
          "name": "collapsed_as_built",
          "description": "Collapsed As-Built / But-For analysis on a post-impact XER.\n\n            Implements AACE RP 29R-03 §3.8 Modeled / Subtractive / Single\n            Simulation method (paired with MIP 3.3 Windows for the dual-method\n            gap report per SCL §11.5). Validates a forensic windows\n            analysis (MIP 3.3) by independently computing the same\n            project drift via subtractive removal of delays from the\n            as-built schedule.\n\n            For each delay event, the as-built duration of every\n            ``affected_activity`` is shortened by ``impact_days`` working\n            days on that activity's calendar (or removed entirely if\n            ``removal_method=\"remove\"``), then CPM re-runs and the\n            resulting \"but-for\" finish date is compared to the as-built\n            finish. Cumulative pass removes ALL events at once for a\n            project-level but-for finish. Every finish shift is stated in\n            working days on ``workday_calendar``; the calendar-day span of\n            the same shift is kept beside it, and ``day_unit_basis`` names\n            the unit of every bare ``*_days`` key in the result.\n\n            Use this tool when opposing counsel demands a but-for analysis\n            or you need a dual-method validation pairing §3.3 (windows) with\n            §3.8 (collapsed-as-built). For prospective fragnet insertion\n            (MIP 3.7), use ``time_impact_analysis_fragnet`` instead.\n\n            Args:\n                as_built_xer_path:    server-side post-impact XER (after delays incurred).\n                as_built_xer_content: full text of post-impact XER (alternative for hosted/remote use).\n                                      Supply EXACTLY ONE of path/content.\n                delay_events: list of event dicts. Each must have\n                    ``event_id``, ``affected_activities`` (list of\n                    task_codes), and ``impact_days`` (number of working\n                    days on the affected activity's calendar). Optional:\n                    ``removal_method`` ('shorten'|'remove'),\n                    ``responsible_party``, ``name``, ``description``.\n                output_dir: optional output dir for HTML/CSV (tempdir if \"\").\n                project_name: optional override.\n                removal_method: global default 'shorten' or 'remove'.\n                contractor_filter: when True, exclude contractor-caused\n                    events from the cumulative pass (owner audit mode).\n                preparer / company: optional, printed on the dashboard and\n                    narrative as who prepared the analysis. Both are blank\n                    unless supplied.\n\n            Returns:\n                {\n                  \"as_built_finish\": \"YYYY-MM-DD\",\n                  \"per_event_results\": [{event_id, but_for_finish,\n                                          impact_workdays_collapsed,\n                                          collapse_state,\n                                          duration_removal_basis,\n                                          finish_driver_after_removal, ...}, ...],\n                  # impact_workdays_collapsed is the event's finish shift in\n                  # working days on workday_calendar. Each event also carries\n                  # impact_days_collapsed: the same shift in calendar days.\n                  # duration_removal_basis discloses WHAT duration was removed\n                  # and on what basis; finish_driver_after_removal discloses\n                  # WHAT drives the but-for finish (incl. whether it is bound by\n                  # the data-date floor) so a reader sees WHY the finish did or\n                  # did not move across data dates.\n                  \"cumulative_but_for_finish\": \"YYYY-MM-DD\",\n                  \"cumulative_impact_workdays\": int,  # working days on workday_calendar\n                  \"cumulative_impact_days\": int,  # the same shift in calendar days\n                  \"cumulative_collapse_state\": str,  # a 'locked_by_actuals' zero is not \"no impact\"\n                  \"workday_calendar\": str,  # the calendar every working-day figure is stated on\n                  \"day_unit_basis\": dict,  # each bare *_days key: 'working_days' or 'calendar_days'\n                  \"dual_method_gap\": dict | None,  # working days only\n                  \"output_files\": {...},\n                  \"warnings\": [...],\n                  \"method\": \"AACE 29R-03 §3.8 (Modeled/Subtractive/Single Simulation)\"\n                }\n            ",
          "inputSchema": {
            "properties": {
              "as_built_xer_content": {
                "default": "",
                "title": "As Built Xer Content",
                "type": "string"
              },
