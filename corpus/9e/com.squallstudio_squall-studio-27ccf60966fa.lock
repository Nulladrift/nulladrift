        {
          "name": "generate_script",
          "title": "Generate script",
          "description": "Write a full multi-episode script from a story premise. This CREATES A NEW PROJECT — it does not edit an existing one, and it takes no project_id. While the job runs, job.output carries live progress (phase, completedEpisodes, totalEpisodes). On success the new project also has its characters, locations, episodes, shots and segments seeded, ready for the other tools. Spends credits. Returns a job id — poll it with get_job.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "episode_count": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 3,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": 3,
                "description": "How many episodes to write. null to let the model choose."
              },
              "episode_length_seconds": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 300,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Target length of each episode, in seconds. null to let the model choose."
              },
              "genre": {
                "description": "Genre label. Omit to let the story set it.",
                "minLength": 1,
                "type": "string"
              },
              "idempotency_key": {
                "description": "Stable key identifying this generation request. Reuse the SAME key when retrying the same request — the original job is returned and no second charge is made. Use a NEW key when you deliberately want another generation.",
                "maxLength": 200,
                "minLength": 8,
                "pattern": "^[A-Za-z0-9._:-]+$",
                "type": "string"
              },
              "language": {
                "description": "Language for dialogue, voiceover and on-screen text. Omit to use the language the story asks for.",
                "minLength": 1,
                "type": "string"
              },
              "screen_ratio": {
                "default": "9:16",
                "description": "Aspect ratio.",
                "enum": ["9:16", "16:9", "1:1"],
                "type": "string"
              },
              "story_idea": {
                "description": "The story premise to write from.",
                "minLength": 10,
                "type": "string"
              },
              "target_platform": {
                "default": "TikTok",
                "description": "Platform the episodes are cut for.",
                "enum": ["TikTok", "Reels", "YouTube Shorts"],
                "type": "string"
              },
              "video_model": {
                "description": "Video model for the project's clips: Seedance 2.5, Seedance 2.0 Fast (cheaper) or Kling 4.0. Defaults to Seedance 2.5.",
                "enum": ["Seedance 2.5", "Seedance 2.0 Fast", "Kling 4.0"],
                "type": "string"
              },
              "visual_style": {
                "description": "Visual style. Defaults to Realistic TV Drama.",
                "enum": ["Realistic TV Drama", "Cinematic Romance", "2D Anime", "3D Animated", "Dark Thriller"],
                "type": "string"
              }
            },
            "required": ["episode_length_seconds", "idempotency_key", "story_idea"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false,
            "title": "Generate script"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:14210443630d27943c2b8ee90bb4f8bc4691887f0bda5667f524d7ede63e99a0"
        },
        {
          "name": "generate_shot_background_image",
          "title": "Generate background plate",
          "description": "Generate an empty background plate for one short shot. Both reference inputs steer what the plate itself looks like — layout, prop identity, materials and lighting — and are unrelated to upload_shot_continuity_reference, which guides clip generation instead. Use reference_image_asset_ids for images already in this project (find them with get_asset_library) and reference_images_base64 to send bytes you produced locally, for example a frame lifted from an earlier scene so a prop matches what is already on screen. Uploaded bytes are used for this one generation and are not kept as project assets. The location's own reference images are always included on top of both. Spends credits. Returns a job id — poll it with get_job.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "idempotency_key": {
                "description": "Stable key identifying this generation request. Reuse the SAME key when retrying the same request — the original job is returned and no second charge is made. Use a NEW key when you deliberately want another generation.",
                "maxLength": 200,
                "minLength": 8,
                "pattern": "^[A-Za-z0-9._:-]+$",
                "type": "string"
              },
              "reference_image_asset_ids": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "reference_images_base64": {
                "description": "Images to send as bytes. PNG, JPEG and WebP only; the bytes are sniffed, so the filename extension alone will not get a non-image through. Keep them small — a 720x1280 JPEG is roughly 40-130KB of base64.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "filename": {
                      "description": "File name to send it under, e.g. scene-1-radio-prop.jpg.",
                      "maxLength": 255,
                      "minLength": 1,
                      "type": "string"
                    },
                    "image_base64": {
                      "description": "The image bytes, base64-encoded. No data: URI prefix.",
                      "maxLength": 34000000,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["filename", "image_base64"],
                  "type": "object"
                },
                "maxItems": 3,
                "type": "array"
              },
              "short_shot_number": {
                "description": "Short shot number within the shot.",
                "type": "integer"
              },
              "shot_id": {
                "description": "Shot id.",
                "type": "string"
              }
            },
            "required": ["idempotency_key", "short_shot_number", "shot_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false,
            "title": "Generate background plate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a4bd2067b94bbb6e65a4ebfe1f09ee7132d9afabfb16a2db04fb24fac7953fea"
        },
