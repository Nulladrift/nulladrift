        {
          "name": "update_location",
          "title": "Update location",
          "description": "Overwrite fields on one location. Read it first (get_project_locations or get_location), then send ONLY the fields you changed — omitted fields are left untouched. IMPORTANT: a location is usually shared by several scenes across episodes, so this edit changes every scene that uses it. Check where it is used first; if the change is meant for one scene only, it needs a NEW location rather than an edit to this one. Editing name, short_description, visual_prompt, user_prompt, visual_style, aspect_ratio or spatial_layout marks the location stale, because its existing generated image no longer matches the description — regenerate the image if you want them back in sync. Editing mood, location_type, recurring or appears_in_episodes does not affect the image and leaves the stale flag alone. spatial_layout is the set bible: the named zones of the set and the fixed zone and height of each prop. Scenes must draw their spatial_geometry zones from it instead of inventing labels, so correcting it here fixes prop placement for every scene at once. Keep descriptions consistent with the owning character's status and the project's tone. This writes immediately and cannot be undone.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "location_id": {
                "description": "Location id to update.",
                "type": "string"
              },
              "patch": {
                "additionalProperties": false,
                "description": "Fields to change. Send only what you are changing.",
                "properties": {
                  "appears_in_episodes": {
                    "items": {
                      "exclusiveMinimum": 0,
                      "type": "integer"
                    },
                    "type": "array"
                  },
                  "aspect_ratio": {
                    "type": ["string", "null"]
                  },
                  "location_type": {
                    "type": ["string", "null"]
                  },
                  "mood": {
                    "type": ["string", "null"]
                  },
                  "name": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "recurring": {
                    "type": "boolean"
                  },
                  "short_description": {
                    "type": ["string", "null"]
                  },
                  "spatial_layout": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "properties": {
                          "layout_summary": {
                            "type": "string"
                          },
                          "props": {
                            "default": [],
                            "items": {
                              "additionalProperties": false,
                              "properties": {
                                "co_located_with": {
                                  "default": [],
                                  "items": {
                                    "type": "string"
                                  },
                                  "type": "array"
                                },
                                "description": {
                                  "type": "string"
                                },
                                "height": {
                                  "type": "string"
                                },
                                "id": {
                                  "type": "string"
                                },
                                "key_prop": {
                                  "type": "boolean"
                                },
                                "movable": {
                                  "default": false,
                                  "type": "boolean"
                                },
                                "name": {
                                  "type": "string"
                                },
                                "zone": {
                                  "type": "string"
                                }
                              },
                              "required": ["description", "height", "id", "name", "zone"],
                              "type": "object"
                            },
                            "type": "array"
                          },
                          "zones": {
                            "default": [],
                            "items": {
                              "additionalProperties": false,
                              "properties": {
                                "adjacent_to": {
                                  "default": [],
                                  "items": {
                                    "type": "string"
                                  },
                                  "type": "array"
                                },
                                "description": {
                                  "type": "string"
                                },
                                "id": {
                                  "type": "string"
                                }
                              },
                              "required": ["description", "id"],
                              "type": "object"
                            },
                            "type": "array"
                          }
                        },
                        "required": ["layout_summary"],
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "user_prompt": {
                    "type": ["string", "null"]
                  },
                  "visual_prompt": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "visual_style": {
                    "type": ["string", "null"]
                  }
                },
                "type": "object"
              }
            },
            "required": ["location_id", "patch"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
