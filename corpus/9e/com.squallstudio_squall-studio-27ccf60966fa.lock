      "tools": [
        {
          "name": "attach_shot_continuity_reference",
          "title": "Attach continuity reference",
          "description": "Attach an image that already exists in this project to a shot as a continuity reference. A continuity reference is fed into this shot's next clip generation as a layout, prop, wardrobe and screen-direction guide — it is NOT used as the shot's opening frame or exact composition. Attaching one changes nothing until the clip is generated again. Find asset ids with get_asset_library. A shot's own thumbnail is its clip's last frame, so attaching the previous scene's thumbnail is the cheapest way to carry continuity forward. To use an image that is not yet an asset here, use upload_shot_continuity_reference instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "asset_id": {
                "description": "Id of an existing image asset in this project.",
                "type": "string"
              },
              "guidance": {
                "description": "How the video model should use this reference, e.g. which positions or props to match and what to ignore. Saved on the reference and sent with every later generation of the shot.",
                "maxLength": 1000,
                "type": "string"
              },
              "shot_id": {
                "description": "Shot id (episode_shots row) to attach the reference to.",
                "type": "string"
              }
            },
            "required": ["asset_id", "shot_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false,
            "title": "Attach continuity reference"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a44768252a2dc5599e47f3b43837507a694554a51f69527dedd02c513417cd5e"
        },
        {
          "name": "generate_character_image",
          "title": "Generate character image",
          "description": "Generate a reference image for a character. Spends credits. Returns a job id — poll it with get_job.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "character_id": {
                "description": "Character id.",
                "type": "string"
              },
              "character_look_id": {
                "description": "Specific look; defaults to the base look.",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Stable key identifying this generation request. Reuse the SAME key when retrying the same request — the original job is returned and no second charge is made. Use a NEW key when you deliberately want another generation.",
                "maxLength": 200,
                "minLength": 8,
                "pattern": "^[A-Za-z0-9._:-]+$",
                "type": "string"
              },
              "reference_image_asset_ids": {
                "description": "Existing asset ids of pictures of the character. On the base look, the image draws the character in them.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "user_notes": {
                "description": "Extra direction for the image.",
                "type": "string"
              }
            },
            "required": ["character_id", "idempotency_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
