            "additionalProperties": false,
            "properties": {
              "ticket": {
                "description": "The ticket id that submit_feedback returned.",
                "pattern": "^fb_[0-9a-f]{32}$",
                "type": "string"
              }
            },
            "required": ["ticket"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "note": {
                "type": "string"
              },
              "reply": {
                "type": ["string", "null"]
              },
              "status": {
                "enum": ["pending", "answered"],
                "type": "string"
              },
              "ticket": {
                "type": "string"
              }
            },
            "required": ["status", "ticket"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
