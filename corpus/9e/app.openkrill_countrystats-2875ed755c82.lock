          },
          "digest": "sha256:853415e6d7fcfd9492928d381aed7920a4041f850876905ed5e5171d066dce21"
        },
        {
          "name": "get_imf_forecast",
          "title": "Get an IMF forecast",
          "description": "Use this when the user asks what the IMF projects for a country, such as \"what does the IMF forecast for India's growth next year?\". Pass the country and the indicator (growth, inflation or debt). Returns the IMF's figures for the current year and the next two, with the unit, the World Economic Outlook edition and the date it was published. It reports the IMF's projections only and does not make its own forecasts.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "country": "India",
                "indicator": "growth"
              }
            ],
            "properties": {
              "country": {
                "description": "A country name or ISO code, such as \"Vietnam\", \"VN\" or \"VNM\"",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "indicator": {
                "description": "growth (real GDP, annual percent change), inflation (average consumer prices, annual percent change) or debt (general government gross debt, percent of GDP)",
                "enum": ["growth", "inflation", "debt"],
                "type": "string"
              }
            },
            "required": ["country", "indicator"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "description": "ISO 8601 time the data was published by its source or fetched from it. A cached answer keeps the time of its fetch.",
                "type": "string"
              },
              "country": {
                "properties": {
                  "iso3": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  }
                },
                "required": ["iso3", "name"],
                "type": "object"
              },
              "edition": {
                "type": ["string", "null"]
              },
              "forecasts": {
                "items": {
                  "properties": {
                    "value": {
                      "type": "number"
                    },
                    "year": {
                      "type": "string"
                    }
                  },
                  "required": ["value", "year"],
                  "type": "object"
                },
                "type": "array"
              },
              "indicator": {
                "properties": {
                  "key": {
                    "type": "string"
                  },
                  "label": {
                    "type": "string"
                  },
                  "unit": {
                    "type": "string"
                  }
                },
                "required": ["key", "label", "unit"],
                "type": "object"
              },
              "message": {
                "type": "string"
              },
              "notice": {
                "type": "string"
              },
              "source": {
                "description": "Who the data comes from, to cite and to check it against.",
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["name", "url"],
                "type": "object"
              },
              "status": {
                "enum": ["ok", "no_data", "unavailable"],
                "type": "string"
              }
            },
            "required": ["as_of", "country", "edition", "forecasts", "indicator", "notice", "source", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Done: Get an IMF forecast",
            "openai/toolInvocation/invoking": "Get an IMF forecast..."
