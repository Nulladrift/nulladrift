      "serverInfo": {
        "name": "manifeste",
        "title": "Manifeste",
        "version": "1.0.0",
        "websiteUrl": "https://getmanifeste.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Manifeste checks whether an e-commerce product is worth selling. Call calculate_margin with the selling price (tax included) and the delivered cost; add country and channel when known. Answer with the verdict, what is kept per sale and the levers, and share the open_in_manifeste link for the full analysis.",
      "tools": [
        {
          "name": "calculate_margin",
          "title": "Manifeste: margin and product verdict",
          "description": "Manifeste e-commerce margin calculator. From a selling price and a delivered cost, returns a GO / RISKY / NO-GO verdict, what the seller really keeps per sale after VAT, platform fees (TikTok Shop, Amazon, Etsy, eBay, own store/Shopify), affiliate commission, payment fees, returns and social contributions, plus the levers to reach GO (minimum price, maximum cost), break-even ROAS, maximum ad cost per sale, sales needed per month and points to check. Use it whenever someone asks if a product is profitable, what margin or fees they will have, or how to price it.",
          "inputSchema": {
            "properties": {
              "ad_cost_per_sale": {
                "description": "Average ad spend per sale.",
                "type": "number"
              },
              "affiliate_commission_percent": {
                "description": "Affiliate creator commission % (TikTok Shop default 15).",
                "type": "number"
              },
              "channel": {
                "description": "Where it is sold: tiktok (TikTok Shop), amazon, etsy, ebay, boutique (own store, e.g. Shopify), physique (in person), autre (other).",
                "enum": ["tiktok", "amazon", "etsy", "ebay", "boutique", "physique", "autre"],
                "type": "string"
              },
              "cost": {
                "description": "Delivered cost per unit: product + packaging + shipping to the customer.",
                "type": "number"
              },
              "country": {
                "description": "Store country: FR, BE, DE, ES, IT, IE, UE (other EU), UK, US, XX (other). Sets currency, VAT and default fees.",
                "enum": ["FR", "BE", "DE", "ES", "IT", "IE", "UE", "UK", "US", "XX"],
                "type": "string"
              },
              "delivery_days": {
                "description": "Business days from order to delivery (optional, used for the verdict).",
                "type": "number"
              },
              "discount_percent": {
                "description": "Promotion % off the price.",
                "type": "number"
              },
              "fixed_fee_per_order": {
                "description": "Override the fixed fee per order.",
                "type": "number"
              },
              "language": {
                "description": "Language of the answer (default en).",
                "enum": ["fr", "en", "es", "de", "it"],
                "type": "string"
              },
              "monthly_fixed_costs": {
                "description": "Monthly fixed costs (tools, subscriptions).",
                "type": "number"
              },
              "monthly_profit_goal": {
                "description": "Monthly net profit goal (default 1000).",
                "type": "number"
              },
              "payment_fee_percent": {
                "description": "Override payment fees %.",
                "type": "number"
              },
              "platform_fee_percent": {
                "description": "Override the platform fee %.",
                "type": "number"
              },
              "price": {
                "description": "Selling price paid by the customer, tax included (e.g. 24.90).",
                "type": "number"
              },
              "returns_percent": {
                "description": "Returns provision % (default 5).",
                "type": "number"
              },
              "samples_percent": {
                "description": "Free samples as % of units sold.",
                "type": "number"
              },
              "shipping_charged": {
                "description": "Shipping paid by the customer, if any.",
                "type": "number"
              },
              "ships_from": {
                "description": "Where parcels ship from (matters for TikTok Shop in the EU).",
                "enum": ["local", "eu", "outside"],
                "type": "string"
              },
              "social_contributions_percent": {
                "description": "Social contributions and taxes as % of revenue (France micro-entreprise default 12.3).",
                "type": "number"
              },
              "starting_budget": {
                "description": "Starting budget available for stock, ads and samples: returns the max and suggested number of units (30% kept for ads and surprises).",
                "type": "number"
              },
              "stock_quantity": {
                "description": "Units in the first stock order (default 50).",
                "type": "number"
              },
              "vat_percent": {
                "description": "VAT rate % (default: standard rate of the country; 0 for VAT exemption).",
                "type": "number"
              }
            },
            "required": ["cost", "price"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Manifeste: margin and product verdict"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2f7cf45cabbdb2473094e5dd568554add02e5e5e68f8868777aeca795e3af9b8"
        },
