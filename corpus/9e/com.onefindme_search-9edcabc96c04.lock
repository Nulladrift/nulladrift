{
  "lockfileVersion": 2,
  "subjects": {
    "com.onefindme/search": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://onefindme.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "onefindme",
        "title": "OneFindMe — AliExpress & eBay search in any language",
        "version": "1.0.2",
        "websiteUrl": "https://onefindme.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "OneFindMe searches AliExpress in any language, and also returns matching eBay listings (as a separate list) when eBay has items that ship to the delivery country. search_products accepts the shopper's own words, in their language, plus an optional delivery country, and returns listings with price, rating, order count, store and an affiliate link.",
      "tools": [
        {
          "name": "search_products",
          "title": "Search AliExpress and eBay products",
          "description": "Search AliExpress for products using the shopper's own words in any language (Hebrew, Arabic, German, Spanish, Japanese, …) — no need to know the English product name. Returns real listings with price, rating, order count, store and a link. Prices are for delivery to the given country. When eBay has matching new, fixed-price listings that ship to that country, they are returned as a separate list (ebay_results) with price, shipping cost, delivery estimate and where the item ships from, via the official eBay API. Links are affiliate links (OneFindMe may earn a commission; the price is the same for the buyer).",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 code of the delivery country, e.g. US, GB, DE, IL, SA. Default US.",
                "type": "string"
              },
              "free_shipping": {
                "description": "Only products with free shipping.",
                "type": "boolean"
              },
              "language": {
                "description": "Language of the query and of the returned titles (ISO 639-1, e.g. en, he, ar, de). Default: detected from the query script, else en.",
                "type": "string"
              },
              "max_price": {
                "description": "Maximum price in the country's currency.",
                "type": "number"
              },
              "max_results": {
                "description": "How many products to return (1-20). Default 8.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "min_price": {
                "description": "Minimum price in the country's currency.",
                "type": "number"
              },
              "query": {
                "description": "What the shopper is looking for, in any language, e.g. \"מעיל חם לפעוט\" or \"wireless earbuds for running\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search AliExpress and eBay products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7bc483fd632ef54387579006327a453dee6d76fd4379ba1add4ee579f78e2304"
        }
      ],
      "digest": "sha256:d757913d604c8732a4c5fea106c720950be4158c044cb2684f1962540aa6fa11"
    }
  }
}
