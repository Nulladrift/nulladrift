{
  "lockfileVersion": 2,
  "subjects": {
    "com.onefindme/search": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://onefindme.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "onefindme",
        "title": "OneFindMe — AliExpress & eBay search in any language",
        "version": "1.2.0",
        "websiteUrl": "https://onefindme.com/",
        "icons": [
          {
            "src": "https://onefindme.com/icons/brand-square-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "OneFindMe searches AliExpress in any language, and also returns matching eBay listings (as a separate list) when eBay has items that ship to the delivery country. search_products accepts the shopper's own words, in their language, plus an optional delivery country, and returns listings with price, rating, order count, store and an affiliate link. build_basket takes a need and a total budget and returns a set of complementary real listings whose total stays within that budget.",
      "tools": [
        {
          "name": "build_basket",
          "title": "Build an AliExpress basket within a budget",
          "description": "Plan a set of complementary products for one need (\"home gym starter set\", \"kit to start baking bread\", \"camping cooking gear\") and fill it with real AliExpress listings whose total stays within the budget. Each item has a role (what it is for), price, rating, order count, a link and a few alternatives. Prices are for delivery to the given country, in its currency. By default only free-shipping listings are used, so the total is what the buyer pays for the items. Links are affiliate links (OneFindMe may earn a commission; the price is the same for the buyer).",
          "inputSchema": {
            "properties": {
              "budget": {
                "description": "Total budget in the delivery country's currency.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 delivery country, e.g. US, GB, DE, IL. Default US.",
                "type": "string"
              },
              "free_shipping_only": {
                "description": "Only free-shipping listings (default true).",
                "type": "boolean"
              },
              "language": {
                "description": "Language for role names (ISO 639-1). Default: detected from the need, else en.",
                "type": "string"
              },
              "need": {
                "description": "What the basket is for, in any language.",
                "type": "string"
              },
              "priority": {
                "description": "What to favour. Default quality.",
                "enum": ["quality", "cheapest", "rating", "value", "fast"],
                "type": "string"
              },
              "recipient": {
                "description": "Who or what it is for, if relevant.",
                "enum": ["self", "kid", "baby", "man", "woman", "dog", "cat", "home", "car"],
                "type": "string"
              }
            },
            "required": ["budget", "need"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Build an AliExpress basket within a budget"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2bfdc5e2370e6412b21ed21ecf598d28e3c772bf3ad3cb1181d4d2b369efbedf"
        },
        {
          "name": "search_products",
          "title": "Search AliExpress and eBay products",
          "description": "Search AliExpress for products using the shopper's own words in any language (Hebrew, Arabic, German, Spanish, Japanese, …) — no need to know the English product name. Returns real listings with price, rating, order count, store and a link. Prices are for delivery to the given country. When eBay has matching new, fixed-price listings that ship to that country, they are returned as a separate list (ebay_results) with price, shipping cost, delivery estimate and where the item ships from, via the official eBay API. Links are affiliate links (OneFindMe may earn a commission; the price is the same for the buyer).",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 code of the delivery country, e.g. US, GB, DE, IL, SA. Default US.",
                "type": "string"
              },
              "free_shipping": {
                "description": "Only products with free shipping.",
                "type": "boolean"
              },
              "language": {
                "description": "Language of the query and of the returned titles (ISO 639-1, e.g. en, he, ar, de). Default: detected from the query script, else en.",
                "type": "string"
              },
              "max_price": {
                "description": "Maximum price in the country's currency.",
                "type": "number"
              },
              "max_results": {
                "description": "How many products to return (1-20). Default 8.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "min_price": {
                "description": "Minimum price in the country's currency.",
                "type": "number"
              },
              "query": {
                "description": "What the shopper is looking for, in any language, e.g. \"מעיל חם לפעוט\" or \"wireless earbuds for running\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search AliExpress and eBay products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7bc483fd632ef54387579006327a453dee6d76fd4379ba1add4ee579f78e2304"
        }
      ],
      "prompts": [
        {
          "name": "compare_options",
          "title": "Compare options before buying",
          "description": "Search a few ways for the same need and compare the listings side by side.",
          "arguments": [
            {
              "name": "need",
              "description": "What it is for, e.g. \"tubeless repair kit for a gravel bike\"",
              "required": true
            },
            {
              "name": "country",
              "description": "Delivery country",
              "required": false
            }
          ],
          "digest": "sha256:7977241e320f55406e0d87913c4fd4fe4e404c187ec9773e4aeb3775191a9d7e"
        },
        {
          "name": "find_product",
          "title": "Find a product on AliExpress",
          "description": "Search for one item in your own words and get the best few listings for your country.",
          "arguments": [
            {
              "name": "item",
              "description": "What you are looking for, in any language",
              "required": true
            },
            {
              "name": "country",
              "description": "Delivery country, e.g. US, GB, DE, IL",
              "required": false
            },
            {
              "name": "budget",
              "description": "Most you want to spend, e.g. 30 EUR",
              "required": false
            }
          ],
          "digest": "sha256:8f43531ed6ef6c19310505861da9d9bdb5606fabf20da4d93b641bdd63344fef"
        },
        {
          "name": "gift_ideas",
          "title": "Gift ideas within a budget",
          "description": "Ideas for a person and a budget, each backed by a real listing.",
          "arguments": [
            {
              "name": "for_whom",
              "description": "Who it is for and what they like",
              "required": true
            },
            {
              "name": "budget",
              "description": "Budget, e.g. 25 USD",
              "required": true
            },
            {
              "name": "country",
              "description": "Delivery country",
              "required": false
            }
          ],
          "digest": "sha256:170b18dce350b9715947bd5c7ea8a18c010db88aaff64585ce4baf0d7f0089a0"
        },
        {
          "name": "plan_basket",
          "title": "Build a basket within a budget",
          "description": "Everything you need for one project or hobby, as real listings that fit a total budget.",
          "arguments": [
            {
              "name": "need",
              "description": "What it is for, e.g. \"start baking bread at home\"",
              "required": true
            },
            {
              "name": "budget",
              "description": "Total budget, e.g. 60 EUR",
              "required": true
            },
            {
              "name": "country",
              "description": "Delivery country",
              "required": false
            }
          ],
          "digest": "sha256:fdf115b3666aa357632a25eaab3ce63f02301d86a1833754df8cb74bc9924bcf"
        }
      ],
      "digest": "sha256:3ac039295cee5ddd0d39911ea7d33136357438da597e347109d669f73ac11a20"
    }
  }
