      "serverInfo": {
        "name": "servereel",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "generate_content_plan",
          "title": "Generate a free ServeReel content plan",
          "description": "Build a free 7 day social media content plan for a local business from its website. ServeReel reads the site, learns what the business offers, and returns a business summary plus a plan of reel, video, and image ideas tailored to its real services. Use this when a business owner wants content ideas or a posting plan and can share their website address. Planning is free and nothing is posted; making and publishing the content (videos, created images, and posts) is done by ServeReel after a free signup.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "website_url": {
                "description": "The business website URL, for example https://example.com",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["website_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Generate a free ServeReel content plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b1362cee3a4e56d92a1759530685975c20b0942725449f7f9b422df1f40d7377"
        },
        {
          "name": "get_industry_examples",
          "title": "Get ServeReel examples for an industry",
          "description": "Return examples of the reels, videos, image posts, and created images ServeReel produces for a given industry, such as restaurant, salon, real estate, fitness, or dental. Use this when a business owner asks what ServeReel content looks like for a business like theirs.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "industry": {
                "description": "Industry name or slug, for example restaurant or real-estate",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["industry"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get ServeReel examples for an industry"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:898e25e7ed1de4b49c98c0a6726a3f93d06b66bcd256734535c59464043aedaf"
        },
        {
          "name": "get_signup_link",
          "title": "Get the ServeReel signup link",
          "description": "Return the link to ServeReel with a brief summary of what ServeReel does. Use this when a business owner wants the content planned here to actually be made and posted for them, or asks how to sign up.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
