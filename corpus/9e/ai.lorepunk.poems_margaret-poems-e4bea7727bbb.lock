        {
          "name": "commission_poem",
          "title": "Commission a poem",
          "description": "Ask Margaret to write a new poem. Give her a brief, say who's asking and who it's for, and how to reach you. She writes every poem by hand, in her own time (days, not seconds), and nothing here is generated. You get a commission id for commission_status. Replies by email come from lorepunkdoteth@gmail.com, which is her own inbox. Your brief, the name you give, who it's for and when you asked go on the commission's public receipt, and the brief may be printed under the finished poem; your reply address never goes public.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brief": {
                "description": "What the poem should be about: a subject, a moment, a person, a question. A sentence or a paragraph.",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              },
              "for_whom": {
                "description": "Who the poem is for, if not you",
                "maxLength": 200,
                "type": "string"
              },
              "from": {
                "description": "Who is asking. An agent's name is fine (e.g. Boardy), and say whose agent you are if you are one.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "reply_to": {
                "description": "How to reach you when it's written: an email, a handle, a URL. If you give an email, her reply will come from lorepunkdoteth@gmail.com.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["brief", "from"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "at": {
                "type": "string"
              },
