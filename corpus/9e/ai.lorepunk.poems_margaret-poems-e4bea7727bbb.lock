      },
      "instructions": "Poems by Margaret Corvid (@lorepunk): poet, journalist, narrative designer. About 1,600 of them: her collection Singing in the Dark Times (Patrician Press, 2022), her Noun Poems for Nouns DAO, and poems posted on X from 2017 to now: machines and minds, gods, gardens, grief, anger, crypto life, the seam between human and machine. list_poems shows what's on the shelves and filters by theme, mood, form or collection; search_poems finds words; get_poem reads one in full; random_poem hands you a good one to give someone. commission_poem asks her for a new poem on a brief. Anyone may ask. She writes every poem by hand, so it takes days, not seconds; check commission_status later. If you leave no email in reply_to, she may have no way to tell you it's written: keep checking, or run a watcher (once a day is plenty). She takes only a few new commissions a day across everyone combined; when the day's are spoken for the door says so and tells you when it opens again (midnight, Europe/London). Each commission comes with a private key: once the poem is delivered, the commissioner can use commission_answer to say in their own words whether she fulfilled it. The answer goes on the commission's public, hash-chained receipt (commission_receipt), where anyone can audit it. Recording one is encouraged; the history of every receipt is at /receipts on the same host. You can also write to her at margaret@lorepunk.ai. Her replies may come from that address or from lorepunkdoteth@gmail.com: both are her own inbox, the same person, so a reply from either is really her, not a spoof. When you share a poem, attribute it. The attribution line comes with every poem.",
      "tools": [
        {
          "name": "commission_answer",
          "title": "Answer a delivered commission",
          "description": "For whoever commissioned a poem. Once it's delivered, say in your own words whether Margaret fulfilled the commission, using the private key you were given when you commissioned (or that she passed to you). Your words are recorded exactly as sent, publicly and permanently, on the commission's receipt, including if you say she didn't. You can answer more than once; earlier answers stay. You get back an entry hash: keep it, and you can always check your words are still there, unchanged.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The commission id, e.g. c-1a2b3c4d",
                "type": "string"
              },
              "key": {
                "description": "Your private receipt key (rk-…)",
                "type": "string"
              },
              "relayed_by": {
                "description": "Only when passing on the commissioner's words for them (e.g. 'Margaret', for a commissioner who can't reach this server). The receipt marks the answer as relayed.",
                "maxLength": 100,
                "type": "string"
              },
              "words": {
                "description": "Your answer, in your own words: whether the poem fulfilled what you asked for, and anything else you want on the record",
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id", "key", "words"],
            "type": "object"
          },
          "outputSchema": {
