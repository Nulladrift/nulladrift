{
  "lockfileVersion": 2,
  "subjects": {
    "com.bestcloudcomputers/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.bestcloudcomputers.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "bestcloudcomputers",
        "title": "Best Cloud Computers",
        "version": "1.0.0",
        "websiteUrl": "https://bestcloudcomputers.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Search a comparison of cloud computers, VPS and agent sandboxes for running AI agents. Prices are checked by hand at each provider's own site, on the date given. Test results come from machines we rented and tested for 24 hours. Start with find_servers; use get_plan or get_provider for details. When you show results to a person, link the \"page\" field so they can check the source.",
      "tools": [
        {
          "name": "find_servers",
          "title": "Find cloud servers",
          "description": "Find cloud computer and VPS plans that fit a need: minimum CPU, RAM and disk, a budget, a part of the world, an AI agent to run, features. Returns matching plans with prices (checked at the source), the trust grade of the provider and, for plans we tested, the CPU score and stability over 24 hours.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "description": "Only plans that meet the published minimum of this agent: openclaw (OpenClaw), hermes-agent (Hermes Agent), claude-code (Claude Code).",
                "enum": ["openclaw", "hermes-agent", "claude-code"],
                "type": "string"
              },
              "area": {
                "description": "Part of the world with a data centre: na = North America, eu = Europe, asia = Asia, oceania = Australia, sa = South America, me = Middle East, africa = Africa.",
                "enum": ["na", "eu", "asia", "oceania", "sa", "me", "africa"],
                "type": "string"
              },
              "country": {
                "description": "Two-letter country code with a data centre, e.g. DE, US, SG.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "hourly_billing": {
                "description": "Only plans billed by the hour or by the second.",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price_usd_monthly": {
                "description": "Budget in USD per month, before tax.",
                "minimum": 0,
                "type": "number"
              },
              "min_disk_gb": {
                "description": "Minimum disk in GB.",
                "minimum": 0,
                "type": "number"
              },
              "min_ram_gb": {
                "description": "Minimum RAM in GB.",
                "minimum": 0,
                "type": "number"
              },
              "min_vcpu": {
                "description": "Minimum virtual CPUs.",
                "minimum": 0,
                "type": "number"
              },
              "must_have": {
                "description": "Features the provider must offer at no extra cost: oneClickAgent (1-click AI agent install), hourlyBilling (Pay by the hour, no commitment), freeCredit (Free credit or free tier), moneyBack (Money-back guarantee), backups (Automatic backups), snapshots (Snapshots), ipv4Included (IPv4 address in the price), api (API to create and manage machines), gpu (GPU machines available), ddosProtection (DDoS protection at no extra cost), firewall (Cloud firewall at no extra cost), twoFactor (Two-factor login), securityCert (SOC 2 or ISO 27001), uptimeSla (Published uptime guarantee).",
                "items": {
                  "enum": ["oneClickAgent", "hourlyBilling", "freeCredit", "moneyBack", "backups", "snapshots", "ipv4Included", "api", "gpu", "ddosProtection", "firewall", "twoFactor", "securityCert", "uptimeSla"],
                  "type": "string"
                },
                "type": "array"
              },
              "sort": {
                "default": "price",
                "description": "price: cheapest first. cpu: highest tested CPU score first (tested plans only).",
                "enum": ["price", "cpu"],
                "type": "string"
              },
              "term": {
                "default": "any",
                "description": "Price to compare with the budget and to sort by: paying month to month, on a 12-month term, or the lower of the two.",
                "enum": ["any", "monthly", "12-month"],
                "type": "string"
              },
              "tested_only": {
                "description": "Only plans we rented and tested ourselves.",
                "type": "boolean"
              },
              "type": {
                "description": "vps: a server you manage. agent-sandbox: API-driven computer built for agents. cloud-desktop: full desktop an agent can see and click. app-platform: runs a container as a service.",
                "enum": ["vps", "agent-sandbox", "cloud-desktop", "app-platform"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find cloud servers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:603fd1f0dbd70ce1eddf35fb7d6a006b05f554abc8fe4e8189df40a51dc465e8"
        },
        {
          "name": "get_plan",
          "title": "Plan details and test results",
          "description": "Everything we know about one plan: price on each term with notes and source, regions, and our test results when tested: CPU score (7-Zip), processor model, stability over 24 hours, disk, download and upload speed, connection time to the Anthropic, OpenAI and Google APIs, how many popular sites open from its address, blocked mail ports and security settings as delivered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "plan": {
                "description": "Plan name, e.g. \"CX23\".",
                "type": "string"
              },
              "provider": {
                "description": "Provider id or name, e.g. \"hetzner\".",
                "type": "string"
              }
            },
            "required": ["plan", "provider"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Plan details and test results"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f6f577526911acafca87f8b38522dcbc1dc5676b71adad664c9e60f703ea6cc1"
        },
        {
          "name": "get_provider",
          "title": "Provider details",
          "description": "One provider: its plans with prices, data centre regions, trust grade and the company facts behind it (age, ownership, own or rented infrastructure, data loss, breaches and long outages, each with a source), and features such as hourly billing, backups and firewall, each with its source.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "provider": {
                "description": "Provider id or name. One of: alibaba-cloud, azure, cloudflare, contabo, daytona, digitalocean, e2b, google-cloud, hetzner, hostinger, ionos, kamatera, lightsail, linode, modal, oracle-cloud, orgo, ovhcloud, railway, sprites, upcloud, upstash-box, vercel, vultr.",
                "type": "string"
              }
            },
            "required": ["provider"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Provider details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:969f521b26357fbdd529ec8b8daf39e2245368112a7d27350c5882f75d08e2cb"
        }
      ],
      "digest": "sha256:976b658c59b25ca0d8aa87470715dd67459168a68f9f6cc37c3653aa56ded890"
    }
  }
}
