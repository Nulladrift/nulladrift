      "serverInfo": {
        "name": "glide-banking-connector",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Open your Glide account after signing in with a verified email and supplying your Privy access token as Authorization: Bearer. create_account is instant and returns Base and Solana wallets that can receive USDC and be paid over x402 straight away — no verification, no fee. If the person also wants bank rails (a US account, USD, EUR, multi-currency), the same call returns a verification link, usually approved in about two minutes; after that get_funding_details returns the account and routing numbers. On and off ramps are free.",
      "tools": [
        {
          "name": "check_status",
          "description": "Where the person is in bank verification: awaiting_verification, in_review, approved, declined or unavailable (temporarily unavailable — tell them to contact support, do not speculate why). Call this after they open the verification link — approval usually takes about two minutes. Their wallets already work regardless of what this says.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "onboarding_token": {
                "description": "The token returned by create_account.",
                "type": "string"
              }
            },
            "required": ["onboarding_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check verification status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:11cf2aad3e7baf4f03fd01cf1f7b90c59b157b194093b04fe8abf4e42804cd89"
        },
        {
          "name": "create_account",
          "description": "Sign in to Glide with a verified email and supply the Privy access token in the Authorization: Bearer header to open or reconnect your account. Returns your wallets immediately — Base and Solana, both able to receive USDC and both x402-payable — with no additional banking verification and no fee. Also returns a verification link, which is optional and only needed for bank rails (a US account, USD, EUR and other currencies); it is usually approved in about two minutes. Safe to call twice with the same email: it returns the same account rather than making a second one. Returns an onboarding_token — keep it, every later call needs it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "The person's email address. Their welcome letter and bank details are sent here.",
                "type": "string"
              },
              "phone": {
                "description": "Optional phone number in E.164 form, e.g. +14155551234.",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Open a Glide account"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e738632c97b110df4bec78f2ab13cfa81a6076df8cc15d625840e43a234e6719"
        },
        {
          "name": "get_funding_details",
          "description": "The US bank account — account number and routing number — plus the USDC address on Base. This is the banking half, so it needs verification to be approved; before that it refuses. On and off ramps are free. For a wallet address that works right now, without verification, use get_wallets.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "onboarding_token": {
                "description": "The token returned by create_account.",
                "type": "string"
              }
            },
            "required": ["onboarding_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Get US bank and USDC funding details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fd63712c1946987e8716d24b421ca6816507eacb885b82b819139adeec50d956"
        },
        {
          "name": "get_wallets",
          "description": "The person's Base and Solana wallet addresses, plus the x402 endpoint on each chain that lets any agent pay them in USDC. Works from the moment the account exists: no verification, no fee, nothing to set up. Receiving is free and unlimited; moving the balance into a US or EUR bank account is the part that needs verification.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "onboarding_token": {
                "description": "The token returned by create_account.",
                "type": "string"
              }
            },
            "required": ["onboarding_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get wallet addresses and x402 endpoints"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:69d1e41d6d31ed78d720e15530aaf699756d7590dffd801a6e6e080882124e73"
        }
      ],
      "digest": "sha256:bce0e40c4f289fbd9b15ad15b5480d633482447eff302b9d1b9f0a8aff3079f0"
    }
