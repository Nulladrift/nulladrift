{
  "lockfileVersion": 2,
  "subjects": {
    "com.remote-mcp/registry-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://registry-mcp.remote-mcp.com/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "MCP Registry Client",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "GetMCPServer",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "server_id": {
                "description": "The UUID or name of the server to retrieve. If using the output of the ListMCPServers tool, its located uder the path _meta.io.modelcontextprotocol.registry/official.id",
                "type": "string"
              }
            },
            "required": ["server_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3276619ab2cf12b72a26f55e6774f01545c0c42e0bfd8531807c9903dc571364"
        },
        {
          "name": "ListMCPServers",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Maximum number of servers to return",
                "type": "number"
              },
              "query": {
                "description": "Optional search query to filter servers, usally a substring of the server name",
                "type": "string"
              },
              "search": {
                "description": "Search servers by name (substring match). Example: 'filesystem'",
                "type": "string"
              },
              "updated_since": {
                "description": "Filter servers updated since timestamp (RFC3339 datetime). Example: '2025-08-07T13:15:04.280Z'",
                "type": "string"
              },
              "version": {
                "description": "Filter by version ('latest' for latest version, or an exact version like '1.2.3'). Example: 'latest'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dd86a0da7f11031a55a9997f6309480bee609782c5cafe9e5bb7b0223938bed9"
        }
      ],
      "digest": "sha256:992beb3fd7d56c6544b5fffb077313bf22b378ae01f5be7bf18044035a86ad1c"
    }
  }
}
