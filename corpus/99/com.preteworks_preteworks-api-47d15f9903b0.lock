      },
      "instructions": "PreteWorks API — one metered key for the whole document-to-web pipeline; no install, nothing to host. Web: turn any public URL into clean Markdown (read_url), structured JSON via AI (extract_data), a PDF (url_to_pdf), or a screenshot (url_to_screenshot). PDF: create (from HTML, Markdown, images, .docx, or invoice/receipt/report templates), edit (merge, split, select/rotate/watermark/number pages, read/set metadata), and read (extract text, read/fill forms). Tools chain: most return a `file_id` you can pass as the input to another tool (e.g. url_to_pdf → watermark_pdf → extract_pdf_text) with no re-upload. Free tier: 500 units/month, no card; then pay per call. Every fetch is SSRF-guarded (private/internal hosts blocked).",
      "tools": [
        {
          "name": "answer_from_document",
          "title": "Answer a question from a document (AI)",
          "description": "Answer a question grounded ONLY in a source document — a web page, PDF, Office file, or raw text. Provide 'question' plus ONE source: 'url', 'pdf', 'file' (base64), or 'text'. Says so when the answer isn't in the document.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "file": {
                "description": "A base64-encoded .docx, .xlsx or .csv file.",
                "type": "string"
              },
              "pdf": {
                "description": "A file_id from a prior tool, or a base64-encoded PDF.",
                "type": "string"
              },
              "question": {
                "description": "The question to answer from the document.",
                "type": "string"
              },
              "text": {
                "description": "Raw text to answer from directly.",
                "type": "string"
              },
              "url": {
                "description": "A public http/https URL to read.",
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
