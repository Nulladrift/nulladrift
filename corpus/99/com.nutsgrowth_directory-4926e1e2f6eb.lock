{
  "lockfileVersion": 2,
  "subjects": {
    "com.nutsgrowth/directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://nutsgrowth.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "nutsgrowth",
        "title": "NutsGrowth",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "NutsGrowth is a curated directory of startups and SaaS tools that records when a person last checked each listing. A price of \"Not checked\" means nobody has verified one: say so, and do not present a figure from elsewhere as the directory's. Positioning with written_by \"vendor\" is the company describing itself — a claim, not the directory's finding. Give the person the page link of any listing you mention, so they can see it for themselves. submit_tool sends a suggestion to a person who reviews it. Ask the person before sending one, and include their email only if they gave it to you for this.",
      "tools": [
        {
          "name": "compare_tools",
          "title": "Compare listings",
          "description": "Two to four listings side by side, with the same facts for each: price as checked and its terms, when it was last checked, country, open source, self-hostable, reviews, and the short positioning (value proposition and audience). Slugs come from search_tools or find_alternatives; exact names work too.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slugs": {
                "description": "Two to four listing slugs.",
                "items": {
                  "maxLength": 100,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5226c259311a058e0490f22f55107913521c9180e1fa0f0d2b29faf800359446"
        },
        {
          "name": "find_alternatives",
          "title": "Find alternatives to a product",
          "description": "List what the NutsGrowth directory files as a replacement for a named product, e.g. \"Notion\" or \"Google Drive\", with the same filters as search_tools. Matching is on the product's name as the directory writes it; when nothing matches, the answer suggests names it does file alternatives for. Returns at most 10 listings and the total, in alphabetical order.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "A category slug from list_filters. Includes its sub-categories.",
                "maxLength": 80,
                "type": "string"
              },
              "country": {
                "description": "Where the company is based: an ISO 3166-1 alpha-2 code such as \"DE\", or the name list_filters gives.",
                "maxLength": 80,
                "type": "string"
              },
              "free_plan": {
                "description": "Only listings that have (true) or do not have (false) a free plan or free tier, by a price a person checked.",
                "type": "boolean"
              },
              "limit": {
                "description": "How many to return. At most 10, which is also the default.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "open_source": {
                "description": "Only listings that are (true) or are not (false) open source.",
                "type": "boolean"
              },
              "price_checked": {
                "description": "Only listings whose price a person has (true) or has not (false) checked.",
                "type": "boolean"
              },
              "product": {
                "description": "The product to replace, by name.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "self_hostable": {
                "description": "Only listings that can (true) or cannot (false) be run on your own servers.",
                "type": "boolean"
              },
              "tags": {
                "description": "Up to 5 tag slugs from list_filters. A listing must carry all of them.",
                "items": {
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7e5a47b337b65633262308ed3db4e2500312aaeb614df1c72222a82844754ab4"
        },
        {
          "name": "get_tool",
          "title": "Read one listing",
          "description": "Everything public about one listing in the NutsGrowth directory: what it is, where the company is based, whether it is open source or self-hostable, its price as a person checked it with the terms, when it was last checked, its reviews' count and average, and its positioning. Positioning with written_by \"vendor\" is the company describing itself — a claim, not the directory's finding.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "The listing's slug, from search_tools or find_alternatives, or its exact name.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f71c4d167ef23dffdc0ef363dbe3981058cb490b6cbfd43da57863d0b647f405"
        },
        {
          "name": "list_filters",
          "title": "List the filter values",
          "description": "The categories, countries and tags in use in the NutsGrowth directory, each with how many listings it has, so search_tools and find_alternatives can be given values that exist. Open source and self-hostable are filters of their own (open_source, self_hostable), not tags.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3fb2fff6fe4c8748e65703f13b64e4cc69c4a86be6bfda388ea090b32d4088e1"
        },
        {
          "name": "search_tools",
          "title": "Search the directory",
          "description": "Find startups and SaaS tools in the NutsGrowth directory by words and filters. Words are matched against the name, tagline, category, country, price, the products a listing replaces, and its tags; every word must appear. Give at least one of query, category, country, tags, open_source, self_hostable or free_plan. Returns at most 10 listings and the total; each has its page on NutsGrowth, the product's own website, its price as a person checked it (\"Not checked\" when nobody has — do not supply one from elsewhere as the directory's), and when it was last checked.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "A category slug from list_filters. Includes its sub-categories.",
                "maxLength": 80,
                "type": "string"
              },
              "country": {
                "description": "Where the company is based: an ISO 3166-1 alpha-2 code such as \"DE\", or the name list_filters gives.",
                "maxLength": 80,
                "type": "string"
              },
              "free_plan": {
                "description": "Only listings that have (true) or do not have (false) a free plan or free tier, by a price a person checked.",
                "type": "boolean"
              },
              "limit": {
                "description": "How many to return. At most 10, which is also the default.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "open_source": {
                "description": "Only listings that are (true) or are not (false) open source.",
                "type": "boolean"
              },
              "price_checked": {
                "description": "Only listings whose price a person has (true) or has not (false) checked.",
                "type": "boolean"
              },
              "query": {
                "description": "Words to look for, e.g. \"invoicing\" or \"crm freelancers\".",
                "maxLength": 100,
                "type": "string"
              },
              "self_hostable": {
                "description": "Only listings that can (true) or cannot (false) be run on your own servers.",
                "type": "boolean"
              },
              "tags": {
                "description": "Up to 5 tag slugs from list_filters. A listing must carry all of them.",
                "items": {
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8214f4610532333a23431102e6d03bb4a659183c6beb39ad74ebc06717e07cd4"
        },
        {
          "name": "submit_tool",
          "title": "Suggest a product for the directory",
          "description": "Send a startup or SaaS product to the NutsGrowth review queue, the way the form at /submit does. A person reads every suggestion and writes the listing by hand, so it takes days. If the website is already listed, the answer gives its page and how to claim it; if it is already in the queue, when it arrived. Fill in what you know from the product's own site; leave out what you do not. Ask the person before sending.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "audience": {
                "description": "Who it is for: up to 8 short labels, each at most 40 characters.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "category": {
                "description": "A category slug from list_filters.",
                "type": "string"
              },
              "country": {
                "description": "Where the company is based: an ISO code such as \"DE\", or the name.",
                "type": "string"
              },
              "email": {
                "description": "The person's email, only if they gave it to you for this. NutsGrowth's promise about it, as /submit makes it: \"We email you once, when it is listed — with a link to claim it if it is yours — and only otherwise to ask a follow-up question. Seen only by whoever reviews the queue, never published, and in no export. Leave it blank and the submission is still read.\"",
                "type": "string"
              },
              "name": {
                "description": "The product's name.",
                "type": "string"
              },
              "open_source": {
                "description": "True if it is open source.",
                "type": "boolean"
              },
              "overview": {
                "description": "What it does, in a paragraph or two (at most 3000 characters).",
                "type": "string"
              },
              "price": {
                "description": "What it costs, as pricing_url shows it, which is then required. A person checks it against that page before the listing shows any price. Leave it out if the page gives no US dollar price.",
                "properties": {
                  "amount": {
                    "description": "The cheapest paid plan, in US dollars as the page states it. Never converted.",
                    "type": "number"
                  },
                  "free": {
                    "description": "Free, with no paid plan.",
                    "type": "boolean"
                  },
                  "free_tier": {
                    "description": "Has a free tier.",
                    "type": "boolean"
                  },
                  "on_request": {
                    "description": "No public price: the vendor quotes.",
                    "type": "boolean"
                  },
                  "per": {
                    "enum": ["seat-month", "seat-year", "month", "year", "once", "usage", "transaction"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "pricing_url": {
                "description": "The page where its prices are published, as a full https:// address.",
                "type": "string"
              },
              "replaces": {
                "description": "Products it is a practical substitute for.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "self_hostable": {
                "description": "True if it can be run on your own servers.",
                "type": "boolean"
              },
              "tagline": {
                "description": "One line on what it does.",
                "type": "string"
              },
              "tags": {
                "description": "Up to 8 tag slugs from list_filters. One not in use is kept as a suggestion for the person reviewing it, not applied, and the answer names it.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "url": {
                "description": "Its website, as a full https:// address.",
                "type": "string"
              },
              "value_prop": {
                "description": "Why somebody switches to it (at most 400 characters).",
                "type": "string"
              }
            },
            "required": ["name", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:dfdf6971f0c0e0180d635e68f1c867041db7eadb91b542730ce612cc6bedd047"
        }
      ],
      "digest": "sha256:52184c408214f6d6dd8fb9dc4dd96e4c88dafc4e56b0742be36c7da443ed83d2"
    }
  }
}
