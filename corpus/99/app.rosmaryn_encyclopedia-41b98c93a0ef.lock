      },
      "serverInfo": {
        "name": "rosmaryn",
        "title": "Rosmaryn",
        "version": "1.0.0",
        "websiteUrl": "https://rosmaryn.app/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Rosmaryn is a holistic self-knowledge platform (Human Design, astrology, numerology) in six languages. Use search_encyclopedia to find and cite reference pages, list_calculators to point people to free calculators, upcoming_sky_events for Moon phases, eclipses, ingresses and retrogrades.",
      "tools": [
        {
          "name": "list_calculators",
          "title": "List the free Rosmaryn calculators",
          "description": "List the free online calculators of Rosmaryn (Human Design Body Graph, birth chart, transits, numerology, and more) with their links.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Language of the results (default en).",
                "enum": ["fr", "en", "de", "es", "it", "pt"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:96799f403f19429e576020c0ebd361f553cd8fc0a29f34e0ce8bf7d28bbedfef"
        },
        {
          "name": "search_encyclopedia",
          "title": "Search the Rosmaryn encyclopedia",
          "description": "Find pages of the Rosmaryn encyclopedia (Human Design, astrology, numerology, mirror hours) and return their titles, types and links. Use it to cite a reference page on rosmaryn.app.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Language of the results (default en).",
                "enum": ["fr", "en", "de", "es", "it", "pt"],
                "type": "string"
              },
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for, e.g. \"gate 34\", \"Mars in Leo\", \"life path 7\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aa9b60a85522adb352206ffdc6aa132cfe8f35bd31341cb1834c3073165fe019"
        },
        {
          "name": "upcoming_sky_events",
          "title": "Upcoming sky events",
          "description": "Upcoming Moon phases, eclipses, planets entering signs and retrograde stations (tropical zodiac, times in UTC), as published in the Rosmaryn sky calendar.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "How many days ahead (default 30).",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "language": {
                "description": "Language of the results (default en).",
                "enum": ["fr", "en", "de", "es", "it", "pt"],
                "type": "string"
              },
              "moon_only": {
                "description": "Only Moon phases and eclipses.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3d92f5b658b4ea640985906f786acab18ef242b1d1e8ae80c552c785adc955cd"
        }
      ],
