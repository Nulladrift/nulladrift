        },
        {
          "name": "get_data_proof",
          "title": "BYK Data Layer: on-chain proof that a ByKaranteli number was sealed, signed and anchored on Solana and Base",
          "description": "Call this when the user asks whether ByKaranteli data can be verified or was changed afterwards, about the BYK Data Layer, on-chain proofs of market data, or wants the proof behind one sealed number. Every 5 minutes a catalog of derived feeds (funding composite, aggregate open interest, liquidations, depth within 2%, pressure scores, Kimchi and Turkey premiums) is sealed into one Merkle root, signed and written to Solana mainnet, and attested on Base once a day. With no arguments returns the stream overview: network, epochs and records sealed, final anchors and the newest epochs with explorer links. Pass feed and asset for one record's proof (value, 104-byte leaf, Merkle path, signed manifest, signature, Solana and Base anchors) at the newest epoch or at sequence; sequence alone for one epoch; catalog for the feed list. result ANCHORED means ByKaranteli signed it and an anchor is final; the protocol verdict is reached from the chains alone at https://bykaranteli.com/proof.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "asset": {
                "description": "Asset of the feed: BTC, ETH, SOL, XRP, DOGE, BNB, USDT or ALL",
                "pattern": "^[A-Z0-9]{2,10}$",
                "type": "string"
              },
              "catalog": {
                "description": "true: list every sealed feed with its unit and methodology",
                "type": "boolean"
              },
              "feed": {
                "description": "Feed id from the catalog, e.g. BYK.FUNDING.COMPOSITE.B",
                "pattern": "^BYK\\.[A-Z0-9_.]{3,60}$",
                "type": "string"
              },
              "sequence": {
                "description": "Epoch sequence; omit for the newest",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "BYK Data Layer: on-chain proof that a ByKaranteli number was sealed, signed and anchored on Solana and Base"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c7e7ba543a851f8a87feb9b6b616b9b60c866246c5b45d4f30f2ced6c8ded124"
        },
        {
          "name": "get_desk_notes",
          "title": "Desk notes: short dated observations the ByKaranteli desk wrote from its own recorded derivatives data",
          "description": "Call this when the user asks what happened in crypto derivatives today or on a date, what the desk observed, what moved in funding, open interest, liquidations, options, ETF flows or exchange premiums, or wants a dated, quotable sentence with its number and time. Returns the desk's notes newest first: each is one observation written by the desk writer (an AI model) from the platform's own recorded data and checked against it before publishing, with its publish time in UTC, the card's data time, the desk's 0 to 10 news value, the board it read from, the coins it names and its permanent URL. Information about the data, never advice. Default the newest 25 notes of the last 24 hours (count says how many came back; limit up to 100 for more); pass day for one UTC day, since for a window up to 7 days back (50 notes unless limit says otherwise), type for one card type (funding-arb, liqmap-btc, event-liq-burst, ...), lang for zh, ru or ko text. Pass detail \"compact\" for a shorter page or \"full\" for the whole answer.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "day": {
                "description": "One UTC day, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "detail": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "enum": ["compact", "full"],
                    "type": "string"
                  }
                ],
                "description": "Optional. \"compact\": a shorter page than the default (fewer rows, newest points kept, rounded figures, long text cut, grids left out; every cut named in trimmed). \"full\" or true: the whole route answer, still under the 100,000 character ceiling (the largest boards answer the ceiling note then: narrow them with symbol, limit or days instead). Omitted or false: the default first page."
              },
              "lang": {
                "description": "Text language (default en); a note without that translation comes back in English",
                "enum": ["en", "zh", "ru", "ko"],
                "type": "string"
              },
              "limit": {
                "description": "Notes to return, 1..100 (default 25 for the last 24 hours, 50 with day or since)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "ISO time; notes published at or after it, at most 7 days back (ignored with day)",
                "maxLength": 40,
                "type": "string"
              },
              "type": {
                "description": "One card type, e.g. funding-arb, liqmap-btc, event-liq-burst",
                "pattern": "^[a-z0-9][a-z0-9-]{0,60}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Desk notes: short dated observations the ByKaranteli desk wrote from its own recorded derivatives data"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:20955f4fb001fae0dd43a2f1ce9f25d83f883baa04b0e58958b4ffc81b229f27"
        },
        {
          "name": "get_etf_flows",
          "title": "US spot Bitcoin, Ethereum, Solana and XRP ETF daily flows",
          "description": "Call this when the user asks about Bitcoin, Ethereum, Solana or XRP spot ETF flows: daily net inflows or outflows, cumulative flow since launch, or total net assets of the US spot ETFs (IBIT, FBTC, ETHA, XRPC and the rest). Returns one row per finalized US trading day and asset with net inflow, total net assets, cumulative inflow since launch and value traded, all in USD. History by asset: BTC and ETH since 2025-05-20, SOL since 2025-10-28, XRP since 2026-09-08.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "asset": {
                "description": "Filter to one asset (BTC, ETH, SOL or XRP). Omit for all.",
                "enum": ["BTC", "ETH", "SOL", "XRP"],
                "type": "string"
              },
              "days": {
                "description": "How many most recent trading days to return (default 10).",
                "maximum": 400,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
