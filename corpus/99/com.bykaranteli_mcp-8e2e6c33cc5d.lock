        {
          "name": "get_borrow_rates",
          "title": "Margin borrow rates per venue: the cost of leverage, hourly",
          "description": "Call this when the user asks what it costs to borrow USDT, USDC, BTC, ETH or a major alt on an exchange, which venue has the cheapest borrow, whether stablecoin borrow cost is spiking, or what the carry of a basis trade is on a venue (funding minus borrow). Returns the latest annualised rate per venue and asset, 30 days of hourly series for the stablecoins and majors, and the carry table. Recorded hourly by ByKaranteli (Binance and OKX today). The series hold the last 24 hours unless hours (up to 720) or asset is passed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "asset": {
                "description": "Optional. One asset, e.g. USDT: its rates, carry and full 30-day series.",
                "pattern": "^[A-Z0-9]{2,12}$",
                "type": "string"
              },
              "hours": {
                "description": "Optional. Hours of hourly series to return (default 24, or the full 720 with asset).",
                "maximum": 720,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Margin borrow rates per venue: the cost of leverage, hourly"
          },
          "behavior": {
            "destructive": false,
