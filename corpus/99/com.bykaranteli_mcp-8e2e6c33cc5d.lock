      "serverInfo": {
        "name": "bykaranteli",
        "version": "1.1.4"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ByKaranteli serves recorded crypto derivatives market data (liquidations, funding, open interest, options, ETF flows, positioning, order flow); every market-data tool is read-only, and the account tools that change alerts or the watchlist are marked as writes. A free key is for evaluation and personal scripts; a bot, a dashboard or a polling agent that runs continuously takes a plan (Terminal, Builder or Business by use). Call a tool no more often than its data refreshes (the daily brief once a day). A 429 answer carries retry-after: wait that long before calling again instead of retrying.",
      "tools": [
        {
          "name": "add_tracked_address",
          "title": "Follow a Hyperliquid address for position alerts (writes to your account)",
          "description": "Call this when the user asks to follow, track or get alerts for a Hyperliquid address (0x followed by 40 hex characters). Every later position change of the address (opened, closed, increased, reduced, flipped) reaches the user's alert channels; the first sight is the baseline and sends nothing. Counted against the plan's address limit; the route answers terminal_required or limit_reached when it cannot add.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "address": {
                "description": "string, 0x followed by 40 hex characters",
                "type": "string"
              },
              "label": {
                "description": "string, optional name for the address, up to 40 characters",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Follow a Hyperliquid address for position alerts (writes to your account)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:a53431c2c0828f6368ab9123147a3b00af14355e83ee7310deb73dfb711e9d35"
        },
        {
          "name": "add_watchlist_symbol",
          "title": "Add a symbol to your watchlist (writes to your account)",
          "description": "Call this when the user asks to watch, follow or add a coin to their watchlist. Adds the symbol to the list named by watchlist_id, else to the default list (or the only list the account has); a symbol already on the list stays once. Returns the list's symbols after the change. Writes are rate limited per connection (sign-in or key) and each one is recorded on the account.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "symbol": {
                "description": "string, a Binance USDT-M perp or coin, e.g. SOLUSDT or SOL",
                "type": "string"
              },
              "watchlist_id": {
                "description": "string, optional list id from list_watchlists (default: the default list)",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add a symbol to your watchlist (writes to your account)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:8f84211c76972fad1bf5583e169c113f9f4a565d8044f0f5b53a5feb8c42445a"
        },
        {
          "name": "create_alert_recipe",
          "title": "Create an alert recipe (writes to your account)",
          "description": "Call this when the user asks to be alerted when a metric crosses a threshold and has agreed to the exact condition (parse_alert_text turns their words into one). Saves an alert recipe on the account: it fires when every condition holds, delivers by Telegram first with email as fallback unless channels says otherwise, and waits cooldown_hours before it fires again for the same symbol. field is one of: mark_price, pressure_score, funding_rate_pct, oi24h_pct, basis_pct, price_change_24h_pct, liq_cluster_distance_pct, usdt_peg_min_usd, usdc_peg_min_usd, liq_1h_usd, rsi_4h, ls_ratio_global, book_imbalance_2pct_pct, withdrawal_paused_venues, max_leverage_min, borrow_apr_pct, hl_whale_long_share_pct; op is one of >= > <= < ==; percent fields take percent values (0.05 means 0.05%). Pass field, op and threshold for one condition, or conditions for up to 6. scope: watchlist (default), any, or symbols with symbols. The plan sets how many recipes an account keeps; past it the tool answers with the limit. Writes are rate limited per connection (sign-in or key) and each one is recorded on the account.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "channels": {
                "description": "array, optional delivery channels: telegram | email | push | webhook; empty means Telegram first, email as fallback",
                "items": {
                  "enum": ["telegram", "email", "push", "webhook"],
                  "type": "string"
                },
                "type": "array"
              },
              "conditions": {
                "description": "array, optional up to 6 conditions {field, op, value}, all must hold (instead of field, op, threshold)",
                "items": {
                  "properties": {
                    "field": {
                      "type": "string"
                    },
                    "op": {
                      "enum": [">=", ">", "<=", "<", "=="],
                      "type": "string"
                    },
                    "value": {
                      "type": "number"
                    }
                  },
                  "required": ["field", "op", "value"],
                  "type": "object"
                },
                "type": "array"
              },
              "cooldown_hours": {
                "description": "number, optional 1..168 hours before it fires again (default 24)",
                "type": "number"
              },
              "field": {
                "description": "string, one condition's metric, e.g. funding_rate_pct",
                "type": "string"
              },
              "name": {
                "description": "string, optional name; default describes the condition",
                "type": "string"
              },
              "op": {
                "description": "string, one condition's comparison: >= | > | <= | < | ==",
                "enum": [">=", ">", "<=", "<", "=="],
                "type": "string"
              },
              "scope": {
                "description": "string, optional: watchlist (default), any, symbols",
                "enum": ["watchlist", "any", "symbols"],
                "type": "string"
              },
              "symbols": {
                "description": "array, optional up to 20 symbols, e.g. [\"BTCUSDT\", \"ETH\"]; implies scope symbols",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "threshold": {
                "description": "number, one condition's threshold, e.g. 0.05",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create an alert recipe (writes to your account)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:48065a567c9044a824d82c610a8fa6db9546f359f62a138b0ead6d0bba9a4943"
        },
