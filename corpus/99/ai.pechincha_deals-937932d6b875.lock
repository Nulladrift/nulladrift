        {
          "name": "get_similar_deals",
          "title": "Get similar deals",
          "description": "Active deals similar to a deal (same kind of product, other brands, models and stores), to compare alternatives or find a cheaper one. Content in Brazilian Portuguese.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Deal id, the UUID in https://pechincha.ai/p/<id>/<slug>",
                "format": "uuid",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Deals per page, up to 25",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
