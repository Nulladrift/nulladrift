            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "period": {
                "default": "30d",
                "enum": ["30d", "90d", "1y"],
                "type": "string"
              },
              "product_id": {
                "description": "Product id, the UUID in https://pechincha.ai/produto/<id>/<slug>",
                "format": "uuid",
                "type": "string"
