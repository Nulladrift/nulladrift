        {
          "name": "search_deals",
          "title": "Search deals",
          "description": "Search active (not expired) deals on Pechincha.ai, 10 per page by default (`limit` up to 25); with `query` the most relevant come first, without it the newest, unless `sort` says otherwise. Each result has price and old price in BRL, discount %, store, coupon code if any, publication date, the deal page URL and the product photo URL. Content is Brazilian Portuguese, so search in Portuguese: `query` matches whole words (and their start: \"celular\" finds \"celulares\") plus meaning (\"blusa de frio\" finds hoodies), so describe the item in a few words, e.g. \"moletom de capuz azul\"; with 3+ words one may be missing. Accessories that mention the term also match (\"notebook\" returns backpacks and cables too), so check titles. For a budget (\"até R$ 3.000\"), pass `max_price`; for a floor or a range (\"entre R$ 100 e R$ 200\"), pass `min_price` too. For seasonal events, gift ideas and niches (Black Friday, Dia das Crianças...), pass `theme` from list_themes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category slug from list_categories",
                "pattern": "^[a-z0-9][a-z0-9.-]*$",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Deals per page, up to 25",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum price in BRL, e.g. 3000",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "min_price": {
                "description": "Minimum price in BRL, e.g. 100",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "page": {
                "default": 1,
                "maximum": 999,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words describing the item, e.g. \"air fryer\" or \"moletom de capuz azul\"",
                "maxLength": 50,
                "minLength": 1,
                "type": "string"
              },
              "sort": {
                "default": "newest",
                "description": "featured: best deals right now (discount, engagement and freshness); cheapest: lowest price first; popular: most viewed",
                "enum": ["newest", "featured", "cheapest", "popular"],
                "type": "string"
              },
              "store": {
                "description": "Store slug from list_stores, e.g. \"amazon\"",
                "pattern": "^[a-z0-9][a-z0-9.-]*$",
                "type": "string"
              },
              "theme": {
                "description": "Theme slug from list_themes, e.g. \"black-friday\"",
                "pattern": "^[a-z0-9][a-z0-9.-]*$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "deals": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "coupon_code": {
                      "type": ["string", "null"]
                    },
                    "discount_percent": {
                      "anyOf": [
                        {
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "id": {
                      "type": "string"
                    },
                    "image_url": {
                      "description": "Product photo",
                      "type": ["string", "null"]
                    },
                    "old_price": {
                      "description": "BRL, price before the discount",
                      "type": ["number", "null"]
                    },
                    "price": {
                      "description": "BRL",
                      "type": ["number", "null"]
                    },
                    "published_at": {
                      "description": "ISO 8601",
                      "type": ["string", "null"]
                    },
                    "store": {
                      "type": ["string", "null"]
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "description": "Deal page on Pechincha.ai",
                      "type": "string"
                    }
                  },
                  "required": ["coupon_code", "discount_percent", "id", "image_url", "old_price", "price", "published_at", "store", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "page": {
                "type": "integer"
              },
              "pages": {
                "type": "integer"
              },
              "total": {
                "description": "Active deals matching the search",
                "type": "integer"
              }
            },
            "required": ["deals", "page", "pages", "total"],
            "type": "object"
          },
