          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "history": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "enough_history": {
                        "description": "false when prices span fewer than 3 different days",
                        "type": "boolean"
                      },
                      "period": {
                        "type": "string"
                      },
                      "prices": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "date": {
                              "description": "ISO 8601",
                              "type": "string"
                            },
                            "price": {
                              "description": "BRL",
                              "type": ["number", "null"]
                            }
                          },
                          "required": ["date", "price"],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "product_id": {
                        "type": "string"
                      },
                      "product_name": {
                        "type": "string"
                      },
                      "stats": {
                        "anyOf": [
                          {
                            "additionalProperties": false,
                            "properties": {
                              "avg": {
                                "description": "BRL",
                                "type": ["number", "null"]
                              },
                              "max": {
                                "description": "BRL",
                                "type": ["number", "null"]
                              },
                              "min": {
                                "description": "BRL",
                                "type": ["number", "null"]
                              },
                              "records": {
                                "type": "integer"
                              }
                            },
                            "required": ["avg", "max", "min", "records"],
                            "type": "object"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "url": {
                        "type": "string"
                      }
                    },
                    "required": ["enough_history", "period", "prices", "product_id", "product_name", "stats", "url"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "null when the product does not exist"
              }
            },
