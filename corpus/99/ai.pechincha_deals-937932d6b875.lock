      "serverInfo": {
        "name": "pechincha",
        "title": "Pechincha.ai",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Pechincha.ai is a Brazilian deals aggregator: it collects deals from Brazilian online stores and shows the price history it has recorded for each product. Deals expire 7 days after publication; a price verdict only exists when there are prices from at least 3 different days. All content is Brazilian Portuguese (pt-BR) and prices are in Brazilian reais (BRL). Deal and product ids are the UUIDs in Pechincha.ai URLs: /p/<deal id>/<slug> and /produto/<product id>/<slug>. Themes and public lists go by the slug in /s/<slug> and /lista/<slug>.",
      "tools": [
        {
          "name": "check_product_url",
          "title": "Check product URL",
          "description": "Check whether Pechincha.ai has an active deal for a product page URL from an online store. Returns the deal (price in BRL, discount, store, coupon, purchase link) and the lowest price across stores, or says there is none. Content in Brazilian Portuguese.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Product page URL at the store",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "deal": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "coupon_code": {
                        "type": ["string", "null"]
                      },
                      "discount_percent": {
                        "anyOf": [
                          {
                            "type": "integer"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "id": {
                        "type": "string"
                      },
                      "image_url": {
                        "description": "Product photo",
                        "type": ["string", "null"]
                      },
                      "old_price": {
                        "description": "BRL, price before the discount",
                        "type": ["number", "null"]
                      },
                      "price": {
                        "description": "BRL",
                        "type": ["number", "null"]
                      },
                      "published_at": {
                        "description": "ISO 8601",
                        "type": ["string", "null"]
                      },
                      "purchase_url": {
                        "type": ["string", "null"]
                      },
                      "store": {
                        "type": ["string", "null"]
                      },
                      "title": {
                        "type": "string"
                      },
                      "url": {
                        "description": "Deal page on Pechincha.ai",
                        "type": "string"
                      }
                    },
                    "required": ["coupon_code", "discount_percent", "id", "image_url", "old_price", "price", "published_at", "purchase_url", "store", "title", "url"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "null when Pechincha.ai has no active deal for the URL"
              },
              "lowest_price": {
                "description": "BRL, lowest price across stores",
                "type": ["number", "null"]
              },
              "lowest_price_store": {
                "type": ["string", "null"]
              },
              "product_id": {
                "type": ["string", "null"]
              },
              "product_url": {
                "type": ["string", "null"]
              }
            },
            "required": ["deal", "lowest_price", "lowest_price_store", "product_id", "product_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
