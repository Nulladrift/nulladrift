        {
          "name": "search_jobs",
          "description": "Search official-source job evidence. Company is a company_uri (or an employer name, resolved when unambiguous).\n\n        Location filters describe desired job locations, never the user's personal location.\n        Do not infer or request the user's current location. Use only their explicit job-search criteria.\n        Use scope=global for locations outside the US; country accepts an ISO code or full name.\n        Fresh-only results were observed within seven days, not necessarily posted then.\n        Known closed or not-yet-open application windows are excluded from fresh-only results.\n        Unknown application deadlines do not prove applications remain open.\n        Observed listings, including older observations, are returned by default; preserve warnings.\n        Results are compact. company_evidence, keyed by company_uri, holds each employer's evidence date\n        and coverage warnings. repeat_postings counts extra openings with the same company, title and\n        location, collapsed in keyword searches among the top 5,000 ranked postings; set show_repeats=true\n        to list them. total counts postings up to 10,000 (total_capped=true means more); has_more says\n        another page exists. Read warnings: they explain empty results and how a filter was read.\n        Unknown fields are omitted, never invented.\n        Set fresh_only=true when the user requests recently verified inventories.\n        posted_after is an employer publication date, YYYY-MM-DD. Unknown dates do not match.\n        Salary filters require currency and period (YEAR, MONTH, WEEK, DAY, HOUR); matching ranges\n        overlap the requested range, so the salary floor is not guaranteed. Limit is at most 100.\n        Remote does not mean worldwide eligibility. Cite official_url; never invent missing fields.\n        ",
          "inputSchema": {
            "properties": {
              "city": {
                "default": "",
                "description": "City words matched in the job location text, e.g. 'Seattle'.",
                "title": "City",
                "type": "string"
              },
              "company": {
                "default": "",
                "description": "company_uri from get_company_coverage, or an employer name such as 'Bank of America' or 'Google' (resolved when unambiguous).",
                "title": "Company",
                "type": "string"
              },
              "country": {
                "default": "",
                "description": "Job country: ISO code or name, e.g. 'DE' or 'Germany'.",
                "title": "Country",
                "type": "string"
              },
              "employment_type": {
                "default": "",
                "description": "Stated employment type. Many listings do not state one.",
                "enum": ["", "Contract or temporary", "Full-time", "Internship or early career", "Not specified", "Other", "Part-time"],
                "title": "Employment Type",
                "type": "string"
              },
              "fresh_only": {
                "default": false,
                "title": "Fresh Only",
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "title": "Limit",
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "title": "Offset",
                "type": "integer"
              },
              "pay_currency": {
                "default": "",
                "description": "Currency for salary filters, e.g. USD or EUR.",
                "title": "Pay Currency",
                "type": "string"
              },
              "pay_maximum": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Pay Maximum"
              },
              "pay_minimum": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Pay Minimum"
              },
              "pay_period": {
                "default": "",
                "description": "Pay period for salary filters; required with pay_minimum or pay_maximum.",
                "enum": ["", "DAY", "HOUR", "MONTH", "WEEK", "YEAR"],
                "title": "Pay Period",
                "type": "string"
              },
              "posted_after": {
                "default": "",
                "description": "Employer publication date floor, YYYY-MM-DD.",
                "title": "Posted After",
                "type": "string"
              },
              "query": {
                "default": "",
                "description": "Role or skill words, e.g. 'registered nurse'. Filler words such as 'jobs', 'in', 'at' are dropped only if no job matches every word (warnings say so); put places in city/region/country.",
                "title": "Query",
                "type": "string"
              },
              "region": {
                "default": "",
                "description": "State or region matched in the job location text. A U.S. state code or name ('TX' or 'Texas') searches U.S. jobs only.",
                "title": "Region",
                "type": "string"
              },
              "scope": {
                "default": "global",
                "description": "us = U.S. jobs only; global = everywhere.",
                "enum": ["us", "global"],
                "title": "Scope",
                "type": "string"
              },
              "seniority": {
                "default": "",
                "description": "Seniority classified from the title and description. Many listings are unclassified.",
                "enum": ["", "Director", "Early career", "Executive", "Manager or lead", "Not specified", "Senior individual contributor"],
                "title": "Seniority",
                "type": "string"
              },
              "show_repeats": {
                "default": false,
                "title": "Show Repeats",
                "type": "boolean"
              },
              "sort": {
                "default": "relevance",
                "enum": ["relevance", "newest", "company"],
                "title": "Sort",
                "type": "string"
              },
              "work_mode": {
                "default": "",
                "description": "Stated work arrangement. Most listings do not state one; leave empty unless required.",
                "enum": ["", "Hybrid", "Not specified", "On-site", "Remote"],
                "title": "Work Mode",
                "type": "string"
              }
            },
            "title": "search_jobsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "search_jobsDictOutput",
            "type": "object"
