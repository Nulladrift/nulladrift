          "digest": "sha256:0b4eeb4b2f72bec39bc9f44635b2fa2f2da0071279cce1d29321ed5a76932949"
        },
        {
          "name": "get_company_trends",
          "description": "Read company anchors in the last 1–26 calendar weeks of the index snapshot: observed open, new, removed, described, AI and remote counts. Company is a canonical URI. Null changes mean comparisons are unavailable. trend_status is available, limited, unavailable or unknown_company; check warnings, because a company can have current listings with no comparable weeks.",
          "inputSchema": {
            "properties": {
              "company": {
                "title": "Company",
                "type": "string"
              },
              "weeks": {
                "default": 26,
                "title": "Weeks",
                "type": "integer"
              }
            },
            "required": ["company"],
            "title": "get_company_trendsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_company_trendsDictOutput",
            "type": "object"
          },
