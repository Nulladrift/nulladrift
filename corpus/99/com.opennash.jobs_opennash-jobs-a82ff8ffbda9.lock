        },
        {
          "name": "get_company_coverage",
          "description": "Resolve an employer name or canonical URI and show observation date, coverage gaps and freshness.\n\n        Supports exact names/URIs and partial names. Returns at most 20 candidates; ask the user to\n        choose when ambiguous. Headquarters country is not a job location. An uncovered company is\n        not a company with zero jobs. Use returned company_uri for search_jobs.\n        ",
          "inputSchema": {
            "properties": {
              "company": {
                "title": "Company",
                "type": "string"
              }
            },
            "required": ["company"],
            "title": "get_company_coverageArguments",
            "type": "object"
          },
          "outputSchema": {
