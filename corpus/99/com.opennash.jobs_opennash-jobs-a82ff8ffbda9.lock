        {
          "name": "search_jobs",
          "title": "Search jobs",
          "description": "Search official job listings at Forbes Global 2000 employers by role words, company and job location. Results are compact (call get_job for a full description); company_evidence holds each employer's evidence date and coverage warnings; top_companies counts the employers with the most matches. Repeat postings (same company, title, location) are folded into repeat_postings unless show_repeats=true. Read warnings: they explain empty results and how filters were read. Location filters are where the job is, never the user's own location. Listings are observed, not confirmed open: cite official_url and dates.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "default": "",
                "description": "City words matched in the job location text, e.g. 'Seattle'.",
                "maxLength": 80,
                "type": "string"
              },
              "company": {
                "default": "",
                "description": "company_uri, or an employer name or brand such as 'Bank of America' or 'Google' (resolved when unambiguous; warnings say how).",
                "maxLength": 160,
                "type": "string"
              },
              "country": {
                "default": "",
                "description": "Job country: ISO code or name, e.g. 'DE' or 'Germany'.",
                "maxLength": 80,
                "type": "string"
              },
              "employment_type": {
                "default": "",
                "description": "Stated employment type. Many listings do not state one.",
                "enum": ["", "Contract or temporary", "Full-time", "Internship or early career", "Other", "Part-time"],
                "type": "string"
              },
              "fresh_only": {
                "default": false,
                "description": "Only employers verified in the last 7 days.",
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "description": "Results per page.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
