        {
          "name": "give_feedback",
          "description": "Tell OpenNash about a problem with these tools: what you were trying to do, what you tried, and where it went wrong. Call at most once per task, after finishing or giving up. Do not send praise. Never include names, contact details, resume content, secrets, or anything else that identifies the user. Reports are read by the OpenNash team.",
          "inputSchema": {
            "properties": {
              "category": {
                "default": "other",
                "enum": ["tool_error", "missing_capability", "wrong_data", "confusing_output", "documentation", "other"],
                "title": "Category",
                "type": "string"
              },
              "impact": {
                "default": "friction",
                "enum": ["blocked", "worked_around", "friction"],
                "title": "Impact",
                "type": "string"
              },
              "message": {
                "maxLength": 2000,
                "minLength": 20,
                "title": "Message",
                "type": "string"
              },
