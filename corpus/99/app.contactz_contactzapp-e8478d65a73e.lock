        {
          "name": "contact_find",
          "title": "Contact – Find",
          "description": "Finds the user's contacts by email address, phone number or text. Give at most one of `email`, `phone` and `query`:\n\n- `email` finds the contacts with that address. Case does not matter.\n- `phone` finds the contacts with that number, however it is formatted.\n- `query` searches the way the Contacts screen's search does.\n- With none of them, every contact is listed, newest first.\n\nDeleted and merged contacts are never returned. For the next page, send the `nextCursor` you got as `cursor`, with the same filter. The last page has no `nextCursor`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "The previous page's `nextCursor`.",
                "type": "string"
              },
              "email": {
                "type": "string"
              },
              "limit": {
                "description": "Page size; 50 when omitted.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "phone": {
                "type": "string"
              },
              "query": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e71534dbb3eacc80b5d137bb6bab36879a8e92ca39d9541d0e7a65478cf4f0e6"
        },
        {
          "name": "contact_read",
          "title": "Contact – Read",
          "description": "Returns one contact. `id` is the contact's `id` or its `publicId`, such as `CS-0042`. A deleted or merged contact is a 404, and so is another user's contact.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
