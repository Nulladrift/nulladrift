                          "type": "boolean"
                        },
                        "value": {
                          "type": "string"
                        }
                      },
                      "required": ["label", "value"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "prefix": {
                    "type": "string"
                  },
                  "suffix": {
                    "type": "string"
                  },
                  "urls": {
                    "items": {
                      "additionalProperties": false,
                      "description": "One value with its label, such as a phone number labelled \"Mobile\". The label is the one the account gave the value, or an empty string when it has none.\n",
                      "properties": {
                        "label": {
                          "type": "string"
