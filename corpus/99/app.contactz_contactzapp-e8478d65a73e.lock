        {
          "name": "contact_change",
          "title": "Contact – Change",
          "description": "Changes a contact, as editing it in ContactZapp does. Only the fields you send change. A field you leave out keeps its value.\n\nThe change goes to every two-way account the contact is in, never to a read-only one. History records it as the user's change and names the API key or the connected app that made it.\n\nA contact waiting in Review duplicates cannot be changed until the review is decided: 409, `contact_pending_review`. Send an `Idempotency-Key` header to make a retry safe.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "Idempotency-Key": {
                "description": "Any string of 1 to 255 bytes you choose for this write, such as a UUID. Repeat the request with the same key and body within 24 hours, and you get the first result back and nothing is written twice. The same key with a different body is a 422.",
                "type": "string"
              },
              "body": {
                "description": "The body of a contact create or update: the contact fields a read shows that a write can change, under the same names and in the same shapes, and nothing else.\n\nA field the body carries that is not one of them is refused with a 400 `unknown_field`, and nothing is written. That includes the read-only `id`, `publicId`, `displayName` and `updatedAt`, so writing back a whole contact as a read returned it answers 400 `unknown_field`: send only the fields you change.\n\nA create writes the fields the body carries. An update is change-only: a field the body does not carry keeps its value, a field it carries empty (`\"\"`, `[]`, or a date whose year, month and day are all `0`) is cleared, and a list it carries replaces the stored list. `\"birthday\": null` clears the birthday too, and a birthday the body does not carry is kept. Fields ContactZapp keeps that a read does not show are never changed by an update.\n",
                "properties": {
                  "addresses": {
                    "items": {
                      "additionalProperties": false,
                      "description": "One value with its label, such as a phone number labelled \"Mobile\". The label is the one the account gave the value, or an empty string when it has none.\n",
                      "properties": {
                        "label": {
                          "type": "string"
                        },
                        "preferred": {
                          "description": "Marks the preferred entry of its field: the phone number to call, the address to write to. Missing or false means nothing has said so; it does not mean the entry is explicitly not preferred. If your tool does not model preference, leave it out of every entry, so you do not clear the user's choice. Not every provider stores it, so do not expect it to carry over everywhere.\n",
                          "type": "boolean"
                        },
                        "value": {
                          "type": "string"
                        }
                      },
                      "required": ["label", "value"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "birthday": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "description": "A calendar date, any part of which may be missing. A part that is missing is `0`. A birthday with no year is `{\"year\": 0, \"month\": 3, \"day\": 15}`.\n\nNever fill in a missing year yourself: check whether the date has one, and do not show `0` as a year. The API never sends `0` to mean year zero. A date has no time and no time zone.\n",
                        "properties": {
                          "day": {
                            "description": "1-31, or `0` when the date states none.",
                            "type": "integer"
                          },
                          "month": {
                            "description": "1-12, or `0` when the date states none.",
                            "type": "integer"
                          },
                          "year": {
                            "description": "The Gregorian year, or `0` when the date states none.",
                            "type": "integer"
                          }
                        },
                        "required": ["day", "month", "year"],
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Null when the contact has none. In a write, null clears the stored birthday, and so does a date whose year, month and day are all `0`; an absent field keeps it.\n"
                  },
                  "emails": {
                    "items": {
                      "additionalProperties": false,
                      "description": "One value with its label, such as a phone number labelled \"Mobile\". The label is the one the account gave the value, or an empty string when it has none.\n",
                      "properties": {
                        "label": {
                          "type": "string"
                        },
                        "preferred": {
                          "description": "Marks the preferred entry of its field: the phone number to call, the address to write to. Missing or false means nothing has said so; it does not mean the entry is explicitly not preferred. If your tool does not model preference, leave it out of every entry, so you do not clear the user's choice. Not every provider stores it, so do not expect it to carry over everywhere.\n",
                          "type": "boolean"
                        },
                        "value": {
                          "type": "string"
                        }
                      },
                      "required": ["label", "value"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "firstName": {
                    "type": "string"
                  },
                  "jobTitle": {
                    "type": "string"
                  },
                  "labels": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "lastName": {
                    "type": "string"
                  },
                  "middleName": {
                    "type": "string"
                  },
                  "nickname": {
                    "type": "string"
                  },
                  "notes": {
                    "type": "string"
                  },
                  "organization": {
                    "type": "string"
                  },
                  "phones": {
                    "items": {
                      "additionalProperties": false,
                      "description": "One value with its label, such as a phone number labelled \"Mobile\". The label is the one the account gave the value, or an empty string when it has none.\n",
                      "properties": {
                        "label": {
