        {
          "name": "contact_create",
          "title": "Contact – Create",
          "description": "Adds a contact. If the user already has this person, the values may go to that contact instead:\n\n- If the user's Auto-Merge level covers the match, the values are added to the existing contact: 200, `merged`.\n- Otherwise a new contact is created: 201, `created`. If it may be a duplicate, it also waits in Review duplicates: 201, `needs_review`.\n\nContactZapp saves the contact in one two-way account: the first one the user linked that keeps an address book and is not paused. The next sync copies it to the user's other two-way accounts, never to a read-only one.\n\nA create is never refused for the plan's contact limit. Over the limit, the contact is created frozen and `contact.frozen` is true. ContactZapp keeps a frozen contact but does not sync it until the user upgrades or frees a place.\n\nSend an `Idempotency-Key` header to make a retry safe.",
