                        "preferred": {
                          "description": "Marks the preferred entry of its field: the phone number to call, the address to write to. Missing or false means nothing has said so; it does not mean the entry is explicitly not preferred. If your tool does not model preference, leave it out of every entry, so you do not clear the user's choice. Not every provider stores it, so do not expect it to carry over everywhere.\n",
                          "type": "boolean"
