        },
        {
          "name": "event_list",
          "title": "Event – List",
          "description": "Lists the events of one type, newest first. Zapier, Make and n8n poll this to start an automation.\n\nEach item's `id` never changes. Poll again and the items you already have come back with the same ids, with new ones on top. Skip the ids you have seen.\n\n- `contact.created`, `contact.updated`, `contacts.merged` and `account.needs_attention` come from History, and are kept as long as History keeps them.\n- `match.needs_review` lists each contact flagged as a possible duplicate and not yet merged. Its `id` changes when the flag is raised again.\n\nEach item carries what an automation needs, with no second call:\n\n- the contact's fields, or null once the contact is deleted or merged\n- for a merge, the ids of the contacts it absorbed\n- for an account, the account and why it needs attention",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "The previous page's `nextCursor`, to read further back.",
                "type": "string"
              },
              "event": {
                "description": "The events the API reports, as polling triggers.\n\n- `contact.created`: a contact was added.\n- `contact.updated`: a contact was changed.\n- `contacts.merged`: contacts were merged into one.\n- `match.needs_review`: a contact is flagged as a possible duplicate and waits in Review duplicates.\n- `account.needs_attention`: a linked account needs the user to look at it.\n",
                "enum": ["contact.created", "contact.updated", "contacts.merged", "match.needs_review", "account.needs_attention"],
                "type": "string"
              },
              "limit": {
                "description": "Page size; 50 when omitted.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["event"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e395596d6cf6cfd815976c54c7564dc1c3a6dee032be5df31094a0af47836e0f"
        },
