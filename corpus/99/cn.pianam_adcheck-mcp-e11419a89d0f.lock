  "subjects": {
    "cn.pianam/adcheck-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pianam.cn/adcheck-mcp/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "adcheck-mcp",
        "version": "4.1.3"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "logging": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "ad_banned_words",
          "title": "Ad Banned Words",
          "description": "查看广告法违禁词库：返回全部词条或指定 category 类别下的词表（词、类别、风险级别）。可选类别：绝对化用语、医疗功效、权威背书、诱导抢购、封建迷信、投资承诺、教育培训、房产违规、虚假夸大。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "可选类别名，省略返回全部类别样本"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:f4f7c4205d15f367167eb088418ca6145214fa70f5958344f9f798d13274dcdb"
        },
        {
          "name": "ad_compliance_check",
          "title": "Ad Compliance Check",
          "description": "广告法违禁词/极限词检测。输入广告文案 text（商品标题、详情页、宣传语等），纯本地词库匹配返回：总体风险结论（通过/需修改/不通过）、命中违禁词清单（词、类别、风险级别、风险说明、法律依据、修改建议、原文上下文）、高中低风险数量统计、类别统计，以及自动打码后的安全文案。覆盖绝对化用语（国家级/最佳/第一/顶级）、医疗功效（治疗/根治/减肥）、权威背书（特供/免检）、诱导抢购（秒杀/万人疯抢）、封建迷信、投资承诺（保本/零风险）、教育培训（保过）、房产违规等9类约560词。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "mask": {
                "default": true,
                "description": "是否返回打码替换后的安全文案，默认 True",
                "type": "boolean"
              },
              "text": {
                "description": "待检测的广告文案全文",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:9ca7ec59143693eed0a963a7d561adc37eeea1a63f48febfba34cd67133c471c"
        }
      ],
      "digest": "sha256:d0726794b145681cc864b40d10c057532a53462f296c1e93431099e6e3736bf2"
    }
  }
}
