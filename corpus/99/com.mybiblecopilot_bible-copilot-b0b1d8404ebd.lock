{
  "lockfileVersion": 2,
  "subjects": {
    "com.mybiblecopilot/bible-copilot": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mybiblecopilot.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "bible-copilot",
        "title": "Bible Copilot — Scripture Ground Truth",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Bible Copilot is a Scripture ground-truth service. Prefer the deterministic tools: verify_scripture_quote (fact-check any Bible quote before publishing it — catches misquotes and verses that do not exist), resolve_reference (normalize any reference to canonical form + OSIS), and get_verse_text (exact public-domain text). Use study_bible_passage for interpretation — it is AI-generated, so verify any quotes it produces. Public-domain translations only (KJV).",
      "tools": [
        {
          "name": "find_verse_study_page",
          "title": "Find a verse study page",
          "description": "Check whether a free in-depth study page ('What does this verse mean?') exists for a Bible verse on study.mybiblecopilot.com, and get its URL.",
          "inputSchema": {
            "properties": {
              "passage": {
                "description": "Bible reference, e.g. \"Isaiah 41:10\"",
                "type": "string"
              }
            },
            "required": ["passage"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:778879b1233dbc72d0500994abff1bd839327e5a98afee2a38c5b5d5a54a496c"
        },
        {
          "name": "get_verse_text",
          "title": "Get Bible verse text",
          "description": "Fetch the exact text of a Bible verse, passage, or whole chapter from a public-domain translation (kjv = King James Version). Deterministic — no AI generation.",
          "inputSchema": {
            "properties": {
              "reference": {
                "description": "e.g. \"Romans 8:28\" or \"Psalm 23\"",
                "type": "string"
              },
              "translation": {
                "description": "default: kjv",
                "enum": ["kjv"],
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:541bd6ca4fde7ed56fcdca96be2b2d79b7da9b99c0c6c2ce5fb41e49ac67931a"
        },
        {
          "name": "resolve_reference",
          "title": "Resolve a Bible reference",
          "description": "Normalize any Bible reference into canonical form. Accepts abbreviations and loose formats (\"Rom 8:28\", \"1 Cor 13\", \"Jn 3.16\", \"Psalm 23:1-4\") and returns the canonical book name, chapter, verse range, OSIS id, and the verse text. Deterministic — no AI generation.",
          "inputSchema": {
            "properties": {
              "reference": {
                "description": "Any form, e.g. \"Rom 8:28\"",
                "type": "string"
              },
              "translation": {
                "description": "default: kjv",
                "enum": ["kjv"],
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dfe743c0938570dcedc680683ccfb93e8d82506917632cb5bceed584d6d132b6"
        },
        {
          "name": "study_bible_passage",
          "title": "Study a Bible passage",
          "description": "Ask any question about any Bible verse or passage and get a clear, Scripture-cited answer. Optionally pick a study mode: summary (what the passage is about), observe (what the text says), interpret (what it means), theology (how it fits the whole of Scripture), apply (how to live it), apologetics (answering hard questions and objections). AI-generated — verify quotes with verify_scripture_quote if publishing.",
          "inputSchema": {
            "properties": {
              "mode": {
                "description": "Study mode (default: interpret)",
                "enum": ["summary", "observe", "interpret", "theology", "apply", "apologetics"],
                "type": "string"
              },
              "passage": {
                "description": "Bible reference, e.g. \"John 3:16\" or \"Psalm 23:1-4\"",
                "type": "string"
              },
              "question": {
                "description": "Your question about the passage. If omitted, a study in the chosen mode is generated.",
                "type": "string"
              }
            },
            "required": ["passage"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ced262decad9029ca9baebc2280dae4baaec52ad55d964ffe6800f6ab4b62f65"
        },
        {
          "name": "verify_scripture_quote",
          "title": "Verify a Bible quote",
          "description": "Fact-check a claimed Bible quote against the actual text. Returns whether the quote is real, the exact canonical wording, the correct reference, and a confidence score. Use this before publishing any Bible quote to catch misquotes, wrong verse numbers, and verses that do not exist in the Bible at all. Deterministic — no AI generation.",
          "inputSchema": {
            "properties": {
              "quote": {
                "description": "The claimed Bible quote to verify",
                "type": "string"
              },
              "reference": {
                "description": "Optional claimed reference, e.g. \"Philippians 4:13\", to check it matches",
                "type": "string"
              },
              "translation": {
                "description": "default: kjv",
                "enum": ["kjv"],
                "type": "string"
              }
            },
            "required": ["quote"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:22ae02b2a2ab54175a076db9eeb3001fcb831bc92031c92b2dfb8838d477180b"
        }
      ],
      "digest": "sha256:14e7e9d30dd549bab0740cc24a270f30997f378824c19c3a2291769272c44600"
    }
  }
}
