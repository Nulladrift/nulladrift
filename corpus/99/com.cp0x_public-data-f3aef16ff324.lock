          "title": "Check interface restrictions",
          "description": "Read declared and observed geo-restrictions for a DeFi interface. Use this when checking a protocol's interface restrictions, optionally for a country.",
          "inputSchema": {
            "properties": {
              "country": {
                "anyOf": [
                  {
                    "maxLength": 2,
                    "pattern": "^[A-Za-z]{2}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "ISO-3166 alpha-2 country code; omit for all observed countries.",
                "maxLength": 2,
                "title": "Country"
              },
              "protocol": {
                "description": "Protocol name or interface identifier to match.",
                "maxLength": 100,
                "title": "Protocol",
                "type": "string"
              }
            },
            "required": ["protocol"],
            "title": "check_interface_restrictionsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check interface restrictions"
