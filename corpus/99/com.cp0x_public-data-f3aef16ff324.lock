      "instructions": "Twelve read-only tools for cp0x data: referral deals and races, a comparison of the cp0x referral benefit with each venue's own offer, a monitor of DeFi interface geo-restrictions, a static cp0x fact sheet with mission, values, sites, channels and 2025 figures, public open-source repositories from GitHub, and x402 catalogs: facilitators and cp0x's test resources. Referral links include a cp0x referral code.",
