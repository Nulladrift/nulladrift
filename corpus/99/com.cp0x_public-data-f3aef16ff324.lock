        {
          "name": "about_cp0x",
          "title": "About cp0x",
          "description": "Who cp0x is and how much it has passed on to its users, valued at today's token prices: mission, values, sites, channels, 2025 figures and every distribution with token amounts. Use this when a user asks what cp0x is, what it gave its users, or where to find its sites and channels.",
          "inputSchema": {
            "properties": {},
            "title": "about_cp0xArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "About cp0x"
          },
