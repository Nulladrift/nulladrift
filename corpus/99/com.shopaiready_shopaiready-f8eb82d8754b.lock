{
  "lockfileVersion": 2,
  "subjects": {
    "com.shopaiready/shopaiready": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.shopaiready.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "shopaiready",
        "version": "0.0.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "audit_product_page",
          "title": "Audit a product page",
          "description": "Audits one public product page: schema.org Product/Offer (JSON-LD), price/currency/availability coherence with visible text and og:price, GTIN/MPN check digit, images, return/shipping markup, and robots.txt / noindex access for OAI-SearchBot, Googlebot and other AI bots. Cannot verify WAF/User-Agent blocking.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "url": {
                "description": "URL público http(s). (Caminhos locais só com SHOPAIREADY_ALLOW_LOCAL=1, para demo/testes.)",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Audit a product page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:709a2ba5eb6fc8b72e4f6d7201b16cc4820e80c46a2b2a426ea3c6baf706f731"
        },
        {
          "name": "check_store_ai_readiness",
          "title": "Check store AI-shopping readiness",
          "description": "Audits a public store homepage (+ robots.txt, sitemap, one sampled product page) and returns a heuristic 0–100 AI-shopping readiness score with the top ≤10 gaps and fixes (schema.org Product/Offer, AI search bots in robots.txt, sitemap, HTTPS, policies). Read-only; no login; does not detect WAF/CDN bot blocking.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "store_url": {
                "description": "URL público http(s). (Caminhos locais só com SHOPAIREADY_ALLOW_LOCAL=1, para demo/testes.)",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["store_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check store AI-shopping readiness"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:71ce316b27522723a122c21964a32cbd2195df1bb946eb8fd23e56d0deffd647"
        },
        {
          "name": "draft_supplemental_feed",
          "title": "Draft supplemental feed (CSV)",
          "description": "Turns structured issues (the `issues` array returned by validate_feed_for_google / validate_feed_for_chatgpt / audit_product_page) into CSV text of suggested corrections (title, gtin, identifier_exists, product_type, availability, price, seller_name, Q&A template columns). Read-only: only returns file content; never writes to Merchant Center or OpenAI. Unknown values are left as TODO — nothing is invented.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "include_qa": {
                "description": "Incluir coluna question_and_answer com perguntas-modelo (default true).",
                "type": "boolean"
              },
              "issues": {
                "description": "Array `issues` devolvido por uma das outras ferramentas.",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "context": {
                      "additionalProperties": {
                        "type": "string"
                      },
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "current": {
                      "type": "string"
                    },
                    "field": {
                      "type": "string"
                    },
                    "item_id": {
                      "type": "string"
                    },
                    "message": {
                      "default": "",
                      "type": "string"
                    },
                    "severity": {
                      "enum": ["error", "warning", "info"],
                      "type": "string"
                    },
                    "suggestion": {
                      "type": "string"
                    },
                    "target": {
                      "enum": ["chatgpt", "google", "store", "page"],
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "field", "severity"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "language": {
                "enum": ["pt", "en"],
                "type": "string"
              },
              "seller_name": {
                "type": "string"
              },
              "target": {
                "description": "Formato de saída; por omissão inferido das issues.",
                "enum": ["google", "chatgpt"],
                "type": "string"
              }
            },
            "required": ["issues"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Draft supplemental feed (CSV)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f624f64a435c23925e022db18856bc8d4df7aa6ac3ab3af480b02efe30ad85f2"
        },
        {
          "name": "validate_feed_for_chatgpt",
          "title": "Validate feed for ChatGPT shopping",
          "description": "Fetches a public product feed (XML RSS/Atom, CSV, TSV, JSONL) and checks it against the OpenAI Commerce products feed spec (required: item_id, title, description, url, brand, seller_name, image_url, availability, price; plus GTIN check digit, sale_price, placeholders). Returns % SKUs OK, issue counts and sample issues.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "feed_url": {
                "description": "URL público http(s). (Caminhos locais só com SHOPAIREADY_ALLOW_LOCAL=1, para demo/testes.)",
                "minLength": 1,
                "type": "string"
              },
              "seller_name": {
                "description": "Opcional: nome da loja para sugerir em seller_name em falta.",
                "type": "string"
              }
            },
            "required": ["feed_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Validate feed for ChatGPT shopping"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c8a588912fe5bd1404f23988f6e3c7d470d2a2650522fca88b4ed2a4c4ac94aa"
        },
        {
          "name": "validate_feed_for_google",
          "title": "Validate feed for Google Shopping",
          "description": "Fetches a public product feed and checks Google Merchant Center required/recommended attributes (id, title, description, link, image_link, availability, price, brand, gtin/mpn/identifier_exists, condition, apparel attributes, product_type…) plus coverage of the May-2026 conversational attributes (question_and_answer, related_product, variant_option, …) as a stub. Returns % SKUs OK + issues.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "feed_url": {
                "description": "URL público http(s). (Caminhos locais só com SHOPAIREADY_ALLOW_LOCAL=1, para demo/testes.)",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["feed_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Validate feed for Google Shopping"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e7412e6ee2ed3a02bf90035b1378c9413d5dc9a080f096fb12718e569a9cb09e"
        }
      ],
      "digest": "sha256:a9d3a7cf433cff70911391779d9a2383c86e3b4815eec01ea882e320ab49ef56"
    }
  }
}
