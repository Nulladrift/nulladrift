      "serverInfo": {
        "name": "mailsecuritytools",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Mail Security Tools: check a domain's email security. check_domain_email_security (free) returns MX, SPF, DMARC and DKIM. email_security_score ($0.01) grades it 0-100. email_fix_plan ($1) returns the exact DNS records to publish. check_email_address ($0.01) checks one address. bulk_email_security_score ($0.50) scores up to 100 domains at once. For daily change alerts on up to 25 domains, POST /v1/watch over HTTP ($0.30 for 30 days, webhook); watch_status (free) reads a watch. Payment is x402 USDC on Base in _meta['x402/payment']; invalid or failed calls are not charged. Daily monitoring: InboxGuards (inboxguards.com).",
      "tools": [
        {
          "name": "bulk_email_security_score",
          "description": "Score up to 100 domains' email security in one call (SPF 30, DMARC 40, DKIM 25, MX 5 from live DNS): per-domain score, grade and issues, plus a summary with grade counts, domains missing DMARC or SPF, and the worst 10. For MSPs and agents checking a client or vendor list. Costs $0.50 USDC via x402; errors are not charged.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "domains": {
                "description": "Domains, 1-100",
                "items": {
                  "maxLength": 320,
                  "minLength": 3,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["domains"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 0.5
          },
          "digest": "sha256:47bc9d5984bf4ea2d75509648840501c2e2920fe15b758e496bfda079fd314cb"
        },
        {
          "name": "check_domain_email_security",
          "description": "Free. Look up a domain's MX, SPF (record, DNS lookup count, all qualifier), DMARC (policy, rua) and DKIM (common selectors, key size) from live DNS and list issues. No payment.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "domain": {
                "description": "Domain, e.g. example.com (an email or URL on it also works)",
                "maxLength": 320,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check domain email security (free)"
          },
          "behavior": {
