        "name": "com.everyprogram/programmes",
        "title": "Every Program",
        "version": "1.0.0",
        "description": "Study programmes worldwide with a source and check date for every value.",
        "websiteUrl": "https://everyprogram.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
