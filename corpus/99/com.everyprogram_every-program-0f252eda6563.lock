                    "enum": ["value", "conflicting", "unknown", "not_applicable", "on_request_form", "on_request_email", "login", "blocked", "not_published", "restricted"],
                    "title": "State",
                    "type": "string"
                  }
                },
                "required": ["state"],
                "title": "Tuition",
                "type": "object"
              }
