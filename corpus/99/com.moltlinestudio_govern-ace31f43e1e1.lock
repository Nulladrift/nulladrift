      },
      "instructions": "Moltline Agent Governance & MCP Auditor: inventory and audit your agent fleet. Free: audit_mcp_config (scope/secret/version risks in an MCP config), scope_check (over-privileged tools by blast radius), audit_skill_file (injection/secret/concealment smells), injection_scan, inventory_report, agent_readiness_scan (score any public domain against 21 agent-readiness checks and return the fix for each failure). Premium (license): governance_policy, get_auditor_persona. Every finding names the risk and a concrete remediation.",
      "tools": [
        {
          "name": "agent_readiness_scan",
          "title": "Agent Readiness Scan",
          "description": "Score a public domain against 21 agent-readiness checks. FREE.\n\nUse when you need to know whether an autonomous agent can discover, read,\nuse or pay a website - your own, or a vendor you are evaluating before\nrecommending it. Typical input {\"domain\": \"example.com\"} returns\n{\"score\": 8, \"total\": 21, \"grade\": \"F\", \"passed\": [...], \"failed\":\n[{\"title\": \"...\", \"detail\": \"...\", \"fix\": \"...\"}], \"report_url\": \"...\"}\nwhere report_url is a permanent shareable page for the same result.\n\nNot for auditing an MCP client configuration (audit_mcp_config) and not\nfor scanning text for injection (injection_scan) - this one reaches out\nover the network and fetches public URLs on a live domain. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"The readiness scanner is not reachable right now.\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "A public hostname such as example.com. A full URL is accepted\nand reduced to its host. Hostnames that resolve to private or\ninternal addresses are refused.",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Agent Readiness Scan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:292079487a6158a769ef9ad8ef31ce67e9603c53a7c7987ea8a17f020f64475b"
        },
        {
          "name": "audit_mcp_config",
          "title": "Audit Mcp Config",
          "description": "Audit an MCP server config for risk-ranked posture findings. FREE.\n\nFlags exposed machine credentials in the config, required inputs that\naren't gated/optional, unpinned versions, over-broad env access,\ndangerous auto-run flags, whole-disk or home-folder roots, wildcard\nallow-lists and remote servers over plain HTTP. In a client config\n(mcpServers or servers block) each server is checked on its own:\nunpinned packages and credentials written into the file are named. It never echoes any matched secret value back.\nTypical input {\"config\": \"<mcpize.yaml, mcp.json, or a Claude/Cursor\nservers block>\"} returns {\"posture_score\": 0-100, \"verdict\": \"...\",\n\"findings\": [{\"line\": N, \"severity\": 1-5, \"issue\": \"...\", \"fix\": \"...\"}],\n\"note\": \"...\"}.\n\nUse on a server configuration document. Not for a skill or instruction\nfile (audit_skill_file) and not for untrusted content an agent is about to\nread (injection_scan). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"}. Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "config": {
                "description": "The MCP config to audit, pasted as text or JSON\n(mcpize.yaml, mcp.json, or a Claude/Cursor servers block).",
                "type": "string"
              }
            },
            "required": ["config"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Audit Mcp Config"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:24714d0bb8207ee28c5ce06c86e6e63907ad6244931a8ce5ceda78bac787dcc1"
        },
        {
          "name": "audit_skill_file",
          "title": "Audit Skill File",
          "description": "Audit an agent skill or instruction file before you trust it. FREE.\n\nChecks for governance smells: prompt-injection and guardrail-bypass\nphrasing, concealment instructions ('don't tell the user'), exfiltration\nlanguage, and exposed credential material. Typical input {\"content\":\n\"<SKILL.md, system prompt, or tool description text>\"} returns\n{\"verdict\": \"reject: do not install\" | \"review before install: ...\" |\n\"no governance red flags on a pattern pass\", \"findings\": [{\"severity\":\n1-5, \"issue\": \"...\", \"line\": N}], \"note\": \"...\"}. Also checks for\napproval-bypass steps and references to credential stores.\n\nUse before trusting a skill or instruction file that came from outside\nyour own repository. Not for arbitrary untrusted input at run time\n(injection_scan). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"}. Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "content": {
                "description": "Full text of the skill file, system prompt, or tool\ndescription to audit.",
                "type": "string"
              }
            },
            "required": ["content"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Audit Skill File"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:739ff7df722ae8f59ccef11a2127f6cb16540bbf77ccdce80807ab49cdd03256"
        },
        {
          "name": "get_auditor_persona",
          "title": "Get Auditor Persona",
          "description": "Load the Governance Auditor persona for consistent fleet audits. PREMIUM (license).\n\nThe persona is methodical, evidence-driven, and allergic to 'it's\nprobably fine'. Takes no arguments. Returns {\"persona\": ...,\n\"identity\": ..., \"rules\": [\"...\", ...], \"opening_move\": \"...\"} ready to\nadopt as a system prompt.\n\nUse to keep repeated audits consistent in voice and rigor. Not for running\nan audit - the audit tools do that. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"}. Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Auditor Persona"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:4fb1a40608825a4006aab2302085dd4d8013e93509a8a1b98be378b180a65faa"
        },
        {
          "name": "governance_policy",
          "title": "Governance Policy",
          "description": "Generate an audit-ready agent-governance policy for a fleet. PREMIUM (license).\n\nCovers inventory cadence, ownership rules, least-privilege approval\ngates, injection defense, logging/retention, and decommissioning\ntriggers. Typical input {\"fleet_context\": \"20 agents, 3 with shell\naccess, one finance bot\"} returns {\"policy\": ..., \"sections\": {...},\n\"context_note\": ..., \"audit_checklist\": [\"...\", ...]}.\n\nUse when a fleet needs a written policy document. Not for assessing what\nthe fleet currently does (inventory_report, audit_mcp_config). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"}. Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fleet_context": {
                "default": "",
                "description": "Optional plain-language description of the fleet\n(size, capabilities, sensitive systems) used to tailor the\npolicy; empty returns the generic baseline.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Governance Policy"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:83ba3470f0026ba97812bc6256af97402c9f61d561906cac77cd9cd8a4ad2b57"
        },
        {
          "name": "injection_scan",
          "title": "Injection Scan",
          "description": "Scan untrusted text for prompt-injection patterns before ingestion. FREE.\n\nUse on any web page, email, or document an agent is about to ingest to\ncatch prompt-injection, concealment, approval-bypass and data-exfiltration\npatterns, and text addressed to AI agents, before they reach the agent's\ncontext. Typical input {\"text\": \"<untrusted content>\"}\nreturns {\"injection_suspected\": bool, \"count\": N, \"hits\": [{\"line\": N,\n\"pattern\": \"...\", \"text\": \"<flagged line>\"}], \"note\": \"...\"}.\n\nNot for reviewing a skill file you control (audit_skill_file), and a clean\nresult is not a guarantee of safety - it reports pattern matches only. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"}. Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "text": {
                "description": "The untrusted content to scan, pasted as a single string.",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Injection Scan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:219e5e50361016b8d9d404936ef02584864c66d050450159eb93bc0a548ab259"
        },
        {
          "name": "inventory_report",
          "title": "Inventory Report",
          "description": "Build a governance inventory with risk tiers from a raw agent list. FREE.\n\nTurns a list of agents / MCP servers / skills into an audit-ready\nsummary with critical/elevated/standard tiers and unowned-agent flags.\nTypical input {\"items\": \"[{\\\"name\\\": \\\"deploy-bot\\\", \\\"owner\\\":\n\\\"ana\\\"}]\"} returns {\"total\": N, \"tiers\": {\"critical\": N, ...},\n\"unowned_agents\": [...], \"inventory\": [{\"name\": ..., \"owner\": ...,\n\"tier\": ..., \"orphaned\": bool}], \"reading\": \"...\", \"note\": \"...\"}.\n\nUse to turn a raw agent list into risk tiers. Not for auditing any single\nagent in depth (audit_mcp_config, scope_check). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"}. Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "items": {
                "description": "The fleet as a string (a JSON array of {name, owner?,\ncapabilities?, last_seen?} objects, or plain newline-separated\nagent names). capabilities can be a string or a list of tool\nnames; \"tools\" and \"permissions\" are read the same way.",
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Inventory Report"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:a92d3a02bcb048b57b7c9c325bb30e9c084a674f757bcabc127637e87a710f43"
        },
        {
          "name": "scope_check",
          "title": "Scope Check",
          "description": "Score the blast radius of every tool in a permission manifest. FREE.\n\nRanks each tool by capability risk (command exec > money/delete >\nfile-write/messaging/record changes > read > network) and flags the over-privileged\nones that need approval gates. Typical input {\"tools\": \"[\\\"run_shell\\\",\n\\\"read_docs\\\"]\"} returns {\"tools_scored\": N, \"high_risk_tools\": N,\n\"ranking\": [{\"tool\": ..., \"blast_radius\": 0-5, \"capabilities\": [...]}],\n\"recommendation\": [\"...\"], \"note\": \"...\"}.\n\nUse on a permission manifest to rank tools by blast radius. Not for the\nconfiguration that mounts them (audit_mcp_config). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"}. Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "tools": {
                "description": "The manifest as a string (a JSON array of tool names or\n{name, description} objects, a JSON object of name->description,\nor plain newline-separated names).",
                "type": "string"
              }
            },
            "required": ["tools"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Scope Check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
