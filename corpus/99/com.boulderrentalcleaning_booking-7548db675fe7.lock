        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://boulderrentalcleaning.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "boulder-rental-cleaning",
        "title": "Boulder Rental Cleaning",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only tools for Boulder Rental Cleaning (Boulder, CO short-term and festival rental cleaning). Use get_services_and_prices for what is offered, get_quote for an exact price, check_availability for open crew windows. Booking requires the host to sign the service agreement at https://boulderrentalcleaning.com/book. Operated by Rivera Property Group LLC. Not affiliated with the Sundance Institute or the Sundance Film Festival.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Open crew windows",
          "description": "Open morning/afternoon crew windows per date in Boulder, CO between two dates (max 62 days).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "to": {
                "description": "YYYY-MM-DD",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c5c22c5bfab432061e7a0754f21d70a42964b34c0da642d5a648514004b09c48"
        },
        {
          "name": "get_quote",
          "title": "Instant price quote",
          "description": "Price one or more cleans for a Boulder rental home. Uses the same price engine as the booking page. Dates are optional for a ballpark; include date and window for exact festival or rush pricing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "baths": {
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "bedrooms": {
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "checkIn": {
                "description": "Guests' check-in date, YYYY-MM-DD",
                "type": "string"
              },
              "checkOut": {
                "description": "Guests' check-out date, YYYY-MM-DD",
                "type": "string"
              },
              "cleans": {
                "additionalProperties": false,
                "description": "Pick any of prep, mid, out. All three together take the bundle discount.",
                "properties": {
                  "mid": {
                    "additionalProperties": false,
                    "properties": {
                      "addons": {
                        "items": {
                          "enum": ["restock", "linen", "trash", "steam", "snow", "staging", "lockbox", "ownerprep"],
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "date": {
                        "description": "YYYY-MM-DD (America/Denver)",
                        "type": "string"
                      },
                      "window": {
                        "description": "am = crew arrives 8-9 AM, pm = 12-1 PM",
                        "enum": ["am", "pm"],
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "out": {
                    "additionalProperties": false,
                    "properties": {
                      "addons": {
                        "items": {
                          "enum": ["restock", "linen", "trash", "steam", "snow", "staging", "lockbox", "ownerprep"],
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "date": {
                        "description": "YYYY-MM-DD (America/Denver)",
                        "type": "string"
                      },
                      "window": {
                        "description": "am = crew arrives 8-9 AM, pm = 12-1 PM",
                        "enum": ["am", "pm"],
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "prep": {
                    "additionalProperties": false,
                    "properties": {
                      "addons": {
                        "items": {
                          "enum": ["restock", "linen", "trash", "steam", "snow", "staging", "lockbox", "ownerprep"],
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "date": {
                        "description": "YYYY-MM-DD (America/Denver)",
                        "type": "string"
                      },
                      "window": {
                        "description": "am = crew arrives 8-9 AM, pm = 12-1 PM",
                        "enum": ["am", "pm"],
                        "type": "string"
                      }
                    },
                    "type": "object"
                  }
                },
                "type": "object"
              }
            },
            "required": ["baths", "bedrooms", "cleans"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4dfb3b5baea694dc98080e3abcc870e611496b27810e9ea51b68df51af20d68e"
        },
        {
          "name": "get_services_and_prices",
          "title": "Services and prices",
          "description": "List Boulder Rental Cleaning's three cleans for short-term and festival rentals in Boulder, CO (prep before guests, mid-stay refresh, clean-out), prices by bedroom count, add-ons, discounts, surcharges, time windows and how to book.",
          "inputSchema": {
