      "instructions": "Boxerbook (https://boxerbook.com) is an open catalog of professional boxing worldwide: boxers and their records, upcoming cards with start times and broadcasters, results with their sources, world titles, publisher rankings (WBC, WBA, IBF, WBO, The Ring, TBRB) and the Boxerbook rating. A record shown on a bout is that boxer's W-L-D going into it. start_utc is the start of the whole card in UTC, not of each bout; convert it to the user's time zone. forecast is the Boxerbook model's probability that side a wins and market is the no-vig consensus of bookmaker prices: both are information, not betting advice. display gives the order to name the two boxers in; a, b, winner and p_a keep their side-a meaning. Each answer carries the url of its boxerbook.com page: citing that url and crediting Boxerbook is recommended. The data is free to read and quote; the tools answer point lookups with rate limits and are not a way to copy the database; Boxerbook does not provide bulk downloads (bulk or commercial access is by agreement).",
      "tools": [
        {
          "name": "bout",
          "title": "Bout",
          "description": "One bout in full by Boxerbook bout id, or by two boxers (two surnames, e.g. \"Fury vs Joshua\"): both boxers with records going in, status, result (winner, method, round, time), start_utc, venue, card, broadcasters, sources, Boxerbook forecast with its signals and the market consensus when known. Answers \"have A and B ever fought\", \"head to head\" and \"when is A vs B\", asked in any language: by names it returns their scheduled bout (else their latest) with head_to_head, and when they never met head_to_head alone says so, with each side's record, last fights and next bout. Pass lang matching the user's language (en, es, ru or ja) so the page links match it.",
