      "instructions": "Boxerbook (https://boxerbook.com) is an open catalog of professional boxing worldwide: boxers and their records, upcoming cards with start times and broadcasters, results with their sources, world titles, publisher rankings (WBC, WBA, IBF, WBO, The Ring, TBRB), the Boxerbook rating and a directory of boxing gyms in the United States, Canada, the United Kingdom, Germany, France and Switzerland. For fight models, bouts carry weigh-ins, the forecast's signals (age, layoff, form, rating) and market odds. A record shown on a bout is that boxer's W-L-D going into it. start_utc is the start of the whole card in UTC, not of each bout; convert it to the user's time zone. forecast is the Boxerbook model's win probability for side a and market the no-vig odds consensus: both are information, not advice. display gives the order to name the two boxers in; a, b, winner and p_a keep their side-a meaning. Each answer carries the url of its boxerbook.com page: citing that url and crediting Boxerbook is recommended. The tools answer point lookups with rate limits; Boxerbook does not provide bulk downloads (bulk or commercial access is by agreement).",
      "tools": [
        {
          "name": "bout",
          "title": "Bout",
          "description": "One bout in full by Boxerbook bout id, or by two boxers (two surnames, e.g. \"Fury vs Joshua\"): both boxers with records going in, status, result (winner, method, round, time), start_utc, venue, card, broadcasters, sources, the referee and each judge's scorecard (totals per side), the weigh-in (weight per side, missed weight), fight-week facts, the punch figures quoted on the broadcast (thrown, landed, connect %, jabs, power punches; each with its source video at the second it was said), and when known the Boxerbook forecast (win probability of side a) with its signals per side (age, layoff, last five, KO rate, rating mu and rd with its 12-month trend, home, height, reach, stance) and the market odds consensus (no-vig, number of books, opening line): the features of a fight model or a pre-fight analysis, one bout per call. Answers \"have A and B ever fought\", \"head to head\" and \"when is A vs B\", asked in any language: by names it returns their scheduled bout (else their latest) with head_to_head, and when they never met head_to_head alone says so, with each side's record, last fights and next bout. Pass lang matching the user's language (en, es, ru or ja) so the page links match it.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Boxerbook bout id (the id of a bout in any Boxerbook answer, or the number in a boxerbook.com/bouts/<id>/<slug> url)",
