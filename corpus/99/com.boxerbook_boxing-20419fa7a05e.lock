        {
          "name": "boxer",
          "title": "Boxer card",
          "description": "One boxer's card by name, slug or Boxerbook id: country, division, record (W-L-D, KOs), stance, height, reach, birth year, nickname, next fight, last result, Boxerbook rating and, when known, the record as market favourite and underdog. A name returns the best match of the site search; other_matches lists the next ones when the name is shared. Pass lang matching the user's language (en, es, ru or ja) so the page links match it.",
          "inputSchema": {
            "properties": {
              "lang": {
                "default": "en",
                "description": "the user's language: en (default), es, ru or ja; the boxerbook.com page links of the answer follow it (a page without a translation keeps its English link)",
                "enum": ["en", "es", "ru", "ja"],
                "type": "string"
              },
              "query": {
                "description": "a boxer's name, slug (giorgio-visioli) or Boxerbook id",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "type": "string"
              },
              "attribution": {
