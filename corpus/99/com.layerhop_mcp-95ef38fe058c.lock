        {
          "name": "create_deposit_address",
          "title": "Create a deposit address",
          "description": "Create an address the user sends tokens to; every deposit is swapped/bridged and delivered as toToken on toChain to recipient. No wallet connection or signing needed. Non-custodial: the address belongs to the liquidity provider (Relay), LayerHop never holds funds. Tell the user: send ONLY srcToken on srcChain to the address (other tokens or chains may be lost for good), at least $1 worth; refundTo must be the user's own address on srcChain, never an exchange (CEX) deposit address. Needs a LayerHop API key; test keys (lh_test_) give a fake sandbox address that must never receive real funds. The LayerHop MCP server holds no private keys and never signs or broadcasts transactions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "HUMAN units of fromToken (\"25\" = 25 USDC). Required when reusable is false (the exact amount to send); otherwise only sizes the estimate. Minimum worth $1.",
                "type": ["string", "number"]
              },
              "fromChain": {
                "description": "Source (deposit) chain: slug (\"base\", \"solana\", \"ethereum\", \"arbitrum\"...) or numeric chain id (Solana is 7565164). See list_chains.",
                "type": ["string", "number"]
              },
              "fromToken": {
                "description": "The ONLY token the user may send to the address (source) token: symbol from list_tokens (\"USDC\", \"ETH\", \"SOL\") or the token contract address / SPL mint. Use \"native\" for the chain's gas coin.",
                "minLength": 1,
                "type": "string"
              },
              "fromTokenDecimals": {
                "description": "Only needed when fromToken is an address that is not in list_tokens: the token's decimals (e.g. 6 for USDC, 18 for most ERC-20s).",
                "maximum": 36,
                "minimum": 0,
                "type": "integer"
              },
              "label": {
                "description": "Your reference for this address (1-64 chars), filterable in list_deposit_addresses.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "metadata": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Up to 20 string key-value pairs stored on the address.",
                "type": "object"
              },
              "recipient": {
                "description": "Address that receives toToken on toChain.",
                "minLength": 1,
                "type": "string"
              },
              "refundTo": {
                "description": "The user's OWN address on fromChain for refunds. NEVER an exchange (CEX) deposit address: refunds never go back to an exchange.",
                "minLength": 1,
                "type": "string"
              },
              "reusable": {
                "description": "true (default): reusable for this route with any amount. false: one-time address for exactly `amount`.",
                "type": "boolean"
              },
              "toChain": {
                "description": "Destination chain: slug (\"base\", \"solana\", \"ethereum\", \"arbitrum\"...) or numeric chain id (Solana is 7565164). See list_chains.",
                "type": ["string", "number"]
              },
              "toToken": {
                "description": "Token to deliver (destination) token: symbol from list_tokens (\"USDC\", \"ETH\", \"SOL\") or the token contract address / SPL mint. Use \"native\" for the chain's gas coin.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["fromChain", "fromToken", "recipient", "refundTo", "toChain", "toToken"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
