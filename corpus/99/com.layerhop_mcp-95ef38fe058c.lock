        {
          "name": "create_limit_order",
          "title": "Create a limit order (unsigned)",
          "description": "Build a limit order: sell sellAmount of sellToken once the market gives at least minReceive of buyToken. Solana (default, Jupiter Trigger): returns an UNSIGNED transaction; LayerHop's fee applies when buyToken is SOL, USDC or USDT. EVM chains with CoW Protocol (Ethereum, Arbitrum, Base, BNB Chain, Polygon, Avalanche, Gnosis, Linea, Plasma, Ink): returns EIP-712 typed data plus the token approval it needs; sellToken must be an ERC-20. Then the maker's own wallet signs and you call submit_limit_order. Worth at least $5. The LayerHop MCP server holds no private keys and never signs or broadcasts transactions. Confirm the price with the user first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "buyToken": {
                "description": "Token to buy token: symbol from list_tokens (\"USDC\", \"ETH\", \"SOL\") or the token contract address / SPL mint. Use \"native\" for the chain's gas coin.",
                "minLength": 1,
                "type": "string"
              },
              "chain": {
                "description": "Chain of the order (default solana) chain: slug (\"base\", \"solana\", \"ethereum\", \"arbitrum\"...) or numeric chain id (Solana is 7565164). See list_chains.",
                "type": ["string", "number"]
              },
              "expiresInMinutes": {
                "description": "Cancel automatically after this many minutes. Solana: omit for good-till-cancelled. EVM: default 90 days.",
                "maximum": 525600,
                "minimum": 1,
                "type": "integer"
              },
              "minReceive": {
                "description": "Minimum HUMAN units of buyToken for the whole sellAmount (the limit price is minReceive / sellAmount), e.g. \"0.5\" for 0.5 SOL.",
                "type": ["string", "number"]
              },
              "sellAmount": {
                "description": "HUMAN units of sellToken to sell, e.g. \"50\" for 50 USDC.",
                "type": ["string", "number"]
              },
              "sellToken": {
                "description": "Token to sell token: symbol from list_tokens (\"USDC\", \"ETH\", \"SOL\") or the token contract address / SPL mint. Use \"native\" for the chain's gas coin.",
                "minLength": 1,
                "type": "string"
              },
              "wallet": {
                "description": "The maker's wallet (Solana base58 or EVM 0x): signs the order and receives buyToken.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["buyToken", "minReceive", "sellAmount", "sellToken", "wallet"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
