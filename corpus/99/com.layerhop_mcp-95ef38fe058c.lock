        {
          "name": "get_quote",
          "title": "Get swap/bridge quotes",
          "description": "Get the best price to swap or bridge tokens, within one chain or across chains (EVM <-> Solana). Asks every liquidity provider and returns the best quote plus alternatives with human-readable amounts, minimum received after slippage, fees (LayerHop fee, partner fee, provider fee, gas) and ETA. Returns a quoteId (valid until expiresAt) and a layerhop.com swapLink a human can open to review and sign. Read-only: The LayerHop MCP server holds no private keys and never signs or broadcasts transactions. Always show the user the fees and output and get confirmation before proceeding.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "Amount to send in HUMAN units of fromToken as a decimal string, e.g. \"100\" for 100 USDC or \"0.05\" for 0.05 ETH. NOT base units/wei/lamports. Must be greater than 0.",
                "type": ["string", "number"]
              },
              "fromChain": {
                "description": "Source chain: slug (\"base\", \"solana\", \"ethereum\", \"arbitrum\"...) or numeric chain id (Solana is 7565164). See list_chains.",
                "type": ["string", "number"]
              },
              "fromToken": {
                "description": "Token to send (source) token: symbol from list_tokens (\"USDC\", \"ETH\", \"SOL\") or the token contract address / SPL mint. Use \"native\" for the chain's gas coin.",
                "minLength": 1,
                "type": "string"
              },
              "fromTokenDecimals": {
                "description": "Only needed when fromToken is an address that is not in list_tokens: the token's decimals (e.g. 6 for USDC, 18 for most ERC-20s).",
                "maximum": 36,
                "minimum": 0,
                "type": "integer"
              },
              "gasless": {
                "description": "Optional gasless swap (same EVM chain, ERC-20 input, where the API enables it): the user signs EIP-712 typed data instead of a transaction and the network fee is taken from fromToken. This server cannot sign or submit typed data for the user, so the user finishes it via the swap link or their own app.",
                "type": "boolean"
              },
              "recipient": {
                "description": "Address that receives funds on the destination chain. Defaults to sender when both chains use the same VM; REQUIRED for EVM <-> Solana.",
                "type": "string"
              },
              "sender": {
                "description": "Wallet address that sends the funds on the source chain (0x... for EVM, base58 for Solana). Only used to build the quote; no access is needed.",
                "minLength": 1,
                "type": "string"
              },
              "slippageBps": {
                "description": "Max slippage in basis points (1 bp = 0.01%). Default 50 (= 0.5%).",
                "maximum": 5000,
                "minimum": 1,
                "type": "integer"
              },
              "toChain": {
                "description": "Destination chain: slug (\"base\", \"solana\", \"ethereum\", \"arbitrum\"...) or numeric chain id (Solana is 7565164). See list_chains.",
                "type": ["string", "number"]
              },
              "toToken": {
                "description": "Token to receive (destination) token: symbol from list_tokens (\"USDC\", \"ETH\", \"SOL\") or the token contract address / SPL mint. Use \"native\" for the chain's gas coin.",
                "minLength": 1,
                "type": "string"
              },
              "toTokenDecimals": {
                "description": "Only needed when toToken is an address that is not in list_tokens: the token's decimals (e.g. 6 for USDC, 18 for most ERC-20s).",
                "maximum": 36,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["amount", "fromChain", "fromToken", "sender", "toChain", "toToken"],
            "type": "object"
          },
