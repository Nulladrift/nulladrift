      "instructions": "LayerHop finds the best-priced route for cross-chain and same-chain token swaps (EVM chains and Solana) across many liquidity providers. The LayerHop MCP server holds no private keys and never signs or broadcasts transactions.\n\nAmounts in tool inputs are HUMAN decimal strings in the token's own units (\"100\" = 100 USDC, \"0.05\" = 0.05 ETH), never base units. Outputs show human amounts; fields named *BaseUnits are integers in the token's smallest unit.\n\nSafe workflow: list_chains / list_tokens if unsure -> get_quote -> show the user output, minimum received, every fee and the ETA -> get explicit confirmation -> prefer giving the user the swapLink (or get_swap_link) so they review and sign in their own wallet on layerhop.com. Only use build_transaction when the user has their own signer and asks for raw transaction data; never ask for or accept private keys or seed phrases.\n\nBefore a user buys or receives a token that is unverified or unfamiliar, call get_token_risk and show any caution or danger reasons. When get_quote fails with NO_ROUTE, the error may list alternatives that do quote (another destination or source token, or two steps through a hub): offer them, never switch silently. Gasless quotes (typed data) and Tron transactions can't be signed or completed through this server: give the user the swap link.\n\nLimit orders (create_limit_order and friends) return UNSIGNED transactions (Solana) or EIP-712 typed data to sign (EVM, CoW Protocol): only the maker's own wallet signs them; submit_limit_order only relays an already-made signature.\n\nDeposit addresses (create_deposit_address and friends, API key required) let a user swap or bridge by just sending a token to an address. When you show one, always tell the user: send ONLY that token on that chain (anything else may be lost), at least $1 worth, and refunds go to refundTo, which must be their own address, never an exchange deposit address. Test-key addresses are fake: never send real funds; use simulate_deposit.",
      "tools": [
        {
          "name": "build_transaction",
          "title": "Build the unsigned transaction for a quote",
          "description": "Turn a quoteId from get_quote into the UNSIGNED transaction the user's own wallet must sign: EVM {chainId, to, data, value in wei, optional ERC-20 approval to send first} or Solana {serializedTx base64}. Includes plain-language signing steps. The LayerHop MCP server holds no private keys and never signs or broadcasts transactions. Only use this when the user has their own signer and explicitly wants raw transaction data, after they confirmed the quote; otherwise give them the swap link.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "quoteId": {
                "description": "quoteId from get_quote (starts with \"q_\"). Quotes expire after a short time (see expiresAt).",
                "pattern": "^q_",
                "type": "string"
              }
            },
            "required": ["quoteId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
