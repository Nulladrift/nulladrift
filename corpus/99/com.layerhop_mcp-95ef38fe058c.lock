        {
          "name": "simulate_deposit",
          "title": "Simulate a deposit (test mode only)",
          "description": "TEST MODE ONLY (lh_test_ key and a test deposit address): record a fake deposit so the integration can be tested end to end; it becomes a test order that settles with webhooks. The amount decides the outcome: base units ending in 4001 -> refunded, 4002 -> failed, anything else -> filled. Moves no real funds. Fails with a live key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "Deposit amount in HUMAN units of the address token (\"25\" = 25 USDC). Give this or amountBaseUnits.",
                "type": ["string", "number"]
              },
              "amountBaseUnits": {
                "description": "Deposit amount in base units (e.g. \"25004001\" to test a refund for a 6-decimal token). Give this or amount.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "id": {
                "description": "Deposit address id (starts with \"da_\").",
                "pattern": "^da_",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
