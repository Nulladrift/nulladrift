        {
          "name": "get_token_risk",
          "title": "Check a token for risks",
          "description": "Safety report for a token before the user buys or receives it: honeypot (can't sell), buy/sell/transfer taxes, owner powers (mint, blacklist, pause, freeze), unpublished code, few holders, and fake majors (a token calling itself USDC/ETH/SOL at the wrong address). level is ok, caution, danger or unknown (no source answered; never block a swap on unknown alone). On danger, warn the user and get explicit confirmation before get_quote. Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "The token's chain: slug (\"base\", \"solana\", \"ethereum\", \"arbitrum\"...) or numeric chain id (Solana is 7565164). See list_chains.",
                "type": ["string", "number"]
              },
              "token": {
                "description": "The token to check: symbol or token: symbol from list_tokens (\"USDC\", \"ETH\", \"SOL\") or the token contract address / SPL mint. Use \"native\" for the chain's gas coin.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["chain", "token"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
