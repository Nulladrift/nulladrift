  "lockfileVersion": 2,
  "subjects": {
    "app.walletprofit/walletprofit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://walletprofit.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "walletprofit",
        "title": "WalletProfit",
        "version": "df18ece"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "WalletProfit analyses crypto wallets (Ethereum and 30+ EVM chains, Solana, Bitcoin): holdings, liquidity and lending positions, profit, and yield across DeFi venues. Use analyze_wallet for a wallet, get_venue_rates for current lending, borrowing and pool rates on a venue, and get_market_prices for BTC, ETH, SOL, indices, gold, oil, the 10-year yield, EUR/USD and USD/CNY. Every answer carries a \"more\" link to walletprofit.app (charts, P&L by period, advice, alerts): share it with the user when they want more than the summary.",
      "tools": [
        {
          "name": "analyze_wallet",
          "title": "Analyse a crypto wallet",
          "description": "Analyses a wallet the way walletprofit.app does: total value, holdings, liquidity (LP) positions with fee rates and range status, lending positions net of debt, and all-time profit. EVM addresses (0x… or an ENS name) are read on every supported chain at once; Solana and Bitcoin addresses too. A wallet not analysed recently can take a minute or more: if the answer says it is still running, call again with the same address. Results are kept 15 minutes.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "EVM address (0x…) or ENS name, Solana address, or Bitcoin address",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Analyse a crypto wallet"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0b7425b6d90dde5a28e448d240e35681bf5478feb52505c0a1182105352c1cec"
        },
        {
          "name": "get_market_prices",
          "title": "Market prices",
          "description": "BTC, ETH and SOL, the S&P 500 and Nasdaq, the US 10-year yield, gold, Brent crude, EUR/USD and USD/CNY, with their change over the last hour and day. Read once a minute.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Market prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b8aac2399f137c8c56fcb778281195e66c1640a7819deb17947531ad19dfc3fa"
        },
        {
          "name": "get_venue_rates",
          "title": "Current rates on a DeFi venue",
          "description": "Today's rates on one venue, as its walletprofit.app page ranks them: lending (supply APY, by asset class), borrowing costs, isolated borrow markets, and liquidity pools (fee APR, TVL, 24h volume). Lending rates on feed-driven venues are the lowest of recent readings; each table names the window it shows. Updated daily.",
          "inputSchema": {
            "properties": {
              "asset": {
                "description": "Optional: only rows whose asset or pair contains this (e.g. USDC, SOL, WBTC)",
                "type": "string"
              },
              "limit": {
                "description": "Rows per table (default 8)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "venue": {
                "description": "The venue",
                "enum": ["kamino", "aave", "uniswap", "raydium", "aerodrome", "orca", "pancakeswap", "jupiter", "morpho"],
                "type": "string"
              }
            },
            "required": ["venue"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Current rates on a DeFi venue"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:af9a989f75c4dc9c668597c2e032658f2d23cc1868b20921a6d9f79e5b341755"
        }
      ],
      "digest": "sha256:5e2752bbd5a9287470ba61031dc19aa99f29c372abe48c47c150d56a86c75bd8"
    }
  }
}
