      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "DentalUnlock provides information for US dentists and dental students on three topics:\n- Dental malpractice (professional liability) insurance: estimated premium ranges by state, specialty, and career stage; reviewing a current policy; and starting a quote request on dentalunlock.com.\n- Dental associate pay and jobs: compensation benchmarks by state and recent dental job listings.\n- Dental employment contracts: where to have an associate contract graded.\nMalpractice figures are estimates, not insurance quotes. Contract information is general information, not legal advice.",
      "tools": [
        {
          "name": "check_my_current_policy",
          "title": "Check a current malpractice policy",
          "description": "Returns the dentalunlock.com page where a dentist can upload their current malpractice policy's declarations page for review, and explains how the review works. Relevant when a dentist already has malpractice insurance and asks whether their premium is reasonable, mentions a renewal increase, or wants their current policy reviewed. Takes no inputs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check my current malpractice policy"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5701ffa97fcbd962a64ad375d0504b9536eb630e75f023fab94cacfeaef6e9a0"
        },
        {
          "name": "dental_salary_benchmarks",
          "title": "Dental associate salary benchmarks by state",
          "description": "Returns dental associate compensation benchmarks for a US state, computed from recent job listings: average and median base salary, daily rate, production percentage, signing bonuses, and how often listings include health insurance, 401(k), or paid malpractice. Figures are omitted when the sample is too small. Relevant when a dentist asks what associates are paid in a state or how pay is usually structured there.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "state": {
                "description": "US state as a 2-letter postal code (e.g. TX, CA, DC). Full state names are also accepted.",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Dental salary benchmarks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a85acb45f610f96eb796a65f419a5b58d742cb36b34ae68552d88e485bd8039c"
        },
        {
          "name": "estimate_dental_malpractice",
          "title": "Estimate dental malpractice insurance cost",
          "description": "Returns an estimated annual premium range for US dental malpractice (professional liability) insurance for a given state, specialty, and career stage. Relevant when a dentist or dental student asks what malpractice insurance costs, whether they are paying too much, about a renewal increase, or about occurrence vs claims-made coverage. Requires state, specialty, and graduation_year (or years_practicing); other inputs are optional and defaults are listed in the result. The result includes the estimate range (labeled as an estimate, not a quote), how new-graduate rates change over the first five years, applicable discounts, and a dentalunlock.com link with the answers prefilled. For oral surgeons, dental anesthesiologists, IV or deeper sedation, or recent claims, no dollar range is returned because those profiles are priced individually.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ada_member": {
                "description": "Is the dentist an American Dental Association (ADA) member?",
                "type": "boolean"
              },
              "agd_member": {
                "description": "Is the dentist an Academy of General Dentistry (AGD) member? Membership can affect the estimate.",
                "type": "boolean"
              },
              "claims_last_5_years": {
                "description": "Any malpractice claim, lawsuit, or dental-board action in the last 5 years? Default false.",
                "type": "boolean"
              },
              "coverage_limits": {
                "description": "Per-claim/annual-aggregate limits. Default 1M/3M (the most common).",
                "enum": ["1M/3M", "2M/4M", "2M/6M"],
                "type": "string"
              },
              "graduation_year": {
                "description": "Year the dentist graduated dental school (or will graduate this year). Provide this OR years_practicing.",
                "minimum": 1960,
                "type": "integer"
              },
              "policy_type": {
                "description": "occurrence (default — no tail bill when leaving) or claims_made.",
                "enum": ["claims_made", "occurrence"],
                "type": "string"
              },
              "practice_type": {
                "description": "Where they practice: private_practice (default), dso (corporate/DSO), group_practice, or other.",
                "enum": ["private_practice", "dso", "group_practice", "other"],
                "type": "string"
              },
              "risk_management_ce": {
                "description": "Has the dentist completed risk-management CE in the last 12 months?",
                "type": "boolean"
              },
              "sedation_level": {
                "description": "Highest level of sedation the dentist provides. Default \"None\".",
                "enum": ["None", "Nitrous oxide only", "Oral minimal sedation (Halcion, etc.)", "Moderate IV sedation", "Deep sedation", "General anesthesia"],
                "type": "string"
              },
              "specialty": {
                "description": "The dentist's specialty. Use \"General Dentist\" for general practice.",
                "enum": ["General Dentist", "Periodontist", "Prosthodontist", "Endodontist", "Pediatric Dentist", "Orthodontist", "Oral Pathologist", "Oral Radiologist", "Oral Pain Specialist", "Oral Maxillofacial Pain Management", "Public Health Dentist", "Full-time Faculty (non-intramural)", "Oral Surgeon", "Dental Anesthesiologist"],
                "type": "string"
              },
              "state": {
                "description": "US state as a 2-letter postal code (e.g. TX, CA, DC). Full state names are also accepted.",
                "type": "string"
              },
              "weekly_hours": {
                "description": "Average clinical hours per week: under_20, 20_32, or 33_plus (default 33_plus = full-time).",
                "enum": ["under_20", "20_32", "33_plus"],
                "type": "string"
              },
              "years_practicing": {
                "description": "Years since dental school graduation. Used only if graduation_year is not given.",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["specialty", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate dental malpractice cost"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:348d24bc42fb44845a315df2cca08ef773ef7d704b1e09e12e92c1532ce2d02f"
        },
        {
          "name": "grade_dental_contract_link",
          "title": "Grade a dental employment contract",
          "description": "Returns the dentalunlock.com page where a dentist can upload a dental employment contract for an A-F grade, and describes what the free grade and the optional full analysis include. Relevant when a dentist asks whether an associate contract or job offer is fair, about red flags, non-competes, or negotiating. The review itself happens on dentalunlock.com. General information, not legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Grade a dental contract"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7cfff0d7b51d4444aad759b6e8083b136362dfd2b826a5a659c68413addc342d"
        },
        {
          "name": "search_dental_jobs",
          "title": "Search recent dental job listings",
          "description": "Searches dental job listings posted in the last 6 months by state, city, and/or employer (practice or DSO name). Returns practice, location, posted compensation (salary, daily rate, production %, signing bonus), benefits, posting date, and the original listing link. Relevant when a dentist is looking for a job, relocating, or wants comparable offers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City name, e.g. Houston. Best combined with state.",
                "type": "string"
              },
              "employer": {
                "description": "Practice or DSO name to match, e.g. Aspen or Heartland. Searches nationwide.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Number of listings (default 10, max 25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "state": {
                "description": "US state as a 2-letter postal code (e.g. TX, CA, DC). Full state names are also accepted.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search dental jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:996b72aae5d78ce9aab849f21e64d1274603c932168b4834924a8085ad9b28cb"
        },
        {
