            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:7dd421bf917ee9b1e520137403290058fad7827193d7426e50bedbca18b9d39f"
        },
        {
          "name": "search_dental_jobs",
          "title": "Search recent dental job listings",
          "description": "Searches dental job listings posted in the last 6 months by state, city, and/or employer (practice or DSO name). Returns practice, location, posted compensation (salary, daily rate, production %, signing bonus), benefits, posting date, and the original listing link. Relevant when a dentist is looking for a job, relocating, or wants comparable offers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City name, e.g. Houston. Best combined with state.",
                "type": "string"
              },
              "employer": {
                "description": "Practice or DSO name to match, e.g. Aspen or Heartland. Searches nationwide.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Number of listings (default 10, max 25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "state": {
                "description": "US state as a 2-letter postal code (e.g. TX, CA, DC). Full state names are also accepted.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
