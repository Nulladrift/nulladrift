      },
      "instructions": "DentalUnlock provides information for US dentists and dental students on four topics:\n- Dental malpractice (professional liability) insurance: estimated premium ranges by state, specialty, and career stage; reviewing a current policy; and starting a quote request on dentalunlock.com.\n- Dental practice insurance (office policies such as property and liability, workers comp, cyber, employment practices, and employee theft): what each covers, answering the application in chat and saving it as a draft, and finishing (statements, uploads, signature) on dentalunlock.com.\n- Dental associate pay and jobs: compensation benchmarks by state and recent dental job listings.\n- Dental employment contracts: where to have an associate contract graded.\nMalpractice figures are estimates, not insurance quotes. Practice insurance has no prices until a full application is complete. Contract information is general information, not legal advice.",
      "tools": [
        {
          "name": "check_my_current_policy",
          "title": "Check a current malpractice policy",
          "description": "Returns the dentalunlock.com page where a dentist can upload their current malpractice policy's declarations page for review, and explains how the review works. Relevant when a dentist already has malpractice insurance and asks whether their premium is reasonable, mentions a renewal increase, or wants their current policy reviewed. Takes no inputs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check my current malpractice policy"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5701ffa97fcbd962a64ad375d0504b9536eb630e75f023fab94cacfeaef6e9a0"
        },
        {
          "name": "dental_salary_benchmarks",
          "title": "Dental associate salary benchmarks by state",
          "description": "Returns dental associate compensation benchmarks for a US state, computed from recent job listings: average and median base salary, daily rate, production percentage, signing bonuses, and how often listings include health insurance, 401(k), or paid malpractice. Figures are omitted when the sample is too small. Relevant when a dentist asks what associates are paid in a state or how pay is usually structured there.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "state": {
                "description": "US state as a 2-letter postal code (e.g. TX, CA, DC). Full state names are also accepted.",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Dental salary benchmarks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
