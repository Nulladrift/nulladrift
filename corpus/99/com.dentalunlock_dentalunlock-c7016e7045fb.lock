        },
        {
          "name": "save_practice_insurance_application",
          "title": "Save a dental practice insurance application",
          "description": "Saves the owner's answers to the dental practice insurance application as a draft on dentalunlock.com and returns any questions still to ask (including follow-ups opened by their answers) plus a private link where the owner confirms the carrier statements, adds the tax ID, uploads documents, and signs. Call it with the answers gathered so far, then again with application_id and resume_token to add more. It never submits or signs; nothing goes to carriers until the owner signs on the site. Needs the owner's email and the practice's state on the first call. Only call this when the owner has agreed to save their answers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answers": {
                "additionalProperties": true,
                "description": "Answers keyed by question key from get_practice_insurance_questions. Use option values for choice and yes/no questions.",
                "type": "object"
              },
              "application_id": {
                "description": "From an earlier save, to add more answers.",
                "type": "string"
              },
              "coverage": {
                "description": "Policies to apply for: bop (property and general liability), wc (workers comp), cyber, epli (employment practices), crime (employee theft). Solo practices (no employees) skip wc, epli, and crime.",
                "items": {
                  "enum": ["bop", "wc", "cyber", "epli", "crime"],
                  "type": "string"
                },
                "type": "array"
              },
              "email": {
                "description": "The owner's email. Required on the first call. Their link and prices go here.",
                "type": "string"
              },
              "resume_token": {
                "description": "From an earlier save, with application_id.",
                "type": "string"
              },
              "role": {
                "description": "owner, or buying (buying or starting a practice).",
                "enum": ["owner", "buying"],
                "type": "string"
              },
              "state": {
                "description": "US state as a 2-letter postal code (e.g. TX, CA, DC). Full state names are also accepted.",
                "type": "string"
              },
              "team_size": {
                "description": "Employees besides the dentist: solo, 1_3, 4_9, or 10_plus.",
                "enum": ["solo", "1_3", "4_9", "10_plus"],
                "type": "string"
              }
            },
            "required": ["coverage"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Save practice insurance application"
          },
          "behavior": {
            "destructive": false,
