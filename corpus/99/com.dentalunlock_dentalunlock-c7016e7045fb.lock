        },
        {
          "name": "estimate_dental_malpractice",
          "title": "Estimate dental malpractice insurance cost",
          "description": "Returns an estimated annual premium range for US dental malpractice (professional liability) insurance for a given state, specialty, and career stage. Relevant when a dentist or dental student asks what malpractice insurance costs, whether they are paying too much, about a renewal increase, or about occurrence vs claims-made coverage. Requires state, specialty, and graduation_year (or years_practicing); other inputs are optional and defaults are listed in the result. The result includes the estimate range (labeled as an estimate, not a quote), how new-graduate rates change over the first five years, applicable discounts, and a dentalunlock.com link with the answers prefilled. For oral surgeons, dental anesthesiologists, IV or deeper sedation, or recent claims, no dollar range is returned because those profiles are priced individually.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ada_member": {
                "description": "Is the dentist an American Dental Association (ADA) member?",
                "type": "boolean"
              },
              "agd_member": {
                "description": "Is the dentist an Academy of General Dentistry (AGD) member? Membership can affect the estimate.",
                "type": "boolean"
              },
              "claims_last_5_years": {
                "description": "Any malpractice claim, lawsuit, or dental-board action in the last 5 years? Default false.",
                "type": "boolean"
              },
              "coverage_limits": {
                "description": "Per-claim/annual-aggregate limits. Default 1M/3M (the most common).",
                "enum": ["1M/3M", "2M/4M", "2M/6M"],
                "type": "string"
              },
              "graduation_year": {
                "description": "Year the dentist graduated dental school (or will graduate this year). Provide this OR years_practicing.",
                "minimum": 1960,
                "type": "integer"
              },
              "policy_type": {
                "description": "occurrence (default — no tail bill when leaving) or claims_made.",
                "enum": ["claims_made", "occurrence"],
                "type": "string"
              },
              "practice_type": {
                "description": "Where they practice: private_practice (default), dso (corporate/DSO), group_practice, or other.",
                "enum": ["private_practice", "dso", "group_practice", "other"],
                "type": "string"
              },
              "risk_management_ce": {
                "description": "Has the dentist completed risk-management CE in the last 12 months?",
                "type": "boolean"
              },
              "sedation_level": {
                "description": "Highest level of sedation the dentist provides. Default \"None\".",
                "enum": ["None", "Nitrous oxide only", "Oral minimal sedation (Halcion, etc.)", "Moderate IV sedation", "Deep sedation", "General anesthesia"],
                "type": "string"
              },
              "specialty": {
                "description": "The dentist's specialty. Use \"General Dentist\" for general practice.",
                "enum": ["General Dentist", "Periodontist", "Prosthodontist", "Endodontist", "Pediatric Dentist", "Orthodontist", "Oral Pathologist", "Oral Radiologist", "Oral Pain Specialist", "Oral Maxillofacial Pain Management", "Public Health Dentist", "Full-time Faculty (non-intramural)", "Oral Surgeon", "Dental Anesthesiologist"],
                "type": "string"
              },
              "state": {
                "description": "US state as a 2-letter postal code (e.g. TX, CA, DC). Full state names are also accepted.",
                "type": "string"
              },
              "weekly_hours": {
                "description": "Average clinical hours per week: under_20, 20_32, or 33_plus (default 33_plus = full-time).",
                "enum": ["under_20", "20_32", "33_plus"],
                "type": "string"
              },
              "years_practicing": {
                "description": "Years since dental school graduation. Used only if graduation_year is not given.",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["specialty", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate dental malpractice cost"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:348d24bc42fb44845a315df2cca08ef773ef7d704b1e09e12e92c1532ce2d02f"
        },
        {
          "name": "get_practice_insurance_questions",
          "title": "Dental practice insurance application questions",
          "description": "Returns the application questions for the dental practice insurance policies a practice owner wants (property and general liability, workers comp, cyber, employment practices, employee theft), grouped by section with answer options and formats, so the owner can answer them in this chat. Use with save_practice_insurance_application to fill out the application here. A few carrier statements, the tax ID, document uploads, and the signature are done on dentalunlock.com and are listed in the result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "coverage": {
                "description": "Policies to apply for: bop (property and general liability), wc (workers comp), cyber, epli (employment practices), crime (employee theft). Solo practices (no employees) skip wc, epli, and crime.",
                "items": {
                  "enum": ["bop", "wc", "cyber", "epli", "crime"],
                  "type": "string"
                },
                "type": "array"
              },
              "team_size": {
                "description": "Employees besides the dentist: solo, 1_3, 4_9, or 10_plus.",
                "enum": ["solo", "1_3", "4_9", "10_plus"],
                "type": "string"
              }
            },
            "required": ["coverage"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
