{
  "lockfileVersion": 2,
  "subjects": {
    "ai.fitcard/fitcard": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fitcard.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "fitcard",
        "title": "FitCard",
        "version": "1.1.0",
        "websiteUrl": "https://fitcard.ai"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FitCard picks a man's size in any shirt by comparing that shirt's real garment measurements with shirts he already owns that fit. Ask him for 1-5 shirts that fit him well (brand, item, size), then call size_me for a specific shirt or what_to_buy for recommendations. Pass only what he tells you; don't invent measurements. If a shirt of his isn't known yet, tell him he can measure it with his phone at https://fitcard.ai. Report the size FitCard gives, the one-line reason, and the confidence. If he says a shirt is off somewhere (tight in the belly, too short), pass that as chest, belly or length: shirts that don't fit teach FitCard as much as ones that do. A size is FitCard's best estimate, not a guarantee, so mention he should check the shop's return policy.",
      "tools": [
        {
          "name": "shirt_measurements",
          "title": "Shirt measurements",
          "description": "The real garment measurements of a shirt (chest all the way around and length, in inches) in each size, from the brand's own chart or other checked sources. Not a body-size chart.",
          "inputSchema": {
            "properties": {
              "brand": {
                "type": "string"
              },
              "item": {
                "type": "string"
              },
              "size": {
                "description": "Optional: just this size.",
                "type": "string"
              }
            },
            "required": ["brand", "item"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Shirt measurements"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:dc8e7b3214a4684a0d498078efe8ba84e89cd09c8ca68c6b90a2c50edef14dcb"
        },
        {
          "name": "size_me",
          "title": "Which size should I buy?",
          "description": "Recommends a size in one shirt for this man, from the shirts he already owns that fit. Returns the size, why (in terms of his own shirts), how it will fit, and a confidence. The size already accounts for his shirts, the fabric (including dryer shrinkage) and the cut.",
          "inputSchema": {
            "properties": {
              "dress_shirt_size": {
                "description": "His dress shirt size off the label, if he knows it, e.g. \"17 34/35\" (neck, sleeve). Helps with long sleeves.",
                "type": "string"
              },
              "fit_preference": {
                "description": "How he likes shirts to fit, if he said. Default standard.",
                "enum": ["close", "standard", "relaxed"],
                "type": "string"
              },
              "my_shirts": {
                "description": "Shirts he owns, ideally 3-5 that fit him well. Brand, item and size only.",
                "items": {
                  "properties": {
                    "belly": {
                      "description": "How it fits at the belly, if he said. Many guys find shirts right at the chest and tight at the belly.",
                      "enum": ["too tight", "a bit tight", "right", "a bit loose", "too loose"],
                      "type": "string"
                    },
                    "brand": {
                      "description": "Brand, e.g. \"Uniqlo\"",
                      "type": "string"
                    },
                    "chest": {
                      "description": "How it fits through the chest and shoulders, if he said.",
                      "enum": ["too tight", "a bit tight", "right", "a bit loose", "too loose"],
                      "type": "string"
                    },
                    "fit": {
                      "description": "How it fits him overall. Default \"fits\". The chest, belly and length fields say where it's off.",
                      "enum": ["fits", "too big", "too small"],
                      "type": "string"
                    },
                    "item": {
                      "description": "The shirt, e.g. \"AIRism Cotton T-Shirt\" or \"golf polo\"",
                      "type": "string"
                    },
                    "length": {
                      "description": "How long it is on him, if he said (\"rides up\" is too short).",
                      "enum": ["too short", "a bit short", "right", "a bit long", "too long"],
                      "type": "string"
                    },
                    "size": {
                      "description": "Size on the tag, e.g. \"L\" or \"XL Tall\"",
                      "type": "string"
                    }
                  },
                  "required": ["brand", "item", "size"],
                  "type": "object"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "shirt": {
                "description": "The shirt he is thinking of buying.",
                "properties": {
                  "brand": {
                    "type": "string"
                  },
                  "item": {
                    "type": "string"
                  }
                },
                "required": ["brand", "item"],
                "type": "object"
              },
              "suit_size": {
                "description": "His suit jacket size off the label, if he knows it, e.g. \"44L\" or \"42 Regular\". Helps with Tall sizes.",
                "type": "string"
              }
            },
            "required": ["my_shirts", "shirt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Which size should I buy?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:11c6ac7f06d24b0b8cb7857501cd4f094f9968aae244e3b68e28041338e32e78"
        },
        {
          "name": "what_to_buy",
          "title": "What should I buy?",
          "description": "Builds his FitCard from the shirts he owns and returns the shirts that will fit him, each in the right size, with a buy link. Also returns a link to his full card on fitcard.ai. Each size already accounts for his shirts and the fabric; a \"snugger\" or \"roomier\" note describes how that size fits.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional: only this kind of shirt.",
                "enum": ["Tees", "Polos", "Button-downs", "Long sleeves and layers"],
                "type": "string"
              },
              "dress_shirt_size": {
                "description": "His dress shirt size off the label, if he knows it, e.g. \"17 34/35\" (neck, sleeve). Helps with long sleeves.",
                "type": "string"
              },
              "fit_preference": {
                "description": "How he likes shirts to fit, if he said. Default standard.",
                "enum": ["close", "standard", "relaxed"],
                "type": "string"
              },
              "limit": {
                "description": "How many picks (default 8).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "my_shirts": {
                "description": "Shirts he owns, ideally 3-5 that fit him well. Brand, item and size only.",
                "items": {
                  "properties": {
                    "belly": {
                      "description": "How it fits at the belly, if he said. Many guys find shirts right at the chest and tight at the belly.",
                      "enum": ["too tight", "a bit tight", "right", "a bit loose", "too loose"],
                      "type": "string"
                    },
                    "brand": {
                      "description": "Brand, e.g. \"Uniqlo\"",
                      "type": "string"
                    },
                    "chest": {
                      "description": "How it fits through the chest and shoulders, if he said.",
                      "enum": ["too tight", "a bit tight", "right", "a bit loose", "too loose"],
                      "type": "string"
                    },
                    "fit": {
                      "description": "How it fits him overall. Default \"fits\". The chest, belly and length fields say where it's off.",
                      "enum": ["fits", "too big", "too small"],
                      "type": "string"
                    },
                    "item": {
                      "description": "The shirt, e.g. \"AIRism Cotton T-Shirt\" or \"golf polo\"",
                      "type": "string"
                    },
                    "length": {
                      "description": "How long it is on him, if he said (\"rides up\" is too short).",
                      "enum": ["too short", "a bit short", "right", "a bit long", "too long"],
                      "type": "string"
                    },
                    "size": {
                      "description": "Size on the tag, e.g. \"L\" or \"XL Tall\"",
                      "type": "string"
                    }
                  },
                  "required": ["brand", "item", "size"],
                  "type": "object"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "suit_size": {
                "description": "His suit jacket size off the label, if he knows it, e.g. \"44L\" or \"42 Regular\". Helps with Tall sizes.",
                "type": "string"
              }
            },
            "required": ["my_shirts"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "What should I buy?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:871c1e7d36173620127b9789dece17e8ce5d371a97c37d4f9a6584603464ae74"
        }
      ],
      "digest": "sha256:f38cf5d1a60597db535d8f61f98de71fa36a1d4058feaf4caa4ea5dd30fbaddc"
    }
  }
