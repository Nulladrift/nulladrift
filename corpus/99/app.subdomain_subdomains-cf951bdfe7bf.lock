{
  "lockfileVersion": 2,
  "subjects": {
    "app.subdomain/subdomains": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.subdomain.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "subdomain-app",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "count_subdomains",
          "title": "Count subdomains",
          "description": "Return only the total number of distinct subdomains known for a domain — no list. Cheap and low-token. Use when the user asks \"how many subdomains\" or you only need the size of the attack surface. Count includes historic subdomains that may no longer be live. It is a point-in-time figure that changes over time, so treat it as current-as-of-query, not a fixed value.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "Root (registrable) domain as a bare hostname, e.g. \"example.com\". No scheme, path, port, or leading \"www.\" — these are stripped.",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "domain": {
                "type": "string"
              },
              "total": {
                "description": "Total distinct subdomains known.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["domain", "total"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:aacd74eb3802016b3e21137b255a9592c27b1488d8d663d831d668052d8ed899"
        },
        {
          "name": "find_subdomains",
          "title": "Find subdomains",
          "description": "List known subdomains (hostnames) of a root domain. Data is passive (not active scanning): results are historic observations and may include subdomains that no longer resolve or are no longer live. Results are a point-in-time snapshot that changes over time as new subdomains are observed — re-query rather than caching the result. Use for attack-surface mapping, security recon, asset inventory, or SEO host discovery. Hostnames are returned most-recently-seen first. The response always reports `total` (full distinct count known) and a `truncated` flag, so you can tell when more exist beyond `limit`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "Root (registrable) domain as a bare hostname, e.g. \"example.com\". No scheme, path, port, or leading \"www.\" — these are stripped.",
                "type": "string"
              },
              "limit": {
                "default": 200,
                "description": "Max subdomains to return (1-1000, default 200). `total` always reports the full count regardless of this cap.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "domain": {
                "type": "string"
              },
              "returned": {
                "description": "Number in `subdomains`.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "subdomains": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "total": {
                "description": "Total distinct subdomains known.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "truncated": {
                "description": "True if more exist beyond `limit`.",
                "type": "boolean"
              }
            },
            "required": ["domain", "returned", "subdomains", "total", "truncated"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:02081ffa7369b213d9bba2252c58b4418d29011a79a4df44f024cefc757b0d44"
        }
      ],
      "digest": "sha256:2adb4c072958bddb489832a554906dc7cff709635640130b3cac47443d6e11bd"
    }
  }
}
