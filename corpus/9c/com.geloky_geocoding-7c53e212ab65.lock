      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "geloky",
        "title": "Geloky Geocoding",
        "version": "1.0.0",
        "websiteUrl": "https://geloky.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Geloky converts addresses to coordinates and back, and calculates road distances and multi-stop routes. Every lookup is billed to the API wallet of the connected key: $0.001 per address, per coordinate pair, per distance and per route leg; nothing is charged for calls that fail. Use batch_geocode / batch_reverse_geocode for up to 50 items per call; for spreadsheets with thousands of rows, suggest uploading the file at https://geloky.com instead. account_balance is free. Coordinates are WGS84 decimal degrees.",
      "tools": [
        {
          "name": "account_balance",
          "title": "Wallet balance",
          "description": "Free. The remaining balance of the Geloky API wallet in USD, requests made so far, the price per request and where to top up.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Wallet balance"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:adbd1e2119f13ce3a5281101b30927ba7452fc1065b5ff1bdd0eaa424246687e"
        },
        {
          "name": "batch_geocode",
          "title": "Geocode many addresses",
          "description": "Geocode up to 50 addresses in one call. Results come back in input order, each with found=true/false. Costs $0.001 per address.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "addresses": {
                "description": "Addresses to geocode.",
                "items": {
                  "maxLength": 500,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["addresses"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Geocode many addresses"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:acf10ae9f98aff129c4801a9e4dc69f0c475674747d8385086648d485d257aee"
        },
        {
          "name": "batch_reverse_geocode",
          "title": "Addresses of many points",
          "description": "Find the street addresses of up to 50 latitude/longitude points in one call, in input order. Costs $0.001 per point.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "points": {
                "description": "Points to look up.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "latitude": {
                      "description": "Latitude in decimal degrees (WGS84).",
                      "maximum": 90,
                      "minimum": -90,
                      "type": "number"
                    },
                    "longitude": {
                      "description": "Longitude in decimal degrees (WGS84).",
                      "maximum": 180,
                      "minimum": -180,
                      "type": "number"
                    }
                  },
                  "required": ["latitude", "longitude"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["points"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Addresses of many points"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8c639aef457e121c1b771983f83f94779e94bbee9d90f4ae51f675934cc703f6"
        },
        {
          "name": "distance",
          "title": "Distance between two points",
          "description": "Road distance and travel time between two latitude/longitude points (or the straight-line distance with vehicle=direct). Costs $0.001; nothing is charged if no route is found. To start from addresses, geocode them first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "destination": {
                "additionalProperties": false,
                "properties": {
                  "latitude": {
                    "description": "Latitude in decimal degrees (WGS84).",
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "longitude": {
                    "description": "Longitude in decimal degrees (WGS84).",
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  }
                },
                "required": ["latitude", "longitude"],
                "type": "object"
              },
              "origin": {
                "additionalProperties": false,
                "properties": {
                  "latitude": {
                    "description": "Latitude in decimal degrees (WGS84).",
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "longitude": {
                    "description": "Longitude in decimal degrees (WGS84).",
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  }
                },
                "required": ["latitude", "longitude"],
                "type": "object"
              },
              "priority": {
                "default": "fast",
                "description": "Fastest or shortest road route.",
                "enum": ["fast", "short"],
                "type": "string"
              },
              "units": {
                "default": "mi",
                "description": "Distance units: miles or kilometers.",
                "enum": ["mi", "km"],
                "type": "string"
              },
              "vehicle": {
                "default": "auto",
                "description": "Travel mode. direct gives the straight-line (great-circle) distance with no travel time.",
                "enum": ["auto", "truck", "walk", "direct"],
                "type": "string"
              }
            },
            "required": ["destination", "origin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Distance between two points"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5b350815448191f202c5b9581dfe4abd66b67277d3634b5aa2b5e948f05c0dfc"
        },
        {
          "name": "geocode",
          "title": "Geocode an address",
          "description": "Convert one address, place name or postal code into latitude/longitude coordinates. Returns the matched address and coordinates, or found=false. Costs $0.001. For several addresses use batch_geocode.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "The address to locate, e.g. \"350 5th Avenue, New York, NY 10118, USA\". Include city and country for the best match.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Geocode an address"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a297721ae614cbfed9825bba08527fde959c3249db1ebce7197f46e14a89fe13"
        },
        {
          "name": "reverse_geocode",
          "title": "Address of a point",
          "description": "Find the street address at a latitude/longitude point. Costs $0.001. For several points use batch_reverse_geocode.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "latitude": {
                "description": "Latitude in decimal degrees (WGS84).",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "Longitude in decimal degrees (WGS84).",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              }
            },
            "required": ["latitude", "longitude"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Address of a point"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c05a71a8ef37c13407ba61eb3a6de1c5ef85077d80c8f0bfd524855963a84514"
        },
        {
          "name": "route",
          "title": "Multi-stop route",
          "description": "Road route through 2 to 25 points in the given order: distance and time of every leg and the total, optionally with the route shape. Costs $0.001 per leg (N points = N-1 legs); nothing is charged if routing fails.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "geometry": {
                "default": "none",
                "description": "Route shape to include: none, geojson (LineString of [lon, lat]) or polyline (Google encoded, precision 5).",
                "enum": ["none", "geojson", "polyline"],
                "type": "string"
              },
              "points": {
                "description": "Stops in visiting order.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "latitude": {
                      "description": "Latitude in decimal degrees (WGS84).",
                      "maximum": 90,
                      "minimum": -90,
                      "type": "number"
                    },
                    "longitude": {
                      "description": "Longitude in decimal degrees (WGS84).",
                      "maximum": 180,
                      "minimum": -180,
                      "type": "number"
                    }
                  },
                  "required": ["latitude", "longitude"],
                  "type": "object"
                },
                "maxItems": 25,
                "minItems": 2,
                "type": "array"
              },
              "priority": {
                "default": "fast",
                "description": "Fastest or shortest road route.",
                "enum": ["fast", "short"],
                "type": "string"
              },
              "units": {
                "default": "mi",
                "description": "Distance units: miles or kilometers.",
                "enum": ["mi", "km"],
                "type": "string"
              },
              "vehicle": {
                "default": "auto",
                "description": "Travel mode. direct gives the straight-line (great-circle) distance with no travel time.",
                "enum": ["auto", "truck", "walk", "direct"],
                "type": "string"
              }
            },
            "required": ["points"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Multi-stop route"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:34efd33d03ad8fbe93848dcff7ffc9b2eb8bbfe5d1d12f5b62010d00e41d98cd"
        }
      ],
      "digest": "sha256:14cd2534959d771ca1cc97270057a8ef0445698fcb00c58d2b981c43eed9a49b"
    }
  }
