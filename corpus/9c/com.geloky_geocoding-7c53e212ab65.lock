      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "geloky",
        "title": "Geloky Geocoding",
        "version": "1.0.0",
        "websiteUrl": "https://geloky.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Geloky converts addresses to coordinates and back, and calculates road distances and multi-stop routes. Every lookup is billed to the API wallet of the connected key: $0.001 per address, per coordinate pair, per distance and per route leg; nothing is charged for calls that fail. Use batch_geocode / batch_reverse_geocode for up to 50 items per call; for spreadsheets with thousands of rows, suggest uploading the file at https://geloky.com instead. account_balance is free. Coordinates are WGS84 decimal degrees.",
      "tools": [
        {
          "name": "account_balance",
          "title": "Wallet balance",
          "description": "Free. The remaining balance of the Geloky API wallet in USD, requests made so far, the price per request and where to top up.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Wallet balance"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:adbd1e2119f13ce3a5281101b30927ba7452fc1065b5ff1bdd0eaa424246687e"
        },
        {
          "name": "batch_geocode",
          "title": "Geocode many addresses",
          "description": "Geocode up to 50 addresses in one call. Results come back in input order, each with found=true/false. Costs $0.001 per address, $0.002 with extra_columns.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "addresses": {
                "description": "Addresses to geocode.",
                "items": {
                  "maxLength": 500,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "extra_columns": {
                "default": false,
                "description": "Also return the time zone (any country: timezone, utc_offset, dst) and, in the US only, county, county_fips, census tract, block_group and the 120th Congress district, with match_level. Costs $0.001 more per lookup.",
                "type": "boolean"
              }
            },
            "required": ["addresses"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Geocode many addresses"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:06c799eb27fe39b36f7715a54b0c576c6e09d94fcacf1304e8dcd52a164a6da6"
        },
        {
          "name": "batch_reverse_geocode",
          "title": "Addresses of many points",
          "description": "Find the street addresses of up to 50 latitude/longitude points in one call, in input order, each with the same fields as reverse_geocode. Costs $0.001 per point, $0.002 with extra_columns.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "extra_columns": {
                "default": false,
                "description": "Also return the time zone (any country: timezone, utc_offset, dst) and, in the US only, county, county_fips, census tract, block_group and the 120th Congress district, with match_level. Costs $0.001 more per lookup.",
                "type": "boolean"
              },
              "points": {
                "description": "Points to look up.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "latitude": {
                      "description": "Latitude in decimal degrees (WGS84).",
                      "maximum": 90,
                      "minimum": -90,
                      "type": "number"
                    },
                    "longitude": {
                      "description": "Longitude in decimal degrees (WGS84).",
                      "maximum": 180,
                      "minimum": -180,
                      "type": "number"
                    }
                  },
                  "required": ["latitude", "longitude"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["points"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Addresses of many points"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4feffff6dcc3265845b342145b4dec8c5935274f8407972fed6e7c4c56ae5bde"
        },
        {
          "name": "distance",
          "title": "Distance between two places",
          "description": "Road distance and travel time between two places, each a latitude/longitude point or an address (an address is looked up first, as the geocode tool does), or the straight-line distance with vehicle=direct. Costs $0.001, plus $0.001 for each address looked up; nothing is charged if an address is not found or no route is found.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "destination": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "latitude": {
                        "description": "Latitude in decimal degrees (WGS84).",
                        "maximum": 90,
                        "minimum": -90,
                        "type": "number"
                      },
                      "longitude": {
                        "description": "Longitude in decimal degrees (WGS84).",
                        "maximum": 180,
                        "minimum": -180,
                        "type": "number"
                      }
                    },
                    "required": ["latitude", "longitude"],
                    "type": "object"
                  },
                  {
                    "description": "An address, e.g. \"350 5th Avenue, New York, NY 10118, USA\".",
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "A point {latitude, longitude}, or an address as text."
              },
              "origin": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "latitude": {
                        "description": "Latitude in decimal degrees (WGS84).",
                        "maximum": 90,
                        "minimum": -90,
                        "type": "number"
                      },
                      "longitude": {
                        "description": "Longitude in decimal degrees (WGS84).",
                        "maximum": 180,
                        "minimum": -180,
                        "type": "number"
                      }
                    },
                    "required": ["latitude", "longitude"],
                    "type": "object"
                  },
                  {
                    "description": "An address, e.g. \"350 5th Avenue, New York, NY 10118, USA\".",
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "A point {latitude, longitude}, or an address as text."
              },
              "priority": {
                "default": "fast",
                "description": "Fastest or shortest road route.",
                "enum": ["fast", "short"],
                "type": "string"
              },
              "units": {
                "default": "mi",
                "description": "Distance units: miles or kilometers.",
                "enum": ["mi", "km"],
                "type": "string"
              },
              "vehicle": {
                "default": "auto",
                "description": "Travel mode. direct gives the straight-line (great-circle) distance with no travel time.",
                "enum": ["auto", "truck", "walk", "direct"],
                "type": "string"
              }
            },
            "required": ["destination", "origin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Distance between two places"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4d978535a2e79855d0f5e69309ab67f3068b9dd807f8d2a7e80a1c5a3a204464"
        },
        {
          "name": "geocode",
          "title": "Geocode an address",
          "description": "Convert one address, place name or postal code into latitude/longitude coordinates. Returns the matched address and coordinates, or found=false. Costs $0.001; with extra_columns (time zone, and in the US county, census tract and district) $0.002. For several addresses use batch_geocode.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "The address to locate, e.g. \"350 5th Avenue, New York, NY 10118, USA\". Include city and country for the best match.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "extra_columns": {
                "default": false,
                "description": "Also return the time zone (any country: timezone, utc_offset, dst) and, in the US only, county, county_fips, census tract, block_group and the 120th Congress district, with match_level. Costs $0.001 more per lookup.",
                "type": "boolean"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Geocode an address"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:de81178b89c8e30b15e525707a59078d536e1c27aeadadaf269d7406f12ae737"
        },
        {
          "name": "reverse_geocode",
          "title": "Address of a point",
          "description": "Find the street address at a latitude/longitude point. The answer also says how exact the address is (type: address, street, area or place), how many metres it is from the point (distance), and the point as a plus code that Google Maps opens (plus_code). In India the address opens with a well-known place nearby. Costs $0.001, $0.002 with extra_columns. For several points use batch_reverse_geocode.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "extra_columns": {
                "default": false,
                "description": "Also return the time zone (any country: timezone, utc_offset, dst) and, in the US only, county, county_fips, census tract, block_group and the 120th Congress district. Costs $0.001 more.",
                "type": "boolean"
              },
              "latitude": {
                "description": "Latitude in decimal degrees (WGS84).",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "Longitude in decimal degrees (WGS84).",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              }
            },
            "required": ["latitude", "longitude"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Address of a point"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:81c752c11f21cc111f4ce2574f67b476156b0a270f8b92f76bd3404023c5b51b"
        },
        {
          "name": "route",
          "title": "Multi-stop route",
          "description": "Road route through 2 to 25 stops in the given order, each a latitude/longitude point or an address (looked up first): distance and time of every leg and the total, optionally with the route shape. Costs $0.001 per leg (N stops = N-1 legs), plus $0.001 for each different address; nothing is charged if a stop is not found or routing fails.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "geometry": {
                "default": "none",
                "description": "Route shape to include: none, geojson (LineString of [lon, lat]) or polyline (Google encoded, precision 5).",
                "enum": ["none", "geojson", "polyline"],
                "type": "string"
              },
              "points": {
                "description": "Stops in visiting order: points {latitude, longitude} or addresses as text.",
                "items": {
                  "anyOf": [
                    {
                      "additionalProperties": false,
                      "properties": {
                        "latitude": {
                          "description": "Latitude in decimal degrees (WGS84).",
                          "maximum": 90,
                          "minimum": -90,
                          "type": "number"
                        },
                        "longitude": {
                          "description": "Longitude in decimal degrees (WGS84).",
                          "maximum": 180,
                          "minimum": -180,
                          "type": "number"
                        }
                      },
                      "required": ["latitude", "longitude"],
                      "type": "object"
                    },
                    {
                      "description": "An address, e.g. \"350 5th Avenue, New York, NY 10118, USA\".",
                      "minLength": 1,
                      "type": "string"
                    }
                  ],
                  "description": "A point {latitude, longitude}, or an address as text."
                },
                "maxItems": 25,
                "minItems": 2,
                "type": "array"
              },
              "priority": {
                "default": "fast",
                "description": "Fastest or shortest road route.",
                "enum": ["fast", "short"],
                "type": "string"
              },
              "units": {
                "default": "mi",
                "description": "Distance units: miles or kilometers.",
                "enum": ["mi", "km"],
                "type": "string"
              },
              "vehicle": {
                "default": "auto",
                "description": "Travel mode. direct gives the straight-line (great-circle) distance with no travel time.",
                "enum": ["auto", "truck", "walk", "direct"],
                "type": "string"
              }
            },
            "required": ["points"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Multi-stop route"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0a1bf0c672ecbd6751991de7a6fcca243a1dd67feead4ccd8ffe41449e870aec"
        }
      ],
      "digest": "sha256:1db652708aad16066dd75d94db2ab5aae38227409dbd4c6e1a68c5092dd235bb"
    }
  }
