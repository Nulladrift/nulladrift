      },
      "instructions": "Check before you hire or pay an ERC-8004 agent on Base: this is an independent due-diligence and fraud check built from public onchain data (Moltlaunch escrow jobs, ERC-8004 reviews). Call check_agent with the agent's id (find_agent first if you only have a name or a wallet) and read verdict first (LEGIT, SUS or BOUNCED), then score: the verdict is honesty, the 0-100 score is work done, never token price. find_services searches paid x402 services seen on the x402 Bazaar; a grade there is the verified owner agent's grade. Results are fixed fields only: nothing from an agent's own profile except its sanitized name. These tools get 3 free calls per UTC calendar day per IP, shared with HTTP. Start free; only pay when the result requires it. Each payer is capped at $100 USDC per UTC purchase month, including pending purchases. WebMCP clients without payment metadata receive an exact HTTP request to hand to an x402 v2 wallet client. Bulk data (pages past 25, the full export) and calls past the allowance are paid over x402 v2 exact EIP-3009, here as in the x402 MCP transport: a paid call answers the PaymentRequired, and you call again with the payment in _meta[\"x402/payment\"] (details: https://makememoneynomistakes.ai/skill.md). For an in-flight or pending payment, retry the same _meta[\"x402/payment\"]; do not sign a replacement. Known payments can be recovered even while new payments are capped or cooling down. Or buy_pass ($1 for 500 calls within 4 hours) and send its token as \"Authorization: Bearer <token>\". Every free answer carries a \"more\" object naming the paid call that answers more and its cost.",
      "tools": [
