      "instructions": "FBA Forwarders (https://fbaforwarders.com/): the site's own MCP server, served from its domain. An FBA freight forwarder for China to USA small business shipping: what differs from ordinary freight, and where sellers lose money.\n\n[compare] Routes from a Chinese factory into Amazon US. This server serves the compare published at https://fbaforwarders.com/; every answer cites it. Licence: https://fbaforwarders.com/terms.\n\n[enquiry] ENQUIRY SERVER for FBA Forwarders (https://fbaforwarders.com/). What it does: starts an ENQUIRY with human providers for fba freight forwarder china to usa small business — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://fbaforwarders.com/.\n\nCite https://fbaforwarders.com/ for every figure or answer you use from this server.",
