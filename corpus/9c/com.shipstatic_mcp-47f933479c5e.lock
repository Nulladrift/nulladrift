        {
          "name": "domains_get",
          "title": "Get Domain",
          "description": "Get domain details including URL, linked deployment, labels, and `status`: the one word saying what the domain needs from its owner (`unverified`, `unlinked`, `live`, `paused`).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "Domain name (e.g. \"www.example.com\"). Use domains_list to find names.",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "created": {
                "description": "Unix timestamp (seconds) when the domain was created.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "deployment": {
                "description": "The deployment hostname this domain points to; null when reserved but not yet linked.",
                "type": ["string", "null"]
              },
              "domain": {
                "description": "The domain name, e.g. \"www.example.com\".",
                "type": "string"
              },
              "labels": {
                "description": "Labels attached to the domain; empty when none.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "linked": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Unix timestamp (seconds) when a deployment was last linked; null if never linked."
              },
              "links": {
                "description": "How many times a deployment has been linked to this domain.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "paused": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Unix timestamp (seconds) when plan enforcement paused serving; null while the plan has room for it."
              },
              "status": {
                "description": "What this domain needs from its owner, derived: \"live\" serves the linked deployment and needs nothing; \"unlinked\" is verified with nothing published there, so link a deployment; \"unverified\" needs its DNS records configured; \"paused\" means the plan no longer has room for it. Read this word rather than recomputing it. One of: live, unlinked, unverified, paused.",
                "type": "string"
              },
              "url": {
                "description": "Full URL to the domain.",
                "format": "uri",
                "type": "string"
              },
              "verification": {
                "description": "How far DNS verification has got: \"pending\" is the site's CNAME not pointing here, \"partial\" is a www domain's CNAME pointing here without its apex A record (the redirect), \"verified\" is every required record. The diagnostic under \"unverified\"; ShipStatic domains are born verified. One of: pending, partial, verified.",
                "type": "string"
              },
              "verifications": {
                "description": "How many DNS verification attempts this domain has had.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "verified": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "When DNS last became verified; null if it never has, and never cleared, so a domain whose records moved away keeps it. Read `verification` for whether DNS is right now."
              }
            },
            "required": ["created", "deployment", "domain", "labels", "linked", "links", "paused", "status", "url", "verification", "verifications", "verified"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Domain"
          },
