      "serverInfo": {
        "name": "shipstatic",
        "title": "ShipStatic",
        "version": "2.8.3",
        "description": "Deploy static websites, landing pages, and prototypes instantly. Free, no account needed.",
        "websiteUrl": "https://shipstatic.com",
        "icons": [
          {
            "src": "https://www.shipstatic.com/logo.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
