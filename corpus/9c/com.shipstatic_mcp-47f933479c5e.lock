                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "labels": {
                "description": "Labels attached to the deployment; empty when none.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "password": {
                "description": "True if the deployment is password-protected.",
                "type": "boolean"
              },
              "screenshot": {
                "description": "Full URL to the deployment screenshot. Rendered on the first request for it, so the URL is returned immediately and the first request takes a few seconds; every request after that is served immediately.",
                "format": "uri",
                "type": "string"
              },
              "size": {
                "description": "Total deployment size in bytes.",
