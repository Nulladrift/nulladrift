          "name": "deployments_get",
          "title": "Get Deployment",
          "description": "Get deployment details including URL, status, file count, size, labels, and password protection state.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "deployment": {
                "description": "Deployment hostname (e.g. \"happy-cat-abc1234.shipstatic.com\"). Returned by deployments_upload or deployments_list.",
                "type": "string"
              }
            },
            "required": ["deployment"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "config": {
                "description": "True if the deployment includes a ship.json routing config.",
                "type": "boolean"
              },
              "created": {
                "description": "Unix timestamp (seconds) when the deployment was created.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "deployment": {
                "description": "Deployment hostname, e.g. \"happy-cat-abc1234.shipstatic.com\".",
                "type": "string"
              },
              "expires": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Unix timestamp (seconds) when the deployment expires; null when permanent. Anonymous deployments expire 3 days after creation unless claimed; an authenticated deployment carries one only when it requested a ttl."
              },
              "files": {
                "description": "Number of files in the deployment.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "labels": {
                "description": "Labels attached to the deployment; empty when none.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "password": {
                "description": "True if the deployment is password-protected.",
                "type": "boolean"
              },
              "screenshot": {
                "description": "Full URL to the deployment screenshot. Rendered on the first request for it, so the URL is returned immediately and the first request takes a few seconds; every request after that is served immediately.",
                "format": "uri",
                "type": "string"
              },
              "size": {
                "description": "Total deployment size in bytes.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "status": {
                "description": "Deployment lifecycle state; \"success\" means the site is live. One of: pending, success, failed, deleting.",
                "type": "string"
              },
              "url": {
                "description": "Full URL to the live deployment.",
                "format": "uri",
                "type": "string"
              },
              "via": {
                "description": "How the deployment was created, as shown in deployment history (today one of: web, sdk, cli, mcp, git, n8n, gpt, vsc, cld, crs, gmn, api). Null on deployments older than the tag.",
                "type": ["string", "null"]
              }
            },
            "required": ["config", "created", "deployment", "expires", "files", "labels", "password", "screenshot", "size", "status", "url", "via"],
