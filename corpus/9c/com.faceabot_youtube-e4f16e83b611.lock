{
  "lockfileVersion": 2,
  "subjects": {
    "com.faceabot/youtube": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://youtube.faceabot.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "faceabot-youtube",
        "title": "Faceabot YouTube",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Faceabot YouTube: the transcript of any public YouTube video (get_youtube_transcript {\"video\":\"<url or id>\"}), with title, channel, duration and timestamps, in the video's original language by default; lang to translate the captions. The latest videos of a channel: list_channel_videos {\"channel\":\"@name\"}. Free, no key. Faceabot keeps what it has read for 24 h and never forces YouTube's checks: if YouTube asks to slow down, retry in 1 to 2 minutes. Videos without captions have no transcript. Part of Faceabot (https://faceabot.com): any other tool: solve_need at https://faceabot.com/api/mcp.",
      "tools": [
        {
          "name": "get_youtube_transcript",
          "title": "Get a YouTube video's transcript",
          "description": "Returns the title, channel, duration and full transcript (subtitles or automatic captions) of a public YouTube video, with a timestamp every 30 seconds. In the video's original language by default; can translate the captions (lang).\nUse when: you need to know what is said in a YouTube video, summarize it or quote it.\nExample: {\"video\":\"https://www.youtube.com/watch?v=dQw4w9WgXcQ\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Wanted language code (en, fr, nl…). Default: the video's own captions",
                "type": "string"
              },
              "max_chars": {
                "default": 20000,
                "maximum": 50000,
                "minimum": 500,
                "type": "integer"
              },
              "start": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              },
              "timestamps": {
                "default": true,
                "type": "boolean"
              },
              "video": {
                "description": "YouTube address (watch, youtu.be, shorts) or 11-character video id",
                "examples": ["dQw4w9WgXcQ"],
                "type": "string"
              }
            },
            "required": ["video"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:58f03c3cdcf044dc80c6c65c7d612990ea57f676789a9fc794fc18d5a7fde10b"
        },
        {
          "name": "list_channel_videos",
          "title": "List a YouTube channel's latest videos",
          "description": "Lists the most recent public videos of a YouTube channel (up to 15, from YouTube's official public feed): title, date, views, address, and whether it is a Short.\nUse when: you need to know what a channel published lately, then read a video with get_youtube_transcript.\nExample: {\"channel\":\"@YouTube\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "channel": {
                "description": "Channel handle (\"@name\"), channel address, \"UC…\" channel id, or one of its videos",
                "examples": ["@YouTube"],
                "type": "string"
              },
              "limit": {
                "default": 15,
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["channel"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a74079f2f56ff770fea6d217c3603e7c9a83e076697f93876cfe3fa9e7a03d02"
        }
      ],
      "digest": "sha256:c634124fed858096f8518a223343fa5e207409755ab192572bb6459ce43cac9b"
    }
  }
}
