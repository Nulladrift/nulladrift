{
  "lockfileVersion": 2,
  "subjects": {
    "ai.opencurrent/dev-tool-changes": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://opencurrent.ai/mcp/changes"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "dev-tool-changes",
        "title": "Coding Agent Changelog Check",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Check what changed recently in coding-agent CLIs (Claude Code, OpenAI Codex CLI, Gemini CLI), read from their official changelogs and releases. Before telling a user to run a flag, command or setting you remember, call check_usage to see whether it was added, renamed, removed or changed defaults after your training data. Each item links to its source.",
      "tools": [
        {
          "name": "check_usage",
          "title": "Check a flag or command against recent changes",
          "description": "Search the official changelog of a coding-agent CLI for a flag, command or setting (e.g. '--full-auto', 'claude -p', 'permission mode'). Returns `known` (verified usage changes, incl. ones not in recent release notes) and `hits` (matching changelog entries, newest first; breaking=true marks removals, renames and default changes). Empty results mean no recorded change in the fetched history.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "tool": {
                "description": "claude-code, codex, or gemini-cli",
                "enum": ["claude-code", "codex", "gemini-cli"],
                "type": "string"
              }
            },
            "required": ["query", "tool"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "hits": {
                "items": {
                  "properties": {
                    "breaking": {
                      "type": "boolean"
                    },
                    "item": {
                      "type": "string"
                    },
                    "version": {
                      "type": "string"
                    }
                  },
                  "required": ["breaking", "item", "version"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["hits"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ea8838a49c8c112ed50946281c9a3c99d8452dbcb8f06c74488de406f3e3c464"
        },
        {
          "name": "recent_changes",
          "title": "Recent changes of a coding-agent CLI",
          "description": "Latest versions of a coding-agent CLI with their changelog items. Set breaking_only to see only removals, renames and default changes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "breaking_only": {
                "type": "boolean"
              },
              "tool": {
                "description": "claude-code, codex, or gemini-cli",
                "enum": ["claude-code", "codex", "gemini-cli"],
                "type": "string"
              },
              "versions": {
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["tool"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "entries": {
                "items": {
                  "properties": {
                    "items": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "version": {
                      "type": "string"
                    }
                  },
                  "required": ["items", "version"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["entries"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ecad19e59129a10b94ab536f692c251306988a85749de8e5ecc293aee1bca516"
        }
      ],
      "digest": "sha256:ee02ea601614a4fe60bf70e0aedc286a8e4ac69c5f1ae533ff5a62e2706dde72"
    }
  }
}
