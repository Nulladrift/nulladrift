                "type": "string"
              },
              "recipient_uei": {
                "description": "Exact federal UEI (Unique Entity ID) — most precise: only grants made to this UEI itself. If it is also the parent of other recipients, their grants are NOT included and total_count is omitted — coverage_warning names the parent; use recipient_name with that name for the whole family.",
                "type": "string"
              },
              "since": {
                "description": "Inclusive lower bound (YYYY-MM-DD) on last_modified_date — or on start_date when sort_by is start_date.",
                "type": "string"
              },
              "sort_by": {
                "description": "Sort key. since/until apply to start_date when this is start_date, and to last_modified_date for every other sort. Default: last_modified_date.",
                "enum": ["last_modified_date", "start_date", "award_amount", "total_outlays"],
