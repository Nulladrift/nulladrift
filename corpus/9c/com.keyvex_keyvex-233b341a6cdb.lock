        {
          "name": "get_federal_register_documents",
          "description": "Returns Federal Register documents — the daily-published collection of US executive branch regulatory + administrative actions. Use this for: regulatory tracking (what's the SEC / EPA / FDA proposing this week?), executive order monitoring, public-comment-period tracking, lobbying tie-in (cross-reference with get_lobbying_filings for 'who's pushing which rule'), or compliance forward-look on proposed regulations.  Source: federalregister.gov public REST API. Comprehensive — every Federal Register publication appears here.  Document types (document_type field):   'Rule'                  — final regulation (in effect)   'Proposed Rule'         — agency rule open for public comment   'Notice'                — formal notice (sunshine acts, hearings,                             authorizations, determinations, etc.)   'Presidential Document' — executive orders, proclamations, memoranda  Agency filtering: agency_slug uses URL-safe identifiers like 'securities-and-exchange-commission', 'environmental-protection-agency', 'food-and-drug-administration', 'federal-trade-commission'. Filter via agency_slug for exact-match; agency_name does case-insensitive substring for fuzzier 'I know the name but not the slug' lookups.  Composite document numbers (e.g., '2026-09385') are GPO-assigned and stable. Direct document_number lookup is fastest.  Pure-publisher posture: KeyVex returns the daily publication record as-is. No 'regulatory risk score' or 'likely-to-finalize' signals.",
