        },
        {
          "name": "get_enforcement_actions",
          "description": "Returns SEC + DOJ + CFTC + OCC + FDIC + FTC + Federal Reserve + FinCEN enforcement-related actions. Eight regulators, one tool. Use this when the user asks about: recent SEC charges, DOJ indictments, CFTC derivatives/swaps enforcement, OCC national-bank examination actions, FDIC bank-failure announcements or insured-deposit transfers, FTC antitrust / consumer-protection cases, Federal Reserve actions against banks and individual bankers, FinCEN anti-money-laundering (BSA) penalties, insider trading prosecutions, FCPA actions, fraud cases, or to add a 'negative event' flag to a ticker or person by cross-checking against insider trades, activist filings, or tender offers.  CATEGORY: every row is labelled `category`: \"enforcement\" (charges, suits, settlements, penalties, consent and court orders, monthly enforcement-action lists; every DOJ, Federal Reserve and FinCEN row) or \"agency_news\" (rule proposals, no-action letters, appointments, roundtables, bank-failure notices, speeches from the SEC, CFTC, OCC, FDIC and FTC press feeds). By DEFAULT only enforcement is returned; pass category=\"all\" for everything, or category=\"agency_news\" for the news alone. A direct action_id lookup returns the row whatever its category.  Sources:   source='sec'  — SEC press releases (sec.gov/news/pressreleases.rss).                   Rolling ~50-item RSS window; refreshes daily. SEC                   enforcement and policy statements are mixed in the                   same feed — filter by title substring (e.g.,                   'charges', 'fraud', 'insider trading') to narrow.   source='doj'  — DOJ press releases (justice.gov/api/v1/press_releases.json).                   Latest ~200 records refreshed daily; rich metadata                   including agency_component (issuing division) and                   topics[]. Common components: 'Criminal Division',                   'Antitrust Division', 'Tax Division', 'Civil Division',                   'Office of Public Affairs', 'United States Attorneys'.   source='cftc' — CFTC press releases (cftc.gov/PressRoom/PressReleases).                   HTML index scrape (no RSS). Rolling ~50-item window.                   Covers derivatives/swaps enforcement, prediction-market                   jurisdiction, spoofing prosecutions, and policy actions.                   v1A index-only (no body extracted) — follow `url` for                   the substantive announcement.   source='occ'  — OCC news releases (occ.treas.gov/news-issuances/                   news-releases/<year>/...). Covers national-bank                   enforcement, examination findings, capital/leverage                   rules, interagency announcements. Yearly index. Both                   OCC-only (`nr-occ-...`) and interagency (`nr-ia-...`)                   releases included; bulletins filtered out.   source='fdic' — FDIC press releases (fdic.gov/news/press-releases).                   Covers bank failures + insured-deposit transfers,                   exam-result releases, deposit-insurance rule changes,                   CRA evaluations. Bank-failure announcements are some                   of the highest-signal FDIC items for agents.   source='ftc'  — FTC press releases (ftc.gov RSS). Antitrust, merger                   reviews, deceptive-practices and consumer-protection                   enforcement. Rolling recent window.   source='fed'  — Federal Reserve enforcement actions (full history                   from the Board's enforcement-actions CSV). One record                   per action per party: cease-and-desist orders, civil                   money penalties, prohibitions from banking, written                   agreements — against BOTH banking organizations and                   individual bankers. topics[] holds the action type(s);                   agency_component holds the bank (or the individual's                   affiliated bank); terminated_date is set once the Fed                   terminates the action (absent = still open).   source='fincen'—FinCEN enforcement actions (fincen.gov, complete                   history). Rare, high-profile anti-money-laundering /                   Bank Secrecy Act penalties (e.g., TD Bank, Paxful,                   Brink's). topics[] holds the institution category;                   release_number holds the matter number; url points at                   the consent-order PDF.  v1A scope: metadata + teaser + description (capped ~3000 chars; empty for CFTC v1A). Full prose lives at `url` — agents follow for the substantive announcement. Pure-publisher posture: no derived 'severity' or 'outcome prediction' signals.  Identifier format: action_id is 'sec-{guid-or-slug}', 'doj-{uuid}', 'cftc-{release-number}', 'occ-{slug}', 'fdic-{slug}', 'ftc-{slug}', 'fed-{date}-{party}-{action}', or 'fincen-{matter-number}'. Stable across re-scrapes.  Cross-source tip: pair with get_insider_transactions to detect insider trades by executives at companies later named in enforcement charges, or with get_activist_stakes to spot enforcement-driven exit attempts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action_id": {
                "description": "Direct lookup ('sec-{guid}', 'doj-{uuid}', or 'cftc-{release-number}'). Fastest path.",
                "type": "string"
              },
