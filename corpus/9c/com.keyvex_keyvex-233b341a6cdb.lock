        {
          "name": "get_intraday_quote",
          "description": "Returns the latest intraday price for ONE US-listed ticker, live from Tiingo's IEX feed; a stock's quote is reused for up to 10 seconds, so two calls in the same 10 s can return the same print. PAID PLANS ONLY. Use this when the question is 'what is X trading at now'. For price HISTORY (daily closes, splits, dividends) use get_daily_prices.  Returns: price, and `as_of` — the exact timestamp of that quote, verbatim from the source. ALWAYS read `as_of` rather than assuming the quote is current: outside US market hours the feed returns the most recent session's final print, so a quote at 21:00 ET is a 16:00 ET price and `as_of` is how you can tell. `price_field` names the source field the price came from (tngoLast / last / mid) so a decision made on it can be re-derived later.  A symbol the feed does not cover returns result: null with not_found_reason — never a substituted or stale price. Two reasons are possible: 'no_quote_for_ticker' (unknown symbol, or no quote available) and 'delisted_no_longer_trading' (no trade has printed since our records show trading stopped, and the feed is repeating the last price at zero volume). The second exists because the upstream feed keeps synthesising a current-session row for such names — a flat zero-volume bar at the last real price, stamped with today's close — which is not a price anyone traded at. delisted_since and delisting_form appear only where an SEC delisting or deregistration filing (Form 25 / Form 15 families) is on file for the ticker; they are never inferred from prices.   ⚠ VENUE COVERAGE IS IEX ONLY, and `price` is Tiingo's tngoLast derived from that feed — not a consolidated-tape print. This matters most on THINLY TRADED names: IEX is one venue carrying a few percent of US volume, so a symbol can go 20+ minutes mid-session without IEX seeing a trade. When that happens `as_of` legitimately reads stale DURING market hours. It means 'IEX has not seen an update', NOT 'the stock is not trading' — measured 2026-09-09, BWFG sat at a 22-minute-old as_of while trading normally. Do not treat a stale as_of on a thin name as a fault.  Three fields let you judge that for yourself rather than trusting a verdict this tool does not make. `iex_session_volume` is the session volume ON IEX ONLY — it is NOT consolidated volume and is typically a small fraction of it, so never compare it against share counts from other endpoints. `prev_close` is the prior session's close. And `flat_session` is true when all four OHLC legs equal the price AND volume is zero AND the price equals prev_close — the shape the feed manufactures for a security that no longer trades. It is a SHAPE, not a delisting verdict: stable-NAV money market funds hold a constant price by design and look identical. It is NULL when the test was impossible — a missing OHLC leg or an unreported volume — and null means 'could not test', never 'false'.  One call = one ticker, by licence — there is no multi-ticker parameter. Close Prices from Tiingo.com.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ticker": {
                "description": "Ticker symbol, e.g. 'AAPL', 'SPY', 'BRK-B' (hyphen for share classes).",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Intraday Quote (live)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5589ad923aa37f279957d828d5da0facac4057759fe42a9453b64248724f370d"
        },
        {
          "name": "get_investment_advisers",
          "description": "Returns SEC Form ADV registry records — every SEC-registered investment adviser (~17K RIAs) and exempt reporting adviser (~6.5K ERAs, mostly private-fund advisers), from the SEC's monthly roster extract. One record per firm (CRD number) with regulatory AUM (discretionary / non-discretionary / total, Item 5F), employees and IA reps, client counts, custody flags (Item 9A), and disciplinary disclosure flags (Item 11, verbatim sub-question codes). Use this when the user asks: who advises/manages money, how big is an adviser, largest RIAs by state, advisers with disciplinary history, or to vet a firm before pairing with enforcement / holdings data.  firm_type: 'registered' RIAs report regulatory AUM; 'exempt_reporting' ERAs do NOT report Item 5F — their AUM fields are null by construction (they report private-fund data instead; see adviserinfo_url for Section 7.B detail).  Registry posture: this is a CURRENT-ROSTER snapshot refreshed monthly, not an event history. snapshot_month is the last month the firm appeared — a stale snapshot_month means the firm dropped off the roster (deregistered). min_aum filters on total regulatory AUM and requires the default aum_total sort. CIK is the join key to EDGAR datasets (13F institutional holdings, enforcement).  v1A maps a curated ~30-field subset of Form ADV Part 1A's 448-column grid; adviserinfo_url links the firm's full IAPD page.  Pure-publisher posture: the SEC's roster as published. A disciplinary FLAG is a disclosure, not a verdict — agents read the detail on IAPD.",
