        {
          "name": "get_insider_holdings",
          "description": "A ticker search also returns rows this issuer FILED UNDER SYMBOLS IT NO LONGER LISTS (renames, filer typos, ADR spellings). Each row keeps `ticker` as SEC received it and gains `current_ticker` when the issuer trades under a different symbol today. Separately-listed share classes are NOT merged, and asking for a RETIRED symbol returns only rows filed under it — retired symbols get reissued to other companies. When more than one issuer has filed under a ticker (a reused symbol, a holding-company reorganization), every row stays in the answer and carries `issuer_relation`: the row's own issuer and its relation to the ticker's issuer (same_issuer; predecessor or successor, on SEC evidence; related_by_name; affiliate; or different_issuer), with the evidence, such as the SEC succession form and its date. A ticker search also finds this issuer's rows filed under ANOTHER issuer's symbol, matched only on its CIK. Returns per-security INSIDER POSITIONS from SEC Form 3/4/5 filings — one row per holding line reported by a corporate insider (director, officer, or 10%+ beneficial owner). Use this when the user asks: what a specific insider currently HOLDS, who the largest insider holders of a stock are, an insider's position across companies, or direct-vs-indirect ownership structure. This is the position (stock) companion to get_insider_transactions (the buys/sells flow).  Source: SEC bulk Form 3/4/5 dataset (insider_holdings_v2), 2006→present, refreshed quarterly. Each row carries the filing envelope (company_cik, company_name, ticker, reporting_owner_cik/name, role flags, filing_date, period_of_report), the position (holding_type nonderiv|deriv, security_title, shrs_owned_following_trans, valu_owned_following_trans, direct_indirect_ownership D|I), and — for derivative holdings — conv_exercise_price, exercise_date, expiration_date, and underlying-security detail.  Useful filter combos:   ticker='NVDA', sort_order='desc'          most-recent NVDA insider holdings   reporting_owner_cik='0001214128'          one insider's positions everywhere   ticker='AAPL', holding_type='deriv'       AAPL insiders' option/RSU positions   ticker='TSLA', is_ten_percent_owner=true  10%+ owners of TSLA   company_cik='0000320193', min_value=1000000  Apple insiders holding >$1M   reporting_owner_name='Musk'               name substring (case-insensitive)  shares/value are 'following the reported transaction' — the position as of that filing, not a live real-time holding. For the trades themselves use get_insider_transactions; ownership ties together via reporting_owner_cik.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company_cik": {
                "description": "Issuer CIK (10-digit, leading-zero padded). Returns insider holdings across all reporting periods for that company.",
