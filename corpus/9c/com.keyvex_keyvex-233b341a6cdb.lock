                "type": "boolean"
              },
              "limit": {
                "description": "Maximum records. Default 50, max 500.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "series_id": {
                "description": "EDGAR series ID (e.g. 'S000096464') — one fund's monthly history.",
                "type": "string"
              },
              "since": {
                "description": "report_date lower bound (YYYY-MM-DD inclusive).",
                "type": "string"
              },
              "sort_by": {
