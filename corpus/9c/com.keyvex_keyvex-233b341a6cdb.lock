        {
          "name": "get_ferc_filings",
          "description": "Returns FERC eLibrary document records — every public filing at the Federal Energy Regulatory Commission: Issuances (orders, notices, delegated letters BY FERC) and Submittals (rate filings, tariff changes, compliance reports, protests, hydro license paperwork TO FERC) across the Electric, Natural Gas, Oil, Hydro, Rulemaking, and General libraries (~1,300 documents/week). Use this when the user asks about: a FERC docket or rate case, pipeline / utility / hydro regulatory activity, FERC orders affecting a company, or energy infrastructure proceedings.  The DOCKET NUMBER is the join key across a proceeding. Format: PREFIX + two-digit year + sequence, e.g. 'ER26-1234' (Electric rate), 'RP26-930' (gas pipeline rate), 'CP26-15' (gas pipeline certificate/construction), 'P-5737' (hydro project — no year), 'EL26-50' (Electric complaint/investigation), 'RM26-3' (rulemaking). docket_number accepts the root ('RP26-930') or a full sub-docket ('RP26-930-000'). Records carry docket_numbers (verbatim) plus docket_prefixes for quick classification.  Record shape: accession_number (e.g. '20260708-3001' — the unique document key), category ('Issuance' | 'Submittal'), description, filed/issued/posted dates, class_types (document class + type), libraries, authors[] / recipients[], and transmittal file metadata. Documents themselves are NOT in the record — agents download the primary attached file via source_url (eLibrary filedownload link).  Pure-publisher posture: FERC's search metadata as published — no outcome predictions or case scoring.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accession_number": {
                "description": "Direct lookup by FERC accession number (e.g. '20260708-3001').",
                "type": "string"
              },
              "category": {
                "description": "Issuance = BY FERC (orders, notices); Submittal = TO FERC (company filings).",
                "enum": ["Issuance", "Submittal"],
                "type": "string"
              },
              "class_type": {
                "description": "Case-insensitive substring against document class + type (e.g. 'order', 'tariff', 'protest', 'environmental').",
                "type": "string"
              },
              "docket_number": {
                "description": "Docket number — root ('RP26-930', 'P-5737') or full sub-docket ('RP26-930-000'). Returns every document in that proceeding.",
                "type": "string"
              },
              "library": {
                "description": "FERC library — code or name: E/Electric, G/Gas, O/Oil, H/Hydro, RM/Rulemaking, Gen/General. (Rare multi-library documents carry a concatenated value like 'RulemakingElectric' — FERC's own encoding — and only match that exact string.)",
                "type": "string"
              },
              "limit": {
                "description": "Maximum records to return. Default 50, max 500.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "Lower bound (YYYY-MM-DD inclusive) on the sort_by date field.",
                "type": "string"
              },
              "sort_by": {
                "description": "Default posted_date (when FERC published the document — filings can post up to ~4 days after filing).",
                "enum": ["posted_date", "filed_date"],
                "type": "string"
              },
              "sort_order": {
                "description": "Default: desc (most recent first).",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "text": {
                "description": "Case-insensitive substring against the document description (e.g. a company name).",
                "type": "string"
              },
              "until": {
                "description": "Upper bound (YYYY-MM-DD inclusive) on the sort_by date field.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "FERC eLibrary Filings"
          },
          "behavior": {
            "destructive": false,
