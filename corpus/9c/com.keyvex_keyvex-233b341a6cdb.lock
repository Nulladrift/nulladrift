schema, not an inference.    (2) ANOMALOUS-YEAR FILER-ENTRY PATTERN — date values with   out-of-range year components — e.g., 0012-11-21 or 0025-07-25   (likely 2-digit years entered into a 4-digit field), or 2027-01-25   on a 2026 filing / 2028-03-19 on a 2024 filing (likely single-digit   transpositions) — appear to be filer data-entry typos preserved   verbatim from SEC's primary filings. KeyVex verified on a stratified   spot-check that these values are byte-identical between SEC's primary   XML and SEC's bulk extract (22 / 22 matches across all observed   pattern faces); the SEC-to-KeyVex transit is faithful. The pattern   is ongoing — observed across filings from 2014 through 2026, not   legacy-only. Cross-reference filing_date to infer the likely   intended year.    (3) NUMERIC PRECISION — for data_source='bulk_v2', shares and   price_per_share mirror SEC's BULK Form 345 extract, which rounds to   2 decimals (e.g. 474.6, where the primary XML shows 474.598). That   rounding is SEC's, in the bulk feed — KeyVex stores the bulk value   verbatim (no rounding in the loader). Audit v2 numerics against the   bulk extract (the source of record), not the XML primary document,   which carries fuller precision. Dates and transaction codes DO match   the XML exactly.    (4) A DISCLOSURE DATE IS NOT CLOSED WHEN THE DAY ENDS. Filings keep   arriving bearing a disclosure_date that has already passed, because SEC   accepts them late and there is no cut-off after which a date stops   gaining rows. So the SAME disclosure_date window can return MORE rows   tomorrow than it did today, and a result cached against that date goes   quietly stale — the count does not change, so nothing looks wrong.    Observed 2026-08-14: the newest disclosure_date on the tape was still   2026-08-13, yet a row bearing 08-13 was first ingested at 07:01 ET the   NEXT morning. A caller working from the previous afternoon's view of   08-13 missed $1.26M of buying in a position it already held.    (5) SANITY-CHECK A BIG DOLLAR FIGURE AGAINST VOLUME, IN THIS API.   total_value is derived (shares x price) wherever SEC did not file a total,   so a filer's unit or decimal slip lands in it. The cheapest test is   whether that many shares could plausibly have traded:      get_daily_prices(ticker, since, until, include_ohlc=true) -> volume    Compare the reported share count to the session's volume. A purchase that   is a large multiple of everything that traded is worth a second look   before acting on it. Verified examples, 2026-08-14: COE reported 592,320   ordinary shares against 52,418 ADS traded — a 60:1 ADS ratio, not a real   $11.8M buy. EVGN reported 460,000 against 326,793 traded (141%) and was   FINE — Evogene is dual-listed on NASDAQ and Tel Aviv, so the US tape sees   only part of the volume. The check flags what to examine; it does not   decide. Both readings beat ranking by total_value and trusting the top.    RE-QUERY rather than reusing a prior window. 'Same disclosure date' does   not mean 'same rows'. If you need to detect what is NEW since your last   look, compare against the row identity you saw before rather than   assuming a closed date is settled — and note that a sync timestamp   moving is a statement about the JOB, not about the DATA.  Pure-publisher posture: KeyVex mirrors SEC's exact bytes, documents these conventions and filer quirks rather than altering them, and never silently 'corrects' a value to KeyVex's guess of what was meant. A customer auditing KeyVex against EDGAR's source of record for each row (the bulk Form 345 extract for v2 rows) will find a byte-for-byte match.  MACHINE-READABLE FLAGS — responses include a `source_metadata` block on rows where the above SEC-source patterns are detected. The block is keyed by field name, with an array of flag strings per field: `sec_perpetual_sentinel` (assertive — exact-string match on a known SEC sentinel value); `anomalous_year_likely_filer_entry` (calibrated — year outside the plausible range on transaction_date, exercise_date, expiration_date, or period_of_report; covers filing-pipeline data quality issues across the upstream-actor stack including filer typos, filing-agent default-epoch substitutions, and other cause-classes where the year falls outside any plausible range). Presence is the signal: clean rows have NO `source_metadata` field at all (not an empty object — the field is omitted entirely). Absence means 'no SEC source quirks detected,' NOT 'certified clean by audit' — agents weigh the difference. The raw source date values are preserved unchanged; the flag block carries KeyVex's labeled interpretation alongside, never replacing.",
