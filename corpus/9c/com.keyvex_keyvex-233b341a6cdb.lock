                "description": "Lead statute code (RANK_ORDER=1): CWA (Clean Water Act), CAA (Clean Air Act), FIFRA (pesticides), SDWA (drinking water), RCRA (hazardous waste), TSCA (toxic substances), CERCLA (Superfund), EPCRA (right-to-know). Rare others: AIM, MPRSA, MWTA.",
                "type": "string"
              },
              "since": {
                "description": "status_date lower bound (YYYY-MM-DD inclusive).",
                "type": "string"
              },
              "sort_by": {
                "description": "Default: status_date. fed_penalty surfaces the largest federal penalties (cannot be combined with since/until).",
                "enum": ["status_date", "fed_penalty"],
                "type": "string"
              },
              "sort_order": {
                "description": "Default: desc.",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code of a named facility (e.g., 'TX'). Derived from the case's facilities.",
                "type": "string"
              },
              "until": {
                "description": "status_date upper bound (YYYY-MM-DD inclusive).",
                "type": "string"
