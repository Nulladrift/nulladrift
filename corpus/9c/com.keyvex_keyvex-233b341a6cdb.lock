        {
          "name": "get_corporate_patents",
          "description": "Returns US patent applications from the USPTO Open Data Portal, keyed on the APPLICANT (the corporate owner). Each record is one application's front-page metadata: title, applicant(s), first inventor + inventor count, filing/effective dates, status, entity size, application type. Follow source_url (USPTO Patent Center) for the full file wrapper / documents.  Use this when the user asks: what is a company patenting, how many patents did a company file (and when), recent patents in a company's portfolio, or to cross-reference R&D output against insider/congressional activity, contracts, or fundamentals for the same company.  company_name is the corporate APPLICANT and matches case-insensitively, but patents are filed under an IP-HOLDING ENTITY, not the household brand. Use the full legal applicant string for best recall — e.g. 'Google LLC', 'Microsoft Technology Licensing, LLC', 'Amazon Technologies, Inc.', 'QUALCOMM Incorporated', 'International Business Machines Corporation', 'Meta Platforms, Inc.', 'NVIDIA Corporation', 'Lockheed Martin Corporation', 'The Boeing Company', 'Apple Inc.', 'Intel Corporation', 'Tesla, Inc.'.  COVERAGE — live-first (source:'live'): when company_name is set, each call queries USPTO live over the full ~12.9M-application index (the whole filing history of that applicant, most-recent first), with since/until on filing_date applied at the source. On USPTO outage the tool falls back to a cached recent slice for a dozen tracked big filers (source:'cache' + coverage_warning) — don't infer totals there. With NO company_name it serves that same recent cache (browse). application_number is a direct lookup.",
