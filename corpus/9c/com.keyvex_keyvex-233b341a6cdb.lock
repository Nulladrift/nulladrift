        {
          "name": "get_bank_financials",
          "description": "Quarterly FDIC financials (Call Reports) for every FDIC-insured US bank, 1984 on: one row per bank (the insured bank, not its holding company) per quarter-end. Amounts in $ THOUSANDS; ratios in percent (FDIC's, annualized). Income items are YEAR-TO-DATE (Q3 = nine months); roe_quarterly is one quarter. since/until: YYYY-MM-DD, inclusive, on report_date. Defaults: report_date desc, 50 rows. More: keyvex.com/docs/tools/get_bank_financials",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cert": {
                "description": "FDIC certificate #, the stable bank key.",
                "type": "integer"
              },
              "id": {
                "description": "'{cert}-{YYYY-MM-DD}'.",
                "type": "string"
              },
              "limit": {
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Name part, any case; 1-3 chars = whole word.",
                "type": "string"
              },
              "report_date": {
                "description": "Exact quarter-end, YYYY-MM-DD.",
                "type": "string"
              },
              "since": {
                "type": "string"
              },
              "sort_by": {
                "description": "total_assets: not with since/until.",
                "enum": ["report_date", "total_assets"],
                "type": "string"
              },
              "sort_order": {
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "state": {
                "description": "e.g. 'TX'.",
                "type": "string"
              },
              "until": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Bank Financials (FDIC)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e34687a8b627ad302328f9ea4b0a87112006328b7910d50d36678ec7feeca46f"
        },
