        {
          "name": "get_insider_transactions",
          "description": "Returns executive insider transactions filed on SEC Form 4 — open-market purchases and sales by officers, directors, and 10%-owners of public companies. Each record is one transaction line item from one filing.  Use this when the user asks about: insider buying or selling at a specific company, all recent insider activity across the market, transactions by a specific officer, or large insider trades by value.  Form 4 is the fastest insider-trade signal in the public record — must be filed within 2 business days of the trade. The reporting_lag_days field tells you how stale a particular disclosure is.  Returns BOTH non-derivative rows (direct common-stock buys/sells, RSU vests, grants, gifts, tax-withholding sales) AND derivative rows (option exercises, warrant conversions, RSU/PSU activity). Filter to one or the other with is_derivative; filter to specific transaction codes with transaction_codes.  Common transaction codes:   P open-market purchase   |  S open-market sale   A grant / award / RSU vest  |  M exercise of derivative   X exercise of in/at-the-money derivative  |  C conversion of derivative   F payment of exercise price or tax with shares  |  G bona fide gift   D disposition to issuer (forced)  |  I 401(k)/ESPP  |  V voluntary  ⚠ shares and price_per_share are NULLABLE, and null does not mean zero. SEC permits either to be omitted — the price can live in a footnote, and the share count is genuinely undetermined on instruments that convert at a future price (a convertible note settling on a later VWAP). Those filings state a dollar amount instead, so such rows carry total_value with a null shares. Before 2026-08-18 they were dropped from this dataset entirely. Do not do arithmetic on either field without a null check, and do not read a null share count as a trade of nothing — read total_value.  Useful filter combos:   ⚠ transaction_codes=['P'] IS NOT 'open-market buys'. SEC defines P as     'open market OR PRIVATE purchase', and the code alone says nothing     about whether the security is common stock. Verified 2026-08-14:     FLUT's code-P rows are $250M of Total Return Swaps (is_derivative=true)     and ATTO's are an $8.5M private placement. Both are correctly labelled     in transaction_nature and security_title — but a screen filtered on the     code alone ranks them top by size.   transaction_codes=['P'], is_derivative=false, include_non_open_market=false                                        genuine open-market common-stock buys                                        — the combination you almost always want   transaction_codes=['M','X']          option exercises (cash-out trigger)   transaction_codes=['A']              grants / RSU vests   is_derivative=true                   all option/RSU/warrant activity   is_derivative=false, transaction_type='sell', min_value=1000000                                        large open-market sells of common stock  Optional include_baseline=true: also returns matching Form 3 initial- ownership records (the insider's *starting* position when they first became an insider) under a `baselines` field. Use this when you need to know how big a sale is relative to the insider's full position — Form 4 alone shows the delta, Form 3 anchors the baseline. Requires ticker or company_cik to be set. Baseline rows with is_nil_filing=true are 'no securities owned' Form 3s (~half of all filings) — the insider filed but started with ZERO holdings; shares_owned 0 is the position, not missing data.  A ticker search also returns rows this issuer FILED UNDER SYMBOLS IT NO LONGER LISTS — renames, filer typos and ADR spellings all split a company's history across symbols. Each row keeps `ticker` exactly as SEC received it and gains `current_ticker` when the issuer trades under a different symbol today; the response carries `ticker_resolution` naming every symbol searched. Separately-listed share classes are NOT merged: GOOG does not return GOOGL. Asking for a RETIRED symbol returns only rows filed under it, because retired symbols get reissued to other companies. Rows found under a retired symbol are checked against the issuer's CIK, so a symbol another company files under today cannot leak its rows in. When more than one issuer has filed under the ticker (a reused symbol, a holding-company reorganization), every row stays in the answer and carries `issuer_relation`: the row's own issuer and its relation to the ticker's issuer (same_issuer; predecessor or successor, on SEC evidence; related_by_name; affiliate; or different_issuer), with the evidence, such as the SEC succession form and its date; the response's `ticker_issuers` lists them all. A ticker search also finds this issuer's rows filed under ANOTHER issuer's symbol, matched only on its CIK (`ticker_resolution.also_searched`). `current_ticker` also appears on any row whose issuer lists exactly one symbol today that is not the one filed. Coverage: full history on the bulk leg; the live-feed leg is scanned back 180 days, so a rename in the last few days may not be covered yet.  data_source SELECTS WHICH BACKING COLLECTION:   'bulk_v2' (DEFAULT as of 2026-05-24) — `insider_transactions_v2`     collection populated by SEC quarterly bulk Forms 3/4/5 TSV bundles.     Deeper history (2006q1 → latest published quarter, ~9.9M rows).     ⚠ RECENCY: the bulk dataset ends at the last PUBLISHED quarter     (SEC releases it ~2 weeks after quarter end). On simple recency     queries (descending sort, no v2-only filters) filings newer than     that boundary are AUTO-MERGED from the live daily feed, so the     default view stays current — coverage_warning says when this     happened. For post-boundary browsing with v2-only filters, query     data_source:'legacy' directly.     INLINED FOOTNOTES (footnote_refs[] with resolved text on every row),     aff10b5one 10b5-1 plan flag, full reporting_owners array, schema_era.     Filters: ticker, company_cik, reporting_owner_cik,     reporting_owner_name (substring), row_type ('nonderiv'|'deriv'),     trans_codes (aka transaction_codes — either spelling works on either     data_source), aff10b5one, schema_era ('pre_2023'|'2023_plus'),     since/until, sort_by ('transaction_date'|'filing_date').    PLAUSIBILITY FIELDS — WHAT THEY CAN AND CANNOT CONCLUDE:     Every row carries price_check and volume_check, and both are ALWAYS     non-null: they say whether each check ran, and why not when it did not.     Read those first.      ⚠ THE RAW MARKET VALUES ARE PAID-PLAN ONLY. price_range_low and     price_range_high (bulk rows), daily_range (legacy and live-feed rows) and     shares_vs_daily_volume are Tiingo market data, which KeyVex's licence     restricts to paid plans. On other plans those keys are OMITTED — not     null — and the response carries licensed_fields_withheld naming them.     The verdicts computed from them (price_check, price_outside_daily_range,     price_fits_date, volume_check, volume_verdict) are served on every plan.      ⚠ THE OTHER THREE ARE OFTEN ABSENT OR NULL, AND THIS TEXT USED TO SAY     'every row carries' ALL FOUR, WHICH WAS FALSE. Measured 2026-09-04 by     the KeyVex auditor over a 500-row market-wide March sample:       price_outside_daily_range  key present 500/500, NON-NULL on 178       volume_verdict             key present 500/500, NON-NULL on 178       shares_vs_daily_volume     key ABSENT on 500/500     The 322 nulls are exactly the rows where volume_check is not 'checked'     — so the reason is always available, on the field that says so.     shares_vs_daily_volume is stamped only alongside a NON-NORMAL volume     verdict, and the same sample contained no non-normal rows, so an     ordinary response carries it nowhere. Do not build on its presence.     A null here means NOT CHECKED. It never means fine.      They were served without definition until 2026-09-01, which is how     'impossible' came to read as a stronger claim than the check supports.      volume_verdict compares REPORTED SHARES against that day's recorded     volume, and shares_vs_daily_volume is the raw ratio so you can judge     for yourself:       'normal'     ratio <= 0.25       'outsized'   ratio > 0.25 — a large share of the day's tape       'impossible' ratio > 1 — MORE SHARES THAN THE DAY RECORDED.     ⚠ 'impossible' means the two numbers cannot both be right, NOT that the     trade did not happen. Our volume is one daily bar: it need not include     off-exchange or block prints, and a Form 4 may report several days'     activity on one date. Treat it as strong evidence of a reporting or     data problem worth investigating, not as proof the transaction is fake.       null = not judged. Computed only for market claims (codes P and S) —       a grant never touched the tape, so a ratio on it would be noise.      price_check says whether the price was tested against that day's bar:       'checked'            tested; price_outside_daily_range holds the result       'misdated'           tested; the price is OUTSIDE that day's bar (see                            daily_range) — price_outside_daily_range is TRUE —                            but fits the bar of price_fits_date, within 3                            calendar days. Read as: a real fill whose filer                            wrote the wrong date. KeyVex's own screens treat it                            as real: its dollar total is kept, it is not vetoed                            as non-open-market, and co-report resolution never                            drops it silently.       'no_price_reported'  the filer stated no price       'no_positive_price'  the filer stated a price of zero or less, so                            there was nothing to compare. The bar may be                            present — see volume_check.       'no_verdict_recorded' the day's bar was found (volume_check ran off                            it) but its high/low were unusable, so the price                            half is unjudged       'no_daily_bar'       no usable bar for that ticker and date     ⚠ THE LAST THREE ARE DELIBERATELY DISTINCT. Until 2026-09-04 all three     were served as 'no_daily_bar', which asserted a missing bar on rows     whose shares_vs_daily_volume — a ratio computable only FROM that day's     bar — was served three fields away. Found live by the trading     simulation. If you match on 'no_daily_bar', match on all four.      volume_check says whether the SHARES-vs-VOLUME check ran, and is now     independent of the price half: 'checked' | 'not_a_market_trade' |     'no_daily_bar'. A row can be volume_check 'checked' while price_check     is 'no_positive_price' — the bar was there, only the price was not.     price_outside_daily_range is true|false|null, and NULL MEANS NOT     CHECKED — never 'fine'. A row whose price_check is any value other than     'checked' or 'misdated' has not been vetted on price at all, so do not     read its silence as a pass.     CLUSTER BUY (every data_source): cluster_buy_insiders_30d = the number of     DISTINCT reporting owners (by CIK) with an open-market purchase in the same     ticker in the 30 days ending on this row's transaction_date, this row     included; cluster_buy = an open-market purchase row with that count >= 3.     AN OPEN-MARKET PURCHASE HERE IS CODE P SERVED AS transaction_nature     OPEN_MARKET ON A NON-DERIVATIVE ROW — not the code alone: a code-P row the     price or volume check serves as NON_OPEN_MARKET_TRANSFER (e.g. a fund     sponsor buying the issuer's notes) neither counts nor gets a count, and     INSUFFICIENT_DATA purchases are not counted (the basis says how many). Both     are NULL — never a guess — on a row that is not an open-market purchase, or     when the window cannot be counted; cluster_buy_basis always says which, e.g. 'owner CIK not     recorded for trades before 2026-07-01' (live-feed rows before then carry no     owner CIK; bulk rows always do).     BACKWARD-COMPAT: every v2 row also carries the LEGACY