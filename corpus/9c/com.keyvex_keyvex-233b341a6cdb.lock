        {
          "name": "get_oig_exclusions",
          "description": "Returns entries on the HHS Office of Inspector General 'List of Excluded Individuals/Entities' (LEIE). Anyone on this list is barred from billing Medicare, Medicaid, or any federal healthcare program. Updated monthly by OIG; KeyVex re-scrapes monthly and overwrites.  Use this when the user asks about: healthcare-fraud exclusions, Medicare/Medicaid program-integrity research (not employment or eligibility decisions about individuals — Terms §8A), geographic concentration of exclusions, or a specific person/business listed on LEIE.  Cross-source tip: pair with get_federal_contracts to flag contractors who appear on the exclusion list. A government contractor with an OIG exclusion is worth checking against the official LEIE at oig.hhs.gov.  Statutory exclusion types (the most common):   - 1128a1  Conviction of program-related crimes   - 1128a2  Conviction relating to patient abuse   - 1128a3  Felony conviction relating to healthcare fraud   - 1128a4  Felony conviction relating to controlled substances   - 1128b4  License revocation, suspension, surrender   - 1128b5  Exclusion or suspension under federal/state healthcare   - 1128b7  Fraud, kickbacks, and other prohibited activities   - 1128b8  Entities controlled by a sanctioned individual  Scope: the LEIE lists only CURRENTLY-ACTIVE exclusions — OIG removes a party once reinstated (reinstatements are a separate OIG publication not ingested here). So every record is, by definition, an active exclusion, and reinstatement_date is effectively always empty.  Pure-publisher posture: we surface the listing as-published. Some names match common-name individuals who aren't the excluded party — the agent / user is responsible for context disambiguation (DOB, address, NPI).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "business_name": {
                "description": "Case-insensitive substring against business_name only.",
                "type": "string"
              },
              "city": {
                "description": "Case-insensitive substring against city.",
                "type": "string"
              },
              "exclusion_type": {
                "description": "Statutory code (e.g. '1128a1', '1128b5').",
                "type": "string"
              },
              "general_category": {
                "description": "Exact match (case-sensitive): 'PHARMACY', 'PHYSICIAN', 'OTHER BUSINESS', 'DME COMPANY', 'CLINIC', etc.",
                "type": "string"
              },
              "is_business": {
                "description": "Filter to businesses only (true) or individuals only (false).",
                "type": "boolean"
              },
              "limit": {
