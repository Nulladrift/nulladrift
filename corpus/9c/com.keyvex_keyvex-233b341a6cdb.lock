        },
        {
          "name": "get_foreign_agents",
          "description": "Returns FARA registrations — US persons and firms registered with the DOJ as agents of a foreign principal under the Foreign Agents Registration Act. Use this when the user asks about: who is a registered foreign agent, which US firms work for a particular foreign government, recently-registered foreign agents, or to add a 'foreign- influence' flag to a lobbying firm, law firm, or PR firm.  Each record is one registrant ↔ foreign-principal relationship — a registrant representing three foreign principals appears as three records. The single highest-signal filter is foreign_principal_country:   foreign_principal_country='CHINA'  → every US agent acting for a                                        Chinese principal  Source: efile.fara.gov (DOJ National Security Division). v1A covers ACTIVE registrations. The registrant↔principal linkage is included; per-document filing detail and compensation figures are not — follow source_url to FARA eFile for those.  Cross-source pairing pattern:   FARA + get_lobbying_filings  — FARA is foreign-principal representation;       LDA is domestic lobbying. A firm in both is lobbying Congress on       behalf of a foreign government.   FARA + get_fec_contributions — foreign-agent firms whose people also       make political contributions.   FARA + get_congressional_trades — influence-and-trades overlay.  Identifier: registration_number is the FARA registration number. has_foreign_principal=false records are registrants with no currently- active foreign principal (still queryable as registered agents).  History: registrations that LEAVE DOJ's active list are kept with status:'terminated' (+ termination_observed_date) rather than deleted — a terminated registration is still real history. Default queries return BOTH; filter status:'active' for the current roster only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "foreign_principal_country": {
                "description": "Country of the foreign principal, matched uppercase (e.g. 'CHINA', 'RUSSIA', 'SAUDI ARABIA'). The key foreign-influence filter.",
                "type": "string"
              },
              "foreign_principal_name": {
                "description": "Case-insensitive substring against the foreign principal's name.",
                "type": "string"
              },
              "has_foreign_principal": {
                "description": "Filter to records that carry a foreign-principal relationship (true) or registrants with no active foreign principal (false).",
                "type": "boolean"
              },
              "limit": {
                "description": "Maximum records to return. Default 50, max 500.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "registrant_name": {
                "description": "Case-insensitive substring against the US registrant (agent) name.",
                "type": "string"
              },
              "registration_number": {
                "description": "Exact FARA registration number. Fastest lookup.",
                "type": "string"
              },
              "since": {
                "description": "ISO date (YYYY-MM-DD). Only records on or after this date, by sort_by.",
                "type": "string"
              },
              "sort_by": {
                "description": "Default: registration_date.",
                "enum": ["registration_date", "foreign_principal_reg_date"],
                "type": "string"
              },
              "sort_order": {
                "description": "Default: desc (most recent first).",
                "enum": ["desc", "asc"],
                "type": "string"
              },
              "status": {
                "description": "Registration status: 'active' = currently on DOJ's list; 'terminated' = left the list since ingestion (kept as history). Omit for both.",
                "enum": ["active", "terminated"],
                "type": "string"
              },
              "until": {
                "description": "ISO date (YYYY-MM-DD). Only records on or before this date.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Foreign Agents (FARA)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
