        {
          "name": "get_government_publications",
          "description": "Returns recent congressional + oversight publications from GovInfo across four collections. Use this when the user asks about:   - Committee reports on a specific bill or topic   - Recently signed public laws (the 'did it become law' signal)   - Congressional hearing transcripts (testimony from regulators,     CEOs, expert witnesses)   - GAO oversight reports (independent reviews of federal agencies     + programs, often precede SEC/DOJ enforcement on the same target)  Collections (filter via the `collection` enum):   CRPT       — Congressional Reports. Includes committee reports                accompanying bills (House hrpt / Senate srpt). Real-                time signal on what's about to move on the floor.   PLAW       — Public + Private Laws. Bills that were signed into                law. The 'what actually got done' record.   CHRG       — Congressional Hearings. Transcripts of House +                Senate committee hearings — testimony from agency                heads, executives, expert witnesses. Hearings often                PRECEDE enforcement actions (the public 'why did                this happen' conversation).   GAOREPORTS — GAO oversight reports. Independent congressional                oversight. NOTE: GovInfo's GAO collection is a                historical archive (~16.5K reports) that is not                receiving recent updates — GAO now publishes current                reports on gao.gov directly. Use this for historical                GAO research; recent reports won't appear here.  Identifier format: each `package_id` is GovInfo's globally-unique ID (e.g., 'CRPT-119hrpt27' for House Report 27 of the 119th Congress, 'PLAW-119publ12' for Public Law 12, 'CHRG-119hhrg54321' for House hearing 54321). Direct doc lookup by package_id is fastest.  Cross-source pairing pattern:   Hearing → trade by attending member: get_congressional_trades(       bioguide_id:'...', since:'<hearing date>')   GAO report on agency → SEC follow-on: get_enforcement_actions(       text:'<agency name>', since:'<GAO report date>')   Committee report → bill passage: get_bills + get_roll_call_votes  Full document body (PDF / HTML / XML) lives at `package_link`; v1A returns only metadata — agents follow the link for content.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "collection": {
                "description": "Filter to one collection: CRPT (committee reports), PLAW (public laws), CHRG (hearings), GAOREPORTS (GAO).",
