        {
          "name": "get_reg_a_offerings",
          "description": "Returns SEC Form 1-A filings — Regulation A+ 'mini-IPO' offering statements, 2015-06→present: companies raising up to $20M (Tier 1) or $75M (Tier 2) from the public without a full IPO. One record per filing with the issuer (SIC code, jurisdiction, year incorporated, employees, city/state), tier election, offering terms (security types, count, price, total aggregate amount, estimated net), service providers WITH FEES (underwriter, sales commissions, auditor, legal), and the issuer's summary financials from Part I (cash, assets, liabilities, equity, revenues, net income). Use this when the user asks about: Reg A / Reg A+ raises, mini-IPOs, small- cap capital formation, who's underwriting or auditing small offerings, or issuer financials before a raise.  form family: '1-A' initial | '1-A/A' amendment | '1-A POS' post-qualification amendment (is_post_qualification) | -W withdrawals (is_withdrawal, metadata-level). One offering typically chains 1-A → 1-A/A… → qualification → 1-A POS updates — filter cik + sort asc to read it.  Coverage (honest): the offering-statement family only. The Reg A+ periodic reports — 1-K annual (with actual proceeds raised), 1-SA semiannual, 1-Z exit — use different schemas and are a planned separate dataset. Offering circulars (253G) are prose documents — follow filing_index_url.  Pure-publisher posture: issuer-reported Part I numbers as filed, parsed by KeyVex.",
