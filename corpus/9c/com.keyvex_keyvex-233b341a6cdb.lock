              },
              "limit": {
                "description": "Default 50, max 500.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "product": {
                "description": "Exact product match (e.g., 'Mortgage', 'Debt collection', 'Credit reporting or other personal consumer reports').",
                "type": "string"
              },
              "since": {
                "description": "ISO date (YYYY-MM-DD). Applied to sort_by field.",
                "type": "string"
