        {
          "name": "get_company_profile",
          "description": "Returns ONE company's reference profile: legal name, CIK, tickers + exchanges, SIC industry classification, state of incorporation, HQ and mailing addresses, phone, fiscal year end, EIN, former names, a plain-English business summary (condensed from the latest 10-K Item 1), CEO + board of directors (from the latest DEF 14A proxy), federal- contract activity summary (USAspending join, with a ready-to-run get_federal_contracts query), company logo reference, and — on paid plans — the latest end-of-day closing price (price_eod; Close Prices from Tiingo.com). For price HISTORY use get_daily_prices. The price_iex_last / price_tngolast intraday fields remain unlicensed stubs.  ⚠ ASSEMBLED REFERENCE DATA — unlike KeyVex's mirror datasets, this profile is NOT byte-faithful government mirroring. Fields are assembled from multiple bases and each carries its own provenance envelope: source, source_type (mirrored | derived | self_collected | asserted | licensed), fetched_at, as_of, and per-field meta (e.g. the SEC accession number every derived field traces to). A field that cannot be established is UNKNOWN with a machine-readable reason; a field staler than its declared cadence reads as INSUFFICIENT_DATA (value retained for knowing consumption). Factual data only — no ratings, rankings, scores, or opinions.  Leadership staleness note: CEO/board come from the latest annual proxy and can lag mid-year changes; meta.leadership_change_events_since_proxy lists any 8-K Item 5.02 (officer/director change) filings made after the proxy — follow up with get_material_events for the detail.  Lookup is by ticker OR cik (exactly one required). Ticker matches the company's current EDGAR-listed tickers; renamed/delisted tickers miss — use the CIK. An ambiguous ticker (multiple CIKs) returns an error naming the candidate CIKs rather than guessing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cik": {
                "description": "SEC CIK, padded or not ('320193' or '0000320193'). Exactly one of ticker/cik.",
                "type": "string"
              },
              "ticker": {
                "description": "Company ticker, e.g. 'AAPL', 'BRK-B' (EDGAR hyphen convention for class shares). Exactly one of ticker/cik.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
