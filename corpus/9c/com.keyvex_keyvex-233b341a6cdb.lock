        },
        {
          "name": "get_economic_indicators",
          "description": "Returns observations of key US macro, energy, and fiscal indicators from four sources:   - BLS (Bureau of Labor Statistics): the canonical labor + price     statistics. ~20-series watchlist covering unemployment, payrolls,     wages, CPI, PPI, productivity. Most monthly, ECI/productivity     quarterly.   - FRED (Federal Reserve Economic Data, St Louis Fed): rates, money     supply, GDP, PCE inflation, jobless claims, Fed balance sheet,     breakeven inflation, dollar index. ~26-series watchlist. Some daily     (rates, dollar), weekly (Fed assets, jobless claims), monthly,     quarterly. Mortgage rates, Moody's corporate bond yields and     University of Michigan consumer sentiment are NOT carried: their     owners license them, and we do not hold a license.   - EIA (Energy Information Administration): WTI + Brent crude oil     spot prices, Henry Hub natural gas, US gasoline retail price, US     crude oil production. Unique energy data not in BLS or FRED.     Mostly weekly cadence.   - FiscalData (Treasury Bureau of the Fiscal Service): total public     debt outstanding TO THE PENNY, daily, 1993→present (split into     debt held by the public vs intragovernmental); Monthly Treasury     Statement gross receipts / outlays / deficit-or-surplus; average     interest rate actually paid on each Treasury security class     (Bills/Notes/Bonds/TIPS/FRN + nonmarketable, 2001→present).  Filter to one source via `source: 'bls' | 'fred' | 'eia' | 'fiscaldata'`. Default returns all four unified — `series_id` disambiguates across catalogs.  Use this when the user asks about: unemployment rate, jobs report, nonfarm payrolls, CPI / PCE / inflation, Fed Funds rate, Treasury yields, yield-curve inversion, money supply / M2, Fed balance sheet / QE / QT activity, GDP, housing starts, retail sales, jobless claims, trade balance, dollar strength, national debt / debt ceiling levels, monthly federal deficit, interest cost on the debt, or general macro context for cross-source analysis.  Categories (for filtering):   - rates          — Fed Funds, Treasury yields, yield spread   - gdp            — Real + nominal GDP, GDP growth rate   - activity       — Industrial production, housing starts, retail sales   - inflation      — CPI/PPI (BLS) + PCE/Core PCE/breakevens (FRED)   - employment     — Unemployment rates (U-3, U-6), payrolls, jobless claims   - labor-force    — Labor force participation rate   - wages          — Average hourly earnings, employment cost index   - hours          — Average weekly hours   - productivity   — Nonfarm productivity, unit labor costs   - money          — M2, Fed total assets, overnight reverse repo   - debt           — Federal debt (FRED quarterly + FiscalData daily to-the-penny),                     Treasury general account   - fiscal         — MTS monthly receipts, outlays, deficit/surplus (positive =                     deficit, negative = surplus, per Treasury's sign convention)   - trade          — Trade balance, trade-weighted dollar index   - sentiment      — no series at present (UMich sentiment needs a license)   - energy         — WTI/Brent crude, Henry Hub natural gas, retail gasoline,                     US crude production (EIA)  Period format is fixed-width per cadence so lexicographic sort = chronological:   - 2026M04 (April 2026), 2026Q01 (Q1 2026), 2026A01 (annual 2026),     2026W18 (week 18 of 2026), 2026D258 (day-of-year 258).  Set `latest_only=true` to get one record per series (the most-recent observation) — useful for 'where are things now' snapshot questions. Daily series under latest_only return only the latest day per series (deduped client-side); without it you can pull arbitrary history.  Pure-publisher posture: the unit on each series is documented in the `unit` field; we do not compute year-over-year deltas, seasonally adjust differently, or derive 'real' vs 'nominal' versions — agents do those calculations on top.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Bucket filter.",
                "enum": ["employment", "labor-force", "wages", "hours", "inflation", "productivity", "rates", "gdp", "activity", "money", "debt", "fiscal", "trade", "sentiment", "energy"],
                "type": "string"
              },
              "latest_only": {
                "description": "When true, return only the most-recent observation per series. Useful for 'current state' snapshots.",
                "type": "boolean"
              },
              "limit": {
                "description": "Default 50, max 500.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "period_type": {
                "description": "Cadence filter.",
                "enum": ["monthly", "quarterly", "semiannual", "annual", "weekly", "daily"],
                "type": "string"
              },
              "series_id": {
                "description": "Exact series ID. BLS examples: 'LNS14000000' (U-3), 'CES0000000001' (payrolls), 'CUUR0000SA0' (CPI). FRED examples: 'DFF' (Fed Funds), 'DGS10' (10Y Treasury), 'PCEPILFE' (Core PCE), 'M2SL' (M2), 'WALCL' (Fed assets). FiscalData examples: 'FISCAL-DEBT-TOTAL-DAILY' (daily national debt), 'FISCAL-MTS-DEFICIT-MONTHLY' (monthly deficit/surplus).",
                "type": "string"
              },
              "since_year": {
                "description": "Calendar-year lower bound (inclusive).",
                "type": "integer"
              },
              "sort_by": {
                "description": "Default period (chronological).",
                "enum": ["period", "value", "year"],
                "type": "string"
              },
              "sort_order": {
                "description": "Default desc.",
                "enum": ["desc", "asc"],
                "type": "string"
              },
              "source": {
                "description": "Filter to one source. Omit to query all four. BLS = canonical labor + price stats. FRED = rates, money, GDP, PCE inflation. EIA = energy prices + production. FiscalData = Treasury debt to the penny, MTS budget totals, avg interest rates on the debt.",
                "enum": ["bls", "fred", "eia", "fiscaldata"],
                "type": "string"
              },
              "until_year": {
                "description": "Calendar-year upper bound (inclusive).",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Economic Indicators (BLS / FRED / EIA)"
          },
          "behavior": {
