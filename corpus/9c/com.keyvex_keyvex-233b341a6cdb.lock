        {
          "name": "get_congressional_trades",
          "description": "Returns trade records disclosed by U.S. members of Congress under the STOCK Act — Senate eFD and House Clerk Periodic Transaction Reports (PTRs). Each record is one disclosed transaction by a member or their immediate family.  The same filings are published free as news at https://keyvex.com/disclosures under 5 U.S.C. § 13107(c).  Use this when the user asks about: who in Congress traded a specific stock, what trades a specific member made, recent congressional trading activity, or filings within a date range.  Important: This data is *disclosed* trades, with reporting lag up to 45 days. The disclosure_date is when the public could first see the trade; the transaction_date is when the trade actually happened. For 'what did Congress just disclose buying' questions, sort by disclosure_date. For 'what did Congress hold around a specific market event', filter by transaction_date.  Each amount is a range like '$1,001 - $15,000' (Senate filers report ranges, not exact amounts). The amount_min and amount_max fields parse those bounds for filtering. STOCK Act allows reporting in 11 standard ranges from $1,001 up to over $50,000,000.  Each record's party is the party the member held on the date of the record (a trade's transaction date, a disclosure's filing date); for a date outside the member's terms in office, the party of their nearest term (the last one before that date, or the first one after it).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amendment_status": {
                "description": "Filter by whether the row came from an original filing or an AMENDMENT. Default: all three, deliberately — most amendment rows are NOT duplicates, they are disclosures the amendment added (181 of 198 recent Senate amendment rows have no original). Use 'original' to exclude restatements, accepting that you will also drop genuinely new disclosures. 'unknown' is every House row: the Clerk index carries no amendment indicator, so it cannot be determined from the source.",
                "enum": ["original", "amendment", "unknown"],
                "type": "string"
              },
              "bioguide_id": {
                "description": "Member's permanent congressional ID, e.g. 'C001035' for Susan Collins. Preferred over member_name when known. Pair with get_member_profile to enrich a trade with the member's party/state/committee assignments.",
                "type": "string"
              },
              "chamber": {
                "description": "Filter to one chamber. Senate PTRs are HTML-parsed from efdsearch.senate.gov. House PTRs are PDF-parsed from disclosures-clerk.house.gov.",
                "enum": ["senate", "house"],
                "type": "string"
              },
              "cursor": {
                "description": "Pass the `next_cursor` from the previous response VERBATIM to fetch the next page. Keep every other filter and the sort identical while paging. Omit to start from the top.",
                "type": "string"
              },
              "exclude_superseded": {
                "description": "Drop ORIGINAL disclosures that a later amendment restates. Default FALSE — they are returned, marked `superseded_by_amendment: true`, and the envelope carries `superseded_rows_included` plus a coverage_warning naming the count. ⚠ SET THIS WHENEVER YOU ARE SUMMING AMOUNTS. A member who amends a report has BOTH versions in the data — Boozman's Chevron trade appears as an amendment and an original, identical in every visible field under two report ids — so any total over the default response DOUBLE-COUNTS them. 2,360 of 13,642 original Senate rows are in that state (measured 2026-08-27). It is not the default because Senate amendments do not declare WHICH report they replace, so the match is made on member + transaction date + ticker + owner + asset name; dropping on that identity alone is a judgement the caller should make knowingly. House rows are never affected — the Clerk index carries no amendment indicator, so their status is 'unknown' and they are never marked.",
                "type": "boolean"
              },
              "include_non_open_market": {
                "description": "Phase A v0.52.0 (2026-05-24): controls whether NON-MARKET events appear in the result. When false (honest default for direction queries), keeps ONLY OPEN_MARKET rows plus INSUFFICIENT_DATA rows (passthrough — unclassified is not the same as confirmed non-market, never silently dropped). Excludes both NON_OPEN_MARKET_TRANSFER (charitable contributions, gifts, donations detected in `comment`) AND EQUITY_COMP (rare for congressional but handled identically for parity). Honest-by-default: with transaction_type='buy'|'sell' → defaults to FALSE so a charitable contribution can't pollute a sell-total query. Without transaction_type → defaults to TRUE (everything tagged honestly). The transaction_type field on each row is NEVER mutated. Example: `member_name:'Pelosi', transaction_type:'sell'` by default EXCLUDES Pelosi's Trinity University contribution; `include_non_open_market:true` re-includes it. Envelope carries `unclassifiable_records_retained: N` when any INSUFFICIENT_DATA rows passed through.",
                "type": "boolean"
              },
              "limit": {
                "description": "Maximum records to return. Default 50, max 500.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "member_name": {
                "description": "Full or partial member name; case-insensitive substring match. Examples: 'Collins', 'Pelosi'.",
                "type": "string"
              },
              "min_amount": {
                "description": "Filter to trades with amount_min >= this value (USD). Use to focus on larger disclosed trades. Note: amount ranges are minimums, so '$1,001 - $15,000' has amount_min=1001.",
                "type": "number"
              },
              "owner": {
                "description": "Who owns the asset. STOCK Act covers spouse and dependent children's trades too — this filter narrows to one ownership category.",
                "enum": ["Self", "Spouse", "Joint", "Dependent"],
                "type": "string"
              },
              "since": {
                "description": "ISO date (YYYY-MM-DD). Only records on or after this date, using sort_by as the date field.",
                "type": "string"
              },
              "sort_by": {
                "description": "Field used by since/until and ordering. Default: disclosure_date (when the public first saw the trade).",
                "enum": ["disclosure_date", "transaction_date"],
                "type": "string"
              },
              "sort_order": {
                "description": "Default: desc (most recent first).",
                "enum": ["desc", "asc"],
                "type": "string"
              },
              "ticker": {
                "description": "Stock symbol filter, e.g. 'AAPL'. Case-insensitive. Leave empty to query across all tickers.",
                "type": "string"
              },
              "transaction_type": {
                "description": "Filter by disclosed transaction type. 'buy' = Purchase (P); 'sell' = Sale, full or partial (S); 'exchange' = Exchange (E) — bond maturities, corporate spin-offs, and share-class exchanges, which are disclosed trades too. Leave empty to include all three.",
                "enum": ["buy", "sell", "exchange"],
                "type": "string"
              },
              "until": {
                "description": "ISO date (YYYY-MM-DD). Only records on or before this date.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
