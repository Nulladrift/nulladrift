        {
          "name": "get_crowdfunding_offerings",
          "description": "Returns SEC Form C filings — Regulation Crowdfunding offerings, 2016-05→present: startup raises on Wefunder / StartEngine / Republic and other funding portals. One record per filing with the issuer (legal form, jurisdiction, incorporation date, website), the PORTAL (name + CIK + CRD), offering terms (security type — SAFEs appear as 'Other' with the description, price, target and maximum amounts, deadline, oversubscription), and the issuer's own DISCLOSED FINANCIALS (total assets, cash, revenue, net income, debt — current + prior fiscal year, dollars) plus employee count. Use this when the user asks about: startup crowdfunding activity, what a company raised on a portal, portal market share, early-stage issuers in a state, or revenue/assets of a crowdfunding company.  filing_type maps the form family: 'offering' (C, C/A) | 'progress_update' (C-U) | 'annual_report' (C-AR — re-discloses financials yearly) | 'termination' (C-TR). is_withdrawal covers the -W variants. One issuer CIK typically has a chain: C → C-U → C-AR… — filter cik + sort asc to read it. Financial fields are null where a variant omits them.  Reg A+ (Form 1-A 'mini-IPOs') is a different form family — planned as its own dataset; Reg D private placements are in get_private_placements.  Pure-publisher posture: issuer-reported numbers as filed, parsed by KeyVex — Form C financials are self-reported and generally unaudited (reviewed at most); treat them accordingly.",
