        {
          "name": "get_registration_statements",
          "description": "Returns SEC Form S-1 / S-3 / S-3ASR registration statements — securities offering registrations filed with the SEC. Use this when the user asks about: which companies are going public (IPO pipeline via S-1), shelf registrations (S-3 / S-3ASR — company registers securities to sell over multiple offerings without re-registering; large established issuers use the automatic S-3ASR variant), recent secondary offerings, registration amendments updating prior filings, or to bridge from a company name / ticker to the prospectus prose.  Forms covered:   S-1    — Initial registration (IPO + first-time registrants)   S-1/A  — Amendment to an S-1   S-3    — Shelf registration (issuers meeting reporting / market-cap            criteria; lets them issue securities over time without            re-registering each time)   S-3/A  — Amendment to an S-3   S-3ASR — Automatic shelf registration. The shelf form used by            Well-Known Seasoned Issuers (large established companies            like Apple, Ford, most of the S&P 500). Effective on            filing. These issuers file S-3ASR, NOT plain S-3.  Source: SEC EDGAR full-text search. Returns one record per filing, deduped by accession. Exhibit attachments (EX-10, opinion letters, fee tables, etc.) are filtered out — only the canonical form types are returned.  v1A is metadata only. Each record has filer name + CIK + optional ticker + SEC file_number, state, SIC code(s), and URLs. Substantive prospectus content (offering size, share counts, use of proceeds, risk factors, financial statements) lives at primary_document_url — agents follow for the prose.  SCOPE — covers S-1 (IPO), S-3 + S-3ASR (shelf, including WKSI auto shelves), plus /A amendments. S-8 employee-benefit-plan registrations, S-4 merger/acquisition registrations, and F-series foreign-issuer forms are NOT ingested. 424B prospectus supplements (offering takedowns off an existing shelf) are out of scope — query the shelf registration itself.  Amendment chains: all amendments share the same sec_file_number as the original. Use sec_file_number filter to fetch an entire amendment chain.  Pure-publisher posture: KeyVex doesn't derive 'likely-to-IPO' or 'price-target' signals from registration filings.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "exclude_amendments": {
                "description": "When true, drops /A amendments. Default false.",
                "type": "boolean"
              },
              "filer_cik": {
                "description": "Filer's SEC CIK (1-10 digits).",
                "type": "string"
              },
              "filer_name": {
                "description": "Case-insensitive substring against the filer's entity name (e.g., 'kraneshares', 'karyopharm'). NOTE: matched over a recent-filing window, so it reliably finds CURRENT filers but can miss an issuer whose registrations are older than that window. To pull a specific issuer's full registration history regardless of date, use filer_cik (most reliable) — e.g. Circle Internet Group is filer_cik 0001876042.",
                "type": "string"
              },
              "filer_ticker": {
                "description": "Ticker symbol (e.g., 'KPTI'). Often empty for IPO-stage S-1 filers (they don't have a ticker yet).",
                "type": "string"
              },
              "filing_id": {
                "description": "EDGAR accession number. Direct doc lookup.",
                "type": "string"
              },
              "filing_type": {
                "description": "Exact filing-type match.",
                "enum": ["S-1", "S-1/A", "S-3", "S-3/A", "S-3ASR"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum filings to return. Default 50, max 500.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "s1_only": {
                "description": "When true, restricts to S-1 family (S-1 + S-1/A) — the IPO / first-time pool.",
                "type": "boolean"
              },
              "s3_only": {
                "description": "When true, restricts to S-3 family (S-3 + S-3/A + S-3ASR) — the shelf pool, including automatic shelf registrations filed by Well-Known Seasoned Issuers.",
                "type": "boolean"
              },
              "sec_file_number": {
                "description": "SEC-assigned registration file number ('333-XXXXXX'). Stable across amendments — use to fetch a full amendment chain.",
                "type": "string"
              },
              "since": {
                "description": "file_date lower bound (YYYY-MM-DD inclusive).",
                "type": "string"
              },
              "sort_order": {
                "description": "Default: desc (most recently filed first).",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "until": {
                "description": "file_date upper bound (YYYY-MM-DD inclusive).",
                "type": "string"
              }
            },
            "type": "object"
          },
