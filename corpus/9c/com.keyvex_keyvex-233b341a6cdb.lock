        {
          "name": "get_federal_contracts",
          "description": "Returns federal contract awards from USAspending.gov — government spending data sourced from Treasury/GSA. Each record is one prime contract award (BPA Call, Purchase Order, Delivery Order, or Definitive Contract). Modifications appear as separate records.  Use this when the user asks about: who's getting federal contracts, how much a specific recipient (Lockheed Martin, RTX, Raytheon, Booz Allen, etc.) won this year/quarter, contracts by industry (NAICS code) or product type (PSC code), or to cross-reference congressional trading with contract awards.  Cross-source pattern (the political-alpha play):   1. get_congressional_trades(ticker:'LMT', since:'2026-01-01') —      find LMT trades by members of Congress.   2. get_federal_contracts(recipient_name:'Lockheed Martin',      since:'2026-01-01') — find LMT contract awards.   3. Compare timing — trades within 30 days before a major contract      are the high-signal cases.  ⚠ award_amount and total_outlays are NULLABLE, and total_outlays is null on MOST rows. USAspending omits Total Outlays from the search response about 75% of the time, and this tool now reports that as null rather than as $0 — a 0 here means the source really said zero. Do not do arithmetic on either field without a null check. Rows with a null value are excluded from min_amount filters and sort LAST, because a value we do not have cannot satisfy a threshold.  recipient_name is a case-insensitive substring match — use the parent name ('Lockheed Martin') to catch all subsidiaries.  COVERAGE — live passthrough (source:'live'): each call queries USAspending's API over the full dataset (2007-10 onward), with recipient/NAICS/PSC/min-amount/date filters applied server-side. The response's `total_count` is USAspending's authoritative award count for your filtered query — USE IT for volume answers (the `results` array is just the requested page). `total_count` is omitted — and coverage_warning says why — when USAspending cannot count the answer: a recipient_uei that is also the PARENT of other recipients (USAspending cannot filter to one UEI's own awards), recipient_name combined with recipient_uei, or a start_date window (sort_by start_date with since/until). Then has_more is true whenever the search stopped before the end. On USAspending outage the tool falls back to a recent cached window (source:'cache' + coverage_warning) — don't infer volume there.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "awarding_agency": {
                "description": "The TOPTIER awarding agency name — exact and case-sensitive; a sub-agency name (e.g. 'Defense Logistics Agency') or an abbreviation ('NASA') matches nothing. Examples: 'Department of Defense', 'National Aeronautics and Space Administration', 'Department of Health and Human Services'.",
                "type": "string"
              },
              "limit": {
                "description": "Maximum records to return. Default 50, max 500.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "min_amount": {
                "description": "Filter to awards with award_amount >= this value (USD). Use to focus on large contracts.",
                "type": "number"
              },
              "naics_code": {
                "description": "6-digit North American Industry Classification System code. Example: '541710' (R&D in Physical/Engineering/Life Sciences). Exact match.",
                "type": "string"
              },
              "psc_code": {
                "description": "Product or Service Code (4-character). Example: 'AR33' (R&D Space Flight Advanced Development). Exact match.",
                "type": "string"
              },
              "recipient_name": {
                "description": "Recipient name substring; case-insensitive match. Example: 'Lockheed Martin' matches 'LOCKHEED MARTIN CORP', 'LOCKHEED MARTIN MISSILES AND FIRE CONTROL', etc. USAspending also matches the PARENT company's name, so a parent name returns its subsidiaries' awards (e.g. Sikorsky under 'Lockheed Martin'). Combined with recipient_uei it is matched against that recipient's OWN name instead, and coverage_warning says how many awards it removed.",
                "type": "string"
              },
              "recipient_uei": {
                "description": "Unique Entity Identifier (replaced DUNS in 2022). 12-character alphanumeric. Exact match: only awards made to this UEI itself. If it is also the parent of other recipients, their awards are NOT included and total_count is omitted — coverage_warning names the parent; use recipient_name with that name for the whole family.",
                "type": "string"
              },
              "since": {
                "description": "ISO date (YYYY-MM-DD). Only records on or after this date — on last_modified_date, except when sort_by is start_date, where it applies to start_date.",
                "type": "string"
              },
              "sort_by": {
                "description": "Field used for ordering. since/until apply to start_date when this is start_date, and to last_modified_date for every other sort. Default: last_modified_date (most-recently-modified first).",
                "enum": ["last_modified_date", "start_date", "award_amount", "total_outlays"],
                "type": "string"
              },
              "sort_order": {
                "description": "Default: desc.",
                "enum": ["desc", "asc"],
                "type": "string"
              },
              "until": {
                "description": "ISO date (YYYY-MM-DD). Only records on or before this date (the same date field as since).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Federal Contracts (USAspending)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:56e99274474afc05945c6d8b59ea2a80950a64b0c44e120f659298a7b40d78bb"
        },
        {
          "name": "get_federal_grants",
          "description": "Returns federal GRANTS and cooperative agreements from USAspending. Distinct universe from get_federal_contracts — recipients here are universities, non-profits, state and local agencies, research labs, healthcare institutions, public-private partnerships.  ⚠ award_amount and total_outlays are NULLABLE. USAspending omits Total Outlays from the search response for most grants, and this tool reports that as null rather than as $0 — a 0 means the source really said zero. Null-check before doing arithmetic. Null values never satisfy min_amount and sort last.  Award type codes covered: 02 (Block Grant), 03 (Formula Grant), 04 (Project Grant — most common), 05 (Cooperative Agreement).  Killer query patterns:   - All NIH R01 grants this quarter: cfda_number='93.847' + since=...   - State and local infrastructure funding: awarding_agency='Department of Transportation' + min_amount=1000000   - Recipient-specific grant history: recipient_name='Stanford'   - Recipient by federal UEI: recipient_uei='ABC123XYZ' (most precise)  Source: api.usaspending.gov — official Treasury federal-spending data. Awards covering both COVID/IIJA emergency-funding codes and routine appropriations. Pure-publisher posture: raw award data, no derived rankings or performance scores.  COVERAGE — live passthrough (source:'live'): each call queries USAspending's API over the full dataset (2007-10 onward), with recipient/CFDA/min-amount/date filters applied server-side. The response's `total_count` is USAspending's authoritative grant count for your filtered query — USE IT for volume answers (the `results` array is just the requested page). `total_count` is omitted — and coverage_warning says why — when USAspending cannot count the answer: a recipient_uei that is also the PARENT of other recipients (USAspending cannot filter to one UEI's own grants), recipient_name combined with recipient_uei, or a start_date window (sort_by start_date with since/until). Then has_more is true whenever the search stopped before the end. Note: live cfda_number matching is against the award's FULL assistance-listings array (awards can carry several CFDAs); the cached fallback matches the primary listing only. On USAspending outage the tool falls back to a recent cached window (source:'cache' + coverage_warning) — don't infer volume there.",
