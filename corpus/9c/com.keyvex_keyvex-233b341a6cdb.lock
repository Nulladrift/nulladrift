                "type": "string"
              },
              "bidder_cik": {
                "description": "Bidder's SEC CIK. Find all tender offers by a particular acquirer.",
                "type": "string"
              },
              "bidder_name": {
                "description": "Case-insensitive substring against bidder_name. Bidders in SC TO-T are often private SPVs ('2025 Acquisition Company, LLC') — use this to find them by issuer / parent name.",
                "type": "string"
              },
              "exclude_amendments": {
                "description": "When true, drops /A amendment filings. Default false (amendments included).",
