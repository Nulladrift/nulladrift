        {
          "name": "get_activist_stakes",
          "description": "Returns Schedule 13D / 13G beneficial-ownership disclosures — filings made by anyone holding ≥5% of a class of registered equity securities. Each record is one reporting person on one filing (joint filings emit multiple rows under the same accession_number).  Use this when the user asks about: who's accumulating large stakes, activist campaigns, takeover targets, hostile bids, or institutional concentration in a name. Also for 'who owns this company at the 5%+ level?' questions.  Two flavors, distinguished by `is_activist`:   - **13D (is_activist=true)**: filer signals INTENT TO INFLUENCE     control. Activist campaigns, takeover stakes, hostile bidders.   - **13G (is_activist=false)**: filer is PASSIVE. Mutual funds,     advisers, banks, insurers, qualified institutional holders.  Filter `is_activist: true` to see only the takeover-style filings — much higher signal-to-noise than the 13G firehose, which is dominated by routine quarterly disclosures from Vanguard, BlackRock, etc.  COVERAGE FLOOR: KeyVex's ingestion of Schedule 13D/G filings begins January 2024. Filings before 2024 are not in the collection. A 13D/G query for activity in 2023 or earlier returns zero records — this is the collection's coverage boundary, not a per-entity gap.  13D/A and 13G/A AMENDMENT EXIT FILINGS: when a filer reports they have divested below the 5% threshold, the resulting row carries shares_owned: 0 and percent_of_class: 0. These rows are CORRECT — an exit IS zero — not missing data. To distinguish active stakes from exit filings, filter by shares_owned > 0 or by min_percent_of_class.  ⚠ THIS TEXT USED TO SAY Item 4 WAS NOT AVAILABLE HERE. It is, as of 2026-08-28. Pass include_filing_narrative:true for the filer's own 'Item 4: Purpose of Transaction' — where board seats, consent rights and control intentions are actually declared — plus Item 2 (the ownership chain behind the filer), Item 2(d)-(e) (criminal and civil proceedings, as prose), Item 3 (source of funds) and Item 6 (the contracts with the issuer that implement Item 4). It is off by default only because it is long, not because it is missing: measured at 58.5% of a row. Rows holding withheld narrative say so via filing_narrative_available. 13D only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company_cik": {
                "description": "Issuer SEC CIK (10-digit, padded with leading zeros). Alternative to ticker.",
                "type": "string"
              },
              "cusip": {
                "description": "9-character CUSIP of the security being reported on. Useful for cross-class filings (preferred vs common).",
                "type": "string"
              },
              "filer_cik": {
                "description": "Filer (reporting person) CIK. Exact match.",
                "type": "string"
              },
              "filer_name": {
                "description": "Full or partial filer name; case-insensitive substring match. Example: 'BlackRock' matches all BlackRock entities.",
                "type": "string"
              },
              "filing_type": {
                "description": "Exact filing type. /A variants are amendments. Original 13D/G filings (no /A) signal a fresh crossing of the 5% threshold.",
                "enum": ["SCHEDULE 13D", "SCHEDULE 13D/A", "SCHEDULE 13G", "SCHEDULE 13G/A"],
                "type": "string"
              },
              "include_filing_narrative": {
                "description": "Include the Schedule 13D narrative items in each row: Item 2 (the reporting person and the ownership chain behind them), Item 2(d)-(e) (criminal convictions and civil securities proceedings in the last five years, as PROSE — usually a denial, never reduced to a flag), Item 3 (source of funds: own money vs borrowings), Item 4 (PURPOSE OF TRANSACTION — the filer's own statement of intent, where board seats, consent rights and control ambitions are declared) and Item 6 (the contracts with the issuer that implement Item 4). Default FALSE because these are long: measured at 58.5% of a row and ~548 KB on a 50-row page, and the same text repeats once per reporting person on a filing. Ask for it when researching WHY a stake was taken; leave it off when you want the numbers. Rows that have narrative available but withheld carry `filing_narrative_available: true`, so an absent field is never mistaken for a filer who said nothing. 13D only — 13G filings carry no narrative items.",
                "type": "boolean"
              },
              "is_activist": {
                "description": "Filter to 13D filings only (true) or 13G only (false). Omit to include both. Use is_activist=true to surface takeover/activist signal.",
                "type": "boolean"
              },
              "limit": {
                "description": "Maximum records to return. Default 50, max 500.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "min_percent_of_class": {
                "description": "Filter to filings where percent_of_class >= this value. Use to focus on large/concentrated stakes.",
                "type": "number"
              },
              "since": {
                "description": "ISO date (YYYY-MM-DD). Only records on or after this date, using sort_by as the date field.",
                "type": "string"
              },
              "sort_by": {
                "description": "Field used for ordering and for the since/until date filters. Default: filing_date.",
                "enum": ["filing_date", "event_date", "percent_of_class", "shares_owned"],
                "type": "string"
              },
              "sort_order": {
                "description": "Default: desc (most recent / largest first).",
                "enum": ["desc", "asc"],
                "type": "string"
              },
              "ticker": {
                "description": "Issuer stock symbol filter, e.g. 'AAPL'. Case-insensitive.",
                "type": "string"
              },
              "until": {
                "description": "ISO date (YYYY-MM-DD). Only records on or before this date.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Activist Stakes (SEC Schedule 13D/13G)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8e9ec2a582c9270420bfe4f77236974b0801b8b538ded0ac5d34ccd3b20ba4f2"
        },
        {
          "name": "get_aircraft_registry",
          "description": "Returns FAA aircraft registrations — the releasable registry of ~314K currently US-registered aircraft, one record per N-number: the aircraft (manufacturer, model, seats, engines, weight class, year built, engine type), and the REGISTRANT — name, type (Individual / Corporation / LLC / Government / Co-Owned, the FAA's own legend, with the verbatim code), address, and up to five co-owner names. Use this when the user asks: who owns an aircraft (by N-number), what aircraft a company / person / nonprofit registers, corporate-jet fleets, aircraft registered in a state, or to join tail numbers seen in flight-tracking data to owners.  Lookups: n_number is a direct hit ('N123AB' or '123AB'). registrant_name matches the primary registrant AND co-owner names. Note: many corporate jets register through trustee banks (e.g. 'BANK OF UTAH TRUSTEE') or aircraft-management LLCs — an absent company name is NOT proof the company has no aircraft.  Registry posture: a CURRENT-roster snapshot refreshed monthly from the FAA's daily-updated file. snapshot_date is the last snapshot a record appeared in — stale means since deregistered. Deregistered- aircraft history (the FAA DEREG file) is a planned follow-up.  Pure-publisher posture: FAA records as published, parsed by KeyVex; type labels are the FAA's own documentation legends, never our inference.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aircraft_type_code": {
                "description": "FAA code: 4 fixed-wing single-engine, 5 fixed-wing multi-engine, 6 rotorcraft, 1 glider, 2 balloon, 9 gyroplane, H hybrid lift, O other.",
                "enum": ["1", "2", "3", "4", "5", "6", "7", "8", "9", "H", "O"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum records. Default 50, max 500.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "manufacturer": {
                "description": "Case-insensitive substring against the manufacturer (e.g., 'gulfstream', 'cessna').",
                "type": "string"
              },
              "n_number": {
                "description": "Direct lookup by registration (with or without the N prefix).",
                "type": "string"
              },
              "registrant_name": {
                "description": "Case-insensitive substring against registrant + co-owner names.",
                "type": "string"
              },
              "registrant_type_code": {
                "description": "FAA code: 1 Individual, 2 Partnership, 3 Corporation, 4 Co-Owned, 5 Government, 7 LLC, 8 Non-Citizen Corp, 9 Non-Citizen Co-Owned.",
                "enum": ["1", "2", "3", "4", "5", "7", "8", "9"],
                "type": "string"
              },
              "sort_by": {
                "description": "Default last_action_date (most recent registry activity first).",
                "enum": ["last_action_date", "year_mfr"],
                "type": "string"
              },
              "sort_order": {
                "description": "Default desc.",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "state": {
                "description": "Two-letter registrant state (e.g., 'TX').",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Aircraft Registry (FAA)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:eda6681f5ce5707db76453cc44dfa6d63d7bb6752e47d6de9cec13d8ae5a2513"
        },
        {
          "name": "get_alerts",
          "description": "Your watchlist alerts, newest first: events matched to the tickers, members of Congress and federal-contract\nrecipients (UEIs) on YOUR watchlist, for the API key making the call. Kinds:\n  congress_trade: a congressional trade disclosed this week in a ticker or by a member on your watchlist.\n  initial_13d: an initial Schedule 13D (a new 5%+ activist stake) filed this week in a ticker on your watchlist.\n  federal_contract: federal awards at or above your threshold that KeyVex first reported this week, new or newly modified (a later modification of an award you were already alerted to does not alert again).\nAn event alerts only when its own date (disclosure, filing, the award's latest modification) is within 7 days of\ndetection and not before you added the entry, so a watchlist never replays history. Each alert's `data` is the\nsource record as KeyVex stored it when the alert fired, with KeyVex's internal `_` fields removed; the matching\ntool may present the same record differently. Paginate with next_cursor. The watchlist itself is managed on\nkeyvex.com.\nWebhooks (paid plans, Basic and up): each POST carries X-KeyVex-Timestamp and X-KeyVex-Signature = sha256 HMAC of\n'<timestamp>.<raw body>' with your secret. Receivers MUST verify the signature and REJECT a timestamp older than\n5 minutes (replay protection); redirects are never followed; answer 2xx within 5 s.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "next_cursor from the previous page.",
                "type": "string"
              },
              "kind": {
                "description": "Only this kind.",
                "enum": ["congress_trade", "initial_13d", "federal_contract"],
                "type": "string"
              },
              "limit": {
                "description": "Page size (default 50).",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "Only alerts detected at or after this ISO date or date-time.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c342edcb4dbf9e2b946e45c4b9ab900dfb611119b236e524acd74d70a5cd4955"
        },
        {
          "name": "get_annual_financial_disclosures",
          "description": "Returns Form 278 (Public Financial Disclosure / Annual Financial Disclosure) filings — the annual snapshot members of Congress file each year showing assets, income sources, liabilities, transactions, gifts, outside positions, and (for spouse + dependent children) the same.  The same filings are published free as news at https://keyvex.com/disclosures under 5 U.S.C. § 13107(c).  SCOPE — v1 covers BOTH chambers: Senate (Senate eFD) and House (House Clerk). Filed by every senator and representative (and senior executive-branch officials, federal judges) by May 15 each year.  Use this when the user asks about: a member's asset composition, outside income sources, board seats / outside positions, liabilities (mortgages, loans), or for news reporting on annual disclosures.  CONTENT — when a filing's schedules were machine-parsed, `content_parsed` is true and the record carries structured `assets` (Schedule A) and `liabilities` arrays plus `asset_count` / `liability_count`. `value_range` / `amount_range` are the disclosed RANGES (e.g., '$50,001 - $100,000'), NOT point estimates — KeyVex does not collapse a range to a single number. SENATE rows carry the ranges verbatim. HOUSE rows are read from the House Clerk PDF by column position. On a House candidate or new-filer report, whose income prints in two columns ('current year to filing', 'preceding year'), `income_range` is empty — neither is the reporting period; `report_url` shows both. A row KeyVex could not read with confidence carries `parse_unreliable: true`, and for such rows `report_url` is authoritative. Net-worth roll-up is intentionally NOT provided (it would be a KeyVex-derived aggregate, not a disclosed value). When schedules are unavailable — Senate PAPER (scanned-image) filings, which carry no machine-readable text, or the occasional parse skip — `content_parsed` is false and `coverage_note` names the limitation; follow `report_url` to read the original. This honest coverage boundary is never a silent omission.  Different from get_congressional_trades: PTRs are per-trade real-time notices (filed within 30-45 days), while Form 278 is the year-end balance-sheet snapshot. Combine both for the full activity + position view of a member.  Report types: 'Annual' (yearly filing covering prior calendar year), 'New Filer' (initial disclosure on entering office), 'Termination' (final disclosure on leaving office), 'Combined' (annual+termination for filer who left mid-year), 'Amendment' (correction of a prior filing), 'Other' (rare).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bioguide_id": {
                "description": "Filer's bioguide_id (e.g., 'P000197' for Nancy Pelosi). Exact match. Most precise filter. A filing carries a bioguide_id only when exactly one member of Congress can be its filer: reports by candidates who never served carry none, and neither does a filing saved before its filer appeared in the member catalog. So for a brand-new member, cross-check with member_name.",
                "type": "string"
              },
              "chamber": {
                "description": "Filter to one chamber ('senate' or 'house'). v1 covers both.",
                "enum": ["senate", "house"],
                "type": "string"
              },
              "filing_year": {
                "description": "The year of the FILING period being reported on (NOT the date filed). Most filers report the prior calendar year — e.g., a May 2026 Annual filing has filing_year=2025. New Filer reports cover the partial year up to filing.",
                "maximum": 2100,
                "minimum": 1990,
                "type": "integer"
              },
              "limit": {
                "description": "Max records to return (1-500). Default 50.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "member_name": {
                "description": "Substring match against the filer's full name (case-insensitive). E.g., 'Pelosi', 'Mitch McConnell'. Use bioguide_id when possible for precision.",
                "type": "string"
              },
              "party": {
                "description": "Exact match on the record's party, where the party is the party the member held on the date of the record (a trade's transaction date, a disclosure's filing date); for a date outside the member's terms in office, the party of their nearest term (the last one before that date, or the first one after it). So party='Democrat' matches filings made while the filer was a Democrat. Empty on filings by candidates who never served.",
                "type": "string"
              },
              "report_type": {
                "description": "Filter to one filing flavor. Default is unfiltered (returns all types).",
                "enum": ["Annual", "New Filer", "Termination", "Combined", "Amendment", "Periodic", "Other"],
                "type": "string"
              },
              "since": {
                "description": "ISO date (YYYY-MM-DD). Lower bound on the chosen sort_by field. Defaults to filtering by filing_date.",
                "type": "string"
              },
              "sort_by": {
                "description": "Field to sort by. Default 'filing_date' (most recent filings first).",
                "enum": ["filing_date", "filing_year"],
                "type": "string"
              },
              "sort_order": {
                "description": "Sort direction. Default 'desc'.",
                "enum": ["desc", "asc"],
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code (e.g., 'CA', 'TX'). Exact match. Empty for candidate filings (the Senate eFD covers candidates too).",
                "type": "string"
              },
              "until": {
                "description": "ISO date (YYYY-MM-DD). Upper bound on the chosen sort_by field.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Annual Financial Disclosures (Form 278)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ef7a857003d0bcfb758e63f91f846d3c649b812380822941867219071392ce50"
        },
        {
          "name": "get_bank_financials",
          "description": "Returns quarterly financials for every FDIC-insured US bank — FDIC BankFind Suite (RIS) data derived from Call Reports, one record per (bank, quarter-end) from 1984 to the present. Covers ~4,400 active institutions per modern quarter, most of which never file with the SEC — this is the banking-sector complement to get_fundamentals. Use this when the user asks about: a specific bank's assets / deposits / profitability / capital ratios, bank league tables ('largest banks in Texas'), deposit flight or brokered-deposit reliance, nonperforming-asset trends, or to pair bank fundamentals with OCC/FDIC/Fed enforcement actions and CFPB complaints.  Record shape: identity (cert = FDIC certificate number, the stable bank key; name/city/state), balance sheet in $ THOUSANDS (total_assets, total_deposits, equity_capital, net_loans_leases, securities, loan buckets, brokered_deposits, insured-deposit estimates), income statement in $ thousands (net_income, interest income/expense, noninterest income/expense, provisions), and FDIC-computed ratios in percent (roa, roe, net_interest_margin, efficiency_ratio, leverage_ratio, tier1_risk_based_ratio, cet1_ratio, total_risk_based_ratio, nonperforming_assets_ratio, net_chargeoffs_ratio, loans_to_core_deposits).  CONVENTIONS (Call Report): income-statement items are YEAR-TO-DATE (Q3 net_income = nine months, not the quarter alone; Q4 = full year); ratios are FDIC's annualized computations; roe_quarterly is the single-quarter ROE. Balance-sheet items are point-in-time.  Matching a bank: cert (FDIC certificate #) is exact and stable — resolve it once via a name substring query, then use cert for history. Banks are subsidiaries: 'JPMorgan Chase Bank, National Association' (cert 628) is the insured bank, not the NYSE-listed holding company — for the parent's SEC financials use get_fundamentals.  League tables: report_date='<quarter-end>' + sort_by='total_assets' (e.g., report_date '2026-03-31'). Quarter-ends are 03-31 / 06-30 / 09-30 / 12-31. Latest quarter fills in progressively for ~60 days after quarter end as banks file.  Pure-publisher: FDIC's numbers as published, no derived health scores.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cert": {
                "description": "FDIC certificate number (exact) — the stable bank identifier (e.g., 3511 = Wells Fargo Bank NA, 628 = JPMorgan Chase Bank NA).",
                "type": "integer"
              },
              "id": {
                "description": "Direct lookup: '{cert}-{YYYY-MM-DD}' (e.g., '3511-2026-03-31'). Fastest path.",
                "type": "string"
              },
              "limit": {
                "description": "Maximum records to return. Default 50, max 500.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Case-insensitive substring against the institution name (e.g., 'silicon valley', 'first republic').",
                "type": "string"
              },
              "report_date": {
                "description": "Exact quarter-end (YYYY-MM-DD: 03-31 / 06-30 / 09-30 / 12-31). Combine with sort_by='total_assets' for league tables.",
                "type": "string"
              },
              "since": {
                "description": "report_date lower bound (YYYY-MM-DD inclusive).",
                "type": "string"
              },
              "sort_by": {
                "description": "Default report_date. total_assets requires an exact report_date filter (league-table mode).",
                "enum": ["report_date", "total_assets"],
                "type": "string"
              },
              "sort_order": {
                "description": "Default: desc.",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code (exact, e.g., 'CA', 'TX').",
                "type": "string"
              },
              "until": {
                "description": "report_date upper bound (YYYY-MM-DD inclusive).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Bank Financials (FDIC)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dc29e9e3babd3126181fb84b0febfe990cd40f7f67d01b8505a25ba3fb2413ba"
        },
        {
          "name": "get_bills",
          "description": "Returns congressional bill metadata from api.congress.gov. Use this when the user asks about: bills introduced this Congress, the status of a specific bill, House vs Senate bill volume, what bills mention a topic, or to bridge from a roll-call vote (legislation_type + legislation_number) to the underlying bill.  Source: api.congress.gov v3 (Library of Congress). Covers ALL bill types: HR (House Bill), S (Senate Bill), HRES (House Simple Resolution), SRES (Senate Simple Resolution), HJRES (House Joint Resolution), SJRES (Senate Joint Resolution), HCONRES (House Concurrent Resolution), SCONRES (Senate Concurrent Resolution).  v1A returns metadata only: title, type + number, originating chamber, latest action (date + text), and links. Sponsors, cosponsors, full action history, bill text, and CRS summaries live at `api_url` (structured JSON) and `congress_gov_url` (public HTML). Agents follow those for prose detail.  Bill identifiers are stable composite keys formatted as {congress}-{TYPE}-{number}, e.g., '119-HR-134', '119-S-1234', '118-HJRES-5'. Use bill_id for the fastest direct lookup.  Pure-publisher posture: KeyVex returns what's in the public record. No legislative outcome predictions, no 'likely to pass' signals.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bill_id": {
                "description": "Composite bill identifier ('{congress}-{TYPE}-{number}', e.g., '119-HR-134'). Direct doc lookup, fastest path.",
                "type": "string"
              },
              "bill_type": {
                "description": "Type code. HR/S are bills; HRES/SRES are simple resolutions (single-chamber, non-binding); HJRES/SJRES are joint resolutions (both chambers, can become law); HCONRES/SCONRES are concurrent resolutions (both chambers, non-binding).",
                "enum": ["HR", "S", "HRES", "SRES", "HJRES", "SJRES", "HCONRES", "SCONRES"],
                "type": "string"
              },
              "congress": {
                "description": "Congress number (e.g., 119 = January 2025 onward; 118 = January 2023 - January 2025).",
                "type": "integer"
              },
              "introduced_since": {
                "description": "Introduction-date lower bound (ISO YYYY-MM-DD inclusive). The right filter for 'bills introduced in the last N months' — distinct from since/until, which track latest action. Older bill records may have an empty introduction_date if they were ingested before that field was added; those will be excluded from introduced_since/introduced_until results until the bill is re-scraped.",
                "type": "string"
              },
              "introduced_until": {
                "description": "Introduction-date upper bound (ISO YYYY-MM-DD inclusive).",
                "type": "string"
              },
              "limit": {
                "description": "Maximum bills to return. Default 50, max 500.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "origin_chamber": {
                "description": "Filter to bills originating in one chamber.",
                "enum": ["House", "Senate"],
                "type": "string"
              },
              "since": {
                "description": "Latest-action date lower bound (ISO YYYY-MM-DD inclusive). Useful for 'what's moved recently'. NOTE: this filters the most-recent floor/committee action, which can move with activity even on a bill introduced a year ago. For 'introduced in the last N months' questions, use introduced_since instead.",
                "type": "string"
              },
              "sort_by": {
                "description": "Sort key. Default: latest_action_date (most recently active first). Use introduction_date to sort by when the bill was originally introduced.",
                "enum": ["latest_action_date", "update_date", "introduction_date"],
                "type": "string"
              },
              "sort_order": {
                "description": "Default: desc.",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "title": {
                "description": "Case-insensitive substring against bill title. Useful for topic searches ('artificial intelligence', 'border security', etc.).",
                "type": "string"
              },
              "until": {
                "description": "Latest-action date upper bound (ISO YYYY-MM-DD inclusive).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Congressional Bills"
