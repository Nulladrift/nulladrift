        {
          "name": "get_treasury_auctions",
          "description": "Returns Treasury security auctions — Bills (≤1yr), Notes (2-10yr), Bonds (20-30yr), TIPS (inflation-protected), and FRNs (floating-rate). Each record is one CUSIP issuance with announcement metadata + post- auction results.  Key signal fields agents care about:   - bid_to_cover_ratio: demand. >2.5 strong, <2.0 weak.   - high_yield / average_yield: market clearing rate.   - direct_bidder / indirect_bidder breakdowns: domestic vs foreign demand.   - soma_holdings + soma_included: Fed System Open Market Account     allocation. A live measure of Fed QE/QT activity on each issue.  Records have a two-stage lifecycle: announcement (results fields null) → post-auction (full results populated). Idempotent saves on cusip + auction_date overwrite cleanly when results publish.  Security types: 'Bill', 'Note', 'Bond', 'TIPS', 'FRN', 'CMB' (cash- management bill). Use security_type filter to focus on one term group. Note: Treasury reports TIPS and FRNs under security_type Note/Bond with an inflation-indexed / floating-rate flag (not as their own type); filtering security_type:'TIPS' or 'FRN' here resolves to those flags for convenience.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cusip": {
                "description": "Filter to one specific CUSIP issuance.",
