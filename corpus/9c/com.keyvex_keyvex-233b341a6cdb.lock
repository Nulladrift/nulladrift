        {
          "name": "get_screening_list",
          "description": "Returns entries from the US Consolidated Screening List (CSL) — the combined feed of twelve federal export-screening lists. Use this when the user asks about: whether a company or person is on a US screening / sanctions / denied-party list (KeyVex republishes the lists; it is not a screening service), BIS Entity List members, Military End User designations, or to add a 'restricted party' flag to a federal contractor or foreign agent.  The CSL unifies twelve lists (filter via source_short):   SDN  — Specially Designated Nationals (Treasury/OFAC)   EL   — Entity List (Commerce/BIS)   DPL  — Denied Persons List (Commerce/BIS)   MEU  — Military End User List (Commerce/BIS)   UVL  — Unverified List (Commerce/BIS)   CMIC — Non-SDN Chinese Military-Industrial Complex Companies (Treasury)   CAP  — Capta List (Treasury)   DTC  — ITAR Debarred (State)   ISN  — Nonproliferation Sanctions (State)   MBS  — Non-SDN Menu-Based Sanctions List (Treasury)   PLC  — Palestinian Legislative Council List (Treasury)   SSI  — Sectoral Sanctions Identifications List (Treasury)  Broader than get_ofac_sdn — the SDN list is just one source here. For the OFAC-SDN deep view use get_ofac_sdn; to search every US list at once use this tool.  Cross-source pairing: pair with get_federal_contracts to flag a contractor that also appears on a screening list, and with get_foreign_agents for the foreign-entity overlay.  Each record carries name + alt_names, the source list, sanctions programs, addresses, distinct countries, and identification documents.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO-2 country code (e.g. 'CN', 'RU', 'IR'). Matches entries with an address in that country, or where the source list assigns the entry itself to that country. Common spellings are accepted ('UK', 'Turkiye', 'PRC', 'DPRK'); an unrecognised code is rejected rather than returning an empty result.",
                "type": "string"
