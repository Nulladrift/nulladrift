              "sort_by": {
                "description": "Default: name.",
                "enum": ["name"],
                "type": "string"
              },
              "sort_order": {
                "description": "Default: asc (alphabetical by name).",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "source_short": {
                "description": "Filter to one source list by short code: SDN, EL, DPL, MEU, UVL, CMIC, CAP, DTC, ISN, MBS, PLC, SSI.",
