                "description": "Exact sub-product match.",
                "type": "string"
              },
              "submitted_via": {
                "description": "Channel filter.",
                "enum": ["Web", "Phone", "Postal mail", "Fax", "Referral", "Email"],
                "type": "string"
              },
              "timely_response": {
                "description": "Filter to complaints with timely company response (within CFPB's 15-day window) or not.",
                "type": "boolean"
              },
              "until": {
                "description": "ISO date (YYYY-MM-DD).",
