        {
          "name": "get_delistings",
          "description": "Returns SEC delisting and deregistration filings: the Form 25 family (notification of removal from listing on a national exchange under Rule 12d2-2) and the Form 15 family (certification terminating or suspending a security class's registration — the 'going dark' filing that ends SEC reporting; 15F variants are the foreign-private-issuer equivalents). Use this when the user asks: was/is a company being delisted, which companies went dark recently, what securities did an exchange remove, or to pair with tender offers / 8-Ks / insider sales around an exit event.  Reading a record: action='delisting' (25 family) vs 'deregistration' (15 family) is a faithful form→rule mapping, not an opinion. 25-NSE is filed BY THE EXCHANGE against the issuer (exchange_name/exchange_cik are set) — typically the involuntary path; a bare Form 25 is filed by the issuer itself (voluntary withdrawal, e.g. after a merger). rule_provision carries the cited Rule 12d2-2 provision verbatim — the provision distinguishes the grounds for removal; agents can read the cited paragraph. A merger close typically produces a Form 25 AND a Form 15 within weeks.  EDGAR coverage: Form 15 family 1994→present; issuer-filed Form 25 from mid-2001; exchange-filed 25-NSE from 2005 Q4 (the Rule 12d2-2 amendments moved exchange filings onto EDGAR — earlier removals were paper-filed and are not in EDGAR). security_class / rule_provision / exchange fields are populated from the structured 25-NSE XML; 15-family records are metadata-level — follow filing_index_url for the document.  Pure-publisher posture: EDGAR records as published.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accession_number": {
                "description": "Direct lookup by EDGAR accession number (e.g., '0000876661-26-000593').",
                "type": "string"
              },
              "action": {
                "description": "Form family: 'delisting' = Form 25 family (exchange removal); 'deregistration' = Form 15 family (going dark).",
                "enum": ["delisting", "deregistration"],
                "type": "string"
              },
              "cik": {
                "description": "Issuer SEC CIK (any zero-padding).",
                "type": "string"
              },
              "company_name": {
                "description": "Case-insensitive substring against the issuer name.",
                "type": "string"
              },
              "form": {
                "description": "Verbatim form type. 25-NSE = exchange-filed removal; 25 = issuer-filed; 15-12B/15-12G/15-15D = deregistration by registration section; 15F-* = foreign private issuers; /A = amendment.",
                "enum": ["25", "25/A", "25-NSE", "25-NSE/A", "15-12B", "15-12B/A", "15-12G", "15-12G/A", "15-15D", "15-15D/A", "15F-12B", "15F-12B/A", "15F-12G", "15F-12G/A", "15F-15D", "15F-15D/A"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum records to return. Default 50, max 500.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "Filing date lower bound (YYYY-MM-DD inclusive).",
                "type": "string"
              },
              "sort_order": {
                "description": "Sort by filing date. Default desc (newest first).",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "ticker": {
                "description": "Exact ticker (resolved from CIK; '' for unlisted filers).",
                "type": "string"
              },
              "until": {
                "description": "Filing date upper bound (YYYY-MM-DD inclusive).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Delistings & Deregistrations"
