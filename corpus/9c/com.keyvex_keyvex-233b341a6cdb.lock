        {
          "name": "get_activist_stakes",
          "description": "Schedule 13D/13G filings by holders of 5%+ of a class of registered equity, from January 2024 (none earlier). One row per reporting person per filing; joint filings share accession_number. is_activist true: 13D, intent to influence control; false: 13G, passive. An exit amendment (below 5%) has shares_owned 0 and percent_of_class 0: an exit, not missing data. More: keyvex.com/docs/tools/get_activist_stakes",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company_cik": {
                "description": "Issuer CIK, 10-digit zero-padded.",
                "type": "string"
              },
              "cusip": {
                "type": "string"
              },
              "filer_cik": {
                "description": "Reporting person's CIK, exact.",
                "type": "string"
              },
              "filer_name": {
                "description": "Case-insensitive substring.",
                "type": "string"
              },
              "filing_type": {
                "description": "/A = amendment.",
                "enum": ["SCHEDULE 13D", "SCHEDULE 13D/A", "SCHEDULE 13G", "SCHEDULE 13G/A"],
                "type": "string"
              },
              "include_filing_narrative": {
                "description": "Default false; true adds the 13D narrative, Items 2, 3, 4 (purpose) and 6 (long).",
                "type": "boolean"
              },
              "is_activist": {
                "description": "true: 13D only; false: 13G only.",
                "type": "boolean"
              },
              "limit": {
                "description": "Default 50.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "min_percent_of_class": {
                "description": "percent_of_class >= this (0-100); above 0 drops exits.",
                "type": "number"
              },
              "since": {
                "description": "YYYY-MM-DD, inclusive, on the sort_by date; with a numeric sort_by, refused (INVALID_QUERY).",
                "type": "string"
              },
              "sort_by": {
                "description": "Default filing_date.",
                "enum": ["filing_date", "event_date", "percent_of_class", "shares_owned"],
                "type": "string"
              },
              "sort_order": {
                "description": "Default desc.",
                "enum": ["desc", "asc"],
                "type": "string"
              },
              "ticker": {
                "description": "Case-insensitive.",
                "type": "string"
              },
              "until": {
                "description": "YYYY-MM-DD, inclusive, on the sort_by date; with a numeric sort_by, refused.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Activist Stakes (SEC Schedule 13D/13G)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:10639b38ceb507874f6ffb793612e6e3981361450e36b9987da3649f3c804a72"
        },
        {
