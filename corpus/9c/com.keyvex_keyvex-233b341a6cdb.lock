              },
              "reporting_owner_name": {
                "description": "bulk_v2 only. Without ticker, company_cik or reporting_owner_cik it scans recent filings only.",
                "type": "string"
              },
              "row_type": {
                "description": "bulk_v2 only; same as is_derivative.",
                "enum": ["nonderiv", "deriv"],
                "type": "string"
              },
              "schema_era": {
