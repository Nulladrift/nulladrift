        {
          "name": "get_insider_transactions",
          "description": "SEC Form 4/5 insider transactions by officers, directors and 10% owners: one row per transaction line of one filing, non-derivative and derivative (filter is_derivative). shares and price_per_share are nullable and null is not zero: read total_value. Code P alone is not an open-market buy (SEC: open market OR private, any security): use transaction_codes=['P'], is_derivative=false, include_non_open_market=false. Default data_source bulk_v2 is SEC's quarterly bulk data, 2006 to the last published quarter; on simple recency queries newer filings are merged from the live feed (coverage_warning says so). A ticker also finds rows filed under the issuer's former symbols (ticker_resolution); share classes are not merged. price_check and volume_check say whether each plausibility check ran; a null verdict means not checked, never fine. Raw market values (price_range_low/high, daily_range, shares_vs_daily_volume) are Tiingo data served on paid plans only; elsewhere they are omitted and named in licensed_fields_withheld. A disclosure_date keeps gaining late filings: re-query rather than reuse a window. Values are SEC's bytes, never corrected; source_metadata flags known SEC quirks. Codes, field definitions, date conventions: keyvex.com/docs/tools/get_insider_transactions",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aff10b5one": {
                "description": "bulk_v2 only. 10b5-1 box: 1 plan, 0 none, '' blank, NOT_TRACKED before 2023.",
                "enum": ["1", "0", "", "NOT_TRACKED"],
                "type": "string"
              },
              "company_cik": {
                "description": "SEC CIK, 10-digit zero-padded.",
