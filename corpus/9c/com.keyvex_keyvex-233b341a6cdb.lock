                "enum": ["legacy", "bulk_v2"],
                "type": "string"
              },
              "include_baseline": {
                "description": "Add Form 3 starting positions under baselines. Needs ticker or company_cik.",
                "type": "boolean"
              },
              "include_non_open_market": {
                "description": "false: OPEN_MARKET plus unclassified rows only. Default false with transaction_type, else true.",
                "type": "boolean"
              },
              "include_unpriced": {
                "description": "With min_value, bulk_v2 only: keep rows that state no price.",
                "type": "boolean"
              },
              "is_derivative": {
                "description": "true = derivative rows, false = common stock. Works on BOTH data_sources.",
                "type": "boolean"
              },
              "limit": {
                "description": "Default 50.",
                "maximum": 500,
                "minimum": 1,
