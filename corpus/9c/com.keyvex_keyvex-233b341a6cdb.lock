        {
          "name": "get_consumer_complaints",
          "description": "Returns consumer complaints filed with the Consumer Financial Protection Bureau (CFPB). Each record is one filing against a bank, credit reporting agency, mortgage servicer, debt collector, fintech, or crypto firm — with company response status, timeliness flag, and (when consented) consumer narrative.  Use this when the user asks about: complaint volume against a specific company, top issues at a credit reporting agency, regional complaint patterns, untimely responses by a financial institution, or as a leading indicator of upcoming CFPB/OCC/FDIC enforcement action.  COVERAGE — live passthrough (source:'live'): each call queries CFPB's own search API over the FULL 15.7M+ complaint database, full history, current as of CFPB's publication. The response's `total_count` is CFPB's authoritative count for your filtered query — USE IT for volume answers (the `results` array is just the requested page). `total_count` is omitted when an `issue` or `sub_product` filter is active (those apply after the upstream query, so the upstream total wouldn't match). If CFPB is unreachable the tool falls back to a small cached sample (source:'cache' + coverage_warning) — do NOT infer volume in that mode. Note: `company` matching is word-based against the company name ('experian', 'wells fargo'), not arbitrary-substring.  Product taxonomy (the top categories):   - 'Credit reporting or other personal consumer reports' — Equifax,     Experian, TransUnion. ~80% of recent complaint volume.   - 'Debt collection'   - 'Mortgage'   - 'Credit card or prepaid card'   - 'Checking or savings account'   - 'Payday loan, title loan, or personal loan'   - 'Money transfer, virtual currency, or money service'   - 'Vehicle loan or lease'   - 'Student loan'  Company-response values: 'Closed with explanation', 'Closed with non-monetary relief', 'Closed with monetary relief', 'In progress', 'Untimely response', 'Closed without relief'.  Cross-source tip: pair with get_enforcement_actions(source:'cftc'|'occ'| 'fdic'|'sec'|'doj', text:'<company>') to see if complaint volume preceded a formal enforcement action.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Case-insensitive substring against company name (e.g., 'experian', 'jpmorgan', 'capital one').",
                "type": "string"
              },
              "id": {
                "description": "Direct lookup by CFPB complaint_id.",
                "type": "string"
              },
              "issue": {
                "description": "Case-insensitive substring against the issue field (e.g., 'incorrect information', 'fraud', 'debt is not yours').",
