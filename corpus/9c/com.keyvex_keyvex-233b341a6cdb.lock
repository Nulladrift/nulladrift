        {
          "name": "get_congressional_trades",
          "description": "Returns trade records disclosed by U.S. members of Congress under the STOCK Act (Senate eFD and House Clerk Periodic Transaction Reports): one disclosed transaction by a member or their immediate family per row. The same filings are published free as news at https://keyvex.com/disclosures under 5 U.S.C. § 13107(c). These are DISCLOSED trades, filed up to 45 days late: disclosure_date is when the public could first see the trade, transaction_date when it happened. Amounts are STOCK Act ranges (e.g. '$1,001 - $15,000'); amount_min and amount_max hold the bounds. Each record's party is the party the member held on the date of the record (a trade's transaction date, a disclosure's filing date); for a date outside the member's terms in office, the party of their nearest term (the last one before that date, or the first one after it). Amendments, superseded rows and non-market events: keyvex.com/docs/tools/get_congressional_trades",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amendment_status": {
                "description": "Default all. Most amendment rows add disclosures, not duplicates. Every House row is 'unknown'.",
                "enum": ["original", "amendment", "unknown"],
                "type": "string"
              },
              "bioguide_id": {
                "description": "Congressional ID, e.g. 'C001035'; preferred over member_name.",
                "type": "string"
              },
              "chamber": {
                "enum": ["senate", "house"],
                "type": "string"
              },
              "cursor": {
                "description": "The previous page's next_cursor, verbatim; keep filters and sort identical.",
                "type": "string"
              },
              "exclude_superseded": {
                "description": "Drop originals a later amendment restates. Default false: SET IT WHEN SUMMING AMOUNTS, or totals double-count.",
                "type": "boolean"
              },
              "include_non_open_market": {
                "description": "false: market trades plus unclassified rows only (no gifts). Default false with transaction_type, else true.",
                "type": "boolean"
              },
              "limit": {
                "description": "Default 50.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "member_name": {
                "description": "Name substring, case-insensitive.",
                "type": "string"
              },
              "min_amount": {
                "description": "amount_min >= this (USD): the range's lower bound.",
                "type": "number"
              },
              "owner": {
                "enum": ["Self", "Spouse", "Joint", "Dependent"],
                "type": "string"
              },
              "since": {
                "description": "YYYY-MM-DD, inclusive, on the sort_by date.",
                "type": "string"
              },
              "sort_by": {
                "description": "Also the since/until field. Default disclosure_date.",
                "enum": ["disclosure_date", "transaction_date"],
                "type": "string"
              },
              "sort_order": {
                "description": "Default desc.",
                "enum": ["desc", "asc"],
                "type": "string"
              },
              "ticker": {
                "description": "Case-insensitive.",
                "type": "string"
              },
              "transaction_type": {
                "description": "buy = Purchase (P); sell = full or partial Sale (S); exchange = Exchange (E). Omit for all three.",
                "enum": ["buy", "sell", "exchange"],
                "type": "string"
              },
              "until": {
                "description": "YYYY-MM-DD, inclusive, on the sort_by date.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Congressional Trades"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:56057b9185a9b583853916c84b74f0841114af75c9b51083ed4d8fa9731d6459"
        },
