                "description": "True returns only holdings reported by officers.",
                "type": "boolean"
              },
              "is_ten_percent_owner": {
                "description": "True returns only holdings reported by 10%+ beneficial owners.",
                "type": "boolean"
              },
              "limit": {
                "description": "Maximum records to return. Default 50, max 500.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "merge_co_reports": {
                "description": "DEFAULT TRUE — leave it alone unless you specifically want raw filings. When shares are held through a fund, trust or family holding company, every person deemed a beneficial owner files their own Form 3/4/5 reporting the SAME position, so one block appears once per filer. By default those lines are merged into one row per position, so share counts are the shares actually held; reporting_owner_name names every filer and co_reported_accessions lists every accession. Set false for one row per filing — totals then count the same shares once per reporting person.",
                "type": "boolean"
