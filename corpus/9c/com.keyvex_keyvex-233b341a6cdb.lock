        {
          "name": "get_ofac_sdn",
          "description": "Returns OFAC Specially Designated Nationals (SDN) sanctions list entries, republished as-is (not a screening service; verify against treasury.gov). Use this for: sanctions-program queries (e.g., 'who's on the Russia SDN list'), or cross-referencing named individuals / entities against the canonical US sanctions list.  Source: US Treasury OFAC — sanctionslistservice.ofac.treas.gov. ~19,000 entries refreshed daily. Each entry represents a person, entity, vessel, or aircraft sanctioned by the US government under one or more programs (CUBA, IRAN, SDGT [terrorism], NPWMD [WMD proliferation], RUSSIA-EO14024, etc.).  US persons (citizens, residents, US-domiciled companies) are legally prohibited from transacting with SDNs — this is the canonical list published by OFAC.  Filter by name substring for primary lookups. entity_type values: 'individual', 'entity', 'vessel', 'aircraft'. Every SDN record carries exactly one of the four — companies are 'entity'. program is a substring filter against the comma-delimited Program field (e.g., 'iran', 'russia', 'narcotics'). remarks substring catches aliases, DOB / passport references, and related-party hints.  Direct ent_num lookup is fastest (OFAC's stable entity number).  WHAT'S NOT IN v1A (data-model limitations to know about): the schema does NOT include designation_date (when OFAC originally added the entry). OFAC's basic SDN.csv source file only provides 12 columns and omits this — the date lives in OFAC's advanced XML and a separate 'Recent Actions' page on their site. So 'sanctions added in the last N days' is not directly queryable via this tool — point users at ofac.treasury.gov/recent-actions for that specific question. v1.1 polish will add advanced-XML ingestion to capture designation_date. Also: there's no since/until filter and no date sort option for the same reason — the only sort options are name and ent_num.  Pure-publisher posture: KeyVex returns OFAC's published list as-is. No derived 'risk score' or 'similarity match' — agents handle fuzzy matching downstream. For broader list coverage, agents should also consult the US Consolidated Screening List (get_screening_list) which spans 12 export-control / sanctions lists from State + Commerce + Treasury.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ent_num": {
                "description": "Direct OFAC entity number lookup. Fastest path.",
                "type": "string"
              },
              "entity_type": {
                "description": "Filter to one entity type. 'entity' covers companies / orgs; 'individual' for people; 'vessel' / 'aircraft' for transports.",
                "enum": ["individual", "entity", "vessel", "aircraft"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum entries to return. Default 50, max 500.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Case-insensitive substring against the primary listed name (e.g., 'kim jong un', 'gazprom').",
                "type": "string"
              },
              "program": {
                "description": "Substring against the comma-delimited program field (e.g., 'IRAN', 'RUSSIA', 'SDGT' for terrorism, 'NARCOTICS').",
                "type": "string"
              },
              "remarks": {
                "description": "Substring against free-text remarks (aliases, DOB / passport references, related-party hints).",
                "type": "string"
              },
              "sort_by": {
                "description": "Default: ent_num.",
                "enum": ["ent_num", "name"],
                "type": "string"
              },
              "sort_order": {
                "description": "Default: asc.",
                "enum": ["asc", "desc"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "OFAC Sanctions List (SDN)"
          },
          "behavior": {
            "destructive": false,
