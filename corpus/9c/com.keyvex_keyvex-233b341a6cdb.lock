        },
        {
          "name": "get_private_placements",
          "description": "Returns SEC Form D filings — Reg D / Rule 506 private placement offering notices. Use this when the user asks about: who's raising private capital right now, new VC fund formations, private equity raises, real-estate syndicates, hedge fund launches, who's claiming Rule 506(b) vs 506(c) exemption, or to identify directors / executive officers of newly-formed entities.  ⚠ total_amount_sold, min_investment_accepted, total_number_already_invested, sales_commissions and finder_fees are NULLABLE — a Form D that did not state a figure reports null rather than 0. The distinction matters here more than anywhere: a Form D filed at the START of an offering legitimately reports $0 sold, so 0 and null mean genuinely different things. Rows stored before 2026-08-17 cannot tell you which they were. Null never satisfies min_amount_sold and sorts last.  Source: SEC EDGAR full-text search + per-filing primary_doc.xml. All Reg D filings (504 / 506(b) / 506(c)) plus Section 4(a) exempt offerings flow through here. Form D must be filed within 15 days of the first sale.  Each record carries: issuer entity (name, CIK, address, jurisdiction of incorporation, entity type), offering data (industry group, investment fund type for pooled funds, total offering / sold / remaining, minimum investment, federal_exemptions claimed), filing metadata (file_date, date_of_first_sale, is_amendment), and a related_persons[] array of directors / executive officers / promoters.  Federal exemption codes (federal_exemptions array):   06b   — Rule 506(b) (no general solicitation; up to 35 non-accredited)   06c   — Rule 506(c) (general solicitation OK; all accredited)   04(2) — Section 4(a)(2) (statutory private placement)   3C    — ICA Section 3(c) (3(c)(1), 3(c)(5), 3(c)(7) etc. — common for funds)   3C.1  — ICA 3(c)(1) (up to 100 investors)   3C.7  — ICA 3(c)(7) (qualified purchasers only)  Common industry_group_type values:   'Pooled Investment Fund' (with investment_fund_type='Venture Capital   Fund' | 'Private Equity Fund' | 'Hedge Fund' | 'Other Investment Fund')   'Technology', 'Real Estate', 'Health Care', 'Energy', 'Financial   Services', 'Manufacturing', 'Other'.  Direct filing_id lookup is fastest (accession number). Substring filters on issuer_name, industry_group_type, investment_fund_type, and jurisdiction_of_inc enable topic-style queries. Combine federal_exemption + min_amount_sold for 'who's raising real money under 506(c)' analyses.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "federal_exemption": {
                "description": "Filter to filings claiming a specific exemption code via array-contains. Common: '06b' (506(b)), '06c' (506(c)), '3C.1', '3C.7'.",
                "type": "string"
              },
              "filing_id": {
                "description": "EDGAR accession number (e.g., '0002131143-26-000001'). Direct doc lookup, fastest.",
                "type": "string"
              },
              "industry_group_type": {
                "description": "Substring against the top-level industry classification (e.g., 'technology', 'real estate', 'pooled investment').",
                "type": "string"
              },
              "investment_fund_type": {
                "description": "Substring against the fund subtype, populated when industry_group_type is 'Pooled Investment Fund' (e.g., 'venture capital', 'private equity', 'hedge').",
                "type": "string"
              },
              "is_amendment": {
                "description": "When set, restricts to D/A amendments (true) or original D filings (false). Default: both.",
                "type": "boolean"
              },
              "issuer_cik": {
                "description": "Issuer's SEC CIK (1-10 digits; we zero-pad internally).",
                "type": "string"
              },
              "issuer_name": {
                "description": "Case-insensitive substring against the issuer's filed entity name. NOTE: matched over a recent-filing window, so it reliably finds CURRENT filers but can miss an issuer whose Form D filings are older than that window. To pull a specific issuer's full filing history regardless of date, use issuer_cik (most reliable).",
                "type": "string"
              },
              "issuer_state": {
                "description": "Issuer's state (2-letter code, e.g., 'CA', 'NY', 'DE'). Note many funds incorporate in DE while operating elsewhere.",
                "type": "string"
              },
              "jurisdiction_of_inc": {
                "description": "Substring against state of incorporation (e.g., 'delaware', 'cayman').",
                "type": "string"
              },
              "limit": {
                "description": "Maximum filings to return. Default 50, max 500.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "min_amount_sold": {
                "description": "Minimum total_amount_sold (USD). Filters out trivial offerings — use 1000000 for 'real raises'.",
                "type": "number"
              },
              "since": {
                "description": "date_of_first_sale lower bound (YYYY-MM-DD inclusive).",
                "type": "string"
              },
              "sort_by": {
                "description": "Default: file_date (most recently filed first).",
                "enum": ["file_date", "date_of_first_sale", "total_amount_sold"],
                "type": "string"
              },
              "sort_order": {
                "description": "Default: desc.",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "until": {
                "description": "date_of_first_sale upper bound (YYYY-MM-DD inclusive).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Private Placements (SEC Form D)"
          },
          "behavior": {
