        {
          "name": "get_fund_holdings",
          "description": "Returns per-security holdings from SEC Form N-PORT primary documents — one row per investment-or-security line in a mutual fund / ETF / closed-end fund's monthly portfolio report. Use this when the user asks about: which funds hold a specific stock or bond, a fund's complete portfolio composition, fund-level derivative exposure (swaps, options, futures), repo positions, concentration by issuer, or to compose 'which ETFs added X this month' / 'which funds shorted Y' style queries.  Source: parsed from each NportFiling's primary_doc.xml. asset_cat is SEC's own code, and these twenty are the only ones the data holds — EC common equity; EP preferred equity; DBT debt, Treasuries included; LON loan; ABS-MBS asset-backed, mortgage; ABS-O asset-backed, other; ABS-CBDO asset-backed, CDO/CBO; ABS-APCP asset-backed commercial paper; SN structured note; STIV short-term investment vehicle, money-market and liquidity pools; RA repurchase and reverse-repurchase agreement; RE real estate; COMM commodity; DE equity derivative; DIR interest-rate derivative; DFE foreign-exchange derivative; DCR credit derivative; DCO commodity derivative; DO other derivative; OTHER other. Anything else is refused with this list.  Useful filter combos:   ticker='NVDA'                       all funds holding NVDA   cusip='037833100'                   AAPL by CUSIP (more reliable than ticker for N-PORT)   is_derivative=true, filer_name='BlackRock'                                        the BlackRock FAMILY's derivative book — a name is a                                        substring, and this one spans five trusts. filer_cik                                        picks one of them.   derivative_type='swap'              every swap position in the universe   asset_cat='RA'                      repo and reverse-repo exposure   payoff_profile='Short'              short positions only   min_pct_of_portfolio=5              concentrated positions (>=5% of NAV)   filer_cik='0000884394'              one fund's complete portfolio   counterparty='Morgan Stanley'       every fund's exposure to one dealer   min_notional=10000000               derivatives with >=$10M of EXPOSURE                                        (not fair value — see min_notional)   derivative_type='swap', expiration_until='2026-12-31'                                        swaps rolling off before year-end   maturity_since='2026-01-01', maturity_until='2026-12-31'                                        bonds maturing this year  Each holding ties to its parent NportFiling via filing_id. Read the parent for fund metadata (file_date, file_number, amendment flag); read the holding for security-level detail. is_derivative + derivative_type distinguish structured derivative rows from straight equity/debt holdings.  DERIVATIVE + DEBT TERMS are extracted and filterable (2026-08-09). Derivatives carry deriv_notional_amount, deriv_counterparty_name/_lei, deriv_expiration_date, deriv_unrealized_appreciation, and the leg-level detail — put/call, written/purchased, strike, share count and delta for options; swap flag and upfront payment/receipt for swaps; both currency legs for forwards. Debt rows carry debt_maturity_date, coupon kind, annualized rate, default, arrears and paid-in-kind flags.  USE min_notional, NOT min_value_usd, TO SIZE A DERIVATIVE. Fair value and exposure differ by orders of magnitude: a real interest-rate swap here shows value_usd -49,184 against a notional of 6,795,000. Ranking derivatives by value_usd understates them by ~100x.  BACKFILL IN PROGRESS: these fields are populated on filings re-extracted since 2026-08-09 and are absent (null) on the rest until it completes. A null term on an older filing means not-yet-extracted, NOT absent from the source — do not read it as 'this swap has no counterparty'. The parent filing's primary_document_url always has the authoritative detail.  COVERAGE: holdings begin with N-PORT filings FILED 2024-06-01. Most filings from then on have holdings rows, but not all: some are still metadata-only in get_nport_filings (not yet extracted — about 4% as of September 2026). Filings before 2024-06-01 are outside this coverage. For a filing with no holdings here, follow primary_document_url in get_nport_filings. An empty result for a filing means not-extracted, not an empty fund.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asset_cat": {
                "description": "SEC's asset-category code, case-insensitive. The data holds exactly these: EC common equity; EP preferred equity; DBT debt, Treasuries included; LON loan; ABS-MBS asset-backed, mortgage; ABS-O asset-backed, other; ABS-CBDO asset-backed, CDO/CBO; ABS-APCP asset-backed commercial paper; SN structured note; STIV short-term investment vehicle, money-market and liquidity pools; RA repurchase and reverse-repurchase agreement; RE real estate; COMM commodity; DE equity derivative; DIR interest-rate derivative; DFE foreign-exchange derivative; DCR credit derivative; DCO commodity derivative; DO other derivative; OTHER other. An unknown code is refused with the list rather than searched for — Treasuries are DBT, money-market positions are STIV, and a repurchase agreement is RA.",
                "enum": ["EC", "EP", "DBT", "LON", "ABS-MBS", "ABS-O", "ABS-CBDO", "ABS-APCP", "SN", "STIV", "RA", "RE", "COMM", "DE", "DIR", "DFE", "DCR", "DCO", "DO", "OTHER"],
                "type": "string"
              },
              "counterparty": {
                "description": "Case-insensitive substring against the derivative counterparty (the dealer or clearing house on the other side). Answers exposure-concentration questions — e.g. counterparty='Morgan Stanley' across funds. Cleared derivatives name an exchange or clearing house (CME, Chicago Board of Trade) rather than a bank. Note the source writes the literal 'N/A' where no counterparty is disclosed, and that value is preserved rather than nulled.",
                "type": "string"
              },
              "country": {
                "description": "ISO-2 country code of the holding (e.g., 'US', 'GB', 'JP').",
                "type": "string"
              },
              "cusip": {
                "description": "Exact 9-character CUSIP. Most reliable identifier for equity and debt holdings in N-PORT.",
                "type": "string"
              },
              "derivative_type": {
                "description": "Structural derivative type, derived from which `<derivativeInfo>` child element is present in the filing.",
                "enum": ["future", "forward", "swap", "option", "warrant", "swaption", "other"],
                "type": "string"
              },
              "expiration_since": {
                "description": "ISO date (YYYY-MM-DD). Only derivatives expiring on or after this date. Normalized across contract types — futures expDate, option expDt, swap terminationDt, forward settlementDt all populate it, and deriv_category tells you which. Rows whose value is not a real date (the source writes 'N/A') are excluded from the window rather than compared.",
                "type": "string"
              },
              "expiration_until": {
                "description": "ISO date (YYYY-MM-DD). Only derivatives expiring on or before this date. Pair with expiration_since for a rollover window.",
                "type": "string"
              },
              "filer_cik": {
                "description": "Fund trust CIK (10-digit, padded with leading zeros). Returns the trust's holdings across all reporting months. This is the precise form of filer_name: one trust, rather than a name substring that can match a whole family of them.",
                "type": "string"
              },
              "filer_name": {
                "description": "Case-insensitive substring against fund trust name (e.g., 'iShares', 'Vanguard', 'SPDR'). ⚠ A name substring matches a FAMILY, not a fund: 'BlackRock' matches at least five separate trusts (0000893818, 0000844779, 0001761055, 0000355916, 0001804196) and 300,000+ holdings rows, so it asks for the whole family's book and reads far more than a caller usually wants. filer_cik is the precise form — one trust. To narrow a name search instead, add period_ending.",
                "type": "string"
              },
              "filing_id": {
                "description": "EDGAR accession number — returns all holdings from one specific N-PORT filing (one fund-month).",
                "type": "string"
              },
              "is_derivative": {
                "description": "True returns only derivative rows (asset_cat starting with 'D'). False returns only non-derivative rows. Omit for both.",
                "type": "boolean"
              },
              "isin": {
                "description": "Exact ISIN if filer included it in the identifiers block.",
                "type": "string"
              },
              "limit": {
                "description": "Maximum records to return. Default 50, max 500.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "maturity_since": {
                "description": "ISO date (YYYY-MM-DD). Only debt holdings maturing on or after this date. Applies to the 33.6% of rows that are bond-like; pair with maturity_until to build a maturity ladder.",
                "type": "string"
              },
              "maturity_until": {
                "description": "ISO date (YYYY-MM-DD). Only debt holdings maturing on or before this date.",
                "type": "string"
              },
              "min_notional": {
                "description": "Minimum derivative NOTIONAL amount in the contract's currency. This is EXPOSURE, not fair value, and for derivatives the two differ by orders of magnitude — a real interest-rate swap in this dataset carries value_usd -49,184 against a notional of 6,795,000. Use min_notional (not min_value_usd) to ask 'how big is the bet'; use min_value_usd to ask 'how much is the position worth today'. Rows with no notional are excluded by any positive floor: options carry share count + strike instead and legitimately have none.",
                "type": "number"
              },
              "min_pct_of_portfolio": {
                "description": "Minimum percentage of fund net assets (0-100 scale). Use to focus on concentrated positions.",
                "type": "number"
              },
              "min_value_usd": {
                "description": "Minimum fair value in USD. Use to focus on large positions only.",
                "type": "number"
              },
              "name": {
                "description": "Case-insensitive substring against the holding issuer name (e.g., 'Apple', 'Treasury', 'Goldman Sachs'). A name of 1-2 characters (e.g. 'GE', '3M') matches as a whole word within the newest 20,000 holdings by period_ending only, and the answer says so; cusip, ticker or isin search the full history.",
                "type": "string"
              },
              "payoff_profile": {
                "description": "Filter to long or short positions per N-PORT payoffProfile field.",
                "enum": ["Long", "Short"],
                "type": "string"
              },
              "period_ending": {
                "description": "Reporting month-end (YYYY-MM-DD). Restricts results to one reporting period.",
                "type": "string"
              },
              "since": {
                "description": "ISO date (YYYY-MM-DD). Only holdings whose period_ending >= this date.",
                "type": "string"
              },
              "sort_by": {
                "description": "Default: value_usd.",
                "enum": ["value_usd", "pct_of_portfolio", "period_ending"],
                "type": "string"
              },
              "sort_order": {
                "description": "Default: desc (largest / most recent first).",
                "enum": ["desc", "asc"],
                "type": "string"
              },
              "ticker": {
                "description": "Exact ticker symbol if filer included it in the identifiers block (less common than CUSIP).",
                "type": "string"
              },
              "until": {
                "description": "ISO date (YYYY-MM-DD). Only holdings whose period_ending <= this date.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Fund Holdings (SEC Form N-PORT)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:103db4021a6f2898a8d6ecd94b10348d3153c1e5bb267f8a9b1a65017a1b1c0c"
        },
        {
          "name": "get_fundamentals",
          "description": "Returns XBRL-tagged financial fundamentals from public-company 10-K and 10-Q filings, sourced from SEC EDGAR's company-facts API. Each record is one observation of one concept at one period end.  Use this when the user asks about: revenue, profit, margins, cash position, debt, shareholder equity, EPS, share count, operating vs. financing cash flow, or any line-item-level financial state of a public company.  Coverage: any company in SEC's ticker list. The S&P 500 is refreshed three times a week; another company is read live from SEC on its first request (US-dollar units only; coverage_warning says so) and stored for later calls. An empty result's coverage_warning says which kind of empty it is.  Concepts: a curated 40-concept watchlist covering:   - income_statement: Revenues / RevenueFromContractWithCustomer /     CostOfRevenue / GrossProfit / OperatingExpenses / R&D / SG&A /     OperatingIncomeLoss / InterestExpense / IncomeTaxExpenseBenefit /     NetIncomeLoss   - balance_sheet: Assets / AssetsCurrent / Cash / AccountsReceivable     / Inventory / PP&E / Goodwill / Liabilities / LongTermDebt /     StockholdersEquity / CommonStockSharesOutstanding   - cash_flow: NetCash{Operating/Investing/Financing}Activities /     PaymentsToAcquirePPE (capex) / PaymentsForRepurchaseOfCommonStock     / PaymentsOfDividends / DepreciationDepletionAndAmortization   - metrics: EarningsPerShareBasic/Diluted, weighted-avg share counts   - entity: EntityCommonStockSharesOutstanding (dei taxonomy)  Key cautions on the data:   - The same concept can appear in multiple units (e.g., 'USD' and     'USD/shares' for EPS). Filter by unit if you need a specific shape.   - Many concepts have BOTH year-to-date cumulative observations AND     quarterly-period observations on 10-Q filings. The `frame` field     (e.g., 'CY2025Q3') marks the per-quarter point-period observation;     rows with empty `frame` are typically cumulative YTD.   - Older filings may use deprecated concept names; KeyVex catalog     includes both modern and legacy names where companies migrated     (e.g., Revenues AND RevenueFromContractWithCustomerExcludingAssessedTax).   - `scale_note`: on a handful of 2009–2014 share counts that look like     the issuer's own scale error (about 1,000× or 1,000,000× its     neighbouring filings), a note names the factor and a neighbouring     value; `value` is still as filed. null on every other row.  Set `latest_only=true` to get one record per (ticker × concept) — the most-recent observation. Useful for 'current state' snapshots.  Pure-publisher posture: values are AS FILED. We do NOT compute derived ratios (P/E, ROE, ROIC), YoY/QoQ deltas, or 'real' vs nominal versions. Agents calculate those on top.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Bucket filter when you don't know the exact concept name.",
                "enum": ["income_statement", "balance_sheet", "cash_flow", "metrics", "entity"],
                "type": "string"
              },
              "company_cik": {
                "description": "SEC CIK number. Alternative to ticker.",
                "type": "string"
              },
              "concept": {
                "description": "Exact XBRL tag name (e.g., 'NetIncomeLoss', 'Revenues', 'Assets', 'CashAndCashEquivalentsAtCarryingValue'). Case-sensitive.",
                "type": "string"
              },
              "fiscal_period": {
                "description": "Filter to one fiscal period.",
                "enum": ["Q1", "Q2", "Q3", "Q4", "FY"],
                "type": "string"
              },
              "fiscal_year": {
                "description": "Filter to one fiscal year — the year the financials DESCRIBE (the company's own fiscal-year label, derived from the original filing), NOT the filing year. Handles non-December fiscal years: e.g. NVDA's year ending 2024-01-28 is fiscal_year 2024, Apple's ending 2024-09-28 is 2024. For point-in-time period filtering, period_end / since / until and frame are also available.",
                "type": "integer"
              },
              "form": {
                "description": "Filter to one filing form.",
                "enum": ["10-K", "10-Q", "10-K/A", "10-Q/A"],
                "type": "string"
              },
              "latest_only": {
                "description": "When true, return only the most-recent observation per (ticker × concept). Default false.",
                "type": "boolean"
              },
              "limit": {
                "description": "Default 50, max 500.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "ISO date YYYY-MM-DD. Applied to sort_by field.",
                "type": "string"
              },
              "sort_by": {
                "description": "Default period_end.",
                "enum": ["period_end", "filed_date", "value"],
                "type": "string"
              },
              "sort_order": {
                "description": "Default desc.",
                "enum": ["desc", "asc"],
                "type": "string"
              },
              "ticker": {
                "description": "Stock symbol filter, e.g. 'AAPL'. Case-insensitive.",
                "type": "string"
              },
              "until": {
                "description": "ISO date YYYY-MM-DD.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Company Fundamentals (SEC XBRL)"
          },
          "behavior": {
