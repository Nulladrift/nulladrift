        {
          "name": "get_proxy_filings",
          "description": "Returns Schedule 14A proxy filings — the document public companies send shareholders ahead of annual or special meetings. Each record is one filing carrying executive compensation tables, board nominations, shareholder proposals, auditor info, and voting matters.  Use this when the user asks about: executive compensation, board elections, shareholder proposals, M&A votes, proxy contests, auditor changes, say-on-pay outcomes, or upcoming annual meetings.  Coverage: the full DEF 14A family back to 2016 for the US public-company universe (sourced from EDGAR's complete quarterly full-index); a daily feed keeps it current. Rows are tagged with a company's PRIMARY common ticker — for dual-class issuers (e.g. GOOGL/GOOG, BRK-A/BRK-B) query by company_cik to retrieve every share class in one shot.  Filing types (the four-form DEF 14A family):   DEF 14A   — Definitive proxy (the annual-meeting filing)   DEFA14A   — Additional materials (supplements to a prior DEF 14A)   DEFM14A   — Merger-related proxy (filed when shareholders vote on M&A)   DEFR14A   — Revised definitive proxy (amendments to a prior DEF 14A)  Convenience flags derived from filing_type:   is_merger_related   — true for DEFM14A   is_amendment        — true for DEFR14A   is_additional_materials — true for DEFA14A  period_of_report population (IMPORTANT for filtering / sorting):   - Recent-window rows (filed ~2024-onward via the daily feed /     per-ticker pull): DEF 14A primaries ~100% populated (meeting/record     date); DEFA14A/DEFM14A/DEFR14A typically EMPTY (correct-as-filed —     SEC's submissions API leaves those reportDate fields blank).   - Historical backfilled rows (the bulk of 2016-2024 depth, sourced     from EDGAR's full-index): period_of_report is EMPTY for all form     types — the index carries no report date.   - Bottom line: filter/sort by filing_date for chronological queries;     period_of_report is not reliably present across the collection.  v1A is metadata-only: ticker, company name, CIK, filing type, dates, primary document URL. The proxy body is not extracted in v1. `primary_document_url` points agents at the source HTML for direct fetch when they need exec comp tables or proposal text.",
