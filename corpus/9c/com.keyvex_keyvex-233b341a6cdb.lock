        {
          "name": "get_insider_filings",
          "description": "A ticker search also returns rows this issuer FILED UNDER SYMBOLS IT NO LONGER LISTS (renames, filer typos, ADR spellings). Each row keeps `ticker` as SEC received it and gains `current_ticker` when the issuer trades under a different symbol today. Separately-listed share classes are NOT merged, and asking for a RETIRED symbol returns only rows filed under it — retired symbols get reissued to other companies. When more than one issuer has filed under a ticker (a reused symbol, a holding-company reorganization), every row stays in the answer and carries `issuer_relation`: the row's own issuer and its relation to the ticker's issuer (same_issuer; predecessor or successor, on SEC evidence; related_by_name; affiliate; or different_issuer), with the evidence, such as the SEC succession form and its date. A ticker search also finds this issuer's rows filed under ANOTHER issuer's symbol, matched only on its CIK. Returns FILING-LEVEL records from SEC Form 3/4/5 filings — one row per filing (accession). Use this when the user asks: list an issuer's insider filings, find a specific accession, filter by form type (Form 4 trades vs Form 3 initial statements vs Form 5 annual vs their /A amendments), count filings over a period, or size a filing (how many transaction / holding rows it has) before pulling detail.  This is the filing INDEX. For the actual trades use get_insider_transactions; for the positions use get_insider_holdings. They join on accession_number.  Source: SEC bulk Form 3/4/5 dataset (insider_filings_v2), 2006→present, refreshed quarterly. Each row carries the SUBMISSION envelope (company_cik, company_name, ticker, document_type, filing_date, period_of_report, is_amendment), ALL reporting owners (reporting_owners[]), signature rows, and per-table counts (nonderiv_trans_count, deriv_trans_count, nonderiv_holding_count, deriv_holding_count, footnote_count).  Useful filter combos:   ticker='AAPL', document_type='4'          all Apple Form 4 filings   company_cik='0000320193', is_amendment=true   Apple's amended filings only   accession_number='0000320193-26-000078'   one specific filing's envelope   ticker='TSLA', since='2025-01-01'          TSLA insider filings this year   ticker='NVDA', reporting_owner_name='Huang'   NVDA filings involving Huang  document_type values are the raw SEC form codes: '3', '4', '5' and their amendments '3/A', '4/A', '5/A'.",
          "inputSchema": {
            "additionalProperties": false,
