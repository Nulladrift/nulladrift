              "reporting_owner_name": {
                "description": "Case-insensitive substring matched against ANY reporting owner on the filing (scans reporting_owners[]). Best combined with ticker/company_cik.",
                "type": "string"
              },
              "since": {
                "description": "ISO date (YYYY-MM-DD). Only filings with filing_date >= this date.",
