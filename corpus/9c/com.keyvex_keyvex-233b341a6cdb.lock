                "description": "Substring against the issuing DOJ component (e.g., 'criminal division', 'fraud section', 'antitrust'). Empty for most SEC items.",
                "type": "string"
              },
              "category": {
                "description": "Default \"enforcement\": enforcement actions only. \"all\" adds the agencies' general press releases; \"agency_news\" returns only those.",
                "enum": ["enforcement", "agency_news", "all"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum actions to return. Default 50, max 500.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "Published date lower bound (YYYY-MM-DD inclusive).",
                "type": "string"
