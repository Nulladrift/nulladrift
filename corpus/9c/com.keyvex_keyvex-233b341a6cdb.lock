          "description": "Returns SEC Form 13F holdings: the quarterly long-equity positions of every institutional investment manager that files a 13F ($100M+ in 13(f) securities), whole books, every quarter since 2013-06-30. Each record is one (fund, security, quarter). 13F does NOT include short positions, cash, most options, or non-US-listed equities. USD. market_value null = units unconfirmed (value_as_filed: as filed); they skip value sorts and min_value. More: keyvex.com/docs/tools/get_institutional_holdings",
