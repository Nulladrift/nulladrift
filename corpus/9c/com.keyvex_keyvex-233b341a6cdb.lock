                "enum": ["SC TO-T", "SC TO-T/A", "SC TO-I", "SC TO-I/A"],
                "type": "string"
              },
              "issuer_only": {
                "description": "When true, restricts to SC TO-I family (issuer buybacks). Default false.",
                "type": "boolean"
