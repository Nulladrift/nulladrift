        {
          "name": "get_alerts",
          "description": "Your watchlist alerts, newest first, for the account that owns the calling API key (no argument selects an\naccount). Kinds:\n  congress_trade: a congressional trade disclosed this week in a ticker or by a member on your watchlist.\n  initial_13d: an initial Schedule 13D (a new 5%+ activist stake) filed this week in a ticker on your watchlist.\n  federal_contract: federal awards at or above your threshold that KeyVex first reported this week, new or newly modified (a later modification of an award you were already alerted to does not alert again).\nAn event alerts only when its own date is within 7 days of detection and not before you added the entry. `data`\nis the source record as KeyVex stored it when the alert fired, with KeyVex's internal `_` fields removed.\nWebhooks (paid plans, Basic and up): REJECT a timestamp older than 5 minutes; signing: keyvex.com/docs/tools/get_alerts",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "next_cursor from the previous page.",
                "type": "string"
              },
              "kind": {
                "enum": ["congress_trade", "initial_13d", "federal_contract"],
                "type": "string"
              },
              "limit": {
                "description": "Default 50.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "ISO date or date-time, inclusive, on detection time.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5b80572042d79bfee23279a1088dcf8682f5dfd1c5af77e1f0be17a5db85c57b"
        },
        {
          "name": "get_annual_financial_disclosures",
          "description": "Form 278 annual financial disclosures of members of Congress and congressional candidates, one row per filing. The same filings are published free as news at https://keyvex.com/disclosures under 5 U.S.C. § 13107(c). Parsed rows carry assets[] and liabilities[] as disclosed RANGES; a House row KeyVex may have misread carries parse_unreliable: true. Fields: keyvex.com/docs/tools/get_annual_financial_disclosures",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bioguide_id": {
                "type": "string"
              },
              "chamber": {
                "enum": ["senate", "house"],
                "type": "string"
              },
              "filing_year": {
                "description": "Year reported on, not filed.",
                "maximum": 2100,
                "minimum": 1990,
                "type": "integer"
              },
              "limit": {
                "description": "Default 50.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "member_name": {
                "description": "Case-insensitive substring.",
                "type": "string"
              },
              "party": {
                "description": "Exact match on the record's party, where the party is the party the member held on the date of the record (a trade's transaction date, a disclosure's filing date); for a date outside the member's terms in office, the party of their nearest term (the last one before that date, or the first one after it). Here: filing_date.",
                "type": "string"
              },
              "report_type": {
                "description": "Combined = annual + termination. 'Periodic' matches nothing.",
                "enum": ["Annual", "New Filer", "Termination", "Combined", "Amendment", "Periodic", "Other"],
                "type": "string"
              },
              "since": {
                "description": "YYYY-MM-DD, inclusive, on the sort field; refused with sort_by=filing_year.",
                "type": "string"
              },
              "sort_by": {
                "description": "Default filing_date.",
                "enum": ["filing_date", "filing_year"],
                "type": "string"
              },
              "sort_order": {
                "description": "Default desc.",
                "enum": ["desc", "asc"],
                "type": "string"
              },
              "state": {
                "type": "string"
              },
              "until": {
                "description": "Same, upper bound.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Annual Financial Disclosures (Form 278)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
