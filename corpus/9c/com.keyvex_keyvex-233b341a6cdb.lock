        {
          "name": "get_member_profile",
          "description": "Returns Congressional member profiles from the unitedstates/ congress-legislators catalog. Each record is one current House Representative or Senator, keyed by bioguide_id (the permanent member identifier — e.g., 'C001035' for Susan Collins).  Use this when the user asks about: which committees a member sits on, who chairs the Senate Banking Committee, all Republicans on House Armed Services, party/state/district lookup for a specific member, or to enrich congressional_trades records with member context (party + state + committee assignments).  Filter by bioguide_id for a direct fetch; by member_name for a case-insensitive substring search; by committee_id (e.g., 'HSAS' for House Armed Services, 'SSAF' for Senate Agriculture, 'HSAG15' for the Forestry & Horticulture subcommittee under House Ag) to find all members of a committee. Combine state + chamber + party for caucus-level queries.  Committee codes follow the Library of Congress 'Thomas' convention:   House full committees: HSAG (Agriculture), HSAS (Armed Services),     HSAP (Appropriations), HSBA (Financial Services), HSED     (Education), HSEN (Energy & Commerce), HSII (Natural Resources),     HSJU (Judiciary), HSWM (Ways and Means), etc.   Senate full committees: SSAF (Ag), SSAS (Armed Services), SSAP     (Appropriations), SSBK (Banking), SSCM (Commerce), SSEG     (Energy), SSFI (Finance), SSHR (HELP), SSJU (Judiciary), etc.   Subcommittees append the subcommittee thomas_id: HSAG15, HSBA00.  Photo URLs are constructed (theunitedstates.io/images/congress/ original/{bioguide_id}.jpg) but Cloudflare-protected — clients fetch directly. Senate class field (1/2/3) on senators only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
