      "capabilities": {
        "tools": {}
      },
      "instructions": "Checks the structural integrity of translated resource dictionaries against a source dictionary you supply: missing keys, extra keys, disallowed empty strings, and exact placeholder integrity (name and, for printf_named, conversion type, matched by exact multiplicity, order-independent) under an explicitly declared placeholder syntax (double_brace `{{name}}` or printf_named `%(name)s`/`%(name)d`/`%(name)f`). Malformed placeholder syntax is reported as a per-key issue in a completed report, never silently dropped. Requests containing likely ICU MessageFormat plural/select constructs are refused outright rather than partially validated. Never translates anything and never estimates translation quality, tone, or correctness -- this is a structural integrity check only, scoped to exactly the resources you provide. Tool calls cost 0.03 USDC on Base. Initialization, tool discovery and unpaid price challenges are free. Send x402 v2 PAYMENT-SIGNATURE on the POST or params._meta['x402/payment']. Reuse the identical input and authorization when recovering a pending purchase; do not sign a fresh charge. Results are retained24hours. Checks structural integrity only (missing/extra keys, disallowed empty strings, exact placeholder name/type multiplicity) -- never evaluates translation quality, tone, grammar, or correctness of the translated text itself (scope: resource_structure_and_placeholders_only). Flat resource keys only: dots and brackets in a key are treated as literal characters of that key, never expanded into a nested tree. Supports exactly two placeholder syntaxes, and only what is documented for each: double_brace `{{identifier}}` (ASCII letter/underscore then alphanumerics/underscore/dot, optional surrounding ASCII whitespace) and printf_named `%(name)s|d|f` plus the `%%` literal escape. A single, non-doubled `{` or `}` is always literal text. No ICU MessageFormat support: input that looks like it contains a plural/select/selectordinal construct is refused outright at admission, never partially validated. HTML or any other markup inside a string is treated as opaque literal text and is never parsed or validated as markup. Malformed placeholder syntax in an otherwise well-shaped resource is reported as a per-key issue in the completed report, not dropped; a bad source string is reported in source_issues and makes every locale that has that key fail, since comparison against a broken source is undefined -- never a false pass. Language/locale codes are treated as opaque caller-supplied labels (non-empty, <= 35 characters); there is no built-in registry of valid locales. Bounded input only: 1..20 target locales, source/each target dictionary <= 500 keys, each key <= 128 characters, each string value <= 4096 characters, total request body <= 128 KiB, JSON depth <= 8, <= 20000 JSON nodes. Accepts only plain, proto-safe JSON objects/strings/booleans; unknown top-level options and forbidden key names (__proto__, constructor, prototype) are refused. No network access, no logging, no dependencies. Results at most 96 KiB; retry identical input and authorization within 24 hours to recover a purchase.",
      "tools": [
        {
          "name": "localization_resource_integrity",
          "description": "Checks the structural integrity of translated resource dictionaries against a source dictionary you supply: missing keys, extra keys, disallowed empty strings, and exact placeholder integrity (name and, for printf_named, conversion type, matched by exact multiplicity, order-independent) under an explicitly declared placeholder syntax (double_brace `{{name}}` or printf_named `%(name)s`/`%(name)d`/`%(name)f`). Malformed placeholder syntax is reported as a per-key issue in a completed report, never silently dropped. Requests containing likely ICU MessageFormat plural/select constructs are refused outright rather than partially validated. Never translates anything and never estimates translation quality, tone, or correctness -- this is a structural integrity check only, scoped to exactly the resources you provide. Price: 0.03 USDC per completed bounded job on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "allow_empty": {
                "type": "boolean"
              },
              "source": {
                "additionalProperties": {
                  "maxLength": 4096,
                  "type": "string"
                },
