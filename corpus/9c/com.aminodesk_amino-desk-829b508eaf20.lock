    "com.aminodesk/amino-desk": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://aminodesk.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "amino-desk",
        "title": "Amino Desk",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Amino Desk is an independent, evidence-graded reference on peptides and GLP-1 medications for US readers: legal status, human evidence, reported dosing with sources, safety and cost. Use search to find a compound or topic, get_compound for one compound's full entry, list_compounds to filter by evidence grade, goal or legal status, and get_page for guides, comparisons and cost pages. Quote facts as written, keep the stated caveats, and cite the page URL. This is not medical advice.",
      "tools": [
        {
          "name": "get_compound",
          "title": "Get a compound entry",
          "description": "Get Amino Desk's full entry for one compound as Markdown: what it is, human evidence, US legal status, label or reported dosing with its source, safety and sources.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Compound slug or name, such as semaglutide, bpc-157 or Tirzepatide",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:42aae7135e580b92a7a4e4a6b0e48d66be7cdf73c87a6613fd8c432e280e5045"
        },
        {
          "name": "get_page",
          "title": "Get a page",
          "description": "Get any other Amino Desk page as Markdown, such as costs, providers, stacks, compare/semaglutide-vs-tirzepatide or guides/protein-on-glp-1. Use search to find the path.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Page path without the leading slash",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:612492047478f90b631a5f1b9a34263adf9eb1866c23acedd1fab80900ecca8c"
        },
        {
          "name": "list_compounds",
          "title": "List compounds",
          "description": "List the compounds Amino Desk covers, with evidence grade (A strongest to D weakest), US legal status and a one-line summary. All filters are optional.",
          "inputSchema": {
            "properties": {
              "goal": {
                "description": "What the compound is promoted for",
                "enum": ["cognition", "energy", "hormones", "longevity", "muscle", "repair", "sexual", "skin", "sleep", "weight"],
                "type": "string"
              },
              "grade": {
                "description": "Evidence grade",
                "enum": ["A", "B", "C", "D"],
                "type": "string"
              },
              "legal_lane": {
                "description": "Legal status group",
                "enum": ["approved", "compounded", "interim", "investigational", "mixed", "none", "not-us"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5cb9ab2031c9de15df444f7af4909aa88aab119f9547ad71ed24979690ba251a"
        },
        {
          "name": "search",
          "title": "Search Amino Desk",
          "description": "Search Amino Desk's published pages on peptides and GLP-1 medications: compound entries, comparisons, guides, costs and legal status. Returns titles, URLs and snippets. Also finds brand names and seller code names mentioned on the site.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Maximum results (default 8)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to search for, such as a compound, brand or topic",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1ffb4709e1c8b41e669f43f52bde280cb318609a821b2fb5f60b13b393cc89dc"
        }
      ],
      "digest": "sha256:b0cbfd881c800393423736176bdee20f4c93847ec5ec468eb8f6653a4c987ed2"
    }
  }
