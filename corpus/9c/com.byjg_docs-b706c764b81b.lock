{
  "lockfileVersion": 2,
  "subjects": {
    "com.byjg/docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcpdocs.byjg.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "byjg-docs",
        "title": "ByJG Documentation",
        "version": "",
        "websiteUrl": "https://opensource.byjg.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Searches the ByJG open source documentation (PHP libraries, DevOps tooling,\nHelm charts, JavaScript components and AI tools) published at\nopensource.byjg.com.\n\nUse `search_docs` to answer questions about how a ByJG library works, then cite\nthe returned URL. Use `get_document` when a search hit looks right but you need\nthe surrounding context, and `list_projects` to discover what is documented.\n",
      "tools": [
        {
          "name": "get_document",
          "title": "Read a documentation page",
          "description": "Return the full markdown of one documentation page, addressed by the `source` path reported in a search result (for example `php/micro-orm/active-record.md`). Use it when a search hit is relevant but truncated and you need the whole page.",
          "inputSchema": {
            "properties": {
              "source_path": {
                "title": "Source Path",
                "type": "string"
              }
            },
            "required": ["source_path"],
            "title": "get_documentArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_documentOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:81e3d930f0fc719042fbccac2f9ff77cd92714da6160e47c8bf40fa002d93132"
        },
        {
          "name": "list_projects",
          "title": "List documented projects",
          "description": "Inventory of everything indexed, grouped by category and project, with document and passage counts. Use it to discover which ByJG libraries have documentation before searching.",
          "inputSchema": {
            "properties": {},
            "title": "list_projectsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "list_projectsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:444d671cdd90de4b5071b5f9106854c4140c20636499f4755e531caf71c89593"
        },
        {
          "name": "search_docs",
          "title": "Search ByJG documentation",
          "description": "Search the ByJG open source documentation and return the most relevant passages, each with its public URL. Combines semantic and keyword matching, so both natural-language questions ('how do I map a table to a class') and exact symbol names ('TableAttribute') work. Optionally narrow to a category (php, devops, js, ai, helm) or a project (micro-orm, restserver, docker-easy-haproxy, ...).",
          "inputSchema": {
            "properties": {
              "category": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Category"
              },
              "limit": {
                "default": 0,
                "title": "Limit",
                "type": "integer"
              },
              "project": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Project"
              },
              "query": {
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "search_docsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "search_docsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:01159adf6bd119094ccd19a4d676badf743b945fa1a99e0ccfcf3b32f7b4c62a"
        }
      ],
      "digest": "sha256:9d1fdd42bb78438347d05ecf032d16828e2aaa4d24032af80966bd16b15844f6"
    }
  }
}
