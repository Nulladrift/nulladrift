{
  "lockfileVersion": 2,
  "subjects": {
    "com.byjg/docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcpdocs.byjg.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "byjg-docs",
        "title": "ByJG Documentation",
        "version": "0.2.0",
        "websiteUrl": "https://opensource.byjg.com",
        "icons": [
          {
            "src": "https://opensource.byjg.com/img/logo.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Searches the ByJG open source documentation (PHP libraries, DevOps tooling,\nHelm charts, JavaScript components and AI tools) published at\nopensource.byjg.com.\n\nUse `search_docs` to answer questions about how a ByJG library works, then cite\nthe returned URL. Use `get_document` when a search hit looks right but you need\nthe surrounding context, and `list_projects` to discover what is documented.\n",
      "tools": [
        {
          "name": "get_document",
          "title": "Read a documentation page",
          "description": "Return the full markdown of one documentation page, addressed by the `source` path reported in a search result (for example `php/micro-orm/active-record.md`). Use it when a search hit is relevant but truncated and you need the whole page.",
          "inputSchema": {
            "properties": {
              "source_path": {
                "description": "The `source` value from a search_docs result, e.g. php/micro-orm/active-record.md.",
                "title": "Source Path",
                "type": "string"
              }
            },
            "required": ["source_path"],
            "title": "get_documentArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_documentOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:459dc3907ea2091509bc0b5ab04a6754b1fc12faa83bbe023b8d956818682974"
        },
        {
          "name": "list_projects",
          "title": "List documented projects",
          "description": "Inventory of everything indexed, grouped by category and project, with document and passage counts. Use it to discover which ByJG libraries have documentation before searching.",
          "inputSchema": {
            "properties": {},
            "title": "list_projectsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "list_projectsOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ed4f24dac8d8d79278561f602439d124c56d581309868a6a78392f16c140ed0c"
        },
        {
          "name": "search_docs",
          "title": "Search ByJG documentation",
          "description": "Search the ByJG open source documentation and return the most relevant passages, each with its public URL. Combines semantic and keyword matching, so both natural-language questions ('how do I map a table to a class') and exact symbol names ('TableAttribute') work. Optionally narrow to a category (php, devops, js, ai, helm) or a project (micro-orm, restserver, docker-easy-haproxy, ...).",
          "inputSchema": {
            "properties": {
              "category": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Restrict to one category: php, devops, js, ai or helm.",
                "title": "Category"
              },
              "limit": {
                "default": 0,
                "description": "Maximum passages to return; 0 uses the server default. Capped by the server.",
                "title": "Limit",
                "type": "integer"
              },
              "project": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Restrict to one project, as named by list_projects (e.g. micro-orm).",
                "title": "Project"
              },
              "query": {
                "description": "A natural-language question or an exact symbol name.",
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "search_docsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "search_docsOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3e80b04783a2681b3c867d6bfe099100de3c2cbfa410351a7de31efdcad9c995"
        }
      ],
      "digest": "sha256:386b13188df09a5f69941eabf98c0d700f4222f8e0b1113cd327236f2e4ad5d0"
    }
  }
}
