      "tools": [
        {
          "name": "compare_products",
          "description": "Compare offers for the same product model. Takes the same filters as search_products, identifies the best-matching standardized model, then returns up to 10 shop products of that model sorted by price so shops, prices, stock and ratings can be compared. Returns a warning and no products when no model can be identified. Provides objective product data and user feedback for adults only; it does not provide guidance on circumventing age verification, purchase restrictions or other legal limits.",
          "inputSchema": {
            "properties": {
              "brand_name": {
                "default": null,
                "description": "Optional brand name.",
                "type": ["string", "null"]
              },
              "category_name": {
                "default": null,
                "description": "Optional product category name or code.",
                "type": ["string", "null"]
              },
              "country": {
                "default": null,
                "description": "Optional ISO 3166-1 alpha-2 country code of the shop location.",
                "type": ["string", "null"]
              },
              "language": {
                "default": null,
                "description": "Optional language code.",
                "type": ["string", "null"]
              },
              "limit": {
                "default": null,
                "description": "Maximum number of products, 1-10. Default 10.",
                "type": ["integer", "null"]
              },
              "model_name": {
                "default": null,
                "description": "Optional model name.",
                "type": ["string", "null"]
              },
              "query": {
                "description": "Product name, brand, model or search keywords. Required.",
                "type": "string"
              },
              "shop": {
                "default": null,
                "description": "Optional shop name used to find the anchor product.",
                "type": ["string", "null"]
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
