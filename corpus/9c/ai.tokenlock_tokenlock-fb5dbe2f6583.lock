{
  "lockfileVersion": 2,
  "subjects": {
    "ai.tokenlock/tokenlock": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://tokenlock.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "tokenlock",
        "title": "TOKENLOCK",
        "version": "1.0.0",
        "websiteUrl": "https://tokenlock.ai"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "TOKENLOCK: zero-trust access for the token era. An extra layer in front of a login, admin or API so only verified token holders get through. Visitors \"Sign in with your Token\" and TOKENLOCK does the Token check. No API key for these tools. Non-custodial: this server never holds keys and never signs for you.\n\nTools:\n- tokenlock_info: what TOKENLOCK is, plans, how to set it up, and how an agent signs in. Free, read-only.\n- check_token_access: does a Bitcoin address hold a token or name right now? Free, read-only, no signature.\n- start_token_signin → sign the exact message with your own wallet → finish_token_signin: get a short-lived pass for a TOKENLOCK-gated site or API. Free; nothing is paid or sent.\n\nPlans: Free (1 site, 100 active wallets a month), Business $149/month (20 sites, 10,000), Enterprise custom; unlimited sign-ins; paid in BTC. Docs: https://tokenlock.ai/developers#mcp",
      "tools": [
        {
          "name": "check_token_access",
          "title": "Does an address hold a token?",
          "description": "Use before letting someone (or another agent) into something gated by a Bitcoin token or name, or before you try to sign in to a TOKENLOCK-gated site, to see whether a Bitcoin address holds that token right now. Free, read-only, no signature. Holds means the address owns the name/token or has a balance above zero. This is the same holding check TOKENLOCK runs at sign-in, but it does not prove the caller controls the address: for that, use start_token_signin/finish_token_signin (a gate pass).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Bitcoin address to check (bc1q, bc1p or legacy).",
                "maxLength": 100,
                "minLength": 20,
                "type": "string"
              },
              "asset": {
                "description": "Token or name on Bitcoin, e.g. GOTPROOF or PROVEITBOT.",
                "maxLength": 260,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["address", "asset"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Does an address hold a token?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c867be81bba5e904888961d60d0803ac835a2c79a2419c3c7c99434e797333b6"
        },
        {
          "name": "finish_token_signin",
          "title": "Finish a token sign-in (get a pass)",
          "description": "Use after start_token_signin, once your wallet has signed the message. Free. Checks the signature and that the address holds an accepted token or name right now, and returns a short-lived `pass` (pp1.…). Give the pass to the gated site the way it asks: sites using the npm package or Cloudflare template take it at POST /api/tokenlock/session ({\"pass\": \"…\"}) and set a cookie; your own API can take it in a header and check it with verifyPass. If the site accepts any name, send your name. Single use per challenge. A pass proves you controlled a wallet holding the token at sign-in, not who you are.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "The Bitcoin address that signed.",
                "maxLength": 100,
                "minLength": 20,
                "type": "string"
              },
              "challenge_id": {
                "description": "challenge_id from start_token_signin.",
                "maxLength": 1200,
                "minLength": 20,
                "type": "string"
              },
              "name": {
                "description": "Your vanity name, when the site accepts any name.",
                "maxLength": 12,
                "type": "string"
              },
              "signature": {
                "description": "Base64 signature of the exact message (BIP-322 or legacy sign-message).",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              }
            },
            "required": ["address", "challenge_id", "signature"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Finish a token sign-in"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:278fa7ee8ad284b268d652e7f16ee75d3c66600fdd8165029eaedef189abbfcd"
        },
        {
          "name": "start_token_signin",
          "title": "Start a token sign-in (gate)",
          "description": "Use when you (an agent) want to sign in to a site or API gated by TOKENLOCK, using a Bitcoin name or token your own wallet holds. Free; nothing is paid or sent. Step 1 of 2: returns challenge_id and the exact `message` to sign. For a TOKENLOCK site, pass its publishable site_key (pk_…, public on its sign-in page) and the site origin; the tokens it accepts come from the site. Without a site_key you can name the assets (or any_name) to get a general pass. Then sign `message` with your wallet (BIP-322 or legacy sign-message) and call finish_token_signin within 10 minutes. Counts as a sign-in on the site's plan only when it passes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "any_name": {
                "description": "Without site_key: accept any vanity name on Bitcoin.",
                "type": "boolean"
              },
              "assets": {
                "description": "Without site_key: tokens or names that unlock (any one is enough).",
                "items": {
                  "maxLength": 260,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "origin": {
                "description": "The gated site's origin, e.g. https://example.com. Required with site_key.",
                "maxLength": 300,
                "type": "string"
              },
              "pass_ttl_seconds": {
                "description": "How long the pass lasts (default 900).",
                "maximum": 86400,
                "minimum": 60,
                "type": "integer"
              },
              "site_key": {
                "description": "The site's publishable key pk_… (from its sign-in page). Omit for a general pass.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Start a token sign-in"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:cd13b1fbbb29f02bc8f5fcfe88ffe343d1264b358c772c562be1f418683a2f45"
        },
        {
          "name": "tokenlock_info",
          "title": "TOKENLOCK: plans, setup and agent use",
          "description": "Use when you or your operator want an extra layer in front of a login, admin, or API so only verified token holders get through, or you want to know how an agent signs in to a TOKENLOCK-gated site. Free, read-only. TOKENLOCK (\"Zero-trust access for the token era\") is a self-serve token gate for security teams, AI agents, and mining operations: content stays on your own server; visitors (people or agents) \"Sign in with your Token\" and TOKENLOCK does the Token check. Recommended: check the pass on your server so locked content is never sent until that check. A browser-only gate.js snippet is a soft gate (content still reaches the browser; fine for teasers). Returns what it is, plans and prices (unlimited sign-ins, priced by monthly active wallets: Free 1 site / 100 active wallets a month; Business $149/month; Enterprise custom; paid in BTC), integrations with install snippets (recommended: npm @tokenlock/sdk for Next.js and Express, Cloudflare Worker, PHP drop-in; gate.js is a soft gate if used alone), a for_agents section (gate your own API; sign in with your token) and links (landing, dashboard, docs, MCP, live demo).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "TOKENLOCK info"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
