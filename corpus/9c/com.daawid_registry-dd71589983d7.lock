        {
          "name": "request_appointment",
          "title": "Request an appointment",
          "description": "Ask an entry for an appointment for the user, such as a visit, a consultation or a demo. It is a request: the entry's owner confirms a time, or suggests another. Only for entries whose actions (get_entry_sections) list request_appointment. Ask the user for their name and email address. Nothing is sent by this call: the user sends it on Daawid's page, with a code Daawid emails them. Give the user the link from the answer.",
          "inputSchema": {
            "properties": {
              "actionId": {
                "description": "Which of its actions of this kind (get_entry_sections), when it has several.",
                "type": "string"
              },
              "answers": {
                "description": "Answers to the action's own questions (get_entry_sections), by their keys.",
                "type": "object"
              },
              "entry": {
                "description": "Which entry: its ID or slug, from search or get_entry.",
                "type": "string"
              },
              "idempotencyKey": {
                "description": "Your own key for this request: the same key and details within 24 hours give the same request.",
                "type": "string"
              },
              "offeringId": {
                "description": "Which of the entry's offerings (get_entry_sections) it is about, if one.",
                "type": "string"
              },
              "postalCode": {
                "description": "The postal code, when it is at the user's place or the action asks for one.",
                "type": "string"
              },
              "preferredSlots": {
                "description": "Times that suit the user: 1 to 5 windows.",
                "items": {
                  "properties": {
                    "from": {
                      "description": "Start, with the user's UTC offset: \"2026-11-05T09:00:00+01:00\".",
                      "type": "string"
                    },
                    "to": {
                      "description": "End: \"2026-11-05T11:00:00+01:00\".",
                      "type": "string"
                    }
                  },
                  "required": ["from", "to"],
                  "type": "object"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "purpose": {
                "description": "What it is for, in the user's words and language. Don't add what they didn't say, such as features from the entry.",
                "type": "string"
              },
              "requester": {
                "properties": {
                  "email": {
                    "description": "The user's email address, for the code and the answer. Ask them; don't guess.",
                    "type": "string"
                  },
                  "language": {
                    "description": "The language they write in: \"en\".",
                    "type": "string"
                  },
                  "name": {
                    "description": "The user's name. Ask them; don't guess.",
                    "type": "string"
                  },
                  "phone": {
                    "description": "Their phone number with its country code, \"+1 212 555 0123\", if they give it.",
                    "type": "string"
                  },
                  "preferredChannel": {
                    "description": "How they'd like to be answered, if they say.",
                    "enum": ["email", "phone"],
                    "type": "string"
                  }
                },
                "required": ["email", "name"],
                "type": "object"
              }
            },
            "required": ["entry", "preferredSlots", "purpose", "requester"],
            "type": "object"
          },
