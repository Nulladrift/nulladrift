        {
          "name": "search",
          "title": "Search entries",
          "description": "Search Daawid's open registry of people, businesses and organizations by what the user needs, such as 'a dentist in Nairobi' or 'a CRM for a small team'. Each result says who it is, where, and whether it takes on work; get_entry shows one to the user, get_entry_sections reads parts of one.",
          "inputSchema": {
            "properties": {
              "acceptingWork": {
                "description": "Only entries that state they take on new work now.",
                "type": "boolean"
              },
              "category": {
                "description": "Only this category (\"trades.carpentry\") or sector (\"trades\").",
                "type": "string"
              },
              "cursor": {
                "description": "nextCursor of the previous page.",
                "type": "string"
              },
              "kind": {
                "description": "Only people, or only organizations.",
                "enum": ["person", "organization"],
                "type": "string"
              },
              "language": {
                "description": "The language the user writes in: \"ja\". Summaries come in it, when the entry has it.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "near": {
                "anyOf": [
                  {
                    "properties": {
                      "place": {
                        "description": "A town or district: \"Nairobi\", \"Shibuya, Tokyo\", \"Paris, Texas\".",
                        "type": "string"
                      }
                    },
                    "required": ["place"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "country": {
                        "description": "Its country, as ISO 3166-1 alpha-2: \"US\", \"GB\".",
                        "type": "string"
                      },
                      "postalCode": {
                        "description": "A postal code: \"10001\", \"SW1A 1AA\".",
                        "type": "string"
                      }
                    },
                    "required": ["country", "postalCode"],
                    "type": "object"
                  }
                ],
                "description": "The place the user asks about, which they named. Entries there or serving it come first, then the nearest. Never coordinates or a street address."
              },
              "openAt": {
                "description": "Only entries open at this moment, by their stated hours: \"2026-11-06T18:30:00+01:00\". Only when the user asks what is open.",
                "type": "string"
              },
              "outcome": {
                "description": "What the user wants to achieve with it, in a few of their words: \"keep track of leads in a small team\", \"fix a leaking tap today\". It helps the best fits come up and leaves nobody out. No names or personal details.",
                "type": "string"
              },
              "query": {
                "description": "What the user is looking for, in a few words: \"carpenter\", \"fontanero urgente\", \"CRM\". The place goes in `near`, and what they want to achieve in `outcome`.",
                "type": "string"
              },
              "radiusKm": {
                "description": "Only within this many km of `near`. Only when the user names a distance; there is no default.",
                "maximum": 200,
                "minimum": 1,
                "type": "number"
              },
              "verifiedOnly": {
                "default": false,
                "description": "Only entries whose owner proved control of their website.",
                "type": "boolean"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "hits": {
                "type": "array"
              },
              "nextCursor": {
                "type": "string"
              },
              "place": {
                "type": "object"
              },
              "rankingPolicy": {
                "type": "string"
              }
            },
            "required": ["hits", "rankingPolicy"],
            "type": "object"
          },
