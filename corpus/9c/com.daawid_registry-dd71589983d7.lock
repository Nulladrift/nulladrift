        {
          "name": "get_offerings",
          "title": "Get offerings and prices",
          "description": "List what one entry of Daawid's registry offers, with prices and lead times, as its owner declared them: all of it, or what matches a few words, a category or an audience.",
          "inputSchema": {
            "properties": {
              "audience": {
                "description": "Only offerings for this audience, and those for everyone.",
                "enum": ["consumer", "business"],
                "type": "string"
              },
              "category": {
                "description": "Only this category (\"trades.carpentry\") or sector (\"trades\").",
                "type": "string"
              },
              "cursor": {
                "description": "nextCursor of the previous page.",
                "type": "string"
              },
              "entry": {
                "description": "Which entry: its ID or slug, from search or get_entry.",
                "type": "string"
              },
              "language": {
                "description": "The language the user writes in: \"en\". The answer comes in it, when the entry has it.",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Only offerings with these words: \"kitchen\".",
                "type": "string"
              }
            },
            "required": ["entry"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "displayName": {
                "type": "string"
              },
              "entryId": {
                "type": "string"
              },
              "language": {
