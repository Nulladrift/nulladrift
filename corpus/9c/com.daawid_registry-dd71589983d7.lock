        {
          "name": "request_quote",
          "title": "Request a quote",
          "description": "Ask an entry for a quote for the user: a price for a job they describe. Only for entries whose actions (get_entry_sections) list request_quote. Ask the user for their name and email address, and add a budget only if they give one. Nothing is sent by this call: the user sends it on Daawid's page, with a code Daawid emails them. Give the user the link from the answer.",
          "inputSchema": {
            "properties": {
              "actionId": {
                "description": "Which of its actions of this kind (get_entry_sections), when it has several.",
                "type": "string"
              },
              "answers": {
                "description": "Answers to the action's own questions (get_entry_sections), by their keys.",
                "type": "object"
              },
              "budget": {
                "description": "The most they want to spend, if they say. Ask for the currency; don't assume one.",
                "properties": {
                  "currency": {
                    "description": "Its ISO 4217 code: \"USD\", \"EUR\".",
                    "type": "string"
                  },
                  "max": {
                    "anyOf": [
                      {
                        "maximum": 999999999.99,
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "string"
                      }
                    ],
                    "description": "The amount: \"5000.00\", or 5000."
                  }
                },
                "required": ["currency", "max"],
                "type": "object"
              },
              "description": {
                "description": "The job, in the user's words and language: what it is, how big, what else changes the price. Show it to them; don't add what they didn't say.",
                "type": "string"
              },
              "desiredTiming": {
                "description": "When they would like it done, in their words: \"February or March\".",
                "type": "string"
              },
              "entry": {
                "description": "Which entry: its ID or slug, from search or get_entry.",
                "type": "string"
              },
              "idempotencyKey": {
                "description": "Your own key for this request: the same key and details within 24 hours give the same request.",
                "type": "string"
              },
              "offeringId": {
                "description": "Which of the entry's offerings (get_entry_sections) it is about, if one.",
                "type": "string"
              },
              "postalCode": {
                "description": "The postal code where the work is, when the user gives it or the action asks for one.",
                "type": "string"
              },
              "requester": {
                "properties": {
                  "email": {
                    "description": "The user's email address, for the code and the answer. Ask them; don't guess.",
                    "type": "string"
                  },
                  "language": {
                    "description": "The language they write in: \"en\".",
                    "type": "string"
                  },
