          "title": "Get brand kit",
          "description": "Get one entry's brand kit, as its owner declared it: logo, pictures, colours, fonts and corners. For showing or building something in the entry's own look.",
          "inputSchema": {
            "properties": {
              "entry": {
                "description": "Which entry: its ID or slug, from search or get_entry.",
                "type": "string"
              },
              "language": {
