        {
          "name": "send_message",
          "title": "Send a message",
          "description": "Send a message to an entry for the user: a question, or anything they want its owner to know. Only for entries whose actions (get_entry_sections) list send_message. Ask the user for their name and email address. Nothing is sent by this call: the user sends it on Daawid's page, with a code Daawid emails them. Give the user the link from the answer.",
          "inputSchema": {
