                "type": "string"
              },
              "id": {
                "description": "Its ID, from search: \"ent_…\".",
                "type": "string"
              },
              "language": {
                "description": "The language the user writes in: \"en\". The answer and its card come in it, when the entry has it.",
                "type": "string"
