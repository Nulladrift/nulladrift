{
  "lockfileVersion": 2,
  "subjects": {
    "com.penguindriver/models": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://models.penguindriver.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "tw-ai-models",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AI 模型下架與替代日程（繁體中文）：OpenAI、Claude、Gemini 模型何時淘汰、何時下架、官方建議替代，每筆附官方來源；可檢查程式碼裡用到的模型。",
      "tools": [
        {
          "name": "ai_model_shutdown_calendar",
          "description": "依月份列出模型下架日。",
          "inputSchema": {
            "properties": {
              "month": {
                "description": "YYYY-MM",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cc633747d9fc4d9317f5e34eeeec53a1695fa26cd317b84b23e7a8ecab8f4ed2"
        },
        {
          "name": "check_code_for_deprecated_models",
          "description": "貼上程式碼、設定檔或模型 ID 清單，找出已下架或即將下架的模型（最多 10 個）。",
          "inputSchema": {
            "properties": {
              "text": {
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9bee4d30641ce8fffc103d6ec94e0dfc719fcc83624f6f5ed5c09b3618f95174"
        },
        {
          "name": "find_ai_model_replacement",
          "description": "查某個模型官方建議改用哪個模型。",
          "inputSchema": {
            "properties": {
              "q": {
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6846e4787b35f601ed67b08b63cbf8a6b9286d29688f55cd6c7b80a0e013b19f"
        },
        {
          "name": "get_ai_model",
          "description": "查單一模型 ID（如 gpt-4o-2024-05-13、claude-3-5-haiku-20241022、gemini-2.0-flash）的狀態、宣布淘汰日、下架日、剩幾天、官方建議替代與來源。",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2f12a831d5f5b2134d99e565efb495f94c52959c91019aba0bd7386c126c16a5"
        },
        {
          "name": "list_ai_models",
          "description": "列出 OpenAI、Anthropic（Claude）、Google（Gemini）模型與 API 功能的淘汰狀態、下架日與官方建議替代；可依公司、狀態、類型篩選。",
          "inputSchema": {
            "properties": {
              "kind": {
                "enum": ["chat", "reasoning", "image", "video", "audio", "realtime", "transcribe", "tts", "embedding", "music", "robotics", "agent", "platform", "finetune"],
                "type": "string"
              },
              "provider": {
                "enum": ["openai", "anthropic", "google"],
                "type": "string"
              },
              "status": {
                "enum": ["scheduled", "deprecated", "active", "retired"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d080083a7b3069c0ff7605cc5bc109e9b47723a794428d54e6b90a1af3e5242c"
        },
        {
          "name": "upcoming_ai_model_shutdowns",
          "description": "列出幾天內將下架的 AI 模型（預設 90 天），依下架日排序。",
          "inputSchema": {
            "properties": {
              "days": {
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:19ad072d31ca56e3101e904c41cfda4f444d66922770eba2828b75a087288c52"
        }
      ],
      "digest": "sha256:7424c7067d8074f42c0cef046008916c862060cb238fcb4fed9bccd6fb5b6bc0"
    }
  }
}
