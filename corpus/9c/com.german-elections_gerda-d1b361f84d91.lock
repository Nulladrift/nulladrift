{
  "lockfileVersion": 2,
  "subjects": {
    "com.german-elections/gerda": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.german-elections.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "gerda",
        "title": "GERDA German Election Database",
        "version": "0.1.0",
        "description": "Read-only access to published GERDA election data."
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use find_geographies before querying names. Treat AGS, state, and county codes as strings. Party shares and turnout are proportions from 0 to 1. Always retain the release identifier, harmonization year, caveats, and citation.",
      "tools": [
        {
          "name": "describe_dataset",
          "description": "Describe coverage, caveats, citation, and columns for a GERDA dataset.",
          "inputSchema": {
            "properties": {
              "column_search": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Column Search"
              },
              "dataset": {
                "title": "Dataset",
                "type": "string"
              }
            },
            "required": ["dataset"],
            "title": "describe_datasetArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "describe_datasetDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2ad050f739b2c6343cc5941d6b8e26dd4f2ad4cef8d1a881191447e929410134"
        },
        {
          "name": "find_geographies",
          "description": "Resolve a municipality name or AGS prefix to GERDA geographic identifiers.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "title": "Query",
                "type": "string"
              },
              "state": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "State"
              }
            },
            "required": ["query"],
            "title": "find_geographiesArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "find_geographiesDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:376ff9b050b1692120daad4e4d5148f9163620d7d79b39d2646f1de5e36b6d4c"
        },
        {
          "name": "get_download",
          "description": "Return the full-file URL, checksum, citation, and usage notes.",
          "inputSchema": {
            "properties": {
              "dataset": {
                "title": "Dataset",
                "type": "string"
              },
              "format": {
                "default": "csv",
                "title": "Format",
                "type": "string"
              }
            },
            "required": ["dataset"],
            "title": "get_downloadArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_downloadDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:42f78d97a6c865c88e6dd3d623d0981ce3a8816e62f1fddc6a2b95c0941622dc"
        },
        {
          "name": "list_datasets",
          "description": "List GERDA datasets available through this server.",
          "inputSchema": {
            "properties": {},
            "title": "list_datasetsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "list_datasetsDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7890387d89bd20dd7bce6c570c43ec290d13f85a142adcd76c46116381fd24c5"
        },
        {
          "name": "query_results",
          "description": "Return a bounded, reproducible subset of a published GERDA dataset.",
          "inputSchema": {
            "properties": {
              "ags": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Ags"
              },
              "counties": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Counties"
              },
              "dataset": {
                "title": "Dataset",
                "type": "string"
              },
              "limit": {
                "default": 100,
                "title": "Limit",
                "type": "integer"
              },
              "metrics": {
                "items": {
                  "type": "string"
                },
                "title": "Metrics",
                "type": "array"
              },
              "offset": {
                "default": 0,
                "title": "Offset",
                "type": "integer"
              },
              "states": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "States"
              },
              "years": {
                "anyOf": [
                  {
                    "items": {
                      "type": "integer"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Years"
              }
            },
            "required": ["dataset", "metrics"],
            "title": "query_resultsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "query_resultsDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b17687f589195da9ad6a517d93ab1ca31422a51e9d18d926450d05a9cec3e335"
        }
      ],
      "digest": "sha256:483c806d6198a91083650c81b7d3d9ec52e267f8a7cec6332e6b06319375fdab"
    }
  }
}
