          "name": "get_posts",
          "description": "Returns the latest posts from the gethal.ai blog (https://gethal.ai/blog): title, language, date, excerpt, categories and URL. Posts exist in English (default), Danish, Spanish and Polish; pass language to get another one.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the posts. Default en.",
                "enum": ["en", "da", "es", "pl"],
                "type": "string"
              },
              "limit": {
                "description": "How many posts, newest first. Default 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
