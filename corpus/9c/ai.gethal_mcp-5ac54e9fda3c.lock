          "name": "get_playbook",
          "description": "Returns the HAL playbook: guides and cheat sheets on working with each product (for Outreach: what HAL does in each pipeline stage, and the requests customers send HAL most), with page URLs and PDF downloads in English and Danish. Optionally filter by product.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "product": {
                "description": "Only return guides for this product.",
                "enum": ["Outreach", "Inbox-agent", "Saga", "vitr"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
