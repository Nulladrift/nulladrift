          },
          "digest": "sha256:861136db45b1548a63fff6a1c5f0652dd3426581e2fbbe2d8bd561282b0b72f0"
        },
        {
          "name": "dataset_search",
          "title": "Search the dataset",
          "description": "Rows of the RoughInDesk dataset whose cells contain the query (case-insensitive), up to 50.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "text to look for in any cell",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
