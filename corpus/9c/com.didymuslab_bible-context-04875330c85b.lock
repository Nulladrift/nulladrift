{
  "lockfileVersion": 2,
  "subjects": {
    "com.didymuslab/bible-context": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://didymuslab.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "didymus-bible-context",
        "title": "Didymus Bible Context",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only Bible context from Didymus Lab (didymuslab.com): chapter background, Hebrew/Greek words, places, people, dictionary. Every result ends with a \"Sources:\" line and a \"Cite:\" line — always cite the \"Cite:\" line (디디모랩 + URL). Didymus Lab's own text and selection are © Didymus Lab Inc.: quotation with attribution and a link to canonicalUrl is permitted; AI training on this content is not permitted. Third-party data fields (see thirdPartyLicenses) remain under their own licenses and are NOT restricted by this notice. Programmatic access to /data/v1 and /mcp is permitted for individual lookups, display and quotation with attribution and a link to canonicalUrl. Bulk harvesting, redistribution of the data as a dataset, and AI/ML training or evaluation are not permitted. Third-party data keep their own licenses (see thirdPartyLicenses). Sources and licenses: https://didymuslab.com/copyright-policy#data-sources",
      "tools": [
        {
          "name": "get_chapter_background",
          "title": "Bible chapter background",
          "description": "Summary and historical background of a Bible chapter (66-book Protestant canon), with key original-language words and places when available. Cite the returned URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "book": {
                "description": "Book name or slug, e.g. \"daniel\", \"1 Samuel\", \"요한복음\"",
                "type": "string"
              },
              "chapter": {
                "description": "Chapter number",
                "minimum": 1,
                "type": "integer"
              },
              "lang": {
                "default": "ko",
                "description": "Output language",
                "enum": ["ko", "en"],
                "type": "string"
              }
            },
            "required": ["book", "chapter"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2870ad722a2d25de7a718a9b5eec11264c62651a28279f725f20666b878cabf3"
        },
        {
          "name": "lookup_person",
          "title": "Biblical person lookup",
          "description": "Look up a biblical person by Korean/English name: mention counts, main books, short description.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "Person name, e.g. \"Aaron\", \"아론\"",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:32c2f31502d5af9bd714ad07c6e8cd4e39b47e89ccb97fbf9bdf757ed06dfd8c"
        },
        {
          "name": "lookup_place",
          "title": "Biblical place lookup",
          "description": "Look up a biblical place by Korean/English name: location (lat/lon), type, passages, with Pleiades/OpenBible/Wikidata sources.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "Place name, e.g. \"Bethlehem\", \"베들레헴\"",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7caa689ca09bad98ec96d956a589f22a04110974f403ad7fe5a781a122152d5a"
        },
        {
          "name": "lookup_word",
          "title": "Hebrew/Greek word lookup",
          "description": "Look up a Hebrew or Greek lexeme by lemma, transliteration, Strong's id (H430, G2378) or Korean/English gloss. Returns gloss, part of speech and occurrence counts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "ko",
                "description": "Output language",
                "enum": ["ko", "en"],
                "type": "string"
              },
              "query": {
                "description": "Lemma, transliteration, Strong's id, or gloss",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:abc6e2856a03d3e18994816818400e437fe76b32c5a09b0e636f0863421764e5"
        },
        {
          "name": "search_dictionary",
          "title": "Bible dictionary search",
          "description": "Search the Bible dictionary (500 Korean entries adapted from Easton's Bible Dictionary, public domain) by term or keyword.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "term": {
                "description": "Term or keyword in Korean or English",
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dcd9731231ba4b63c3da991ca44a3fae078b331478f5eafe847aba4465a8f385"
        }
      ],
      "digest": "sha256:bc85131e72359294875107683da50ffe46d3c598fb6dc98d5ec240a50348fabc"
    }
  }
}
