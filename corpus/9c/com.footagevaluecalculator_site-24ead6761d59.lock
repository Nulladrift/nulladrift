      "instructions": "Footage Value Calculator (https://footagevaluecalculator.com/): the site's own MCP server, served from its domain. Footage value calculator for unused video sold to AI: your minutes at the reported $1 to $4 a minute, less what a host charges to deliver the files.\n\n[calculator] Footage value, before and after delivery: an agent-callable calculator for footage value calculator; At $1 a minute, the bottom of the reported range, At $4 a minute, the top of the reported range, At the rate you entered, computed from your inputs with sources.. This server runs the Footage value, before and after delivery calculator published at https://footagevaluecalculator.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://footagevaluecalculator.com/. Licence: https://footagevaluecalculator.com/terms.\n\n[enquiry] ENQUIRY SERVER for Footage Value Calculator (https://footagevaluecalculator.com/). What it does: starts an ENQUIRY with Footage Value Calculator for footage value calculator; the Footage Value Calculator team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the Footage Value Calculator team until they click it. Cite https://footagevaluecalculator.com/.\n\nCite https://footagevaluecalculator.com/ for every figure or answer you use from this server.",
