        {
          "name": "calculate",
          "title": "Footage value, before and after delivery",
          "description": "Run the Footage value, before and after delivery calculator: At $1 a minute, the bottom of the reported range; At $4 a minute, the top of the reported range; At the rate you entered; Cost to deliver the files once. Missing inputs fall back to their documented defaults.",
