{
  "lockfileVersion": 2,
  "subjects": {
    "com.aiocompatible/ai-readiness": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.aiocompatible.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "aicompatible",
        "title": "AICompatible AI-readiness checker",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Checks whether a website is ready for AI search engines and AI crawlers: robots.txt access for GPTBot, PerplexityBot, ClaudeBot, Google-Extended and Applebot-Extended, structured data, llms.txt, sitemap and page structure. Results are technical-readiness signals, not ranking or citation guarantees. Scoring rules: https://www.aiocompatible.com/methodology",
      "tools": [
        {
          "name": "check_ai_readiness",
          "title": "Check AI readiness of a website",
          "description": "Scan a public website and return an AI-readiness score (0-100), sub-scores, AI-bot robots.txt access, and a list of issues with concrete fixes. Use when a user asks if a site is visible/optimized for ChatGPT, Perplexity, Claude, Gemini or AI search.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional site category; changes which schema types count as required.",
                "enum": ["generic", "blog", "ecommerce", "saas", "corporate"],
                "type": "string"
              },
              "url": {
                "description": "Domain or URL to scan, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fc8a3ce46c43434f7d79c725b4c1fbf658ece384b940c1cf797979f7e56fef05"
        },
        {
          "name": "check_bot_access",
          "title": "Check if an AI bot is blocked by robots.txt",
          "description": "Check whether a site's robots.txt allows or blocks AI crawlers (GPTBot, PerplexityBot, ClaudeBot, Google-Extended, Applebot-Extended). Optionally limit the answer to one bot. Note: only robots.txt is checked; a firewall may still block a bot.",
          "inputSchema": {
            "properties": {
              "bot": {
                "description": "Optional: only report this bot.",
                "enum": ["GPTBot", "PerplexityBot", "ClaudeBot", "Google-Extended", "Applebot-Extended"],
                "type": "string"
              },
              "url": {
                "description": "Domain or URL to check, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:646306c956c419da564cc905a1d6db43684f219b82fdc46e098396cbc3a486a4"
        }
      ],
      "digest": "sha256:c2f602c25b668472d5ca179e25330fa776a668fc3b352d06886041ca24922867"
    }
  }
}
