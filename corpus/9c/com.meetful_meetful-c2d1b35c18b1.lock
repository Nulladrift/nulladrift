        {
          "name": "book_time",
          "title": "Book a time",
          "description": "Books a time on someone's Meetful booking link for the person using the assistant. Returns the meeting link, a calendar file and a private link to move or cancel; the owner is told an assistant made the booking. If the time was taken meanwhile, the error lists the nearest open times. No sign-in needed.",
          "inputSchema": {
            "properties": {
              "about": {
                "description": "What they want to cover. It becomes the first item in the meeting.",
                "type": "string"
              },
              "answers": {
                "description": "Answers to the booking page's own questions, by question id.",
                "type": "object"
              },
              "at": {
                "description": "The start time, in ISO 8601 (like 2026-11-12T15:00:00Z) or epoch milliseconds.",
                "type": "string"
              },
              "email": {
                "description": "Their email: the confirmation, the calendar file and the link to move it go there. Recommended.",
                "type": "string"
              },
              "link": {
                "description": "The booking link, or just the name in it.",
                "type": "string"
              },
              "minutes": {
                "description": "How long, if the page offers more than one length.",
                "type": "number"
              },
              "name": {
                "description": "Who will be in the meeting — your person's name.",
                "type": "string"
              },
              "via": {
                "description": "Your own name (Grok, ChatGPT, Claude…), so the owner knows which assistant booked.",
                "type": "string"
              }
            },
            "required": ["at", "link", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Book a time"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
