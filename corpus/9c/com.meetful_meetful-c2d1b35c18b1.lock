        {
          "name": "import_transcript",
          "title": "Import a transcript",
          "description": "Imports a meeting transcript or chat log from another tool into the signed-in person's Meetful dashboard: .vtt or .srt captions, plain-text transcripts, Read AI JSON, JSON lists of turns, Google Meet and Zoom chat logs, or a WhatsApp export. Speaker labels are kept as written. Returns the new meeting's id and link.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "The file name, with its extension — it says what format this is and often carries the date.",
                "type": "string"
              },
              "started_at": {
                "description": "ISO 8601 start time, if the file does not say.",
                "type": "string"
              },
              "text": {
                "description": "The whole file as text.",
                "type": "string"
              },
              "title": {
