        {
          "name": "set_up_booking_page",
          "title": "Set up a booking page",
          "description": "Creates a Meetful booking page (meetful.com/<handle>) and returns the code to put it on a website: a one-line button, the page inline, an iframe, or a plain link. Every booking gets its own video room. For a signed-in person the page is theirs and live at once; otherwise the result includes a claim link, and the page goes live when its owner signs in.",
          "inputSchema": {
            "properties": {
              "blurb": {
                "description": "A sentence or two under the heading.",
                "type": "string"
              },
              "email": {
                "description": "The person's address — shown on the claim page so they know it was made for them. Nothing is sent to it.",
                "type": "string"
              },
              "handle": {
                "description": "The address wanted: meetful.com/<handle>. Optional — one is made from the name.",
                "type": "string"
              },
              "hours": {
                "description": "Open hours, like \"Mon-Fri 09:00-17:00\" or \"Mon-Thu 9am-5pm; Fri 9am-1pm\". Default Monday to Friday, 9 to 5.",
                "type": "string"
              },
              "lengths": {
                "description": "How long a meeting can be, in minutes — any of 15, 30, 45, 60, 90. The person booking picks one; the first is shown first. Default 30.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "name": {
                "description": "Whose booking page this is — shown on it.",
                "type": "string"
              },
              "site": {
