        {
          "name": "listen",
          "title": "Listen to a meeting",
          "description": "Returns what happens next in a call the agent has joined: new transcript lines with their speakers, new chat messages and tasks handed to the agent. It returns as soon as something new arrives, or after wait_seconds, with a \"next\" value marking where it stopped. An agent that has not read for 90 seconds leaves the call.",
          "inputSchema": {
            "properties": {
              "meeting": {
                "type": "string"
              },
              "since": {
                "description": "The \"next\" value from the previous read. Omit for the last few minutes.",
                "type": "number"
              },
              "wait_seconds": {
                "description": "How long to wait for something new, up to 45. Default 25.",
                "type": "number"
              }
            },
            "required": ["meeting"],
            "type": "object"
