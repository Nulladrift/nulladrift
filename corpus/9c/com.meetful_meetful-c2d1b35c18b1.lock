        {
          "name": "send_feedback",
          "title": "Send feedback about Meetful",
          "description": "Files feedback about Meetful (a bug, a confusing moment or an idea) on the list the product is built from, and returns a link to follow it. With fix set, it becomes a fix request that a person reviews before anything changes.",
          "inputSchema": {
            "properties": {
              "actual": {
                "type": "string"
              },
              "expected": {
                "type": "string"
              },
              "fix": {
                "description": "True when the person wants the platform itself changed.",
                "type": "boolean"
              },
              "kind": {
                "enum": ["bug", "idea", "confusing", "praise", "question"],
                "type": "string"
              },
              "page": {
                "description": "The URL or path where you noticed it.",
                "type": "string"
              },
              "severity": {
                "description": "5 = blocks the task, 1 = polish",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "text": {
                "description": "What you noticed, in one or a few sentences.",
                "type": "string"
              }
