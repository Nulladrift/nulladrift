        {
          "name": "start_meeting",
          "title": "Start a meeting",
          "description": "Starts a new Meetful video meeting and returns its link. The link opens in any browser with no account and no download. Meetful can email the link to up to 10 addresses.",
          "inputSchema": {
            "properties": {
              "about": {
                "description": "What the meeting is about, in a few words, for the invitation.",
                "type": "string"
              },
              "invite": {
                "description": "Email addresses Meetful sends the link to, up to 10. Requires signing in.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "mode": {
                "description": "What the room does with what is said: \"meet\" keeps live notes, \"agenda\" follows the topics given, \"align\" runs a decision protocol. Default \"meet\".",
                "enum": ["meet", "agenda", "align"],
