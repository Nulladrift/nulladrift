        {
          "name": "search_products",
          "description": "Search the 25karats made-to-order catalog (wedding bands, engagement rings, his & hers sets, fine jewelry) by keywords or a style code. Use this first when a shopper describes what they want (\"braided mens wedding band\", \"vintage engagement ring\"). Returns product cards with live starting prices in USD, image URLs, and product URLs. Follow up with get_product for options and price_product for an exact configured price. The query is keyword search only: put a budget in price_min/price_max, the kind of ring in category, and the metal in metal; prices or \"under $X\" written into query are ignored. total_count is exact unless capped is true; capped counts are lower bounds imposed by the search index.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Optional shopper-facing catalog category. engagement_rings / wedding_bands / his_hers_sets / jewelry select a product line; mens_rings and womens_diamond_rings select the site's men's (/wedding-rings/mens) and women's (/wedding-rings/womens) ring collections, which hold plain bands and diamond rings alike",
                "enum": ["engagement_rings", "wedding_bands", "mens_rings", "womens_diamond_rings", "his_hers_sets", "jewelry"],
                "type": "string"
              },
              "limit": {
                "description": "Requested results per page (default 10); values outside 1..24 are clamped and reported",
                "type": "integer"
              },
              "metal": {
                "description": "Optional metal filter; each returned starting price and URL use this metal's variant",
                "enum": ["10K", "14K", "18K", "PLAT", "SILVER", "STEEL", "TITANIUM", "COBALT", "TUNGSTEN", "CERAMIC"],
                "type": "string"
              },
              "page": {
                "description": "Requested page; values below 1 are clamped and reported",
                "type": "integer"
              },
              "price_max": {
                "type": "number"
              },
              "price_min": {
                "type": "number"
              },
              "product_line": {
