        {
          "name": "price_product",
          "description": "Exact live price in USD for a fully configured item — the same number the customer pays on 25karats.com (computed from current metal market pricing, not a cached feed price). Identify the item by variant_id (from get_product) or style_code, optionally with metal. For wedding bands pass ring_size/width/thickness/color/finish (option_value ids or display values from get_product); for his & hers sets pass his/her objects with those keys; for engagement rings pass stone_type and ring_size. Unset axes use the product's defaults. Band and set prices depend on ring size: without ring_size the quote is provisional (it assumes a size, often the smallest and cheapest), so ask the shopper's size first. Returns the price, the resolved configuration, and a deep_link_url that opens the product page pre-configured for checkout (engraving excepted: the shopper enters it on the page, as the notes say). Invalid values return the list of valid ones — correct and retry. Any option group can also be set through the options object keyed by the option_id values returned by get_product (the only way to configure generic jewelry). His & hers options and engraving belong inside the respective his/her object. Inputs that do not apply to the item (stone_type on a band, top-level ring_size on a set) are rejected with the inputs that do; settings sold without a center stone say so in configuration and notes.",
