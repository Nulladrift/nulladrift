              "query": {
                "description": "Style keywords or a style code (e.g. 'braided', 'HC100232'). Not parsed for budget, category, or metal: pass those as price_min/price_max, category, and metal",
                "type": "string"
              },
              "tags": {
                "description": "Every supplied style tag must match, by slug, name, or id",
                "items": {
                  "type": "string"
