            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "metal": {
                "enum": ["10K", "14K", "18K", "PLAT", "SILVER", "STEEL", "TITANIUM", "COBALT", "TUNGSTEN", "CERAMIC"],
