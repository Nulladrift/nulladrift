      "serverInfo": {
        "name": "25karats",
        "title": "25karats — Made-to-Order Wedding & Engagement Rings",
        "version": "1.0.18",
        "websiteUrl": "https://www.25karats.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "25karats is a family-owned New York jewelry manufacturer: 1,500+ made-to-order wedding band designs, engagement rings, his & hers sets, and IGI-certified lab-grown diamonds, handcrafted in the USA with free shipping, free engraving, 60-day returns, and a lifetime warranty. Every ring is customizable (metal, ring size, width, thickness, color, finish, engraving) and priced live from current metal markets. Typical flow: search_products or browse_collection to find candidates (pass a shopper's budget, ring category, and metal as filters, not inside the search text), get_product for options and ids, price_product for the exact configured price plus a pre-configured checkout link, get_product_images for high-resolution photos, search_diamonds for loose center stones, and get_store_info for policies. All prices are USD.",
      "tools": [
        {
          "name": "browse_collection",
          "description": "Browse one collection/category page deterministically — the same product set, ordering, and filters a shopper sees on the site. Pass the collection permalink from list_collections (e.g. 'wedding-rings/womens/eternity'). Filter by style tags, metals, or sort; paginate 24 per page. Prefer search_products for free-text intent and this tool for \"show me everything in X\".",
