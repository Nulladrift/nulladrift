                    "type": "string"
                  },
                  "thickness": {
                    "type": "string"
                  },
                  "width": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "metal": {
                "enum": ["10K", "14K", "18K", "PLAT", "SILVER", "STEEL", "TITANIUM", "COBALT", "TUNGSTEN", "CERAMIC"],
                "type": "string"
