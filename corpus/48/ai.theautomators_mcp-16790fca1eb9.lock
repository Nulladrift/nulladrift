      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only server for The Automators, a Calgary AI automation agency serving Canada and the United States with remote delivery worldwide. Everything here is public site content. There are no write tools and no authentication. The only contact address is info@theautomators.ai and the only people named are the public team. To reach a human, use get_contact_options or the draft_consultation_request prompt; the server never sends anything. Quote pricing and figures exactly as returned. Only list_case_studies describes past client work; industry example use cases are illustrative.",
      "tools": [
        {
          "name": "assess_ai_readiness",
          "title": "Assess AI readiness",
          "description": "Runs the site's AI Readiness Assessment. Call it with no answers to get the 10 questions and their scored options; ask the user; then call it again with one score (1 to 4) per question in order to get the level (Beginner, Intermediate, Advanced), the percent score, the per-dimension breakdown, the weakest dimensions and service recommendations.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "answers": {
                "description": "One score from 1 to 4 per question, in question order (10 questions). Omit to receive the questions.",
                "items": {
                  "maximum": 4,
                  "minimum": 1,
                  "type": "integer"
                },
                "maxItems": 10,
                "minItems": 10,
                "type": "array"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4be52ef818b4f15db2c44349df8650f0356f55939f394923150cbf48f16228a0"
        },
        {
          "name": "check_service_area",
          "title": "Check service area",
          "description": "Resolves a city, province, state or country to the matching local page (649 Canadian and US pages) and says whether it is served. Anything outside Canada and the US is served remotely and resolves to the locations index with a note. Use it whenever a user mentions where they are.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "query": {
                "description": "A place, e.g. \"Calgary\", \"Portsmouth, VA\", \"Ontario\", \"Berlin\"",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
