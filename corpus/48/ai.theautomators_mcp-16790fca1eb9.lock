        {
          "name": "prioritize_processes",
          "title": "Prioritize processes to automate",
          "description": "Runs the site's Process Prioritizer on up to 10 manual processes (name, hours per week, frequency, complexity, error-prone, people involved). Returns each one's score out of 100, priority, estimated annual savings, reasoning and implementation timeline, ranked, plus totals and service recommendations. Use it when a user lists several things they might automate.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "processes": {
                "items": {
                  "properties": {
                    "complexity": {
                      "enum": ["low", "medium", "high"],
                      "type": "string"
                    },
                    "errorProne": {
                      "description": "Whether mistakes happen regularly",
                      "type": "boolean"
                    },
                    "frequency": {
                      "enum": ["daily", "weekly", "monthly"],
                      "type": "string"
                    },
                    "hoursPerWeek": {
                      "description": "Hours per week it takes (1 to 40)",
                      "maximum": 40,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "name": {
                      "description": "What the process is, e.g. \"Invoice processing\"",
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    "peopleInvolved": {
                      "description": "People who touch it (1 to 20)",
                      "maximum": 20,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["complexity", "errorProne", "frequency", "hoursPerWeek", "name", "peopleInvolved"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["processes"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
