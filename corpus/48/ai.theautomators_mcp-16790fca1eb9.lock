        },
        {
          "name": "estimate_customer_service_savings",
          "title": "Estimate customer service savings",
          "description": "Runs the site's Customer Service Cost Calculator: from monthly tickets, handle time, agent cost, agents on staff, response time and after-hours share it estimates current and AI-assisted monthly cost, monthly and annual savings, tickets deflected, response-time reduction and ROI, with service recommendations. Use it for support-desk cost questions. An industry preset fills typical inputs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "afterHoursPercent": {
                "description": "Percent of tickets arriving after hours (0 to 60)",
                "maximum": 60,
                "minimum": 0,
                "type": "integer"
              },
              "agentHourlyCost": {
                "description": "Agent hourly cost, CAD (15 to 75)",
                "maximum": 75,
                "minimum": 15,
                "type": "integer"
              },
              "agentsOnStaff": {
                "description": "Agents on staff (1 to 50)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "avgHandleTime": {
                "description": "Average handle time in minutes (2 to 30)",
                "maximum": 30,
                "minimum": 2,
                "type": "integer"
              },
              "avgResponseTime": {
                "description": "Average first response time in minutes (1 to 120)",
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              },
              "industry": {
                "description": "Optional preset; fills any input left out",
                "enum": ["custom", "retail-ecommerce", "saas-technology", "healthcare", "financial-services", "hospitality"],
                "type": "string"
              },
              "monthlyTickets": {
                "description": "Support tickets per month (100 to 50000)",
                "maximum": 50000,
                "minimum": 100,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4bcaff9952c8bbc893f1d34952df1ac7df2e03561bbad6f5ce11f31a6f43b4ed"
        },
        {
          "name": "estimate_roi",
          "title": "Estimate automation ROI",
          "description": "Runs the site's ROI calculator: from team size, weekly manual hours, hourly cost and error rate it estimates annual hours saved, annual savings, implementation cost, ROI percent and payback months, plus the service recommendations the page shows. Use it when a user wants a number for the value of automating a process. Optional industry preset sets the automation efficiency.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "automationEfficiency": {
                "description": "Share of manual hours automation removes (default 0.70; presets use 0.60 to 0.75)",
                "maximum": 0.9,
                "minimum": 0.5,
                "type": "number"
              },
              "employees": {
                "description": "People doing the manual work (1 to 100)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "errorRate": {
                "description": "Percent of manual work containing errors (0 to 25)",
                "maximum": 25,
                "minimum": 0,
                "type": "number"
              },
              "hourlyCost": {
                "description": "Fully loaded hourly cost per person, CAD (15 to 150)",
                "maximum": 150,
                "minimum": 15,
                "type": "integer"
              },
              "hoursPerWeek": {
                "description": "Hours per person per week on manual tasks (1 to 40)",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "industry": {
                "description": "Optional preset; fills any input left out and sets automationEfficiency unless given explicitly",
                "enum": ["custom", "oil-gas", "healthcare", "professional-services", "ecommerce-retail", "manufacturing", "technology-saas", "finance-insurance", "real-estate"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
