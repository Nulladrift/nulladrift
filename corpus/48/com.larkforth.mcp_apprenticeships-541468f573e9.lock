        "name": "larkforth",
        "title": "Larkforth: apprenticeships for 16 to 18 year olds",
        "version": "1.0.0",
        "websiteUrl": "https://mcp.larkforth.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only tools for apprenticeships in England: apprentice_minimum_wage gives the legal minimum pay from gov.uk rates, get_larkforth describes the Larkforth app for 16 to 18 year olds and their parents. They take no personal details.",
      "tools": [
        {
          "name": "apprentice_minimum_wage",
          "title": "Apprentice minimum wage",
          "description": "The legal minimum pay for an apprentice in the UK (gov.uk rates): hourly, weekly, monthly and yearly, gross, for the hours given. Uses an age band only, never a date of birth.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age_band": {
                "description": "The apprentice's age band.",
                "enum": ["under_19", "19_20", "21_plus"],
                "type": "string"
              },
              "first_year": {
                "description": "In the first year of the apprenticeship (default true). Only matters at 19 or over.",
                "type": "boolean"
              },
              "hours_per_week": {
                "description": "Paid hours a week, training included (default 30).",
                "maximum": 48,
                "minimum": 1,
                "type": "number"
              },
              "period": {
                "description": "Current rates (default) or the rates from 1 April 2027.",
                "enum": ["current", "april_2027"],
                "type": "string"
              }
            },
            "required": ["age_band"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Apprentice minimum wage"
          },
          "behavior": {
            "destructive": false,
