            "readOnly": true
          },
          "digest": "sha256:4bd560f09752f87c424f5515c9eb5232656d8102be98709690584be1d4369287"
        },
        {
          "name": "get_larkforth",
          "title": "Larkforth: what it does and the price",
          "description": "Describes Larkforth, a web app that helps 16 to 18 year olds in England find apprenticeships and degree apprenticeships and write their applications in their own words, with a parent or carer view. Gives the free plan, the 6-month pass price, free resources for parents and the sign-up link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audience": {
                "description": "Who is asking (default parent).",
                "enum": ["parent", "student"],
                "type": "string"
              }
            },
            "type": "object"
          },
