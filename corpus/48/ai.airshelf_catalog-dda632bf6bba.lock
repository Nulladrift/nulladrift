        {
          "name": "compare_products",
          "title": "Compare products",
          "description": "Compare 2-10 catalog products side-by-side on their datasheet specs. Slugs come from search_catalog and are case-insensitive and dash-tolerant (\"e-STUDIO 331AC\", \"toshiba-e-studio-331ac\" and \"e-studio331ac\" all resolve to the same product).\n\nReturns one item per product with canonical_name and spec_absence_note (spec fields absent from that product's golden record, AirShelf's verified product record). Branch on each item's commercial_data.actionable before using price or stock; stale observations are withheld from action fields. An item's commercial_disclosure is present when its maker is a seller AirShelf serves through its own agent endpoints. A slug that does not resolve comes back as not_found with a did_you_mean suggestion. The `provenance` option adds the source page and source type already stored with each fact.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "provenance": {
                "description": "Include the stored source page and source type for each fact",
                "type": "boolean"
              },
              "slugs": {
                "description": "Catalog slugs to compare",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
