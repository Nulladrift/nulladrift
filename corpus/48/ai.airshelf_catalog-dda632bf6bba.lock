                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "products_url": {
                      "description": "Merchant product-listing endpoint URL.",
                      "type": "string"
                    },
                    "search_url": {
                      "description": "Merchant-scoped product-search endpoint URL.",
                      "type": "string"
                    },
