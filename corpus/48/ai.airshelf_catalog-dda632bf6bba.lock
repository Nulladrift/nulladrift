        {
          "name": "find_products",
          "title": "Discover and verify products for a need",
          "description": "Discover candidate products for a buyer need. Takes a need in natural language (e.g. \"best value home espresso machine\", market \"TH\"), Unless the need is out of scope or live discovery is off or rate-limited, each call reads the verified catalog and also runs live web discovery, which sends the need text to web-search providers. A confirmed live result is returned when there is one; catalog candidates are returned instead when live discovery is unavailable, rate-limited, fails, or confirms no fit. Returns up to 3 candidates with explicit fit accounting.\n\nfind_products is the quick candidate-list tool; research_shopping is the full verified-research job. For a specific brand+model, search_catalog is cheaper and returns the same live-lookup block on a miss.\n\nResponse fields:\n• candidates[].verification — \"catalog-verified\" for a catalog row whose stated requirements each have a receipt, \"catalog-candidate\" for a catalog starting point whose fit still needs checking, or \"live-unverified\" for a live page read during this run.\n• candidates[].status — \"resolved\" means both identity and the parsed buyer constraints were supported by the cited page; \"abstain\" means identity or need fit could not be established. Inspect constraint_check for matched, conflicting, and unverified requirements.\n• candidates[].constraint_check.receipts maps each receipt-backed matched requirement to its supporting source URL and trust label.\n• Live candidates come from current web-search results, so they are a sample of what the market offers rather than a ranking.\n• status at the top level — \"no_match\" means no candidate was confirmed as satisfying the need; \"disabled\" means live discovery is off and no candidates are returned; \"rate_limited\" or \"unavailable\" means no discovery ran and no catalog candidate was found.\n\n• live_discovery.status=\"unavailable\" means receipted catalog candidates were returned while live discovery was unavailable.\n\nOptional `market` (ISO 3166-1 alpha-2) biases discovery and marketplace checks toward seller pages serving that country and scopes the lookup cache. \"Available in <market>\" means the seller page serves that market, not that stock is guaranteed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "market": {
                "description": "Buyer market as ISO 3166-1 alpha-2 country code (e.g. \"TH\"). Biases discovery and marketplace checks toward seller pages serving that country and scopes the cache; availability is not a stock guarantee.",
                "type": "string"
              },
              "max": {
                "default": 3,
                "description": "Max candidates to verify (each costs a live lookup; capped at 3).",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "need": {
                "description": "The buyer need in natural language, e.g. \"quiet mechanical keyboard for open office\" or \"best value home espresso machine\".",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "candidates": {
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "cached": {
                      "type": "boolean"
                    },
                    "guidance": {
                      "type": "string"
                    },
                    "identity": {
                      "additionalProperties": false,
                      "properties": {
                        "brand": {
                          "type": "string"
                        },
                        "model": {
                          "type": "string"
                        }
                      },
                      "required": ["brand", "model"],
                      "type": "object"
                    },
                    "mpn_confirmed": {
                      "type": "boolean"
                    },
                    "product": {
                      "additionalProperties": {},
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "query": {
                      "type": "string"
                    },
                    "reason": {
                      "type": "string"
                    },
                    "source_tier": {
                      "type": "string"
                    },
                    "source_url": {
                      "type": "string"
                    },
                    "status": {
                      "enum": ["resolved", "abstain", "declined"],
                      "type": "string"
                    },
                    "tier": {
                      "type": "number"
                    },
                    "verification": {
                      "type": "string"
                    }
                  },
                  "required": ["query", "status", "tier"],
                  "type": "object"
                },
                "type": "array"
              },
              "error": {
                "type": "string"
              },
              "guidance": {
                "type": "string"
              },
              "live_discovery": {
                "additionalProperties": false,
                "properties": {
                  "guidance": {
                    "type": "string"
                  },
                  "reason": {
                    "type": "string"
                  },
                  "status": {
                    "const": "unavailable",
                    "type": "string"
                  }
                },
                "required": ["status"],
                "type": "object"
              },
              "market": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "need": {
                "type": "string"
              },
              "reason": {
                "type": "string"
              },
              "serp_considered": {
                "type": "number"
              },
              "status": {
                "enum": ["ok", "no_match", "disabled", "rate_limited", "unavailable", "error", "refused"],
                "type": "string"
              },
              "took_ms": {
                "type": "number"
              },
              "verification": {
                "type": "string"
              }
            },
            "required": ["candidates"],
            "type": "object"
          },
