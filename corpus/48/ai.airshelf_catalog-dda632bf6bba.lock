        {
          "name": "request_quote",
          "title": "Request a quote from a merchant",
          "description": "Send a quote request for catalog products to a merchant's sales team on behalf of a named buyer.\n\nThis is a two-step, double opt-in flow. The first call emails a confirmation link to `contact.email` and returns status \"confirmation_required\"; no lead exists and no merchant is contacted until the buyer confirms. A later call with the same arguments reports \"awaiting_confirmation\" while the email is unconfirmed, or \"received\" with a reference_number after confirmation.\n\nMerchant slugs come from list_merchants. Network-catalog brands that are absent from that list use merchant:\"airshelf-network\" with brandSlug:\"<manufacturer-slug>\"; AirShelf routes the confirmed request to that brand.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "brandSlug": {
                "description": "Manufacturer slug (from search results) — required with merchant:\"airshelf-network\" so the lead reaches the right brand",
                "minLength": 1,
                "type": "string"
              },
              "contact": {
                "description": "Buyer contact details",
                "properties": {
                  "company": {
                    "description": "Buyer company",
                    "type": "string"
                  },
                  "email": {
                    "description": "Buyer work email",
                    "format": "email",
                    "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                    "type": "string"
                  },
                  "name": {
                    "description": "Buyer name",
                    "type": "string"
                  }
                },
                "required": ["email", "name"],
                "type": "object"
              },
              "merchant": {
                "description": "Merchant slug or id (from list_merchants), or \"airshelf-network\" for network-catalog brands",
                "minLength": 1,
                "type": "string"
              },
              "notes": {
                "description": "Any extra context from the buyer",
                "type": "string"
              },
              "products": {
                "default": [],
                "description": "Catalog slugs the buyer is interested in; may be omitted when attaching contact to a rep desk reference",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "quantity": {
                "description": "Units the buyer wants",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "reference": {
                "description": "Rep desk trace returned by ask, so confirmed contact reaches the same request",
                "pattern": "^REQ-[A-Z0-9-]{1,4}-[A-Z0-9]{6}$",
                "type": "string"
              }
            },
            "required": ["contact", "merchant"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "next_step": {
                "type": "string"
              },
              "reference_number": {
                "type": "string"
              },
              "status": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:11e05955a717155a928edc55062f3f646e9c29441c91495923013e3a623f9f8c"
        },
        {
          "name": "research_shopping",
          "title": "Research a considered purchase",
          "description": "research_shopping is the full verified-research job; find_products is the quick candidate-list tool. It runs as a background job and returns status \"running\" with a research ID while the minutes-long research continues; the same research ID returns the run on later polls until completion. Unsafe medical, legal, financial-advice, and professional-service asks return status \"refused\" before any work is queued. Completed runs return a researched recommendation with per-claim source receipts, or an explicit refusal when evidence is insufficient. Missing decision details return clarification questions before research starts. `market` biases discovery and marketplace checks toward seller pages serving that country; \"available in <market>\" means the seller page serves that market, not that stock is guaranteed. Example answer keys include {\"budget\":\"500 USD\",\"market\":\"US\",\"category\":\"espresso machine\"}.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "answers": {
                "additionalProperties": {},
                "description": "Answers to clarification questions. Set accept_defaults:true to accept budget and market defaults; it does not waive product type, use case, or must-have requirements.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "market": {
                "description": "Buyer market as an ISO 3166-1 alpha-2 country code. Biases discovery and marketplace checks toward seller pages serving that country; availability is not a stock guarantee.",
                "type": "string"
              },
              "need": {
                "description": "Buyer need in natural language. Required when starting a new research run.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "persona": {
                "description": "Research persona; b2b produces a quotation/RFQ pack.",
                "enum": ["consumer", "b2b"],
                "type": "string"
              },
              "research_id": {
                "description": "Existing research run identifier to read instead of starting a new run.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "accepted_defaults": {
                "additionalProperties": {
                  "type": "string"
                },
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "dossier": {},
              "elapsed_seconds": {
                "type": "number"
              },
              "eta_seconds": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "outcome": {
                "anyOf": [
                  {
                    "enum": ["recommend", "conditional", "insufficient_evidence", "no_candidate_passes", "defer"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "questions": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "key": {
                      "enum": ["budget", "market", "category"],
                      "type": "string"
                    },
                    "question": {
                      "type": "string"
                    }
                  },
                  "required": ["key", "question"],
                  "type": "object"
                },
                "type": "array"
              },
              "reason": {
                "type": "string"
              },
              "research_id": {
                "type": "string"
              },
              "stage": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "stage_counters": {
                "additionalProperties": {},
                "description": "Progress counters for a running research job. Individual counters may be absent.",
                "properties": {
                  "candidates_found": {
                    "description": "Candidates found during discovery.",
                    "type": "number"
                  },
                  "listings_checked": {
                    "description": "Market listing URLs recorded during commercial checks.",
                    "type": "number"
                  },
                  "stage": {
                    "description": "Current pipeline stage identifier, or queued before work starts.",
                    "type": "string"
                  },
                  "verified": {
                    "description": "Candidates examined during verification, not a count of candidates that passed.",
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "status": {
                "enum": ["needs_input", "running", "complete", "failed", "refused"],
                "type": "string"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
