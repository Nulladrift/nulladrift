        {
          "name": "list_merchants",
          "title": "List merchants",
          "description": "List public AirShelf merchants that have an assigned slug and at least one active product. Every listed merchant has an account with AirShelf; catalog makers without one are not listed. Internal/demo and empty catalogs are excluded. Returns each merchant's name, slug, and product count; the slug is the `merchant` argument for request_quote.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "merchants": {
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "checkout_capability": {
                      "description": "shopify indicates a connected Shopify store; redirect sends the buyer to the product page.",
                      "enum": ["shopify", "redirect"],
                      "type": "string"
                    },
                    "domain": {
                      "type": "string"
                    },
                    "manifest_url": {
                      "description": "Merchant agent manifest URL with supported endpoints and capabilities.",
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
