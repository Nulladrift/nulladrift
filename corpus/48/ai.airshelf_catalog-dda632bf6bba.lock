        },
        {
          "name": "search_catalog",
          "title": "Search product catalog",
          "description": "Search the AirShelf cross-vendor product catalog by natural-language query. The catalog covers industrial-automation, wiring-devices, digital-signage, business-display, memory-storage, mfp, barcode-printer, laser-printer, inkjet-printer, mechanical-keyboards, cybersecurity, threat-intelligence-platform. Industrial-automation and wiring-device rows are indexed by manufacturer part number, so a brand or part number in the query (\"Pepperl+Fuchs retroreflective sensor\", \"IN5409\") retrieves more reliably than a bare product type; those rows carry no normalized spec facets, so the `specs` filter does not apply to them. Returns ranked products with prices, specs, and per-row match accounting.\nEach row includes `unverified_specs`, the normalized spec names that lack claim-level receipts; never use those as decisive facts.\nExample queries: \"tactile mechanical keyboard under $150\", \"Toshiba A3 colour multifunction device\", \"600 dpi barcode printer for a warehouse\", \"threat-intelligence platform with dark-web monitoring\".\n\nResult fields:\n• canonical_name — the exact catalog name of the product.\n• spec_absence_note — spec fields absent from this product's golden record (AirShelf's verified product record); null when nothing is missing.\n• constraint_match_score and matched_criteria — query constraints supported by claim-level receipts. unverified_criteria names matching catalog values that still need confirmation; missing_criteria names values that are absent or conflict.\n• parsed.price_availability — all_null = true means every returned price is null. For quote-gated B2B pricing, a null price with a quote path is expected rather than an error; query_had_budget reports whether the query carried one.\n• result.commercial_data — branch on actionable before using price or stock. Observations older than 24 hours are withheld from result.price/result.inStock and retained only as labelled last_observed history.\n• result.commercial_disclosure — present when the product's maker is a seller AirShelf serves through its own agent endpoints (relationship \"onboarded_merchant\", with its merchant_slug). Ranking does not read it.\n• parsed.weak_match — the response contains an unresolved constraint, query match, or product-identity warning. parsed.unverified_identity_count counts returned names without an identity receipt. parsed.no_match — no product satisfies a hard constraint, and candidates violating it were excluded server-side.\n\nOn a miss or near-miss for a specific brand+model the response may also carry a `tier3` block, meaning a real-time lookup for the exact SKU asked about; it can appear alongside fuzzy-neighbour rows.\n• tier3.status = \"resolved\" — a single-source reading of the page at tier3.source_url. MPN-confirmed means the live lookup matched the manufacturer part number. Its verification is \"live-unverified\": confirmed on a live page during this run, but not yet matched to an AirShelf catalog record. A verified row is matched to the catalog record. tier3.cached = true means it came from a recent prior lookup, with fetched_at recording when the page was read.\n• tier3.status = \"abstain\" — the lookup could not confirm the product exists as asked, so no specs, price, or availability were established. tier3.guidance describes the quote-request path.\n• tier3.status = \"declined\" — an applicable lookup did not run; tier3.reason says why (disabled, rate_limited, daily_cap, negative_cache, error). No specs or availability were established, and none should be inferred.\nNo tier3 block at all means a live lookup was not applicable to this query (no parseable brand+model identity).\n\nOptional `market` (ISO 3166-1 alpha-2, e.g. \"TH\") excludes catalog rows whose country-specific URL conflicts with the buyer market and scopes tier3 lookup/cache. A remaining global URL is not local-availability proof: parsed.weak_match stays true and unsatisfied_constraints includes market_availability until every returned row has a matching country receipt. \"Available in <market>\" still does not guarantee stock.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Optional category filter (industrial-automation, wiring-devices, digital-signage, business-display, memory-storage, mfp, barcode-printer, laser-printer, inkjet-printer, mechanical-keyboards, cybersecurity, threat-intelligence-platform)",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Max results",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "Buyer market as an assigned ISO 3166-1 alpha-2 country code (e.g. \"TH\", \"AU\"). Conflicting country receipts are excluded; global URLs remain market-unverified.",
                "type": "string"
              },
              "merchant": {
                "description": "Optional merchant slug (e.g. \"toshiba\", \"cyble\") from list_merchants. Scopes the search to that merchant's own shelf, which is a SEPARATE substrate from the cross-vendor catalog: it is reached only when the cross-vendor catalog returns nothing, and its rows carry the merchant's own product data rather than datasheet-extracted golden records. Omit it for cross-vendor search, which is the default and the right choice for \"what should I buy\".",
                "pattern": "^[a-z0-9][a-z0-9-]{0,62}$",
                "type": "string"
              },
              "q": {
                "description": "Natural-language query, at most 200 characters. Supports budget hints (e.g. \"under $150\").",
                "maxLength": 200,
                "minLength": 0,
                "type": "string"
              },
              "specs": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "type": "number"
                    },
                    {
                      "type": "string"
                    },
                    {
                      "type": "boolean"
                    }
                  ]
                },
                "description": "Hard spec facets, e.g. {\"form_factor\":\"desktop\",\"print_speed_ppm\":33}. Filters by exact/range spec match.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "count": {
                "type": "number"
              },
              "parsed": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "query": {
                "type": "string"
              },
              "reason": {
                "type": "string"
              },
              "results": {
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "canonical_name": {
                      "type": "string"
                    },
                    "category": {
                      "type": "string"
                    },
                    "constraint_match_score": {
                      "type": "number"
                    },
                    "currency": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "manufacturer": {
                      "type": "string"
                    },
                    "modelName": {
                      "type": "string"
                    },
                    "price": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "qualityScore": {
                      "type": "number"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "spec_absence_note": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  },
                  "required": ["slug"],
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "enum": ["refused"],
                "type": "string"
              },
              "tier3": {
                "additionalProperties": {},
                "properties": {
                  "cached": {
                    "type": "boolean"
                  },
                  "guidance": {
                    "type": "string"
                  },
                  "identity": {
                    "additionalProperties": false,
                    "properties": {
                      "brand": {
                        "type": "string"
                      },
                      "model": {
                        "type": "string"
                      }
                    },
                    "required": ["brand", "model"],
                    "type": "object"
                  },
                  "mpn_confirmed": {
                    "type": "boolean"
                  },
                  "product": {
                    "additionalProperties": {},
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "reason": {
                    "type": "string"
                  },
                  "source_tier": {
                    "type": "string"
                  },
                  "source_url": {
                    "type": "string"
                  },
                  "status": {
                    "enum": ["resolved", "abstain", "declined"],
                    "type": "string"
                  },
                  "tier": {
                    "type": "number"
                  },
                  "verification": {
                    "type": "string"
                  }
                },
                "required": ["status", "tier"],
                "type": "object"
              },
              "took_ms": {
                "type": "number"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
