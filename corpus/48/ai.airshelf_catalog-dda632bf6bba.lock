        {
          "name": "get_product",
          "title": "Get product details",
          "description": "Get the full golden record (AirShelf's verified product record) and latest price for one catalog product by slug (\"<manufacturer>-<model>\").\n\nReturns the product's specs and provenance (which page each fact came from), plus canonical_name (its exact catalog name). A field's evidence_sha256 is the SHA-256 of the source document AirShelf archived when it extracted that claim. A caller holding the same bytes can compare the hash to check that the cited document has not changed. AirShelf does not serve those archived bytes, and the hash does not promise they remain retrievable. Branch on commercial_data.actionable before using price or stock: observations older than 24 hours are withheld from latestPrice and retained only as labelled last_observed history. For quote-gated B2B pricing, a null price with a quote path is expected rather than an error. product.commercial_disclosure is present when the product's maker is a seller AirShelf serves through its own agent endpoints (relationship \"onboarded_merchant\"). In clients that render MCP Apps the response also draws one product card per call. related_products — relationships extracted from vendor documents (e.g. compatible toner or drum accessories with their source quotes, functional equivalents, supersessions); each entry names the related catalog slug, the relation type, its direction (direction is \"from_this\" when the relation reads this-product → related-product, \"to_this\" when it reads related-product → this-product), and the source URL and quote the relation was extracted from.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "Composite slug, e.g. toshiba-b-ex4t1-ts12-qm-r",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "action": {
                "enum": ["quote", "link"],
                "type": "string"
              },
              "benefits": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "buttonLabel": {
                "type": "string"
              },
              "buyUrl": {
                "type": "string"
              },
              "imageUrl": {
                "type": "string"
              },
              "pricing_gated": {
                "type": "boolean"
              },
              "product": {
                "additionalProperties": {},
                "properties": {
                  "cited_field_count": {
                    "description": "Number of golden-record fields with claim-level citations.",
                    "type": "number"
                  },
                  "field_count": {
                    "description": "Total golden-record fields used as the evidence coverage denominator.",
                    "type": "number"
                  },
                  "latestPrice": {
                    "anyOf": [
                      {
                        "additionalProperties": {},
                        "properties": {
                          "capturedAt": {
                            "type": "string"
                          },
                          "currency": {
                            "anyOf": [
                              {
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ]
                          },
                          "inStock": {
                            "anyOf": [
                              {
                                "type": "boolean"
                              },
                              {
                                "type": "null"
                              }
                            ]
                          },
                          "price": {
                            "type": "number"
                          },
                          "retailer": {
                            "anyOf": [
                              {
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ]
                          }
                        },
                        "required": ["capturedAt", "currency", "inStock", "price", "retailer"],
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Latest valid price observation within 24 hours. Null when absent or stale; stale history remains in commercial_data.last_observed."
                  },
                  "lifecycle_status": {
                    "description": "Retirement marker from stored product evidence. current means no retirement marker was found.",
                    "enum": ["current", "retired"],
