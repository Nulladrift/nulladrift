        {
          "name": "fetch_data",
          "title": "Fetch data",
          "description": "Fetches one data response: GET data.forum.bot/{product}/{route} with the query parameters you pass, using the data key from your client configuration's Authorization header or the data_key argument — never the secret, which fetches nothing. A successful call is billed the product's price per call; a refused call costs nothing. The result carries the payload with the platform's meta block (licence and attribution) and the rate-limit headers; the balance is read with account_status, never from a data response. Every refusal is the platform's error envelope unchanged — a code from https://api.forum.bot/errors.json; 402 payment_required means the key is known but cannot pay for this product now, and 401 invalid_key means it is authorized for no product at all, most often because every credit is spent. Both carry an action_url: a human tops up there (get_topup_link returns the page) and the same key serves again within the engine's build interval plus the region's poll interval.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "data_key": {
                "description": "only when the client cannot send an Authorization header — the data_key.key sign_up returned in this session; when both are present the argument wins",
                "minLength": 1,
                "type": "string"
              },
              "params": {
                "additionalProperties": {
                  "type": ["string", "number", "integer", "boolean"]
                },
                "description": "query parameters, sent as given; the parameters a route requires are in get_product",
                "type": "object"
              },
              "product": {
                "description": "a product slug from list_products",
                "pattern": "^[a-z0-9][a-z0-9_-]{0,63}$",
                "type": "string"
              },
              "route": {
                "description": "a route from get_product, without the product prefix — e.g. current or timeline/1h",
                "maxLength": 128,
                "pattern": "^[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*$",
                "type": "string"
              }
            },
            "required": ["product", "route"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
