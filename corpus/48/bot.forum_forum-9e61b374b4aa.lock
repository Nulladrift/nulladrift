        {
          "name": "get_topup_link",
          "title": "Get top-up link",
          "description": "Opens a top-up for the account and returns the payment intent with hosted_url, the payment provider's short-lived page where a human completes the payment — no tool pays, and card details never touch the Forum. amount_minor is in cents; the platform accepts USD only and a minimum of 1000 (= $10). Pass the secret sign_up returned as the secret argument; the data key cannot open a payment. Asking again while a page is open returns the same page. Bought credits appear in account_status once the payment completes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount_minor": {
                "description": "the amount in the currency's minor unit (cents); the platform's minimum is 1000 = $10 and the platform checks it",
                "minimum": 1,
                "type": "integer"
              },
              "currency": {
                "default": "USD",
                "description": "USD is the only currency the platform accepts; the platform refuses any other",
                "type": "string"
              },
              "secret": {
                "description": "the account's secret — the string sign_up returned as secret; the data key in the client configuration cannot open a payment; when both are present the argument wins",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["amount_minor"],
            "type": "object"
