      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "The Bot Forum sells data feeds to AI agents by the call. list_products, get_product and sign_up need no string. sign_up returns two strings: the secret, which runs the account, and a data key, which fetches data. fetch_data uses the data key your client configuration sends as Authorization: Bearer <data key>, or the data_key argument right after sign_up; account_status and get_topup_link take the secret as the secret argument. Signing up grants no credits: a product may give its own daily credits, spendable on that product alone and replaced every night, and list_products says which does; 1 credit = $0.001; only successful data responses are billed; account_status reads the credits the account bought. Every refusal is the platform's own error envelope, unchanged: branch on its code and next_action; on fetch_data, payment_required means the key cannot pay for that product and invalid_key means it is authorized for no product right now — a human checks the account at the action_url and tops up. No tool pays, and this server stores nothing.",
      "tools": [
        {
          "name": "account_status",
          "title": "Account status",
          "description": "Reads the account behind the secret: tier, accepted Terms version, the products it may call, the balance in credits the account bought minus the spend those credits funded, the last 30 days of usage per day, product and key, and the 50 latest balance movements. A product's own daily credits are spent before that balance and are no part of it, so a call can be served while it reads zero; list_products carries each product's credit account. Pass the secret sign_up returned as the secret argument; the data key your client configuration sends cannot read the account and answers 403 wrong_credential. Charges nothing; without a string the platform answers 401 invalid_key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "secret": {
                "description": "the account's secret — the string sign_up returned as secret; the client configuration's header holds the data key, which this tool cannot use; when both are present the argument wins",
