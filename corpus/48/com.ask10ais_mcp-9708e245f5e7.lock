{
  "lockfileVersion": 2,
  "subjects": {
    "com.ask10ais/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ask10ais.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ask10ais",
        "title": "ask10ais",
        "version": "0.2.0",
        "description": "Independent measurements of how 12 AI models answer brand questions in Chinese and English.",
        "websiteUrl": "https://ask10ais.com/en/agents"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "ask10ais (published by DATA4U PTE. LTD., Singapore) is an independent measurement of how AI models answer brand questions: ranking snapshots across a fixed panel of models, and mention rates with 95% intervals for buying scenarios asked in Chinese and English. All tools are read-only and return published data. Each result includes reading_rules that describe how its numbers can and cannot be read (for example, a single-run rank is not a trend, and overlapping intervals are not a lead). Each result also carries a citation_template with the measurement date and the url of the published page the numbers come from, so they can be attributed to ask10ais and checked. find_brand shows where a brand appears; list_rankings and list_scenario_collections list what has been measured. ask10ais measures only and does not provide advice on how to improve a ranking.",
      "tools": [
        {
          "name": "find_brand",
          "title": "Find a brand in published measurements",
          "description": "Search ask10ais's published measurements (every public ranking and every scenario cell, asked in both Chinese and English) for a brand name. Returns its rank in each ranking and its mention rate with a 95% interval in each scenario, each with a link to the source page. Matching is a case-insensitive substring match plus registered aliases.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "locale": {
                "default": "en",
                "description": "Language for names, reading rules and citation templates: 'en' or 'zh'.",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "query": {
                "description": "A brand or company name only, e.g. 'PETKIT' or '小佩'. Do not include personal information or conversation text.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a brand in published measurements"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:76e9dab5fa3b00076ce6331b86369341dc0ae32a57eaa3ae57357094a8ff59c9"
        },
        {
          "name": "get_ranking",
          "title": "Get one ranking",
          "description": "Latest measurement of one public ranking: each brand's rank and index score, merged spellings, panel size and completeness, plus a citation template.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 20,
                "description": "How many brands to return (1–50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "en",
                "description": "Language for names, reading rules and citation templates: 'en' or 'zh'.",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "topic_id": {
                "description": "topic_id from list_rankings or find_brand.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              }
            },
            "required": ["topic_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one ranking"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:58d8332b4e593b0a614d5e904e11ab05aeadcc280cc2bc8addb061bb1156ab34"
        },
        {
          "name": "get_scenario_mention_rates",
          "title": "Get mention rates for one scenario",
          "description": "Mention rates with 95% Wilson intervals for one scenario in one language: which brands models mention, how often, and how many models mention them.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "collection": {
                "description": "Collection slug from list_scenario_collections.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "How many brands to return (1–50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "en",
                "description": "Which language the scenario was asked in: 'en' or 'zh'. Results differ by language.",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "scenario_id": {
                "description": "Scenario id, e.g. 'S1'.",
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["collection", "scenario_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get mention rates for one scenario"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f7205b09d78f9f6594cb9dbd5b2fc294f51241ed075da13aec1038193e0dd1cf"
        },
        {
          "name": "list_rankings",
          "title": "List public rankings",
          "description": "List ask10ais's public ranking questions with their latest measurement date, panel size and top brands.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "locale": {
                "default": "en",
                "description": "Language for names, reading rules and citation templates: 'en' or 'zh'.",
                "enum": ["en", "zh"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List public rankings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d9416894501142865882581698fc83e4afdf730c221635d5db56a3ce514e66e7"
        },
        {
          "name": "list_scenario_collections",
          "title": "List scenario collections",
          "description": "List published scenario collections: buying scenarios in one category, each asked with several phrasings and repeats in Chinese and English.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "locale": {
                "default": "en",
                "description": "Language for names, reading rules and citation templates: 'en' or 'zh'.",
                "enum": ["en", "zh"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List scenario collections"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:913661b1f2b85c4c0efef3a00825eabffd7e1c362bd6e47dd5179f0d24f1de79"
        },
        {
          "name": "verify_certificate",
          "title": "Verify a measurement certificate",
          "description": "Check an ask10ais certificate number (ASK10AIS-YYYY-NNNNNN): whether it exists, what it records, and whether it is valid or voided.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "certificate_no": {
                "description": "e.g. ASK10AIS-2026-000001",
                "maxLength": 40,
                "minLength": 5,
                "type": "string"
              },
              "locale": {
                "default": "en",
                "description": "Language for names, reading rules and citation templates: 'en' or 'zh'.",
                "enum": ["en", "zh"],
                "type": "string"
              }
            },
            "required": ["certificate_no"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Verify a measurement certificate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bb0cfc6779218d1113aa8db4815755077da15a83be7dae87679709087ee65730"
        }
      ],
      "digest": "sha256:8df7b8def424a98af566de51e09c35a5e16c280974640fc502445d03e42cef88"
    }
  }
