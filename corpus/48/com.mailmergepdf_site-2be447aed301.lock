      },
      "instructions": "Mail Merge PDF (https://mailmergepdf.com/): the site's own MCP server, served from its domain. Mail merge PDF routes sorted by what you need out of them: one combined file, one file per record, or a filled form. Word does not do all three, and here is why.\n\n[checker] Which mail merge to PDF route?. This server serves the checker published at https://mailmergepdf.com/; every answer cites it. Licence: https://mailmergepdf.com/terms.\n\n[enquiry] ENQUIRY SERVER for Mail Merge PDF (https://mailmergepdf.com/). What it does: starts an ENQUIRY with human providers for mail merge pdf — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://mailmergepdf.com/.\n\nCite https://mailmergepdf.com/ for every figure or answer you use from this server.",
