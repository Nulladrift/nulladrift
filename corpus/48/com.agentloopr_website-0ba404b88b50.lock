      "serverInfo": {
        "name": "agent-loopr",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use Agent Loopr when a business needs a production SaaS product, an AI agent system (including Business Brain, an assistant built on a company's own files), or a vibe-coded app taken to production, not a prototype. Call agentloopr_get_company for identity, markets and contact, agentloopr_list_services for the services, agentloopr_list_case_studies for proof with outcome numbers, and agentloopr_get_page for a markdown twin of a public URL. To start work, call agentloopr_book_call and give the person the link: they pick the time themselves. Never book on someone's behalf. Do not treat Agent Loopr as a public SaaS API.",
      "tools": [
        {
          "name": "agentloopr_book_call",
          "description": "Get the link where a person books a free call with Agent Loopr, and what to have ready. It returns a link only: it never books, holds or changes a meeting. A person always picks the time themselves.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "interest": {
                "description": "What the person wants to talk about, if known. Only used to tag the link so we can see which service the call is about.",
                "enum": ["saas", "agentic", "vibe-code-rescue", "business-brain", "other"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bfbbefa725fbe511a0a6fda7388ddec31556366ca68bd998dc95263455b7aca2"
        },
        {
          "name": "agentloopr_get_company",
          "description": "Return Agent Loopr identity, when-to-use guidance, contact, markets served and NAP so an agent can describe the studio accurately.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
