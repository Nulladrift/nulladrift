{
  "lockfileVersion": 2,
  "subjects": {
    "com.familyfishin.mcp/site-discovery": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.familyfishin.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "family-fishin-articles",
        "version": "0.10.5"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "answer_public_question",
          "title": "Automatically Route a Public Fishing or Tackle Question",
          "description": "Deterministically retrieve source-grounded educational evidence, live read-only catalog data, or both when a question requires multiple sources. No generative AI or purchases.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "question": {
                "maxLength": 12000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3c952dae199cad136c535ef6f2aaf31ea6359a6712304a63dbf4a5266610b46b"
        },
        {
          "name": "discover_site",
          "title": "Discover the Family Fishin Website",
          "description": "Search or browse the entire public Family Fishin website across published articles, WordPress pages, and visible WooCommerce products. With no query, returns recently modified public content. This tool is strictly read-only and cannot edit content, access admin data, use carts, or place orders.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "include": {
                "default": ["articles", "pages", "products"],
                "description": "Public website sections to include.",
                "items": {
                  "enum": ["articles", "pages", "products"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "limit_per_type": {
                "default": 5,
                "description": "Maximum results to return from each included section.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Optional search words. Omit to browse recently modified public content.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1e51b84fed7f485f9a6580cfb03aa39d44ed22e60aa7629a743afcc1788983bb"
        },
        {
          "name": "get_article",
          "title": "Get Family Fishin Article",
          "description": "Fetch one public Family Fishin WordPress article by numeric ID or slug. Returns cleaned plain text and canonical metadata.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id_or_slug": {
                "description": "A WordPress post ID, such as '123', or a post slug.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id_or_slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:95bb6981be9632e225188d3eec83a9251f7258ff43c4f21c5e008cbdac77c336"
        },
        {
          "name": "get_fishing_guidance",
          "title": "Get Evidence for Freshwater Fishing Guidance",
          "description": "Return source-grounded passages and evidence gaps for a fishing question. Does not generate unsupported fishing advice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "question": {
                "maxLength": 12000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8ed5b938e7e56103e898afa1e18b9f32d88343b8ea034504262011b2264462f9"
        },
        {
          "name": "get_product",
          "title": "Get Family Fishin Product",
          "description": "Fetch one public Family Fishin product by numeric ID or slug, including description, prices, availability, images, selectable attributes, variable-product combinations, and public fields from product-option plugins. This tool is read-only and directs purchases to the product page.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id_or_slug": {
                "description": "A WooCommerce product ID or product slug, such as 'ribbed-trout-worm'.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id_or_slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ff4e7478ca616280e7a33e9245c2803d6a6657685130b3318aed321a7b479c0b"
        },
        {
          "name": "get_site_page",
          "title": "Get a Family Fishin Website Page",
          "description": "Fetch one published public WordPress page discovered by discover_site. Returns cleaned plain text and canonical metadata. This tool is strictly read-only and cannot access drafts, admin pages, or edit content.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id_or_slug": {
                "description": "A public WordPress page ID or slug.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id_or_slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:60b36a64ab6be02f0801e4f9491fa3205cfbbd3cf483458694be3260ca1aee41"
        },
        {
          "name": "search_articles",
          "title": "Search Family Fishin Articles",
          "description": "Find published Family Fishin fishing articles by topic or natural-language question. Returns ranked article summaries, IDs, and canonical URLs; call get_article to read a full article before citing it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 5,
                "description": "Maximum number of articles to return.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search words, for example 'trout current'.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d8beca2c796608d7186c1727e886dd25d55c9d535a8925cc19eb5f4ea4a56684"
        },
        {
          "name": "search_fishing_knowledge",
          "title": "Search Freshwater Fishing Knowledge",
          "description": "Find source passages relevant to natural-language freshwater fishing questions. Returns evidence and canonical citations, not generated advice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "question": {
                "description": "Freshwater fishing question.",
                "maxLength": 12000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:57050587e11bb6a49daf83f85c86cd1b9894657dbfceccbad6bbe662123fb689"
        },
        {
          "name": "search_products",
          "title": "Search Family Fishin Products",
          "description": "Find public Family Fishin tackle by product name, lure type, color, size, or fishing use. Returns product details and product-page links; call get_product for full options and current availability. Read-only; cannot place orders.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 5,
                "description": "Maximum number of products to return.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Product search words, for example 'ribbed trout worm'.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6d34edd0c7d4d8e5fe78e852646153122f1c14ae760afd6c89ddbc346a557b80"
        }
      ],
      "digest": "sha256:01b73e923d40a881c17296c4b7aedf1b7362820dbabe17220acaafaf65a011ed"
    }
  }
}
