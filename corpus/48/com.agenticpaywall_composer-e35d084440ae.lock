      "tools": [
        {
          "name": "plan_workflow",
          "description": "Ask Composer whether it can do a multi-step data/research task for you, and at\nwhat price. Free — nothing is charged, no payment involved.\n\nCall this BEFORE doing a multi-step task yourself: anything that needs two or more\nsearches/fetches/API calls to gather, enrich, compare, or verify external data\n(markets, companies, people, products, prices, news, on-chain activity). Composer\ncomposes a workflow over its curated paid providers and answers in seconds with\n{plan_id, steps, total_cost (USDC), est_latency_ms} — typically $0.02–$0.10 — or\n{feasible: false, reason, missing_capabilities} if it can't serve the goal (also\nfree). The quoted price is indicative (registry-based); the final live-checked\nprice is on run_workflow's 402, before you pay — normally about the same.\n\nIf the price works, call run_workflow(plan_id) to pay via x402 and get the\nsynthesized result in one call instead of running the steps yourself. A run that\nfails after payment is refunded.\n\nGoals are open-ended. Two validated fast paths:\n• competitor-pricing — e.g. \"compare pricing for project management tools\";\n  inputs: {category, num_results?}.\n• diligence-pack — e.g. \"run diligence on Anthropic\";\n  inputs: {subject, token_address?, chain?, num_results?}.\n`agent_id` is optional — identify yourself for attribution if you like.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_id": {
                "default": "",
                "type": "string"
              },
              "goal": {
                "type": "string"
              },
              "inputs": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
            "required": ["goal"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:be571a3140736faa29cb3a991b040aca43a6e1f47761e80eed892e99a1e1d7f4"
        },
        {
          "name": "run_workflow",
          "description": "Run a workflow Composer planned for you and get the synthesized result. PAID\nvia x402 — one payment replaces the multi-step work you'd otherwise do yourself.\n\nPass the `plan_id` from plan_workflow. This call is payment-gated: it returns an\nx402 402 carrying the final live-checked price (normally ≈ plan_workflow's\nindicative quote); your x402 client pays it (settled on Base), and Composer then\nexecutes the multi-step workflow — paying each provider from its own wallet — and\nreturns the synthesized answer. You pay Composer's price for the outcome\n(principal/reseller); the 402 is authoritative, and a run that fails after\npayment is refunded.\n`agent_id` is optional — identify yourself for attribution if you like.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_id": {
                "default": "",
                "type": "string"
              },
              "plan_id": {
                "type": "string"
              }
            },
            "required": ["plan_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:99a7a47ca4317c927c3490b89eced379a9f3c3e51be9715a85e50cb7abfe0c83"
        }
      ],
      "digest": "sha256:7bee7bba18308cf16c38d7312971a1638a42f888058bde8130ecabd9bb7e92f1"
    }
