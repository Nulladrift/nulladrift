      },
      "serverInfo": {
        "name": "skillmd-lint",
        "version": "1.1.0"
      },
      "capabilities": {
        "experimental": {},
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "logging": {},
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": false
