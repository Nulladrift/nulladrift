      },
      "instructions": "Lint SKILL.md files for AI agents: lint_skill validates one file's frontmatter, structure, secrets, and size; packaging_check validates a zip layout plan for skill marketplaces. All tools are free.",
      "tools": [
        {
          "name": "cron_explain",
          "title": "Cron Explain",
          "description": "Explain a 5-field cron expression in plain English and flag mistakes. FREE.\n\nTypical input {\"expression\": \"0 9 * * 1-5\"} returns {\"expression\":\n\"0 9 * * 1-5\", \"meaning\": \"at minute 0; at hour 9; every day of month;\nevery month; day of week 1-5\", \"issues\": [\"none\"]}; out-of-range fields\nare listed in \"issues\".\n\nUse to read a schedule back in plain English before trusting it. Assumes\n5-field cron; not for 6-field or seconds-precision variants. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"expected 5 fields, got <value>\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "expression": {
                "description": "A standard 5-field cron string (minute hour day-of-month month day-of-week), e.g. \"0 9 * * 1-5\"; must be non-empty.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["expression"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cron Explain"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:69b80776aef600f6db09056ba47fdc4e59a70cbbc8e106f7015a9d8dc56ff35b"
        },
        {
          "name": "diff_texts",
          "title": "Diff Texts",
          "description": "Produce a unified diff between two texts. FREE.\n\nUseful for comparing two SKILL.md versions. Typical input {\"a\": \"<old\ntext>\", \"b\": \"<new text>\"} returns {\"changed_lines\": N, \"diff\":\n\"--- \\n+++ \\n@@ ... @@\\n-old line\\n+new line\"}; identical inputs\nreturn {\"changed_lines\": 0, \"diff\": \"(identical)\"}. The diff is capped\nat 400 lines.\n\nUse to show exactly what changed between two versions of a text. Not for\njudging the risk of a code change - the codereview server's review_diff\ndoes that. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"each text must be at most 500000 characters\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "a": {
                "description": "The original text (left side of the diff); at most 500000 characters.",
                "maxLength": 500000,
                "type": "string"
              },
              "b": {
                "description": "The revised text (right side of the diff); at most 500000 characters.",
                "maxLength": 500000,
                "type": "string"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Diff Texts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:e8e3fc861712f1b4d355e6c5c511de310a3c2dfb9b0387b89e8b81b3ac9b5385"
        },
        {
          "name": "json_validate",
          "title": "Json Validate",
          "description": "Validate JSON text and summarize its structure. FREE.\n\nTypical input {\"text\": \"{\\\"a\\\": [1, 2]}\"} returns {\"valid\": true,\n\"structure\": {\"a\": [\"array[2]\", \"int\"]}}; invalid JSON returns\n{\"valid\": false, \"error\": \"<parser message>\", \"line\": N, \"column\": N}\ninstead.\n\nUse when JSON may be malformed or its shape is unknown. Reports structure,\nnot conformance to a schema. Not for testing a pattern (regex_test). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"text is empty: pass the JSON document as a raw string\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "text": {
                "description": "The JSON document to validate, as a raw string; must be non-empty.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Json Validate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:e3a2f80a6da21e548e51917c4c98ec46bbb7a1ca60bfe0c33a345b4867f1b85b"
        },
        {
          "name": "lint_skill",
          "title": "Lint Skill",
          "description": "Lint one SKILL.md file the way marketplaces and agents parse it. FREE.\n\nChecks YAML frontmatter presence and required fields (name,\ndescription), description quality, body structure (procedure steps,\nrules, degradation), secret/credential leakage, injection-style\nphrasing, and size budget. Typical input {\"content\": \"<full SKILL.md\ntext>\"} returns {\"verdict\": \"pass\" | \"pass-with-warnings\" | \"fail\",\n\"errors\": [\"...\"], \"warnings\": [\"...\"], \"stats\": {\"body_words\": N,\n\"has_frontmatter\": bool}}.\n\nUse on the full text of one SKILL.md. Not for the surrounding archive\nlayout (packaging_check). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"content is empty: pass the full SKILL.md text including frontmatter\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "content": {
                "description": "The complete SKILL.md file text, frontmatter included; must be non-empty.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["content"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Lint Skill"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:509d59bf800e91140f2b31840006c8014ec20adbb4c76a63b5057d473839d2d6"
        },
        {
          "name": "packaging_check",
          "title": "Packaging Check",
          "description": "Validate a zip layout plan for a skill marketplace before packaging. FREE.\n\nChecks SKILL.md placement rules and flags junk files. Typical input\n{\"file_paths\": [\"my-skill/SKILL.md\", \"my-skill/examples.md\"],\n\"marketplace\": \"agensi\"} returns {\"verdict\": \"pass\" | \"fail\",\n\"issues\": [\"...\"], \"skill_files_found\": [\"my-skill/SKILL.md\"]}.\n\nUse on a planned file layout, before zipping. Not for the content of a\nskill file (lint_skill). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"file_paths is empty: list every file that will be inside the zip\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "file_paths": {
                "description": "Every file path that will be inside the zip, relative to the zip root, e.g. [\"my-skill/SKILL.md\"]; at least 1 entry.",
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "marketplace": {
                "default": "agensi",
                "description": "Rule set to apply: \"agensi\" (SKILL.md at root or one folder deep) or \"generic\" (junk-file checks only). Default \"agensi\".",
                "type": "string"
              }
            },
            "required": ["file_paths"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Packaging Check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:97d3c5d06d314c82ab2328834212f45b5bd8c0eb5dc1e863a409f11cf8352a82"
        },
        {
          "name": "regex_test",
          "title": "Regex Test",
          "description": "Test a regular expression against sample strings. FREE.\n\nTypical input {\"pattern\": \"v(\\\\d+)\", \"samples\": [\"v12\", \"beta\"]}\nreturns {\"pattern\": ..., \"results\": [{\"sample\": \"v12\", \"match\": true,\n\"matched_text\": \"v12\", \"groups\": [\"12\"]}, {\"sample\": \"beta\", \"match\":\nfalse, ...}], \"match_count\": 1}.\n\nUse to confirm a pattern matches what you expect before shipping it. Not\nfor validating JSON (json_validate). The pattern is compiled and run in a\nshort-lived, CPU-capped child process, so a pattern that backtracks\ncatastrophically is stopped instead of stalling the server. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"a sample is too long (max 10000 characters); shorten it and retry\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "pattern": {
                "description": "A Python-flavor regular expression as a string, e.g. \"v(\\\\d+)\".",
                "maxLength": 1000,
                "type": "string"
              },
              "samples": {
                "description": "Strings to test the pattern against; only the first 50 are evaluated.",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              }
            },
            "required": ["pattern", "samples"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Regex Test"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:a3376c2a6668562aaa18e74eae1206cb0d6e3ea70eeb7224a0c72cb6823815f3"
        }
      ],
      "digest": "sha256:6700ad9744fc2a30af96a52f28c5d1783cd940ae3350727051837231e6b663b0"
    }
  }
}
