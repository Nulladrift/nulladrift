        {
          "name": "check_grounding",
          "title": "Check a draft against its source",
          "description": "Flag specifics in a draft that never appear in its source: quotes, numbers, money, percentages,\ndates, credentials, and names.\n\nDeterministic and instant (no AI). Use it before presenting a summary or answer built from sources to\ncatch invented or misremembered details. Each flag includes the sentence it came from.",
