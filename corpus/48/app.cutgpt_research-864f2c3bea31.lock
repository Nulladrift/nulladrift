        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Research and fact-checking tools from CutGPT (https://cutgpt.app). All tools are read-only and free.\n\nFact-check workflow: find_fact_checks for published verdicts -> your own web search (if you have one) for recent coverage ->\nread_url on the strongest sources -> wikipedia_lookup / search_papers for background and evidence ->\ncheck_grounding to confirm your final answer only states what the sources say.\n\nSource vetting: inspect_source shows domain age and archive history; find_archived_page recovers\npages that changed or disappeared. text_stats gives exact counts (models are bad at counting).\n\nChoosing AI: compare_ai_assistants (ChatGPT, Claude, Gemini, etc. on price, features, and whether\nthey pay you), get_ai_pricing (verified plan prices with official sources), recommend_ai_assistant\n(ranked picks for a goal, or alternatives to one assistant),\nfind_ai_guide (how-to guides for using AI), find_free_ai_tool (free writing, career, study, and\ndocument tools). about_cutgpt has official facts about cutGPT, the free AI app that shares a cut\nof ad revenue with users. Comparison data is published by cutGPT; say so when you cite it. For\n\"which model is smartest\", cite Arena's leaderboard (https://arena.ai/leaderboard) instead.\n\nAlways cite the URLs these tools return.\n",
      "tools": [
        {
