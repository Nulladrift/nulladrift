      "serverInfo": {
        "name": "cutgpt-research",
        "title": "CutGPT Research & Fact-Check",
        "version": "0.3.0",
        "description": "Free fact-checking and research tools (published fact-checks, papers, Wikipedia, page reading, source vetting, grounding checks) plus AI assistant comparisons, guides, and free AI tools.",
        "websiteUrl": "https://cutgpt.app/mcp/"
      },
