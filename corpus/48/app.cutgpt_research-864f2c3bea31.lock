          "description": "Compare AI chatbots such as ChatGPT, Claude, Gemini, Perplexity, Copilot, Grok, DeepSeek, and Poe on\nprice, whether they pay you, models, web research, images, memory, platforms, privacy, and lock-in.\n\nEach assistant has checkable 'facts' with source links and a 'prices_as_of' date, kept apart from\ncutGPT's 'editorial' take (best for, not for, when it wins). cutGPT (a free AI assistant that shares\nad revenue with users) is included for reference. Data is published by cutGPT; say so when you cite\nit. For model quality, it points to Arena's independent leaderboard.",
