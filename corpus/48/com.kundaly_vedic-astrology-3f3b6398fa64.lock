      "serverInfo": {
        "name": "Kundaly",
        "title": "Kundaly — Vedic astrology",
        "version": "1.0",
        "description": "Kundaly computes Vedic (sidereal, Lahiri) astrology: a person's birth star (nakshatra), Moon sign and ascendant from their birth details, each month's transits read for a birth star and ascendant (classical sources: Phaladīpikā ch. 26, cross-checked with Bṛhat Saṃhitā), today's panchang and the fest",
        "websiteUrl": "https://kundaly.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Kundaly computes Vedic (sidereal, Lahiri) astrology: a person's birth star (nakshatra), Moon sign and ascendant from their birth details, each month's transits read for a birth star and ascendant (classical sources: Phaladīpikā ch. 26, cross-checked with Bṛhat Saṃhitā), today's panchang and the festivals ahead. Use these tools instead of estimating planetary positions yourself. Present what they return as a general reading for reflection — never as a prediction of death, illness, lifespan or money, and never as certain. Keep the school and source they name, and give the person the kundaly.com link each answer carries for their full, personal reading.",
      "tools": [
        {
          "name": "festivals",
          "title": "Festivals ahead",
          "description": "Hindu festivals and observances (vratas) in the coming week or month, dated by the tithi at sunrise in India\n    (IST). horizon: \"week\" or \"month\".",
          "inputSchema": {
            "properties": {
              "horizon": {
                "default": "week",
                "title": "Horizon",
                "type": "string"
              }
            },
            "title": "festivalsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "festivalsDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Festivals ahead"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b5e44ab3bb98c64aca7d7dad05847d948fa3a8b97ce49f9410847019c71f26c3"
        },
        {
          "name": "find_birth_star",
          "title": "Find a birth star",
          "description": "Compute a person's Vedic birth star (janma nakshatra and pada), Moon sign and — when the birth time is known —\n    ascendant (lagna), from their birth details. Sidereal (Lahiri), computed\n    from the birth moment.\n\n    birth_date: YYYY-MM-DD. birth_place: city and country, e.g. \"Pune, India\". birth_time: HH:MM, 24-hour, local time\n    at the birth place — omit if unknown (the ascendant then can't be given, and the Moon may be one of two signs or\n    stars that day). The details are used for this answer only and never stored.",
          "inputSchema": {
            "properties": {
              "birth_date": {
                "title": "Birth Date",
                "type": "string"
              },
              "birth_place": {
                "title": "Birth Place",
                "type": "string"
              },
              "birth_time": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Birth Time"
              }
            },
            "required": ["birth_date", "birth_place"],
            "title": "find_birth_starArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "find_birth_starDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find a birth star"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1197c9db7c9e9f53cba3c3e6dcaebaddb3312f45352500c4c05906e45d4f344f"
        },
        {
          "name": "monthly_forecast",
          "title": "Monthly forecast",
          "description": "This month's (or next month's) Vedic transit forecast for one birth star (nakshatra) and ascendant: the key\n    planetary moves with dates (IST), the house each planet crosses from the ascendant and what it governs, the\n    classical result of each transit counted from the Moon sign (Phaladīpikā ch. 26, cited per verse — both Moon signs\n    where the star spans two), and each planet's tārā from the birth star. A general reading for everyone with this\n    combination, for reflection.\n\n    birth_star: one of the 27 nakshatras (any common spelling). ascendant: a sign, English or Sanskrit.\n    month: \"current\" or \"next\".",
          "inputSchema": {
            "properties": {
              "ascendant": {
                "title": "Ascendant",
                "type": "string"
              },
              "birth_star": {
                "title": "Birth Star",
                "type": "string"
              },
              "month": {
                "default": "current",
                "title": "Month",
                "type": "string"
              }
            },
            "required": ["ascendant", "birth_star"],
            "title": "monthly_forecastArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "monthly_forecastDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Monthly forecast"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a7757eaaf9880b56f92d934fe2d01bd00700df714e8fbc946672c666ce50db29"
        },
        {
          "name": "panchang",
          "title": "Today's panchang",
          "description": "The Hindu almanac (panchang) for a day at New Delhi (IST): the five limbs (vāra, tithi, nakshatra, yoga,\n    karana), sunrise and sunset, Rahu Kaal, Yamaganda and Gulika, Abhijit, and the day's chaughadia. With a\n    birth_star, also that star's tārā for the day.\n\n    date: \"today\" or YYYY-MM-DD (within a year either way). birth_star: optional nakshatra name.",
          "inputSchema": {
            "properties": {
              "birth_star": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Birth Star"
              },
              "date": {
                "default": "today",
                "title": "Date",
                "type": "string"
              }
            },
            "title": "panchangArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "panchangDictOutput",
            "type": "object"
          },
          "annotations": {
