{
  "lockfileVersion": 2,
  "subjects": {
    "ai.sportapi/football": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://sportapi.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "sportapi",
        "title": "SportAPI football data",
        "version": "1.1.0",
        "websiteUrl": "https://sportapi.ai/mcp-server"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Football (soccer) data for 117 leagues and cups: fixtures, live scores, events, lineups, team stats, standings, top scorers, teams and players. Ids: find_leagues, find_teams and find_players turn names into ids and slugs; get_league and get_standings also list team ids. Times: kickoff_utc is UTC. Match dates (the date argument of get_matches) follow Central European time. Each tool call uses one or more requests from the caller's SportAPI plan.",
      "tools": [
        {
          "name": "find_leagues",
          "title": "Find leagues",
          "description": "List covered leagues and cups with their ids. Optionally filter by a name or country fragment (e.g. \"premier\", \"spain\", \"champions\"). Use the id with the other tools.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Part of a league or country name; omit to list all",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:11af2692223c33bb85549ff9015f42889d808ee5656a9bb4e8569a7f917c6ba5"
        },
        {
          "name": "find_players",
          "title": "Find players",
          "description": "Search players by name (e.g. \"saka\", \"haaland\"). Returns player ids, position, team id and the slug used by get_player.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Default 10",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Part of the player name, at least 2 characters",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d7c524977d02c27cd14a98cdbc987371a023a7c70b92bab1f5149360ea0f5364"
        },
        {
          "name": "find_teams",
          "title": "Find teams",
          "description": "Search teams by name (e.g. \"arsenal\", \"real madrid\"). Returns team ids, country and main league id for the other tools.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Default 10",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Part of the team name, at least 2 characters",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6b2785be8f73859ccc24fe7eae6c06acb9e2473090c377b5069ed61e61c771d6"
        },
        {
          "name": "get_head_to_head",
          "title": "Head to head",
          "description": "Past matches between two teams.",
          "inputSchema": {
            "properties": {
              "team1_id": {
                "type": "integer"
              },
              "team2_id": {
                "type": "integer"
              }
            },
            "required": ["team1_id", "team2_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ca0fa2013903c6b5ab948d1d2cf8fe047dfec744b2fe81c8baae4cc7c0f0135f"
        },
        {
          "name": "get_league",
          "title": "League overview",
          "description": "A league with its teams (ids), upcoming fixtures and recent results.",
          "inputSchema": {
            "properties": {
              "league_id": {
                "type": "integer"
              }
            },
            "required": ["league_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:67f0d21876c811fc80c846f8b5b2ef7ac546775885dfe5ad227c3b4325d8e5a1"
        },
        {
          "name": "get_live_matches",
          "title": "Live matches",
          "description": "Matches being played right now with the current score and minute. Scores refresh every minute.",
          "inputSchema": {
            "properties": {
              "league_id": {
                "description": "Only this league",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:edd7e18cfadd3e8179d53055d22e442efbf51e77abb5101f351401b2d579d63b"
        },
        {
          "name": "get_match",
          "title": "Match details",
          "description": "One match: teams, score, venue, coaches and events (goals, cards, substitutions). Optionally team statistics and lineups (each adds one request). Lineups and stats exist only for competitions covered in detail.",
          "inputSchema": {
            "properties": {
              "include": {
                "description": "Extra sections",
                "items": {
                  "enum": ["stats", "lineups"],
                  "type": "string"
                },
                "type": "array"
              },
              "match_id": {
                "description": "Match id from get_matches",
                "type": "integer"
              }
            },
            "required": ["match_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f5010e0162a7ea212ae5113b9eee44c9b53cbcb73c5aa82d61bcc3378a759fbe"
        },
        {
          "name": "get_matches",
          "title": "Matches on a date",
          "description": "Fixtures and results for one day, optionally for one league or only live/finished/upcoming matches. Status is one of Scheduled, LIVE, HT, FT, AET, PENS, Postponed, Cancelled, Suspended.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "YYYY-MM-DD, or today / yesterday / tomorrow (default today, Central European time)",
                "type": "string"
              },
              "league_id": {
                "description": "Only this league (id from find_leagues)",
                "type": "integer"
              },
              "status": {
                "description": "Filter by state (default all)",
                "enum": ["all", "live", "finished", "upcoming"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2c9529ccf8343a88276e4d18d55cbf113452017ae91186b813ca7840d7e68590"
        },
        {
          "name": "get_player",
          "title": "Player",
          "description": "Player profile by slug (e.g. \"bukayo-saka\"): position, nationality, season stats, recent matches and next match.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5c90c6a8e51a662bff0fc93c488ff8601297d9106db974ce519ca0541271958e"
        },
        {
          "name": "get_player_match_stats",
          "title": "Player match stats",
          "description": "Per-match statistics and totals for a player, found by name and team id.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Player name as shown in squads or lineups",
                "type": "string"
              },
              "shirt_number": {
                "description": "Helps when two players share a name",
                "type": "integer"
              },
              "team_id": {
                "type": "integer"
              }
            },
            "required": ["name", "team_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e58bf58b0910be8e92936767a21fcc9f75ce69fb9ff2e2785fba405fc67699b1"
        },
        {
          "name": "get_standings",
          "title": "League table",
          "description": "Current table with season, points, goals and form (last 6 matches, oldest first). Leagues split into conferences or zones mark each row with its group; cups return their group tables. Knockout-only cups return nothing.",
          "inputSchema": {
            "properties": {
              "league_id": {
                "type": "integer"
              }
            },
            "required": ["league_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:90749e4125aa9090ffa6bd2b19c0d25e6a356cb49f4dbad0ba281322fa004329"
        },
        {
          "name": "get_team",
          "title": "Team",
          "description": "A team by id or slug (e.g. \"arsenal\") with recent and upcoming matches. Optionally the squad (player slugs) and trophies (each adds one request; the slug form already includes the squad).",
          "inputSchema": {
            "properties": {
              "include": {
                "items": {
                  "enum": ["squad", "trophies"],
                  "type": "string"
                },
                "type": "array"
              },
              "slug": {
                "description": "Team slug, used when team_id is not given",
                "type": "string"
              },
              "team_id": {
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4aebe33a5a35e38f02b8034df30ffc70d8ef94d47df7ed64e4e075ac17cc5cf3"
        },
        {
          "name": "get_top_players",
          "title": "League leaders",
          "description": "Top scorers, assist leaders or most-carded players of a league this season.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Default scorers",
                "enum": ["scorers", "assists", "cards"],
                "type": "string"
              },
              "league_id": {
                "type": "integer"
              },
              "limit": {
                "description": "Default 10",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["league_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:449df859949716176b6de79e90f3332135eb93772181e9df0065d4e783096171"
        }
      ],
      "digest": "sha256:01093845205805becfecee5e33b77625a82f855fc4863d369da48869c1317b70"
    }
  }
}
