{
  "lockfileVersion": 2,
  "subjects": {
    "app.netlify.japan-data-mcp/japan-data-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://japan-data-mcp.netlify.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "japan-data-mcp",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Cross-source access to Japanese law, corporations, and statistics, normalized to English metadata. Every response carries the required source attribution.",
      "tools": [
        {
          "name": "get_law_text",
          "description": "Fetch the original Japanese text of a law by its law_id or revision_id (as returned by search_japanese_law). Optionally extract a single article. Returns the authentic Japanese legal text with English-normalized metadata and the required source attribution. No API key required. Typical flow: search_japanese_law -> get_law_text.",
          "inputSchema": {
            "properties": {
              "article": {
                "description": "Optional article number in Arabic numerals as e-Gov numbers them, e.g. \"9\", or \"32_2\" for Article 32-2. Omit to get the whole law (truncated to max_chars).",
                "type": "string"
              },
              "law_id": {
                "description": "law_id (e.g. \"321CONSTITUTION\") or revision_id from search_japanese_law results.",
                "type": "string"
              },
              "max_chars": {
                "default": 4000,
                "description": "Max characters of Japanese text to return (200-20000).",
                "type": "integer"
              }
            },
            "required": ["law_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0eb3a2ec54f05b6d79b1d721e22cc2bc21616c7ad0da3e39a31010178ac21f4e"
        },
        {
          "name": "search_corporation",
          "description": "Look up a Japanese corporation by partial name or 13-digit corporate number, returning English-keyed records (corporate number, name, address). Requires a free National Tax Agency application ID.",
          "inputSchema": {
            "properties": {
              "corporate_number": {
                "description": "13-digit corporate number.",
                "type": "string"
              },
              "name": {
                "description": "Partial company name (Japanese).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e5853944cbd7bc676b891340c38926890515877af4cd3daae91b9a401ecd1b79"
        },
        {
          "name": "search_japanese_law",
          "description": "Search Japanese laws and regulations by keyword and return English-normalized metadata (law id, type, era, promulgation date, category) plus the matched Japanese text. No API key required. Japanese keywords match best; the underlying source is full-text Japanese.",
          "inputSchema": {
            "properties": {
              "keyword": {
                "description": "Search term. Japanese matches the source text directly; English is best-effort.",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Max results (1-20).",
                "type": "integer"
              }
            },
            "required": ["keyword"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a2928e1d2405fe465e84360b1452c52f617fd8d17fe226b3ad7aa1ae5b902709"
        },
        {
          "name": "search_statistics",
          "description": "Search Japanese official statistics tables (e-Stat) by keyword and return English-keyed table metadata (id, title, organization, dates). Requires a free e-Stat application ID.",
          "inputSchema": {
            "properties": {
              "keyword": {
                "description": "Search term for statistics tables.",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Max results (1-20).",
                "type": "integer"
              }
            },
            "required": ["keyword"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cdff5dae442fac8e0ec772b2b7a7a15bf01a9bc7cf62fb01b8a6e443d3793ed8"
        }
      ],
      "digest": "sha256:2671c87c7a47aa0e6b637c9ea0ad3602fc010a01aa72b084e5785664c2fac015"
    }
  }
}
