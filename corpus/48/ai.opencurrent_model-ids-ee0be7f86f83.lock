{
  "lockfileVersion": 2,
  "subjects": {
    "ai.opencurrent/model-ids": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://opencurrent.ai/mcp/models"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "model-ids",
        "title": "LLM Model ID Check",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Before writing code that calls an LLM API (Anthropic, OpenAI, Google, Mistral, DeepSeek, xAI), check that the model ID you remember still exists and whether a newer model in the same family is out. Data: models.dev (MIT), refreshed hourly.",
      "tools": [
        {
          "name": "check_model_id",
          "title": "Check an LLM model ID",
          "description": "Is this model ID current? Returns the model (release date, knowledge cutoff, context and output limits, price per million tokens) and newer models in the same family, or close suggestions if the ID is unknown.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "model_id": {
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["model_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "exists": {
                "type": "boolean"
              }
            },
            "required": ["exists"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c5f5506b777502d3fc34942badaa95e31256035106c241200dd3a3486961fec2"
        },
        {
          "name": "latest_models",
          "title": "Latest models of a provider",
          "description": "Newest models of a provider, optionally filtered by a word such as 'sonnet', 'mini' or 'flash'.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "filter": {
                "maxLength": 40,
                "type": "string"
              },
              "limit": {
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "provider": {
                "enum": ["anthropic", "openai", "google", "mistral", "deepseek", "xai"],
                "type": "string"
              }
            },
            "required": ["provider"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "models": {
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    }
                  },
                  "required": ["id"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["models"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:84cddc83b02d8e01ddddd61ca6e09f6ff974ee6638c754f5291e9e70b8616998"
        }
      ],
      "digest": "sha256:9dbb13525c268856b6d122601abddf0a42b0ff69e754f6f16fc69fe3e04386be"
    }
  }
}
