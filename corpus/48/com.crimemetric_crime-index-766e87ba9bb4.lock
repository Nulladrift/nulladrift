      "serverInfo": {
        "name": "crimemetric",
        "title": "CrimeMetric",
        "version": "2.0.0",
        "websiteUrl": "https://crimemetric.com/api"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "CrimeMetric: U.S. crime data for addresses, points, census block groups and places. crime_index gives modeled indexes for a block group (100 = the U.S. rate per resident) with p10-p90 ranges and confidence; find_places and place_profile give city-level summaries; nearby_incidents, incident_stats and data_coverage cover police-published incident records. Lead with the national percentile (90 = higher than where 90% of U.S. residents live) and report indexes with their range and confidence. Say which sources and record types a count comes from (calls for service are not crimes). Describe places by their numbers: never turn them into a letter grade or a safe/unsafe label, and never tell anyone to avoid a neighborhood.",
      "tools": [
        {
          "name": "crime_definitions",
          "title": "Crime definitions",
          "description": "What every crime, summary, record type and license class means, plan limits, and the usage rules. Free.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Crime definitions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
