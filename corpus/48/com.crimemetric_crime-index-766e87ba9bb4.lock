          "digest": "sha256:d53937a02408b4afd73fd2389f26cccb47bff03edc7d553414429179dda0a648"
        },
        {
          "name": "incident_stats",
          "title": "Incident counts",
          "description": "Counts of police-published records around a point by type and record type, by month, and against the same-length period before, with the sources behind them. Counts describe published records, not all crime.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "description": "A U.S. street address",
                "type": "string"
              },
              "crime": {
                "description": "Only these types: murder, rape, robbery, aggravated_assault, burglary, shoplifting, theft_from_vehicle, other_larceny, motor_vehicle_theft, simple_assault, intimidation, vandalism, weapons, drugs_alcohol, disorderly_conduct, trespass, theft_unspecified, assault_unspecified, other_offense, or a call_* type",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "from": {
                "description": "First day, YYYY-MM-DD (default: 90 days before `to`)",
                "type": "string"
              },
              "include_calls": {
                "description": "Include calls for service and records that read as calls (alarms, traffic, welfare checks). Default false, unless crime names a call type or record_type includes cfs.",
                "type": "boolean"
              },
              "lat": {
                "description": "Latitude",
                "type": "number"
              },
              "lon": {
                "description": "Longitude",
                "type": "number"
              },
              "radius_m": {
                "description": "Radius in meters (default 500; plan caps apply)",
                "type": "number"
              },
              "record_type": {
                "description": "offense, report, cfs (calls for service), unknown. Default leaves out cfs.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "to": {
                "description": "Last day, YYYY-MM-DD (default: today)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Incident counts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:3f8a64dd2d54309527a48d1f17b74d6e0704bc207e573bd3b1e8f6efbb6618ff"
        },
        {
          "name": "nearby_incidents",
          "title": "Nearby incidents",
          "description": "Police-published incident records around an address or point, newest first: what, when, block-level address, type, record type and source, typed as crimemetric.com's city pages type them. Sensitive cases come without a location. Calls (calls for service, and records that read as calls) are left out unless include_calls is true. Developer and Business plans; on the free plan, use incident_stats for counts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "description": "A U.S. street address",
                "type": "string"
              },
              "crime": {
                "description": "Only these types: murder, rape, robbery, aggravated_assault, burglary, shoplifting, theft_from_vehicle, other_larceny, motor_vehicle_theft, simple_assault, intimidation, vandalism, weapons, drugs_alcohol, disorderly_conduct, trespass, theft_unspecified, assault_unspecified, other_offense, or a call_* type",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "cursor": {
                "type": "string"
              },
              "from": {
                "description": "First day, YYYY-MM-DD (default: 90 days before `to`)",
                "type": "string"
              },
              "include_calls": {
                "description": "Include calls for service and records that read as calls (alarms, traffic, welfare checks). Default false, unless crime names a call type or record_type includes cfs.",
                "type": "boolean"
              },
              "lat": {
                "description": "Latitude",
                "type": "number"
              },
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "description": "Longitude",
                "type": "number"
              },
              "radius_m": {
                "description": "Radius in meters (default 500; plan caps apply)",
                "type": "number"
              },
              "record_type": {
                "description": "offense, report, cfs (calls for service), unknown. Default leaves out cfs.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "to": {
                "description": "Last day, YYYY-MM-DD (default: today)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Nearby incidents"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e26902c06e33c854a8f9e35a82c5e64b443b38fadef8d5f7043cf23d26146729"
        },
        {
          "name": "place_block_groups",
          "title": "Block groups in a place",
          "description": "Every census block group inside a place with its index for one measure (default total_major), 80% interval, percentile and confidence. Use it to describe how crime varies across a city.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "crime": {
                "description": "A summary (total_major, persons, property, disorder) or one of the 16 crimes",
                "type": "string"
              },
              "place_id": {
                "type": "string"
              },
              "sort": {
                "enum": ["bg_geoid", "index"],
                "type": "string"
              }
            },
            "required": ["place_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Block groups in a place"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
