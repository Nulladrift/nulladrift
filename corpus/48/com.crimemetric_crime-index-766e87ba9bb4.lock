        },
        {
          "name": "find_places",
          "title": "Find places",
          "description": "Search U.S. cities, towns and CDPs by name (and state), largest first. Free, no key needed. Returns place_id values for place_profile and place_block_groups.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "type": "string"
              },
              "state": {
                "description": "Two-letter state",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find places"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
