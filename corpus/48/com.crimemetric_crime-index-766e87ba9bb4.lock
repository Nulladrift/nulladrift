          },
          "digest": "sha256:e0ffe134d332cfe30e089de28ba4bcf07ef033ba444a0664b8d51bbcc4a2b616"
        },
        {
          "name": "place_profile",
          "title": "Place profile",
          "description": "City-level crime indexes for a place: four summaries and 16 crimes (index, expected count, change over one year and to the projection year, spread across neighborhoods), time of week, confidence and the data-quality gate. Free, no key needed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "place_id": {
                "description": "From find_places, e.g. 'tx/houston', or a 7-digit place GEOID",
                "type": "string"
              }
            },
            "required": ["place_id"],
            "type": "object"
          },
          "annotations": {
