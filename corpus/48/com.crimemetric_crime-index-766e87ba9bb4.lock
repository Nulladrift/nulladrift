        },
        {
          "name": "crime_index",
          "title": "Crime index",
          "description": "Crime indexes for the 2020 census block group at a U.S. location. Pass exactly one of: address, lat and lon, or bg_geoid (12 digits). Returns 16 crimes and four summaries with expected annual counts, indexes (100 = U.S. rate per resident), 80% intervals, confidence, national percentiles, city and county comparisons, and notes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "description": "A U.S. street address",
                "type": "string"
              },
              "bg_geoid": {
                "description": "12-digit 2020 block group GEOID",
                "type": "string"
              },
              "lat": {
                "description": "Latitude",
                "type": "number"
              },
              "lon": {
                "description": "Longitude",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Crime index"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:fde100799af0d14ac85f81a5ffe0443777964f2273ee65ef13a2145b1f4d93b8"
        },
        {
          "name": "crime_index_batch",
          "title": "Crime index for several locations",
          "description": "crime_index for up to 10 locations at once; each successful one counts as a call. Developer and Business plans; on the free plan, call crime_index once per location.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "locations": {
                "items": {
                  "properties": {
                    "address": {
                      "description": "A U.S. street address",
                      "type": "string"
                    },
                    "bg_geoid": {
                      "type": "string"
                    },
                    "lat": {
                      "description": "Latitude",
                      "type": "number"
                    },
                    "lon": {
                      "description": "Longitude",
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["locations"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Crime index batch"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7d9c72959fd40141d18d81fd4e28bc7585e64d83fcaa21560511a873e0bad025"
        },
        {
          "name": "data_coverage",
          "title": "Data coverage",
          "description": "Which police agencies publish records near a point, which record types, and how fresh (last 90 days, within 1 km). Free, no key needed. Use it before reading too much into a low count.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "description": "A U.S. street address",
                "type": "string"
              },
              "from": {
                "type": "string"
              },
              "lat": {
                "description": "Latitude",
                "type": "number"
              },
              "lon": {
                "description": "Longitude",
                "type": "number"
              },
              "radius_m": {
                "type": "number"
              },
              "to": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
