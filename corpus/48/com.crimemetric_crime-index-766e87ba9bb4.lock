      "instructions": "CrimeMetric crime rates for U.S. addresses. crime_index returns modeled crime indexes for the 2020 census block group around an address, a lat/lon point, or a block group GEOID: 16 crimes plus persons, property and disorder summaries, where 100 = the U.S. rate per resident. Lead with the national percentile (90 = higher than where 90% of U.S. residents live) and report indexes with their p10-p90 range and confidence. Describe places by their numbers: don't turn them into a letter grade or a safe/unsafe label, and don't tell people to avoid a neighborhood.",
      "tools": [
        {
          "name": "crime_index",
          "description": "Crime indexes for the 2020 census block group at a U.S. location.\n\n        Pass exactly one of: address (a U.S. street address), lat and lon, or bg_geoid (12 digits).\n        Returns 16 crimes and four summaries with expected annual counts, indexes (100 = U.S. rate per\n        resident), 80% intervals, confidence, national percentiles, city and county comparisons, and notes.\n        ",
          "inputSchema": {
            "properties": {
              "address": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Address"
              },
              "bg_geoid": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Bg Geoid"
              },
              "lat": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Lat"
              },
              "lon": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Lon"
              }
            },
            "title": "crime_indexArguments",
            "type": "object"
          },
