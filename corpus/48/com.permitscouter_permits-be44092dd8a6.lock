    "com.permitscouter/permits": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.permitscouter.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Permit Scouter",
        "version": "1.30.0",
        "websiteUrl": "https://permitscouter.com"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Daily building permits from Tampa Bay, Southwest and Central Florida, with job value, contractor and trade on each permit. Use coverage first to see which cities are covered and how fresh the data is, and sample_permits to see the record format; both are free. search_permits finds new permits (e.g. roofing or hvac jobs above a job value in a zip code). Paid tools are settled per call in USDC on Base via x402; a call that returns an error is not charged. Homeowner names are never included.",
      "tools": [
        {
          "name": "contractor_history",
          "title": "Contractor permit history",
          "description": "Every permit a contractor has pulled, with total job value and counts by trade. Price: $0.10 per call (x402, USDC on Base).",
          "inputSchema": {
            "properties": {
              "contractor_key": {
                "description": "contractor_key from a permit record, usually the license number in lower case",
                "title": "Contractor Key",
                "type": "string"
              }
            },
            "required": ["contractor_key"],
            "title": "contractor_historyArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5ff53e69e483e64d3fbe00c1444328625cca0c0a7ffbd3647e22523d37df757f"
        },
        {
          "name": "coverage",
          "title": "Coverage (free)",
          "description": "Free. Cities covered today, permit counts, date range and last update time.",
          "inputSchema": {
            "properties": {},
            "title": "coverageArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "coverageDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ee89195ea2ea62f8ed475876b2c4458497881793977579a737ab265d4f04e1fb"
        },
        {
          "name": "get_permit",
          "title": "Get one permit",
          "description": "One permit and every change recorded to its status, value or issue date. Price: $0.01 per call (x402, USDC on Base).",
          "inputSchema": {
            "properties": {
              "permit_number": {
                "description": "Permit number, e.g. BTR-27-0633248",
                "title": "Permit Number",
                "type": "string"
              },
              "source": {
                "description": "Source key, e.g. tampa (the part before ':' in permit_key)",
                "title": "Source",
                "type": "string"
              }
            },
            "required": ["permit_number", "source"],
            "title": "get_permitArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b1f3caecb838124041c80908eebf1ed3c1f55f7afa27929ba960c14f73c1d733"
        },
        {
          "name": "property_history",
          "title": "Property permit history",
          "description": "Every permit recorded at one street address, newest first. Price: $0.05 per call (x402, USDC on Base).",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Street address as shown in results, e.g. 4202 W CLEVELAND ST",
                "title": "Address",
                "type": "string"
              },
              "zip": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "5-digit zip code, to narrow the match",
                "title": "Zip"
              }
            },
            "required": ["address"],
            "title": "property_historyArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:62aca6fd83a8b83078e199897138adb37000f57f702cc9895037a9e744daf4d7"
        },
        {
          "name": "sample_permits",
          "title": "Sample permits (free)",
          "description": "Free. Three recent permits, to see the record format before paying.",
          "inputSchema": {
            "properties": {},
            "title": "sample_permitsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "sample_permitsDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0be24a4a18c2ff4d62a9d040fc1ebd5ac96b9e00fc52b5b8ace54eec03fcbdf8"
        },
        {
          "name": "search_permits",
          "title": "Search permits",
          "description": "Search new building permits by trade, job value, date, zip or city. Newest first, up to 25 per call. Price: $0.02 per call (x402, USDC on Base).",
          "inputSchema": {
            "properties": {
              "city": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "City name, e.g. TAMPA",
                "title": "City"
              },
              "jurisdiction": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Source key from coverage, e.g. tampa",
                "title": "Jurisdiction"
              },
              "limit": {
                "default": 25,
                "description": "Results per call, 1 to 25",
                "maximum": 25,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "min_value": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Minimum job value in US dollars",
                "title": "Min Value"
              },
              "offset": {
                "default": 0,
                "description": "Start position for paging",
                "minimum": 0,
                "title": "Offset",
                "type": "integer"
              },
              "q": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Words in the work description, e.g. heat pump",
                "title": "Q"
              },
              "since": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Filed on or after, YYYY-MM-DD",
                "title": "Since"
              },
              "trade": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "One of: roofing, hvac, solar, pool, electrical, plumbing, windows_doors, new_construction, remodel, demolition",
                "title": "Trade"
              },
              "until": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Filed on or before, YYYY-MM-DD",
                "title": "Until"
              },
              "zip": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "5-digit zip code",
                "title": "Zip"
              }
            },
            "title": "search_permitsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ac88a1e1e6829d037ca9324f164b5dc50f7bd97d779d0c856513a9cb6317070c"
        }
      ],
      "digest": "sha256:2c5af469f38962056c881fca3f4614026afb83b892a15c23dcbea976ce93a240"
    }
  }
