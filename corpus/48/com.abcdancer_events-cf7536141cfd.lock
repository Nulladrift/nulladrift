      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "com.abcdancer/events",
        "title": "ABCDancer dance events",
        "version": "1.1.0",
        "description": "Social dance events (bachata, salsa, kizomba, zouk) in Europe: search by city, date and style. Read-only, no sign-in.",
        "websiteUrl": "https://abcdancer.com/events",
        "icons": [
          {
            "src": "https://abcdancer.com/events/mcp/icon.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only calendar of social dance events (bachata, salsa, kizomba, zouk) from ABCDancer, strongest in Amsterdam and the Netherlands, also Spain and nearby festivals. Use search_events for free-text questions (any language; place and time inside the query are understood), upcoming for a date window, get_event for one event's details, list_cities for coverage. Every event has a canonical `url`, its page on abcdancer.com, which is the link to give for it. Times are local to the event.",
      "tools": [
        {
          "name": "get_event",
          "title": "Get one dance event",
          "description": "Full details of one event: times, venue and address, price, line-up, description, `tickets` (a link that opens the organiser's ticket page), organiser links, other dates of a recurring night and other events nearby. Pass the `id` or the `url` from a search result (an abcdancer.com/events or events.abcdancer.com event link works too).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id_or_url": {
                "description": "Event id (8 hex characters, e.g. \"3cc4d06a\") or an event URL.",
                "type": "string"
              }
            },
            "required": ["id_or_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one dance event"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://abcdancer/event-cards-v1.html"
            },
            "ui/resourceUri": "ui://abcdancer/event-cards-v1.html"
          },
          "digest": "sha256:589c478cc6365b33937696e9a0e31977a22fc0201b864c80b1fee1abadaf846f"
        },
        {
          "name": "list_cities",
          "title": "List cities with dance events",
          "description": "The cities that have upcoming dance events in the calendar, most events first, with the count of upcoming events and the link to each city's page. Also the known dance styles. Coverage: Amsterdam and the rest of the Netherlands first, then Spain (Madrid, Barcelona), Belgium, Germany, France, Portugal, Turkey and nearby festivals.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List cities with dance events"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:35b8c0d18cca6fdf11d2f1c67ee8c27165ec99519f3fcaf3f259dd3619de035e"
        },
        {
          "name": "search_events",
          "title": "Search dance events",
          "description": "Search upcoming social dance events (bachata, salsa, kizomba, zouk socials, parties and festivals) by meaning, in any language. The query may contain a place and a time, which are applied as exact filters: \"bachata this weekend in Amsterdam\", \"salsa tonight Barcelona\", \"festivales de kizomba en primavera\", \"zouk festival in March\". Relative dates (tonight, this weekend, next month, a weekday, a month, a season) are read in the local time of the place asked for, in English, Spanish, Dutch, French, Portuguese, Italian, German and Romanian. Explicit city/country/style/from/to arguments override what the query says. Returns compact events, best match first, each with its `url` (the event's page on abcdancer.com) and, when the organiser sells tickets online, `tickets`: a link that opens the organiser's ticket page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City name or slug, e.g. \"Amsterdam\", \"the-hague\", \"Barcelona\". A city includes the towns of its area.",
                "type": "string"
              },
              "country": {
                "description": "ISO country code or English name, e.g. \"nl\", \"Spain\".",
                "type": "string"
              },
              "from": {
                "description": "First day, YYYY-MM-DD (inclusive).",
                "format": "date",
                "type": "string"
              },
              "kind": {
                "description": "\"festival\": festivals, congresses and dance weekends only; \"event\": single nights (socials, parties) only.",
                "enum": ["festival", "event"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many events to return, 1 to 25. Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the user is looking for, in their own words.",
                "type": "string"
              },
              "style": {
                "description": "Dance style. \"bachata\" includes sensual, dominican and influence.",
                "enum": ["bachata", "sensual", "dominican", "influence", "salsa", "kizomba", "zouk"],
                "type": "string"
              },
              "to": {
                "description": "Last day, YYYY-MM-DD (inclusive).",
                "format": "date",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search dance events"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://abcdancer/event-cards-v1.html"
            },
            "ui/resourceUri": "ui://abcdancer/event-cards-v1.html"
          },
          "digest": "sha256:0b2a96d9f620f38446f46a6403f5944accadf2ab1ee3421a09cf4f732aeaeba9"
        },
        {
          "name": "upcoming",
          "title": "Upcoming dance events by date",
          "description": "Every listed event in a time window, in date and start-time order, optionally for one city, country, style or kind. Use it for \"where can I dance tonight in Amsterdam?\" or \"what's on this weekend?\". `when` is read in the local time of the city; \"tonight\" keeps showing the current night until 05:00. Default: the next 7 days. Each event comes with its `url` (the event's page on abcdancer.com) and, when there is one, `tickets`: a link that opens the organiser's ticket page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City name or slug, e.g. \"Amsterdam\", \"the-hague\", \"Barcelona\". A city includes the towns of its area.",
                "type": "string"
              },
              "country": {
                "description": "ISO country code or English name, e.g. \"nl\", \"Spain\".",
                "type": "string"
              },
              "kind": {
                "description": "\"festival\": festivals, congresses and dance weekends only; \"event\": single nights (socials, parties) only.",
                "enum": ["festival", "event"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "How many events to return, 1 to 50. Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "style": {
                "description": "Dance style. \"bachata\" includes sensual, dominican and influence.",
                "enum": ["bachata", "sensual", "dominican", "influence", "salsa", "kizomba", "zouk"],
                "type": "string"
              },
              "when": {
                "description": "One of tonight, today, tomorrow, this-weekend, next-weekend, this-week, next-week, next-7-days, this-month, next-month, or a date like 2026-12-31. Default next-7-days.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Upcoming dance events by date"
          },
          "behavior": {
            "destructive": false,
