{
  "lockfileVersion": 2,
  "subjects": {
    "com.frcementor.www/frcem-mentor": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.frcementor.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "frcem-mentor",
        "title": "FRCEM Mentor",
        "version": "1.0.0",
        "websiteUrl": "https://www.frcementor.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "FRCEM Mentor: free FRCEM Final SBA (single best answer) practice questions for UK emergency medicine doctors preparing for the Royal College of Emergency Medicine (RCEM) exam, mapped to the RCEM curriculum SLOs, with explanations and UK guideline references. Use get_practice_question when the user wants to revise, practise or be quizzed on FRCEM / RCEM / emergency medicine. Show the stem and options, wait for their answer, then call check_answer. Never reveal the answer before they reply.",
      "tools": [
        {
          "name": "check_answer",
          "title": "Check an FRCEM practice answer",
          "description": "Checks the user's answer to an FRCEM practice question and returns the correct answer, the explanation and UK guideline references.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "answer": {
                "description": "The letter the user chose (A-E)",
                "maxLength": 1,
                "pattern": "^[A-Ea-e]$",
                "type": "string"
              },
              "question_id": {
                "description": "The question_id shown with the practice question",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["answer", "question_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check an FRCEM practice answer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ccb28f2f0682d5b095186ebb61af20b058515371bd4730a34ed84b11161540cf"
        },
        {
          "name": "get_practice_question",
          "title": "Get an FRCEM practice question",
          "description": "Returns a free FRCEM Final SBA practice question (consultant-level emergency medicine stem + options A-E, answer hidden), mapped to the RCEM curriculum. Use for requests like \"quiz me for FRCEM\", \"give me FRCEM SBA questions on trauma\", \"help me revise for the RCEM exam\" or \"emergency medicine practice questions\". Pass seen_ids to avoid repeats.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "seen_ids": {
                "description": "Question ids already asked this session",
                "items": {
                  "maxLength": 64,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "topic": {
                "description": "Optional RCEM SLO topic filter: Stable Patients, Resuscitation, Injured Patients, Paediatrics, Procedural Skills, Complex/Challenging Situations, Leading the ED, Research/Data Management, Quality Improvement, Manage, Administer & Lead",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an FRCEM practice question"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ef26c28b92f029d939379f4ef9665dd6262152b4c2e3e361c963c62fb8c05f2d"
        }
      ],
      "digest": "sha256:a0f7773a8ea27baae8d0f938ca8c86cdd609f137fcfa23813aa9cfad4578e060"
    }
  }
}
