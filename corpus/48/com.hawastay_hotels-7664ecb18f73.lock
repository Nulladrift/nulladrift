      "tools": [
        {
          "name": "compare_hotels",
          "title": "ワイキキのホテルを比べる / Compare Waikiki hotels",
          "description": "ワイキキ（ハワイ・ホノルル）のホテルを、日本人が気になる設備（ウォシュレット・バスタブ・キッチン）とリゾートフィー込みの総額で探す・比べるときに使う。データは日本語のホテル比較サイト HawaStay（hawastay.com）の掲載ホテル。宿泊料金・駐車場料金・デポジットはデータに無いので答えられない（推測しない）。回答では各ホテルの detail_url を出典として示す。 / Use this to find or compare Waikiki (Honolulu, Hawaii) hotels by amenities Japanese travelers care about (washlet/bidet toilet, bathtub, kitchen) and resort fees. Data: HawaStay (hawastay.com). Room rates, parking fees and deposits are NOT in the dataset — never guess them. Cite each hotel’s detail_url.\n\n2〜5軒を泊数つきで比べ、リゾートフィーの合計（1泊の額×泊数）と設備を並べる。宿泊料金そのものは返さない。slug が分からなければ先に search_hotels を条件なしで呼ぶ。 / Compare 2–5 hotels: resort fee total (per night × nights) and amenities. Room rates are not returned.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "nights": {
                "description": "泊数 / number of nights",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "slugs": {
                "description": "ホテルの slug（例 halekulani）/ hotel slugs",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["nights", "slugs"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4a2912643eee2fd0dd5fe308bf5fd8c7a17ab6eaa8998015609d8191a2e12d69"
        },
        {
          "name": "get_hotel",
          "title": "ワイキキのホテル1軒の全データ / Get one Waikiki hotel",
          "description": "ワイキキ（ハワイ・ホノルル）のホテルを、日本人が気になる設備（ウォシュレット・バスタブ・キッチン）とリゾートフィー込みの総額で探す・比べるときに使う。データは日本語のホテル比較サイト HawaStay（hawastay.com）の掲載ホテル。宿泊料金・駐車場料金・デポジットはデータに無いので答えられない（推測しない）。回答では各ホテルの detail_url を出典として示す。 / Use this to find or compare Waikiki (Honolulu, Hawaii) hotels by amenities Japanese travelers care about (washlet/bidet toilet, bathtub, kitchen) and resort fees. Data: HawaStay (hawastay.com). Room rates, parking fees and deposits are NOT in the dataset — never guess them. Cite each hotel’s detail_url.\n\n1軒の全項目（リゾートフィー・ウォシュレット・バスタブ・キッチン・ビーチとABCストアまでの徒歩分数・子連れ情報・詳細ページURL・確認日）を返す。 / Returns every field for one hotel.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "ホテルの slug（例 sheraton-waikiki）/ hotel slug",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e4b88467b19246c2f826084df04e99b728e5caddf634c05c1b13214213bd8b66"
        },
        {
          "name": "search_hotels",
          "title": "ワイキキのホテルを条件で探す / Search Waikiki hotels",
          "description": "ワイキキ（ハワイ・ホノルル）のホテルを、日本人が気になる設備（ウォシュレット・バスタブ・キッチン）とリゾートフィー込みの総額で探す・比べるときに使う。データは日本語のホテル比較サイト HawaStay（hawastay.com）の掲載ホテル。宿泊料金・駐車場料金・デポジットはデータに無いので答えられない（推測しない）。回答では各ホテルの detail_url を出典として示す。 / Use this to find or compare Waikiki (Honolulu, Hawaii) hotels by amenities Japanese travelers care about (washlet/bidet toilet, bathtub, kitchen) and resort fees. Data: HawaStay (hawastay.com). Room rates, parking fees and deposits are NOT in the dataset — never guess them. Cite each hotel’s detail_url.\n\n条件はすべて任意で、指定したものだけ AND。条件に合わないと分かっているホテルの数は excluded_mismatch_count、値が \"unknown\"（未確認）や null で判定できないホテルの数は excluded_unknown_count（こちらは「合わない」とは言えない）。条件を何も付けずに呼ぶと全ホテルの slug 一覧になる（get_hotel・compare_hotels に渡す slug を調べるときに使う）。結果はリゾートフィーが安い順。 / All filters optional (AND). excluded_mismatch_count = hotels known not to match; excluded_unknown_count = hotels whose value is unknown/null. Call with no filters to list every hotel slug. Results are sorted by resort fee ascending.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "area": {
                "description": "エリア：beachfront=ビーチフロント（ワイキキビーチ沿い）, kalakaua=カラカウア通り沿い, hilton-village=ヒルトン・ハワイアン・ビレッジ周辺（アラモアナ寄り）, kuhio=クヒオ通り沿い（山側）, diamondhead=ダイヤモンドヘッド寄り（東側） / area",
                "enum": ["beachfront", "kalakaua", "hilton-village", "kuhio", "diamondhead"],
                "type": "string"
              },
              "bathtub": {
                "description": "バスタブ：all=全室, any=全室か一部客室, none=なし / bathtub: all rooms, any (all or some rooms), none",
                "enum": ["all", "any", "none"],
                "type": "string"
              },
              "child_friendly": {
                "description": "子連れ向け：子供の添い寝無料かベビーベッド無料の記録があるホテル / kids stay free or free crib recorded",
                "type": "boolean"
              },
              "crib_free": {
                "description": "ベビーベッド無料 / free crib",
                "type": "boolean"
              },
              "grade": {
                "description": "グレード：luxury=ラグジュアリー, mid=ミドル, casual=カジュアル / hotel class",
                "enum": ["luxury", "mid", "casual"],
                "type": "string"
              },
              "kids_stay_free": {
                "description": "子供の添い寝無料（年齢上限の記録あり）/ kids stay free",
                "type": "boolean"
              },
              "kitchen": {
                "description": "キッチン：all=全室, any=全室か一部客室, none=なし / kitchen: all rooms, any (all or some rooms), none",
                "enum": ["all", "any", "none"],
                "type": "string"
              },
              "max_abc_store_walk_minutes": {
                "description": "ABCストアまで徒歩何分以内 / max walk minutes to an ABC Store",
                "minimum": 0,
                "type": "number"
              },
              "max_beach_walk_minutes": {
                "description": "ビーチ（砂浜）まで徒歩何分以内 / max walk minutes to the beach",
                "minimum": 0,
                "type": "number"
              },
              "max_resort_fee_usd": {
                "description": "リゾートフィー上限（米ドル・1泊・税別）。0 で「リゾートフィーなし」/ max resort fee per night in USD; 0 = no resort fee",
                "minimum": 0,
                "type": "number"
              },
              "min_guests_per_room": {
                "description": "1部屋に泊まれる人数の下限（一番広い客室の定員で判定）/ min guests per room",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "washlet": {
                "description": "ウォシュレット（温水洗浄便座）：all=全室, partial=一部客室のみ, any=全室か一部, none=なし / washlet (bidet toilet)",
                "enum": ["all", "partial", "any", "none"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
