        {
          "name": "analyze_address",
          "description": "Look up a US address (or bare 5-digit ZIP): ZIP-level home-price appreciation\n    forecast (FHFA data back to 1975), estimated market rent, and neighborhood signals\n    (schools, walkability, water quality, grocery/dining/outdoors proximity).\n\n    For a full street address this also returns sub-ZIP `nbhd*` fields describing the\n    specific census tract - how its prices, incomes and build era compare to the rest of\n    the ZIP. That is POSITION, not a neighborhood forecast; see _units.\n\n    property_type: sfr | condo | townhome | multi\n    ",
          "inputSchema": {
