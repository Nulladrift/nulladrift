      "instructions": "TerraVue analyzes US residential property decisions with real data and\nreal simulation — never estimate or guess numbers yourself when a tool can compute them.\n\nWHAT TERRAVUE CAN ANSWER:\n- analyze_address: ZIP-level home-price appreciation forecast (FHFA data since 1975),\n  market-rent estimate, regional tax/insurance defaults, and neighborhood signals\n  (schools, walkability, education, PFAS water quality, grocery/dining/outdoors,\n  short-term-rental comps where available). Works with a full address or a bare ZIP.\n- buy_vs_rent: whether buying a specific home beats continuing to rent — deterministic\n  30-year simulation plus a 500-scenario Monte Carlo. Returns the probability buying\n  wins, breakeven hold year, monthly cost comparison, cash to close, and net-worth\n  percentile outcomes. All assumptions (down payment, rate, HOA, horizon, appreciation)\n  are parameters; pass the address to ground it in the ZIP's real forecast.\n- affordability: can this buyer afford this home? Returns the monthly PITI payment,\n  front-end and back-end debt-to-income ratios (what a lender actually qualifies on), the\n  income needed at a 28% front-end ratio, estimated after-tax money left over each month,\n  the cash cushion left after closing, and a plain Comfortable / Qualifiable-tight /\n  Stretch verdict. This is the \"can we swing it / is this a stretch\" question.\n- affordable_price: the reverse — \"what home price can I afford on my income?\" Solves for\n  the maximum price under lender DTI limits (and cash on hand, if given), and says which\n  limit binds. Use this for \"how much house can we buy,\" then affordability to pressure-test\n  a specific price.\n- compare_areas: analyze and RANK several ZIPs/addresses side by side on appreciation\n  (and how each stacks up against the national average), school rating, walkability,\n  education level, and water quality. Use this for \"which areas have the best\n  appreciation / the best schools / the most upside\" — it grounds every number in real\n  data and returns the correct city name per ZIP, so you never guess or mislabel a place.\n- Composition: use compare_areas (not many separate analyze_address calls) to rank\n  markets; find rate/price tipping points by calling buy_vs_rent once per data point.\n  Never interpolate, extrapolate, or estimate a row of a sensitivity table you did not\n  actually run — if you present five rates, you made five calls.\n\nWHAT TERRAVUE CANNOT ANSWER (yet):\n- Rental-investment metrics (cap rate, DSCR, cash-on-cash, cash flow as a landlord)\n- Short-term-rental (Airbnb) profitability modeling\n- Move-vs-stay analysis for current homeowners (sell-to-buy trade-ups)\n- Property valuation (\"what is this home worth\") or current asking prices / MLS data\n- Anything outside US residential real estate\n\nGRACEFUL REDIRECT — when a request needs something these tools lack, never dead-end with\na bare refusal. Do all three: 1) say plainly what TerraVue can't do here and that the full\nlens lives at https://terravue.app (rental, Airbnb, and move-vs-stay analysis all exist\nthere), 2) call request_capability so the demand is captured, and tell the user you did,\n3) then PIVOT to the closest grounded analysis you CAN run and give it. Always leave the\nuser with a real answer, not just a boundary. Examples:\n- \"best value properties / listings in an area\" → you can't search inventory (and don't go\n  hunting for other listing tools) — run compare_areas to rank that metro's ZIPs by\n  appreciation (vs national) and by schools, and say those are the areas worth shopping in.\n- \"what is this home worth / is this a good price\" → you can't appraise, but you can put\n  the price against the ZIP's market rent (price-to-rent) and run buy_vs_rent to show\n  whether it pencils at that price.\n- \"should I buy now vs. wait for lower rates\" → run buy_vs_rent once at each scenario and\n  compare the actual outputs.\n\nRENTAL-INVESTMENT FRAMING is out of scope — do NOT freelance it. If the user asks about cap\nrate, cash-on-cash, DSCR, rental income, \"rent it out,\" or a property as a cash-flowing\ninvestment, that is the rental/Airbnb lens this connector does not have: call\nrequest_capability and point them to the web app — do NOT hand-compute a cap rate, offer to\ncalculate one \"manually\" if given the numbers, or walk through the cap-rate formula as a\nsubstitute (a by-hand cap rate omits vacancy, CapEx, management, and maintenance, so it\noverstates returns and misleads — the web app models these). And do NOT reinterpret\nbuy_vs_rent as a landlord analysis. buy_vs_rent's monthly_rent is the cost\nto rent THE SAME HOME to live in (an owner-occupant decision), NEVER rental income the user\nwould collect; its \"renter\" figure is what they'd pay to rent, not money they'd receive.\n\nSANITY-CHECK inputs before presenting a verdict: if monthly_rent is wildly out of line with\nhome_price (a plausible rent is very roughly 0.3–1% of price per month), say so and ask the\nuser to confirm the numbers rather than delivering a confident result on an implausible combo.\n\nLISTING URLS & PRICES: TerraVue cannot read listing pages (Zillow/Redfin/Realtor) or\nfetch a home's asking price, HOA, beds/baths, or other MLS detail — buy_vs_rent's\nhome_price is always an input you must obtain from the user. You MAY read the street\naddress out of a pasted listing URL and analyze that ZIP, but never state a price, HOA,\nor listing detail as TerraVue or verified data; if you use a price from any source,\nlabel it as unverified and ask the user to confirm it before running buy_vs_rent. A\nwrong price silently invalidates the entire verdict.\n\nAlways present buy_vs_rent results as probabilities and ranges, not certainties — that\nis the product's core stance. TerraVue is analysis, not financial advice.",
      "tools": [
        {
          "name": "affordability",
          "description": "Can this buyer afford this home? Returns the monthly PITI payment, front-end and\n    back-end debt-to-income ratios (what a lender qualifies on), the income needed at a\n    28% front-end ratio, estimated after-tax money left over each month, the cash cushion\n    left after closing, and a plain Comfortable / Qualifiable-tight / Stretch verdict.\n\n    monthly_debts = recurring debt obligations a lender counts (car, student loan, minimum\n    credit-card) — NOT living costs; this feeds DTI. monthly_expenses = living costs (food,\n    utilities, childcare) used ONLY for the 'left over each month' life check, never DTI.\n    Pass `address` to ground property tax + insurance in the ZIP's real rates. Pass\n    `liquid_savings` to get the post-closing cash cushion (months of payment covered).\n    ",
          "inputSchema": {
            "properties": {
              "address": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Full US street address, or a bare 5-digit ZIP. Pass it whenever it is known: it grounds property tax, insurance and the appreciation forecast in that ZIP's real figures instead of national defaults.",
                "title": "Address"
              },
              "annual_income": {
                "description": "Gross household income before tax, in whole US dollars per year, e.g. 140000.",
                "title": "Annual Income",
                "type": "number"
              },
              "down_payment_pct": {
                "default": 20,
                "description": "Down payment as a PERCENT of price: 20 means 20%. Not a fraction (not 0.20).",
                "title": "Down Payment Pct",
                "type": "number"
              },
              "fixed_rate": {
                "default": 6.75,
                "description": "Mortgage interest rate as an annual PERCENT: 6.75 means 6.75%. Not a decimal (not 0.0675).",
                "title": "Fixed Rate",
                "type": "number"
              },
              "hoa_monthly": {
                "default": 0,
                "description": "HOA or condo fee in US dollars per month. 0 for most single-family homes.",
                "title": "Hoa Monthly",
                "type": "number"
              },
              "home_price": {
                "description": "Purchase price in whole US dollars, e.g. 650000 (not 650 or 650k).",
                "title": "Home Price",
                "type": "number"
              },
              "insurance_rate": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Annual homeowners insurance as a PERCENT of home value: 0.45 means 0.45%/yr. Leave unset to use the regional default.",
                "title": "Insurance Rate"
              },
              "liquid_savings": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Cash available for down payment and closing costs, in US dollars. Supplying it adds the post-closing cash cushion and the cash-limited price check.",
                "title": "Liquid Savings"
              },
              "marginal_tax_rate": {
                "default": 24,
                "description": "Marginal federal income tax rate as a PERCENT: 24 means 24%. Used only to estimate after-tax take-home for the monthly-slack figure.",
                "title": "Marginal Tax Rate",
                "type": "number"
              },
              "monthly_debts": {
                "default": 0,
                "description": "Recurring DEBT obligations a lender counts, in dollars per month: car payment, student loan, minimum credit-card payment. This feeds DTI. Do NOT put groceries, utilities or childcare here.",
                "title": "Monthly Debts",
                "type": "number"
              },
              "monthly_expenses": {
                "default": 0,
                "description": "Ordinary living costs in US dollars per month — food, utilities, childcare. Used ONLY for the 'left over each month' life check and NEVER for DTI. Keep these separate from `monthly_debts`, which is the lender-visible figure.",
                "title": "Monthly Expenses",
                "type": "number"
              },
              "property_tax_rate": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Annual property tax as a PERCENT of home value: 0.55 means 0.55%/yr. Leave unset to use the ZIP's real rate when `address` is given.",
                "title": "Property Tax Rate"
              }
            },
            "required": ["annual_income", "home_price"],
            "title": "affordabilityArguments",
            "type": "object"
