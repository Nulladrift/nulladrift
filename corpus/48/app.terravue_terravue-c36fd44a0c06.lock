        {
          "name": "buy_vs_rent",
          "description": "Should someone buy this home or keep renting? Runs the TerraVue engine: a\n    deterministic 30-year simulation plus a 500-scenario Monte Carlo over correlated\n    market paths. Returns the probability buying wins, the breakeven hold period, and\n    net-worth outcomes.\n\n    monthly_rent = what the person would pay to rent THE SAME HOME to live in — an\n    owner-occupant buy-vs-rent decision, NOT rental income they'd collect as a landlord\n    (this tool does not model rental cash flow; that lens lives on terravue.app). A rent\n    far out of line with home_price is almost certainly a misunderstanding — confirm it\n    before trusting the verdict. If `address` is given, the ZIP's real appreciation forecast\n    and regional tax/insurance defaults are used (explicit parameters still win).\n    ",
          "inputSchema": {
            "properties": {
              "address": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Full US street address, or a bare 5-digit ZIP. Pass it whenever it is known: it grounds property tax, insurance and the appreciation forecast in that ZIP's real figures instead of national defaults.",
                "title": "Address"
              },
              "analysis_years": {
                "default": 30,
                "description": "Hold period in years. Use the horizon the person actually stated — if they say 'about five years', pass 5. Only default to 30 when no horizon was given.",
                "title": "Analysis Years",
                "type": "integer"
              },
              "down_payment_pct": {
                "default": 20,
                "description": "Down payment as a PERCENT of price: 20 means 20%. Not a fraction (not 0.20).",
                "title": "Down Payment Pct",
                "type": "number"
              },
              "fixed_rate": {
                "default": 6.75,
                "description": "Mortgage interest rate as an annual PERCENT: 6.75 means 6.75%. Not a decimal (not 0.0675).",
                "title": "Fixed Rate",
                "type": "number"
              },
              "hoa_monthly": {
                "default": 0,
                "description": "HOA or condo fee in US dollars per month. 0 for most single-family homes.",
                "title": "Hoa Monthly",
                "type": "number"
              },
              "home_appreciation_rate": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Annual home appreciation as a PERCENT: 3.5 means 3.5%/yr. Prefer leaving this unset and passing `address` instead, so the ZIP's FHFA-derived forecast is used rather than a guess.",
                "title": "Home Appreciation Rate"
              },
              "home_price": {
                "description": "Purchase price in whole US dollars, e.g. 650000 (not 650 or 650k).",
                "title": "Home Price",
                "type": "number"
              },
              "investment_return_rate": {
                "default": 9.5,
                "description": "Annual return the renter earns on invested cash, as a PERCENT: 9.5 means 9.5%/yr, roughly long-run equities. This assumption drives the result more than any other — drop it to about 4.5 if the alternative is savings rather than the market, or if the person sounds risk-averse, and present both runs.",
                "title": "Investment Return Rate",
                "type": "number"
              },
              "monthly_rent": {
                "description": "What this person would pay per month, in US dollars, to rent THE SAME HOME to live in. This is an owner-occupant comparison — it is NOT rental income they would collect as a landlord.",
                "title": "Monthly Rent",
                "type": "number"
              },
              "property_tax_rate": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Annual property tax as a PERCENT of home value: 0.55 means 0.55%/yr. Leave unset to use the ZIP's real rate when `address` is given.",
                "title": "Property Tax Rate"
              }
            },
            "required": ["home_price", "monthly_rent"],
            "title": "buy_vs_rentArguments",
            "type": "object"
          },
