        {
          "name": "affordable_price",
          "description": "What's the most this buyer can afford? The reverse of `affordability` — 'what price\n    can I afford?' instead of 'can I afford this specific home?'. Solves for the maximum\n    home price under standard lender limits: a front-end DTI cap (default 28% = housing /\n    gross income) and a back-end cap (default 36% = housing + other debts / gross income).\n    If `liquid_savings` is given, also caps by the cash available for down payment + closing\n    and reports which limit binds. Returns the affordable price, the PITI and DTIs at that\n    price, and the cash to close. Pass `address` to ground property tax + insurance in the\n    ZIP's real rates.\n\n    This is a lender-limit ceiling, not a comfort recommendation — feed the result into\n    `affordability` (or buy_vs_rent) to check monthly slack and whether buying pencils.\n    ",
          "inputSchema": {
            "properties": {
              "address": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Full US street address, or a bare 5-digit ZIP. Pass it whenever it is known: it grounds property tax, insurance and the appreciation forecast in that ZIP's real figures instead of national defaults.",
                "title": "Address"
              },
              "annual_income": {
                "description": "Gross household income before tax, in whole US dollars per year, e.g. 140000.",
                "title": "Annual Income",
                "type": "number"
              },
              "back_end_dti_pct": {
                "default": 36,
                "description": "Back-end DTI cap as a PERCENT: housing plus other debts, divided by gross income. The lender standard is 36. Only change it if the user names a different limit.",
                "title": "Back End Dti Pct",
                "type": "number"
              },
              "down_payment_pct": {
                "default": 20,
                "description": "Down payment as a PERCENT of price: 20 means 20%. Not a fraction (not 0.20).",
                "title": "Down Payment Pct",
                "type": "number"
              },
              "fixed_rate": {
                "default": 6.75,
                "description": "Mortgage interest rate as an annual PERCENT: 6.75 means 6.75%. Not a decimal (not 0.0675).",
                "title": "Fixed Rate",
                "type": "number"
              },
              "front_end_dti_pct": {
                "default": 28,
                "description": "Front-end DTI cap as a PERCENT: housing cost divided by gross income. The lender standard is 28. Only change it if the user names a different limit.",
                "title": "Front End Dti Pct",
                "type": "number"
              },
              "hoa_monthly": {
                "default": 0,
                "description": "HOA or condo fee in US dollars per month. 0 for most single-family homes.",
                "title": "Hoa Monthly",
                "type": "number"
              },
              "insurance_rate": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Annual homeowners insurance as a PERCENT of home value: 0.45 means 0.45%/yr. Leave unset to use the regional default.",
                "title": "Insurance Rate"
              },
              "liquid_savings": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Cash available for down payment and closing costs, in US dollars. Supplying it adds the post-closing cash cushion and the cash-limited price check.",
                "title": "Liquid Savings"
              },
              "monthly_debts": {
                "default": 0,
                "description": "Recurring DEBT obligations a lender counts, in dollars per month: car payment, student loan, minimum credit-card payment. This feeds DTI. Do NOT put groceries, utilities or childcare here.",
                "title": "Monthly Debts",
                "type": "number"
              },
              "property_tax_rate": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Annual property tax as a PERCENT of home value: 0.55 means 0.55%/yr. Leave unset to use the ZIP's real rate when `address` is given.",
                "title": "Property Tax Rate"
              }
            },
            "required": ["annual_income"],
            "title": "affordable_priceArguments",
