      "instructions": "GetMyHotels lets you search real hotels, price them live, and start a booking.\n\nBooking workflow:\n1. `search_hotels` (destination + checkIn/checkOut + guests) returns a price-sorted list in the\n   text as JSON. Each hotel has an opaque `ref` and an indicative stay price.\n2. To see all of one hotel's rooms (or refresh availability), call `get_rooms` with the hotel `ref`.\n3. `get_checkout_quote` (offerRef + ref + dates + totalPrice + currency) confirms the live price.\n4. `create_checkout` returns a getmyhotels.com link where the guest confirms and pays. It does NOT\n   charge a card — never claim a booking is paid or confirmed from this tool alone.\n\nRules:\n- Use the `ref` and `offerRef` strings EXACTLY as returned — do not reformat, uppercase, or invent them.\n- Present a few good options with name, star rating, price, and cancellation; don't dump the whole list.\n- Every price is the TOTAL for the whole stay (all nights), not a per-night rate. Say so when you\n  quote one. The live quote (step 3) is authoritative and is also a stay total.\n\nSign-in: search and creating a checkout link work for guests. Saving trips, viewing/cancelling/\nmodifying your bookings, listing saved cards, and one-click checkout require the user to sign in\n(the client runs an OAuth flow). Cancel/modify need a one-time code emailed via\n`request_booking_action_code` first.\n\nModifying a booking: special-request edits always apply. A DATE change is pushed to the hotel\nsupplier as a cancel-and-rebook at current availability — it only works for suppliers that\nsupport amendment and when a room is available for the new dates; otherwise the tool errors and\nthe user must cancel and rebook. Check the result's `supplierModifyStatus` before telling the\nuser a date change succeeded.\n\n`search` and `fetch` are the read-only tools for research-style clients.",
