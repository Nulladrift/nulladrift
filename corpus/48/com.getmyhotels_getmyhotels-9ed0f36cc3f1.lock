        {
          "name": "modify_booking",
          "title": "Modify booking",
          "description": "Change one of the signed-in user's bookings. Requires the 6-digit `verificationCode` from `request_booking_action_code`. Special-request edits always apply. A DATE change is pushed to the hotel supplier as a cancel-and-rebook at current availability, so it only works for suppliers that support amendment — for others (and when no room is available for the new dates) it returns an error asking you to cancel and rebook instead. A date change can shift the price and issue a new confirmation; the result's `supplierModifyStatus` says whether the supplier reservation was actually changed (`modified`), simulated (`simulated`), or the edit stayed local (`local_only`, e.g. special requests only). Never promise a date change went through unless `supplierModifyStatus` is `modified` or `simulated`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "checkIn": {
                "description": "New check-in date, ISO 8601 (optional).",
                "type": "string"
              },
              "checkOut": {
                "description": "New check-out date, ISO 8601 (optional).",
                "type": "string"
              },
              "publicId": {
                "description": "The booking's public id.",
                "type": "string"
              },
              "specialRequests": {
                "description": "New special requests (≤2000 chars, optional).",
                "type": "string"
              },
