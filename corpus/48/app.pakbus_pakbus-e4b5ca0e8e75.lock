          "digest": "sha256:e7c0af3407504b4669c3e0353776a86837533ab53af45d0ae538c6140e2b396d"
        },
        {
          "name": "route_details",
          "title": "Route details",
          "description": "Lists a city's routes with fares, or shows one route: its stops in order in each direction, its fare, the day’s departure times from the first stop and, for routes with live bus positions, where each bus is now. Finds a route by code such as EV5701, by name such as Orange Line, or by service such as Green Electric Bus.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City network from find_places or list_cities, such as Lahore, Attock or Rawalpindi.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "route": {
                "description": "Route code, name or service. Leave out to list every route in the city.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
