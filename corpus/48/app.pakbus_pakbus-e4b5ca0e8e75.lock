        },
        {
          "name": "service_notices",
          "title": "Service changes",
          "description": "Lists current and announced service changes in a city network, such as closed stations, skipped stops or diversions, for every route or for one route by code, name or service. plan_journey, place_departures and route_details already include the changes on the routes they use.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City network from find_places or list_cities, such as Lahore, Attock or Rawalpindi.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "route": {
                "description": "Route code, name or service. Leave out for every change in the city.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
