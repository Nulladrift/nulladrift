      },
      "instructions": "PakBus has public bus and metro routes, stops, flat fares and departure times for cities in Pakistan.\nEach place belongs to one city network. Rawalpindi and Islamabad share the Rawalpindi network. Journeys connect places in the same network.\nTimes are Pakistan local time (UTC+05:00). Most come from published timetables and a travel-time model. For CDA buses in Islamabad and Karachi's Green Line and Orange Line, departures and routes also give live times and bus positions from the operators, marked live.\nJourneys, departures and service changes start with the current time in Pakistan and give departures as clock times with the minutes until each.\nWomen-only routes are listed by route but not used for journeys.",
      "tools": [
        {
          "name": "find_places",
          "title": "Find places",
          "description": "Finds bus stops, stations and the places around them by name, in one city or in every city. Accepts common English spellings of Pakistani place names, such as Faizabad or Faiz Abad. Returns the place_id and city each other tool needs. When nothing matches in a city, it lists the stops in that city served by the most routes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Search one city network. Leave out to search every city.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "query": {
                "description": "Place name in English letters, such as Liberty Chowk or Saddar.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find places"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:fc7871c1d141456772b53f4f227a1b3bd6dd383fa77f0b8c06c6767ed8f4bace"
        },
        {
          "name": "list_cities",
          "title": "List cities",
          "description": "Lists the Pakistani cities with PakBus routes, the number of routes in each and the city name in Urdu.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List cities"
          },
          "behavior": {
