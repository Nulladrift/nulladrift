                    "type": "string"
                  },
                  "if_no_answer": {
                    "enum": ["wait_then_leave_safe", "wait_then_return", "call_client", "leave_with_neighbour"],
                    "type": "string"
                  },
                  "max_wait_minutes": {
                    "type": "integer"
                  },
                  "notes": {
                    "type": "string"
                  },
                  "return_to": {
                    "type": "string"
