        {
          "name": "create_delivery",
          "title": "Create a delivery",
          "description": "Books a delivery. Pass quote_id from get_quote, or pickup+dropoffs directly. fund=true (default) holds the price from your wallet and starts dispatch. Use dryRun=true first to see the price without committing. Returns next_action. The delivery card shows these details: reply in one short line instead of repeating them.",
