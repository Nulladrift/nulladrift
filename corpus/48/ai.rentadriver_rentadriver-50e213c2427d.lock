      },
      "instructions": "RentADriver books real-world package deliveries fulfilled by vetted RentADriver drivers. Typical flow: check_coverage → get_quote (free) → create_delivery (dryRun first if unsure) → track_delivery → get_proof_of_delivery → confirm_delivery. Prices are in cents. If a call fails with insufficient_funds, deposit to the wallet first. API: https://api.rentadriver.ai",
      "tools": [
        {
          "name": "book_shopify_order",
          "title": "Book a Shopify order",
          "description": "Book a same-day delivery for a Shopify order by its name (e.g. #1042) or id. Pickup is the store location, drop-off the order's shipping address, items from the line items. Fetches the order from Shopify if the app has not seen it. force=true ignores the shop's radius and size limits. On success the order is fulfilled with a tracking link as the driver picks it up.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "force": {
                "default": false,
                "type": "boolean"
              },
              "order": {
                "description": "Order name like #1042, Shopify order id, or the app's order row id",
                "type": "string"
              },
              "shop": {
                "description": "myshopify.com domain when several shops are connected",
                "type": "string"
              }
            },
            "required": ["order"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Book a Shopify order"
