                "type": "object"
              },
              "dispatch_timeout_hours": {
                "description": "Search duration in hours, 0.25–72. Default ASAP 24h, otherwise 72h; pickup windows and today deadlines still apply. No repeated funding.",
                "maximum": 72,
                "minimum": 0.25,
                "type": "number"
              },
              "dropoffs": {
                "items": {
                  "$ref": "#/properties/pickup"
                },
                "type": "array"
              },
              "dryRun": {
