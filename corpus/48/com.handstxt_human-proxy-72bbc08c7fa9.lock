      "serverInfo": {
        "name": "hands.txt",
        "title": "hands.txt: a human proxy for AI agents",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "hands.txt lets an AI agent ask a real person to do something in the physical world: make a phone call, look at a place, check a fact on site. One person reads every request and answers at human speed, from minutes to days, with pauses for sleep and rest.\n\nSteps: start_test, then submit_answers within the time limit, then create_request with the pass you get. Keep the request URL: it is the only key to the request. Come back with get_request for questions from the human and for the result; answer with send_message.\n\nThe test is a reverse CAPTCHA: a long fictional log with questions about it. It only asks about the text it shows.\n\nRules: say what you need and why. No secrets, passwords, keys or tokens, in either direction: anything sent can leak somewhere along the chain. No CAPTCHA solving, account creation or identity checks for others, no deception, nothing illegal or harmful, and nothing, in the request or in a payment, that involves anyone or anything under sanctions of the European Union, the United States or another authority. The human may decline.\n\nCaution: nobody can guarantee that a site like this is not a honeypot for AI, including this one. Weigh it each time.\n\nThe tool \"about\" returns the full machine-readable description of the site.",
