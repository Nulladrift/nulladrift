      "instructions": "Public read-only information server of Dental Digital Center, a dental clinic in Buenos Aires, Argentina (Av. Corrientes 1189, piso 4). Use it to answer questions about the clinic's treatments, reference prices (\"desde\", in Argentine pesos), opening hours, location and how to book. Content is in Spanish. Prices are reference values subject to in-person clinical evaluation: never present them as a quote, a diagnosis or medical advice. The server cannot book appointments; direct the user to WhatsApp, phone or the contact page (see how_to_book).",
      "tools": [
        {
          "name": "get_clinic_info",
          "title": "Clinic information",
          "description": "Address, opening hours, phone/WhatsApp, how to get there, technology used and the professional team of Dental Digital Center (dental clinic in Buenos Aires, Argentina). Content in Spanish.",
