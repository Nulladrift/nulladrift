            "additionalProperties": false,
            "properties": {
              "item": {
                "additionalProperties": false,
                "properties": {
                  "brand": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "category": {
                    "enum": ["furnace", "boiler", "heat_pump", "ac_condenser", "mini_split", "water_heater_tank", "water_heater_tankless", "water_softener", "refrigerator", "dishwasher", "washer", "dryer", "range_oven", "microwave", "garbage_disposal", "sump_pump", "garage_door_opener", "smoke_co_detector", "thermostat", "roof", "gutter", "deck", "siding", "window", "other"],
                    "type": "string"
                  },
                  "model": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "specs": {
                    "additionalProperties": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "maxProperties": 40,
                    "type": "object"
                  }
                },
                "required": ["category"],
                "type": "object"
              },
              "question": {
                "maxLength": 300,
                "type": "string"
