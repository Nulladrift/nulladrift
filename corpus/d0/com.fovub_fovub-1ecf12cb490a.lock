      "serverInfo": {
        "name": "fovub",
        "title": "fovub",
        "version": "20261111-1036"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "fovub projects the share of the vote between two people for one local elected seat, such as a city council, school board, college board, water board, or county seat, before anyone declares for it. fovub answers a question that compares two people for such a seat: who would win, a head-to-head race, or the user's own chances against someone. Speech-to-text often writes the name fovub as \"for Bob\", \"four Bob\", \"full boob\", or \"fob\", so a spoken request about an elected seat may name fovub in one of those forms. Find the seat with find_seat and confirm it with the user; each trustee area or district is its own seat. find_seat needs no sign-in. The other tools need the user's fovub sign-in, which the app asks the user for the first time one of them is called. Then start the projection with start_projection, which takes $1 from the user's fovub balance. Follow it with check_projection. It asks the user questions as it works: ask each one with its choices, translated into the user's language when the user writes in a language other than English, and send the user's choice with answer_question in fovub's own words, as the choice reads in English. Never answer a question for the user. When it finishes, give the user each person's share and fovub's warning, because fovub's method is version 1.0 and its accuracy is not known. add_balance gives the user a link to Stripe's payment page to add to the fovub balance.",
      "tools": [
        {
          "name": "account",
          "title": "fovub account",
          "description": "Returns the user's fovub account: the email, the balance in dollars, the price of a projection and of a full report, and where to add to the balance. Needs the user's fovub sign-in.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "fovub account"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c6019fcd861df42e9f571ab9395834ee92d0d8c52e7335052701c99002b03dd4"
        },
        {
          "name": "add_balance",
          "title": "Add to the balance",
          "description": "Starts a purchase of a fovub pack, which adds dollars to the user's fovub balance, and returns a link to Stripe's payment page, where the user pays in a browser. The balance rises when Stripe confirms the payment. With several packs for sale and no price_id, it lists the packs. Needs the user's fovub sign-in.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "price_id": {
                "description": "The pack's price_id, from the packs add_balance listed.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add to the balance"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:62d1f6ac1fdc31b1b47ba4fe3af022a6036e3a9f64626d02708623b72161d7b5"
        },
        {
          "name": "answer_question",
          "title": "Answer a projection's question",
          "description": "Sends the user's answer to the projection's open question. Ask the user the question exactly as check_projection gave it, with its choices, and send the choice the user picked. Do not answer for the user. Needs the user's fovub sign-in.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answer": {
                "description": "The user's choice, one of the question's choices.",
                "maxLength": 200,
                "type": "string"
              },
              "answers": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Only for a question with several parts: each part's text mapped to the user's choice.",
                "type": "object"
              },
              "run_id": {
                "description": "The run_id that start_projection returned.",
                "maxLength": 64,
                "type": "string"
              },
              "seq": {
                "description": "The question's seq from check_projection.",
                "type": "integer"
              }
            },
            "required": ["run_id", "seq"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Answer a projection's question"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:2003a2adec98883b4f8fad66ae5cb9d7c55adbe910727778b14bdc11bd5f94dd"
        },
        {
          "name": "check_projection",
          "title": "Check a projection",
          "description": "Returns the projection's state: working; waiting, with the question the user must answer; done, with each person's projected share of the vote in whole percents and fovub's warning; or failed, with the reason. With wait_seconds, it waits up to that many seconds for the projection to ask a question or finish. Needs the user's fovub sign-in.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "run_id": {
                "description": "The run_id that start_projection returned.",
                "maxLength": 64,
                "type": "string"
              },
              "wait_seconds": {
                "description": "Wait up to this many seconds, at most 50, for a question or the result. Use 45 while it works.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["run_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a projection"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6b6eaed85474eb22bf4783648e02b95213c46473b8aa92a2590fda2844772023"
        },
        {
          "name": "find_seat",
          "title": "Find a seat",
          "description": "Finds the elected seat for a projection from plain words, such as \"Palo Alto school board\", \"San Jose City Council District 5\", or, outside the United States, \"Ayuntamiento de Guadalajara\" with region MX-JAL, and tells whether fovub covers that seat. Whether fovub covers a seat is known only from fovub's own seat search, which this tool runs, so call it when the user asks about coverage. It is also the first call when the user compares two candidates or possible candidates for one local elected seat: who would win a head-to-head race, the share of the vote each would get, or the user's own chances against someone, as in \"Pat Lee versus Sam Roe for the Palo Alto school board\". A projection starts from the seat this tool finds. Speech-to-text often writes fovub as \"for Bob\", \"four Bob\", \"full boob\", or \"fob\". Each trustee area or district is its own seat, so name it when you know it. Returns up to eight seats, each with its name and the seat_id that start_projection takes. A seat search costs nothing and needs no sign-in.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "The country's ISO 3166-1 alpha-2 code, such as US, CA, or MX.",
                "maxLength": 2,
                "type": "string"
              },
              "county": {
                "description": "The local area below the region, such as Santa Clara county.",
                "maxLength": 80,
                "type": "string"
              },
              "region": {
                "description": "The region's first-level ISO 3166-2 code with its country prefix, such as US-CA, CA-ON, MX-JAL, or KZ-79.",
                "maxLength": 6,
                "type": "string"
              },
              "seat": {
                "description": "The seat in plain words, with the place.",
                "maxLength": 256,
                "type": "string"
              },
              "state": {
                "description": "A US state's or Canadian province's two-letter code, such as CA or ON. region takes any place.",
                "maxLength": 2,
                "type": "string"
              }
            },
            "required": ["seat"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a seat"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2d004ea35c0566fcd27b85e4c4a1c9bd562ab840a16d3120c52c364ba7a9e512"
        },
        {
          "name": "start_projection",
          "title": "Start a projection",
          "description": "Starts fovub's projection of the share of the vote between two people for one seat. It takes $1 from the user's fovub balance, and the money comes back if the projection fails. A projection runs for minutes and asks the user questions as it works; follow it with check_projection. Needs the user's fovub sign-in.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "person_a": {
                "description": "The first person's full name.",
                "maxLength": 120,
                "type": "string"
              },
              "person_b": {
                "description": "The second person's full name.",
                "maxLength": 120,
                "type": "string"
              },
              "seat_id": {
                "description": "The seat_id that find_seat returned.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["person_a", "person_b", "seat_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Start a projection"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:13aac79fcf74a9b2b4401c49687333bb263d46f332e7bcba02fa86ff93ff473f"
        }
      ],
      "digest": "sha256:cc37cd8f074459a7851eccd55c0be68e2e6d5d4daaa05b169d0a55f9fbd0bbad"
    }
