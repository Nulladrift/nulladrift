{
  "lockfileVersion": 2,
  "subjects": {
    "com.shorttext/shorttext": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://shorttext.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "shorttext",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "shortText.com — paste short text, get a shareable URL. Use read_shorttext for any public or unlisted slug; create_shorttext needs a trusted-client bearer token.",
      "tools": [
        {
          "name": "create_shorttext",
          "description": "Create a new shortText and get a shareable shorttext.com URL back. Markdown is supported. Requires an API key in the request Authorization header (`Bearer st_live_…`, request one from api@shorttext.com) — without it, creation is rejected (reading stays open to everyone).",
          "inputSchema": {
            "properties": {
              "body": {
                "description": "The text content (Markdown supported, max 30,000 chars).",
                "type": "string"
              },
              "burnAfterRead": {
                "description": "Delete after the first view. Defaults to false.",
                "type": "boolean"
              },
              "expiry": {
                "description": "Defaults to \"never\".",
                "enum": ["never", "1h", "1d", "30d"],
                "type": "string"
              },
              "password": {
                "description": "Required when visibility is \"private\".",
                "type": "string"
              },
              "visibility": {
                "description": "Defaults to \"public\". \"private\" requires a password.",
                "enum": ["public", "unlisted", "private"],
                "type": "string"
              }
            },
            "required": ["body"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1ac40b2ecb57fb1b7ac36de8f1387ffe954c4b2c79d74efd657dddd1ab300c88"
        },
        {
          "name": "read_shorttext",
          "description": "Fetch a shortText by its slug (the id in a shorttext.com/{slug} URL). Returns the text body and metadata. Public and unlisted shortTexts are open; private ones need a password. Reading a burn-after-read shortText consumes it.",
          "inputSchema": {
            "properties": {
              "password": {
                "description": "Password — required only for private shortTexts.",
                "type": "string"
              },
              "slug": {
                "description": "The shortText slug, e.g. \"abc12345\".",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ae8906152ada84ecae75355390d2445599dec9b2c5f9c30c429c10a6f7168260"
        }
      ],
      "digest": "sha256:250f986e7de6bb25ee1b5f134526bad45cad41679c5b7699dcae93130e295d42"
    }
  }
}
