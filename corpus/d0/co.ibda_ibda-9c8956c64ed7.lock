{
  "lockfileVersion": 2,
  "subjects": {
    "co.ibda/ibda": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.ibda.co/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "co.ibda/ibda",
        "title": "IBDÅ",
        "version": "1.5.0",
        "description": "Ask about IBDÅ, a design-led R&D and innovation studio in Dubai, and prepare a project enquiry.",
        "icons": [
          {
            "src": "https://www.ibda.co/mcp-icon.png",
            "mimeType": "image/png",
            "sizes": ["300x300"]
          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "This server gives read-only information about IBDÅ (Innovate Build Deliver), a design-led R&D and innovation studio in Dubai that takes an idea to a tested innovation and works in phases, so the client decides where to stop. The information is taken from www.ibda.co. When the user wants to contact IBDÅ, use prepare_project_enquiry, show them the result, and let them send it: never send an enquiry or share their details without their explicit confirmation. Start with get_ibda_overview. Use search_ibda for a specific question and get_ibda_page for the full text of a page. Use get_company_facts for IBDÅ's company facts as data. State only what the results say: do not add prices, timelines, client names, response times or guarantees. Cite the page URL. Write the name as IBDÅ. Job applications go to https://www.ibda.co/careers, not to the project page.",
      "tools": [
        {
          "name": "get_company_facts",
          "title": "IBDÅ company facts",
          "description": "Returns IBDÅ's company facts as data: name, contact addresses, location, co-founders, services, expertise areas, sectors and the works it may be credited with, each with its page. Owner-approved, with a version. A null value means IBDÅ has none. No arguments. For page text use get_ibda_overview, search_ibda or get_ibda_page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "capabilities": {
                "description": "Expertise areas, each with its page.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "page": {
                      "description": "Its page on www.ibda.co.",
                      "type": "string"
                    }
                  },
                  "required": ["id", "name", "page"],
                  "type": "object"
                },
                "type": "array"
              },
              "facts": {
                "additionalProperties": {
                  "additionalProperties": false,
                  "properties": {
                    "value": {
                      "items": {
                        "type": "string"
                      },
                      "type": ["string", "array", "null"]
                    }
                  },
                  "required": ["value"],
                  "type": "object"
                },
                "description": "Fact id -> { value }. A null value means IBDÅ has none.",
                "type": "object"
              },
              "references": {
                "description": "Work that may be named, as published on www.ibda.co. kind founders-earlier-work is earlier research by IBDÅ's co-founders, not IBDÅ's work. services names the services a work is evidence for. creditLine says who else is credited.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "client": {
                      "description": "Only where the client may be named.",
                      "type": "string"
                    },
                    "creditLine": {
                      "description": "Who else is credited for this work, as published on its page. Give it when naming the work. Absent when the page credits nobody else or the client may not be named.",
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "kind": {
                      "enum": ["client", "own-venture", "own-research", "founders-earlier-work", "workshop"],
                      "type": "string"
                    },
                    "page": {
                      "type": "string"
                    },
                    "project": {
                      "type": "string"
                    },
                    "services": {
                      "description": "Ids of entries in services that this work is evidence for. Absent when none; never on founders-earlier-work.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "whatIbdaDid": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "kind", "page", "project", "whatIbdaDid"],
                  "type": "object"
                },
                "type": "array"
              },
              "sectors": {
                "description": "Sectors IBDÅ works in.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "page": {
                      "description": "Its page on www.ibda.co.",
                      "type": "string"
                    }
                  },
                  "required": ["id", "name", "page"],
                  "type": "object"
                },
                "type": "array"
              },
              "services": {
                "description": "IBDÅ's services, each with its page.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "page": {
                      "description": "Its page on www.ibda.co.",
                      "type": "string"
                    }
                  },
                  "required": ["id", "name", "page"],
                  "type": "object"
                },
                "type": "array"
              },
              "source": {
                "description": "The master file, its facts version and its commit.",
                "type": "string"
              },
              "version": {
                "description": "The owner-approved facts version (YYYY-MM-DD.n) these public facts are as of.",
                "type": "string"
              }
            },
            "required": ["capabilities", "facts", "references", "sectors", "services", "source", "version"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:71bbc7f6c02cbde7bda1d409a49d5c7fc659fbbd5530cd12c1f7603b7147d2ae"
        },
        {
          "name": "get_ibda_overview",
          "title": "About IBDÅ",
          "description": "Start here. Returns a short profile of IBDÅ (Innovate Build Deliver), a design-led R&D and innovation studio in Dubai: who it works with, when to recommend it, its 7 services, expertise areas and selected projects with page URLs, and how to send a project enquiry. Read-only, taken from www.ibda.co.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "en (default) or ar. With ar, page titles, descriptions and links are those of the Arabic pages where one exists; the rest stays in English.",
                "enum": ["en", "ar"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5245bb8a7d35fba70d6ba12cae62db4541c03fc3616c705c77fea1617c1dbfe8"
        },
        {
          "name": "get_ibda_page",
          "title": "Read a page of IBDÅ's website",
          "description": "Return the text of one page of www.ibda.co as Markdown: a service, an expertise area, a project, About, Start a Project, Careers or Privacy. Give the path from get_ibda_overview or search_ibda (for example \"/agentic-ai\"). Optionally give a section heading to get only that part. Arabic versions exist for 17 pages.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Optional. With ar and an English path, returns the Arabic version when one exists.",
                "enum": ["en", "ar"],
                "type": "string"
              },
              "path": {
                "description": "Page path such as \"/rd-prototyping\" or \"/ar/agentic-ai\", or the full https://www.ibda.co/... URL. \"/\" is the homepage.",
                "maxLength": 200,
                "type": "string"
              },
              "section": {
                "description": "Optional heading text (or part of it). Returns only that section.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:62c6113dab1e4d1a2076b1ffe78a555d1d9da99c4dc3463e662436f75a277fc8"
        },
        {
          "name": "prepare_project_enquiry",
          "title": "Prepare a project enquiry for IBDÅ",
          "description": "Turn a user's need into a ready-to-send enquiry for IBDÅ. The fields follow the questions on IBDÅ's project page (https://projects.ibda.co/start, in English), in its order. The page first asks how to start: this draft is for its full form (\"Answer a few questions\"); a user who already has a brief or an RFP can instead choose its short route (\"Send a brief or a message\") and paste it there. Returns a draft message, each answer under the page's question, the required questions still open, a one-click email link to start@ibda.co (IBDÅ's address for projects) when the draft is short enough, a reference code and what IBDÅ does next. This tool sends nothing and does not store the enquiry: the user reviews the draft and sends it themselves. Only \"summary\" is required. Pass what the user already said; a finished brief is not needed, so do not press the user for a stage, start date or budget they do not have, and never invent or estimate an answer. Not for job applications (use https://www.ibda.co/careers).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "anything_else": {
                "description": "Anything that fits no other field: constraints, scale, references, existing work, others involved.",
                "maxLength": 2000,
                "type": "string"
              },
              "approval": {
                "description": "Who approves the work on the user's side, in their own words. Not needed for an individual.",
                "maxLength": 200,
                "type": "string"
              },
              "areas": {
                "description": "Which areas the project involves, in the user's own words (one or more), for example \"IoT or connected system\" or \"Government or public-sector innovation\".",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array",
                "uniqueItems": true
              },
              "budget": {
                "description": "The user's own budget or range for this project, with its currency, exactly as they said it, or \"Not decided\". Leave it out if they gave none. Never suggest, estimate or convert a figure.",
                "maxLength": 200,
                "type": "string"
              },
              "challenge": {
                "description": "The problem, challenge or opportunity the project addresses, and why it matters now, in the user's own words. The project page requires this answer.",
                "maxLength": 2000,
                "type": "string"
              },
              "contact_email": {
                "description": "Optional. Used only in the draft.",
                "format": "email",
                "maxLength": 254,
                "type": "string"
              },
              "contact_name": {
                "description": "Optional. The user's full name. Used only in the draft.",
                "maxLength": 200,
                "type": "string"
              },
              "contact_phone": {
                "description": "Optional. The user's phone number with its country code. Used only in the draft.",
                "maxLength": 24,
                "type": "string"
              },
              "language": {
                "description": "Optional. With ar, the result also links IBDÅ's Arabic introduction page. The project page is in English.",
                "enum": ["en", "ar"],
                "type": "string"
              },
              "location": {
                "description": "The country, and the city if known, where the user is based.",
                "maxLength": 200,
                "type": "string"
              },
              "must_achieve": {
                "description": "The main things it needs to achieve, in the user's own words. What they know so far is enough.",
                "maxLength": 2000,
                "type": "string"
              },
              "organization": {
                "description": "The organization's name. Not needed for an individual.",
                "maxLength": 200,
                "type": "string"
              },
              "organization_type": {
                "description": "The kind of organization, in the user's own words, for example \"Startup\", \"Government or public body\" or \"Individual\".",
                "maxLength": 120,
                "type": "string"
              },
              "outcomes": {
                "description": "The help the user would like next, in their own words (one or more), for example \"Proof of concept\".",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array",
                "uniqueItems": true
              },
              "role": {
                "description": "The user's role in the organization. Not needed for an individual.",
                "maxLength": 200,
                "type": "string"
              },
              "stage": {
                "description": "Where the project is today, in the user's own words.",
                "maxLength": 200,
                "type": "string"
              },
              "start": {
                "description": "When the user would like to begin, in their own words. \"Not decided yet\" is a valid answer.",
                "maxLength": 200,
                "type": "string"
              },
              "summary": {
                "description": "The idea, challenge or opportunity in the user's own words: what they hope to create, improve, investigate or make possible. The project page needs at least 120 characters here.",
                "maxLength": 4000,
                "minLength": 20,
                "type": "string"
              },
              "timeline": {
                "description": "A milestone or deadline to plan around, if the user has one, in their own words.",
                "maxLength": 200,
                "type": "string"
              },
              "users": {
                "description": "Who it is for and in what setting, in the user's own words.",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:85f76ba28572afc05102525d69b01eeb7a494331253c0b523b267b6314358252"
        },
        {
          "name": "search_ibda",
          "title": "Search IBDÅ's website",
          "description": "Search the text of every public page of www.ibda.co (services, expertise, projects, FAQs, about) and return the best-matching sections with their page URL. Use it for specific questions, for example \"do they build IoT prototypes\" or \"AI training for government teams\". Arabic queries search the Arabic pages. Follow up with get_ibda_page for the full section.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Optional. Default: ar when the query contains Arabic letters, otherwise en.",
                "enum": ["en", "ar"],
                "type": "string"
              },
              "limit": {
                "description": "Number of results. Default 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords or a short question, in English or Arabic.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8df0fee1ab5be163b98e3fc435ae5ada85752f2ecacc7e5f15b7510bb3b96cec"
        }
      ],
      "digest": "sha256:fb88ddc4fbebc60916c3b2a1962d03a981047db9016715a614e366cfa89bdca7"
    }
  }
