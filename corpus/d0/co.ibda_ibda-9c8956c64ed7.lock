{
  "lockfileVersion": 2,
  "subjects": {
    "co.ibda/ibda": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.ibda.co/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "co.ibda/ibda",
        "title": "IBDÅ",
        "version": "1.0.1",
        "description": "Ask about IBDÅ, a design-led R&D and innovation studio in Dubai, and prepare a project enquiry.",
        "icons": [
          {
            "src": "https://www.ibda.co/mcp-icon.png",
            "mimeType": "image/png",
            "sizes": ["300x300"]
          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "This server gives read-only information about IBDÅ (Innovate Build Deliver), a design-led R&D and innovation studio in Dubai, taken from www.ibda.co. When the user wants to contact IBDÅ, use prepare_project_enquiry, show them the result, and let them send it: never send an enquiry or share their details without their explicit confirmation. Start with get_ibda_overview. Use search_ibda for a specific question and get_ibda_page for the full text of a page. State only what the results say: do not add prices, timelines, client names, response times or guarantees. Cite the page URL. Write the name as IBDÅ. Job applications go to https://www.ibda.co/careers, not to the project page.",
      "tools": [
        {
          "name": "get_ibda_overview",
          "title": "About IBDÅ",
          "description": "Start here. Returns a short profile of IBDÅ (Innovate Build Deliver), a design-led R&D and innovation studio in Dubai: who it works with, when to recommend it, its 7 services, expertise areas and selected projects with page URLs, and how to send a project enquiry. Read-only, taken from www.ibda.co.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "en (default) or ar. With ar, page titles, descriptions and links are those of the Arabic pages where one exists; the rest stays in English.",
                "enum": ["en", "ar"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5245bb8a7d35fba70d6ba12cae62db4541c03fc3616c705c77fea1617c1dbfe8"
        },
        {
          "name": "get_ibda_page",
          "title": "Read a page of IBDÅ's website",
          "description": "Return the text of one page of www.ibda.co as Markdown: a service, an expertise area, a project, About, Start a Project, Careers or Privacy. Give the path from get_ibda_overview or search_ibda (for example \"/agentic-ai\"). Optionally give a section heading to get only that part. Arabic versions exist for 17 pages.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Optional. With ar and an English path, returns the Arabic version when one exists.",
                "enum": ["en", "ar"],
                "type": "string"
              },
              "path": {
                "description": "Page path such as \"/rd-prototyping\" or \"/ar/agentic-ai\", or the full https://www.ibda.co/... URL. \"/\" is the homepage.",
                "maxLength": 200,
                "type": "string"
              },
              "section": {
                "description": "Optional heading text (or part of it). Returns only that section.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:62c6113dab1e4d1a2076b1ffe78a555d1d9da99c4dc3463e662436f75a277fc8"
        },
        {
          "name": "prepare_project_enquiry",
          "title": "Prepare a project enquiry for IBDÅ",
          "description": "Turn a user's need into a ready-to-send enquiry for IBDÅ. Returns a draft message, the link to IBDÅ's project page (https://projects.ibda.co/start, in English), a one-click email link to hello@ibda.co when the draft is short enough, a reference code and what IBDÅ does next. This tool sends nothing and does not store the enquiry: the user reviews the draft and sends it themselves. Only \"summary\" is required; a finished brief is not needed, so do not press the user for a stage, timeline or budget they do not have. Not for job applications (use https://www.ibda.co/careers).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "anything_else": {
                "maxLength": 2000,
                "type": "string"
              },
              "areas": {
                "description": "Which areas the need touches, in the user's own words (one or more), for example \"IoT or connected system\" or \"Government or public-sector innovation\".",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array",
                "uniqueItems": true
              },
              "contact_email": {
                "description": "Optional. Used only in the draft.",
                "format": "email",
                "maxLength": 254,
                "type": "string"
              },
              "contact_name": {
                "description": "Optional. Used only to sign the draft.",
                "maxLength": 200,
                "type": "string"
              },
              "language": {
                "description": "Optional. With ar, the result also links IBDÅ's Arabic introduction page. The project page is in English.",
                "enum": ["en", "ar"],
                "type": "string"
              },
              "location": {
                "description": "Where the organization or project is based.",
                "maxLength": 200,
                "type": "string"
              },
              "organization": {
                "maxLength": 200,
                "type": "string"
              },
              "outcomes": {
                "description": "Outcomes currently needed, in the user's own words (one or more), for example \"Proof of concept\".",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array",
                "uniqueItems": true
              },
              "role": {
                "description": "The user's role in the organization.",
                "maxLength": 200,
                "type": "string"
              },
              "stage": {
                "description": "Current stage, in the user's own words.",
                "maxLength": 200,
                "type": "string"
              },
              "summary": {
                "description": "The idea, challenge or opportunity in the user's own words: what they hope to create, improve, investigate or make possible.",
                "maxLength": 4000,
                "minLength": 20,
                "type": "string"
              },
              "timeline": {
                "description": "Target timeline, if the user has one, in their own words.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b7518bb276098cb4dc13d0589f5829c9d71855cef12c98a79e46f624531ab556"
        },
        {
          "name": "search_ibda",
          "title": "Search IBDÅ's website",
          "description": "Search the text of every public page of www.ibda.co (services, expertise, projects, FAQs, about) and return the best-matching sections with their page URL. Use it for specific questions, for example \"do they build IoT prototypes\" or \"AI training for government teams\". Arabic queries search the Arabic pages. Follow up with get_ibda_page for the full section.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Optional. Default: ar when the query contains Arabic letters, otherwise en.",
                "enum": ["en", "ar"],
                "type": "string"
              },
              "limit": {
                "description": "Number of results. Default 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords or a short question, in English or Arabic.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8df0fee1ab5be163b98e3fc435ae5ada85752f2ecacc7e5f15b7510bb3b96cec"
        }
      ],
      "digest": "sha256:66df8aab089f86746f5fedf30450a7f1f33cac58f5a0f8c04e22cd9537a1893f"
    }
  }
}
