          },
          "digest": "sha256:166afcda48da2df45aa6d30ab17069ea36cbb1707122eb6f9989b606b5fa0502"
        },
        {
          "name": "schedule_changes",
          "description": "有時程變更的作品（延期、提前、換發行商），每次變更附來源。",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
