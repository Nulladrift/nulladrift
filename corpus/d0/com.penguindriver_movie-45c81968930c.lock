            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7208fdd4276a7b5f2448dcdaa08a63d593623525e45b75906c2ddc603137b68d"
        },
        {
          "name": "upcoming_showtimes_in_city",
          "description": "某城市今天接下來即將開演的電影場次，依開演時間排序（最多 80 筆）。",
          "inputSchema": {
            "properties": {
              "city": {
