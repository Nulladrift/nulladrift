          },
          "digest": "sha256:862db074bf10a47efa5132a1c66d14d1fb331daa2620572728369dfea7087f80"
        },
        {
          "name": "release_countdown",
          "description": "距離作品上映或開播還有幾天（預設復仇者聯盟：末日崛起）。",
          "inputSchema": {
            "properties": {
              "q": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
