{
  "lockfileVersion": 2,
  "subjects": {
    "com.penguindriver/movie": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://movie.penguindriver.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "tw-screen-release",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "電影、影集、動畫上映日資料庫（繁體中文）：首次公開日、預定與確定上映日、改期紀錄、官方預告片與新聞，每筆附來源；另可用 Wikidata 查任何作品。",
      "tools": [
        {
          "name": "get_cinema_showtimes",
          "description": "查某家電影院某天的電影場次時刻表（片名、版本、開演時間）。id 請用 list_cinemas 回傳的 live 欄位。",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "日期 YYYY-MM-DD，預設今天",
                "type": "string"
              },
              "id": {
                "description": "影城 live 代碼，例：miramar、st-91",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7ad62f0002b38d9b92d08c999667330f061e0a0d7f92b39b4af96c28fd024bfa"
        },
        {
          "name": "get_title",
          "description": "查單一作品：製作、發行平台、導演、首次公開日、上映時程與改期紀錄、初公開與最新官方預告、官方新聞；中文、英文、日文片名皆可（如 沙丘3、Avengers Doomsday、薬屋のひとりごと）。",
          "inputSchema": {
            "properties": {
              "q": {
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2a70b9ed7b7bfa8df48bc2c3989b2ed1a15496513d763667138e763db24e28a7"
        },
        {
          "name": "list_cinemas",
          "description": "台灣電影院清單：影城名稱、連鎖、城市、地址；live 欄位不為空的影城可查線上場次。",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "城市篩選，例：台北市、高雄市",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6092bf826a7b0643707b702aaed7361d0dbbf8c37d0b647bc2f8bc08df4d5eea"
        },
        {
          "name": "list_titles",
          "description": "列出 2026–2027 重點電影、影集、動畫、劇場版，含首次公開日、上映日、平台、狀態；可依類型、平台、狀態、日期篩選。",
          "inputSchema": {
            "properties": {
              "from": {
                "type": "string"
              },
              "platform": {
                "type": "string"
              },
              "status": {
                "enum": ["confirmed", "window", "tba", "released"],
                "type": "string"
              },
              "to": {
                "type": "string"
              },
              "type": {
                "enum": ["film", "series", "anime-series", "anime-film"],
                "type": "string"
              },
              "upcoming": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fc44777b0dc7e7ee3274aa940ab143e4ca168a8ed0f99782ac216a6f00a4a160"
        },
        {
          "name": "lookup_any_title",
          "description": "用 Wikidata 公開資料查任何電影、影集、動畫的上映日、導演、製作公司、播出平台、官方網站與 YouTube 影片。",
          "inputSchema": {
            "properties": {
              "q": {
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:254d489a3169340c81d215f0a883783e1b3a41d9a0124c4c9af9563eb86d4513"
        },
        {
          "name": "release_calendar",
          "description": "依月份的上映與開播行事曆，以及只公布時期、未定的作品。",
          "inputSchema": {
            "properties": {
              "month": {
                "description": "YYYY-MM",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
