              "hasTranslationSpecialSeal": {
                "description": "Whether every translated page bears the dedicated PSB-registered Translation Special Seal (翻译专用章).",
                "type": "boolean"
              },
              "targetCity": {
                "description": "Municipal SAFEA bureau reviewing the foreign documents and potential e-Apostille/RON seal.",
                "enum": ["shanghai", "beijing", "shenzhen_guangzhou", "tier2_other", "all"],
                "type": "string"
              },
              "translatorCountry": {
                "description": "Where the Chinese translator operates: registered mainland agency, foreign bureau, or applicant self-translation.",
