          "title": "U.S. Federal USDOS vs State Secretary of State Apostille Matcher",
          "description": "Prevent automatic Chinese work permit rejection by matching U.S. FBI checks, university diplomas, TEFL certificates, or state police clearances to USDOS or 10 state Secretaries of State with RON rules.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "docCategory": {
                "description": "United States credential type requiring Apostille authentication for China Z-visa filing.",
                "enum": ["fbi-check", "degree", "state-police", "tefl"],
                "type": "string"
              },
              "notaryMethod": {
                "description": "Notarization workflow: traditional wet-ink in-person notary vs Remote Online Notarization (RON).",
                "enum": ["in-person", "ron"],
                "type": "string"
              },
              "stateCode": {
                "description": "Two-letter U.S. state code where the university or state agency is registered (ignored for federal FBI checks).",
                "enum": ["CA", "NY", "TX", "FL", "WA", "IL", "PA", "MA", "VA", "GA"],
                "type": "string"
