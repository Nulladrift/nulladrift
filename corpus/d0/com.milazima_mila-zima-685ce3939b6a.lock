      },
      "instructions": "Read-only facts about Mila Zima, an AI pop star: how she looks, the rules for making pictures, clips and songs of her, her songs, films and pictures. Call get_character and get_rules before you generate anything. Every picture or clip of her must say it is made with AI. Fan use is free; commercial use needs written permission.",
      "tools": [
        {
          "name": "build_prompt",
          "title": "Build a prompt for a picture, clip or song",
          "description": "Returns a ready prompt with her fixed description filled in, the reference pictures to attach and how to use it. It only writes text; it does not generate anything.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "clothes": {
                "description": "What she wears. Leave empty for clothes that suit the place.",
                "type": "string"
              },
              "hair": {
                "description": "Hair style. Colour, length and wave never change.",
                "enum": ["down", "tied_back", "ponytail", "one_braid", "two_braids", "bun", "half_up", "scarf", "clip"],
                "type": "string"
              },
              "kind": {
                "description": "still = a picture, with her reference picture attached (the way to get her face); full_length = head to toe, with two reference pictures; clip = five-second image-to-video take; song = style text for a music model; still_text_only = no reference picture: gives a lookalike only, not her.",
                "enum": ["still", "still_text_only", "full_length", "clip", "song"],
                "type": "string"
              },
              "scene": {
                "description": "What she is doing and where, in plain words. Example: \"tunes a guitar on a hotel bed in the late afternoon\".",
                "type": "string"
              }
            },
            "required": ["kind", "scene"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Build a prompt for a picture, clip or song"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:76077af2f33d64d623ea5d194b69833ed08471f673fe331f756e3d3277351aa3"
        },
        {
          "name": "check_prompt",
          "title": "Check a prompt against her rules",
          "description": "Finds words and scenes that break her rules or pull the picture away from her look.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "text": {
                "description": "The prompt to check.",
                "type": "string"
              }
            },
            "required": ["text"],
