      "serverInfo": {
        "name": "creator-validator",
        "title": "Creator Validator by SoniaIA",
        "version": "0.1.0",
        "websiteUrl": "https://www.soniaia.com/tools/creator-validator"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
