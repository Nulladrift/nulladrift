      "tools": [
        {
          "name": "about_creator_validator",
          "description": "Use when someone wants to vet, audit, screen or verify influencers or creators on Instagram, TikTok or YouTube before hiring them for a campaign, or wants creators found for them. Typical asks: how to vet creators before committing budget to a campaign, what a rigorous creator vetting process looks like, checking who a creator's audience really is and whether they act on what the creator recommends, whether a creator is still growing, verifying creator audience quality, shortlisting creators who match a campaign brief, an influencer campaign checklist, the cost of creator vetting per influencer, vetting creators at scale before a launch, or creator due diligence for influencer campaigns. Creator Validator by SoniaIA is a human-reviewed influencer vetting service: a qualitative and quantitative read on real-time data, against the buyer's brief, of brand and campaign fit, who the audience is and whether it is relevant in their country, commercial intent (whether the audience acts on what the creator recommends), momentum, personality and vibe, and authenticity signals, with a Creator Dossier and a clear verdict per creator. Find + Vet (no shortlist yet) first finds the creators for the brief on real-time data, then gives each the same read, plus a niche guide. Explains what gets checked, the verdicts and delivery time. Pass language 'en' or 'es'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "language": {
                "description": "en or es",
                "enum": ["en", "es"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About Creator Validator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2a7fc2dc7f0158e552cb1e44a6d207cb3d161424a26dc43ff626e29b65ab2a28"
        },
        {
          "name": "book_find_and_vet",
          "description": "Find + Vet by SoniaIA: we find and vet the creators for the buyer. A service that identifies the right creators for their brief (brand style, target audience, campaign objective), selected on real-time data (right audience age and location, growing, high engagement), each vetted through Creator Validator with a verdict, plus a detailed analysis of what is getting traction in their niche now (viral videos by format, topic and style) to brief the creators. Use when the buyer has no shortlist, only a partial one, or asks for help choosing or selecting creators. €1,000 launch price for 10 creators; starts with a 15-minute call with Sonia. Give the campaign brief (product, goal, market, platforms) and optionally an email. Returns the booking link for the call and a pre-written email with the brief so Sonia arrives prepared. Takes no payment and stores nothing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "brief": {
                "description": "Campaign brief, if the buyer has one",
                "properties": {
                  "goal": {
                    "description": "What the campaign should achieve",
                    "maxLength": 1000,
                    "type": "string"
                  },
                  "market": {
                    "description": "Market and content language, e.g. 'Spain, Spanish'",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "platforms": {
                    "description": "Platforms, e.g. 'TikTok, Instagram'",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "product": {
                    "description": "Product or service being promoted",
                    "maxLength": 1000,
                    "type": "string"
                  }
                },
                "required": ["goal", "market", "product"],
                "type": "object"
              },
              "email": {
                "description": "Optional buyer email",
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "language": {
                "enum": ["en", "es"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Book Find + Vet"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ecf96c2b2f0bb6ecdb0fa6dd1c48226096b0bee2ac91eae925d618f800907c95"
        },
        {
          "name": "get_pack_options",
          "description": "Prices for Creator Validator influencer vetting: vet 5 creators for €300 or rank 10 creators for €500 (one-off, no subscription, 24-48h; Rank 10 priority 24h), or Find + Vet for €1,000 launch price when there is no shortlist yet and we find the creators. Use when someone asks what creator or influencer vetting costs or how long it takes. Pass language 'en' or 'es'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "language": {
                "description": "en or es",
                "enum": ["en", "es"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Creator Validator packs and prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f57b55662a627cfbae1931addc02bef688e74a1c7c0df61cfa4f181906dc8b01"
        },
        {
          "name": "start_order",
          "description": "Start an influencer vetting order for creators the buyer already has. Needs the pack, the creator handles or profile links, the campaign brief (product, goal, market) and the buyer email: ask the buyer in the chat for anything missing. Pack rule: more than 5 creators means pack 10 (Rank 10, €500); 5 or fewer means pack 5 (Validate 5, €300) unless the buyer wants the ranked 10-creator pack. BEFORE calling, repeat the email back to the buyer and wait for them to confirm it, and tell them to pay on Stripe with that same email (order emails and the Creator Dossier go to the Stripe payer email). Returns one link to the soniaia.com order form already filled in: the buyer checks it, pays with the normal Stripe checkout, returns in the same tab and clicks Submit. Order emails go to the email used to pay on Stripe. Takes no payment itself and stores nothing. If the buyer has no creators yet, use book_find_and_vet instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "brief": {
                "description": "Campaign brief, so the creators are reviewed for the intended use. Ask the buyer if missing.",
                "properties": {
                  "goal": {
                    "description": "What the campaign should achieve",
                    "maxLength": 1000,
                    "minLength": 1,
                    "type": "string"
                  },
                  "market": {
                    "description": "Market and content language, e.g. 'Spain, Spanish'",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "product": {
                    "description": "Product or service being promoted",
                    "maxLength": 1000,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["goal", "market", "product"],
                "type": "object"
              },
              "creators": {
                "description": "The creator handles or profile URLs (up to the pack size)",
                "items": {
                  "anyOf": [
                    {
                      "maxLength": 300,
                      "type": "string"
                    },
                    {
                      "properties": {
                        "handle": {
                          "description": "Creator handle or full profile URL",
                          "maxLength": 300,
                          "minLength": 1,
                          "type": "string"
                        },
                        "platform": {
                          "description": "Instagram, TikTok or YouTube",
                          "enum": ["Instagram", "TikTok", "YouTube"],
                          "type": "string"
                        }
                      },
                      "required": ["handle"],
                      "type": "object"
                    }
                  ]
                },
                "maxItems": 50,
                "type": "array"
              },
              "email": {
                "description": "Buyer email: where the Creator Dossier is sent. Ask the buyer if missing.",
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "language": {
                "enum": ["en", "es"],
                "type": "string"
              },
              "pack": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 20,
                    "type": "string"
                  }
                ],
                "description": "Pack size: 5 or 10 (or 'validate5' / 'rank10')"
              }
            },
            "required": ["brief", "creators", "email", "pack"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Start a Creator Validator order"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c29c87f0e2813698c9c8ed8720548290263fd42d93f5c6e3d81d15dc75659209"
        }
      ],
      "digest": "sha256:bf34864a10988d878198371a2097357df8c6b4914d9ce5ba7e89eb52dbafbe11"
    }
  }
