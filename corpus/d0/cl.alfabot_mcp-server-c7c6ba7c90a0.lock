{
  "lockfileVersion": 2,
  "subjects": {
    "cl.alfabot/mcp-server": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://alfabot.cl/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "alfabot-web",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "book_meeting",
          "title": "Agendar reunion",
          "description": "Agenda una reunion de 30 minutos con Alfabot en un horario obtenido con check_availability. Requiere que el cliente MCP haya enviado un header Authorization: Bearer <token> (scope meeting:book) en la request a /mcp; ver /auth.md.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "company": {
                "description": "Colegio o empresa (opcional)",
                "type": "string"
              },
              "email": {
                "format": "email",
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "endsAt": {
                "description": "ISO 8601, exactamente 30 minutos despues de startsAt",
                "type": "string"
              },
              "name": {
                "description": "Nombre completo de quien agenda",
                "minLength": 1,
                "type": "string"
              },
              "notes": {
                "description": "Contexto breve de la reunion (opcional)",
                "type": "string"
              },
              "startsAt": {
                "description": "ISO 8601, debe ser un horario devuelto por check_availability",
                "type": "string"
              }
            },
            "required": ["email", "endsAt", "name", "startsAt"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f2bcb103a149fae1e25d0a44415b1ea5fbd88cfb63d6acd98ccc18387cab2f12"
        },
        {
          "name": "check_availability",
          "title": "Consultar disponibilidad para reunion",
          "description": "Consulta horarios disponibles para agendar una reunion de 30 minutos con Alfabot. Usar el resultado (no inventar horarios) antes de llamar a book_meeting.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "days": {
                "description": "Cantidad de dias hacia adelante a consultar",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e601bddc46da648aa79fee721f646e3247eee5003543481baec0eff5369daa7f"
        },
        {
          "name": "get_plans",
          "title": "Consultar planes",
          "description": "Consulta los planes disponibles de un producto Alfabot para colegios. El pricing esta en validacion con los primeros clientes y no se publica: displayPrice viene vacio a proposito, no inventar montos.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "default": "es",
                "enum": ["es", "en"],
                "type": "string"
              },
              "product": {
                "description": "Codigo del producto. Si se omite, devuelve el catalogo global de planes.",
                "enum": ["brochure-autoservicio", "brochure-avisos-automaticos", "brochure-asistente-paes", "brochure-apps-moviles", "brochure-whatsapp-ventas-postventa"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d9c9bd588f3ae7ee4a42900f8addff2f730ef25ca32f274d20d8d024531827a8"
        }
      ],
      "digest": "sha256:1c0ea9193d6ced20a04ed073639d1b6111e7ec08abf6ca333700587a8550e23e"
    }
  }
}
