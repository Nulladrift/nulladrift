      "capabilities": {
        "tools": {}
      },
      "instructions": "Kennmarq.com marks AI-generated images, video and audio: an invisible watermark and signed, time-stamped C2PA Content Credentials, plus a visible \"AI\" label or a spoken notice where a law needs one, through its API (POST https://api.kennmarq.com/v1/mark). It marks 3D models (metadata, and Content Credentials in a sidecar file) and text (a visible notice, and Content Credentials inside it) too. These tools are for building that marking into an app's code, and are relevant when an app generates or edits images, video, audio, 3D models or text with AI:\n- get_requirements: what the AI-labelling laws of given markets (the EU AI Act's Article 50, California's AI Transparency Act, South Korea, India and other countries) ask of a file, and what each call must send;\n- get_integration: the code for a stack (Vercel AI SDK, JavaScript, Python, ComfyUI, HTTP), with the package to install;\n- read_doc: any Kennmarq.com docs page as Markdown.\nThe tools read public information and need no key. The app itself calls the API with a key in KENNMARQ_API_KEY, on its server.",
      "tools": [
        {
          "name": "get_integration",
          "title": "Code to mark AI media, per stack",
          "description": "How to add Kennmarq.com marking to an app's code: the package to install, a server-side example that marks each generated file before it's stored or shown, the fields to send, the API key and how to check the result. Stacks: ai-sdk (Vercel AI SDK middleware), javascript (Node.js, Next.js, Bun, Deno, edge), python, comfyui, http (any other language).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "stack": {
                "description": "The app's stack.",
                "enum": ["ai-sdk", "javascript", "python", "comfyui", "http"],
                "type": "string"
              }
            },
            "required": ["stack"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Code to mark AI media, per stack"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3599c1f3161924efc43634d573cb7b33d8fa750e4c6c4747634c0cd9f4429501"
        },
        {
          "name": "get_requirements",
          "title": "AI-labelling rules for markets",
          "description": "What the AI-labelling laws of the given markets ask of an AI-generated image, video, audio file, 3D model or text, and what a call to POST /v1/mark must send for them: the fields required, whether the visible label is needed, and what can't be marked yet. Answers from the rules the API itself enforces, and lists each market's other rules as the law map does (rules for some sectors only, drafts), with what our marks cover of each and links to the government texts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "deepfake": {
                "description": "Whether the files realistically depict real people, places or events (deep fakes). Default false.",
                "type": "boolean"
              },
              "markets": {
                "description": "The countries the app serves, comma-separated, at most 8 (\"us\" counts as 3): ISO codes (de, jp, br), \"eu\", US states (us-ca) or \"us\" for California, Washington and Utah (us-ca, us-wa, us-ut), which doesn't cover the other states' rules yet. Profiles: eu, us-ca, us-wa, us-ut, kr, in.",
                "type": "string"
              },
              "media": {
                "description": "The kind of file the app generates.",
                "enum": ["image", "video", "audio", "text", "3d"],
                "type": "string"
              },
              "public_interest": {
                "description": "Text only: published to inform the public on matters of public interest, with no human review (the EU AI Act's Art. 50(4)). Default false.",
                "type": "boolean"
              }
            },
            "required": ["markets", "media"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "AI-labelling rules for markets"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:14e59a200efc1335bed0920887ca358a70218ef8000a5675b945e6b09aa45f79"
        },
        {
          "name": "read_doc",
          "title": "Read a Kennmarq.com docs page",
          "description": "A Kennmarq.com documentation page as Markdown: the API reference, the guides, the SDKs and the laws pages. The index of every page, with one line each: https://kennmarq.com/llms.txt.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "path": {
