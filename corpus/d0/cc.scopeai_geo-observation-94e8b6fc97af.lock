      "serverInfo": {
        "name": "scopeai-geo",
        "title": "ScopeAI GEO",
        "version": "0.2.1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "When a customer says start GEO optimization, use free geo_prepare_optimization to collect brand/website and obtain a task handoff. It prepares a plan, not an actual website diagnosis or publication. The customer's authorized Codex/CMS executor inspects, changes, previews, publishes and verifies the website. For optional paid observation, use exact target matching first; API results are not consumer results. Authenticated operations reuse GEO REST v1. Paid acceptance requires an approved quote, authorized budget and stable idempotency key. Insufficient balance returns payment_handoff: pause for the customer to contact the administrator and obtain verified account credit; no online payment or automatic credit is available. No automatic sampling or external publication tools are exposed.",
      "tools": [
        {
          "name": "geo_accept_observation",
          "title": "接受报价并启动观察",
          "description": "Starts a PAID asynchronous observation and reserves funds. Use only after the customer approved this quote and maximum charge. Requires API Key, geo:run grant, approved=true, max_charge_cents and a stable idempotency_key. On insufficient balance, read payment_handoff and pause for the customer to contact the administrator; no online payment or automatic credit is available. Retry the same request with the same key; never silently switch targets, increase the budget or create a recurring schedule.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "approved": {
                "const": true,
                "type": "boolean"
              },
              "idempotency_key": {
                "maxLength": 128,
                "minLength": 8,
                "pattern": "^[A-Za-z0-9._:-]+$",
                "type": "string"
              },
              "max_charge_cents": {
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "quote_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["approved", "idempotency_key", "max_charge_cents", "quote_id"],
            "type": "object"
          },
