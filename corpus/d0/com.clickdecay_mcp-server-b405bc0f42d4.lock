        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "clickdecay",
        "title": "Click Decay",
        "version": "1.0.0",
        "websiteUrl": "https://clickdecay.com/mcp-server/"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Click Decay calculates CTR changes from Search Console totals that the user provides. Every number carries an evidence label: observed (arithmetic on the provided numbers), calculated (exact decomposition), modelled (depends on an assumed CTR) or not_established. Results do not establish why clicks or CTR changed, including whether AI Overviews caused it. For dates affected by known Search Console reporting issues, impression-based figures are withheld.",
      "tools": [
        {
          "name": "check_gsc_reporting_issues",
          "title": "Check known Search Console reporting issues",
          "description": "Lists the known Google Search Console reporting issues, taken from Google's own notices, that overlap the dates you give, with the affected metrics, the sources they apply to and the source link. Without dates it lists every known issue. compare_ctr_periods runs the same check on its own periods; this tool is for dates you compare elsewhere.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "periods": {
                "description": "Up to four date ranges to check. Leave out to list every known issue.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "end": {
                      "description": "Last day, YYYY-MM-DD, inclusive.",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "start": {
                      "description": "First day, YYYY-MM-DD, inclusive.",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["end", "start"],
                  "type": "object"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "source": {
                "description": "Where the numbers come from: gsc_ui_export (Search Console Performance report or its export), bulk_export (BigQuery bulk export), api (Search Console API) or other. Some reporting issues apply to one source only.",
                "enum": ["gsc_ui_export", "bulk_export", "api", "other"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "issues": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "affects": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "appliesTo": {
                      "anyOf": [
                        {
                          "const": "all",
                          "type": "string"
                        },
                        {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        }
                      ]
                    },
                    "effect": {
                      "enum": ["block_ctr_diagnostics", "warn"],
                      "type": "string"
                    },
                    "end": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "sourceUrl": {
                      "type": "string"
                    },
                    "start": {
                      "type": "string"
                    }
                  },
                  "required": ["affects", "appliesTo", "effect", "end", "id", "sourceUrl", "start"],
                  "type": "object"
                },
                "type": "array"
              },
              "versions": {
                "additionalProperties": false,
                "properties": {
                  "anomalyRegistry": {
                    "type": "string"
                  },
                  "calculationContract": {
                    "type": "string"
                  },
