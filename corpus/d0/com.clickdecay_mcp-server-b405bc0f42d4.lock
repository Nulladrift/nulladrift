                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "end": {
                    "description": "Last day of the later period, YYYY-MM-DD, inclusive.",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "impressions": {
                    "description": "Total impressions in the later period, a whole number, at least the clicks.",
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "start": {
                    "description": "First day of the later period, YYYY-MM-DD, inclusive.",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  }
                },
                "required": ["clicks", "end", "impressions", "start"],
                "type": "object"
              },
              "prior": {
                "additionalProperties": false,
                "description": "Totals of the earlier period, for example from the Search Console Performance report.",
