                        }
                      },
                      "required": ["angle", "evidence", "handles", "label", "means", "products", "status", "stores"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "notes": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "products": {
                    "type": "integer"
                  },
                  "stores_read": {
                    "type": "integer"
                  }
                },
                "type": ["object", "null"]
