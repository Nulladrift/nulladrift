        {
          "name": "map_ad_angles",
          "title": "Map ad angles",
          "description": "Use this when the user wants to know which persuasion angles a set of ads uses and which are missing, such as \"which angles are these competitor ads missing?\". Pass the ads the user already has (id, text, and optionally advertiser). Optional descriptions of images or videos are read with the text. Returns the angles ranked with counts, advertisers and example ad ids, and a list of gaps: angles no ad uses (unclaimed) or only one advertiser uses (thin), each with evidence. Identical copy from one advertiser counts once. It does not fetch ads from any ad library. Angles come from keyword matching, so gaps are leads to check, not proof that an angle works.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "ads": [
                  {
                    "advertiser": "Acme",
                    "id": "1",
                    "text": "50% off your first box, free delivery."
                  },
                  {
                    "advertiser": "Acme",
                    "id": "2",
                    "text": "50% off your first box, free delivery."
                  },
                  {
                    "advertiser": "Barkly",
                    "id": "3",
                    "text": "Recommended by vets."
                  }
                ]
              }
            ],
            "properties": {
              "ads": {
                "description": "Ads you already have: objects with id, text and optionally advertiser. At most 300. This tool does not fetch ads from any ad library.",
                "items": {
                  "properties": {
                    "advertiser": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "text": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "text"],
                  "type": "object"
                },
                "maxItems": 300,
                "minItems": 1,
                "type": "array"
              },
              "descriptions": {
                "description": "Written descriptions of the ads' images or videos, as objects with the ad id and description. They are read together with the ad text. They come from a separate offline step.",
                "items": {
                  "properties": {
                    "description": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    }
                  },
                  "required": ["description", "id"],
                  "type": "object"
                },
                "maxItems": 300,
                "type": "array"
              }
            },
            "required": ["ads"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "ads_analyzed": {
                "type": "integer"
              },
              "advertisers": {
                "type": "integer"
              },
              "angles": {
                "items": {
                  "properties": {
                    "ad_ids": {
                      "description": "Up to 5 ad ids as evidence",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "ads": {
                      "description": "Distinct creatives using the angle",
                      "type": "integer"
                    },
                    "advertisers": {
                      "type": "integer"
                    },
                    "angle": {
                      "type": "string"
                    },
                    "example": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "share": {
                      "description": "Share of distinct creatives, 0 to 1",
                      "type": "number"
                    },
                    "top_terms": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["ad_ids", "ads", "advertisers", "angle", "label", "share"],
                  "type": "object"
                },
                "type": "array"
              },
              "as_of": {
                "type": "string"
              },
              "distinct_creatives": {
                "type": "integer"
              },
              "duplicates_collapsed": {
                "type": "integer"
              },
              "gaps": {
                "items": {
                  "properties": {
                    "ad_ids": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "ads": {
                      "type": "integer"
                    },
                    "advertisers": {
                      "type": "integer"
                    },
                    "angle": {
                      "type": "string"
                    },
                    "evidence": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "means": {
                      "type": "string"
                    },
                    "status": {
                      "description": "unclaimed: no ad uses the angle. thin: only one advertiser does.",
                      "enum": ["unclaimed", "thin"],
                      "type": "string"
                    }
                  },
                  "required": ["ad_ids", "ads", "advertisers", "angle", "evidence", "label", "means", "status"],
                  "type": "object"
                },
                "type": "array"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "source": {
                "type": "string"
              },
              "unclassified": {
                "description": "Creatives with no recognised angle, such as text in another script or no text",
                "type": "integer"
              }
            },
            "required": ["ads_analyzed", "advertisers", "angles", "as_of", "distinct_creatives", "duplicates_collapsed", "gaps", "notes", "source", "unclassified"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Done: Map ad angles",
            "openai/toolInvocation/invoking": "Map ad angles..."
          },
          "digest": "sha256:2daba79d96ca91b3aff692924edc09ce4747307f5086220bf42c20ee3197c4a7"
        },
        {
          "name": "map_store_offers",
          "title": "Map store offers",
          "description": "Use this when the user wants to compare what competitor stores offer, such as \"compare the discounts and bundles of allbirds.com and gymshark.com\". Pass one to three store addresses. Reads each store's public Shopify product feed once, after its robots.txt, at most three pages of 250 products. Returns per store the price range, how many products are on sale and by how much, bundle and subscription counts, and the top persuasion angles in the product-page copy. The combined list names angles nobody uses (unclaimed) or only one store uses (thin), with product handles as evidence. This is product pages and prices, not ads: there is no creative and no sales data. A store that disallows the feed is unavailable, not fetched.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "domains": ["https://www.shoes-store.com/collections/all"]
              }
            ],
            "properties": {
              "domains": {
                "description": "One to 3 Shopify store addresses, such as allbirds.com. Each store's public /products.json is read once, after its robots.txt, at most 3 pages of 250 products.",
                "items": {
                  "maxLength": 253,
                  "minLength": 3,
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["domains"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "description": "ISO 8601 time the data was published by its source or fetched from it. A cached answer keeps the time of its fetch.",
                "type": "string"
              },
              "combined": {
