        {
          "name": "pick_ad_type",
          "title": "Pick ad type by buyer stage",
          "description": "Pick ad type by buyer stage. Use this when the user wants to know which kind of ad to run for a product and an audience, such as \"which ad should I run for my sleep mask to past customers?\". Pass the product and the buyer's awareness stage, or a short audience note to infer the stage from. Returns first a one-line answer, then the ad type, its script beats in order and one line of why, then the evidence: the stage used, whether it was given, inferred or unclear, and the words matched in the note. An unclear note returns the two likely stages, each with its play. The stage is read with keyword rules, not a model, and the mapping is a public post, so it is a starting point, not a test result.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "product": "a note taking app for students",
                "stage": "problem_aware"
              }
            ],
            "properties": {
              "audience": {
                "description": "A short note on who sees the ad, such as \"past customers waiting for a sale\" or \"cold TikTok audience\". Used to infer the stage when stage is not given.",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              },
              "product": {
                "description": "The product or offer the ad is for, such as \"Acme slow-feeder dog bowl\"",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "stage": {
                "description": "The buyer's awareness stage, if known. unaware: does not know they have the problem. problem_aware: feels the problem, does not know the fix. solution_aware: knows fixes exist, not yours. product_aware: knows your product, has not bought. most_aware: knows and wants it (the post calls this aware).",
                "enum": ["unaware", "problem_aware", "solution_aware", "product_aware", "most_aware"],
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "answer": {
                "description": "The ad type, the beats in order and why, in one line",
                "type": "string"
              },
              "evidence": {
                "properties": {
                  "likely_stages": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "matched": {
                    "description": "Words from the audience note, by the stage they point to",
                    "type": "object"
                  },
                  "note": {
                    "type": "string"
                  },
                  "stage": {
                    "type": ["string", "null"]
                  },
                  "stage_source": {
                    "enum": ["given", "inferred", "unclear"],
                    "type": "string"
                  }
                },
                "required": ["matched", "stage", "stage_source"],
                "type": "object"
              },
              "plays": {
                "description": "One play, or two when the stage is unclear",
                "items": {
                  "properties": {
                    "ad_type": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "script": {
                      "description": "Beats in order, first to last",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "stage": {
                      "enum": ["unaware", "problem_aware", "solution_aware", "product_aware", "most_aware"],
                      "type": "string"
                    },
                    "variants": {
                      "description": "Other ad types the post lists for this stage",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "why": {
                      "type": "string"
                    }
                  },
                  "required": ["ad_type", "label", "script", "stage", "variants", "why"],
                  "type": "object"
                },
                "type": "array"
              },
              "source": {
                "description": "The post the stage to ad type mapping comes from",
                "type": "string"
              }
            },
            "required": ["answer", "evidence", "plays", "source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Done: Pick ad type by buyer stage",
            "openai/toolInvocation/invoking": "Pick ad type by buyer stage..."
          },
