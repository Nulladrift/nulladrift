      "serverInfo": {
        "name": "coupossum",
        "version": "0.2.5",
        "websiteUrl": "https://coupossum.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Coupossum finds current coupon codes, deals and products on sale from online stores. Results contain affiliate links (feedico.io/go/...). Show these links to the user so they can open them themselves, as the Markdown in each result's \"links\" field (a link to the result on Coupossum first, then the direct link), instead of bare URLs. Never open, fetch, prefetch, preview, summarize or check these links yourself or with any browsing or fetch tool: automated requests to them count as invalid traffic for the stores' affiliate programs. If the user wants to know more about an offer, use the result data or ask them to open the link. Mention that the links are affiliate links: the offers come from the stores' affiliate programs, which share them with partners like Coupossum. Don't claim a code only works through the link. Tools return at most 10 results; when there are more, the response says so and gives a link to see all of them on Coupossum, which you should pass on to the user.",
      "tools": [
        {
          "name": "get_store_offers",
          "title": "Get a store's current offers",
          "description": "List one store's current coupon codes and deals, soonest ending first, optionally for one country. Returns up to 10 offers with code (or none), end date, countries and links, plus the store's total number of offers and a link to all of them on Coupossum.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "ISO country code, e.g. CH or US. Returns offers for that country plus worldwide ones.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "store": {
                "description": "Store name, domain or Coupossum store slug",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["store"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a store's current offers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e3fd55cefa6a67855eb4a3679c42af1c57cfb59d7e34954d4efcf10585242d4d"
        },
        {
          "name": "search_coupons",
          "title": "Search coupon codes and deals",
          "description": "Find current coupon codes and deals (offers without a code, e.g. free shipping) by keyword and/or store name, optionally for one country. A keyword also matches store names, so \"vpn\" finds NordVPN. Returns up to 10 active offers (at most 3 per store unless a store is given) with code (or none), end date, countries and links, and says when there are more. Covers coupon codes and deals, not individual products on sale.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "ISO country code, e.g. CH or US. Returns offers for that country plus worldwide ones.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "query": {
                "description": "Keyword, e.g. \"shoes\" or \"free shipping\"",
                "maxLength": 100,
                "type": "string"
              },
              "store": {
                "description": "Store name or domain, e.g. \"example.com\"",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search coupon codes and deals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:02122b2635e442614d4cdf256395ec97c66c9dde07ae4d6b4dd1e047b0827e72"
        },
        {
          "name": "search_products",
          "title": "Search products on sale",
          "description": "Find individual products currently on sale by keyword, optionally with a maximum price, currency and country. Returns up to 10 products with sale price, regular price, ship-to countries and links, and says when there are more. Covers products on sale, not coupon codes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "ISO country code, e.g. CH or US. Returns offers for that country plus worldwide ones.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "currency": {
                "description": "ISO currency, e.g. USD, EUR, CHF",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "max_price": {
                "description": "Maximum price",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "query": {
                "description": "Product keywords, e.g. \"running shoes\"",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search products on sale"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f4894f1dadf1b0fefe1980c36979fed6eb3acd10563e866222764fb44ec8fe90"
        },
        {
          "name": "search_stores",
          "title": "Search stores",
          "description": "Find stores by name or domain. Returns up to 10 stores with their number of current offers and links, and says when there are more.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "query": {
                "description": "Store name or domain",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search stores"
          },
          "behavior": {
