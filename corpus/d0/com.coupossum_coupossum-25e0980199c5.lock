            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c7a6c1ab54d1d6a2c5c9705e08650d8e37e001a096298560a21c906998989dcf"
        }
      ],
      "prompts": [
        {
          "name": "products_on_sale",
          "title": "Products on sale",
          "description": "Ask for products currently on sale, optionally under a maximum price.",
