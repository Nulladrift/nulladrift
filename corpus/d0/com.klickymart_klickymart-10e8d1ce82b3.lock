        {
          "name": "search_merchants",
          "description": "Search KlickyMart merchant records (same filters as GET /q)",
          "inputSchema": {
            "properties": {
              "ag_min": {
                "type": "integer"
              },
              "agent_native": {
                "description": "1 = agent-native stores only",
                "enum": [0, 1],
