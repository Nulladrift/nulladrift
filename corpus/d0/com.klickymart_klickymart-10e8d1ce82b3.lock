        {
          "name": "get_landed_price",
          "description": "One call: a product's landed price at a US ZIP. Searches KlickyMart-observed offers (and, with live=true, the live Shopify Catalog, never stored), and returns for every product: price, stock, url, checked_at, shipping (with source), est. tax with the rate used, est_total ONLY when price+shipping+tax are all known, plus store facts (pay methods incl. Shop Pay/Link/BTC, guest checkout, checkout depth, first blocker). Products from stores KlickyMart has not indexed say 'store not indexed'.",
          "inputSchema": {
            "properties": {
              "brand_strict": {
                "type": "boolean"
              },
              "condition": {
                "enum": ["new", "refurbished", "open-box", "used", "unknown"],
                "type": "string"
              },
              "domain": {
                "type": "string"
              },
              "gtin": {
                "type": "string"
              },
              "in_stock": {
                "type": "boolean"
              },
              "limit": {
                "maximum": 50,
                "type": "integer"
              },
              "live": {
                "type": "boolean"
              },
              "max_landed": {
                "description": "delivered total budget: price + shipping + estimated tax (rows with unknown total are left out)",
                "type": "number"
              },
              "max_price": {
                "description": "item price only, before shipping and tax",
                "type": "number"
              },
              "mpn": {
                "type": "string"
              },
              "q": {
                "type": "string"
              },
              "type": {
                "enum": ["headphones", "earbuds", "headset", "speaker", "grinder", "gift-card", "bundle", "accessory"],
                "type": "string"
              },
              "url": {
                "description": "a product URL to price",
                "type": "string"
              },
              "zip": {
                "description": "5-digit US ZIP",
                "type": "string"
              }
