{
  "lockfileVersion": 2,
  "subjects": {
    "com.klickymart/klickymart": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://klickymart.com/mcp"
      },
