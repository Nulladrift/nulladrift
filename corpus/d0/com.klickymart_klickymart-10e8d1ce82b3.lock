              },
              "guest": {
                "description": "1 (or true) = drop stores known to REQUIRE an account; a store whose guest status is unknown is kept (guest: null) and ranked after confirmed-guest stores. confirmed = strict: only stores confirmed to allow guest checkout. 0 = only stores known to require an account. Items carry guest (true|false|null) and co",
