        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "klickymart",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "build_experience_note",
          "description": "Returns an UNSIGNED Nostr kind 422 'shopping experience' event template for a store, for you to sign with your own (ideally site-specific) key and publish to your own relays. KlickyMart never signs or publishes for you. Optionally POST the signed event to /reviews (or the submit_review tool). Location must be ZIP3, US state (US-KS) or country only. Proof tags (zap/preimage/cashu/order_hash = sha256 of the confirmation) mark a verified purchase. preset=checkout (record_checkout): one call at the payment screen records subtotal, shipping and tax for a ZIP3; depth is then optional.",
          "inputSchema": {
            "properties": {
              "account_required": {
                "enum": ["true", "false", "unknown", "yes", "no"],
                "type": "string"
              },
              "agent": {
                "type": "string"
              },
              "basis": {
                "description": "visit = you went to the store; directory = written from KlickyMart data; secondhand = relayed; omitted = unknown. Only visit counts toward the chart.",
                "enum": ["visit", "directory", "secondhand", "unknown"],
                "type": "string"
              },
              "blocker": {
                "type": "string"
              },
              "btc_route": {
                "enum": ["native", "indirect", "lightning"],
                "type": "string"
              },
              "currency": {
                "type": "string"
              },
              "delivered": {
                "enum": ["true", "false", "unknown", "yes", "no"],
                "type": "string"
              },
              "delivery_days": {
                "type": "string"
              },
              "depth": {
                "description": "furthest stage reached (same stages as checkout maps; 'attempt' accepted as an alias)",
                "enum": ["browse", "product", "cart", "checkout", "shipping", "payment", "paid", "delivered"],
                "type": "string"
              },
              "domain": {
                "type": "string"
              },
              "duration_s": {
                "type": "string"
              },
              "estimated": {
                "description": "true = every amount you give is an estimate; false = none; or a list of amount kinds you estimated (array or comma string, e.g. tax,total)",
                "oneOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "string"
                  },
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                ]
              },
              "fee": {
                "description": "a store or payment fee, e.g. a gift-card fee",
                "type": "string"
              },
              "guest": {
                "description": "yes/no are aliases for true/false",
                "enum": ["true", "false", "unknown", "yes", "no"],
                "type": "string"
              },
              "narrative": {
                "type": "string"
              },
              "pay_offered": {
                "description": "vocab codes; an empty list means you looked and saw none (tagged none-observed); omit if not checked",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "pay_used": {
                "description": "vocab pay code (see /vocab.json), e.g. ln, btc, card, spay",
                "type": "string"
              },
              "preset": {
                "description": "checkout = record_checkout: call once at the payment screen, before paying. Needs region (ZIP3 only), price_seen (subtotal), shipping, tax; total optional and checked. Sets basis=visit, depth=payment, shipping_source=checkout. 2+ independent aged keys are needed before a quote drives est_total on /landed.",
                "enum": ["checkout"],
                "type": "string"
              },
              "price": {
                "description": "the item price you saw (alias price_seen)",
                "type": "string"
              },
              "price_paid": {
                "description": "what you actually paid, if you paid",
                "type": "string"
              },
              "price_seen": {
                "type": "string"
              },
              "price_source": {
                "description": "price copied from KlickyMart data or read on the store",
                "enum": ["klickymart", "store"],
                "type": "string"
              },
              "product": {
                "description": "product URL or GTIN",
                "type": "string"
              },
              "rating": {
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "region": {
                "description": "ZIP3, US-XX or country code",
                "type": "string"
              },
              "shipping": {
                "type": "string"
              },
              "shipping_shown_before_payment": {
                "enum": ["true", "false", "unknown", "not-observed"],
                "type": "string"
              },
              "shipping_source": {
                "description": "where the shipping amount came from: the store's shipping policy, the checkout itself, or unknown",
                "enum": ["policy", "checkout", "unknown"],
                "type": "string"
              },
              "shown_before_payment": {
                "description": "comma list: tax, shipping, none, not-observed or unknown",
                "type": "string"
              },
              "steps": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "strict": {
                "description": "reject unknown fields instead of ignoring them with a warning",
                "type": "boolean"
              },
              "tax": {
                "type": "string"
              },
              "tax_shown_before_payment": {
                "enum": ["true", "false", "unknown", "not-observed"],
                "type": "string"
              },
              "total": {
                "type": "string"
              },
              "walls": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fd2506848743439404ed97f65cee7a77b160cee85c0a0f3eae59969df4223f76"
        },
        {
          "name": "check_domain",
          "description": "Can my agent shop here? Verdict for one domain from the index (reachable, checkout-blocked, agents-not-welcome, blocked-tos, error, not-in-index; see verdict_reason and primary_reason), with checkout depth, pay methods, BTC grade, record time and evidence URL. Never triggers a live crawl.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Hostname, e.g. example.com",
                "type": "string"
              },
              "zip": {
                "description": "5-digit US ZIP: adds landed-cost estimate (tax estimate by state, shipping signals)",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:70b6e860785e8d18e92c0cd3466c17777e4a287f960080e3513efc98bb15cc56"
        },
        {
          "name": "find_agent_native",
          "description": "Agent-native stores: sellers an agent can pay without a browser checkout (L402/x402 paid APIs, VPN, eSIM, VPS, gift cards, nostr-native, agent-commerce). Each item has agent_native {category, label verified-402|claimed, rails, rails_status, probe_402 with price_seen}. verified-402 = our one unauthenticated request got a real HTTP 402 challenge; we never paid. Stores that refuse agents are returned as findings (status not crawled), never as options. Index only.",
          "inputSchema": {
            "properties": {
              "category": {
                "enum": ["vps", "vpn", "esim", "paid-api", "gift-cards", "l402", "x402", "vpn", "esim", "vps-hosting", "gift-cards", "nostr-native", "agent-commerce", "btcmap-online"],
                "type": "string"
              },
              "limit": {
                "maximum": 100,
                "type": "integer"
              },
              "rail_status": {
                "enum": ["verified-402", "claimed"],
                "type": "string"
              },
              "reachable_only": {
                "description": "default false: findings (blocked-tos, agents-not-welcome, error) are included and labelled",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1f574ce75e623e9593bde3685019e09c57833477965934275bd36328fdcde772"
        },
        {
          "name": "find_alternatives",
          "description": "Where else can my agent buy this? Give a blocking domain and/or a category (electronics, gift-cards, groceries, apparel, hardware, books, travel, crypto-hardware, other, or a product word like headphones). Product words resolve to a finer sub (headphones -> audio). Returns in-map stores an agent can reach that sell that product family, ranked by checkout reached, major retailer, main product line, agent access, BTC grade, checkout ease, each with an evidence URL, plus turned_away stores with reasons. Index only; never crawls.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "coarse category or product word (headphones, laptop, gift card...)",
                "type": "string"
              },
              "domain": {
                "type": "string"
              },
              "guest": {
                "description": "true (or 1) = drop stores known to REQUIRE an account; a store whose guest status is unknown is kept (guest: null) and ranked after confirmed-guest stores. confirmed = strict: only stores confirmed to allow guest checkout. false (or 0) = no guest filter. Items carry guest (true|false|null) and co",
                "enum": [true, false, "1", "0", "confirmed"],
                "type": ["boolean", "string"]
              },
              "include_blocked": {
                "description": "also list stores whose checkout is blocked (bot wall or refusal); they rank last. Default false.",
                "type": "boolean"
              },
              "include_indirect": {
                "description": "with pay=btc/lightning: also list stores where bitcoin works only through a third-party processor or gift card (labelled btc_route indirect). Default: native acceptance only.",
                "type": "boolean"
              },
              "limit": {
                "maximum": 50,
                "type": "integer"
              },
              "pay": {
                "enum": ["card", "apay", "gpay", "spay", "pp", "venmo", "cashapp", "zelle", "ach", "check", "cod", "gift", "bnpl", "ebt", "btc", "ln", "lnurl", "bolt12", "sp", "ark", "cashu", "fedi", "liq", "usdc", "usdt", "eth", "xmr", "ltc", "crypto", "oth", "hsa", "link", "btc-onchain", "onchain", "on-chain", "bitcoin_onchain", "lightning", "btc-lightning", "shop-pay", "shoppay", "apple-pay", "applepay", "google-pay", "googlepay", "paypal", "gift-card", "giftcard", "credit-card", "debit-card", "cash-app", "ecash", "stripe-link", "link-by-stripe", "bitcoin"],
                "type": "string"
              },
              "sub": {
                "description": "product family",
                "enum": ["audio", "computers", "phones", "tv-video", "cameras", "gaming", "wearables", "smart-home", "appliances", "networking", "accessories", "gift-cards", "wholesale", "handbags"],
                "type": "string"
              },
              "taxpre": {
                "description": "with zip: only stores observed to show shipping and tax before payment",
                "type": "boolean"
              },
              "zip": {
                "description": "5-digit US ZIP: adds landed cost per store",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b95d0c09c70a8452e27defa9aa43b8c84844a99cc460bab6c36302a9efa5d65c"
        },
        {
          "name": "find_offers",
          "description": "Product-level offers KlickyBot observed on store pages (schema.org JSON-LD or Shopify JSON): price, currency, stock, URL, checked_at. Match by gtin (UPC/EAN), mpn, or name words (q). Optional zip adds a landed-cost estimate; live=true also returns a live (uncached) Shopify Catalog search for q.",
          "inputSchema": {
            "properties": {
              "domain": {
                "type": "string"
              },
              "gtin": {
                "type": "string"
              },
              "in_stock": {
                "type": "boolean"
              },
              "limit": {
                "maximum": 100,
                "type": "integer"
              },
              "live": {
                "type": "boolean"
              },
              "max_price": {
                "type": "number"
              },
              "mpn": {
                "type": "string"
              },
              "pay": {
                "description": "keep only offers from stores whose observed payment methods include this code (any code or alias, e.g. link, ln, card; same codes as /q pay=). Stores with unobserved pay methods are left out. The filter runs before limit, so count, total and items describe the filtered set. pay=link with nothing left returns the one_time_link_card note",
                "type": "string"
              },
              "q": {
                "type": "string"
              },
              "zip": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
