          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use AEORank MCP to audit websites for Technical SEO, Answer Engine Optimization (AEO), and Generative Engine Optimization (GEO):\n1. Call `run_sandbox_audit` with a domain or URL for an instant GEO-62 diagnostic preview.\n2. Call `generate_agent_patch_pack` to generate a ready-to-deploy 6-Tab Agentic Patch Pack (/llms.txt, robots.txt, Schema JSON-LD, agent-card.json, _headers, and .geo-answer-box HTML).\n3. Call `lookup_rule` to inspect any diagnostic rule (AEO-001..AEO-062) and 9-pillar weights, `list_entity_sources` for DR 70-98 Knowledge Graph platforms, or `search_knowledge_playbooks` for engineering guides.",
      "tools": [
        {
          "name": "generate_agent_patch_pack",
          "title": "Generate 6-Tab Agentic Patch Pack & Remediation Prompt",
          "description": "Generate ready-to-deploy machine-readable patch files (/llms.txt, additive RFC 9309 robots.txt, XSS-safe Schema JSON-LD, agent-card.json, safe _headers, and .geo-answer-box Fan-Out HTML) plus a prompt-injection-hardened Coding Agent remediation prompt.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Output language ('en' or 'vi').",
                "enum": ["en", "vi"],
                "type": "string"
              },
              "lead_token": {
                "description": "Optional email-verified lead token paired with scan_token.",
                "type": "string"
              },
              "scan_token": {
                "description": "Optional unlocked scan token from aeorank.app to include the full homepage finding list.",
                "type": "string"
              },
              "url": {
                "description": "Target website URL or domain (e.g. https://example.com).",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "actions_included": {
                "type": "integer"
              },
              "agent_prompt": {
                "type": "string"
              },
              "agentic_readiness": {
                "type": "object"
              },
              "domain": {
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              },
              "patch_pack": {
                "type": "object"
              },
              "unlocked": {
                "type": "boolean"
              }
            },
            "required": ["agent_prompt", "domain", "ok", "patch_pack"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Generate 6-Tab Agentic Patch Pack & Remediation Prompt"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:70fdc8aa40b7adb5e4edbc3bc2b1f5174511d11b80bfc4a4dff51ed40e9136a2"
        },
        {
          "name": "list_entity_sources",
          "title": "List High-DR Entity & Knowledge Graph Platforms",
          "description": "Retrieve verified DR 70-98 self-serve entity & citation platforms (Wikidata, CERN Zenodo DOI, Hugging Face, GitHub, npm, PyPI, LinkedIn) for Knowledge Graph sameAs synchronization.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
