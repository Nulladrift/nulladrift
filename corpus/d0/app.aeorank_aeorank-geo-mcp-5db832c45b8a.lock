        "name": "aeorank-mcp",
        "title": "AEORank: SEO, AEO & GEO Audit Engine",
        "version": "2.2.0",
        "description": "Live 62-rule Technical SEO, Answer Engine Optimization (AEO), and Generative Engine Optimization (GEO) auditing engine with 6-Tab Agentic Patch Packs.",
        "websiteUrl": "https://aeorank.app",
        "icons": [
          {
            "src": "https://aeorank.app/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://aeorank.app/logo-512.png",
            "mimeType": "image/png",
