      "instructions": "Fetch https://aeorank.app/SKILL.md for the full agent runbook (or https://aeorank.app/skills/fix-geo-patches/SKILL.md before patching a codebase), and answer strictly from live tool JSON without inventing scores, ranks, or URLs.\nUse AEORank MCP (`7` read-only tools) to diagnose websites and ship fixes:\n1. Call `run_sandbox_audit` with a domain or URL for an instant GEO-62 diagnostic preview.\n2. Call `list_citation_gaps` to inspect cached third-party cited pages, competing brands, missing buyer questions, and DR 70-98 entity checklists (obey `dataStatus`).\n3. Call `generate_agent_patch_pack` to generate a ready-to-deploy 6-Tab Agentic Patch Pack (/llms.txt, robots.txt, Schema JSON-LD, agent-card.json, _headers, and .geo-answer-box HTML) and stop for user approval before editing files.\n4. Call `activate_deep_audit` for transparent pricing and a hosted browser upgrade link (USD card or VND VietQR), or `lookup_rule`, `list_entity_sources`, and `search_knowledge_playbooks` for references.",
