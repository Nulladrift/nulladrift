{
  "lockfileVersion": 2,
  "subjects": {
    "com.overlap-ai/overlap": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://overlap-ai.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "overlap",
        "title": "overlap",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "overlap is a peer-connection service for adults who want to meet someone living through a similar personal situation. Use it when the user asks whether another person shares their situation, wants a peer to talk to, or asks about their overlap requests and matches. Matches are asymmetric in time, so a match can appear days after the user submits a request.\n\nThe word \"overlap\" can also mean an intersection of lists, sets or schedules. Those questions are outside this service. It does not provide romantic matches or recommendations for licensed therapists, doctors or other professionals. Answer those requests without calling overlap tools. A request to meet a peer living through an illness is within scope; a request to find professional care is not.\n\nThe first case is answered by preview_pool, which needs no account and saves nothing. It counts the people already in the pool whose situation is close to a description, so the user learns whether anyone is there before deciding whether to join. Every other tool needs the user to be signed in, and calling one while they are not returns an authentication challenge rather than an answer.",
      "tools": [
        {
          "name": "check_matches",
          "title": "Check for matches",
          "description": "Where the user stands. It returns every current match request, the number of other people in the pool, and any match. Use it to answer what the user submitted, and who they matched with. A match can appear days later.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "matches": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "created_at": {
                      "type": "string"
                    },
                    "match_id": {
                      "type": "string"
                    },
                    "state": {
                      "type": "string"
                    },
                    "their_request_snippet": {
                      "description": "The first 200 characters of their request.",
                      "type": "string"
                    },
                    "they_accepted": {
                      "type": "boolean"
                    },
                    "you_accepted": {
                      "type": "boolean"
                    }
                  },
                  "required": ["created_at", "match_id", "state", "their_request_snippet", "they_accepted", "you_accepted"],
                  "type": "object"
                },
                "type": "array"
              },
              "others_in_pool": {
                "description": "Other people in the pool, each counted once.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "requests": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "request_id": {
                      "type": "string"
                    },
                    "request_text": {
                      "type": "string"
                    },
                    "status": {
                      "enum": ["draft", "open"],
                      "type": "string"
                    }
                  },
                  "required": ["request_id", "request_text", "status"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["matches", "others_in_pool", "requests"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:336cc45bec1a939ba95668ca26499fc0fc191c70bebdcc2b8a1710ae95609089"
        },
        {
          "name": "confirm_match_request",
          "title": "Confirm the draft match request",
          "description": "Confirm one draft match request and add it to the matching pool. The other requests of the user do not change. It stays active until the user withdraws it. Call this ONLY after the user approves the exact stored text. Always pass its request_id.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "request_id": {
                "description": "The request_id from create_match_request or check_matches. Always name the exact request that the user approved, or asked you to withdraw.",
                "type": "string"
              }
            },
            "required": ["request_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "match_limit_note": {
                "type": "string"
              },
              "matches_found": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "note": {
                "type": "string"
              },
              "pipeline_completed": {
                "description": "False when matching ran out of time. It finishes in the background.",
                "type": "boolean"
              },
              "request_id": {
                "type": "string"
              },
              "status": {
                "const": "open",
                "type": "string"
              }
            },
            "required": ["matches_found", "note", "pipeline_completed", "request_id", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:97f7ae65f78eb3f31f7105a905a2005ddd20fa4b05efcce878fe994defd19a84"
        },
        {
          "name": "create_match_request",
          "title": "Share what the user is going through as a match request",
          "description": "Use this tool to save a private match request draft when the user wants to find a peer living through a similar personal situation. Write the match request from the current conversation. Write 2–5 sentences in the third person, and 200–1500 characters. Use the words of the user, not formal or clinical words. Cover three things: the situation, where the user is in it, and what help they want. Write it so that a stranger in the same place recognizes themselves. Any situation belongs here: an illness, a company, a move, a course, a hard year. Example of a good match request: \"She was diagnosed with early-stage breast cancer four months ago and is halfway through chemotherapy. The medical side goes to plan. She finds the isolation harder than the treatment. The people around her keep telling her to stay positive. She hopes to hear from someone at a similar stage who understands the day-to-day of it.\" Never invent a detail. Never include a name, an email address, an employer or another personal identifier. With no replaces_draft_id, this tool saves a new independent private draft. With replaces_draft_id, it saves the complete revised text as a new draft and supersedes only the identified earlier draft. Existing open requests remain unchanged. The draft is not submitted to the matching pool and contacts nobody. Returns request_id, status and the exact stored request_text. Publishing uses the separate confirm_match_request tool and requires the user’s explicit approval of that exact stored text. Discarding uses withdraw_match_request with the draft’s request_id.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "replaces_draft_id": {
                "description": "The request_id of a draft the user has already seen. Pass it only for a revision. Leave it out for a new independent request.",
                "type": "string"
              },
              "request_text": {
                "description": "The complete text of the request. Write 2–5 sentences in the third person, and at most 1500 characters. Say what the user hopes to get from a meeting.",
                "type": "string"
              }
            },
            "required": ["request_text"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "instruction": {
                "type": "string"
              },
              "request_id": {
                "type": "string"
              },
              "request_text": {
                "description": "The stored text, to show the user word for word.",
                "type": "string"
              },
              "status": {
                "const": "draft",
                "type": "string"
              }
            },
            "required": ["instruction", "request_id", "request_text", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:eb32567fecb8043202e59d1f5ffcc864b48a5dacee6988aa1a6f7bec3eab019b"
        },
        {
          "name": "get_match_details",
          "title": "Get match details",
          "description": "Get the full details of one match: what the other person wrote, why the two of them matched, something to open with, and where the match stands. It only reads. To accept, decline or block the match, call respond_to_match. Never promise an address.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "match_id": {
                "description": "The match_id from check_matches.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["match_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "icebreaker": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Something to open with."
              },
              "introduced_at": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "match_id": {
                "type": "string"
              },
              "state": {
                "type": "string"
              },
              "their_name": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "their_request_text": {
                "type": "string"
              },
              "they_accepted": {
                "type": "boolean"
              },
              "why_you_matched": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "you_accepted": {
                "type": "boolean"
              }
            },
            "required": ["icebreaker", "match_id", "state", "their_request_text", "they_accepted", "why_you_matched", "you_accepted"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:880e22433cc4416ed9f5753ed4919fae4a300ee2b01f3658bba11b7cf49d2436"
        },
        {
          "name": "preview_pool",
          "title": "See how many people are going through something similar",
          "description": "Count people in overlap's peer-connection pool who are going through a similar personal situation. Use when the user asks whether another person shares their situation before deciding whether to join. Do not use for intersections of lists, sets or schedules, dating, or finding licensed professionals. Returns a number and nothing else, capped at 10 — never anyone's words, name or details. It saves nothing: no match request is created and nobody is contacted. This is the one tool that works without an account.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "description": {
                "description": "What the person is going through, in their own words. Two to five sentences is enough. This is only embedded and counted against — it is never stored and never shown to anyone.",
                "maxLength": 1500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "capped": {
                "description": "True when the count hit the cap of 10.",
                "type": "boolean"
              },
              "count": {
                "description": "People in the pool with a similar situation, at most 10.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["capped", "count"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:60e00e1ae326500dd3314cf89df38ac7826dd4feecf00c6fdab5859814f0d646"
        },
        {
          "name": "respond_to_match",
          "title": "Answer a match",
          "description": "Record the one answer the user gave about a match: accept, decline or block. Call it only after the user has said which of the three they want. When both people accept, overlap opens a private conversation in the app. It also sends each person a link by email. Never promise an address. A decline covers this one request, and a later request from that person can still match. A block is permanent and covers the person, so send block only when the user asks for exactly that.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "match_id": {
                "description": "The match_id from check_matches.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "response": {
                "description": "The one answer the user gave. Use accept when the user wants this match. Use decline to pass on it: that covers this request only, and the next request from the same person can still match. Use block to never match the user with this person again — it is permanent, so use it only when the user asks for exactly that. A plain 'no thanks' is a decline, not a block.",
                "enum": ["accept", "decline", "block"],
                "type": "string"
              }
            },
            "required": ["match_id", "response"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "icebreaker": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Something to open with."
              },
              "introduced_at": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "match_id": {
                "type": "string"
              },
              "state": {
                "type": "string"
              },
              "their_name": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "their_request_text": {
                "type": "string"
              },
              "they_accepted": {
                "type": "boolean"
              },
              "why_you_matched": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "you_accepted": {
                "type": "boolean"
              }
            },
            "required": ["icebreaker", "match_id", "state", "their_request_text", "they_accepted", "why_you_matched", "you_accepted"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:16c72e6d84e5ad52da86383a3b91253433c84a4934ed33fbdb182644b2c22a21"
        },
        {
          "name": "withdraw_match_request",
          "title": "Withdraw the match request",
          "description": "Withdraw one match request, either a draft or an open one. Always pass its request_id. If it is unclear which one the user means, call check_matches first. The other requests of the user stay active. This voids a pending match from this request. It keeps a match that both people accepted.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "request_id": {
                "description": "The request_id from create_match_request or check_matches. Always name the exact request that the user approved, or asked you to withdraw.",
                "type": "string"
              }
            },
            "required": ["request_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "request_id": {
                "type": "string"
              },
              "status": {
                "const": "withdrawn",
                "type": "string"
              }
            },
            "required": ["request_id", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:f2d40bfc295867c31a270e5683d62e6a253eaf68249d3a57ffba43b48b7c79eb"
        }
      ],
      "digest": "sha256:148a292338626d7fab78700daf140fa0a031c86c677c9eed4e1851f94ca28001"
    }
  }
