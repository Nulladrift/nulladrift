{
  "lockfileVersion": 2,
  "subjects": {
    "ai.kognai/golden-kog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.kognai.ai/v1/golden-kog/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "golden-kog",
        "title": "Golden Kog, token risk analyst (Kognai citizen KGN 0109)",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Golden Kog gives risk and structure facts about one token on Solana or Base, never a trading signal. Call about for prices and how to pay; resolve_ticker to list the tokens behind a ticker for the person to pick (free, never an analysis); analyze_token for a report on one exact address; monitor_token to watch a token with risk alerts; get_job to read a job. Paid tools take a partner key (Authorization Bearer) or an x402 payment in params._meta x402/payment.",
      "tools": [
        {
          "name": "about",
          "title": "About Golden Kog",
          "description": "What Golden Kog does and never does, its prices (set by the Kognai CFO) and how to pay. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8eb44b9eb2fb446a9a9b13777179a464741a2bba3576cf85f4e41af890a4f65a"
        },
        {
          "name": "analyze_token",
          "title": "Analyze a token",
          "description": "One token risk and structure analysis: risk level and points from a published rule table (a regulated issuer's asset, such as USDC or an xStock, is ISSUER CONTROLLED: its issuer powers listed as expected controls with the issuer named, not as points), every flag with its evidence, the measured facts (authorities, holders outside pools, launch bundle and dev wallet, liquidity and LP, chart structure in numbers) and a short text. Risk and structure facts, never a trading signal. Paid: partner key or x402.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "solana (pump.fun ecosystem first) or base",
                "enum": ["solana", "base"],
                "type": "string"
              },
              "token": {
                "description": "the token address: a Solana mint (base58) or a Base contract (0x and 40 hex)",
                "maxLength": 44,
                "minLength": 32,
                "type": "string"
              }
            },
            "required": ["chain", "token"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:33315bf367c18bbdf0bc72cc933b051cc47b1fb014830374feec348492b5d91f"
        },
        {
          "name": "get_job",
          "title": "Get a job",
          "description": "A job by its id with the view token from the paid reply: its state, report and alerts. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "pattern": "^gk_[A-Za-z0-9_-]{16}$",
                "type": "string"
              },
              "view_token": {
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["job_id", "view_token"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:458c1b359abe062273baa636ac2e799a459788be21718cc879cd1adc6e117091"
        },
        {
          "name": "monitor_token",
          "title": "Watch a token",
          "description": "Watches one token for a window with risk alerts (dev wallet sells, a top holder sells a large share, liquidity pulled, authorities changed, a new wallet cluster), by webhook or by polling get_job. The window on sale is 24 hours. Paid: partner key or x402.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "solana (pump.fun ecosystem first) or base",
                "enum": ["solana", "base"],
                "type": "string"
              },
              "hours": {
                "default": 24,
                "description": "the window in hours; 24 is the window on sale",
                "maximum": 72,
                "minimum": 1,
                "type": "integer"
              },
              "token": {
                "description": "the token address: a Solana mint (base58) or a Base contract (0x and 40 hex)",
                "maxLength": 44,
                "minLength": 32,
                "type": "string"
              },
              "webhook": {
                "description": "optional public https url that receives each alert as a JSON POST",
                "type": "string"
              }
            },
            "required": ["chain", "token"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e8095fe03a57c4edbe9289fbf3aab8f99214746f4d026d54ee051a980acf6502"
        },
        {
          "name": "resolve_ticker",
          "title": "Find the tokens behind a ticker",
          "description": "The Solana tokens that carry a ticker such as WIF or $WIF, side by side: symbol, name, mint, total liquidity in USD, pool count, age, and verified true when the mint is on Jupiter verified list; verified first, then liquidity. Candidates only: Golden Kog never picks one and never analyses a ticker. Show them to the person, let the person choose, then call analyze_token with that exact mint. KOG is never a candidate. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ticker": {
                "description": "the ticker, letters and digits, with or without $",
                "maxLength": 16,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8baa904d4086dea3063ccf8fbd6f6fd6aeab5be4996606a97419d35fea8c3ee0"
        }
      ],
      "digest": "sha256:c1df6f5241028dd8dc95b326e06122c0aa8e37171ec4d3d289763f27c55a30f7"
    }
  }
}
