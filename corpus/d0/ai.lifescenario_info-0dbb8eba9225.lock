{
  "lockfileVersion": 2,
  "subjects": {
    "ai.lifescenario/info": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://lifescenario.ai/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "ai.lifescenario/info",
        "title": "Life Scenario",
        "version": "1.3.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only public information from Life Scenario for parents and teachers of children aged 6–14: list_traits describes the SEL traits, find_practice_situation finds practice scenarios for a situation a child faces, get_what_to_say returns published parent guides, get_site_overview says what the product is and is not. Topics involving risk of harm, or medical or legal questions, return status \"not_covered\" with no guide or practice link. No account needed; the server holds no user or child data.",
      "tools": [
        {
          "name": "find_practice_situation",
          "title": "Find a practice situation",
          "description": "Finds up to 3 public Life Scenario practice scenarios for a real-life situation a child is facing (for example: left out at recess, peer pressure, cheating in a group chat, parents arguing, a new school). Returns each scenario's title, a short excerpt, the ages it is written for, the traits it practises, a link the adult can open to try it together with the child without an account and, when one is published, the parent page or what-to-say guide about the same situation. match_quality is \"close\" (the scenarios are about this situation) or \"loose\" (they only touch it and may not fit). An empty or loose result means only that no public scenario fits. Returns authored practice scenarios only, never other children's answers. Topics involving risk of harm, or medical or legal questions, return status \"not_covered\" with no guide or practice link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age": {
                "description": "Optional child age (6–14). Scenarios written for this age are ranked first.",
                "maximum": 14,
                "minimum": 6,
                "type": "integer"
              },
              "situation": {
                "description": "The situation in everyday words, e.g. \"friends pressure him to laugh at another kid\".",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["situation"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "how_it_works": {
                "type": "string"
              },
              "match_quality": {
                "description": "close = the scenarios are about this situation; loose = they only touch it and may not fit. Absent when there are no matches.",
                "enum": ["close", "loose"],
                "type": "string"
              },
              "matches": {
                "description": "Up to 3 practice scenarios; empty when no public scenario fits or the topic is not covered.",
                "items": {
                  "properties": {
                    "age_note": {
                      "description": "Present when the scenario is not written for the age that was asked about.",
                      "type": "string"
                    },
                    "ages": {
                      "description": "Ages the scenario is written for, e.g. \"8–14\".",
                      "type": "string"
                    },
                    "play_url": {
                      "description": "Opens the scenario without an account.",
                      "type": "string"
                    },
                    "scenario_page_url": {
                      "description": "Published page for parents about this situation, when there is one.",
                      "type": "string"
                    },
                    "situation": {
                      "description": "Short excerpt of the scenario text.",
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "traits_practised": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "what_to_say_guide_url": {
                      "description": "Published what-to-say guide that uses this scenario, when there is one.",
                      "type": "string"
                    }
                  },
                  "required": ["ages", "play_url", "situation", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "status": {
                "description": "Present only when the topic is not covered: no guide or practice link is returned.",
                "enum": ["not_covered"],
                "type": "string"
              },
              "topic_area": {
                "description": "With status not_covered: the kind of topic that was recognised.",
                "enum": ["self_harm_or_suicide", "abuse_or_sexual_harm", "violence_or_weapons", "eating_or_body", "medical_or_diagnostic", "legal", "bereavement_or_serious_illness"],
                "type": "string"
              },
              "urgent_help": {
                "description": "With status not_covered, for topics involving risk of harm: where to get urgent help, in the wording published in Life Scenario's guides.",
                "type": "string"
              }
            },
            "required": ["matches"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a practice situation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:cf58629766b7f18d858e6812d8f813f74df3d0d79bff8fe598324a0d77273a8d"
        },
        {
          "name": "get_site_overview",
          "title": "Life Scenario overview",
          "description": "Factual overview of Life Scenario: what the SEL practice game for children aged 6–14 does, what it is not, how child safety is handled, what this server can and cannot see, and key links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "about_this_server": {
                "type": "string"
              },
              "company": {
                "type": "string"
              },
              "links": {
                "type": "object"
              },
              "name": {
                "type": "string"
              },
              "safety": {
                "type": "string"
              },
              "traits": {
                "type": "string"
              },
              "website": {
                "type": "string"
              },
              "what_it_is": {
                "type": "string"
              },
              "what_it_is_not": {
                "type": "string"
              }
            },
            "required": ["name", "website", "what_it_is"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Life Scenario overview"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:7abfd4f9eefa372d73639443cae3ba62b4d6c5cc64deb295e4828a7fc66986f3"
        },
        {
          "name": "get_what_to_say",
          "title": "Get a what-to-say guide",
          "description": "Finds the published Life Scenario page for parents that best matches a topic (for example: \"nobody will play with me\", \"being teased\", \"a friend wants to copy my child's homework\"): a \"What to say\" guide or a scenario page (one situation, with example replies by age), whichever is closer. Returns its short answer, the key lines a child can say, its URL and, when it has one, a practice_url: a practice scenario on a similar situation that the adult can open with the child without signing up. If no guide or scenario page on that topic is published, returns status \"no_article_yet\" and, when a public practice scenario is about the same situation, that scenario. Topics involving risk of harm, or medical or legal questions, return status \"not_covered\" with no guide or practice link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "topic": {
                "description": "The topic or the words the child used, e.g. \"left out at recess\".",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "outputSchema": {
            "description": "One of three shapes. A published guide or scenario page: page_type, title, url, short_answer, key_scripts and, when available, practice_url (no status field). Nothing published on the topic: status \"no_article_yet\" with guides_hub and, when a public practice scenario is about the same situation, nearest_practice_situation. Topic not covered: status \"not_covered\" with topic_area and note, and no link.",
            "properties": {
              "for_ages": {
                "type": "string"
              },
              "guides_hub": {
                "description": "The list of all published what-to-say guides. Present with status no_article_yet.",
                "type": "string"
              },
              "how_it_works": {
                "type": "string"
              },
              "key_scripts": {
                "description": "Lines a child can say, at most 8.",
                "items": {
                  "properties": {
                    "by_age": {
                      "description": "Scenario pages only: the same reply worded for each age band the page shows.",
                      "items": {
                        "properties": {
                          "ages": {
                            "description": "e.g. \"6–8\".",
                            "type": "string"
                          },
                          "say": {
                            "type": "string"
                          }
                        },
                        "required": ["ages", "say"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "say": {
                      "description": "The line. On a scenario page: the reply for the middle age band.",
                      "type": "string"
                    },
                    "when": {
                      "description": "When the line fits, or why it works.",
                      "type": "string"
                    }
                  },
                  "required": ["say"],
                  "type": "object"
                },
                "type": "array"
              },
              "match_quality": {
                "description": "Present with a guide or scenario page, and with nearest_practice_situation.",
                "enum": ["close"],
                "type": "string"
              },
              "more_at": {
                "description": "The page, which has all of its lines. Present only when it has more than 8.",
                "type": "string"
              },
              "nearest_practice_situation": {
                "description": "A public practice scenario about the same situation. Present only with status no_article_yet, and only when one fits closely.",
                "properties": {
                  "age_note": {
                    "description": "Present when the scenario is not written for the age that was asked about.",
                    "type": "string"
                  },
                  "ages": {
                    "description": "Ages the scenario is written for, e.g. \"8–14\".",
                    "type": "string"
                  },
                  "play_url": {
                    "description": "Opens the scenario without an account.",
                    "type": "string"
                  },
                  "scenario_page_url": {
                    "description": "Published page for parents about this situation, when there is one.",
                    "type": "string"
                  },
                  "situation": {
                    "description": "Short excerpt of the scenario text.",
                    "type": "string"
                  },
                  "title": {
                    "type": "string"
                  },
                  "traits_practised": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "what_to_say_guide_url": {
                    "description": "Published what-to-say guide that uses this scenario, when there is one.",
                    "type": "string"
                  }
                },
                "required": ["ages", "play_url", "situation", "title"],
                "type": "object"
              },
              "note": {
                "type": "string"
              },
              "page_type": {
                "description": "Present with an answer: a /what-to-say guide, or a /scenarios page about one situation (its short answer is the page's introduction and advice for parents, its key_scripts the page's example replies by age).",
                "enum": ["what_to_say_guide", "scenario_page"],
                "type": "string"
              },
              "practice_note": {
                "description": "What the practice link is, and the ages the scenario is written for when narrower than the guide's or page's.",
                "type": "string"
              },
              "practice_url": {
                "description": "A practice scenario on a similar situation; opens without an account. Present only when the guide or page has one.",
                "type": "string"
              },
              "reviewed_by": {
                "description": "Name and credentials of the page's reviewer. Present only when the page has a named reviewer.",
                "type": "string"
              },
              "short_answer": {
                "type": "string"
              },
              "status": {
                "description": "Absent when a guide or scenario page is returned.",
                "enum": ["no_article_yet", "not_covered"],
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "topic_area": {
                "description": "With status not_covered: the kind of topic that was recognised.",
                "enum": ["self_harm_or_suicide", "abuse_or_sexual_harm", "violence_or_weapons", "eating_or_body", "medical_or_diagnostic", "legal", "bereavement_or_serious_illness"],
                "type": "string"
              },
              "updated": {
                "type": ["string", "null"]
              },
              "urgent_help": {
                "description": "Where to get urgent help: the wording of the guide's own section of that name, or, with status not_covered, the same published wording for topics involving risk of harm.",
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a what-to-say guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:309339e335d89d1e9b0a3e02e51942446e2a66fcc20a6c5616dc98a22f474fe0"
        },
