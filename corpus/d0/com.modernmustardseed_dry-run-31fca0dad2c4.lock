      "instructions": "Dry Run simulates a year of cash for a small services business. simulate_cash_year runs 10,000 possible years and reports the odds of running short, when, and why. rank_levers tests nine single changes and ranks them by how much each lowers that risk. list_presets shows the six starting businesses and every input field with its default. All tools are read-only, deterministic for a given seed, and make no network calls.",
      "tools": [
        {
          "name": "list_presets",
          "title": "List presets",
          "description": "List the six built-in business presets (excavation and septic, plumbing and drain, heating and cooling, landscaping and snow, roofing, and a general small services business) with every default input in the exact field names a simulation accepts, and the revenue, costs and profit each makes at its own averages. Static reference: no network access.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List presets"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f3d3a81c8d46545b0d239c174b224c987cb2c63c4b0cacf1346a13ef05eb3764"
        },
        {
          "name": "rank_levers",
          "title": "Rank levers",
          "description": "Test nine single changes a small business owner can make and rank them by how much each lowers the chance of running short of money in the next 52 weeks, with the change in year-end money as a tiebreak. The levers: take a third up front, take 15 days off payment terms, raise prices 5 percent, take a fifth less owner draw for six months, cut overhead 10 percent, raise the credit line by half, run one crew lighter, add a crew, and buy three more enquiries a week. Each lever and the baseline run 3,000 simulated years with the same seed, so the difference is the lever and not the luck. Takes the same business description as a cash year simulation: a preset plus any overridden inputs. Pure arithmetic: no network access, nothing stored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "bad_debt_rate": {
                "description": "Share of invoiced balances never collected, as a fraction.",
                "maximum": 0.5,
                "minimum": 0,
                "type": "number"
              },
              "close_rate": {
                "description": "Share of enquiries that become jobs, as a fraction.",
                "maximum": 1,
                "minimum": 0.01,
                "type": "number"
              },
              "collection_shape": {
                "description": "How disciplined customers are about paying on time: 2 is ragged with a long tail of late payers, 6 is disciplined.",
                "maximum": 20,
                "minimum": 0.5,
                "type": "number"
              },
              "credit_apr": {
                "description": "Annual interest on the drawn balance, as a fraction. 0.11 is 11 percent.",
                "maximum": 0.6,
                "minimum": 0,
                "type": "number"
              },
              "credit_drawn": {
                "description": "How much of the line is already drawn, in dollars.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "credit_line": {
                "description": "Size of the line of credit, in dollars. 0 for none.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "crew_cost_weekly": {
                "description": "Fully loaded weekly cost of one crew: wages, burden, fuel, vehicle.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "crews": {
                "description": "Crews (or technicians, or production units) working in parallel. One crew delivers one crew-week a week.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "fixed_costs": {
                "description": "Monthly fixed bills such as rent, insurance and equipment notes. Replaces the preset list.",
                "items": {
                  "properties": {
                    "amount": {
                      "description": "Monthly amount in dollars.",
                      "maximum": 10000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "day": {
                      "description": "Day of the month it leaves the account, 1 to 28.",
                      "maximum": 28,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "label": {
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["amount", "day", "label"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "job_types": {
                "description": "The kinds of work sold. Replaces the preset list.",
                "items": {
                  "properties": {
                    "crew_weeks": {
                      "description": "Crew-weeks of capacity one job uses. 0.5 is half a crew for a week.",
                      "maximum": 200,
                      "minimum": 0.01,
                      "type": "number"
                    },
                    "crew_weeks_cv": {
                      "default": 0.3,
                      "description": "Spread of the work per job. Default 0.3.",
                      "maximum": 2,
                      "minimum": 0.01,
                      "type": "number"
                    },
                    "deposit_pct": {
                      "description": "Deposit taken when the job is won, as a fraction of the invoice. 1 means paid in full up front.",
                      "maximum": 1,
                      "minimum": 0,
                      "type": "number"
                    },
                    "materials_pct": {
                      "description": "Materials and subcontractors as a fraction of the invoice, paid when the job starts.",
                      "maximum": 0.95,
                      "minimum": 0,
                      "type": "number"
                    },
                    "name": {
                      "description": "What the job is called, for example \"Service call\".",
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    },
                    "share": {
                      "description": "Relative share of jobs won that are this kind. Shares are normalised, so 6 and 2 means three of these for every one of the other.",
                      "maximum": 1000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "terms_days": {
                      "description": "Average days until the balance is paid after the job is done. 0 means paid on completion.",
                      "maximum": 180,
                      "minimum": 0,
                      "type": "number"
                    },
                    "value": {
                      "description": "Average invoice for this job, in dollars.",
                      "maximum": 10000000,
                      "minimum": 1,
                      "type": "number"
                    },
                    "value_cv": {
                      "default": 0.4,
                      "description": "Spread of the invoice, 0.4 means give or take 40 percent. Default 0.4.",
                      "maximum": 2,
                      "minimum": 0.01,
                      "type": "number"
                    }
                  },
                  "required": ["crew_weeks", "deposit_pct", "materials_pct", "name", "share", "terms_days", "value"],
                  "type": "object"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "leads_cv": {
                "description": "Week to week spread of enquiries. Default 0.35.",
                "maximum": 2,
                "minimum": 0.01,
                "type": "number"
              },
              "leads_per_week": {
                "description": "Enquiries in an average week before seasonality.",
                "maximum": 500,
                "minimum": 0,
                "type": "number"
              },
              "name": {
                "description": "Business name, used only to label the result.",
                "maxLength": 120,
                "type": "string"
              },
              "opening_backlog_weeks": {
                "description": "Crew-weeks of work already sold and waiting to start.",
                "maximum": 104,
                "minimum": 0,
                "type": "number"
              },
              "opening_receivables": {
                "description": "Work already invoiced and not yet paid on day one, in dollars.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "overhead_weekly": {
                "description": "Weekly overhead that runs whether or not anyone works: office, software, admin wages.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "owner_draw_weekly": {
                "description": "What the owner takes out each week.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "preset": {
                "default": "general",
                "description": "Starting template: excavation, plumbing, hvac, landscaping, roofing, or general for any other small services business. Every field below overrides it. Default general.",
                "enum": ["excavation", "plumbing", "hvac", "landscaping", "roofing", "general"],
                "type": "string"
              },
              "seasonality": {
                "description": "Twelve multipliers on enquiry volume, January first. 1 is an average month.",
                "items": {
                  "maximum": 5,
                  "minimum": 0,
                  "type": "number"
                },
                "maxItems": 12,
                "minItems": 12,
                "type": "array"
              },
              "seed": {
                "description": "Seed for the random draws. The same inputs and seed always return the same answer. Default \"dry-run\".",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "start_cash": {
                "description": "Money in the bank on the day the year starts, in dollars.",
                "maximum": 100000000,
                "minimum": -10000000,
                "type": "number"
              },
              "start_month": {
                "description": "Month the simulated year starts, 1 for January. Default: the current month.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "surprises": {
                "description": "Random setbacks such as a machine breakdown or someone quitting. Replaces the preset list.",
                "items": {
                  "properties": {
                    "capacity_loss": {
                      "description": "Crew-weeks of capacity lost each time it happens.",
                      "maximum": 50,
                      "minimum": 0,
                      "type": "number"
                    },
                    "cost": {
                      "description": "What it costs each time, in dollars.",
                      "maximum": 10000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "label": {
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    },
                    "weekly_prob": {
                      "description": "Chance it happens in any given week, for example 0.03.",
                      "maximum": 1,
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["capacity_loss", "cost", "label", "weekly_prob"],
                  "type": "object"
                },
                "maxItems": 12,
                "type": "array"
              },
              "tax_rate": {
                "description": "Share of profit set aside for tax, paid quarterly.",
                "maximum": 0.6,
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Rank levers"
          },
          "behavior": {
