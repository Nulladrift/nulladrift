                    "enum": ["not_checked", "pass", "warn", "fail"],
                    "type": "string"
                  }
                },
                "required": ["overall"],
                "type": "object"
              },
              "ScanStatus": {
                "description": "Outcome of a scan. Exactly these five string values; there are no numeric codes.",
                "enum": ["recognized", "no_document_found", "unreadable", "unsupported_document", "rejected"],
                "type": "string"
              },
              "ScanTiming": {
                "additionalProperties": false,
                "description": "The split of the request's time. Null on a scan made before the split existed and read back out of storage: only the engine call was timed then, and the two halves cannot be recovered from it.",
                "properties": {
                  "processing_ms": {
                    "description": "The recognition itself – the server-side engine call.",
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "total_ms": {
                    "description": "From the request arriving to the result being complete. At least `upload_ms + processing_ms`; the remainder is the gates that run after `upload_ms` is taken – the allowance, the idempotency check and the credit hold – plus preparing the result images and mapping the engine's output into this body. It stops there: writing the history row and serializing the response happen after the number is fixed, so the same figure is stored and returned.",
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
