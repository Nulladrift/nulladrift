      },
      "serverInfo": {
        "name": "doc-cheap-mcp",
        "version": "0.3.11"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {},
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "This server recognises identity documents: give it a photo or scan of a passport, national ID card or driver's licence and it returns what is printed on the document as structured JSON. Reach for scan_document whenever someone shares such a document and wants it read, transcribed or checked – it draws one credit ($0.01) per document actually recognised and nothing at all when the image holds no readable document. Call check_balance before working through a batch, and search_docs for field names, error codes, MRZ rules and anything else about the API rather than guessing at them. list_scans, get_scan and delete_scan find, read back and delete results a live key has already stored.",
      "tools": [
        {
          "name": "check_balance",
          "title": "Check remaining credits",
          "description": "Return how many credits are left on the account and what the current period has used: the balance, split into this month's free credits (100 every month, drawn first) and the paid credits, the credits spent, and the scan counters broken down by status (recognized, unreadable, no document found, unsupported document, rejected). Takes no arguments and calls GET /v1/usage; under the public sandbox key it answers without calling anything. One recognised document draws one credit, at $0.01; scans that recognised nothing are counted and never charged. Needs a real API key – under the public sandbox key there is no account behind the call, and the answer says so instead of reporting zeros that read like a balance. Use it before working through a batch of documents, or when a scan is refused for lack of credit.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "balance_credits": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Credits currently available to the account: this month's free credits plus the paid credits; null for a key with no account (the public sandbox key)."
              },
              "credits_spent": {
                "description": "Credits charged within the period.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "credits_spent_by_kind": {
                "additionalProperties": false,
                "description": "Credits charged within the period, by the kind that paid.",
                "properties": {
                  "free": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "paid": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["free", "paid"],
                "type": "object"
              },
              "free_allowance": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "monthly_credits": {
                        "description": "Free credits the account is set back to at the start of each UTC calendar month: 100 every month.",
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "remaining_credits": {
                        "description": "Free credits left this month.",
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "resets_at": {
                        "anyOf": [
                          {
                            "format": "date-time",
                            "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "When the free credits are next set back to the monthly amount (00:00 UTC on the first of the next month); null when there is no next monthly amount."
                      }
                    },
                    "required": ["monthly_credits", "remaining_credits", "resets_at"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "This month's free credits, drawn before paid credits; null when the account may not draw free credits (its email address is not confirmed, or its free credits were withdrawn) and for a key with no account."
              },
              "paid_balance_credits": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Paid credits: bought or granted to the account, drawn once this month's free credits are used up, and never reset; null only for a key with no account (the public sandbox key)."
              },
              "period": {
                "additionalProperties": false,
                "description": "Bounds of the current usage period (UTC calendar month).",
                "properties": {
                  "end": {
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                    "type": "string"
                  },
                  "start": {
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                    "type": "string"
                  }
                },
                "required": ["end", "start"],
                "type": "object"
              },
              "scans": {
                "additionalProperties": false,
                "properties": {
                  "billed": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "by_status": {
                    "additionalProperties": false,
                    "properties": {
                      "no_document_found": {
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "recognized": {
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "rejected": {
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "unreadable": {
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "unsupported_document": {
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      }
                    },
                    "required": ["no_document_found", "recognized", "rejected", "unreadable", "unsupported_document"],
                    "type": "object"
                  },
                  "total": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["billed", "by_status", "total"],
                "type": "object"
              }
            },
            "required": ["balance_credits", "credits_spent", "credits_spent_by_kind", "free_allowance", "paid_balance_credits", "period", "scans"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:06c8ee88b4d7d2ca641570dc57c3ea6948a3f11fd498b87b629545ca0b2ab779"
        },
        {
          "name": "delete_scan",
          "title": "Delete a stored scan",
          "description": "Permanently delete one stored scan now, before its retention window would end. This cannot be undone: the stored result, its history row and its thumbnail are removed, and the scan can no longer be listed, fetched or replayed through its idempotency_key. The credit it drew is not refunded, and this period's usage counters still count it. Input: scan_id – meta.id of a scan_document result, or id of a list_scans row. Output: { id, deleted: true }. Calls DELETE /v1/scans/{id}. Only scans made with a live key under a non-zero retention window are stored for the account, and only until that window ends (retain_hours on the scan, or the account's history-retention setting, one year by default); a scan made with retain_hours 0 was never stored. A key reaches its own account's scans and no other account's. Under a sandbox key nothing can be read back: an account's own sk_sandbox_ key stores nothing, and the public key keeps every scan for one year, with a reduced thumbnail and the address it came from, where that key cannot read, list or delete it. Errors: an id that is unknown, belongs to another account, has passed its window or was already deleted is refused as not_found, and nothing is deleted. Use it when someone asks for a document's data to be removed; confirm the id with list_scans or get_scan first, because the deletion is final.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "scan_id": {
                "description": "The scan's id: meta.id of the scan_document result, or id of a list_scans row (a lower-case UUID).",
                "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$",
                "type": "string"
              }
            },
            "required": ["scan_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "definitions": {
              "ScanId": {
                "description": "Scan identifier: a UUID version 7 (RFC 9562), canonical lower-case `8-4-4-4-12`. Its leading 48 bits are the millisecond the scan was made, so ids sort in the order the scans happened – but treat the value as opaque: nothing else about it is part of the contract.",
                "example": "01a0af18-cd8d-7a61-9f2d-4c7b8e105da3",
                "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$",
                "type": "string"
              }
            },
            "properties": {
              "deleted": {
                "const": true,
                "description": "Always true: the stored result is gone and cannot be read back.",
                "type": "boolean"
              },
              "id": {
                "$ref": "#/definitions/ScanId"
              }
            },
            "required": ["deleted", "id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:bc0ecc6cab22e5aed0c48f6a446622ab4cd892bf2a6cbb35ecea3cc4145bd7fe"
        },
        {
          "name": "get_scan",
          "title": "Fetch a stored scan",
          "description": "Fetch the full result of one stored scan by its id, as it was returned when the document was recognised. Input: scan_id – meta.id of a scan_document result, or id of a list_scans row. Output: the same Scan object scan_document returns (meta, document, holder, fields, mrz and the rest) plus a one-line summary, with two differences: the image crops are never stored, so every images slot is null, and quality reads not_checked. Calls GET /v1/scans/{id}; it never re-runs recognition and never charges a credit. Only scans made with a live key under a non-zero retention window are stored for the account, and only until that window ends (retain_hours on the scan, or the account's history-retention setting, one year by default); a scan made with retain_hours 0 was never stored. A key reaches its own account's scans and no other account's. Under a sandbox key nothing can be read back: an account's own sk_sandbox_ key stores nothing, and the public key keeps every scan for one year, with a reduced thumbnail and the address it came from, where that key cannot read, list or delete it. Errors: an id that is unknown, belongs to another account, was made with retain_hours 0 or has passed its window is refused as not_found – the cases are not told apart. Use it to read back a document recognised earlier instead of scanning the image again.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "scan_id": {
                "description": "The scan's id: meta.id of the scan_document result, or id of a list_scans row (a lower-case UUID).",
                "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$",
                "type": "string"
              }
            },
            "required": ["scan_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "definitions": {
              "CheckResult": {
                "description": "Outcome of a single check.",
                "enum": ["pass", "warn", "fail"],
                "type": "string"
              },
              "ConfidenceBand": {
                "description": "How strongly the recognition backs this value: `high`, `medium` or `low`. An unknown or missing probability reads as `low`.",
                "enum": ["low", "medium", "high"],
                "type": "string"
              },
              "CountryCodeCategory": {
                "description": "What a document's country code is. `iso`: an ISO 3166-1 alpha-3 code. `icao_variant`: an ICAO spelling of an ISO state (`D` for Germany). `british_nationality`: a British nationality class (`GBD`, `GBN`, `GBO`, `GBP`, `GBS`). `kosovo`: `RKS`, which ISO does not list. `united_nations`: `UNO`, `UNA`, `UNK`. `organization`: an issuing authority that is not a state (`EUE`, `XPO`, `IAO` and the other `X..` codes of ICAO Doc 9303). `stateless`: `XXA`. `refugee`: `XXB`, `XXC`. `unspecified`: `XXX`. `deprecated`: a code ISO has withdrawn (`ANT`, `NTZ`). `specimen`: `UTO`, the fictional state of specimen documents. `unknown`: a code in none of these lists.",
                "enum": ["iso", "icao_variant", "british_nationality", "kosovo", "united_nations", "organization", "stateless", "refugee", "unspecified", "deprecated", "specimen", "unknown"],
                "type": "string"
              },
              "CountryCodeDetail": {
                "additionalProperties": false,
                "description": "A document's country code resolved: the code as written, its ISO 3166-1 codes when ISO has them, and what kind of code it is.",
                "properties": {
                  "alpha2": {
                    "anyOf": [
                      {
                        "pattern": "^[A-Z]{2}$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "The ISO 3166-1 alpha-2 code of the same state, or null with `alpha3`.",
                    "example": "DE"
                  },
                  "alpha3": {
                    "anyOf": [
                      {
                        "pattern": "^[A-Z]{3}$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "The ISO 3166-1 alpha-3 code of the state the code stands for, or null when ISO has none (Kosovo, organisations, stateless persons, refugees, specimens, unknown codes).",
                    "example": "DEU"
                  },
                  "category": {
                    "$ref": "#/definitions/CountryCodeCategory"
                  },
                  "code": {
                    "description": "The code as the document writes it, without the zone's `<` filler: `D` for Germany, `GBD` for a British Overseas Territories citizen.",
                    "example": "D",
                    "pattern": "^[A-Z]{1,3}$",
                    "type": "string"
                  }
                },
                "required": ["alpha2", "alpha3", "category", "code"],
                "type": "object"
              },
              "FieldCategory": {
                "description": "Which group of the report a field belongs to.",
                "enum": ["identity", "document", "dates", "address", "visa", "other"],
                "type": "string"
              },
              "MrzStatus": {
                "description": "Verdict on the machine-readable zone: `passed` (present, every check digit valid and nothing contradicting the printed page), `failed` (present but something did not check out) or `absent` (the document carries none).",
                "enum": ["passed", "failed", "absent"],
                "type": "string"
              },
              "ScanAuthenticity": {
                "additionalProperties": false,
                "properties": {
                  "checks": {
                    "description": "One entry per authenticity check that ran. Always present; empty under the recognition-only scenario, where nothing ran.",
                    "items": {
                      "$ref": "#/definitions/ScanCheck"
                    },
                    "type": "array"
                  },
                  "overall": {
                    "description": "`not_checked` under the recognition-only scenario; populated by authenticity verification later.",
                    "enum": ["not_checked", "pass", "warn", "fail"],
                    "type": "string"
                  }
                },
                "required": ["checks", "overall"],
                "type": "object"
              },
              "ScanCheck": {
                "additionalProperties": false,
                "properties": {
                  "detail": {
                    "description": "One plain sentence about what this check saw, or null when it has nothing to add.",
                    "type": ["string", "null"]
                  },
                  "label": {
                    "description": "Our human label for this check.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "name": {
                    "description": "Our stable snake_case key for this check.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "result": {
                    "$ref": "#/definitions/CheckResult"
                  }
                },
                "required": ["detail", "label", "name", "result"],
                "type": "object"
              },
              "ScanDocument": {
                "additionalProperties": false,
                "properties": {
                  "country": {
                    "anyOf": [
                      {
                        "description": "Three-letter country code as the document writes it (ICAO Doc 9303): the ISO 3166-1 alpha-3 code for almost every state, Germany's `D` given as `DEU`, and the ICAO codes ISO lacks (for example `GBD`, `RKS`, `XXA`) passed through as read. The matching `*_detail` object says which of these it is.",
                        "example": "GRC",
                        "pattern": "^[A-Z]{3}$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "The state that issued the document, as its three-letter code. The same reading as `issuing_state` under the name most callers filter on; null when nothing was read."
                  },
                  "country_name": {
                    "description": "The issuing state's name, as read from the document.",
                    "example": "Greece",
                    "type": ["string", "null"]
                  },
                  "days_remaining": {
                    "anyOf": [
                      {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Days until expiry at the time of the scan; negative once expired."
                  },
                  "expiry_date": {
                    "anyOf": [
                      {
                        "description": "Calendar date, ISO-8601 (`YYYY-MM-DD`).",
                        "format": "date",
                        "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "The date the document expires, ISO-8601 (`YYYY-MM-DD`). Null when none was read; `is_expired` and `days_remaining` are computed from it."
                  },
                  "is_expired": {
                    "description": "Whether the document had already expired when the scan was made. Null when no expiry date was read, which is a different answer from `false`.",
                    "type": ["boolean", "null"]
                  },
                  "issue_date": {
                    "anyOf": [
                      {
                        "description": "Calendar date, ISO-8601 (`YYYY-MM-DD`).",
                        "format": "date",
                        "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "The date the document was issued, ISO-8601 (`YYYY-MM-DD`). Null when none was read."
                  },
                  "issuing_state": {
                    "anyOf": [
                      {
                        "description": "Three-letter country code as the document writes it (ICAO Doc 9303): the ISO 3166-1 alpha-3 code for almost every state, Germany's `D` given as `DEU`, and the ICAO codes ISO lacks (for example `GBD`, `RKS`, `XXA`) passed through as read. The matching `*_detail` object says which of these it is.",
                        "example": "GRC",
                        "pattern": "^[A-Z]{3}$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "The issuing state, the three-letter code the document writes – the same reading as `country`, under the name the machine-readable zone gives it."
                  },
                  "issuing_state_detail": {
                    "anyOf": [
                      {
                        "$ref": "#/definitions/CountryCodeDetail"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "The issuing state's code resolved: as written, as ISO 3166-1 alpha-3 and alpha-2, and its category. Null when no code was read."
                  },
                  "kind": {
                    "description": "Document type, e.g. `passport`.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "number": {
                    "description": "The document number, as printed. Null when none was read. A series the document prints separately is in `series`, never folded into this value.",
                    "example": "AM7304518",
                    "type": ["string", "null"]
                  },
                  "series": {
                    "description": "The document series, for a document that prints one as a field of its own. Null when the document carries none or none was read; it is never split out of `number`.",
                    "type": ["string", "null"]
                  },
                  "type_confidence": {
                    "allOf": [
                      {
                        "$ref": "#/definitions/ConfidenceBand"
                      }
                    ],
                    "description": "How strongly the document-type match is backed."
                  },
                  "type_name": {
                    "description": "The document type under its full name. Null on a scan read back from storage, which keeps no engine output.",
                    "example": "Greece - Passport",
                    "type": ["string", "null"]
                  }
                },
                "required": ["country", "country_name", "days_remaining", "expiry_date", "is_expired", "issue_date", "issuing_state", "issuing_state_detail", "kind", "number", "series", "type_confidence", "type_name"],
                "type": "object"
              },
              "ScanField": {
                "additionalProperties": false,
                "properties": {
                  "category": {
                    "$ref": "#/definitions/FieldCategory"
                  },
                  "confidence": {
                    "$ref": "#/definitions/ConfidenceBand"
                  },
                  "id": {
                    "description": "Identity of this entry, unique across `fields`: the key and the language identifier the value was read as, plus an occurrence counter when the same pair is reported twice. `name` is the semantic key and repeats – a document that carries a field in two scripts yields one entry per language – so use `id`, not `name`, to address or key a single entry.",
                    "example": "surname@1032",
                    "minLength": 1,
                    "type": "string"
                  },
                  "label": {
                    "description": "Our human label.",
                    "example": "Surname",
                    "minLength": 1,
                    "type": "string"
                  },
                  "language": {
                    "description": "The language this reading was made in, e.g. `Greek`. The default Latin-script reading – the document's own Latin page and the machine-readable zone, `id` suffix `@0` – is `English`. Null only on `days_to_expire`, a number computed from the expiry date rather than text read in any language.",
                    "example": "Greek",
                    "type": ["string", "null"]
                  },
                  "name": {
                    "description": "Our stable snake_case key.",
                    "example": "surname",
                    "minLength": 1,
                    "type": "string"
                  },
                  "value": {
                    "description": "The value of this reading: the national-script spelling on a national-script reading, the transliterated Latin value on the default reading (the one whose `id` carries the identifier `0`). Null when the field is empty.",
                    "type": ["string", "null"]
                  }
                },
                "required": ["category", "confidence", "id", "label", "language", "name", "value"],
                "type": "object"
              },
              "ScanHolder": {
                "additionalProperties": false,
                "properties": {
                  "birth_date": {
                    "anyOf": [
                      {
                        "description": "Calendar date, ISO-8601 (`YYYY-MM-DD`).",
                        "format": "date",
                        "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "The holder's date of birth, ISO-8601 (`YYYY-MM-DD`). Null when none was read."
                  },
                  "full_name": {
                    "description": "The holder's name as the document prints it in one combined field. Null when the document carries no such field – it is not composed from the two above.",
                    "type": ["string", "null"]
