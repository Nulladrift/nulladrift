                  "rear": {
                    "anyOf": [
                      {
                        "description": "Image as a `data:` URL with base64 payload.",
                        "pattern": "^data:image\\/(jpeg|png);base64,[A-Za-z0-9+/]+={0,2}$",
                        "type": "string"
