        {
          "name": "scan_document",
          "title": "Recognise a passport or ID document",
          "description": "Recognise a passport, national ID card or driver's licence from a photo or scan and return what is printed on it as structured JSON. Inputs: the image as image_base64 or image_url (https, on a public address); plus the optional expect_country, return_portrait, retain_hours, reference and idempotency_key. Output: a Scan object – meta (id, status, billed, confidence, timing), document (kind, issuing country, number, series, date of issue, date of expiry, whether it has expired and how many days are left), holder (given names, surname, date of birth, sex, nationality) – country codes are the document's own three-letter ICAO codes, each with a *_detail object giving the code as written, its ISO 3166-1 alpha-3 and alpha-2 and its category, fields (every field read off the printed page, each with its own confidence), mrz (whether the machine-readable zone checks out, why not when it does not, and its lines exactly as read), images, quality and authenticity – plus a one-line summary of the same result. Calls POST /v1/scans. Cost: it bills one credit ($0.01) only when a document is recognised; an unreadable image, an empty frame or an unsupported type costs nothing, and meta.billed says which happened. Without a key, the public sandbox key is used. It gives 10 free recognised documents per address in all, and at most 10 requests per address an hour, whatever their answer. Registering gives 100 free documents every month. Use test images only, never a real document. Use it whenever someone hands over an identity document and wants it read, transcribed, or checked against what they claim – a name, a document number, a date of birth or an expiry date.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "expect_country": {
                "description": "ISO 3166-1 alpha-3 country you expect, or omit for any.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "idempotency_key": {
                "description": "Makes a retried scan return the first result instead of charging again.",
                "type": "string"
              },
              "image_base64": {
                "description": "The document image as base64 (a data: URL is also accepted).",
                "type": "string"
              },
              "image_url": {
                "description": "https: URL of an image on a public internet address, which the server fetches (25 MB maximum).",
                "type": "string"
              },
              "reference": {
                "description": "Your own correlation string, echoed back in the result.",
                "maxLength": 128,
                "type": "string"
              },
              "retain_hours": {
                "description": "Hours the result stays readable via GET /v1/scans/{id} (0 = store nothing). Omit it to use the account's own history-retention setting.",
                "maximum": 8760,
                "minimum": 0,
                "type": "integer"
              },
              "return_portrait": {
                "description": "Whether to include the holder photograph crop, images.main_photo (default true).",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "definitions": {
              "CheckResult": {
                "description": "Outcome of a single check.",
                "enum": ["pass", "warn", "fail"],
                "type": "string"
              },
              "ConfidenceBand": {
                "description": "How strongly the recognition backs this value: `high`, `medium` or `low`. An unknown or missing probability reads as `low`.",
                "enum": ["low", "medium", "high"],
                "type": "string"
              },
              "CountryCodeCategory": {
                "description": "What a document's country code is. `iso`: an ISO 3166-1 alpha-3 code. `icao_variant`: an ICAO spelling of an ISO state (`D` for Germany). `british_nationality`: a British nationality class (`GBD`, `GBN`, `GBO`, `GBP`, `GBS`). `kosovo`: `RKS`, which ISO does not list. `united_nations`: `UNO`, `UNA`, `UNK`. `organization`: an issuing authority that is not a state (`EUE`, `XPO`, `IAO` and the other `X..` codes of ICAO Doc 9303). `stateless`: `XXA`. `refugee`: `XXB`, `XXC`. `unspecified`: `XXX`. `deprecated`: a code ISO has withdrawn (`ANT`, `NTZ`). `specimen`: `UTO`, the fictional state of specimen documents. `unknown`: a code in none of these lists.",
                "enum": ["iso", "icao_variant", "british_nationality", "kosovo", "united_nations", "organization", "stateless", "refugee", "unspecified", "deprecated", "specimen", "unknown"],
                "type": "string"
              },
              "CountryCodeDetail": {
                "additionalProperties": false,
                "description": "A document's country code resolved: the code as written, its ISO 3166-1 codes when ISO has them, and what kind of code it is.",
                "properties": {
                  "alpha2": {
                    "anyOf": [
                      {
                        "pattern": "^[A-Z]{2}$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "The ISO 3166-1 alpha-2 code of the same state, or null with `alpha3`.",
                    "example": "DE"
                  },
                  "alpha3": {
                    "anyOf": [
                      {
                        "pattern": "^[A-Z]{3}$",
                        "type": "string"
                      },
                      {
