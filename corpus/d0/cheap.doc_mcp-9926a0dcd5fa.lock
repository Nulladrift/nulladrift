        {
          "name": "list_scans",
          "title": "List stored scans",
          "description": "List the account's stored scans, most recent first, one page at a time. Inputs: the optional limit (1 to 100 rows, default 20) and cursor (the next_cursor of the previous page; omit it for the first page). Output: scans – one row per scan with id, status (recognized, unreadable, no_document_found, unsupported_document or rejected), billed, duration_ms, reference (your own string from the scan) and created_at – and next_cursor, which is null on the last page. A row holds no extracted data; call get_scan with its id for the full result. Calls GET /v1/scans; it never charges a credit. Only scans made with a live key under a non-zero retention window are stored for the account, and only until that window ends (retain_hours on the scan, or the account's history-retention setting, one year by default); a scan made with retain_hours 0 was never stored. A key reaches its own account's scans and no other account's. Under a sandbox key nothing can be read back: an account's own sk_sandbox_ key stores nothing, and the public key keeps every scan for one year, with a reduced thumbnail and the address it came from, where that key cannot read, list or delete it. Under the public sandbox key the answer is an empty list, given without calling the API. Errors: a cursor this API did not issue is refused (validation_failed); a key the API does not know is refused (unauthorized). Use it to find a scan made earlier – by its reference or its time – before reading or deleting it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cursor": {
                "description": "next_cursor from the previous page; omit it for the first page.",
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "description": "Rows per page, 1 to 100 (default 20).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "definitions": {
              "ScanId": {
                "description": "Scan identifier: a UUID version 7 (RFC 9562), canonical lower-case `8-4-4-4-12`. Its leading 48 bits are the millisecond the scan was made, so ids sort in the order the scans happened – but treat the value as opaque: nothing else about it is part of the contract.",
                "example": "01a0af18-cd8d-7a61-9f2d-4c7b8e105da3",
                "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$",
                "type": "string"
              },
              "ScanStatus": {
                "description": "Outcome of a scan. Exactly these five string values; there are no numeric codes.",
                "enum": ["recognized", "no_document_found", "unreadable", "unsupported_document", "rejected"],
                "type": "string"
              },
              "ScanSummary": {
                "additionalProperties": false,
                "properties": {
                  "billed": {
                    "description": "Whether the scan met the billing rule. On a live key, `true` means one credit was charged. On a sandbox key nothing is ever charged, and the flag only shows whether the same scan would have been.",
                    "type": "boolean"
                  },
                  "created_at": {
                    "description": "Timestamp, ISO-8601 in UTC (`YYYY-MM-DDTHH:MM:SSZ`).",
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                    "type": "string"
                  },
                  "duration_ms": {
                    "description": "Server-side processing time of the scan in milliseconds.",
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "id": {
                    "$ref": "#/definitions/ScanId"
                  },
                  "reference": {
                    "description": "The request's `reference`, echoed back.",
                    "type": ["string", "null"]
                  },
                  "status": {
                    "$ref": "#/definitions/ScanStatus"
