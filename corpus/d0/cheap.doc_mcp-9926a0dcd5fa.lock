                  "surname": {
                    "description": "The holder's surname, as printed. Null when none was read.",
                    "type": ["string", "null"]
                  }
                },
                "required": ["birth_date", "full_name", "given_names", "nationality", "nationality_detail", "sex", "surname"],
                "type": "object"
