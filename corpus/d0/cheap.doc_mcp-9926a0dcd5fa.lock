                  }
                },
                "required": ["billed", "confidence", "created_at", "id", "reference", "schema_version", "status", "timing"],
                "type": "object"
              },
              "ScanMrz": {
                "additionalProperties": false,
                "properties": {
                  "lines": {
                    "anyOf": [
                      {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "The zone's lines in order, exactly as read – two for a TD3 passport, three for a TD1 card. The zone's alphabet is `A-Z`, `0-9` and the filler `<`, so a line carries no whitespace. Null when the document carries none."
