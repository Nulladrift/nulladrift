      "instructions": "Austin Pool Guy is a free referral service for pool service in Austin, Texas (Austin, Round Rock, Cedar Park, Pflugerville, Georgetown, Lakeway). Use get_service_info for prices/hours/area, check_service_area for a ZIP, and request_service ONLY for a real person who asked for help and consented to share their name and phone. A local pro calls them back. Phone/text (737) 306-2267.",
