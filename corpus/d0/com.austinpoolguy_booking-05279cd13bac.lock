          "name": "request_service",
          "title": "Request pool service (free callback)",
          "description": "Book pool service in the Austin area for a real person who asked for it, with their consent. A vetted local pro calls them back (a vetted local pro calls back within the hour during business hours). Free to the homeowner. Returns a reference and what happens next. Check the ZIP with check_service_area first if unsure.",
          "inputSchema": {
