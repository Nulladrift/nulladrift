{
  "lockfileVersion": 2,
  "subjects": {
    "app.payperwork/decisions": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://payperwork.app/decide/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "payperwork-decide",
        "version": "0.4.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Decision models for agents, paid per decision in USDC over x402: a state plus typed questions (noul, choice, score) answered as probabilities in one pass. The decide tool quotes its price in the 402 for your exact request; models is free. Security model: every call is priced before it runs (the 402 states the amount) and charged only if it succeeds; the paying wallet is the identity; no account or key exists to revoke. Full statement: GET / (JSON) or /llms.txt. Decisions: the state and questions go to the model's host and are not stored by PayperWork; a failed model call is not charged; the answer is a probability over the options you allowed, not a verified fact.",
      "tools": [
        {
          "name": "decide",
          "description": "Answer typed questions about a state with probabilities, in one pass and no generated text. questions is a map of id to {type, instructions, criteria}: noul (yes/no; the answer is the probability of yes), choice (criteria {option_id: description}, 2 to 20; the answer names the option with a probability per option and a confidence), score (criteria [lowest, ..., highest], 2 to 10; the answer is the probability-weighted level, 0 = lowest). Up to 64 questions per call. Models: cloudflare/clef-flash, cloudflare/clef (default cloudflare/clef-flash). Price per decision is quoted in the 402 from your input size (input rate x 1.4 + $0.0005, minimum $0.001); output is free. Charged only if the model call succeeds. The answer is a probability, not a verified fact. Images not accepted yet.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "model": {
                "type": "string"
              },
              "questions": {
                "additionalProperties": {
                  "properties": {
                    "criteria": {
                      "anyOf": [
                        {
                          "additionalProperties": {
                            "type": "string"
                          },
                          "propertyNames": {
                            "type": "string"
                          },
                          "type": "object"
                        },
                        {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        }
                      ]
                    },
                    "instructions": {
                      "maxLength": 2000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "type": {
                      "enum": ["noul", "choice", "score"],
                      "type": "string"
                    }
                  },
                  "required": ["instructions", "type"],
                  "type": "object"
                },
                "propertyNames": {
                  "pattern": "^[A-Za-z0-9_.-]{1,100}$",
                  "type": "string"
                },
                "type": "object"
              },
              "state": {}
            },
            "required": ["questions", "state"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Decide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 0.001
          },
          "digest": "sha256:f4d8a61da0864cf212cf98005b95b6680df613026112ed8c3f838c6c290f65ac"
        },
        {
          "name": "models",
          "title": "Decision models",
          "description": "List the decision models with rates, the pricing formula, limits and the request and answer shapes. Free.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:460612d5c5b4d8a146ad47b8419d220508508ab02eef549939b803b1983aa799"
        }
      ],
      "digest": "sha256:fd00271e0ef12359cf76bef50960e83c899b8862645750209579a6b637055a68"
    }
  }
}
