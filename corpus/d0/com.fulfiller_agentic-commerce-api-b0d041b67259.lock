        {
          "name": "quote_by_quantity",
          "title": "Comparer les prix par quantité",
          "description": "Grille de devis pour plusieurs paliers de quantité en UN appel — la bonne façon de répondre à « combien pour 100, 250, 500 ? ». Prix de chaque palier : `devis.finalPriceHt` (promotion déduite). Même règle que quote_product, palier par palier : hors plage → erreur localisée sans invalider les autres ; hors du pas → coté au palier commandable le plus proche, que `quotedQuantity` indique (le prix porte sur cette quantité, pas sur le palier demandé).",
          "inputSchema": {
            "properties": {
              "productId": {
                "description": "Identifiant rendu par search_products.",
                "minimum": 1,
                "type": "integer"
              },
              "quantities": {
                "description": "Paliers de quantité à coter (1 à 20).",
                "items": {
                  "minimum": 1,
                  "type": "integer"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "selection": {
                "description": "Sélection d’options : même forme et mêmes règles que `selection` de quote_product (codes ou libellés, défauts du produit, `preset`, tailles).",
                "properties": {
                  "options": {
                    "items": {
                      "properties": {
                        "option": {
                          "type": "string"
                        },
                        "quantity": {
                          "minimum": 1,
                          "type": "integer"
                        },
                        "size": {
                          "properties": {
                            "code": {
                              "type": "string"
                            },
                            "height": {
                              "exclusiveMinimum": 0,
                              "type": "number"
                            },
                            "width": {
                              "exclusiveMinimum": 0,
                              "type": "number"
                            }
                          },
                          "required": ["code"],
                          "type": "object"
                        },
                        "type": {
                          "enum": ["QUANTITY", "DELIVERY_TIME", "LIST_OF_VALUES", "SIZE"],
                          "type": "string"
                        },
                        "value": {
                          "type": "string"
                        }
                      },
                      "required": ["option", "type"],
                      "type": "object"
                    },
                    "maxItems": 50,
                    "type": "array"
                  },
                  "preset": {
                    "maxLength": 128,
                    "type": "string"
                  }
                },
                "required": ["options"],
                "type": "object"
              }
            },
            "required": ["productId", "quantities", "selection"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
