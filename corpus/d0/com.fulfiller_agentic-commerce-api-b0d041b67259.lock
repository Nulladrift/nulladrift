                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Résoudre un produit par SKU ou URL"
          },
          "behavior": {
            "destructive": false,
