      "serverInfo": {
        "name": "agentic-commerce-api",
        "title": "Fulfiller — print catalogue & quotes",
        "version": "0.1.3"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Catalogue et devis Fulfiller (imprimerie en ligne). Un produit n’est pas un SKU à prix figé mais un espace de configuration dont le prix est CALCULÉ. Enchaînement : search_products → get_product_configuration → (validate_selection) → quote_product, ou quote_by_quantity pour comparer des paliers. Le `startingPrice` d’une recherche est le prix d’appel affiché par le site, indicatif (parfois périmé), dont la base varie d’un produit à l’autre ; seul quote_product donne un prix ferme. Le prix à annoncer est `devis.finalPriceHt` (promotion déduite) ; `devis.priceHt` est le prix catalogue, barré quand une promotion s’applique. Tous les prix sont HT, hors TVA et hors port. Pour décrire un devis, citez `summary` : chaque option y figure en clair, avec un `status` qui dit si sa valeur est celle demandée (AS_REQUESTED), un défaut du produit (DEFAULT), ou une valeur que l’utilisateur n’a pas obtenue telle quelle (REPLACED_BY_DEFAULT, ADJUSTED, CHANGED_BY_CONFIGURATOR, avec `requested`). Quand `requiresReview` vaut true, le prix porte sur cette sélection et non sur la demande : signalez-le à l’utilisateur.",
      "tools": [
        {
          "name": "create_cart",
          "title": "Créer un panier",
          "description": "Crée un panier anonyme, éventuellement avec ses premières lignes (cotées à l’ajout, prix FIGÉ). Un panier n’est PAS une commande : rien n’est engagé, et le total est HT — hors TVA et hors port. Chaque ligne désigne le produit par son productId (rendu par search_products) ; le sku est facultatif. `unitPriceHt` et `lineTotalHt` sont promotion déduite. Renvoie le panier complet : n’appelez pas get_cart juste après.",
          "inputSchema": {
            "properties": {
              "idempotencyKey": {
                "description": "UUID optionnel. Rejouer le MÊME appel avec la même clé renvoie le panier déjà créé au lieu d’en créer un second : à utiliser si vous devez réessayer après une erreur.",
                "format": "uuid",
                "type": "string"
              },
              "lines": {
                "description": "Lignes initiales (0 à 5). Un panier vide est légitime.",
                "items": {
                  "properties": {
                    "productId": {
                      "description": "Identifiant produit rendu par search_products (alias : `zeloomProductId`).",
                      "minimum": 1,
                      "type": "integer"
                    },
                    "quantity": {
                      "description": "Nombre de LOTS identiques au prix unitaire figé — PAS un palier de volume : 2×50 exemplaires n’a pas le même prix qu’1×100. Pour changer de volume, re-cotez avec une autre QUANTITY dans `selection`, puis remplacez la ligne. Défaut 1.",
                      "maximum": 1000,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "selection": {
                      "description": "Sélection d’options : même forme et mêmes règles que `selection` de quote_product (codes ou libellés, défauts du produit, `preset`, tailles).",
                      "properties": {
                        "options": {
                          "items": {
                            "properties": {
                              "option": {
                                "type": "string"
                              },
                              "quantity": {
                                "minimum": 1,
                                "type": "integer"
                              },
                              "size": {
                                "properties": {
                                  "code": {
                                    "type": "string"
                                  },
                                  "height": {
                                    "exclusiveMinimum": 0,
                                    "type": "number"
                                  },
                                  "width": {
                                    "exclusiveMinimum": 0,
                                    "type": "number"
                                  }
                                },
                                "required": ["code"],
                                "type": "object"
                              },
                              "type": {
                                "enum": ["QUANTITY", "DELIVERY_TIME", "LIST_OF_VALUES", "SIZE"],
                                "type": "string"
                              },
                              "value": {
                                "type": "string"
                              }
                            },
                            "required": ["option", "type"],
                            "type": "object"
                          },
                          "maxItems": 50,
                          "type": "array"
                        },
                        "preset": {
                          "maxLength": 128,
                          "type": "string"
                        }
                      },
                      "required": ["options"],
                      "type": "object"
                    },
                    "sku": {
                      "description": "SKU exact rendu par search_products. FACULTATIF : absent, il est déduit du productId (PRODUCT_AMBIGUOUS si plusieurs fiches vendent ce produit : le message cite leurs SKU).",
                      "maxLength": 128,
                      "type": "string"
                    }
                  },
                  "required": ["productId", "selection"],
                  "type": "object"
                },
                "maxItems": 5,
                "type": "array"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Créer un panier"
          },
