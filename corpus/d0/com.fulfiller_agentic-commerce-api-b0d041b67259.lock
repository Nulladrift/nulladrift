        },
        {
          "name": "get_product_configuration",
          "title": "Lire l’espace de configuration d’un produit",
          "description": "Renvoie les options configurables d’un produit (quantités, délais, valeurs, tailles) et leurs valeurs disponibles. À appeler AVANT validate_selection ou quote_product : chez Fulfiller, un produit n’est pas un SKU à prix figé mais un espace de configuration. `presets` : configurations prêtes à l’emploi, cotables telles quelles via `selection.preset`. Les dépendances entre options (une finition qui exige le recto verso…) n’y figurent pas : validate_selection les révèle (`enabledOptions`).",
          "inputSchema": {
            "properties": {
              "productId": {
                "description": "Identifiant rendu par search_products.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["productId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Lire l’espace de configuration d’un produit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:17ac1473f3163226d66c22f07f03b63b38c6d5ba656894d692fc37dba9d406a9"
        },
        {
          "name": "get_product_details",
          "title": "Lire la fiche d’un produit",
          "description": "Fiche PIM d’un produit : descriptions, points clés, questions fréquentes, contraintes de fichier (fond perdu, résolution, marges, mode colorimétrique) et ressources (visuels, gabarits, consignes techniques). À utiliser pour DÉCRIRE un produit ou aider à préparer un fichier. Ne renvoie aucun prix — pour coter, passez par quote_product ; un prix écrit dans les textes de la fiche (« Dès 14.5 € ») est souvent périmé, ne l’annoncez pas. Les vidéos sont dans `videos`, pas dans `images`. Fournissez exactement un argument (`productId`, `sku` ou `url`). Les champs absents ne sont pas renseignés au PIM ; la FAQ est rare.",
          "inputSchema": {
            "properties": {
              "productId": {
                "description": "Identifiant rendu par search_products (alias : `zeloomProductId`).",
                "minimum": 1,
                "type": "integer"
              },
              "sku": {
                "description": "SKU exact, tel que rendu par search_products ou resolve_product.",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "url": {
                "description": "URL d’une fiche produit de www.fulfiller.com (http, sans www ou relative acceptées). Une page catégorie est refusée : cherchez alors avec search_products.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
