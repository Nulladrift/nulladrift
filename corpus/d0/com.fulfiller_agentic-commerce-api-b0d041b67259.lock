        },
        {
          "name": "quote_product",
          "title": "Coter une sélection",
          "description": "Devis RÉEL pour une sélection : prix HT calculé par le moteur de tarification (jamais lu dans une table de SKU), devise, délai, promotion. C’est le seul prix ferme. Le prix à annoncer est `devis.finalPriceHt` (promotion déduite) ; `devis.priceHt` est le prix catalogue, BARRÉ quand `devis.promo` est présent. Pour dire à l’utilisateur ce qui est coté, citez `summary` (libellés lisibles). Si `requiresReview` vaut `true`, le prix porte sur la sélection décrite par `summary`, pas sur la demande : les lignes dont le `status` n’est ni AS_REQUESTED ni DEFAULT disent ce qui a changé.",
          "inputSchema": {
            "properties": {
              "productId": {
                "description": "Identifiant rendu par search_products.",
                "minimum": 1,
                "type": "integer"
              },
              "selection": {
                "description": "Sélection d’options. Une option non précisée prend la valeur de la préselection par défaut du produit (`preselections` de get_product_configuration), comme sur le site ; `{\"options\": []}` cote donc la configuration par défaut. La résolution est TOLÉRANTE : code ou libellé, sans souci de casse ni d’accents ; une valeur partielle est retenue si une SEULE valeur la contient (« vinyle » → « Impression sur vinyle adhésif contrecollé », « A5 » → « 14,8 x 21 cm (A5) »), ou par ses mesures (« 148x210 mm ») ; parmi plusieurs, la plus proche est retenue et signalée, ou la SEULE compatible avec le reste de la sélection (« soft touch » sur une carte recto verso). Ce qui n’est pas retenu tel quel est signalé dans `alerts` et dans `summary`.",
                "properties": {
                  "options": {
                    "items": {
                      "properties": {
                        "option": {
                          "description": "Code de l’option, tel que rendu par get_product_configuration. Un libellé (« Délai de livraison ») est rattaché à la seule option qui lui correspond, et c’est signalé.",
                          "type": "string"
                        },
                        "quantity": {
                          "description": "Quantité demandée (type QUANTITY). Hors des paliers du produit, l’alerte donne les quantités possibles et la plus proche.",
                          "minimum": 1,
                          "type": "integer"
                        },
                        "size": {
                          "description": "Gabarit de taille (option de type SIZE). Gabarit FIXE (bornes min = max) : le code suffit, ses dimensions sont complétées, et des dimensions données dans un sens ou dans l’autre (60×80 ou 80×60) désignent le même gabarit. Gabarit à SAISIE LIBRE (`allowsCustomInput`) : width et height sont requises, dans l’unité de l’option (`unit`, souvent cm : une bâche de 3 m × 1 m s’écrit width 300, height 100) et DANS les bornes du gabarit : hors bornes, la cotation est refusée (SIZE_OUT_OF_RANGE, bornes dans le message).",
                          "properties": {
                            "code": {
                              "description": "Code ou libellé du gabarit, ou ses mesures (« 60x80 », « 148x210 mm ») : elles désignent le gabarit fixe de ces dimensions, sinon le gabarit sur mesure.",
                              "type": "string"
                            },
                            "height": {
                              "exclusiveMinimum": 0,
                              "type": "number"
                            },
                            "width": {
                              "exclusiveMinimum": 0,
                              "type": "number"
                            }
                          },
                          "required": ["code"],
                          "type": "object"
                        },
                        "type": {
                          "description": "Seuls ces 4 types sont SÉLECTIONNABLES. Un autre type déclaré par la configuration (LIST_OF_RANGES, QUANTITY_BY_VALUE) est décrit mais non sélectionnable : le défaut du produit s’applique.",
                          "enum": ["QUANTITY", "DELIVERY_TIME", "LIST_OF_VALUES", "SIZE"],
                          "type": "string"
                        },
                        "value": {
                          "description": "Code ou libellé de la valeur retenue (types LIST_OF_VALUES et DELIVERY_TIME).",
                          "type": "string"
                        }
                      },
                      "required": ["option", "type"],
                      "type": "object"
                    },
                    "maxItems": 50,
                    "type": "array"
                  },
                  "preset": {
                    "description": "Code ou nom d’un preset de get_product_configuration (`presets` : « Le moins cher », « Top vente »…) : ses valeurs servent de base, `options` les précise ou les remplace.",
                    "maxLength": 128,
                    "type": "string"
                  }
                },
                "required": ["options"],
                "type": "object"
              }
            },
            "required": ["productId", "selection"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Coter une sélection"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8685e0b5b8b4d07c7f07edb4c497eda72959d68bd8a1a8870924561817109ee4"
        },
        {
          "name": "resolve_product",
          "title": "Résoudre un produit par SKU ou URL",
          "description": "Convertit une identité EXACTE en identité complète (productId, sku, nom, url) : `sku` (lisible dans le JSON-LD d’une page produit), `url` de la page, ou `productId`. À PRÉFÉRER à search_products dès que vous tenez l’un des trois — la recherche est approximative, celle-ci ne l’est pas. Fournissez exactement un argument.",
