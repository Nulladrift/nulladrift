      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "exniche",
        "title": "exNiche",
        "version": "0.12.0",
        "websiteUrl": "https://exniche.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "exNiche finds products for sale at big retailers and well-known brand stores (deepest in Australia, also US fashion and footwear). No key needed. For a shopper request, call search_products with the product in `query` (2 to 4 words) and budget, country, size and colour in their own fields. A reply with found=false may still carry closest_matches (a different model), elsewhere (listed in another country) or known_gap (exNiche already looked into this ask and what the closest products lack). If it finds nothing, or the shopper names a store, call find_retailers for the right stores to search. If the shopper still cannot buy it, offer leave_standing_order: with their consent and their own email address, exNiche emails them once when a matching listing appears. When the shopper gave a requirement, pass it in `need`. Prices are in each listing's own currency, exclude shipping and tax, and are as last recorded: before quoting one, call check_product_link on its url for the live price and stock, or tell the shopper to confirm on the retailer page. No match is not proof a product does not exist. list_gaps returns products people asked for and could not buy (worth a closer look, never verified demand). Use report_not_found only for a real shopper's unmet request. If a result has code KEY_REQUIRED or MONTHLY_LIMIT, show the user its human_message. No key is needed; a free key from POST https://exniche.com/v1/keys gives an agent its own monthly allowance. Nothing is ever charged automatically.",
      "tools": [
        {
          "name": "check_product_link",
          "title": "Check a product link now",
          "description": "Fetch one product page live and return whether it still exists, its current price and stock. Use it on a url from search_products before quoting a price to the shopper. Only allowlisted retailer and brand-store urls; robots.txt is honoured. status: live, out_of_stock, dead (gone), blocked (retailer refused; hand the shopper the url), not_allowed, unreadable. No key needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Product page url, e.g. the url field of a search_products result.",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "availability": {
                "type": "string"
              },
              "checked_at": {
                "type": "string"
              },
              "currency": {
                "type": ["string", "null"]
              },
              "note": {
                "type": "string"
              },
              "price": {
                "type": ["number", "null"]
              },
              "status": {
                "type": "string"
              },
              "title": {
                "type": ["string", "null"]
              },
              "url": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f56511f128b700bfcb08e22167258297bbfcddfa3a064a4a673ac263fbea7f6b"
        },
        {
          "name": "find_retailers",
          "title": "Find retailer search links",
          "description": "Find which big retailers and brand stores to search for a product, with a ready-made search link for each. Use this when search_products returns nothing, when the shopper names a store or brand, or to give the shopper places to look. Returns up to 10 retailers (the brand's own store first, then category specialists, then general retailers), each with search_url, a short reason, and agent_access ('open' = you can fetch the page, 'blocks_bots' = hand the link to the shopper). No key needed. Example: {\"query\": \"breville espresso machine\", \"region\": \"AU\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 6,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The product, e.g. 'wide fit hiking boots'. Leave out budget and size; they are stripped.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "region": {
                "description": "Shopper's country. Only retailers that serve it are returned. Coverage is deepest for AU.",
                "enum": ["AU", "US"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "categories": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "retailers": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6bdf8190326ad5473ae74841da44513e79dcaad2250f53fa3b5118388c342b73"
        },
        {
          "name": "get_setup_and_upgrade_links",
          "title": "Get setup and upgrade links",
          "description": "Free. Return exNiche install commands for MCP clients, the agent guide, and how to get a free API key (POST /v1/keys). Free: 1,000 calls a month per key. Nothing is ever charged automatically.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
