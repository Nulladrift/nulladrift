{
  "lockfileVersion": 2,
  "subjects": {
    "com.exniche/search": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://exniche.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "exniche",
        "title": "exNiche",
        "version": "0.11.0",
        "websiteUrl": "https://exniche.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "exNiche finds products for sale at big retailers and well-known brand stores (deepest in Australia, also US fashion and footwear). No key needed. For a shopper request, call search_products with the product in `query` (2 to 4 words) and budget, country, size and colour in their own fields. If it finds nothing, or the shopper names a store, call find_retailers for the right stores to search. Prices are in each listing's own currency, exclude shipping and tax, and are as last recorded: before quoting one, call check_product_link on its url for the live price and stock, or tell the shopper to confirm on the retailer page. No match is not proof a product does not exist. list_gaps returns products people asked for and could not buy (worth a closer look, never verified demand). Use report_not_found only for a real shopper's unmet request. If a result has code KEY_REQUIRED or MONTHLY_LIMIT, show the user its human_message. No key is needed; a free key from POST https://exniche.com/v1/keys gives an agent its own monthly allowance. Nothing is ever charged.",
      "tools": [
        {
          "name": "check_product_link",
          "title": "Check a product link now",
          "description": "Fetch one product page live and return whether it still exists, its current price and stock. Use it on a url from search_products before quoting a price to the shopper. Only allowlisted retailer and brand-store urls; robots.txt is honoured. status: live, out_of_stock, dead (gone), blocked (retailer refused; hand the shopper the url), not_allowed, unreadable. No key needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Product page url, e.g. the url field of a search_products result.",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "availability": {
                "type": "string"
              },
              "checked_at": {
                "type": "string"
              },
              "currency": {
                "type": ["string", "null"]
              },
              "note": {
                "type": "string"
              },
              "price": {
                "type": ["number", "null"]
              },
              "status": {
                "type": "string"
              },
              "title": {
                "type": ["string", "null"]
              },
              "url": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f56511f128b700bfcb08e22167258297bbfcddfa3a064a4a673ac263fbea7f6b"
        },
        {
          "name": "find_retailers",
          "title": "Find retailer search links",
          "description": "Find which big retailers and brand stores to search for a product, with a ready-made search link for each. Use this when search_products returns nothing, when the shopper names a store or brand, or to give the shopper places to look. Returns up to 10 retailers (the brand's own store first, then category specialists, then general retailers), each with search_url, a short reason, and agent_access ('open' = you can fetch the page, 'blocks_bots' = hand the link to the shopper). No key needed. Example: {\"query\": \"breville espresso machine\", \"region\": \"AU\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 6,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The product, e.g. 'wide fit hiking boots'. Leave out budget and size; they are stripped.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "region": {
                "description": "Shopper's country. Only retailers that serve it are returned. Coverage is deepest for AU.",
                "enum": ["AU", "US"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "categories": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "retailers": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6bdf8190326ad5473ae74841da44513e79dcaad2250f53fa3b5118388c342b73"
        },
        {
          "name": "get_setup_and_upgrade_links",
          "title": "Get setup and upgrade links",
          "description": "Free. Return exNiche install commands for MCP clients, the agent guide, and how to get a free API key (POST /v1/keys). Free: 1,000 calls a month per key. Nothing is ever charged.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "get_key": {
                "type": "object"
              },
              "install": {
                "type": "object"
              },
              "mcp_url": {
                "type": "string"
              },
              "signup_url": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:15359629c6a1e1e29904bac01b41e23bca653aa08cabb9c84998275198c384fa"
        },
        {
          "name": "list_gaps",
          "title": "List product gaps",
          "description": "Products people asked for that none of the closest products checked offer, with the original ask, requirements and products checked, plus agent-search misses repeated by 3+ requests from 2+ agents. No key: 10-gap preview. With a free key (POST /v1/keys): full rows, paged by cursor, counts 1 call. A gap is worth a closer look, never verified demand.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "next_cursor from the previous call. Workspace key only.",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "Workspace key only.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Filter by words in the gap or its requirements, e.g. 'wide fit boots'.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "agent_gaps": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "code": {
                "type": "string"
              },
              "credits_charged": {
                "type": "integer"
              },
              "gaps": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "human_message": {
                "type": "string"
              },
              "next_cursor": {
                "type": ["string", "null"]
              },
              "upgrade_url": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:200617c5275592c20613f04626e87c5c90b4cc203a344e9d60df12e26d31c0f0"
        },
        {
          "name": "report_not_found",
          "title": "Report unsatisfied shopping request",
          "description": "Free. Report a genuine shopper mismatch after a search. Do not send synthetic reports or personal details. Response states whether the agent observation was saved; it is not verified human demand.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "code": {
                "type": "string"
              },
              "evidence": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "saved": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:11f70618f4704292454daf9b495353c900152f44a6f0d7c610789fdfa14a8662"
        },
        {
          "name": "search_products",
          "title": "Search retail products",
          "description": "Search products for sale at big retailers and well-known brand stores: Myer, JB Hi-Fi, Zappos, Nike and about 180 more, deepest in Australia and US fashion. Use this when a shopper wants a product, a price check, or somewhere to buy it. Put the product in `query` (2 to 4 words, brand first: 'sony headphones', 'breville espresso machine') and budget, country, size and colour in their own fields. Returns ranked listings with title, store, price, availability, the retailer's product url and when it was last checked, plus retailer_search links to try when nothing matches. Prices are in each listing's own currency, exclude shipping and tax, and are not converted. No key needed. Example: {\"query\": \"espresso machine\", \"country\": \"AU\", \"max_price\": 600}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "color": {
                "description": "Colour as a store would list it, e.g. black.",
                "type": "string"
              },
              "country": {
                "description": "Shopper's country as a two-letter code, e.g. AU or US. Limits results to listings priced in that country's currency.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "currency": {
                "description": "Three-letter currency code, e.g. AUD. Only listings priced in it are returned.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "details": {
                "default": false,
                "description": "true = full rows (description, every matching variant). Several times larger; leave off unless needed.",
                "type": "boolean"
              },
              "in_stock": {
                "description": "true = only listings seen in stock in the last 72 hours. This drops most listings; leave it out and check stock on the retailer page.",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Highest price, in `currency` (or the country's currency). Needs currency or country. No currency conversion is done.",
                "minimum": 0,
                "type": "number"
              },
              "min_price": {
                "description": "Lowest price, in `currency` (or the country's currency). Useful to skip accessories.",
                "minimum": 0,
                "type": "number"
              },
              "query": {
                "description": "The product in 2 to 4 words, brand first if the shopper named one: 'sony headphones', 'breville espresso machine', 'running shoes'. Put budget, country, size and colour in their own fields, not here.",
                "minLength": 1,
                "type": "string"
              },
              "size": {
                "description": "Size exactly as a store would list it, e.g. M, 8, 10.5. Only listings with that recorded size are returned, so leave it out for a wider search.",
                "type": "string"
              },
              "sort": {
                "default": "relevance",
                "description": "price sorts need currency or country.",
                "enum": ["relevance", "price_asc", "price_desc"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "code": {
                "type": "string"
              },
              "count": {
                "type": "integer"
              },
              "found": {
                "description": "false = nothing in this catalogue matched; not proof nobody sells it",
                "type": "boolean"
              },
              "human_message": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "query": {
                "type": "string"
              },
              "results": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "availability": {
                      "type": "string"
                    },
                    "currency": {
                      "type": ["string", "null"]
                    },
                    "last_checked": {
                      "type": ["string", "null"]
                    },
                    "link_status": {
                      "type": "string"
                    },
                    "price": {
                      "type": ["number", "null"]
                    },
                    "relevance": {
                      "type": "number"
                    },
                    "store": {
                      "type": ["string", "null"]
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "retailer_search": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fb574f51660ab2940b26699420b44e97e83050ff7fbfeda9c6be0b9d59a62be1"
        }
      ],
      "digest": "sha256:e2e86036a3d53eeec56d23b6d243120cbf755821875427a7586ba7860719218f"
    }
  }
}
