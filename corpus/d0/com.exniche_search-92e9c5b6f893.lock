                "type": "object"
              },
              "mcp_url": {
                "type": "string"
              },
              "signup_url": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:389f887167716139c1b3320ba5b7bec7f3e3a761d60ae219c51f6fdc00be8a13"
        },
        {
          "name": "leave_standing_order",
          "title": "Leave a standing order",
          "description": "Free. When search_products finds nothing the shopper can buy, leave a standing order for them: exNiche re-checks its retailers daily for 90 days and emails the shopper once when a matching listing appears in their country at or under their price. Use only with the shopper's consent and their own email address; never guess or invent one. The shopper must click the confirmation link exNiche emails them before the order opens. If a matching listing is already on sale, the reply carries it instead (status already_for_sale). Example: {\"query\": \"owala water bottle\", \"country\": \"AU\", \"max_price\": 60, \"email\": \"shopper@example.com\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Shopper's country.",
                "enum": ["AU", "US"],
                "type": "string"
              },
              "email": {
                "description": "The shopper's own email address, given by them for this alert.",
                "maxLength": 254,
                "type": "string"
              },
              "max_price": {
                "description": "Optional. The most the shopper will pay, in the country's currency (AUD or USD).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "query": {
                "description": "The product in 2 to 5 words, brand first. Every word must appear in a listing's title for it to count.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["country", "email", "query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "code": {
                "type": "string"
              },
              "error": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "results": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "description": "confirmation_sent, confirmation_queued (email delayed, order kept) or already_for_sale",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
