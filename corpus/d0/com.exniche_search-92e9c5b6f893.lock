        {
          "name": "live_check",
          "title": "Check one product page now (paid, no quota)",
          "description": "Paid: US$0.005 per call in USDC over x402 (or 5 prepaid credits), with no monthly quota. Fetch one retailer product page now and return whether it still exists, its current price and stock. Not charged if the page could not be read. Without payment the result is an x402 payment request; attach the signed payment at _meta[\"x402/payment\"] and call again. check_product_link does the same within the free monthly allowance.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Product page url on a retailer exNiche covers, e.g. the url of a search result.",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a40a5e3f2db3b71f999a23aef243915c92149276ae84aff20453d6f5e51a7277"
        },
        {
          "name": "live_search",
          "title": "Search with live price and stock (paid)",
          "description": "Paid: US$0.02 per call in USDC over x402 (or 20 prepaid credits). Product search across big retailers and brand stores (deepest in Australia, also US), with the top results checked on the retailer page at the moment of the call: live price, stock and whether the link still works. Not charged if no page could be read. Without payment the result is an x402 payment request; attach the signed payment at _meta[\"x402/payment\"] and call again. For free results as last recorded, use search_products.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "country": {
                "description": "AU or US.",
                "type": "string"
              },
              "limit": {
                "description": "Results to check live (default 3).",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Highest price in the country's currency.",
                "type": "number"
              },
              "query": {
                "description": "The product, 2 to 6 words.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5e05cac1c7ea5fd8c00c45009124e53d98c0cf8855e0d328a97b69695ec5fe3b"
        },
