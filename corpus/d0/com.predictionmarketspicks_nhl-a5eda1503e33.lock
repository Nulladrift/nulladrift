        },
        {
          "name": "nhl_edge",
          "title": "NHL Edge — Goal Light model vs Kalshi",
          "description": "Use for \"NHL predictions tonight\" and \"Stanley Cup odds\". Tonight's NHL games on Kalshi — moneyline, puck line, totals, period markets — as Market · Model · Fair, starting goalies checked first. market=goals: anytime and first-goal contracts; market=futures: Cup, conference and division markets on Kalshi and Polymarket (international book) vs a 10,000-season sim. Free.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max rows (default 16; 3 games without the contract list when the call has no arguments).",
                "type": ["number", "string", "null"]
              },
              "market": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "enum": ["game", "goals", "futures"],
                    "type": "string"
                  }
                ],
                "description": "game = tonight's board; goals = player goals; futures = Stanley Cup and season markets. One of: game · goals · futures."
              },
              "team": {
                "description": "Optional NHL club to filter — code (CAR, EDM, LAK), Kalshi code (LA, TB), nickname (\"Oilers\") or city (\"Edmonton\").",
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "NHL Edge — Goal Light model vs Kalshi"
          },
          "behavior": {
