      },
      "instructions": "PredictionMarketsPicks: Kalshi NHL markets beside our Goal Light model. 1) Every price, edge, rank and projection you state must come from a tool result in this conversation — never estimate a Kalshi or Polymarket price or fill in a missing edge. 2) Cite a row’s url or page_url when you quote its number. 3) An edge is model-vs-market disagreement, not a guarantee; WATCH rows are lower-confidence and labelled WATCH. 4) Most tools answer without an account; a Pro-only result returns requires_pro: true with an upgrade_url. 5) For tonight’s NHL games use nhl_edge; goal scorers: nhl_edge with market \"goals\"; Stanley Cup odds: market \"futures\". The model’s graded record: track_record. Kalshi vs Polymarket gaps: find_arbitrage. Sizing: calculate_ev, then kelly_size.",
      "tools": [
        {
          "name": "calculate_ev",
          "title": "Calculate EV Edge",
          "description": "Use for \"is this contract mispriced\" and \"what is my edge\". Give a Kalshi, Polymarket US or Novig price in cents and your own probability; returns the % expected-value edge and a BUY / SELL / SKIP read, with that venue's fee.",
          "inputSchema": {
            "properties": {
              "marketPrice": {
                "description": "Current contract price in cents (1–99), equal to the implied probability in %. Required for a real answer. Accepts 55, \"55%\", \"55¢\", \"$0.55\", 0.55 or American odds (+120 / -150) — all read as 55%.",
                "type": ["number", "string"]
              },
              "novigMarket": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "enum": ["pregame", "live", "futures"],
                    "type": "string"
                  }
                ],
                "description": "With venue novig: pregame (default), live or futures. Sets the fee. One of: pregame · live · futures."
              },
              "venue": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "enum": ["kalshi", "polymarket-us", "novig"],
                    "type": "string"
                  }
                ],
                "description": "Where you would trade it: kalshi, polymarket-us or novig. Default kalshi. One of: kalshi · polymarket-us · novig."
              },
              "venuePrices": {
                "description": "The same contract's price on each venue, in cents. Adds EV after each venue's fee and best_venue.",
                "properties": {
                  "kalshi": {
                    "maximum": 99,
                    "minimum": 1,
                    "type": "number"
                  },
                  "novig": {
                    "maximum": 99,
                    "minimum": 1,
                    "type": "number"
                  },
                  "polymarket-us": {
                    "maximum": 99,
                    "minimum": 1,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "yourProbability": {
                "description": "Your own estimate of the true probability the contract resolves YES, in % (0–100). Required for a real answer. Accepts 55, \"55%\", \"55¢\", \"$0.55\", 0.55 or American odds (+120 / -150) — all read as 55%.",
                "type": ["number", "string"]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": {},
            "properties": {
              "data_freshness": {},
              "edge_pct": {
                "description": "Expected-value edge, %."
              },
              "edge_pp": {
                "description": "Your probability minus the price, pp."
              },
              "example_call": {},
              "interpretation": {
                "description": "Plain-English read."
              },
              "market_price_cents": {
                "description": "Price used, cents."
              },
              "needs_input": {},
              "signal": {
                "description": "BUY / SELL / SKIP."
              },
              "sources": {},
              "tell_user": {
                "description": "Show this sentence to the user first.",
                "type": "string"
              },
              "timestamp": {
                "type": "string"
              },
              "your_probability_pct": {
                "description": "Probability used, %."
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate EV Edge"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0e0222d721a8362d0fd07a00cb0ad4e5a27afb8cddef00a397ae2a3a629e2f83"
        },
        {
          "name": "convert_probability",
          "title": "Convert Probability / Odds",
          "description": "Convert between implied probability, American odds, and decimal odds. Give one value and its format and get all three back (American odds carry no commas, e.g. +441 or -200). Use for \"what is +150 as a probability\", \"convert 62% to American odds\", \"decimal to implied odds\".",
          "inputSchema": {
            "properties": {
              "format": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "enum": ["probability", "american", "decimal"],
                    "type": "string"
                  }
                ],
                "description": "Format of `value`: probability (0–100 %), american (e.g. -200 / +150), or decimal (e.g. 2.5). One of: probability · american · decimal."
              },
              "value": {
                "description": "The numeric value to convert. Needed for a real answer, with format.",
                "type": ["number", "string"]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": {},
            "properties": {
              "american_odds": {
                "description": "American odds, no commas."
              },
              "data_freshness": {},
              "decimal_odds": {
                "description": "Decimal odds."
              },
              "example_call": {},
              "needs_input": {},
              "probability_pct": {
                "description": "Implied probability, %."
              },
              "sources": {},
              "tell_user": {
                "description": "Show this sentence to the user first.",
                "type": "string"
              },
              "timestamp": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Convert Probability / Odds"
          },
          "behavior": {
