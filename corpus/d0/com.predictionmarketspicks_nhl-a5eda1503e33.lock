        },
        {
          "name": "kelly_size",
          "title": "Kelly Position Size",
          "description": "Compute the optimal Kelly position size for a Kalshi, Polymarket US or Novig contract. Given your win probability, the market price (which sets the payout), your bankroll, and a Kelly fraction (full / half / quarter / eighth), returns the dollar stake and a risk rating. Use for \"how much should I stake\", \"what is my position size\", \"Kelly sizing for this trade\".",
          "inputSchema": {
            "properties": {
              "bankroll": {
                "description": "Total bankroll in dollars (e.g. 1000). Optional — omit it and the result is the % of bankroll to stake, without a dollar figure.",
                "type": ["number", "string"]
              },
              "fraction": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "enum": ["full", "half", "quarter", "eighth"],
                    "type": "string"
                  }
                ],
                "description": "Kelly fraction to apply. Half-Kelly is the common sharp-money default. One of: full · half · quarter · eighth."
              },
              "marketPrice": {
                "description": "Contract price in cents (1–99). Sets the payout ratio. Omit both this and winProbability for the inputs and a worked example. Accepts 55, \"55%\", \"55¢\", \"$0.55\", 0.55 or American odds (+120 / -150) — all read as 55%.",
                "type": ["number", "string"]
              },
              "novigMarket": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "enum": ["pregame", "live", "futures"],
                    "type": "string"
                  }
                ],
                "description": "With venue novig: pregame (default), live or futures. Sets the fee. One of: pregame · live · futures."
              },
              "venue": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "enum": ["kalshi", "polymarket-us", "novig"],
                    "type": "string"
                  }
                ],
                "description": "Where you would trade it: kalshi, polymarket-us or novig. Default kalshi. One of: kalshi · polymarket-us · novig."
              },
              "winProbability": {
                "description": "Your probability the contract resolves YES, in % (0–100). Omit both this and marketPrice for the inputs and a worked example. Accepts 55, \"55%\", \"55¢\", \"$0.55\", 0.55 or American odds (+120 / -150) — all read as 55%.",
                "type": ["number", "string"]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": {},
            "properties": {
              "applied_fraction_pct": {
                "description": "The fraction applied, %."
              },
              "data_freshness": {},
              "example_call": {},
              "full_kelly_pct": {
                "description": "Full-Kelly fraction of bankroll, %."
              },
              "needs_input": {},
              "rating": {
                "description": "Qualitative read of the sizing."
              },
              "sources": {},
              "stake_dollars": {
                "description": "Suggested stake in dollars (when a bankroll was given)."
              },
              "tell_user": {
                "description": "Show this sentence to the user first.",
                "type": "string"
              },
              "timestamp": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Kelly Position Size"
          },
