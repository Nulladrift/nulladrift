                          "label": {
                            "description": "THE MOAT's own short label for the story, written by an editor, if any.",
                            "type": ["string", "null"]
                          },
                          "language": {
                            "description": "Language of the original work (BCP 47, e.g. \"en\", \"fr\").",
                            "type": "string"
                          },
                          "language_name": {
                            "description": "Language name in English.",
                            "type": "string"
                          },
                          "publication": {
                            "description": "The publication (for video and podcasts, the channel or programme).",
                            "type": "string"
                          },
                          "publication_url": {
                            "description": "The publication's homepage.",
                            "type": "string"
                          },
                          "published_at": {
                            "description": "When the publisher published it (ISO 8601), as the publisher states.",
                            "type": ["string", "null"]
                          },
                          "publisher_domain": {
                            "description": "The publisher's domain, e.g. \"ft.com\".",
                            "type": "string"
                          },
                          "reader_access": {
                            "description": "Whether readers can open the original freely.",
                            "enum": ["open", "metered", "paywalled", "unknown"],
                            "type": "string"
                          },
                          "rights": {
                            "description": "What THE MOAT may do with this work. link_only: reference and link only.",
                            "enum": ["link_only", "licensed_title", "licensed_brief", "public_domain_or_primary_source"],
                            "type": "string"
                          },
                          "role": {
                            "description": "lead: the version THE MOAT leads with; also: another publication's version of the same news; development: a separate follow-up.",
                            "enum": ["lead", "also", "development"],
                            "type": "string"
                          },
                          "source_type": {
                            "enum": ["newsroom", "independent", "specialist", "newsletter", "research", "primary", "podcast", "video", "creator"],
                            "type": "string"
                          },
                          "story_id": {
                            "type": "string"
