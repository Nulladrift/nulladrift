        {
          "name": "daily_brief",
          "title": "THE MOAT daily brief",
          "description": "THE MOAT's front page for global business: the stories its editors selected for an edition, in page order, each with author, publication, language, country, a direct link to the original reporting and why THE MOAT selected it. Use it for \"what matters in global business today\" or for a given day. Returns references and links, never article text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Brussels date of the edition (YYYY-MM-DD). Omit for the current edition.",
                "format": "date",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "edition": {
                "default": "global",
                "description": "Edition. V1 has one: \"global\".",
                "enum": ["global"],
                "type": "string"
              },
              "include_related": {
                "default": false,
                "description": "Also return other publications' versions and follow-up developments of each story.",
                "type": "boolean"
              },
              "language": {
                "default": "en",
                "description": "Language of THE MOAT's own text in the response. V1: English. Sources keep their original language.",
                "enum": ["en"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many stories (1–25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
