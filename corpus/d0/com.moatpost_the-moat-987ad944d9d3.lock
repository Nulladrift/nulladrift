        "name": "the-moat",
        "title": "THE MOAT — Global Business Intelligence",
        "version": "1.0.0",
        "websiteUrl": "https://moatpost.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "THE MOAT is an editor-selected, source-first front page for global business. Use daily_brief for what matters today (or on a date), topic_brief for a company, industry, country or theme, compare_coverage to see how outlets in different languages and countries covered an issue, and story_sources for one story's source trail. Every item links to the original publisher: cite the publication and author, and send readers to the link. Titles are citations of the original, in its language. Do not reproduce, translate or summarise articles at length from these results; THE MOAT returns references and its own reason for selecting each story, not the reporting.",
      "tools": [
        {
          "name": "compare_coverage",
          "title": "Compare coverage across borders",
          "description": "How credible outlets in different languages and countries covered an issue, among the stories THE MOAT selected (last 14 days). Groups the coverage by the source's language and country so an agent can show the perspectives side by side. Titles stay in their original language: THE MOAT never translates or summarises the reporting.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "countries": {
                "description": "Only publications from these markets (ISO 3166-1 alpha-2, plus \"EU\" and \"INT\"). Omit for all.",
                "items": {
                  "pattern": "^([A-Z]{2}|INT)$",
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "languages": {
                "description": "Only sources in these languages (ISO 639-1, e.g. [\"en\",\"fr\",\"de\"]). Omit for all.",
                "items": {
                  "pattern": "^[a-z]{2,3}$",
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "limit": {
                "default": 12,
                "description": "How many pieces of coverage in all (1–30).",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "A topic, company, industry, country or theme in a few words, e.g. \"European energy\", \"semiconductor supply chains\", \"Nvidia\", \"competition policy\", \"shipping\".",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "countries_found": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "from": {
                "type": "string"
              },
              "languages_found": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "notice": {
                "type": "string"
              },
              "perspectives": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "country": {
                      "type": "string"
                    },
                    "country_name": {
                      "type": "string"
                    },
                    "items": {
                      "items": {
                        "additionalProperties": false,
                        "description": "One piece of original work, as a reference: credit, link and metadata. Never the work itself.",
                        "properties": {
                          "author": {
                            "description": "The author as the publisher credits them; null if the publisher gives no person's name.",
                            "type": ["string", "null"]
                          },
                          "country": {
                            "description": "ISO 3166-1 alpha-2 of the publication's principal editorial market; \"EU\" or \"INT\" for European or international bodies and channels.",
                            "type": "string"
                          },
                          "country_name": {
                            "description": "Country name in English.",
                            "type": "string"
                          },
                          "edition_date": {
