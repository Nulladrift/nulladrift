      },
      "instructions": "MapLedger answers what you can do with a piece of land in Austin, Texas and Nashville (Davidson County), Tennessee, from the cities' own records, and finds local businesses in Central Austin. land_at answers for one address or point; for any other US address it gives a free answer: the zoning district, overlays, parcel id and ordinance link read live from the jurisdiction's own public layers where MapLedger's registry has them, or what the records show. find_land searches a whole city (Austin or Nashville) for land that fits a need, and search_businesses lists Austin businesses. Answers are screening estimates with sources, not zoning letters or legal advice.",
      "tools": [
        {
          "name": "find_land",
          "title": "Find land that fits",
          "description": "Use when someone wants to find land or lots in Austin or Nashville that fit a need, for example lots where three homes are allowed, commercial land where apartments are allowed without a rezoning, dry industrial land of 5+ acres, zoning where whole-home short-term rentals are permitted, or Specific Plans whose ordinance bans rentals. Takes a ready-made view or a plain-English description of the need. Returns how many zoning areas and acres match, the largest ones, each with a point inside the zoning area, and a map link. Austin views: home3, sb840, co, interim, mfdry, ind5, hist, bsz. Nashville views: strok, spstr, ns, unbuilt, mfusd, ind5, hist, dadu.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "description": "\"austin\" (City of Austin, Texas) or \"nashville\" (Nashville and Davidson County, Tennessee). Other cities are not covered.",
                "maxLength": 60,
                "type": "string"
              },
              "limit": {
                "description": "How many of the largest matches to return (default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "request": {
                "description": "Plain-English request instead of a view, for example 'apartments in the city core out of the floodplain'",
                "maxLength": 200,
                "type": "string"
              },
              "view": {
                "description": "A ready-made view id for the city (see the description)",
                "maxLength": 20,
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "enum": ["austin", "nashville"],
                "type": "string"
              },
              "largest": {
                "description": "The largest matches, each with a point inside the zoning area",
                "items": {
                  "additionalProperties": {},
                  "properties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "map_url": {
                "type": "string"
              },
              "matching_acres": {
                "type": "number"
              },
              "matching_areas": {
                "description": "Austin: zoning areas that match",
                "type": "number"
              },
              "matching_districts": {
                "description": "Nashville: zoning districts that match",
                "type": "number"
              },
              "message": {
                "type": "string"
              },
              "next": {
                "type": "string"
              },
              "of_areas": {
                "type": "number"
              },
              "of_districts": {
                "type": "number"
              },
              "showing": {
                "description": "The search in plain words",
                "type": "string"
              },
              "status": {
                "enum": ["ok", "bad_view", "bad_request", "unsupported_city"],
                "type": "string"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find land that fits"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ee728f51211eaac02cd99c4b50e22dcf9a4d20c2dfa03399567008f37913cb1a"
        },
        {
          "name": "land_at",
          "title": "What can I do with this property?",
          "description": "Use when someone asks what they can do with a specific property or address in the US, or what it is zoned. In Austin, TX and Nashville, TN it answers in full: what the lot is zoned and what that means, how many homes the lot can take (Austin HOME rules, Texas SB 840 apartments on commercial land), what the zoning ordinance or Nashville Specific Plan says, whether a short-term rental (Airbnb) is allowed, the property tax and flood risk, with a map link and a printable brief link. For a Nashville or Austin lot, when the paid Lot File is on sale in that city and covers the lot, it also returns lot_file: what the cited file adds (documents read, rules computed for the lot, pending cases) and the link to buy it. Any other US address or point gets the free nationwide answer (status ok_free): the zoning district, its description, overlays, the parcel id and the zoning ordinance link, read live from the jurisdiction's own public layers where MapLedger's registry has them (tier B), or what the records show, such as a Texas county with no zoning authority (tier C). Every free line names its source. Takes an address with its city and state, or a latitude and longitude.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "description": "Street address, for example '1600 E 6th St' or '1600 Division St, 37203'",
                "maxLength": 150,
                "type": "string"
              },
              "appraised_value": {
                "description": "Appraised value in dollars for the tax estimate (defaults: Austin 550000, Nashville 450000)",
                "exclusiveMinimum": 0,
                "maximum": 10000000000,
                "type": "number"
              },
              "city": {
                "description": "\"austin\" (City of Austin, Texas) or \"nashville\" (Nashville and Davidson County, Tennessee) for the full answer. Any other US city or county, for example \"Phoenix, AZ\", gets the free nationwide answer.",
                "maxLength": 60,
                "type": "string"
              },
              "homestead": {
                "description": "Austin only: the owner's main home, so homestead exemptions apply (default true)",
                "type": "boolean"
              },
              "latitude": {
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "property_class": {
                "description": "Nashville only: taxed as a home (25%) or a business (40%); default follows the zoning",
                "enum": ["home", "business"],
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brief_url": {
                "type": "string"
              },
              "caveat": {
                "type": "string"
              },
              "choices": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "latitude": {
                      "type": "number"
                    },
                    "longitude": {
                      "type": "number"
                    }
                  },
                  "required": ["label", "latitude", "longitude"],
                  "type": "object"
                },
                "type": "array"
              },
              "city": {
                "enum": ["austin", "nashville"],
                "type": "string"
              },
              "code": {
                "anyOf": [
                  {
                    "additionalProperties": {},
                    "properties": {},
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "ok_free tier B: where the zoning ordinance is published"
              },
              "flood": {
                "type": "string"
              },
              "jurisdiction": {
                "anyOf": [
                  {
                    "additionalProperties": {},
                    "properties": {
                      "key": {
                        "type": "string"
                      },
                      "kind": {
                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      },
                      "state": {
                        "type": "string"
                      }
                    },
                    "required": ["key", "kind", "name", "state"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "ok_free only: the city or county that zones the point, from MapLedger's registry or the Census geography"
              },
              "lines": {
                "description": "ok_free: one definitive sentence per fact, each naming its source",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "lot": {
                "anyOf": [
                  {
                    "additionalProperties": {},
                    "properties": {},
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The lot's own records: size (Austin) or land use, building year, street frontage, service district and permit counts (Nashville)"
              },
              "lot_file": {
                "additionalProperties": {},
                "description": "Nashville and Austin, when the file is on sale in that city and covers the lot's zoning: the paid Lot File for this lot, what it adds to this answer, and where to buy it",
                "properties": {
                  "adds": {
                    "type": "string"
                  },
                  "price": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["adds", "price", "url"],
                "type": "object"
              },
              "map_url": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "parcel": {
                "anyOf": [
                  {
                    "additionalProperties": {},
                    "properties": {},
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "ok_free tier B: the parcel id and its source layer"
              },
              "place": {
                "type": ["string", "null"]
              },
              "point": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "latitude": {
                        "type": "number"
                      },
                      "longitude": {
                        "type": "number"
                      }
                    },
                    "required": ["latitude", "longitude"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "point_note": {
                "type": ["string", "null"]
              },
              "property_tax": {
                "additionalProperties": {},
                "properties": {},
                "type": "object"
              },
              "reason": {
                "description": "ok_free tier C: why there is no live zoning answer",
                "enum": ["no_zoning_authority", "county_does_not_zone", "not_in_registry", "no_layer", "hold", "no_parcel", "no_district", "upstream_error", "geocode_failed"],
                "type": "string"
              },
              "retry_after_seconds": {
                "description": "rate_limited only: seconds until the allowance resets",
                "type": "number"
              },
              "short_term_rentals": {
                "anyOf": [
                  {
                    "additionalProperties": {},
                    "properties": {
                      "note": {
                        "type": ["string", "null"]
                      },
                      "owner_occupied": {
                        "type": "string"
                      },
                      "owner_occupied_detail": {
                        "type": "string"
                      },
                      "source": {
                        "type": "string"
                      },
                      "whole_home": {
                        "type": "string"
                      },
                      "whole_home_detail": {
                        "type": "string"
                      }
                    },
                    "required": ["note", "owner_occupied", "owner_occupied_detail", "source", "whole_home", "whole_home_detail"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Owner-occupied and whole-home short-term rental answers for this spot, each with its reason and source"
              },
              "specific_plan": {
                "anyOf": [
                  {
                    "additionalProperties": {},
                    "properties": {},
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Nashville Specific Plan: what its ordinance says"
              },
              "status": {
                "description": "ok: answered in full (Austin or Nashville); ok_free: the free nationwide answer for another US place, with tier, jurisdiction and lines; choose: the address matches more than one place, choices lists them; not_found: no such address; no_zoning: the point is a street, water or outside the city; unsupported_city: the Census geocoder found no US address or place for the input; rate_limited: this caller's hourly allowance of nationwide answers is spent",
                "enum": ["ok", "ok_free", "choose", "not_found", "no_zoning", "bad_request", "unsupported_city", "rate_limited"],
                "type": "string"
              },
              "tier": {
                "description": "ok_free only. B: the jurisdiction's own zoning and parcel layers answered live. C: what the records show, with no live layer answer",
                "enum": ["B", "C"],
                "type": "string"
              },
              "what_you_can_build": {
                "additionalProperties": {},
                "description": "Austin: how many homes the lot can take",
                "properties": {
                  "details": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "headline": {
                    "type": "string"
                  }
                },
                "required": ["details", "headline"],
                "type": "object"
              },
              "zoning": {
                "additionalProperties": {},
                "description": "The zoning code, what it means, overlays and the ordinance behind it; for ok_free tier B, the district, its description, overlays and source layer",
                "properties": {},
                "type": "object"
              },
              "zoning_ordinances": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": {},
                      "properties": {},
                      "type": "object"
                    },
                    "type": "array"
                  },
                  {
                    "additionalProperties": {},
                    "properties": {},
                    "type": "object"
                  }
                ],
                "description": "Austin zoning ordinances covering the point, newest first"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "What can I do with this property?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bddc083a26b1b52e5ea295e3069d50b3624f7694f82711f80569878d54ec7841"
        },
        {
          "name": "search_businesses",
          "title": "Find local businesses in Austin",
          "description": "Use when someone wants a list of local businesses in Central Austin, TX by kind (for example dentists, coffee shops, plumbers), optionally only ones with no website listed or with a phone or email. Returns name, category, address, website status and contact details, each linked to its source record. Only Central Austin is covered.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "contact": {
                "enum": ["all", "phone", "email"],
                "type": "string"
              },
              "limit": {
                "description": "How many results (default 20)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What kind of business, for example 'dentist' or 'coffee'",
                "maxLength": 150,
                "type": "string"
              },
              "sector": {
                "enum": ["services_and_business", "food_and_drink", "health_care", "shopping", "lifestyle_services", "community_and_government", "sports_and_recreation", "cultural_and_historic", "education", "travel_and_transportation", "arts_and_entertainment", "lodging"],
                "type": "string"
              },
              "website": {
                "description": "missing = no website listed (social pages only or none)",
                "enum": ["all", "missing", "present"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "coverage": {
                "type": "string"
              },
              "more": {
                "description": "Where to see every match, when there are more than returned",
                "type": ["string", "null"]
              },
              "results": {
                "description": "Businesses: name, category, address, website status, contact details and source links",
                "items": {
                  "additionalProperties": {},
                  "properties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "enum": ["ok"],
                "type": "string"
              },
              "total_matches": {
                "type": "number"
              }
            },
            "required": ["coverage", "results", "status", "total_matches"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find local businesses in Austin"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4aa17940dc5a16e3bc0d489c4c06675f7a72fca0f4b53613d7e96ef97c9e44b6"
        }
