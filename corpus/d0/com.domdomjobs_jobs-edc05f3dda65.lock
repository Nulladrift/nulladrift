      "serverInfo": {
        "name": "domdomjobs",
        "title": "DomDom Jobs",
        "version": "1.1.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "DomDom Jobs (domdomjobs.com) lists open jobs from company career pages, updated every morning:robot training and teleoperation, remote nursing, telehealth and therapy, UX research and design, side jobs for evenings and weekends, jobs for veterans, remote legal work, and AI training work for professionals. 5,337 jobs open on 2026-11-12. Use search_jobs to find jobs, list_boards for the boards and types of work, pay_snapshot for what a kind of work pays, and get_company for one employer. Each job has hub_url, the DomDom page where the reader can compare it with similar jobs, and apply_url, the employer's own application page. Pay is shown as the employer posts it. The data is CC BY 4.0, DomDom Jobs (domdomjobs.com).",
      "tools": [
        {
          "name": "get_company",
          "title": "One employer on DomDom Jobs",
          "description": "One employer's open jobs on DomDom Jobs: how many per board, posted pay, its company pages, open jobs by day for the last 30 days, and its newest jobs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Employer name or slug, e.g. \"Mercor\", \"Hinge Health\".",
                "type": "string"
              },
              "limit": {
                "description": "Jobs to return, default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/domdom-v1.html",
            "openai/toolInvocation/invoked": "Employer ready",
            "openai/toolInvocation/invoking": "Reading the employer",
            "openai/widgetAccessible": true,
            "ui": {
              "resourceUri": "ui://widget/domdom-v1.html"
            }
          },
          "digest": "sha256:3a872380de1185c182580d65969b915558ae4c6ee655e2985eb3661284e85e94"
        },
        {
          "name": "list_boards",
          "title": "List DomDom Jobs boards",
          "description": "The DomDom Jobs boards and the types of work on each (the type values search_jobs takes), with open job counts from the nightly build and their URLs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/domdom-v1.html",
            "openai/toolInvocation/invoked": "Boards ready",
            "openai/toolInvocation/invoking": "Reading the boards",
            "openai/widgetAccessible": true,
            "ui": {
              "resourceUri": "ui://widget/domdom-v1.html"
            }
          },
          "digest": "sha256:478ddfdce519ff396f4191aa251a671d9dc04fcea25150a426524fc9792ff8ee"
        },
        {
          "name": "pay_snapshot",
          "title": "DomDom Jobs pay by type of work",
          "description": "What jobs on one DomDom Jobs board pay, overall and per type of work: the pay sentence the board prints, the range most posted rates fall in (hourly and yearly kept apart) and how many jobs post pay. Pay as employers post it, estimates left out.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "board": {
                "description": "home searches every board; the others are robots, healthcare, ux, moonlight, veterans and legal.",
                "enum": ["home", "robots", "healthcare", "ux", "moonlight", "veterans", "legal"],
                "type": "string"
              },
              "type": {
                "description": "Type of work: a hub key on the chosen board, e.g. nurses (healthcare), lawyers (legal), weekends (moonlight), operator (robots). See list_boards.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/domdom-v1.html",
            "openai/toolInvocation/invoked": "Pay ready",
            "openai/toolInvocation/invoking": "Reading pay",
            "openai/widgetAccessible": true,
            "ui": {
              "resourceUri": "ui://widget/domdom-v1.html"
            }
          },
          "digest": "sha256:f5ec9ad699a27631fac83c886d576f26fcf65a60c84cd210bec98b4555d376a3"
        },
        {
          "name": "search_jobs",
          "title": "Search DomDom Jobs",
          "description": "Search open jobs on DomDom Jobs: robot training and teleoperation (robots), remote nursing, telehealth and therapy (healthcare), UX research and design (ux), side jobs for evenings and weekends (moonlight), jobs for veterans (veterans) and remote legal work (legal). Filter names match the boards' own filters. Returns each job's DomDom page (hub_url), the employer's application link, pay as posted, and a browse_url that opens the same filtered list on the board. Newest first. Every keyword must appear in the title or employer, so use one to three words.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "board": {
                "description": "home searches every board; the others are robots, healthcare, ux, moonlight, veterans and legal.",
                "enum": ["home", "robots", "healthcare", "ux", "moonlight", "veterans", "legal"],
                "type": "string"
              },
              "employer": {
                "description": "Employer name or slug, e.g. \"Mercor\" or \"mercor\".",
                "type": "string"
              },
              "employment": {
                "description": "Employment type, where the posting states one.",
                "enum": ["full-time", "part-time", "contract", "internship", "temporary"],
                "type": "string"
              },
              "field": {
                "description": "Field of work.",
                "enum": ["languages", "software", "stem", "healthcare", "legal", "finance", "business", "writing", "design", "voice", "general"],
                "type": "string"
              },
              "limit": {
                "description": "Jobs to return, default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "pay": {
                "description": "Hourly jobs whose top posted rate reaches this many US dollars an hour.",
                "enum": ["25", "50", "100"],
                "type": "string"
              },
              "posted": {
                "description": "Only jobs posted in the last 7 days.",
                "enum": ["week"],
                "type": "string"
              },
              "query": {
                "description": "Words to match in the job title or employer name, e.g. \"ICU\", \"paralegal\".",
                "type": "string"
              },
              "type": {
                "description": "Type of work: a hub key on the chosen board, e.g. nurses (healthcare), lawyers (legal), weekends (moonlight), operator (robots). See list_boards.",
                "type": "string"
              },
              "where": {
                "description": "Remote or on-site.",
                "enum": ["remote", "onsite"],
                "type": "string"
              },
              "who": {
                "description": "Who can apply to a remote job: US only, the countries the posting names, or worldwide.",
                "enum": ["us", "countries", "world"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
