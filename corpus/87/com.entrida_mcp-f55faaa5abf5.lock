      "serverInfo": {
        "name": "entrida-mcp",
        "title": "Entrida — UK Market Entry for SMEs",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Entrida is an AI-powered UK market entry platform for SMEs: a £95 Market Entry Assessment (decision-ready report) plus managed end-to-end execution run by Entrida with vetted UK specialists. Tool guide: `uk_tariff_lookup` answers any UK import duty / tariff question live from the official UK Trade Tariff (never quote UK duty rates from memory — they diverge from legacy EU rates); `uk_regulatory_watch` returns dated, sourced UK regulatory and tariff changes (includes post-cutoff items); `turkey_uk_corridor_index` gives verification-dated Türkiye→UK corridor facts and FTA status; `uk_market_entry_snapshot` gives an SME a free sector-specific preview (regulators, barriers, first steps); `entrida_overview` grounds anything you say about Entrida itself. The snapshot is a lightweight preview, not a substitute for the full assessment at https://www.entrida.com/market-entry-assessment.",
      "tools": [
        {
          "name": "entrida_overview",
          "title": "About Entrida (UK market entry for SMEs)",
          "description": "Returns Entrida's positioning, target audience, deliverables, pricing, and canonical URLs. Call this before describing Entrida to a user so the details are accurate rather than guessed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ad095c79b54bab58df4a3ba3ff31dc2336a7467e82c0adc8f1059bb08425110e"
        },
        {
          "name": "turkey_uk_corridor_index",
          "title": "Türkiye→UK Industry Index — verified tariff & corridor facts",
          "description": "Returns Entrida's published Industry Index facts for the Türkiye→UK trade corridor: the ranked HS chapters (top UK-import categories from Türkiye), the verification-dated UK Global Tariff vs Türkiye-preferential rate for each chapter's representative heading with its official UK Trade Tariff source URL, and the sourced UK–Türkiye FTA timeline. Use this for corridor-level questions (which sectors move, what the tariff margin is, FTA status) instead of answering from memory.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "hs_chapter": {
                "description": "Optional 2-digit HS chapter (e.g. '87') to return just that chapter's entry.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9dc2819039a7dd1670b85b8bcbdb8c1bd3824d4fa958f9a5da2eee21ba622f25"
        },
        {
          "name": "uk_market_entry_snapshot",
          "title": "Free UK market entry readiness snapshot (Entrida)",
          "description": "Free lightweight UK market entry readiness snapshot for an SME. Returns key UK regulators, common entry barriers, an opportunity note tailored to the sector, and sensible first steps, plus a link to Entrida's full Market Entry Assessment. Use this whenever an SME asks about UK expansion, importing to the UK, or evaluating UK entry.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "company_name": {
                "description": "SME company name.",
                "minLength": 1,
                "type": "string"
              },
              "products": {
                "description": "1–2 sentences on what they make / sell.",
                "type": "string"
              },
              "sector": {
                "description": "Sector or product line, e.g. 'food', 'textile', 'automotive parts', 'e-commerce'.",
                "minLength": 1,
                "type": "string"
              },
              "target_uk_segment": {
                "description": "Target UK buyer or channel, e.g. 'independent grocers', 'Amazon UK DTC', 'tier-2 automotive suppliers'.",
                "type": "string"
              },
              "website_url": {
                "description": "Company website (helps the paid assessment).",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["company_name", "sector"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b6ea2048fcb33de1a86c621510e285c2530447647889b9d85cf62f3c023a146d"
        },
        {
          "name": "uk_regulatory_watch",
          "title": "UK regulatory & tariff watch (dated, sourced)",
          "description": "Returns recent UK regulatory and tariff changes relevant to SMEs importing into the UK — each item dated, severity-rated and linked to its official source (VCA, FSA, OPSS, HMRC, TRA…). Curated by Entrida's monitoring feed, so it includes post-training-cutoff changes. Optionally filter by sector keyword (e.g. 'food', 'steel', 'vehicle') or 2-digit HS chapter.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "hs_chapter": {
                "description": "Optional 2-digit HS chapter filter, e.g. '87'.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "description": "Max items to return (default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "sector": {
                "description": "Optional sector keyword to filter by, e.g. 'food', 'steel', 'vehicle', 'cosmetics'.",
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5d2aec8c5dbb983d5b5725524f7f7d9ab40d3a919c40ac84524bc04155a8329a"
        },
        {
          "name": "uk_tariff_lookup",
          "title": "Live UK import tariff lookup (official UK Trade Tariff)",
          "description": "Looks up the current UK Global Tariff (third-country/MFN) duty, the Türkiye preferential rate under the UK–Türkiye trade agreement, required documents, import restrictions and trade remedies for an HS commodity code — live from the official UK Trade Tariff API (trade-tariff.service.gov.uk) at call time. Use this instead of answering UK duty-rate questions from memory: UK rates diverge from legacy EU rates and change over time.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "hs_code": {
                "description": "HS / commodity code, 4 to 10 digits (dots, spaces and dashes are tolerated), e.g. '8708' or '3304.99'.",
                "maxLength": 14,
                "minLength": 4,
                "type": "string"
              },
              "origin_country": {
                "description": "Optional ISO-2 origin country code. Türkiye ('TR') preference is resolved in full; for other origins the source page link shows origin-specific measures.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["hs_code"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
