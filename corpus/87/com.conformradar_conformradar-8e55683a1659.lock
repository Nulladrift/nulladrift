        {
          "name": "generate_legal_guarantee_box",
          "description": "Build the mandatory \"legal guarantees\" box for terms of sale of goods sold to consumers in France: the official text of\n    the French Consumer Code template (annex to art. D. 211-2, model A), with the seller's details, as HTML and plain text.\n    Valid for the sale of goods only (pets and digital content or services have other templates).\n\n    Args:\n        seller_name: name of the seller who answers for the guarantees.\n        seller_postal_address: postal address.\n        seller_phone: phone number.\n        seller_email: e-mail address or another digital contact.\n    ",
          "inputSchema": {
            "properties": {
