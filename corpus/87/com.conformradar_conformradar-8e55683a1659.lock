        {
          "name": "find_rules",
          "description": "Search the register of French rules that apply to websites (about 160 rules, each read in the official text).\n\n    robot_coverage tells whether ConformRadar checks the rule automatically (\"auto\"), partly (\"partial\") or not at all (\"self\":\n    a human must check it). Rule texts are in French; use get_rule for the full obligation, texts, penalties and authority.\n\n    Args:\n        sector: \"vente-en-ligne\" (online shop selling to consumers), \"immobilier\" (estate agency) or \"entreprise\" (any business site).\n        theme: one of tous, vente-en-ligne, b2b, immobilier, sante, alimentation, alcool-tabac-jeux, professions, finance, tourisme,\n            formation-emploi, automobile, influence, elections.\n        query: words to look for in the title, obligation and legal references (French, accents optional), e.g. \"avis clients\", \"L. 221-5\".\n        limit: maximum number of rules returned (1 to 200).\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 40,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
