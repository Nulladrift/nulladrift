      "instructions": "ConformRadar checks websites against French consumer and e-commerce law (and the EU rules that apply in France).\n\nUse it when building, editing or reviewing an online shop or a business website aimed at French customers:\n- scan_website: reads up to 20 public pages of a live site (legal notice, terms of sale, product pages) and returns 16 checks\n  (seller identity, legal guarantee box, consumer mediator, outdated EU ODR link, withdrawal button, EPR unique identifier,\n  environmental claims, GPSR manufacturer block, strikethrough prices, customer reviews, textile labelling) with excerpts and legal references.\n- check_html / check_text: the same checks on a page or text you are writing, BEFORE it goes live (theme template, product description, terms of sale).\n- find_rules / get_rule / list_deadlines: a register of ~160 French rules read in the official texts (obligation, texts, penalties, authority, dates).\n- lookup_epr_id: EPR unique identifiers (identifiant unique REP) registered with ADEME for a company.\n- generate_gpsr_block / generate_legal_guarantee_box: ready-to-paste HTML blocks.\n\nStatuses: fix = verifiable breach; missing = expected element not found; check = something a human must review; ok = nothing to report; na = not applicable.\nFindings are in French by default (lang=\"en\" for English).\nSuggested loop: scan or check, fix what you can in the code or content, check again, and list for the human what needs their judgement.\nResults are points to check, never legal advice or a certification: say so when you report them. Rule texts are in French.",
      "tools": [
        {
          "name": "check_html",
          "description": "Run ConformRadar's checks on the HTML of ONE page you are building or editing (theme template, rendered page, local preview),\n    before it goes live. Use it to verify a fix without waiting for a new scan.\n\n    Checks by page_type:\n      product: environmental claims, GPSR manufacturer and safety block, strikethrough price, customer reviews, textile composition and origin.\n      home: environmental claims, outdated EU ODR link, customer reviews, withdrawal function.\n      terms / returns: legal guarantee box, consumer mediator, outdated EU ODR link, withdrawal, EPR unique identifier.\n      legal_notice: seller identity, EPR unique identifier (checked against the ADEME register), mediator, ODR link.\n\n    Args:\n        html: full HTML of the page (up to 3 MB). JSON-LD product data in the page is read.\n        page_type: which kind of page this is.\n        url: the page's future address, if known (used in the evidence and to recognise the shop's own domain).\n        lang: \"fr\" or \"en\".\n    ",
          "inputSchema": {
            "properties": {
              "html": {
                "title": "Html",
                "type": "string"
              },
              "lang": {
                "default": "fr",
                "enum": ["fr", "en"],
                "title": "Lang",
                "type": "string"
              },
              "page_type": {
                "enum": ["product", "home", "terms", "legal_notice", "returns"],
                "title": "Page Type",
                "type": "string"
              },
              "url": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Url"
              }
            },
            "required": ["html", "page_type"],
            "title": "check_htmlArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:756318d08c572e23f0fc756a9d02cc47e1a77d3976fcc5e14bb55e064f516000"
        },
        {
          "name": "check_text",
          "description": "Check plain text you are writing (product description, ad or newsletter copy, terms of sale, legal notice) before publishing.\n\n    product_description and marketing: banned or vague environmental claims (\"biodegradable\", \"eco-friendly\", \"carbon neutral\",\n    \"recycled\" without a percentage); product_description also checks the GPSR manufacturer block and textile composition and origin.\n    terms: legal guarantee box, consumer mediator, outdated EU ODR link, withdrawal wording, EPR unique identifier.\n    legal_notice: seller identity, EPR unique identifier, mediator.\n    French texts are fully supported; English texts only for environmental claims.\n\n    Args:\n        text: the text to check (up to 200,000 characters).\n        text_type: what the text is.\n        product_name: for a product description, the product's name (tells textiles, food and services apart).\n        lang: \"fr\" or \"en\".\n    ",
          "inputSchema": {
            "properties": {
              "lang": {
                "default": "fr",
                "enum": ["fr", "en"],
                "title": "Lang",
                "type": "string"
              },
              "product_name": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Product Name"
              },
              "text": {
                "title": "Text",
                "type": "string"
              },
              "text_type": {
                "enum": ["product_description", "marketing", "terms", "legal_notice"],
                "title": "Text Type",
                "type": "string"
              }
            },
            "required": ["text", "text_type"],
            "title": "check_textArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
