        {
          "name": "scan_website",
          "description": "Scan a live website against French consumer and e-commerce law (16 checks) and return findings with excerpts and legal references.\n\n    The robot reads up to 20 public pages (home, legal notice, terms of sale, returns, product pages), respects robots.txt,\n    never bypasses a firewall and does not run JavaScript. Usually takes 20 to 90 seconds; if it is still running after\n    100 seconds you get a scan_id to pass to get_scan_result. A human-readable report stays online for 30 days at report_url.\n\n    Args:\n        url: the site or shop to scan (domain or full URL; a product page URL is also read).\n        sector: \"vente-en-ligne\" (online shop), \"immobilier\" (estate agency) or \"entreprise\" (other business site).\n            Guessed from the site when omitted; it selects the list of rules a human must check.\n        lang: language of the findings, \"fr\" or \"en\".\n        fresh: the same site scanned in the last 30 minutes is reused; set true to read it again after a fix.\n    ",
          "inputSchema": {
            "properties": {
              "fresh": {
                "default": false,
                "title": "Fresh",
                "type": "boolean"
              },
              "lang": {
                "default": "fr",
                "enum": ["fr", "en"],
                "title": "Lang",
                "type": "string"
              },
              "sector": {
                "anyOf": [
                  {
                    "enum": ["vente-en-ligne", "immobilier", "entreprise"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Sector"
              },
              "url": {
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "scan_websiteArguments",
            "type": "object"
