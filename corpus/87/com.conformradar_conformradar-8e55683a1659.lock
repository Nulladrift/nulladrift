        {
          "name": "generate_gpsr_block",
          "description": "Build the \"manufacturer and product safety\" block that every online offer of a non-food product must show in the EU\n    (GPSR, Regulation (EU) 2023/988, art. 19), as HTML (French labels) and plain text, ready to paste into a product page.\n\n    Args:\n        manufacturer_name: manufacturer's name or trade name.\n        manufacturer_postal_address: manufacturer's postal address.\n        manufacturer_email: manufacturer's e-mail or electronic contact.\n        eu_responsible_name / eu_responsible_postal_address / eu_responsible_email: the EU responsible person, required\n            when the manufacturer is established outside the EU.\n        product_identification: type, batch or serial number, or another identifier, plus a picture reference if any.\n        safety_warnings: warnings and safety information, in French for the French market.\n    ",
          "inputSchema": {
            "properties": {
