{
  "lockfileVersion": 2,
  "subjects": {
    "com.only-mcp/onlymcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://only-mcp.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "onlymcp-docs",
        "title": "OnlyMCP Docs",
        "version": "0.27.1",
        "websiteUrl": "https://only-mcp.com",
        "icons": [
          {
            "src": "https://only-mcp.com/brand/connector-512.png",
            "mimeType": "image/png"
          },
          {
            "src": "https://only-mcp.com/brand/favicon.svg",
            "mimeType": "image/svg+xml"
          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "This is OnlyMCP (https://only-mcp.com) without a sign-in, so only its documentation tools are here. They answer questions about OnlyMCP from its documentation and help set it up; they hold no account data and change nothing. OnlyMCP keeps a person's skills, agents, memory and MCP servers in one place and serves them to every AI client through one address, https://only-mcp.com/api/mcp. Signed in, that same address serves the account; a free account is created at https://only-mcp.com. To sign in, use the client's own sign-in for this server (OAuth), or send the header \"Authorization: Bearer omk_…\" with a token created under Connect in OnlyMCP. To answer a question, search the documentation first and read a page when the passage is not enough. To help someone connect a client, get the setup steps for that client.",
      "tools": [
        {
          "name": "get_setup_guide",
          "title": "Get the setup steps for a client",
          "description": "Get the steps that connect one AI client to OnlyMCP: where to create the account, and the exact address, command or configuration file that client needs. Meant for helping a person set OnlyMCP up in a client they name; not for general questions about the product. Answers the steps as markdown with the configuration to copy; a token appears as the placeholder omk_…, never a real one. It sets nothing up itself, and the account's own endpoint (https://only-mcp.com/api/mcp) still needs the person to sign in.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "client": {
                "description": "The client to connect, by its id, for example claude-code, cursor or chatgpt.",
                "enum": ["claude-app", "chatgpt", "gemini-app", "grok", "claude-code", "codex", "antigravity", "opencode", "copilot-vscode", "cursor", "windsurf", "cline", "zed", "gitlab-duo"],
                "type": "string"
              },
              "language": {
                "description": "Language of the answer: en (default), de, fr or it. A page not yet translated comes back in English.",
                "enum": ["en", "de", "fr", "it"],
                "type": "string"
              }
            },
            "required": ["client"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the setup steps for a client"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a6bdb1c5998aff3e074f0417ad3199fe0e16de40fe53ac636fcabf148c3f500d"
        },
        {
          "name": "list_docs",
          "title": "List the documentation pages",
          "description": "List every page of the OnlyMCP documentation with its short name, title and one-line summary. Meant for an overview of what is documented or for picking a page; not for answering a question about the product by itself. Answers one line per page, in the order of the website. Reads only public documentation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the answer: en (default), de, fr or it. A page not yet translated comes back in English.",
                "enum": ["en", "de", "fr", "it"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List the documentation pages"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f671a05a96b9626a80ef75338f4bd5c68775491359395f9ed6e7f85a1ccd2086"
        },
        {
          "name": "list_servers",
          "title": "List connectable MCP servers",
          "description": "List the MCP servers from OnlyMCP's catalogue, the ones an account can add with one click and then reach through its single address. Meant for checking whether a service such as GitHub or Notion can be connected and how it signs in; not for calling those servers, which only a signed-in account can do. Answers one line per server with its name, address, sign-in method and the prefix its tools get, up to 60 lines. Any other MCP server with an http address can be added by hand and is not listed here.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Part of a server name or address to filter by, for example \"git\". Left out: the whole catalogue.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List connectable MCP servers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4366a6de0d31763ff93fb494dad769269d5722e64a66d38e222601ad91be56fe"
        },
        {
          "name": "read_doc",
          "title": "Read a documentation page",
          "description": "Read one page of the OnlyMCP documentation in full, as markdown. Meant for when the page is known by its short name; not for finding which page holds an answer. Answers the title, the address and the whole text of the page, including the commands and configuration it shows. Reads only public documentation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the answer: en (default), de, fr or it. A page not yet translated comes back in English.",
                "enum": ["en", "de", "fr", "it"],
                "type": "string"
              },
              "slug": {
                "description": "Short name of the page, as it stands in the address after /docs/.",
                "enum": ["what-is-onlymcp", "mcp-explained", "clients", "chat-apps", "mcp-servers", "import-and-sync", "security", "devices-and-tokens", "teams", "share-mcp-servers", "new-computer"],
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a documentation page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:48bba9dfcc879ab0b2b2787bab2a908f3139f62cbaf31fbe8da6a795bca49ccb"
        },
        {
          "name": "search_docs",
          "title": "Search the OnlyMCP documentation",
          "description": "Find the sections of the OnlyMCP documentation that answer a question, for example how tokens work, what a team shares or how an MCP server is connected. Meant for a question in words when the right page is not known; not for reading a whole page. Answers up to five sections, best match first, each with its page, heading, address and the passage that matched, or says that nothing matched. Reads only public documentation: no account, no stored content.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the answer: en (default), de, fr or it. A page not yet translated comes back in English.",
                "enum": ["en", "de", "fr", "it"],
                "type": "string"
              },
              "query": {
                "description": "The question or a few keywords, for example \"revoke a token\" or \"share servers with a team\". The first eight words count.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the OnlyMCP documentation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:72fab94d9ff0db0fd93a311c630af9f85a9258c9fb5eee452edc90d0c8aba9ad"
        }
      ],
      "digest": "sha256:73daabc071e604869ff5150454c1a23c9fe59cdc831b11c6cbce6225bd8ed14e"
    }
  }
}
