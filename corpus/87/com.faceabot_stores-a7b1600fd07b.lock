{
  "lockfileVersion": 2,
  "subjects": {
    "com.faceabot/stores": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://faceabot.com/tools-mcp/stores"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "faceabot-stores",
        "title": "Faceabot stores for AI agents",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ai_shopping_observatory: who charges what to be shown in AI answers, which stores let agents in. find_store {query, country}: stores where you can shop as an agent (UCP MCP endpoint verified by Faceabot), big retailers of the country that let agents read, and the Shopify cross-store search. Then call the store yourself (search_catalog) with your own UCP agent profile; no website to host one? get_agent_profile {agent_name} gives you a free browse-only profile URL hosted by Faceabot. Faceabot never buys and never copies catalogs.",
      "tools": [
        {
          "name": "ai_shopping_observatory",
          "title": "The AI shopping observatory",
          "description": "What AIs look for on Faceabot (by country and category), which stores let AI agents in, who charges what to be shown in AI answers (Google, OpenAI, Meta, Perplexity, Shopify… dated facts with sources), and Faceabot's weekly test for paid placements in Shopify's cross-store search.\nExample: {}",
          "inputSchema": {
            "properties": {
              "days": {
                "default": 30,
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f73f897accb7318437f0b67d0219275ede4c4ba4898b4faa87ede98b6cd6b8d1"
        },
        {
          "name": "find_store",
          "title": "Find a store where an AI agent can shop",
          "description": "Where can I (an AI agent) shop for this product, for my human's country? Returns stores that Faceabot verified for agents: their UCP MCP endpoint (search_catalog, get_product, checkout), whether they ship to the country, plus the country's big retailers that let agents read (robots.txt) and the Shopify cross-store search. Any language.\nUse when: your user wants to buy something (washing machine, running shoes, perfume…).\nExample: {\"query\":\"washing machine\",\"country\":\"BE\"}",
          "inputSchema": {
            "properties": {
              "agent_checkout_only": {
                "description": "true = only stores declaring agent checkout",
                "type": "boolean"
              },
              "category": {
                "description": "Optional category id (see list_store_categories)",
                "type": "string"
              },
              "country": {
                "description": "Your human's country (ISO code or name), e.g. BE, Japan",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Product or need in any language, e.g. washing machine, lave-linge, 洗濯機",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4c22a432e690e0c85a9fb0d51c41879928535d2ba1726824f0ea44fc53f849ee"
        },
        {
          "name": "get_agent_profile",
          "title": "Get a UCP agent profile URL hosted by Faceabot (browse only)",
          "description": "UCP stores (Shopify and others) ask every agent for meta['ucp-agent'].profile: the https URL of a JSON file describing it. No website to publish one? Faceabot hosts yours, free: one URL per agent name, browse-only (catalog search and product lookup, no payment handler: it cannot pay). Same name = same URL. Faceabot never sees your searches.\nExample: {\"agent_name\":\"Travel helper by Acme\"}",
          "inputSchema": {
            "properties": {
              "agent_name": {
                "description": "Your agent's name (2-80 characters), ideally with its maker, e.g. \"Travel helper by Acme\"",
                "type": "string"
              }
            },
            "required": ["agent_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:88dfc36b71fcefbcbfc0b734ee76cdc9aebff34b450b1ed0042a89df8910f14b"
        },
        {
          "name": "list_store_categories",
          "title": "Store categories",
          "description": "The product categories Faceabot uses to classify stores, with how many verified stores each has.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fb20c805334d0288ef7ceab2e1f217819486fc336fe3c07240d615d4f32a32a9"
        },
        {
          "name": "store_details",
          "title": "What Faceabot measured on one store",
          "description": "One store's record: UCP version and MCP endpoint, capabilities, tools listed, countries it ships to, robots.txt rules for agents, last checks, and the exact search_catalog call.\nExample: {\"domain\":\"allbirds.com\",\"country\":\"US\"}",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Optional: your human's country, to check shipping",
                "type": "string"
              },
              "domain": {
                "description": "Store domain, e.g. allbirds.com",
                "type": "string"
              },
              "query": {
                "description": "Optional product words for the call template",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0088ab507284ca2cf1737551cf28d8c6576b45cff159a86b982419cf5d58fc27"
        }
      ],
      "digest": "sha256:416efdb4774b8e93736855d7073dc9ace438b4b734ac190dfd98ba4a7dea7fe7"
    }
  }
}
