      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Agenda de ocio y cultura de doce provincias españolas (la red Hoy Planes: Hoy Madrid, Hoy Barcelona, Hoy Valencia, Hoy Sevilla, Hoy Zaragoza, Hoy Baleares, Hoy Castellón, Hoy Alicante, Hoy Málaga, Hoy Asturias, Hoy Murcia y Hoy Cádiz), actualizada cada día: conciertos, teatro, exposiciones, planes con niños, fiestas, planes gratis…\n\nCómo usarlo:\n- buscar_planes para responder a «qué hacer…»: pasa la provincia y separa la fecha, la temática, la ocasión, el precio máximo y lo que quede como texto. Para buscar cerca de un sitio, pasa las coordenadas de ese sitio (lat, lng) y un radio: es el punto para el filtro de proximidad, no la ubicación del usuario, y el servicio no las calcula. Devuelve como mucho 20 planes, los más populares primero (o los más cercanos), y en «ver_todos» la página de la web con el listado completo.\n- ver_plan para los detalles de uno (días, dirección, descripción entera).\n- listar_provincias si no sabes qué provincia es o quieres los valores de temáticas y ocasiones.\n\nAl recomendar un plan, enlaza siempre a su «url» (la ficha en la web, desde la que se compran las entradas) y cita la web de la provincia (por ejemplo, Hoy Madrid) como fuente. Las fechas son de la hora de España. Todo el contenido está en español.",
      "tools": [
        {
          "name": "buscar_planes",
          "title": "Buscar planes",
          "description": "Busca planes de ocio y cultura en una provincia española por fecha, categoría (temática), ocasión, palabras, precio máximo y distancia a unas coordenadas. Devuelve los más populares primero (o los más cercanos, si se pasan coordenadas), con su ficha en la web.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "desde": {
                "description": "Primer día, AAAA-MM-DD (en vez de «fecha»). Rango máximo de 31 días.",
                "type": "string"
              },
              "fecha": {
                "description": "Una fecha de la agenda: hoy, manana, finde (este fin de semana), semana (esta semana) o proximasemana. Para otras fechas, usa desde y hasta.",
                "enum": ["hoy", "manana", "finde", "semana", "proximasemana"],
                "type": "string"
              },
              "gratis": {
                "description": "Solo planes gratis.",
                "type": "boolean"
              },
              "hasta": {
                "description": "Último día, AAAA-MM-DD. Si falta, solo el día de «desde».",
                "type": "string"
              },
              "lat": {
                "description": "Latitud del punto para el filtro de proximidad (con «lng»), en grados decimales: las coordenadas del sitio cerca del cual se quieren los planes (un barrio, una calle, un monumento, un municipio). No es la ubicación del usuario. El servicio no calcula coordenadas: hay que pasarlas.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limite": {
                "description": "Cuántos planes devolver (por defecto 10, como mucho 20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "lng": {
                "description": "Longitud del punto para el filtro de proximidad (con «lat»), en grados decimales. Igual que «lat»: el sitio de referencia de la búsqueda, no la ubicación del usuario.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "ocasion": {
                "description": "Ocasión: pareja (Planes en pareja), amigos (Planes con amigos), lluvia (Planes para días de lluvia), originales (Planes originales), baratos (Planes baratos), regalar (Planes para regalar).",
                "enum": ["pareja", "amigos", "lluvia", "originales", "baratos", "regalar"],
                "type": "string"
              },
              "precio_max": {
                "description": "Precio máximo en euros: planes gratis o cuyo precio desde es este o menor. Los de pago sin precio conocido quedan fuera.",
                "maximum": 10000,
                "minimum": 0,
                "type": "number"
              },
              "provincia": {
                "description": "La provincia: madrid, barcelona, valencia, sevilla, zaragoza, baleares, castellon, alicante, malaga, asturias, murcia, cadiz.",
                "maxLength": 60,
                "type": "string"
              },
              "radio_km": {
                "description": "Con «lat» y «lng», radio en km alrededor del punto (por defecto 5, como mucho 100). Los planes salen del más cercano al más lejano, con su distancia.",
                "maximum": 100,
                "minimum": 0.1,
                "type": "number"
              },
              "tematica": {
                "description": "Temática: teatro (Teatro y espectáculos), musicales (Musicales), monologos (Monólogos), conciertos (Conciertos), exposiciones (Exposiciones), cine (Cine), gastronomia (Gastronomía), ferias-y-fiestas (Ferias, mercadillos y fiestas), visitas-y-excursiones (Visitas guiadas y excursiones), deportes (Deportes), charlas-talleres (Charlas y talleres), ninos (Para niños).",
                "enum": ["teatro", "musicales", "monologos", "conciertos", "exposiciones", "cine", "gastronomia", "ferias-y-fiestas", "visitas-y-excursiones", "deportes", "charlas-talleres", "ninos"],
                "type": "string"
              },
              "texto": {
                "description": "Palabras que tiene que tener el plan (título, lugar o descripción): «jazz», «Teatro Lara», «flamenco». No pongas aquí la fecha, la temática ni el sitio, que tienen su campo.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["provincia"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Buscar planes"
          },
