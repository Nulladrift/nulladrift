      "serverInfo": {
        "name": "hoy-planes",
        "title": "Hoy Planes",
        "version": "1.0.0",
        "websiteUrl": "https://www.hoyplanes.com/mcp/",
        "icons": [
          {
            "src": "https://www.hoyplanes.com/conector/icono-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
