                "enum": ["approve", "deny"],
                "type": "string"
              },
              "id": {
                "type": "integer"
              },
              "note": {
                "type": "string"
              }
            },
            "required": ["decision", "id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
