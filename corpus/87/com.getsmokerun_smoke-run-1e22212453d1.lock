{
  "lockfileVersion": 2,
  "subjects": {
    "com.getsmokerun/smoke-run": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://getsmokerun.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "smokerun",
        "title": "Smoke Run",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Smoke Run is a read-only revenue-integrity service for agents. run_revenue_check(url) is free and needs no key: it loads a public site as a synthetic visitor, follows the money path, and returns a dollar-proof teardown of where revenue is at risk, with a confidence label on each finding. get_money_system(url) reads the revenue stack a public site runs on. Both submit nothing, charge nothing and store nothing. get_latest_findings and list_checks read an account history and need an API key. Pass a key as a bearer token or the api_key argument to lift the free daily limit.",
      "tools": [
        {
          "name": "get_latest_findings",
          "description": "Purpose: fetch the stored result of the most recent revenue check already run for one site, without running a new check. When to use: the user asks what the last check of a site found, or wants to compare against earlier results; not for a site that has never been checked. Inputs: siteUrl (required, the site address as previously checked). Outputs: found (boolean), runId and the dollar-proof findings of that check, or found false with a null proof when no check exists. Limits: needs a Smoke Run API key because it reads account history; read-only; returns one check only; does not fetch the live site.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "siteUrl": {
                "description": "A public website address, for example https://example.com.",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "required": ["siteUrl"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "found": {
                "description": "False when no check has been run for that site yet.",
                "type": "boolean"
              },
              "proof": {
                "description": "The dollar proof of the latest check, or null when found is false.",
                "type": ["object", "null"]
              },
              "runId": {
                "type": "string"
              },
              "siteUrl": {
                "type": "string"
              }
            },
            "required": ["found", "proof"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get latest findings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:be31270cf0f4ce2b519b461e5ce2539644a92f40a6d723234a6a62a962446b9a"
        },
        {
          "name": "get_money_system",
          "description": "Purpose: identify which revenue tools a public website is built on (payment processor, CRM or lead destination, email provider, booking tool, analytics and ad pixels) and map the funnel. When to use: the user asks what stack, payment processor, CRM or tracking a site uses, or wants a funnel map; not for finding revenue leaks (that is a teardown). Inputs: url (required, a public website address); api_key (optional). Outputs: a funnel map of detected nodes, each noting what a connected check could verify end to end. Limits: free and needs no key; detects only from the public page, so server-side tools are invisible; reports no dollar findings and does not test whether anything works.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Optional. A Smoke Run API key. It lifts the free daily limit and is not required for a single check.",
                "maxLength": 200,
                "type": "string"
              },
              "url": {
                "description": "A public website address, for example https://example.com.",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "detected": {
                "description": "False when nothing could be read from the page; the map is then empty, not an error.",
                "type": "boolean"
              },
              "map": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "detail": {
                      "type": "string"
                    },
                    "detected": {
                      "type": "boolean"
                    },
                    "kind": {
                      "enum": ["form", "payment", "crm", "email", "booking", "analytics"],
                      "type": "string"
                    },
                    "paidProof": {
                      "description": "What a connected check can verify end to end for this node.",
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["detail", "detected", "kind", "paidProof", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "siteUrl": {
                "type": "string"
              }
            },
            "required": ["detected", "map", "siteUrl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get money system"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:312faee672fa015646baaf4d6994618e772bca2665a6e9b26283915889c8592c"
        },
        {
          "name": "list_checks",
          "description": "Purpose: list the revenue checks previously run on the authenticated Smoke Run account, newest first. When to use: the user asks for their check history, which sites were checked, or which runs are at risk; not for checking a new site. Inputs: siteUrl (optional, narrows to one site); limit (optional integer 1 to 100, default 50). Outputs: checks array, each with runId, siteUrl, status (healthy, at_risk, broken or inconclusive), dollarsAtRisk, mode, startedAt and finishedAt. Limits: needs a Smoke Run API key; read-only; summaries only, without full findings; does not run or fetch anything on the live site.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Optional. Max rows.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "siteUrl": {
                "description": "Optional. Narrow the list to one site.",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "checks": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "dollarsAtRisk": {
                      "type": "number"
                    },
                    "finishedAt": {
                      "type": "string"
                    },
                    "mode": {
                      "enum": ["monitor", "teardown"],
                      "type": "string"
                    },
                    "runId": {
                      "type": "string"
                    },
                    "siteUrl": {
                      "type": "string"
                    },
                    "startedAt": {
                      "type": "string"
                    },
                    "status": {
                      "enum": ["healthy", "at_risk", "broken", "inconclusive"],
                      "type": "string"
                    }
                  },
                  "required": ["dollarsAtRisk", "finishedAt", "mode", "runId", "siteUrl", "startedAt", "status"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["checks"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List checks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1f532dfb5520a84d0a988a1135cbc53686a532690b6087458a1d84da3c77faf6"
        },
        {
          "name": "run_revenue_check",
          "description": "Purpose: run a fresh, read-only teardown of a public website's money path (landing page, call to action, lead form, checkout reachability, analytics) and report where revenue is leaking, with dollar proof. When to use: the user gives a website address and asks whether the site is losing leads or sales, why a form or checkout may be broken, or for a free revenue audit of a site; this is the entry point for any site not yet checked. Inputs: url (required, a public website address); api_key (optional, lifts the free daily limit). Outputs: runId and a proof object with findings, each labelled confirmed (reproduced from outside), likely (inferred from the public page) or unverifiable from outside, plus a conservative monthly dollar floor on confirmed or likely findings. Limits: free and needs no key for a single check; sees only what a visitor sees; never submits a form and never completes a charge; cannot see inside a private dashboard or a payment processor account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Optional. A Smoke Run API key. It lifts the free daily limit and is not required for a single check.",
                "maxLength": 200,
                "type": "string"
              },
              "url": {
                "description": "A public website address, for example https://example.com.",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "confidenceNote": {
                "type": "string"
              },
              "dollarsAtRisk": {
                "description": "Conservative monthly floor, summed from confirmed and likely findings only.",
                "type": "number"
              },
              "findingCount": {
                "description": "Total findings, which can exceed the number returned in findings.",
                "type": "integer"
              },
              "findings": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "confidence": {
                      "description": "confirmed: reproduced from outside. likely: inferred from the public page. unverifiable_from_outside: only a connected check can confirm it; carries no dollar figure.",
                      "enum": ["confirmed", "likely", "unverifiable_from_outside"],
                      "type": "string"
                    },
                    "estMonthlyLoss": {
                      "description": "Conservative monthly dollar floor. Present only on confirmed or likely findings.",
                      "type": "number"
                    },
                    "evidence": {
                      "description": "Redacted, owner-readable evidence.",
                      "type": "string"
                    },
                    "fix": {
                      "description": "What to change.",
                      "type": "string"
                    },
                    "severity": {
                      "enum": ["critical", "warning", "ok"],
                      "type": "string"
                    },
                    "whatBroke": {
                      "description": "Plain-English statement of what is wrong.",
                      "type": "string"
                    },
                    "where": {
                      "description": "Where on the money path it was seen.",
                      "type": "string"
                    }
                  },
                  "required": ["evidence", "severity", "whatBroke", "where"],
                  "type": "object"
                },
                "type": "array"
              },
              "generatedAt": {
                "description": "ISO 8601 timestamp.",
                "type": "string"
              },
              "headline": {
                "type": "string"
              },
              "moneySystem": {
                "additionalProperties": true,
                "properties": {
                  "analytics": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "booking": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "crm": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "email": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "hasForm": {
                    "type": "boolean"
                  },
                  "https": {
                    "type": "boolean"
                  },
                  "payment": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "tracking": {
                    "enum": ["client_pixel_seen", "likely_server_side", "none_detected"],
                    "type": "string"
                  }
                },
                "required": ["analytics", "booking", "crm", "email", "hasForm", "https", "payment", "tracking"],
                "type": "object"
              },
              "proof": {
                "additionalProperties": true,
                "description": "Keyed callers only. The dollar proof: siteUrl, headline, dollarsAtRisk, window, findings, generatedAt.",
                "properties": {
                  "dollarsAtRisk": {
                    "type": "number"
                  },
                  "findings": {
                    "items": {
                      "additionalProperties": true,
                      "properties": {
                        "confidence": {
                          "description": "confirmed: reproduced from outside. likely: inferred from the public page. unverifiable_from_outside: only a connected check can confirm it; carries no dollar figure.",
                          "enum": ["confirmed", "likely", "unverifiable_from_outside"],
                          "type": "string"
                        },
                        "estMonthlyLoss": {
                          "description": "Conservative monthly dollar floor. Present only on confirmed or likely findings.",
                          "type": "number"
                        },
                        "evidence": {
                          "description": "Redacted, owner-readable evidence.",
                          "type": "string"
                        },
                        "fix": {
                          "description": "What to change.",
                          "type": "string"
                        },
                        "severity": {
                          "enum": ["critical", "warning", "ok"],
                          "type": "string"
                        },
                        "whatBroke": {
                          "description": "Plain-English statement of what is wrong.",
                          "type": "string"
                        },
                        "where": {
                          "description": "Where on the money path it was seen.",
                          "type": "string"
                        }
                      },
                      "required": ["evidence", "severity", "whatBroke", "where"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "generatedAt": {
                    "type": "string"
                  },
                  "headline": {
                    "type": "string"
                  },
                  "siteUrl": {
                    "type": "string"
                  },
                  "window": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "runId": {
                "description": "Keyed callers only. The stored check id, readable later with get_latest_findings, list_checks or GET /api/v1/checks/{id}.",
                "type": "string"
              },
              "siteUrl": {
                "type": "string"
              },
              "status": {
                "description": "inconclusive means the scan could not finish; it carries no findings, no dollar figure and says nothing about whether the money path works.",
                "enum": ["complete", "inconclusive"],
                "type": "string"
              },
              "window": {
                "description": "The period the dollar figure covers, for example \"per month\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Run a revenue check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:eb26369aa2819c79ad52b103e78af7e58da3b186f7b0999d3fad8d9226e5786b"
        }
      ],
      "digest": "sha256:3a41780e7a125b6d40498dfe8e3bf3ff5137d6f8950429028cd02672215ef4ad"
    }
  }
}
