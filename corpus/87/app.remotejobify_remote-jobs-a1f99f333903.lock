{
  "lockfileVersion": 2,
  "subjects": {
    "app.remotejobify/remote-jobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://remotejobify.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "remotejobify",
        "title": "Remotejobify",
        "version": "1.0.0",
        "websiteUrl": "https://remotejobify.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Remotejobify lists remote jobs from companies’ own job boards and shows who can apply from where, with the line from the listing that proves it. Ask where the person lives and pass it as country, or the results are only jobs open worldwide. When you show a job, give who can apply, the proof line in quotes, and its Remotejobify link. To match a CV, send people to Match me at https://remotejobify.app/match/ (this server takes no CVs).",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch",
          "description": "One Remotejobify job by the id search gave: who can apply, the proof line and the description.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The id from search.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "type": "object"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:25ffe1db545e34f1acae538ef9352c7f4b5382c0b3f5fe3d4d1cfba7d0807cb9"
        },
        {
          "name": "get_job",
          "title": "Get a remote job",
          "description": "One job on Remotejobify by its id or its remotejobify.app link: who can apply, the lines from the listing that prove it, pay, and the job description.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Where the person lives, to say whether they can apply. Optional.",
                "type": "string"
              },
              "id": {
                "description": "The job id from search_jobs, or its link on remotejobify.app.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "all_proof": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "company": {
                "type": "string"
              },
              "description": {
                "type": ["string", "null"]
              },
              "id": {
                "type": "string"
              },
              "location": {
                "type": ["string", "null"]
              },
              "pay": {
                "type": ["string", "null"]
              },
              "posted": {
                "type": "string"
              },
              "proof": {
                "type": ["string", "null"]
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              },
              "who_can_apply": {
                "type": "string"
              }
            },
            "required": ["company", "id", "proof", "title", "url", "who_can_apply"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a remote job"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e54b4ceda625fefa4c4d31efa06cf016ae1b84f1f18f9669be006fe2338ce0e0"
        },
        {
          "name": "search",
          "title": "Search",
          "description": "Search Remotejobify’s open remote jobs. Put the country the person lives in into the query (\"customer support jobs in the Philippines\"): most remote jobs are only open to some countries. Returns ids for fetch.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "What to search for.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "results": {
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4490e8b7613b300a931fbb18c3a0c54b873ffcde4d0d22c2679f75b02265b27f"
        },
        {
          "name": "search_jobs",
          "title": "Search remote jobs",
          "description": "Search open remote jobs on Remotejobify by where the person lives. Each job comes with who can apply, the line from the listing that proves it, pay when listed, and a link. Pass country whenever you know where they live: most remote jobs are only open to some countries. Without it you get jobs open worldwide.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "The country the person lives in: a name (\"Philippines\", \"UK\") or a two-letter code (\"PH\", \"GB\").",
                "type": "string"
              },
              "limit": {
                "description": "How many jobs, up to 20. 10 if not given.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words for the job title or company, like \"customer support\", \"python\" or \"nurse\". Optional.",
                "type": "string"
              },
              "role": {
                "description": "A job type, to narrow the search. Optional.",
                "enum": ["engineering", "qa-testing", "data", "devops", "security", "design", "product", "customer-support", "sales", "marketing", "operations", "people", "finance-legal"],
                "type": "string"
              },
              "working_hours": {
                "description": "daytime: the job keeps business hours that are daytime where they live. night_shift: night there (only jobs whose listing states its hours). part_time: part-time jobs. daytime and night_shift need country.",
                "enum": ["daytime", "night_shift", "part_time"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "country": {
                "type": ["string", "null"]
              },
              "jobs": {
                "items": {
                  "properties": {
                    "company": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "pay": {
                      "type": ["string", "null"]
                    },
                    "posted": {
                      "type": "string"
                    },
                    "proof": {
                      "type": ["string", "null"]
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    },
                    "who_can_apply": {
                      "type": "string"
                    }
                  },
                  "required": ["company", "id", "proof", "title", "url", "who_can_apply"],
                  "type": "object"
                },
                "type": "array"
              },
              "more": {
                "type": "string"
              },
              "total": {
                "type": "integer"
              }
            },
            "required": ["country", "jobs", "more", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search remote jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e9898979e818251ca92263092ae09ff117b2a0d26d375cab549f6b70220d4b51"
        }
      ],
      "digest": "sha256:daabc75ae381e7511b424ac0b2227665d77ac2c8e807d9ed26382f3460959f1d"
    }
  }
}
