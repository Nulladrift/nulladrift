        {
          "name": "verify",
          "description": "[CHECK · door] Verify a claim deterministically — returns a verdict (HOLDS / PARTIAL / BROKEN / INCOMPLETE / SYSTEM_ERROR), the worked trail, AND a sealed receipt {content_hash, cite_url} you can re-fetch and re-verify (seal_fetch). Three forms: (a) PLAIN — {claim}: a plain-language claim; the engine finds the checkable claim(s) in it (de-identified in an airlock first), verifies and seals them, or answers INCOMPLETE if no extractor recognizes one; (b) MATH — {mode, params}; (c) ANY DOMAIN — pass `steps`, a list of {id, domain, spec} where spec is that domain's packet (e.g. {domain:'physics', spec:{PHYS_VERIFY:{mass_kg, acceleration_m_per_s2, claimed_force_N}}}). ~60 secular domains are covered (physics, medicine, finance, chemistry, ...); find_verifier(keyword) locates the right one. The engine eliminates what is not the answer; it does not generate it. READ THE VERDICT EXACTLY: only BROKEN is a finding about the claim. SYSTEM_ERROR means OUR verifier could not run (see `means` and `error_at`) and says NOTHING about whether the claim is true — never relay it to a human as a refutation. INCOMPLETE means no verifier applied (`gap_at`), or every claim found was governed by a negation, a reported belief or a condition and was DECLINED. PARTIAL means the checked fragment held and material text around it was NOT checked (`coverage.unchecked_text`) — never quote PARTIAL as HOLDS.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "claim": {
                "description": "PLAIN form: a plain-language claim, in the caller's words",
                "maxLength": 4000,
                "type": "string"
              },
              "domain": {
                "description": "PLAIN form: an optional domain hint (from find_verifier); recorded, never trusted to pick the verifier",
                "maxLength": 4000,
                "type": "string"
              },
              "mode": {
                "description": "MATH form: equality | inequality | derivative | integral | limit | solve",
                "enum": ["calc_chain", "derivative", "equality", "inequality", "integral", "limit", "number_theory", "numeric", "solve", "system"],
                "type": "string"
              },
