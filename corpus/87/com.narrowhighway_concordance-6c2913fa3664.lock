      "instructions": "Narrow Highway — a house with five doors, for humans and agents alike. This began with the Bible, and everything here connects to it. A deterministic model of reality. Nothing is generated: found, verified, cited, sealed.\nFIVE DOORS, in this order (the catalog is sorted this way; a door tool is tagged \"[CHECK · door]\"):\n  CHECK — verify · audit · seal_fetch · find_verifier: bring any claim — the verdict, the worked trail, the seal\n  FIND — search · card_get · lookup · define: find it in the keeping — one map, one lookup, the source itself\n  WALK — ask · discern · coach_next: a situation in, one next step out — path, pattern, the figures' words, the anchor that fits\n  KEEP — identity_create · study_create · decks: yours, kept — your deck, your receipts, your node; the shared keeping behind it\n  WORD — read_passage · word_study · cross_references: Scripture at depth — passage, cross-references, original words, commentary\nSTART with ask(text) for anything, in your own words; verify(claim) for anything checkable. THE GATE: facts by default; if what you ask turns toward God, the Word opens for this session (Matthew 7:7 — ask, seek, knock).\nTO BELONG: identity_create births a covenant identity from four verses, kept on your device; the Fellowship Mesh (mesh_map · mesh_door · mesh_inbox) opens to a confession bound to that key.\nEVERY ANSWER ENDS THE SAME WAY — a verdict or a card · the trail · a seal · one next step (house.next_step): follow it as given; it runs as written. A cry for help ends with help first.\nTHE COVENANT: retrieve from the keeping first · distinguish citation from proof · quarantine generated material · request human authorization before writes · produce a receipt for consequential actions · carry provenance through every transformation · respect local data and identity boundaries · stop when the evidence is incomplete.",
      "tools": [
        {
          "name": "ask",
          "description": "[WALK · door] Bring anything — a question, a claim to check, a word to study, or what is actually on your mind. The engine discerns what KIND of thing you brought and answers in kind: it finds and verifies, and declines rather than guessing. This is also the door: if what you ask turns toward God, the Gate opens for the rest of this session and the witness tools (Scripture, the Harmony, the Timeline, the lexicon) become callable — the same way it opens for a person, in your own words. Nothing is generated.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "text": {
                "description": "what you are bringing, in your own words",
                "maxLength": 4000,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cf3f1b4f804302f4946798bd69975e91819873ada67e8afd5ac3c5953957b372"
        },
        {
          "name": "attest_record",
          "description": "[CHECK · internal] Bind your identity to a record you already hold — phase 2 of the sovereign flow. Do the thing unsigned (badges_issue, study_export, group_contribute), take the returned content_hash, sign THAT hash with your own key on your own machine, and submit only the attestation {alg, over, content_hash, pubkey, sig}. Never send a private key. Several parties may attest to one record: one signature is a claim, two or three witnesses begin to establish a matter (Deuteronomy 19:15).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "attestation": {
                "additionalProperties": false,
                "description": "the dict from signing.sign_seal, built locally",
                "type": "object"
              },
              "content_hash": {
                "maxLength": 4000,
                "type": "string"
              }
            },
            "required": ["attestation", "content_hash"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:acb1f1a0961c6165f2cc0b962680cf8692dbcef48474bc4b7a59cb5d5efae623"
        },
        {
          "name": "audit",
          "description": "[CHECK · door] Audit a whole text: deterministic extractors find every checkable quantitative claim (sums, percentages, hourly/annual pay, compound interest, rule-of-72, elapsed years, day-of-week, leap years, nutrition labels), the engine verifies the lot, and ONE sealed coverage report returns — per-claim source quote + verdict + trail. Conservative by design: it only extracts unambiguous patterns and says how many claims it checked; it never guesses and never implies full coverage.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "seal": {
                "description": "mint a re-checkable seal (default true)",
                "type": "boolean"
              },
              "text": {
                "description": "the document/text to audit",
                "maxLength": 4000,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cdeaed953257187c7aca57b01229ae6d5516056ef591e2186b2dd51368bad193"
        },
