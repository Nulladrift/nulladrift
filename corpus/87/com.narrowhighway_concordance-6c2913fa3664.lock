        {
          "name": "candidate_commit",
          "description": "[CHECK · internal] Candidate Engine step 1 — commit a COMPLETE raw candidate set BEFORE any evaluation. Give the query, the generator, the method, and EVERY raw candidate; weights ride verbatim as UNTRUSTED metadata (proposal_weight is never confidence and never ranks anything). Returns the committed set: a content-addressed candidate_set_id, the membership commitment hash (also sealed as a durable anchor), and per-candidate ids — all born quarantined. Nothing is verified here; that is the point: a set hashed before checking cannot be selectively disclosed after.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "candidates": {
                "description": "the COMPLETE raw generator output — omit nothing",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "proposal_weight": {
                      "description": "generator-verbalized weight, stored verbatim; UNTRUSTED metadata, never truth confidence",
                      "maximum": 1000000000000,
                      "minimum": -1000000000000,
                      "type": "number"
                    },
                    "raw_text": {
                      "maxLength": 4000,
                      "type": "string"
                    }
                  },
                  "required": ["raw_text"],
                  "type": "object"
                },
                "maxItems": 64,
                "type": "array"
              },
              "generation_method": {
                "description": "how the set was produced",
                "enum": ["adversarial", "direct", "human", "multi-agent", "retrieval-guided", "vs"],
                "type": "string"
              },
              "generator": {
                "description": "model/provider/version or human source (provenance)",
                "maxLength": 4000,
                "type": "string"
              },
              "prompt": {
                "description": "the exact generation instructions (hashed, not stored)",
                "maxLength": 4000,
                "type": "string"
              },
              "query": {
                "description": "the user request the candidates answer (hashed; not stored raw)",
                "maxLength": 4000,
                "type": "string"
              }
            },
            "required": ["candidates", "generation_method", "generator", "query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e5bb0ca3adad86af5c917b8af0fb243713575b2125b29c2e735de5646a31ffe8"
        },
