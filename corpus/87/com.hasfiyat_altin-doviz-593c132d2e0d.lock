      },
      "transport": {
        "type": "http",
        "url": "https://altinapi.hasfiyat.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "hasfiyat-altin-doviz",
        "title": "Hasfiyat Altın API",
        "version": "1.0.2",
        "websiteUrl": "https://altinapi.hasfiyat.com/mcp-sunucusu"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Türkiye piyasası canlı altın ve döviz fiyatları (Hasfiyat Altın API). Fiyatlar TL, alış (buy) ve satış (sell) olarak gelir. Önce list_sources ile kaynakları görün; get_prices canlı fiyat, get_price_history geçmiş, calculate_value tutar hesabı verir. Yanıtlarda kaynak olarak \"Hasfiyat Altın API\" belirtin.",
      "tools": [
        {
          "name": "calculate_value",
          "title": "Altın/döviz tutarı hesapla",
          "description": "Bir kalemin canlı fiyatıyla miktar × fiyat hesabı yapar. Ör. 15 gram 22 ayar, 3 çeyrek, 1000 USD kaç TL. `side`: satış (sell, müşterinin alırken ödediği) veya alış (buy). Computes quantity × live price in TRY.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "quantity": {
                "description": "Miktar (gram, adet veya döviz birimi).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "side": {
                "default": "sell",
                "description": "sell = satış fiyatı, buy = alış fiyatı.",
                "enum": ["sell", "buy"],
                "type": "string"
              },
              "source": {
                "default": "harem",
                "description": "Fiyat kaynağı kodu.",
                "enum": ["harem", "harem-canli", "hakan", "mayda", "myakche", "metal", "nadir", "anlik", "saglamoglu", "fikri", "sahap", "doviz"],
                "type": "string"
              },
              "symbol": {
                "description": "Kalem, ör. \"GRAM\", \"22 AYAR\", \"CEYREK\", \"USD\".",
                "type": "string"
              }
            },
            "required": ["quantity", "symbol"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Altın/döviz tutarı hesapla"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fc21de00b197f39f270b0304b4ec3dc07c6ab5841f957889b77dd926fca9c1a8"
        },
        {
          "name": "get_price_history",
          "title": "Geçmiş fiyat (OHLC)",
          "description": "Bir kalemin günlük (1d) veya saatlik (1h) açılış/yüksek/düşük/kapanış geçmişini döndürür (harem kaynağı). Günlük veri 4 Ekim 2026'dan, saatlik veri son 45 günden itibaren vardır. Tarihler YYYY-MM-DD. Returns daily or hourly OHLC history (Europe/Istanbul).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "Başlangıç tarihi (YYYY-MM-DD).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "period": {
                "default": "1d",
                "description": "1d = günlük, 1h = saatlik.",
                "enum": ["1d", "1h"],
                "type": "string"
              },
              "symbol": {
                "default": "HAS ALTIN",
                "description": "Kalem adı veya kısaltması, ör. \"HAS ALTIN\", \"GRAM\", \"USD\".",
                "type": "string"
              },
              "to": {
                "description": "Bitiş tarihi (YYYY-MM-DD).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Geçmiş fiyat (OHLC)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0a90daba69aebae4ace8724c139d4686de78ec7f00ef3c45e688689b44d034b2"
        },
        {
          "name": "get_prices",
          "title": "Canlı altın ve döviz fiyatları",
          "description": "Türkiye piyasası için canlı altın, gümüş, döviz ve parite alış/satış fiyatlarını döndürür (TL). `symbols` boşsa kaynaktaki tüm kalemler gelir. Örnek semboller: HAS, GRAM, CEYREK, YARIM, TAM, ATA, 22 AYAR, ONS, USD, EUR. Her çağrı 1 REST isteği sayılır. Returns live Turkish market gold/FX buy & sell prices in TRY.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "source": {
                "default": "harem",
                "description": "Fiyat kaynağı kodu (varsayılan harem).",
                "enum": ["harem", "harem-canli", "hakan", "mayda", "myakche", "metal", "nadir", "anlik", "saglamoglu", "fikri", "sahap", "doviz"],
                "type": "string"
              },
              "symbols": {
                "description": "İstenen semboller, ör. [\"HAS\",\"GRAM\",\"CEYREK\",\"USD\"]. Boş bırakılırsa tüm kalemler.",
                "items": {
                  "type": "string"
                },
                "maxItems": 40,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Canlı altın ve döviz fiyatları"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:13d2b53341e1e3f47087c0f2a0da30c3d74700f18988355fed30f4800c8fef06"
        },
        {
          "name": "list_sources",
          "title": "Fiyat kaynaklarını listele",
          "description": "Hasfiyat Altın API'nin desteklediği fiyat kaynağı kodlarını listeler (get_prices için `source`). API anahtarı gerektirmez, kota harcamaz. Lists the price source codes accepted by get_prices. No API key needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fiyat kaynaklarını listele"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8c7f692cb3f0231c189258cfd9d9d49015ba2077dec3a4d334adb509fe3edfda"
        }
      ],
      "digest": "sha256:b8cc35033c861892ef326508051633b79d36bbadd56e5ee9a68b921c8e4694cd"
    }
  }
