{
  "lockfileVersion": 2,
  "subjects": {
    "com.logiccommons/calculators": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.logiccommons.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "com.logiccommons/calculators",
        "version": "1.0.0-beta.2"
      },
      "capabilities": {
        "logging": {},
        "tools": {}
      },
      "tools": [
        {
          "name": "get_calculator_schema",
          "description": "Get the input and output schema for a calculator, generated from its reviewed contract: parameter types, units, allowed dropdown values and definitional bounds, plus outputs keyed by named range (including the status output). Table inputs carry a 'grid' block giving the exact number of rows to send, the column layout, which columns are editable, and how to shape a row; a table whose 'grid' block says writable=false cannot be supplied at all. Schema 0.18 exposes required and omitted declarations plus version-bound visibility tables; older versions require every input while awaiting metadata migration. Optionally resolves one immutable platform version. Returns trust metadata for the resolved version.",
          "inputSchema": {
            "properties": {
              "platform_version": {
                "default": null,
                "description": "Optional positive platform version number. Omit for the current published version.",
                "type": ["integer", "null"]
              },
              "slug": {
                "description": "The calculator slug, e.g. 'steel-column-capacity-calculator'.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9fe8db95bdfb98c1df5a48c71f951b634ef41c2fa51838010157b82d8afb4be8"
        },
        {
          "name": "run_calculator",
          "description": "Run a calculator with the given inputs. Inputs are validated against the resolved version's reviewed contract and computed by SpreadsheetWeb through the same proxy as the web channel. An optional platform_version pins both validation and computation to that immutable version. Returns outputs keyed by named range (including the status output) and trust metadata with a citation URL, resolvedInputs, and warnings for omitted inputs. Missing or blank visible required inputs are refused before computation; inspect get_calculator_schema and the complete error detail. For schema 0.18, optional omissions are sent explicitly as declared blank or standing default and disclosed with their values and sources. Older pinned contracts require all inputs during migration. Visibility follows version-bound truth tables over dropdown options, or over blank/set for a clearable optional input (omitted, null or whitespace is blank; 0 is set); a missing required controller makes its dependents indeterminate until it is supplied. A hidden controller is ignored only when all of its option branches have the same remaining visibility subtree; otherwise its dependents stay hidden. Hidden omissions use explicit blank/default values; supplied hidden inputs are retained with a not-applicable warning. Always read Model_Status and status outputs; CHECK and STOP are load-bearing verdicts about the result's validity. Results are informational and not professional advice; the applicable notice is returned in the trust block.",
          "inputSchema": {
            "properties": {
              "inputs": {
                "description": "Input name/value pairs matching the calculator schema (from get_calculator_schema). A table input takes a list of rows matching its 'grid' block exactly; a table of the wrong extent or shape is refused rather than partially applied.",
                "type": "object"
              },
              "platform_version": {
                "default": null,
                "description": "Optional positive platform version number. Omit for the current published version.",
                "type": ["integer", "null"]
              },
              "slug": {
                "description": "The calculator slug.",
                "type": "string"
              }
            },
            "required": ["inputs", "slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:458004c060015d02f2cd07339ff4fa6001b56162893832e14e6e116d1e5cee24"
        },
        {
          "name": "search_calculators",
          "description": "Search the LogicCommons calculator catalog by keyword and optional category. Returns matching published calculators with slug, name, summary, category, a citation URL, and trust metadata.",
          "inputSchema": {
            "properties": {
              "category": {
                "default": null,
                "description": "Optional category slug to filter by, e.g. 'structural-civil'.",
                "type": ["string", "null"]
              },
              "query": {
                "description": "Free-text query matched against calculator name, summary and category. Empty returns the catalog.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bd40ef4e2ada515de9236de881340bbe040a0a26cbbb75160f0626dfcbf151c7"
        }
      ],
      "digest": "sha256:eefb196d5936dcdeecd61775cef8ef575b4c50d023a736756c2addca74927e27"
    }
  }
}
