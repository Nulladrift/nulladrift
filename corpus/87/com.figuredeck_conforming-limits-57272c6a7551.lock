{
  "lockfileVersion": 2,
  "subjects": {
    "com.figuredeck/conforming-limits": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.figuredeck.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "figuredeck",
        "title": "FigureDeck — US mortgage calculators and FHFA loan limits",
        "version": "1.0.0",
        "websiteUrl": "https://figuredeck.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Two kinds of answers: a table (2026 FHFA conforming loan limits for all 3235 US counties) and calculations (monthly payment, total interest, price supported by an income). Every number is exact and comes with a source you can cite. Amounts are US dollars.",
      "tools": [
        {
          "name": "affordability",
          "title": "How much house a given income supports",
          "description": "Works backwards from income to a purchase price. Applies a debt-to-income cap to gross monthly income, subtracts existing monthly debts, then subtracts property tax, insurance and HOA, and solves for the loan that the remaining monthly budget supports at the given rate. Adds the down payment to get the price. Also returns the same answer at the 28%, 36%, 43% and 50% DTI caps so the caller can see how much the choice of cap moves the number.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annual_rate_percent": {
                "description": "Expected nominal annual rate in percent, e.g. 6.5.",
                "type": "number"
              },
              "down_payment": {
                "description": "Cash available for down payment in dollars. Default 0.",
                "type": "number"
              },
              "dti_cap_percent": {
                "description": "Which DTI cap to headline. Default 36.",
                "type": "number"
              },
              "monthly_debts": {
                "description": "Existing monthly debt payments (car, student, cards) in dollars. Default 0.",
                "type": "number"
              },
              "monthly_hoa": {
                "description": "Optional monthly HOA in dollars.",
                "type": "number"
              },
              "monthly_income": {
                "description": "Gross monthly income in dollars. Monthly, not annual — divide by 12 first.",
                "type": "number"
              },
              "monthly_insurance": {
                "description": "Optional monthly homeowners insurance in dollars.",
                "type": "number"
              },
              "monthly_tax": {
                "description": "Optional monthly property tax in dollars.",
                "type": "number"
              },
              "term_years": {
                "description": "Term in years, e.g. 30.",
                "type": "number"
              }
            },
            "required": ["annual_rate_percent", "monthly_income", "term_years"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "bands": {
                "items": {
                  "properties": {
                    "dti_cap_percent": {
                      "type": "number"
                    },
                    "max_loan": {
                      "type": "number"
                    },
                    "max_price": {
                      "type": "number"
                    },
                    "monthly_budget": {
                      "type": "number"
                    },
                    "monthly_pi": {
                      "type": "number"
                    }
                  },
                  "required": ["dti_cap_percent", "max_loan", "max_price", "monthly_budget", "monthly_pi"],
                  "type": "object"
                },
                "type": "array"
              },
              "citation": {
                "type": "string"
              },
              "down_payment": {
                "type": "number"
              },
              "dti_used": {
                "type": "number"
              },
              "max_loan": {
                "type": "number"
              },
              "max_monthly_housing_budget": {
                "type": "number"
              },
              "max_monthly_pi": {
                "type": "number"
              },
              "max_price": {
                "type": "number"
              }
            },
            "required": ["bands", "citation", "down_payment", "dti_used", "max_loan", "max_monthly_housing_budget", "max_monthly_pi", "max_price"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6029ef4676f5a3ac50625317ecd60466031559114e066712a6e59695c4c388a4"
        },
        {
          "name": "mortgage_payment",
          "title": "Monthly mortgage payment, total interest, total paid",
          "description": "Fixed-rate, fully amortising mortgage: equal monthly payment of principal and interest. Returns the monthly P&I, the lifetime interest, the total paid, and what share of the first payment is interest. Optionally adds monthly property tax, insurance and HOA to the total. Use this instead of estimating: the payment is exact to the cent and matches the calculator on figuredeck.com.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annual_rate_percent": {
                "description": "Nominal annual interest rate in percent, e.g. 6.5 for 6.5%.",
                "type": "number"
              },
              "loan_amount": {
                "description": "Amount borrowed in dollars — the price minus the down payment, not the price.",
                "type": "number"
              },
              "monthly_hoa": {
                "description": "Optional monthly HOA or condo dues in dollars.",
                "type": "number"
              },
              "monthly_insurance": {
                "description": "Optional monthly homeowners insurance in dollars.",
                "type": "number"
              },
              "monthly_tax": {
                "description": "Optional monthly property tax in dollars.",
                "type": "number"
              },
              "term_years": {
                "description": "Term in years, e.g. 30 or 15.",
                "type": "number"
              }
            },
            "required": ["annual_rate_percent", "loan_amount", "term_years"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "citation": {
                "type": "string"
              },
              "first_month_interest": {
                "type": "number"
              },
              "first_month_interest_share_percent": {
                "type": "number"
              },
              "monthly_payment": {
                "type": "number"
              },
              "months": {
                "type": "integer"
              },
              "total_interest": {
                "type": "number"
              },
              "total_monthly_with_tax_ins_hoa": {
                "type": "number"
              },
              "total_paid": {
                "type": "number"
              }
            },
            "required": ["citation", "first_month_interest", "first_month_interest_share_percent", "monthly_payment", "months", "total_interest", "total_monthly_with_tax_ins_hoa", "total_paid"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2427077d551479ae39d6a25f68433c2fab7013e3113c3db8cc685ef93989f038"
        },
        {
          "name": "search_conforming_limits",
          "title": "Search 2026 US conforming loan limits by county",
          "description": "Look up the FHFA conforming loan limit for a US county in calendar year 2026 — the maximum loan Fannie Mae and Freddie Mac will buy, for 1- to 4-unit properties. Covers all 3235 counties and county equivalents. Returns the baseline for counties with no special designation, and flags the 160 high-cost counties whose limit is above it. Pass a county name, a 5-digit FIPS code, or a state to list its counties.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "county": {
                "description": "County name, with or without 'County'/'Parish' and state, e.g. 'King County, WA' or 'king'.",
                "type": "string"
              },
              "fips": {
                "description": "5-digit county FIPS, e.g. '53033'. Takes precedence over county.",
                "type": "string"
              },
              "limit": {
                "description": "Max rows to return, 1-100. Default 10.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "state": {
                "description": "Two-letter state code, e.g. 'WA'. Filters results; on its own, lists that state's counties.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "type": "string"
              },
              "baseline_limit": {
                "description": "The 1-unit limit that applies in counties with no special designation.",
                "type": "number"
              },
              "citation": {
                "type": "string"
              },
              "counties": {
                "items": {
                  "properties": {
                    "above_baseline": {
                      "type": "boolean"
                    },
                    "county": {
                      "type": "string"
                    },
                    "fips": {
                      "type": "string"
                    },
                    "limit_1_unit": {
                      "type": "number"
                    },
                    "limit_2_unit": {
                      "type": "number"
                    },
                    "limit_3_unit": {
                      "type": "number"
                    },
                    "limit_4_unit": {
                      "type": "number"
                    },
                    "state": {
                      "type": "string"
                    }
                  },
                  "required": ["above_baseline", "county", "fips", "limit_1_unit", "limit_2_unit", "limit_3_unit", "limit_4_unit", "state"],
                  "type": "object"
                },
                "type": "array"
              },
              "matched": {
                "description": "How many counties matched the query, before truncation.",
                "type": "integer"
              },
              "returned": {
                "type": "integer"
              },
              "source": {
                "type": "string"
              },
              "truncated": {
                "type": "boolean"
              }
            },
            "required": ["as_of", "baseline_limit", "citation", "counties", "matched", "returned", "source", "truncated"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:265a603dbead5d67a389139c88109ee7bf84e7a42ef9d3527051c09bfe416579"
        }
      ],
      "digest": "sha256:3af5f9c355fb4ba6328665bb86e8a5268f0c5e47f21fdf0511cb3d52dc854d4c"
    }
  }
}
