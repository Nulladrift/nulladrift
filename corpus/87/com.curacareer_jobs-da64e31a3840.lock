{
  "lockfileVersion": 2,
  "subjects": {
    "com.curacareer/jobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://curacareer.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "curacareer-jobs",
        "title": "CuraCareer jobs",
        "version": "1.0.0",
        "websiteUrl": "https://curacareer.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Open positions for physiotherapists, occupational therapists and speech and language therapists in Germany, from https://curacareer.com. Start with search_jobs. Applications only via apply_url, which takes about a minute without a CV.",
      "tools": [
        {
          "name": "get_job",
          "title": "Get job",
          "description": "One position with its full schema.org JobPosting (description, location, employment type, employer) and the application link. Use slug from search_jobs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0ebd811f50520985598a92fb4847091a9f4eea5132ee5cc3bdeb21f2fcfe9b1c"
        },
        {
          "name": "search_jobs",
          "title": "Search jobs",
          "description": "Search open positions for physiotherapists, occupational therapists and speech and language therapists in Germany. All filters are optional and combined with AND. Returns title, employer, city, postal code, region, employment type and the links to the job page and the application (about one minute, no CV).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "employment_type": {
                "enum": ["FULL_TIME", "PART_TIME"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "City name or the first digits of a German postal code, e.g. 'Köln' or '50'",
                "type": "string"
              },
              "profession": {
                "description": "physiotherapeut = physiotherapist, ergotherapeut = occupational therapist, logopaede = speech and language therapist",
                "enum": ["physiotherapeut", "ergotherapeut", "logopaede"],
                "type": "string"
              },
              "query": {
                "description": "Words from the job title, employer or profession, German or English, e.g. 'Physiotherapeut Neurologie' or 'speech therapist'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5c41728f1499550170e9a448752d4664e64f061ee96937a760e30a831077ced6"
        }
      ],
      "digest": "sha256:f31086189051d4870d80b34e5b0603c9076b2e245b84064515f6692b5555f69c"
    }
  }
}
