      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "cautellus",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Cautellus scam detection for AI agents. scan_url and scan_message return a safe/warn/danger verdict with a 0-100 risk score — gate risky actions on it (danger: do not proceed; warn: confirm with a human). Each scan consumes one prepaid credit from the API key in the Authorization header. Keys and credit packs: https://cautellus.com/developers. get_usage is free and reports the remaining balance.",
      "tools": [
        {
          "name": "get_usage",
          "description": "Check the API key’s remaining prepaid scan credits, monthly plan usage, and credit expiry. Free — consumes no credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f7317908b4813def6db14d9db79a401736df3de8481f9e2f9c7bd734dde1cdc2"
        },
        {
          "name": "scan_message",
          "description": "Analyze a message, email, or text for scam indicators before acting on it (payment requests, verification codes, urgency pressure, impersonation). Returns a verdict (safe | warn | danger), a 0-100 risk score, a summary, and specific findings. Costs 1 scan credit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "message": {
                "description": "The full message text to analyze (up to 25,000 characters)",
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c0e3ff664285ba88ee54c6cabaa9718bfebe6cba9b61512fba8b68c05e34bd32"
        },
        {
          "name": "scan_url",
          "description": "Check a URL or domain for phishing and scam risk before visiting, clicking, or transacting with it. Returns a verdict (safe | warn | danger), a 0-100 risk score, a plain-English summary, and specific findings (brand impersonation, typosquatting, community scam reports, threat-feed hits). Costs 1 scan credit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The URL or bare domain to analyze, e.g. \"paypal-verify-login.xyz\"",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:49aa0cfb5acb99824d8350ee574192d82e4895f4eb82834f0b24b0527c854185"
        }
      ],
      "digest": "sha256:a8d9d389e7eb19a16ece7aba7199da60dd3c3a334d04083447f32df2ddfa3dda"
    }
  }
