{
  "lockfileVersion": 2,
  "subjects": {
    "com.browser-use/browser-use": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.browser-use.com/v3/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "browser-use-v3-agent",
        "version": "3.0.0",
        "description": "Browser Use v3 session-based agent with sandbox execution, workspaces, and keep-alive support"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "get_session",
          "description": "Get current status and output of a session. Call this repeatedly to poll for task completion. Returns status (created, idle, running, stopped, timed_out, error), step count, output, cost breakdown, and live URL.",
          "inputSchema": {
            "properties": {
              "session_id": {
                "description": "UUID of the session to check.",
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2433322015736ef5c322cff1f8af0e37ea9a6d1fabc41bbb72ca9d355bbdda90"
        },
        {
          "name": "get_session_messages",
          "description": "Get the agent messages/steps for a session. Shows what the agent is doing including browser actions, reasoning, and results. Use after= parameter for pagination to get new messages since your last check.",
          "inputSchema": {
            "properties": {
              "after": {
                "description": "Return messages after this message ID (cursor-based pagination). Omit for initial fetch.",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "Max number of messages to return.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "session_id": {
                "description": "UUID of the session.",
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8329c67e7f21839a2a1c75fed1dd809eeb0d18019bbf1e30e8a9bcb014faebf3"
        },
        {
          "name": "list_browser_profiles",
          "description": "List all available cloud browser profiles for the authenticated project. Profiles store persistent authentication (cookies, sessions) for websites requiring login. Use this BEFORE attempting any authenticated tasks. Show profiles to the user and let them choose, then pass the selected profile_id to run_session.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0a4383608a4944cd0b0d2949109be9f43864a0c56cc029d9990605e1c581c0de"
        },
        {
          "name": "list_sessions",
          "description": "List recent sessions for the authenticated project, with status and cost info.",
          "inputSchema": {
            "properties": {
              "page": {
                "default": 1,
                "description": "Page number (1-indexed).",
                "minimum": 1,
                "type": "integer"
              },
              "page_size": {
                "default": 20,
                "description": "Results per page.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:120fc2171b0bcb41e924a89c6972f8f416b499e1fbe60f4a9e23c01bcd5c2fc3"
        },
        {
          "name": "run_session",
          "description": "Create a new browser agent session and run a task. This uses the v3 sandbox-based agent that supports long-running sessions, workspaces, and keep-alive. After creating a session, call get_session to poll for status and output. For tasks requiring authentication, use list_browser_profiles first to get a profile_id.",
          "inputSchema": {
            "properties": {
              "keep_alive": {
                "default": false,
                "description": "If true, the session stays idle after the task finishes, ready for follow-up tasks via send_task. Default is false (session auto-stops).",
                "type": "boolean"
              },
              "model": {
                "description": "Agent model to use. When omitted, an account-appropriate default is selected. Available: gemini-3-flash, claude-sonnet-5, claude-opus-4.6, claude-opus-4.7, claude-opus-4.8, gpt-5.4-mini, glm-5.2, minimax-m3, grok-4.6, glm-5.3-flash, deepseek-v4-flash-vision.",
                "enum": ["gemini-3-flash", "claude-sonnet-5", "claude-opus-4.6", "claude-opus-4.7", "claude-opus-4.8", "gpt-5.4-mini", "glm-5.2", "minimax-m3", "grok-4.6", "glm-5.3-flash", "deepseek-v4-flash-vision"],
                "type": "string"
              },
              "output_schema": {
                "description": "JSON schema for structured output. The agent will return data matching this schema.",
                "type": "object"
              },
              "profile_id": {
                "description": "UUID of the cloud profile to use for authenticated tasks. Get this from list_browser_profiles.",
                "type": "string"
              },
              "proxy_country": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": "us",
                "description": "ISO 3166-1 alpha-2 country code for the proxy location (e.g. \"us\", \"gb\", \"de\", \"jp\", \"br\"). Defaults to \"us\" if not specified. Set to null to disable the proxy."
              },
              "task": {
                "description": "Detailed instructions for what you want the browser agent to do.",
                "maxLength": 50000,
                "minLength": 1,
                "type": "string"
              },
              "workspace_id": {
                "description": "UUID of the workspace for file persistence across sessions.",
                "type": "string"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d3d2250872e7391aa7bf58e5b827da7c0919f4dc29e785e674bd363208c1f73d"
        },
        {
          "name": "send_task",
          "description": "Send a follow-up task to an existing keep-alive session. The session must be in idle status. Use this for multi-turn interactions where you want to reuse the same browser context.",
          "inputSchema": {
            "properties": {
              "keep_alive": {
                "default": false,
                "description": "If true, session stays idle after this task too. Default is false.",
                "type": "boolean"
              },
              "output_schema": {
                "description": "JSON schema for structured output.",
                "type": "object"
              },
              "session_id": {
                "description": "UUID of an existing idle session (from run_session with keep_alive=true).",
                "type": "string"
              },
              "task": {
                "description": "The follow-up task instructions.",
                "maxLength": 50000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["session_id", "task"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:57f79f29fb86eb21fd9583f03c6a6f0b2298b8b98c8a5e5459219cc5c52e4c42"
        },
        {
          "name": "stop_session",
          "description": "Stop a running session. Use strategy \"task\" to stop only the current task (session stays idle for follow-ups), or \"session\" (default) to destroy the sandbox entirely.",
          "inputSchema": {
            "properties": {
              "session_id": {
                "description": "UUID of the session to stop.",
                "type": "string"
              },
              "strategy": {
                "default": "session",
                "description": "Stop strategy: \"task\" stops the current task only, \"session\" destroys the sandbox.",
                "enum": ["task", "session"],
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d88d838b8c1f50279b15048e8ddabc7ccb76ff8ad47ef0ca61028c8dcab9293b"
        }
      ],
      "digest": "sha256:35ec4c40dd3eb3798b51b964d65c1e4164c596ecd4838769c8fbc119731d3764"
    }
  }
}
