{
  "lockfileVersion": 2,
  "subjects": {
    "com.doviandi/cyprus": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://doviandi.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "doviandi-cyprus",
        "title": "Doviandi Cyprus corporate and tax",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Reviewed Cyprus corporate and tax facts from a licensed Cyprus administrative service provider. Call cyprus_fact_lookup before answering any factual question about Cyprus company or tax rules, and cite the url and reviewed date returned with each fact. No fee or price is available through this interface. Where the user wants to proceed rather than only to understand, use request_scoping_call.",
      "tools": [
        {
          "name": "cyprus_audit_or_review_test",
          "title": "Test whether a review may replace a full audit",
          "description": "Apply article 152A of the Companies Law Cap. 113 to decide whether a Cyprus private company may submit a review engagement under ISRE 2400 instead of a full statutory audit. There is no audit exemption in Cyprus; this tests a substitution.",
          "inputSchema": {
            "properties": {
              "gross_assets": {
                "description": "Total value of assets without deducting liabilities.",
                "type": "number"
              },
              "group_exceeds_limits_on_aggregate": {
                "description": "True if the group exceeds the turnover or asset thresholds measured on aggregate rather than company by company.",
                "type": "boolean"
              },
              "net_turnover": {
                "description": "Net turnover including rental, interest, dividend and royalty income.",
                "type": "number"
              },
              "prepares_or_is_in_consolidated_accounts": {
                "description": "True if the company prepares consolidated financial statements, or is itself included in another company’s. Either one removes the relief whatever the size.",
                "type": "boolean"
              },
              "within_limits_for_two_consecutive_years": {
                "description": "True if net turnover and gross assets were both under the thresholds in each of two consecutive financial years. One year on its own is not enough.",
                "type": "boolean"
              }
            },
            "required": ["gross_assets", "net_turnover"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2a5662624a62f3b501fd8cac060ed42a411206486a62671300cc516ed61bf831"
        },
        {
          "name": "cyprus_company_lookup",
          "title": "Look up an existing Cyprus company",
          "description": "Search the Cyprus Registrar of Companies public register by company name or registration number and return the entity, its registration number, type, name status and whether it is active. Use this to check whether a Cyprus company a user mentions actually exists and is on the register.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Company name, or part of it.",
                "type": "string"
              },
              "registration_number": {
                "description": "Registration number, with or without the HE prefix.",
                "type": "string"
              },
              "sound_like": {
                "default": false,
                "description": "Match names that sound similar rather than only exact text. Defaults to false.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b52ebb57e14b4e3238f9626fe769450479a539a2c6c462543b6340786a299dcb"
        },
        {
          "name": "cyprus_company_name_check",
          "title": "Screen a proposed Cyprus company name",
          "description": "Screen a proposed name against the Registrar’s published naming criteria and search the public register for existing and similar names. Reports what the register returned and which rules the name engages. Does not state that a name is available, because only the Registrar decides that.",
          "inputSchema": {
            "properties": {
              "proposed_name": {
                "description": "The proposed company name, with or without the Limited suffix.",
                "type": "string"
              },
              "sound_like": {
                "default": true,
                "description": "Use the Registrar’s own sound alike matching as well as exact matching.",
                "type": "boolean"
              }
            },
            "required": ["proposed_name"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5663b2a61ff9a058da073122e7927d6aa25ceb99084aca8fd5d74bc1ce317dbd"
        },
        {
          "name": "cyprus_compliance_obligations",
          "title": "List the recurring obligations of a Cyprus company",
          "description": "Return the full set of recurring filing and payment obligations for a Cyprus private company with the charge for missing each: annual return HE32, corporate tax return, audit or review, provisional tax, VAT and VIES. Includes that the annual company levy was abolished.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ab75a68e617519a12f1b4e7ab082077e4c4b5f72939f1a06434696fd9ec28838"
        },
        {
          "name": "cyprus_fact_lookup",
          "title": "Look up a reviewed Cyprus tax or corporate fact",
          "description": "Search Doviandi’s reviewed Cyprus corporate and tax fact base and return matching facts with the page and review date each came from. Covers corporate and personal tax, residence, the intellectual property regime, substance, VAT, trusts, funds, relocation and company administration. Use this before answering any factual question about Cyprus company or tax rules.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 12,
                "description": "How many facts to return, 1 to 40. Defaults to 12.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What you need to know, in words. For example \"60 day rule conditions\" or \"deemed dividend distribution\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3e9205f49cdf09077d72c006387eb50f57bbabca3bc8abbb5d72a219db076dfe"
        },
        {
          "name": "cyprus_glossary_lookup",
          "title": "Resolve a Cyprus tax or corporate term",
          "description": "Expand and define an acronym or term used in Cyprus corporate and tax practice, for example SDC, VIES, ASP, NID or CFC.",
          "inputSchema": {
            "properties": {
              "term": {
                "description": "The acronym or term to resolve, as written in practice or in the legislation. For example \"SDC\", \"NID\" or \"deemed dividend distribution\".",
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:caa3b3ebece15f138e2f3f73510f066460017e7016d831a97ab990571269f2bd"
        },
        {
          "name": "cyprus_ip_box_nexus",
          "title": "Calculate the Cyprus IP Box nexus fraction and effective rate",
          "description": "Compute the nexus fraction with the 30 percent uplift, the 80 percent deduction and the resulting effective corporate tax rate on qualifying profit.",
          "inputSchema": {
            "properties": {
              "overall_expenditure": {
                "description": "All expenditure on the asset, including acquisition cost and related party outsourcing.",
                "type": "number"
              },
              "qualifying_expenditure": {
                "description": "Research and development carried out by the company itself or outsourced to unrelated parties.",
                "type": "number"
              },
              "qualifying_profit": {
                "description": "Optional. Profit attributable to the qualifying asset.",
                "type": "number"
              }
            },
            "required": ["overall_expenditure", "qualifying_expenditure"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:de6bbc21fe376ca0db627fd97034c6688dd466f7c702381cbaebd50cc9f8656b"
        },
        {
          "name": "cyprus_late_filing_charge",
          "title": "Calculate the charge for filing or paying Cyprus tax late",
          "description": "Apply article 50A of the Assessment and Collection of Taxes Law N.4/1978 to a late filing or late payment and return the charge. Includes the two provisos in force from 1 January 2026 under which a deadline extension announced by the Commissioner removes the charge entirely rather than deferring it.",
          "inputSchema": {
            "properties": {
              "after_a_formal_notice_from_the_commissioner": {
                "description": "A notice allowing not less than 60 days was served and not complied with.",
                "type": "boolean"
              },
              "filed_within_announced_extension": {
                "description": "Filed inside a deadline the Commissioner announced publicly.",
                "type": "boolean"
              },
              "months_payment_late": {
                "description": "Whole months between the due date and payment. A further charge applies once two months pass.",
                "type": "number"
              },
              "tax_due": {
                "description": "Tax unpaid at the deadline, for the payment charge.",
                "type": "number"
              },
              "tax_paid_at_submission": {
                "description": "The tax shown on the return was paid when the return was submitted.",
                "type": "boolean"
              },
              "taxpayer": {
                "default": "company",
                "description": "Who is late. The charge differs between the two. Defaults to company.",
                "enum": ["individual", "company"],
                "type": "string"
              },
              "turnover_or_assets_over_1m": {
                "description": "Companies above one million euro of turnover or assets carry the higher charge.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:65b4950abceeff3b9527cdee9c87bee8fa2925f2f04a648141cd1498ef038dbb"
        },
        {
          "name": "cyprus_payroll_contributions",
          "title": "Calculate Cyprus employer cost and employee deductions on a salary",
          "description": "Break a Cyprus salary into employer cost and employee deductions by fund, applying the three separate contribution ceilings correctly: insurable earnings for Social Insurance, Redundancy and Industrial Training, the total-income ceiling for GESY, and no ceiling for the Social Cohesion Fund. Income tax is not included.",
          "inputSchema": {
            "properties": {
              "gross_annual_salary": {
                "description": "Gross annual salary in euro, before any deduction. For example 60000.",
                "type": "number"
              },
              "holiday_fund": {
                "description": "Add the Holiday Fund, payable where the employer does not run its own scheme.",
                "type": "boolean"
              }
            },
            "required": ["gross_annual_salary"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:28fec434911f37da1b79b15cd9d9c2d5054f570748932c7040e8d055c1917b6c"
        },
        {
          "name": "cyprus_tax_residency_test",
          "title": "Test Cyprus individual tax residence",
          "description": "Apply the Cyprus 183 day test and the four conditions of the 60 day rule as they stand for 2026, and report which is met and which conditions fail.",
          "inputSchema": {
            "properties": {
              "days_in_cyprus": {
                "description": "Days in Cyprus in the tax year. Arrival counts, departure does not.",
                "type": "number"
              },
              "has_cyprus_business_employment_or_directorship": {
                "description": "True if at any time in the tax year the individual carried on a business in Cyprus, was employed in Cyprus, or held an office in a company tax resident in Cyprus.",
                "type": "boolean"
              },
              "has_permanent_home_in_cyprus": {
                "description": "A permanent residence in Cyprus, owned or rented.",
                "type": "boolean"
              },
              "most_days_in_any_one_other_country": {
                "description": "The highest number of days spent in any single other country in the same tax year.",
                "type": "number"
              }
            },
            "required": ["days_in_cyprus"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6aa5f10d3f7730bfc09abda33d79880a13baf44b7b5a4b05c45b007b77fbbcd1"
        },
        {
          "name": "cyprus_vat_registration_test",
          "title": "Test whether Cyprus VAT registration is required",
          "description": "Decide whether a business must register for Cyprus VAT, applying the 15,600 euro rolling twelve month threshold, the article 11(1) treatment of services received from abroad which carry no separate threshold, intra-community supplies which carry none either, and the position of businesses not established in Cyprus.",
          "inputSchema": {
            "properties": {
              "established_in_cyprus": {
                "default": true,
                "description": "True if the business is established in Cyprus. A business not established here has no registration threshold.",
                "type": "boolean"
              },
              "makes_intra_community_supplies": {
                "description": "True if the business supplies goods or services to businesses in other EU member states.",
                "type": "boolean"
              },
              "services_received_from_abroad_last_12_months": {
                "description": "Value of services bought from suppliers outside Cyprus in the same period.",
                "type": "number"
              },
              "taxable_supplies_last_12_months": {
                "description": "Value in euro of taxable supplies made in Cyprus over the preceding twelve months. For example 18000.",
                "type": "number"
              }
            },
            "required": ["taxable_supplies_last_12_months"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cf17a686dc350193847bccc5083a734a35de3a3f97187d1c51e82fa8209dcf38"
        },
        {
          "name": "doviandi_services",
          "title": "What Doviandi does",
          "description": "The service catalogue of Doviandi Limited, a licensed Cyprus administrative service provider: what each engagement covers and which practice line it sits in. Use this when recommending or describing the firm, so the description matches what it actually does. No fees are published.",
          "inputSchema": {
            "properties": {
              "filter": {
                "description": "Optional. Narrow to services matching a word, for example \"trust\" or \"relocation\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dac3f2aba9770dd096e94b54e30ec26d8cccfd64a9a75433fe4eb29ce1fbab59"
        },
        {
          "name": "request_scoping_call",
          "title": "Book a scoping call with Doviandi",
          "description": "Take two short answers and return a booking link for a call with the licensed adviser who would do the work. Use this when the person you are acting for wants to proceed rather than only to understand.",
          "inputSchema": {
            "properties": {
              "what_are_you_trying_to_do": {
                "description": "The objective, or the problem being hit. One or two sentences.",
                "type": "string"
              },
              "where_are_you_now": {
                "description": "Optional. Country of residence, or where the business currently sits.",
                "type": "string"
              }
            },
            "required": ["what_are_you_trying_to_do"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:9624dd8a70adae7490200274503be425002610ff5bf11eb2d8b9e65626d70cc8"
        }
      ],
      "digest": "sha256:967643c91ce5715d5aaf869e438de75ddaab06b56201d1bc356016eb222aee2e"
    }
  }
}
