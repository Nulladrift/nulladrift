{
  "lockfileVersion": 2,
  "subjects": {
    "com.pixilui/pixilui": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.pixilui.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "pixilui",
        "title": "PixilUI components",
        "version": "0.1.0",
        "websiteUrl": "https://pixilui.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "PixilUI is a library of designed React components for AI product UI (approval cards, run timelines, streaming text, tool call rows, dialogs and the controls around them), installed as source with the shadcn CLI.\n\nHow to use this server:\n1. Search before writing UI. When the task needs a component, call search_items with what the UI has to do (\"ask the user before the agent sends an email\", \"show a model's answer as it streams\"). Use list_items to browse.\n2. Read before using. Call get_item for the item you pick and follow its whenToUse, whenNotToUse, props, keyboard and aiNotes. Do not guess props.\n3. Install with the CLI. Call get_install_command with every slug you need and run the command it returns; add the registries snippet to components.json once. Use get_source only when the project cannot run the shadcn CLI.\n4. Pro items need the user logged in (connect the /mcp/pro URL; the client opens the browser) or a Pro access token sent as \"Authorization: Bearer <token>\". Without either you get the meta but not the source. Never reconstruct, imitate or rewrite a Pro item from its description, props or screenshots. Offer the free alternative the tool suggests, or point the user to the pricing page.\n5. Installed items read the PixilUI foundation (semantic tokens such as bg-surface, text-secondary, rounded-control and the motion presets). Keep using those utilities when you edit or extend them. The foundation carries design styles (quiet, the default, and lively), set once with data-style=\"<name>\" on <html>; get_item lists them. Keep one style per app and let it draw lines, shadows and corners (elevation-raised, edge-control, border-divider), never border-border, shadow-md or rounded-lg.\n6. What this server records, if the user asks: each time it hands over an item (get_install_command, get_source, or get_item with Pro source) it stores the item slug, its tier, the source \"mcp\" and the time, plus the token id and the user id when the request is logged in or sends a token. A client that connects with the browser login also counts one connection event (user id and whether they hold Pro, no IP address). When a request sends an access token, it also keeps a one-way hash of the IP address for that token and day (deleted after 30 days) to spot a leaked token; never the address itself. Nothing else: no prompts, search queries, project names or file paths. Cloudflare, which hosts the server, keeps standard request logs. There is no switch to turn it off; connecting without a login or token keeps the record anonymous.",
      "tools": [
        {
          "name": "get_install_command",
          "title": "Install command",
          "description": "One shadcn CLI command that installs every listed item into the project, plus the components.json registries snippet to add once. Pro items also need the PIXILUI_TOKEN environment variable.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slugs": {
                "description": "Item slugs, for example [\"approval-card\", \"run-timeline\"].",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:342b655c7ef81c7af886f3720bb237e38395c30a077e2a7f1215ffc1d5aad139"
        },
        {
          "name": "get_item",
          "title": "Read a component",
          "description": "Everything needed to use one item: when to use it and when not, the props table, keyboard, accessibility, motion, files, npm dependencies and the install command. Free items include their source. Pro items include source only when a valid Pro token is sent.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "includeSource": {
                "description": "Include the source files when allowed. Default true.",
                "type": "boolean"
              },
              "slug": {
                "description": "Item slug from search_items or list_items, for example approval-card.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:26ffa3624a57b7a0aec8eea9851d1df5990d004d3568ab3a5d02d9cc9ba15003"
        },
        {
          "name": "get_skill",
          "title": "Agent skill",
          "description": "The PixilUI skill for coding agents: SKILL.md and its rule files (design, motion, copy, accessibility, composition, responsive, checklist, components by job, a worked example). Call without a file for SKILL.md and the file list, or with a file name for one file.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "file": {
                "description": "A file from the index, for example SKILL.md.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d7d46e32d5e535fcf64ef28cc2a70aa11505bd4e6239b67710d577ee42cb67e6"
        },
        {
          "name": "get_source",
          "title": "Raw source",
          "description": "The raw files of one item with their install paths, for projects that cannot run the shadcn CLI. Prefer get_install_command. Pro items need a valid Pro token. shape \"standalone\" returns one self-contained .tsx instead (free components): it needs only react and motion, no Tailwind and no other items.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "shape": {
                "description": "install (default): the registry files and their paths. standalone: one file with its styles and helpers inlined.",
                "enum": ["install", "standalone"],
                "type": "string"
              },
              "slug": {
                "description": "Item slug, for example tool-call-row.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1d11879029418ecd49cbbc8af1f8d5b36bd67ad9856d94eb699321af4189f5fc"
        },
        {
          "name": "list_items",
          "title": "List components",
          "description": "Browse every PixilUI item, optionally filtered by category or tier. Returns slug, title, kind, category, tier and a one-line description.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "For example ai, overlays, inputs, actions, layout.",
                "type": "string"
              },
              "tier": {
                "description": "free or pro.",
                "enum": ["free", "pro"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c909b0db4cf163b4eb08ec22a7e147bf113dc4fe1665196ad8a2bdf4fbf7e3c6"
        },
        {
          "name": "search_items",
          "title": "Search components",
          "description": "Find PixilUI items for a UI job. Describe what the interface has to do in plain words (\"ask before the agent sends\", \"show tool calls with their output\", \"modal to confirm a delete\"). Searches titles, descriptions, when-to-use notes and tags and returns the best matches first. Call this before writing any UI by hand.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Filter by category, for example ai, overlays, inputs, actions.",
                "type": "string"
              },
              "limit": {
                "description": "Maximum results, default 8.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the UI has to do, or the name of a component.",
                "minLength": 1,
                "type": "string"
              },
              "tier": {
                "description": "free or pro.",
                "enum": ["free", "pro"],
                "type": "string"
              },
              "type": {
                "description": "Filter by kind: foundation, component, pattern, block, screen or template.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:420427cf50c9aee4cab3b5bf271509ccb36597ec4e8475bb5ac40edcfa4f1e5f"
        }
      ],
      "digest": "sha256:dd02bc00d6faf2ec9f9b027b7972d4de14a175f05333cd859c561921a281ea49"
    }
