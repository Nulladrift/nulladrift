          "name": "reservation_book",
          "title": "reservation.book",
          "description": "[需要登录] 体检预约：已有体检人时传 planId、hospitalCode、vendorid、appointmentDate、contactId，不传 customerName、customerID、customerMobile；没有 contactId 时根据返回的 contacts 选择或新建体检人。支持 elicitation form 的客户端返回 contactChoice，不支持表单时返回 data.contacts 或 contactRequired。收到 contactRequired 后按字段逐项询问，每次只问一项，用户确认后把字段、contactDraftId 和 consent=true 一起传回。证件号可能被客户端记录，提交后不要复述或回显，只引用 contactId。H5 方式返回 contactEntryUrl，用户添加体检人后重新调用。体检项目只来自 planId，客户端不提交项目。预约前通过 input_required 展示协议；非表单客户端返回 consentRequired，用户确认后把确认话术原文作为 consentText 传入。返回 caution 时补充展示。返回 contactId、serviceid 和 orderEntryUrl；需要支付时返回 payUrl。payUrl 有效期为 30 分钟。status 表示支付状态，预约状态以 rsvStatus 为准。失败后不要自动重试。按 message/msg、data、subCode 的明确提示执行；只有 401、会话失效或明确可重试时才重试一次。\n\n鉴权：需要用户登录令牌，或已经绑定用户的云市场实例凭证。未登录调用返回 401；云市场实例未绑定用户时返回 code=40003 和 data.bindUrl。",
