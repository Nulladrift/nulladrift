      "instructions": "# 好啦体检服务（haola-pe）MCP 使用指南\n\n## 授权（先读这一节）\n\n本服务使用 OAuth 2.1 + PKCE。未授权时 tools/call 返回 HTTP 401，响应头带：\n  WWW-Authenticate: Bearer resource_metadata=\"<resource_metadata 地址>\"\n\n收到 401 后按顺序执行，不要跳过：\n1. GET 上面的 resource_metadata，取 authorization_servers[0]\n2. GET <issuer>/.well-known/oauth-authorization-server，取 authorization_endpoint、token_endpoint、registration_endpoint\n3. POST registration_endpoint 做动态客户端注册：redirect_uris=[\"http://127.0.0.1:<port>/callback\"]、token_endpoint_auth_method=\"none\"、grant_types=[\"authorization_code\",\"refresh_token\"]\n4. 生成 code_verifier 与 code_challenge(S256)，拼 authorize URL，把链接直接发给用户并请其登录授权\n5. 在 127.0.0.1:<port> 监听 /callback 收 code；POST token_endpoint 换 access_token\n6. 带 Authorization: Bearer <token> 重试原调用\n\n禁止行为：\n- 不要向用户索要 token —— 用户没有 token，token 由第 3–5 步产生\n- 不要把 401 当作\"接口不可用\"\"服务异常\"或\"功能未开通\"\n- 不要在宿主不支持 OAuth 时放弃：宿主只支持静态 header 时，用 HTTP 客户端（curl 等）手工执行 1–5，再把 token 放进请求头\n\n## 多步推理\n- 不确定参数与取值时，先用 help 查看工具入参说明，再调用业务工具。\n- 甲方归属使用当前登录身份，不要自行填写甲方 ID。\n- 品牌名→短码用 vendor_brands 查询，不要拼造。\n- 选机构时先看 vendor_brands 返回的 type：chain 是连锁品牌，hospital 是医院主体；两类都要调用 vendor_list 获取具体 hospitalCode，不能直接拿 vendorid 预约。\n- 宽接口 + filter：同一工具用不同过滤条件覆盖多种查询，不要把可用过滤当成缺失端点。\n\n## 体检套餐设计与预约流程\n- 个人套餐设计用 vendor_items：按 vendorId 和 population 查 items 和 rules；population 取 man=男性、girl=未婚女性、lady=已婚女性；返回当前人群适用的项目，以及必选、捆绑、互斥和替代关系。\n- 选好项目后调用 plan_create：传 vendorId、项目 ids 数组 itemIds、gender 和 marital，可选传 name、summary；女性必须传 marital（married/unmarried），男性可不传。返回 planId、vendorId，能查到注意事项时同时返回 caution。校验失败时按返回的 issues 修改 itemIds 后重试。\n- caution.cautions[].duration 使用 startDaysBeforeExam 和 endDaysBeforeExam 表示体检前天数，0 表示体检当天；description 可直接展示。没有 duration 表示没有日期限制。空条目不会返回；checkItems[].cautionids 与 cautions[].id 用于关联项目与注意事项。\n- 个人体检预约顺序：plan_create → 展示 caution 并确认用户已知晓 → 用户确认协议 → reservation_book。\n- plan_create 返回 caution 时，必须在调用 reservation_book 之前向用户展示与本次项目相关的注意事项，按 duration 从早到晚动态组织时间线展示。不要套固定天数分组，也不要直接贴全文；重点提示空腹、停药、禁忌时间窗。孕期、备孕、月经期这类禁忌单独强调，因为它们会直接影响项目能不能做。\n- reservation_book 返回 caution 时，如果预约前尚未展示过，需要补充展示。这是兜底，不能替代预约前的展示。\n- 预约只传 planId 和预约信息，不提交体检项目；体检件随预约结果下发。\n- 预约参数：已有体检人时传 planId、hospitalCode、vendorid、appointmentDate、contactId，不传 customerName、customerID、customerMobile；没有 contactId 时传 planId、hospitalCode、vendorid、appointmentDate，再根据返回的 contacts 选择或新建体检人。reservation_book 返回体检人信息不完整错误时，调用 contact_update 补齐后重试。\n- 客户端不支持 elicitation form 时，reservation_book 同时返回 contactMethodRequired、contacts 和 contactEntryUrl。contacts 是当前用户的常用体检人列表；让用户选择已有体检人、在对话中填写，或直接打开 contactEntryUrl，不要强制跳转 H5。选择已有体检人后把对应 contactid 作为 contactId 传回；选择对话填写后带 contactMethod:\"conversation\" 重新调用。\n- 用户选择在对话中填写时，reservation_book 返回 contactRequired、待填字段和 contactDraftId。按字段逐项询问，每次只问一项，用户确认后把各字段、contactDraftId 和 consent=true 一起传回。证件号会出现在当前对话中，可能被客户端记录；该隐私提示只提示一次，提交后不复述、不回显证件号，只引用 contactId。\n- 用户选择 H5 时，直接打开已返回的 contactEntryUrl。用户添加体检人后重新调用 reservation_book，读取返回的 data.contacts 选择本次体检人并传 contactId。\n- 不要主动要求用户发送身份证号；用户已选择在对话中填写时，可以继续询问证件号。\n- 客户端不支持 elicitation form 时，协议确认返回 consentRequired 和协议正文，用户确认后带 consentText 重新调用。\n\n## reservation_book 失败处理\n- reservation_book 返回非成功结果时，禁止自动重试，禁止用相同参数反复调用。\n- 先读取 message/msg、data、subCode，按服务端返回的信息执行。\n- 返回 contactRequired、contactMethodRequired、consentRequired 等交互要求时，进入对应流程，不要当作失败重试。\n- 返回业务失败、权限失败、门店限制、项目限制、重复预约时，直接向用户展示失败信息并停止。\n- 只有收到 401 授权挑战、会话失效，或工具明确标注可重试时，才允许处理授权或重建会话后重试原调用一次。\n- 超时或连接断开造成结果未知时，不要直接重试预约，先提示用户本次预约状态未知。\n\n## 联系人健康档案\n- 仅设计套餐时，不因套餐需求创建联系人或保存健康画像。\n- 用户明确要求保存长期画像时：本人不传 contactid；家人先 contact_list({relation,gender})，唯一候选使用其 contactid，多个候选请用户选择。\n- 家人无候选且用户明确要求保存时，可 contact_create({relation,gender}) 创建临时联系人，姓名、手机号、证件号后补；创建后重新 contact_list 获取 contactid。\n- 用户纠正以前误写到本人档案的家人信息时，调用 contact_profile_correct。只删除时 source 不传 contactid，entries 指定记录和匹配条件；迁移到家人时同时传 targetContactid。\n- 严禁把家人信息写入本人档案。\n\n## 长耗时任务（重要）\n- 方案/报价、报告解读等可能是长耗时操作：先调提交类工具拿到立即返回的提交标志，不要阻塞等待。\n- 每完成一个阶段调用 progress_report，向用户推送可读进度（如「方案生成中，约 1 分钟」）。\n- 期间用查询类工具轮询，拿到最终结果后再回复用户。\n\n## 红线\n- 绝不编造订单/体检记录等数据，必须先调真实工具获取。\n- 甲方（partner UUID）与乙方（vendor 短码，如 health100/ruici）不可混用。",
