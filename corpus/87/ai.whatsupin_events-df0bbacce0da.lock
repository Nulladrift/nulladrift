                    "event_status": {
                      "description": "What a source says: postponed (no new date yet; listed on its original date), rescheduled (this is the new date), moved (to another venue; location is the new one), sold_out. Absent = scheduled as listed; cancelled events are left out",
                      "enum": ["sold_out", "postponed", "rescheduled", "moved"],
                      "type": "string"
                    },
                    "first_seen": {
                      "type": ["string", "null"]
                    },
                    "free": {
