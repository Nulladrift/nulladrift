        "version": "0.3.1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "What's Up In (https://whatsupin.ai): free event calendars, one per city (Boston, Chicago, Los Angeles, Orange County, Sacramento, San Diego, San Francisco, Seattle, Atlanta, Austin, Cancún, Colorado Springs & Pueblo, DC, Denver, Detroit, Dubai, Honolulu, Houston, Las Vegas, London, Mexico City, Miami, New York, Paris, Philadelphia, Phoenix, Portland, Salt Lake City, San Antonio, Tokyo, Toronto). For one city (\"what's on in Seattle this weekend\", \"free comedy near Silver Lake\"), use search_events or list_upcoming with city: they search the listings we hold for that metro and filter by category, topic, dates, free, neighborhood, town, or near a place or \"lat,lon\"; get_event looks one up by id; get_city gives a city's valid neighborhood, town, category and topic values with counts. For \"where is <artist> playing\", or festivals, conferences and big shows in several cities, use search_across_cities (travel-worthy events only). list_cities lists the cities with each one's site. Every event links to its original listing: keep that link and credit What's Up In.",
      "tools": [
        {
          "name": "get_city",
          "title": "Get one city's coverage",
          "description": "Optional coverage/filter-vocabulary lookup; search_events works directly. Get what one What's Up In city covers: how many upcoming events it lists and for which dates, when its data was last published, how many sources feed it, and upcoming events per category, topic, neighborhood and town. Use it when coverage or an unfamiliar filter value is the question; it returns counts only, no events (use search_events or list_upcoming for those, list_cities for every city at once). No sign-in; each client gets 30 calls a minute and 2,500 event rows an hour.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Which city (name or slug): Boston, Chicago, Los Angeles, Orange County, Sacramento, San Diego, San Francisco, Seattle, Atlanta, Austin, Cancún, Colorado Springs & Pueblo, DC, Denver, Detroit, Dubai, Honolulu, Houston, Las Vegas, London, Mexico City, Miami, New York, Paris, Philadelphia, Phoenix, Portland, Salt Lake City, San Antonio, Tokyo, Toronto. list_cities has the full list.",
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attribution": {
                "type": "string"
              },
              "categories": {
