                      "description": "kids, teens or seniors when the event is only for them",
                      "type": ["string", "null"]
                    },
                    "biz_formats": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "categories": {
                      "items": {
