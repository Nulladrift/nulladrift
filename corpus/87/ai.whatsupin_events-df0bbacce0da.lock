                      "type": ["string", "null"]
                    },
                    "location": {
                      "type": ["string", "null"]
                    },
                    "neighborhood": {
                      "type": ["string", "null"]
                    },
                    "new_host": {
                      "description": "True when the event's organizer, group or promoter first appeared in our listings within the last two weeks; a plain discovery marker, not a quality signal. Absent otherwise",
                      "type": "boolean"
                    },
                    "performers": {
                      "items": {
