        {
          "name": "get_event",
          "title": "Get one event",
          "description": "Get the full listing for one upcoming event by the `id` that search_events or list_upcoming returned, passing the same `city` it came from: title, dates, venue, price (all-in, or \"See tickets\"), the original listing (`link`), every source that lists it and first_seen / last_seen / last_fetched dates. Ids stay the same while an event is listed; a past or removed event returns an error, so search again. (search_across_cities results carry `on_site` links instead.) No sign-in; each client gets 30 calls a minute and 2,500 event rows an hour.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Which city (name or slug): Boston, Chicago, Los Angeles, Orange County, Sacramento, San Diego, San Francisco, Seattle, Atlanta, Austin, Cancún, Colorado Springs & Pueblo, DC, Denver, Detroit, Dubai, Honolulu, Houston, Las Vegas, London, Mexico City, Miami, New York, Paris, Philadelphia, Phoenix, Portland, Salt Lake City, San Antonio, Tokyo, Toronto. list_cities has the full list.",
                "type": "string"
              },
              "id": {
                "description": "12-character event id",
                "type": "string"
              }
            },
            "required": ["city", "id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attribution": {
                "type": "string"
              },
              "city": {
                "type": "string"
              },
              "coverage": {
                "description": "Coverage and accuracy page",
                "type": ["string", "null"]
              },
              "data_generated": {
                "description": "When this city's data was last published",
                "type": ["string", "null"]
              },
              "event": {
                "properties": {
                  "audience": {
                    "description": "kids, teens or seniors when the event is only for them",
                    "type": ["string", "null"]
                  },
                  "biz_formats": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "categories": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "changed": {
                    "description": "When we last saw the title, date or time, venue, link, price or status change (local ISO time); the first-seen day for older events",
                    "type": ["string", "null"]
                  },
                  "checked_live": {
                    "description": "When we last opened the original listing and found it still matches (time, venue, not cancelled); local ISO time. Absent = not checked in the last two days",
                    "type": ["string", "null"]
                  },
                  "city": {
                    "description": "Town or city within the metro",
                    "type": ["string", "null"]
                  },
                  "date": {
                    "description": "Local start date, YYYY-MM-DD",
                    "type": "string"
                  },
                  "distance_km": {
                    "description": "With near: distance from the place",
                    "type": "number"
                  },
                  "end": {
                    "type": ["string", "null"]
                  },
                  "event_status": {
                    "description": "What a source says: postponed (no new date yet; listed on its original date), rescheduled (this is the new date), moved (to another venue; location is the new one), sold_out. Absent = scheduled as listed; cancelled events are left out",
                    "enum": ["sold_out", "postponed", "rescheduled", "moved"],
                    "type": "string"
                  },
                  "first_seen": {
                    "type": ["string", "null"]
                  },
                  "free": {
                    "type": "boolean"
                  },
                  "id": {
                    "description": "Stable 12-character id; pass it to get_event",
                    "type": "string"
                  },
                  "last_fetched": {
                    "type": ["string", "null"]
                  },
                  "last_seen": {
                    "type": ["string", "null"]
                  },
                  "link": {
                    "description": "The original listing; keep it and credit What's Up In",
                    "type": ["string", "null"]
                  },
                  "location": {
                    "type": ["string", "null"]
                  },
                  "neighborhood": {
                    "type": ["string", "null"]
                  },
                  "new_host": {
                    "description": "True when the event's organizer, group or promoter first appeared in our listings within the last two weeks; a plain discovery marker, not a quality signal. Absent otherwise",
                    "type": "boolean"
                  },
                  "performers": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "possibly_free": {
                    "type": "boolean"
                  },
                  "posted_by_sources": {
                    "type": "number"
                  },
                  "price": {
                    "description": "All-in price as the source states it, \"Free\", or \"See tickets\" when the source doesn't state the all-in total",
                    "type": ["string", "null"]
                  },
                  "recurring": {
                    "description": "weekly, biweekly or monthly when the event is one date of a series",
                    "type": ["string", "null"]
                  },
                  "region": {
                    "type": ["string", "null"]
                  },
                  "rv": {
                    "type": ["string", "null"]
                  },
                  "sectors": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "sold_out": {
                    "type": "boolean"
                  },
                  "sources": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "start": {
                    "description": "Local start, ISO 8601, when the source gives a time",
                    "type": ["string", "null"]
                  },
                  "status_note": {
                    "description": "The source's own wording of event_status, e.g. \"Moved to The Warfield\"",
                    "type": "string"
                  },
                  "title": {
                    "type": "string"
                  },
                  "topics": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "venue_status": {
                    "description": "Present only when location is empty, and says why (we never guess a venue): rsvp = the address is shared after RSVP/registration; tba = the venue isn't decided; hidden = the source shows the venue to its members only (Meetup stubs; /mcp leaves these out, so you won't see it here); title = the title names the place; text = the description names a place; unset = the host left it blank. Open the link for the venue",
                    "enum": ["rsvp", "tba", "hidden", "title", "text", "unset"],
                    "type": "string"
                  }
                },
                "required": ["date", "id", "title"],
                "type": "object"
              },
              "site": {
                "type": "string"
              }
            },
            "required": ["city", "event"],
            "type": "object"
