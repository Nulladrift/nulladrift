                    },
                    "changed": {
                      "description": "When we last saw the title, date or time, venue, link, price or status change (local ISO time); the first-seen day for older events",
                      "type": ["string", "null"]
                    },
                    "checked_live": {
                      "description": "When we last opened the original listing and found it still matches (time, venue, not cancelled); local ISO time. Absent = not checked in the last two days",
                      "type": ["string", "null"]
