              "limit": {
                "description": "Default 50",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "near": {
                "description": "\"lat,lon\": only events within radius_km of it, with distance_km. (search_events also takes place names.) Unmapped venues are left out (place.unplaced_events).",
                "type": "string"
