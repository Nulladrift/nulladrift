        {
          "name": "search_events",
          "title": "Search events in one city",
          "description": "Search every upcoming event in one What's Up In city by words, dates, price, topic or place: music, dance, AI/tech, arts, comedy, food, sports, classes, volunteering, street fairs. Use it whenever the question has search words, a date range (\"this weekend\": from/to), free-only, a town or an area; for a day-by-day overview of the next few days with no search words use list_upcoming, and for an artist, festival or conference in several cities use search_across_cities. Words in `query` match the title, venue, performers, organizer or tags at the start of a word, singular or plural, with common synonyms; by default all must match, with match \"any\" (or | / commas between them) any one does; a misspelled word is read as the closest word the events use, and `search` in the result says how the query was read. Dates are the city's local dates. Keyword results come earliest first; semantic results are ranked by meaning when the selected city supports semantic search. At most `limit` events are returned; `count` says how many matched in total, so narrow the search rather than paging. Each event has its original listing (`link`) and an `id` for get_event. No sign-in; each client gets 30 calls a minute and 2,500 event rows an hour.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Scored category",
                "enum": ["ai", "dance", "dating", "entertainment", "exercise", "music", "volunteer"],
                "type": "string"
              },
              "changed_since": {
                "description": "Only events added or changed (title, date or time, venue, link, price, sold out, status) at or after this moment: YYYY-MM-DD (the city's local date) or an ISO date-time. To follow up later, pass the previous result's changes.synced_at; changes.removed then lists events taken down since.",
                "type": "string"
              },
              "city": {
                "description": "Which city (name or slug): Boston, Chicago, Los Angeles, Orange County, Sacramento, San Diego, San Francisco, Seattle, Atlanta, Austin, Cancún, Colorado Springs & Pueblo, DC, Denver, Detroit, Dubai, Honolulu, Houston, Las Vegas, London, Mexico City, Miami, New York, Paris, Philadelphia, Phoenix, Portland, Salt Lake City, San Antonio, Tokyo, Toronto. list_cities has the full list.",
                "type": "string"
              },
              "free": {
                "description": "Only free events",
                "type": "boolean"
              },
              "from": {
                "description": "Earliest date, YYYY-MM-DD (default: today)",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 25)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "match": {
                "description": "all (default): every word must match; any: at least one word or |-separated phrase does; semantic: match query meaning when the selected city has semantic search enabled. Requires query; an unsupported city returns a clear error without changing modes.",
                "enum": ["all", "any", "semantic"],
                "type": "string"
              },
              "near": {
                "description": "Events within radius_km of a place in the city: a neighborhood, a town, a venue name, or \"lat,lon\". Results get distance_km, nearest first within each day.",
                "type": "string"
              },
              "neighborhood": {
                "description": "Only events in this neighborhood or town of the city, e.g. 'Capitol Hill', 'Silver Lake', 'Cambridge'. Events whose venue isn't mapped can't be placed and are left out (place.unplaced_events counts them).",
                "type": "string"
              },
              "query": {
                "description": "Free text, e.g. 'salsa', 'hackathon', 'street fair', an artist or venue. Alternatives: 'salsa | bachata'; a phrase: quotes. A neighborhood or town after 'in'/'near' becomes the place filter.",
                "type": "string"
              },
              "radius_km": {
                "description": "Distance for near (default 1.5, max 50), or how far neighborhood reaches past its boundary (default 0)",
                "type": "number"
              },
              "to": {
                "description": "Latest date, YYYY-MM-DD (default: none)",
                "type": "string"
              },
              "topic": {
                "description": "Topic, e.g. comedy, film, food_drink, sports, talks, classes, markets, outdoors",
                "enum": ["arts", "books", "civic", "classes", "comedy", "community", "conferences", "culture", "faith", "family", "film", "food_drink", "games", "markets", "networking", "nightlife", "nonprofit", "outdoors", "science", "sports", "startup", "talks", "theater", "wellness", "wine", "business", "ai", "tech", "service_orgs"],
                "type": "string"
              },
              "town": {
                "description": "Only events in this town or city within the metro, e.g. 'Oakland', 'Pasadena' (case-insensitive)",
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attribution": {
                "type": "string"
              },
              "briefing_url": {
                "description": "The dated weekly briefing for this week or next (counts plus picks per kind of event, #lane when the filters match one); null further out. Cite it for \"what's on this week\"",
                "type": ["string", "null"]
              },
              "changes": {
                "description": "Only with changed_since",
                "properties": {
                  "note": {
                    "type": ["string", "null"]
                  },
                  "removed": {
                    "description": "Upcoming events taken down (cancelled, delisted or merged into another listing) since `since`, newest first, last two weeks at most",
                    "items": {
                      "properties": {
                        "date": {
                          "type": ["string", "null"]
                        },
                        "id": {
                          "type": "string"
                        },
                        "removed": {
                          "type": "string"
                        },
                        "title": {
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["id", "removed"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "removed_count": {
                    "description": "Total removals when more than are listed",
                    "type": "number"
                  },
                  "since": {
                    "type": "string"
                  },
                  "synced_at": {
                    "description": "Pass this as changed_since next time to get only what changed after this answer",
                    "type": ["string", "null"]
                  },
                  "tracked_since": {
                    "description": "When change tracking started for this city",
                    "type": ["string", "null"]
                  }
                },
                "required": ["removed", "since"],
                "type": "object"
              },
              "city": {
                "type": "string"
              },
              "count": {
                "description": "Events that matched in total",
                "type": "number"
              },
              "coverage": {
