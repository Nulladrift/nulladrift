        {
          "name": "enviar_ao_bot",
          "title": "Enviar ao bot",
          "description": "Envia pedido ou encaminha resposta de outro bot. Pode consumir crédito. Exige chave da conta ou organização e conexão autorizada pelo administrador em Bots. Retenção segue a escolha do espaço. Chave da conta ou organização, com conexão externa autorizada em Bots. Responde 202 com a tarefa em andamento. A inferência usa a política, os limites e o crédito da organização. Até 1.024 tokens de saída, 150 segundos e uma tarefa por organização. Erro da inferência aparece em tarefa.erro. O id evita nova execução enquanto a mensagem estiver no histórico; não há retry automático.",
