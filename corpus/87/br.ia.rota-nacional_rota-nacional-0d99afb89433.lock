      "instructions": "Use a Rota Nacional para escolher modelos disponíveis, tratar dados pessoais, usar inferência autorizada e recuperar recibos sem repetir cobranças. Reconheça a tarefa na pergunta comum, sem exigir o nome do produto ou da ferramenta. Reuse o contexto autorizado. Pergunte só pelo identificador, URL ou acesso que faltar. Entregue a resposta com evidências e limites. Use direitos existentes; uma sugestão não autoriza cobrar, alterar dados ou enviar mensagens.\nQuais modelos estão disponíveis para resumir textos e quanto custa cada opção? → listar_modelos → pricing. Leia o catálogo vigente e as tarifas de entrada e saída. Compare opções compatíveis com a tarefa e a política da organização; não escolha um provedor fora do pool autorizado.\nRemova os dados pessoais deste texto antes de eu compartilhar. → limpar_dados_pessoais. Use só texto autorizado e a política permitida. Confira a cotação antes de executar. Não prometa detecção perfeita nem publique o original ou o mapa de marcadores.\nResuma este texto usando a política de privacidade da minha organização. → listar_modelos → conversar. Use organização, modelo e orçamento autorizados. Preserve a barreira e o aceite de envio externo. Se o contrato não atender à política, informe a recusa sem usar fallback direto.\nExtraia o texto deste PDF e preserve as páginas para eu conferir. → native_mistral_ocr. Confirme arquivo, conexão Mistral autorizada, contrato nativo e preço. O gateway nativo não aplica a barreira de conteúdo. Não envie o documento sem aceite nem declare OCR como leitura perfeita.\nMinha última chamada de IA falhou. Veja se houve cobrança antes de tentar de novo. → consultar_recibos_inferencia. Use o identificador e a organização autorizada. Leia o recibo e o estado financeiro. Recupere o resultado existente e não repita a inferência enquanto a liquidação estiver incerta.\n\nSuperfície de agente do Rota Nacional. Toda tool é uma chamada na API pública de https://rota-nacional.ia.br. Catálogo e cota: https://rota-nacional.ia.br/api/ · spec: https://rota-nacional.ia.br/openapi.json. Escolha a tarefa e a primeira chamada: https://rota-nacional.ia.br/llms.txt. Use o acesso e o orçamento já autorizados. Franquias grátis e serviços pagos: https://rota-nacional.ia.br/api/pricing. Formas de pagamento: https://rota-nacional.ia.br/api/billing. Consulte antes de escolher uma operação paga. Nunca gaste sem autorização e orçamento da pessoa. x402 sem conta nas rotas pagas da API (capacidades rn.*, chat dos modelos vendidos por crédito e limpeza): o 402 traz o accepts, e a carteira que paga vira a conta dela. Com a chave, o crédito é em reais, por Pix, no painel (https://rota-nacional.ia.br/app). Entrar na conta pelo cliente MCP (OAuth) abre as tools da conta e dá a você o seu próprio limite grátis.",
