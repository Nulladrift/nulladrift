        {
          "name": "consultar_recibos_inferencia",
          "title": "Consultar recibos inferencia",
          "description": "Consulta os recibos de inferência do pagador autenticado. Não faz inferência nem altera saldo. Use id para um recibo ou cursor para continuar a lista. Mostra reserva, débito, devolução e estado; não revela conteúdo ou preços de terceiros. Exige credencial válida e a política de rede da conta. A recuperação permanece disponível durante suspensão de uso. Estados: reserved, dispatched, pending, settled e cancelled. A leitura não revela preços de outras camadas. POST reconcile usa apenas os contadores do provedor já registrados para esse pedido. POST cancel_reserved devolve somente uma reserva que ainda não foi marcada como enviada, sob bloqueio transacional. Não aceita tokens nem valores financeiros informados pelo cliente.",
          "inputSchema": {
