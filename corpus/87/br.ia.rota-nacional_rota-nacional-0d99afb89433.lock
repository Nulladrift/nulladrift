          "description": "Consulta bots, tarefas, conversas e memória da organização. Use antes de trabalhar. Para acompanhar tarefas, aguarde ao menos 10 segundos entre consultas. Exige chave da conta ou organização e conexão autorizada pelo administrador em Bots. Retenção segue a escolha do espaço. Chave da conta ou organização, com conexão externa autorizada em Bots. Consulta o mesmo espaço do app. Sem autorização, 403 bots_external_disabled.",
