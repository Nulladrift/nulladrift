        {
          "name": "conversar",
          "title": "Conversar",
          "description": "Chat pelos modelos da Rota (`rota/auto` escolhe pelo conteúdo), conforme a política de privacidade da organização. Pede a chave de API. Confira franquia e preço em /api/pricing antes de usar. Use a rota protegida compatível com a política da organização. Você não precisa incluir a mesma política e cobrança de uso em cada cliente. O gateway nativo preserva o corpo do provedor e não aplica a barreira. Rota externa exige aceite. Os controles não garantem detecção de todo dado pessoal nem inferência no Brasil.",
          "inputSchema": {
            "properties": {
              "max_tokens": {
                "description": "O teto de tokens da resposta; conta na cota e no débito do crédito.",
                "type": "number"
              },
