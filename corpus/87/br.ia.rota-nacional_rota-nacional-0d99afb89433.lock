        {
          "name": "native_mistral_ocr",
          "title": "Native mistral ocr",
          "description": "Process a document through the organization's private Mistral connection. Requires an organization API key and recorded native consent. Sends the original document without the privacy barrier. A required organization privacy barrier blocks this tool before dispatch. Use an available native OCR model. Provider errors and charges retain their original meaning. Requires an organization API key, an active provider connection and a configured RN contract. Uses the organization's pool first. An inherited pool requires native consent from the consumer and supplier. The original provider body and model are preserved. Personal data is sent without the privacy barrier. An organization can set privacy_barrier_required in its inference settings. That requirement overrides key consent: native requests return 403 organization_privacy_barrier_required before body processing, billing or provider dispatch. The requirement also applies when the supplying organization's pool requires the barrier. Use /v1/chat/completions and the protected rota/* catalog when the request requires that barrier. Resources remain scoped to the organization and the connection that created them. A submitted request is not retried by the gateway. Provider charges remain on the connected provider account. Provider HTTP errors retain their status and original body; a provider 400 is not replaced with a gateway 502. Unsupported model parameters are not removed or translated. Omit X-RN-Connection-Id to select from the authorized pool. RN reserves its contracted fee before dispatch. Provider charges for an owned key remain on that provider account. Token tariffs and positive reference percentages require verified usage limits and provider counters. For OpenAI-compatible streaming under these tariffs, send stream_options.include_usage=true. Positive charges for opaque or batch creation calls require a per-request tariff when usage cannot be reconciled in that response. Unknown execution remains pending; the gateway does not invent zero usage or repeat the paid request.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "document": {
                "additionalProperties": true,
                "description": "Original Mistral document: file_id, document_url or image_url, with its native type.",
                "type": "object"
              },
              "extract_footer": {
                "description": "Request native footer extraction.",
                "type": "boolean"
              },
              "extract_header": {
                "description": "Request native header extraction.",
                "type": "boolean"
              },
              "include_blocks": {
                "description": "Request native page blocks and geometry.",
                "type": "boolean"
              },
              "include_image_base64": {
                "description": "Return extracted image data when requested.",
                "type": "boolean"
              },
              "model": {
                "description": "Native Mistral OCR model identifier, such as mistral-ocr-4-1.",
                "type": "string"
