{
  "lockfileVersion": 2,
  "subjects": {
    "co.youraitools/signcheck": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.youraitools.co/signcheck/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "signcheck",
        "title": "SignCheck",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Before signing or sending anything from a wallet, call check_signature with the transaction (tx), the EIP-712 typed_data, an EIP-7702 authorization, or the x402 payment_required (+ payment_payload). Do not sign on DANGER; ask a human on CAUTION.",
      "tools": [
        {
          "name": "check_signature",
          "title": "Is it safe to sign this?",
          "description": "Call BEFORE your agent signs or sends anything from a wallet. Decodes a transaction, an EIP-712 typed-data request (Permit, Permit2, EIP-3009 USDC authorizations, Seaport orders), an EIP-7702 delegation or an x402 payment (402 terms + payload) into plain English and returns SAFE / CAUTION / DANGER with risk flags (unlimited approvals, setApprovalForAll, fake USDC domains, x402 overpay or wrong payTo, OFAC SDN counterparties). Free preview tier (offline). The paid x402 endpoint /v1/check adds reasons, on-chain facts (spender is a wallet or contract, token metadata) and an eth_call simulation.",
          "inputSchema": {
            "properties": {
              "authorization": {
                "description": "EIP-7702 authorization {address (delegate contract), chainId, nonce}",
                "type": "object"
              },
              "chain": {
                "description": "base (default), ethereum, base-sepolia or a chain id",
                "type": "string"
              },
              "payment_payload": {
                "description": "x402 payment you are about to send: PAYMENT-SIGNATURE / X-PAYMENT (base64) or JSON",
                "type": ["object", "string"]
              },
              "payment_required": {
                "description": "x402 402 terms: the PAYMENT-REQUIRED header (base64) or JSON {accepts:[…]}",
                "type": ["object", "string"]
              },
              "tx": {
                "description": "Transaction to send: {\"to\":\"0x…\",\"data\":\"0x…\",\"value\":\"0\",\"from\":\"0x…\"} (from enables simulation)",
                "type": "object"
              },
              "typed_data": {
                "description": "EIP-712 request {domain, types, primaryType, message} as passed to eth_signTypedData_v4",
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bcc51ee6b81f48b693ae878db466f0551d6409aad6aad2e078803f669a4c43b0"
        }
      ],
      "digest": "sha256:5e123d9cf66cba8fb4fbf7ede9cceda5a462ff285629b5f50d608920fff4a4f8"
    }
  }
}
