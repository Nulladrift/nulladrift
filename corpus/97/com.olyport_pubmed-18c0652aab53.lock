        {
          "name": "find_related_articles",
          "description": "Find articles related to a given PubMed article.\n\n    Uses NCBI's computed similarity to find conceptually related\n    papers. Useful for literature review expansion.\n\n    Args:\n        pmid: PubMed ID of the source article.\n        limit: Maximum related articles to return (default 10, max 50).\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "pmid": {
                "title": "Pmid",
                "type": "string"
              }
            },
            "required": ["pmid"],
            "title": "find_related_articlesArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "find_related_articlesOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:df8aab89efcbfe65399f327a7e0f94b8ace4f4860cdc6c24a9a5bcbb23382737"
        },
        {
          "name": "get_article_detail",
          "description": "Get full details of a PubMed article by its PMID.\n\n    Returns title, all authors, complete abstract, MeSH terms,\n    publication types, journal info, and DOI.\n\n    Args:\n        pmid: PubMed ID (e.g. '39142850').\n    ",
          "inputSchema": {
            "properties": {
              "pmid": {
                "title": "Pmid",
                "type": "string"
              }
            },
            "required": ["pmid"],
            "title": "get_article_detailArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_article_detailOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c204a3e56bc57846ad0b344f5365fba3f73c3a6fe858897076f6ecb72b868806"
        },
        {
          "name": "get_cited_by",
          "description": "Find articles that cite a given PubMed article.\n\n    Useful for tracking the impact and follow-up research of a\n    key publication.\n\n    Args:\n        pmid: PubMed ID of the article to find citations for.\n        limit: Maximum citing articles to return (default 20, max 100).\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "title": "Limit",
                "type": "integer"
              },
              "pmid": {
                "title": "Pmid",
                "type": "string"
              }
            },
            "required": ["pmid"],
            "title": "get_cited_byArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_cited_byOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0dbd55599433b9c4b3ec26874d21dc9e3d0efc85b6b9d8a9839cab5157ae6f98"
        },
        {
          "name": "search_mesh",
          "description": "Search the MeSH vocabulary for standardized medical terms.\n\n    Find MeSH (Medical Subject Headings) descriptors to use in\n    precise PubMed searches. Returns MeSH IDs, preferred terms,\n    and scope notes.\n\n    Args:\n        term: Search term (e.g. 'diabetes', 'heart failure', 'opioid').\n        limit: Maximum results (default 10).\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "term": {
                "title": "Term",
                "type": "string"
              }
            },
            "required": ["term"],
            "title": "search_meshArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "search_meshOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b3a8828d041f7e75f018f2e1194a304fd4896675ec06cef336df4faf1a79d37b"
        },
        {
          "name": "search_pubmed",
          "description": "Search PubMed for biomedical literature.\n\n    Find research articles, reviews, and clinical studies matching your\n    search terms. Supports PubMed query syntax including MeSH terms,\n    field tags, and boolean operators.\n\n    Args:\n        query: Search terms (e.g. 'diabetes prevention exercise',\n            'breast cancer[MeSH] AND immunotherapy', 'COVID-19 vaccine efficacy').\n        limit: Maximum results (default 20, max 100).\n        sort: Sort order - 'relevance', 'date', or 'author' (default 'relevance').\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "title": "Query",
                "type": "string"
              },
              "sort": {
                "default": "relevance",
                "title": "Sort",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "search_pubmedArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "search_pubmedOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e756a7dcde2454d8da5a5d4617aad629d4b7411b267d5cb8ff8e9bbf5412e933"
        }
