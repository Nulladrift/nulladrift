      "tools": [
        {
          "name": "beleeg_look_up_public",
          "title": "Look up a public page",
          "description": "Look up what anyone can see on Beleeg — a league, team, match or tournament public page — no membership needed. Read-only. Pick `what` and give the slug or id listed for it.\n\nwhat (params; ? = optional):\n- league: A league's public page by its slug: sport, current season, teams, standings. [slug]\n- team: A team's public page by its slug: roster, captain, colours, recent matches. [slug]\n- match: One match by match_id: teams, lineups, set scores, venue. [match_id]\n- tournament: One tournament's public page by tournament_id: status, entrants, bracket. [tournament_id]\n- league_tournaments: The tournaments a league shows the public, by the league slug. [league_slug]",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "league_slug": {
                "description": "Public league slug (not UUID). Used with what: league_tournaments.",
                "type": "string"
              },
              "match_id": {
                "description": "One match id (from what \"schedule\"). For the match-day lookups, leave out to mean the person's next match. Used with what: match.",
                "type": "string"
              },
              "slug": {
                "description": "Public URL-safe league slug. Used with what: league, team.",
                "type": "string"
              },
              "tournament_id": {
                "description": "A tournament id, from what \"tournaments\". Used with what: tournament.",
                "type": "string"
              },
              "what": {
                "description": "What to look up. Every value is listed, with its params, in the tool description.",
                "enum": ["league", "team", "match", "tournament", "league_tournaments"],
                "type": "string"
              }
            },
            "required": ["what"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a public page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5828c046e64b5dfaac5c61743071b60dee10cb1f329f6d1c55b65e95f733cf9d"
        },
        {
          "name": "beleeg_send_feedback",
          "title": "Tell Beleeg what was missing",
          "description": "Send Beleeg a note when it cannot do something the person asked for, or when a tool was confusing or gave a wrong answer. Say what they wanted and, if one did, which tool fell short. Never include personal details — names, emails or phone numbers — of the person or anyone else. The Beleeg team reads these to decide what to build; nothing is done automatically and nobody replies, so still tell the person what you could not do and, where there is one, where in Beleeg they can do it themselves.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "message": {
                "description": "What Beleeg could not do, or what was confusing or wrong, in a sentence or two. No names, emails or phone numbers of anyone.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "tool": {
                "description": "The tool that fell short, if one did.",
                "maxLength": 100,
                "type": "string"
              },
              "trying_to": {
                "description": "What the person was trying to get done, e.g. \"move all of Saturday's games to Sunday\".",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "received": {
                "type": "boolean"
              }
            },
            "required": ["received"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Tell Beleeg what was missing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:de2e4f15b453280887f22a96d09b7d48d7080587465da64235fddc2fcfc5ce8f"
        },
        {
          "name": "beleeg_start_league",
          "title": "Start a league (no account needed)",
          "description": "Creates a real league on Beleeg right away for someone who does not have a Beleeg account yet: the league, its first season with registration open, optional teams, and a public page. It is held for the organizer whose email you give: to take it over they open the claim_url, sign in at beleeg.com with THAT email address (email code, Google or Apple), and choose to keep it. Signing in alone does not make it theirs. Always give the person the claim_url exactly as returned (never build a link from the name) and tell them which email to sign in with. Ask the person for their email; never guess one. If Beleeg refuses, tell the person to sign in to Beleeg with that email and ask again. After signing in, the organizer is asked whether to keep the league or discard it; it is theirs only once they keep it. Invited people are saved but not emailed until the organizer has kept the league and sends them. If the organizer has not kept it within 30 days, the league is removed. Limits: 3 per organizer email per day, 5 per caller per day, and at most 3 leagues or brackets waiting on the organizer. Team names that differ only by capitals or spacing are treated as one team. Tell the person what you are about to create and get a yes BEFORE calling this; there is no separate confirm step.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Town or city, shown on the public page.",
                "maxLength": 80,
                "type": "string"
              },
              "client": {
                "description": "Which assistant this is, for example muse, claude, chatgpt, cursor.",
                "maxLength": 40,
                "type": "string"
              },
              "inviteEmails": {
                "description": "People to invite (up to 200). They are only SAVED as pending invites: no email goes out until the organizer has signed in, kept the league, and sends them.",
                "items": {
                  "maxLength": 254,
                  "type": "string"
                },
                "maxItems": 200,
                "type": "array"
              },
              "name": {
                "description": "League name, plain text, for example \"Tuesday Night Pickleball\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "organizationName": {
                "description": "Club or group name. Defaults to the league name.",
                "maxLength": 80,
                "type": "string"
              },
              "organizerEmail": {
                "description": "The organizer's own email address. They sign in with it to take over the league. Ask for it; never guess.",
                "maxLength": 254,
                "minLength": 3,
                "type": "string"
              },
              "registrationClosesOn": {
                "description": "Last day to register, YYYY-MM-DD. Defaults to 30 days from today.",
                "type": "string"
              },
              "sport": {
                "description": "Sport key, for example pickleball, platform-tennis, tennis, softball, volleyball.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "teams": {
                "description": "Team names to create right away (up to 64).",
                "items": {
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 64,
                "type": "array"
              },
              "timezone": {
                "description": "IANA time zone the league plays in, for example America/Chicago.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name", "organizerEmail", "sport", "timezone"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "claim_instructions": {
                "description": "Read this to the person.",
                "type": "string"
              },
              "claim_url": {
                "description": "Give this to the organizer: it explains how to take over the league.",
                "type": "string"
              },
              "invites_pending": {
                "description": "Invites saved but NOT sent.",
                "type": "integer"
              },
              "league_id": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "organization_id": {
                "type": "string"
              },
              "organizer_email": {
                "type": "string"
              },
              "public_url": {
                "description": "The public league page. Works right away, and says the league is waiting for its organizer until it is kept. Use it exactly as returned: while the league waits its address ends in a few extra characters. Once kept it moves to the short address if that is free, and this one keeps working.",
                "type": "string"
              },
              "slug": {
                "type": "string"
              },
              "teams": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "unclaimed_expires_on": {
                "description": "If the organizer has not signed in and kept the league by this date, it is removed.",
                "type": "string"
              }
            },
            "required": ["claim_instructions", "claim_url", "invites_pending", "league_id", "name", "organization_id", "organizer_email", "public_url", "slug", "teams", "unclaimed_expires_on"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Start a league (no account needed)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:32224042af35117f231bf6b8e5636cfe7b2116f3cfb39c3e1e7f939e13ef0c5b"
        },
        {
          "name": "beleeg_start_tournament",
          "title": "Start a tournament bracket (no account needed)",
          "description": "Creates a real standalone tournament bracket on Beleeg right away for someone who does not have a Beleeg account yet: the draw is built from the entrants you give. It is never attached to an existing league or organization. It is held for the organizer whose email you give: to take it over they open the claim_url, sign in at beleeg.com with THAT email address (email code, Google or Apple), and choose to keep it. Signing in alone does not make it theirs. Always give the person the claim_url exactly as returned (never build a link from the name) and tell them which email to sign in with. Ask the person for their email; never guess one. If Beleeg refuses, tell the person to sign in to Beleeg with that email and ask again. After signing in, the organizer is asked whether to keep the bracket or discard it; it is theirs only once they keep it. Until then nobody else can see the entrants or the draw: the bracket page only says it is waiting for its organizer. If the organizer has not kept it within 30 days, the bracket is removed. Limits: up to 64 entrants (32 for round robin); 3 per organizer email per day, 5 per caller per day, and at most 3 leagues or brackets waiting on the organizer. Tell the person what you are about to create and get a yes BEFORE calling this; there is no separate confirm step.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bestOf": {
                "description": "Sets per match, 1 to 9. Defaults to 3.",
                "maximum": 9,
                "minimum": 1,
                "type": "integer"
              },
              "client": {
                "description": "Which assistant this is, for example muse, claude, chatgpt, cursor.",
                "maxLength": 40,
                "type": "string"
              },
              "entrants": {
                "anyOf": [
                  {
                    "items": {
                      "maxLength": 160,
                      "type": "string"
                    },
                    "maxItems": 64,
                    "minItems": 2,
                    "type": "array"
                  },
                  {
                    "maxLength": 20000,
                    "type": "string"
                  }
                ],
                "description": "Who is playing: a list of names, or text with one entrant per line. For pairs write \"Ann Lee / Bo Park\". 2 to 64 entrants (2 to 32 for round_robin)."
              },
              "format": {
                "description": "Bracket format. Defaults to single_elim.",
                "enum": ["single_elim", "single_elim_consolation", "three_match_guarantee", "double_elim", "round_robin", "pool_to_bracket"],
                "type": "string"
              },
              "name": {
                "description": "Tournament name, plain text.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "organizerEmail": {
                "description": "The organizer's own email address. They sign in with it to run the bracket. Ask for it; never guess.",
                "maxLength": 254,
                "minLength": 3,
                "type": "string"
              },
              "registrationUnit": {
                "description": "solo (default) or pair (doubles).",
                "enum": ["solo", "pair"],
                "type": "string"
              }
            },
            "required": ["entrants", "name", "organizerEmail"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "claim_instructions": {
                "description": "Read this to the person.",
                "type": "string"
              },
              "claim_url": {
                "description": "Give this to the organizer: it explains how to run the bracket.",
                "type": "string"
              },
              "entrants": {
                "type": "integer"
              },
              "format": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "organizer_email": {
                "type": "string"
              },
              "public_url": {
                "description": "The bracket page. Until the organizer keeps the bracket it only says the tournament is waiting for its organizer; the entrants and the draw show once it is kept.",
                "type": "string"
              },
              "tournament_id": {
                "type": "string"
              },
              "unclaimed_expires_on": {
                "description": "If the organizer has not signed in and kept the bracket by this date, it is removed.",
                "type": "string"
              }
            },
            "required": ["claim_instructions", "claim_url", "entrants", "format", "name", "organizer_email", "public_url", "tournament_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Start a tournament bracket (no account needed)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d08cba7747dce2ed66b8497ad196d8b09f327e278933d2009aae12c53c709b5b"
        }
      ],
      "digest": "sha256:0e8c00be7d07ccbb84aed070ce1ea9b20e599c3cfa65a95178b8a52dd1cd67fa"
    }
  }
