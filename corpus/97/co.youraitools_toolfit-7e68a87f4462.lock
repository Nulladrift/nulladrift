{
  "lockfileVersion": 2,
  "subjects": {
    "co.youraitools/toolfit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.youraitools.co/toolfit/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "toolfit",
        "title": "ToolFit",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ToolFit checks tool lists: audit_tools (token cost, provider schema errors with fixed definitions, confusable pairs, poisoning lint, pin), diff_tools (what changed since a pin, each change labeled), check_mcp_server (MCPCheck preflight of a remote MCP server: handshake, protocol, sign-in, x402, latency, grade). It only lists tools at a URL, never calls them. watch_mcp_server (paid: re-audit a server every 24 h or 6 h for 30 days, HMAC-signed webhook on tool or grade changes), watch_status and watch_cancel (free, need watch_id + secret). Free tier: 20 audit/diff and 10 check calls per IP per day; then x402 or prepaid credits.",
      "tools": [
        {
          "name": "audit_tools",
          "title": "Audit a tool list (ToolFit)",
          "description": "Check the tool definitions an agent loads, before they cost tokens or fail: estimated tokens per tool, schema errors per provider (OpenAI, Anthropic, Gemini, Bedrock, MCP; add openai_strict for strict mode) with JSON paths and fixed definitions, tool pairs models will confuse with fix hints, basic poisoning patterns, a grade and a pin (set_id) for diff_tools. Pass \"tools\" (array in any common format) or \"url\" (public remote MCP server; tools are listed, never called). level \"lite\" returns the summary only. Free: 20 calls/day per IP (shared with diff_tools), then $0.003 lite / $0.01 full via x402 or credits.",
          "inputSchema": {
            "properties": {
              "level": {
                "description": "lite = summary only; full (default) = every issue, fixed definitions, pair hints",
                "enum": ["lite", "full"],
                "type": "string"
              },
              "providers": {
                "description": "Providers to check (default openai, anthropic, gemini, bedrock, mcp; add openai_strict for Structured Outputs strict mode). GET: comma list.",
                "items": {
                  "enum": ["openai", "openai_strict", "anthropic", "gemini", "bedrock", "mcp"],
                  "type": "string"
                },
                "type": "array"
              },
              "tools": {
                "description": "Tool definitions: MCP tools/list entries, OpenAI {type:\"function\",function:{...}}, Anthropic {name,description,input_schema}, Gemini functionDeclarations or Bedrock toolSpec. Max 500.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "url": {
                "description": "Public remote MCP server URL (Streamable HTTP, https), e.g. https://api.youraitools.co/mcp/hub. ToolFit only lists its tools.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:35a1825b742fbd225a954f530d10d055de51f0190024da70a6d005a07044b275"
        },
        {
          "name": "check_mcp_server",
          "title": "Preflight a remote MCP server (MCPCheck)",
          "description": "Does this remote MCP server work, and is it worth connecting or paying for? Sends initialize and tools/list only (never calls a tool) and reports reachability, protocol version, sign-in method (OAuth protected-resource metadata), x402 payment terms if it asks for payment, latency, tool count and token cost, provider compatibility, poisoning patterns in tools and server instructions, issues and a grade A-F, plus a pin for later diffs. https public hosts only. Free: 10 checks/day per IP, then $0.005 via x402 or credits.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Public remote MCP server URL (Streamable HTTP, https), e.g. https://api.youraitools.co/mcp/hub. ToolFit only lists its tools.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5fbe4f9db0aed4988db83ca387f7e274d88bce0ebfc5ca8f90f6c94a360ec7dd"
        },
        {
          "name": "diff_tools",
          "title": "Diff a tool list against a pin (ToolFit)",
          "description": "What changed in a tool list since you approved it? Compares \"tools\" or \"url\" now with \"pin\" (set_id from audit_tools/diff_tools) or \"baseline\" (earlier definitions). Each change is labeled breaking (removed tool or param, new required param, type or enum removal), suspicious (new text with injection patterns or hidden characters), review (description, title, annotation or new tool) or additive; descriptions come with before/after text and a word diff. Returns a new pin. Free: 20 calls/day per IP (shared with audit_tools), then $0.002 via x402 or credits.",
          "inputSchema": {
            "properties": {
              "baseline": {
                "description": "Instead of pin: the earlier tool definitions themselves.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "pin": {
                "description": "A pin (set_id \"ts_...\" from an earlier ToolFit call) to compare against.",
                "type": "string"
              },
              "tools": {
                "description": "Tool definitions: MCP tools/list entries, OpenAI {type:\"function\",function:{...}}, Anthropic {name,description,input_schema}, Gemini functionDeclarations or Bedrock toolSpec. Max 500.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "url": {
                "description": "Public remote MCP server URL (Streamable HTTP, https), e.g. https://api.youraitools.co/mcp/hub. ToolFit only lists its tools.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:366b3f11d4394910fcd908c7180f6d069ed456bb130858dd91ca52cefc643029"
        },
        {
          "name": "watch_cancel",
          "title": "Cancel a ToolFit watch",
          "description": "Free: cancel a watch (no further checks or webhooks; not refunded). Needs watch_id and the secret returned when it was created.",
          "inputSchema": {
            "properties": {
              "secret": {
                "description": "The whsec_... secret returned once when the watch was created",
                "type": "string"
              },
              "watch_id": {
                "description": "watch_id (w_...) returned by POST /v1/watch",
                "type": "string"
              }
            },
            "required": ["secret", "watch_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:be9fe730194c57105f39f07b58823ef89051653cd71430205a8f5f825c87052d"
        },
        {
          "name": "watch_mcp_server",
          "title": "Watch a remote MCP server for changes (ToolFit)",
          "description": "Hosted watch (paid only; this MCP call validates and returns how to pay): ToolFit re-audits a public remote MCP server every 24 h ($0.25) or 6 h ($0.60) for 30 days and POSTs an HMAC-SHA256 signed JSON webhook to your https endpoint when its tools/list fingerprint or grade changes, or it goes unreachable or recovers. Pay at POST /v1/watch or /v1/watch/6h with x402 or a credits key; the response has watch_id and the signing secret (shown once).",
          "inputSchema": {
            "properties": {
              "every": {
                "description": "Check interval: 24h (default, $0.25 per 30 days) or 6h ($0.60 per 30 days).",
                "enum": ["24h", "6h"],
                "type": "string"
              },
              "url": {
                "description": "Public remote MCP server URL (Streamable HTTP, https), e.g. https://api.youraitools.co/mcp/hub. ToolFit only lists its tools.",
                "type": "string"
              },
              "webhook": {
                "description": "Your https endpoint (public host, port 443) that receives the signed JSON change notifications. A query string is allowed.",
                "type": "string"
              }
            },
            "required": ["url", "webhook"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:abf307b616442e807651a2cf914b79a8617039caf0d5be8fe91d7df72c723006"
        },
        {
          "name": "watch_status",
          "title": "Status of a ToolFit watch",
          "description": "Free: state (active, expired, cancelled), interval, expiry, next check, last result (pin, grade, score, tool count) and webhook delivery counters for a watch. Needs watch_id and the secret returned when it was created.",
          "inputSchema": {
            "properties": {
              "secret": {
                "description": "The whsec_... secret returned once when the watch was created",
                "type": "string"
              },
              "watch_id": {
                "description": "watch_id (w_...) returned by POST /v1/watch",
                "type": "string"
              }
            },
            "required": ["secret", "watch_id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2366e2326dcd59b0935012a35d44c66359c9db838496dd545ddb55249cfd3320"
        }
      ],
      "digest": "sha256:fa38f866e313be3122c7ef752dd68a7426632ce4d862ddad3c447d11ba7b9ee9"
    }
  }
}
