      "tools": [
        {
          "name": "get_review_detail",
          "description": "Get full details of a Cochrane systematic review by PubMed ID.\n\n    Returns the complete abstract, authors, publication info, MeSH terms,\n    and conclusions of a Cochrane review. Use PMIDs from search_reviews results.\n\n    Args:\n        pmid: PubMed ID of the review (e.g. '35658166').\n    ",
          "inputSchema": {
            "properties": {
              "pmid": {
                "title": "Pmid",
                "type": "string"
              }
            },
            "required": ["pmid"],
            "title": "get_review_detailArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_review_detailOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3e19f711a9160d24f3b4bba16ac58f7db554fc8140a4be054078d518954a8c36"
        },
        {
          "name": "search_clinical_trials",
          "description": "Search clinical trials related to a health condition via PubMed.\n\n    Finds clinical trial publications matching the condition and optional\n    intervention. Returns trial titles, authors, and PubMed IDs.\n\n    Args:\n        condition: The health condition or disease (e.g. 'type 2 diabetes',\n            'breast cancer', 'depression').\n        intervention: Optional treatment or intervention to include in search\n            (e.g. 'metformin', 'cognitive behavioral therapy').\n        limit: Maximum number of results to return (default 20, max 100).\n    ",
          "inputSchema": {
            "properties": {
              "condition": {
                "title": "Condition",
                "type": "string"
              },
              "intervention": {
                "default": null,
                "title": "Intervention",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "title": "Limit",
                "type": "integer"
              }
            },
            "required": ["condition"],
            "title": "search_clinical_trialsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "search_clinical_trialsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f37a0cb5f0db8634643f1446fb89055baa712823aa4c68815b9f1ea9c75daf93"
        },
        {
          "name": "search_reviews",
          "description": "Search Cochrane systematic reviews via PubMed.\n\n    Finds Cochrane Database of Systematic Reviews articles matching\n    your query. Returns PubMed IDs, titles, and publication dates.\n    Use get_review_detail with a PMID to get the full abstract.\n\n    Args:\n        query: Search terms for finding reviews (e.g. 'diabetes exercise',\n            'hypertension treatment', 'childhood vaccination safety').\n        limit: Maximum number of results to return (default 20, max 100).\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "search_reviewsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "search_reviewsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:36146d5fcf4a556b69792a881854a47de7906e76b556627c986b49e651d9c255"
        }
      ],
      "digest": "sha256:66a5d17625ad4663204aff54f2f672680d03fb9fb0a27270ecb7ae207980734c"
    }
