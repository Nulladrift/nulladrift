{
  "lockfileVersion": 2,
  "subjects": {
    "com.strhosttools/vrbo-repricer": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://strhosttools.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "strhosttools",
        "title": "STR Host Tools",
        "version": "1.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Fee calculators and checkout and claim helpers for short-term rental hosts. Rates are decimals (0.12 = 12%). Also a directory of host prompts via list_prompts and get_prompt. Not financial or legal advice.",
      "tools": [
        {
          "name": "airbnb_host_only",
          "title": "Airbnb host-only fee repricer",
          "description": "Airbnb price that keeps host payout the same when the split host fee (default 0.03) becomes the single host-only fee (default 0.155).",
          "inputSchema": {
            "properties": {
              "guest_fee": {
                "description": "Old guest service fee for comparison, default 0",
                "type": "number"
              },
              "mode": {
                "description": "pass (default): raise prices so take-home stays the same. absorb: keep prices and show the take-home drop",
                "type": "string"
              },
              "new_rate": {
                "description": "New host-only fee, default 0.155",
                "type": "number"
              },
              "old_host_rate": {
                "description": "Old host fee, default 0.03",
                "type": "number"
              },
              "price": {
                "description": "Nightly price USD on the split fee",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b2f7ea3d3b6eb6aa0ce138dd21dc151f0cbf857336c2a6ed8cbda1edb45661d2"
        },
        {
          "name": "checkout_check",
          "title": "Airbnb checkout chore checker",
          "description": "Paste Airbnb checkout instructions. Flags tasks that go past Airbnb's simple checkout asks (gather towels, trash, turn off, lock up, return keys), such as stripping beds, laundry, dishes, vacuuming, or fees for skipped chores. Returns per-line flags with reasons, friendly rewrites, a suggested list, and a guest note. Keyword rules, not AI. Not legal advice.",
          "inputSchema": {
            "properties": {
              "text": {
                "description": "The checkout instructions, one task per line",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9e05a0df69c850529090350f9c5856d3f8581d3ebca17d1ab096b4fb9d267c8f"
        },
        {
          "name": "claim_deadlines",
          "title": "Airbnb damage claim deadlines",
          "description": "Airbnb Host Damage Protection deadlines from a checkout date: ask the guest to pay within 14 days, file with Airbnb within 30 days (Terms updated Feb 5, 2026). Returns dates, days left, status, and an evidence checklist. Not legal advice.",
          "inputSchema": {
            "properties": {
              "checkout": {
                "description": "Guest checkout date YYYY-MM-DD",
                "type": "string"
              },
              "reservation": {
                "description": "Optional reservation code",
                "type": "string"
              },
              "today": {
                "description": "Optional YYYY-MM-DD, default today in tz",
                "type": "string"
              },
              "tz": {
                "description": "Optional IANA timezone for today, default America/New_York",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e116a195bb55c2c23a7458152bc0038fb713cc2dc592f9a175817d1fd4a69786"
        },
        {
          "name": "get_prompt",
          "title": "Get a host agent prompt",
          "description": "Get the full text of one host prompt by id (from list_prompts). Fill in the [BRACKETS] before running it.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Prompt id, e.g. vrbo-flat-fee-reprice",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:367e7f4df357af1ff1b0fd001ecfbcac9715e1ac58fc2875828e72632a914ce6"
        },
        {
          "name": "lead_window",
          "title": "Vrbo lead window check",
          "description": "Days from first Vrbo contact to a direct booking, and whether it is inside the window (default 30 days, as industry reports describe Vrbo's terms).",
          "inputSchema": {
            "properties": {
              "booking": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "days": {
                "description": "Window, default 30",
                "type": "number"
              },
              "first_contact": {
                "description": "YYYY-MM-DD",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d39c84d16b53da1e0306cee7fac11fad11286444b24b5c48719d4762291b26d7"
        },
        {
          "name": "list_prompts",
          "title": "List host agent prompts",
          "description": "List the 30 copy-paste prompts for short-term rental hosts (id, category, title, what it does, url). Optional category: listing, pricing-fees, guest-messaging, reviews, claims, turnovers-cleaners, compliance, direct-booking.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Filter by category id",
                "enum": ["listing", "pricing-fees", "guest-messaging", "reviews", "claims", "turnovers-cleaners", "compliance", "direct-booking"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4158c0e34588dd4b5a82d5e80f2b748facbf61b72d0b8c0656373f415f1feb71"
        },
        {
          "name": "price_match",
          "title": "Same take-home price matcher",
          "description": "Direct, Airbnb, and Vrbo prices that all leave the host the same take-home per night.",
          "inputSchema": {
            "properties": {
              "airbnb_rate": {
                "description": "Airbnb fee, default 0.155",
                "type": "number"
              },
              "direct_rate": {
                "description": "Direct cost, default 0.03",
                "type": "number"
              },
              "net": {
                "description": "Take-home per night USD",
                "type": "number"
              },
              "vrbo_rate": {
                "description": "Vrbo fee, default 0.12",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ae1c85549c72b7cfed9b00528e364f63ad86d752f5da3e94728770951f4ef78e"
        },
        {
          "name": "vrbo_reprice",
          "title": "Vrbo 12% repricer",
          "description": "New Vrbo nightly, cleaning, and pet prices that keep host take-home the same after Vrbo's flat 12% fee (Oct 29, 2026). Rates are decimals.",
          "inputSchema": {
            "properties": {
              "cleaning": {
                "description": "Cleaning fee USD",
                "type": "number"
              },
              "mode": {
                "description": "pass (default): raise prices so take-home stays the same. absorb: keep prices and show the take-home drop",
                "type": "string"
              },
              "nightly": {
                "description": "Nightly rate USD",
                "type": "number"
              },
              "nights": {
                "description": "Nights per stay",
                "type": "number"
              },
              "old_rate": {
                "description": "Old fee: 0.08 pay-per-booking, 0.05 PMS, 0 subscription",
                "type": "number"
              },
              "pet": {
                "description": "Pet fee USD",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c1de415362fbdda749da32d3d145450ab13f1f3344f1109aed9d2dee15dd0833"
        }
      ],
      "digest": "sha256:bc28ae3facbcd791a2d14efc6c974b6e05e57b8488f5a82767bab0bbb32895ec"
    }
  }
