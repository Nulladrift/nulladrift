        {
          "name": "cancel_booking",
          "title": "Cancel a booking or request",
          "description": "Cancels the person's own booking or service request, under the same rules as the cancel button on their page (a booking can be canceled online until its start time; a request until work has started; canceling a booking under 2 hours before the start can carry a late-cancellation fee). It can't be undone: confirm with the person first and pass confirm: true. Needs their private link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "Instead of link: the token= or t= value from that link",
                "type": "string"
              },
              "confirm": {
                "description": "true once the person has said to cancel",
                "type": "boolean"
              },
              "link": {
                "description": "The person's private link: the manage link from a booking email (…/manage.html?ref=…&token=…) or the status link from a request email (…/requests/SR-…?t=…; request_service returns it as status_url)",
                "type": "string"
              },
              "reason": {
                "description": "Why, in the person's words (optional)",
                "type": "string"
              },
              "ref": {
                "description": "Instead of link: the reference, e.g. SR-AB12CD",
                "type": "string"
              }
            },
            "required": ["confirm"],
            "type": "object"
