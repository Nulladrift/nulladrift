      "instructions": "Notary, apostille and document services from MCC Solutions (Cranford, New Jersey). Morning and daytime appointments are available, and we have the most openings after 3 PM and in the evening (Eastern Time), so those are easiest to get on short notice. Offer whatever time suits the person. Prices: quote only what get_services_and_prices returns, as a starting price (\"from\"), plus the state notarial fee it spells out (New Jersey: $2.50 per notarial act; a loan signing has one $25 notarial line for all the borrowers' notarizations). Nothing is priced per signature. Use available_times to find open times, then send the person to the booking link, or use request_service (with their consent) to send it for them: service \"ron\" for online notarization or \"mobile_notary_nj\" for a New Jersey mobile visit, with up to 3 slot start values in start_times. The desk confirms a time; nothing is charged until then. After that, with the person's private link (the status_url from request_service, or the link in their confirmation email): request_status says where it stands, cancel_booking cancels it and request_new_time asks the desk to move an appointment (both need the person's say-so and confirm: true). what_to_bring lists what to have ready for a signing. Career and student questions (resumes, interview coaching, accounting tutoring, college essays): use career_and_student_services. The whole site (guides, state rules, free tools, store): site_directory, ask, list_free_tools and read_page. Use the free tools to answer questions. Dataset tools need an MCC Data API key. Usage guide: skill://mcc-notary/SKILL.md (read it with resources/read).",
