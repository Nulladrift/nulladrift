        {
          "name": "available_times",
          "title": "Open notary appointment times",
          "description": "Open appointment times for online notarization (ron, by video, signer anywhere in the U.S.) or a mobile notary visit in New Jersey (mobile) over the next days (up to 14), in Eastern Time. Returns a per-day summary (days: open count, first and last time, how many after 3 PM) and every open slot a page at a time (slots, with limit, offset, has_more and next_offset), plus the booking link. Morning and daytime times are included; the most openings are after 3 PM and in the evening. To book, send up to 3 slot start values to request_service (service \"ron\" or \"mobile_notary_nj\") in start_times, or open the booking link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "How many days to look ahead (default 7)",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "from": {
                "description": "Start date YYYY-MM-DD (default today, Eastern)",
                "type": "string"
              },
              "limit": {
                "description": "Slots per page (default 30)",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Skip this many slots (use next_offset from the last page)",
                "minimum": 0,
                "type": "integer"
              },
              "part": {
                "description": "Only times after 3 PM, or only before 3 PM",
                "enum": ["afternoon_evening", "morning_midday"],
                "type": "string"
              },
              "service": {
                "description": "ron = online by video; mobile = we travel to the signer in NJ",
                "enum": ["ron", "mobile"],
                "type": "string"
