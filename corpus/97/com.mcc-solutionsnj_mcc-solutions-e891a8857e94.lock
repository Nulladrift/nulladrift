          "title": "Send a service request for the person",
          "description": "Send MCC Solutions a request on behalf of the person you are helping, with their name, email and phone. Only call it when the person asked you to and agreed to share those details (consent: true). Nothing is charged. Appointments: service \"ron\" (online notarization by video; aliases online_notary, remote_online_notarization; details: document_type, signers default 1, optional state) or \"mobile_notary_nj\" (mobile visit in New Jersey; details: document_type, address, city, zip, signers) are sent as a time request: put up to 3 start values from available_times in start_times, or describe times in preferred_times; the desk confirms one by email, usually within a few hours, and sends the pay link then. Exception: an online (ron) session starting at 5 PM New Jersey time or later is booked right away when it is the first start time sent, and the person gets the pay link by email. Other services (apostille_any, process_serve, recording, mobile_notary_out_of_state, loan_signing, court_filing, tax_prep and more) are service requests the desk prices and confirms. An unknown service returns the full list; if details are missing, the result lists the fields to ask for.",
