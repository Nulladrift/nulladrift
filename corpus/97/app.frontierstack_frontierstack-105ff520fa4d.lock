{
  "lockfileVersion": 2,
  "subjects": {
    "app.frontierstack/frontierstack": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://frontierstack.app/plugin/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "FrontierStack",
        "version": "1.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FrontierStack is the server and network administrator for the user's Macs and linked servers. Start with list_frontierstack_macs when the user has more than one Mac, then use get_server_health or get_fleet_context before diagnosing. Every call is answered by the FrontierStack app on the selected Mac, which applies its own App Lock, permissions, approvals and audit log; credentials never leave that Mac. A refusal that mentions App Lock or approval means the owner must act on the Mac. When a change needs the owner's approval and they have turned on web approvals, the reply is a link to a FrontierStack page (a URL elicitation where supported) with a six-character code: show the link and the code, let them answer there with their passkey, then call the same tool again with the same arguments. Never ask the owner to paste a password or key into the chat; use replace_credential instead. In an unattended run (a scheduled or background task such as a Gemini Task, a ChatGPT scheduled task or a Claude routine) never make a change directly, because approval links expire after about 10 minutes: report what you found and, for a web service start, stop or restart, call service_action with queue_for_approval, reason and observed so the owner can approve it later on their phone and the Mac runs it. If no Mac is online, report that as the finding. FrontierStack is made by Enfour, Inc.; product information and support: https://www.frontierstack.app",
      "tools": [
        {
          "name": "diagnose",
          "title": "Run a read-only diagnostic",
          "description": "Run one bounded, read-only diagnostic program on the selected Mac or a linked server. Arguments are passed directly, never through a shell, and time limits are applied. argv[0] must be one of: ping, ping6, dig, nslookup, host, traceroute, nc (with -z), curl (GET/HEAD), ifconfig, netstat, route, arp, ipconfig (get* only), networksetup (read-only queries), scutil, sysctl, df, uptime, vm_stat, uname, sw_vers, brew (list/info/services list), apachectl configtest, nginx -t, php (-v/-m/-i/--ini/-l), php-config; on Linux targets also nvme, iscsiadm, lsscsi, multipath -ll and InfiniBand status tools. [\"oclp\"] returns a macOS update-safety report for Macs using OpenCore Legacy Patcher. Anything else is refused by the Mac.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "argv": {
                "description": "Program and arguments, e.g. [\"dig\",\"example.com\",\"MX\"] or [\"uptime\"].",
                "items": {
                  "type": "string"
                },
                "maxItems": 32,
                "minItems": 1,
                "type": "array"
              },
              "mac_id": {
                "description": "Opaque id of one of this account's FrontierStack Macs. Optional only when exactly one Mac is online.",
                "type": "string"
              },
              "target": {
                "description": "Optional linked server, by the name or host FrontierStack knows it by, to run on over SSH. Omit for the selected Mac itself.",
                "type": "string"
              }
            },
            "required": ["argv"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Run a read-only diagnostic"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["frontierstack"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:0702b916a5dca3e4d97297fe8a630fbdefd40145eb4333a879c04825c2200531"
        },
        {
