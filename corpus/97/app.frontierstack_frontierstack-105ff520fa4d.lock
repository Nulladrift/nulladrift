        },
        {
          "name": "replace_credential",
          "title": "Ask the owner to replace a stored credential",
          "description": "Ask the owner to type a new value for one of the selected Mac’s stored credentials (an API key or token FrontierStack keeps, such as openai, anthropic, cloudflare or stripe) on a secure FrontierStack page, for example after a key has leaked. The value goes from the owner’s browser straight to the Mac, sealed to it and confirmed with a passkey the Mac created; it never passes through the AI client or the conversation, and this tool neither accepts nor returns it. The first call returns a link for the owner (a URL elicitation where the client supports it) with a short code they can compare; a repeat call with the same arguments returns the outcome once they have finished. Requires web approvals and credential entry to be turned on for that Mac.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "mac_id": {
                "description": "Opaque id of one of this account's FrontierStack Macs. Optional only when exactly one Mac is online.",
                "type": "string"
              },
              "reason": {
                "description": "Why, in a few words, shown to the owner on the page (for example \"the key was pasted into a chat\").",
                "maxLength": 200,
                "type": "string"
              },
              "service": {
                "description": "The credential to replace: its FrontierStack id (for example openai, anthropic, cloudflare, stripe, github) or the service name.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["service"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Ask the owner to replace a stored credential"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["frontierstack"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:8acba050a6d897e42f7417dc666413f89c4d96cebe16cb6c75bb3de14da3267c"
        },
        {
          "name": "service_action",
          "title": "Control a supported web service",
          "description": "Check, start, stop or restart one supported Homebrew web service on the selected Mac. status is read-only; stop and restart interrupt the service. Changes run only if the owner allowed changes on that Mac, and may wait for the owner's approval there. In an unattended run, set queue_for_approval (with reason and observed) so the owner can approve later and the Mac runs it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "status only reads; the others change the service.",
                "enum": ["status", "start", "stop", "restart"],
                "type": "string"
              },
              "mac_id": {
                "description": "Opaque id of one of this account's FrontierStack Macs. Optional only when exactly one Mac is online.",
                "type": "string"
              },
              "name": {
                "description": "The Homebrew service.",
                "enum": ["caddy", "haproxy", "httpd", "nginx", "php", "php@7.4", "php@8.0", "php@8.1", "php@8.2", "php@8.3", "php@8.4", "php@8.5", "traefik"],
                "type": "string"
              },
              "observed": {
                "description": "With queue_for_approval: what you saw that led to it (for example the health result).",
                "maxLength": 500,
                "type": "string"
              },
              "queue_for_approval": {
                "description": "For unattended runs (scheduled or background tasks): instead of running now, queue this start, stop or restart for the owner, who approves it on their phone or Mac; FrontierStack then re-checks and runs it itself. Answers at once with the queued request; do not call again.",
                "type": "boolean"
              },
              "reason": {
                "description": "With queue_for_approval: why the change is needed, in a sentence the owner reads before approving.",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["action", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Control a supported web service"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["frontierstack"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:bdd612be87969187146f7aca803249aae4d76727ceaef47e46ffe657e8f8c478"
        }
