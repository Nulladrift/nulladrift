        {
          "name": "get_server_health",
          "title": "Get server health",
          "description": "Read operational health from a selected FrontierStack Mac: services, monitors, disks, certificates and alerts it watches.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area": {
                "description": "overall (default): the Local Health board of everything the Mac monitors. queues: sanitized backlog counters for configured message brokers, streams, task queues and cloud queues (never message bodies).",
                "enum": ["overall", "queues"],
                "type": "string"
              },
              "mac_id": {
                "description": "Opaque id of one of this account's FrontierStack Macs. Optional only when exactly one Mac is online.",
                "type": "string"
              }
