        {
          "name": "read_logs",
          "title": "Read scrubbed logs",
          "description": "Read a bounded tail of a log on the selected Mac or a linked server. Secrets are removed before the text leaves the Mac.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lines": {
                "description": "How many lines from the end. Default 200.",
                "maximum": 2000,
                "minimum": 1,
                "type": "integer"
              },
              "mac_id": {
                "description": "Opaque id of one of this account's FrontierStack Macs. Optional only when exactly one Mac is online.",
                "type": "string"
              },
              "source": {
                "description": "Which log: \"os\" (the system log), \"wifi\" (Wi-Fi events), a service name (\"nginx\", \"apache\", \"mysql\", \"postgres\", \"redis\", \"sshd\", \"docker\", \"php-fpm\", \"postfix\"), \"vhost:example.com\" for one website's access and error logs, \"frontierstack\" (the app's own log), or \"path:/var/log/file.log\".",
                "type": "string"
              },
              "target": {
                "description": "Optional linked server, by the name or host FrontierStack knows it by, to run on over SSH. Omit for the selected Mac itself.",
                "type": "string"
              }
            },
            "required": ["source"],
            "type": "object"
          },
          "annotations": {
