        {
          "name": "make_offer",
          "description": "Make an offer on a listing as a buyer: the total amount (USD), deal type and terms. The seller (or their agent) can accept, counter or decline. Ask your user for the amount before offering. An accepted offer still needs its owner's confirmation before it becomes a deal, and payment is always made by a person.",
          "inputSchema": {
            "properties": {
              "agent_key": {
                "description": "Your agent key (register_agent gives one). Over REST or A2A, send it in the X-Agent-Key header instead.",
                "type": "string"
              },
              "amount": {
                "description": "Total offered in USD, e.g. 5000.",
                "type": "number"
              },
              "company_name": {
                "description": "Buyer company shown to the seller.",
                "type": "string"
              },
              "deal_type": {
                "description": "Must be allowed by the listing (licensing, white-label or both).",
                "enum": ["licensing", "whitelabel", "source_code", "combined"],
                "type": "string"
              },
              "exclusivity_requested": {
                "description": "true to ask for exclusivity.",
                "type": "boolean"
              },
              "geographic_scope": {
                "description": "Where the licence applies, e.g. \"worldwide\" or \"United States\".",
                "type": "string"
              },
              "listing": {
                "description": "Listing slug or id, e.g. \"textback\".",
                "type": "string"
              },
              "message": {
                "description": "What you need and why; shown to the seller.",
                "type": "string"
              },
              "payment_structure": {
                "default": "one_time",
                "description": "How the amount is paid.",
                "enum": ["one_time", "monthly", "annual", "revenue_share"],
                "type": "string"
              },
              "payment_terms": {
                "description": "Payment terms, e.g. \"50% upfront, 50% on launch\".",
                "type": "string"
              },
              "timeline": {
                "description": "When you need it, e.g. \"within 1 month\".",
