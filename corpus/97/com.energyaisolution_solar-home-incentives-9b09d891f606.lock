          "description": "Instant Energy Node Score (0–100 across 7 axes: efficiency, electrification, renewable generation, storage/resilience, financial optimization, carbon, market readiness) plus the single highest-leverage next action, from whatever property facts you have. More inputs → tighter score. Inputs: zipCode, country, propertyType, serviceType, monthlyBillRange, monthlyBillUsd, heatingFuel, roofAge, evType, backupNeed, outageConcern, electricalPanelSize. Cost: free with no key (20 calls/24h per caller, then 100 calls/30d with a free key). Example: {\"zipCode\":\"59715\",\"serviceType\":\"heat_pump\",\"monthlyBillRange\":\"150_250\"} [20 anonymous calls/caller/24h; then 100 free calls/key/30d; active Builder required for sustained informational use]",
