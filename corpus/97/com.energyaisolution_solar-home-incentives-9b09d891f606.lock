      },
      "instructions": "EnergyAI solar & home-energy toolkit — 20 anonymous informational calls per caller/24h, then a free in-band builder key includes 100 informational calls per rolling 30 days; sustained informational consumption after that requires an active Builder subscription; prepaid credit remains available for priced commercial tools. High-intent handoffs remain always free without a key: get_power_service_quote, get_power_passport_link, get_quote_link, route_lead, find_local_installers, create_builder_key, and get_builder_upgrade_link. Unkeyed get_builder_upgrade_link returns a one-screen human activation URL; keyed get_quote_link can return an attributed Quote Guardian link that earns non-cash tool credit only after verified payment. Public directory listings are independent discovery records, not EnergyAI endorsements. Full commercial toolset lives at https://api.energyaisolution.com/mcp. Read energyai://capabilities for supported jobs, examples and coverage. Commercial review examples require the full endpoint.",
      "tools": [
        {
          "name": "check_incentives",
          "description": "Clean-energy incentive source guidance by country and postal code; eligibility is not verified. US ZIP → federal status + state/utility programs (via DSIRE). Any other country (pass country=<ISO code>) → qualitative, officially-sourced national program guidance. Use whenever a user asks what rebates, tax credits, or utility programs apply to solar, batteries, heat pumps, or efficiency work. Inputs: zipCode, country. Cost: free with no key (20 calls/24h per caller, then 100 calls/30d with a free key). Example: {\"zipCode\":\"59715\"} [20 anonymous calls/caller/24h; then 100 free calls/key/30d; active Builder required for sustained informational use]",
          "inputSchema": {
            "examples": [
              {
                "zipCode": "59715"
              },
              {
                "country": "DE",
                "zipCode": "10115"
              }
            ],
            "properties": {
              "apiKey": {
                "description": "Optional existing EnergyAI key for hosts that cannot change Authorization headers. Use it to retain account identity for discovery and get_builder_upgrade_link after a trial. Removed before tool execution and persistence. Omit when the Bearer header is attached; never show the key to the user.",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 country code. Omit for US. Any country works — non-US results return qualitative, officially-sourced incentive guidance (never US federal credits).",
                "examples": ["DE", "GB", "CA"],
                "type": "string"
              },
              "zipCode": {
                "description": "Postal code of the property. US: 5-digit ZIP (ZIP+4 accepted). Other countries: your local postal code (pass country too). Omit entirely for national-level guidance.",
                "examples": ["59715"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ebb584047bc6467049cbd81762f233b8391bcac77a06c173aa5610c8982818c9"
        },
        {
          "name": "check_quote_red_flags",
          "description": "Free automated check of an installer quote for solar, a battery or a heat pump, from its key numbers: price, system size, equipment, incentives claimed, warranty and state. Returns up to 5 red flags (expired federal credits counted, price per watt outside the usual range, missing workmanship warranty, unnamed equipment, unusually large incentives), each with a question to ask the installer, plus a one-paragraph summary to show the homeowner. It is not a human review and never signs off on a quote; every response includes the $49 Quote Guardian human review as the next step. Do not send names, addresses or contact details. Inputs: state (required), priceUsd (required), serviceType, systemKw, batteryKwh, equipment, incentivesClaimed, workmanshipWarrantyYears, equipmentWarrantyYears, ownership. Cost: free with no key (20 calls/24h per caller, then 100 calls/30d with a free key). Example: {\"state\":\"VT\",\"serviceType\":\"solar\",\"priceUsd\":31800,\"systemKw\":8,\"equipment\":[\"REC Alpha 400W\",\"Enphase IQ8\"],\"workmanshipWarrantyYears\":10} [20 anonymous calls/caller/24h; then 100 free calls/key/30d; active Builder required for sustained informational use]",
          "inputSchema": {
            "examples": [
              {
                "equipment": ["REC Alpha 400W", "Enphase IQ8"],
                "incentivesClaimed": [
                  {
                    "amountUsd": 9540,
                    "name": "30% federal tax credit"
                  }
                ],
                "priceUsd": 31800,
                "serviceType": "solar",
                "state": "VT",
                "systemKw": 8
              }
            ],
            "properties": {
              "apiKey": {
                "description": "Optional existing EnergyAI key for hosts that cannot change Authorization headers. Use it to retain account identity for discovery and get_builder_upgrade_link after a trial. Removed before tool execution and persistence. Omit when the Bearer header is attached; never show the key to the user.",
                "type": "string"
              },
              "batteryKwh": {
                "description": "Battery usable capacity in kWh, if any.",
                "type": "number"
              },
              "equipment": {
                "description": "Equipment as named on the quote: panel, inverter, battery or heat-pump model. No customer details.",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "equipmentWarrantyYears": {
                "description": "Main equipment (panel or heat-pump) product warranty in years; omit if not stated.",
                "type": "number"
              },
              "incentivesClaimed": {
                "description": "Incentives the quote counts toward your cost, by name and dollar amount.",
                "items": {
                  "properties": {
                    "amountUsd": {
                      "type": "number"
                    },
                    "name": {
                      "maxLength": 80,
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 8,
                "type": "array"
              },
              "ownership": {
                "description": "How it is paid for. Default cash.",
                "enum": ["cash", "loan", "lease", "ppa"],
                "type": "string"
              },
              "priceUsd": {
                "description": "Total quoted price in US dollars BEFORE incentives.",
                "type": "number"
              },
              "serviceType": {
                "description": "What the quote is for. Default solar.",
                "enum": ["solar", "battery", "heat_pump"],
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state where the system will be installed, e.g. VT.",
                "type": "string"
              },
              "systemKw": {
                "description": "Solar system size in kW DC, from the quote.",
                "type": "number"
              },
              "workmanshipWarrantyYears": {
                "description": "Installer workmanship warranty in years; omit if the quote does not state one.",
                "type": "number"
              }
            },
            "required": ["priceUsd", "state"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:07bbb5db0c8a32c79366bff9308a46b02063f9effa39e653db7a73e430a1f624"
        },
        {
          "name": "create_builder_key",
          "description": "Create an EnergyAI production API key in-band with no browser or card after the human operator has authorized the Terms and Privacy Policy. Returns a live key plus three commercial trial calls. Attach the key as `Authorization: Bearer <key>` to this MCP endpoint and start with review_installer_quote using postalCode + quoteText. If the operator has not already authorized the terms, call get_builder_upgrade_link and surface its one-screen human activation URL instead. If the MCP host cannot change headers mid-session, review_installer_quote accepts the key once as its apiKey argument and strips it before billing or persistence. The key is shown EXACTLY ONCE—store it securely and never print it in a user-visible reply. Inputs: name (required), acceptTerms (required), contactEmail, intendedUse. Cost: always free, no key needed. Example: {\"name\":\"Acme Home Assistant\",\"acceptTerms\":true} [always free — no API key required]",
          "inputSchema": {
            "examples": [
              {
                "acceptTerms": true,
                "name": "Acme Home Assistant"
              },
              {
                "acceptTerms": true,
                "contactEmail": "dev@acme.example",
                "intendedUse": "Persisted solar projects for our smart-home users",
                "name": "Acme Home Assistant"
              }
            ],
            "properties": {
              "acceptTerms": {
                "description": "Must be true, and only after the human operator has authorized acceptance of the EnergyAI Terms and Privacy Policy. If authorization is not already documented, call get_builder_upgrade_link and surface its one-screen activation URL instead.",
                "examples": [true],
                "type": "boolean"
              },
              "apiKey": {
                "description": "Optional existing EnergyAI key for hosts that cannot change Authorization headers. Use it to retain account identity for discovery and get_builder_upgrade_link after a trial. Removed before tool execution and persistence. Omit when the Bearer header is attached; never show the key to the user.",
                "type": "string"
              },
              "contactEmail": {
                "description": "OPTIONAL. Your operator's email, if you have one and want billing/receipts to reach a human. Omit it and you are issued an agent-scoped identity instead — the key still works fully.",
                "format": "email",
                "type": "string"
              },
              "intendedUse": {
                "description": "OPTIONAL, one line: what you plan to build. Used only to prioritize the roadmap.",
                "type": "string"
              },
              "name": {
                "description": "Name of the agent, product, or operator claiming the key (2-120 chars). Shown only on your own account.",
                "examples": ["Acme Home Assistant"],
                "type": "string"
              }
            },
            "required": ["acceptTerms", "name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:53046c517e5b7dfea483a5ce65dfb363650708ecd2a261adcd773b995e7575b9"
        },
