        {
          "name": "energy_forecast",
          "description": "Energy Odds (paper mode, free): the forecast logged in advance for a public EIA number and target date: median, 5/25/50/75/95% quantiles, probabilities above thresholds, model version, EIA inputs with timestamps, forecast_id and hash. Never computed on request: if nothing was logged it returns not_found. Status stays \"unproven\" until the series passes a published scoring gate. Statistical information only, not advice. [always free — no API key required]",
          "inputSchema": {
            "examples": [
              {
                "series": "us_crude_inventory_weekly",
                "target_date": "2026-11-13"
              },
              {
                "quantity": "high",
                "series": "henry_hub_weekly_range",
                "target_date": "2026-11-09",
                "thresholds": [3.5, 4]
              }
            ],
            "properties": {
              "apiKey": {
                "description": "Optional existing EnergyAI key for hosts that cannot change Authorization headers. Use it to retain account identity for discovery and get_builder_upgrade_link after a trial. Removed before tool execution and persistence. Omit when the Bearer header is attached; never show the key to the user.",
                "type": "string"
              },
              "caller_market_price": {
                "description": "Optional: a price you already have for \"above threshold\". Compared in this response only; never stored or logged.",
                "properties": {
                  "threshold": {
                    "type": "number"
                  },
                  "yes_price": {
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": ["threshold", "yes_price"],
                "type": "object"
              },
              "quantity": {
                "description": "Henry Hub only: 'high' or 'low'. Omit for both.",
                "type": "string"
              },
              "series": {
                "enum": ["us_retail_gasoline_weekly", "us_crude_inventory_weekly", "henry_hub_weekly_range"],
                "type": "string"
              },
              "target_date": {
                "description": "YYYY-MM-DD. Gasoline: the Monday of the EIA weekly price. Crude: the week-ending Friday. Henry Hub: the Monday starting the week. energy_calendar lists valid upcoming dates.",
                "examples": ["2026-11-09"],
                "type": "string"
              },
              "thresholds": {
                "description": "Optional values to get P(value > threshold) for, computed from the logged quantiles.",
                "items": {
                  "type": "number"
                },
                "maxItems": 50,
                "type": "array"
              }
            },
            "required": ["series", "target_date"],
            "type": "object"
