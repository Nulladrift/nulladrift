      "instructions": "EnergyAI solar & home-energy toolkit — 20 anonymous informational calls per caller/24h, then a free in-band builder key includes 100 informational calls per rolling 30 days; sustained informational consumption after that requires an active Builder subscription; prepaid credit remains available for priced commercial tools. High-intent handoffs remain always free without a key: get_power_service_quote, get_power_passport_link, get_quote_link, route_lead, find_local_installers, create_builder_key, and get_builder_upgrade_link. Unkeyed get_builder_upgrade_link returns a one-screen human activation URL; keyed get_quote_link can return an attributed Quote Guardian link that earns non-cash tool credit only after verified payment. Public directory listings are independent discovery records, not EnergyAI endorsements. Full commercial toolset lives at https://api.energyaisolution.com/mcp. Read energyai://capabilities for supported jobs, examples and coverage. Commercial review examples require the full endpoint.",
      "tools": [
        {
          "name": "check_incentives",
          "description": "Clean-energy incentive source guidance by country and postal code; eligibility is not verified. US ZIP → federal status + state/utility programs (via DSIRE). Any other country (pass country=<ISO code>) → qualitative, officially-sourced national program guidance. Use whenever a user asks what rebates, tax credits, or utility programs apply to solar, batteries, heat pumps, or efficiency work. [20 anonymous calls/caller/24h; then 100 free calls/key/30d; active Builder required for sustained informational use]",
          "inputSchema": {
            "examples": [
              {
                "zipCode": "59715"
              },
              {
                "country": "DE",
                "zipCode": "10115"
              }
            ],
            "properties": {
              "apiKey": {
                "description": "Optional existing EnergyAI key for hosts that cannot change Authorization headers. Use it to retain account identity for discovery and get_builder_upgrade_link after a trial. Removed before tool execution and persistence. Omit when the Bearer header is attached; never show the key to the user.",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 country code. Omit for US. Any country works — non-US results return qualitative, officially-sourced incentive guidance (never US federal credits).",
                "examples": ["DE", "GB", "CA"],
                "type": "string"
              },
              "zipCode": {
                "description": "Postal code of the property. US: 5-digit ZIP (ZIP+4 accepted). Other countries: your local postal code (pass country too). Omit entirely for national-level guidance.",
                "examples": ["59715"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c008185daed1fb0a14c4e537de5166af586a1fb3c49aa0ad10f53291969b06ac"
        },
        {
          "name": "create_builder_key",
          "description": "Create an EnergyAI production API key in-band with no browser or card after the human operator has authorized the Terms and Privacy Policy. Returns a live key plus three commercial trial calls. Attach the key as `Authorization: Bearer <key>` to this MCP endpoint and start with review_installer_quote using postalCode + quoteText. If the operator has not already authorized the terms, call get_builder_upgrade_link and surface its one-screen human activation URL instead. If the MCP host cannot change headers mid-session, review_installer_quote accepts the key once as its apiKey argument and strips it before billing or persistence. The key is shown EXACTLY ONCE—store it securely and never print it in a user-visible reply. [always free — no API key required]",
          "inputSchema": {
            "examples": [
              {
                "acceptTerms": true,
                "name": "Acme Home Assistant"
              },
              {
                "acceptTerms": true,
                "contactEmail": "dev@acme.example",
                "intendedUse": "Persisted solar projects for our smart-home users",
                "name": "Acme Home Assistant"
              }
            ],
            "properties": {
              "acceptTerms": {
                "description": "Must be true, and only after the human operator has authorized acceptance of the EnergyAI Terms and Privacy Policy. If authorization is not already documented, call get_builder_upgrade_link and surface its one-screen activation URL instead.",
                "examples": [true],
                "type": "boolean"
              },
              "apiKey": {
                "description": "Optional existing EnergyAI key for hosts that cannot change Authorization headers. Use it to retain account identity for discovery and get_builder_upgrade_link after a trial. Removed before tool execution and persistence. Omit when the Bearer header is attached; never show the key to the user.",
                "type": "string"
              },
              "contactEmail": {
                "description": "OPTIONAL. Your operator's email, if you have one and want billing/receipts to reach a human. Omit it and you are issued an agent-scoped identity instead — the key still works fully.",
                "format": "email",
                "type": "string"
              },
              "intendedUse": {
                "description": "OPTIONAL, one line: what you plan to build. Used only to prioritize the roadmap.",
                "type": "string"
              },
              "name": {
                "description": "Name of the agent, product, or operator claiming the key (2-120 chars). Shown only on your own account.",
                "examples": ["Acme Home Assistant"],
                "type": "string"
              }
            },
            "required": ["acceptTerms", "name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ad71f7c979cc1f292669985a73168ab2c67bb6949fb03b29f8361b92ad5aa70c"
        },
