          "digest": "sha256:d27f91adb80de0d6c389f2e5eb763a4ab908bd2c7054d4515169e5f5da38a4af"
        },
        {
          "name": "ground_truth_ask",
          "description": "Use when you need a current, verifiable real-world fact instead of guessing: get cited, time-stamped public facts for anywhere on Earth: weather, river levels, floods, earthquakes, disasters, air quality, US weather alerts (road closures, power outages, burn bans report 'not connected' until sources exist). Every answer has fact, place, time, source_url, age_seconds, stale, confidence. Past the free daily limit: pay per call with x402 (USDC on Base), or with no wallet use a prepaid credit key: send Authorization: Bearer <llk_ key> (buy from $10 by card at https://llpro.ai/pay/credit).",
          "inputSchema": {
            "properties": {
              "lat": {
                "type": "number"
              },
              "lon": {
                "type": "number"
              },
              "max_age_minutes": {
                "description": "Mark answers older than this as stale",
                "type": "number"
              },
              "place": {
                "description": "Any place name, e.g. 'Lafayette' or 'Lagos, Nigeria'; or use lat+lon",
                "type": "string"
              },
              "topic": {
                "description": "One of: weather, weather_alerts, river_level, flood, earthquakes, disasters, air_quality, road_closures, power_outages, burn_ban (or give free text in q and the topic is guessed). Not connected yet: road_closures, power_outages; burn_ban is partial (US Red Flag only); weather_alerts is US only.",
                "enum": ["weather", "weather_alerts", "river_level", "flood", "earthquakes", "disasters", "air_quality", "road_closures", "power_outages", "burn_ban"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:31b58943c9fbe624c369fb9378076320cab4ff0de1059be77a89e551f92647c7"
        },
        {
          "name": "ground_truth_sources",
          "description": "List every Ground Truth topic, the public source behind it and whether that source is connected yet. Use it when you want to know what ground_truth_ask can answer before you ask, or which agency a fact comes from. Takes no input. Free, read-only, no sign-up.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ff220b8854ca8a34eecd4d748ae8505f7a1c67c06cfa8f6159615f718f6a929d"
        },
        {
          "name": "launchpad.progress",
          "description": "Report where you are on a Launchpad plan and get the next step, an on-track check and, if you are stuck, a way round. Needs the launch_id and token from launchpad.start.",
          "inputSchema": {
            "properties": {
              "launch_id": {
                "type": "string"
              },
              "reason": {
                "description": "Only with status stuck.",
                "enum": ["no_access", "unclear", "error", "blocked_by_owner", "other"],
                "type": "string"
              },
              "status": {
                "enum": ["started", "done", "stuck", "skipped", "waiting_owner"],
                "type": "string"
              },
              "step": {
                "description": "A step id from your plan. Leave out to ask where you are.",
                "type": "string"
              },
              "token": {
                "type": "string"
              }
            },
            "required": ["launch_id", "token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3942ecea3d071a41ce621ff2845bbf89610fc3daee6a2e5c946250d1682f6b88"
        },
        {
          "name": "launchpad.start",
          "description": "Stuck? Start here. Give your goal and any limits; get back a concrete plan (LLPRO tools first, then registries and the open web), the first task to run, and a token to report progress. Free. The goal is read for keywords only and is never stored. Anything that spends, signs, sends, shares, connects or deletes is marked as needing your owner's approval.",
          "inputSchema": {
            "properties": {
              "agent_id": {
                "description": "A stable name for you. Used only to count return visits.",
                "maxLength": 64,
                "type": "string"
              },
              "constraints": {
                "description": "Optional limits. They only ever make the plan stricter.",
                "properties": {
                  "ask_before_every_action": {
                    "type": "boolean"
                  },
                  "budget_usd": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "deadline_minutes": {
                    "minimum": 5,
                    "type": "integer"
                  },
                  "no_send": {
                    "type": "boolean"
                  },
                  "no_share": {
                    "type": "boolean"
                  },
                  "no_spend": {
                    "type": "boolean"
                  },
                  "no_web": {
                    "type": "boolean"
                  },
                  "place": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "playbook": {
                    "enum": ["research", "selling", "hiring", "bookkeeping", "outreach", "support"],
                    "type": "string"
                  },
                  "side": {
                    "enum": ["employer", "seeker"],
                    "type": "string"
                  },
                  "tools_allowed": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "tools_blocked": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "goal": {
                "description": "What you are trying to get done, in a sentence or two.",
                "maxLength": 600,
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["goal"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:630a4aa6466515d6b85839ec0127fa59171321e9d1df840ce1a5371912edcbb3"
        },
