{
  "lockfileVersion": 2,
  "subjects": {
    "ai.llpro.gt/ground-truth-worldwide": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://gt.llpro.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "ground-truth-worldwide",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "feedback_submit",
          "title": "Send feedback to LLPRO",
          "description": "Tell LLPRO what failed, what was missing or what would improve this service. Read daily by the service owner and turned into a fix or an answer; shipped ideas are credited on https://llpro.ai/changelog and earn a contributor mark on Agent Record. Not for support requests that need a reply: write support@llpro.ai for those. Do not send secrets.",
          "inputSchema": {
            "properties": {
              "credit": {
                "description": "Default true: credit your agent id on the changelog if the idea ships. Send false to opt out.",
                "type": "boolean"
              },
              "message": {
                "description": "Anything else, in your own words.",
                "type": "string"
              },
              "rating": {
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "tool": {
                "description": "Which tool or endpoint this is about.",
                "type": "string"
              },
              "what_failed": {
                "description": "What did not work, and the call that failed (tool, arguments, what you expected).",
                "type": "string"
              },
              "what_missing": {
                "description": "What you needed and could not get.",
                "type": "string"
              },
              "what_would_improve": {
                "description": "One concrete change that would make this better.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Send feedback to LLPRO"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:85aff0465104fb90836c05f0f59e9dc3c26a6b60bfb8a8b7726e4ce9234c6b7f"
        },
        {
          "name": "ground_truth_ask",
          "title": "Ask a public fact",
          "description": "Use when you need a current, verifiable real-world fact instead of guessing: get cited, time-stamped public facts for anywhere on Earth: weather, river levels, floods, earthquakes, disasters, air quality, US weather alerts (road closures, power outages, burn bans report 'not connected' until sources exist). Every answer has fact, place, time, source_url, age_seconds, stale, confidence. Free daily quota; credit keys from $1 at llpro.ai/pay/credit; x402 accepted. Send the key as Authorization: Bearer <llk_ key>. We charge only while this tool passes today's known-answer test; in testing it answers free.",
          "inputSchema": {
            "properties": {
              "lat": {
                "type": "number"
              },
              "lon": {
                "type": "number"
              },
              "max_age_minutes": {
                "description": "Mark answers older than this as stale",
                "type": "number"
              },
              "place": {
                "description": "Any place name, e.g. 'Lafayette' or 'Lagos, Nigeria'; or use lat+lon",
                "type": "string"
              },
              "topic": {
                "description": "One of: weather, weather_alerts, river_level, flood, earthquakes, disasters, air_quality, road_closures, power_outages, burn_ban (or give free text in q and the topic is guessed). Not connected yet: road_closures, power_outages; burn_ban is partial (US Red Flag only); weather_alerts is US only.",
                "enum": ["weather", "weather_alerts", "river_level", "flood", "earthquakes", "disasters", "air_quality", "road_closures", "power_outages", "burn_ban"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Ask a public fact"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:95c73a1936a666f074634f42211bf8f54aaf25a99612ee8d1eb57aa8b4721623"
        },
        {
          "name": "ground_truth_sources",
          "title": "List fact topics and sources",
          "description": "List every Ground Truth topic, the public source behind it and whether that source is connected yet. Use it when you want to know what ground_truth_ask can answer before you ask, or which agency a fact comes from. Takes no input. Free, read-only, no sign-up.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List fact topics and sources"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b33bbab0a1e059ba296d0df996a749acfbeb24107ee3c147ff89edd437aeb447"
        },
        {
          "name": "launchpad_progress",
          "title": "Report progress on a plan",
          "description": "Report where you are on a Launchpad plan and get the next step, an on-track check and, if you are stuck, a way round. Needs the launch_id and token from launchpad.start.",
          "inputSchema": {
            "properties": {
              "launch_id": {
                "type": "string"
              },
              "reason": {
                "description": "Only with status stuck.",
                "enum": ["no_access", "unclear", "error", "blocked_by_owner", "other"],
                "type": "string"
              },
              "status": {
                "enum": ["started", "done", "stuck", "skipped", "waiting_owner"],
                "type": "string"
              },
              "step": {
                "description": "A step id from your plan. Leave out to ask where you are.",
                "type": "string"
              },
              "token": {
                "type": "string"
              }
            },
            "required": ["launch_id", "token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Report progress on a plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:07ccea9d64fdb472259d535e6ea71a2d2d4cc68451b09d82978791898435b990"
        },
        {
          "name": "launchpad_start",
          "title": "Plan a goal with several steps",
          "description": "Stuck? Start here. Give your goal and any limits; get back a concrete plan (LLPRO tools first, then registries and the open web), the first task to run, and a token to report progress. Free. The goal is read for keywords only and is never stored. Anything that spends, signs, sends, shares, connects or deletes is marked as needing your owner's approval.",
          "inputSchema": {
            "properties": {
              "agent_id": {
                "description": "A stable name for you. Used only to count return visits.",
                "maxLength": 64,
                "type": "string"
              },
              "constraints": {
                "description": "Optional limits. They only ever make the plan stricter.",
                "properties": {
                  "ask_before_every_action": {
                    "type": "boolean"
                  },
                  "budget_usd": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "deadline_minutes": {
                    "minimum": 5,
                    "type": "integer"
                  },
                  "no_send": {
                    "type": "boolean"
                  },
                  "no_share": {
                    "type": "boolean"
                  },
                  "no_spend": {
                    "type": "boolean"
                  },
                  "no_web": {
                    "type": "boolean"
                  },
                  "place": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "playbook": {
                    "enum": ["research", "selling", "hiring", "bookkeeping", "outreach", "support"],
                    "type": "string"
                  },
                  "side": {
                    "enum": ["employer", "seeker"],
                    "type": "string"
                  },
                  "tools_allowed": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "tools_blocked": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "goal": {
                "description": "What you are trying to get done, in a sentence or two.",
                "maxLength": 600,
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["goal"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Plan a goal with several steps"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:c7a08553f056ec2efb6317c63f15a620dbd15d144c52aed54594d3fe0c3a6e3d"
        }
      ],
      "digest": "sha256:9afcde0a7457e74c94d436c7c30341bc9e12738d55b6f38e1590ca6557dbedc7"
    }
  }
}
