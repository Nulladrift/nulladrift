        {
          "name": "media_pipeline",
          "title": "Media Upload, Auto-Fit Video & Clip Pipeline",
          "description": "Execute media ingestion, zero-egress storage uploads, automatic multi-aspect-ratio video reframing (`9:16`, `16:9`, `1:1`, `4:5`), viral short clip extraction with burned-in captions, and AI visual asset generation (`media_generate`). For files around 100 MB or larger (including a 579048031-byte original MP4), use `multipart_create` → PUT each part to the returned URLs (direct to R2) → `multipart_complete`. Do not send the whole file through `presign_upload` PUT or Cloudflare returns HTTP 413. `check_status` is ready only when the object bytes exist in storage. Use this tool before `posts_publish` whenever a campaign requires uploading video/image files or converting a single landscape video into vertical Reels, TikToks, and YouTube Shorts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "Media pipeline operation: 'presign_upload' creates a signed Worker PUT URL (files ≲90 MB; larger hit Cloudflare 413), 'upload_base64' uploads inline (max 20 MB), 'multipart_create' starts R2 multipart for large originals (e.g. 579048031 bytes → 64 MiB × 9 parts), 'multipart_sign_part' returns per-part PUT URLs (direct to R2 when S3 tokens are set), 'multipart_complete' verifies size/checksum and marks ready only when the object exists, 'multipart_abort' cancels, 'auto_fit_video' reframes, 'extract_clips' cuts highlights, 'media_generate' renders from a prompt, 'check_status' reports ready only when stored bytes exist.",
                "enum": ["presign_upload", "upload_base64", "multipart_create", "multipart_sign_part", "multipart_complete", "multipart_abort", "auto_fit_video", "extract_clips", "media_generate", "check_status"],
                "type": "string"
              },
              "checksum": {
                "description": "Optional SHA-256 hex of the original file. Verified on complete when R2 exposes a checksum.",
                "type": "string"
              },
              "clipCount": {
                "default": 3,
                "description": "Number of short highlight clips (1 to 10) to extract from a long-form source video when `action` is 'extract_clips'.",
                "type": "number"
              },
              "contentType": {
                "description": "MIME type for 'upload_base64' (alias of mimeType), e.g. 'image/jpeg'.",
                "type": "string"
              },
              "dataBase64": {
                "description": "Base64-encoded file bytes for 'upload_base64' (max 20 MB decoded).",
                "type": "string"
              },
              "fileName": {
                "description": "Original file name with extension (e.g. 'keynote-demo.mp4' or 'launch-carousel.png') when requesting a presigned upload URL.",
                "type": "string"
              },
              "mediaAssetId": {
                "description": "Existing media asset identifier (`med_...`) to reframe, extract clips from, or inspect status.",
                "type": "string"
              },
              "mimeType": {
                "default": "video/mp4",
                "description": "MIME type of the media asset being uploaded or generated (e.g. 'video/mp4', 'image/png', 'image/jpeg', 'image/svg+xml').",
                "type": "string"
              },
              "partNumber": {
                "description": "Single part number alternative to partNumbers.",
                "type": "number"
              },
              "partNumbers": {
                "description": "Part numbers to sign (1-based). For a 579048031-byte file at 64 MiB parts use [1,2,3,4,5,6,7,8,9]. Omit to sign every planned part.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "partSizeBytes": {
                "description": "Optional part size in bytes (default 67108864 / 64 MiB). Must be ≥ 5242880 for multi-part objects.",
                "type": "number"
              },
              "parts": {
                "description": "Uploaded parts with ETags from each part PUT, required for 'multipart_complete'.",
                "items": {
                  "properties": {
                    "etag": {
                      "type": "string"
                    },
                    "partNumber": {
                      "type": "number"
                    }
                  },
                  "required": ["etag", "partNumber"],
                  "type": "object"
                },
                "type": "array"
              },
              "profileId": {
                "default": "prof_allometrik",
                "description": "Brand profile identifier (`prof_...`) that owns the media asset.",
                "type": "string"
              },
              "prompt": {
                "description": "Creative prompt or visual template instructions when running `action: 'media_generate'` (e.g. 'Minimalist B2B architecture diagram for MCP server launch').",
                "type": "string"
              },
              "sha256": {
                "description": "Alias of checksum.",
                "type": "string"
              },
              "sizeBytes": {
                "default": 10485760,
                "description": "File size in bytes used to validate upload quotas and allocate storage buffers.",
                "type": "number"
              },
              "targetAspectRatios": {
                "default": ["9:16", "16:9"],
                "description": "Target aspect ratios for automatic video/image reframing: '9:16' (Reels/TikTok/Shorts), '16:9' (X/LinkedIn/YouTube), '1:1' (Square), '4:5' (Portrait Feed).",
                "items": {
                  "enum": ["9:16", "16:9", "1:1", "4:5"],
                  "type": "string"
                },
                "type": "array"
              },
              "uploadId": {
                "description": "R2 multipart upload id returned by 'multipart_create'.",
                "type": "string"
              }
            },
            "required": ["action"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Media Upload, Auto-Fit Video & Clip Pipeline"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
