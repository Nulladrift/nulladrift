        {
          "name": "posts_manage",
          "title": "Manage Scheduled & Published Social Posts",
          "description": "List, inspect, update, mutate, delete, or retry scheduled, queued, and published social media posts stored in Nuntior Cloud — including live real-time YouTube video/Short title and hashtag/tag updates via YouTube Data API v3 (`PUT /youtube/v3/videos?part=snippet`) while keeping the existing description 100% intact unless `content` is explicitly changed, and custom YouTube thumbnail updates via `POST /upload/youtube/v3/thumbnails/set` (`thumbnailMediaAssetId` / `thumbnailUrl`) that do not rewrite title, description, or tags. Also tracks 72h hook iteration metadata (`rewriteCount`, `hookHistory`, `lastViewCount`, `iterationStatus`, `lessonsLearned`).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "Post management operation: 'list' posts (optionally filtered by status), 'get' a single post by `postId` or `externalPostId` (with live YouTube view/like/comment counts and age in hours), 'update' / 'mutate' post content, YouTube title/tags, YouTube custom thumbnail, or schedule time, 'delete' a post, or 'retry_failed' to re-dispatch failed deliveries.",
                "enum": ["list", "get", "update", "mutate", "reschedule", "delete", "cancel", "retry_failed", "process_due"],
                "type": "string"
              },
              "content": {
                "description": "Updated post text content or video description when executing `action: 'update'` or `'mutate'` (omit to keep the existing YouTube description 100% intact).",
                "type": "string"
              },
              "externalPostId": {
                "description": "Optional native platform video/post ID (e.g. YouTube `videoId`) to inspect or update directly on the platform even if originally uploaded outside Nuntior.",
                "type": "string"
              },
              "hookStyle": {
                "description": "Optional hook rotation label ('opinion', 'data', 'question') tracked in `hookHistory` (with `rewriteCount` incremented automatically).",
                "type": "string"
              },
              "iterationStatus": {
                "description": "Optional iteration loop status ('active', 'thriving', 'closed').",
                "enum": ["active", "thriving", "closed"],
                "type": "string"
              },
              "lesson": {
                "description": "Optional performance lesson note saved on the post when closing an iteration loop.",
                "type": "string"
              },
              "postId": {
                "description": "Unique post identifier (`post_...`). Required when `action` is 'get', 'update', 'mutate', or 'delete' unless `externalPostId` is provided.",
                "type": "string"
              },
              "preserveDescription": {
                "default": true,
                "description": "Keep the original description untouched when updating a published video's title/tags (default `true` when `title` is provided without `content`).",
                "type": "boolean"
              },
              "profileId": {
                "default": "prof_allometrik",
                "description": "Brand profile identifier (`prof_...`) used to scope the post query or mutation.",
                "type": "string"
              },
              "scheduledFor": {
                "description": "Updated ISO-8601 publication timestamp when rescheduling a post via `action: 'update'`.",
                "type": "string"
              },
              "statusFilter": {
                "description": "Optional status filter when listing posts (e.g. 'published', 'scheduled', 'queued', 'failed', 'draft').",
                "type": "string"
              },
              "tags": {
                "description": "Updated hashtags/tags for the post or video.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "thumbnailMediaAssetId": {
                "description": "Nuntior image media asset (`med_...`) to set as the custom thumbnail on a published YouTube video via `POST /upload/youtube/v3/thumbnails/set`. Preferred over `thumbnailUrl`. Does not call `videos.update` and does not alter title, description, or tags unless those fields are also passed. Requires a connected YouTube channel with upload scope. Channel must be verified for custom thumbnails.",
                "type": "string"
              },
              "thumbnailUrl": {
                "description": "Public image URL (JPEG/PNG/GIF/BMP/WebP) to set as the custom thumbnail on a published YouTube video via `thumbnails.set`. Prefer `thumbnailMediaAssetId` when the file is already in Nuntior `/media`. Same no-snippet-rewrite contract as `thumbnailMediaAssetId`.",
                "type": "string"
              },
              "title": {
                "description": "Updated video/post title (e.g., for YouTube Shorts title & hook iteration while keeping the description intact).",
                "type": "string"
              }
            },
            "required": ["action"],
            "type": "object"
          },
