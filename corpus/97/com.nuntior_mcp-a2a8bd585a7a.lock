              "query": {
                "description": "Search keyword, brand name, competitor handle, or buyer-intent phrase when running live `action: 'social_listen'` (e.g. 'MCP server social media API' or 'n8n AI agent workflow').",
                "type": "string"
              }
            },
            "required": ["action"],
