        {
          "name": "blogs_publish",
          "title": "Publish Canonical Blog Articles & Syndication",
          "description": "Publish or update long-form Markdown SEO articles directly to the hosted Nuntior Live Reader (`https://nuntior.com/p/:slug`), Ghost CMS, WordPress, Webflow, Dev.to, Medium, or Hashnode. Use this tool for canonical content-first workflows: publish the full technical article first to get a live canonical URL, then pass that URL into `posts_publish` with `xLinkStrategy: 'first_reply'` to share it across every connected social network. Returns the live `articleId`, `slug`, public `url`, `blogMirrorUrl`, and publication timestamp.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "CMS blog operation: 'list_sites' returns connected blog publications and existing articles, 'publish_article' publishes a new Markdown article, and 'update_article' edits an existing article by slug or ID.",
                "enum": ["list_sites", "publish_article", "update_article"],
                "type": "string"
              },
              "articleId": {
                "description": "Existing article identifier (`art_...`) when updating an article via `action: 'update_article'`.",
                "type": "string"
              },
              "canonicalUrl": {
                "description": "Optional canonical URL (`<link rel=\"canonical\">`) when cross-syndicating an existing blog post to Dev.to, Medium, or Hashnode.",
                "type": "string"
              },
              "markdownBody": {
                "description": "Complete long-form article body formatted in standard Markdown (supports headings, code blocks, tables, and links).",
                "type": "string"
              },
              "platform": {
                "default": "nuntior",
                "description": "Destination blog or CMS engine: 'nuntior' (instant hosted reader at nuntior.com/p/:slug), 'ghost', 'wordpress', 'webflow', 'devto', 'medium', or 'hashnode'.",
                "enum": ["ghost", "wordpress", "webflow", "nuntior", "devto", "medium", "hashnode"],
                "type": "string"
              },
              "profileId": {
                "default": "prof_allometrik",
                "description": "Brand profile identifier (`prof_...`) credited as the publication author.",
                "type": "string"
              },
              "publishStatus": {
                "default": "published",
                "description": "Publication visibility state: 'published' makes the article immediately live; 'draft' stages it for review.",
