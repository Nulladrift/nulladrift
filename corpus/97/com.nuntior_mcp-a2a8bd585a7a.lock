        {
          "name": "account_register",
          "title": "Register Agent Account & Workspace",
          "description": "Provision a new Nuntior user account, multi-tenant workspace, default brand profile, and live Bearer API key (`ntr_live_...`) in one zero-browser call. Use this tool when an AI agent or developer needs to onboard from scratch without opening a web browser first. Returns the newly created `userId`, `workspaceId`, `defaultProfileId`, live `apiKey`, and a 1-click `claimUrl` so a human owner can optionally claim the workspace in the web console (`https://nuntior.com/app`). If the email already exists, returns a fresh session key for that workspace.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agentHarness": {
                "default": "grok-bot",
                "description": "Identifier of the calling AI agent harness or MCP client (e.g. 'grok-bot', 'cursor', 'claude-code', 'n8n', 'openclaw', 'windsurf') for telemetry attribution.",
                "type": "string"
              },
              "email": {
                "description": "Owner or developer email address used to identify the Nuntior account and receive workspace claim notifications (e.g. 'founder@company.com').",
                "type": "string"
              },
              "name": {
                "description": "Display name for the human owner or autonomous agent operator (e.g. 'Alex Rivera' or 'Growth Agent').",
                "type": "string"
              },
              "organizationName": {
                "description": "Organization, agency, or workspace name used to label the multi-tenant workspace and default brand profile.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Register Agent Account & Workspace"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ec6c91d5f12957ebc6bd4fabb449fb18754e35314e961ed13d9513ad9a660cad"
        },
        {
          "name": "account_status",
          "title": "Inspect Account Status & Plan Quotas",
          "description": "Inspect the authenticated workspace's subscription tier (`free`, `starter`, `builder`, `scale`), active social account connections versus plan quota limits (3, 12, 35, or 100), monthly posts published, API key prefix, Stripe billing status, and connected brand profiles. Use this read-only diagnostic tool before connecting new social accounts or publishing high-volume campaigns to verify quota availability and account readiness. Returns a structured summary object containing `workspace`, `planLimits`, `usage`, `billing`, `profiles`, and `connectedAccounts`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "apiKey": {
                "description": "Optional Nuntior Bearer API key (`ntr_live_...`) override when not supplied via the HTTP `Authorization` header.",
                "type": "string"
              },
              "workspaceId": {
                "description": "Optional workspace identifier (`ws_...`) to inspect a specific tenant workspace when managing multiple workspaces.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Inspect Account Status & Plan Quotas"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fd569266b9510084d1bd061f89fced16196bcf19ccb7a59d3c9cc9bb1365ce80"
        },
        {
          "name": "accounts_manage",
          "title": "Manage Social OAuth & BYOK Accounts",
          "description": "List connected social accounts, initiate 1-click Managed OAuth 2.0 flows (`connect_oauth`), vault custom Bring-Your-Own-Keys (`connect_byok`) with zero markup and AES-256-GCM encryption, run live upstream API token health checks (`account_health`), or disconnect accounts across 18+ platforms. Use this tool whenever you need to link a new social network, verify OAuth token validity and latency, or inspect which platforms are ready for publishing. To reauthorize an existing connection (revoked refresh token, YouTube 401) without using a new plan seat, call connect_oauth with that account's `accountId` (and matching `platform`); example: accounts_manage({ action: \"connect_oauth\", platform: \"youtube\", accountId: \"acc_youtube_718c0d\", profileId: \"<profile>\" }) returns authorizationUrl even at Free 2/2. New connections still return a structured `PLAN_CONNECTION_LIMIT_REACHED` upgrade prompt when the workspace quota is full.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accessToken": {
                "description": "BYOK OAuth 2.0 Bearer access token, OAuth 1.0a access token, Telegram Bot token, or Discord Webhook URL encrypted at rest.",
                "type": "string"
              },
              "accountId": {
                "description": "Connected social account identifier (e.g. 'acc_youtube_718c0d'). Required when `action` is 'disconnect' and optional filter for 'account_health'. For `connect_oauth`, pass the existing account id to reauthorize that connection (refresh a revoked token) in the same workspace; this does not consume a new plan seat. The account must belong to the authenticated workspace and `platform` (if passed) must match.",
                "type": "string"
              },
              "action": {
                "description": "Account operation: 'list' connected accounts, 'connect_oauth' to get a 1-click OAuth 2.0 authorization URL (pass accountId to reauthorize an existing connection without consuming a new plan seat), 'connect_byok' to store custom API keys/tokens encrypted with AES-256-GCM ($0 markup), 'account_health'/'health_check' to verify live upstream token validity, or 'disconnect' to remove an account.",
                "enum": ["list", "connect_oauth", "connect_byok", "health_check", "account_health", "disconnect"],
                "type": "string"
              },
              "customClientId": {
                "description": "BYOK OAuth App Client ID, API Key, Bot ID, or Bluesky identifier encrypted at rest with AES-256-GCM in the Nuntior Vault (0% platform markup).",
                "type": "string"
              },
              "customClientSecret": {
                "description": "BYOK OAuth App Client Secret, API Key Secret, or Bluesky App Password encrypted at rest with AES-256-GCM in the Nuntior Vault.",
                "type": "string"
              },
              "platform": {
                "description": "Target social, blog, or messaging platform slug (e.g. 'x', 'linkedin', 'bluesky', 'instagram', 'threads', 'youtube', 'tiktok', 'reddit'). Required for 'connect_oauth' and 'connect_byok'.",
                "enum": ["x", "linkedin", "bluesky", "instagram", "facebook", "threads", "tiktok", "youtube", "reddit", "pinterest", "mastodon", "telegram", "discord", "google_business", "ghost", "wordpress", "webflow", "whatsapp"],
                "type": "string"
              },
              "profileId": {
                "description": "Brand profile identifier (e.g. 'prof_allometrik') that owns or filters the social account connections.",
                "type": "string"
              },
              "refreshToken": {
                "description": "Optional OAuth 2.0 refresh token or OAuth 1.0a access token secret used for automatic token rotation and health recovery.",
                "type": "string"
              },
              "returnClientId": {
                "description": "connect_oauth: your DCR OAuth client_id, used to allowlist an https returnTo.",
                "type": "string"
              },
              "returnTo": {
                "description": "connect_oauth: where to send the user after connecting (relative path, agent deep link like cursor://, or an https origin registered in your OAuth client redirect_uris).",
                "type": "string"
              },
              "username": {
                "description": "Account handle, username, Bluesky ATProto handle (e.g. 'brand.bsky.social'), or Mastodon instance handle associated with the social account.",
                "type": "string"
              }
            },
            "required": ["action"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Manage Social OAuth & BYOK Accounts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ee81dd72101963ad71c2762c5666e368ccfcf7b9243e790fe058fda74030d67e"
        },
        {
          "name": "ads_campaigns",
          "title": "Paid Social Ad Campaigns & Post Boosting",
          "description": "Create, list, pause, resume, inspect metrics, or boost organic posts into paid social ad campaigns across LinkedIn Ads, X Ads, Meta (Facebook/Instagram) Ads, and TikTok Spark Ads with 0% Nuntior ad-spend commission. Use this tool when an organic post performs strongly and should be amplified to a targeted B2B or consumer audience with a controlled daily budget. Returns campaign configuration, status, targeting parameters, and real-time spend/conversion snapshots.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "Paid ads operation: 'list' campaigns, 'create' a new campaign, 'boost_post' to turn an existing organic post into a paid ad, 'pause' or 'resume' delivery, or fetch 'metrics'.",
                "enum": ["list", "create", "pause", "resume", "boost_post", "metrics"],
                "type": "string"
              },
              "campaignId": {
                "description": "Ad campaign identifier (`camp_...`). Required when pausing, resuming, or querying a specific campaign.",
                "type": "string"
              },
              "dailyBudgetUsd": {
                "default": 25,
                "description": "Daily ad spend cap in USD (e.g. 25 for $25/day). Nuntior charges 0% markup on ad spend.",
                "type": "number"
              },
              "name": {
                "description": "Human-readable campaign name (e.g. 'Q4 AI Agent Launch — LinkedIn Sponsored Update').",
                "type": "string"
              },
              "objective": {
                "default": "leads",
                "description": "Campaign optimization objective: 'leads' (lead gen forms/signups), 'traffic' (website clicks), 'engagement' (likes/replies), or 'awareness' (reach/impressions).",
                "enum": ["engagement", "traffic", "leads", "awareness"],
                "type": "string"
              },
              "platform": {
                "default": "linkedin",
                "description": "Target ad network platform (e.g. 'linkedin', 'x', 'facebook', 'instagram', 'tiktok').",
                "enum": ["x", "linkedin", "bluesky", "instagram", "facebook", "threads", "tiktok", "youtube", "reddit", "pinterest", "mastodon", "telegram", "discord", "google_business", "ghost", "wordpress", "webflow", "whatsapp"],
                "type": "string"
              },
              "postIdToBoost": {
                "description": "Existing Nuntior organic post ID (`post_...`) to promote when `action` is 'boost_post'.",
                "type": "string"
              },
              "profileId": {
                "default": "prof_allometrik",
                "description": "Brand profile identifier (`prof_...`) linked to the ad account.",
                "type": "string"
              },
              "targeting": {
                "description": "Structured audience targeting criteria such as countries, job titles, industries, or interest keywords (e.g. `{ \"countries\": [\"US\", \"AE\", \"ES\"], \"titles\": [\"CTO\", \"Founder\"] }`).",
                "type": "object"
              }
            },
            "required": ["action"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Paid Social Ad Campaigns & Post Boosting"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e8ba7f3ecab8a3fb86ed00e884cc4096f10402cef2c291bbbabef9940f5cd884"
        },
        {
          "name": "analytics_query",
          "title": "Cross-Network Analytics & Live Social Listening",
          "description": "Query cross-network engagement analytics (`account_overview`, `post_metrics`, `audience_growth`), compute AI-recommended optimal posting windows (`best_times`), or execute live real-time social listening (`social_listen`) across Bluesky, Hacker News, Dev.to, Reddit, and X. Use `social_listen` to discover live community threads, competitor mentions, and high-intent buyer questions matching any keyword query. Returns aggregated engagement metrics, X Smart Link cost savings, optimal CET/UTC posting slots, or live upstream social signals with direct thread URLs and author handles.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accountId": {
                "description": "Connected account id (`acc_...`). For Instagram/Facebook/Threads, returns live account insights plus recent posts with per-post insights.",
                "type": "string"
              },
              "action": {
                "description": "Analytics or listening mode: 'account_overview' for cross-network KPIs, 'post_metrics' or 'post_detail' for individual post performance (including live YouTube viewCount, likeCount, commentCount, and publishedAt age in hours), 'audience_growth' for follower velocity, 'best_times' for highest-lift publishing windows, or 'social_listen' for live keyword/intent discovery.",
                "enum": ["account_overview", "post_metrics", "post_detail", "audience_growth", "best_times", "social_listen"],
                "type": "string"
              },
              "externalPostId": {
                "description": "Optional native platform video/post ID (e.g. YouTube `videoId`) to fetch live `viewCount`, `likeCount`, `commentCount`, and `publishedAt` age in hours.",
                "type": "string"
              },
              "periodDays": {
                "default": 30,
                "description": "Lookback window in days (e.g. 7, 30, 90) for aggregating impressions, engagements, and follower growth.",
                "type": "number"
              },
              "platform": {
                "description": "Optional social network filter to scope metrics or listening to a single platform.",
                "enum": ["x", "linkedin", "bluesky", "instagram", "facebook", "threads", "tiktok", "youtube", "reddit", "pinterest", "mastodon", "telegram", "discord", "google_business", "ghost", "wordpress", "webflow", "whatsapp"],
                "type": "string"
              },
              "postId": {
                "description": "Optional post identifier (`post_...`) when inspecting granular metrics via `action: 'post_metrics'` or `'post_detail'`.",
