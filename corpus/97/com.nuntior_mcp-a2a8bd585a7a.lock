        {
          "name": "posts_publish",
          "title": "Publish & Cross-Post Across 18 Social Networks",
          "description": "Publish immediately (`publish_now`), schedule for a future ISO-8601 timestamp (`schedule`), enqueue into the profile slot queue (`queue`), or simultaneously cross-post (`cross_post`) content and media across 18+ social networks. Includes the built-in X Smart Link Optimizer (`xLinkStrategy: 'first_reply'`), which automatically strips external links from the main X post and publishes them in an immediate 1st reply—cutting X API link costs by 85% ($0.03 vs $0.20) while avoiding main-feed link reach penalties. Returns the persisted `postId`, per-platform delivery receipts (`platformResults`), total API cost (`totalCostUsd`), and exact dollar savings (`totalSavedViaSmartLinkUsd`).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accountId": {
                "description": "Optional connected account id (`acc_...`) to publish with. When set, that exact account (and its token) is used for its platform instead of auto-selecting one.",
                "type": "string"
              },
              "action": {
                "description": "Publishing mode: 'publish_now' dispatches immediately, 'cross_post' syndicates tailored variants across multiple networks at once, 'schedule' holds until `scheduledFor`, and 'queue' places the post in the next best engagement slot.",
                "enum": ["publish_now", "schedule", "queue", "cross_post"],
                "type": "string"
              },
              "authModeOverride": {
                "description": "Optional authentication override forcing delivery through 'managed' Nuntior OAuth credentials or 'byok' customer-supplied keys.",
                "enum": ["managed", "byok"],
                "type": "string"
              },
              "autoAdjustMedia": {
                "default": true,
                "description": "When true, automatically selects the matching aspect-ratio variant (9:16 for Reels/TikTok/Shorts, 16:9 or 1:1 for X/LinkedIn) for each target platform.",
                "type": "boolean"
              },
              "content": {
                "description": "Primary post body text, caption, or thread hook. May include hashtags, mentions, and URLs (external URLs on X are automatically handled according to `xLinkStrategy`).",
                "type": "string"
              },
              "firstComment": {
                "description": "Optional first comment or reply to publish immediately under the main post.",
                "type": "string"
              },
              "format": {
                "default": "post",
                "description": "Publication format. 'post' (default) is a regular feed post. 'story' publishes an Instagram Story: requires platforms=['instagram'], action='publish_now', exactly ONE media item (one entry in `mediaUrls` or `mediaAssetIds`; image .jpg/.png or video .mp4/.mov, ideally 9:16, video 3-60s) and NO caption (omit `content` or pass an empty string). Videos are processed by Instagram before going live.",
                "enum": ["post", "story"],
                "type": "string"
              },
              "mediaAssetIds": {
                "description": "Optional list of Nuntior media asset IDs (`med_...`) from `media_pipeline` or `/v1/media/upload` to attach as images, PDF document carousels, or videos.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "mediaUrls": {
                "description": "Optional direct URLs to images (.png, .jpg, .webp), videos (.mp4, .mov), or documents (.pdf, .pptx, .docx for LinkedIn Document Carousels).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "platforms": {
                "description": "Non-empty array of destination social network slugs to publish or cross-post to (e.g. `['x', 'linkedin', 'bluesky', 'threads']`).",
                "items": {
                  "enum": ["x", "linkedin", "bluesky", "instagram", "facebook", "threads", "tiktok", "youtube", "reddit", "pinterest", "mastodon", "telegram", "discord", "google_business", "ghost", "wordpress", "webflow", "whatsapp"],
                  "type": "string"
                },
                "type": "array"
              },
              "profileId": {
                "default": "prof_allometrik",
                "description": "Brand profile identifier (`prof_...`) whose connected social accounts will publish the post.",
                "type": "string"
              },
              "scheduledFor": {
                "description": "Optional ISO-8601 UTC or offset timestamp (e.g. '2026-10-27T08:30:00+01:00') specifying when a scheduled post should go live.",
                "type": "string"
              },
              "tags": {
                "description": "Optional tags or keywords for YouTube, TikTok, or CMS posts.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "thumbnailMediaAssetId": {
                "description": "Optional Nuntior image media asset (`med_...`) used as the YouTube custom thumbnail at publish time via `POST /upload/youtube/v3/thumbnails/set`. Does not replace the video file. Thumbnail failures are returned in `thumbnailErrorDetail` and do not roll back a successful video upload.",
                "type": "string"
              },
              "thumbnailUrl": {
                "description": "Optional public image URL for a YouTube custom thumbnail at publish time (prefer `thumbnailMediaAssetId`). Same `thumbnails.set` path as `thumbnailMediaAssetId`.",
                "type": "string"
              },
              "title": {
                "description": "Optional headline, YouTube/TikTok video title, LinkedIn PDF carousel title, or Reddit/Pinterest post title.",
                "type": "string"
              },
              "visibility": {
                "description": "Optional visibility setting (e.g. 'public' or 'connections' on LinkedIn; 'public', 'unlisted', or 'private' on YouTube/TikTok).",
                "enum": ["public", "unlisted", "private", "connections"],
                "type": "string"
              },
              "webhookUrl": {
                "description": "Optional https URL that receives a JSON post.published / post.failed / post.partial event when an Instagram/Threads post that returned status 'processing' (media container still being processed by Meta) is finished by the background job.",
                "type": "string"
              },
              "xLinkStrategy": {
                "default": "first_reply",
                "description": "X (Twitter) link optimization mode: 'first_reply' moves any URL to an automated 1st reply to save $0.17/post (85% X API cost reduction) and maximize organic impressions; 'inline' leaves the URL in the main tweet; 'bio' replaces the URL with a bio pointer.",
                "enum": ["inline", "first_reply", "bio"],
                "type": "string"
              }
            },
            "required": ["action", "platforms"],
            "type": "object"
          },
          "annotations": {
