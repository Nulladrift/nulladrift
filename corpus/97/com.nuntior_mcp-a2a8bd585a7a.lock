                "type": "string"
              },
              "slug": {
                "description": "Custom URL slug (e.g. 'agent-first-social-mcp-architecture'). Auto-generated from `title` if omitted.",
                "type": "string"
              },
              "tags": {
                "description": "Array of topic tags or categories attached to the article for SEO discovery (e.g. `['AI Agents', 'MCP', 'Automation']`).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "title": {
                "description": "Full headline title of the blog article (used for H1, OpenGraph tags, and automatic slug generation).",
                "type": "string"
              }
            },
            "required": ["action"],
            "type": "object"
          },
          "annotations": {
