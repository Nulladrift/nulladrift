              "edit_link": {
                "description": "The private edit link returned by create_branded_link (…/r/<slug>/edit#k=<key>). Alternatively pass slug and edit_key.",
                "type": "string"
              },
              "slug": {
                "description": "The page's slug (the part after /r/). Needed with edit_key when edit_link is not given.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "code": {
                "description": "Error code when ok is false.",
                "type": "string"
              },
              "ok": {
                "description": "false when the call failed; then code says why.",
                "type": "boolean"
              },
              "slug": {
                "description": "The deleted slug.",
                "type": "string"
              }
            },
            "required": ["ok"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
