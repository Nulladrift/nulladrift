      "serverInfo": {
        "name": "screenparty",
        "title": "ScreenParty",
        "version": "1.2.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ScreenParty makes private rooms where people watch the same video at the same moment, in the browser, with chat and voice — no sign-up, no app. A \"watch party\" is the room create_watch_room makes (now or at a set time); get_watch_party, update_watch_party and cancel_watch_party take its room_code. Tools: create_watch_room, get_watch_party, update_watch_party (new time or title, same link), cancel_watch_party; create_branded_link (a permanent named page for a teacher, class or community), get_branded_link, update_branded_link and delete_branded_link. Videos can be a direct mp4/webm/m3u8 link or a public YouTube video; paid streaming services cannot be synced. Edit links and organiser links are private: give them only to the user who asked, never in a message meant for guests.",
      "tools": [
        {
          "name": "cancel_watch_party",
          "title": "Cancel a scheduled watch party",
          "description": "Cancels a watch party (a room made with create_watch_room, same room_code): its countdown page and link stop working. Needs the organiser_key (or organiser_link) that create_watch_room returned, so only the organiser can cancel. A room that is already open carries on until everyone leaves. Cannot be undone; confirm with the user first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "organiser_key": {
                "description": "The organiser_key from create_watch_room.",
                "maxLength": 99,
                "type": "string"
              },
              "organiser_link": {
                "description": "Alternatively, the organiser_link from create_watch_room.",
                "type": "string"
              },
              "room_code": {
                "description": "The 5-character room code. Not needed when organiser_link is given.",
                "maxLength": 10,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "code": {
                "description": "Error code when ok is false.",
                "type": "string"
              },
              "ok": {
                "description": "false when the call failed; then code says why.",
                "type": "boolean"
              },
              "room_code": {
                "description": "The cancelled room code.",
                "type": "string"
              }
            },
            "required": ["ok"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Cancel a scheduled watch party"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:8a3dcbc562361b259e415895f275238bdcee37e463deb136c3c1e27069d294a5"
        },
        {
          "name": "create_branded_link",
          "title": "Create a branded watch-together link",
          "description": "Creates a permanent public page (…/r/<slug>) with a name, an optional one-line description, colour and video. Everyone who opens it lands in that page's room, any time, so it suits teachers, classes, clubs and communities who reuse one link every week (for a one-off, use create_watch_room). Returns public_link to share and a private edit_link: the user opens it to add a logo and background and download a poster with a QR code, and it is needed for update_branded_link and delete_branded_link. Give edit_link only to the user, never to guests.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "color": {
                "description": "Optional theme colour as #rrggbb.",
                "type": "string"
              },
              "name": {
                "description": "Name shown on the page, e.g. \"Ms. Lee's English Class\".",
                "maxLength": 40,
                "type": "string"
              },
              "slug": {
                "description": "Optional. The link ending: 3-30 lowercase Latin letters, digits and hyphens (e.g. lee-english). Made from the name if omitted.",
                "maxLength": 30,
                "type": "string"
              },
              "tagline": {
                "description": "Optional one line, e.g. \"Every Tuesday at 8 pm\".",
                "maxLength": 120,
                "type": "string"
              },
              "video_url": {
                "description": "Optional video to load in the room. A direct video link (mp4, webm, m3u8) or a public YouTube video URL. Paid streaming services are not supported.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "code": {
                "description": "Error code when ok is false.",
                "type": "string"
              },
              "edit_link": {
                "description": "Private edit link.",
                "type": "string"
              },
              "ok": {
                "description": "false when the call failed; then code says why.",
                "type": "boolean"
              },
              "public_link": {
                "description": "Link to share.",
                "type": "string"
              },
              "slug": {
                "description": "The link ending.",
                "type": "string"
              }
            },
            "required": ["ok"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a branded watch-together link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ef3bd22e5b5baff3df8d489ecc413edcde958be7d774e0f5687fe2f7c193c99e"
        },
        {
          "name": "create_watch_room",
          "title": "Create a watch-together room",
          "description": "Creates a private ScreenParty room where friends watch the same video in sync, in their browsers, with chat and voice. Use it when the user wants to watch something together now, or plan a watch party at a set time. Without start_time the room is ready now: the first person to open room_link becomes the host (controls playback), so tell the user to open it before sharing. With start_time it returns a countdown page with \"add to calendar\" for guests; the room opens 15 minutes early, and organiser_link lets the user open it any time and host it. Share room_link or schedule_page with guests; keep organiser_link and organiser_key for the user only (they also change it with update_watch_party and cancel it with cancel_watch_party). The room made here is what the *_watch_party tools call a watch party — same room_code.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "start_time": {
                "description": "Optional. ISO 8601 date-time WITH a time zone, e.g. 2026-11-07T20:00:00+08:00 (ask the user for their time zone if unknown). Omit for a room that opens now. Up to 60 days ahead.",
                "type": "string"
              },
              "title": {
                "description": "What people will watch, e.g. \"Lesson 3: Past tense\". Defaults to \"Watch party\".",
                "maxLength": 60,
                "type": "string"
              },
              "video_url": {
                "description": "Optional video the room opens with. A direct video link (mp4, webm, m3u8) or a public YouTube video URL. Paid streaming services are not supported.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "code": {
                "description": "Error code when ok is false.",
                "type": "string"
              },
              "ok": {
                "description": "false when the call failed; then code says why.",
                "type": "boolean"
              },
              "opens_at": {
                "description": "ISO time guests can enter (15 minutes before).",
                "type": "string"
              },
              "organiser_key": {
                "description": "Private: needed to cancel with cancel_watch_party.",
                "type": "string"
              },
              "organiser_link": {
                "description": "Private: opens the room as host, even before it opens to guests.",
                "type": "string"
              },
              "room_code": {
                "description": "5-character room code.",
                "type": "string"
              },
              "room_link": {
                "description": "Link guests open to join the room.",
                "type": "string"
              },
              "schedule_page": {
                "description": "Countdown page with \"add to calendar\"; best link to share for a later party.",
                "type": "string"
              },
              "starts_at": {
                "description": "ISO time it starts.",
                "type": "string"
              }
            },
            "required": ["ok"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
