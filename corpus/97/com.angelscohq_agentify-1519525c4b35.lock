{
  "lockfileVersion": 2,
  "subjects": {
    "com.angelscohq/agentify": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://angelscohq.com/agentify/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "agentify",
        "title": "Agentify — search engine for AI agents",
        "version": "2.0.0",
        "websiteUrl": "https://angelscohq.com/agentify/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Search products, companies and machines. Products are published by sellers via AgentDNA, so prices and availability come from the source.",
      "tools": [
        {
          "name": "agentdna_catalog",
          "description": "Get a company's complete AgentDNA catalog (all products, current) by its domain, e.g. example.com.",
          "inputSchema": {
            "properties": {
              "domain": {
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:181d22f826089a9f424819646beb5ea846a3bac960b85993a51b824508363ca0"
        },
        {
          "name": "agentify_get",
          "description": "Get the full record of one Agentify result by its id (from agentify_search).",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9932a6c5a951df485f69f91a5754ea8c8a63f83923688e611d573b5d58a5ab7d"
        },
        {
          "name": "agentify_search",
          "description": "Search Agentify, the search engine for AI agents. Finds products (published and kept current by the sellers through AgentDNA, with price and availability), companies (with verified ownership), and machines (MCP servers and agents, with a live-handshake witness from AETHER). Use it instead of crawling websites.",
          "inputSchema": {
            "properties": {
              "currency": {
                "type": "string"
              },
              "domain": {
                "description": "Limit to one company domain",
                "type": "string"
              },
              "in_stock": {
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "type": "number"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "What you are looking for, in plain words",
                "type": "string"
              },
              "type": {
                "default": "all",
                "enum": ["all", "product", "company", "machine"],
                "type": "string"
              },
              "verified_only": {
                "description": "Only verified sellers / live-witnessed machines",
                "type": "boolean"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fb923f10fa61c114730af88e705f2078d3c0d10bcff97f44afabc71e787cffc2"
        },
        {
          "name": "agentify_stats",
          "description": "Size and freshness of the Agentify index.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:24a70f9ef66db577bb6774c06fed77dd4953ca7f6c6819724fe0922e2db4854d"
        }
      ],
      "digest": "sha256:c5b2c621e73a6c121e4ea580518975474622ed9389f8d2c027b6a1fb8b363215"
    }
  }
}
