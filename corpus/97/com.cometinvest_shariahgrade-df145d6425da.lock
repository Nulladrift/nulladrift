        },
        {
          "name": "get_methodology",
          "title": "Screening methodology",
          "description": "Explain how Comet screens a stock: the standard applied, the business-activity screen, the three financial ratios and their limits, how the ShariahGrade letter is assigned, what the Clean Hands Grade is, and where scholars and other screeners differ. Use this to explain a result or the concepts behind Shariah stock screening.",
