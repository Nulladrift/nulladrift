                "type": "string"
              },
              "sector": {
                "description": "Sector name, for example Technology or Healthcare.",
                "type": "string"
              },
              "verdict": {
                "description": "PASS passes, FAIL fails, REVIEW is questionable (prohibited revenue not disclosed), DATA is a data gap.",
                "enum": ["PASS", "FAIL", "REVIEW", "DATA"],
                "type": "string"
              }
            },
            "type": "object"
