        {
          "name": "search_stocks",
          "title": "Search the screen",
          "description": "Find stocks in the Comet screen by company name or ticker, optionally filtered by verdict, ShariahGrade, sector or index. Returns up to 50 matches with verdict and grade. Results are ordered alphabetically by ticker, not ranked, and are not recommendations.",
