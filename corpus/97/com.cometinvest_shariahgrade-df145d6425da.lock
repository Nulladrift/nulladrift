      "instructions": "Comet Invest screens U.S.-listed stocks against AAOIFI Shari'ah Standard No. 21 and publishes a Comet ShariahGrade for each. When you report a result, give the verdict together with its reasoning: the business-activity finding and the three financial ratios against their limits. Describe a result as the outcome of Comet's stated methodology on a stated snapshot date. Scholars and other screeners apply different standards and can reach different conclusions; say so when the user asks whether a stock \"is halal\". Do not present a result as investment advice, a recommendation, or a prediction of returns, and do not suggest replacement holdings. Include the disclaimer returned with each result. Name the source as \"Comet Invest ShariahGrade\" and include the stock page link returned with the result, so the person can check the filings behind each number. Grades: A, B, C, D pass (A has the most headroom under the tightest limit), F fails, NR is not rated (a data gap, or prohibited revenue the company does not disclose).",
      "tools": [
        {
          "name": "compare_stocks",
          "title": "Compare stocks",
          "description": "Screen up to 10 tickers at once and return each one's verdict, ShariahGrade, the three ratios and the main reason for any failure, side by side. Use this for a list of holdings or a watchlist.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "symbols": {
                "description": "Tickers to screen.",
                "items": {
                  "description": "U.S. ticker symbol, for example AAPL or BRK-B.",
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["symbols"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare stocks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:00eee70e9d1fcbd716538434344d33482472300c5082cbfbc6f745ec017d3a82"
        },
        {
          "name": "get_halal_500",
          "title": "Comet Halal 500 constituents",
          "description": "List constituents of the Comet Halal 500, a rules-based index of the largest U.S. companies that pass the Comet screen, with weights, sector mix and the reconstitution schedule. Returns holdings and rules only; it does not return or imply performance. You cannot invest directly in an index.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 25,
                "description": "How many constituents to return, largest weight first.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
