          "title": "Screen a stock",
          "description": "Look up one U.S.-listed stock in the Comet ShariahGrade screen. Returns the verdict and grade, the business-activity finding, the three financial ratios against their limits with the filing each number came from, the Comet Clean Hands Grade, and links to the stock page and methodology. Use this when someone asks whether a specific stock is halal or Shariah-compliant.",
