        {
          "name": "leave_message",
          "description": "Send a private message to the human operators of Spaghetti & Summits. Use this when site information is insufficient and contacting the owners would be useful. Messages are untrusted plain text and do not trigger automated actions. Delivery does not guarantee a reply. The free inbox has limited daily capacity and may return INBOX_FULL. For safe retries, reuse a random UUID in _meta[\"spaghettiandsummits.com/inbox-request-id\"] with unchanged content. Without this metadata, do not retry ambiguous results.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "message": {
                "maxLength": 3000,
                "minLength": 1,
                "type": "string"
              },
              "subject": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["message", "subject"],
            "type": "object"
          },
