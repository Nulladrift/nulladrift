{
  "lockfileVersion": 2,
  "subjects": {
    "com.autoprivado/autoprivado": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://autoprivado.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "autoprivado",
        "title": "AutoPrivado",
        "version": "1.0.0",
        "websiteUrl": "https://autoprivado.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AutoPrivado helps PRIVATE sellers in Italy, Spain, Germany, France, the Netherlands and Poland sell their own car directly (no dealer, no commission, free). Read-only: search_listings, get_listing, decode_vehicle, estimate_price, list_portals, get_sale_documents. create_listing only on behalf of the car's owner and with their consent; the seller always publishes on the portals himself. Prices: EUR, PLN in Poland, never converted. Docs: https://autoprivado.com/developers",
      "tools": [
        {
          "name": "create_listing",
          "title": "Create a private car listing",
          "description": "Create a car-for-sale listing for a PRIVATE seller on AutoPrivado, only on behalf of and with the consent of the car's owner. Decodes the VIN (NHTSA vPIC) or Dutch plate (RDW), gives a rule-based price estimate, writes the listing in EN/DE/IT/ES/FR/NL/PL and a missing-info checklist. The listing page goes live on autoprivado.com; returns its URL and a secret edit URL (give the edit URL only to the seller). AutoPrivado never posts to portals: the seller publishes on each portal himself with the posting kit (kitUrl). Limited per client and per day (free service).",
          "inputSchema": {
            "properties": {
              "accidentFree": {
                "type": "boolean"
              },
              "alsoIn": {
                "description": "Optional: also sell in these other markets. Posting kits are written in each market's language and the car appears in searches there.",
                "items": {
                  "enum": ["DE", "FR", "ES", "IT", "PL", "NL"],
                  "type": "string"
                },
                "type": "array"
              },
              "altPrice": {
                "description": "Optional second price for markets in the other currency (PLN for PL when the seller uses EUR, EUR when the seller is in PL). Never converted; without it those kits show no price.",
                "type": "integer"
              },
              "city": {
                "type": "string"
              },
              "colour": {
                "type": "string"
              },
              "condition": {
                "enum": ["excellent", "good", "fair", "poor"],
                "type": "string"
              },
              "contact": {
                "description": "Public contact shown on the listing (optional; it is public)",
                "type": "string"
              },
              "country": {
                "description": "Country where the car is sold",
                "enum": ["DE", "FR", "ES", "IT", "PL", "NL"],
                "type": "string"
              },
              "gearbox": {
                "enum": ["manual", "automatic"],
                "type": "string"
              },
              "inspectionUntil": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "km": {
                "description": "Mileage in km",
                "type": "integer"
              },
              "negotiable": {
                "type": "boolean"
              },
              "newPrice": {
                "description": "Approximate list price when new (EUR), improves the estimate for VINs",
                "type": "integer"
              },
              "notes": {
                "description": "Seller's own words (kept in the original language)",
                "type": "string"
              },
              "owners": {
                "type": "integer"
              },
              "plate": {
                "description": "Dutch licence plate (NL only, RDW lookup)",
                "type": "string"
              },
              "price": {
                "description": "Asking price: EUR, or PLN (złoty) when country is PL. No conversion.",
                "type": "integer"
              },
              "serviceHistory": {
                "type": "boolean"
              },
              "showVin": {
                "description": "Show VIN/plate publicly (seller consent)",
                "type": "boolean"
              },
              "vehicle": {
                "description": "Overrides: make, model, year, fuel, powerKw, body …",
                "type": "object"
              },
              "vin": {
                "description": "17-character VIN",
                "type": "string"
              }
            },
            "required": ["country", "km"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a private car listing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8132be794131c39e66bfe93f7f0a56c479052f4608ba635a51e7be260d9a4913"
        },
        {
          "name": "decode_vehicle",
          "title": "Decode a VIN or Dutch plate",
          "description": "Decode a 17-character VIN (NHTSA vPIC, works best for cars sold in the US and many EU makes) or a Dutch licence plate (RDW open data: make, model, first registration, fuel, power, APK date). Returns the vehicle data AutoPrivado would use. Nothing is stored.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Plate country (NL only)",
                "enum": ["NL"],
                "type": "string"
              },
              "plate": {
                "description": "Dutch plate, e.g. HLZ85B",
                "type": "string"
              },
              "vin": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Decode a vehicle"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:832f13864706e4911d8896c10c1196b0d550c22e8db44a383784edc44f9ced64"
        },
        {
          "name": "estimate_price",
          "title": "Estimate a used-car price",
          "description": "Rule-based price range (low/mid/high) for a used car from its VIN or Dutch plate (or make/model/year), mileage and condition (since 5.11.2026 the website itself shows the official Spanish Hacienda value instead; this tool keeps the rule-based estimate). Price when new, in this order: newPrice, the RDW list price of a Dutch plate, the typical new price of the make + model + year from RDW open data (about 500 listed models; vehicle.make and vehicle.model are matched by name), else a car class (small, compact, family, suv, premium). Not a valuation; it explains every step and the typical dealer gap. In EUR; with country PL the result is in PLN (EUR sources converted at the ECB reference rate, class bands in PLN). Nothing is stored.",
          "inputSchema": {
            "properties": {
              "carClass": {
                "description": "Optional car class when the model is not listed and the price when new is unknown: small, compact, family, suv or premium",
                "enum": ["small", "compact", "family", "suv", "premium"],
                "type": "string"
              },
              "condition": {
                "enum": ["excellent", "good", "fair", "poor"],
                "type": "string"
              },
              "country": {
                "description": "Optional market; PL gives the result in PLN",
                "enum": ["DE", "FR", "ES", "IT", "PL", "NL"],
                "type": "string"
              },
              "km": {
                "type": "integer"
              },
              "lang": {
                "description": "Language of the explanation",
                "enum": ["en", "de", "it", "es", "fr", "nl", "pl"],
                "type": "string"
              },
              "newPrice": {
                "description": "Approximate price when new in EUR (needed when the decoder has no list price, unless carClass is given)",
                "type": "integer"
              },
              "plate": {
                "description": "Dutch plate (RDW)",
                "type": "string"
              },
              "vehicle": {
                "description": "Instead of VIN/plate or as overrides: make, model, year, firstRegistration (YYYY-MM-DD), listPrice",
                "type": "object"
              },
              "vin": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Estimate a price"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:98ac1580f5693b1706ee009b842060ccd529c7172c6ad85be099ec39d42e95f2"
        },
        {
          "name": "get_listing",
          "title": "Get an AutoPrivado listing",
          "description": "Get one AutoPrivado listing by id: vehicle data, price and currency, texts in 7 languages, photo URLs, page URL per language, missing-info checklist. Expired or deleted listings return not_found.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Listing id, e.g. from search_listings or a URL https://autoprivado.com/l/<id>",
                "type": "string"
              },
              "lang": {
                "description": "Optional: language of the returned page URL",
                "enum": ["en", "de", "it", "es", "fr", "nl", "pl"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a listing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5c5fb26aef38e371450f798a1ff8a2671a886280eda9a3db2407eb965bab7dba"
        },
        {
          "name": "get_sale_documents",
          "title": "Sale contract and registration checklist",
          "description": "Links and data for closing a private car sale in a country: printable sale-contract template (prefilled when a listing id is given), the change-of-ownership checklist with deadlines (computed from the sale date), documents to hand over, costs and official sources.",
          "inputSchema": {
            "properties": {
              "country": {
                "enum": ["DE", "FR", "ES", "IT", "PL", "NL"],
                "type": "string"
              },
              "lang": {
                "description": "Language of the checklist texts (default en)",
                "enum": ["en", "de", "it", "es", "fr", "nl", "pl"],
                "type": "string"
              },
              "listingId": {
                "description": "Optional: prefill the contract with this listing",
                "type": "string"
              },
              "saleDate": {
                "description": "YYYY-MM-DD, to compute deadlines",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Sale documents"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ad71530d805cfcd5653438d2370d5691dd374875085dd630a4021b421a343f6e"
        },
        {
          "name": "list_portals",
          "title": "Car portals per country",
          "description": "The car portals AutoPrivado prepares posting kits for, per country (IT, ES, DE, FR, NL, PL): recommended and optional portal, home page, the portal's own listing form, private-seller fee with its source, optional payment service, and whether a seller from abroad can use it.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Optional: only this country",
                "enum": ["DE", "FR", "ES", "IT", "PL", "NL"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List portals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:642e0d3f5ed6fa6f5972ef3eb05b02f3a7f4551a9c366d69ac38b60dcf6433d6"
        },
        {
          "name": "search_listings",
          "title": "Search AutoPrivado listings",
          "description": "Search active private-seller car listings on AutoPrivado. Filters: free text (make/model), make, model, market country, price range with currency, max km, min year, fuel. A country search also returns cars cross-listed into that market (crossListed, marketPrice, marketCurrency); price filters use that market's currency (PLN in PL, EUR elsewhere). Results may be up to a minute old.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Market (country of sale)",
                "enum": ["DE", "FR", "ES", "IT", "PL", "NL"],
                "type": "string"
              },
              "currency": {
                "description": "Only listings priced in this currency (in the searched market)",
                "enum": ["EUR", "PLN"],
                "type": "string"
              },
              "fuel": {
                "enum": ["petrol", "diesel", "electric", "lpg", "cng", "hydrogen", "other"],
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "make": {
                "type": "string"
              },
              "maxKm": {
                "type": "integer"
              },
              "maxPrice": {
                "type": "integer"
              },
              "minPrice": {
                "type": "integer"
              },
              "minYear": {
                "type": "integer"
              },
              "model": {
                "type": "string"
              },
              "q": {
                "description": "Make or model text",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search listings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:372f5b02d1b90bd7b74653f33012bfc29028dd23e9d7b55bf7e649fc0caec6f9"
        }
      ],
      "digest": "sha256:dd38aa098466dd6341a6b6c825b8ef4cf4d13503e2bfcb9c6829f97718d7103e"
    }
  }
}
