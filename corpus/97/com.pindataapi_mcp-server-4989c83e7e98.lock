      "serverInfo": {
        "name": "pindataapi-mcp-server",
        "title": "PinData API — Pinterest Pins, Boards, Color Palettes & Boutique Stays MCP Server",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Search real-time Pinterest pins, extracted dominant hex color palettes, creator boards, brand profiles, and Airbnb boutique stays with zero official OAuth approval needed. Handshake and tools/list are free; pass x-api-key (PINDATAAPI_KEY = pn_live_...) for tools/call. Claim 3,000 Free Credits ($0.30) on sign-up — No Card Required at https://pindataapi.com/signup.",
      "tools": [
        {
          "name": "boards_search",
          "title": "Search Pinterest Creator Boards & Moodboards",
          "description": "Search curated Pinterest moodboards and collections by topic or aesthetic (e.g. \"mid century interior\", \"bridal editorial\") with pin counts, cover images, sample thumbnails, color swatches, and creator handles. Cost: 2 Credits / board returned (0 Credits if empty).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "Optional pagination cursor.",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum boards to return (1–50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Moodboard or aesthetic search query, e.g. \"mid century interior\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:efb290ce4f97e768267edad88e8b34bd407494486e73e1ef7443a26705a6378f"
        },
        {
          "name": "pins_details",
          "title": "Inspect Single Pinterest Pin Metadata & Outbound Shop Link",
          "description": "Retrieve complete metadata for any Pinterest pin by numeric pin_id or full pinterest.com/pin/... URL, including original high-res image, dominant hex color, 5-color swatch palette, save count, creator info, and outbound e-commerce URL. Cost: 5 Credits / pin (0 Credits if not found).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "pin_id": {
                "description": "Pinterest numeric Pin ID (e.g. \"424605071146337183\") or full https://www.pinterest.com/pin/... URL.",
                "type": "string"
              }
            },
            "required": ["pin_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:aea79da91d871b85c091650cec886faf8deb0fab29357f859ebb65f117db0d1c"
        },
        {
          "name": "pins_search",
          "title": "Search Pinterest Visual Pins & Color Palettes",
          "description": "Search real-time Pinterest pins by aesthetic or product query (e.g. \"ceramic mug\", \"japandi living room\") with zero Pinterest OAuth approval. Returns HD image URLs, dimensions/aspect ratio, extracted dominant hex color + multi-swatch palette, save/repin velocity, creator profile, and outbound shop domains (Etsy, Shopify, etc.). Cost: 2 Credits / pin returned ($0.08–$0.20/1K pins; 0 Credits if empty).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "color": {
                "description": "Optional hex color filter (e.g. \"#C9B096\").",
                "type": "string"
              },
              "cursor": {
                "description": "Optional pagination cursor from a previous pins_search response.",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum number of pins to return (1–50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Visual aesthetic, product, or trend search query, e.g. \"ceramic mug\" or \"mid century walnut chair\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4d7c5bec00d1c34a5fe617994ace88c667537ee07642ec0d6f90cfcbdf1e6382"
        },
        {
          "name": "stays_destinations",
          "title": "Autocomplete Travel Destinations & Market IDs",
          "description": "Resolve partial city, region, or landmark names into canonical destination display names, country codes, and location IDs for stay searches. Cost: 2 Credits / call (0 Credits if empty).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "description": "Maximum destinations to return (1–25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Partial destination or city text, e.g. \"Paris\" or \"Amalfi\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4eeecce56ee63f385fe006438ce824a0e99dfa60a4abc1ed6f8396910eb40a38"
        },
        {
          "name": "stays_market",
          "title": "Benchmark Global Short-Term Stay Supply by Market",
          "description": "Retrieve market-level short-term rental supply, average ratings, Superhost share, property capacities, amenities, and coordinates for travel analytics in any city market. Cost: 3 Credits / listing returned (0 Credits if empty).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 20,
                "description": "Maximum listings to return (1–50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "Market or city name, e.g. \"Paris\", \"London\", \"Tokyo\".",
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Pagination offset (>= 0).",
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["market"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6bd04a3c5a51f06e5a8e6345d95f5380cf5f09a5db5b964eab90b4da269fe211"
        },
        {
          "name": "stays_search",
          "title": "Search Short-Term Boutique Stays, Nightly Rates & Interior Photos",
          "description": "Search real-time Airbnb & boutique short-term stays in any city or region with nightly rates, total trip pricing, Superhost badges, star ratings, review counts, GPS coordinates, and high-res interior photography. Cost: 5 Credits / stay returned (0 Credits if empty).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adults": {
                "default": 2,
                "description": "Number of adult guests (1–16).",
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              },
              "checkin": {
                "description": "Optional check-in date in YYYY-MM-DD format (defaults to +30 days if omitted).",
                "type": "string"
              },
              "checkout": {
                "description": "Optional check-out date in YYYY-MM-DD format (defaults to +33 days if omitted).",
                "type": "string"
              },
              "currency": {
                "default": "USD",
                "description": "ISO 4217 currency code (e.g. \"USD\", \"EUR\", \"GBP\").",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum stays to return (1–50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "City, neighborhood, or destination name, e.g. \"Paris\", \"Kyoto\", or \"Joshua Tree, CA\".",
                "type": "string"
              }
            },
            "required": ["location"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d8b0fd8f194bcb9353b2879b23e66608b077ca2f2730adb77da4a80debaab6aa"
        },
        {
          "name": "users_profile",
          "title": "Get Pinterest Creator or Brand Merchant Profile",
          "description": "Fetch public Pinterest creator or verified merchant profile stats (follower count, verified merchant flag, aesthetic dominant palette, and recent top pins) by username or profile URL. Cost: 10 Credits / profile (0 Credits if 404).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "username": {
                "description": "Pinterest username (e.g. \"pinterest\" or \"etsy\") or full https://www.pinterest.com/<username>/ URL.",
                "type": "string"
              }
            },
            "required": ["username"],
            "type": "object"
          },
