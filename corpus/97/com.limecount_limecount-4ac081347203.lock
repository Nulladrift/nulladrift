                  "type": "string"
                },
                "maxItems": 500,
                "type": "array"
              },
              "geoMinVisits": {
                "description": "Visitas mínimas para mostrar una región o ciudad por separado.",
                "enum": [1, 2, 3, 5],
                "type": "integer"
              },
              "geoZones": {
