        {
          "name": "get_stats_timeseries",
          "title": "Serie temporal",
          "description": "Serie temporal. Un punto por intervalo, con ceros incluidos. `week` empieza en lunes (ISO) y `quarter` es trimestre natural, ambos en la zona de la web; los intervalos de los extremos pueden ser parciales. `hour` admite como máximo 31 días.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "browser": {
                "description": "Navegador.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "city": {
                "description": "Ciudad (nombre en inglés).",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "compare": {
                "default": "0",
                "description": "Con `1` añade el periodo anterior de la misma duración.",
                "enum": ["0", "1"],
                "type": "string"
              },
              "country": {
                "description": "País (código ISO 3166-1 alfa-2).",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "device": {
                "description": "`desktop`, `mobile`, `tablet` u `other`.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "entry": {
                "description": "Solo visitas cuya página de entrada es esa ruta.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "event": {
                "description": "Solo ese evento personalizado (no puede empezar por `_`).",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "from": {
                "description": "Primer día (YYYY-MM-DD, inclusivo). Sin `period` implica `period=custom`; con otro periodo es 400.",
                "format": "date",
                "type": "string"
              },
              "interval": {
                "default": "day",
                "description": "Intervalo de agrupación.",
                "enum": ["hour", "day", "week", "month", "quarter"],
                "type": "string"
              },
              "metro": {
                "description": "Solo las visitas de un área metropolitana del catálogo global (`cbsa-<n>` o `fua-<n>`, el `value` de `breakdown?dimension=metros`). Un área desconocida da un resultado vacío.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "os": {
                "description": "Sistema operativo.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "page": {
                "description": "Solo vistas de esa ruta (por ejemplo `/precios`).",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "period": {
                "default": "30d",
                "description": "Periodo, en días naturales de la zona horaria de la web. Con `custom` hay que enviar `from` y `to`.",
                "enum": ["today", "7d", "30d", "month", "lastMonth", "90d", "12m", "year", "custom"],
                "type": "string"
              },
              "region": {
                "description": "Región (nombre en inglés).",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "site_id": {
                "description": "Id de la web (campo `id` de `/v1/sites`).",
                "type": "string"
              },
              "source": {
                "description": "Fuente de tráfico (`google`, `newsletter`...).",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "to": {
                "description": "Último día (YYYY-MM-DD, inclusivo). Sin `period` implica `period=custom`; con otro periodo es 400.",
                "format": "date",
                "type": "string"
              },
              "utm_campaign": {
                "description": "Valor de utm_campaign.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "utm_medium": {
                "description": "Valor de utm_medium.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "utm_source": {
                "description": "Valor de utm_source.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "zone": {
                "description": "Solo las visitas de una zona de ciudades de la web (id de zona, el `value` de `breakdown?dimension=zones`). Una zona desconocida da un resultado vacío.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["site_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
