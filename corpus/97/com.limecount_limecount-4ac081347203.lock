                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "device": {
                "description": "`desktop`, `mobile`, `tablet` u `other`.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "entry": {
                "description": "Solo visitas cuya página de entrada es esa ruta.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "event": {
                "description": "Solo ese evento personalizado (no puede empezar por `_`).",
                "maxLength": 512,
                "minLength": 1,
