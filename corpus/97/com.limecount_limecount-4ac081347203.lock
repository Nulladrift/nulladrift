        {
          "name": "update_site",
          "title": "Edita una web",
          "description": "Edita una web. Parcial: zona horaria, rutas excluidas, parámetros permitidos, retención (≤ la del plan), alertas de tráfico, umbral geográfico y zonas. Con clave `env: test` se valida cada campo enviado y se devuelve un eco sin persistir (`dry_run: true`).",
