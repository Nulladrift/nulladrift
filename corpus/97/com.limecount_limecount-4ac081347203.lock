        },
        {
          "name": "create_api_key",
          "title": "Crea una clave de API",
          "description": "Crea una clave de API. Para un script, una integración u otro agente. `scope`: `read` (lectura), `write` (lectura y gestión de webs, objetivos, embudos y anotaciones) o `full` (además, ver claves). `env`: `live` o `test` (simulación: solo lee la web de demostración y las escrituras no se guardan; el plan de prueba solo admite `test`). `siteIds` limita la clave a esas webs. La clave completa solo aparece en esta respuesta. Solo conexiones OAuth de propietarios y administradores (`keys:write`).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "env": {
                "default": "live",
                "description": "`live`: datos reales; `test`: simulación sobre la web de demostración, sin guardar escrituras.",
                "enum": ["live", "test"],
                "type": "string"
              },
              "expiresAt": {
                "description": "Caducidad opcional (ISO 8601, como mucho 5 años).",
                "format": "date-time",
                "type": "string"
              },
              "name": {
                "description": "Nombre, hasta 60 caracteres.",
                "type": "string"
              },
              "scope": {
                "default": "read",
                "description": "`read`: lectura; `write`: además gestiona webs, objetivos, embudos y anotaciones; `full`: además ve las claves.",
                "enum": ["read", "write", "full"],
                "type": "string"
              },
              "siteIds": {
                "description": "Webs a las que da acceso; vacío o ausente = todas.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Crea una clave de API"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:4484ca3969ceb5ce819a30e5a5806afe4e57a049a6b7708877413a3d432188cc"
        },
        {
          "name": "create_funnel",
          "title": "Crea un embudo",
          "description": "Crea un embudo. De 1 a 6 pasos; cada paso es un evento (`event`) o una ruta (`path`, admite `*` al final). Respeta el límite de embudos del plan. Con clave `env: test` se valida y se simula (`dry_run: true`).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Id de la web (campo `id` de `/v1/sites`).",
                "type": "string"
