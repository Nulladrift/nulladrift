        {
          "name": "export_stats",
          "title": "Exporta las estadísticas en CSV",
          "description": "Exporta las estadísticas en CSV. El mismo CSV que «Exportar» del panel (KPIs, serie diaria y desgloses), dentro de `data.csv`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "browser": {
                "description": "Navegador.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "city": {
                "description": "Ciudad (nombre en inglés).",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "compare": {
                "default": "0",
                "description": "Con `1` añade el periodo anterior de la misma duración.",
                "enum": ["0", "1"],
                "type": "string"
              },
              "country": {
