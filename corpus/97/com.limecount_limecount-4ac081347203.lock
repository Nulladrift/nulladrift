{
  "lockfileVersion": 2,
  "subjects": {
    "com.limecount/limecount": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.limecount.com/mcp/open"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "limecount",
        "title": "Limecount",
        "version": "1.0.0",
        "websiteUrl": "https://limecount.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Limecount es analítica web sin cookies. Estas herramientas actúan sobre la organización que el usuario autorizó al conectar.\n- Empieza por list_sites para obtener el id de cada web; get_account dice el plan, los ámbitos y lo que queda de cuota.\n- Estadísticas: get_stats_overview (KPIs), get_stats_timeseries, get_stats_breakdown (páginas, fuentes, países, ciudades...), get_goals, get_funnels, compare_periods y export_stats (CSV). Las fechas son días naturales en la zona horaria de la web.\n- Gestión: create_site, update_site, get_site, objetivos, embudos, anotaciones, enlaces compartidos y claves de API (create_api_key devuelve la clave completa una sola vez).\n- Las herramientas destructivas (delete_*, revoke_api_key) exigen confirm=\"true\": pide confirmación al usuario antes.\n- Cada herramienta tiene un coste en unidades de los límites por minuto y por día del plan.",
      "tools": [
        {
          "name": "compare_periods",
          "title": "Compara dos periodos arbitrarios",
          "description": "Compara dos periodos arbitrarios. KPIs de dos rangos A/B con su variación; con `dimension`, además el top N de esa dimensión con la variación entre A y B. A es el periodo que se mide y B la referencia: `change` = (A − B) / B, así que para «esta semana frente a la anterior» A es esta semana y B la anterior.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "a_from": {
                "description": "Primer día del periodo A (el que se mide).",
                "format": "date",
                "type": "string"
              },
              "a_to": {
                "description": "Último día del periodo A (el que se mide).",
                "format": "date",
                "type": "string"
              },
              "b_from": {
                "description": "Primer día del periodo B (la referencia).",
                "format": "date",
                "type": "string"
              },
              "b_to": {
                "description": "Último día del periodo B (la referencia).",
                "format": "date",
                "type": "string"
              },
              "dimension": {
                "description": "Dimensión a desglosar (opcional).",
                "enum": ["pages", "entries", "sources", "utm_source", "utm_medium", "utm_campaign", "countries", "regions", "cities", "zones", "metros", "devices", "browsers", "os", "events", "prev_pages", "next_pages"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Máximo de filas del desglose.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "site_id": {
                "description": "Id de la web (campo `id` de `/v1/sites`).",
                "type": "string"
              }
            },
            "required": ["a_from", "a_to", "b_from", "b_to", "site_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compara dos periodos arbitrarios"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9f231cf9d680e2a76a984645277c72882b635ceb3c8e6e0388b21f27998e4abd"
        },
        {
