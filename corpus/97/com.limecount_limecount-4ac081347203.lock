                "type": "string"
              },
              "idempotency_key": {
                "description": "Opcional. Un reintento con el mismo valor devuelve la misma respuesta sin repetir la escritura.",
                "maxLength": 200,
                "type": "string"
              },
              "text": {
                "description": "Hasta 140 caracteres.",
                "type": "string"
              }
            },
            "required": ["date", "id", "text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Crea una anotación"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
