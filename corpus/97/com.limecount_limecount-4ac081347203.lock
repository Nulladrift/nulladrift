              "idempotency_key": {
                "description": "Opcional. Un reintento con el mismo valor devuelve la misma respuesta sin repetir la escritura.",
                "maxLength": 200,
                "type": "string"
              },
              "isDefault": {
                "description": "Marcarlo como embudo por defecto del panel.",
                "type": "boolean"
              },
              "name": {
                "description": "Nombre, hasta 80 caracteres.",
                "type": "string"
              },
              "steps": {
                "description": "Pasos en orden, de 1 a 6.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "description": "Etiqueta opcional del paso.",
                      "type": "string"
                    },
                    "match": {
                      "description": "Nombre del evento o ruta (admite `*` al final).",
                      "type": "string"
                    },
                    "type": {
                      "enum": ["event", "path"],
                      "type": "string"
                    }
                  },
                  "required": ["match", "type"],
                  "type": "object"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["id", "name", "steps"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Crea un embudo"
