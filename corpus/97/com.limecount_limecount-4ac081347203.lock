                "format": "date",
                "type": "string"
              },
              "metro": {
                "description": "Solo las visitas de un área metropolitana del catálogo global (`cbsa-<n>` o `fua-<n>`, el `value` de `breakdown?dimension=metros`). Un área desconocida da un resultado vacío.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "os": {
                "description": "Sistema operativo.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "page": {
                "description": "Solo vistas de esa ruta (por ejemplo `/precios`).",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "period": {
                "default": "30d",
                "description": "Periodo, en días naturales de la zona horaria de la web. Con `custom` hay que enviar `from` y `to`.",
                "enum": ["today", "7d", "30d", "month", "lastMonth", "90d", "12m", "year", "custom"],
                "type": "string"
              },
              "region": {
                "description": "Región (nombre en inglés).",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "site_id": {
                "description": "Id de la web (campo `id` de `/v1/sites`).",
                "type": "string"
              },
              "source": {
                "description": "Fuente de tráfico (`google`, `newsletter`...).",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "to": {
                "description": "Último día (YYYY-MM-DD, inclusivo). Sin `period` implica `period=custom`; con otro periodo es 400.",
                "format": "date",
                "type": "string"
              },
              "utm_campaign": {
                "description": "Valor de utm_campaign.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "utm_medium": {
