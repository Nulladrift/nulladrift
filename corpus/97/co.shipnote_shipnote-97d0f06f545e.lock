{
  "lockfileVersion": 2,
  "subjects": {
    "co.shipnote/shipnote": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.shipnote.co/api/mcp/claude"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "shipnote",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "ShipNote prints, stamps and mails real postcards to US addresses. list_card_designs shows the designs, quote_price gives a price, and create_draft saves a draft: for one person (a single thank-you postcard, one recipient) or for a whole registry or guest list. Nothing is mailed or charged from chat; the sender adds their return address, reviews the cards and pays on shipnote.co.",
      "tools": [
        {
          "name": "create_draft",
          "title": "Save cards as a draft",
          "description": "Save a DRAFT of postcards, from a single card to one person (e.g. \"send a thank-you postcard to my aunt\") to a whole registry or guest list, and return a link where the sender adds their return address, reviews every card, and pays on shipnote.co. This tool never mails a card and never charges anyone. Each recipient is one card (one per household for a list): the name as it appears on the card, the full US mailing address as \"Street, City, ST ZIP\" (empty if unknown), and the gift as a short noun phrase without the store name (e.g. \"stand mixer\", not \"KitchenAid stand mixer from Target\"). senderName is the name the sender signs cards with; without it, the default message stays unsigned until the sender fills it in on shipnote.co. Up to 500 recipients per draft. Each call makes a new draft with a new link. This tool can't take a picture. A photo card (the sender's own picture as the whole front) is saved with design image-only, and the sender adds the photo on shipnote.co after opening the link; a photo inside a design uses a design marked (1 photo). list_card_designs also shows designs that need no photo.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "design": {
                "description": "A design id from list_card_designs for that occasion.",
                "maxLength": 64,
                "type": "string"
              },
              "message": {
                "description": "The card message, with [RECIPIENT] and [GIFT_NAME] as placeholders ShipNote fills in for each card. Defaults to the occasion's standard message.",
                "maxLength": 1500,
                "type": "string"
              },
              "occasion": {
                "description": "Supported occasion id from list_card_designs.",
                "maxLength": 64,
                "type": "string"
              },
              "recipients": {
                "items": {
                  "properties": {
                    "address": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "giftName": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "name": {
                      "maxLength": 100,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              },
              "senderName": {
                "description": "How the sender signs, e.g. \"Sam & Alex\". Replaces [YOUR NAME] and becomes the return-address name.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["occasion", "recipients"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Save cards as a draft"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:274e91b402977de084cb97d64c8c2bc6284d599ef8c3f1ecf940f92f67a06d6d"
        },
        {
          "name": "list_card_designs",
          "title": "Browse card designs",
          "description": "List the occasions ShipNote makes postcards for, and the card designs available for one occasion, each with the id that create_draft accepts as design. Read-only: it saves nothing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "occasion": {
                "description": "Occasion id from this tool's occasion list, e.g. wedding, baby-shower, thank-you. Without it, the tool returns the list of occasions.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Browse card designs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6b1b9d494443bb37bff430d2e19a3053553812edc4f419c9061856b61e3b4568"
        },
        {
          "name": "quote_price",
          "title": "Get a price quote",
          "description": "Price for printing, stamping and mailing a number of ShipNote postcards within the US. Read-only: it saves nothing and charges nothing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cardCount": {
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["cardCount"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a price quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:3925a22b2623c56146db4891bb4b2ceb898add26a5388a6e3c3f027284edcc88"
        }
      ],
      "digest": "sha256:380396a327bb5b13322b29e8571d5467e5db09b8a3c919601f86ea44f7a059d8"
    }
  }
}
