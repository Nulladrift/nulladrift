{
  "lockfileVersion": 2,
  "subjects": {
    "com.declaroad/declaroad": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://declaroad.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "declaroad",
        "title": "Declaroad",
        "version": "1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Declaroad answers what a traveller must know to enter a country on a given passport: the visa status and the rules that apply — customs, currency, medicines, drones, registration, conduct — each resting on an official source that is linked. Call check_trip with the destination and the passport. Quote the rules as they are and give their source links: they are checked against official texts, and a reader should be able to verify them. Call list_coverage to see which countries and passports are known.",
      "tools": [
        {
          "name": "check_trip",
          "title": "Check a trip's entry rules",
          "description": "The visa status and the rules that apply to a trip: one destination country, one passport. Each rule has its official source. Use the country's ISO code or its English or Russian name.",
          "inputSchema": {
            "properties": {
              "destination": {
                "description": "the country of the trip, e.g. TR or Turkey",
                "type": "string"
              },
              "items": {
                "description": "what the traveller carries, if anything",
                "items": {
                  "enum": ["alcohol", "antiques", "cash", "drone", "food", "meds_rx", "minor", "pet", "phone", "sat_device", "tobacco", "valuables", "vape"],
                  "type": "string"
                },
                "type": "array"
              },
              "lang": {
                "description": "the language of the rule texts; en if left out",
                "enum": ["de", "en", "es", "fr", "ru"],
                "type": "string"
              },
              "passport": {
                "description": "the country of the traveller's passport, e.g. KZ or Kazakhstan",
                "type": "string"
              },
              "purpose": {
                "enum": ["study", "tourism", "transit", "work"],
                "type": "string"
              },
              "stay_days": {
                "description": "the length of the stay",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["destination", "passport"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d6475c4f739bee0b56c8da2ab350b4411b1e3f89cde96c03f04579c06b8c07e8"
        },
        {
          "name": "list_coverage",
          "title": "List the countries and passports covered",
          "description": "The destination countries Declaroad has rules for and the passports it answers for.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:da1f55b2eba98ad53d894ce5e6f6adf893615df5a9307e86101455f654b73fc0"
        }
      ],
      "digest": "sha256:03d618b67650dcad73b20737d98edb91a73153660d372316f6a7ed08b344ce76"
    }
  }
