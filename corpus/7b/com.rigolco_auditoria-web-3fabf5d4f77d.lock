        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://auditoria.rigolco.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "auditoria-web",
        "title": "Auditoría web rápida (visibilidad en IA y velocidad)",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Revisa desde fuera la portada de una web pública: si los asistentes de IA (ChatGPT, Claude, Perplexity, Gemini) pueden leerla y citarla, y lo rápido que carga en celular según Google PageSpeed. Úsalo cuando el usuario pida revisar su web o la de otro. Explica cada problema con el detalle que devuelve la herramienta, y recuerda que es una revisión orientativa de la portada, no una auditoría completa.",
      "tools": [
        {
          "name": "medir_velocidad_movil",
          "title": "Medir la velocidad de una web en celular",
          "description": "Mide con Google PageSpeed Insights la portada de una web en un celular simulado: notas de 0 a 100 de rendimiento, SEO, accesibilidad y buenas prácticas, y el tiempo hasta que aparece el contenido principal (LCP; Google pide 2.5 s o menos). Si Google tiene datos de usuarios reales de Chrome, los añade. Tarda de 10 a 20 segundos, como mucho 25.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "web": {
                "description": "Dominio o dirección de la web, por ejemplo tuempresa.mx. Se analiza siempre su portada.",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["web"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Medir la velocidad de una web en celular"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a74847aa8c77bd9f9df66a8608793e4181deebee676ad7b96687fa39dafc709c"
        },
        {
          "name": "revisar_visibilidad_ia",
          "title": "Revisar si la IA puede leer una web",
          "description": "Comprueba si los asistentes de IA pueden leer y citar la portada de una web: si responde, si deja pasar al buscador de ChatGPT (OAI-SearchBot), si lleva noindex, si su robots.txt bloquea la búsqueda de IA (distingue búsqueda de entrenamiento), si el texto se lee sin JavaScript, y si tiene sitemap, JSON-LD y llms.txt. Veredicto: si, a-medias, no o sin-datos (no se pudo leer la portada). Tarda 1-3 s; como mucho 20.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "web": {
                "description": "Dominio o dirección de la web, por ejemplo tuempresa.mx. Se analiza siempre su portada.",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["web"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Revisar si la IA puede leer una web"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dfff865f4d33f268f8ecda0fd9f2c20ca35d9adaf9faeb8886a38a979d833243"
        }
      ],
