        {
          "name": "start_shoot",
          "title": "Start a shoot",
          "description": "Starts a shoot of a pack from a character's saved selfies, paid from their credits: one photo per picked shot, at the price get_pack gives. Unless the user has said, offer them the whole pack or only the shots they want, even one. Tell the user the price first and pass it as max_credits; the shoot is refused if it costs more. A photo takes about 20 seconds, a 4K one about 30: follow them with get_shoot. If a call to this tool got no answer, it may already have started: check list_photos before calling it again.",
          "inputSchema": {
            "properties": {
              "character": {
                "description": "The character, by its id or name from list_characters. Leave it out for the one the user last made a shoot of.",
                "type": "string"
              },
              "character_2": {
                "description": "A duo pack's second person (get_pack says duo: true), by id or name from list_characters, another character than character. A duo pack needs it; any other pack refuses it.",
                "type": "string"
              },
              "max_credits": {
                "description": "The most the user agreed to pay.",
                "minimum": 1,
                "type": "integer"
              },
              "options": {
                "description": "Option ids from get_pack: outfit, place, light, ratio, resolution, shots (a list of shot ids) and any attribute key. Anything left out keeps its default. A resolution above 1K costs more: get_pack gives each one's price. On a duo pack the second person's own picks are the same keys ending in _2 (outfit_2, glasses_2, body_2…); place, light and direction are both people's.",
                "type": "object"
              },
              "pack": {
                "description": "The pack's or mix's slug.",
                "type": "string"
              },
              "space": {
                "description": "The space, by its id or name from list_spaces; left out, the personal one, but a shoot names one when the user is in several. When they haven't said which, ask.",
                "type": "string"
              }
            },
            "required": ["max_credits", "pack"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
