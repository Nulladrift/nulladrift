        {
          "name": "light_camera",
          "title": "Relight a photo, or see it through another camera",
          "description": "Changes the light, the camera or the look of one of the user's photos, paid from their credits: at most one pick per group (light, lens, angle, focus, look), and/or text, up to 300 characters of what to change. What is not picked stays as it is. light and look keep the pose, framing and scene; a lens, angle or focus pick re-imagines the same moment through that camera, so the framing changes. Text is rewritten before anything is made: what Luala doesn't make is left out, a look like a named person becomes that styling, and the result's text is what was sent. Pass the price the user agreed to as max_credits: the photo's prices from get_shoot or list_photos name it. If a call to this tool got no answer, it may already have started: check list_photos before calling it again.",
          "inputSchema": {
            "properties": {
              "angle": {
                "enum": ["eye_level", "low", "high"],
                "type": "string"
              },
              "focus": {
                "enum": ["blur", "sharp"],
                "type": "string"
              },
              "lens": {
                "enum": ["24mm", "35mm", "50mm", "85mm", "135mm", "anamorphic"],
                "type": "string"
              },
              "light": {
