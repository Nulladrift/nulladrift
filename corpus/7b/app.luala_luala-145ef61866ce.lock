        {
          "name": "edit",
          "title": "Edit a photo",
          "description": "Makes an edited copy of one of the user's photos, paid from their credits. type change keeps the pose and framing and changes any of: outfit and place (ids from get_pack of the photo's pack; a place that is a pet or a print, not a scene, is not one to change to), light, the attributes, and text, up to 300 characters of what to change. type zoom_out steps back one step. Pass the price the user agreed to as max_credits: the photo's prices from get_shoot or list_photos name it. Text is rewritten before anything is made: what Luala doesn't make is left out, a look like a named person becomes that styling, and the result's text is what was sent. Fetch the result with list_photos. If a call to this tool got no answer, it may already have started: check list_photos before calling it again.",
          "inputSchema": {
            "properties": {
              "age": {
                "enum": ["as_in_photos", "younger", "older", "much_older"],
                "type": "string"
              },
              "beard": {
                "enum": ["as_in_photos", "clean", "stubble", "full"],
                "type": "string"
              },
              "body": {
                "enum": ["as_in_photos", "slimmer", "athletic", "muscular", "bigger"],
                "type": "string"
              },
              "chest": {
                "enum": ["as_in_photos", "fuller", "smaller"],
                "type": "string"
              },
              "expression": {
                "enum": ["as_in_photos", "smiling", "calm", "serious", "laughing"],
                "type": "string"
              },
              "face": {
                "enum": ["as_in_photos", "slimmer", "jawline"],
                "type": "string"
              },
              "glasses": {
                "enum": ["as_in_photos", "none", "glasses", "sunglasses", "tinted"],
                "type": "string"
              },
              "hair_colour": {
                "enum": ["as_in_photos", "blonde", "brown", "black", "red", "grey"],
                "type": "string"
              },
              "hair_length": {
                "enum": ["as_in_photos", "short", "shoulder", "long"],
                "type": "string"
              },
              "light": {
                "enum": ["day", "golden_hour", "evening", "studio"],
                "type": "string"
              },
              "makeup": {
                "enum": ["as_in_photos", "none", "natural", "glam"],
                "type": "string"
              },
              "max_credits": {
                "minimum": 1,
                "type": "integer"
              },
              "outfit": {
                "type": "string"
              },
              "photo_id": {
                "type": "integer"
              },
              "place": {
                "type": "string"
              },
              "skin": {
                "enum": ["as_in_photos", "flawless", "tanned", "freckles"],
                "type": "string"
              },
              "text": {
                "maxLength": 300,
                "type": "string"
              },
              "type": {
                "enum": ["change", "zoom_out"],
                "type": "string"
              }
            },
            "required": ["max_credits", "photo_id", "type"],
            "type": "object"
