                "type": "string"
              },
              "max_credits": {
                "minimum": 1,
                "type": "integer"
              },
              "photo_id": {
                "type": "integer"
              },
              "text": {
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["max_credits", "photo_id"],
            "type": "object"
