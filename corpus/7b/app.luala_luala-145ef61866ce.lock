      },
      "instructions": "Luala makes photo shoots of the user from their saved selfies: pick a pack (list_packs, get_pack), start a shoot with start_shoot, then show the photos with get_shoot. A user may have several characters, the people they make photos of (list_characters): with more than one, ask who a shoot is of and pass its character. One marked fictional is an invented adult: it shoots the same but takes no selfies. A duo pack (get_pack says duo: true) is of two characters: ask who both are and pass the second as character_2. A user may be in several spaces, each with its own characters, photos and credits (list_spaces): with more than one, ask which space a shoot or a list is for and pass it as space. A shoot can be the whole pack or any of its shots, down to one photo: offer that choice. Every shoot and edit costs credits: tell the user the price and pass it as max_credits. There is no free-text prompt; a pack's options are the choices. A photo's link opens it in the Luala app: give the user that link. A photo or selfie the user attaches goes in with add_photo or add_selfie, free; when they attach a photo and ask for an edit of it, add it, tell them the edit's price from the answer, and once they agree make that edit on its photo_id.",
      "tools": [
        {
          "name": "add_photo",
          "title": "Add a photo",
          "description": "Adds one photo to the user's My photos in Luala, free, so it can be edited: an old print to restore, clothes to try on, a photo to change. The answer is the saved photo with its photo_id and edit prices: when the user asked for an edit of it, tell them that edit's price, and once they agree make it with Luala's tool for it on this photo_id, never with another image tool. Pass the file the user attached as photo. If you can't, but the file is in your sandbox, call with its content_type (image/jpeg, image/png or image/webp: convert a HEIC to JPEG first) and size in bytes, PUT the file to the answer's upload url with its headers, then call again with the answer's key. Called with none of these, it answers with the luala.app page where the user adds it. The user accepted the upload rules when connecting Luala.",
          "inputSchema": {
            "properties": {
              "content_type": {
                "type": "string"
              },
              "key": {
                "type": "string"
              },
              "photo": {
                "description": "The file the user attached.",
                "properties": {
                  "download_url": {
                    "type": "string"
                  },
                  "file_id": {
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "size": {
                "minimum": 1,
                "type": "integer"
              },
              "space": {
                "description": "The space, by its id or name from list_spaces; left out, the personal one, but a shoot names one when the user is in several. When they haven't said which, ask.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
