        "name": "com.fuelazores/fuel-prices",
        "title": "FuelAzores",
        "version": "1.0.0",
        "description": "Official maximum fuel prices, effective dates and history for the Azores and Madeira.",
        "websiteUrl": "https://www.fuelazores.com/developers"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "FuelAzores is an independent guide to official maximum fuel prices in the Azores and Madeira, including Porto Santo. These are regional caps, not individual station quotes. One approved official source with an exact amount and effective date is sufficient. Conflicting or ambiguous official evidence stays under review. Reports cannot override or block valid official prices. No forecast is presented as an announced change. Petrol 98 is not covered. Amounts use integer thousandths of EUR per litre (priceMillsPerLitre); divide by 1000 for EUR/litre. Effective dates use the region's time zone. A last verified price can be retained while a later period is pending or under review: inspect pendingStatus and freshness before calling it current. generatedAt is retrieval time, not publisher or verification time. Preserve official source links, dates, and the FuelAzores citation URL. Missing data is unknown, never zero. History is paginated and coverage gaps do not imply an unchanged price.",
      "tools": [
        {
          "name": "find_fuel_articles",
          "title": "Fuel price guides",
          "description": "Find Portuguese and English guides to Azores and Madeira fuel prices, official sources, regional comparisons, refill calculations, refuelling as a visitor and using FuelAzores. Use an article id and language to retrieve its complete Markdown. Dated examples are not live prices.",
