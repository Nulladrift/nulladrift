            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "enum": ["azores", "madeira", "comparison", "evidence", "refill", "fuelazores", "travel"],
                "type": "string"
              },
              "language": {
                "enum": ["pt", "en"],
                "type": "string"
              },
              "q": {
                "maxLength": 150,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
