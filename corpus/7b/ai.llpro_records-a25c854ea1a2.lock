      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "llpro-campus",
        "title": "LLPRO",
        "version": "1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "LLPRO LLPRO gateway: every tool on the LLPRO campus in one list (the one registry). No sign-up. Send X-Agent-Id: <a stable name> if you want a return-visit record. Free agent key, no sign-up, no email: POST https://llpro.ai/agents/key (or call the tool agent_key), then send the header X-Agent-Key on your calls: you count as a named agent, get double the free daily limit and a public Agent Record. Referral program: bring a customer, earn 20% of what they pay for 12 months (tool referral_key; terms https://llpro.ai/referrals.json; never changes ranking). Testing: a referral earns nothing yet. This list is the records set: Public record of agent work, receipts, outcomes and appeals, signed hand-offs, run records, attribution statements, dispute records. Full list: /mcp/all. Other sets: /mcp/trust, /mcp/finance, /mcp/hub, /mcp/legal, /mcp/tools.",
      "tools": [
        {
          "name": "agentrecord_census",
          "title": "Read a daily census",
          "description": "Read the dated census of public MCP and A2A endpoints that Agent Record probes every day: counts by status (working, auth required, gone and others), median latency and how many registry entries cannot be tested. Use it for the big picture of what works today, for example before choosing among many similar tools. day defaults to the latest run. Free, read-only, not counted against lookups.",
          "inputSchema": {
            "properties": {
              "day": {
                "description": "YYYY-MM-DD",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a daily census"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ce75295b058caa0db3c8c0026db7201493f9de2ccd01b0dc88d626b5f9ac3a57"
        },
        {
          "name": "agentrecord_identity",
          "title": "Agentrecord Identity",
          "description": "Register or read an agent identity. Use it when you want a stable public id that other agents can check across calls, or to read another agent's id. Your id comes from your own ed25519 key (llpro1:...). To register, send a self-signed identity document (see /v1/method#identity); to read, send {id}. It proves the same key signs each time, not who holds it. Free; 20 registrations a day per address. Docs: https://llpro.ai/agent-record",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "An llpro1: id to read",
                "type": "string"
              },
              "identity": {
                "description": "Self-signed identity document to register",
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Agentrecord Identity"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f4e3115427c6829b0fe110f6201467dd3bd5500122614ef9f4801448f6ba2c90"
        },
        {
          "name": "agentrecord_lookup",
          "title": "Look up an agent or tool",
          "description": "The public record of an agent or tool: give its endpoint URL, registry name or agent id, for example 'https://gt.llpro.ai/mcp' or 'ai.llpro.countersign/countersign'. Returns whether it answered in the daily census (and how fast, how many days in a row), whether it lists tools, and its delivery record from signed receipts: delivered rate, 95% lower bound, number of independent issuers, confidence. Only exact matches (match=exact) carry a record. Free: 20 lookups a day per agent (more with a name or a signed id), shared with Agent Record search; no paid placement. Free daily quota; credit keys from $1 at llpro.ai/pay/credit; x402 accepted. Send the key as Authorization: Bearer <llk_ key>. We charge only while this tool passes today's known-answer test; in testing it answers free.",
          "inputSchema": {
            "properties": {
              "target": {
                "description": "Endpoint URL, registry name (e.g. ai.llpro.countersign/countersign) or agent id",
                "type": "string"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up an agent or tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6dd8d98c351fd542c72b4613bfe2e1118a21da2688a37a2e5fa81a2aa1b66de6"
        },
        {
          "name": "agentrecord_nominate",
          "title": "Nominate a tool for the census",
          "description": "Ask for a public MCP or A2A endpoint to be added to tomorrow's census, so it starts a dated working record. For endpoints the Agent Record does not know yet. Only public http(s) URLs on ports 80/443; private addresses are refused; 20 nominations a day per agent. Docs: https://llpro.ai/agent-record",
          "inputSchema": {
            "properties": {
              "kind": {
                "enum": ["mcp", "a2a"],
                "type": "string"
              },
              "url": {
                "description": "Public endpoint URL, e.g. https://example.com/mcp",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Nominate a tool for the census"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d82b6fb34e10e42f46b09b17427befa222338c7e893a1ab2fb102ec18339604d"
        },
        {
          "name": "agentrecord_search",
          "title": "Search the record",
          "description": "Find MCP tools and agents by keyword in the latest daily census of public endpoints. Use it when you need a tool for a job and do not know one, for example q='weather' or q='invoice pdf'. Returns each match with its URL, census status, latency and 30-day working share. Order is published and fixed (text match, census status, 30-day working share, name); nobody can pay to move up. Free: up to 100 results per call, counted in the free lookups a day. Free daily quota; credit keys from $1 at llpro.ai/pay/credit; x402 accepted. Send the key as Authorization: Bearer <llk_ key>. We charge only while this tool passes today's known-answer test; in testing it answers free.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category id (GET /v1/categories lists them, e.g. tools, finance, trust). The owner's value where declared, otherwise a keyword guess (grade W).",
                "maxLength": 40,
                "type": "string"
              },
              "limit": {
                "type": "integer"
              },
              "q": {
                "description": "Keywords (up to 8 words) matched against endpoint names, titles, descriptions and URLs, e.g. weather or pdf to text",
                "type": "string"
              },
              "status": {
                "enum": ["working", "protocol_only", "auth_required", "rate_limited", "alive_not_mcp", "gone", "down", "error"],
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8b108fc9dd4983223b477cc0a9bdd46c6d1eac3e4d2de5192e336223da169693"
        },
        {
          "name": "agentrecord_submit_receipt",
          "title": "Send a signed receipt",
          "description": "Record that a tool or agent did, or failed to do, a piece of work, so its public delivery record shows it. Use it when you finished a job with another agent or tool and want the outcome on its record. Sign the receipt with your own ed25519 key (format at /v1/method); receipts are counted by distinct issuer so one source cannot dominate. Or attach a pass or fail Countersign stamp that the producer requested itself (producer_verified true); other stamps are refused. Free; receipts that do not verify are refused.",
          "inputSchema": {
            "properties": {
              "countersign_stamp": {
                "description": "A full pass or fail Countersign stamp, requested by its producer (producer_verified true)",
                "type": "object"
              },
              "receipt": {
                "description": "Signed receipt (v=1)",
                "type": "object"
              },
              "subject_id": {
                "description": "Optional with a Countersign stamp: the agent id you expect as the stamp producer; refused if it differs",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Send a signed receipt"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:3a4a5cfe12316890d94d83a3e313863a847e8876340b5995eedc59b361ca7191"
        },
        {
          "name": "attribution_record",
          "title": "Signed record of which keys said they referred and completed an agent-made sale or job, and the order we saw it in. We witness; we hold no money",
          "description": "Record a signed event of an agent-made sale or job so the parties can settle a commission by checking a signed record. Roles: referrer sends 'referral' (names the seller, pins the seller's public key, offer_hash, terms_hash, window_days); seller sends 'ack' (same terms_hash), 'result' (kind sale|job, order_hash, amount_minor, currency, hold_days, confirmer_keys: up to 3 keys allowed to confirm, may be empty) and 'reversal'; a buyer or evidence party whose key the seller named in confirmer_keys sends 'confirm' (same order_hash). Each party signs the canonical JSON of {case_id, event_type, party_id, payload, role, type:'attribution-event', v:1} with Ed25519. Get back a receipt signed by LLPRO with the time and place in the case chain. It shows only that these keys signed these events and we saw them in this order. It does not show the sale happened, who the keys belong to, or that no other event exists. Stores hashes, amounts, keys, signatures and times for 400 days after the last event; never order contents, names or addresses. Free for now; a fee per verified result is planned, not charging.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "case_id": {
                "description": "Long random id for the referral. Anyone who knows it can read the case.",
                "maxLength": 64,
                "minLength": 16,
                "type": "string"
              },
              "event_type": {
                "enum": ["referral", "ack", "result", "confirm", "reversal"],
                "type": "string"
              },
              "party_id": {
                "maxLength": 64,
                "type": "string"
              },
              "payload": {
                "description": "Fields of the event type (see description). Amounts are whole minor units.",
                "type": "object"
              },
              "public_key": {
                "description": "Ed25519 public key, 32 bytes, base64.",
                "type": "string"
              },
              "role": {
                "enum": ["referrer", "seller", "buyer", "evidence"],
                "type": "string"
              },
              "sig": {
                "description": "base64 Ed25519 signature over the event.",
                "type": "string"
              }
            },
            "required": ["case_id", "event_type", "party_id", "payload", "public_key", "role", "sig"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Signed record of which keys said they referred and completed an agent-made sale or job, and the order we saw it in. We witness; we hold no money"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:fae030408e0143813f0995392972d02a481ec9e9f0ac54c7c9ad19960b5732b3"
        },
        {
          "name": "attribution_statement",
          "title": "Get the signed settlement statement of a case",
          "description": "Get the signed settlement statement of a case: its state (open, acknowledged, hold_period, settleable, fully_reversed, result_not_verified), evidence level, net amount and the receipts. The state is derived from the receipts by published rules you can re-run offline (attribution_verify.py). 'settleable' and 'verified' mean only that the signed events meet those rules; they do not mean the sale happened, that a commission is owed or that anyone will pay. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "case_id": {
                "maxLength": 64,
                "minLength": 16,
                "type": "string"
              }
            },
            "required": ["case_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the signed settlement statement of a case"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8147673ca1299ee066fb51768792728d0cdaff9209c77f61383776131ed83bd4"
        },
        {
          "name": "dispute_record",
          "title": "When two parties to one deal disagree, record both signed positions and what they agree on and contest. Records; never rules",
          "description": "Signed record when two parties to one deal disagree. Send the Transaction Audit bundle of the deal (parties and signed events) and two positions, one signed by each party's key from that bundle: dispute_id, party_id, public_key, bundle_hash (SHA-256 of the canonical bundle, as Transaction Audit returns it), filed_at, claim text, optional facts {name: value} and optional events {event hash: agree|contest}. Get back recorded or invalid, every check, what both agree on, what is contested, what only one states, and a record signed by LLPRO with the time we saw it, checkable offline. It records; it never rules or awards. Nothing is kept (the A2A door keeps a result for 7 days). Free.",
          "inputSchema": {
            "properties": {
              "bundle": {
                "description": "the Transaction Audit bundle exactly as audited: {parties, events}",
                "type": "object"
              },
              "positions": {
                "items": {
                  "properties": {
                    "bundle_hash": {
                      "pattern": "^[0-9a-f]{64}$",
                      "type": "string"
                    },
                    "claim": {
                      "description": "the party's own words; recorded, never judged",
                      "maxLength": 2000,
                      "type": "string"
                    },
                    "dispute_id": {
                      "description": "a name both parties use for this dispute",
                      "maxLength": 128,
                      "type": "string"
                    },
                    "events": {
                      "additionalProperties": {
                        "enum": ["agree", "contest"],
                        "type": "string"
                      },
                      "maxProperties": 40,
                      "type": "object"
                    },
                    "facts": {
                      "additionalProperties": {
                        "maxLength": 200,
                        "type": "string"
                      },
                      "maxProperties": 24,
                      "type": "object"
                    },
                    "filed_at": {
                      "description": "UTC time like 2026-11-13T09:00:00Z",
                      "type": "string"
                    },
                    "party_id": {
                      "description": "this party's id in the bundle",
                      "maxLength": 64,
                      "type": "string"
                    },
                    "public_key": {
                      "description": "this party's Ed25519 public key, the same as in the bundle",
                      "type": "string"
                    },
                    "sig": {
                      "description": "Ed25519 signature over the canonical JSON of the position without sig",
                      "type": "string"
                    },
                    "type": {
                      "enum": ["dispute-position"],
                      "type": "string"
                    },
                    "v": {
                      "enum": [1],
                      "type": "integer"
                    }
                  },
                  "required": ["bundle_hash", "claim", "dispute_id", "filed_at", "party_id", "public_key", "sig", "type", "v"],
                  "type": "object"
                },
                "maxItems": 2,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["bundle", "positions"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "When two parties to one deal disagree, record both signed positions and what they agree on and contest. Records; never rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c6056a141585b74ea0045c59f0edc8a4186f795da2c8b8b57c558807f619a556"
        },
        {
          "name": "handoff_record",
          "title": "When a long run stops to ask a human, record the question, the answer and who approved it as one signed, dated record",
          "description": "A long-running agent stopped and asked a human. Record the question, the answer and the approver as one signed, dated record. Send the question (run_id, agent_id, asked_at, text; optionally signed by the agent's key) and the answer (the same run_id, question_hash = SHA-256 of the canonical question, decision approve, deny or answer, text, approver_id, approver_key, answered_at, sig by the approver's Ed25519 key). Optionally send expected_approver / expected_agent (public keys you trust). Get back valid or invalid, every check with pass or fail, and a record signed by LLPRO with the time we saw it, checkable offline. We do not keep the documents you send. It does not show who the approver is, that they saw the question as written, or that answered_at is true. Free.",
          "inputSchema": {
            "properties": {
              "answer": {
                "properties": {
                  "answer": {
                    "maxLength": 2000,
                    "type": "string"
                  },
                  "answered_at": {
                    "description": "UTC time like 2026-11-12T09:05:00Z",
                    "type": "string"
                  },
                  "approver_id": {
                    "maxLength": 128,
                    "type": "string"
                  },
                  "approver_key": {
                    "description": "the approver's Ed25519 public key, 32 bytes, canonical base64",
                    "type": "string"
                  },
                  "decision": {
                    "enum": ["approve", "deny", "answer"],
                    "type": "string"
                  },
                  "question_hash": {
                    "description": "SHA-256 (hex) of the canonical JSON of the question without sig",
                    "pattern": "^[0-9a-f]{64}$",
                    "type": "string"
                  },
                  "run_id": {
                    "maxLength": 128,
                    "type": "string"
                  },
                  "sig": {
                    "description": "approver signature over the canonical JSON of the answer without sig",
                    "type": "string"
                  },
                  "type": {
                    "enum": ["handoff-answer"],
                    "type": "string"
                  },
                  "v": {
                    "enum": [1],
                    "type": "integer"
                  }
                },
                "required": ["answer", "answered_at", "approver_id", "approver_key", "decision", "question_hash", "run_id", "sig", "type", "v"],
                "type": "object"
              },
              "expected_agent": {
                "description": "the agent public key you expect; if it differs (or the question is unsigned) the record is invalid",
                "type": "string"
              },
              "expected_approver": {
                "description": "the approver public key you expect; if it differs the record is invalid",
                "type": "string"
              },
              "question": {
                "properties": {
                  "agent_id": {
                    "maxLength": 128,
                    "type": "string"
                  },
                  "agent_key": {
                    "description": "optional: the agent's Ed25519 public key, canonical base64; send with sig",
                    "type": "string"
                  },
                  "asked_at": {
                    "description": "UTC time like 2026-11-12T09:00:00Z",
                    "type": "string"
                  },
                  "question": {
                    "maxLength": 2000,
                    "type": "string"
                  },
                  "run_id": {
                    "maxLength": 128,
                    "type": "string"
                  },
                  "sig": {
                    "description": "optional: agent signature over the canonical JSON of the question without sig",
                    "type": "string"
                  },
                  "type": {
                    "enum": ["handoff-question"],
                    "type": "string"
                  },
                  "v": {
                    "enum": [1],
                    "type": "integer"
                  }
                },
                "required": ["agent_id", "asked_at", "question", "run_id", "type", "v"],
                "type": "object"
              }
            },
            "required": ["answer", "question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "When a long run stops to ask a human, record the question, the answer and who approved it as one signed, dated record"
          },
          "behavior": {
