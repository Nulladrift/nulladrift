        {
          "name": "list_health_insurance_quotes",
          "title": "List health-insurance quotes",
          "description": "Returns indicative monthly private health-insurance (seguro de salud) premiums available through PuntoSeguro for residents of Spain, given the age of each person to insure and their province: insurer, product, cover type (full, outpatient or reimbursement), copay, main covers, documentation and a link to apply on puntoseguro.com, and displays the comparison interface where supported. When the ages or the province are missing, it returns PuntoSeguro's quote form and the list of missing details instead of quotes. Uses no medical information. Results are limited to the insurers available through PuntoSeguro and are not a whole-market comparison.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "insured_ages": {
                "description": "Age in whole years (0-99) of each person to insure, one entry per person",
                "items": {
                  "maximum": 99,
                  "minimum": 0,
                  "type": "integer"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "province": {
                "description": "Spanish province where the insured people live; for the Balearic Islands choose the island option",
                "enum": ["Álava", "Albacete", "Alicante", "Almería", "Asturias", "Ávila", "Badajoz", "Barcelona", "Burgos", "Cáceres", "Cádiz", "Cantabria", "Castellón", "Ceuta", "Ciudad Real", "Córdoba", "Cuenca", "Gerona", "Granada", "Guadalajara", "Guipúzcoa", "Huelva", "Huesca", "Islas Baleares (Mallorca)", "Islas Baleares (Menorca, Ibiza o Formentera)", "Jaén", "La Coruña", "La Rioja", "Las Palmas", "León", "Lérida", "Lugo", "Madrid", "Málaga", "Melilla", "Murcia", "Navarra", "Orense", "Palencia", "Pontevedra", "Salamanca", "Santa Cruz de Tenerife", "Segovia", "Sevilla", "Soria", "Tarragona", "Teruel", "Toledo", "Valencia", "Valladolid", "Vizcaya", "Zamora", "Zaragoza"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "currency": {
                "const": "EUR",
                "type": "string"
              },
              "insured_count": {
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "missing_fields": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "offer_count": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "offers": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "annual_premium_eur": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "application_url": {
                      "format": "uri",
                      "type": "string"
                    },
                    "category": {
                      "description": "full: primary care, specialists, hospitalisation and emergencies; outpatient: no hospitalisation; reimbursement: free choice of doctor with partial reimbursement",
                      "enum": ["full", "outpatient", "reimbursement"],
                      "type": "string"
                    },
                    "copay": {
                      "enum": ["none", "reduced", "yes"],
                      "type": "string"
                    },
                    "cover_details": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "assisted_reproduction": {
