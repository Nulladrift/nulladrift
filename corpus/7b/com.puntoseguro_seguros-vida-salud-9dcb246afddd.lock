            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "annual_net_income_eur": {
                "description": "Annual net income to protect for dependants, in euros",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "existing_life_cover_eur": {
                "default": 0,
                "description": "Existing life-insurance cover already in force, in euros",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "outstanding_debts_eur": {
                "default": 0,
                "description": "Outstanding debts, including mortgage balance, in euros",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["annual_net_income_eur"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "additional_cover_needed_eur": {
                "minimum": 0,
                "type": "number"
              },
              "annual_net_income_eur": {
                "minimum": 0,
                "type": "number"
              },
              "calculated_coverage_eur": {
                "minimum": 0,
                "type": "number"
              },
              "calculator_url": {
                "const": "https://www.puntoseguro.com/seguros-de-vida/calculadora-capital/",
                "type": "string"
              },
              "disclaimer": {
                "type": "string"
              },
              "existing_life_cover_eur": {
                "minimum": 0,
                "type": "number"
              },
              "gross_protection_need_eur": {
                "minimum": 0,
                "type": "number"
              },
              "income_protection_eur": {
