          },
          "digest": "sha256:4d41c4d7ee98174a58c5d7ccf8b7ee1f54eff9a7ac6e5175d66abc6e0049db0a"
        },
        {
          "name": "list_coverage",
          "title": "What Dishes of London covers",
          "description": "The boroughs and neighbourhoods Dishes of London covers (with venue counts), the dish categories it groups menus into, and the diet filters find_dishes accepts. Call it when you need a valid area name, or to tell someone whether their part of London is covered yet. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
