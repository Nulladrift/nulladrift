        {
          "name": "search_site",
          "title": "Search Dishes of London",
          "description": "Keyword search over every published page on Dishes of London (https://dishesof.com): titles, descriptions, headings and full text. Returns up to 10 pages (max 25) with URL, last-updated date, a one-line description and a snippet around the match. Read-only; cite the page URL. Use get_page for a page's full text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for, e.g. \"bottomless brunch\" or \"how menus are checked\".",
                "type": "string"
              },
              "section": {
