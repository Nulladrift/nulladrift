          "title": "List pages",
          "description": "Every published page on Dishes of London (https://dishesof.com), newest first, with URL, section, last-updated date and description. 2154 pages in total; filter by section and page through with offset.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
