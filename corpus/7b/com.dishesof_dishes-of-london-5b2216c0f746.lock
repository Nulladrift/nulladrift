      "serverInfo": {
        "name": "dishesof.com",
        "title": "Dishes of London",
        "version": "2026-11-12"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Dishes of London: Working towards every dish on every menu in London, checked with the venue. Find the dish, not just the restaurant: what is on the menu, what it costs, when it is served, and who has confirmed it. This is a pilot covering 635 East and Central London venues, not yet all of London. To find where to eat a dish, call find_dishes with the dish, plus area or near (a postcode), max_price, diet or when if the person gave them; it returns venues with each dish's printed price and the venue's page URL. Call list_coverage for the areas covered (7 boroughs, not all of London). For anything else on the site (guides, how menus are checked), use search_site, then get_page for the full text. Cite page URLs and the menu_checked date; prices are as printed on that date, and diet labels are the venue's own.",
      "tools": [
        {
          "name": "find_dishes",
          "title": "Find a dish in London",
          "description": "Find venues in the covered parts of London that serve a dish, with each matching dish's name, price as printed on the menu, the venue's own diet labels, and the link to the venue's page. Filters: an area name, or a postcode / coordinates with a radius; a maximum price; a diet; and when it is served. Coverage is 7 London boroughs (Camden, City of London, Hackney, Islington, Newham, Tower Hamlets, Waltham Forest), not all of London: call list_coverage for the area names. Diet filters only match labels the venue prints on the dish, never a guess, so check allergies with the venue. Times come from the menu where it prints them; venues that only have opening hours are listed separately as times_not_printed. Prices are as read on the date shown, not live. Read-only. Use get_page with a venue URL for the full menu.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area": {
                "description": "Optional: a borough or neighbourhood by name, e.g. \"Shoreditch\", \"Camden Town\", \"Hackney\". Matches venues inside it. Use near instead for a postcode or a point.",
                "type": "string"
              },
              "diet": {
                "description": "Optional: vegan (also matches \"vegan option\"), vegetarian (includes vegan), gluten-free (also matches \"GF option\"), dairy-free, halal. Only labels the venue prints on that dish count.",
                "enum": ["vegan", "vegetarian", "gluten-free", "dairy-free", "halal"],
                "type": "string"
              },
              "dish": {
                "description": "The dish or food in plain words, e.g. \"fish and chips\", \"pulled pork burger\", \"dosa\", \"bottomless brunch\". Several dishes joined by \"and\" must all be at the same venue (\"wings and chips\").",
                "type": "string"
              },
              "limit": {
                "description": "Venues to return. Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Optional: highest price in pounds (GBP) for the dish, e.g. 12. Dishes with no printed price are left out when this is set.",
                "minimum": 0,
                "type": "number"
              },
              "near": {
                "description": "Optional: a UK postcode (\"E8 3RL\"), a postcode district (\"N1\"), or \"latitude,longitude\". Matches venues within radius_km, nearest first. Postcodes are looked up on postcodes.io.",
                "type": "string"
              },
              "radius_km": {
                "description": "Only with near: how far to look, in km. Default 1.5 for a full postcode or a point, 2.5 for a postcode district.",
                "maximum": 5,
                "minimum": 0.2,
                "type": "number"
              },
              "when": {
                "description": "Optional, in London time: now = serving at this minute; tonight = from 17:00 today; today / tomorrow = any time that day; breakfast, brunch, lunch, dinner = that window today; a weekday = any time that day.",
                "enum": ["now", "tonight", "today", "tomorrow", "breakfast", "brunch", "lunch", "dinner", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"],
                "type": "string"
              }
            },
            "required": ["dish"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:344dc81b48d1d0be38983d3df3edcb6e50874298db365bcc8e97d2b238ef73fd"
        },
        {
          "name": "get_page",
          "title": "Read one page",
          "description": "The full text of one page on Dishes of London (https://dishesof.com) as Markdown, with its title, URL, last-updated date and any structured fields (verdicts, categories and so on). Pass the page URL or its path, as returned by search_site or list_pages. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Full URL (https://dishesof.com/…) or path (\"/about/\").",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
