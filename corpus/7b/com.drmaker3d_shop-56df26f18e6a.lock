        },
        {
          "name": "print_price_examples",
          "title": "Custom 3D print price examples",
          "description": "Real prices from the DrMaker3D instant quote for three reference parts (a 2 in clip or knob, a 6 in enclosure, an 8 in housing) in each material, at Standard quality, 20% infill, one copy, before shipping. These examples are estimates. For a specific file, use quote_custom_print and follow its quote_status. Also lists the upfront prices for a figure made from a person's photo or AI picture (see figure_from_picture.options for current sizes, colors and prices before shipping), ordered on its own page, and the prices of cake toppers, name keychains and photo lithophanes, each designed on its own page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "material": {
                "description": "Optional material name, e.g. PLA, PETG, TPU, ABS, ASA, PC, PA-CF, PETG-CF, PPA-CF, PPS-CF, \"Nylon (PA)\". Omit for all.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3e39aa12891f4b77b7afca3014080af78809670c2270dcd272841ecb13b5101d"
        },
        {
          "name": "quote_custom_print",
          "title": "Estimate or confirmed price for a 3D model",
          "description": "Prices a 3D model using the DrMaker3D engine. Give the attached file as file, or send the key from POST /api/upload (kind=printiq; STL, OBJ, 3MF, GLB, glTF or PLY up to 25 MB). Read quote_status: final includes checkout_item, estimate needs confirmation on the website, studio_review needs Rich to check it, and unavailable needs corrected input or a retry. Only final prices can proceed to create_checkout. Use request_quote with permission to send a review request.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "color": {
                "description": "A color of that material from print_options, e.g. \"Black\" or \"Matte Charcoal\".",
                "type": "string"
              },
              "copies": {
                "description": "How many of the model, default 1.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "email": {
                "description": "The person's own email, supplied with permission. Required when the instant-price email gate is enabled; never invent an address.",
                "type": "string"
              },
              "file": {
                "additionalProperties": true,
                "description": "The person's model file as ChatGPT passes an attached file (a link on files.oaiusercontent.com or OpenAI’s own file storage). Give this or file_key.",
                "properties": {
                  "download_url": {
                    "type": "string"
                  },
                  "file_id": {
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "file_key": {
                "description": "The key POST /api/upload returned (starts with \"printiq/\"). Give this or file.",
                "type": "string"
              },
              "finish": {
                "description": "Optional color family, e.g. \"PLA Matte\", when a color name is in two families.",
                "type": "string"
              },
              "infill": {
                "description": "Percent, default 15. 50 and up for functional parts.",
                "maximum": 100,
                "minimum": 10,
                "type": "integer"
              },
              "material": {
                "description": "A material from print_options, e.g. PLA, PETG, \"TPU (flexible)\", ABS, ASA, \"Nylon (PA)\", PC, PA-CF, PETG-CF, PPA-CF, PPS-CF.",
                "type": "string"
              },
              "quality": {
                "description": "Default standard. Draft only for parts 100 mm or more across.",
                "enum": ["draft", "fast", "standard", "high"],
                "type": "string"
              },
              "units": {
                "description": "Default mm. \"inches\" for an STL or OBJ drawn in inches.",
                "enum": ["mm", "inches"],
                "type": "string"
              }
            },
            "required": ["color", "material"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "checkout_item": {
                "description": "Present only for a final price. Pass it unchanged to create_checkout.",
                "type": "object"
              },
              "estimate_usd": {
                "description": "Estimated item total before shipping and tax.",
                "type": "number"
              },
              "message": {
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              },
              "price_usd": {
                "description": "Confirmed item total before shipping and tax.",
                "type": "number"
              },
              "quote_status": {
                "enum": ["estimate", "final", "studio_review", "unavailable"]
              },
              "request_quote_file_key": {
                "type": "string"
              },
              "send_human_to": {
                "type": "string"
              }
            },
            "required": ["ok", "quote_status"],
            "type": "object"
          },
