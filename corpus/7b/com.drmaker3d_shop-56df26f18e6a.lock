      },
      "transport": {
        "type": "http",
        "url": "https://drmaker3d.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "drmaker3d",
        "title": "DrMaker3D: custom printing and CookieMaker3D",
        "version": "2026-11-18",
        "description": "Instant prices and checkout links for custom 3D prints, plus prices, products, order tracking and quote requests, from a 3D printing studio in Connecticut.",
        "websiteUrl": "https://drmaker3d.com",
        "icons": [
          {
            "src": "https://drmaker3d.com/apple-touch-icon.png",
            "mimeType": "image/png",
            "sizes": ["180x180"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "DrMaker3D is a one-person 3D printing and 3D modeling studio in Burlington, Connecticut that ships across the U.S. and worldwide: custom prints from a file, a photo or a model link, figures from a photo, gifts, custom cookie cutters and cake toppers. Prices come only from these tools: print_price_examples for reference and fixed prices, quote_custom_print for a person's own file (upload it first, as print_options explains), search_products to find a catalog handle and get_product_offers for available variants, exact unit prices and links. Describe an estimate as provisional, use the returned next action for studio review, and call create_checkout only when quote_status is final. create_checkout returns a link the person pays in a browser; nothing is charged by a tool. Anything quoted by hand goes through request_quote, only with the person's permission and their own email. Policies for agents: https://drmaker3d.com/pages/for-ai-agents.",
      "tools": [
        {
          "name": "about_drmaker3d",
          "title": "About DrMaker3D",
          "description": "What DrMaker3D (drmaker3d.com) offers and how it works: a one-person 3D printing and 3D modeling studio in Burlington, Connecticut that ships across the U.S. Custom 3D printing with an instant online quote for STL, OBJ, 3MF and STEP files, design from a photo, sketch or idea, upfront-priced figures made from a photo or AI picture (one or two on a base, pets, wedding cake toppers), printing models from Printables, Thingiverse or MakerWorld links, CookieMaker3D custom cookie cutters, cake toppers, gifts with a gift finder, 3D printed lake maps, paying by invoice or tax exempt for schools and businesses, nine materials, made-to-order pendant lights, turnaround, shipping and how to order. Use it to answer questions about the studio: what it makes, from what, how long it takes and how ordering works.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "topic": {
                "description": "Which part to return; \"all\" for everything.",
                "enum": ["all", "custom-printing", "cookie-cutters", "gifts", "lake-maps", "materials", "pendant-lights", "ordering", "contact"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d7e0763dc1107d1a87918c74c2d4ed6e9139538a741f5b74a412751206aef05f"
        },
        {
          "name": "create_checkout",
          "title": "Create a checkout link for custom prints",
          "description": "Creates a Stripe Checkout link for one or more custom prints with a final quote_status from quote_custom_print, for the person to open and pay in a browser. Nothing is charged by this tool and no order exists until the person pays. Each print is priced again on the server (send checkout_item as quote_custom_print returned it; prices are never taken from the request). Needs the destination ZIP (or country and postal code), since shipping is priced to it. Returns order_link, a drmaker3d.com page that shows the order and opens a fresh payment page, good for 7 days: give the person that. checkout_url is the Stripe page itself, good for two hours. Catalog products, figures, keychains, lithophanes, cake toppers and cookie cutters are bought on their own pages: give the person that page from search_products or print_price_examples.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "description": "Optional: the name of your agent or service.",
                "type": "string"
              },
              "country": {
                "description": "Two-letter country code, default US.",
                "type": "string"
              },
              "email": {
                "description": "The person's own email, supplied with permission. Required when the instant-price email gate is enabled; never invent an address.",
                "type": "string"
              },
              "postal_code": {
                "description": "Postal code outside the U.S.",
                "type": "string"
              },
              "prints": {
                "description": "Each print's checkout_item from quote_custom_print.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "color": {
                      "type": "string"
                    },
                    "copies": {
                      "maximum": 1000,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "file_key": {
                      "type": "string"
                    },
                    "finish": {
                      "type": "string"
                    },
                    "infill": {
                      "maximum": 100,
                      "minimum": 10,
                      "type": "integer"
                    },
                    "material": {
                      "type": "string"
                    },
                    "quality": {
                      "enum": ["draft", "fast", "standard", "high"],
                      "type": "string"
                    },
                    "units": {
                      "enum": ["mm", "inches"],
                      "type": "string"
                    }
                  },
                  "required": ["color", "file_key", "material"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "zip": {
                "description": "U.S. ZIP code it ships to.",
                "type": "string"
              }
            },
            "required": ["prints"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8249a6995c6814df47925578bdaaa5d081da56158658d65bcd23e856473c1e77"
        },
        {
          "name": "get_product_offers",
          "title": "Get purchasable product options",
          "description": "Use the handle from search_products to find a public catalog product’s available variants, options, unit prices in USD cents and delivery type. Share the selected purchase_url with the shopper to open that variant on its storefront. For more variants, call again with pagination.next_offset as offset. Shipping, tax and optional customizations are determined on the site.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "handle": {
                "description": "Public product handle from search_products.",
                "type": "string"
              },
              "limit": {
                "default": 8,
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["handle"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "brand": {
                "type": "string"
              },
              "canonical_url": {
                "format": "uri",
                "type": "string"
              },
              "currency": {
                "enum": ["USD"],
                "type": "string"
              },
              "delivery": {
                "enum": ["physical", "digital_download", "gift_card"],
                "type": "string"
              },
              "handle": {
                "type": "string"
              },
              "offers": {
                "items": {
                  "properties": {
                    "list_price_cents": {
                      "description": "The price before a running sale, present only while one is on.",
                      "type": "integer"
                    },
                    "options": {
                      "additionalProperties": {
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "price_cents": {
                      "description": "Unit price in USD cents before shipping, tax and optional customizations.",
                      "type": "integer"
                    },
                    "purchase_url": {
                      "description": "Share this link to open the selected variant.",
                      "format": "uri",
                      "type": "string"
                    },
                    "sale_ends": {
                      "description": "When a running sale ends (ISO 8601), present only while one is on.",
                      "type": "string"
                    },
                    "sku": {
                      "type": ["string", "null"]
                    },
                    "title": {
                      "type": "string"
                    },
                    "variant_id": {
                      "type": "string"
                    }
                  },
                  "required": ["options", "price_cents", "purchase_url", "title", "variant_id"],
                  "type": "object"
                },
                "type": "array"
              },
              "pagination": {
                "properties": {
                  "limit": {
                    "default": 8,
                    "maximum": 12,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "next_offset": {
                    "description": "Request this offset with the same handle for more variants. Null on the last page.",
                    "type": ["integer", "null"]
                  },
                  "offset": {
                    "default": 0,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "total": {
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["limit", "next_offset", "offset", "total"],
                "type": "object"
              },
              "title": {
                "type": "string"
              }
            },
            "required": ["brand", "canonical_url", "currency", "delivery", "handle", "offers", "pagination", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
