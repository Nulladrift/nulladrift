          "digest": "sha256:96b99dbedc5a1ff1323e225f77ec9f9a631e509b48a3872a3b648444c5065556"
        },
        {
          "name": "request_quote",
          "title": "Request a custom 3D printing or design quote",
          "description": "Send a quote request to Rich at DrMaker3D for a person who wants something 3D printed or designed. Only with the person's permission, and only with their own name and email: Rich replies to that email, within one business day, with a price and a link to pay online (the person pays in a browser; nothing is charged here). Describe what it is, its size, material or color if known, how many, and when it is needed. A file is optional: give a public share link to an STL, OBJ, 3MF or STEP file, or a Printables, Thingiverse or MakerWorld model link; with no file, describe it (with measurements) and it is designed and printed, quoted together.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "description": {
                "description": "What they want made, its size, use, material or color, quantity and deadline.",
                "type": "string"
              },
              "email": {
                "description": "The person's own email address, where Rich will reply.",
                "type": "string"
              },
              "file_key": {
                "description": "Optional: the key POST /api/upload returned for the file (kind printiq or printiq-manual), e.g. the one quote_custom_print sent here for a hand quote.",
                "type": "string"
              },
              "file_url": {
                "description": "Optional public link to the 3D file or model page.",
                "type": "string"
              },
              "name": {
                "description": "The person's name.",
                "type": "string"
              },
              "needed_by": {
                "description": "Optional date or timeframe.",
                "type": "string"
              },
              "quantity": {
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "requested_material": {
                "description": "Optional special-order material ID from print_options.manual_quote_materials. Requires a manual quote; never an instant-price material.",
                "type": "string"
              },
              "wants": {
                "description": "What they need.",
                "enum": ["print my file", "design and print", "design only"],
                "type": "string"
              },
              "zip": {
                "description": "Optional U.S. ZIP or country, for shipping.",
                "type": "string"
              }
            },
            "required": ["description", "email", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6bb7fd53b7b71afb47cf8ab745ea02c3b7ccaf2c4f75af2cb7534cbe3eb4eed9"
        },
        {
          "name": "search_products",
          "title": "Search DrMaker3D products",
          "description": "Search the DrMaker3D shop (pendant lights, sets, gifts, gift cards and other made-to-order products) and its service pages (a figure from a photo, a pet figure, a wedding cake topper figure, the cake topper and cookie cutter makers, lake maps, the gift finder, paying by invoice) by words. Returns titles, starting prices in U.S. dollars where there is one, and links. A custom print from a file has no product: use about_drmaker3d, print_price_examples or request_quote for those.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Most results to return (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to match, e.g. \"ribbed pendant\" or \"gift card\". Empty lists the shop.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
