      "serverInfo": {
        "name": "drmaker3d",
        "title": "DrMaker3D: custom printing and CookieMaker3D",
        "version": "2026-10-26",
        "description": "Instant prices and checkout links for custom 3D prints, plus prices, products, order tracking and quote requests, from a 3D printing studio in Connecticut.",
        "websiteUrl": "https://drmaker3d.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "DrMaker3D is a one-person 3D printing and 3D modeling studio in Burlington, Connecticut that ships across the U.S. and worldwide: custom prints from a file, a photo or a model link, figures from a photo, gifts, custom cookie cutters and cake toppers. Prices come only from these tools: print_price_examples for reference and fixed prices, quote_custom_print for a person's own file (upload it first, as print_options explains), search_products for the shop. create_checkout returns a link the person pays in a browser; nothing is charged by a tool. Anything quoted by hand goes through request_quote, only with the person's permission and their own email. Policies for agents: https://drmaker3d.com/pages/for-ai-agents.",
      "tools": [
        {
          "name": "about_drmaker3d",
          "title": "About DrMaker3D",
          "description": "What DrMaker3D (drmaker3d.com) offers and how it works: a one-person 3D printing and 3D modeling studio in Burlington, Connecticut that ships across the U.S. Custom 3D printing with an instant online quote for STL, OBJ, 3MF and STEP files, design from a photo, sketch or idea, upfront-priced figures made from a photo or AI picture (one or two on a base, pets, wedding cake toppers), printing models from Printables, Thingiverse or MakerWorld links, CookieMaker3D custom cookie cutters, cake toppers, gifts with a gift finder, 3D printed lake maps, paying by invoice or tax exempt for schools and businesses, nine materials, made-to-order pendant lights, turnaround, shipping and how to order. Use it to answer questions about the studio: what it makes, from what, how long it takes and how ordering works.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "topic": {
                "description": "Which part to return; \"all\" for everything.",
                "enum": ["all", "custom-printing", "cookie-cutters", "gifts", "lake-maps", "materials", "pendant-lights", "ordering", "contact"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d7e0763dc1107d1a87918c74c2d4ed6e9139538a741f5b74a412751206aef05f"
        },
        {
          "name": "create_checkout",
          "title": "Create a checkout link for custom prints",
          "description": "Creates a Stripe Checkout link for one or more custom prints quoted with quote_custom_print, for the person to open and pay in a browser. Nothing is charged by this tool and no order exists until the person pays. Each print is priced again on the server (send checkout_item as quote_custom_print returned it; prices are never taken from the request). Needs the destination ZIP (or country and postal code), since shipping is priced to it. Returns order_link, a drmaker3d.com page that shows the order and opens a fresh payment page, good for 7 days: give the person that. checkout_url is the Stripe page itself, good for two hours. Catalog products, figures, keychains, lithophanes, cake toppers and cookie cutters are bought on their own pages: give the person that page from search_products or print_price_examples.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "description": "Optional: the name of your agent or service.",
                "type": "string"
              },
              "country": {
                "description": "Two-letter country code, default US.",
                "type": "string"
              },
              "email": {
                "description": "The person's own email, supplied with permission. Required when the instant-price email gate is enabled; never invent an address.",
                "type": "string"
              },
              "postal_code": {
                "description": "Postal code outside the U.S.",
                "type": "string"
              },
              "prints": {
                "description": "Each print's checkout_item from quote_custom_print.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "color": {
                      "type": "string"
                    },
                    "copies": {
                      "maximum": 250,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "file_key": {
                      "type": "string"
                    },
                    "finish": {
                      "type": "string"
                    },
                    "infill": {
                      "maximum": 100,
                      "minimum": 10,
                      "type": "integer"
                    },
                    "material": {
                      "type": "string"
                    },
                    "quality": {
                      "enum": ["draft", "fast", "standard", "high"],
                      "type": "string"
                    },
                    "units": {
                      "enum": ["mm", "inches"],
                      "type": "string"
                    }
                  },
                  "required": ["color", "file_key", "material"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "zip": {
                "description": "U.S. ZIP code it ships to.",
                "type": "string"
              }
            },
            "required": ["prints"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
