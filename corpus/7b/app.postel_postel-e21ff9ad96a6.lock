          "description": "Schedule a Postel draft for publishing to the social platform stored on the post. scheduledDateTime must be a future UTC ISO-8601 timestamp. A first comment can be set for LinkedIn posts. Scheduling and publishing depend on the account's Postel plan; a workspace without one can schedule or publish a limited number of posts, and the result says how many are left. Past that, the post stays a draft and the result says so. If the workspace requires approval, the post is submitted for approval instead (status PENDING_APPROVAL) and an owner/admin must approve it in Postel.",
