        {
          "name": "create-post",
          "title": "Create draft post",
          "description": "Save text as a new draft in Postel, optionally with images or videos downloaded from public URLs and a LinkedIn first comment (up to 1250 characters). Does not publish or schedule. Each call creates a separate draft. Drafts are free on every plan.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "content": {
                "description": "The post content",
                "maxLength": 10000,
                "type": "string"
              },
              "firstComment": {
                "description": "LinkedIn only: comment posted under the post right after it is published. Max 1250 characters.",
                "maxLength": 1250,
                "type": "string"
              },
              "mediaUrls": {
                "description": "Public image or video URLs to download and attach (max 4). X: up to 4 images, or one video or GIF. LinkedIn: images, or one video.",
                "items": {
                  "description": "Public http(s) URL of an image or video",
                  "format": "uri",
                  "maxLength": 2048,
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "platform": {
                "description": "Destination platform: \"x\" (default), \"linkedin\", \"bluesky\", \"mastodon\", \"youtube\", \"instagram\" or \"tiktok\"",
                "enum": ["x", "linkedin", "linkedin_page", "bluesky", "mastodon", "threads", "youtube", "instagram", "tiktok"],
                "type": "string"
              },
              "status": {
                "description": "Post status (default: DRAFT)",
                "enum": ["DRAFT", "EDITING"],
                "type": "string"
              }
            },
            "required": ["content"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["postel:mcp"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:019c08b1f8c15f277967c79461588f98e0218749c0ea3ccea49a07f6e94c036d"
        },
        {
          "name": "create-posts",
          "title": "Create posts in bulk",
          "description": "Create up to 25 posts in one call. Each post is saved as a draft; a post with scheduledDateTime is then scheduled for publishing to its platform. Scheduling and publishing depend on the account's Postel plan; a workspace without one can schedule or publish a limited number of posts, and the result says how many are left. Past that, the post stays a draft and the result says so. If the workspace requires approval, a dated post is submitted for approval instead (status PENDING_APPROVAL) and an owner/admin must approve it in Postel. Posts are processed in order with one result each, so some can succeed while others fail. At most 25 media URLs per call.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "posts": {
                "description": "Posts to create, in order",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "content": {
                      "description": "The post content",
                      "maxLength": 10000,
                      "type": "string"
                    },
                    "firstComment": {
                      "description": "LinkedIn only: comment posted under the post right after it is published. Max 1250 characters.",
                      "maxLength": 1250,
                      "type": "string"
                    },
                    "mediaUrls": {
                      "description": "Public image or video URLs to download and attach (max 4). X: up to 4 images, or one video or GIF. LinkedIn: images, or one video.",
                      "items": {
                        "description": "Public http(s) URL of an image or video",
                        "format": "uri",
                        "maxLength": 2048,
                        "type": "string"
                      },
                      "maxItems": 4,
                      "type": "array"
                    },
                    "platform": {
                      "description": "Destination platform: \"x\" (default), \"linkedin\", \"bluesky\", \"mastodon\", \"youtube\", \"instagram\" or \"tiktok\"",
                      "enum": ["x", "linkedin", "linkedin_page", "bluesky", "mastodon", "threads", "youtube", "instagram", "tiktok"],
                      "type": "string"
                    },
                    "scheduledDateTime": {
                      "description": "UTC ISO-8601 time to publish (must be in the future). Omit to keep the post as a draft",
                      "format": "date-time",
                      "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z))$",
                      "type": "string"
                    }
                  },
                  "required": ["content"],
                  "type": "object"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["posts"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
