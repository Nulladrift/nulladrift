        {
          "name": "compare_localities",
          "title": "Compare Indian localities head-to-head",
          "description": "Compare 2–3 localities in one city side-by-side: price trends, livability, investment grade, strengths, and watchouts. Use when the user asks \"X vs Y\" or \"which is better for buying/renting\" about neighborhoods. Covers cities AVnester publishes locality guides for; others return supported=false — surface the scopeMessage. For specific LISTINGS by ID, use compare_properties instead.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "Indian city covering all compared localities.",
                "maxLength": 60,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9 .,'’()\\-஀-௿ऀ-ॿ]+$",
                "type": "string"
              },
              "localities": {
                "description": "2–3 localities to compare (array, not comma-separated string).",
                "items": {
                  "maxLength": 80,
