        {
          "name": "optimize_home_loan_tax_regime",
          "title": "Optimize home-loan tax regime (calculator)",
          "description": "Compare a home-loan borrower's income tax under the OLD vs NEW regime (tax year 2026-27, Income-tax Act, 2025) and recommend which regime saves more income tax. Deterministic slab math — not tax advice. Use when the user asks \"old or new tax regime\", \"home-loan tax benefit\", or \"section 80C / 24(b) deduction\". Models interest (s.22, old 24(b)) + principal (s.123, old 80C); a joint loan is the user's own share. The response lists benefits it does NOT model. Includes a disclaimer field to show.",
          "inputSchema": {
            "properties": {
              "ageBand": {
                "description": "Taxpayer age band — raises the OLD-regime basic exemption (senior 60–80 → ₹3L, super-senior 80+ → ₹5L). New regime unaffected. Defaults to below60.",
                "enum": ["below60", "senior", "super_senior"],
                "type": "string"
              },
              "annualIncome": {
                "description": "Annual gross income in INR EXCLUDING house property (salary + other income).",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "annualRent": {
                "description": "Annual rent received in INR for let_out (taken as 0 if omitted).",
                "minimum": 0,
                "type": "integer"
              },
              "countryOfResidence": {
                "description": "NRI only — DTAA article lookup hint. Free-form country name.",
                "maxLength": 50,
                "type": "string"
              },
              "hasForm15CB": {
                "description": "NRI only — whether Form 15CB CA-attestation is already in hand.",
                "type": "boolean"
              },
              "holdingMonths": {
                "description": "NRI only — holding period in months. ≤24 is STCG; >24 is LTCG.",
                "minimum": 0,
                "type": "integer"
              },
              "homeLoanInterest": {
                "description": "Annual home-loan interest paid (INR).",
                "minimum": 0,
                "type": "integer"
              },
              "homeLoanPrincipal": {
                "description": "Annual home-loan principal repaid (INR) — counts toward s.123 (old 80C).",
                "minimum": 0,
                "type": "integer"
              },
              "indexedCost": {
                "description": "NRI only — cost of acquisition (unindexed for an NRI). When omitted, TDS computed on full sale value.",
                "minimum": 0,
                "type": "integer"
              },
              "isSalaried": {
                "default": true,
                "description": "Whether the taxpayer is salaried (gets the standard deduction).",
                "type": "boolean"
              },
              "jointLoan": {
                "default": false,
                "description": "Joint loan: amounts are the whole loan's; result is the user's own share (equal split).",
                "type": "boolean"
              },
              "nroBalanceUsd": {
                "description": "NRI only — NRO account balance in USD equivalent for the repatriation cap math.",
                "minimum": 0,
                "type": "number"
              },
              "other80C": {
                "description": "Other s.123 (old 80C) investments in INR (PF, ELSS, insurance, etc.).",
                "minimum": 0,
                "type": "integer"
              },
              "otherOldRegimeDeductions": {
                "description": "Other OLD-regime-only deductions as a lump (HRA exemption, 80D, NPS 80CCD(1B), etc.).",
                "minimum": 0,
                "type": "integer"
              },
              "propertyType": {
                "default": "self_occupied",
                "description": "Whether the property is self-occupied or let out.",
                "enum": ["self_occupied", "let_out"],
                "type": "string"
              },
              "residencyStatus": {
                "description": "Default resident. Pass nri to get TDS (s.393(2), old §195) + LRS-cap math in the response.",
                "enum": ["resident", "nri"],
                "type": "string"
              },
              "saleValue": {
                "description": "NRI only — sale consideration in INR for the TDS computation.",
                "minimum": 0,
                "type": "integer"
              },
              "ytdRemittedUsd": {
                "description": "NRI only — FY-to-date USD already remitted under the $1M cap.",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["annualIncome", "homeLoanInterest", "homeLoanPrincipal"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "annualIncome": {
                "type": "integer"
              },
              "annualSaving": {
                "type": "integer"
              },
              "assumptions": {
                "additionalProperties": true,
                "properties": {
                  "notTaxAdvice": {
                    "enum": [true]
                  },
                  "regimeYear": {
                    "enum": ["FY2026-27"]
                  },
                  "section80EEAExcluded": {
                    "enum": [true]
                  },
                  "surchargeNotModeled": {
                    "enum": [true]
                  }
                },
                "required": ["notTaxAdvice", "regimeYear", "section80EEAExcluded", "surchargeNotModeled"],
                "type": "object"
              },
              "attribution": {
                "enum": ["AVnester"]
              },
              "cards": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "data": {
                      "additionalProperties": {},
                      "type": "object"
                    },
                    "priority": {
                      "type": "integer"
                    },
                    "template": {
                      "type": "string"
                    }
                  },
                  "required": ["data", "priority", "template"],
                  "type": "object"
                },
                "type": "array"
              },
              "disclaimer": {
                "type": "string"
              },
              "homeLoanTaxBenefitOld": {
                "type": "integer"
              },
              "jointLoan": {
                "type": "boolean"
              },
              "lawBasis": {
                "type": "string"
              },
              "new": {
                "additionalProperties": true,
                "properties": {
                  "deductionsApplied": {
                    "type": "integer"
                  },
                  "taxableIncome": {
                    "type": "integer"
                  },
