        {
          "name": "search_properties",
          "title": "Search India property listings",
          "description": "Search residential property listings anywhere in Tamil Nadu, India — any city or town. Use when the user names a place, locality, price band, BHK, or transaction type. Returns sanitized listing cards, newest first, with handoff URLs and a per-listing verification summary (verified + caveats); never returns seller contact details. `featured` marks a paid promotion; it does not change order. Places outside Tamil Nadu return supported=false with a scopeMessage.",
          "inputSchema": {
            "properties": {
              "bedrooms": {
                "description": "Number of bedrooms (BHK).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "city": {
                "description": "City or town in Tamil Nadu (e.g., \"Coimbatore\", \"Madurai\"). Omit to search every Tamil Nadu city.",
                "maxLength": 60,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9 .,'’()\\-஀-௿ऀ-ॿ]+$",
                "type": "string"
              },
              "furnishing": {
                "description": "Furnishing status (rental queries).",
                "enum": ["furnished", "semi-furnished", "unfurnished"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of listings to return (cap: 20). v1 abuse defense.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "locality": {
                "description": "Locality/neighborhood within the city (e.g., \"Saravanampatti\").",
                "maxLength": 80,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9 .,'’()\\-஀-௿ऀ-ॿ]+$",
                "type": "string"
              },
              "maxPrice": {
                "description": "Maximum price in INR.",
                "minimum": 0,
                "type": "integer"
              },
              "minPrice": {
                "description": "Minimum price in INR.",
                "minimum": 0,
                "type": "integer"
              },
              "propertyType": {
                "description": "Property type.",
                "enum": ["apartment", "villa", "plot", "independent_house"],
                "type": "string"
              },
              "rentalStructure": {
                "description": "Rental money structure: monthly rent, or a lump-sum lease (one refundable amount for a fixed tenure, no monthly rent). Only meaningful with transactionType=rent. Omit to include both.",
                "enum": ["monthly", "lease"],
                "type": "string"
              },
              "transactionType": {
                "description": "Whether to search for sale or rent. Omit to include both.",
                "enum": ["sale", "rent"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "attribution": {
                "enum": ["AVnester"]
              },
              "disclaimer": {
                "type": "string"
              },
              "handoffUrl": {
                "format": "uri",
                "type": "string"
              },
              "listings": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "ageInYears": {
                      "type": ["integer", "null"]
                    },
                    "areaRank": {
                      "type": "integer"
                    },
                    "attribution": {
                      "enum": ["AVnester"]
                    },
                    "availableFrom": {
                      "type": ["string", "null"]
                    },
                    "bathrooms": {
                      "type": ["integer", "null"]
                    },
                    "bhk": {
                      "type": ["integer", "null"]
                    },
                    "carpetAreaSqft": {
                      "type": ["number", "null"]
                    },
                    "city": {
                      "type": "string"
                    },
                    "featured": {
                      "type": "boolean"
                    },
                    "floorNumber": {
                      "type": ["integer", "null"]
                    },
                    "furnishingStatus": {
                      "enum": ["furnished", "semi-furnished", "unfurnished", null],
                      "type": ["string", "null"]
                    },
                    "imageThumbnailUrl": {
                      "format": "uri",
                      "type": ["string", "null"]
                    },
                    "leaseAmount": {
                      "type": ["number", "null"]
                    },
                    "leaseRefundable": {
                      "type": ["boolean", "null"]
                    },
                    "leaseTenureMonths": {
                      "type": ["integer", "null"]
                    },
                    "listingId": {
                      "type": "string"
                    },
                    "listingType": {
                      "enum": ["sale", "rent"],
                      "type": "string"
                    },
                    "locality": {
                      "type": "string"
                    },
                    "parkingCount": {
                      "type": ["integer", "null"]
                    },
                    "plotDetails": {
                      "additionalProperties": true,
                      "properties": {
                        "dtcpApproved": {
                          "type": ["boolean", "null"]
                        },
                        "dtcpNumber": {
                          "type": ["string", "null"]
                        },
                        "electricity": {
                          "type": ["string", "null"]
                        },
                        "encumbranceStatus": {
                          "type": ["string", "null"]
                        },
                        "facing": {
                          "type": ["string", "null"]
                        },
                        "gatedCommunity": {
                          "type": ["boolean", "null"]
                        },
                        "guidelineValueInr": {
                          "type": ["integer", "null"]
                        },
                        "landClassification": {
