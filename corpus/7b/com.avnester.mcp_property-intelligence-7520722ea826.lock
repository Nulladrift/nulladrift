        {
          "name": "simulate_loan_prepayment",
          "title": "Simulate home-loan prepayment (calculator)",
          "description": "Simulate prepaying / repaying an Indian home loan early. Deterministic math — no advice, no loan-approval claim. Use for \"should I prepay\", \"early/part/lump-sum repayment\", \"pay extra each month\", \"reduce EMI or tenure\", \"interest saved\", or foreclosure. Modes: one-time, recurring yearly, or a fixed extra every month. Compares reduce_tenure (keep EMI, finish early) vs reduce_emi (keep tenure, lower EMI). emi = next EMI; finalEmi = after the last prepayment. Always surface the disclaimer field.",
          "inputSchema": {
            "properties": {
              "annualRatePercent": {
                "description": "Current annual interest rate (percent). Defaults to the indicative market rate when omitted.",
                "maximum": 30,
                "minimum": 1,
                "type": "number"
              },
              "outstandingPrincipal": {
                "description": "Current outstanding home-loan principal in INR.",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "prepaymentAmount": {
                "default": 0,
                "description": "One-time lump-sum prepayment in INR (one_time / one_time_plus_recurring* modes).",
                "minimum": 0,
                "type": "integer"
              },
              "prepaymentMode": {
                "default": "one_time",
                "description": "How the prepayment is made (annual anniversary vs every month).",
                "enum": ["one_time", "recurring_annual", "recurring_monthly", "one_time_plus_recurring", "one_time_plus_recurring_monthly"],
                "type": "string"
              },
              "recurringAnnualAmount": {
                "default": 0,
                "description": "Recurring yearly prepayment in INR (recurring_annual / one_time_plus_recurring modes).",
                "minimum": 0,
                "type": "integer"
              },
              "recurringMonthlyAmount": {
                "default": 0,
                "description": "Fixed extra paid toward principal EVERY month on top of the EMI (recurring_monthly / one_time_plus_recurring_monthly modes).",
                "minimum": 0,
                "type": "integer"
              },
              "remainingTenureYears": {
                "description": "Years left on the loan at the current EMI.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "strategy": {
                "default": "compare_both",
                "description": "reduce_tenure keeps the EMI and finishes early (bigger saving); reduce_emi keeps the tenure and lowers the EMI; compare_both returns both.",
                "enum": ["reduce_tenure", "reduce_emi", "compare_both"],
                "type": "string"
              }
            },
            "required": ["outstandingPrincipal", "remainingTenureYears"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "annualRatePercent": {
                "type": "number"
              },
              "applied": {
                "additionalProperties": true,
                "properties": {
                  "oneTime": {
                    "type": "integer"
                  },
                  "recurringAnnual": {
                    "type": "integer"
                  },
                  "recurringMonthly": {
                    "type": "integer"
                  }
                },
                "required": ["oneTime", "recurringAnnual", "recurringMonthly"],
                "type": "object"
              },
              "assumptions": {
                "additionalProperties": true,
                "properties": {
                  "floatingRatePrepaymentPenaltyWaived": {
                    "enum": [true]
                  },
                  "interestType": {
                    "enum": ["reducing-balance"]
                  },
                  "notALoanApproval": {
                    "enum": [true]
                  },
                  "oneTimeAppliedImmediately": {
                    "enum": [true]
                  },
                  "recurringAppliedAnnually": {
                    "enum": [true]
                  },
                  "recurringMonthlyAppliedEachMonth": {
                    "enum": [true]
                  }
                },
                "required": ["floatingRatePrepaymentPenaltyWaived", "interestType", "notALoanApproval", "oneTimeAppliedImmediately", "recurringAppliedAnnually", "recurringMonthlyAppliedEachMonth"],
                "type": "object"
              },
              "attribution": {
                "enum": ["AVnester"]
              },
              "baseline": {
                "additionalProperties": true,
                "properties": {
                  "emi": {
                    "type": "integer"
                  },
                  "payoffMonths": {
                    "type": "integer"
                  },
                  "totalInterest": {
                    "type": "integer"
                  }
                },
                "required": ["emi", "payoffMonths", "totalInterest"],
                "type": "object"
