        {
          "name": "compare_balance_transfer",
          "title": "Compare home-loan balance transfer (calculator)",
          "description": "Compare staying on your current home loan vs. transferring (refinancing) to a lower rate. Pure deterministic math — no advice, no loan-approval claim. Use when the user asks \"should I switch lenders / transfer my loan / refinance\". Returns new EMI, interest saved over the remaining tenure, switching cost, net saving, and the breakeven month. Always surface the disclaimer field.",
          "inputSchema": {
            "properties": {
              "currentRatePercent": {
                "description": "Current annual interest rate (percent).",
                "maximum": 30,
                "minimum": 1,
                "type": "number"
              },
              "flatCosts": {
                "description": "Flat legal + valuation charges in INR. Defaults to ₹12,500.",
                "minimum": 0,
                "type": "integer"
              },
              "newRatePercent": {
                "description": "New lender annual interest rate (percent).",
                "maximum": 30,
                "minimum": 1,
                "type": "number"
              },
              "outstandingPrincipal": {
                "description": "Current outstanding home-loan principal in INR.",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "processingFeePct": {
                "description": "New-lender processing fee on the balance (percent). Defaults to 0.5%.",
                "maximum": 5,
                "minimum": 0,
                "type": "number"
              },
              "remainingTenureYears": {
                "description": "Years left on the loan.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
