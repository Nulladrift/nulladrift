      "instructions": "AVnester is a public MCP server for Indian residential real-estate intelligence. Property listings are open in any city or town in Tamil Nadu (622 cities and towns); locality insights cover Coimbatore, Chennai, Madurai, Tiruchirappalli, Tiruppur, Erode, Tirunelveli and Vellore; all financial calculators work for any Indian city/state.\n\nThese are the ONLY tools available. When a question matches one, CALL that tool by name — do NOT answer from memory and do NOT tell the user a capability is missing without checking this list first:\n- search_properties — Search India property listings\n- get_locality_insights — Get locality market insights\n- compare_localities — Compare Indian localities head-to-head\n- calculate_home_affordability — Estimate home-loan EMI (calculator)\n- simulate_loan_prepayment — Simulate home-loan prepayment (calculator)\n- compare_balance_transfer — Compare home-loan balance transfer (calculator)\n- optimize_home_loan_tax_regime — Optimize home-loan tax regime (calculator)\n- estimate_stamp_duty_and_registration — Estimate stamp duty + registration (calculator)\n- get_property_details — Get one AVnester property by ID\n- compare_properties — Compare AVnester properties (trade-offs)\n- get_property_decision_intelligence — Home purchase decision intelligence\n\nThe home-finance tools are closely related — pick by the user's intent (do NOT substitute an adjacent one):\n- monthly EMI / \"what would my EMI be\" / affordability of a price → calculate_home_affordability\n- prepay / repay early / early repayment / part-pay / part payment / lump-sum repayment / foreclose / recurring extra payment / reduce EMI vs reduce tenure / interest saved by paying early → simulate_loan_prepayment\n- switch lender / transfer the loan / refinance to a lower rate / breakeven of switching → compare_balance_transfer\n- old vs new tax regime / home-loan tax benefit / section 80C or 24(b) deduction → optimize_home_loan_tax_regime\n- stamp duty / registration charges by Indian state → estimate_stamp_duty_and_registration\n- can I afford / am I eligible — ONE buy/no-buy verdict from income + CIBIL + cash-to-close → get_property_decision_intelligence\n\nAll financial tools (EMI/affordability, prepayment, balance transfer, tax regime, stamp duty, decision intelligence) are deterministic calculators — no advice, no loan approval. Every response carries a `disclaimer` field; always surface it. Out-of-scope cities return supported=false with a supportedCities list — relay the scopeMessage instead of inventing an answer.",
      "tools": [
        {
          "name": "calculate_home_affordability",
          "title": "Estimate home-loan EMI (calculator)",
          "description": "Estimate the monthly home-loan EMI / monthly payment in India — a home-loan calculator. Deterministic math; not advice or a loan-approval claim. Two modes: pass propertyValue (80% LTV assumed) OR loanAmount for a specific loan (e.g. \"₹50 lakh loan\"). Use for \"what would my EMI be\" / \"monthly payment on …\". The response `assumptionNote` states the basis in plain words. Always surface the disclaimer field.",
          "inputSchema": {
            "properties": {
              "interestRatePercent": {
                "description": "Annual interest rate (percent). Defaults to current market estimate.",
                "maximum": 30,
                "minimum": 1,
                "type": "number"
              },
              "loanAmount": {
                "description": "Loan amount in INR. Pass this when the user states a specific loan (e.g. \"₹50 lakh loan\") rather than a property price. Defaults to 80% of propertyValue if omitted.",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "propertyValue": {
                "description": "Property value (price) in INR. When the user states a property/home price, put it here — an 80% loan is assumed unless loanAmount is also given.",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "tenureYears": {
                "description": "Loan tenure in years. Defaults to 20.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["propertyValue"],
            "type": "object"
          },
