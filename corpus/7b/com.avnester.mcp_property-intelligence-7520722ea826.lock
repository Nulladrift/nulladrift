        {
          "name": "get_property_decision_intelligence",
          "title": "Home purchase decision intelligence",
          "description": "Estimate whether a home purchase fits a buyer's finances. REQUIRES monthlyNetIncome plus EITHER an AVnester listingId, OR propertyValue and an Indian state. Returns an indicative band against typical lender limits (AFFORDABLE/STRETCH/NOT_YET/INELIGIBLE), EMI, cash needed to close (down payment, stamp duty, registration, GST) and the tax regime effect. Fixed formulas; not a loan approval, credit assessment or advice.",
          "inputSchema": {
            "properties": {
              "annualIncomeForTax": {
                "description": "Annual income for tax. Defaults to monthlyNetIncome × 12.",
                "minimum": 0,
                "type": "integer"
              },
              "annualRent": {
                "description": "Annual rent received (let-out).",
                "minimum": 0,
                "type": "integer"
              },
              "assetType": {
                "description": "\"home\" (flat/villa/house) or \"plot\" (bare land); manual mode only. Plot → shorter tenure, no home-loan tax benefit.",
                "enum": ["home", "plot"],
                "type": "string"
              },
              "buyerGender": {
                "description": "\"female\" (a woman), \"joint\" (a man and a woman together) or \"male\" (default; two women: female). Changes the price only where a state gives women a concession.",
                "enum": ["male", "female", "joint"],
                "type": "string"
              },
              "carpetAreaSqft": {
                "description": "Carpet area (sqft) — sharpens the affordable-housing GST test (with the ₹45L value cap).",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "integer"
              },
              "cibilScore": {
                "description": "Numeric CIBIL score. Omit → eligibility stays indicative.",
                "maximum": 900,
                "minimum": 300,
                "type": "integer"
              },
              "city": {
                "description": "City (manual mode), e.g. \"Pune\" — decides Maharashtra stamp duty and the GST metro cap. Listing mode reads the listing.",
                "maxLength": 60,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9 .,'’()\\-஀-௿ऀ-ॿ]+$",
                "type": "string"
              },
              "coApplicantMonthlyIncome": {
                "description": "Co-applicant monthly income (joint affordability).",
                "maximum": 100000000,
                "minimum": 0,
                "type": "integer"
              },
              "employmentType": {
                "description": "Employment type (affects tax standard deduction).",
                "enum": ["salaried", "self_employed"],
                "type": "string"
              },
              "existingMonthlyEmis": {
                "description": "Existing monthly loan EMIs in ₹ (car/personal/cards). Omitted → assumed ₹0, which can inflate eligibility and flip the verdict — ask the buyer.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "integer"
              },
              "firstSale": {
                "description": "True for the FIRST sale of a flat, from the builder (not the buyer's first home); false for a resale. Changes the duty only where a state has a first-sale rate (KA). Omit when unknown: a resale is priced, and said where it matters. If absent, isUnderConstruction true means true.",
                "type": "boolean"
              },
              "interestRatePercent": {
                "description": "Override annual interest rate. Defaults to indicative market rate.",
                "maximum": 30,
                "minimum": 1,
                "type": "number"
              },
              "isUnderConstruction": {
                "description": "Under-construction → GST applies; ready-to-move → no GST. Omitted → ready-to-move (no GST).",
                "type": "boolean"
              },
              "isUrban": {
                "description": "Urban (default) or rural, where the state prices by location (MH, KA, WB, MP, HR); localBody or a known city decides instead.",
                "type": "boolean"
              },
              "jointLoan": {
                "description": "Joint home loan — tax is the user's own share (equal split).",
                "type": "boolean"
              },
              "listingId": {
                "description": "An AVnester listingId. Listing mode — propertyValue, state and city are then ignored, with a warning.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "localBody": {
                "description": "Where the property is, in a state that prices by it (MH, KA, WB, MP, HR): gram_panchayat (village), municipal_council (town) or municipal_corporation (city); overrides city. Omit when unknown (a corporation is priced, and said). Manual mode only.",
                "enum": ["municipal_corporation", "municipal_council", "gram_panchayat"],
                "type": "string"
              },
              "monthlyNetIncome": {
                "description": "Buyer monthly take-home income in INR.",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "integer"
              },
              "occupancyIntent": {
                "description": "Self-occupied vs let-out — changes §24(b) interest treatment. Omitted → self-occupied.",
                "enum": ["self_occupied", "let_out"],
                "type": "string"
              },
              "propertyValue": {
                "description": "Property price in INR (manual mode). Pass with state (and city where it matters).",
                "exclusiveMinimum": 0,
                "maximum": 1000000000,
                "type": "integer"
              },
              "residencyStatus": {
                "description": "Residency status.",
                "enum": ["resident", "nri"],
                "type": "string"
              },
              "savingsAvailable": {
                "description": "Liquid cash for down payment + charges — enables the cash-gap calc.",
                "maximum": 10000000000,
                "minimum": 0,
                "type": "integer"
              },
              "state": {
                "description": "Indian state (ISO \"MH\"/slug/name) for stamp duty. Required in manual mode; ignored in listing mode.",
                "maxLength": 50,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9 .,'’()\\-஀-௿ऀ-ॿ]+$",
                "type": "string"
              },
              "tenureYears": {
                "description": "Loan tenure in years. Defaults to 20.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["monthlyNetIncome"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "affordability": {
                "additionalProperties": true,
                "properties": {
                  "downPayment": {
                    "type": "integer"
                  },
                  "downPaymentGap": {
                    "type": ["integer", "null"]
                  },
                  "gst": {
                    "additionalProperties": true,
                    "properties": {
                      "amount": {
                        "type": "integer"
                      },
                      "applies": {
                        "type": "boolean"
                      },
                      "basis": {
                        "type": "string"
                      },
                      "isAffordable": {
                        "type": "boolean"
                      },
                      "itcAvailableToBuyer": {
                        "enum": [false]
