                          "type": ["string", "null"]
                        }
                      },
                      "required": ["dtcpApproved", "dtcpNumber", "electricity", "encumbranceStatus", "facing", "gatedCommunity", "guidelineValueInr", "landClassification", "ownershipType", "pattaChittaStatus", "pincode", "plotBreadthFt", "plotLengthFt", "plotNumber", "roadWidthFt", "waterAvailability"],
                      "type": ["object", "null"]
                    },
                    "price": {
                      "type": "integer"
                    },
                    "pricePerSqft": {
                      "type": ["integer", "null"]
                    },
                    "priceRank": {
                      "type": "integer"
                    },
                    "priceUnit": {
                      "enum": ["INR"]
                    },
                    "rank": {
                      "type": "integer"
                    },
                    "rentalStructure": {
                      "enum": ["monthly", "lease", null],
                      "type": ["string", "null"]
                    },
                    "reraId": {
                      "type": ["string", "null"]
                    },
                    "sourceUrl": {
                      "format": "uri",
                      "type": "string"
                    },
                    "summary": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "totalFloors": {
                      "type": ["integer", "null"]
                    },
                    "validUntil": {
                      "type": ["string", "null"]
                    },
                    "valueRank": {
                      "type": "integer"
                    },
                    "verification": {
                      "additionalProperties": true,
                      "properties": {
                        "adminReviewed": {
                          "type": "boolean"
                        },
                        "caveats": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "lastVerifiedAt": {
                          "type": ["string", "null"]
                        },
                        "locationConfidence": {
                          "type": ["integer", "null"]
                        },
                        "locationVerified": {
                          "type": "boolean"
                        },
