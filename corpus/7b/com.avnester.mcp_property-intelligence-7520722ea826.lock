      "instructions": "AVnester provides Indian residential real-estate data and home-finance calculators. Property listings: homes and plots for sale or rent in Tamil Nadu. Locality insights: selected cities; a place outside coverage returns supported=false with a scopeMessage naming the current coverage. The calculators work for any Indian state.\n\nTools on this server:\n- search_properties — Search India property listings\n- get_locality_insights — Get locality market insights\n- compare_localities — Compare Indian localities head-to-head\n- calculate_home_affordability — Estimate home-loan EMI (calculator)\n- simulate_loan_prepayment — Simulate home-loan prepayment (calculator)\n- compare_balance_transfer — Compare home-loan balance transfer (calculator)\n- optimize_home_loan_tax_regime — Optimize home-loan tax regime (calculator)\n- estimate_stamp_duty_and_registration — Estimate stamp duty + registration (calculator)\n- get_property_details — Get one AVnester property by ID\n- compare_properties — Compare AVnester properties (trade-offs)\n- get_property_decision_intelligence — Home purchase decision intelligence\n\nHome-finance tools, one intent each:\n- EMI for a home loan, or the loan a price needs → calculate_home_affordability\n- paying a home loan off early (lump sum or recurring) → simulate_loan_prepayment\n- moving a home loan to another lender → compare_balance_transfer\n- old vs new income-tax regime with a home loan → optimize_home_loan_tax_regime\n- stamp duty and registration charges for a state → estimate_stamp_duty_and_registration\n- whether one purchase fits income, savings and credit score → get_property_decision_intelligence\n\nThe calculators are deterministic estimates from fixed formulas and versioned rate tables — not advice, a loan approval or a tax filing. Each result includes a `disclaimer`.",
      "tools": [
        {
          "name": "calculate_home_affordability",
          "title": "Estimate home-loan EMI (calculator)",
          "description": "Estimate the monthly home-loan EMI / monthly payment in India — a home-loan calculator. Deterministic math; not advice or a loan-approval claim. Two modes: pass propertyValue (default down payment assumed) OR loanAmount for a specific loan (e.g. \"₹50 lakh loan\"). Use for \"what would my EMI be\" / \"monthly payment on …\". The response `assumptionNote` states the basis in plain words. Includes a disclaimer field to show.",
          "inputSchema": {
            "properties": {
              "interestRatePercent": {
                "description": "Annual interest rate (percent). Defaults to current market estimate.",
                "maximum": 30,
                "minimum": 1,
                "type": "number"
              },
              "loanAmount": {
                "description": "Loan amount in INR. Pass this when the user states a specific loan (e.g. \"₹50 lakh loan\") rather than a property price. Defaults to 80% of propertyValue if omitted.",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "propertyValue": {
                "description": "Property value (price) in INR. When the user states a property/home price, put it here — an 80% loan is assumed unless loanAmount is also given.",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "tenureYears": {
                "description": "Loan tenure in years. Defaults to 20.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["propertyValue"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "assumptionNote": {
                "type": "string"
              },
              "assumptions": {
                "additionalProperties": true,
                "properties": {
                  "actualLtvPercent": {
                    "type": "number"
                  },
                  "defaultLtvPercent": {
                    "type": "number"
                  },
                  "downPaymentAmount": {
                    "type": "integer"
                  },
                  "interestType": {
                    "enum": ["reducing-balance"]
                  },
                  "lenderMaxLoan": {
                    "type": "integer"
                  },
                  "notALoanApproval": {
                    "enum": [true]
                  },
                  "unfundedAmount": {
                    "type": "integer"
                  }
                },
                "required": ["actualLtvPercent", "defaultLtvPercent", "downPaymentAmount", "interestType", "lenderMaxLoan", "notALoanApproval", "unfundedAmount"],
                "type": "object"
              },
              "attribution": {
                "enum": ["AVnester"]
              },
              "cards": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "data": {
                      "additionalProperties": {},
                      "type": "object"
                    },
                    "priority": {
                      "type": "integer"
