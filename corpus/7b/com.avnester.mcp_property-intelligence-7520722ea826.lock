                          "type": ["string", "null"]
                        },
                        "tier": {
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["lastVerifiedAt", "locationConfidence", "locationVerified", "method", "tier"],
                      "type": "object"
                    },
                    "verified": {
                      "type": "boolean"
                    },
                    "verifiedAt": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["ageInYears", "attribution", "availableFrom", "bathrooms", "bhk", "carpetAreaSqft", "city", "featured", "floorNumber", "furnishingStatus", "imageThumbnailUrl", "listingId", "listingType", "locality", "parkingCount", "plotDetails", "price", "pricePerSqft", "priceUnit", "reraId", "sourceUrl", "summary", "title", "totalFloors", "validUntil", "verification", "verified", "verifiedAt"],
                  "type": "object"
                },
                "type": "array"
              },
              "message": {
                "type": "string"
              },
              "scopeMessage": {
                "type": "string"
              },
              "sortBy": {
                "type": "string"
              },
              "supported": {
                "type": "boolean"
              },
              "supportedCities": {
                "description": "Suggested retries: the cities with AVnester's deepest coverage (guides + market data). NOT the listing scope, which is any city or town in Tamil Nadu (see scopeMessage). Present only when supported=false.",
