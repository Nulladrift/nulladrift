                      "type": "integer"
                    },
                    "template": {
                      "type": "string"
                    }
                  },
                  "required": ["data", "priority", "template"],
                  "type": "object"
                },
                "type": "array"
              },
              "disclaimer": {
                "type": "string"
              },
              "outstandingPrincipal": {
                "type": "integer"
              },
              "prepaymentMode": {
                "enum": ["one_time", "recurring_annual", "recurring_monthly", "one_time_plus_recurring", "one_time_plus_recurring_monthly"],
                "type": "string"
              },
