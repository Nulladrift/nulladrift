        {
          "name": "estimate_stamp_duty_and_registration",
          "title": "Estimate stamp duty + registration (calculator)",
          "description": "Estimate Indian state stamp duty + registration charges on a property purchase, in any of the 28 states + 8 UTs: buyer (female/joint concessions), place (city/localBody, or urban/rural), property type, and a builder's first sale. Pass constructionStatus to also itemize GST (under-construction 1%/5%, ready/resale 0%) for an all-in statutory quote. Returns supported=false for anything not an Indian state or UT (rateBasis names the main states). Not legal/tax advice. Includes a disclaimer to show.",
          "inputSchema": {
            "properties": {
              "buyerGender": {
                "description": "\"female\" (a woman), \"joint\" (a man and a woman together) or \"male\" (default; two women: female). Changes the price only where a state gives women a concession. Overrides isWomanBuyer.",
                "enum": ["male", "female", "joint"],
                "type": "string"
              },
              "carpetAreaSqft": {
                "description": "Carpet area (sqft) — with value, decides the affordable-housing 1% GST slab.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "integer"
              },
              "city": {
                "description": "City or town, e.g. \"Pune\". Decides the rate where the state prices by location (MH, KA, WB, MP, HR): Pune 7%, Mumbai 6%. Send the place as the buyer names it (\"Kharghar\"), not the wider city it is listed under.",
                "maxLength": 60,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9 .,'’()\\-஀-௿ऀ-ॿ]+$",
                "type": "string"
              },
              "constructionStatus": {
                "description": "When set, also itemizes GST: under-construction = 1% (affordable) / 5%; ready/resale = 0%. Omit → GST not computed.",
                "enum": ["under_construction", "ready_to_move", "resale"],
                "type": "string"
              },
              "firstSale": {
                "description": "True for the FIRST sale of a flat, from the builder (not the buyer's first home); false for a resale. Changes the duty only where a state has a first-sale rate (KA). Omit when unknown: a resale is priced, and said where it matters. Absent: constructionStatus under_construction ⇒ true, resale ⇒ false, ready_to_move decides nothing (may be a resale).",
                "type": "boolean"
              },
              "isUrban": {
                "description": "Urban (default) or rural. Used for the location when city and localBody are absent.",
                "type": "boolean"
              },
              "isWomanBuyer": {
                "default": false,
                "description": "Backward-compatibility shim — prefer buyerGender. When true, internally treated as buyerGender=\"female\".",
                "type": "boolean"
              },
              "localBody": {
                "description": "Where the property is, in a state that prices by it (MH, KA, WB, MP, HR): gram_panchayat (village), municipal_council (town) or municipal_corporation (city); overrides city. Omit when unknown (a corporation is priced, and said).",
                "enum": ["municipal_corporation", "municipal_council", "gram_panchayat"],
                "type": "string"
              },
              "propertyType": {
                "description": "residential (default), plot (bare land; a residential-only concession does not reach it), commercial or agricultural.",
                "enum": ["residential", "commercial", "agricultural", "plot"],
                "type": "string"
              },
              "propertyValue": {
                "description": "Sale value in INR for stamp-duty calculation.",
                "exclusiveMinimum": 0,
                "maximum": 10000000000,
                "type": "integer"
              },
              "state": {
                "description": "Indian state — ISO code (\"MH\"), slug (\"maharashtra\") or name (\"Maharashtra\"). Required.",
                "maxLength": 50,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9 .,'’()&\\-஀-௿ऀ-ॿ]+$",
                "type": "string"
              }
            },
            "required": ["propertyValue", "state"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "assumptions": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "message"],
                  "type": "object"
                },
                "type": "array"
              },
              "attribution": {
                "enum": ["AVnester"]
              },
              "cards": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "data": {
                      "additionalProperties": {},
                      "type": "object"
                    },
                    "priority": {
                      "type": "integer"
                    },
                    "template": {
                      "type": "string"
                    }
                  },
                  "required": ["data", "priority", "template"],
                  "type": "object"
                },
                "type": "array"
              },
              "disclaimer": {
                "type": "string"
              },
              "gst": {
                "additionalProperties": true,
                "properties": {
                  "amount": {
                    "type": "integer"
                  },
                  "applies": {
                    "type": "boolean"
                  },
                  "basis": {
                    "type": "string"
                  },
                  "isAffordable": {
                    "type": "boolean"
                  },
                  "itcAvailableToBuyer": {
                    "enum": [false]
                  },
                  "ratePct": {
                    "type": "number"
                  }
                },
                "required": ["amount", "applies", "basis", "isAffordable", "itcAvailableToBuyer", "ratePct"],
                "type": "object"
              },
              "location": {
                "additionalProperties": true,
                "properties": {
                  "assumed": {
                    "type": "boolean"
                  },
                  "localBody": {
                    "enum": ["municipal_corporation", "municipal_council", "gram_panchayat", null],
                    "type": ["string", "null"]
                  },
                  "place": {
                    "additionalProperties": true,
                    "properties": {
                      "area": {
                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      },
                      "slug": {
                        "type": "string"
                      }
                    },
                    "required": ["name", "slug"],
                    "type": ["object", "null"]
                  },
                  "source": {
                    "enum": ["local_body", "city", "is_urban", "default", "not_applicable"],
                    "type": "string"
                  }
                },
                "required": ["assumed", "localBody", "place", "source"],
                "type": ["object", "null"]
              },
              "propertyValue": {
                "type": "integer"
              },
              "rateBasis": {
                "type": "string"
              },
              "rateEffectiveDate": {
                "type": ["string", "null"]
              },
              "rateVerification": {
                "additionalProperties": true,
                "properties": {
                  "lastVerifiedAt": {
                    "type": ["string", "null"]
                  },
                  "sourceUrl": {
                    "type": ["string", "null"]
                  },
                  "status": {
                    "enum": ["verified", "partial", "unverified"],
                    "type": "string"
                  },
                  "unverifiedComponents": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["lastVerifiedAt", "sourceUrl", "status", "unverifiedComponents"],
                "type": "object"
              },
              "registrationCapApplied": {
                "type": "boolean"
              },
              "registrationFee": {
                "type": "integer"
              },
              "rulesVersion": {
                "type": ["string", "null"]
              },
              "stampDuty": {
                "type": "integer"
              },
              "stampDutyBase": {
                "type": "integer"
              },
              "state": {
                "type": "string"
              },
              "stateCode": {
                "type": ["string", "null"]
              },
              "stateName": {
                "type": ["string", "null"]
              },
              "supported": {
                "type": "boolean"
              },
              "surcharges": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "amount": {
                      "type": "integer"
                    },
                    "legalBasis": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "ratePct": {
                      "type": "number"
                    }
                  },
                  "required": ["amount", "name", "ratePct"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "type": "integer"
              },
              "totalWithGst": {
                "type": "integer"
              },
              "valueBasis": {
                "type": "string"
              }
            },
            "required": ["assumptions", "attribution", "cards", "disclaimer", "location", "propertyValue", "rateBasis", "rateEffectiveDate", "rateVerification", "registrationCapApplied", "registrationFee", "rulesVersion", "stampDuty", "stampDutyBase", "state", "stateCode", "stateName", "supported", "surcharges", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate stamp duty + registration (calculator)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/insight-cards-v4.html",
            "openai/widgetDescription": "Stamp duty & registration estimate card.",
