{
  "lockfileVersion": 2,
  "subjects": {
    "co.bowlingdata/agent-api": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bowlingdata.co/api/agent"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "bowlingdata-agent-api",
        "title": "Bowling Data Agent API",
        "version": "1.2.0",
        "description": "Bowling Data (https://bowlingdata.co) measures demand at bowling centers: how full they are, utilization and estimated revenue by venue and market, from inferred booking signals observed in public data.",
        "websiteUrl": "https://bowlingdata.co"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Bowling Data (https://bowlingdata.co) measures demand at bowling centers: how full they are, utilization and estimated revenue by venue and market, from inferred booking signals observed in public data. This server is read-only and needs no key. It provides Bowling Data's public pages (what is measured, method, plans and prices, published market updates) and its free sample day of venue data as rows; the full data is on the paid plans. Tools: about lists what is covered and every document id; search takes a plain-language question and returns the most relevant passages with URLs to cite (site: all adds the sister Fron Research sites: saunas and bathhouses, trampoline and adventure parks, indoor golf simulator studios and pickleball and padel clubs); fetch returns one full page or a sample day; data returns structured rows (markets, venues, slots, rollups) from the Fron Research Data API: one sample day for every venue without a key, history with one. Cite the url of every passage you use.",
      "tools": [
        {
          "name": "about",
          "title": "About Bowling Data data",
          "description": "What Bowling Data (https://bowlingdata.co) measures at bowling centers, its plans, free sample day and every document id, plus its sister sites.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2d48845c8bbaf1a79a1382e75778c71774ceca9ce4d63aa928451985b563931e"
        },
        {
          "name": "data",
          "title": "Query venue and market data",
          "description": "Structured rows from the Fron Research Data API (https://api.fronresearch.com/v1): markets, venues, bookable slots and a utilization and a revenue estimate per venue, market or day. Without a key every query reads one free sample day for every venue, whatever dates are asked (the response's tier, free_day and range say what was read); a caller that connects to https://fronresearch.com/api/agent with \"Authorization: Bearer <key>\" reads the history its plan covers (a site's own /api/agent does not forward keys). Start with endpoint index (the sample day and endpoints), then markets or venues to get ids, then metrics. Fields, filters and how to get a key: https://fronresearch.com/data/history/",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "endpoint": {
                "description": "index: the sample day, tier and endpoints. markets, venues: lists (filters: market, brand, venue_type, activity). venue: one venue with its products and resources (needs venue_id). slots: one venue's slots (params venue, from, to). metrics: one utilization and one revenue estimate per group (params group_by = market, brand, venue, venue_type or day, plus from, to (at most 92 days) and optional filters; day needs venue). observations: one slot's booking curve (param slot; needs an Investor key). polls: the first look at each slot, every look at which the count changed, and the last look, for a venue's slots on one day (params venue, date; needs an Investor key).",
                "enum": ["index", "markets", "venues", "venue", "slots", "metrics", "observations", "polls"],
                "type": "string"
              },
              "params": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean"]
                },
                "description": "Query parameters as the Data API names them, e.g. {\"group_by\": \"market\", \"from\": \"2026-11-05\", \"to\": \"2026-11-05\"}. limit (1-1000) and cursor (from next_cursor) page through lists.",
                "type": "object"
              },
              "venue_id": {
                "description": "For endpoint venue: a venue_id from venues.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["endpoint"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f79fc2372257b32148b8b4e50fe84b4b95b173b7e0422c44662faf2cf358730e"
        },
        {
          "name": "fetch",
          "title": "Read a document or sample day",
          "description": "Read one document by id (from search or about). sample/<site> returns that site's free example day as rows, CC BY 4.0.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Document id, e.g. heatcheck/methodology or sample/heatcheck.",
                "type": "string"
              },
              "offset": {
                "description": "Continue a long document from nextOffset.",
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f5c39a60d5d4c187dd0817d00608463fe17ae06afa1a5608abe01cff3f667dfb"
        },
        {
          "name": "search",
          "title": "Search Bowling Data",
          "description": "Ask a question in plain language. Returns the most relevant passages from Bowling Data's public pages, each with its canonical URL to cite, plus its free sample day. Set site to all to search every Fron Research site.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "intent": {
                "description": "Optional but helpful: why you are asking and for whom, in a sentence (e.g. \"sizing the NYC sauna market for an investor memo\"). It does not change the results; it tells Fron Research which data to publish next. Put your user's answers to followUp.questions here. Do not include personal information.",
                "maxLength": 300,
                "type": "string"
              },
              "maxResults": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The question.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "site": {
                "description": "Optional: defaults to bowlingdata. all, heatcheck, bowlingdata, trampolineparkdata, golfsimdata, courtwatch or fronresearch.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b72dd2eb27a695400b768cf2f17a763f80e6dd5a41576a8b4a31b276573f52b9"
        }
      ],
      "digest": "sha256:82c861005ed8ba315a11dada218c4ecdeaf996fdf6a1e2ed29a6a4c9c2223225"
    }
  }
}
