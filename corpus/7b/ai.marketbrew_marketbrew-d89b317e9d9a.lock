      "serverInfo": {
        "name": "market-brew",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Users can ask for Market Brew data in ordinary language and never need to know tool names. Use focused tools to read data visible to the linked account. For a request about websites for a named Crew, resolve the Crew by business name, email, or ID, then list licensed websites using its numeric Crew ID. Never infer access outside returned data. Content analyses can incur provider costs and cache effects. Request generation only when desired. Launchpad additions require explicit user confirmation and the Launchpad write grant.",
