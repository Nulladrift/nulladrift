                    "type": "number"
                  }
                ]
              },
              "query": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean", "null"]
                },
                "description": "Required filter: platform (CHAT_GPT or GOOGLE). The response contains US/English monthly mention counts and estimated AI search volume.",
