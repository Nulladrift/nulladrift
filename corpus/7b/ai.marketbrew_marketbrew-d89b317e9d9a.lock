          "description": "Use this when the user explicitly asks to add Spotlight Bridge opportunities to Launchpad. Identify the destination Crew, licensed website, source analysis, and selected entities first. This persists opportunities. Repeated additions can increment detection counts. Do not retry successful entries after a partial failure.",
