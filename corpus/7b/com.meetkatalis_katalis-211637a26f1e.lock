        {
          "name": "cqc_check",
          "title": "CQC Care Provider Check",
          "description": "Is this company a CQC-registered care provider, how are its services rated, and has that changed. Matched on our daily copy of the Care Quality Commission's register of providers (the CQC's own Companies House number, then the company's registered and former names, or a CQC provider or location id); the provider and up to twelve of its registered locations are then read live from the CQC. Registered or deregistered with dates; the kind of provider; every location (care homes, agencies, surgeries, clinics) with its overall rating, the five key questions, inspection and report dates; every change recorded for it since 2 October 2026. England only. Organisations and services only, never people. Contains CQC information licensed under the Open Government Licence v3.0. 1 credit. Use this for health and adult social care providers in England; for an inspection report read in full use cqc_report (key needed).",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "A company number, a provider's name, or a CQC provider or location id (1-…)",
                "type": "string"
