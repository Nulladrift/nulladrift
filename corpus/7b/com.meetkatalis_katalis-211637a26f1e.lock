        {
          "name": "deadlines",
          "title": "Company Deadlines",
          "description": "Every deadline a UK company has, sorted, with days left. Accounts and confirmation statement (Companies House), each director's and PSC's identity-verification date as counts (the earliest among those not yet showing as verified), the ICO data protection fee renewal (the fee register entry matching the company's name), and the next payment practices and gender pay gap reports where the company reports them. Overdue first. The reply carries the address of a free calendar feed for the company. 1 credit. Use this for what is due and when; for the filings themselves use accounts or public_record.",
