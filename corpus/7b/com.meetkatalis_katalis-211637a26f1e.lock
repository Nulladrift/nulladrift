        {
          "name": "charity_check",
          "title": "Charity Register Check",
          "description": "Is this a registered charity, is it in good standing, and what do its accounts say. Read live from the Charity Commission for England and Wales' register, by charity number, by company number (matched through the Companies House number the register holds) or by name (up to three matches, registered first). Registered or removed with dates and reason; CIO or charitable company; insolvency, administration and interim-manager flags; reporting status; latest accounts and up to six years of income and spend broken down; what it does, for whom and where; trustee count and chair; governing document, objects, other regulators. England and Wales only. Trustees counted, never named. Contains information from the Charity Commission, Open Government Licence v3.0. 1 credit. Use this for charities in England and Wales; for a charity's annual report read in full use charity_report (key needed).",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "A charity number (263710, or 1053467-2 for a group member), a company number, or a charity's name",
                "type": "string"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "annotations": {
