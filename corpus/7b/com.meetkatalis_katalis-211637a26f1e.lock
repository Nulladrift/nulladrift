        {
          "name": "sra_check",
          "title": "SRA Law Firm Check",
          "description": "Is this an SRA-authorised law firm, what kind, since when, and has that changed. From our daily copy of the Solicitors Regulation Authority's register of regulated organisations. Matched on the register's own Companies House number, then the company's registered and former names, or by SRA number. Authorised, authorised with conditions, ceased, revoked or intervened, with dates; the kind of firm; work areas, offices and head office; trading and former names; every change recorded for the firm since 8 October 2026. Firms only, never individuals. Data supplied by the Solicitors Regulation Authority. 1 credit. Use this for law firms in England and Wales; for HMRC's anti-money-laundering register use aml_register.",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "A company number, a firm's name, or an SRA number",
                "type": "string"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "annotations": {
