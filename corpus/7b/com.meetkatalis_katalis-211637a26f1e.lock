      "serverInfo": {
        "name": "katalis",
        "title": "Katalis UK company checks",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "UK company checks from the official record: Companies House, payment practices, public contracts, sanctions, the SRA, CQC, charity, sponsor and anti-money-laundering registers, filed accounts, secured borrowing, ownership and deadlines; with a key, also watch lists with webhooks, batches, directors' ID checks and the document readers (Modern Slavery, Ofsted, CQC, charity reports). Pass a UK company number (8 characters, e.g. 00502851) where a tool takes `company`; a name works too and the reply says which company was picked. Replies are the API's JSON. Without a key the open tools answer about one company at a time, within a daily limit; a key (free, 100 credits a month, https://meetkatalis.com/developers) lifts the limit and adds the rest. Docs: https://meetkatalis.com/apis.md.",
      "tools": [
        {
          "name": "accounts",
          "title": "Filed Accounts",
          "description": "The company's latest filed accounts read into plain figures, this year and last. From Companies House's tagged (iXBRL) accounts document - net assets, current assets, cash, debtors, creditors due within and after a year, equity, turnover and profit where the accounts include them, average employees, for the current and prior period; audit status, standards, dormant flag; what the accounts leave out. Accounts filed as a PDF can't be read and the call's credits go back.",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "A company number or name",
                "type": "string"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Filed Accounts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fd4b71331ae3d3a1ed1fb0db93e81c3337ed5174d386215403fd1e6543b92f8a"
        },
        {
          "name": "aml_register",
          "title": "HMRC AML Register Check",
          "description": "Is a business on HMRC's Money Laundering Regulations supervised business register, for what, and since when. Matched on the business's name as the register writes it (a company number brings its registered and former names), with the register's postcode district checked against the registered office. Current registrations with sectors and status (Approved, Applied, Expired), former ones with the date they went, and every change recorded for the name since 7 October 2026. HMRC is one supervisor among several, so absence never means unsupervised. People never loaded.",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "A company number, or the business's name",
                "type": "string"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "annotations": {
