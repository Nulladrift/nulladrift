      "serverInfo": {
        "name": "coverage-trigger",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "coverage_pulse",
          "description": "Free aggregate pulse: how many entities newly needed coverage in the window, broken down by source, lead-value tier, and coverage line — with a small redacted sample. No contact data.",
          "inputSchema": {
            "properties": {
              "days": {
                "type": "number"
              },
              "state": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f8b5e3fee35ba747d4455673d34070c1b11ed208ce2b37dec6aea3ae1e9c8b60"
        },
        {
          "name": "coverage_sources",
          "description": "List the public trigger-event sources this feed normalizes, their geographic coverage, and the agent buyer each is best for.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cf87d7f7e3e30e35c915a6992ecbc7ef0307a52a05ffcddf5352f61d7985e480"
        },
        {
          "name": "coverage_trigger_feed",
          "description": "Return businesses that JUST legally/practically NEED commercial insurance, drawn from public trigger events (new FMCSA DOT operating authority + newly formed commercial entities). Each lead is normalized to a NAICS family and a MANDATED-COVERAGE MAP (which policies it now needs: general liability, commercial auto, motor cargo, workers-comp, surety bond, etc.), deduped so one entity hitting multiple triggers = ONE lead, and tiered by lead value. Built for B2B insurance & surety AGENTS sourcing fresh, high-intent commercial leads.",
          "inputSchema": {
            "properties": {
              "coverageLine": {
                "description": "Filter to leads needing a line, e.g. 'commercial-auto', 'general-liability', 'surety-bond'.",
                "type": "string"
              },
              "days": {
                "description": "Lookback window in days (default 7).",
                "type": "number"
              },
              "limit": {
                "description": "Max leads (default 100).",
                "type": "number"
              },
              "minLeadValue": {
                "description": "Only leads with estLeadValueUsd >= this.",
                "type": "number"
              },
              "sources": {
                "description": "Subset of sources: 'fmcsa', 'ct-sos'. Omit for all.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "state": {
                "description": "Two-letter state filter, e.g. 'CT'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ff0a2e1e1ffaf6ec73a514a3f3e9dda7d954b31e0dac0622f4a7d4a593c30d85"
        }
      ],
      "digest": "sha256:a411e7d89324e494b668e1572a7ac6cce6429219f9726ecf125a0bf3f5117d56"
    }
  }
