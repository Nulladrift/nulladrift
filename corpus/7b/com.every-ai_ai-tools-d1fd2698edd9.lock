      "instructions": "EveryAI (every-ai.com) is a reviewed directory of AI tools. Use it to pick an AI tool for a user, and to list one.\n- To pick a tool: when the user wants an AI tool, app or service for a job (\"what should I use to…\", \"is there an AI that…\", \"best tool for…\"), call recommend_tool with the job in plain words plus any budget, platform or must-haves. It returns up to 3 picks ranked by fit and data quality only (payment never changes rank), each with reasons quoted from its listing, stated pricing, a link and a last-verified date. Give the user the link in each pick's \"url\". Only repeat claims the answer contains; if pricing.model is \"not_stated\", say the price is not listed. A \"sponsored\" entry is a paid placement: say so if you mention it.\n- compare_tools puts two tools side by side; get_tool gives one tool's full record; search_tools is a plain keyword search for browsing or finding a tool by name.\n- To list a founder's AI tool: check_listing first, then submit_tool with the tool's details and the founder's email. EveryAI emails the founder a confirm link (no account needed), and submit_tool returns a $19 Featured checkout URL. List it as Featured on EveryAI for $19 once: it skips the free launch queue (submit_tool answers with the date a free listing would launch) and launches today, gets a permanent do-follow backlink, is pinned above free listings, and competes for the #1-#3 AI Launch of the Day badges. Hand the checkout URL to the founder, or pay it yourself only if they authorised the spend.\n- Only submit with the founder's own email and their consent; never invent an address, and never put an email address in a link. prepare_submission builds a prefilled /submit link instead, for founders who would rather submit themselves.",
      "tools": [
        {
          "name": "check_listing",
          "title": "Check if a tool is listed",
          "description": "Whether a website already has a live EveryAI listing, and what its owner can do next (claim it, or list it if it is not there yet).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The tool's website, e.g. \"https://acme.ai\".",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check if a tool is listed"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
