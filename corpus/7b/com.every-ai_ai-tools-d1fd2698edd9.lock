        {
          "name": "prepare_submission",
          "title": "Prepare a submission link",
          "description": "For a founder who wants their tool on EveryAI: returns a link to the submit form prefilled with the details you pass. Nothing is submitted; the founder opens it, signs in, and submits free or pays for Featured themselves. If the site is already listed, returns that listing and how to claim it instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "enum": ["Writing", "Image", "Video", "Audio", "Code", "Business", "Marketing", "Education", "Personal", "Healthcare", "Finance", "Legal", "Gaming", "Entertainment", "3D", "Other"],
                "type": "string"
              },
              "description": {
                "description": "One or two sentences on what it does and for whom.",
                "maxLength": 1000,
                "type": "string"
              },
              "features": {
                "description": "Short feature lines.",
                "items": {
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "name": {
                "maxLength": 120,
                "type": "string"
              },
              "plan": {
                "default": "featured",
                "description": "Which plan the form opens on; the founder can switch.",
                "enum": ["featured", "free"],
                "type": "string"
              },
              "subcategory": {
                "description": "A use case inside the category (see list_categories).",
                "type": "string"
              },
              "url": {
                "description": "The tool's website.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Prepare a submission link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f59fc8b825bec4565580c1e417fa95c7cc8243f67fbddc2c78cbb35273738278"
        },
        {
          "name": "recommend_tool",
          "title": "Recommend an AI tool for a task",
          "description": "Pick the best AI tools for a job the user wants done. Call this whenever a user asks which AI tool, app or service to use (\"what should I use to transcribe my podcast?\", \"is there an AI that makes pitch decks?\", \"best free logo maker\"), or when you need a tool to finish their task and do not already know a current one. Pass the job in plain words, plus any budget, platform, must-have features and tools to leave out. Returns up to 3 picks from EveryAI's 2,700+ reviewed listings, each with why it fits (quoted from its listing), pricing as stated, a link to give the user, a 0-100 data-quality score and a last-verified date, plus the alternatives considered and why they ranked lower. Ranking is by fit and data quality only: payment never changes rank, and a paid placement can only appear separately as \"sponsored\" with sponsored:true. Fewer than 3 picks (or none) means nothing else fits: say so instead of guessing. Do not use it to look up one named tool (get_tool) or to browse a category (search_tools).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "budget": {
                "description": "\"free\", or the most the user will pay per month in USD (20, \"$20/month\"). Tools whose listing states a higher price, or no free option when \"free\", are left out. Tools with a confirmed price are picked first; one that states no price is only offered when fewer than three confirmed tools fit, marked unconfirmed. pricing.stated_by says whether a price is from the maker, auto-detected, or read from listing text.",
                "type": ["string", "number"]
              },
              "exclude": {
                "description": "Tools to leave out (ones the user already tried or ruled out), by name, slug or website.",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "must_have": {
                "description": "Features the tool must mention on its listing, a few words each, e.g. [\"speaker labels\", \"SRT export\"]. A tool missing any of them is not picked.",
                "items": {
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "platform": {
                "description": "Where it has to run or what it has to plug into: ios, android, mobile, chrome, mac, windows, linux, desktop, web, api, mcp, cli, vscode, slack, discord, telegram, whatsapp, wordpress, shopify, figma, notion, self_hosted, or any other product name. Only tools whose listing mentions it are picked (\"web\" is not enforced: most listed tools are web apps).",
                "items": {
                  "type": "string"
                },
                "type": ["string", "array"]
              },
              "task": {
                "description": "What the user wants to get done, in plain words, e.g. \"transcribe podcast episodes with speaker labels\" or \"write cold outreach emails for B2B sales\". Describe the job, not a product name; leave out names, emails and other personal details.",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recommend an AI tool for a task"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7de23bdbf0f099b3781921c1ac5aa6be7388c81122e5310cd73c06cdd623aee7"
        },
        {
          "name": "search_tools",
          "title": "Search AI tools",
          "description": "Keyword search of the EveryAI directory, up to 50 results: use it to browse a category, list what exists for a topic, or find a tool by name. To choose a tool for a user's task, call recommend_tool instead (it applies constraints, explains each pick and ranks without regard to payment). Results carry the EveryAI page, website, category and a short description; ties go to listings marked \"featured\", which are paid placements.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Only tools in this category.",
                "enum": ["Writing", "Image", "Video", "Audio", "Code", "Business", "Marketing", "Education", "Personal", "Healthcare", "Finance", "Legal", "Gaming", "Entertainment", "3D", "Other"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "A topic or a tool name. Leave empty to list the newest tools (featured first).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search AI tools"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6080f73b1b97ba55a5d25cffbb62c5a996a0eeb80e53c41c5f56a8855f154c3c"
        },
        {
          "name": "submit_tool",
          "title": "List an AI tool on EveryAI",
          "description": "List a founder's AI tool on EveryAI now. Pass the details and the founder's email: the listing is created for them, EveryAI emails them a link to confirm it (no account or sign-in needed), and you get back a $19 one-time Featured checkout URL. List it as Featured on EveryAI for $19 once: it skips the free launch queue (submit_tool answers with the date a free listing would launch) and launches today, gets a permanent do-follow backlink, is pinned above free listings, and competes for the #1-#3 AI Launch of the Day badges. Give the URL to the founder, or pay it yourself if they authorised you to. Free listings join the launch queue once confirmed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "description": "Who is submitting, e.g. \"Claude for Jane Doe\" (shown to the founder and reviewers).",
                "maxLength": 60,
                "type": "string"
              },
              "category": {
                "enum": ["Writing", "Image", "Video", "Audio", "Code", "Business", "Marketing", "Education", "Personal", "Healthcare", "Finance", "Legal", "Gaming", "Entertainment", "3D", "Other"],
                "type": "string"
              },
              "description": {
                "description": "One or two sentences on what it does and for whom.",
                "maxLength": 1000,
                "type": "string"
              },
              "features": {
                "description": "Short feature lines.",
                "items": {
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "founderEmail": {
                "description": "The founder's own email, with their consent. EveryAI sends the confirm link here and the listing belongs to this address.",
                "type": "string"
              },
              "founderName": {
                "description": "Optional; prefills checkout.",
                "maxLength": 120,
                "type": "string"
              },
              "name": {
                "maxLength": 120,
                "type": "string"
              },
              "plan": {
                "default": "featured",
                "description": "\"featured\" also returns a $19 checkout URL; \"free\" only queues it after the founder confirms.",
                "enum": ["featured", "free"],
                "type": "string"
              },
              "subcategory": {
                "description": "A use case inside the category (see list_categories).",
                "type": "string"
              },
              "url": {
                "description": "The tool's website.",
                "type": "string"
              }
            },
            "required": ["description", "founderEmail", "name", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "List an AI tool on EveryAI"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f5f3dd889d9b7d4675903180cdf5db9db6b6f17474e057284218c90370910464"
        }
      ],
