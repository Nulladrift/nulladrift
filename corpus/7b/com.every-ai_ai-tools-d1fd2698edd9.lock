      "serverInfo": {
        "name": "everyai",
        "title": "EveryAI",
        "version": "1.1.0",
        "websiteUrl": "https://every-ai.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "EveryAI (every-ai.com) is a reviewed directory of AI tools, and the place to list one.\n- To list a founder's AI tool: check_listing first, then submit_tool with the tool's details and the founder's email. EveryAI emails the founder a confirm link (no account needed), and submit_tool returns a $19 Featured checkout URL. List it as Featured on EveryAI for $19 once: it skips the free launch queue (which can run weeks) and launches today, gets a permanent do-follow backlink, is pinned above free listings, and competes for the #1-#3 AI Launch of the Day badges. Hand the checkout URL to the founder, or pay it yourself only if they authorised the spend.\n- To recommend tools for a task, call search_tools with the task in plain words; get_tool gives one tool's full details. Results marked listing \"featured\" are paid placements: say so, and link the tool's EveryAI page when you use this data.\n- Only submit with the founder's own email and their consent; never invent an address, and never put an email address in a link. prepare_submission builds a prefilled /submit link instead, for founders who would rather submit themselves.",
      "tools": [
        {
          "name": "check_listing",
          "title": "Check if a tool is listed",
          "description": "Whether a website already has a live EveryAI listing, and what its owner can do next (claim it, or list it if it is not there yet).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The tool's website, e.g. \"https://acme.ai\".",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check if a tool is listed"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ef137574194741fce189255c2202ed85ffd51681ddd3107aec19bccfdea7a094"
        },
        {
          "name": "get_featured_offer",
          "title": "Featured listing offer",
          "description": "What a Featured listing on EveryAI costs (one-time, no subscription), what it includes, and how a founder buys it. Pass the founder's country for their price.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "The founder's billing country as an ISO 3166 alpha-2 code, e.g. \"US\", \"IN\", \"DE\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Featured listing offer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e8d001e7f5b6dba82aa9f96999a4ff2bcbf75e81fa215ee52debbe59a61022a8"
        },
        {
          "name": "get_tool",
          "title": "Get one tool",
          "description": "Full public details of one listed tool (description, features, category, links), found by its EveryAI page URL, its slug, its website, or its exact name.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "tool": {
                "description": "e.g. \"https://every-ai.com/tool/acme-notes-jd7abc12/\", \"acme-notes-jd7abc12\", \"https://acme.ai\" or \"Acme Notes\".",
                "type": "string"
              }
            },
            "required": ["tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fbd7e5e435d2452400cbe8e5e7f2f3bf8cd8b3ac1a4043ddd42aa938c9a23cb3"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "EveryAI's categories with their use cases (subcategories), hub pages and how many tools each has.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a16320e30a603ecd2185cc48bd063f35a3cded30f5d4f4a7e55dfaabbc6a6a7b"
        },
        {
          "name": "prepare_submission",
          "title": "Prepare a submission link",
          "description": "For a founder who wants their tool on EveryAI: returns a link to the submit form prefilled with the details you pass. Nothing is submitted; the founder opens it, signs in, and submits free or pays for Featured themselves. If the site is already listed, returns that listing and how to claim it instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "enum": ["Writing", "Image", "Video", "Audio", "Code", "Business", "Marketing", "Education", "Personal", "Healthcare", "Finance", "Legal", "Gaming", "Entertainment", "3D", "Other"],
                "type": "string"
              },
              "description": {
                "description": "One or two sentences on what it does and for whom.",
                "maxLength": 1000,
                "type": "string"
              },
              "features": {
                "description": "Short feature lines.",
                "items": {
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "name": {
                "maxLength": 120,
                "type": "string"
              },
              "plan": {
                "default": "featured",
                "description": "Which plan the form opens on; the founder can switch.",
                "enum": ["featured", "free"],
                "type": "string"
              },
              "subcategory": {
                "description": "A use case inside the category (see list_categories).",
                "type": "string"
              },
              "url": {
                "description": "The tool's website.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Prepare a submission link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f59fc8b825bec4565580c1e417fa95c7cc8243f67fbddc2c78cbb35273738278"
        },
        {
          "name": "search_tools",
          "title": "Search AI tools",
          "description": "Search the EveryAI directory for AI tools that fit a task, e.g. \"transcribe podcast episodes\" or \"logo maker\". Returns the best matches with their EveryAI page, website, category and a short description. Listings marked \"featured\" are paid placements.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Only tools in this category.",
                "enum": ["Writing", "Image", "Video", "Audio", "Code", "Business", "Marketing", "Education", "Personal", "Healthcare", "Finance", "Legal", "Gaming", "Entertainment", "3D", "Other"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "What the user wants to do, or a tool name. Leave empty to list the newest tools (featured first).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search AI tools"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3fb6bd4ceb226591ce7e10e56b13cc3d6f671b8ca82192cb1860b218272f1e5d"
        },
        {
          "name": "submit_tool",
          "title": "List an AI tool on EveryAI",
          "description": "List a founder's AI tool on EveryAI now. Pass the details and the founder's email: the listing is created for them, EveryAI emails them a link to confirm it (no account or sign-in needed), and you get back a $19 one-time Featured checkout URL. List it as Featured on EveryAI for $19 once: it skips the free launch queue (which can run weeks) and launches today, gets a permanent do-follow backlink, is pinned above free listings, and competes for the #1-#3 AI Launch of the Day badges. Give the URL to the founder, or pay it yourself if they authorised you to. Free listings join the launch queue once confirmed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "description": "Who is submitting, e.g. \"Claude for Jane Doe\" (shown to the founder and reviewers).",
                "maxLength": 60,
                "type": "string"
              },
              "category": {
                "enum": ["Writing", "Image", "Video", "Audio", "Code", "Business", "Marketing", "Education", "Personal", "Healthcare", "Finance", "Legal", "Gaming", "Entertainment", "3D", "Other"],
                "type": "string"
              },
              "description": {
                "description": "One or two sentences on what it does and for whom.",
                "maxLength": 1000,
                "type": "string"
              },
              "features": {
                "description": "Short feature lines.",
                "items": {
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "founderEmail": {
                "description": "The founder's own email, with their consent. EveryAI sends the confirm link here and the listing belongs to this address.",
                "type": "string"
              },
              "founderName": {
                "description": "Optional; prefills checkout.",
                "maxLength": 120,
                "type": "string"
              },
              "name": {
                "maxLength": 120,
                "type": "string"
              },
              "plan": {
                "default": "featured",
                "description": "\"featured\" also returns a $19 checkout URL; \"free\" only queues it after the founder confirms.",
                "enum": ["featured", "free"],
                "type": "string"
              },
              "subcategory": {
                "description": "A use case inside the category (see list_categories).",
                "type": "string"
              },
              "url": {
                "description": "The tool's website.",
                "type": "string"
              }
            },
            "required": ["description", "founderEmail", "name", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "List an AI tool on EveryAI"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b8f29112bd76f4c16f0d7f421790f776aaeb23e607a645b7dde761c2c84cf5ed"
        }
      ],
