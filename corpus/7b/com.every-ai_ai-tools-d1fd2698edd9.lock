        },
        {
          "name": "compare_tools",
          "title": "Compare two AI tools",
          "description": "Put two listed AI tools side by side: category, use case, stated pricing, platforms, features, data quality and last-verified dates, with the fields where they differ called out. Call this when the user is choosing between two specific tools (\"X or Y?\", \"how does X compare to Y?\"), often after recommend_tool. Pass \"task\" to also see which listing covers that job better. Every value is what the listing states; a missing value means not stated, not absent from the product.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "a": {
                "description": "The first tool. A tool's slug (\"acme-notes-jd7abc12\"), EveryAI page URL, website (\"https://acme.ai\") or exact name (\"Acme Notes\").",
                "type": "string"
              },
              "b": {
                "description": "The second tool, given the same way.",
                "type": "string"
              },
              "task": {
                "description": "Optional: the job the user wants done, to see which of the two fits it better.",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare two AI tools"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f6aaf34f8d0246bdfed6756fb9857c8de7927cbeaeff637ba3261c6738637e59"
        },
        {
