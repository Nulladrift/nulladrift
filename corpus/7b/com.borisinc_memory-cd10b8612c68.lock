{
  "lockfileVersion": 2,
  "subjects": {
    "com.borisinc/memory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mem.borisinc.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "memory-mcp",
        "version": "1.30.0"
      },
      "capabilities": {
        "experimental": {},
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "memory_export",
          "description": "Export memories in YOUR payer-wallet namespace (up to 1000/call, newest first; use offset to page through namespaces >1000). Your data is yours. Includes superseded_by so history is exportable. Paid: $0.01 via x402.",
          "inputSchema": {
            "properties": {
              "offset": {
                "description": "row offset for paging past the first 1000 (default 0)",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0701b47fca2fb6ee9f37bd165cd68e0ea213118dcc3ca17ed9c619a2d8964dce"
        },
        {
          "name": "memory_forget",
          "description": "Delete memories by id from YOUR namespace (or a namespace you hold a write/rw grant for). Max 100 ids per call. Paid: $0.001 per call via x402.",
          "inputSchema": {
            "properties": {
              "ids": {
                "description": "memory ids to delete (max 100)",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d3421597de931d323b20f97a5cd2abc9de7cf5d91163b7754d04c6f10aa94bca"
        },
        {
          "name": "memory_import",
          "description": "Bulk-write memories into YOUR namespace (max 200/call, content <=8k chars each). Accepts the exact shape memory_export emits, so a whole namespace can move in with one paid call. Embeds best-effort; missing embeddings are backfilled hourly. Paid: $0.01 flat via x402.",
          "inputSchema": {
            "properties": {
              "memories": {
                "description": "up to 200 items",
                "items": {
                  "properties": {
                    "content": {
                      "type": "string"
                    },
                    "tags": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "ts": {
                      "type": "number"
                    }
                  },
                  "required": ["content"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["memories"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:774069012231f15d0c3dbd366a562c1f14bcea17f9c5567019c55ddeecdd07db"
        },
        {
          "name": "memory_search",
          "description": "Semantic search over YOUR stored memories (payer-wallet namespace). Returns top-k by embedding similarity. Paid: $0.002 per search via x402.",
          "inputSchema": {
            "properties": {
              "k": {
                "description": "max results (default 5, cap 20)",
                "type": "integer"
              },
              "query": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a2603a90e02882b7c4f8865e92b3f748078689ff841ed75851674acbd7f9a95b"
        },
        {
          "name": "memory_search_free",
          "description": "FREE (no payment): semantic search over YOUR namespace, proven by an EIP-191 personal_sign. Same wallet_auth scheme as memory_write_free. Capped at 500 searches / rolling 30 days per wallet.",
          "inputSchema": {
            "properties": {
              "k": {
                "description": "max results (default 5, cap 20)",
                "type": "integer"
              },
              "query": {
                "type": "string"
              },
              "wallet_auth": {
                "description": "base64 JSON {address,ts,signature}",
                "type": "string"
              }
            },
            "required": ["query", "wallet_auth"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5212b6a35371fa21db7b37ac6b71aed24af69700da8a423b71a8b0149939fab9"
        },
        {
          "name": "memory_stats",
          "description": "FREE: count + last-write timestamp for any wallet namespace. Content is never returned on the free tier.",
          "inputSchema": {
            "properties": {
              "namespace": {
                "description": "wallet address",
                "type": "string"
              }
            },
            "required": ["namespace"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:73d59f43d16c68febba5e83844f5aa6c3009b61d8dcf07ab244e7f61518a96dc"
        },
        {
          "name": "memory_write",
          "description": "Store a memory permanently. Namespaced to YOUR paying wallet — your wallet is your private memory store. Semantic-indexed for later search. Optional supersedes=[ids] marks prior memories in your namespace as superseded by this one (excluded from search, still visible in export with their superseded_by id) — a Zep-style update-in-place without ever losing history. Paid: $0.001 per write via x402 (payment in _meta['x402/payment']).",
          "inputSchema": {
            "properties": {
              "content": {
                "description": "The memory text (max 8000 chars)",
                "type": "string"
              },
              "supersedes": {
                "description": "ids of prior memories (same namespace) that this write supersedes",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "tags": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["content"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b6728ec585112810897c42d9410d41cb4154e8098a72c2217bfc90c37f63df37"
        },
        {
          "name": "memory_write_free",
          "description": "FREE (no payment): store a memory in YOUR namespace, proven by an EIP-191 personal_sign instead of an x402 payment. wallet_auth = base64 JSON {address,ts,signature} where signature = personal_sign of 'borismem-free:<address>:<ts>' (ts within 600s). Writes to the SAME namespace paid calls use. Capped at 1000 writes / rolling 30 days per wallet; over cap returns an error pointing to the paid tier.",
          "inputSchema": {
            "properties": {
              "content": {
                "description": "The memory text (max 8000 chars)",
                "type": "string"
              },
              "tags": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "wallet_auth": {
                "description": "base64 JSON {address,ts,signature} -- see description",
                "type": "string"
              }
            },
            "required": ["content", "wallet_auth"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1301f94fa2176ef7fce54042499cafa61ada97c9ea1ad857166b946b2a351ac4"
        }
      ],
      "digest": "sha256:98d2fb58bbe7552cb865ef51b87d8a431a963b732a6b6b2250b4d9fc17b00916"
    }
  }
}
