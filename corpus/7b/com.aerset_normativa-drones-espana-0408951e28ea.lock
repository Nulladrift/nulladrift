        {
          "name": "uas_zones",
          "title": "Zonas UAS de ENAIRE en un rectángulo",
          "description": "Devuelve los polígonos de las zonas geográficas UAS que ENAIRE publica dentro de un rectángulo, con el tipo de cada una, sus límites vertical inferior y superior y la fecha en que ENAIRE la actualizó. Es la capa que pinta un mapa, no un veredicto sobre un punto: para eso está `flight_requirements`. Una lista vacía significa que la consulta a ENAIRE no devolvió ninguna zona para ese rectángulo, y `available: false` significa que no se pudo consultar — ni la una ni la otra describen el cielo. El visor oficial de ENAIRE tiene la última palabra. · Returns the UAS geographical zones ENAIRE publishes inside a bounding box, each with its kind, its vertical limits and ENAIRE's own update date. It is a map layer and not a verdict about a point. An empty list means our query to ENAIRE returned nothing for that rectangle; `available: false` means the query did not happen. ENAIRE's official viewer has the last word.",
