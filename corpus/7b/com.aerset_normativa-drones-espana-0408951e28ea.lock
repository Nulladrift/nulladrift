      "instructions": "Aerset: normativa de drones de España, con fuentes y fechas. Cinco herramientas de solo lectura sobre el corpus normativo, el motor de trámites, las zonas UAS de ENAIRE, los espacios protegidos de MITECO y los puntos de vuelo de la comunidad. ORIENTA y no autoriza: no concede permisos, no tramita nada y no afirma que una operación pueda realizarse. Cita siempre la fuente y su fecha, y manda la decisión operativa a AESA y al visor oficial de ENAIRE. · Spanish drone regulation, sourced and dated. Five read-only tools. It advises and never authorises: quote the source and its date, and send the operational decision to the authority.",
      "tools": [
        {
          "name": "flight_requirements",
          "title": "Trámites que exige un vuelo",
          "description": "Calcula, con el motor determinista de Aerset, qué trámites exige la normativa para volar en un punto de España, en una fecha y con una aeronave concreta: qué régimen de la categoría abierta aplica por peso y marcado de clase, qué zonas UAS publica ENAIRE sobre el punto, qué espacios protegidos constan en MITECO y quién autoriza cada cosa, con el plazo que el catálogo atribuye a cada trámite. Cada línea nombra la autoridad que la exige y la fuente con su fecha de revisión. NO concede permisos, no tramita nada y no afirma que la operación pueda realizarse: el campo `not_covered` enumera las fuentes que esta respuesta no consulta (NOTAM, terreno, obstáculos, meteo). La decisión es del operador y se consulta con AESA. · Runs Aerset's deterministic permit engine over a point, a date and an aircraft in Spain and returns the requirement list: the open-category regime for that weight and class marking, the UAS zones ENAIRE publishes over the point, the protected areas MITECO records, and who demands each item with the lead time our catalogue attributes to it. It grants nothing and files nothing; `not_covered` names the sources it does not consult, and the decision stays with the operator and the authority.",
