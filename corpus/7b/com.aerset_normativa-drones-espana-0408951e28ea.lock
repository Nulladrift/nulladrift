        {
          "name": "rules_catalogue",
          "title": "Catálogo de trámites",
          "description": "Devuelve el catálogo completo de trámites que Aerset mantiene para volar un dron en España, regla a regla: su código, su título, la autoridad que la exige, las condiciones en las que aplica, el plazo que le atribuimos y si ese plazo está comprobado contra la fuente o no, más la URL de la fuente y la fecha en que se revisó. Es el conjunto sobre el que trabaja `flight_requirements`, publicado para poder citarlo entero. Una regla sin `reviewed_at` no dice nada, y con `lead_time_verified: false` el plazo NO está comprobado. · Returns Aerset's whole catalogue of Spanish drone paperwork, rule by rule: code, title, the authority that demands it, the conditions under which it applies, the lead time we attribute to it and whether that lead time has been checked against the source, plus the source URL and the review date. It is the set `flight_requirements` evaluates, published so it can be cited whole.",
