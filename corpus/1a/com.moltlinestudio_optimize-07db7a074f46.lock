      "instructions": "Routing, packing, cutting and rostering over MCP (OR-Tools). Free: validate_problem, route_plan, distance_matrix_haversine, pack_bins, cutting_stock_1d, knapsack_select, explain_solution. Premium (license): route_plan_fleet, pack_bins_large, cutting_stock_2d, roster_shifts.",
      "tools": [
        {
          "name": "cutting_stock_1d",
          "title": "Cutting Stock 1D",
          "description": "Least-waste cut plan for bars, pipes or boards from stock lengths, with saw kerf. FREE.\n\nTypical input {\"stock\": [{\"length\": 6000, \"cost\": 30}], \"parts\":\n[{\"length\": 2200, \"qty\": 3}, {\"length\": 1500, \"qty\": 4}], \"kerf\": 3}\nreturns {\"bars\": [{\"stock_length\": 6000, \"cuts\": [2200, 2200, 1500],\n\"waste\": 94}], \"bars_used\": 3, \"waste_pct\": 4.2, \"solver_status\":\n\"OPTIMAL\"}. Minimises total stock cost (or count when no cost); CP-SAT\nproves optimality when it finishes inside the time limit and otherwise\nreturns the best plan found as FEASIBLE. Use for a cut list of up to 200\npieces. Not for sheets: use cutting_stock_2d. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"stock and parts must be non-empty lists (<value> and <value>)\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kerf": {
                "default": 0,
                "description": "material lost per cut (same unit as lengths).",
                "type": "number"
              },
              "parts": {
                "description": "required pieces: {length, qty}.",
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              },
              "stock": {
                "description": "stock lengths available: {length, cost, qty} (qty = how many of that length may be used; default unlimited).",
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              },
              "time_limit_s": {
                "default": 3,
                "description": "solver time budget in seconds (default 3, max 15).",
                "maximum": 15,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["parts", "stock"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cutting Stock 1D"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
