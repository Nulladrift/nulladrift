            "additionalProperties": false,
            "properties": {
              "depot": {
                "default": 0,
                "description": "index of the depot in stops (default 0).",
                "type": "integer"
              },
              "drop_penalty": {
                "default": 0,
                "description": "cost of leaving a stop unserved (0 = every stop must be served).",
                "type": "number"
              },
              "matrix": {
                "description": "square distance matrix in your units.",
