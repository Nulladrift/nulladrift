                "type": ["string", "null"]
              },
              "retry_after_seconds": {
                "type": "integer"
              },
              "site": {
                "type": "string"
              },
              "sitemap": {
                "type": ["object", "null"]
              },
              "submitted": {
                "type": "boolean"
              },
              "summary": {
                "type": "string"
              },
              "url_list": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "urls": {
                "type": "object"
              }
            },
            "required": ["acceptance_note", "as_of", "engines", "host", "key_file", "next_step", "protocol", "reason", "site", "sitemap", "submitted", "summary", "urls"],
            "type": "object"
          },
          "annotations": {
