        {
          "name": "indexnow_submit",
          "title": "Submit sitemap URLs to IndexNow",
          "description": "Submits a site's URLs to every IndexNow search engine. Use it when the user asks to submit their sitemap or changed pages to Bing, Yandex or IndexNow, for example \"submit the pages that changed this week on example.com\". Pass site and key; optional changed_since, path_prefix, sitemap or urls. It reads the key file first and sends nothing unless the file holds exactly the key. Then it posts the URLs to Microsoft Bing, Yandex, Seznam.cz, Naver, Yep, Amazonbot and returns each engine's status, HTTP code and meaning. At most 10,000 URLs per submit; pass batch 2, 3 and on for the rest. Limits: one submit per site every 60 seconds, and the same batch once every 5 minutes. Accepted is not indexed. Do not use it for a site the user does not own.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "key": "a1b2c3d4e5f6a7b8c9d0",
                "site": "send.example.com"
              }
            ],
            "properties": {
              "batch": {
                "description": "Optional, default 1. When more URLs qualify than one submit takes, batch 2 is the next slice of the newest-first list, and so on; urls.batches says how many there are.",
                "maximum": 50000,
                "minimum": 1,
                "type": "integer"
              },
              "changed_since": {
                "description": "Optional YYYY-MM-DD. Only sitemap URLs whose lastmod is on or after this day; URLs with no lastmod are left out.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "engines": {
                "description": "Optional subset of engines. Default: all 6 (bing, yandex, seznam, naver, yep, amazonbot).",
                "items": {
                  "enum": ["bing", "yandex", "seznam", "naver", "yep", "amazonbot"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "key": {
                "description": "The site's IndexNow key. Its key file must be live: nothing is sent unless the file holds exactly this key.",
                "maxLength": 128,
                "minLength": 8,
                "type": "string"
              },
              "key_location": {
                "description": "Optional https address of the key file when it is not at /<key>.txt. It must be on the same host and end in .txt; it then covers only URLs in its folder and below.",
                "maxLength": 2000,
                "minLength": 12,
                "type": "string"
              },
              "max_urls": {
                "description": "Optional URLs per submit, default 10,000. When more URLs qualify, the newest lastmod goes first and the rest wait for the next batch.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "path_prefix": {
                "description": "Optional path start, such as /blog/. Only URLs under it.",
                "maxLength": 300,
                "pattern": "^/",
                "type": "string"
              },
              "site": {
                "description": "The site's domain or address, such as example.com or https://www.example.com. A bare domain means https. One host per call: www.example.com and example.com are different hosts.",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              },
              "sitemap": {
                "description": "Optional sitemap or sitemap index address. Without it the Sitemap lines of robots.txt are used, then /sitemap.xml, /sitemap_index.xml and /wp-sitemap.xml. Gzip files work.",
                "maxLength": 2000,
                "minLength": 8,
                "type": "string"
              },
              "urls": {
                "description": "Optional list of URLs to send instead of the sitemap, all on the site's host. At most 10,000.",
                "items": {
                  "maxLength": 2048,
                  "minLength": 8,
                  "type": "string"
                },
                "maxItems": 10000,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["key", "site"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "acceptance_note": {
                "type": "string"
              },
              "as_of": {
                "type": "string"
              },
              "engines": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "host": {
                "type": "string"
              },
              "key_file": {
                "type": ["object", "null"]
              },
