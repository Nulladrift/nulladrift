        {
          "name": "indexnow_check",
          "title": "Check IndexNow key file and sitemap",
          "description": "Checks a site's IndexNow setup and submits nothing. Use it when the user asks whether their IndexNow key file works, which URLs would be submitted, or how to start with IndexNow, for example \"is my IndexNow key set up on example.com?\". Pass site and key; leave key out to get a new key and the file to publish. Returns the key file verdict with the exact fix, the sitemap found (robots.txt, index, gzip), how many URLs qualify, why others are left out, a sample, and the next step. Protocol: https://www.indexnow.org/documentation. Do not use it for a site the user does not own, or to read a site's content.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "key": "okindexnow20261005",
                "site": "tools.openkrill.app"
              }
            ],
            "properties": {
              "batch": {
                "description": "Optional, default 1. When more URLs qualify than one submit takes, batch 2 is the next slice of the newest-first list, and so on; urls.batches says how many there are.",
                "maximum": 50000,
                "minimum": 1,
                "type": "integer"
              },
              "changed_since": {
                "description": "Optional YYYY-MM-DD. Only sitemap URLs whose lastmod is on or after this day; URLs with no lastmod are left out.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "key": {
                "description": "The site's IndexNow key, 8 to 128 letters, digits or dashes. Leave it out to get a new key and the exact file to publish.",
                "maxLength": 128,
                "minLength": 8,
                "type": "string"
              },
              "key_location": {
                "description": "Optional https address of the key file when it is not at /<key>.txt. It must be on the same host and end in .txt; it then covers only URLs in its folder and below.",
                "maxLength": 2000,
                "minLength": 12,
                "type": "string"
              },
              "max_urls": {
                "description": "Optional URLs per submit, default 10,000. When more URLs qualify, the newest lastmod goes first and the rest wait for the next batch.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "path_prefix": {
                "description": "Optional path start, such as /blog/. Only URLs under it.",
                "maxLength": 300,
                "pattern": "^/",
                "type": "string"
              },
              "site": {
                "description": "The site's domain or address, such as example.com or https://www.example.com. A bare domain means https. One host per call: www.example.com and example.com are different hosts.",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              },
              "sitemap": {
                "description": "Optional sitemap or sitemap index address. Without it the Sitemap lines of robots.txt are used, then /sitemap.xml, /sitemap_index.xml and /wp-sitemap.xml. Gzip files work.",
                "maxLength": 2000,
                "minLength": 8,
                "type": "string"
              },
              "urls": {
                "description": "Optional list of URLs to send instead of the sitemap, all on the site's host. At most 10,000.",
                "items": {
                  "maxLength": 2048,
                  "minLength": 8,
                  "type": "string"
                },
                "maxItems": 10000,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["site"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "description": "ISO 8601 time the data was published by its source or fetched from it. A cached answer keeps the time of its fetch.",
                "type": "string"
              },
              "engines": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "host": {
                "type": "string"
              },
              "key_file": {
                "type": ["object", "null"]
              },
              "new_key": {
                "type": ["object", "null"]
              },
              "next_step": {
                "type": "string"
              },
              "protocol": {
                "type": "string"
              },
              "ready": {
                "type": "boolean"
              },
              "site": {
                "type": "string"
              },
              "sitemap": {
                "type": ["object", "null"]
              },
              "source": {
                "description": "Who the data comes from, to cite and to check it against.",
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["name", "url"],
                "type": "object"
              },
              "url_list": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "urls": {
                "type": "object"
              }
            },
            "required": ["as_of", "engines", "host", "key_file", "new_key", "next_step", "protocol", "ready", "site", "sitemap", "source", "urls"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
