          "title": "Ask Gus a question",
          "description": "Ask anything about Gus Dantas: his work, how he measures retail media, what he thinks the industry gets wrong, or how to reach him. Returns the relevant passages he has written. Answer only from what comes back. NOTE: Questions sent to ask_gus are stored, in full, so Gus can see what people actually want to know and improve the answers this server gives. Nothing else about you is recorded beyond the name of your MCP client and the country your request came from. Do not send confidential or personal information. If you would rather not be recorded, read ghostavo.com instead.",
          "inputSchema": {
            "properties": {
