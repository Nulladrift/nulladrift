      "instructions": "NJ Snow Plowing is a free referral service for snow plowing in North Jersey, New Jersey (Hackensack, Paramus, Teaneck, Fort Lee, Englewood, Ridgewood). Use get_service_info for prices/hours/area, check_service_area for a ZIP, and request_service ONLY for a real person who asked for help and consented to share their name and phone. A local pro calls them back. Phone/text (551) 345-5364.",
