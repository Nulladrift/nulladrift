{
  "lockfileVersion": 2,
  "subjects": {
    "app.ivive/ivive": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.ivive.app/mcp/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ivive",
        "version": "1.0.3"
      },
      "capabilities": {
        "experimental": {},
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ADME/IVIVE calculations for early drug discovery. Do not compute clearance yourself: call these tools. Relay the warnings and caveats in each result to the user. Values from predict_inputs are predictions; when they feed another tool, say so. All results are research estimates, not for clinical, regulatory or dosing decisions; tell the user so.",
      "tools": [
        {
          "name": "calc_clhep",
          "description": "Hepatic and plasma clearance from in-vitro CLint, fu,mic and fu,p (IVIVE), with the observed-CL band and applicability warnings. If fu,p or fu,mic came from predict_inputs, tell the user the result rests on predicted inputs.",
          "inputSchema": {
            "properties": {
              "assay_type": {
                "default": "microsomes",
                "description": "Assay type for CLint scaling. microsomes: uses MPPGL (mg/g) × 1e-3; hepatocytes: uses HPGL (×10⁶ cells/g) × 1e-3.",
                "enum": ["microsomes", "hepatocytes"],
                "title": "Assay Type",
                "type": "string"
              },
              "clint": {
                "description": "Intrinsic clearance (µL/min/mg microsomal protein). Use ge=0: zero clearance is physiologically valid.",
                "minimum": 0,
                "title": "Clint",
                "type": "number"
              },
              "clint_censored": {
                "default": false,
                "description": "Set when the assay reported CLint below its limit of quantification and `clint` is that limit rather than a measurement. CLint then lies in [0, clint), so every clearance output is an upper bound: `upper_bound` is true, no observed-CL band is returned, and the clint_below_loq flag fires.",
                "title": "Clint Censored",
                "type": "boolean"
              },
              "correction_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Saved lab correction (/api/correction-equations) to apply. Must match species and assay_type. Corrects predicted plasma CL and replaces the reference band with one from the lab's compounds.",
                "title": "Correction Id"
              },
              "fu_mic": {
                "description": "Unbound fraction in microsomes (0–1). Corrects for non-specific microsomal binding.",
                "exclusiveMinimum": 0,
                "maximum": 1,
                "title": "Fu Mic",
                "type": "number"
              },
              "fu_p": {
                "description": "Unbound fraction in plasma (0–1). Plasma protein binding correction.",
                "maximum": 1,
                "minimum": 0,
                "title": "Fu P",
                "type": "number"
              },
              "model": {
                "default": "well-stirred",
                "description": "IVIVE model. well-stirred (venous equilibrium) or parallel-tube (sinusoidal perfusion).",
                "enum": ["well-stirred", "parallel-tube"],
                "title": "Model",
                "type": "string"
              },
              "rb": {
                "default": 1,
                "description": "Blood-to-plasma concentration ratio. fu_b = fu_p / Rb. Output is blood clearance.",
                "exclusiveMinimum": 0,
                "maximum": 50,
                "title": "Rb",
                "type": "number"
              },
              "species": {
                "description": "Species for physiological parameters (Qh, MPPGL, liver weight).",
                "enum": ["human", "rat", "dog"],
                "title": "Species",
                "type": "string"
              }
            },
            "required": ["clint", "fu_mic", "fu_p", "species"],
            "title": "CLhepRequest",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b94ee2042067236d10022864ef0531c845cd5fa6efa43eed16298780fd5c0fc8"
        },
        {
          "name": "input_sensitivity",
          "description": "How far plasma CL moves as each input is varied over a range, e.g. a predicted fu,p over its 50% range.",
          "inputSchema": {
            "$defs": {
              "InputRange": {
                "properties": {
                  "high": {
                    "description": "High end, in the input's own units, e.g. 0.2 for fu,p.",
                    "exclusiveMinimum": 0,
                    "title": "High",
                    "type": "number"
                  },
                  "low": {
                    "description": "Low end, in the input's own units, e.g. 0.05 for fu,p.",
                    "exclusiveMinimum": 0,
                    "title": "Low",
                    "type": "number"
                  }
                },
                "required": ["high", "low"],
                "title": "InputRange",
                "type": "object"
              }
            },
            "description": "The same inputs as a calculation, plus the range to vary each over.",
            "properties": {
              "assay_type": {
                "default": "microsomes",
                "description": "Assay type for CLint scaling. microsomes: uses MPPGL (mg/g) × 1e-3; hepatocytes: uses HPGL (×10⁶ cells/g) × 1e-3.",
                "enum": ["microsomes", "hepatocytes"],
                "title": "Assay Type",
                "type": "string"
              },
              "clint": {
                "description": "Intrinsic clearance (µL/min/mg microsomal protein). Use ge=0: zero clearance is physiologically valid.",
                "minimum": 0,
                "title": "Clint",
                "type": "number"
              },
              "clint_censored": {
                "default": false,
                "description": "Set when the assay reported CLint below its limit of quantification and `clint` is that limit rather than a measurement. CLint then lies in [0, clint), so every clearance output is an upper bound: `upper_bound` is true, no observed-CL band is returned, and the clint_below_loq flag fires.",
                "title": "Clint Censored",
                "type": "boolean"
              },
              "clint_range": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/InputRange"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "CLint range in the assay's units, e.g. {\"low\": 10, \"high\": 40}."
              },
              "correction_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Saved lab correction (/api/correction-equations) to apply. Must match species and assay_type. Corrects predicted plasma CL and replaces the reference band with one from the lab's compounds.",
                "title": "Correction Id"
              },
              "fu_mic": {
                "description": "Unbound fraction in microsomes (0–1). Corrects for non-specific microsomal binding.",
                "exclusiveMinimum": 0,
                "maximum": 1,
                "title": "Fu Mic",
                "type": "number"
              },
              "fu_mic_range": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/InputRange"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "fu,mic range (0–1), e.g. {\"low\": 0.5, \"high\": 0.9}."
              },
              "fu_p": {
                "description": "Unbound fraction in plasma (0–1). Plasma protein binding correction.",
                "maximum": 1,
                "minimum": 0,
                "title": "Fu P",
                "type": "number"
              },
              "fu_p_range": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/InputRange"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A predicted fu,p carries its 50% range; pass it to see what it costs."
              },
              "model": {
                "default": "well-stirred",
                "description": "IVIVE model. well-stirred (venous equilibrium) or parallel-tube (sinusoidal perfusion).",
                "enum": ["well-stirred", "parallel-tube"],
                "title": "Model",
                "type": "string"
              },
              "rb": {
                "default": 1,
                "description": "Blood-to-plasma concentration ratio. fu_b = fu_p / Rb. Output is blood clearance.",
                "exclusiveMinimum": 0,
                "maximum": 50,
                "title": "Rb",
                "type": "number"
              },
              "species": {
                "description": "Species for physiological parameters (Qh, MPPGL, liver weight).",
                "enum": ["human", "rat", "dog"],
                "title": "Species",
                "type": "string"
              }
            },
            "required": ["clint", "fu_mic", "fu_p", "species"],
            "title": "SensitivityRequest",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8d078ee317083c542befed3244ea611823b95e21e57c02ada788ff496c9d39af"
        },
        {
          "name": "predict_inputs",
          "description": "Predict fu,p and fu,inc from a SMILES, with structure-only human CL and Vss as second opinions. Predictions, not measurements; check the applicability verdict.",
          "inputSchema": {
            "properties": {
              "assay_type": {
                "default": "microsomes",
                "description": "Incubation fu,inc is predicted for: microsomes or hepatocytes.",
                "enum": ["microsomes", "hepatocytes"],
                "title": "Assay Type",
                "type": "string"
              },
              "concentration": {
                "default": 1,
                "description": "Incubation concentration: mg microsomal protein/mL, or 10⁶ hepatocytes/mL.",
                "exclusiveMinimum": 0,
                "maximum": 10,
                "title": "Concentration",
                "type": "number"
              },
              "smiles": {
                "description": "Structure as SMILES.",
                "maxLength": 2000,
                "title": "Smiles",
                "type": "string"
              }
            },
            "required": ["smiles"],
            "title": "PredictionRequest",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:946efc760f33cd45a2b413ea3a046f652054ddaa8d47673773d4b31ce8a10803"
        },
        {
          "name": "scale_to_human",
          "description": "Predict human plasma CL from observed animal in-vivo CL (rat, dog, monkey), every applicable method with its measured error. Observed animal CL only, never predicted.",
          "inputSchema": {
            "$defs": {
              "SpeciesPoint": {
                "description": "One animal's measured in-vivo plasma clearance, and optionally its binding.",
                "properties": {
                  "cl": {
                    "description": "Observed plasma CL, mL/min/kg",
                    "exclusiveMinimum": 0,
                    "maximum": 1000,
                    "title": "Cl",
                    "type": "number"
                  },
                  "fu_p": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "maximum": 1,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Unbound fraction in plasma for this species",
                    "title": "Fu P"
                  },
                  "species": {
                    "description": "One of ['dog', 'monkey', 'rat']",
                    "title": "Species",
                    "type": "string"
                  }
                },
                "required": ["cl", "species"],
                "title": "SpeciesPoint",
                "type": "object"
              }
            },
            "properties": {
              "animals": {
                "description": "One entry per species, e.g. [{\"species\": \"rat\", \"cl\": 40}, {\"species\": \"dog\", \"cl\": 12}].",
                "items": {
                  "$ref": "#/$defs/SpeciesPoint"
                },
                "minItems": 1,
                "title": "Animals",
                "type": "array"
              },
              "fu_p_human": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 1,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Human unbound fraction, needed by the fu-corrected methods",
                "title": "Fu P Human"
              }
            },
            "required": ["animals"],
            "title": "ScalingRequest",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bb2b71758dd37e33bc1b5b53d022fd9d1705e45b7715856cbb34f17a31b6f687"
        },
        {
          "name": "similar_drugs",
          "description": "Nearest reference drugs to a SMILES (Tanimoto, Morgan radius 2), each with measured human plasma CL and the CL IVIVE predicted from its measured inputs. Use it to judge how far to trust calc_clhep for this chemotype: if IVIVE missed on the neighbours, expect it to miss here. Returns neighbours only, not a prediction for the query.",
          "inputSchema": {
            "properties": {
              "n": {
                "default": 3,
                "description": "How many reference drugs to return, nearest first.",
                "maximum": 10,
                "minimum": 1,
                "title": "N",
                "type": "integer"
              },
              "smiles": {
                "description": "Structure as SMILES.",
                "maxLength": 2000,
                "title": "Smiles",
                "type": "string"
              }
            },
            "required": ["smiles"],
            "title": "SimilarityRequest",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b9bb1c1c2cec46f2fc765ac9de564ba389e5134433ab35fb012af461321e7adf"
        },
        {
          "name": "target_clint",
          "description": "The in-vitro CLint an assay must read for a compound to reach a target plasma clearance (mL/min/kg): calc_clhep run backwards, e.g. to set a CLint cut-off for a screening cascade. Needs fu,mic and fu,p; refuses a target at or above the liver blood flow ceiling and returns that ceiling. Uncorrected IVIVE, so no error band.",
          "inputSchema": {
            "properties": {
              "assay_type": {
                "default": "microsomes",
                "description": "Assay the CLint is for; sets its units (µL/min/mg protein or µL/min/10⁶ cells).",
                "enum": ["microsomes", "hepatocytes"],
                "title": "Assay Type",
                "type": "string"
              },
              "fu_mic": {
                "description": "Unbound fraction in the incubation (0–1) the CLint would be measured at.",
                "exclusiveMinimum": 0,
                "maximum": 1,
                "title": "Fu Mic",
                "type": "number"
              },
              "fu_p": {
                "description": "Unbound fraction in plasma (0–1).",
                "exclusiveMinimum": 0,
                "maximum": 1,
                "title": "Fu P",
                "type": "number"
              },
              "model": {
                "default": "well-stirred",
                "description": "IVIVE liver model to invert.",
                "enum": ["well-stirred", "parallel-tube"],
                "title": "Model",
                "type": "string"
              },
              "rb": {
                "default": 1,
                "description": "Blood-to-plasma concentration ratio; raises the plasma CL ceiling (Qh × Rb).",
                "exclusiveMinimum": 0,
                "maximum": 50,
                "title": "Rb",
                "type": "number"
              },
              "species": {
                "description": "Species whose liver blood flow and scaling factors apply.",
                "enum": ["human", "rat", "dog"],
                "title": "Species",
                "type": "string"
              },
              "target_clp": {
                "description": "Plasma clearance to aim for (mL/min/kg). Must be below hepatic blood flow × Rb.",
                "exclusiveMinimum": 0,
                "title": "Target Clp",
                "type": "number"
              }
            },
            "required": ["fu_mic", "fu_p", "species", "target_clp"],
            "title": "TargetClintRequest",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e85f54b7359b349159ae5fc86044b0736d50674cba264e972d4b0497f98093d3"
        }
      ],
      "digest": "sha256:64ac7b2a1091e5bb4f5c515a9972c9de37d51d07c1d955c47c17ec9b3e33f4ca"
    }
  }
}
