      },
      "instructions": "Bruk bare saksopplysninger kunden har gitt i denne samtalen eller selv valgt å dele. Mangler teksten til «samme sak», be kunden beskrive saken med én setning. Ikke let i tidligere chatter, logger eller lokale filer, og ikke bruk terminal eller skript for å finne saken. Før bestilling trenger du ett oppslag: Har kunden selv oppgitt rabattkode, bruk bare check_review_price. Ellers bruker du get_review_process med intent=contact_lawyer. Begge gir deg tilbudet og neste steg. Svar kunden med en gang etter oppslaget. Bruk vanlig norsk. Hold kategorikoder, tekniske ID-er og vilkårsversjoner utenfor kundeteksten. Vis eksempler bare på forespørsel. Bruk get_review_process uten argumenter for spørsmål om pris og omfang. Ikke foreslå rabattkoder. Vis tilbudt totalpris. Ved ugyldig kode må kunden selv velge om de vil fortsette til ordinær pris.",
