            "properties": {
              "lat": {
                "description": "Latitude in decimal degrees, e.g. 39.5883. US coverage only (USGS).",
                "type": "number"
              },
              "lon": {
                "description": "Longitude in decimal degrees, negative in the western hemisphere, e.g. -105.6438.",
