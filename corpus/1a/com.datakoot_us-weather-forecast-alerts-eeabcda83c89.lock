      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Weather & Geo Intel: US weather forecasts, current conditions, active NWS alerts, recent earthquakes (USGS), ground elevation, and US address geocoding. Have a location as text - a street address or just a city like 'Chicago, IL'? Call geocode first to get lat/lon, then the weather tools.",
      "tools": [
        {
          "name": "earthquakes",
          "title": "Earthquakes",
          "description": "List recent earthquakes worldwide from the USGS feed. Filter by minimum magnitude, look-back window in days, and optionally a bounding box or a point+radius (km). Returns magnitude, place, time, depth and coordinates.",
          "inputSchema": {
            "properties": {
              "days": {
                "default": 7,
                "description": "Look back this many days (default 7, max 30).",
                "type": "integer"
              },
              "lat": {
                "description": "Optional center latitude for a radius search.",
                "type": "number"
              },
              "limit": {
                "default": 20,
                "description": "Maximum number of quakes to return.",
                "type": "integer"
              },
              "lon": {
                "description": "Optional center longitude for a radius search.",
                "type": "number"
              },
              "min_magnitude": {
                "default": 4.5,
                "description": "Only return quakes at or above this magnitude.",
                "type": "number"
              },
              "radius_km": {
                "description": "Radius in km around lat/lon (requires lat+lon).",
                "type": "number"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "count": {},
              "criteria": {},
              "earthquakes": {},
              "provenance": {
                "description": "Where this answer came from. served_at is when Datakoot answered (UTC); upstream lists the official sources consulted. Datakoot may serve a briefly cached copy, so the source's own observation can be older than served_at.",
                "properties": {
                  "may_be_cached": {
                    "type": "boolean"
                  },
                  "publisher": {
                    "type": "string"
                  },
                  "served_at": {
                    "format": "date-time",
                    "type": "string"
                  },
                  "upstream": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "source": {}
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
