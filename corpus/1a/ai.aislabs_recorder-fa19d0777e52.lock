          },
          "digest": "sha256:3f322a8d29add564da05edebdc686d5fbf1ab9691780d0ffd015eadc0d1f823e"
        },
        {
          "name": "fetch_capsule",
          "description": "Agent Flight Recorder (Gateway key) — get the last state capsule a monitored agent sent, to resume from where it died.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "monitor_id": {
                "type": "string"
              },
              "secret": {
                "type": "string"
              }
            },
            "required": ["monitor_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:91613a60be43d52b19441c244f5daa82226a8e0e55b2602b26d601c70fc053a7"
        },
        {
          "name": "fleet_status",
          "description": "Agent Flight Recorder (Gateway key) — every monitor you own: alive / late / dead, last heartbeat, capsule preview.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:86d2f2eed6662f561bbc5bd2b598632f7fc41255864898c6490abb79f0e40d0b"
        },
        {
          "name": "heartbeat",
          "description": "Agent Flight Recorder — \"still alive\" ping for a registered monitor. Include capsule (any JSON ≤32KB: current step, done, next, ids) so a dead-man alert can carry resume state (stored on the key tier). status:\"fail\" reports a failure immediately.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "capsule": {
                "description": "Resume state: { step, done: [...], next, ids: {...} } — anything JSON",
                "type": "object"
              },
              "monitor_id": {
                "type": "string"
              },
              "secret": {
                "description": "Monitor secret from register_monitor (not needed when calling with the owning Gateway key)",
                "type": "string"
              },
              "status": {
                "enum": ["ok", "fail"],
                "type": "string"
              }
            },
            "required": ["monitor_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ec8e66f3e59a4838725505936d980542b58c354dccab023216b54ea7a89c1fd6"
        },
        {
          "name": "register_monitor",
          "description": "Agent Flight Recorder — FREE (1 monitor per alert target) / Gateway key (20 monitors + stored capsules + fleet view). Register an agent or scheduled job to be watched: you get a monitor_id + secret; the agent then calls heartbeat every period_minutes. If heartbeats stop for period + grace, the alert target (Discord/HTTPS webhook and/or email) is notified with the last state capsule and a resume link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "alert_email": {
                "description": "Email address to alert (Gateway key tier only; capped at 10 emails/monitor/day)",
                "type": "string"
              },
              "alert_webhook": {
                "description": "Discord webhook URL or any HTTPS webhook (receives JSON)",
                "type": "string"
              },
              "grace_minutes": {
                "description": "How late a heartbeat may be before alerting (default 5)",
                "type": "number"
              },
              "name": {
                "description": "What is being watched, e.g. \"nightly ETL loop\"",
                "type": "string"
              },
              "period_minutes": {
                "description": "Expected heartbeat interval in minutes (default 10)",
                "type": "number"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:011b163b72f140fc00ccb8ff15fca81a9b1f8483209bc611e6a787b29e64342b"
        }
      ],
      "digest": "sha256:59726fb077c5c7792de69308889b26a78ffb4b5d104e05c7f823f261c04d963f"
    }
  }
