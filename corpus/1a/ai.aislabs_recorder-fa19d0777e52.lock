      },
      "serverInfo": {
        "name": "ais-recorder",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "delete_monitor",
          "description": "Agent Flight Recorder — remove a monitor (needs its secret or the owning key).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "monitor_id": {
                "type": "string"
              },
