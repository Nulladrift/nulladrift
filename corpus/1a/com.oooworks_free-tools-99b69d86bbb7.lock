        {
          "name": "write_review_reply",
          "title": "Write replies to a customer review",
          "description": "Writes up to three reply drafts (short, warm, formal; at most 120 words each) that a business owner can post under a customer review on Google, Yelp, Tripadvisor, Naver or elsewhere. Gemini writes them from the review and the owner's details only, without web search; then OOO Works' checks drop any draft that offers or promises something the owner didn't (refunds, discounts, free items, guarantees), asks for the review to be changed or removed, adds a number, name, link or phone number that isn't in the review or the owner's details, makes a superlative or health claim, or, for a health business, mentions any health detail. Warnings say what to watch before posting. Drafts are suggestions for the owner to read and edit; nothing is posted. Limited to 10 replies a day per caller; identical requests are answered from memory for 24 hours.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "business": {
                "description": "the business name",
                "type": "string"
              },
              "business_type": {
                "description": "what the business does, e.g. dentist or Italian restaurant",
                "type": "string"
              },
              "contact": {
                "description": "phone, email or page where the reviewer can reach the business privately",
                "type": "string"
              },
              "language": {
                "description": "reply language: auto (the review's language), en, ko, ja, zh, es, fr, de, it, pt, nl, vi, th or id",
                "type": "string"
              },
              "owner_name": {
                "description": "who signs the reply",
                "type": "string"
              },
              "platform": {
                "description": "where it was posted: google, yelp, tripadvisor, naver, kakao, facebook, trustpilot, booking, airbnb or other",
                "type": "string"
              },
              "review": {
                "description": "the customer's review as posted, at most 2,000 characters",
                "type": "string"
              },
              "reviewer": {
                "description": "the reviewer's name as the platform shows it, to greet them by",
                "type": "string"
              },
              "stars": {
                "description": "the review's star rating, 1 to 5; leave out when there is none",
                "type": "integer"
              },
              "what_to_say": {
                "description": "anything the owner wants the reply to say, in their words",
                "type": "string"
              }
            },
            "required": ["business", "business_type", "review"],
            "type": "object"
