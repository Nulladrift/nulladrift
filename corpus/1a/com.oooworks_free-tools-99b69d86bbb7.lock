      "instructions": "Free checks from OOO Works (https://oooworks.com/tools/). check_ai_crawler_access tells whether ChatGPT, Claude, Perplexity, Google's AI answers, Copilot, Siri, Alexa, DuckDuckGo and Mistral can read a web page, and what to change if they can't. check_social_search_preview shows how a page appears in Google results and in link previews (Open Graph, X cards). check_sitemap finds and validates a site's XML sitemap and tests a sample of its addresses. get_ai_ready_badge reads the AI-ready badge status we hold for a site, without running a check. check_email_security reads a domain's SPF, DMARC, MX and DKIM records and suggests records to add. check_site_health looks at a site's uptime, certificate, domain expiry, email records, security headers, cookies and privacy link in one go. check_ai_booking reads a business's website, finds its booking or ordering tool, and says whether Google AI Mode, Google's Book button, ChatGPT, Claude and Perplexity can book or order through it. write_review_reply writes checked reply drafts for a customer review. get_review_insights reads 5 to 60 customer reviews and says what customers love, what they complain about and what to fix, with quotes checked word for word. draft_faq_page reads a business's own website and drafts FAQ answers grounded in its pages, plus the questions it doesn't answer yet. write_social_posts reads a business's website and writes a checked week of social media posts from it.",
      "tools": [
        {
          "name": "check_ai_booking",
          "title": "Can customers book this business through AI?",
          "description": "Reads a business's homepage and up to four of its booking, menu or price pages, finds the booking or ordering tools it links to or embeds (OpenTable, Resy, Booksy, Fresha, Vagaro, Square, Jobber and about 35 others), and says for Google AI Mode, Google's Book button, ChatGPT, Claude and Perplexity whether they can book or order through those tools (yes, no or unclear, with the source of each yes and the countries it applies to). Also says whether prices are on the site, since Google's AI may phone a business to ask. Only sees the website. Limited to 30 checks an hour per caller (shared with the other checks); results are cached for 10 minutes.",
