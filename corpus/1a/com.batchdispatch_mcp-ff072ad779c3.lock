{
  "lockfileVersion": 2,
  "subjects": {
    "com.batchdispatch/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://batchdispatch.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "batch-dispatch",
        "title": "Batch Dispatch wholesale",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Batch Dispatch is a wholesale marketplace: bulk stock direct from suppliers, sold by the piece, kg or bale. Flow: search_lots → get_lot → get_quote (exact delivered price, shows blockers) → confirm with the buyer → create_order → give the buyer each pay_url. Agents never pay; the buyer pays by card and the money is held until they confirm the goods arrived as described. Suppliers pay no commission; buyers pay a 5% buyer protection fee, shown in get_quote. Respect each lot's moq and each supplier's minimum order. If nothing fits, use request_stock.",
      "tools": [
        {
          "name": "create_order",
          "description": "Place the order for a human buyer and get one pay link per supplier. The buyer opens pay_url and pays by card on Stripe; agents cannot pay. Money is held until the buyer confirms the goods arrived. Unpaid orders expire after 24 hours and hold no stock. Confirm the get_quote total with the buyer first.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Full delivery address including postcode",
                "type": "string"
              },
              "agent": {
                "description": "Name of your agent or app, for our records",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166 alpha-2",
                "type": "string"
              },
              "email": {
                "description": "Buyer email; receipts and tracking go here",
                "type": "string"
              },
              "items": {
                "items": {
                  "properties": {
                    "listing_id": {
                      "type": "integer"
                    },
                    "qty": {
                      "description": "Units of the lot's unit (piece, kg, bale...). At least its moq.",
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["listing_id", "qty"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "name": {
                "description": "Buyer or business name",
                "type": "string"
              }
            },
            "required": ["address", "country", "email", "items", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f790c7205aff3536433ae7e8d67feec9b2361ef28f5f10d11b78f6c5d5bd5f64"
        },
        {
          "name": "get_lot",
          "description": "Full details of one lot: description, photos and video, grade, pieces, weight, moq, minimum spend, stock, supplier.",
          "inputSchema": {
            "properties": {
              "listing_id": {
                "type": "integer"
              }
            },
            "required": ["listing_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cf27516f4165070f97ce6cf2b5ba6c4316bfa0086799fc36e4f7c85316ae2f57"
        },
        {
          "name": "get_order_status",
          "description": "Status of an order (confirmed = awaiting payment, paid, completed). Needs the order reference and the buyer email.",
          "inputSchema": {
            "properties": {
              "email": {
                "type": "string"
              },
              "reference": {
                "type": "string"
              }
            },
            "required": ["email", "reference"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b2e7b177d4847eb88b9e5b890493e7d5b4902b79ed2151ecd816d31c21278fc1"
        },
        {
          "name": "get_quote",
          "description": "Exact delivered price before ordering, per supplier: goods, carriage, VAT, the 5% buyer protection fee and total, plus anything blocking the order (supplier minimum, sold out). Creates nothing.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Delivery country, ISO 3166 alpha-2, e.g. GB, DE, US",
                "type": "string"
              },
              "email": {
                "description": "Optional buyer email; applies their no-fee referral pairs",
                "type": "string"
              },
              "items": {
                "items": {
                  "properties": {
                    "listing_id": {
                      "type": "integer"
                    },
                    "qty": {
                      "description": "Units of the lot's unit (piece, kg, bale...). At least its moq.",
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["listing_id", "qty"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["country", "items"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6ea5066586c4cc54dcbed057b5f99cf19896860e429d6ba32ae2f4e6d7a71276"
        },
        {
          "name": "list_categories",
          "description": "What is in stock now: live lot count by category, grade and brand.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:99a493271cdc72afef74c8bc4fc567fb5a6a95674395163eba6b0bdb6b5cd1be"
        },
        {
          "name": "request_stock",
          "description": "Ask us to find stock the catalogue does not show. We contact matching wholesale suppliers and email their offers to the buyer.",
          "inputSchema": {
            "properties": {
              "agent": {
                "type": "string"
              },
              "budget": {
                "description": "e.g. \"£4/kg\"",
                "type": "string"
              },
              "country": {
                "description": "Delivery country, ISO 3166 alpha-2",
                "type": "string"
              },
              "description": {
                "description": "What, which grade or condition, any brands",
                "type": "string"
              },
              "email": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "quantity": {
                "description": "e.g. \"500kg a month\" or \"3 bales\"",
                "type": "string"
              }
            },
            "required": ["description", "email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:26be173d8b391480731186db3cce9efd309192cbc968bbbcd9e3037802ed71df"
        },
        {
          "name": "search_lots",
          "description": "Search live wholesale lots (bulk stock: clothing by the kg or piece, bales, returns, electronics and more). Returns price per unit, minimum order (moq), stock, supplier country and link.",
          "inputSchema": {
            "properties": {
              "brand": {
                "type": "string"
              },
              "category": {
                "type": "string"
              },
              "currency": {
                "description": "ISO code the buyer thinks in; adds an approximate converted price",
                "type": "string"
              },
              "grade": {
                "type": "string"
              },
              "max_unit_price": {
                "type": "number"
              },
              "page": {
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free text, e.g. \"carhartt jackets\" or \"grade A jeans\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:177c38d60f2dd3050c101a54d4dc5e0dd99df2d3f0e777fca4e0f7e411edc0c0"
        }
      ],
      "digest": "sha256:98167320cd3ddda25189f591f1eaa4c9bdb27f408397ad0d45546e5aa37bec61"
    }
  }
}
