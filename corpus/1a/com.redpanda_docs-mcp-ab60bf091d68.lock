                  "corresponding_cluster_property": {
                    "type": "string"
                  },
                  "default": {},
                  "default_human_readable": {
                    "type": "string"
                  },
                  "description": {
                    "type": "string"
                  },
                  "docs_url": {
                    "type": "string"
                  },
                  "enterprise_value": {},
                  "enum": {
                    "type": "array"
                  },
                  "example": {
                    "type": "string"
                  },
                  "introduced_in": {
                    "type": "string"
                  },
                  "is_deprecated": {
                    "type": "boolean"
                  },
                  "is_enterprise": {
                    "type": "boolean"
                  },
                  "maximum": {
                    "type": "number"
                  },
                  "minimum": {
                    "type": "number"
                  },
                  "name": {
                    "type": "string"
                  },
                  "needs_restart": {
                    "type": "boolean"
                  },
                  "nullable": {
                    "type": "boolean"
                  },
                  "related_properties": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "scope": {
