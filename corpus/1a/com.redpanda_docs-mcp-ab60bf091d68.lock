        {
          "name": "give_feedback",
          "title": "Give Feedback",
          "description": "Report a concrete problem to the Redpanda docs team: documentation that is missing, unclear, outdated, or wrong, a docs tool that returned something wrong or unhelpful, or a Redpanda product issue you ran into. Call it when you notice the problem, with enough detail to fix it, including the page URL when you know it. Do not call it to test the tool. It records the report and returns a short confirmation; it does not return documentation. Reports do not include the user's name or email: never include credentials, tokens, or personal data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "What you saw: 'documentation' (docs missing, unclear, outdated, or wrong; the default), 'docs_search' (a search or document tool on this server misbehaved), 'product' (a bug, limitation, or missing feature in Redpanda), or 'product_mcp_tool' (another Redpanda tool failed or behaved unexpectedly).",
                "enum": ["documentation", "docs_search", "product", "product_mcp_tool"],
                "type": "string"
              },
              "context": {
                "description": "What you were trying to accomplish, in general terms.",
                "type": "string"
              },
              "expected": {
                "description": "What you expected to happen or to find instead.",
                "type": "string"
              },
              "message": {
                "description": "What happened: the error, wrong result, or missing or contradictory information, with the pages, endpoints, or tools involved.",
                "type": "string"
              },
              "session_goal": {
                "description": "Optional. In one concise sentence (third person), the overall goal of this session: what the user is trying to get done, not just this call. Send the same goal on every call in the session, and update it only if the goal changes. Do not include credentials, tokens, personal data, or verbatim secrets.",
                "type": "string"
              },
              "severity": {
                "description": "'high' if you are blocked, 'medium' if you found a workaround (the default), 'low' for a minor annoyance.",
                "enum": ["high", "medium", "low"],
                "type": "string"
              },
              "title": {
                "description": "A one-line summary of the problem, for example 'Webhook docs list the wrong signature header'.",
                "type": "string"
              },
              "tool_name": {
                "description": "The exact name of the tool that failed or misbehaved, if any.",
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
