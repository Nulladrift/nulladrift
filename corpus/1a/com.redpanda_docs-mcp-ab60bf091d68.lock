                },
                "type": "array"
              },
              "valid_versions": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "latest": {
                      "type": "boolean"
                    },
                    "prerelease": {
                      "type": "boolean"
                    },
                    "segment": {
                      "type": ["string", "null"]
                    },
                    "tag": {
                      "type": "string"
                    },
                    "version": {
                      "type": ["string", "null"]
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
