        {
          "name": "get_rpk_command",
          "title": "Get rpk Command",
          "description": "Look up one rpk CLI command by its full name (for example 'rpk topic create') and return its usage, help text, flags with types and defaults, aliases, subcommands, platform and Redpanda Cloud scoping, the plugin and release it ships with, and the docs page URL. Deterministic: it reads the published rpk command tree for the requested docs version (the same data the rpk reference pages are rendered from), so a command that does not exist returns found=false with close-name suggestions instead of a guess, and no LLM or search is involved. The name may omit the leading 'rpk', use command aliases at any level ('rpk topic ls', 'rpk sr schema list'), or be the page name ('rpk-topic-create'). A deprecated command returns its deprecation note and replacement, even when it is hidden and not found. Use this before ask_redpanda_question for any question about a specific rpk command's flags, defaults, or existence in a release.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "context": {
                "description": "Optional. In one concise sentence (third person), describe what the user is trying to accomplish with this request. Do not include credentials, tokens, personal data, or verbatim secrets.",
                "type": "string"
              },
              "name": {
                "description": "Full command name, e.g. 'rpk topic create' or 'rpk cluster health'.",
                "minLength": 1,
                "type": "string"
              },
              "session_goal": {
                "description": "Optional. In one concise sentence (third person), the overall goal of this session: what the user is trying to get done, not just this call. Send the same goal on every call in the session, and update it only if the goal changes. Do not include credentials, tokens, personal data, or verbatim secrets.",
                "type": "string"
              },
              "version": {
                "description": "Docs version as its URL spells it ('26.1'), 'current' for the latest release, or a Redpanda release tag ('v26.2.2'). Omit for the latest release. An unknown value returns found=false with the list of published versions.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "command": {
                "additionalProperties": true,
                "properties": {
                  "aliases": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "cloud_only": {
                    "type": "boolean"
                  },
                  "deprecated": {
                    "type": "boolean"
                  },
                  "deprecation": {
                    "additionalProperties": true,
                    "description": "Set when the command is deprecated and the release says what to use instead.",
                    "properties": {
                      "command": {
                        "description": "The deprecated_commands entry the note comes from: the command itself or its nearest deprecated parent.",
                        "type": "string"
                      },
                      "message": {
                        "description": "rpk's own deprecation message.",
                        "type": "string"
                      },
                      "replacement": {
                        "description": "What to use instead, with docs links as Markdown.",
                        "type": "string"
                      }
                    },
                    "required": ["command"],
                    "type": "object"
                  },
                  "description": {
                    "description": "The full help text as published, with docs links as Markdown.",
                    "type": "string"
                  },
                  "docs_url": {
                    "description": "Absent when the command has no reference page (hidden or Cloud-only families on Self-Managed docs).",
                    "type": "string"
                  },
                  "flags": {
                    "items": {
                      "additionalProperties": true,
                      "properties": {
                        "default": {},
                        "deprecated": {
                          "type": "boolean"
                        },
                        "description": {
                          "type": "string"
                        },
                        "introduced_in": {
                          "type": "string"
                        },
                        "name": {
                          "description": "Long form, e.g. '--partitions'.",
                          "type": "string"
                        },
                        "required": {
                          "type": "boolean"
                        },
                        "shorthand": {
                          "description": "Short form, e.g. '-p'.",
                          "type": "string"
                        },
                        "type": {
                          "type": "string"
                        }
                      },
                      "required": ["name"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "global_flags": {
                    "description": "Only on the root 'rpk' command.",
                    "items": {
                      "$ref": "#/properties/command/properties/flags/items"
                    },
                    "type": "array"
                  },
                  "introduced_in": {
                    "type": "string"
                  },
                  "name": {
                    "description": "Full command name, e.g. 'rpk topic create'.",
                    "type": "string"
                  },
                  "parent": {
                    "additionalProperties": true,
                    "properties": {
                      "docs_url": {
                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      },
                      "summary": {
                        "type": "string"
                      }
                    },
                    "required": ["name"],
                    "type": "object"
                  },
                  "platforms": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "plugin": {
                    "additionalProperties": true,
                    "description": "Set when the command comes from an rpk plugin.",
                    "properties": {
                      "name": {
                        "type": "string"
                      },
                      "version": {
                        "type": "string"
