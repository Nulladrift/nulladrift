        {
          "name": "ask_redpanda_question",
          "title": "Search Redpanda Sources",
          "description": "Search the official Redpanda documentation and return the most relevant sections from it for a user query. Each returned section includes the url and its actual content in markdown. Use this tool for all queries that require Redpanda knowledge. Results are ordered by relevance, with the most relevant result returned first. If you know the user's deployment platform, pass \"platform\" so results from the other platform's docs are excluded. Note that \"platform\" filters the sections already retrieved rather than re-running the search, so it can return substantially fewer sections: on a broker-level question where most matches come from the other platform's docs, it can cut a 15-section response to 1 or 2. Omit \"platform\" if you would rather have more context and judge platform relevance yourself from each section's url. If you know which Redpanda version the user runs, pass \"version\" (use 'current' for the latest release; its release number is also accepted). Unlike \"platform\", \"version\" is applied during retrieval, so it does not shrink the result set: it stops the same page being returned once per indexed version, which is otherwise most of the response. Version-neutral docs (Cloud, Connect, Agentic Data Plane, API reference) are always included. Omitting \"version\" searches the latest release.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "context": {
                "description": "Optional. In one concise sentence (third person), describe what the user is trying to accomplish with this request. Do not include credentials, tokens, personal data, or verbatim secrets.",
                "type": "string"
              },
              "platform": {
                "description": "The user's deployment platform. 'cloud' excludes Self-Managed sections; 'self-managed' excludes Redpanda Cloud sections. Platform-neutral docs (Connect, API reference, labs) are always kept. Applied after retrieval, so it shrinks the result set rather than finding more of the right platform's pages. Omit to search all docs.",
                "enum": ["cloud", "self-managed"],
                "type": "string"
              },
              "query": {
                "description": "Alias for \"question\", for clients that use that name. Prefer \"question\".",
                "type": "string"
              },
              "question": {
                "description": "The question to search the docs for. Required.",
                "type": "string"
              },
              "session_goal": {
                "description": "Optional. In one concise sentence (third person), the overall goal of this session: what the user is trying to get done, not just this call. Send the same goal on every call in the session, and update it only if the goal changes. Do not include credentials, tokens, personal data, or verbatim secrets.",
                "type": "string"
              },
              "top_k": {
                "description": "Maximum number of sections to return, applied after platform filtering. Must be a positive integer.",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "version": {
                "description": "Docs version to search, written as the docs URLs spell it (23.3, 24.1, 24.2, 24.3, 25.1, 25.2, 25.3, 26.1, current). Use 'current' for the latest release; a release number newer than every listed one is also read as the latest release. Applied at retrieval, so unlike \"platform\" it does not shrink the result set: every section returned is from this version, plus version-neutral docs (Cloud, Connect, Agentic Data Plane, API reference), which are always included. Omit to search the latest release. Any other value is rejected with the list of valid versions.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3ea5c2ac9ed2c56ca7e63fa1261a5c66e24cf98611f6c97c08be9ad83ce02b8a"
        },
        {
          "name": "get_api_reference_content",
          "title": "Get API Reference Content",
          "description": "Retrieve full content of API reference pages by URL. Returns complete endpoint details including parameters, request/response schemas, and examples.\n\nUse this after finding pages via list_api_reference_pages or search_api_reference. Pass the URLs from those results directly.\n\nReturns up to 10 pages per request. URLs must be from docs.redpanda.com/api/doc/*.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "context": {
                "description": "Optional. In one concise sentence (third person), describe what the user is trying to accomplish with this request. Do not include credentials, tokens, personal data, or verbatim secrets.",
                "type": "string"
              },
              "session_goal": {
                "description": "Optional. In one concise sentence (third person), the overall goal of this session: what the user is trying to get done, not just this call. Send the same goal on every call in the session, and update it only if the goal changes. Do not include credentials, tokens, personal data, or verbatim secrets.",
                "type": "string"
              },
              "urls": {
                "description": "Page URLs to retrieve (max 10). Use URLs from list_api_reference_pages or search_api_reference results.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "required": ["urls"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fad4527b7a4329cee9cd503a570a0e2882b1183683fa4725efdbdbe8397a6daf"
        },
        {
          "name": "get_config_property",
          "title": "Get Config Property",
          "description": "Look up one Redpanda configuration property (cluster, broker, or topic) by exact name and return its documented type, default, description, restart and enterprise flags, Redpanda Cloud availability, related properties, and docs URL. Deterministic: it reads the generated property dataset for the requested docs version, so a property that does not exist returns found=false with close-name suggestions instead of a guess, and no LLM or search is involved. Use this before ask_redpanda_question for any question about a specific property's default, type, or availability. Pass platform='cloud' to learn whether the property is supported or editable in Redpanda Cloud.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "context": {
                "description": "Optional. In one concise sentence (third person), describe what the user is trying to accomplish with this request. Do not include credentials, tokens, personal data, or verbatim secrets.",
                "type": "string"
              },
              "name": {
                "description": "Exact property name, e.g. 'log_segment_size' or 'cleanup.policy'. Aliases are accepted.",
                "minLength": 1,
                "type": "string"
              },
              "platform": {
                "description": "'cloud' answers for Redpanda Cloud (Cloud availability, the Cloud docs page); 'self-managed' (the default) answers for Self-Managed Redpanda.",
                "enum": ["self-managed", "cloud"],
                "type": "string"
              },
              "session_goal": {
                "description": "Optional. In one concise sentence (third person), the overall goal of this session: what the user is trying to get done, not just this call. Send the same goal on every call in the session, and update it only if the goal changes. Do not include credentials, tokens, personal data, or verbatim secrets.",
                "type": "string"
              },
              "version": {
                "description": "Docs version as its URL spells it ('26.1'), 'current' for the latest release, or a release tag ('v26.2.4'). Omit for the latest release. An unknown value returns found=false with the list of published versions. Ignored when platform is 'cloud', which always answers from the latest release.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "dataset": {
                "additionalProperties": true,
                "properties": {
                  "latest": {
                    "type": "boolean"
                  },
                  "platform": {
                    "enum": ["self-managed", "cloud"],
                    "type": "string"
                  },
                  "tag": {
                    "description": "Release the data was generated from, e.g. 'v26.2.4'.",
                    "type": "string"
                  },
                  "url": {
                    "description": "The dataset this answer was read from.",
                    "type": "string"
                  },
                  "version": {
                    "description": "Docs version, e.g. '26.2'. Null for Cloud.",
                    "type": ["string", "null"]
                  },
                  "version_segment": {
                    "description": "URL segment, e.g. 'current' or '26.1'.",
                    "type": ["string", "null"]
                  }
                },
                "required": ["platform", "tag", "url"],
                "type": "object"
              },
              "error": {
                "description": "Set when the call was not answered: 'anonymous_quota_exhausted' or 'data_unavailable'.",
                "type": "string"
              },
              "found": {
                "description": "Absent only when `error` is set.",
                "type": "boolean"
              },
              "limit": {
                "description": "Quota refusal only.",
                "type": "number"
              },
              "matched_via": {
                "enum": ["name", "alias"],
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "note": {
                "description": "How the version or platform was interpreted, when not literally.",
                "type": "string"
              },
              "property": {
                "additionalProperties": true,
                "properties": {
                  "acceptable_values": {},
                  "aliases": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "cloud": {
                    "additionalProperties": true,
                    "properties": {
                      "byoc_only": {
                        "type": "boolean"
