        },
        {
          "name": "search_pages",
          "title": "Search Clustr pages",
          "description": "Search every public page on getclustr.ai by keyword and return the best matches with their title, URL, description, and markdown URL. Use this first to find the right page, then read it with fetch_page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "Maximum number of pages to return.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords to match against page titles, paths, and descriptions.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Clustr pages"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:24ff40187b5534751508afaceb03969bf6eb2a7e3fb5a80e9b17e2873bf09e12"
        }
