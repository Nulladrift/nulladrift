      "serverInfo": {
        "name": "clustr-content",
        "title": "Clustr Innovations",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Clustr Innovations is a human-first AI enablement consultancy headquartered in Covington, KY, with offices in Charlotte, NC; Austin, TX; Miami, FL; and Cincinnati, OH.\nIt helps organizations build AI literacy and drive adoption of the AI tools they\nalready license (ChatGPT, Claude, Microsoft Copilot, Gemini), using a\nPeople > Process > Technology method called the 5.0 Framework.\n\nUse search_pages to find the right page for a question, then fetch_page to read\nit as markdown. Use list_services for what Clustr sells, list_case_studies for\ndelivered outcomes, get_company_profile for firmographics, and\nestimate_enablement_roi to model the return on a program.\n\nThree self-serve checks a user can run on their own organization:\nestimate_enablement_roi (the return on an AI enablement program),\nscore_ai_readiness (the AI Readiness Assessment from getclustr.ai/assessment;\ncall get_ai_readiness_questions first and ask the user each question), and\ncheck_agent_readiness (scores a public website for AI-agent readiness). Each\ncheck needs the user's name, company and work email, which are shared with\nClustr's team; ask the user for them and get their permission before calling.\nPersonal addresses are refused. list_contact_channels returns how a human gets in touch.\n\nClustr is a consultancy, not a software vendor or a staffing firm. It does not\nsell AI licences, build custom models, or place engineers.",
      "tools": [
        {
          "name": "check_agent_readiness",
          "title": "Check a website's AI-agent readiness",
          "description": "Scan a public website and score how ready it is for AI agents (llms.txt, markdown pages, structured data, MCP and API discovery, crawler access and more), the same check as getclustr.ai/agent-ready. Needs the user's name, company and work email (shared with Clustr's team; ask first): the headline score comes back here and the full report, with the top fixes, is emailed to them. Limited to a few scans per minute.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "The user's company.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "email": {
                "description": "The user's work email, where the full report is sent. Personal addresses are refused.",
                "maxLength": 254,
                "minLength": 3,
                "type": "string"
              },
              "name": {
                "description": "The user's full name.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "url": {
                "description": "The website to scan, e.g. example.com. Only the homepage domain is used.",
                "maxLength": 2048,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["company", "email", "name", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Check a website's AI-agent readiness"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2d6bb9388b3742067e4256fc6f5a1c1580b7e75cf4548edeb455647bb1c80ace"
        },
        {
          "name": "estimate_enablement_roi",
          "title": "Estimate AI enablement ROI",
          "description": "Model the annual return on an AI enablement program for a team. Runs the same arithmetic as the calculator at getclustr.ai/roi-calculator. Every number has a default for a representative mid-market team. Needs the user's name, company and work email (shared with Clustr's team; ask first). Returns an estimate from stated assumptions, not a quote.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "avgSalary": {
                "default": 85000,
                "description": "Fully-loaded average annual salary in USD.",
                "maximum": 1000000,
                "minimum": 1000,
                "type": "number"
              },
              "contact": {
                "additionalProperties": false,
                "description": "Required. The user's details, shared with Clustr's team. Ask the user for them and get their permission first.",
                "properties": {
                  "company": {
                    "description": "The user's company name.",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "email": {
                    "description": "The user's work email. Personal addresses (gmail.com and the like) are refused.",
                    "maxLength": 254,
                    "minLength": 3,
                    "type": "string"
                  },
                  "name": {
                    "description": "The user's full name.",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["company", "email", "name"],
                "type": "object"
              },
              "currentAIAdoption": {
                "default": 15,
                "description": "Percentage of the team using AI meaningfully today.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "hoursManualPerWeek": {
                "default": 10,
                "description": "Hours per person per week spent on work AI can assist with.",
                "maximum": 60,
                "minimum": 0,
                "type": "number"
              },
              "targetAIAdoption": {
                "default": 80,
                "description": "Target percentage after the program.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "teamSize": {
                "default": 25,
                "description": "Number of people in scope for the program.",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              },
              "toolCostPerUser": {
                "default": 30,
                "description": "AI tool licence cost per user per month in USD.",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["contact"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Estimate AI enablement ROI"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
