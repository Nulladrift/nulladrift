        {
          "name": "list_case_studies",
          "title": "List delivered engagements",
          "description": "List Clustr's published client engagements with the outcome of each. Optionally filter by a tag such as 'Sales Enablement', 'Higher Education', or 'Commercial Real Estate'. Some clients are anonymized by industry; the 'named' field says which.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
