          },
          "digest": "sha256:d8f6c8586c46b682aaf3f8c0f70dc2c2f41d90301e528e214cfdcc9b83f9862c"
        },
        {
          "name": "fetch_page",
          "title": "Fetch a page as markdown",
          "description": "Retrieve the full text of any public getclustr.ai page as clean markdown, without HTML markup. Pass a path such as '/ai-enablement', '/case-studies', or '/blog/why-ai-initiatives-fail'. Use '/' for the homepage.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "path": {
                "description": "Page path, for example '/framework' or 'blog/what-is-mcp'. '/' is the homepage.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
