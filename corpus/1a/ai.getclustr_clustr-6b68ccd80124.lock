        {
          "name": "score_ai_readiness",
          "title": "Score AI readiness",
          "description": "Score an organization's AI readiness from its answers to the AI Readiness Assessment (get the questions from get_ai_readiness_questions). Returns a 0-100 score, the Clustr 5.0 level (Awareness, Literacy, Application, Integration, Transformation), a summary and recommendations, using the same scoring as getclustr.ai/assessment. Needs the user's name, company and work email: a copy of the results is emailed to them and shared with Clustr's team, so ask first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answers": {
                "additionalProperties": false,
                "properties": {
                  "aiAdoptionLevel": {
                    "enum": ["Not using AI at all", "A few individuals experimenting", "Some teams using AI tools", "Broad usage but inconsistent", "AI embedded in daily workflows"],
                    "type": "string"
                  },
                  "aiSponsorship": {
                    "enum": ["No one is driving AI yet", "Individual employees, informally", "A few team leads", "An executive sponsor", "A dedicated AI lead or team"],
                    "type": "string"
                  },
                  "aiToolsInUse": {
                    "description": "Every AI tool in use. Pass [\"None yet\"] or [] when there are none.",
                    "items": {
                      "enum": ["Microsoft Copilot", "ChatGPT", "Claude", "Gemini", "Other AI tools", "None yet"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "biggestAIChallenge": {
                    "enum": ["Teams don't know how to use the tools", "Adoption is inconsistent", "No governance or guardrails", "We can't measure the impact", "Leadership isn't aligned", "Something else"],
                    "type": "string"
                  },
                  "budget": {
                    "enum": ["No budget allocated", "Exploring, nothing committed", "Small pilot budget", "Dedicated annual budget", "Significant multi-year investment"],
                    "type": "string"
                  },
                  "companySize": {
                    "enum": ["1-49", "50-200", "201-500", "501-2,000", "2,000+"],
                    "type": "string"
                  },
                  "dataReadiness": {
                    "description": "Our data is accessible and trustworthy enough for AI to use.",
                    "enum": ["Strongly disagree", "Disagree", "Neutral", "Agree", "Strongly agree"],
                    "type": "string"
                  },
                  "governance": {
                    "description": "We have clear, enforced policies for what data can go into AI tools.",
                    "enum": ["Strongly disagree", "Disagree", "Neutral", "Agree", "Strongly agree"],
                    "type": "string"
                  },
                  "industry": {
                    "enum": ["Professional services", "Financial services", "Technology", "Manufacturing", "Real estate", "Healthcare", "Education", "Other"],
                    "type": "string"
                  },
                  "leadershipStrategy": {
                    "description": "Our leadership has a clear, funded AI strategy.",
                    "enum": ["Strongly disagree", "Disagree", "Neutral", "Agree", "Strongly agree"],
                    "type": "string"
                  },
                  "measurement": {
                    "description": "We measure the business impact of our AI usage.",
                    "enum": ["Strongly disagree", "Disagree", "Neutral", "Agree", "Strongly agree"],
                    "type": "string"
                  },
                  "previousAITraining": {
                    "enum": ["None yet", "Informal self-teaching", "One-off workshops", "Structured, role-based program"],
                    "type": "string"
                  },
                  "respondentScope": {
                    "enum": ["Just myself", "My team", "The whole organization"],
                    "type": "string"
                  },
                  "timeline": {
                    "enum": ["Immediately", "Next 1-3 months", "Next 3-6 months", "Next 6-12 months", "Exploring options"],
                    "type": "string"
                  },
                  "useCaseClarity": {
                    "enum": ["None identified yet", "A few ideas", "A prioritized list", "Already piloting use cases"],
                    "type": "string"
                  },
                  "workforceSentiment": {
                    "enum": ["Anxious or resistant", "Curious but cautious", "Mostly positive", "Actively pushing for it"],
                    "type": "string"
                  }
                },
                "required": ["aiAdoptionLevel", "aiSponsorship", "aiToolsInUse", "budget", "dataReadiness", "governance", "leadershipStrategy", "measurement", "previousAITraining", "useCaseClarity", "workforceSentiment"],
                "type": "object"
              },
              "contact": {
                "additionalProperties": false,
                "description": "Required. The user's details, shared with Clustr's team. Ask the user for them and get their permission first.",
                "properties": {
                  "company": {
                    "description": "The user's company name.",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "email": {
                    "description": "The user's work email. Personal addresses (gmail.com and the like) are refused.",
                    "maxLength": 254,
                    "minLength": 3,
                    "type": "string"
                  },
                  "name": {
                    "description": "The user's full name.",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["company", "email", "name"],
                "type": "object"
              }
            },
            "required": ["answers", "contact"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Score AI readiness"
