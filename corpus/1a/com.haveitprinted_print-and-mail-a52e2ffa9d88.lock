            "readOnly": false
          },
          "digest": "sha256:b584f2cc3e978a3b870902fd7ac661afb40631c7a12ae9785514c1085e34fd19"
        },
        {
          "name": "hip_set_letter",
          "title": "Write a letter in a handwriting-style font",
          "description": "Use this for a letter in a handwriting-style font; for a typeset document use hip_add_text_document, and for a file the person has use hip_get_upload_target. Needs a job_handle from hip_create_job (a new job, no documents) and choices from hip_get_catalog. Write a letter on a job from hip_create_job, printed in a handwriting-style font, optionally on a stationery design: the letter type, the font, the message, the greeting and sign-off, the name it is signed with, and how it is mailed (flat and tracked, a First-Class letter of up to 5 pages, or a Certified letter). Have It Printed checks it as its website does (fit, names, the design's own words), counts the pages, and returns the price and a preview picture of page 1. This only edits the job's draft before checkout: calling it again updates this draft (the previous draft text is not kept), the person sees and approves the letter before paying, and nothing is printed, mailed or charged until the person pays on haveitprinted.com. Never include an address: the person enters the mailing address at checkout. Then call hip_create_checkout: the person pays on haveitprinted.com.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "color": {
                "description": "print in color (default false: one ink)",
                "type": "boolean"
              },
              "fields": {
                "additionalProperties": {
