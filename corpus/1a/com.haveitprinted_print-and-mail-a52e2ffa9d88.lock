            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:4b5231d8639794e6cd81c5457f496359277f758aad59671b3cf750c3b9e79271"
        },
        {
          "name": "hip_set_postcard",
          "title": "Write a postcard",
          "description": "Write a postcard on a job from hip_create_job: its size, its front (a front from hip_get_catalog), the message on the back in a handwriting-style font, and the name it is signed with. Have It Printed checks that the message fits the card and follows the card guidelines, and returns the price and preview pictures of both sides. This only edits the job's draft before checkout: calling it again updates this draft (the previous draft text is not kept), the person sees and approves the card before paying, and nothing is printed, mailed or charged until the person pays on haveitprinted.com. Postcards are printed in full color and mailed First-Class with no tracking. Never put a mailing address on the card or in this call: the person enters it at checkout.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "font": {
                "description": "a font from hip_get_catalog (default: the first)",
                "maxLength": 40,
                "type": "string"
              },
              "front": {
                "description": "a front id from hip_get_catalog (design:..., or card:... when listed)",
                "maxLength": 80,
                "type": "string"
              },
              "front_fields": {
                "additionalProperties": {
                  "type": ["string", "integer"]
                },
                "description": "only for a front design that lists fields: the words it shows",
                "type": "object"
              },
              "job_handle": {
                "type": "string"
              },
              "message": {
                "description": "the message on the back, as it should read",
                "maxLength": 4000,
                "type": "string"
              },
              "sender_name": {
                "description": "the name the card is signed with",
                "maxLength": 80,
                "type": "string"
              },
              "size": {
                "description": "the card's size in inches",
                "enum": ["4x6", "6x9", "6x11"],
                "type": "string"
              }
            },
            "required": ["front", "job_handle", "message", "size"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
