          "title": "Letter and postcard options",
          "description": "The options for a postcard or a letter written here: the handwriting-style fonts, the letter types, the stationery designs (with a preview picture each), the postcard sizes and fronts, and the mailing options. Read it before hip_set_postcard or hip_set_letter, and offer the person choices from it; never invent a font, design or front. Needs no job and changes nothing. Returns the options as structured fields.",
