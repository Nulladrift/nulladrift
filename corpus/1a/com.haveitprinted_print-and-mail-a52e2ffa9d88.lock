        {
          "name": "hip_prepare_payment",
          "title": "Prepare the exact payable total",
          "description": "Resolve the EXACT amount HIP will charge, before any payment authorization is obtained or spent. This does NOT charge anything. Returns subtotal_cents, tax_cents, total_cents, currency, a pricing fingerprint and the authorization types HIP accepts. Tax is calculated by Stripe from the destination, so hip_quote alone is not the payable amount. The returned total is bound to this job's documents, options and recipient: change any of them and payment is refused with QUOTE_STALE until you prepare again. Use this when paying autonomously with a delegated payment authorization; a human paying in a browser does not need it. Commits the job to the autonomous payment rail.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address_confirmed": {
                "description": "optional, no longer needed: accepted for compatibility and ignored.",
                "type": "boolean"
              },
              "buyer_email": {
                "description": "optional: the buyer's email address. Have It Printed sends its order confirmation there once the payment succeeds.",
                "type": "string"
              },
              "job_handle": {
                "type": "string"
              }
            },
            "required": ["job_handle"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Prepare the exact payable total"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:f0e054456a7a4dc1a249629815d1351068c761a8d2c6dce65e3bb090862fbb26"
        },
