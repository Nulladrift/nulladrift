        },
        {
          "name": "hip_set_letter",
          "title": "Write a letter in a handwriting-style font",
          "description": "Write a letter on a job from hip_create_job, printed in a handwriting-style font, optionally on a stationery design: the letter type, the font, the message, the greeting and sign-off, the name it is signed with, and how it is mailed (flat and tracked, a First-Class letter of up to 5 pages, or a Certified letter). Have It Printed checks it as its website does (fit, names, the design's own words), counts the pages, and returns the price and a preview picture of page 1. This only edits the job's draft before checkout: calling it again updates this draft (the previous draft text is not kept), the person sees and approves the letter before paying, and nothing is printed, mailed or charged until the person pays on haveitprinted.com. Never include an address: the person enters the mailing address at checkout.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "color": {
                "description": "print in color (default false: one ink)",
                "type": "boolean"
              },
              "fields": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "optional: a stationery design's or a card-style letter type's own words, by the keys hip_get_catalog lists (never an address)",
                "type": "object"
              },
              "font": {
                "description": "a font from hip_get_catalog",
                "maxLength": 40,
                "type": "string"
              },
              "greeting": {
                "description": "optional: the opening word, e.g. Dear",
                "maxLength": 60,
                "type": "string"
              },
              "greeting_name": {
                "description": "optional: the name in the greeting, e.g. Mom (not an address)",
                "maxLength": 80,
                "type": "string"
              },
              "job_handle": {
                "type": "string"
              },
              "letter_type": {
                "description": "a letter type from hip_get_catalog (default: a plain letter)",
                "maxLength": 40,
                "type": "string"
              },
              "mailing": {
                "description": "tracked_document (default): flat in a rigid mailer with a tracking number. basic_letter: folded, First-Class, no tracking, up to 5 pages. certified_letter: the same by Certified Mail, with tracking",
                "enum": ["tracked_document", "basic_letter", "certified_letter"],
                "type": "string"
              },
              "message": {
                "description": "the body of the letter, as it should read; separate paragraphs with a blank line. The greeting and sign-off are printed from greeting/greeting_name/signoff",
                "maxLength": 60000,
                "type": "string"
              },
              "sender_name": {
                "description": "the name the letter is signed with",
                "maxLength": 80,
                "type": "string"
              },
              "signoff": {
                "description": "optional: e.g. With love,",
                "maxLength": 60,
                "type": "string"
              },
              "stationery": {
                "description": "optional: a stationery design from hip_get_catalog for this letter type",
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["job_handle", "message"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Write a letter in a handwriting-style font"
          },
          "behavior": {
            "destructive": false,
