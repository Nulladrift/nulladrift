        },
        {
          "name": "hip_get_upload_target",
          "title": "Get a document upload link",
          "description": "Get a short-lived upload URL for a file the person already has (a PDF, Word file or image). Use this for an existing file; use hip_add_text_document for text you wrote with the person, or hip_set_letter for a letter in a handwriting-style font. Needs a job_handle from hip_create_job. Returns upload_url and required_headers: PUT the file's exact bytes there, then list it in hip_update_job's files. Send file_size, the file's exact size in bytes: the URL is signed for that size. File type and size limits are the same as the website.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "content_type": {
                "description": "optional: the file's MIME type, e.g. application/pdf. The upload URL is signed for it, so the PUT must send this exact Content-Type header (the result's required_headers). Left out, or not a plain type/subtype: application/octet-stream.",
                "examples": ["application/pdf"],
                "type": "string"
              },
              "file_size": {
                "description": "the file's exact size in bytes; the PUT must send exactly this many",
                "maximum": 104857600,
                "minimum": 1,
                "type": "integer"
              },
              "filename": {
                "description": "the document's file name with its extension, e.g. lease.pdf. The extension decides how it is read: PDF, Word (.doc or .docx), text, RTF, ODT, or an image (JPG, PNG, TIFF, BMP, GIF or WebP). Use the same filename in hip_update_job's files.",
                "examples": ["lease.pdf"],
                "type": "string"
              },
              "job_handle": {
                "description": "the job_handle that hip_create_job returned (job_ followed by 32 hex characters). Only the API key that created the job can use it.",
                "examples": ["job_0123456789abcdef0123456789abcdef"],
                "pattern": "^job_[0-9a-f]{32}$",
                "type": "string"
              }
            },
            "required": ["file_size", "filename", "job_handle"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Get a document upload link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:871071775f9b7976ff6414daab1c564570353ee61241516298b748d07be8afb2"
        },
        {
          "name": "hip_prepare_payment",
          "title": "Prepare the exact payable total",
          "description": "Step 1 of paying on your own, with no person at a checkout page: call it after hip_quote and before hip_complete_payment. Resolve the EXACT amount HIP will charge, before any payment authorization is obtained or spent. This does NOT charge anything. Returns subtotal_cents, tax_cents, total_cents, currency, a pricing fingerprint and the authorization types HIP accepts. Tax is calculated by Stripe from the destination, so hip_quote alone is not the payable amount. The returned total is bound to this job's documents, options and recipient: change any of them and payment is refused with QUOTE_STALE until you prepare again. Use this when paying autonomously with a delegated payment authorization; a human paying in a browser does not need it. Commits the job to the autonomous payment rail.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address_confirmed": {
                "description": "optional, no longer needed: accepted for compatibility and ignored.",
                "type": "boolean"
              },
              "buyer_email": {
                "description": "optional: the buyer's email address. Have It Printed sends its order confirmation there once the payment succeeds.",
                "format": "email",
                "type": "string"
              },
              "job_handle": {
                "description": "the job_handle that hip_create_job returned (job_ followed by 32 hex characters). Only the API key that created the job can use it.",
                "examples": ["job_0123456789abcdef0123456789abcdef"],
                "pattern": "^job_[0-9a-f]{32}$",
                "type": "string"
              }
            },
            "required": ["job_handle"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Prepare the exact payable total"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:6465a80c9c2876ce5f789005ccbc333fedeefc2edc76105cbbe8445f85bc7b16"
        },
        {
          "name": "hip_quote",
          "title": "Get the price",
          "description": "The exact price for the job, from Have It Printed's own page count and the same pricing the website checkout uses. Call it after the documents and mailing option are set and before hip_create_checkout, and show the person the total; it stores this quote, and the checkout is bound to it. Tax, if any, is added by Stripe at payment: to pay on your own, get the payable total with hip_prepare_payment instead. Returns total, total_pages and line_items.",
          "inputSchema": {
