        {
          "name": "hip_update_job",
          "title": "Set documents and recipient",
          "description": "Set what a document job holds and how it is mailed: the documents uploaded with hip_get_upload_target (files replaces the whole list, so keep any added with hip_add_text_document), copies and color, the mailing option (product), the US recipient and options such as a return address. Use it after hip_create_job and the uploads; a letter or postcard written with hip_set_letter or hip_set_postcard carries its own options and takes no hip_update_job. Price fields are rejected: the server computes all amounts. Returns the updated job; call hip_quote next.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "files": {
                "description": "the job's full list of documents, each uploaded first with hip_get_upload_target. It replaces the list already on the job; list each document once.",
                "items": {
                  "additionalProperties": false,
                  "description": "one document on the job",
                  "properties": {
                    "color": {
                      "description": "bw: black & white (the default); color: full color",
                      "enum": ["bw", "color"],
                      "type": "string"
                    },
                    "filename": {
                      "description": "the filename given to hip_get_upload_target",
                      "type": "string"
                    },
                    "pages": {
                      "description": "your page count for this document. The price uses Have It Printed's own count of the uploaded file.",
                      "minimum": 1,
                      "type": "integer"
                    },
                    "quantity": {
                      "description": "copies of this document (default 1)",
                      "minimum": 1,
                      "type": "integer"
                    },
                    "size": {
                      "description": "paper size: US Letter (8.5x11) only; may be left out",
                      "enum": ["8.5x11"],
                      "type": "string"
                    }
                  },
                  "required": ["filename", "pages"],
                  "type": "object"
                },
                "type": "array"
              },
              "job_handle": {
                "description": "the job_handle that hip_create_job returned (job_ followed by 32 hex characters). Only the API key that created the job can use it.",
                "examples": ["job_0123456789abcdef0123456789abcdef"],
                "pattern": "^job_[0-9a-f]{32}$",
                "type": "string"
              },
              "options": {
                "additionalProperties": true,
                "description": "optional job settings. product: how the job is mailed (the same as the product field). return_address: the US return address printed on the envelope, with name or company, line1, line2, city, state and zip; leave it out to use Have It Printed care of the buyer.",
                "properties": {
                  "product": {
                    "description": "how the job is mailed; the product field does the same",
                    "enum": ["tracked_document", "basic_letter", "certified_letter"],
                    "type": "string"
                  },
                  "return_address": {
                    "additionalProperties": true,
                    "description": "optional: the envelope's US return address: name or company, line1, line2, city, state (2 letters) and zip",
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "product": {
                "description": "how the job is mailed. tracked_document (the default): printed and mailed flat in a rigid mailer with a free tracking number. basic_letter: up to 5 pages, one copy of each document, folded into a standard envelope and mailed First-Class, with no tracking. certified_letter: the same letter sent by Certified Mail, with a tracking number. hip_get_service_info has the prices.",
                "enum": ["tracked_document", "basic_letter", "certified_letter"],
                "type": "string"
              },
              "recipient": {
                "description": "US mailing address",
