          "description": "Whether the person has paid at the checkout link yet. Use it after hip_create_checkout, while waiting for payment; once paid is true, use hip_get_order for printing, shipping and tracking. Payment truth comes from the order record Stripe's webhook creates, never from a browser redirect. Returns paid, state and order_status, plus order_id once paid.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_handle": {
                "description": "the job_handle that hip_create_job returned (job_ followed by 32 hex characters). Only the API key that created the job can use it.",
                "examples": ["job_0123456789abcdef0123456789abcdef"],
                "pattern": "^job_[0-9a-f]{32}$",
                "type": "string"
              }
            },
            "required": ["job_handle"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Check payment status"
          },
          "behavior": {
            "destructive": false,
