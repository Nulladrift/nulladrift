      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "haveitprinted",
        "title": "Have It Printed",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Print a document and mail it to a US address. Get a Bearer API key with POST https://agents.haveitprinted.com/v1/onboard {\"email\": \"...\"}. Then call hip_create_job, hip_get_upload_target (PUT the file to upload_url), hip_update_job (files and recipient) and hip_quote. To pay, either call hip_create_checkout and send a person to checkout_url, or call hip_prepare_payment and then hip_complete_payment with a Stripe shared payment token (spt_...) whose maximum covers the prepared total. Poll hip_get_checkout_status until paid, then call hip_get_order for status and tracking.",
      "tools": [
        {
          "name": "hip_add_text_document",
          "title": "Add a written document",
          "description": "Typeset text you wrote with the person into a printed document (for a letter in a handwriting-style font, use hip_set_letter; for a file the person already has, use hip_get_upload_target). Needs a job_handle from hip_create_job. Add a letter or document whose text you wrote with the person. Have It Printed typesets it on US Letter paper in a clean serif font, in black and white, and counts its pages. Plain text only: separate paragraphs with a blank line; no images, tables or formatting. Call once per document. Returns the added document and its page count; next choose how it is mailed (hip_update_job) or get the price (hip_quote).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "copies": {
                "description": "copies (default 1)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "job_handle": {
                "description": "the job_handle that hip_create_job returned (job_ followed by 32 hex characters). Only the API key that created the job can use it.",
                "examples": ["job_0123456789abcdef0123456789abcdef"],
                "pattern": "^job_[0-9a-f]{32}$",
                "type": "string"
              },
              "text": {
                "description": "the full text to print, exactly as it should read",
                "maxLength": 60000,
                "type": "string"
              },
              "title": {
                "description": "a short name for the document; it names the file and is not printed",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["job_handle", "text", "title"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add a written document"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d8b6e3ca65505593183215c77ff3a8756a0764149c826366e2c200db01338025"
        },
        {
          "name": "hip_complete_payment",
          "title": "Pay and send to print",
          "description": "Step 2 of paying on your own: call it right after hip_prepare_payment. Pay for the job with a delegated payment authorization, with no browser and no human step. payment_authorization must be a Stripe shared payment token (spt_...) granted to Have It Printed whose maximum is at least the total from hip_prepare_payment; HIP charges exactly that total and never more. NEVER send a card number, expiry, CVV or any reusable credential to this tool. If the cardholder's bank requires authentication, this returns payment_status=requires_user_action rather than bypassing it. Then use hip_get_order for printing, shipping and tracking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_handle": {
                "description": "the job_handle that hip_create_job returned (job_ followed by 32 hex characters). Only the API key that created the job can use it.",
                "examples": ["job_0123456789abcdef0123456789abcdef"],
                "pattern": "^job_[0-9a-f]{32}$",
                "type": "string"
              },
              "payment_authorization": {
                "description": "opaque delegated payment token (spt_...)",
                "type": "string"
              },
              "tos_accepted": {
                "description": "true only when the person paying has agreed to the Terms of Service (https://haveitprinted.com/terms.html) and content policy (https://haveitprinted.com/content-policy.html). Recorded on the order.",
                "type": "boolean"
              }
            },
            "required": ["job_handle", "payment_authorization"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Pay and send to print"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d501c017c3cb9923462dae4b9a9158b15ce476a508d5e1dbf5b16ef4d0edf36f"
        },
        {
          "name": "hip_create_checkout",
          "title": "Create a checkout link",
          "description": "Create a Stripe Checkout link for the job so the person pays on haveitprinted.com. This does NOT take payment: the person completes payment at checkout_url. Call it after hip_quote (show them the quote first); to pay with no person, use hip_prepare_payment and hip_complete_payment (when listed) instead. Returns checkout_url; then follow payment with hip_get_checkout_status.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "customer_email": {
                "description": "for the receipt and tracking email",
                "format": "email",
                "type": "string"
              },
              "job_handle": {
                "description": "the job_handle that hip_create_job returned (job_ followed by 32 hex characters). Only the API key that created the job can use it.",
                "examples": ["job_0123456789abcdef0123456789abcdef"],
                "pattern": "^job_[0-9a-f]{32}$",
                "type": "string"
              }
            },
            "required": ["job_handle"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a checkout link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e39c1880a25c8e64090875c9db2273e0ee3a6c89418653706c262449715c2f5f"
        },
