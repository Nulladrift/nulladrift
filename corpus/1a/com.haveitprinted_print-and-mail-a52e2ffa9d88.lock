        },
        {
          "name": "hip_update_job",
          "title": "Set documents and recipient",
          "description": "Set the documents, print options and US mailing recipient on a job. Price fields are rejected: the server computes all amounts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "files": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "color": {
                      "enum": ["bw", "color"],
                      "type": "string"
                    },
                    "filename": {
                      "type": "string"
                    },
                    "pages": {
                      "minimum": 1,
                      "type": "integer"
                    },
                    "quantity": {
                      "minimum": 1,
                      "type": "integer"
                    },
                    "size": {
                      "enum": ["8.5x11"],
                      "type": "string"
                    }
                  },
                  "required": ["filename", "pages"],
                  "type": "object"
                },
                "type": "array"
              },
              "job_handle": {
                "type": "string"
              },
              "options": {
                "additionalProperties": true,
                "type": "object"
              },
              "product": {
                "description": "how the job is mailed. tracked_document (the default): printed and mailed flat in a rigid mailer with a free tracking number. basic_letter: up to 5 pages, one copy of each document, folded into a standard envelope and mailed First-Class, with no tracking. certified_letter: the same letter sent by Certified Mail, with a tracking number. hip_get_service_info has the prices.",
                "enum": ["tracked_document", "basic_letter", "certified_letter"],
                "type": "string"
              },
              "recipient": {
                "description": "US mailing address",
                "properties": {
                  "city": {
                    "type": "string"
                  },
                  "country": {
                    "default": "US",
                    "type": "string"
                  },
                  "line1": {
                    "type": "string"
                  },
                  "line2": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "state": {
                    "description": "2-letter US state code",
                    "type": "string"
                  },
                  "zip": {
                    "type": "string"
                  }
                },
                "required": ["city", "line1", "name", "state", "zip"],
                "type": "object"
              }
            },
            "required": ["job_handle"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Set documents and recipient"
