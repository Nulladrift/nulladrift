      "serverInfo": {
        "name": "haveitprinted",
        "title": "Have It Printed",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Print a document and mail it to a US address. Get a Bearer API key with POST https://agents.haveitprinted.com/v1/onboard {\"email\": \"...\"}. Then call hip_create_job, hip_get_upload_target (PUT the file to upload_url), hip_update_job (files and recipient) and hip_quote. To pay, either call hip_create_checkout and send a person to checkout_url, or call hip_prepare_payment and then hip_complete_payment with a Stripe shared payment token (spt_...) whose maximum covers the prepared total. Poll hip_get_checkout_status until paid, then call hip_get_order for status and tracking.",
      "tools": [
        {
          "name": "hip_add_text_document",
          "title": "Add a written document",
          "description": "Add a letter or document whose text you wrote with the person. Have It Printed typesets it on US Letter paper in a clean serif font, in black and white, and counts its pages. Plain text only: separate paragraphs with a blank line; no images, tables or formatting. Call once per document.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "copies": {
                "description": "copies (default 1)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "job_handle": {
                "type": "string"
              },
              "text": {
                "description": "the full text to print, exactly as it should read",
                "maxLength": 60000,
                "type": "string"
              },
              "title": {
                "description": "a short name for the document; it names the file and is not printed",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["job_handle", "text", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add a written document"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:112ac0703eaf093181da4f723e26f298566b4ccfb98bd9ff384152ca2802f578"
        },
        {
          "name": "hip_complete_payment",
          "title": "Pay and send to print",
          "description": "Pay for the job with a delegated payment authorization, with no browser and no human step. payment_authorization must be a Stripe shared payment token (spt_...) granted to Have It Printed whose maximum is at least the total from hip_prepare_payment; HIP charges exactly that total and never more. NEVER send a card number, expiry, CVV or any reusable credential to this tool. If the cardholder's bank requires authentication, this returns payment_status=requires_user_action rather than bypassing it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_handle": {
                "type": "string"
              },
              "payment_authorization": {
                "description": "opaque delegated payment token (spt_...)",
                "type": "string"
              },
              "tos_accepted": {
                "description": "true only when the person paying has agreed to the Terms of Service (https://haveitprinted.com/terms.html) and content policy (https://haveitprinted.com/content-policy.html). Recorded on the order.",
                "type": "boolean"
              }
            },
            "required": ["job_handle", "payment_authorization"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Pay and send to print"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:49f9ceafe137e192fc42c51d894a33d3e4e4df7be9d73ae5849bf7aee222f9f0"
        },
