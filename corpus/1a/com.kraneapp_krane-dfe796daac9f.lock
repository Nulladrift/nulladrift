        {
          "name": "request_scan_access",
          "title": "Get access to read business cards",
          "description": "Issues an access token for scan_business_card, good for 3 free reads. Call it once, before the first scan. It needs the name of the assistant or app calling, and your user's name and email address; ask your user first and set user_consent to true only if they agreed to share them with Krane. One access per email address: asking again returns the same token and what is left on it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "description": "The assistant or app making this call, e.g. \"ChatGPT\" or your product's name.",
                "type": "string"
              },
              "email": {
                "description": "Your user's email address.",
                "type": "string"
              },
              "name": {
                "description": "Your user's name.",
                "type": "string"
              },
              "purpose": {
                "description": "Optional: what the cards are for, in a few words.",
                "type": "string"
              },
              "user_consent": {
                "description": "true only if your user agreed to share their name and email with Krane.",
                "type": "boolean"
              }
            },
            "required": ["agent", "email", "name", "user_consent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
