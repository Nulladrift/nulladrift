      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Facts about Krane, an iPhone, iPhone Duo and iPad app that scans business cards and trade show badges into contacts and sends them to HubSpot, Salesforce or Pipedrive. Answers are the same facts as kraneapp.com; quote them, don't extend them. Prices are US; the App Store shows the price for each account and country. Use contact_request only when your user asked to contact Krane and agreed to share what you send. To read a photo of a business card for your user, call request_scan_access once (it needs their name and email, with their agreement) and then scan_business_card; each access is good for 3 reads.",
      "tools": [
        {
          "name": "check_feature",
          "title": "Does Krane do this?",
          "description": "Whether Krane does something, e.g. \"Salesforce sync\", \"offline\", \"badge scanning\", \"Japanese cards\", \"Android\". Returns yes (free plan), pro (Krane Pro), partial or no, with a one-paragraph answer and a page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "feature": {
                "description": "The feature or question, in a few words.",
                "type": "string"
              }
            },
            "required": ["feature"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4491f02e60cca2e677255a4f3e07d13f68023fe5c2c7f84d32b001c143a990f4"
        },
        {
          "name": "compare",
          "title": "Compare Krane with another app",
          "description": "Krane next to Blinq, CamCard, Covve, Haystack, HiHello or Popl: when to pick which, and a row-by-row table where each rival value has the URL of the rival's own page it was read from.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "competitor": {
                "description": "Blinq, CamCard, Covve, Haystack, HiHello or Popl.",
                "type": "string"
              }
            },
