        {
          "name": "contact_request",
          "title": "Ask Krane's founder",
          "description": "Emails a question to Krane's founder, who answers by email. Use only when your user asked to contact Krane and agreed to share the email address and message you send; set user_consent to true to confirm that. Send nothing your user didn't approve.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Optional: your user's company.",
                "type": "string"
              },
              "email": {
                "description": "Your user's email address, for the reply.",
                "type": "string"
              },
              "message": {
                "description": "The question, 10 to 2000 characters.",
                "type": "string"
              },
              "name": {
                "description": "Optional: your user's name.",
                "type": "string"
              },
              "user_consent": {
                "description": "true only if your user agreed to send this.",
                "type": "boolean"
              }
            },
            "required": ["email", "message", "user_consent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
