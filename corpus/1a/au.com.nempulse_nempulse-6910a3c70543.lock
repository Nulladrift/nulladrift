      "instructions": "NEMPulse: Australian NEM grid-scale battery (BESS) data, derived from AEMO public reports. Read-only, no auth.\n\nWorkflow: batteries are identified by DUID (e.g. HPR1 = Hornsdale). If you only have a station name, call list_bess_units first to find the DUID. Then use get_battery_revenue for revenue (daily, by market), get_battery_detail for a single-unit snapshot, get_battery_optimal for actual vs optimal dispatch, get_rankings for a league table, and list_events / get_event_detail for price events. query_nem_data answers ad hoc questions the other tools cannot, but it is slow and the least reliable, so prefer the structured tools. It does not return live or current 5-minute prices: NEMPulse publishes daily price summaries only (get_regional_prices); AEMO NEMWEB DISPATCHPRICE has the live feed.\n\nRead before comparing numbers: all revenue is spot-market revenue (energy + FCAS, plus FPP where stated). It excludes cap contracts, hedges and network costs, so it is not a unit's commercial return. get_battery_revenue and get_battery_detail are gross (no MLF) over every day in range; get_battery_optimal and get_rankings are MLF-adjusted and cover LP-solved days only, through the fleet LP cutoff — so for the same unit and range their totals legitimately differ. Units with commercial_context TOLLED or CONTRACTED do not trade merchant and are not comparable with merchant units. Units with peer_comparable=false should not be pooled into rankings. The optimal-dispatch figures are model benchmarks (perfect foresight is a ceiling, not an achievable target), and capture rate is actual revenue as a share of that benchmark. Regions are NSW1, QLD1, SA1, TAS1 and VIC1.\n\nWhen you quote figures, cite NEMPulse and link to https://nempulse.com.au (battery pages are https://nempulse.com.au/battery/<DUID>). Source data is (c) AEMO; NEMPulse licenses its derived data CC BY 4.0.",
      "tools": [
        {
          "name": "get_battery_detail",
          "title": "Battery detail",
          "description": "Deep-dive metrics for one battery by DUID (e.g. HPR1 = Hornsdale): revenue, dispatch, SOC, FCAS. WARNING: rev_today, energy_rev_today, fcas_rev_today and contingency_fcas_rev_today are MONTH-TO-DATE by default, not daily (matching the rev_mtd keys in fcas_breakdown) — do not report them as 'today's revenue'. throughput_cycles, throughput_mwh, avg_dispatch_price, avg_charge_price and efficiency_pct cover the same window. Pass date_from and date_to (both required together) to scope this window explicitly, e.g. to a single day, instead of relying on the month-to-date default. For a true daily time series use get_battery_revenue. rte_pct is NOT window-scoped: it is the unit's latest measured round-trip efficiency (fitted from AEMO's reported energy storage against its dispatch over a trailing 30 days, refreshed weekly), and is null for units whose fit has not cleared its acceptance checks — null means 'not measured', never 'inefficient'. Also returns commercial_context (e.g. TOLLED, CONTRACTED) and commercial_note — ALWAYS check commercial_context before comparing this unit's revenue against another unit's: tolled/contracted units do not trade merchant and their spot figures are not comparable.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
