        {
          "name": "get_rankings",
          "title": "Battery capture-rate rankings",
          "description": "League table of merchant NEM batteries over a date range, ranked by capture rate by default (actual revenue as a share of the forecast-informed benchmark; capture_perfect_pct is the share of the perfect-foresight ceiling). Each row has rank, duid, station, region, capacity, duration_band, capture_fc_pct, capture_perfect_pct, rev_per_mw_day, rev_per_mwh_day, total_rev, cycles_per_day and movement against the previous period of equal length. total_rev is MLF-adjusted over LP-solved days (through lp_through), so it differs from get_battery_revenue's gross every-day total. Units still commissioning and CONTRACTED or TOLLED units are listed under excluded, not ranked, unless include_arrangement is true (their spot revenue is not their commercial return). Check unit_class and peer_comparable before reading a gap as performance. It scans the whole fleet twice, so keep the range to a month or less; it can be slow or time out on long ranges. For one unit's revenue use get_battery_revenue.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date_from": {
                "description": "Start date, YYYY-MM-DD (inclusive).",
                "format": "date",
                "type": "string"
              },
              "date_to": {
                "description": "End date, YYYY-MM-DD (inclusive).",
                "format": "date",
                "type": "string"
              },
              "duration_band": {
                "description": "Optional. Under 2 hours, 2 to 4 hours, or over 4 hours.",
