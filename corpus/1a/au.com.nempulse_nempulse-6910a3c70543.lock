        {
          "name": "list_bess_units",
          "title": "List NEM battery units",
          "description": "Reference list of every NEM-registered grid-scale battery. Call this first to turn a station name into the DUID the other tools need. Returns the whole fleet in one response (no filters): DUID, station, region, MW/MWh, MLF, coordinates, is_commissioning, commercial_context, unit_class, peer_comparable, rev_per_mw_yr. Caveats on the fields follow. rev_per_mw_yr is trailing 365-day energy + FCAS revenue (NOT FPP), gross (no MLF), divided by Max Cap MW, then annualised over the days the unit actually had dispatch data — not over a fixed 365-day denominator. This is a rough simulator guide, NOT a performance ranking. It is distorted for any unit with is_commissioning=true or commissioned within the last 365 days, because that span-annualisation extrapolates a few months of ramp-up behaviour out to a full year (scale-up factors of 1.5x-2.4x are live in the current data), which magnifies both weak and negative figures rather than diluting them — do NOT try to 'correct' it by rescaling to the unit's operating span, as that double-counts the annualisation. It is also inflated for small FCAS-primary units, and structurally biased against longer-duration units (shorter-duration units can concentrate power into the highest-price intervals). Do not use it to compare units, rank performance, or answer 'which battery earns most' — use get_battery_revenue over a matched window, or get_battery_optimal for capture. Before comparing any two units' revenue, check BOTH labels on each. commercial_context (TOLLED/CONTRACTED) means the unit does not trade merchant, so its spot revenue is not comparable; a null here means no publicly documented arrangement was found, NOT that the unit is confirmed merchant — only an explicit MERCHANT value means that, and most units are null. unit_class is the structural label (STANDALONE/HYBRID/NETWORK-SUPPORT/MICRO): peer_comparable is false for the latter three, whose dispatch answers to a co-located generator, a non-market obligation, or sub-10MW FCAS granularity rather than to price. Never pool a peer_comparable=false unit into a cross-unit statistic or ranking. Null until the first background refresh completes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List NEM battery units"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9564b9a9b7f261b064629c789a444c58a6d53c89a990704cfaf94de3a79c0443"
        },
        {
          "name": "list_events",
          "title": "List NEM price events",
          "description": "List NEM spot-price events, newest first. An event is a run of 5-minute intervals in one region where the price stays above $500/MWh or below -$200/MWh (short gaps are bridged), typed by its peak price: negative (below -$200), elevated (peak $500 to $1,000), spike ($1,000 to $5,000) or extreme ($5,000 and above). Each event has event_id, region, event_type, started_at, ended_at, duration_min, peak_rrp, avg_rrp and is_open (still ongoing). Filter by region, event_type and a date range. By default only event summaries are returned; set include_responses to true to also get how each battery behaved during each event, in which case keep limit small (response rows make the payload large and it is truncated at about 100 KB). Use get_event_detail for one event's battery responses.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date_from": {
                "description": "Optional. Only events starting on or after this date, YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "date_to": {
                "description": "Optional. Only events starting on or before this date, YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "event_type": {
                "description": "Optional event type filter.",
                "enum": ["negative", "elevated", "spike", "extreme"],
                "type": "string"
              },
              "include_responses": {
                "description": "Also return per-battery responses for each event (default false).",
                "type": "boolean"
              },
              "limit": {
                "description": "Max events to return (default 10, max 500).",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Skip this many events, for paging (default 0).",
                "minimum": 0,
                "type": "integer"
              },
              "region": {
                "description": "NEM region code: NSW1, QLD1, SA1 (South Australia), TAS1 or VIC1.",
                "enum": ["NSW1", "QLD1", "SA1", "TAS1", "VIC1"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
