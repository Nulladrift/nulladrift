        {
          "name": "get_simulator_revenue",
          "title": "Hypothetical battery revenue",
          "description": "Modelled revenue for a hypothetical 1 MW battery of a given duration in one region (not a real unit), from NEMPulse's optimal-dispatch model on real prices. Returns P10/P50/P90 revenue for three tiers: realistic (forecast-informed result scaled by the capture ratio real batteries achieve, the only tier to use as a project case), forecast_informed (idealised execution on AEMO's public price forecast) and perfect (an unreachable ceiling). Also energy_share and fcas_share, a monthly series, and the real-unit cohorts behind the FCAS cap and the capture ratio. Gross spot revenue only, before costs, degradation and financing. It is a screening estimate, not a forecast of future revenue.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "duration": {
                "description": "Battery duration in hours: 1, 2 or 4.",
                "enum": [1, 2, 4],
