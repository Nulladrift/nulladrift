        {
          "name": "get_quote",
          "title": "Get a swap estimate",
          "description": "Estimate a crypto-to-crypto swap on HiddenSwap, a no-KYC crypto exchange. Returns the amount the person would receive after all fees, the rate, the minimum and maximum, the payout fee, the usual duration and a prefilled swap link. Uses a quote recorded in the last two hours when one matches the exact amount (floating rate only, labelled with its time), otherwise a live quote. Read-only: it creates no order and moves no funds. Coin ids come from search_coins (for example btc, xmr, usdttrc20). No account, no email and no ID needed to swap.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "Amount of the coin sent, as a decimal string with a dot, for example \"0.05\".",
                "maxLength": 34,
                "pattern": "^\\d{1,15}(\\.\\d{1,18})?$",
                "type": "string"
              },
              "from": {
                "description": "The coin sent. Coin id from search_coins, for example btc, xmr or usdttrc20 (USDT on Tron).",
                "maxLength": 24,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9]{1,24}$",
                "type": "string"
              },
              "rateType": {
                "default": "float",
                "description": "float (default): the rate is set when the deposit is confirmed. fixed: a rate held once the swap is started on the site, when the pair offers one.",
                "enum": ["float", "fixed"],
                "type": "string"
              },
              "to": {
                "description": "The coin received. Coin id from search_coins, for example btc, xmr or usdttrc20 (USDT on Tron).",
                "maxLength": 24,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9]{1,24}$",
                "type": "string"
              }
            },
            "required": ["amount", "from", "to"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "amountFrom": {
                "type": "string"
              },
              "amountTo": {
                "description": "Estimated amount received, after all fees.",
                "type": "string"
              },
              "etaMinutes": {
                "description": "Usual duration in minutes: low and high.",
                "items": {
                  "type": "number"
                },
                "maxItems": 2,
                "minItems": 2,
                "type": "array"
              },
              "from": {
                "additionalProperties": false,
                "properties": {
                  "id": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "network": {
                    "type": "string"
                  },
                  "ticker": {
                    "type": "string"
                  }
                },
                "required": ["id", "name", "network", "ticker"],
                "type": "object"
              },
              "max": {
                "type": "string"
              },
              "min": {
                "type": "string"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "payoutFee": {
                "description": "Fee for sending the new coins, in the received coin. Already taken off amountTo.",
                "type": "string"
              },
              "quotedAt": {
                "description": "When the quote was made (ISO 8601).",
                "type": "string"
              },
              "rate": {
                "description": "How much of the received coin one unit of the sent coin buys, before the payout fee.",
                "type": "string"
              },
              "rateType": {
                "enum": ["float", "fixed"],
                "type": "string"
              },
              "source": {
                "enum": ["live", "recorded"],
                "type": "string"
              },
              "swapUrl": {
                "description": "Prefilled swap page. The person reviews and starts the swap there.",
                "type": "string"
              },
              "to": {
                "additionalProperties": false,
                "properties": {
                  "id": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "network": {
                    "type": "string"
                  },
                  "ticker": {
                    "type": "string"
                  }
                },
                "required": ["id", "name", "network", "ticker"],
                "type": "object"
              }
            },
            "required": ["amountFrom", "amountTo", "from", "notes", "quotedAt", "rate", "rateType", "source", "swapUrl", "to"],
            "type": "object"
          },
