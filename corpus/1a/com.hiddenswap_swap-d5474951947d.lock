        {
          "name": "search_coins",
          "title": "Find coins and networks",
          "description": "Find the coin ids HiddenSwap uses, by ticker, name or network, for example \"usdt tron\", \"monero\" or \"eth base\". Each result gives the id to pass to the other tools, the network, whether the coin can be sent or received in a swap, whether a memo is usually needed, and the coin page when there is one. HiddenSwap is a no-KYC crypto exchange for crypto-to-crypto swaps. Read-only. No account, no email and no ID needed to swap.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "description": "Most results to return (1 to 25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Ticker, name or network words, for example \"usdt tron\" or \"monero\".",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "side": {
                "description": "Only coins that can be sent (send) or received (receive) in a swap.",
                "enum": ["send", "receive"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
