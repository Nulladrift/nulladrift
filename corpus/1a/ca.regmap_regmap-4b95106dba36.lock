{
  "lockfileVersion": 2,
  "subjects": {
    "ca.regmap/regmap": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://regmap.ca/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "regmap-canada",
        "title": "RegMap Canada",
        "version": "1.1.0",
        "websiteUrl": "https://regmap.ca"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "RegMap Canada answers questions about Canada's interprovincial (internal) trade barriers, the reform tracker, and federal, provincial and territorial acts and regulations. Every record has a cite_url on regmap.ca: link it when you use the answer, and quote the review or as-of date. Answers are an independent reference, not legal advice; point users to the official text (official_url) for anything binding. Jurisdiction codes: CA (federal), BC, AB, SK, MB, ON, QC, NB, NS, PE, NL, YT, NT, NU.",
      "tools": [
        {
          "name": "compare_provinces",
          "title": "Compare provinces for a sector",
          "description": "Rank the 13 provinces and territories by how many business-relevant acts and regulations they have for one sector (regulatory surface, not burden), with the federal count for reference.",
          "inputSchema": {
            "properties": {
              "include_economy_wide": {
                "description": "Also count rules that bind every business (default false).",
                "type": "boolean"
              },
              "sector": {
                "enum": ["agriculture", "mining-oil-gas", "utilities", "construction", "manufacturing", "wholesale-retail", "transportation-warehousing", "information-tech", "finance-insurance", "real-estate", "professional-services", "health-care", "accommodation-food", "arts-recreation", "education", "other-services"],
                "type": "string"
              }
            },
            "required": ["sector"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare provinces for a sector"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bd606a0734f0e02aecfc8e272bb4a563842af0fb9e56d001e67da60259a6cddb"
        },
        {
          "name": "get_barrier",
          "title": "Get one barrier with sources",
          "description": "Full record for one internal trade barrier: summary, legal basis, the regulations it cites, official and study sources, review date, and for verified barriers the answer in every province and territory. Pass from and to for a province-pair answer.",
          "inputSchema": {
            "properties": {
              "from": {
                "description": "Jurisdiction code (CA = federal, BC, AB, SK, MB, ON, QC, NB, NS, PE, NL, YT, NT, NU) or its name.",
                "type": "string"
              },
              "id": {
                "description": "Barrier id from search_barriers (e.g. 'dtc-alcohol', 'b63').",
                "type": "string"
              },
              "to": {
                "description": "Jurisdiction code (CA = federal, BC, AB, SK, MB, ON, QC, NB, NS, PE, NL, YT, NT, NU) or its name.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one barrier with sources"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:69ecf640f885997cd65df1b31737f60f742766e866d8de4672dd37f35172b87c"
        },
        {
          "name": "get_regulation",
          "title": "Get one act or regulation",
          "description": "One catalogue instrument by slug: title, citation, jurisdiction, enabling act, currency date, official text link, regmap.ca URL, and any internal trade barriers that cite it.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Instrument slug from search_regulations (e.g. 'on-1a2b3c4d5e6f').",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one act or regulation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8f11a13c2f7e72fd4222c75071257d214ee83cedbe83d48964bba1b440ecadec"
        },
        {
          "name": "licence_move",
          "title": "Move a licensed occupation to another province",
          "description": "For a licensed occupation (e.g. registered nurse, practical nurse, electrician, teacher) moving to another province or territory: whether the licence is recognized, the regulator, steps, published fees, timeline, added requirements and posted CFTA exceptions, each tied to the regulator's own page, with the checked date and the regmap.ca URL to cite. Omit `to` for every destination at a glance; omit `occupation` to list what is covered.",
          "inputSchema": {
            "properties": {
              "from": {
                "description": "Province or territory the person is licensed in now (filters origin-specific notes and exceptions).",
                "type": "string"
              },
              "occupation": {
                "description": "Occupation in plain words or its slug, e.g. 'registered nurse', 'LPN', 'electrician'.",
                "type": "string"
              },
              "to": {
                "description": "Destination province or territory.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Move a licensed occupation to another province"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eacd5b8d55f10d0ab06104a670d520a052c426d0b6538988860a6be547ee6189"
        },
        {
          "name": "recent_changes",
          "title": "Recent changes to the barrier inventory",
          "description": "What changed in RegMap's barrier inventory at recent refreshes: barriers added, amended, removed or restored.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "How many refresh dates to return (default 5).",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recent changes to the barrier inventory"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c5128ea32346825441d85a7c698b8da4b860fd2d93c034f04fdf11fcf2a56009"
        },
        {
          "name": "reform_status",
          "title": "Internal trade reform tracker",
          "description": "Dated, officially sourced internal trade reforms since 2025 (laws passed or in force, regulations, agreements, exception removals, mutual recognition), filtered by jurisdiction, status or keyword, plus upcoming dates. Each event has its regmap.ca URL and official source.",
          "inputSchema": {
            "properties": {
              "jurisdiction": {
                "description": "Jurisdiction code, or ALL for FPT-wide events only.",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10, max 25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keyword, e.g. 'alcohol', 'labour mobility', 'trucking'.",
                "type": "string"
              },
              "since": {
                "description": "Only events on or after this date (YYYY-MM-DD).",
                "type": "string"
              },
              "status": {
                "enum": ["done", "announced", "pending"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Internal trade reform tracker"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5284117d8072368ff89aba776b06cf448783b1b100fe4b74ff9c0977c1a1156d"
        },
        {
          "name": "regmap_overview",
          "title": "What RegMap covers",
          "description": "Coverage counts, freshness dates, and the valid jurisdiction codes, barrier topics, regulation categories and sectors.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
