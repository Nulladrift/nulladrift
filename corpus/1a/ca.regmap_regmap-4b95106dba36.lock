          },
          "digest": "sha256:9fdcfaf7170c180509945eaacde64c508374c0d490fb9be5296605972c21cfa4"
        },
        {
          "name": "scoreboard",
          "title": "Internal trade commitments scoreboard",
          "description": "Every published intergovernmental internal trade commitment against each of the 14 governments: done, in progress, missed or not committed, with deadlines and the official source per cell. Filter by jurisdiction for one government's record, or pass a commitment id for its full row.",
          "inputSchema": {
            "properties": {
              "commitment": {
                "description": "Commitment id from a previous scoreboard result.",
                "type": "string"
              },
              "jurisdiction": {
                "description": "Jurisdiction code (CA = federal, BC, AB, SK, MB, ON, QC, NB, NS, PE, NL, YT, NT, NU) or its name.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Internal trade commitments scoreboard"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9859e85b35cdbff203fcc2c54880918505b00945c2b659eff27ee2502a16cf42"
        },
        {
          "name": "search_barriers",
          "title": "Search internal trade barriers",
          "description": "Find interprovincial trade barriers in RegMap's inventory by occupation, product or sector (e.g. 'nurse', 'wine shipping', 'trucking'), optionally for a province pair (from -> to) or one jurisdiction. Returns plain-language question, short answer, who imposes it, and the regmap.ca URL to cite. For verified province-by-province barriers with from and to, also returns the status for that move.",
          "inputSchema": {
            "properties": {
              "from": {
                "description": "Origin jurisdiction (where the person, product or firm comes from).",
                "type": "string"
              },
              "include_historical": {
                "description": "Also return removed or resolved barriers (default false).",
                "type": "boolean"
              },
              "jurisdiction": {
                "description": "A single jurisdiction to filter by, instead of a pair.",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10, max 25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Occupation, product, activity or sector in plain words.",
                "type": "string"
              },
              "to": {
                "description": "Destination jurisdiction.",
                "type": "string"
              },
              "topic": {
                "description": "Restrict to one barrier topic.",
                "enum": ["Agriculture & food", "Alcohol & beverages", "Cannabis", "Financial services & insurance", "Professional & occupational licensing", "Skilled trades & apprenticeship", "Construction & building", "Health & social services", "Legal services", "Energy & resources", "Mining, forestry & fisheries", "Transportation & trucking", "Environment & packaging", "Public procurement", "Business registration & corporate", "Government & Crown enterprises", "Economy-wide & other"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search internal trade barriers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fcf54f1358cb7aee7b77f61779556e5e1726a1231c64e58d5ffc224846dd8fc2"
        },
        {
          "name": "search_regulations",
          "title": "Search Canadian acts and regulations",
          "description": "Search RegMap's catalogue of more than 25,000 federal, provincial and territorial acts and regulations (titles from official legislation portals) by keyword, jurisdiction, topic category or sector. Returns titles, citations, the official text link and the regmap.ca URL to cite.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Regulatory topic category.",
                "enum": ["business-registration", "licensing-permits", "tax-levies", "employment-labour", "ohs-workers-comp", "professional-certification", "consumer-protection", "privacy-data", "food-agriculture", "alcohol-cannabis-gaming", "transportation", "energy-resources", "construction-building", "financial-services", "communications-media", "health-pharma", "environment", "land-property", "general-commerce", "procurement-trade"],
                "type": "string"
              },
              "jurisdiction": {
                "description": "Jurisdiction code (CA = federal, BC, AB, SK, MB, ON, QC, NB, NS, PE, NL, YT, NT, NU) or its name.",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10, max 25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "description": "Result page (default 1).",
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords, e.g. 'food premises', 'liquor licence'.",
                "type": "string"
              },
              "sector": {
                "description": "Industry sector.",
                "enum": ["agriculture", "mining-oil-gas", "utilities", "construction", "manufacturing", "wholesale-retail", "transportation-warehousing", "information-tech", "finance-insurance", "real-estate", "professional-services", "health-care", "accommodation-food", "arts-recreation", "education", "other-services"],
                "type": "string"
              },
              "type": {
                "description": "Only acts or only regulations.",
                "enum": ["act", "regulation"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Canadian acts and regulations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
