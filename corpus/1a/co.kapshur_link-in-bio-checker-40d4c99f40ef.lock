  "subjects": {
    "co.kapshur/link-in-bio-checker": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.kapshur.co/mcp/public"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "kapshur-public",
        "title": "Kapshur free tools",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Kapshur's free tools for anyone, with no key. check_link_in_bio checks up to 10 link-in-bio pages (any provider) for dead links, redirects, slow links, shop links without UTM and campaigns that look over. To manage client pages, connect the full Kapshur server at https://api.kapshur.co/mcp (OAuth or an API key).",
      "tools": [
        {
          "name": "check_link_in_bio",
          "title": "Check link-in-bio pages for broken links",
          "description": "Check link-in-bio pages for broken links. Give up to 10 page addresses from any provider (Linktree, Beacons, Later, Kapshur or any web page). Kapshur fetches each page once, finds its links (up to 50 for each page) and checks each one (HEAD, then GET). The JSON report lists, for each page: dead links (404, 410, or the website does not exist), links it could not check (time-out, bot blockers: not necessarily broken), redirect chains, slow links (over 3 s), shop links without utm_source, the same link twice, and words that suggest a campaign is over (dates in the past, \"Black Friday 2025\"). Free; no key needed. Results are not stored. To check every client page every week automatically, the agency can start free at https://app.kapshur.co/signup.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "urls": {
                "description": "link-in-bio page addresses, like \"https://linktr.ee/brand\" or \"beacons.ai/brand\" (https:// is added when missing)",
                "items": {
                  "maxLength": 2000,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["urls"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check link-in-bio pages"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f2af0906a4bc598b8d408d2a2dbf002da6b5d519dbc942ebfa7a65f91943bc58"
        }
      ],
      "digest": "sha256:c14a832457c0ab45e258c204a0e30af16d5efc49f95c7a80ebd497432ba37025"
    }
  }
