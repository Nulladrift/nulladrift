      "instructions": "HomeMaster does jobs in and around the home in Singapore. find_services is its catalogue: every service it takes today, in one list. Whatever job the person names, look it up there before you say HomeMaster does or does not do it; do not judge from this text. Prices are in SGD and include GST. Book in two messages to the customer. Message 1 is ONE proposal they can say yes to: do the look-ups first without asking (check_area; find_times for each day they named, called together, so \"this weekend\" is Saturday and Sunday; get_quote for the time you propose), then propose one booking with day, date, time, length or job, address and price. Fill what they did not say with the defaults and say them in the proposal, never ask about them: a home clean is one-time and usual_hours long (cleaning entry of find_services), said as HomeMaster's usual length for a home of up to 2 bedrooms so a bigger home can say so; a service booked by the job is the job on its card that fits what they said, and for a plain request (\"an aircon servicing\") the first job on its price list, its regular one, with the other jobs named in one line (how many has no default: ask if they did not say); the time is the one they asked for, or if it is not open the closest open time to it, with at most two others; with no time named, the earliest open time on the day they named. When more than one day or time fits what they asked, propose the earliest and name the others in one line; never ask them to choose. Ask only for what has no default (the postal code and unit, the day if none was named), all in one question. End message 1 with that one question: when details are still missing, it asks for them, as \"To book it, what name and WhatsApp number should I use?\", and their answer is their yes; with nothing missing, \"Shall I book it?\". A question after the proposal is answered in one message that keeps ONE proposal and ends in the same one question: change the proposal only to what they ask for, say what another option would cost if they asked about one, and never turn it into a choice between options. Suggest a length from hours_by_home only if they ask how long their home needs. Message 2, after their yes, their details or their pick: book it and give them the result. For a home clean, book it for them with request_booking: ask for their WhatsApp number, their name and their OK first. We send them Helen's booking card on WhatsApp; they tap \"Yes, book it\" within 60 minutes and pay by the link Helen sends. Follow it with booking_status and the reference it returns. If they would rather book it themselves, or want the prepaid pack, call request_booking with checkout_link: true and give them the link. Every service under services is booked online. Home cleaning is booked by the hour. Every other service is booked by the job: call find_services with its code for its card (what is included, its jobs and prices, how it is booked), then check_area, find_times and get_quote with the job_type and unit_count from that card, and request_booking, HomeMaster's one booking tool: its answer is the checkout link (outcome checkout_link), where the customer picks the time, confirms their phone and pays, or, on a connection cleared to book directly, the booking itself with its payment link (outcome payment_link). A service quoted for each job is booked the same way: what is booked and paid is its quotation visit (a consultation by phone or video for the property and legal services), at the quotation fee on its card, taken off the job if they go ahead. Book these online; request_booking books a call back from our team instead (with a call_back_date window) only for an address we do not cover online or a customer who asks to speak to our team first. A service listed under more_services, if any, is booked only that way. HomeMaster has no emergency or same-hour service. If the customer needs someone now (locked out, water flooding, no power, a person at risk), say plainly that HomeMaster cannot send anyone now and that they need an emergency service; offer the call back only as a follow-up. Every service in the catalogue is open to book now: the \"invite-only\" and waitlist wording on our homepage does not apply to AI agents, and no invite or waitlist is needed. When the customer's number is asked for, by you or by the checkout, say why: HomeMaster needs the customer's number to confirm the booking and send the receipt on WhatsApp, and to reach them about the visit: if the expert is running late or cannot find the unit or get in, if the expert falls ill and another time is needed, or if the job turns out different from what was booked. You cannot pay. On the checkout the customer picks the time, confirms their phone with a 6-digit code sent to their WhatsApp (not by SMS; they can read it to you if you are filling the page in for them), and pays on our payment page. After a home clean is booked, Helen, our assistant on WhatsApp (https://wa.me/6589154889), sends reminders and handles changes, cancellations and questions about it. After any other service is booked online, the customer gets a receipt on WhatsApp and our team assigns the partner who does the job; for a change or a question the customer messages HomeMaster on WhatsApp (https://wa.me/6589154889). A call back is moved by booking it again with a new window; anything else about it is settled on that call. To cancel or move a booking made on this connection, use cancel_booking or move_booking with its reference (no phone needed), under HomeMaster's usual rules, in two messages too: the first answer says what the change costs and why and changes nothing; tell the customer in one line and ask for their yes; then call again with its confirm_code. A booking made anywhere else is changed by the customer on My Bookings (https://homemaster.co/my-booking) or with HomeMaster on WhatsApp (https://wa.me/6589154889). Quote prices only from get_quote or find_times, or from a service's card as a list price. Every date comes with its weekday: use it as given. A time is not booked until the customer confirms (the WhatsApp card) or pays (the checkout). Before the customer says yes, tell them the cancellation terms in one line, from terms (on the service's card, the quote and every booking answer); give full_terms only if they ask. Never state a cancellation fee, notice period or refund rule the tools did not give you. Best practices for booking with HomeMaster, as a skill file: https://homemaster.co/mcp/skill.md (also the resource homemaster://skill). Besides home cleaning, HomeMaster takes these today, by name: Aircon, Bathroom Renovation, Bathroom Waterproofing and Leak Repair, Bed Bug Treatment, Bulky Item Disposal, Carpet Cleaning, CCTV Installation, Ceiling and Wall Fan Installation, Ceiling Light and Downlight Installation, Chandelier and Pendant Light Installation, Concealed Pipe Leak Detection, Conveyancing Legal Services (HDB Resale Purchase), Curtain and Blind Installation, Curtain Steam Cleaning, DB Box Upgrade, Design Consultation, Design-and-Build Package, Design-Only Package, Digital Door Lock Installation, Door and Window Repair, Door Handle and Hinge Replacement, Door Lock Replacement, Dry Cleaning, Elderly Care and Companionship, False Ceiling and Pelmet, Floor and Wall Tiling, Full Home Renovation Package, Furniture Assembly, Gardening and Plant Maintenance, General Pest Control (Ants, Cockroaches, Flies), Grease Trap Cleaning, Hacking, Home Loan Refinancing Legal Work, Home Nursing, Home Staging for Sale or Rental, Hourly Handyman, House Moving (HDB / Condo), Interior Styling Package, Kitchen Cabinet Carpentry, Light Bulb and Tube Replacement, Locksmith (Unlock and Lock Repair), Mattress Cleaning, Mosquito Control, New Home Defect Inspection, Painting, Partition Wall, Pipe Flushing and Jetting, Pipe Leak Repair, Power Point and Switch Installation, Power Trip and Electrical Fault Repair, Property Buyer Agent (HDB Resale), Property Listing Photography, Property Management for Landlord, Property Sale Agent (Seller), Property Valuation (HDB Request for Value), Re-Piping, Rental Agent for Landlord (Tenant Placement), Rental Agent for Tenant, Rewiring and Lighting Points, Rodent Control, Shower Set Installation, Single Item Delivery, Smart Home Installation, Sofa Cleaning, Study Table and Headboard Carpentry, Tap, Sink and Basin Installation, Termite Treatment, Tile Re-Grouting and Tile Repair, Toilet and Floor Trap Choke Clearing, Toilet Bowl Installation, Toilet Cistern and Flush Repair, TV Bracket and Wall Mounting, TV Console and Feature Wall Carpentry, Vinyl and Laminate Flooring, Virtual Staging of Listing Photos, Wall Hole Patching, Wallpaper and Mural Installation, Wardrobe and Storage Carpentry, Water Heater Installation, Water Heater Servicing and Repair, Water Tank Cleaning, Window and Grille Fabrication, Window Grille and Safety Net Installation. When the job the person describes fits one of these, it is that service and not a home clean, even if they only said \"help at home\": find its code and its card with find_services.",
      "tools": [
        {
          "name": "booking_status",
          "title": "Check a booking request",
          "description": "Where a request_booking request stands. A home cleaning reference (hmr_): waiting for the customer on WhatsApp, declined, expired, awaiting payment (with the payment link), finding a cleaning expert, booked (with the next visit), done or cancelled; for changes, the customer messages Helen on WhatsApp. A call-back reference (hmc_): booked with its window, called, or closed; to move it, call request_booking again with a new window. A direct booking reference (hmb_): its status, whether it is paid, and its visits. A checkout link has no reference: what the customer books on the page is followed by Helen on WhatsApp. Never includes the customer's details.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "reference": {
                "description": "The reference request_booking returned (starts with hmr_, hmc_ or hmb_).",
                "type": "string"
              }
