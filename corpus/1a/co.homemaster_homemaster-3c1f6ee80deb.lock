        {
          "name": "find_times",
          "title": "Find open dates and start times",
          "description": "Find real open dates, or start times on one date, for a booking at a postal code. Without `date`: the open dates in the next 14 days. With `date` only: that day's start times, each with its price. With `date` and `end_date`: the open dates in that range (at most 14 days). A booking can only start inside the booking window: a later date is refused, and the refusal names the last day. A weekly or bi-weekly plan carries on past it. Times are not held here: on the checkout page a picked time is held for 7 minutes, and a direct booking's time is held once it is paid.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
