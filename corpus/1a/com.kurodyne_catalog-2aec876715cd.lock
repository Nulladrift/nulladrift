              "query": {
                "description": "Keywords matched against product titles and descriptions. Every term must appear in the title or description, ASCII words and numbers also match as word prefixes, and long queries keep only their leading terms, so send a few distinctive keywords rather than a sentence. Omit to browse with filters alone",
                "type": "string"
              },
              "seller": {
