              "sort": {
                "description": "Sort order (default: recommended). With a search query, title matches rank first, then description matches, before recommendation score. Without a query, recommendation score alone determines the order. The score combines average rating shrunk toward a neutral prior, logarithmic sales volume, and a decaying new-product boost. Products without reviews start at the prior; more reviews give the product average more weight. newest: most recently listed first. popular: most sales first. rating: highest average rating first, then most ratings. price-asc and price-desc: by price",
