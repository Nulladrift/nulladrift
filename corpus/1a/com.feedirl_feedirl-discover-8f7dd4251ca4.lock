{
  "lockfileVersion": 2,
  "subjects": {
    "com.feedirl/feedirl-discover": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.feedirl.com/api/v1/discover/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "feedirl-discover",
        "version": "1.2.0",
        "description": "Live local events for AI agents — discovery only, with FeedIRL referral attribution."
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Use discover_events to search upcoming real-world events. Prefer referral_url for outbound links. Never claim tickets are reserved or purchased. FeedIRL does not process payments.",
      "tools": [
        {
          "name": "discover_events",
          "title": "Discover events",
          "description": "Search FeedIRL for upcoming real-world events and experiences by location, date window, budget, and interests/vibe. Returns ranked results with a one-line reason, local start time when known, price when available, source, referral ticket link, and last-verified timestamp. Discovery only — send people to referral_url; FeedIRL does not book or charge.",
          "inputSchema": {
            "properties": {
              "ai_provider": {
                "type": "string"
              },
              "budget": {
                "description": "Max price in USD",
                "type": "number"
              },
              "city": {
                "description": "City or metro name",
                "type": "string"
              },
              "date": {
                "description": "YYYY-MM-DD start",
                "type": "string"
              },
              "end_date": {
                "description": "YYYY-MM-DD end",
                "type": "string"
              },
              "include_adult": {
                "default": false,
                "type": "boolean"
              },
              "interests": {
                "description": "Comma-separated interests / vibe (comedy, live music, …)",
                "type": "string"
              },
              "lat": {
                "type": "number"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "type": "integer"
              },
              "lng": {
                "type": "number"
              },
              "radius_mi": {
                "default": 25,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Discover events"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b873402464004dad28fb7ddacef8756491045e9e9d6a2c35f29d5153c0c7a402"
        }
      ],
      "digest": "sha256:6efabe89f49058b7ea3d5cd55525cbaf31297d098bc48366da861469c584fe8e"
    }
  }
}
