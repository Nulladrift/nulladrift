        {
          "name": "check_point_in_geofence",
          "title": "Evaluate a Location Against a Geofence",
          "description": "Evaluate whether a vehicle, shipment, mobile device, scan, person-authorized location event, asset, aircraft, vessel, or other coordinate is inside a proposed radius boundary used in Atlasemoji geofencing and event-driven workflows.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "center": {
                "additionalProperties": false,
                "description": "Center coordinate of the radius geofence.",
                "properties": {
                  "latitude": {
                    "description": "Latitude in decimal degrees between -90 and 90.",
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "longitude": {
                    "description": "Longitude in decimal degrees between -180 and 180.",
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  }
                },
                "required": ["latitude", "longitude"],
                "type": "object"
              },
              "point": {
                "additionalProperties": false,
                "description": "Coordinate to test against the radius geofence.",
                "properties": {
                  "latitude": {
                    "$ref": "#/properties/center/properties/latitude"
                  },
                  "longitude": {
                    "$ref": "#/properties/center/properties/longitude"
                  }
                },
                "required": ["latitude", "longitude"],
                "type": "object"
              },
              "radiusMeters": {
                "description": "Radius in meters. Accepted range is 1 through 100,000 meters.",
                "maximum": 100000,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["center", "point", "radiusMeters"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.atlasemoji/tool": {
              "availability": "mcp_available",
              "exampleInput": {
                "center": {
                  "latitude": 47.6101,
                  "longitude": -122.2015
                },
                "point": {
                  "latitude": 47.6102,
                  "longitude": -122.2014
                },
                "radiusMeters": 50
              },
              "exampleOutput": {
                "distanceMeters": 13,
                "inside": true,
                "radiusMeters": 50
              },
              "execution": "local",
              "expectedErrors": ["ATLAS_MCP_AUTH_REQUIRED", "ATLAS_MCP_POLICY_DENIED", "ATLAS_MCP_RATE_LIMITED", "Invalid center or point coordinates", "Radius outside the accepted input range"],
              "group": "Geofencing / Atlas Intercept",
              "outputDescription": "Returns the relationship between the supplied point and radius boundary for geofencing, learning, implementation, and workflow planning.",
              "risk": "low",
              "scope": "atlasemoji.geofences.preview",
              "tenantRequirements": []
            },
            "securitySchemes": [
              {
                "scopes": ["atlasemoji.geofences.preview"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:89e0d621ccafbdbc183ed12144e8bbb8949568d1558f391913fbfbe888fec0b4"
        },
        {
          "name": "detect_file_schema",
          "title": "Prepare Partner and Operational Data for Atlas DataSynch",
          "description": "Analyze a bounded preview of CSV, spreadsheet, JSON, EDI-normalized, EDIFACT-normalized, cXML-derived, inventory, telemetry, CRM, item, location, shipment, or partner records to identify their structure and determine how they may fit Atlas DataSynch workflows.",
