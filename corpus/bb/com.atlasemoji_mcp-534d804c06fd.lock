            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.atlasemoji/tool": {
              "availability": "mcp_available",
              "exampleInput": {
                "rows": [
                  {
                    "quantity": 25,
                    "sku": "SKU-100",
                    "warehouse": "SEA-01"
                  }
                ]
              },
              "exampleOutput": {
                "businessObject": {
