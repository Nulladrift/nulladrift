            "additionalProperties": false,
            "properties": {
              "rows": {
                "description": "Between 1 and 100 preview rows from a CSV, spreadsheet, JSON, EDI-normalized, or other tabular payload. Rows are inspected in memory and are not committed by MCP preview tools.",
                "items": {
                  "additionalProperties": {},
                  "description": "One preview record represented as an object of source column names and values.",
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["rows"],
            "type": "object"
