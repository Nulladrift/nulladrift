        {
          "name": "hire_tester",
          "description": "Places an order for one test from the tester catalogue. A person performs it and returns a recorded walkthrough with a screenshot and the console output of every step, plus their written findings. It suits a specific doubt only a person can resolve; a brief that says what is suspected produces a sharper report. Charges the offer's price at purchase and releases it if no tester accepts within 72 hours. offer_id identifies an offer in the tester catalogue. Cost: set by the offer you choose — the tester catalogue states each offer's price in credits, its turnaround, and exactly what is delivered. Charged when the order is placed and released if no tester accepts within 72 hours, or if the tester who accepted misses the offer's turnaround. Rate limit: 100 requests/minute per API key.",
          "inputSchema": {
            "properties": {
              "brief": {
                "description": "What to test and what would count as a problem. At least 20 characters. Example: 'Check the mobile checkout on iPhone — I think the pay button falls below the fold.'",
                "type": "string"
              },
              "offer_id": {
                "description": "The offer's id, as listed in the tester catalogue",
                "type": "string"
              },
              "target_url": {
                "description": "Absolute http(s) URL of the page to test",
                "type": "string"
              }
            },
            "required": ["brief", "offer_id", "target_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Hire tester"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f65637648c0e05fcab6a0c0fdf27f440d5e1a8a9ad7d4387ea3966c2c21c144a"
        },
        {
          "name": "list_sites",
          "description": "List every site in the user's organization with its latest completed audit: SEO score, grade, issues found, pages crawled, when it was last scanned, and whether a scan is running right now. Cost: free — reads data your organisation already produced. Rate limit: 100 requests/minute per API key.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List sites"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:419264400b3a6426b7340297499ec0ee5f5277c0da7245809581b1aa76f4198d"
        },
        {
          "name": "list_tester_offers",
          "description": "Browse the catalogue of tests a real person will run on a real device: mobile UX on a handset, end-to-end checkout, a screen-reader pass by somebody who uses one daily, native-speaker translation review, and more. These cover what reading a page cannot answer — how something feels on a handset, what a screen reader announces, whether a checkout completes on a real phone: what an automated audit cannot measure. Returns each offer with its price in credits, turnaround, and exactly what gets delivered. Cost: free — reads data your organisation already produced. Rate limit: 100 requests/minute per API key.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
