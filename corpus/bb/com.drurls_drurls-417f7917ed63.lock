        {
          "name": "free_page_check",
          "description": "Free single-page SEO/health audit of any public URL — no API key, no account. Returns the same score, grade, categories and issues as the product's free check, plus an `upgrade` field describing what the authenticated tools add. Rate limited per caller (3/day). Whole-site crawls, history and tasks need a DrUrls account.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "The page to audit, e.g. https://example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Free page check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d67611f07e3a0e184fcb264b12616d491be91e4d3347fd7b68ca69fbebd4628a"
        },
        {
          "name": "generate_report",
          "description": "Compile a full SEO report — for one site (score, issues by severity, top issue types, Google visibility, social presence, ranked fix plan) or the whole organization (per-site scores, visibility verdicts, top cross-site actions). Cost: 2 credits per call, charged only if the call succeeds. Rate limit: 100 requests/minute per API key.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "One site's domain; omit for the whole-organization report",
                "type": "string"
              }
            },
            "type": "object"
