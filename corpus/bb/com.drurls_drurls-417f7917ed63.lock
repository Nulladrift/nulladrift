      "instructions": "DrUrls audits websites: crawl-based SEO scores, issues with fixes, Google indexability, social presence. Tools are scoped to the API key's organization. start_scan launches a real audit (async — poll get_scan_status). Quotas follow the org's plan; quota errors come back as data, not failures.",
      "tools": [
        {
          "name": "check_google_visibility",
          "description": "Check Google indexability for all sites (or one): noindex tags, robots blocks, sitemap errors, canonical problems, redirect chains and broken internal links found in the last crawl. Explains per site whether anything blocks indexing. Cost: free — reads data your organisation already produced. Rate limit: 100 requests/minute per API key.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Restrict to one site (optional)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check google visibility"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2fa9a5fb3270f248caff06b2fa12411b082a66cc92b48742b5c9a7a038ba6ecb"
        },
        {
          "name": "find_issues",
          "description": "Search open issues across all sites (or one site). Returns issue groups: site, issue type, severity, how many pages are affected, and an example page. Cost: free — reads data your organisation already produced. Rate limit: 100 requests/minute per API key.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Restrict to one site (optional)",
                "type": "string"
              },
              "severity": {
                "description": "Restrict to one severity (optional)",
                "enum": ["CRITICAL", "HIGH", "MEDIUM", "LOW", "INFO"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find issues"
          },
          "behavior": {
            "destructive": false,
