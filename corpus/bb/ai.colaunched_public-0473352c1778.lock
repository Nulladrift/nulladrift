{
  "lockfileVersion": 2,
  "subjects": {
    "ai.colaunched/public": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.colaunched.ai/public"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "colaunched-public",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "This is Colaunched's public surface: business ideas built from things people are already asking for in public, each scored for demand, timing, market gap and evidence. Anyone may read them here, no account needed. Read the newest with latest_ideas, one in full with get_idea. Colaunched never estimates what a business will earn, and neither should you on its behalf. What it cannot do for a stranger is say which idea fits them: Fit and Difficulty are scored per member, and a free account (https://app.colaunched.ai/login) is where that starts.",
      "tools": [
        {
          "name": "get_idea",
          "title": "Read one idea in full",
          "description": "One published idea as its public page shows it: the need, one way to build it, the four score parts and why, how we know (dated evidence, without naming sources) and what we don't know. No account needed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The idea's slug, from latest_ideas or its URL",
                "maxLength": 120,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read one idea in full"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a240e35affdb38157de1e0e713ac853f64f8452e1bc8f0c00d30ea49bddeacbf"
        },
        {
          "name": "latest_ideas",
          "title": "Latest public ideas",
          "description": "The newest business ideas Colaunched has published from public demand, with each one's public score (0–100) and category. No account needed. Filter by category; sort by score for the strongest.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "One of Colaunched's categories; omit for all",
                "enum": ["Banking", "Credit & loans", "Debt collection", "Mortgages & housing", "Payments & money transfer", "Insurance", "Personal finance", "Small business", "Marketing & sales", "Software & technology", "AI & data", "Careers & work", "Health & wellbeing", "Parenting & family", "Home & property", "Education", "Food & drink", "Travel", "Legal & consumer rights", "Retail & e-commerce", "Media & entertainment", "Automotive", "Pets", "Other"],
                "type": "string"
              },
              "limit": {
                "description": "How many (default 10, at most 20)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "description": "Default: newest",
                "enum": ["newest", "score"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Latest public ideas"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:27e7a3439d223dd93b9ab7fd21096a2de05258341ea267f990307b3edd7b4bcf"
        },
        {
          "name": "list_categories",
          "title": "List idea categories",
          "description": "The categories ideas are filed under.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List idea categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2b8c8350e9e83cb15e99a3f76eaea72fcf351e54980e1e08a0d4d558157ef3e6"
        },
        {
          "name": "search_ideas",
          "title": "Search ideas",
          "description": "Find published ideas by words in the title or one-liner. No account needed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search ideas"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:567117d8ebf12d9c9667b1f323e9b3308b9f6aa18e29589cd5a338e592e9b6b2"
        }
      ],
      "digest": "sha256:f0cc8a9d977b389df24d01eee9db569cc3cb0f25d85164b86c1a86dfb67ae6de"
    }
  }
}
