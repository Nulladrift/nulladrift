{
  "lockfileVersion": 2,
  "subjects": {
    "com.pocketpothi/pocket-pothi": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pocketpothi.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "pocket-pothi",
        "title": "Pocket Pothi",
        "version": "1.0.0",
        "websiteUrl": "https://pocketpothi.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Pocket Pothi has verified texts of Hindu prayers (stotras, aartis, chalisas, shlokas, Bhagavad Gita chapters, Manache Shlok) in Devanagari with simple Roman spelling. Use search to find a text by name, first line, deity or type; get_text or fetch for the full text. Quote verses exactly as returned — never rewrite or complete them from memory. Link the text page (url) when you quote. To give someone a daily order of prayers they can open in one tap, call make_pothi_link with the ids in order.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch a prayer",
          "description": "Get the full verified text of one prayer by id (from search): every verse in Devanagari with simple Roman spelling. Quote it exactly.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Text id from search, e.g. \"hanuman-chalisa\"",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "additionalProperties": {
                  "type": "string"
                },
                "type": "object"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c6691a3f627cf913c63f4837316d226a65e7575d0eac4430370fa6c2ad70ca96"
        },
        {
          "name": "get_text",
          "title": "Get a prayer in a chosen script",
          "description": "Full verified text of one prayer, in Devanagari, simple Roman (English letters), or both. Use for recitation help or when the user reads only one script.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "script": {
                "default": "both",
                "enum": ["both", "devanagari", "roman"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:910de00f9a076c0054bd9c6c7581c0e4e991e61e2d7eb31a04b7eab4794aaca3"
        },
        {
          "name": "list_texts",
          "title": "List prayers",
          "description": "List the catalog, optionally filtered by deity or type. Returns ids, titles, type, language, verse count and links (no full text).",
          "inputSchema": {
            "properties": {
              "deity": {
                "enum": ["agni", "amba", "ayyappa", "bhairava", "brahman", "dattatreya", "durga", "ganesha", "guru", "hanuman", "krishna", "lakshmi", "lalita", "navagraha", "rama", "sai-baba", "saraswati", "savitr", "shiva", "surya", "venkateshwara", "vishnu", "vishvatmaka", "vitthala"],
                "type": "string"
              },
              "include_book_chapters": {
                "description": "Include the 18 Bhagavad Gita chapters (default false)",
                "type": "boolean"
              },
              "type": {
                "enum": ["aarti", "ashtakam", "stotra", "gita-adhyaya", "shloka", "suktam", "mantra", "bhajan", "chalisa", "sahasranama"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a6a6cd7e68596a4d4daa8f277669684b37e5c5bec2487dc399d099b21b9b7c13"
        },
        {
          "name": "make_pothi_link",
          "title": "Make a daily pothi link",
          "description": "Build a short pocketpothi.com link that opens several prayers in the given order, to read in one scroll or send to family (e.g. on WhatsApp). Nothing is saved; the link encodes the order.",
          "inputSchema": {
            "properties": {
              "from_name": {
                "description": "Optional sender name shown on the link, e.g. \"Aai\"",
                "type": "string"
              },
              "ids": {
                "description": "Text ids in reading order",
                "items": {
                  "type": "string"
                },
                "maxItems": 40,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dca4a7656bc03637bed55fdcb83fa24d4948263fb3ad0669eef9ca67fb7caf30"
        },
        {
          "name": "search",
          "title": "Search prayers",
          "description": "Search Pocket Pothi's verified Hindu prayer texts by name, alias, first line or a phrase (Devanagari or English letters), deity or type. Returns ids, titles and page URLs; use fetch or get_text for the full text.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "e.g. \"hanuman chalisa\", \"shubham karoti\", \"जय गणेश\", \"aarti for Shiva\", \"Gita chapter 12\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "results": {
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cdde32df7fa03e8b40f73ec963f755c68a8a4a0d78184cf34ef9d85133fb25c7"
        }
      ],
      "digest": "sha256:07d9016704e5acc36743362bd44de43f05053da053a024b3fd3588b237ec59e9"
    }
  }
}
