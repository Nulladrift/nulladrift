      "serverInfo": {
        "name": "rankcusp",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "rankcusp finds the keywords an app ranks 11-30 for on the App Store. Call list_apps first to find the app, then cusp_actions for the priority work. Unmeasured values come back as null; do not read them as zero.",
      "tools": [
        {
          "name": "add_keywords",
          "description": "Adds keywords to an app's tracked set in one storefront. Takes a list or a comma-separated paste. They arrive unscored - scoring costs requests to Apple and happens on the collector's schedule - so do not read a null popularity here as a zero.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "appId": {
                "description": "App Store app id",
                "type": "string"
              },
              "country": {
                "description": "Storefront code, e.g. us, tr, de",
                "type": "string"
              },
              "keywords": {
                "description": "The phrases to track.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["appId", "country", "keywords"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": false,
            "title": "Add keywords to the pool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4d7bec871f43cfe47f3717e7c6366a4b300b3516bd31c75a9e8282043c028de8"
        },
        {
          "name": "audit_metadata",
          "description": "Audits a draft title, subtitle and 100-character keyword field against Apple's rules and against each other. Returns what is wasted, what Apple will actually index, and the field rewritten without the waste. Nothing is submitted anywhere - this only reads the text you pass in.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Storefront code, e.g. us, tr, de",
                "type": "string"
              },
              "keywordField": {
                "description": "The 100-character field, comma-separated, as App Store Connect wants it.",
                "type": "string"
              },
              "subtitle": {
                "description": "Up to 30 characters.",
                "type": "string"
              },
              "title": {
                "description": "Up to 30 characters.",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Audit a metadata draft"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d64196599c79bd632cb7bdbe4a47e900bf2d445469443290892a641b1e7d8ef9"
        },
        {
          "name": "country_priorities",
          "description": "Ranks the storefronts an app is tracked in by how much is winnable there: how many keywords sit in the cusp band, how many already reach the top ten, and whether the rivals' ratings leave an opening. Answers which market to work on first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "appId": {
                "description": "App Store app id",
                "type": "string"
              }
            },
            "required": ["appId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Rank storefronts by opportunity"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0b82fa47fae47c56c1134ae2970922de2f2cf06d785554de588630e7721c7317"
        },
        {
          "name": "cusp_actions",
          "description": "The keywords in the 11-30 band, ordered by popularity. The work list a metadata edit pays off on most.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "appId": {
                "description": "App Store app id",
                "type": "string"
              },
              "country": {
                "description": "Storefront code, e.g. us, tr, de",
                "type": "string"
              },
              "limit": {
                "type": "number"
              }
            },
            "required": ["appId", "country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "The 11-30 cusp band"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a12b52995aae90e6d9f14ae9108156a06ac494b80bd416a2aec7f4ba03672a66"
        },
        {
          "name": "get_keyword",
          "description": "One keyword: its rank, its scores, its first page and the verdict - should it be targeted, and why. Every unmeasured value comes back null, never zero.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "appId": {
                "description": "App Store app id",
                "type": "string"
              },
              "country": {
                "description": "Storefront code, e.g. us, tr, de",
                "type": "string"
              },
              "keyword": {
                "description": "The phrase to look up.",
                "type": "string"
              }
            },
            "required": ["appId", "country", "keyword"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Look up one keyword"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ec207095ac5f9fec727901748431cc772013d9147730d6a344fcb06d7ca676b1"
        },
        {
          "name": "keyword_competitors",
          "description": "Who ranks for a phrase, deeper than the ten the first page carries. Use it to find the rivals a first-page reading misses - an app at 40 for a phrase you sit at 60 for is the one to study.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Storefront code, e.g. us, tr, de",
                "type": "string"
              },
              "keyword": {
                "description": "The phrase to look up.",
                "type": "string"
              },
              "limit": {
                "type": "number"
              }
            },
            "required": ["country", "keyword"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Who holds a keyword's first page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c7362b1898640770bd11a303a9c5c56c474be1aa5e006e7d02fd19482eb23db2"
        },
        {
          "name": "list_apps",
          "description": "Lists the apps and rivals tracked on the account. The appId and storefront codes the other tools want come from here.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "List tracked apps"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c3231eb130119c819e695a07dbf3e44b7d8b6446e37aabc35d4d8d8ace14f217"
        },
        {
          "name": "list_keywords",
          "description": "Lists an app's keywords in one storefront, with rank, popularity and difficulty.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "appId": {
                "description": "App Store app id",
                "type": "string"
              },
              "country": {
                "description": "Storefront code, e.g. us, tr, de",
                "type": "string"
              },
              "cuspOnly": {
                "description": "The 11-30 band only: the ones that reach the first page with the least effort.",
                "type": "boolean"
              },
              "limit": {
                "description": "How many rows, at most 200.",
                "type": "number"
              },
              "offset": {
                "type": "number"
              },
              "rankedOnly": {
                "description": "Only the ones ranking in the top 200.",
                "type": "boolean"
              }
            },
            "required": ["appId", "country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "List keywords in a storefront"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2801ae59c2ba4c826cba3205c7d546f7e0891edbd39ba624716eea547eb9dc73"
        },
        {
          "name": "ranking_keywords",
          "description": "Which keywords an app is already ranking for, from the pooled record of every search this product has run. Works on any App Store id, not only the ones on this account - point it at a rival to read theirs. Apple publishes no endpoint for this; the answer is only as wide as what has been observed, so an app nobody has swept near returns little.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "appId": {
                "description": "App Store app id",
                "type": "string"
              },
              "country": {
                "description": "Storefront code, e.g. us, tr, de",
                "type": "string"
              },
              "limit": {
                "description": "How many rows, at most 200.",
                "type": "number"
              },
              "maxRank": {
                "description": "Only positions at or above this, e.g. 30 for the reachable band.",
                "type": "number"
              }
            },
            "required": ["appId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Keywords an app already ranks for"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:978545862a5c723f44dfa05fafd587dcd50114204fb710beb576ba8e71f8c4c8"
        }
      ],
