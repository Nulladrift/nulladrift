      "serverInfo": {
        "name": "bestaffiliateprograms",
        "title": "BestAffiliatePrograms.cc",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools read the BestAffiliatePrograms.cc directory of affiliate programs: per program, the published commission, cookie window, network, how it pays, the sources its terms were read from and when they were checked. modelledValuePerReferralUsd is a conservative model from published terms, not a guaranteed payout. Each record carries its program page URL. Programs whose terms were read only from CJ's advertiser records, which CJ shows only to its publishers, are listed on the site's program pages but left out of the dataset, the API and the MCP server: CJ's API terms restrict redistributing its data.",
      "tools": [
        {
          "name": "get_affiliate_program",
          "title": "Get an affiliate program",
          "description": "Get the full record for one affiliate program by its slug (commission, cookie, network, how it pays, requirements, sources, verification date, modelled value).",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The program's slug as returned by search_affiliate_programs, e.g. 'nom-nom'.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an affiliate program"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0955d329e515b7f42ba33f063ad3a728d8781f7e7f75848db4b52037d414e356"
        },
        {
          "name": "get_directory_stats",
          "title": "Get directory statistics",
          "description": "Headline coverage: total programs, categories, networks, how many are verified against their own source, and how many the site lists that these tools leave out (with why).",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get directory statistics"
          },
