        },
        {
          "name": "list_categories",
          "title": "List program categories",
          "description": "List the program categories (the keys search_affiliate_programs accepts) with a count for each.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List program categories"
          },
          "behavior": {
