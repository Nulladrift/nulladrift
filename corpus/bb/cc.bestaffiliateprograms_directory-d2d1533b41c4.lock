          },
          "digest": "sha256:68353ce16043fcb6a461521c508f5ed8b2193e55020e759eb0dbc555c29384c0"
        },
        {
          "name": "list_networks",
          "title": "List affiliate networks",
          "description": "List the affiliate networks (the keys search_affiliate_programs accepts) with a count of programs on each.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List affiliate networks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:af65fe9308b72e83bd68cc40177587e25f0fae9ac76fc9c7fe665c3509c8f879"
        },
        {
          "name": "search_affiliate_programs",
          "title": "Search affiliate programs",
          "description": "Search and filter the directory of affiliate programs (each compared by network, commission, cookie window, and a MODELLED value per referral). Use to answer 'best/highest-paying affiliate programs for X', or to find programs by category, network, recurring vs one-time, or minimum value. Returns a ranked, paginated list of full program records.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category key, e.g. saas, finance, hosting, crypto (see list_categories).",
                "type": "string"
              },
              "confidence": {
                "description": "confirmed = rate read on a page the program itself publishes (the brand's own site, or the program's own page on the network that runs it).",
                "enum": ["confirmed", "network"],
                "type": "string"
              },
              "limit": {
                "description": "Programs per page, 1-50, default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "min_value": {
                "description": "Minimum modelled value per referral in USD.",
                "minimum": 0,
                "type": "number"
              },
              "network": {
                "description": "Primary network bucket, e.g. Impact, CJ, Awin, In-house (see list_networks).",
                "type": "string"
              },
              "offset": {
                "description": "Pagination offset.",
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "What the programs are for, in plain words: a niche, product or audience ('vpn', 'skincare', 'pet supplements for a dog blog', 'recurring saas'). Read the same way as the site's search; results are the matching programs, best first, and `interpretation` says how the query was read.",
                "type": "string"
              },
              "recurring": {
                "description": "true = only recurring-commission programs; false = only one-time.",
                "type": "boolean"
              },
              "sort": {
                "description": "Default value (highest modelled payout first).",
                "enum": ["value", "name", "cookie"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search affiliate programs"
          },
