        },
        {
          "name": "broker_latest",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "collector_id": {
                "description": "Target specific route collector for latest data. Examples: 'route-views.linx', 'rrc01'. Omit to get latest files from all collectors.",
                "type": "string"
              },
              "data_type": {
                "description": "Type of latest BGP data needed. 'rib' returns most recent routing table snapshots (best for current network topology analysis), 'updates' returns latest real-time routing changes (best for monitoring recent network events). Omit to get both types.",
                "type": "string"
              },
              "project": {
                "description": "Filter by data collection project. 'routeviews', 'riperis'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
