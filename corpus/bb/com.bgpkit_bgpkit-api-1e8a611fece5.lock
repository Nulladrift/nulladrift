        },
        {
          "name": "broker_peers",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "asn": {
                "description": "Filter for specific Autonomous System Number to see route collectors peers from a specific network",
                "type": "number"
              },
              "collector_id": {
                "description": "Target route collector to analyze peer relationships. Examples: 'route-views.linx', 'rrc01'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9d165d4c9ebd587aa5984d5566807911def4a8f04c1fe36e4ed9fdc7f57eff0c"
        },
        {
          "name": "broker_search",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "collector_id": {
                "description": "Specific route collector identifier. Examples: 'route-views.linx' (RouteViews LINX), 'rrc01' (Amsterdam).",
                "type": "string"
              },
              "data_type": {
                "description": "Type of BGP data to retrieve. 'rib' = Routing Information Base (periodic full routing table snapshots, typically every 2-8 hours, ideal for network topology analysis). 'updates' = real-time BGP routing updates (announcements/withdrawals, ideal for studying routing dynamics and outages).",
                "type": "string"
              },
              "page": {
                "description": "Page number for paginated results (starts from 1). Use for navigating large datasets when searching broad time periods or popular collectors.",
                "type": "number"
              },
              "page_size": {
                "description": "Results per page. Range: 1-1000, default: 100. Use larger values (500-1000) for bulk data discovery, smaller values (10-50) for quick exploration.",
                "type": "number"
              },
              "project": {
                "description": "BGP data collection project. Options: 'routeviews' (University of Oregon RouteViews project) or 'riperis' (RIPE NCC Routing Information Service). Each has different collector locations and methodologies.",
                "type": "string"
              },
              "ts_end": {
                "description": "End timestamp for data collection period. Same format as ts_start. Combine with ts_start to define a specific time window for targeted BGP event analysis or research.",
                "type": "string"
              },
              "ts_start": {
                "description": "Start timestamp for data collection period. Accepts ISO 8601 format (e.g., '2024-08-01T00:00:00Z') or Unix timestamp. Use to find data from a specific date onwards for historical analysis.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8dc0f9acbc9b1561b69c9d69ef0ffec1852fb4c14a1d63eb565043218119e8db"
        },
        {
          "name": "ip_lookup",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ip": {
                "description": "IP address to analyze (IPv4 or IPv6 format). Examples: '8.8.8.8' (Google DNS), '2001:4860:4860::8888' (Google IPv6 DNS), '1.1.1.1' (Cloudflare DNS). Returns geolocation, ASN ownership, BGP prefix, and RPKI validation status - essential for security analysis, geoblocking, network forensics, and traffic analytics.",
                "type": "string"
              }
            },
            "required": ["ip"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:40275cbda1a45d9bd478eb20818f2111ddf14cb7a69974e383b9334288c8bc28"
        }
