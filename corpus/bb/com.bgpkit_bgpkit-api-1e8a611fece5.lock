{
  "lockfileVersion": 2,
  "subjects": {
    "com.bgpkit/bgpkit-api": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.bgpkit.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "BGPKIT BGP Data API",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "asn_lookup",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "asn": {
                "description": "Autonomous System Number to analyze (1-4294967295). Examples: 15169 (Google), 7922 (Comcast), 13335 (Cloudflare), 32934 (Facebook). Returns organization details, network size metrics (customer cone, prefixes, ASN relationships), geographic presence, hegemony scores, and connectivity patterns - crucial for competitive intelligence, peering analysis, and Internet topology research. Omit to browse or filter all ASNs.",
                "type": "number"
              },
              "country": {
                "description": "Filter ASNs by country code (ISO 3166-1 alpha-2, e.g., 'US', 'DE', 'JP'). Useful for finding all autonomous systems registered in a specific country.",
                "type": "string"
              },
              "page": {
                "description": "Page number for paginated results when browsing all ASNs or filtering by country/search. Starts from 0.",
                "type": "number"
              },
              "page_size": {
                "description": "Number of results per page (max 10000). Default: 100. Use for pagination when browsing large result sets.",
                "type": "number"
              },
              "search": {
                "description": "Search ASNs by name or organization (case-insensitive partial match). Examples: 'google', 'comcast', 'cloudflare'. Useful for finding ASNs when you don't know the exact number.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:646cf6c002a5e47c0d879e380b715de38b8821c4fdf238c4c7cebdf48f800c4c"
        },
        {
          "name": "asn_lookup_bulk",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "asns": {
                "description": "Array of ASN numbers to analyze (max 10,000 per request). Examples: [15169, 7922, 13335]. More efficient than individual lookups for analyzing multiple networks simultaneously.",
                "items": {
                  "type": "number"
                },
                "maxItems": 10000,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["asns"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7b7284fe6c28e191620a773b1809bc54af75377b6dd4222e713a00071e09ecd4"
        },
        {
          "name": "bgp_communities",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "as_name": {
                "description": "Filter by AS organization name (case-insensitive partial match). Examples: 'Cogent', 'Level3', 'NTT'. Useful when you don't know the exact ASN.",
                "type": "string"
              },
              "asn": {
                "description": "Filter by Autonomous System Number. Examples: 174 (Cogent), 3356 (Level3), 1299 (Arelion). Returns all communities defined by this AS.",
                "type": "number"
              },
              "country": {
                "description": "Filter by country code (ISO 3166-1 alpha-2, e.g., 'US', 'DE', 'JP'). Returns communities from ASNs in the specified country.",
                "type": "string"
              },
              "description": {
                "description": "Filter by description text (case-insensitive partial match). Examples: 'blackhole', 'localpref', 'prepend'. Useful for finding communities with specific functions.",
                "type": "string"
              },
              "page": {
                "description": "Page number for paginated results (0-indexed, default: 0). Use for browsing large result sets.",
                "type": "number"
              },
              "page_size": {
                "description": "Results per page (default: 10, max: 1000). Use smaller values (10-50) for quick lookups, larger values (100-500) for bulk analysis.",
                "type": "number"
              },
              "value": {
                "description": "Specific community value to lookup (e.g., '174:21000' or '174:20xxx'). Supports wildcard patterns. Returns exact and wildcard range matches.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:564c1a3be7a5ec9cd507de805e6ac3a29cf64e053a8e007908b72cec01aa6a35"
        },
        {
          "name": "broker_collectors",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "active": {
                "description": "Filter for active collectors only (not deactivated)",
                "type": "boolean"
              },
              "country": {
                "description": "Filter by country code (e.g., 'US', 'DE', 'JP')",
                "type": "string"
              },
              "project": {
                "description": "Filter by collector project: 'routeviews' or 'riperis'",
                "enum": ["routeviews", "riperis"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
