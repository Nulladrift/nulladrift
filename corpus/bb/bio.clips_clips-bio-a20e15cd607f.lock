        },
        {
          "name": "make_clips_link",
          "title": "Turn a long video into clips",
          "description": "Get a clips.bio link that turns a long video (YouTube, Twitch, Kick, Vimeo, Loom, Drive, Dropbox) into scored vertical clips with captions. The first preview is free, no signup. Docs: https://clips.bio/mcp-server",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Link to the long video",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Turn a long video into clips"
          },
          "behavior": {
