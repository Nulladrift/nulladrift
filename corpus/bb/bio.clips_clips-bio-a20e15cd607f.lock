          },
          "digest": "sha256:c201613ee7de9d98e67383c499e8ff631bc35551811004e27f88134fd57d8a5b"
        },
        {
          "name": "score_hook",
          "title": "Hook checker",
          "description": "Score the opening line of a short video (0-100) for scroll-stopping power and get 3 stronger rewrites.",
          "inputSchema": {
            "properties": {
              "hook": {
                "description": "The first sentence spoken or shown in the video",
                "maxLength": 400,
                "type": "string"
              }
            },
            "required": ["hook"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
