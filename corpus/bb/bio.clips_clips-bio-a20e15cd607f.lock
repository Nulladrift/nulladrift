          },
          "digest": "sha256:c8b679b5bac46126e2e368094b2a0cc11154564925bfd0fe875276e58a6015f4"
        },
        {
          "name": "get_youtube_thumbnails",
          "title": "YouTube thumbnail links",
          "description": "Return direct links to every thumbnail size of a YouTube video (i.ytimg.com image URLs). Docs: https://clips.bio/tools/youtube-thumbnail-downloader",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "YouTube video or Shorts URL",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "YouTube thumbnail links"
          },
          "behavior": {
