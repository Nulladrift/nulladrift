{
  "lockfileVersion": 2,
  "subjects": {
    "bio.clips/clips-bio": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://clips.bio/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "bio.clips/clips-bio",
        "title": "clips.bio",
        "version": "1.1.0",
        "websiteUrl": "https://clips.bio"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Free tools for short-video creators from clips.bio: YouTube titles, hashtags, chapter timestamps, hook scoring, thumbnail links, clip export sizes and the Most Replayed moments of any YouTube video. To turn a long video into scored vertical clips, use make_clips_link and open the returned URL.",
      "tools": [
        {
          "name": "clip_export_calculator",
          "title": "Clip size and length calculator",
          "description": "Compute crop size, export resolution and clip count for turning a video into vertical clips.",
          "inputSchema": {
            "properties": {
              "clip_seconds": {
                "default": 30,
                "description": "Target clip length in seconds",
                "type": "integer"
              },
              "height": {
                "description": "Source height in pixels",
                "type": "integer"
              },
              "ratio": {
                "description": "Target aspect ratio",
                "enum": ["9:16", "4:5", "1:1", "16:9"],
                "type": "string"
              },
              "source_minutes": {
                "default": 60,
                "description": "Source video length in minutes",
                "type": "number"
              },
              "width": {
                "description": "Source width in pixels",
                "type": "integer"
              }
            },
            "required": ["height", "width"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Clip size and length calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:adf0749e4b9e4296cfc545a5e57072fa1a6be518b59d22b07ea81339fdc32fda"
        },
        {
          "name": "find_most_replayed_moments",
          "title": "YouTube Most Replayed moments",
          "description": "Find the moments viewers rewatch most in a YouTube video, from YouTube's own Most Replayed graph: start/end timestamps, relative replay score and the chapter each sits in. Docs: https://clips.bio/tools/most-replayed",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "YouTube video URL",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "YouTube Most Replayed moments"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:51d4ca67ef0635dfb7a26f427518afa542e78d6b7bba3d60e683f73e3b316073"
        },
        {
          "name": "generate_hashtags",
          "title": "Hashtag generator",
          "description": "Suggest hashtags for a short video on YouTube Shorts, TikTok or Instagram Reels.",
          "inputSchema": {
            "properties": {
              "platform": {
                "description": "Target platform",
                "enum": ["youtube-shorts", "instagram-reels", "tiktok", "x", "linkedin"],
                "type": "string"
              },
              "topic": {
                "description": "What the video is about",
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Hashtag generator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:49e5c997412a6a2d81ca71364d7db2b62dc438d75922afb4f00af0e88c6f74e3"
        },
        {
          "name": "generate_youtube_chapters",
          "title": "YouTube chapter timestamp formatter",
          "description": "Turn rough notes or a transcript with times into clean YouTube chapter timestamps.",
          "inputSchema": {
            "properties": {
              "text": {
                "description": "Lines with times and titles, e.g. '0:00 Intro' or a transcript with timestamps",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "YouTube chapter timestamp formatter"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:acaa791f9a702c4c1dc9132e698ce4f60e4acfa4e3d573e634fe21afc14f0227"
        },
        {
          "name": "generate_youtube_titles",
          "title": "YouTube title generator",
          "description": "Generate click-worthy YouTube or Shorts title ideas for a topic.",
          "inputSchema": {
            "properties": {
              "keyword": {
                "description": "Optional search keyword to include",
                "type": "string"
              },
              "style": {
                "description": "Title style",
                "enum": ["any", "howto", "list", "question", "result"],
                "type": "string"
              },
              "topic": {
                "description": "What the video is about",
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
