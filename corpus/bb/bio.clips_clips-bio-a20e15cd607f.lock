          },
          "digest": "sha256:0bcb0be3653f997289b5bdadc178182d0470f83a9f88b8eb061956f487925806"
        },
        {
          "name": "get_pricing",
          "title": "clips.bio pricing",
          "description": "Current clips.bio plans, minutes per month and prices in USD.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "clips.bio pricing"
          },
          "behavior": {
