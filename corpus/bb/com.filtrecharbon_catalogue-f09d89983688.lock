      "serverInfo": {
        "name": "FiltreCharbon",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "details_filtre",
          "title": "Détails du filtre / Filter details",
          "description": "Consulte les caractéristiques publiques, les références associées, le prix et le stock du catalogue. Unknown dimensions stay unknown. No access to customer or order data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "fc_ref": {
                "pattern": "^(?:FC|FV|FW)\\d{1,3}$",
                "type": "string"
              },
              "id_product": {
                "exclusiveMinimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:52b10df4b7de87ca714c485e772ffe346b3ccaba1c370fc8c3d412ab86645d94"
        },
        {
          "name": "preparer_commande",
          "title": "Préparer un lien / Prepare checkout link",
          "description": "Prépare uniquement un lien privé vers FiltreCharbon.com. Ne crée aucune commande et ne réalise aucun paiement. Client coordinates are optional: obtain explicit user consent before passing them. The link contains personal data in its fragment; show it only to that user, never publish it. The user reviews product and address on the site and confirms payment themselves. Do not submit card data. Supports France and Belgium.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "client": {
                "additionalProperties": false,
                "properties": {
                  "adresse": {
                    "maxLength": 128,
                    "type": "string"
                  },
                  "cp": {
                    "maxLength": 12,
                    "type": "string"
                  },
                  "email": {
                    "format": "email",
                    "maxLength": 128,
                    "type": "string"
                  },
                  "nom": {
                    "maxLength": 64,
                    "type": "string"
                  },
                  "pays": {
                    "enum": ["FR", "BE"],
                    "type": "string"
                  },
                  "prenom": {
                    "maxLength": 64,
                    "type": "string"
                  },
                  "tel": {
                    "maxLength": 32,
                    "type": "string"
                  },
                  "ville": {
                    "maxLength": 64,
                    "type": "string"
                  }
                },
                "required": ["adresse", "cp", "email", "nom", "pays", "prenom", "ville"],
                "type": "object"
              },
              "consentement_coordonnees": {
                "default": false,
                "type": "boolean"
              },
              "fc_ref": {
                "pattern": "^(?:FC|FV|FW)\\d{1,3}$",
                "type": "string"
              },
              "id_product": {
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "qte": {
                "default": 1,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "src": {
                "default": "autre",
                "enum": ["chatgpt", "claude", "gemini", "perplexity", "copilot", "autre"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:75e6da1896a00e81344a07c127920a5b1a0ab981a6397fa3d22eb30a515c1721"
        },
        {
          "name": "trouver_filtre",
          "title": "Trouver un filtre / Find a filter",
          "description": "Recherche une référence exacte de filtre ou d’appareil dans le catalogue FAC. Returns up to 3 catalogue matches, dimensions, price and confidence. Catalogue matches require verification; preserve the full E-Nr suffix. Do not send personal information or photographs to this text-only tool.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "marque": {
                "maxLength": 64,
                "type": "string"
              },
              "texte": {
                "maxLength": 160,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["texte"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5c2701c56c2b680cbbfcb7df85b7cff6f5c8abbdb0692a0c70a1ac4a8514e038"
        }
      ],
      "digest": "sha256:ef414ac530a9fc3959db9b0044d7c7e90a630e648897d3252a29fdf077dd9db1"
    }
  }
