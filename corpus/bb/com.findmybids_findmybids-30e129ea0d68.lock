        {
          "name": "search_bids",
          "title": "Search open bids",
          "description": "Search open bids (government contracts and RFPs) that FindMyBids tracks.\n\n    query: keywords, e.g. \"roof repair\", \"janitorial\", \"IT help desk\". Commas mean OR: \"roofing, gutters\".\n    states: two-letter codes where the work is, e.g. [\"PA\", \"MD\"].\n    level: \"federal\", \"state\", \"local\" or \"private\" (private = bids private companies posted on FindMyBids, plus\n    invitations the signed-in user saved).\n    naics: NAICS code prefixes, e.g. [\"5617\", \"238\"].\n    set_aside: text to match, e.g. \"Small Business\", \"8(a)\", \"HUBZone\", \"WOSB\", \"SDVOSB\".\n    due_after: ISO date; defaults to today (only bids still open).\n    ",
          "inputSchema": {
            "properties": {
              "due_after": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "ISO date (YYYY-MM-DD). Defaults to today, so only bids still open come back.",
                "title": "Due After"
              },
              "level": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "\"federal\", \"state\", \"local\" or \"private\" (bids private companies posted on FindMyBids, plus invitations the signed-in user saved).",
                "title": "Level"
              },
              "limit": {
                "default": 15,
                "description": "How many bids to return (default 15).",
                "title": "Limit",
                "type": "integer"
              },
              "naics": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "NAICS code prefixes, e.g. [\"5617\", \"238\"].",
                "title": "Naics"
              },
              "query": {
                "default": "",
                "description": "Keywords for the work, e.g. \"roof repair\", \"janitorial\". Commas mean OR: \"roofing, gutters\".",
                "title": "Query",
                "type": "string"
              },
              "set_aside": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
