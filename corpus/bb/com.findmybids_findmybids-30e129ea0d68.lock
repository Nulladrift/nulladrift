        {
          "name": "check_readiness",
          "title": "Check if I'm ready to bid",
          "description": "Check whether the user's business (their FindMyBids business profile) is ready to bid.\n\n    Give ONE of: bid_id (a FindMyBids bid ID), url (link to any bid page or PDF, any state or private client),\n    or text (pasted bid text). For url/text, also pass state (two letters), level (\"federal\"/\"state\"/\"local\"/\n    \"private\") and due_date (ISO) if known.\n    Returns a verdict, each requirement with status gap / check / ready / info, the sentence it came from,\n    walkthrough links for registration gaps, and an excerpt of the bid to confirm against.\n    Free accounts get 3 checks a month (shared with the website); Pro is unlimited.\n    ",
          "inputSchema": {
            "properties": {
              "bid_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A FindMyBids bid ID. Give one of bid_id, url or text.",
                "title": "Bid Id"
              },
              "due_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Due date (YYYY-MM-DD) if known, for url or text.",
                "title": "Due Date"
              },
              "level": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "\"federal\", \"state\", \"local\" or \"private\", for url or text.",
                "title": "Level"
              },
              "state": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Two-letter state code of the bid, for url or text.",
                "title": "State"
              },
              "text": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Pasted bid text. Give one of bid_id, url or text.",
                "title": "Text"
              },
              "title": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Bid title if known, for url or text.",
                "title": "Title"
              },
              "url": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Link to any bid page or PDF (any state or private client). Give one of bid_id, url or text.",
                "title": "Url"
              }
            },
