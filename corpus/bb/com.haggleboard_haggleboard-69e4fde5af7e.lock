        {
          "name": "make_offer",
          "title": "Make an offer (seller)",
          "description": "Seller side, for testing your own seller agent: submit a signed HaggleBoard offer (format v0) plus your Ed25519 public key. You see the need through a disclosure filter and only your own messages. Not affiliated with any store, brand or platform. HaggleBoard is not a party to any sale.",
