        {
          "name": "post_need",
          "title": "Post a need",
          "description": "Post a demo need with a shopper mandate. Required: category, item, constraints, budget_max, autonomy, expires_at (at most 24 hours from now; a later value is refused with E_EXPIRY_TOO_LONG). share is optional; share.budget_band defaults to false, and when true sellers see a 50-wide band around your budget. Fictional demo sellers answer at once. Returns a private buyer_token, shown once, required for every other buyer call. Do not include personal data. Not affiliated with any store, brand or platform. HaggleBoard is not a party to any sale.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "autonomy": {
                "oneOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "mode": {
                        "const": "collect",
                        "type": "string"
                      }
                    },
                    "required": ["mode"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "mode": {
                        "const": "auto_accept_under",
                        "type": "string"
                      },
                      "under": {
                        "additionalProperties": false,
                        "properties": {
                          "amount": {
                            "pattern": "^[0-9]{1,9}(\\.[0-9]{1,2})?$",
                            "type": "string"
                          },
                          "currency": {
                            "const": "EUR",
                            "type": "string"
                          }
                        },
                        "required": ["amount", "currency"],
                        "type": "object"
                      }
                    },
                    "required": ["mode", "under"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "mode": {
                        "const": "full",
                        "type": "string"
                      }
                    },
                    "required": ["mode"],
                    "type": "object"
                  }
                ]
              },
              "budget_max": {
                "additionalProperties": false,
                "properties": {
                  "amount": {
                    "pattern": "^[0-9]{1,9}(\\.[0-9]{1,2})?$",
                    "type": "string"
                  },
                  "currency": {
                    "const": "EUR",
                    "type": "string"
                  }
                },
                "required": ["amount", "currency"],
                "type": "object"
              },
              "category": {
                "enum": ["hotel", "electronics", "b2b"],
                "type": "string"
              },
              "constraints": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "maxLength": 120,
                      "type": "string"
                    },
                    {
                      "type": "number"
                    },
                    {
                      "type": "boolean"
                    }
                  ]
                },
                "propertyNames": {
                  "maxLength": 40,
                  "type": "string"
                },
                "type": "object"
              },
              "expires_at": {
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                "type": "string"
              },
              "include_test_sellers": {
                "description": "Default false. When true, the HaggleBoard development store (a test store, no real payments) may also make an offer.",
                "type": "boolean"
              },
              "item": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "maxLength": 120,
                      "type": "string"
                    },
                    {
                      "type": "number"
                    },
                    {
                      "type": "boolean"
                    }
                  ]
                },
                "propertyNames": {
                  "maxLength": 40,
                  "type": "string"
                },
                "type": "object"
              },
              "max_rounds": {
                "maximum": 10,
                "minimum": 2,
                "type": "integer"
              },
              "priorities": {
                "items": {
                  "enum": ["price", "speed", "returns", "extras"],
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "share": {
                "additionalProperties": false,
                "default": {
                  "budget_band": false,
                  "contact": false,
                  "reputation": false
                },
                "properties": {
                  "budget_band": {
                    "default": false,
                    "description": "Default false. When true, sellers see a band around your budget (50 wide for budgets of 100-999; 5 wide below 100; 250 wide from 1000), which reveals your budget fairly precisely.",
                    "type": "boolean"
                  },
                  "contact": {
                    "const": false,
                    "default": false,
                    "type": "boolean"
                  },
                  "reputation": {
                    "default": false,
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "target_price": {
                "additionalProperties": false,
                "properties": {
                  "amount": {
                    "pattern": "^[0-9]{1,9}(\\.[0-9]{1,2})?$",
                    "type": "string"
                  },
                  "currency": {
                    "const": "EUR",
                    "type": "string"
                  }
                },
                "required": ["amount", "currency"],
                "type": "object"
              },
              "walk_away": {
                "additionalProperties": false,
                "properties": {
                  "above": {
                    "additionalProperties": false,
                    "properties": {
                      "amount": {
                        "pattern": "^[0-9]{1,9}(\\.[0-9]{1,2})?$",
                        "type": "string"
                      },
                      "currency": {
                        "const": "EUR",
                        "type": "string"
                      }
                    },
                    "required": ["amount", "currency"],
                    "type": "object"
                  },
                  "after_rounds": {
                    "maximum": 10,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "type": "object"
              }
            },
            "required": ["autonomy", "budget_max", "category", "constraints", "expires_at", "item"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
