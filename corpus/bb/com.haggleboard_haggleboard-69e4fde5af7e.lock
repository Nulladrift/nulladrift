        {
          "name": "counter",
          "title": "Counter",
          "description": "Counter a demo seller's latest price. Must respect the mandate's walk_away. The seller replies at once. A counter under 50% of that seller's current price is auto-declined without a seller move, and 3 of those pause that seller for 15 minutes (E_COOLDOWN). Not affiliated with any store, brand or platform. HaggleBoard is not a party to any sale.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "buyer_token": {
                "maxLength": 64,
