{
  "lockfileVersion": 2,
  "subjects": {
    "com.ifthenpay/payments": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ai.ifthenpay.com/mcp/payments/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "ifthenpay-mcp",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "creditcard_create_payment",
          "description": "Creates a credit/debit card payment session and returns a payment URL. The customer is redirected to a hosted checkout page to complete payment with their card.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Payment amount in EUR (e.g. 10.50).",
                "type": "number"
              },
              "cancel_url": {
                "description": "URL to redirect the customer if they cancel the payment.",
                "type": "string"
              },
              "ccard_key": {
                "description": "ifthenpay Credit Card key.",
                "type": "string"
              },
              "error_url": {
                "description": "URL to redirect the customer if the payment fails.",
                "type": "string"
              },
              "language": {
                "description": "Language for the checkout page (e.g. \"pt\", \"en\"). Defaults to \"pt\".",
                "type": "string"
              },
              "order_id": {
                "description": "Unique order identifier in your system (max 15 characters).",
                "type": "string"
              },
              "success_url": {
                "description": "URL to redirect the customer after a successful payment.",
                "type": "string"
              }
            },
            "required": ["amount", "cancel_url", "ccard_key", "error_url", "order_id", "success_url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:27a2d54806610cfa916eefcb56f61d10e71ed84cbb6a554af27ecb6bf1aae4a7"
        },
        {
          "name": "mbway_check_status",
          "description": "Checks the status of a previously requested MB WAY payment. Returns pending, paid, declined, timeout, or cancelled.",
          "inputSchema": {
            "properties": {
              "mbway_key": {
                "description": "ifthenpay MB WAY key.",
                "type": "string"
              },
              "request_id": {
                "description": "Request ID returned by mbway_request_payment.",
                "type": "string"
              }
            },
            "required": ["mbway_key", "request_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c6a04e8a82ae0025155ee47489e4478346b735a8b6cde39f837ee678144fe581"
        },
        {
          "name": "mbway_request_payment",
          "description": "Sends an MB WAY payment request to the customer's mobile phone. The customer approves the payment in the MB WAY app. Use mbway_check_status to check the result.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Payment amount in EUR (e.g. 10.50).",
                "type": "number"
              },
              "description": {
                "description": "Short payment description shown in the MB WAY app.",
                "type": "string"
              },
              "mbway_key": {
                "description": "ifthenpay MB WAY key.",
                "type": "string"
              },
              "order_id": {
                "description": "Unique order identifier in your system (max 15 characters).",
                "type": "string"
              },
              "phone": {
                "description": "Customer mobile number in format \"351#912345678\" (country code # number).",
                "type": "string"
              }
            },
            "required": ["amount", "mbway_key", "order_id", "phone"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:51ce81d5003e35cbfaa4440628748395a1a41323f379f7bcfd74896834e6eaf8"
        },
        {
          "name": "multibanco_create_reference",
          "description": "Creates a Multibanco payment reference that the customer can use to pay at any ATM or via online banking in Portugal.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Payment amount in EUR (e.g. 10.50).",
                "type": "number"
              },
              "expiry_days": {
                "description": "Number of days until the reference expires. Defaults to no expiry if omitted.",
                "type": "integer"
              },
              "mb_key": {
                "description": "ifthenpay Multibanco key.",
                "type": "string"
              },
              "order_id": {
                "description": "Unique order identifier in your system.",
                "type": "string"
              }
            },
            "required": ["amount", "mb_key", "order_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a0eac6239cf973a054a1a065fab05e7a9e5171e93fc3245563ae8c4e996deff7"
        },
        {
          "name": "payments_list",
          "description": "Lists completed payments using the ifthenpay Backoffice Key. Filter by payment method, date range, order ID, reference or request ID. Returns up to 1000 most recent payments if no filters are applied.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Filter by exact payment amount.",
                "type": "string"
              },
              "bo_key": {
                "description": "ifthenpay Backoffice Key (provided when signing the contract).",
                "type": "string"
              },
              "date_end": {
                "description": "End date/time in format dd-MM-yyyy HH:mm:ss (e.g. 31-01-2024 23:59:59).",
                "type": "string"
              },
              "date_start": {
                "description": "Start date/time in format dd-MM-yyyy HH:mm:ss (e.g. 01-01-2024 00:00:00).",
                "type": "string"
              },
              "entity": {
                "description": "Payment method entity filter. Use: MB, MBWAY, PAYSHOP, CCARD, GOOGLE, APPLE, PIX, or a 5-digit Multibanco entity number. Leave blank for all methods.",
                "type": "string"
              },
              "order_id": {
                "description": "Filter by order identifier.",
                "type": "string"
              },
              "reference": {
                "description": "Filter by payment reference (Multibanco/Payshop reference or orderId for other methods).",
                "type": "string"
              },
              "request_id": {
                "description": "Filter by the unique request token returned at payment creation.",
                "type": "string"
              },
              "sub_entity": {
                "description": "Payment method key or sub-entity (e.g. MB KEY, MBWAY KEY, PAYSHOP KEY). Leave blank to match all.",
                "type": "string"
              }
            },
            "required": ["bo_key"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2be62f813f5f193c55932d5e3e9e4d015f22644e21696dfb673010188b4a2fee"
        },
        {
          "name": "payshop_create_reference",
          "description": "Creates a Payshop payment reference that the customer can use to pay at any Payshop agent or CTT (postal service) in Portugal.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Payment amount in EUR (e.g. 10.50).",
                "type": "number"
              },
              "expiry_date": {
                "description": "Expiry date in YYYYMMDD format (e.g. 20301231). Leave blank for no expiry.",
                "type": "string"
              },
              "order_id": {
                "description": "Unique order identifier in your system (max 25 characters).",
                "type": "string"
              },
              "payshop_key": {
                "description": "ifthenpay Payshop key.",
                "type": "string"
              }
            },
            "required": ["amount", "order_id", "payshop_key"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:942a22803e40ecaae8e272a1fc48c0b5af12c9413074816d59d27149ae92812e"
        },
        {
          "name": "pinpay_create_payment",
          "description": "Creates a Pay by Link / PINPAY payment. Returns a shareable payment URL and a PIN code. The hosted checkout supports multiple payment methods including Credit Card, Google Pay, and Apple Pay.",
          "inputSchema": {
            "properties": {
              "accounts": {
                "description": "Payment methods to show in the gateway, separated by semicolons. Format: METHOD|KEY (e.g. \"MBWAY|MBWAY-KEY;MB|MB-KEY;PAYSHOP|PAYSHOP-KEY;CCARD|CCARD-KEY\"). Leave blank to use gateway defaults.",
                "type": "string"
              },
              "amount": {
                "description": "Payment amount in EUR (e.g. 10.50).",
                "type": "number"
              },
              "btn_close_label": {
                "description": "Label text for the close/back button.",
                "type": "string"
              },
              "btn_close_url": {
                "description": "URL for the close/back button on the payment page.",
                "type": "string"
              },
              "cancel_url": {
                "description": "URL to redirect the customer if they cancel.",
                "type": "string"
              },
              "description": {
                "description": "Short description shown on the payment page (max 200 characters).",
                "type": "string"
              },
              "error_url": {
                "description": "URL to redirect the customer if the payment fails.",
                "type": "string"
              },
              "expiry_date": {
                "description": "Link expiry date in YYYYMMDD format (e.g. 20301231). Leave blank for no expiry.",
                "type": "string"
              },
              "gateway_key": {
                "description": "ifthenpay Gateway key for Pay by Link / PINPAY.",
                "type": "string"
              },
              "lang": {
                "description": "Language for the payment page: pt, en, es, fr. Defaults to pt.",
                "type": "string"
              },
              "order_id": {
                "description": "Unique order identifier in your system (max 15 characters).",
                "type": "string"
              },
              "otp": {
                "description": "One-time payment: \"true\" makes the link expire after a single payment.",
                "enum": ["true", "false"],
                "type": "string"
              },
              "selected_method": {
                "description": "Pre-select a payment method: 1=Multibanco, 2=MB WAY, 3=Payshop, 4=Credit Card, 8=Pix.",
                "enum": ["1", "2", "3", "4", "7", "8"],
                "type": "string"
              },
              "success_url": {
                "description": "URL to redirect the customer after a successful payment.",
                "type": "string"
              }
            },
            "required": ["amount", "gateway_key", "order_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:52eafed114b68ac3f59d4fef40b63758853d6777dca8b06925073a8aa981ad7f"
        },
        {
          "name": "pix_create_payment",
          "description": "Creates a PIX payment for Brazilian customers. Returns a payment URL and a QR code value. Customer must have a CPF number (Brazilian tax ID).",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Payment amount in BRL (e.g. 50.00).",
                "type": "number"
              },
              "customer_address": {
                "description": "Customer street address.",
                "type": "string"
              },
              "customer_city": {
                "description": "Customer city.",
                "type": "string"
              },
              "customer_cpf": {
                "description": "Customer CPF number (Brazilian tax ID), digits only (e.g. 74026594025).",
                "type": "string"
              },
              "customer_email": {
                "description": "Customer email address.",
                "type": "string"
              },
              "customer_name": {
                "description": "Full name of the customer (max 150 characters).",
                "type": "string"
              },
              "customer_phone": {
                "description": "Customer phone number including country code (e.g. +5585912345678).",
                "type": "string"
              },
              "customer_state": {
                "description": "Customer state (e.g. CE, SP).",
                "type": "string"
              },
              "customer_zip_code": {
                "description": "Customer postal/ZIP code.",
                "type": "string"
              },
              "description": {
                "description": "Short description or reference for the payment (max 200 characters).",
                "type": "string"
              },
              "order_id": {
                "description": "Unique order identifier in your system (max 25 characters).",
                "type": "string"
              },
              "pix_key": {
                "description": "ifthenpay PIX key.",
                "type": "string"
              },
              "redirect_url": {
                "description": "URL to redirect the customer after payment. Check payment status via the status API after redirect.",
                "type": "string"
              }
            },
            "required": ["amount", "customer_cpf", "customer_email", "customer_name", "customer_phone", "order_id", "pix_key", "redirect_url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d8c62c763b2d76aca10127fe9a00e305e95202f3941bc515bd7af5dbdc38e2b1"
        }
      ],
      "digest": "sha256:49e01b6579e5c1f5f2b61cd9c05f9058b4ae03bf271477acd9a09d811be3a0c2"
    }
  }
}
