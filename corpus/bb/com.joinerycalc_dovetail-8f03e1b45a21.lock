      },
      "serverInfo": {
        "name": "joinerycalc",
        "title": "Joinerycalc",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "dovetail_layout",
          "title": "Dovetail layout",
          "description": "Exact layout of a through dovetail joint, for hand-cut joints and router templates. Hand mode: give the board width, the thicknesses of both boards, the number of tails, the pin width at its narrow end and the angle (degrees per side, 1:N slope ratio, included angle or degrees from horizontal), in mm or inches; the tail width is computed. Router mode: give the tail width instead; the pins are spaced evenly and the router template is sized. Returns every tail and pin position and width on both faces (they sum exactly to the board width), tail and pin lengths, the angle in all four conventions, and warnings. Given measured socket dimensions, also recommends tail widths that fit them. Deterministic: use this instead of computing dovetail geometry yourself.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "angle": {
                "description": "Dovetail angle, read according to angleFormat. It must give a per-side angle from 1° to under 45°.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "angleFormat": {
                "default": "per_side_from_vertical",
                "description": "How to read angle: degrees per side from vertical (router bits: 7, 8, 14), slope ratio N for 1:N (6 for 1:6), included angle in degrees, or degrees from horizontal.",
                "enum": ["per_side_from_vertical", "slope_ratio", "included_angle", "from_horizontal"],
                "type": "string"
              },
              "boardWidth": {
                "description": "Width of both boards across the joint. Between 0.5 and 5000 mm (0.02 to 196.85 in).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "guideBushingDiameter": {
                "description": "Router mode: guide bushing diameter, larger than the bit. Default: the bit diameter plus 7 mm. Between 0.5 and 5000 mm (0.02 to 196.85 in).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "measuredSockets": {
                "description": "Socket dimensions as actually cut, measured on both sides. When given, the response recommends tail widths that fit them.",
                "properties": {
                  "left": {
                    "properties": {
                      "baseWidth": {
                        "description": "Socket width on the outside face of the pin board: the wide side. Between 0.5 and 5000 mm (0.02 to 196.85 in).",
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      "depth": {
                        "description": "Socket depth: for through dovetails, the pin board thickness. Between 0.5 and 5000 mm (0.02 to 196.85 in).",
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      "tipWidth": {
                        "description": "Socket width on the inside face of the pin board, where the tail enters: the narrow side. Between 0.5 and 5000 mm (0.02 to 196.85 in).",
                        "exclusiveMinimum": 0,
                        "type": "number"
                      }
                    },
                    "required": ["baseWidth", "depth", "tipWidth"],
                    "type": "object"
                  },
                  "right": {
                    "properties": {
                      "baseWidth": {
                        "description": "Socket width on the outside face of the pin board: the wide side. Between 0.5 and 5000 mm (0.02 to 196.85 in).",
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      "depth": {
                        "description": "Socket depth: for through dovetails, the pin board thickness. Between 0.5 and 5000 mm (0.02 to 196.85 in).",
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      "tipWidth": {
                        "description": "Socket width on the inside face of the pin board, where the tail enters: the narrow side. Between 0.5 and 5000 mm (0.02 to 196.85 in).",
                        "exclusiveMinimum": 0,
                        "type": "number"
                      }
                    },
                    "required": ["baseWidth", "depth", "tipWidth"],
                    "type": "object"
                  }
                },
                "required": ["left", "right"],
                "type": "object"
              },
              "mode": {
                "default": "hand",
                "description": "hand: give pinWidth, the tail width is computed. router: give tailWidth, the pins are spaced evenly.",
                "enum": ["hand", "router"],
                "type": "string"
              },
              "numberOfTails": {
                "description": "Number of tails.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "pinBoardThickness": {
                "description": "Thickness of the board the pins are cut on. Between 0.5 and 5000 mm (0.02 to 196.85 in).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "pinWidth": {
                "description": "Required in hand mode: pin width at its narrow end (the outside face of the pin board). Edge pins get the same narrow width. Between 0.5 and 5000 mm (0.02 to 196.85 in).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "routerBitDiameter": {
                "description": "Router mode: dovetail bit diameter, at most the tail width. Default: 8 mm, or the smallest bit that cuts the depth of the tails if larger. Between 0.5 and 5000 mm (0.02 to 196.85 in).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "tailBoardThickness": {
                "description": "Thickness of the board the tails are cut on. Between 0.5 and 5000 mm (0.02 to 196.85 in).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "tailWidth": {
                "description": "Required in router mode: tail width at its wide end. Between 0.5 and 5000 mm (0.02 to 196.85 in).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "unit": {
                "default": "mm",
                "description": "Unit of every length in the request and in the response.",
                "enum": ["mm", "inch"],
                "type": "string"
              }
            },
            "required": ["angle", "boardWidth", "numberOfTails", "pinBoardThickness", "tailBoardThickness"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
