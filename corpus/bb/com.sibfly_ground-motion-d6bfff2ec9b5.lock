{
  "lockfileVersion": 2,
  "subjects": {
    "com.sibfly/ground-motion": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://sibfly.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "sibfly",
        "version": "1.2.0",
        "description": "Measured ground motion (subsidence/uplift) per US address from NASA OPERA InSAR."
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Ground subsidence/uplift for US addresses (negative mm/yr = sinking). Decision tree: 0) no API key? register_agent (FREE) issues one instantly — save it and use it as the Bearer token; 1) get_coverage (FREE) or check_ground_motion with dry_run=true (FREE) to confirm coverage + cost; 2) check_ground_motion to buy the $0.40 report; route logic on assessment_code (rapid_subsidence/notable_subsidence/stable/mild_uplift/strong_uplift/no_clear_trend). Use max_age_days/min_confidence/since/require_significant to avoid paying for data you'd reject — those return FREE (require_significant=true skips paying when the rate would be no_clear_trend statistical noise; dry_run also returns likely_significant so you can predict answer quality before spending). check_portfolio for many addresses (supports max_spend_usd budget cap); get_coverage accepts addresses[] to size a whole job free; get_account for balance; get_usage for the billing ledger; out of credits? buy_credits returns a payment link (card or BTC). Misses are always free. Defaults: explain=false, compact=false.",
      "tools": [
        {
          "name": "ask_inspector",
          "description": "FREE follow-up Q&A with the SibFly Inspector about a report you ALREADY BOUGHT (buy via check_ground_motion first). Ask what the numbers mean for foundations, staleness, seasonal swings, etc. It answers only from the report's numbers (never invents), and won't give buy/walk-away advice. Per-account message allowance applies.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "the address of a report already purchased on this account",
                "type": "string"
              },
              "question": {
                "description": "your question about the report",
                "type": "string"
              }
            },
            "required": ["address", "question"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "reply": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Ask the Inspector (FREE, needs a bought report)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:23bff9a71ab3a4817fcc2278a18bc46707cb912784be280bd780e2d07cc371f8"
        },
        {
          "name": "buy_credits",
          "description": "Get a machine-usable payment link to top up credits (requires your Bearer API key). method 'stripe' returns a card checkout_url; 'crypto' returns a BTC invoice_url + txn_id. Open/relay the URL to complete payment; credits land automatically afterwards — confirm with get_account.",
          "inputSchema": {
            "properties": {
              "amount_usd": {
                "description": "1 to 10000 (USD)",
                "type": "number"
              },
              "method": {
                "description": "default stripe (card)",
                "enum": ["stripe", "crypto"],
                "type": "string"
              }
            },
            "required": ["amount_usd"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "amount_usd": {
                "type": "number"
              },
              "checkout_url": {
                "type": ["string", "null"]
              },
              "invoice_url": {
                "type": ["string", "null"]
              },
              "method": {
                "type": "string"
              },
              "status": {
                "type": "string"
              },
              "txn_id": {
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "readOnlyHint": false,
            "title": "Buy credits (payment link)"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d7f43ff964317b22e95795f6de37276353c17ab8db32d3eed567408952b38e92"
        },
        {
          "name": "check_ground_motion",
          "description": "Measured ground motion (sinking/uplift) for a US address or lat/lon, in mm/year AND in/year, from NASA OPERA Sentinel-1 InSAR. Costs $0.40 from your SibFly credits; out-of-coverage / too-stale / too-low-confidence / fuzzy-geocode return FREE. Use the gate params to avoid paying for data you'd reject. dry_run=true is a FREE coverage+cost preview.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "US street address",
                "type": "string"
              },
              "compact": {
                "description": "lean payload (fewer tokens)",
                "type": "boolean"
              },
              "dry_run": {
                "description": "FREE preview: coverage + would_cost + data age, no rate, no charge",
                "type": "boolean"
              },
              "explain": {
                "description": "add ground_brief: ~600 tokens of plain-English narration + FAQ (engine GL52 free tier / CL46 paying). Adds ~10s latency. Only set when a human will read the output; use ask_inspector for follow-up Q&A.",
                "type": "boolean"
              },
              "lat": {
                "type": "number"
              },
              "lon": {
                "type": "number"
              },
              "max_age_days": {
                "description": "if data older than this, return free instead of billing",
                "type": "integer"
              },
              "min_confidence": {
                "description": "0-1; below this, return free instead of billing",
                "type": "number"
              },
              "require_significant": {
                "description": "if the rate would be no_clear_trend (within its error bar), return FREE instead of billing — never pay for statistical noise",
                "type": "boolean"
              },
              "since": {
                "description": "YYYY-MM-DD; if no new data since this date, return free",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "assessment_code": {
                "enum": ["rapid_subsidence", "notable_subsidence", "stable", "mild_uplift", "strong_uplift", "no_clear_trend", null],
                "type": ["string", "null"]
              },
              "confidence": {
                "type": ["number", "null"]
              },
              "cost_usd": {
                "type": "number"
              },
              "credits_remaining_usd": {
                "type": ["number", "null"]
              },
              "data_age_days": {
                "type": ["integer", "null"]
              },
              "engine": {
                "description": "narration engine: GL52 (free tier) or CL46 (paying)",
                "type": ["string", "null"]
              },
              "ground_brief": {
                "description": "only when explain=true",
                "type": ["string", "null"]
              },
              "near_threshold": {
                "type": ["boolean", "null"]
              },
              "status": {
                "enum": ["ok", "no_data", "no_coverage", "stale_data", "low_confidence", "low_geocode_precision", "no_new_data"],
                "type": "string"
              },
              "velocity_uncertainty_mm_yr": {
                "type": ["number", "null"]
              },
              "velocity_vertical_in_yr": {
                "type": ["number", "null"]
              },
              "velocity_vertical_mm_yr": {
                "type": ["number", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Check ground motion ($0.40, misses free)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:01e4bb6b9efbf42b494618b01ddf23efaab2c8522a366c10bc0fa85a4d92b366"
        },
        {
          "name": "check_portfolio",
          "description": "Batch ground-motion for many US addresses in one call. Only covered addresses are billed ($0.40 each); misses and duplicate cells are free. If credits run out mid-batch the response status is 'insufficient_credits' and unbilled items are marked — top up (buy_credits) and retry them.",
          "inputSchema": {
            "properties": {
              "addresses": {
                "description": "up to 1000 US addresses (must be an ARRAY, not one string)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "max_spend_usd": {
                "description": "hard budget cap: billing stops at this total; over-budget items come back skipped_for_budget",
                "type": "number"
              }
            },
            "required": ["addresses"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "credits_remaining_usd": {
                "type": ["number", "null"]
              },
              "results": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "type": "string"
              },
              "summary": {
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Check many addresses ($0.40 per covered address)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0a196921a71b8ef365543a3e517abfc30a1e80fdebb4438d49011e52a2b8c0b2"
        },
        {
          "name": "get_account",
          "description": "FREE: your SibFly credit balance, price per report, reports remaining, and top-up URL.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "credits_usd": {
                "type": "number"
              },
              "price_per_report_usd": {
                "type": "number"
              },
              "reports_remaining_est": {
                "type": "integer"
              },
              "top_up_url": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Account balance (FREE)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:05388ceaf93195ae191d75c910a0d1d33cfb00d7605aab5d6840fde8b8f24e73"
        },
        {
          "name": "get_coverage",
          "description": "FREE pre-flight: is a US address/point covered, how stale is the data (data_age_days), and what a report would cost. Accepts ONE address/lat+lon, OR addresses[] (up to 1000, needs your Bearer key) to size a whole job before spending. Call this before spending.",
          "inputSchema": {
            "properties": {
              "address": {
                "type": "string"
              },
              "addresses": {
                "description": "batch mode: size a whole job in one free call",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "lat": {
                "type": "number"
              },
              "lon": {
                "type": "number"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "covered": {
                "type": "boolean"
              },
              "data_age_days": {
                "type": ["integer", "null"]
              },
              "frame": {
                "type": ["string", "null"]
              },
              "results": {
                "type": ["array", "null"]
              },
              "summary": {
                "type": ["object", "null"]
              },
              "would_cost_usd": {
                "type": ["number", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Coverage pre-flight (FREE)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e1d9f0a53cd5310dde5116815d109dce6aac5d6e49aebfa7a8c250a94e2b047b"
        },
        {
          "name": "get_motion_history",
          "description": "Multi-year cumulative motion history for an address. Pass from_date and to_date (YYYY-MM-DD) to get the movement between two dates. Costs $0.40 (misses free). dry_run=true is a FREE preview (points + dates + cost, no data); max_age_days returns free instead of billing for stale data.",
          "inputSchema": {
            "properties": {
              "address": {
                "type": "string"
              },
              "dry_run": {
                "description": "FREE preview: coverage + n_points + would_cost, no series, no charge",
                "type": "boolean"
              },
              "from_date": {
                "type": "string"
              },
              "lat": {
                "type": "number"
              },
              "lon": {
                "type": "number"
              },
              "max_age_days": {
                "description": "if data older than this, return free instead of billing",
                "type": "integer"
              },
              "to_date": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "cost_usd": {
                "type": "number"
              },
              "credits_remaining_usd": {
                "type": ["number", "null"]
              },
              "cum_mm": {
                "type": "array"
              },
              "dates": {
                "type": "array"
              },
              "delta": {
                "type": ["object", "null"]
              },
              "status": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Motion history ($0.40, misses free)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8d2897a096de8a25388682e8d71f5a7130b368270fdc55745fef656a026ab7d6"
        },
