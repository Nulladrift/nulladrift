          },
          "digest": "sha256:564eaa3ffd883f8787bbb1385dd00bbd7c8e5bb42dd391c780200740402a9dfc"
        },
        {
          "name": "register_agent",
          "description": "FREE: create a new SibFly account and get an API key + free starter credits in ONE call — no human, no captcha, no card. Use this when you have no API key. SAVE the returned api_key and pass it as the Bearer token on later calls (MCP clients: set it as the Authorization header).",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "a durable email address (disposable domains rejected)",
                "type": "string"
              },
              "password": {
                "description": "optional; auto-generated and returned if omitted",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "api_key": {
                "type": "string"
              },
              "credits_usd": {
                "type": "number"
              },
              "password": {
                "type": "string"
              },
              "price_per_report_usd": {
                "type": "number"
              },
              "reports_remaining": {
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "readOnlyHint": false,
            "title": "Self-register (FREE key + credits)"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
