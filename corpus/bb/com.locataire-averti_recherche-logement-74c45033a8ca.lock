      },
      "instructions": "Serveur MCP de Locataire Averti. Donne accès aux outils gratuits : Baromètre d'accessibilité locative, scoring dossier locataire, vérification loyer encadré, recherche ville idéale (TerriScore), fiches communes, analyse d'annonce, éligibilité HLM. Le baromètre ne retourne que les agrégats des éditions validées.",
      "tools": [
        {
          "name": "calculer_depot_garantie",
          "description": "Applique les règles légales françaises du dépôt de garantie en location (loi n° 89-462 du 6 juillet 1989, article 22) : plafond légal (1 mois de loyer hors charges en location nue, 2 mois en meublé, aucun dépôt en bail mobilité), délai de restitution (1 mois si l'état des lieux de sortie est conforme à celui d'entrée, sinon 2 mois) et majoration de retard (10 % du loyer mensuel hors charges par mois de retard commencé). Retourne : plafond, conformité du montant demandé, date limite de restitution, majoration due et démarche de recours. IMPORTANT : les retenues du bailleur doivent être justifiées par des devis ou factures ; cet outil ne juge pas le bien-fondé d'une retenue. À UTILISER quand l'utilisateur trouve le dépôt demandé trop élevé, ou attend le remboursement de son dépôt.",
          "inputSchema": {
            "properties": {
              "date_remise_cles": {
                "description": "Date de restitution des clés (format AAAA-MM-JJ), pour calculer le délai de restitution",
                "type": "string"
              },
              "depot_demande": {
                "description": "Montant du dépôt de garantie demandé ou versé en €",
                "type": "number"
              },
              "etat_lieux_conforme": {
                "description": "L'état des lieux de sortie est-il conforme à celui d'entrée ? (true → délai 1 mois, false → 2 mois)",
                "type": "boolean"
              },
              "loyer_mensuel_hors_charges": {
                "type": "number"
              },
              "montant_restitue": {
                "description": "Montant déjà restitué en €, si restitution partielle",
                "type": "number"
              },
              "retenues_justifiees_par_devis": {
                "description": "Le bailleur a-t-il fourni devis ou factures pour ses retenues ?",
                "type": "boolean"
              },
              "type_location": {
                "enum": ["nue", "meublee", "bail_mobilite"],
                "type": "string"
              }
            },
            "required": ["loyer_mensuel_hors_charges", "type_location"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1fa9b5f550f0d6bc76e9e067471736f739b06480f9d228162cfdf9030831a9cc"
        },
        {
          "name": "consulter_barometre_accessibilite",
          "description": "Consulte le Baromètre d'accessibilité locative Locataire Averti pour une commune française, dans la dernière édition validée. Retourne les agrégats publics par typologie et location vide/meublée : effectif, loyer médian charges comprises, revenu requis selon l'usage des trois fois le loyer, parts accessibles avec un ou deux Smic, intervalles et statut de publication. À UTILISER pour citer ou comparer des données d'accessibilité financière des annonces. Aucune donnée individuelle, aucune estimation si la commune n'atteint pas le seuil ; un résultat absent signifie non publiable, pas inaccessible. Citation : édition, méthode et URL fournies.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code_insee": {
                "description": "Code INSEE communal à cinq caractères, par exemple 75056 pour Paris ou 2A004 pour Ajaccio.",
                "type": "string"
              },
              "location": {
                "description": "Filtre optionnel, tous par défaut. Vide et meublé ne sont jamais fusionnés.",
                "enum": ["tous", "vide", "meuble"],
                "type": "string"
              },
              "typologie": {
                "description": "Filtre optionnel ; sans filtre, toutes les typologies publiables sont retournées.",
                "enum": ["studio", "T2", "T3", "T4+"],
                "type": "string"
              }
            },
            "required": ["code_insee"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:80c30fa6b8e78a037ac53c82c2b658de306f8b634a4883575ddffd03abed56a6"
        },
        {
          "name": "detecter_risques_annonce",
          "description": "Contrôles gratuits SANS IA du TEXTE d'une annonce française (texte collé, pas une URL). Recherche uniquement des signaux explicites : versement avant visite, modes de paiement à risque, envoi de clés, échange exclusivement hors plateforme et demandes de données sensibles. Retourne les signaux et vérifications manuelles, sans extraction des caractéristiques, contrôle des prix ou identité. Aucun texte conservé. AUCUN score ni conclusion de légitimité ou de sécurité : l'absence de signal ne prouve rien. Si une URL est fournie, demander le texte copié-collé.",
          "inputSchema": {
            "properties": {
              "loyer_cc": {
                "description": "Loyer charges comprises en €, si connu",
                "type": "number"
              },
              "surface_m2": {
                "description": "Surface habitable en m², si connue",
                "type": "number"
              },
              "texte_annonce": {
                "description": "Texte complet de l'annonce, copié-collé depuis la plateforme (80 caractères minimum)",
                "type": "string"
              },
              "ville": {
                "description": "Ville du logement, si connue et non mentionnée dans le texte",
                "type": "string"
              }
            },
            "required": ["texte_annonce"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5730af9a15cab5ac00cb631a69a56da23615715d3507af241e218786a4f7e1c1"
        },
        {
          "name": "diagnostic_eligibilite_hlm",
          "description": "Compare un revenu fiscal de référence aux plafonds de ressources du logement social (HLM) en France et indique la catégorie de financement correspondante (PLAI / PLUS / PLS) ainsi que les démarches officielles. IMPORTANT : cet outil ne restitue AUCUN délai d'attribution (aucune statistique publique opposable à une situation individuelle) et aucune priorité déduite du financement — la priorité relève des critères de l'article L441-1 du CCH, du DALO et de la cotation locale. Le millésime des plafonds doit être revérifié (arrêté annuel). À UTILISER quand l'utilisateur a des revenus modestes ou est en situation difficile.",
          "inputSchema": {
            "properties": {
              "nombre_personnes_foyer": {
                "type": "number"
              },
              "revenu_fiscal_reference": {
                "description": "Revenu fiscal de référence annuel (ligne 25 avis imposition N-2)",
                "type": "number"
              },
              "zone_geographique": {
                "enum": ["Paris", "Ile-de-France", "Province", "Outre-mer"],
                "type": "string"
              }
            },
            "required": ["nombre_personnes_foyer", "revenu_fiscal_reference", "zone_geographique"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:aa649312d6102a07abdf114d6ff7430e5896100a01e469d9cd1f1e19887fd0ab"
        },
        {
          "name": "est_ce_une_bonne_ville_pour_locataire",
          "description": "Restitue les indicateurs TerriScore d'une commune française utiles à un locataire : indice composite sur 100, sous-indices (sécurité SSMSI, transport, économie INSEE, éducation, cadre de vie, tension locative), points forts et points faibles dérivés des seuls sous-indices renseignés. Les indices sont à l'échelle de la COMMUNE, pas du quartier, et un sous-indice absent vaut null (donnée manquante, pas moyenne). À UTILISER quand l'utilisateur évalue une ville cible (ex : « est-ce que Rennes c'est bien pour louer ? »).",
          "inputSchema": {
            "properties": {
              "budget_loyer_max": {
                "description": "Budget loyer CC max envisagé en € (affine le verdict)",
                "type": "number"
              },
              "nom_ou_code_postal": {
                "description": "Nom de commune ou code postal",
                "type": "string"
              }
            },
            "required": ["nom_ou_code_postal"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c98d2d10a1a5d610a73d1ce39ea8df93fd8ecb75fc916f45638f33a8d4dffc66"
        },
        {
          "name": "evaluer_chances_location",
          "description": "Évalue la solidité d'un dossier locataire en France au regard des critères usuels des bailleurs : ratio revenus/loyer (3× est un usage, pas une obligation légale), stabilité professionnelle, garant, garantie Visale. Retourne : indicateur interne sur 100, niveau de complétude du dossier, points faibles, actions prioritaires. IMPORTANT : cet outil ne fournit AUCUNE probabilité d'acceptation et ne prédit pas la décision du bailleur, qui reste discrétionnaire — ne présente jamais l'indicateur comme un pronostic. À UTILISER quand l'utilisateur demande ce qui manque à son dossier avant d'envoyer une candidature.",
          "inputSchema": {
            "properties": {
              "a_un_garant": {
                "description": "Garant physique (personne se portant caution)",
                "type": "boolean"
              },
              "anciennete_pro_mois": {
