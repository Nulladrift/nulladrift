        {
          "name": "rechercher_annonces",
          "description": "Recherche des annonces de LOCATION en France dans le moteur Locataire Averti (mêmes filtres et exclusions que locataire-averti.com/annonces : pas de vente, colocation, bureau, annonce retirée). Filtres : ville ou code postal, département, budget loyer max, surface min, pièces min, meublé, type (maison/appartement), source. Retourne titre, loyer, surface, pièces, ville, DPE, photo et lien vers la fiche. Les coordonnées des agences ne sont jamais renvoyées (réservées aux clients). Aucune garantie de disponibilité : vérifier sur la fiche.",
