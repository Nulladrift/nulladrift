          "description": "Propose un plan d'action pour compléter un dossier locataire en France. Indique : leviers disponibles (garantie Visale, garant, colocation, justificatifs autorisés par le décret n° 2015-1437), actions classées par priorité et par effort, et pondération interne de chaque levier. IMPORTANT : les pondérations ne sont PAS des variations de probabilité d'acceptation — cet outil ne chiffre aucun taux de refus évité. À UTILISER quand l'utilisateur veut savoir quoi ajouter à son dossier ou a essuyé des refus.",
