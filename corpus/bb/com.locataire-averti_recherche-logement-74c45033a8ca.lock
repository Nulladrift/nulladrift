        {
          "name": "verifier_eligibilite_visale",
          "description": "Vérifie l'éligibilité à la garantie Visale (Action Logement), caution gratuite pour le locataire : bornes d'âge, statut et contrat, plafond de loyer par zone Visale, taux d'effort maximal, APL comptée à 67 %. Retourne : éligible oui/non, motifs, blocages, plafond de loyer de la zone, taux d'effort. IMPORTANT : la décision finale appartient à Action Logement, et le bailleur reste libre d'accepter ou non la caution Visale. Le zonage Visale est distinct du zonage APL. À UTILISER quand l'utilisateur n'a pas de garant, ou cherche une caution gratuite.",
          "inputSchema": {
            "properties": {
              "age": {
                "type": "number"
              },
