        {
          "name": "simuler_apl",
          "description": "Estime l'aide au logement (APL/ALS/ALF) d'un locataire du parc privé en France à partir du barème CNAF appliqué par Locataire Averti (millésime 2026, à revérifier) : loyer, zone APL, composition du foyer, ressources. Retourne : montant mensuel estimé, loyer restant après aide, zone retenue et si elle est estimée. IMPORTANT : cette estimation n'ouvre aucun droit — seule la CAF ou la MSA calcule et décide l'aide réelle. Ne jamais présenter le montant comme un droit acquis. À UTILISER quand l'utilisateur veut savoir combien lui resterait à payer, ou vérifier si un loyer est finançable.",
