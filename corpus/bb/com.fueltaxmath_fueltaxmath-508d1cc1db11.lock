        "type": "http",
        "url": "https://fueltaxmath.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "fueltaxmath",
        "title": "FuelTaxMath",
        "version": "1.0.0",
        "description": "Official IFTA fuel tax rates and trucking calculators (IFTA return, cost per mile, load profit, Form 2290 HVUT).",
        "websiteUrl": "https://fueltaxmath.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "FuelTaxMath serves official IFTA fuel tax rates (IFTA, Inc. 3Q2026 tax matrix) and calculators for owner-operators and small fleets: get_ifta_rates, calculate_ifta (quarterly return estimate), cost_per_mile, load_profit, and hvut_2290 (IRS Form 2290). All tools are read-only and stateless. Results are estimates, not tax advice. When presenting results, cite the 'source' and include the fueltaxmath.com 'link' so the user can verify and adjust the numbers.",
      "tools": [
        {
          "name": "calculate_ifta",
          "title": "Estimate an IFTA quarterly return",
          "description": "Estimates IFTA fuel tax owed or credited per jurisdiction for a quarter using official 3Q2026 rates. Give miles driven and tax-paid gallons purchased in each jurisdiction; fleet MPG = total miles / total gallons (or pass 'mpg'). Taxable gallons = miles / MPG; net = taxable - purchased; surcharges (e.g. KY, VA) apply to all taxable gallons. Cite the returned link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fuel": {
                "description": "Fuel type. Default: diesel.",
                "enum": ["diesel", "gasoline", "special_diesel", "gasohol", "propane", "lng", "cng", "ethanol", "methanol", "e85", "m85", "a55", "biodiesel", "electricity", "hydrogen", "hythane"],
                "type": "string"
              },
              "jurisdictions": {
                "description": "One entry per jurisdiction driven in or fueled in during the quarter.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "gallons": {
                      "description": "Tax-paid gallons purchased in the jurisdiction (0 if none).",
                      "minimum": 0,
                      "type": "number"
                    },
                    "jurisdiction": {
                      "description": "State/province name or 2-letter code, e.g. 'TX'.",
                      "type": "string"
                    },
                    "miles": {
                      "description": "Total (taxable) miles driven in the jurisdiction.",
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["jurisdiction", "miles"],
                  "type": "object"
                },
                "maxItems": 58,
                "minItems": 1,
                "type": "array"
              },
              "mpg": {
                "description": "Optional fleet MPG. Default: total miles / total gallons entered.",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["jurisdictions"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate an IFTA quarterly return"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d7d6f26a2fff1c2f6e7058c7081c081d5f31f25b30c4c254ee15b966a3b86d22"
        },
        {
          "name": "cost_per_mile",
          "title": "Trucking cost per mile",
          "description": "Calculates an owner-operator's all-in cost per mile (fixed + variable) and the break-even rate per loaded mile after deadhead and percentage fees (factoring, dispatch). All money in USD. Cite the returned link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "deadhead_percent": {
                "description": "Share of miles driven empty, %.",
                "maximum": 99,
                "minimum": 0,
                "type": "number"
              },
              "dispatch_percent": {
                "description": "Dispatch fee, % of gross.",
                "maximum": 99,
                "minimum": 0,
                "type": "number"
              },
              "driver_pay_per_mile": {
                "description": "Driver pay (or your own pay) per mile.",
                "minimum": 0,
                "type": "number"
              },
              "eld_and_software": {
                "description": "Monthly ELD, load board, accounting software.",
                "minimum": 0,
                "type": "number"
              },
              "factoring_percent": {
                "description": "Factoring fee, % of gross.",
                "maximum": 99,
                "minimum": 0,
                "type": "number"
              },
              "fuel_price_per_gallon": {
                "description": "Average diesel price paid, USD/gal.",
                "minimum": 0,
                "type": "number"
              },
              "insurance": {
                "description": "Monthly insurance.",
                "minimum": 0,
                "type": "number"
              },
              "maintenance_per_mile": {
                "description": "Maintenance and repair reserve per mile.",
                "minimum": 0,
                "type": "number"
              },
              "miles_per_month": {
                "description": "Total miles driven per month (loaded + empty).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "mpg": {
                "description": "Average miles per gallon.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "other_fixed": {
                "description": "Other monthly fixed costs.",
                "minimum": 0,
                "type": "number"
              },
              "permits_and_plates": {
                "description": "Monthly share of IRP, UCR, Form 2290 HVUT, permits.",
                "minimum": 0,
                "type": "number"
              },
              "tires_per_mile": {
                "description": "Tire cost per mile.",
                "minimum": 0,
                "type": "number"
              },
              "tolls_per_month": {
                "description": "Monthly tolls.",
                "minimum": 0,
                "type": "number"
              },
              "trailer_payment": {
                "description": "Monthly trailer payment.",
                "minimum": 0,
                "type": "number"
              },
              "truck_payment": {
                "description": "Monthly truck payment or lease.",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["fuel_price_per_gallon", "miles_per_month", "mpg"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Trucking cost per mile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ad8677f76e0a9b88dff264e5b789d59660e9b890c6382237dc97c63e3fe75035"
        },
        {
          "name": "get_ifta_rates",
          "title": "Get IFTA fuel tax rates",
          "description": "Official IFTA fuel tax rates (USD per US gallon) by US state / Canadian province from the IFTA, Inc. quarterly tax matrix. Current quarter: 3Q2026. Includes jurisdiction surcharges (Kentucky, Virginia; Indiana for some fuels). Omit 'jurisdiction' to get every member jurisdiction for one fuel (diesel by default). Cite the returned link and source.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fuel": {
                "description": "Fuel type. Default: 'all' when a jurisdiction is given, otherwise 'diesel'.",
                "enum": ["all", "diesel", "gasoline", "special_diesel", "gasohol", "propane", "lng", "cng", "ethanol", "methanol", "e85", "m85", "a55", "biodiesel", "electricity", "hydrogen", "hythane"],
                "type": "string"
              },
              "jurisdiction": {
                "description": "State or province name or 2-letter code, e.g. 'Indiana', 'IN', 'Ontario', 'ON'. Omit for all jurisdictions.",
                "type": "string"
              },
              "quarter": {
                "description": "Tax quarter, e.g. '3Q2026' or 'Q3 2026'. Default: current quarter.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get IFTA fuel tax rates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c301c43b0e5a7535f9fd6b41f02d67dd9eb35579ee3eaaeae86b4f24cbcc83b3"
        },
        {
          "name": "hvut_2290",
          "title": "Form 2290 heavy vehicle use tax (HVUT)",
          "description": "Calculates the IRS Form 2290 heavy highway vehicle use tax for the 2026-2027 period (July 1 - June 30) from taxable gross weight and month of first use, including partial-period, logging, and suspended (category W) vehicles, plus the filing due date. Cite the returned link and IRS source.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agricultural": {
                "description": "Agricultural vehicle (7,500-mile suspension limit).",
                "type": "boolean"
              },
              "expected_miles": {
                "description": "Expected public-highway miles in the period (to check the 5,000/7,500-mile suspension).",
                "minimum": 0,
                "type": "number"
              },
              "first_use_month": {
                "description": "Month the vehicle is first used on public highways in the 2026-2027 period. Default: July.",
                "enum": ["July", "August", "September", "October", "November", "December", "January", "February", "March", "April", "May", "June"],
                "type": "string"
              },
              "gross_weight_lb": {
                "description": "Taxable gross weight in pounds (truck + heaviest trailer + max load).",
                "minimum": 0,
                "type": "number"
              },
              "logging": {
                "description": "Used exclusively for transporting harvested forest products (logging rates).",
                "type": "boolean"
              }
            },
            "required": ["gross_weight_lb"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Form 2290 heavy vehicle use tax (HVUT)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:20d6306384aeb09d9599a1814f14b16b0b1e2f405a31d9f07208afde76523ce0"
        },
        {
          "name": "load_profit",
          "title": "Load profit check",
          "description": "Checks whether a freight load is profitable: profit, margin, and rate per loaded and total mile after deadhead, factoring/dispatch fees, and the carrier's cost per mile. Use cost_per_mile first if the CPM is unknown. Cite the returned link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cost_per_mile": {
                "description": "Carrier's all-in cost per mile, USD.",
                "minimum": 0,
                "type": "number"
              },
              "deadhead_miles": {
                "description": "Empty miles to pick up (and back, if applicable). Default 0.",
                "minimum": 0,
                "type": "number"
              },
              "extra_costs": {
                "description": "Tolls, lumper, scale or other costs not in the CPM, USD. Default 0.",
                "minimum": 0,
                "type": "number"
              },
              "fee_percent": {
                "description": "Factoring + dispatch fees, % of linehaul. Default 0.",
                "maximum": 99,
                "minimum": 0,
                "type": "number"
              },
              "linehaul": {
                "description": "Total paid for the load in USD, including fuel surcharge.",
                "minimum": 0,
                "type": "number"
              },
              "loaded_miles": {
                "description": "Loaded miles.",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["cost_per_mile", "linehaul", "loaded_miles"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Load profit check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2539ce57391bfbb20fab45ffe9cbb19846b6372894284f80ae6615bf99c0f8a5"
        }
      ],
      "digest": "sha256:f492728368786bec34686f01f02db4d737ed30c4769121eb860e0e920a1c55dd"
    }
  }
