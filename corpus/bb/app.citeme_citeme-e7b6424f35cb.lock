        "name": "CiteMe",
        "title": "CiteMe Citation Integrity",
        "version": "1.2.0",
        "description": "Search scholarly databases, format citations in 60+ styles, and verify a pasted bibliography against real academic records.",
        "websiteUrl": "https://citeme.app/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
