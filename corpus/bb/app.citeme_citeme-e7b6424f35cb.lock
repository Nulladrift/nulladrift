      "instructions": "CiteMe checks citations against scholarly records (CrossRef, OpenAlex, PubMed, Semantic Scholar, Google Books) and returns evidence, not verdicts.\n\nChoosing a tool:\n- search_citations — the user needs to FIND a source.\n- format_citation — the user already has complete metadata and wants it styled.\n- check_references — the user already has citations and wants them verified. Use this for any bibliography that was generated, extracted, or pasted, including one you produced yourself.\n\nReporting check_references results. Read these as behaviour, not as calibrated probabilities:\n- [NOT FOUND] and [FABRICATED?] are different signals; never merge them. Fabricated references do fail to verify, but so does a large share of real ones — works that are not indexed, grey literature, or simply missed. Always report [NOT FOUND] as needing human review, never as a confirmed fake.\n- [FABRICATED?] is the separate, conservative risk flag. It is tuned to raise few false alarms rather than to catch everything, so it misses some fabrications and will occasionally flag a real source. Report it as likely fabricated — never as proven.\n- A match does NOT confirm the fields are correct. This tool reports a status, and most field-level corruption does not change that status: a wrong year, journal, volume, or page range on a source that genuinely exists usually still comes back matched. Tell the user to verify those by hand.\n- [GREY LITERATURE] means the work is plausibly real but not indexed in these databases. [RETRACTED] means the record exists and was withdrawn — surface it, do not treat it as a clean match.\n\nFrozen-corpus evidence (369 references, public MCP profile, 2026-08-09): all 80 fabricated references remained unverified; field-level issues were detected in 85% (85/100) of corrupted references, but only 28% changed visible status. The older recall and false-positive figures for [FABRICATED?] were withdrawn after a production coverage audit found a non-independent search-count signal. These are corpus rates, not calibrated probabilities for real traffic.",
      "tools": [
        {
          "name": "check_references",
          "description": "Verify a user-provided bibliography against scholarly sources and return match status, identifiers, and citation issues. Results may be cached for up to six hours and usage may be logged; the bibliography is not published or added to an account. With a CiteMe API key, references matched to a record may also be sent to Typesafe for a second identity check, under zero data retention.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "text": {
                "description": "Raw bibliography text (one reference per line, or a full references section)",
                "maxLength": 50000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check References"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1f67316657e0589e796d2bed178c9b5a2b49b0ea1e960abbbfb4ece795bb8afd"
        },
