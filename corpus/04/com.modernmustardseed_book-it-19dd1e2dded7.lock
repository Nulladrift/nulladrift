{
  "lockfileVersion": 2,
  "subjects": {
    "com.modernmustardseed/book-it": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://book.modernmustardseed.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Book It by Modern Mustard Seed",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Book It lists local home-service and trade businesses that enrolled themselves: their services, the price ranges they entered, the ZIPs they serve and the windows they take work. find_provider lists enrolled businesses for a trade and ZIP. get_services returns one business's services, ranges, area and hours. quote_range returns the range a business entered for one service, or says it has none; Book It never estimates a price. check_availability returns the windows a business accepts requests for. request_booking sends a business a booking request that the business confirms itself; it is never a confirmed appointment, and it is sent only after the person agrees to the consent text.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Check request windows",
          "description": "List the windows a Book It business accepts booking requests for, by date in the business's time zone, after its minimum notice and without its days off, for up to 14 days at a time. Each window has a window_id for request_booking. A window is when the business says it can take work, not a confirmed slot.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "business_id": {
                "description": "The business_id exactly as find_provider returned it, such as \"juniper-ridge-roofing\".",
                "maxLength": 80,
                "minLength": 3,
                "type": "string"
              },
              "days": {
                "description": "How many days to show, 1 to 14. Defaults to 7.",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "from_date": {
                "description": "First date to show, YYYY-MM-DD, in the business's time zone. Defaults to today there.",
                "maxLength": 10,
                "type": "string"
              }
            },
            "required": ["business_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check request windows"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ab26d0ec34aa07f84af69ee71b0ef5bc8eb3724d5179d30ec285cda2f32f0478"
        },
        {
          "name": "find_provider",
          "title": "Find a local provider",
          "description": "Find home-service and trade businesses enrolled in Book It that serve a US ZIP code for a trade, such as HVAC, plumbing, roofing or lawn care. Returns each business's name, phone, website, the services that match the stated need, and its next open request window. Only businesses that enrolled and list that ZIP in their own service area appear; the result states the ordering rule, which is a fair daily rotation and never paid placement. An empty list means no enrolled business covers that trade and ZIP yet.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "need": {
                "description": "What the person needs in a few words, such as \"furnace blowing cold air\". Used to surface matching services.",
                "maxLength": 300,
                "type": "string"
              },
              "trade": {
                "description": "The trade or a common name for it: \"hvac\", \"furnace repair\", \"plumber\", \"roofer\", \"lawn care\", \"tree service\".",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "zip": {
                "description": "The 5-digit US ZIP code where the work is.",
                "pattern": "^\\d{5}$",
                "type": "string"
              }
            },
            "required": ["trade", "zip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a local provider"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aa962e57d439c9cbb399631dfed8865130e22f9f95ae7ab23c0082650067619f"
        },
        {
          "name": "get_services",
          "title": "Get a business's services",
          "description": "Get one Book It business's services with any price range the business entered, its service-area ZIPs, its weekly hours for requests, its next open window, and the consent text a person agrees to before a booking request is sent.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "business_id": {
                "description": "The business_id exactly as find_provider returned it, such as \"juniper-ridge-roofing\".",
                "maxLength": 80,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["business_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a business's services"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1e81fc793d2e0a691693deae3966ae618ad5b9407f6f846f1e621c891442d55c"
        },
        {
          "name": "quote_range",
          "title": "Get a business's price range",
          "description": "Return the price range a Book It business entered for one of its services, labelled as the business's own range and not a quote. When the business entered no range, says so. Book It never estimates, averages or invents a price.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "business_id": {
                "description": "The business_id exactly as find_provider returned it, such as \"juniper-ridge-roofing\".",
                "maxLength": 80,
                "minLength": 3,
                "type": "string"
              },
              "service": {
                "description": "Instead of service_id, the service name as the business lists it, such as \"Furnace repair\".",
                "maxLength": 80,
                "type": "string"
              },
              "service_id": {
                "description": "The service_id from get_services or find_provider.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["business_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a business's price range"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:75a01a4b2743bf3df0c27dad3fc40f56603bd9557e6a6311cf4c00e628348887"
        },
        {
          "name": "request_booking",
          "title": "Send a booking request",
          "description": "Send a Book It business a booking request on a person's behalf. Collects only the person's name, phone, ZIP, what they need and a preferred time. The business receives it by email and in its inbox and confirms a time with the person directly; the request is never a confirmed appointment. Requires consent_confirmed true, which means the person read and agreed to the business's booking_consent_text (from get_services or check_availability). US and Canadian phone numbers only. A repeat request from the same phone to the same business within 24 hours returns the first request instead of sending another.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "business_id": {
                "description": "The business_id exactly as find_provider returned it, such as \"juniper-ridge-roofing\".",
                "maxLength": 80,
                "minLength": 3,
                "type": "string"
              },
              "consent_confirmed": {
                "description": "True only after the person read the business's booking_consent_text and agreed to it.",
                "type": "boolean"
              },
              "customer_name": {
                "description": "The person's name, at least a first name.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "customer_phone": {
                "description": "A US or Canadian phone number the business can call or text, such as (406) 555-0123.",
                "maxLength": 25,
                "minLength": 10,
                "type": "string"
              },
              "customer_zip": {
                "description": "The 5-digit ZIP where the work is. It must be in the business's service area.",
                "pattern": "^\\d{5}$",
                "type": "string"
              },
              "need": {
                "description": "What the person needs, in their words, such as \"Furnace runs but blows cold air.\"",
                "maxLength": 600,
                "minLength": 5,
                "type": "string"
              },
              "preferred_time_note": {
                "description": "A short preferred time in words, such as \"any weekday morning\", when no window fits.",
                "maxLength": 120,
                "type": "string"
              },
              "preferred_window_id": {
                "description": "A window_id from check_availability, such as \"2026-10-15@08:00-12:00\".",
                "maxLength": 40,
                "type": "string"
              },
              "service_id": {
                "description": "Optional service_id from get_services.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["business_id", "consent_confirmed", "customer_name", "customer_phone", "customer_zip", "need"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send a booking request"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:98850166f6199fe2c1521dc28bb075878cdc870191eca8e0523a556d6db0a6fd"
        }
      ],
      "digest": "sha256:2d1f9c744b336557404c45f6111d1c18f7a82069f4acad6e283e29deb3312fc4"
    }
  }
}
