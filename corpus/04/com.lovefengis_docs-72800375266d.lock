{
  "lockfileVersion": 2,
  "subjects": {
    "com.lovefengis/docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://lovefengis.com/mcp/docs"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "lovefengis-docs",
        "title": "lovefengis developer documentation",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only search over the lovefengis developer documentation (REST API, MCP server, CLI, versioning policy, llms.txt, agent auth). Use search_docs to find a page, then get_doc with its slug to read it as Markdown. For prices and services use the main MCP server at https://lovefengis.com/mcp.",
      "tools": [
        {
          "name": "get_doc",
          "title": "Get one document",
          "description": "Get the full Markdown of one documentation page by slug. Slugs come from search_docs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "One of: overview, rest-api, mcp, cli, versioning, llms, auth.",
                "maxLength": 40,
                "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:05613d35f744a59b9265615a9088d40e85caf85e5e5c332c528f7154af19e3b0"
        },
        {
          "name": "search_docs",
          "title": "Search developer docs",
          "description": "Keyword search over the lovefengis developer documentation. Returns matching pages with slug, title, URL and a short excerpt, best match first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Search text, for example \"rate limit\" or \"mcp tools\".",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:89e0aff873c48206f37098a9c837dcfa4be86473a3d1e66ec12c0980d353ae07"
        }
      ],
      "digest": "sha256:18b7f831a3359fea0a56c5d237281fe855237d711719f2b760fc4d46cee1d712"
    }
  }
}
