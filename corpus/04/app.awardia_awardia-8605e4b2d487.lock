{
  "lockfileVersion": 2,
  "subjects": {
    "app.awardia/awardia": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://awardia.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Awardia",
        "title": "Awardia: EU public tenders and awards",
        "version": "0.1.0",
        "websiteUrl": "https://awardia.app"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Awardia returns public procurement records from official sources (TED, Portal BASE, Diário da República). When you use them: report facts and say which source and period they cover; treat price ranges, win rates and rival lists as estimates from past records, not certainties. Never present the data as evidence of corruption, fraud or other wrongdoing by a company or public body: patterns such as repeated direct awards have many lawful explanations. Do not help coordinate bids, prices or market sharing between competitors (bid rigging is illegal). Do not try to identify or profile private individuals; sole traders are shown as 'Pessoa singular' on purpose. This is not legal advice: for eligibility, exclusion or contract terms, point to the official tender documents. When the user pastes a tender link (awardia.app/t/…, TED or Portal BASE), pass it as tender_id to bid_intelligence. Terms of use: https://awardia.app/terms",
      "tools": [
        {
          "name": "award_history",
          "description": "Free during beta. Who won past public contracts, at what price, against how many bidders, and by which procedure (open call, prior consultation, direct award). Filter by buyer, winner, CPV sector and region. For Portugal covers every public contract (Portal BASE), incl. small direct awards. Returns summary stats, top winners and recent awards.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "buyer": {
                "description": "Part of the contracting authority's name",
                "maxLength": 200,
                "type": "string"
              },
              "countries": {
                "description": "ISO 3166-1 alpha-2 country codes where the work is performed, e.g. [\"PT\",\"ES\"]",
                "items": {
                  "maxLength": 2,
                  "minLength": 2,
                  "type": "string"
                },
                "type": "array"
              },
              "cpv_prefixes": {
                "description": "CPV code prefixes; '45' = construction, '72' = IT services, '3021' = computers",
                "items": {
                  "maxLength": 8,
                  "minLength": 2,
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "description": "Max results, default 10, max 25",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "region": {
                "description": "Place name: district or municipality (e.g. 'Lisboa', 'Sintra'). Matches the work location or the buyer's name; most precise for Portugal.",
                "maxLength": 100,
                "type": "string"
              },
              "since": {
                "description": "ISO date, e.g. 2024-01-01",
                "type": "string"
              },
              "winner": {
                "description": "Part of the winning company's name",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Past contract awards"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:be9f3914fc2f2a2500e19a77fef97df1981288cd2577271bb3b05266a4fc1fa0"
        },
        {
          "name": "bid_intelligence",
          "description": "Free during beta. Should I bid, and at what price? For an open tender (tender_id from search_tenders/match_company, or a pasted tender link) or a buyer+sector, analyses comparable past contracts: typical number of bidders, share of single-bid contests, how far below the estimate winners bid, a price range for this tender, incumbents, the companies that most often bid (with win rates), how often the buyer awards without an open call, and recent awards. Compares with the same buyer and sector, else the same kind of work nearby (district). States its sample size. Does not read the tender documents.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "buyer": {
                "description": "Buyer name or tax id (if no tender_id)",
                "maxLength": 200,
                "type": "string"
              },
              "country": {
                "description": "ISO alpha-2 country, e.g. PT",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "cpv": {
                "description": "CPV code or prefix of the sector (if no tender_id)",
                "maxLength": 8,
                "type": "string"
              },
              "tender_id": {
                "description": "Id of an open tender, e.g. '673746-2026', or a link to it (awardia.app/t/…, TED or Portal BASE page)",
                "maxLength": 400,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Bid / no-bid and price range"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c8ab0cdc36fae5bdb787292a54d4cb9ecb9c1772ef26bff1c4b3083e61c7775a"
        },
        {
          "name": "competitor_profile",
          "description": "Free during beta. What a company wins in public procurement: contracts won, value, buyers, sectors, countries, typical discount below estimate, competition level, procedures and regions, recent wins with base price, % below it and award criteria; for Portugal also every contest it entered, its win rate, its most frequent rivals (who beat whom) and its recent losses. Search by name or tax id (NIF). These are public records: report facts, not conclusions about wrongdoing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "company": {
                "description": "Company name (part is fine) or tax id, e.g. 'B46012696'",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              },
              "countries": {
                "description": "ISO 3166-1 alpha-2 country codes where the work is performed, e.g. [\"PT\",\"ES\"]",
                "items": {
                  "maxLength": 2,
                  "minLength": 2,
                  "type": "string"
                },
                "type": "array"
              },
              "since": {
                "description": "ISO date, e.g. 2025-01-01",
                "type": "string"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Competitor profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:cc1f2f5cf0b693a3912bf3d5dbea1f6abab890a8d00c1a5e6dc8e6ce4a2ae9ec"
        },
        {
          "name": "expiring_contracts",
          "description": "Free during beta. Public contracts whose term ends soon, so the buyer will likely re-tender: a sales pipeline before tenders are published. Returns buyer, incumbent supplier(s), value, start and expected end date.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "buyer": {
                "description": "Part of the buyer's name",
                "maxLength": 200,
                "type": "string"
              },
              "countries": {
                "description": "ISO 3166-1 alpha-2 country codes where the work is performed, e.g. [\"PT\",\"ES\"]",
                "items": {
                  "maxLength": 2,
                  "minLength": 2,
                  "type": "string"
                },
                "type": "array"
              },
              "cpv_prefixes": {
                "description": "CPV code prefixes; '45' = construction, '72' = IT services, '3021' = computers",
                "items": {
                  "maxLength": 8,
                  "minLength": 2,
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "description": "Max results, default 10, max 50",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "min_value": {
                "description": "Minimum awarded value",
                "type": "number"
              },
              "months_ahead": {
                "description": "Look-ahead window, default 12 months",
                "maximum": 36,
                "minimum": 1,
                "type": "integer"
              },
              "region": {
                "description": "Place name: district or municipality (e.g. 'Lisboa', 'Sintra'). Matches the work location or the buyer's name; most precise for Portugal.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Contracts ending soon"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
