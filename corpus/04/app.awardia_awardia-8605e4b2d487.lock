          },
          "digest": "sha256:e5ec15e0db02bc3a59c2a02f792e42fb3591e8db827903c34f5a8344b4bb5fc0"
        }
      ],
      "prompts": [
        {
          "name": "competitor_xray",
          "title": "Competitor X-ray",
          "description": "Everything public about one company's tenders: wins, buyers, sectors, discounts, rivals and recent losses.",
          "arguments": [
            {
              "name": "company",
              "description": "Company name or tax id (NIF / CIF / VAT)",
              "required": true
            }
          ],
          "digest": "sha256:182b5a55cb4a4f74f88896c2fd2b486b86d418b6e9d3e2e310632396e2fc262c"
        },
        {
          "name": "renewals_pipeline",
          "title": "Contracts up for renewal",
          "description": "Public contracts ending soon, so buyers will likely tender them again: a sales pipeline before the tender is out.",
          "arguments": [
            {
              "name": "sector",
              "description": "Kind of work or service, e.g. 'cleaning', 'road maintenance', 'IT support'",
              "required": true
            },
            {
              "name": "region",
              "description": "Country, district or municipality, e.g. 'PT', 'Lisboa', 'Madrid'",
              "required": false
            },
            {
              "name": "months",
              "description": "How far ahead to look, in months (default 12)",
              "required": false
            }
          ],
          "digest": "sha256:839f7ebfdd2a3c4d54b2db7dd0493aff8a66aba52b3e0858869ac57da0469051"
        },
        {
          "name": "should_i_bid",
          "title": "Should I bid on this tender?",
          "description": "Bid / no-bid view of one open tender: competition, typical discount, price range, likely rivals.",
          "arguments": [
            {
              "name": "tender",
              "description": "Tender id from search_tenders, or a short description of the tender",
              "required": true
            },
            {
              "name": "company",
              "description": "Your company name or tax id (NIF), to compare with your own record",
              "required": false
            }
          ],
          "digest": "sha256:0fac7f7ee67e03c325a781c722e3fb42fe670a784af2868894d85f8f2d4f0335"
