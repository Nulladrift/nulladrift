          "digest": "sha256:27ac7d76986398c62a33a8f113f9865d16f335fd01b8431ee57c7282f07970ad"
        },
        {
          "name": "get_coverage",
          "description": "FREE. What data Awardia holds: sources, countries, date range, number of open tenders and award notices. Useful to check before searching a country or period.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
