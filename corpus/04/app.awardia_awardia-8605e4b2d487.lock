          "digest": "sha256:2003c10c79369518432de9a2d1b49a8477693b226594cca022ec880c75559ec7"
        },
        {
          "name": "match_company",
          "description": "Free during beta. Describe a company in plain words (what it sells, where). Returns the open public tenders it could bid on, best match first, each with 'competition' signals from the buyer's past contracts (median bidders, single-bid share, % below estimate).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "company_description": {
                "description": "e.g. 'We install solar panels and EV chargers for municipalities'. English matches tenders in every EU language; adding key terms in the target country's language improves recall.",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              },
              "countries": {
                "description": "ISO 3166-1 alpha-2 country codes where the work is performed, e.g. [\"PT\",\"ES\"]",
                "items": {
                  "maxLength": 2,
                  "minLength": 2,
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "description": "Max results, default 10, max 25",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["company_description"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Tenders for a company"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c8a0e52f11bcaf4a03f19be7d4af36d3e5ebb2fbebb6762e1a5b1a27b1c22ef9"
        },
        {
          "name": "search_tenders",
          "description": "Free during beta. Find OPEN public tenders (deadline still in the future) by keywords, country, region, CPV sector and value. EU-wide from TED; for Portugal also every national call for tender of any value (Diário da República). Returns title, buyer, country, region, CPV codes, estimated value, submission deadline, official link and tender documents link, plus 'competition': how contested this buyer's past contracts in the same kind of work were (median bidders, single-bid share, median % below the estimate, sample size). Use bid_intelligence for a price range and rivals. If nothing matches exactly, it widens (the place's whole district, then without keywords, then without the place) and says so in 'widened_to' and 'note'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "countries": {
                "description": "ISO 3166-1 alpha-2 country codes where the work is performed, e.g. [\"PT\",\"ES\"]",
                "items": {
                  "maxLength": 2,
                  "minLength": 2,
                  "type": "string"
                },
                "type": "array"
              },
              "cpv_prefixes": {
                "description": "CPV code prefixes; '45' = construction, '72' = IT services, '3021' = computers",
                "items": {
                  "maxLength": 8,
                  "minLength": 2,
                  "type": "string"
                },
                "type": "array"
              },
              "deadline_after": {
                "description": "ISO date; default now",
                "type": "string"
              },
              "keywords": {
                "description": "What you are looking for. English works across all countries (matched via the EU CPV vocabulary); adding the same words in the target country's language (e.g. 'school renovation escola requalificação') also matches tender titles and descriptions.",
                "maxLength": 300,
                "type": "string"
              },
              "limit": {
                "description": "Max results, default 10, max 25",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_value": {
                "description": "Maximum estimated value",
                "type": "number"
              },
              "min_value": {
                "description": "Minimum estimated value",
                "type": "number"
              },
              "region": {
                "description": "Place name: district or municipality (e.g. 'Lisboa', 'Sintra'). Matches the work location or the buyer's name; most precise for Portugal.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search open tenders"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
