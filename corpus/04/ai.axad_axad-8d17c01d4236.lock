        {
          "name": "nominate_image",
          "title": "Get a picture",
          "description": "Ask for a picture of a generic concept every learner shares: a concrete thing, action, place or everyday scene. Returns an existing library picture when one stands for the concept; otherwise checks the request against the library's rules and draws a new one, which fills in when ready (this spends credit). canon names the concept in 1 to 4 English words.",
          "inputSchema": {
            "properties": {
              "canon": {
                "description": "The generic English concept the picture shows, 1–4 words, dictionary form, with no names, numbers or words of one sentence: \"doctor's practice\", \"apple\", \"train platform\". The library keeps one picture per canon.",
                "type": "string"
              },
              "concept": {
                "description": "The language element it teaches, 1–8 words in its language: \"cancelar\", \"la sala de espera\". The `image` fields that show this picture hold these words.",
                "type": "string"
              },
              "lang": {
                "description": "BCP 47 code of the concept.",
                "type": "string"
              },
              "prompt": {
                "description": "What to draw, 40–200 English words: the scene, each object and where it is, what the people do. Concrete, drawable and generic: no names, clock times, dates or numbers (except quoted `text`); no style words.",
                "type": "string"
              },
              "text": {
                "description": "Only when words in the picture are the lesson: at most 6 words in `lang`, also written in the prompt in double quotes. Omit it for a picture with no words, which serves every language.",
                "type": "string"
              },
              "title": {
                "description": "One literal English sentence of 8–40 words: who, what, where. Generic, with no names, numbers, clock times or dates. Search reads it.",
                "type": "string"
              }
            },
            "required": ["canon", "concept", "lang", "prompt", "title"],
            "type": "object"
          },
