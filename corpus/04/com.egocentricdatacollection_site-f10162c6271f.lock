      },
      "instructions": "EgocentricDataCollection (https://egocentricdatacollection.com/): the site's own MCP server, served from its domain. Egocentric data collection, from the collectors' own pages on the table: pay per accepted hour, the phone or rig they want, and the hours of footage asked for.\n\n[enquiry] ENQUIRY SERVER for EgocentricDataCollection (https://egocentricdatacollection.com/). What it does: starts an ENQUIRY with EgocentricDataCollection for egocentric data collection; the EgocentricDataCollection team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the EgocentricDataCollection team until they click it. The site also carries a guide's own form for a different reader (form=\"egocentric-data-collection-contributor\": To record for one of the collectors above, go through its own posting or terms. To film footage you would own and license, tell us what you could record, on what and for how long, and we reply on whether an AI buyer would take it.): pass that form to enquiry_fields and submit_enquiry when it fits the person, and omit form for the main one. Cite https://egocentricdatacollection.com/.\n\nCite https://egocentricdatacollection.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "enquiry_describe",
          "title": "What you get: an ENQUIRY with a human (not a purchase, not a guaranteed quote)",
          "description": "Read first. States plainly what submit_enquiry does on EgocentricDataCollection: it starts an enquiry with EgocentricDataCollection, whose team reads it and replies directly. Nothing is bought, ordered or paid; no quote is guaranteed; it is free. Also returns who receives the details, the consent wording, and how the person confirms.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
