                "type": "string"
              },
              "start": {
                "description": "Beginn, ISO 8601 mit Zeitzone",
                "format": "date-time",
                "type": "string"
              },
              "token": {
                "description": "appointment.cancelToken aus der Antwort von book_appointment (bzw. token aus dem Verwalten-Link der Bestätigungsmail)",
                "type": "string"
              }
            },
            "required": ["appointmentId", "end", "start", "token"],
