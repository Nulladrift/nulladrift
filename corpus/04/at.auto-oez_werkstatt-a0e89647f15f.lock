          },
          "digest": "sha256:8938038a6bc877c6312dc69e825ce11156edd91fc83866c08791f46af53c6584"
        },
        {
          "name": "get_appointment",
          "title": "Termin ansehen",
          "description": "Status, Zeit, Leistung und Zahlung eines gebuchten Termins. Nur mit appointmentId und cancelToken aus der Antwort von book_appointment bzw. aus dem Verwalten-Link der Bestätigungsmail. Ohne Personendaten.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "appointmentId": {
                "description": "appointment.id aus der Buchung",
                "type": "string"
              },
              "token": {
                "description": "appointment.cancelToken aus der Buchung (bzw. token aus dem Verwalten-Link)",
                "type": "string"
              }
            },
            "required": ["appointmentId", "token"],
            "type": "object"
          },
          "annotations": {
