        },
        {
          "name": "request_workshop_service",
          "title": "Werkstatt-Anfrage senden",
          "description": "Schickt der Werkstatt eine Anfrage (z. B. Service, Pickerl/§57a, Reparatur, Reifenwechsel): sie landet als angenommener Werkstattauftrag mit Fahrzeug und Wunsch bei der Werkstatt, die sich meldet und den Auftrag bei der Annahme bestätigt. Kein Termin und nichts zu bezahlen. Nur im Auftrag der Person, mit ihrer ausdrücklichen Einwilligung zur Weitergabe ihrer Angaben (consent: true). Die Antwort enthält statusToken für get_workshop_status. Für einen festen Termin stattdessen check_availability + book_appointment. Mit clientRequestId kann der Aufruf nach einer verlorenen Antwort gefahrlos wiederholt werden.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "clientRequestId": {
                "description": "Eigene Vorgangs-ID des Agenten (optional, 8–64 Zeichen: Buchstaben, Ziffern, _ und -), am besten zufällig, z. B. eine UUID. Gleiche ID mit gleichen Angaben = dieselbe Antwort und kein zweiter Vorgang; mit anderen Angaben wird der Aufruf abgelehnt. get_request_status findet den Vorgang mit dieser ID.",
                "pattern": "^[A-Za-z0-9_-]{8,64}$",
                "type": "string"
              },
              "consent": {
                "const": true,
                "description": "Einwilligung der Person, dass die Werkstatt ihre Angaben für diese Anfrage verarbeitet – nur true, wenn die Person zugestimmt hat",
                "type": "boolean"
              },
              "email": {
                "description": "E-Mail-Adresse (E-Mail oder Telefon ist Pflicht)",
                "format": "email",
                "maxLength": 200,
                "type": "string"
              },
              "firstRegistration": {
                "description": "Erstzulassung (optional), z. B. 03/2018",
                "maxLength": 20,
                "type": "string"
              },
              "makeModel": {
                "description": "Marke und Modell, z. B. VW Golf",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "mileageKm": {
                "description": "Kilometerstand (optional, ganze km)",
                "maximum": 2000000,
                "minimum": 0,
                "type": "integer"
              },
              "name": {
                "description": "Vor- und Nachname (2–120 Zeichen)",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "phone": {
                "description": "Telefonnummer (E-Mail oder Telefon ist Pflicht)",
                "maxLength": 40,
                "type": "string"
              },
              "plate": {
                "description": "Kennzeichen, z. B. W-12345A",
                "maxLength": 15,
                "minLength": 2,
                "type": "string"
              },
              "preferredDate": {
                "description": "Wunschtag (optional, JJJJ-MM-TT); die Werkstatt meldet sich mit einem Termin",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "wish": {
                "description": "Was soll gemacht werden, in den Worten der Person (3–1000 Zeichen)",
                "maxLength": 1000,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["consent", "makeModel", "name", "plate", "wish"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:471dc5ee22324393958c15b486c30dd402457d87578f8568808df211037af23c"
        },
