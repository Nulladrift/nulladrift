      },
      "instructions": "Öffentliche Aktionen der Website https://auto-oez.at/. Inhalte: content_summary (Überblick), content_full (alles, in Teilen), content_section (eine Seite/ein Abschnitt) — jede Antwort beginnt mit der Änderungsliste. Buchen, Anfragen und Bestellen nur im Auftrag und mit den Angaben der betroffenen Person.",
      "tools": [
        {
          "name": "book_appointment",
          "title": "Termin buchen",
          "description": "Bucht einen freien Termin (Zeit aus check_availability). Nur im Auftrag und mit den Angaben der Person, für die gebucht wird.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "customerEmail": {
                "description": "E-Mail für die Bestätigung",
                "format": "email",
                "type": "string"
              },
              "customerName": {
                "description": "Vor- und Nachname der Kundin bzw. des Kunden",
                "type": "string"
              },
              "customerPhone": {
                "description": "Telefonnummer (optional)",
                "type": "string"
              },
              "end": {
                "description": "Ende, ISO 8601 mit Zeitzone",
                "format": "date-time",
                "type": "string"
              },
              "notes": {
                "description": "Hinweis an den Betrieb (optional)",
                "type": "string"
              },
              "serviceId": {
                "description": "Kennung der Leistung",
                "type": "string"
              },
              "start": {
                "description": "Beginn, ISO 8601 mit Zeitzone",
                "format": "date-time",
                "type": "string"
              }
            },
            "required": ["customerEmail", "customerName", "end", "serviceId", "start"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
