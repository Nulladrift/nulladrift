        },
        {
          "name": "check_availability",
          "title": "Freie Termine",
          "description": "Freie Termine für eine Leistung (serviceId aus list_services). Zeitraum als ISO-Datum mit Uhrzeit und Zeitzone.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "Beginn des Zeitraums, ISO 8601",
                "format": "date-time",
                "type": "string"
              },
              "serviceId": {
                "description": "Kennung der Leistung aus list_services",
                "type": "string"
              },
              "to": {
                "description": "Ende des Zeitraums, ISO 8601",
                "format": "date-time",
                "type": "string"
              }
            },
            "required": ["serviceId"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
