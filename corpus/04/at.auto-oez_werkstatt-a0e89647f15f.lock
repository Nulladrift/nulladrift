{
  "lockfileVersion": 2,
  "subjects": {
    "at.auto-oez/werkstatt": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://auto-oez.at/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "Auto Öz (mekyn)",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Öffentliche Aktionen der Website https://auto-oez.at/. Inhalte: content_summary (Überblick), content_full (alles, in Teilen), content_section (eine Seite/ein Abschnitt) — jede Antwort beginnt mit der Änderungsliste. Buchen, Anfragen und Bestellen nur im Auftrag und mit den Angaben der betroffenen Person.",
      "tools": [
        {
          "name": "approve_quote",
          "title": "Kostenvoranschlag freigeben",
          "description": "Gibt einen Kostenvoranschlag verbindlich frei; daraus wird der Werkstattauftrag. Nur mit dem Token aus dem Link und nur im ausdrücklichen Auftrag der Person, der der Kostenvoranschlag gehört, mit ihrem vollen Namen. Vorher mit view_quote ansehen. Eine Wiederholung legt nichts doppelt an.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "add": {
                "description": "Kennungen optionaler Positionen, die zusätzlich beauftragt werden (optional, aus view_quote)",
                "items": {
                  "maxLength": 16,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 60,
                "type": "array"
              },
              "decline": {
                "description": "Kennungen der Abschnitte, die nicht beauftragt werden (optional, aus view_quote)",
                "items": {
                  "maxLength": 16,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 60,
                "type": "array"
              },
              "name": {
                "description": "Vor- und Nachname der Person, die freigibt (2–120 Zeichen)",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "token": {
                "description": "Token aus dem Link des Kostenvoranschlags (der letzte Teil von …/quote-approval/<token>)",
                "pattern": "^[A-Za-z0-9_-]{20,64}$",
                "type": "string"
              }
            },
            "required": ["name", "token"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:036dca0b57ae1d447ccb78a037208b87368348420eafa507c909ee3b782c38fa"
        },
        {
          "name": "book_appointment",
          "title": "Termin buchen",
          "description": "Bucht einen freien Termin (start, end und staffId aus check_availability). Nur im Auftrag und mit den Angaben der Person, für die gebucht wird. Für eine Werkstatt: das Fahrzeug (Kennzeichen, Marke und Modell, Erstzulassung, Kilometerstand) in vehicle mitgeben. Die Antwort enthält appointment.id und appointment.cancelToken: beides der Person mitteilen bzw. aufbewahren; nur damit kann der Termin bis 24 Stunden vor Beginn abgesagt oder verschoben werden. Mit clientRequestId kann der Aufruf nach einer verlorenen Antwort gefahrlos wiederholt werden.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "clientRequestId": {
                "description": "Eigene Vorgangs-ID des Agenten (optional, 8–64 Zeichen: Buchstaben, Ziffern, _ und -), am besten zufällig, z. B. eine UUID. Gleiche ID mit gleichen Angaben = dieselbe Antwort und kein zweiter Vorgang; mit anderen Angaben wird der Aufruf abgelehnt. get_request_status findet den Vorgang mit dieser ID.",
                "pattern": "^[A-Za-z0-9_-]{8,64}$",
                "type": "string"
              },
              "customerEmail": {
                "description": "E-Mail für die Bestätigung",
                "format": "email",
                "type": "string"
              },
              "customerName": {
                "description": "Vor- und Nachname der Kundin bzw. des Kunden",
                "type": "string"
              },
              "customerPhone": {
                "description": "Telefonnummer (optional)",
                "type": "string"
              },
              "end": {
                "description": "Ende, ISO 8601 mit Zeitzone",
                "format": "date-time",
                "type": "string"
              },
              "notes": {
                "description": "Hinweis an den Betrieb (optional)",
                "type": "string"
              },
              "serviceId": {
                "description": "Kennung der Leistung",
                "type": "string"
              },
              "staffId": {
                "description": "Kennung der Person bzw. Ressource aus check_availability (optional)",
                "type": "string"
              },
              "start": {
                "description": "Beginn, ISO 8601 mit Zeitzone",
                "format": "date-time",
                "type": "string"
              },
              "vehicle": {
                "additionalProperties": false,
                "description": "Fahrzeug, für das der Termin ist",
                "properties": {
                  "firstRegistration": {
                    "description": "Erstzulassung, z. B. 03/2018 (optional)",
                    "maxLength": 20,
                    "type": "string"
                  },
                  "makeModel": {
                    "description": "Marke und Modell, z. B. VW Golf",
                    "maxLength": 80,
                    "minLength": 2,
                    "type": "string"
                  },
                  "mileageKm": {
                    "description": "Kilometerstand in km (optional)",
                    "maximum": 2000000,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "plate": {
                    "description": "Kennzeichen, z. B. W-12345A",
                    "maxLength": 15,
                    "minLength": 2,
                    "type": "string"
                  }
                },
                "required": ["makeModel", "plate"],
                "type": "object"
              }
            },
            "required": ["customerEmail", "customerName", "end", "serviceId", "start"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1df856a992cb5a6a0f3ac8f1c5af2237bf305f078707cbc47cd98a93eda62532"
        },
        {
          "name": "cancel_appointment",
          "title": "Termin absagen",
          "description": "Sagt einen gebuchten Termin ab. Nur mit appointmentId und cancelToken aus der Antwort von book_appointment bzw. aus dem Verwalten-Link der Bestätigungsmail (Parameter token); ohne diese beiden Angaben ist keine Absage möglich. Möglich bis 24 Stunden vor Beginn. Nur im Auftrag der Person, die den Termin gebucht hat.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "appointmentId": {
                "description": "appointment.id aus der Antwort von book_appointment",
                "type": "string"
              },
              "token": {
                "description": "appointment.cancelToken aus der Antwort von book_appointment (bzw. token aus dem Verwalten-Link der Bestätigungsmail)",
                "type": "string"
              }
            },
            "required": ["appointmentId", "token"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a8fd67ee168b4fe4349e33c945375b827f93c2e9581a45a5455143fc1fc5cd52"
        },
        {
          "name": "check_availability",
          "title": "Freie Termine",
          "description": "Freie Termine für eine Leistung (serviceId aus list_services). Zeitraum als ISO-Datum mit Uhrzeit und Zeitzone. Jedes Zeitfenster hat start, end und staffId.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "Beginn des Zeitraums, ISO 8601",
                "format": "date-time",
                "type": "string"
              },
              "serviceId": {
                "description": "Kennung der Leistung aus list_services",
                "type": "string"
              },
              "staffId": {
                "description": "Kennung der Person bzw. Ressource aus check_availability (optional)",
                "type": "string"
              },
              "to": {
                "description": "Ende des Zeitraums, ISO 8601",
                "format": "date-time",
                "type": "string"
              }
            },
            "required": ["serviceId"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
