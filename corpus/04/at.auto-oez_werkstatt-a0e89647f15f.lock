        {
          "name": "get_request_status",
          "title": "Stand eines Vorgangs",
          "description": "Stand eines Vorgangs, den ein Agent auf dieser Website mit clientRequestId angelegt hat (Termin, Bestellung, Terminanfrage, Werkstatt-Anfrage, Rückrufbitte oder Besichtigungsanfrage): found, kind, status, Kennung und bei Terminen Beginn und Ende. Ohne Personendaten und ohne cancelToken; den gibt es nur in der ursprünglichen Antwort (dafür den ursprünglichen Aufruf mit derselben clientRequestId und denselben Angaben wiederholen).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "clientRequestId": {
                "description": "Die clientRequestId des ursprünglichen Aufrufs",
                "pattern": "^[A-Za-z0-9_-]{8,64}$",
                "type": "string"
              }
            },
            "required": ["clientRequestId"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:086f6aa1dc48b99daafad8654f8992c42ad8e6349dc97196680c4a363cd22a48"
        },
        {
          "name": "get_workshop_status",
          "title": "Stand des Werkstattauftrags",
          "description": "Ist mein Auto fertig? Zeigt den Stand eines Werkstattauftrags (received = angenommen, in_progress, waiting_parts, waiting_approval, done = fertig zur Abholung, collected, cancelled, declined = Anfrage abgelehnt mit declineReason), seit wann, „fertig bis“, die Auftragsnummer, das Fahrzeug (Kennzeichen, Marke/Modell) und die für dieses Fahrzeug eingelagerten Reifensätze. Nur mit dem Status-Token aus dem Link der Auftragsbestätigung (…/workshop-status/<token>). Nur lesen, ohne Personendaten.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "token": {
                "description": "Status-Token aus dem Link der Auftragsbestätigung (der letzte Teil von …/workshop-status/<token>)",
                "pattern": "^[A-Za-z0-9_-]{32}$",
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7ce004519554ed19fcabc105c3683c092936da759ec55d9dcf03fc421dd287f9"
        },
        {
          "name": "list_services",
          "title": "Leistungen und Angebote",
          "description": "Aktuelle Leistungen bzw. Angebote mit Preis und Dauer, so wie sie auf der Website stehen.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
