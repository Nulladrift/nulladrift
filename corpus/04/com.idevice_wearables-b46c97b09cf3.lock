      "instructions": "iDevice is an independent buyer's guide for wearables and phones, as tools: what to buy, what works with what, whether to buy now or wait, and what is coming. Every fact shows its source and how sure we are; \"Not confirmed\" means unknown, not incompatible. Each product has a product_slug, which list_products returns. should_i_buy takes one product and, optionally, a device the shopper already owns or the phone platform they use (iPhone or Android), a budget and a use. It returns buy_now, wait, skip, check_fit or not_enough_data, with the reasons (each with its source and how sure we are), the fit, timing, price and upgrade answers, and the parts it could not answer. For an owner of the model a product directly replaces, should_i_buy also returns the upgrade answer in two parts, as the /upgrade pages on idevice.com say it: upgrade_merit (is replacing the owned model worth it) and purchase_timing (is today a good time to buy the new one), with upgrade_answer stating both in plain words. check_deal takes one product and a price someone was offered, and returns GOOD DEAL, NOT A GOOD DEAL or NOT ENOUGH DATA by the same rules, against today's retailer price and the lowest verified price of that exact model over the period iDevice has checked it (none under 30 days of checks; called 90 days only when 90 days are covered). pick_between takes two or three products and returns which one the same rules put ahead for the shopper's phone and budget, or that neither is, with each one's verdict, fit and price. whats_coming takes one product and returns its release window with who stated it and the pre-release reports its Guide lists, each with its status, track record, spread and source. should_i_buy, pick_between, check_deal and whats_coming each also name an MCP Apps view (a ui:// resource) that a host able to draw one can show beside the text; the text and data are the same either way. find_best_device takes a category and, optionally, the phone platform, a budget and up to three priorities from the uses the Guides assign, and returns a short ranked list by the same rules. find_products lists on-sale products in a category, optionally at or under a price, with each one's current retailer price and iDevice's published verdict. get_guide_summary returns a product's Guide summary with the facts that bear on buying now or waiting. get_compatibility returns what a product works with (iPhone, Android, apps, other devices), each answer with its source link. compare_products returns two or three products side by side. get_product_facts returns price (with its basis), dates, availability (whether it is on sale, and where to buy) and specs marked Confirmed, Reported, Our read or Not confirmed. get_price_history returns dated prices, today's verified price (or Price not confirmed with the reason) and, once iDevice has 30 days of verified checks of that exact model, the lowest price with the period it covers in days. get_release_calendar lists products not yet on sale in date order, each with who stated the timing (the company, a company event, or pre-release reports). get_report_card rolls up a product's pre-release reports by how they turned out. get_product_news returns the latest iDevice news about a product, newest first, each story with the outlets and links it rests on. News is what is happening now; reports (get_reports, search_reports, get_report_card) are what was said before launch. get_reports and search_reports return pre-release reports about a product, each backed by at least one verified source that does not deny it, with a status: Right, Partly right, Wrong, Never settled, Not comparable, Not checked yet or No outcome yet, and a url on idevice.com with the evidence. get_ownership_facts returns what owning a product involves: the official return window, return shipping and restocking fee, the warranty, whether a subscription is needed with its price and a first-year cost where the price and billing period are both stated, the official support status as of a stated date, and published recalls, service programs and security-update windows. get_best_for returns what a product is best for, with how each use is known, or the on-sale products whose Guide ranks a given use in its top three. get_variants_and_offers returns a product's configurations with their launch prices, the retailer listings that are this exact model, and the conditions retailers attach to a member price, coupon, bundle or refurbished offer. get_company_profile returns a company as the public directory lists it and the products iDevice covers for it. get_guide_extras returns a Guide's timeline events with their sources, its FAQ, or a glossary term's definition. find_products also takes works_with (iPhone, Android or a named device) to keep products that work with it, and get_detailed_facts takes offset and limit to read every fact on a product in pages. In these results a date says when a fact was checked, and \"not_on_file\" means unknown, not zero and not \"no\". A result with sponsored: true is for a sponsored Guide.",
      "tools": [
        {
          "name": "check_deal",
          "title": "Is this price a good deal",
          "description": "Whether a price offered for one product is a good deal: GOOD DEAL, NOT A GOOD DEAL or NOT ENOUGH DATA, by the same written rules as should_i_buy. Compares the price with the lowest current retailer price iDevice read today, the lowest verified price of this exact model (over low_period_days, said as low_period; only once iDevice has 30 days of verified checks, and called a 90-day low only when 90 days are covered) and the near-low band the rules use, and gives the buy-or-wait verdict at that price where the rules can state one. Each line says what it rests on. No model is involved and no probability is given. A line slug (for example 'samsung-galaxy-ring') names the line's newest model; when that model is not on sale the answer is for the newest model of the line that is, and resolved_to says which and why.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "price_usd": {
                "description": "The price offered, in US dollars",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "product_slug": {
                "description": "The product, a product_slug, e.g. 'oura-ring-4'",
                "type": "string"
              },
              "retailer": {
                "description": "Where the price was offered, e.g. 'Best Buy'. Repeated in the answer as given.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["price_usd", "product_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Is this price a good deal"
          },
