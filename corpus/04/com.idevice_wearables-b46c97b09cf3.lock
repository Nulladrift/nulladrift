        },
        {
          "name": "find_best_device",
          "title": "Find the device that fits",
          "description": "A short ranked list of on-sale products in one category, optionally for a phone platform, budget and up to three uses the Guides assign, each with its verdict, phone fit, price, a reason with sources and its Guide's place for the use. In every category iDevice's own pick covers, that pick answers first, then the alternatives it names, each with its verdict, fit, price and sources, and a best_answer block with the reviews behind the pick. The phone and budget decide which products fit, not which is better; priorities are the uses the pick covers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "budget_usd": {
                "description": "A price ceiling in US dollars",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "category": {
                "description": "The kind of product",
                "enum": ["glasses", "rings", "watches", "earbuds", "phones", "headsets", "fitness trackers", "headphones"],
                "type": "string"
              },
              "limit": {
                "description": "1 to 5, default 3",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "owned_platform": {
                "description": "The phone platform the shopper uses",
                "enum": ["iphone", "android", "other"],
                "type": "string"
              },
              "priorities": {
                "description": "Up to three uses, e.g. ['sleep','battery-life']",
                "items": {
                  "maxLength": 40,
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find the device that fits"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e7dd4cf57edd2ec5f1f011e0b29544ccac2ecd9675cc5398e7dbd97d1a9af15e"
        },
