        "tools": {
          "listChanged": true
        }
      },
      "instructions": "iDevice is an independent buyer's guide for wearables and phones, as tools: what to buy, what works with what, whether to buy now or wait, and what is coming. Every fact shows its source and how sure we are, as Confirmed, Reported, Our read or Not confirmed; \"Not confirmed\" means unknown, not incompatible. list_products returns each product's product_slug. Tools by question: should I buy it, should_i_buy; this or that, pick_between or compare_products; is this price good, check_deal; what fits me in a category, find_best_device or find_products; does it work with my phone, get_compatibility; what is coming, whats_coming or get_release_calendar; facts and specs, get_product_facts; news, get_product_news; what owning it involves, get_ownership_facts. A date says when a fact was checked; sponsored: true marks a sponsored Guide. The data is provided for answering people's questions; bulk copying or redistribution of it is not permitted.",
      "tools": [
        {
          "name": "check_deal",
          "title": "Is this price a good deal",
          "description": "Whether a price offered for one product is a GOOD DEAL, NOT A GOOD DEAL or NOT ENOUGH DATA, against today's lowest price and the lowest recent price of this exact model. For a line slug whose newest model is not on sale, the answer is for the newest that is, named in resolved_to.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "price_usd": {
                "description": "The price offered, in US dollars",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "product_slug": {
                "description": "A product_slug, e.g. 'oura-ring-4'",
                "type": "string"
              },
              "retailer": {
                "description": "Where it was offered, e.g. 'Best Buy'",
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["price_usd", "product_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Is this price a good deal"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://idevice/deal/v1.html"
            },
            "ui/resourceUri": "ui://idevice/deal/v1.html"
          },
          "digest": "sha256:fe6af0adbcdb170ac6d86755321fe965b9c907cc589c0d4ec3b79d7b6754aa36"
        },
