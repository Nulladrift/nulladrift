        {
          "name": "cooper_whoami",
          "title": "Show account and key",
          "description": "Use this when you need to see which Cooper account this connection is using and whether the API key is limited to one inbox or a permission list. Requires auth. Optional input lifecycle_emails is on or off and sets whether this account receives weekly product notes in its inbox. Omit it to leave the setting unchanged. Returns {account_id, parent_account_id, auth_type, key:{id, name, prefix, inbox_id, permissions, expires_at}|null, workspace:{id, inbox_quota}|null, lifecycle_emails, notices, whats_new, owner_recommended}. owner_recommended is present when the account has no verified owner. It names POST /api/v1/inboxes/{id}/owners and the onboard owner_email field, and it mentions the 50 percent Free send increase for a verified external owner. notices lists limit_warning rows when usage is at 80 percent of inboxes, monthly sends, or custom domains. whats_new lists the newest two or three user-facing changelog highlights. auth_type is api_key or oauth. key is null for an OAuth token, which has full access. permissions null means every permission. workspace is set when this account is a sub-account. Fails with 401 unauthorized, 401 api_key_revoked, or 401 api_key_expired. This tool does not mint or revoke keys. Use POST /api/v1/keys over HTTP so a key secret is not written into the chat transcript.",
