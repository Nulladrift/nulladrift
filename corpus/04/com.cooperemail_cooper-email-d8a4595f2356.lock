        {
          "name": "cooper_place_call",
          "title": "Place a call",
          "description": "Place a call from the inbox phone number. Requires auth. to is a US or Canada number in E.164. Premium-rate numbers are rejected (HTTP 400 premium_rate_blocked). Other countries are rejected (HTTP 400 international_not_allowed). say is the text spoken with text-to-speech, at most 1000 characters. mode is say (default) or say_and_record, which speaks and then records a reply as a voicemail. Free has no voice minutes and returns HTTP 402 plan_limit_exceeded with upgrade_url. The same 402 is returned when the monthly minute allowance is used up. Each account can place at most 100 calls per UTC day (HTTP 409 daily_call_cap). An inbox with no active number returns HTTP 409 phone_number_not_found. Inputs: inbox_id, to, say, mode (optional), client_id (optional), idempotency_key (optional).",
          "inputSchema": {
            "properties": {
              "client_id": {
                "description": "Optional caller key. The same client_id returns the first call and does not dial twice.",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional Idempotency-Key. The same key and request returns the first result.",
                "type": "string"
              },
              "inbox_id": {
                "description": "Inbox id (inb_…) whose phone number places the call. Get it from cooper_list_inboxes.",
                "type": "string"
              },
              "mode": {
                "description": "say (default) speaks and hangs up. say_and_record speaks, then records the reply as a voicemail.",
                "enum": ["say", "say_and_record"],
                "type": "string"
              },
              "say": {
                "description": "Text spoken to the person who answers, at most 1000 characters.",
                "type": "string"
              },
              "to": {
                "description": "US or Canada number to call, in E.164, for example +14155550100.",
                "type": "string"
              }
            },
            "required": ["inbox_id", "say", "to"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "The stored call record (channel voice).",
            "properties": {
              "alias": {
                "description": "Plus tag this inbound message arrived on, or null. Outbound mail is null. A reply still sends From the inbox address."
              },
              "aliases": {
                "description": "Every plus tag on this delivery, in recipient order. Empty when alias is null."
              },
              "attachments": {
                "description": "Attachments on the message.",
                "items": {
                  "properties": {
                    "content_type": {
                      "description": "MIME type."
                    },
                    "filename": {
                      "description": "File name."
                    },
                    "id": {
                      "description": "Attachment id. Pass it to cooper_get_attachment."
                    },
                    "size_bytes": {
                      "description": "Size in bytes."
