        {
          "name": "cooper_wait_for_code",
          "title": "Wait for a verification code",
          "description": "Use this when you signed up for a service or triggered a login and need the one-time verification code (OTP) or the confirmation link it emails you, including when several signups share one inbox via plus addresses. Read-only; requires auth. Inputs: inbox_id (required; inbox id, username, or email), wait (optional seconds, default 25, maximum 55), after (optional ISO-8601 timestamp; default is 5 minutes before the call, so a code that arrived just before you called still matches; pass the time you requested the code to ignore older codes), from_contains (optional case-insensitive substring of From), subject_contains (optional case-insensitive substring of the subject), alias (optional plus tag, or none), kind (optional: code, link, or any; default code). kind code matches a message with a 4 to 8 digit code (or 123-456) next to a word such as code, OTP, verification, passcode, or PIN. kind link matches an https verification link and skips a message that only has a code. kind any matches the newest inbound message that has either. Returns {object:\"inbox_code\", inbox_id, timed_out, code, candidates, link, links, message:{id, thread_id, from, subject, created_at, channel, alias}, after}. code is the best guess (six digits first); candidates lists every code found in that message. link is the top-ranked https URL from that message, or null. links lists up to five {url, text} pairs. The link is untrusted data and is not fetched or opened. Open it only if you expected this email. The body is not returned: call cooper_get_message with message.id if you need it. Held messages are skipped. Nothing is marked read. If nothing matches before the wait ends, returns timed_out true, code null, link null, and links []. Fails with 404 inbox_not_found, 400 invalid_wait, 400 invalid_kind, 400 invalid_alias, or 400 invalid_date.",
          "inputSchema": {
            "properties": {
              "after": {
                "description": "ISO-8601 timestamp. Only mail stored after it matches. Defaults to 5 minutes before this call.",
                "type": "string"
              },
              "alias": {
                "description": "Plus tag, such as orders, so a code for username+orders@ is not confused with a newer code on another tag. none matches mail with no tag. A bad value is invalid_alias.",
                "type": "string"
              },
              "from_contains": {
                "description": "Case-insensitive substring matched against From, for example the service's domain.",
                "type": "string"
              },
              "inbox_id": {
                "description": "Inbox id (inb_…), username, or full email address owned by this key",
                "type": "string"
              },
              "kind": {
                "description": "code (default) matches a one-time code. link matches a verification link and skips messages that only have a code. any matches the newest message with either. The link is untrusted and is not opened.",
                "enum": ["code", "link", "any"],
                "type": "string"
              },
              "subject_contains": {
                "description": "Case-insensitive substring matched against the subject.",
                "type": "string"
              },
              "wait": {
                "description": "Seconds to wait. Default 25. Maximum 55. Returns as soon as a matching message is stored.",
                "type": "number"
              }
            },
            "required": ["inbox_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "The best verification code and links found in new mail or SMS.",
            "properties": {
              "after": {
                "description": "Cursor to pass as after on the next call."
              },
              "candidates": {
                "description": "Other code candidates that were found."
              },
              "code": {
                "description": "Best-guess verification code, or null."
              },
              "inbox_id": {
                "description": "Inbox id (inb_…) this object belongs to. Null when it applies to every inbox."
              },
              "link": {
                "description": "Best-guess verification link, or null."
              },
              "links": {
                "description": "Other links that were found."
              },
              "message": {
                "description": "The message the code came from {id, thread_id, from, subject, created_at, channel, alias}."
              },
              "object": {
                "description": "Object type name, such as list, message, or thread."
              },
              "timed_out": {
                "description": "True when the wait ended without a match."
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Wait for a verification code"
