        {
          "name": "cooper_list_domains",
          "title": "List custom domains",
          "description": "Use this when you need the custom domains on the signed-in account, including DNS status. Read-only; requires auth; no inputs. Returns {object:\"list\", data:[{id, domain, status, status_detail, mail, records, warnings, dns}]}. Each record has status valid, missing, or invalid, found from the last check, and hint (null, or {code, message, found_at} saying what to change). warnings is an empty array when none. existing_mail_provider means this hostname already has MX at another provider. Custom domains are included on Starter (15) and Pro (200). Free includes 1. Past that cap is HTTP 402 plan_limit_exceeded. Publish exactly the records returned, with their host, type, value, priority for MX, and ttl. The receiving MX hostname and the DKIM value come from that response. Do not invent them. dns.mode automatic means Cooper wrote the records in a zone it already controls. dns.mode external means you publish them at your DNS host. Keep one SPF TXT with a single include; an existing SPF is merged into it. A DMARC p=reject record is left as published and blocks mail until DKIM for that domain verifies. mail.receiving and mail.sending stay false until the matching records verify. Then POST /api/v1/inboxes with domain creates username@domain. Failure codes: unauthorized.",
