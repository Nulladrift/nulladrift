          "description": "Use this when mail like X should be labeled, filed, forwarded, or acknowledged on the server with no model call, including mail to one plus address. Requires auth and message_update. Creating a rule with forward_to or auto_reply also needs message_send. HTTP 403 permission_denied with param actions when it does not, and nothing is stored. Inputs: inbox_id (required), name (required, 1–80 characters), conditions (required object; at least one of from, to, subject_contains, body_contains, has_attachment, auth, list, alias), actions (required object; at least one of add_labels, folder, mark_read true, forward_to, auto_reply, or stop_processing), enabled (optional boolean, default true), position (optional integer; lower runs first), stop_processing (optional boolean), client_id (optional idempotency key, at most 128 characters). from is an email, @domain, or a domain. alias is the plus tag. auth is pass or fail and uses DMARC. forward_to is another inbox on this account or a verified owner of this inbox. auto_reply.text is at most 2,000 characters. auto_reply.cooldown_hours is 1–720 and defaults to 24. An inbox stores at most 20 rules (HTTP 409 rule_limit). A bad rule is HTTP 400 invalid_rule. A disallowed forward_to is HTTP 400 forward_target_not_allowed. The same client_id returns the original rule and does not create a second one. Returns the inbox_rule.",
