                    },
                    "url": {
                      "description": "https URL",
                      "type": "string"
                    }
                  },
                  "required": ["label", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "description": "Short status label, such as running or blocked",
                "type": "string"
              },
              "task_id": {
                "description": "Groups updates into one email thread",
                "type": "string"
              },
              "text": {
                "description": "One short detail sentence for the human. Shown in the single-update email and the detailed style. No deploy ids, commit shas, or internal ids.",
                "type": "string"
