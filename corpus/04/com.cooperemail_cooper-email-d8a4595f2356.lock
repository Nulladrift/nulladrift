        {
          "name": "cooper_notify_owner",
          "title": "Notify the human owner",
          "description": "Use this when the agent should tell its human owner(s) about progress, completion, a blocker, or a question by email. Requires auth. Sends a status email to every verified owner of the inbox (daily-digest owners get it in the next digest). Send a short title of 5-8 plain words that says what happened or what you need (e.g. 'Launch copy drafted', 'Pick a launch headline'); the default concise email shows the title alone as the line next to the status pill. text is one optional-detail sentence; without a title Cooper uses the first sentence of text, cut at a clause, never with an ellipsis. Do not include deploy ids (dpl_…), commit shas, inbox ids, or other internal ids. Inputs: inbox_id (required), kind (required; progress, done, needs_input, or error), text (required; the update), title and status (optional short labels), task_id (optional; reuse it so all updates for one job stay in the same email thread), links (optional [{label, url}] with https URLs the owner can open), client_id (optional idempotency key). Returns {id, kind, task_id, text, created_at, deliveries:[{email, mode, status (sent|queued|skipped|failed), reason}]}. If no owner is verified yet, nothing is sent: check cooper_list_owners.",
          "inputSchema": {
            "properties": {
              "client_id": {
                "description": "Optional idempotency key",
                "type": "string"
              },
              "inbox_id": {
                "description": "Inbox id (inb_…), username, or full email address",
                "type": "string"
              },
              "kind": {
                "description": "Type of update",
                "enum": ["progress", "done", "needs_input", "error"],
