        {
          "name": "lookup_fault_code",
          "description": "Look up one fault/error/status code across all KasaFox registry brands and return the normalised meaning, causes, checks, fix steps, parts, safety flags, and citations. Cite the source and hard-stop on safety-critical faults (requires_qualified_installer).",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "Brand name",
                "enum": ["barudan", "domino", "fronius", "growatt", "sma", "solaredge", "swf", "tajima", "victron", "videojet"],
                "type": "string"
              },
              "code": {
                "description": "The code shown on the display or app, e.g. 'A20', 'Err 1', 'E10379'",
                "type": "string"
              },
              "model": {
                "description": "Optional model or series",
                "type": "string"
              },
              "symptom": {
                "description": "Optional free-text symptom",
                "type": "string"
              }
            },
            "required": ["brand", "code"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:de2a452b5371bab5032f333346d31bb86c12b3b5f7f1d99512f39069c698f04b"
        },
        {
          "name": "search_codes",
          "description": "Search the registry by code, brand, or title/meaning text and return matching rows with their canonical URLs.",
          "inputSchema": {
            "properties": {
              "q": {
                "description": "Search query: a code (e.g. 'a20'), a brand, or a symptom phrase",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
