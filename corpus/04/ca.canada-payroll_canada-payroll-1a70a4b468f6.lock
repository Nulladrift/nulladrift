      "serverInfo": {
        "name": "canada-payroll",
        "title": "Canada Payroll — verified employer payroll cost & take-home math (2026)",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "employee_take_home",
          "description": "2026 take-home pay for a Canadian employee on regular salary: CPP/QPP (incl. second-ceiling CPP2/QPP2), EI (and QPIP for Quebec), federal and provincial income tax withheld, net pay per year and per pay period. Assumes a full-year employee with basic TD1 claims. Supported: all 13 Canadian provinces/territories.",
          "inputSchema": {
            "properties": {
              "annual_salary": {
                "description": "Gross annual salary, CAD",
                "minimum": 0,
                "type": "number"
              },
              "pay_frequency": {
                "description": "Pay frequency for the per-period view (default biweekly)",
                "enum": ["weekly", "biweekly", "semimonthly", "monthly", "annual"],
                "type": "string"
              },
              "province": {
                "description": "Two-letter province/territory code",
                "enum": ["ON", "AB", "BC", "MB", "SK", "NS", "NB", "NL", "PE", "YT", "NT", "NU", "QC"],
                "type": "string"
              }
            },
            "required": ["annual_salary", "province"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7abe24d7565afa7a0218a1e3d4abae6e898a9328542d10812b614ece4951ff18"
        },
        {
          "name": "employer_total_cost",
          "description": "What a Canadian employee REALLY costs the employer for 2026: gross salary plus mandatory employer-side contributions (CPP + CPP2 + EI at 1.4x; for Quebec: QPP + QPP2 + EI + QPIP + health services fund + labour-standards contribution), with the excluded items (workers' comp, EHT, vacation pay, benefits) disclosed, never silently omitted. Supported: all 13 Canadian provinces/territories. Annual planning figures.",
          "inputSchema": {
            "properties": {
              "annual_salary": {
                "description": "Gross annual salary, CAD",
                "minimum": 0,
                "type": "number"
              },
              "province": {
                "description": "Two-letter province/territory code where the employee works",
                "enum": ["ON", "AB", "BC", "MB", "SK", "NS", "NB", "NL", "PE", "YT", "NT", "NU", "QC"],
                "type": "string"
              }
            },
            "required": ["annual_salary", "province"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1647f88847ff1d0fe74aa3afbcb68d2cfe6d3db3af5700ff5767d7bcb52251f5"
        },
        {
          "name": "net_to_gross_salary",
          "description": "Invert payroll for 2026: start from the take-home pay you agreed with the employee (\"$800/week in their pocket\") and get the gross salary that delivers it, the employer's true total cost, and the per-period source-deduction remittances (CRA; split CRA vs Revenu Québec for Quebec). Built for household employers (nanny payroll) who agree on take-home pay; CRA's PDOC computes gross→net and does not cover Quebec. Supported provinces: ON, AB, BC, MB, NB, NL, NT, NS, NU, PE, QC, SK, YT.",
          "inputSchema": {
            "properties": {
              "pay_frequency": {
                "description": "How often that net amount is paid",
                "enum": ["weekly", "biweekly", "semimonthly", "monthly", "annual"],
                "type": "string"
              },
              "province": {
                "description": "Two-letter province code",
                "enum": ["ON", "AB", "BC", "MB", "NB", "NL", "NT", "NS", "NU", "PE", "QC", "SK", "YT"],
                "type": "string"
              },
              "target_net_pay": {
                "description": "The agreed take-home amount per pay period, CAD",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["pay_frequency", "province", "target_net_pay"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:665274926a5de8368a25c1988ff40ac0d7de87a586134eced99c99547b1973d9"
        }
      ],
