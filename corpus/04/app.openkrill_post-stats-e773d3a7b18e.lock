      "instructions": "Post Stats: Public views of social posts. Post Stats reads public numbers of YouTube and TikTok posts: views, likes, comments, shares, saves and post time. Use get_post_stats for one post address, compare_posts to rank 2 to 10 posts by views, and list_channel_stats for the latest posts of a YouTube channel or a TikTok profile's totals. Report numbers from stats, and say a number is approximate when its sources entry has exact false. A field in not_public is not shown publicly: give the reason, do not guess it. A row with status error carries a code and message: pass them on, and retry later only when retryable is true. shape_changed means the platform changed its page; say the reader needs an update. It never signs in, so it cannot read private posts or account analytics. It does not read X: an X address comes back as x_refused with the reason; another platform comes back as platform_not_supported. A refused address comes back with reason, what_works and example: when example.uses_your_input is true, make that call; otherwise call the what_works tool with the user's own address, never the sample as is. This server allows 60 tool calls a minute per network and 5,000 a day for all callers together; the day count resets at 00:00 UTC. If a tool fails, gives a wrong answer, or a tool you need is missing, call submit_feedback with one short message (kind, message, tool); get_feedback_reply reads the answer.",
      "tools": [
        {
          "name": "compare_posts",
          "title": "Compare posts by views",
          "description": "Read 2 to 10 public posts (YouTube and TikTok can be mixed) and rank them by views, with likes per 1,000 views for each. Every row has the same fields as get_post_stats; a post that could not be read stays in the list with its error, ranked last.",
