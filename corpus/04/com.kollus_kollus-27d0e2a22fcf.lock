        {
          "name": "vod_encoding_profile_list",
          "title": "VOD 인코딩 프로파일 목록 조회",
          "description": "서비스 계정에 등록된 인코딩(트랜스코딩) 프로파일 목록을 조회한다 (GET /media-profiles). 각 프로파일 항목은 key·name·id 와 함께 container_format, video_codec, video_bitrate, video_width / video_height(해상도), video_framerate, bitrate_mode, is_audio_file(오디오 전용), is_default_preset(기본 프리셋 여부), is_optional(추가 트랜스코딩) 등 인코딩 설정 전반을 포함한다. \n\n주요 사용 케이스:\n- 패스스루(pass-through) 업로드 준비: 패스스루 업로드 API 는 인코딩 프로파일 key(profile_key)가 필수이므로, 이 tool 로 계정에 등록된 프로파일 key 를 확인한다.\n- 콘텐츠 화질 이슈 디버깅: 계정의 프로파일 설정(해상도·비트레이트 등) 자체가 의도대로인지 점검. 특정 영상에 어떤 프로파일이 적용됐는지는 이 tool 과 get_content_detail 어느 쪽에서도 확인할 수 없다.\n\n인코딩 프로파일은 계정 셋업 시 구성되는 설정값이라 변경 빈도가 낮다. 응답에 pagination 없이 전체 목록이 한 번에 반환된다.\n\nRegion 선택: 인자 region=\"kr\"|\"jp\" (기본 \"kr\"). 사용자 컨텍스트로 결정. 모호하면 사용자에게 명시적 확인 후 호출. 상세 매핑 kollus://guidance/regions. 정식 모드 연동은 계정에 등록된 region 이 이 인자보다 항상 우선 적용된다(계정당 region 고정, 혼용 불가).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "order": {
                "description": "정렬 기준. 기본 id_asc (생성 순).",
                "enum": ["id_asc", "id_desc", "name_asc", "name_desc"],
                "type": "string"
              },
              "region": {
                "description": "API region 선택. 기본 \"kr\" (글로벌 사용자도 kr 사용). 사용자가 일본법인·일본 콘솔(c-jp.kollus.com 등)·일본 자격증명을 쓰는 경우 \"jp\". 모호하면 사용자에게 확인 후 선택 — 추측 금지 (wrong-region 호출은 401). 도메인 매핑 단일 진실원천: kollus://guidance/regions.",
                "enum": ["kr", "jp"],
                "type": "string"
              }
            },
            "type": "object"
