        {
          "name": "search_docs",
          "title": "Kollus 문서·샘플 코드 검색",
          "description": "Kollus 가이드·OpenAPI 명세·샘플 코드·에러 코드 사전을 키워드(query)로 검색한다. 결과 항목은 title·section·snippet·resource_uri·relevance_score 를 포함한다. 실제 문서 본문이 필요하면 그 resource_uri(또는 list_docs_index 의 id) 값을 resource_uri 인자로 다시 호출하면 해당 문서 본문 전체를 반환한다(키워드 검색 없이 1건만 — 토큰 절감).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "doc_type": {
                "description": "문서 타입 필터. guide=사용 가이드(보충 가이드 guidance·안티패턴 전체 포함 — guidance 의 에러 코드 진단 가이드도 여기), api_spec=OpenAPI 명세(vod/live yaml)와 공식 docs 의 api 경로 문서, sample_code=샘플 코드, error_reference=공식 docs 중 에러 코드·트러블슈팅(troubleshooting) 경로 문서.",
                "enum": ["guide", "api_spec", "sample_code", "error_reference"],
                "type": "string"
              },
              "language": {
                "description": "문서 언어 필터. ⚠️ 현재 인덱싱된 모든 docs/spec/sample/guidance/anti-pattern 은 한국어(ko) 라 `en` 또는 `ja` 를 지정하면 결과가 비게 된다. 사용자 질문이 영문/일본어여도 이 필터는 비워두고 쿼리만 보낼 것 (Kollus docs 는 영문 식별자·API 명·에러 코드를 그대로 쓰므로 영문 키워드도 잘 매칭됨). i18n 인덱싱 들어가면 그때 활성화.",
                "enum": ["ko", "en", "ja"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "결과 개수 (1~50, 기본 20). 일부 문서는 관련 쿼리에서만 노출되니 20 이상 권장, 못 찾으면 50으로 재시도.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "검색어(공백으로 구분한 키워드). resource_uri 로 특정 문서 본문을 바로 가져올 때는 생략 가능. 문서 본문이 한국어라 한국어 키워드가 가장 잘 매칭되고, API명·endpoint·필드명·에러 코드·DRM명(Widevine 등)은 영문 식별자를 그대로 둔다. 예: \"drm callback\", \"원타임 url 만료\"",
                "minLength": 1,
                "type": "string"
              },
              "resource_uri": {
                "description": "특정 문서 1건의 본문을 바로 가져올 문서 id. list_docs_index 가 준 id(또는 이 검색 결과의 resource_uri) 값(kollus://…)을 그대로 넣는다. 이 값을 주면 키워드 검색 대신 해당 문서 본문 전체를 반환한다(query 는 무시). 이미 어떤 문서인지 특정된 상태면 20건 snippet 검색보다 훨씬 가볍다.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Kollus 문서·샘플 코드 검색"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
