      "instructions": "Kollus MCP 서버 — 콜러스 영상 플랫폼(VOD)의 콘텐츠·통계 조회, 공식 문서 검색, 지원 티켓 생성을 제공한다.\n\n도구 선택\n- 사용법·구현·에러 등 \"어떻게\" 류 질문은 search_docs 로 본문을 먼저 검색한다. 문서 전체 구조를 훑거나 특정 주제의 문서 유무를 확인하려면 list_docs_index 를 path 없이 호출해 폴더 맵을 본 뒤, 관심 폴더 경로(예: dev-guide/vod)로 다시 호출해 그 안의 문서 목록으로 좁혀 들어간다. list_docs_index 는 제목·설명만 보므로, 본문 내용까지 매칭해야 하면 search_docs 를 쓴다.\n- list_docs_index 로 읽을 문서를 특정했으면, 그 문서 id(kollus://…)를 search_docs 의 resource_uri 인자로 넘겨 본문만 바로 읽는다 — 20건 snippet 을 받는 키워드 검색보다 훨씬 가볍다.\n- 영상 목록·상세·통계 등 계정 데이터는 list_media_contents / get_content_detail / get_statistics_summary_daily / get_statistics_content_rank / vod_category_list / vod_channel_list / vod_encoding_profile_list 로 조회한다.\n\n답변 원칙\n- 최종 답변은 사용자의 원래 언어로 작성한다. (인덱싱된 문서는 한국어라 search_docs query 는 한국어 키워드로 보내되, API명·필드명·에러 코드·DRM명 등 영문 식별자는 그대로 둔다.)\n- 검색·resource 에서 근거를 찾지 못한 내용은 추측·환각하지 않는다. 콘솔 운영·계정 관리·SDK 키 발급 등 카테노이드 측 개입이 필요한 경우에만 tech_support@catenoid.net 을 안내한다.\n- DRM·재생·다운로드 문제는 클라이언트 SDK 만이 아니라 서버측 콜백 응답도 원인 후보로 함께 검토하고, kollus://guidance/sdk-download-debug · kollus://guidance/widevine-troubleshooting 를 우선 참조한다.\n",
      "tools": [
        {
          "name": "create_support_ticket",
          "title": "Kollus 기술지원 문의 접수",
          "description": "인덱싱된 docs·spec·samples·guidance·anti-patterns 어디에서도 답을 찾지 못했거나 사용자가 직접 Kollus 기술지원팀(PE)에 문의를 남기고 싶을 때, Catenoid 기술지원 데스크(Freshdesk)에 지원 티켓 1건을 생성한다 (POST /api/v2/tickets). 이 tool 은 읽기 전용이 아닌 유일한 쓰기 tool — 실제로 외부에 문의가 접수되므로, 호출 전 반드시 사용자에게 제목·본문·이름을 확인받고 동의를 얻을 것. \n\n문의자 식별: 회신 이메일은 연동된 Kollus 계정 이메일로 자동 지정된다 (입력 불가). Kollus 계정이 연동된 상태에서만 접수할 수 있다. name 은 모르면 사용자에게 물어본 값을 넣는다. 본문(description)은 증상·재현 절차·관련 콘텐츠 키·에러 메시지를 구체적으로 작성할수록 응대가 빠르다. 접수는 1시간에 최대 5건, 참조(CC)는 최대 7개. \n\n인증: Freshdesk 자격증명은 서버에 보관되며 고객사 토큰과 무관하다 — 호출자가 별도 키를 넘길 필요 없다. 성공 시 생성된 티켓의 id·상태 등이 반환된다.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cc_emails": {
                "description": "선택. 참조(CC)로 받을 이메일 주소 목록 (최대 7개).",
                "items": {
                  "format": "email",
                  "type": "string"
                },
                "maxItems": 7,
                "type": "array"
              },
              "description": {
                "description": "문의 본문. 증상·재현 절차·관련 콘텐츠 키(upload_file_key 등)·에러 메시지·환경을 구체적으로. 평문으로 작성하면 줄바꿈은 자동으로 <br> 로 변환된다.",
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "문의자 이름. AI 가 모르면 사용자에게 물어볼 것.",
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "description": "선택. 유선 연락이 필요한 경우 연락처.",
                "type": "string"
              },
              "status": {
                "description": "선택. 상태 2=Open, 3=Pending, 4=Resolved, 5=Closed. 기본 2(Open).",
                "enum": [2, 3, 4, 5],
                "type": "number"
              },
              "subject": {
                "description": "문의 제목 (한 줄 요약).",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["description", "name", "subject"],
            "type": "object"
          },
