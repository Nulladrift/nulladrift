        {
          "name": "list_media_contents",
          "title": "영상 목록 조회",
          "description": "⚠️ 절대 사용 금지 케이스: 자체 CMS·관리자 사이트·자체 DB 동기화 목적의 주기적 호출(폴링·setInterval·refetchInterval). 내부 툴이라도 동일하게 안티패턴이다. 이 의도가 보이면 본 tool 호출 전에 kollus://anti-patterns/cms-admin-site 을 먼저 사용자에게 안내하고, 플랫폼 콜백 + 자체 DB 미러링 패턴으로 가도록 권장할 것. \n\nKollus 계정의 VOD 영상(콘텐츠) 목록을 페이지 단위로 조회한다. category_key 미지정 시 전체 목록 (GET /media-contents), category_key 지정 시 해당 카테고리 소속 영상만 조회 (GET /categories/{key}/media-contents). 카테고리 키는 vod_category_list 로 확인. 키워드, 트랜스코딩 상태(state), 암호화/활성화 상태, 콘텐츠 유형, 원본·자막 보유 여부, 조회 범위 날짜(start_date·end_date)로 추가 필터링 가능. 응답 항목의 upload_file_key 를 get_content_detail 에 넘기면 해당 1건만 조회 (필드 구조는 목록 항목과 동일). 통계는 계정 일별 전송량·트래픽·방문자 등은 get_statistics_summary_daily, 영상별 조회 수·재생 횟수는 get_statistics_content_rank 사용. \n\n권장 사용 케이스: AI 어시스턴트의 1회성 조회, 운영 시작 시점의 1회성 backfill, 사용자 트리거 단발 새로고침, 디버그·진단용 임시 조회. 이 외엔 list 폴링이 아닌 push 기반 동기화로 가야 한다.\n\nRegion 선택: 인자 region=\"kr\"|\"jp\" (기본 \"kr\"). 사용자 컨텍스트로 결정. 모호하면 사용자에게 명시적 확인 후 호출. 상세 매핑 kollus://guidance/regions. 정식 모드 연동은 계정에 등록된 region 이 이 인자보다 항상 우선 적용된다(계정당 region 고정, 혼용 불가).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category_key": {
                "description": "카테고리 키 — 지정 시 해당 카테고리에 분류된 영상만 조회 (GET /categories/{key}/media-contents). 카테고리 키를 모르면 vod_category_list 로 먼저 확인.",
                "type": "string"
              },
              "content_type": {
                "description": "콘텐츠 유형 필터: audio=오디오, video=비디오",
                "enum": ["audio", "video"],
                "type": "string"
              },
              "encryption": {
                "description": "콘텐츠 암호화(DRM) 적용 상태 필터: encrypted=암호화됨, not_encrypted=비암호화",
                "enum": ["encrypted", "not_encrypted"],
                "type": "string"
              },
              "end_date": {
                "description": "조회 범위 종료 날짜 (YYYY-MM-DD)",
                "type": "string"
              },
              "exist_original": {
                "description": "원본 파일 보유 상태 필터: 0=원본 없음, 1=원본 저장됨",
                "enum": [0, 1],
                "type": "number"
              },
              "exist_subtitle": {
                "description": "자막 등록 상태 필터: 0=미등록, 1=등록",
                "enum": [0, 1],
                "type": "number"
              },
              "keyword": {
                "description": "영상 제목·태그 부분 일치 검색어",
                "type": "string"
              },
              "order": {
                "description": "정렬 기준. 기본 created_at|desc (최신순). field|desc 또는 field|asc 형식.",
                "enum": ["id|desc", "id|asc", "title|desc", "title|asc", "created_at|desc", "created_at|asc", "updated_at|desc", "updated_at|asc"],
                "type": "string"
              },
              "page": {
                "description": "조회 페이지 번호 (1부터)",
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "default": 20,
                "description": "페이지당 결과 개수 (기본 20, 최대 100)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "publish": {
                "description": "콘텐츠 활성화 상태 필터: published=활성, not_published=비활성",
                "enum": ["published", "not_published"],
                "type": "string"
              },
              "region": {
                "description": "API region 선택. 기본 \"kr\" (글로벌 사용자도 kr 사용). 사용자가 일본법인·일본 콘솔(c-jp.kollus.com 등)·일본 자격증명을 쓰는 경우 \"jp\". 모호하면 사용자에게 확인 후 선택 — 추측 금지 (wrong-region 호출은 401). 도메인 매핑 단일 진실원천: kollus://guidance/regions.",
                "enum": ["kr", "jp"],
                "type": "string"
              },
              "start_date": {
                "description": "조회 범위 시작 날짜 (YYYY-MM-DD)",
                "type": "string"
              },
              "state": {
                "description": "트랜스코딩 진행 상태 필터: completed=완료, transcoding=진행 중, error=실패",
                "enum": ["completed", "transcoding", "error"],
                "type": "string"
              }
            },
            "type": "object"
          },
