        {
          "name": "get_statistics_content_rank",
          "title": "콘텐츠 시청 순위",
          "description": "지정 기간(start_date~end_date) 동안의 영상별 시청 순위를 조회한다 (GET /statistics/content-rank). 조회 기간 제약 — 최근 1년 이내 날짜만 조회 가능하며 1회 최대 검색 기간은 3개월. 키워드로 필터링 가능, start_index/limit 으로 페이지네이션. 계정 전체의 일별 시계열 요약은 get_statistics_summary_daily 사용. 응답은 5분간 캐시.\n\nRegion 선택: 인자 region=\"kr\"|\"jp\" (기본 \"kr\"). 사용자 컨텍스트로 결정. 모호하면 사용자에게 명시적 확인 후 호출. 상세 매핑 kollus://guidance/regions. 정식 모드 연동은 계정에 등록된 region 이 이 인자보다 항상 우선 적용된다(계정당 region 고정, 혼용 불가).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "end_date": {
                "description": "조회 범위 종료 날짜. 대시 없는 YYYYMMDD 형식 (예: 20260201). 1회 최대 검색 기간은 3개월입니다.",
                "pattern": "^\\d{8}$",
                "type": "string"
              },
              "keyword": {
                "description": "영상 제목 부분 일치 키워드 필터",
                "type": "string"
              },
              "limit": {
                "description": "최대 결과 개수. 0 을 주면 전체. 미지정 시 서버 기본 10",
                "minimum": 0,
                "type": "integer"
              },
              "region": {
                "description": "API region 선택. 기본 \"kr\" (글로벌 사용자도 kr 사용). 사용자가 일본법인·일본 콘솔(c-jp.kollus.com 등)·일본 자격증명을 쓰는 경우 \"jp\". 모호하면 사용자에게 확인 후 선택 — 추측 금지 (wrong-region 호출은 401). 도메인 매핑 단일 진실원천: kollus://guidance/regions.",
                "enum": ["kr", "jp"],
                "type": "string"
              },
              "start_date": {
                "description": "조회 범위 시작 날짜. 대시 없는 YYYYMMDD 형식 (예: 20260101). 최근 1년 이내의 날짜만 조회 가능합니다.",
                "pattern": "^\\d{8}$",
                "type": "string"
              },
              "start_index": {
                "description": "결과 리스트 시작 번호 (페이지네이션). 미지정 시 0",
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["end_date", "start_date"],
