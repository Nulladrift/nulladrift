        {
          "name": "vod_channel_list",
          "title": "VOD 채널 목록 조회",
          "description": "⚠️ 절대 사용 금지 케이스: 자체 CMS·관리자 사이트·자체 DB 동기화 목적의 주기적 호출(폴링·setInterval·refetchInterval). 내부 툴이라도 동일하게 안티패턴이다. 이 의도가 보이면 본 tool 호출 전에 kollus://anti-patterns/cms-admin-site 을 먼저 사용자에게 안내할 것. \n\nKollus VOD 채널 목록을 조회한다 (GET /channels). VOD 채널은 영상 콘텐츠를 묶는 배포용 그룹 단위로, Live API 의 실시간 방송 채널과는 별개의 개념. 콘텐츠를 채널에 등록하면 채널별 media_content_key(재생 URL 생성·API 연동용 배포 키)가 발급된다. \n\n응답 항목 주요 필드: key(채널 키), name, description, default(기본 채널 여부), is_shared(공유 정책), is_encrypted(암호화 전용), use_pingback / pingback_url / play_callback_url(콜백 설정), use_referer_check / referer_check_domains(레퍼러 접근 제어), use_pc_download / use_mobile_download(다운로드 정책), count_of_contents(채널 내 콘텐츠 수), position, status, created_at, updated_at 등. count_of_contents 는 해당 채널에 등록된 콘텐츠 수이며, 채널에 등록되지 않은 라이브러리 콘텐츠는 포함되지 않아 채널별 합계가 list_media_contents 전체 수와 다를 수 있다. \n\n권장 사용 케이스: AI 가 채널 구조를 파악해야 하는 1회성 조회, 운영 시작 시점의 채널 매핑 backfill, 사용자 트리거 단발 조회, 디버그·진단용 임시 조회. \n\n페이징: 채널은 보통 100개 이하라 기본 호출 1회로 전체 수신. 100개 초과 케이스에선 pagination.total 보고 page 를 증가시켜 모든 페이지 수집할 것.\n\nRegion 선택: 인자 region=\"kr\"|\"jp\" (기본 \"kr\"). 사용자 컨텍스트로 결정. 모호하면 사용자에게 명시적 확인 후 호출. 상세 매핑 kollus://guidance/regions. 정식 모드 연동은 계정에 등록된 region 이 이 인자보다 항상 우선 적용된다(계정당 region 고정, 혼용 불가).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "order": {
                "description": "정렬 기준. 기본 position_asc (노출 순서).",
                "enum": ["created_at_asc", "created_at_desc", "position_asc", "position_desc"],
                "type": "string"
              },
              "page": {
                "description": "조회 페이지 번호 (1부터)",
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "default": 100,
                "description": "페이지당 결과 개수 (기본 100, 최대 100). 채널은 배포 단위 메타데이터라 보통 100개 이하 → 1회 호출로 전체 수신. 100개 초과 시 응답의 pagination.total · pagination.current_page 를 확인해 page 증가시켜 추가 호출.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "region": {
                "description": "API region 선택. 기본 \"kr\" (글로벌 사용자도 kr 사용). 사용자가 일본법인·일본 콘솔(c-jp.kollus.com 등)·일본 자격증명을 쓰는 경우 \"jp\". 모호하면 사용자에게 확인 후 선택 — 추측 금지 (wrong-region 호출은 401). 도메인 매핑 단일 진실원천: kollus://guidance/regions.",
                "enum": ["kr", "jp"],
                "type": "string"
              },
              "status": {
                "description": "채널 활성화 상태 필터: 0=비활성, 1=활성",
                "enum": [0, 1],
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "VOD 채널 목록 조회"
          },
          "behavior": {
            "destructive": false,
