        {
          "name": "list_docs_index",
          "title": "문서 색인 목록 조회",
          "description": "Kollus 가이드·에러 코드 사전·보충 가이드·anti-pattern 문서의 색인을 폴더 트리로 탐색한다. path 없이(또는 \"/\") 호출하면 전체 폴더 맵(폴더 경로별 재귀 문서 수)을 반환하고, 특정 폴더 경로(예: \"dev-guide/vod\")를 주면 그 폴더에 바로 속한 문서 목록(id·title·description)과 하위 폴더를 반환한다. id 는 MCP resource_uri(kollus://…) 그대로이며, 본문이 필요하면 그 id 를 MCP resource 로 읽는다. OpenAPI 스펙·샘플 코드는 포함하지 않는다.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "path": {
