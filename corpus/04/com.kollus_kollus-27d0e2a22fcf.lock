        {
          "name": "get_statistics_summary_daily",
          "title": "일별 통계 요약",
          "description": "계정 전체의 일별 통계 요약을 조회한다 (GET /statistics/summary-daily). 지정한 날짜 범위(start_date~end_date)의 기간 합계와 일자별 시계열(daily_data[])을 반환: 전송량 transfer/total_transfer(bytes), 트래픽 대역폭 traffic/max_traffic(bps), 스토리지 storage/total_storage/max_storage(bytes), 트랜스코딩 용량 transcoding_size(bytes)·처리 횟수 transcoding_count, 방문자 수 visitor/total_visitor(Unique Visitor). 재생 수·시청 시간 필드는 없다 — 영상별 조회 수·재생 횟수는 get_statistics_content_rank 를 사용. 조회 기간 제약 — 최근 1년 이내 날짜만 조회 가능하며 1회 최대 검색 기간은 3개월(긴 기간은 3개월 단위로 나눠 호출). 응답은 5분간 캐시. group_by(device/region/cdn) 류 분포는 현재 Kollus REST API 미지원.\n\nRegion 선택: 인자 region=\"kr\"|\"jp\" (기본 \"kr\"). 사용자 컨텍스트로 결정. 모호하면 사용자에게 명시적 확인 후 호출. 상세 매핑 kollus://guidance/regions. 정식 모드 연동은 계정에 등록된 region 이 이 인자보다 항상 우선 적용된다(계정당 region 고정, 혼용 불가).",
