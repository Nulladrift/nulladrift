        {
          "name": "vod_category_list",
          "title": "VOD 카테고리 목록 조회",
          "description": "⚠️ 절대 사용 금지 케이스: 자체 CMS·관리자 사이트·자체 DB 동기화 목적의 주기적 호출(폴링·setInterval·refetchInterval). 카테고리는 변경 빈도가 매우 낮은 메타데이터라 폴링은 특히 낭비다. 이 의도가 보이면 본 tool 호출 전에 kollus://anti-patterns/cms-admin-site 을 먼저 사용자에게 안내할 것. \n\nKollus VOD 카테고리 트리를 조회한다 (GET /categories). 각 카테고리 항목은 key·name·parent_key·level·children_exist·position 등을 포함. parent_key 가 null 이면 최상위 카테고리, level 필드로 트리 깊이 확인. parent_category_key 미지정 시 전체 카테고리(계층 무관) 반환, 지정 시 해당 상위의 모든 하위(자손) 카테고리. 카테고리에 연결된 채널 요약(channels[])도 함께 응답에 포함. \n\n권장 사용 케이스: AI 가 영상 분류 구조를 파악해야 하는 1회성 조회, 운영 시작 시점의 카테고리 매핑 backfill, 사용자 트리거 단발 조회, 디버그·진단용 임시 조회. \n\n페이징: 카테고리는 보통 100개 이하라 기본 호출 1회로 전체 수신. 100개 초과 케이스에선 pagination.total 보고 page 를 증가시켜 모든 페이지 수집할 것.\n\nRegion 선택: 인자 region=\"kr\"|\"jp\" (기본 \"kr\"). 사용자 컨텍스트로 결정. 모호하면 사용자에게 명시적 확인 후 호출. 상세 매핑 kollus://guidance/regions. 정식 모드 연동은 계정에 등록된 region 이 이 인자보다 항상 우선 적용된다(계정당 region 고정, 혼용 불가).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "order": {
                "description": "정렬 기준. 기본 name_asc (이름 오름차순).",
                "enum": ["created_at_asc", "created_at_desc", "position_asc", "position_desc", "name_asc", "name_desc"],
                "type": "string"
              },
              "page": {
                "description": "조회 페이지 번호 (1부터)",
                "minimum": 1,
                "type": "integer"
              },
              "parent_category_key": {
                "description": "상위 카테고리 키. 지정 시 해당 상위의 모든 하위(자손) 카테고리 반환. 미지정 시 전체 카테고리 (계층 무관).",
                "type": "string"
              },
              "per_page": {
                "default": 100,
                "description": "페이지당 결과 개수 (기본 100, 최대 100). 카테고리는 메타데이터라 보통 100개 이하 → 1회 호출로 전체 수신. 100개 초과 시 응답의 pagination.total · pagination.current_page 를 확인해 page 증가시켜 추가 호출.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "region": {
                "description": "API region 선택. 기본 \"kr\" (글로벌 사용자도 kr 사용). 사용자가 일본법인·일본 콘솔(c-jp.kollus.com 등)·일본 자격증명을 쓰는 경우 \"jp\". 모호하면 사용자에게 확인 후 선택 — 추측 금지 (wrong-region 호출은 401). 도메인 매핑 단일 진실원천: kollus://guidance/regions.",
                "enum": ["kr", "jp"],
                "type": "string"
              }
            },
            "type": "object"
