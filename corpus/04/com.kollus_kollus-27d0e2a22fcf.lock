        {
          "name": "get_content_detail",
          "title": "영상 상세 메타데이터 조회",
          "description": "특정 영상 1건의 메타데이터를 조회한다 (GET /media-contents/{upload_file_key}). 응답 필드는 list_media_contents 항목과 같은 구조: 제목·카테고리·재생 길이(duration), 암호화 적용 여부(use_encryption), 트랜스코딩 진행 상태(transcoding_stage), 패스스루 여부(is_passthrough), media_information(컨테이너·비디오·오디오 코덱/비트레이트/해상도), 원본 파일명·용량, 포스터·스냅샷 URL, media_content_keys(채널 등록 시 발급되는 채널별 키), 등록·트랜스코딩 완료·수정 일시 등. DRM 정책 세부(Widevine/PlayReady/FairPlay 등), 콜백 URL, 재생 만료 정책, 자막 트랙, 적용된 인코딩 프로파일은 응답에 포함되지 않는다. 트랜스코딩 실패·암호화 여부·파일 속성 1차 확인에 사용. upload_file_key 를 모르면 list_media_contents 부터 사용.\n\nRegion 선택: 인자 region=\"kr\"|\"jp\" (기본 \"kr\"). 사용자 컨텍스트로 결정. 모호하면 사용자에게 명시적 확인 후 호출. 상세 매핑 kollus://guidance/regions. 정식 모드 연동은 계정에 등록된 region 이 이 인자보다 항상 우선 적용된다(계정당 region 고정, 혼용 불가).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "region": {
                "description": "API region 선택. 기본 \"kr\" (글로벌 사용자도 kr 사용). 사용자가 일본법인·일본 콘솔(c-jp.kollus.com 등)·일본 자격증명을 쓰는 경우 \"jp\". 모호하면 사용자에게 확인 후 선택 — 추측 금지 (wrong-region 호출은 401). 도메인 매핑 단일 진실원천: kollus://guidance/regions.",
                "enum": ["kr", "jp"],
                "type": "string"
              },
              "upload_file_key": {
                "description": "Kollus 영상의 고유 식별자 (upload_file_key). list_media_contents 응답 항목의 upload_file_key, 또는 Kollus VOD 콘솔 > [라이브러리] > 콘텐츠 제목 클릭 > [기본] 탭에서 확인. 이전 API 의 media_content_id(정수)를 대체한 값이며, get_statistics_content_rank 응답의 content_id 와는 다른 값이다 (content_rank 에서는 upload_key 가 upload_file_key 에 해당).",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["upload_file_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "영상 상세 메타데이터 조회"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ee961b12d79d2fcb2645065b9ba8e0615837f912643308955ef5315de13a5a2a"
