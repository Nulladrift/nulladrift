        {
          "name": "search_models",
          "title": "Search open models",
          "description": "Find open-weight AI models by name or task (chat, coding, agentic, vision, reasoning). Returns each model's slug, size, context length and licence; use the slug with hardware_for_model.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
