{
  "lockfileVersion": 2,
  "subjects": {
    "com.readygpu/readygpu": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://readygpu.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "readygpu",
        "title": "readygpu: hardware for local AI",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "For any open AI model: which graphics cards (new and used), Macs and mini PCs sold in the UK, Germany, Canada and the US run it fully in memory, how much memory it needs at each context length, and an estimated speed. Every answer links the readygpu.com page that shows today's prices. Free and read-only, with no sign-up, account or API key. Start with search_models or find_hardware to get slugs, then hardware_for_model, hardware_details, compare_hardware or best_hardware. Speeds are estimates, so say so when you quote them, and link the page each answer gives. Prices are on readygpu.com's own pages only: follow the page link in each answer.",
      "tools": [
        {
          "name": "best_hardware",
          "title": "Best hardware lists",
          "description": "The ranked 'best for local AI' lists of a market (all graphics cards, cards under a price, used cards, Macs and mini PCs): best first by the most capable model each runs fully in memory. Prices are on each list's page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "list": {
                "default": "gpus",
                "description": "Which list: us: gpus, gpus-under-300, gpus-under-500, gpus-under-1000, gpus-under-2000, used-gpus, machines; uk: gpus, gpus-under-300, gpus-under-500, gpus-under-1000, gpus-under-2000, used-gpus, machines; de: gpus, gpus-under-300, gpus-under-500, gpus-under-1000, gpus-under-2000, used-gpus, machines; ca: gpus, gpus-under-400, gpus-under-700, gpus-under-1400, gpus-under-2800, used-gpus, machines. Lists with too few priced entries are not published.",
                "pattern": "^[a-z0-9-]{1,60}$",
                "type": "string"
              },
              "market": {
                "default": "us",
                "description": "Which market's catalogue: us, uk, de (Germany and the rest of the EU) or ca (Canada).",
                "enum": ["us", "uk", "de", "ca"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Best hardware lists"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f90fb5e115f0b613a92d15bd46a3755b7465d4189d506be7d395522c6c2dcf53"
        },
        {
          "name": "compare_hardware",
          "title": "Compare two",
          "description": "Two graphics cards or machines side by side in a market: memory, bandwidth, how many models each runs fully in memory, and the estimated speed of each on every model.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "a": {
                "description": "First card or machine slug",
                "maxLength": 120,
                "minLength": 1,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              },
              "b": {
                "description": "Second card or machine slug",
                "maxLength": 120,
                "minLength": 1,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              },
              "context": {
                "anyOf": [
                  {
                    "const": 8192,
                    "type": "number"
                  },
                  {
                    "const": 32768,
                    "type": "number"
                  },
                  {
                    "const": 65536,
                    "type": "number"
                  },
                  {
                    "const": 131072,
                    "type": "number"
                  }
                ],
                "default": 32768,
                "description": "Context length in tokens: 8192, 32768, 65536 or 131072."
              },
              "market": {
                "default": "us",
                "description": "Which market's catalogue: us, uk, de (Germany and the rest of the EU) or ca (Canada).",
                "enum": ["us", "uk", "de", "ca"],
                "type": "string"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare two"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:315c585a255705a74aa14a857d29fc3cc74457a4cb4c903284c6cba1814c72ad"
        },
        {
          "name": "find_hardware",
          "title": "Find graphics cards or machines",
          "description": "List graphics cards or complete machines (Macs, mini PCs) sold in a market, with memory, bandwidth, the estimated speed on a model and a link to each one's page and prices. Filter by minimum memory and new or used; sort by speed or popularity.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "condition": {
                "default": "any",
                "enum": ["any", "new", "used"],
                "type": "string"
              },
              "context": {
                "anyOf": [
                  {
                    "const": 8192,
                    "type": "number"
                  },
                  {
                    "const": 32768,
                    "type": "number"
                  },
                  {
                    "const": 65536,
                    "type": "number"
                  },
                  {
                    "const": 131072,
                    "type": "number"
                  }
                ],
                "default": 32768,
                "description": "Context length in tokens: 8192, 32768, 65536 or 131072."
              },
              "kind": {
                "default": "gpu_card",
                "enum": ["gpu_card", "machine"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "default": "us",
                "description": "Which market's catalogue: us, uk, de (Germany and the rest of the EU) or ca (Canada).",
                "enum": ["us", "uk", "de", "ca"],
                "type": "string"
              },
              "min_memory_gb": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "model": {
                "description": "A model slug (from search_models) for the speed column; a reference model by default",
                "maxLength": 120,
                "minLength": 1,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              },
              "sort": {
                "default": "speed",
                "enum": ["speed", "popularity"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find graphics cards or machines"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f3cd490186d6156cdd30dddd6e72409ad243187c1f5310b541b3211915e3ce7b"
        },
