          },
          "digest": "sha256:ba46954a90c280039a76e590ad7a390d2d726552e7c05e199ab657386ad8004a"
        },
        {
          "name": "hardware_for_model",
          "title": "Hardware to run a model",
          "description": "For one model: how much memory it needs at each context length, and the fastest hardware (and the fastest Mac) that runs it fully in memory in a market, with their speeds. Links the model's page, which shows the cheapest and best-value picks with prices.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
