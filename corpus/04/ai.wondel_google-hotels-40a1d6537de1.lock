      "serverInfo": {
        "name": "Google Hotels",
        "title": "Google Hotels MCP",
        "version": "1.0.0",
        "description": "Live Google Hotels search: properties with rates and ratings, plus photos and reviews.",
        "websiteUrl": "https://mcps.wondel.ai/servers/google-hotels/"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Data from Google Hotels (https://www.google.com/travel/hotels) for this one query. Attribute it to that source, keep the original links and do not present it as Wondel.ai's; all rights stay with the source operator. Have the user verify prices and availability at the source. For the user's personal use, not bulk extraction or redistribution. Unofficial, as-is. Terms: https://mcp.wondel.ai/legal.txt; contact: support@wondel.ai.",
      "tools": [
        {
          "name": "google_hotels_photos",
          "title": "Get Google Hotels Property Photos (SerpAPI)",
          "description": "Fetch the full set of photos for a single Google Hotels property via SerpAPI. Requires a `property_token` taken from a google_hotels_search result. Paginate with next_page_token.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "next_page_token": {
                "description": "Token from a prior response to fetch the next page of photos.",
                "type": "string"
              },
              "no_cache": {
                "description": "Force a fresh SerpAPI fetch and bypass this server's result cache. Default false.",
                "type": "boolean"
              },
              "property_token": {
                "description": "Property token from a google_hotels_search result identifying the property whose photos to fetch.",
                "type": "string"
              },
              "zero_trace": {
                "description": "Enterprise-only ZeroTrace mode: don't store search params/metadata on SerpAPI. Default false.",
                "type": "boolean"
              }
            },
            "required": ["property_token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f5dfe06b4b4b738ab9acccd91a113a672fcf3b7ef129ae910937644ef73981d7"
        },
        {
          "name": "google_hotels_reviews",
          "title": "Get Google Hotels Property Reviews (SerpAPI)",
          "description": "Fetch reviews for a single Google Hotels property via SerpAPI. Requires a `property_token` taken from a google_hotels_search result. Filter by category_token or source_number, order with sort_by, and paginate with next_page_token.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category_token": {
                "description": "Token to filter reviews by a category/topic (from a prior reviews response).",
                "type": "string"
              },
              "hl": {
                "description": "Language code, e.g. 'en', 'es', 'pt-br'.",
                "type": "string"
              },
              "next_page_token": {
                "description": "Token from a prior response to fetch the next page of reviews.",
                "type": "string"
              },
              "no_cache": {
                "description": "Force a fresh SerpAPI fetch and bypass this server's result cache. Default false.",
                "type": "boolean"
              },
              "property_token": {
                "description": "Property token from a google_hotels_search result identifying the property whose reviews to fetch.",
                "type": "string"
              },
              "sort_by": {
                "description": "Sort order: 1 = most helpful, 2 = most recent, 3 = highest rating, 4 = lowest rating.",
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              },
              "source_number": {
                "description": "Filter reviews by a specific review source (provider) number, as listed in a prior response.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "zero_trace": {
                "description": "Enterprise-only ZeroTrace mode: don't store search params/metadata on SerpAPI. Default false.",
                "type": "boolean"
              }
            },
            "required": ["property_token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cd84a146dd5fca5e3468927aedcac0d96e16e54de7ba750a1963c90be409f214"
        },
        {
          "name": "google_hotels_search",
          "title": "Search Google Hotels (SerpAPI)",
          "description": "Search Google Hotels live via SerpAPI. Returns properties (hotels and, with vacation_rentals, rentals) with names, prices/rates, overall ratings, review counts, amenities, images and location, plus the brands/property_types/amenities filter ids you can feed back in. Requires q (a destination, area or hotel name), check_in_date and check_out_date (YYYY-MM-DD). Every property in the results carries a `property_token`: pass it back here (keeping the same check_in_date/check_out_date) to get that one property's full details, or hand it to google_hotels_photos and google_hotels_reviews. Paginate with next_page_token. Prices are in `currency` (default USD). Result shape: { source, fetchedAt, query, search_metadata, search_parameters, search_information, brands, ads, properties: [...], serpapi_pagination } — the list key is `properties` (ads are separate). Each property: { type, name, property_token, link, gps_coordinates, rate_per_night: { lowest, extracted_lowest }, total_rate, prices: [{ source, num_guests, rate_per_night }], overall_rating, reviews, hotel_class (label), extracted_hotel_class (number), amenities, images: [{ thumbnail, original_image }], nearby_places, description }. With property_token the single property's fields come back at the top level instead of `properties`.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "adults": {
                "description": "Number of adults. Default 2.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "amenities": {
                "description": "Filter by amenities: comma-separated amenity ids (see amenities in a prior response).",
                "type": "string"
              },
              "bathrooms": {
                "description": "Minimum number of bathrooms. Vacation rentals only. Default 0.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "bedrooms": {
                "description": "Minimum number of bedrooms. Vacation rentals only. Default 0.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "brands": {
                "description": "Filter by hotel brand: comma-separated brand ids (see brands in a prior response). Not applicable to vacation rentals.",
                "type": "string"
              },
              "check_in_date": {
                "description": "Check-in date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "check_out_date": {
                "description": "Check-out date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "children": {
                "description": "Number of children. Default 0.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "children_ages": {
                "description": "Ages of the children as comma-separated values, e.g. '5,8'. Each age 1-17; the count should match `children`.",
                "type": "string"
              },
              "currency": {
                "description": "Currency of returned prices (ISO code, e.g. 'USD', 'EUR'). Default USD.",
                "type": "string"
              },
              "eco_certified": {
                "description": "Only show eco-certified properties. Default false.",
                "type": "boolean"
              },
              "free_cancellation": {
                "description": "Only show properties offering free cancellation. Default false.",
                "type": "boolean"
              },
              "gl": {
                "description": "Country code for the search, e.g. 'us', 'uk', 'de'.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "hl": {
                "description": "Language code, e.g. 'en', 'es', 'pt-br'.",
                "type": "string"
              },
              "hotel_class": {
                "description": "Filter by hotel class (stars): comma-separated values from 2 to 5, e.g. '4,5'.",
                "type": "string"
              },
              "max_price": {
                "description": "Maximum price per night in the selected currency.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "min_price": {
                "description": "Minimum price per night in the selected currency.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "next_page_token": {
                "description": "Token from a prior response to fetch the next page of results.",
                "type": "string"
              },
              "no_cache": {
                "description": "Force a fresh SerpAPI fetch and bypass this server's result cache. Default false.",
                "type": "boolean"
              },
              "property_token": {
                "description": "Token for a single property from a prior search result; returns that property's full details. Still pass check_in_date and check_out_date.",
                "type": "string"
              },
              "property_types": {
                "description": "Filter by property type: comma-separated type ids (see property_types in a prior response).",
                "type": "string"
              },
              "q": {
                "description": "Search query: a destination, area, or hotel name (e.g. 'Bali resorts', 'hotels in Paris').",
                "type": "string"
              },
              "rating": {
                "description": "Minimum overall rating: 7 = 3.5+, 8 = 4.0+, 9 = 4.5+.",
                "maximum": 9,
                "minimum": 7,
                "type": "integer"
              },
              "sort_by": {
                "description": "Sort order: 3 = lowest price, 8 = highest rating, 13 = most reviewed. Omit for SerpAPI's default relevance ranking.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "special_offers": {
                "description": "Only show properties with special offers. Default false.",
                "type": "boolean"
              },
              "vacation_rentals": {
                "description": "Search vacation rentals instead of hotels. Default false (hotels).",
                "type": "boolean"
              },
              "zero_trace": {
                "description": "Enterprise-only ZeroTrace mode: don't store search params/metadata on SerpAPI. Default false.",
                "type": "boolean"
              }
            },
            "required": ["check_in_date", "check_out_date", "q"],
            "type": "object"
          },
