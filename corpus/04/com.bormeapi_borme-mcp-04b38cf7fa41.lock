          },
          "digest": "sha256:176202aeb9feb771d06b31bd6587c6e5d3da0d7d5dc13b3a512f161bbc29d73d"
        },
        {
          "name": "brand_owner",
          "title": "Find a brand's company",
          "description": "Find the Spanish company a trademark or trading name is linked to, in the\nSpanish patent office's (OEPM) trademark and commercial-name records we\nhold (the archive starts in 1987).\n\nUse it when the user names a brand; for a company's own name use\nsearch_companies, for a known company's brands use company_brands.\n\nReturns JSON {found, brand, matches: [{brand, kind, company_slug,\ncompany_name, company_status, file}], truncated, source, note}. kind\ncommercial_name identifies a business; trademark distinguishes goods or\nservices (NESCAFÉ is not another name for Nestlé): say which kind a hit\nis. Links come from holder-name matching (the office publishes no tax\nIDs); ambiguous holders stay unlinked: present a hit as a name match,\nnot confirmed ownership. found false is not proof the brand is unused.\nOn a hit, use company_history with the slug.\n\nRead-only; one request per call. Needs the basic plan or higher: send your\nAPI key in the X-API-Key header (https://bormeapi.com/account).",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "Brand or trading name, or part of it, at least 3 letters or digits after punctuation is removed, case-insensitive, e.g. \"ZARA\".",
                "title": "Brand",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum matches, integer 1-200, e.g. 10 (default 20).",
                "maximum": 200,
                "title": "Limit",
                "type": "integer"
              }
            },
            "required": ["brand"],
            "title": "brand_ownerArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a brand's company"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d064f59ab833a0ede048385a36fd2d342adde5d6852674b774e7f0cc4cce86f1"
        },
        {
          "name": "company_brands",
          "title": "A company's brands",
          "description": "List the trademarks and trading names that the Spanish patent office (OEPM)\nrecords under a holder with this company's name.\n\nUse it for a known company (a slug from search_companies or\ncompany_history); to go from a brand to its company use brand_owner.\n\nReturns JSON {company_slug, commercial_names, trademarks (each {name, file,\nstatus, since}), counts, truncated, limit_per_kind, source, note}. The\noffice publishes no tax IDs, so every link is a name match, not\nconfirmed ownership. An empty result means none is linked in our data,\nnot that the company holds none; {error, suggested_companies} means no\ncompany was found with that slug, so nothing was looked up. limit applies to each kind separately,\nnewest first; counts is what this answer lists, not the company's total,\nand truncated true for a kind means more are linked: raise limit.\n\nRead-only; one request per call. Needs the basic plan or higher: send your\nAPI key in the X-API-Key header (https://bormeapi.com/account).",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "Company slug, as returned by search_companies or company_history, e.g. vaz-metales-sl.",
                "title": "Company",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "Maximum results per kind (trademarks, trading names), integer 1-200, e.g. 10 (default 50).",
                "maximum": 200,
                "title": "Limit",
                "type": "integer"
              }
            },
            "required": ["company"],
            "title": "company_brandsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "A company's brands"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5d770f35edfe9709c4727aef5b2af01ab2b9856ad816c7ceaa172cbc0b7b0c1d"
        },
        {
          "name": "company_by_nif",
          "title": "Find a company by NIF",
          "description": "Look up a Spanish company by its NIF/CIF tax ID. Use it when the user gives\na tax ID (with a name use search_companies); on a hit, call\ncompany_history with company_slug.\n\nReturns JSON {found, company_slug, current_name, status, nif_source,\nnif_caveat, ...}; use current_name. BORME has no dedicated tax-ID field: more\nthan 580,000 NIF mappings from public sources and the text of BORME notices\ncover a minority of companies, so a miss (reason nif_unmapped) means\n\"not matched yet\", not \"does not exist\". reason nif_revoked: AEAT records a\nrevocation; relay tell_the_user. On a company match, relay nif_status.note if\npresent. invalid_input true: not a NIF/CIF.\nreason nif_check_character_failed: relay tell_the_user and did_you_mean.\nreason not_registry_entity: explain entity_type. ambiguous\ntrue: ask which candidate. nif_caveat present: say the link is not settled.\n\nRead-only. Needs the basic plan or higher: send your\nAPI key in the X-API-Key header (https://bormeapi.com/account).",
          "inputSchema": {
            "properties": {
              "nif": {
                "description": "Spanish NIF/CIF, normally 9 characters, e.g. B12345674. Spaces, hyphens, dots and the ES VAT prefix (ESB12345674) are accepted; other country prefixes are not.",
                "title": "Nif",
                "type": "string"
              }
            },
            "required": ["nif"],
            "title": "company_by_nifArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a company by NIF"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:599dc6e81f7d4fc7842238703c287beddfd70e6e41e5786951bc08905fde4abb"
        },
        {
          "name": "company_history",
          "title": "Company registry timeline",
          "description": "Get one company's BORME timeline: its published registry events within your\nplan's window.\n\nUse it once the company is known (a slug from search_companies or\ncompany_by_nif); across many companies use search_events. A name is\nsearched too: several matches return {ambiguous: true, candidates}, none\nreturns {error, suggested_companies}.\n\nReturns JSON {company_slug, total_events, first_seen, last_seen, truncated,\nnext_offset, count, events} (as in search_events), with former_slugs for\na merged company (an old slug returns the merged timeline) and\nplan_window on a limited plan. total_events, first_seen and last_seen\ncover the whole timeline in your window, not this page. To page,\nkeep limit and order and pass next_offset as offset (at most 10000)\nuntil it is null.\n\nRead-only; one request per call. Without an API key (X-API-Key header) only\nthe last 7 days; basic covers 365 days, pro and risk the full history\nback to 2009. If all its events are outside your window, the refusal\ncounts them.",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "Company slug, e.g. vaz-metales-sl (from search_companies), or a name of at least 3 letters or digits, e.g. \"Mercadona\", searched case-insensitively.",
                "title": "Company",
                "type": "string"
              },
              "limit": {
                "default": 100,
                "description": "Events per page, integer 1-200, e.g. 20 (default 100).",
                "maximum": 200,
                "title": "Limit",
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Events to skip, integer 0-10000 (default 0); pass the previous page's next_offset, e.g. 100.",
                "title": "Offset",
                "type": "integer"
              },
              "order": {
                "default": "desc",
                "description": "\"desc\" (default, newest first) or \"asc\" (oldest first), e.g. \"asc\" to start from the earliest event in your plan's window.",
                "title": "Order",
                "type": "string"
              }
            },
            "required": ["company"],
            "title": "company_historyArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Company registry timeline"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bf60d7f06802aed84ae9eb5f436680028ee71c9202e899f1b00495a538696d15"
        },
        {
          "name": "company_signals",
          "title": "A company's signals",
          "description": "Get one company's derived signals within your plan's window, newest first:\nthe REST API's GET /v1/companies/{slug}/signals.\n\nUse it for one company's ownership changes, mass exits, insolvency\ndeclarations and the like; across all companies use recent_signals. A name\nis searched as in\ncompany_history: several matches return {ambiguous: true, candidates},\nnone returns {error, suggested_companies}.\n\nReturns JSON {company_slug, total, count, next_offset, signals:\n[{event_id, signal_type, date, company_slug, company_name, province,\ndetails}]}, with former_slugs for a merged company (every slug is read),\nand plan_window or hidden_by_plan when your plan's window applied: relay\ntheir notes. AEAT_DEBTOR: say the company was on the list published on\nthat date, never that the debt is outstanding. count 0 is not proof of\ngood health.\n\nRead-only; one request per call. Needs the pro plan or higher; key in the X-API-Key header\n(https://bormeapi.com/account).",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "Company slug, e.g. vaz-metales-sl (from search_companies), or a name of at least 3 letters or digits, e.g. \"Mercadona\", searched case-insensitively as in company_history.",
                "title": "Company",
                "type": "string"
              },
              "date_from": {
                "description": "Earliest signal date, inclusive, YYYY-MM-DD, e.g. 2024-11-01. Optional; moved up to the start of your plan's window when earlier (plan_window says so).",
                "title": "Date From",
                "type": "string"
              },
              "date_to": {
                "description": "Latest signal date, inclusive, YYYY-MM-DD, e.g. 2026-10-31. Optional.",
                "title": "Date To",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "Signals per page, integer 1-200, e.g. 20 (default 50).",
                "maximum": 200,
                "title": "Limit",
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Signals to skip, integer 0-10000 (default 0); pass the previous page's next_offset, e.g. 50.",
                "title": "Offset",
                "type": "integer"
              },
              "signal_types": {
                "description": "Optional list; each one of INSOLVENCY_FILED, ACCORDION, MASS_EXIT, OWNERSHIP_CHANGE, DISTRESS_COMBO, PHOENIX, ADDRESS_CLUSTER, AEAT_DEBTOR, PUBLIC_CONTRACT_AWARD, e.g. [\"OWNERSHIP_CHANGE\", \"MASS_EXIT\"]; omit for all types your plan covers.",
                "items": {
                  "type": "string"
                },
                "title": "Signal Types",
                "type": "array"
              }
            },
            "required": ["company"],
            "title": "company_signalsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "A company's signals"
          },
          "behavior": {
            "destructive": false,
