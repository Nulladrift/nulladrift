      "tools": [
        {
          "name": "act_stats",
          "title": "Act counts by type, period and province",
          "description": "Count BORME acts by act type, period (month, quarter or year) and\nprovince: how many companies and entries had mergers, spin-offs, capital\nincreases or any other act type, newest period first.\n\nUse it for trends (\"mergers per quarter in Spain since 2020\"). To read\nthe acts themselves use search_events.\n\nReturns JSON {grain, count, truncated, rows: [{period, act_type, province,\ncompanies, events}], data_through, built_from, built_to, note,\nplan_window}, plus hidden_by_plan when the plan left buckets out, and\nnot_built (no rows, never zeros) when the range reaches years outside\nbuilt_from..built_to. period is the bucket's first day by BORME\npublication date. companies counts distinct companies in that bucket:\nnever add rows up. Province \"*\" is all of Spain; a community gives one row\nper province, not a total.\n\nRead-only; one request per call. Needs the pro plan or higher: send your\nkey in the X-API-Key header (https://bormeapi.com/account).",
          "inputSchema": {
            "properties": {
              "act_types": {
                "description": "Optional list of act type enums to count, e.g. [\"MERGER_BY_ABSORPTION\", \"TOTAL_SPIN_OFF\"]; omit for every act type. Full list: list_act_types.",
                "items": {
                  "type": "string"
                },
                "title": "Act Types",
                "type": "array"
              },
              "by_province": {
                "default": false,
                "description": "Without provinces: true gives one row per province instead of the all-provinces rows, e.g. true (default false).",
                "title": "By Province",
                "type": "boolean"
              },
              "date_from": {
                "description": "Optional YYYY-MM-DD, e.g. 2024-01-01; the period holding this day is the first one. Data starts on 2009-01-02.",
                "title": "Date From",
                "type": "string"
              },
              "date_to": {
                "description": "Optional YYYY-MM-DD, e.g. 2025-12-31; periods starting on or before this day.",
                "title": "Date To",
                "type": "string"
              },
              "grain": {
                "default": "month",
                "description": "The length of each period, one of \"month\" (default), \"quarter\", \"year\", e.g. \"quarter\".",
                "enum": ["month", "quarter", "year"],
                "title": "Grain",
                "type": "string"
              },
              "limit": {
                "default": 1000,
                "description": "Maximum rows, integer 1-5000, e.g. 200 (default 1000); truncated is true when more matched.",
                "maximum": 5000,
                "title": "Limit",
                "type": "integer"
              },
              "provinces": {
                "description": "Optional list of BORME province names, accent- and case-insensitive, e.g. [\"MADRID\", \"BARCELONA\"]; an autonomous community gives one row per province, e.g. [\"Cataluña\"]. Omit for the all-provinces rows (province \"*\").",
                "items": {
                  "type": "string"
                },
                "title": "Provinces",
                "type": "array"
              }
            },
            "title": "act_statsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Act counts by type, period and province"
          },
          "behavior": {
