        {
          "name": "company_snapshot",
          "title": "Company registry card",
          "description": "Get one company's current registry card: the same answer as the REST API's\nGET /v1/companies/{slug}.\n\nUse it for \"who runs it, who owns it, what capital\": officers (the current\nroles derived from the published acts), sole_shareholder as printed,\ncapital_eur, address, status, NIF with its source, public_contracts and\na size_hint estimate. For the dated acts use company_history. A name is\nsearched as in company_history: several matches return {ambiguous: true,\ncandidates, candidate_names with name, province and status}, none returns\n{error, suggested_companies}.\n\nReturns JSON with company_slug, company_name, current_name, status,\nofficers, sole_shareholder, capital_eur, nif, nif_caveat, sources and the\nother snapshot fields, plus former_slugs for a merged company. BORME\npublishes no minority shareholdings, employees or revenue.\n\nRead-only; one request per call. Needs the basic plan or higher: send your\nAPI key in the X-API-Key header (https://bormeapi.com/account).",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "Company slug, e.g. vaz-metales-sl (from search_companies), or a name of at least 3 letters or digits, e.g. \"Mercadona\", searched case-insensitively as in company_history.",
