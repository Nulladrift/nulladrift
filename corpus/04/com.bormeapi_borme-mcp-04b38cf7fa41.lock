        {
          "name": "daily_digest",
          "title": "Daily BORME digest",
          "description": "Summarise one BORME publication day: total events, counts by act type, the\ntop 10 provinces and the day's insolvency-proceedings notices.\n\nUse it for \"what was published today\" or a day's figures; to read the\nnotices use search_events with date_from = date_to = that day.\n\nReturns JSON {date, total_events, by_type, top_provinces, insolvencies:\n[{company, province}]}. insolvencies lists the events with\nINSOLVENCY_DECLARATION or INSOLVENCY_STATUS (not SUSPENSION_OF_PAYMENTS,\nBANKRUPTCY_LEGACY or PROVISIONAL_SHEET_CLOSURE_INSOLVENCY). An\nINSOLVENCY_STATUS notice can record any stage, from a request for a\ndeclaration to the conclusion: before saying a company was declared\ninsolvent, read the act's payload with search_events. A day without a\ngazette (weekends, holidays) returns total_events 0.\n\nRead-only; one request per call. Without an API key only days within the\nlast 7 days; send your key in the X-API-Key header\n(https://bormeapi.com/account) for your plan's window.",
          "inputSchema": {
