        {
          "name": "search_companies",
          "title": "Search companies by name",
          "description": "Find Spanish companies by name and return ranked company cards. Use it first\nwhen the user gives a company name, then company_history with its\ncompany_slug; with a tax ID use company_by_nif, with a brand use\nbrand_owner.\n\nMatches current names, former names and variants, ignoring accents, case,\npunctuation and the legal form. Returns JSON {query, count, total,\ntotal_is_at_least, truncated, limit, offset, companies: [{company_slug,\nname, legal_form, province, municipality, status, in_insolvency,\nlast_act_date, match, matched_on}]}. match is exact, prefix, contains or\nfuzzy (a lead, not an identification; say so). Ranked by match, then\nactive companies, then newest act.\n\nRead-only; one request per call; not limited by the free plan's 7 days of\nhistory. The free plan shows at most the first 5 ranked cards;\nhidden_by_plan counts the rest: relay its note. The NIF is on the card\nfrom the basic plan up (X-API-Key header). An empty answer is not proof\nthat a business does not exist.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "description": "Cards per page, integer 1-50, e.g. 5 (default 10).",
                "maximum": 50,
                "title": "Limit",
                "type": "integer"
              },
              "name": {
                "description": "The bare company name or part of it, at least 3 letters or digits and at most 200 characters, e.g. \"inditex\" or \"Talleres Jarama\": no city, parentheses or notes. Matching allows for case, accents and punctuation, and a legal form such as SL or SA can be left out. Do not repeat the same query unchanged after an empty answer: read note and hidden_by_plan if present.",
                "title": "Name",
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Cards to skip, integer 0-200 (default 0), e.g. 10. At most 200 cards are ranked; truncated true means a candidate cap was reached or a search step ran out of time, so add another word from the name.",
                "title": "Offset",
                "type": "integer"
              },
              "province": {
                "description": "Optional province, accent-insensitive, e.g. MADRID or VIZCAYA, or an autonomous community for all of its provinces, e.g. Catalonia; several values separated by commas, e.g. BIZKAIA,GIPUZKOA. Applied to the candidates the search reads (2,000 with a filter), so a broad name can return fewer companies than match it.",
                "title": "Province",
                "type": "string"
              },
              "status": {
                "description": "Optional, one of active, dissolved, extinct, sheet_closed, e.g. active; applied like province.",
                "title": "Status",
                "type": "string"
              }
            },
            "required": ["name"],
            "title": "search_companiesArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search companies by name"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:81af4355c5c962ae13c05d86eee6ae449d6e24e4df10aede5ebe109c5dfeb5a1"
        },
        {
          "name": "search_events",
          "title": "Search registry events",
          "description": "Search BORME registry events (since 2009) across companies by publication\ndate, province, act type and company name, newest first.\n\nUse it for questions about many companies (\"insolvency notices in Valencia\nin September\"). For one known company use company_history; to find a\ncompany use search_companies; for one day's totals use daily_digest.\n\nReturns JSON {count, events: [{event_id, date, borme_id, province,\ncompany_name, company_slug, acts: [{act_type, act_type_raw, roles,\npayload}], registral}]}, plus company_name_match, plan_window and\nhidden_by_plan when they apply. No next page: when count equals limit,\nnarrow the filters.\n\nRead-only; one request per call against your daily quota. Without an API key\n(X-API-Key header, https://bormeapi.com/account) only the last 7 days\nare searched (plan_window). For an empty page with hidden_by_plan or\ncompany_name_match (matched_companies or suggested_companies), relay its\nnote. Invalid dates, provinces or act types are refused with a reason.",
          "inputSchema": {
            "properties": {
              "act_types": {
                "description": "Optional list of act type enums; an event matches if it has any of them, e.g. [\"INCORPORATION\"] or [\"INSOLVENCY_DECLARATION\", \"INSOLVENCY_STATUS\"]. Full list: list_act_types. Barcelona prints some acts as free text under \"Otros conceptos\": recognised wording is mapped to a normalised act type, while act_type_raw remains \"Otros conceptos\". The payload retains the source text, including any sole shareholder's name. When a revocation and a new appointment appear in the same entry, the API maps the combination to RE_ELECTIONS; this is an API classification and does not establish that the source describes a re-election. Reprocessed events keep their event_id, but their acts can change.",
                "items": {
                  "type": "string"
                },
                "title": "Act Types",
                "type": "array"
              },
              "company_name_contains": {
                "description": "Optional part of the company name, case- and accent-insensitive, e.g. \"mercadona\"; use at least 3 letters or digits for a selective search. % and _ match literally. It filters events; to look a company up by name, call search_companies first.",
                "title": "Company Name Contains",
                "type": "string"
              },
              "date_from": {
                "description": "Earliest publication date, inclusive, YYYY-MM-DD, e.g. 2026-09-01. Optional; data starts on 2009-01-02. Without a key it is moved up to 7 days ago (plan_window says so).",
                "title": "Date From",
                "type": "string"
              },
              "date_to": {
                "description": "Latest publication date, inclusive, YYYY-MM-DD, e.g. 2026-09-30. Optional; defaults to the latest day held.",
                "title": "Date To",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "Maximum events returned, integer 1-200, e.g. 20 (default 50).",
                "maximum": 200,
                "title": "Limit",
                "type": "integer"
              },
              "provinces": {
                "description": "Optional list of BORME province names, accent- and case-insensitive, e.g. [\"MADRID\", \"CADIZ\", \"VIZCAYA\"]. An autonomous community stands for all of its provinces, e.g. [\"Basque Country\"] or [\"Cataluña\"]. Full list: the resource borme://provinces.",
                "items": {
                  "type": "string"
                },
                "title": "Provinces",
                "type": "array"
              }
            },
            "title": "search_eventsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search registry events"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9b86ba9ba107502463d28d5f815876ca8403dda550a3dbf1931721212996204e"
        }
