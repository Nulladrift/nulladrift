          "name": "registry_stats",
          "title": "Data coverage and freshness",
          "description": "Report the coverage and freshness of the BORME data behind this server.\n\nUse it to answer \"how much data is there?\", \"how fresh is it?\" and \"can I\ntrust date filters for period X?\" before running searches; it says\nnothing about any one company.\n\nReturns JSON {events_approx, companies_approx, coverage: {from, to},\nparse_completeness_last_30d, source}: exact event and company counts\nfrom the latest hourly snapshot (planner estimates if no snapshot\nexists), the first and latest publication day held (YYYY-MM-DD), and the event-weighted parse\ncompleteness over the 30 days up to the latest run (e.g. 0.9987). Takes\nno arguments. Read-only, open to everyone, no key needed and not counted\nagainst a quota. The same report is the resource borme://coverage.",
