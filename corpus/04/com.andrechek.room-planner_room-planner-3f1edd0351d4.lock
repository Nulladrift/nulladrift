      "instructions": "Room Planner (https://room-planner.andrechek.com) is a free floor-plan editor in the browser. These tools lay out a room or a home to scale, arrange furniture, and answer \"will it fit?\" questions, e.g. \"can I fit a king bed and two nightstands in an 11x12 bedroom?\", \"fit as many seats as possible around these two tables in my 20x12 dining room\", \"arrange my living room around this sofa and TV\". They make no 3D renders or construction drawings.\ncreate_plan takes a whole plan, checks the layout and returns the plan, its issues and a link that opens it in the Room Planner editor, where pieces can be dragged. check_layout returns the same issues without a link or drawing. Issue positions are piece centres; a piece in a door's swing or doorway blocks the door. The link holds the whole plan, so only a complete link works. Each result ends with the link as a Markdown link line, [Open <name> in Room Planner](url).\nTypical defaults: standard furniture sizes; a 3 ft / 90 cm door centred on the wall, swinging in.\nread_plan reads the plan out of an existing Room Planner link. Nothing is stored: every call takes the whole plan.\nThe plan format is in create_plan's description. More on the plan:\n- Several rooms share a wall by touching, with no gap and no wall thickness (a hall right of a 12 x 10 bedroom at the origin starts at x = 12), and cannot overlap. A door on a shared wall connects the two rooms: list it once, in either room. Windows go on outside walls. An L-shaped room has 6 corners. A piece belongs to the room it stands in.\n- Against a top wall a piece's y = top + depth/2; against a left wall x = left + width/2. ids are unique strings, e.g. \"bedroom\", \"door-1\", \"bed\".\n- Shapes: \"ellipse\" (a round table has width = depth), or \"l\" with cut {corner, width, depth}, removed from that corner before rotation (an L sofa 108 x 84 in with cut {corner:\"tr\", width:72, depth:48}). Set aside a piece the user has but has not placed, or an alternative.\nTypical sizes, in (width x depth): queen bed 60x80, king 76x80, twin 38x75, nightstand 20x16, dresser 60x18, wardrobe 40x24, 3-seat sofa 84x36, armchair 32x34, coffee table 48x24, TV stand 60x18, dining table for 4 48x30 or round 42-48, for 6 72x36, dining chair 18x20, desk 48x24, desk chair 24x24, bookcase 36x12; interior doors 30-36, windows 24-48. Rooms, ft: bedroom 10x12 to 14x16, living room 12x18, hallway 3.5-4 wide.\nClearances, in: walkways 30-36, beside a bed 24, sofa to coffee table 16-18; keep door swings and doorways clear. Dining: about 24 in (60 cm) of table edge per seat; chairs face the table and touch its edge (pieces cannot overlap, so not under it) and nearly touch each other; leave 36 in (90 cm) behind them.",
      "tools": [
        {
          "name": "check_layout",
          "title": "Check a room layout",
          "description": "Use when a plan only needs checking, without making a link or a drawing: returns the same issues as create_plan. The plan format is in create_plan's description.\nReturns {ok, issues, summary}; ok is true when no issue is an error or a warning. Each issue is {code, severity, message, ids}, ids naming the piece first, then what it hits. Errors: item_overlap, item_outside_room (outside every room). Warnings: door_blocked (a piece in a door's swing or track), doorway_blocked (in the passage either side of a door), opening_overlap, opening_off_wall, room_overlap, window_between_rooms, unknown_field (a key the format lacks, usually a typo). Info: tight_clearance, a straight gap from 6 in / 15 cm up to minClearance (in the plan's unit, default 24 in / 61 cm) between two pieces or a piece and a wall; closer pieces (chairs at a table) are taken as meant. Messages name rooms, pieces by label (with their centre when labels repeat) and doors by where they are on the wall.",
