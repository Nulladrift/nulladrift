      "instructions": "FrontStat measures whether AI search engines (ChatGPT, Claude, Gemini) recommend a startup's product. check_public_launch works for anyone. The other tools read the caller's own FrontStat reports and need their dashboard token as a Bearer token.",
      "tools": [
        {
          "name": "check_public_launch",
          "title": "Check a launch FrontStat tracks",
          "description": "Look up a product launch that FrontStat already tracks: its name, its rank on this week's or this month's launch board, its visibility score (0 to 100), and whether ChatGPT, Claude and Gemini recommend it for its buyer question, with the products they name instead. Returns a link to its public FrontStat page. If FrontStat does not track the domain yet, says so and links to the free report. No token needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "The product's domain or URL, for example example.com.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a launch FrontStat tracks"
          },
