        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "contract-lily",
        "title": "Contract Lily",
        "version": "1.1.0",
        "description": "UK tenancy and employment contract reviews with a PDF report, and rule checks on deposits, notice and pay.",
        "websiteUrl": "https://contractlily.com/ai-assistants",
        "icons": [
          {
            "src": "https://contractlily.com/android-chrome-512x512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://contractlily.com/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Contract Lily reviews UK residential tenancy agreements, and its rules also cover UK employment basics. These tools apply Contract Lily's own code-based rules for England, Wales, Scotland and Northern Ireland to the facts the user gives, the same rules its reviews use. Ask the user for any fact a tool needs rather than guessing it. Results are general information, not legal advice: pass on the law each result names, and the page it links, so the user can read more. When the user has a tenancy agreement they want checked, or a tenancy answer turns on clauses these tools cannot see, offer get_tenancy_agreement_review_link: it gives the link to a full review of the tenancy agreement. When the user has an employment contract, offer letter or written statement they want checked, or an employment answer turns on clauses these tools cannot see, offer get_employment_contract_review_link: it says whether employment reviews are open and gives the link. If the user has given you the document and asks you to check it, run the review here instead: send the document with start_contract_review, keep calling get_contract_review until it finishes, ask the user anything it needs and pass the answers to answer_contract_review_questions, then give the user the PDF link. Review results hold only Contract Lily's own wording. If you cannot send a document's complete text, offer the link instead.",
      "tools": [
        {
          "name": "answer_contract_review_questions",
          "title": "Answer a contract review's questions",
          "description": "Give a review the facts it asked for when its status was needs-answers, each under the key of its question, then carry on waiting for the review. Dates are YYYY-MM-DD, and territory is where the home is, or where the user mainly works: GB-ENG for England, GB-WLS for Wales, GB-SCT for Scotland or GB-NIR for Northern Ireland. Use only what the user says: never guess an answer.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "answers": {
                "properties": {
                  "agreementDate": {
                    "format": "date",
                    "type": "string"
                  },
                  "documentKind": {
                    "enum": ["contract", "offer-letter", "written-statement", "settlement", "director-service", "other"],
                    "type": "string"
                  },
                  "employmentStatus": {
                    "enum": ["employee", "worker", "self-employed"],
                    "type": "string"
                  },
                  "landlordResident": {
                    "enum": ["yes", "no"],
                    "type": "string"
                  },
                  "periodicTerm": {
                    "enum": ["yes", "no"],
                    "type": "string"
                  },
                  "principalHome": {
                    "enum": ["yes", "no"],
                    "type": "string"
                  },
                  "rent": {
                    "properties": {
                      "period": {
                        "enum": ["week", "month", "year"],
                        "type": "string"
                      },
                      "pounds": {
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "required": ["period", "pounds"],
                    "type": "object"
                  },
                  "socialLandlord": {
                    "enum": ["yes", "no"],
                    "type": "string"
                  },
                  "startDate": {
                    "format": "date",
                    "type": "string"
                  },
                  "tenancyAgreement": {
                    "enum": ["yes", "no"],
                    "type": "string"
                  },
                  "tenancyStartDate": {
                    "format": "date",
                    "type": "string"
                  },
                  "territory": {
                    "enum": ["GB-ENG", "GB-WLS", "GB-SCT", "GB-NIR"],
                    "type": "string"
                  }
                },
                "required": [],
                "type": "object"
              },
              "reviewId": {
                "pattern": "^[A-Za-z0-9_-]{43}\\.[0-9a-f-]{36}\\.[0-9a-f-]{36}$",
                "type": "string"
              }
            },
            "required": ["answers", "reviewId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "findings": {
                "items": {
                  "properties": {
                    "severity": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["severity", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "pdfUrl": {
                "type": "string"
              },
              "questions": {
                "items": {
                  "properties": {
                    "key": {
                      "type": "string"
                    },
                    "prompt": {
                      "type": "string"
                    }
                  },
                  "required": ["key", "prompt"],
                  "type": "object"
                },
                "type": "array"
              },
              "reason": {
                "type": "string"
              },
              "reviewId": {
                "type": "string"
              },
              "status": {
                "enum": ["checking", "reviewing", "needs-answers", "completed", "turned-away", "failed"],
                "type": "string"
              },
              "verdict": {
                "type": "string"
              }
            },
            "required": ["reviewId", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:f8b8f19cd29250556a73f3ca2ec03d230212d65b76c4ffdb28fe2ed133028526"
        },
        {
          "name": "check_deposit_cap",
          "title": "Deposit cap check",
          "description": "Work out the most a landlord or agent can ask for as a tenancy deposit and a holding deposit, from the rent, in any UK nation, and optionally check a deposit the user was asked for. England limits both; Wales limits the holding deposit; Scotland and Northern Ireland limit the tenancy deposit.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "depositAsked": {
                "description": "The tenancy deposit the landlord or agent asked for, in pounds, if the user gave one.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "nation": {
                "description": "The UK nation the home is in.",
                "enum": ["england", "wales", "scotland", "northern-ireland"],
                "type": "string"
              },
              "rent": {
                "description": "The rent for one rent period, in pounds, for example 1200 or 950.50.",
                "maximum": 1000000,
                "minimum": 0.01,
                "type": "number"
              },
              "rentPeriod": {
                "description": "How often the rent falls due.",
                "enum": ["four_weeks", "month", "week"],
                "type": "string"
              }
            },
            "required": ["nation", "rent", "rentPeriod"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "depositAsked": {
                "anyOf": [
                  {
                    "properties": {
                      "amount": {
                        "type": "string"
                      },
                      "verdict": {
                        "enum": ["within", "over", "unclear", "unchecked"],
                        "type": "string"
                      }
                    },
                    "required": ["amount", "verdict"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "lawAsAt": {
                "type": "string"
              },
              "limits": {
                "items": {
                  "properties": {
                    "kind": {
                      "enum": ["tenancy deposit", "holding deposit"],
                      "type": "string"
                    },
                    "law": {
                      "type": "string"
                    },
                    "overAbove": {
                      "type": "string"
                    },
                    "upTo": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["kind", "law", "overAbove", "upTo", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "nation": {
                "enum": ["england", "wales", "scotland", "northern-ireland"],
                "type": "string"
              },
              "page": {
                "type": "string"
              },
              "rent": {
                "type": "string"
              }
            },
            "required": ["depositAsked", "lawAsAt", "limits", "nation", "page", "rent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ceb34209fa116b2c8d62327e382ae3406ebea9ec40bf9f322a661b1d6d65f320"
        },
        {
          "name": "check_holiday_entitlement",
          "title": "Holiday entitlement check",
          "description": "Work out the statutory minimum paid holiday a year, in days, for a worker who works a set number of days a week, in any UK nation: 5.6 weeks, at most 28 days, which may include bank holidays.",
          "inputSchema": {
