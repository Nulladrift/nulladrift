{
  "lockfileVersion": 2,
  "subjects": {
    "com.contractlily/contract-lily": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
