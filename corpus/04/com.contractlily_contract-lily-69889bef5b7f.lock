        {
          "name": "check_rent_increase_notice",
          "title": "Section 13 rent increase check",
          "description": "Check a section 13 rent increase notice for an assured periodic tenancy in England, served from 1 May 2026: whether the new rent's start date meets each date rule and the notice is on the prescribed form, and the earliest the new rent could start. England only; it does not judge whether the new rent is fair.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "history": {
                "description": "Whether the rent has gone up before after a section 13 notice or a tribunal decision: none, increased (give lastIncrease), or unknown.",
                "enum": ["none", "increased", "unknown"],
                "type": "string"
              },
              "lastIncrease": {
                "description": "If the rent went up before, the day that increase took effect, as YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "period": {
                "description": "How often the rent falls due.",
                "enum": ["four_weeks", "month", "week"],
                "type": "string"
              },
              "prescribedForm": {
                "description": "Whether the notice is on the government's prescribed form for a section 13 notice.",
                "enum": ["yes", "no", "unsure"],
                "type": "string"
              },
              "served": {
                "description": "The day the tenant received the notice, as YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "starts": {
                "description": "The day the notice says the new rent starts, as YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "tenancyStart": {
                "description": "The day the first rent period of the tenancy began, as YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              }
            },
            "required": ["history", "period", "prescribedForm", "served", "starts", "tenancyStart"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "certainlyFrom": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "checks": {
                "items": {
                  "properties": {
                    "outcome": {
                      "enum": ["met", "not-met", "unsure"],
                      "type": "string"
                    },
