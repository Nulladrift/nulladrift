            "properties": {
              "daysPerWeek": {
                "description": "The days the worker works each week, such as 5 or 2.5.",
                "maximum": 7,
                "minimum": 0.5,
                "type": "number"
              },
              "nation": {
                "description": "The UK nation where the worker mainly works.",
                "enum": ["england", "wales", "scotland", "northern-ireland"],
                "type": "string"
              }
            },
            "required": ["daysPerWeek", "nation"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "days": {
                "type": "number"
              },
              "law": {
                "type": "string"
              },
              "lawAsAt": {
                "type": "string"
              },
              "page": {
                "type": "string"
              }
            },
            "required": ["days", "law", "lawAsAt", "page"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
