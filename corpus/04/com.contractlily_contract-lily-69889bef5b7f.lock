          "digest": "sha256:4508b03b8d0df589819d056b1d85732d1efdc5f94b6a3638fcba91fc6f0aedb4"
        },
        {
          "name": "check_minimum_wage",
          "title": "Minimum wage check",
          "description": "Check whether an hourly rate of pay meets the UK minimum wage for the worker’s age, and apprenticeship, on a date from 1 April 2024, and give the rate that applies.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "age": {
                "description": "The worker’s age.",
                "maximum": 100,
                "minimum": 13,
                "type": "integer"
              },
              "apprentice": {
                "description": "Whether the worker is an apprentice, and if so whether in the first year of the apprenticeship.",
                "enum": ["no", "first-year", "later-year"],
                "type": "string"
              },
              "date": {
                "description": "The day the pay is for, as YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "hourlyPence": {
                "description": "The pay for an hour, in pence.",
                "minimum": 0,
                "type": "integer"
              },
              "pastSchoolAge": {
                "description": "Whether the worker is over compulsory school age (past the school-leaving day of the year they turn 16).",
                "type": "boolean"
              }
            },
            "required": ["age", "apprentice", "date", "hourlyPence", "pastSchoolAge"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "answer": {
                "oneOf": [
                  {
                    "properties": {
                      "band": {
                        "enum": ["national-living-wage", "18-to-20", "under-18", "apprentice"],
                        "type": "string"
                      },
                      "from": {
                        "type": "string"
                      },
                      "hourlyPence": {
                        "type": "number"
                      },
                      "kind": {
                        "const": "rate"
                      },
                      "meets": {
                        "type": "boolean"
                      }
                    },
                    "required": ["band", "from", "hourlyPence", "kind", "meets"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "kind": {
                        "const": "not-entitled"
                      }
                    },
                    "required": ["kind"],
                    "type": "object"
                  }
                ]
              },
              "lawAsAt": {
                "type": "string"
              },
              "page": {
                "type": "string"
              }
            },
            "required": ["answer", "lawAsAt", "page"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4400c4cd6dbdc341f16f12360965d742d8d3c3d85df39e3c56edfc957adef92a"
        },
        {
          "name": "check_northern_ireland_rent_increase_notice",
          "title": "Northern Ireland rent increase check",
          "description": "Check a landlord's rent increase notice, given from 1 April 2025, for a private tenancy in Northern Ireland other than a controlled tenancy (do not use it for a controlled tenancy, which has different rules): whether it is in writing, whether the new rent starts at least three months after the notice is given, and whether it comes at least 12 months after the tenancy began and the last increase; and when the new rent can start. Northern Ireland only; it does not judge whether the new rent is fair.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "history": {
                "description": "Whether the rent has gone up before: none, increased (give lastIncrease), or unknown.",
                "enum": ["none", "increased", "unknown"],
                "type": "string"
              },
              "lastIncrease": {
                "description": "If the rent went up before, the day that increase took effect, as YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "received": {
                "description": "The day the tenant was given the notice, as YYYY-MM-DD; from 1 April 2025.",
                "format": "date",
                "type": "string"
              },
              "starts": {
                "description": "The day the notice says the new rent starts, as YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "tenancyStart": {
                "description": "The day the tenancy was granted, as YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "written": {
                "description": "Whether the notice is in writing; an email, text or other electronic message counts.",
                "enum": ["yes", "no", "unsure"],
                "type": "string"
              }
            },
            "required": ["history", "received", "starts", "tenancyStart", "written"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "checks": {
                "items": {
                  "properties": {
                    "outcome": {
                      "enum": ["met", "not-met", "unsure"],
                      "type": "string"
                    },
                    "rule": {
                      "enum": ["notice", "sinceLastIncrease", "form"],
                      "type": "string"
                    },
                    "text": {
                      "type": "string"
                    }
                  },
                  "required": ["outcome", "rule", "text"],
                  "type": "object"
                },
                "type": "array"
              },
              "earliestAllowed": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "lawAsAt": {
                "type": "string"
              },
              "page": {
                "type": "string"
              },
              "summary": {
                "type": "string"
              }
            },
            "required": ["checks", "earliestAllowed", "lawAsAt", "page", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d974612d541d8d9f5fa53a4119cd8534fe4f2f05467e8821a303d3b238748439"
        },
        {
          "name": "check_notice_period",
          "title": "Notice period check",
          "description": "Work out the least notice that ends a periodic private tenancy, and the earliest end date it can name, in any UK nation, whether the tenant or the landlord gives it. It also says when a landlord cannot end the tenancy by notice at all (England) or must apply to a tribunal (Scotland).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "given": {
                "description": "The day the notice is given, as YYYY-MM-DD. In Scotland, the day the other side receives it.",
                "format": "date",
                "type": "string"
              },
              "nation": {
                "description": "The UK nation the home is in.",
                "enum": ["england", "wales", "scotland", "northern-ireland"],
                "type": "string"
              },
              "party": {
                "description": "Who gives the notice.",
                "enum": ["tenant", "landlord"],
                "type": "string"
              },
              "period": {
                "description": "How often the rent falls due.",
                "enum": ["four_weeks", "month", "week"],
                "type": "string"
              },
              "rentDueDate": {
                "description": "For weekly or four-weekly rent: a day rent fell due, such as the last due date, as YYYY-MM-DD; rent periods repeat every 7 or 28 days from it. Leave it out only if they repeat from the day the tenancy started.",
                "format": "date",
                "type": "string"
              },
              "rentDueDay": {
                "description": "For monthly rent: the day of the month rent falls due, such as 1 or 31. Leave it out only if it is the day of the month the tenancy started.",
                "maximum": 31,
                "minimum": 1,
                "type": "integer"
              },
              "tenancyStart": {
                "description": "The day the tenancy, or in Wales the occupation contract, began, as YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              }
            },
            "required": ["given", "nation", "party", "period", "tenancyStart"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "answer": {
                "oneOf": [
                  {
                    "properties": {
                      "earliestEnd": {
                        "format": "date",
                        "type": "string"
                      },
                      "kind": {
                        "const": "notice"
                      },
                      "minimum": {
                        "type": "string"
                      }
                    },
                    "required": ["earliestEnd", "kind", "minimum"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "earliestEnd": {
                        "format": "date",
                        "type": "string"
                      },
                      "givenFrom": {
                        "format": "date",
                        "type": "string"
                      },
                      "kind": {
                        "const": "too-early"
                      }
                    },
                    "required": ["earliestEnd", "givenFrom", "kind"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "kind": {
                        "const": "no-notice-to-quit"
                      }
                    },
                    "required": ["kind"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "days": {
                        "enum": [28, 84],
                        "type": "number"
                      },
                      "kind": {
                        "const": "notice-to-leave"
                      },
                      "tribunalFrom": {
                        "format": "date",
                        "type": "string"
                      }
                    },
                    "required": ["days", "kind", "tribunalFrom"],
                    "type": "object"
                  }
                ]
              },
              "explanation": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "lawAsAt": {
                "type": "string"
              },
              "nation": {
                "enum": ["england", "wales", "scotland", "northern-ireland"],
                "type": "string"
              },
              "page": {
                "type": "string"
              },
              "party": {
                "enum": ["tenant", "landlord"],
                "type": "string"
              }
            },
            "required": ["answer", "explanation", "lawAsAt", "nation", "page", "party"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
