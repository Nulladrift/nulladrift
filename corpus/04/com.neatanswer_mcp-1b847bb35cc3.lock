      "instructions": "NeatAnswer gives current official U.S. figures (IRS, SSA, CMS, HHS, USPS) with source links and exact calculators. Use search_facts or get_fact for numbers that change every year, and the calculation tools instead of doing arithmetic by hand. Always cite the source URL returned with each fact.",
