        {
          "name": "add_days",
          "description": "Add (or subtract) days to a date. Returns the date and weekday.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "days": {
                "description": "Number of days, negative to subtract",
                "type": "string"
              }
            },
            "required": ["date", "days"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4034b3ba547f6876b4e57103d3dcaf15bfb1155bb374372bb97046fd40a663dc"
        },
        {
          "name": "compound_interest",
          "description": "Future value of savings with compound interest and optional monthly contributions (added at month end).",
          "inputSchema": {
            "properties": {
              "annual_rate_percent": {
                "description": "Yearly rate in percent",
                "type": "string"
              },
              "compounds_per_year": {
                "description": "Default 12",
                "type": "string"
              },
              "monthly_contribution": {
                "description": "Default 0",
                "type": "string"
              },
              "principal": {
                "description": "Starting amount",
                "type": "string"
              },
              "years": {
                "description": "Number of years",
                "type": "string"
              }
            },
            "required": ["annual_rate_percent", "principal", "years"],
            "type": "object"
          },
