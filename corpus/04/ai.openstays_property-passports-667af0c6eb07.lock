{
  "lockfileVersion": 2,
  "subjects": {
    "ai.openstays/property-passports": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://openstays.ai/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "OpenStays Property Passports",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Search public Property Passports: short-term rentals that guests book directly with the owner. Search the whole world or one country, region or town, by a property's name, and by any fact a Passport states: bedrooms, bathrooms, beds, guests, property type, amenities such as a pool or a sea view, house rules such as pets, and booking terms. Every argument is optional. Send only what the user asked for: when they name a property, send its name and nothing else, and when they describe a home, send those facts, so that every result is one they would want. A number of bedrooms is exact unless the user says at least or more: send bedrooms for exactly that many and minBedrooms for at least. A fact matches only when the owner's Passport states it, so a filter can miss a home whose Passport does not mention that fact. Returns only the accommodation units that match everything asked for, at most 10 at a time and often fewer, preferring different Property Passports. It never adds results to reach 10. When nextPage is a number, send it as page to see more. No catalogue export or total count. Give checkIn and checkOut to see only homes whose owner's calendar shows those nights free, and maxPricePerNight with currency to see only homes whose published nightly price is within that budget, in any currency. Use them only when the user gives dates or a budget. Many Passports do not share a calendar or publish a price yet, so when either search returns few homes, search again without it and tell the user that those homes need a question to the owner. A price is the owner's published rate, not a live quote: the owner confirms the price and the booking. Guests book with the owner: each result's bookingUrl is the owner's own website, and when it is null, contactRoutes has the owner's other booking channels. passportId opens the full Passport with get_property_passport.",
      "tools": [
        {
          "name": "get_property_passport",
          "title": "Get one OpenStays Property Passport",
          "description": "Retrieve one Property Passport in full by the passportId of a search_stays result: every fact the owner states, the photos, and the owner's own booking channels in contact_routes, where the guest books. The Passport follows the schema at https://openstays.ai/passport-schema/latest/passport.schema.json, without the addresses of its own pages.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "passportId": {
                "description": "The passportId of a search_stays result, exactly as returned, or the link of a Passport page that the user gave.",
                "type": "string"
              }
            },
            "required": ["passportId"],
            "type": "object"
          },
          "outputSchema": {
            "description": "One Property Passport: the owner's own facts about a property. Its fields follow the published schema at https://openstays.ai/passport-schema/latest/passport.schema.json, without the addresses of its own pages.",
            "properties": {
              "amenity_codes": {
                "description": "The amenities the owner states."
              },
              "availability": {
                "description": "Booked dates from the owner's own calendar, when the owner shares one."
              },
              "cancellation_policy": {
                "description": "The owner's cancellation terms, when published."
              },
              "contact_routes": {
                "description": "The owner's own booking channels, where the guest books, in the owner's order."
              },
              "information": {
                "description": "The owner's own notes on amenities, spaces, prices and fees, booking rules and policies."
              },
              "key_facts": {
                "description": "Check-in and check-out times, house rules, minimum stay, lowest published price and cancellation category."
              },
              "location": {
                "description": "Country, region and town."
              },
              "passport": {
                "description": "Name, scope, number of units and where the facts come from."
              },
              "photos": {
                "description": "The property's photos."
              },
              "rates": {
                "description": "The owner's published rates. Not a live quote."
              },
              "schema_version": {
                "type": "string"
              },
              "units": {
                "description": "Each accommodation unit: type, bedrooms, beds, bathrooms and guests."
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get one OpenStays Property Passport"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:da875755a71e29da0325ae60d356bf274d345ccb94d12514266e6984003cd828"
        },
        {
          "name": "search_stays",
          "title": "Search OpenStays accommodation",
          "description": "Search public Property Passports: short-term rentals that guests book directly with the owner. Search the whole world or one country, region or town, by a property's name, and by any fact a Passport states: bedrooms, bathrooms, beds, guests, property type, amenities such as a pool or a sea view, house rules such as pets, and booking terms. Every argument is optional. Send only what the user asked for: when they name a property, send its name and nothing else, and when they describe a home, send those facts, so that every result is one they would want. A number of bedrooms is exact unless the user says at least or more: send bedrooms for exactly that many and minBedrooms for at least. A fact matches only when the owner's Passport states it, so a filter can miss a home whose Passport does not mention that fact. Returns only the accommodation units that match everything asked for, at most 10 at a time and often fewer, preferring different Property Passports. It never adds results to reach 10. When nextPage is a number, send it as page to see more. No catalogue export or total count. Give checkIn and checkOut to see only homes whose owner's calendar shows those nights free, and maxPricePerNight with currency to see only homes whose published nightly price is within that budget, in any currency. Use them only when the user gives dates or a budget. Many Passports do not share a calendar or publish a price yet, so when either search returns few homes, search again without it and tell the user that those homes need a question to the owner. A price is the owner's published rate, not a live quote: the owner confirms the price and the booking. Guests book with the owner: each result's bookingUrl is the owner's own website, and when it is null, contactRoutes has the owner's other booking channels. passportId opens the full Passport with get_property_passport.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amenities": {
                "description": "Amenities the home must have, all of them, for example [\"pool\", \"wifi\"].",
                "items": {
                  "enum": ["wifi", "workspace", "tv", "streaming", "games_room", "ac", "heating", "hot_water", "fireplace", "kitchen", "kitchenette", "oven", "stove", "microwave", "dishwasher", "refrigerator", "freezer", "coffee_maker", "kettle", "washer", "dryer", "iron", "hair_dryer", "bed_linen", "towels", "pool", "private_pool", "heated_pool", "hot_tub", "sauna", "gym", "garden", "balcony", "patio", "terrace", "outdoor_grill", "outdoor_dining", "free_parking", "paid_parking", "ev_charger", "lift", "step_free_access", "wheelchair_accessible", "crib", "high_chair", "self_check_in", "beach_access", "waterfront", "sea_view", "ski_in_ski_out", "breakfast_included", "airport_shuttle", "bikes", "kayaks", "smoke_alarm", "carbon_monoxide_alarm", "first_aid_kit", "fire_extinguisher", "security_system"],
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "bedrooms": {
                "description": "Exactly this many bedrooms. For a five-bedroom house, send 5.",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "bookingConfirmation": {
                "description": "instant: a booking is confirmed at once. on_request: the owner confirms it.",
                "enum": ["instant", "on_request"],
                "type": "string"
              },
              "businessTravel": {
                "const": true,
                "description": "Only homes whose Passport says they suit business travel.",
                "type": "boolean"
              },
              "cancellationCategory": {
                "description": "The cancellation terms you accept, for example [\"flexible\", \"moderate\"].",
                "items": {
                  "enum": ["flexible", "moderate", "strict", "non_refundable"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "checkIn": {
                "description": "The arrival day, as YYYY-MM-DD. Send it with checkOut.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "checkOut": {
                "description": "The departure day, as YYYY-MM-DD, at most 90 nights after checkIn.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "children": {
                "description": "The owner's rule on children. List every answer you accept, for example [\"allowed\", \"by_request\"]. by_request means the owner decides case by case.",
                "items": {
                  "enum": ["allowed", "not_allowed", "by_request"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "country": {
                "description": "One country or territory name or supported exact alias, for example New Zealand or NZ. Leave it out to search every country.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "currency": {
                "description": "The currency of maxPricePerNight, as a three-letter code such as USD. It can differ from the owner's currency: the budget is converted with the day's reference rates.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "destination": {
                "description": "A country, locality or region. Without country, this must identify one country among public Passport locations. With country, use this for an optional locality or region.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "events": {
                "description": "The owner's rule on events and parties. List every answer you accept, for example [\"allowed\", \"by_request\"]. by_request means the owner decides case by case.",
                "items": {
                  "enum": ["allowed", "not_allowed", "by_request"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "families": {
                "const": true,
                "description": "Only homes whose Passport says they suit families.",
                "type": "boolean"
              },
              "longStays": {
                "const": true,
                "description": "Only homes whose Passport says they suit long stays.",
                "type": "boolean"
              },
              "maxMinimumStayNights": {
                "description": "The longest minimum stay the guest accepts, in nights. For a three-night trip, send 3.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "maxPricePerNight": {
                "description": "The most the guest wants to pay for one night. Send it with currency. With dates it is compared with the published price for those nights, otherwise with the lowest published nightly price.",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "number"
              },
              "minBathrooms": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "minBedrooms": {
                "description": "At least this many bedrooms. Never send it together with bedrooms.",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "minBeds": {
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "minGuests": {
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "The name of one property, or part of it, for example Hinterland Harmony. You can search by name alone, without giving a country.",
                "maxLength": 120,
                "minLength": 3,
                "type": "string"
              },
              "page": {
                "description": "The page of results, starting at 1. Send the nextPage value of the previous answer. Needs at least one other argument.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "pets": {
                "description": "The owner's rule on pets. List every answer you accept, for example [\"allowed\", \"by_request\"]. by_request means the owner decides case by case.",
                "items": {
                  "enum": ["allowed", "not_allowed", "by_request"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "propertyType": {
                "description": "Public accommodation type, for example villa or cottage.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "smoking": {
                "description": "The owner's rule on smoking. List every answer you accept, for example [\"allowed\", \"by_request\"]. by_request means the owner decides case by case.",
                "items": {
                  "enum": ["allowed", "not_allowed", "by_request"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "weddings": {
                "description": "The owner's rule on weddings. List every answer you accept, for example [\"allowed\", \"by_request\"]. by_request means the owner decides case by case.",
                "items": {
                  "enum": ["allowed", "not_allowed", "by_request"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "nextPage": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Send as page to see more. Null when there are no more."
              },
              "notices": {
                "description": "What a search by dates or by price could not check.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "refineSearch": {
                "description": "True when more homes matched than one answer holds.",
                "type": "boolean"
              },
              "results": {
                "description": "The accommodation units that match everything asked for, at most 10 at a time.",
                "items": {
                  "properties": {
                    "accommodationName": {
                      "type": "string"
                    },
                    "bathrooms": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "bedrooms": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "bookingUrl": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "The owner's own website, where the guest books. Null when the owner lists other booking channels only: see contactRoutes."
                    },
                    "contactRoutes": {
                      "description": "The owner's own booking channels, in the owner's order.",
                      "items": {
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "location": {
                      "description": "Town, region and country.",
                      "type": "object"
                    },
                    "maxGuests": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "passportId": {
                      "description": "Names this Passport for get_property_passport.",
                      "type": "string"
                    },
                    "photo": {
                      "anyOf": [
                        {
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "The first photo, or null when the Passport has none."
                    },
                    "photos": {
                      "items": {
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "priceFrom": {
                      "anyOf": [
                        {
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "The lowest price the owner publishes, in the owner's own currency. Null when none is published."
                    },
                    "primaryType": {
                      "description": "The type of property, such as house, villa, apartment or cabin.",
                      "type": "string"
                    },
                    "propertyName": {
                      "type": "string"
                    },
                    "stay": {
                      "description": "Only when the search gave dates: the nights asked for, which the owner's calendar showed free, with the owner's published price per night for them when there is one. Not a quote.",
                      "type": "object"
                    },
                    "totalBeds": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "unitId": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search OpenStays accommodation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2b2888e71a72a1ebfa9912c77303b90b14b6fcee91d6b039b738829d88636231"
        }
      ],
      "digest": "sha256:1ed013a3b267b2477e044125646878ad856b3a9cc63fd2ef1634f83a66437a04"
    }
  }
}
