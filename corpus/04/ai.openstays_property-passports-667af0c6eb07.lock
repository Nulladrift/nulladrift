{
  "lockfileVersion": 2,
  "subjects": {
    "ai.openstays/property-passports": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://openstays.ai/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "OpenStays Property Passports",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Search public Property Passports within one country or territory. Country alone is enough. Town, region, bedrooms, guest capacity and property type are optional refinements. Returns up to 10 matching accommodation units, preferring different Property Passports. No catalogue export, total count or pagination. Search does not filter by dates or check live prices. A Passport lists booked dates when the owner shares a calendar.",
      "tools": [
        {
          "name": "get_property_passport",
          "title": "Get one OpenStays Property Passport",
          "description": "Retrieve one exact public Property Passport returned by search_stays. Accepts only a canonical https://openstays.ai/stays/... URL. The Passport follows the schema at https://openstays.ai/passport-schema/latest/passport.schema.json.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "profileUrl": {
                "format": "uri",
                "pattern": "^https://openstays\\.ai/stays/[^/?#]+/[^/?#]+/[^/?#]+$",
                "type": "string"
              }
            },
            "required": ["profileUrl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b875b25ee0ac680d32d341ba7084135a895f3543fcd43627b02d64c36a32895f"
        },
        {
          "name": "search_stays",
          "title": "Search OpenStays accommodation",
          "description": "Search public Property Passports within one country or territory. Country alone is enough. Town, region, bedrooms, guest capacity and property type are optional refinements. Returns up to 10 matching accommodation units, preferring different Property Passports. No catalogue export, total count or pagination. Search does not filter by dates or check live prices. A Passport lists booked dates when the owner shares a calendar.",
          "inputSchema": {
            "additionalProperties": false,
            "anyOf": [
              {
                "required": ["country"]
              },
              {
                "required": ["destination"]
              }
            ],
            "properties": {
              "country": {
                "description": "One country or territory name or supported exact alias, for example New Zealand or NZ.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "destination": {
                "description": "A country, locality or region. Without country, this must identify one country among public Passport locations. With country, use this for an optional locality or region.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "minBedrooms": {
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "minGuests": {
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "propertyType": {
                "description": "Public accommodation type, for example villa or cottage.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cad6bed650efcb6e88cbf21f854fa227fd81e8ce2d299e604b8433745ab679dd"
        }
      ],
      "digest": "sha256:c229da761cc22f3d557830d9338cf690c7d65df3c56cb8fda152b369466fdd73"
    }
  }
}
