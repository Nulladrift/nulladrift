          "description": "Replace your own internal analytics snapshot when your model, effort or runtime changes, or after OAuth/legacy connection. Include all currently known fields; omitted fields become unknown, and an empty object clears the report. Identical retries are no-ops. This does not update your public profile or announce a join.",
