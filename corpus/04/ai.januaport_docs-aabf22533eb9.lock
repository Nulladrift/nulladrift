{
  "lockfileVersion": 2,
  "subjects": {
    "ai.januaport/docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://docs-mcp.januaport.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "jnpt-docs",
        "version": "0.104.0"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "docs_get",
          "description": "Reads ONE section of a setup guide. Without `abschnitt` you get the table of contents of the document (with the size of each section) — that is the normal first call; with `abschnitt` you get that section's text (a section brings its subsections with it). A whole long document is never returned in one answer. Every answer names the JanuaPort release the guide belongs to. Reads only; changes nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "abschnitt": {
                "description": "Optional section heading. Omit it to get the table of contents first — that is the normal first step.",
                "type": "string"
              },
              "id": {
                "description": "Document key, e.g. \"inbetriebnahme\". Use docs_list if you do not know it.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "abschnitt": {
                "description": "The section that was returned. Empty when this is a table of contents.",
                "type": "string"
              },
              "id": {
                "description": "The document key.",
                "type": "string"
              },
              "inhalt": {
                "description": "The table of contents, when no section was asked for.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "abschnitt": {
                      "description": "Section heading — pass it to docs_get.",
                      "type": "string"
                    },
                    "bytes": {
                      "description": "Size of what docs_get would return for this section.",
                      "type": "integer"
                    },
                    "ebene": {
                      "description": "2 for a section, 3 for a subsection of the section above it.",
                      "type": "integer"
                    }
                  },
                  "required": ["abschnitt", "bytes", "ebene"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "stand": {
                "description": "JanuaPort release this guide belongs to.",
                "type": "string"
              },
              "text": {
                "description": "The section text.",
                "type": "string"
              },
              "titel": {
                "description": "Title of the document.",
                "type": "string"
              }
            },
            "required": ["id", "stand", "titel"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4530d8394e19a65e933b156842f249d67ca9f1a87b7b60b907661b2b3d830e79"
        },
        {
          "name": "docs_list",
          "description": "Lists the setup guides this server can show: document key, title and a one-line summary for each. Call this first, then fetch a document with docs_get. To set JanuaPort up, first ask whether it already runs as a container: if not, start with `installation` (on Mac or Windows, tell the user first that Docker Desktop is for trying it out and a Linux server is recommended for operation); if it does, start with `inbetriebnahme`. Every answer names the JanuaPort release the guides belong to. Reads only; changes nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "dokumente": {
                "description": "The setup guides this server can show, in a fixed order.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "description": "Document key — pass it to docs_get.",
                      "type": "string"
                    },
                    "kurzbeschreibung": {
                      "description": "One-line summary of what the document covers.",
                      "type": "string"
                    },
                    "titel": {
                      "description": "Title of the document.",
                      "type": "string"
                    }
                  },
                  "required": ["id", "kurzbeschreibung", "titel"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "stand": {
                "description": "JanuaPort release these guides belong to.",
                "type": "string"
              }
            },
            "required": ["dokumente", "stand"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:26310ef0c27b11824da3b8d91b67e98bb0987e0e5603b5027a05a090ce4472f8"
        },
        {
          "name": "docs_search",
          "description": "Searches the setup guides for a question or a few words (not a single keyword). Returns document key, section heading and a short excerpt per match, best first — fetch the actual text with docs_get. Every answer names the JanuaPort release the guides belong to. Reads only; changes nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "frage": {
                "description": "What you want to find — a question or a few words, not a single keyword. Word-level match: a hit needs at least one matching word; ranked by how many words matched.",
                "type": "string"
              }
            },
            "required": ["frage"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "stand": {
                "description": "JanuaPort release these guides belong to.",
                "type": "string"
              },
              "treffer": {
                "description": "The matches, best first. Capped. Empty means nothing found — not an error.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "abschnitt": {
                      "description": "Section heading — pass it to docs_get. Empty means the title matched.",
                      "type": "string"
                    },
                    "ausschnitt": {
                      "description": "A short excerpt around the match.",
                      "type": "string"
                    },
                    "id": {
                      "description": "Document key — pass it to docs_get.",
                      "type": "string"
                    },
                    "titel": {
                      "description": "Title of the document.",
                      "type": "string"
                    }
                  },
                  "required": ["ausschnitt", "id", "titel"],
                  "type": "object"
                },
                "type": ["null", "array"]
              }
            },
            "required": ["stand", "treffer"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ce0c4f16b97ecd0066e00b2c612a7f50f3699bb38623d45140772a0bf743d420"
        }
      ],
      "digest": "sha256:0caac5d117c099b95047bf98cdfe5d659f5dd1416922478d25d679cf64cf88eb"
    }
  }
}
