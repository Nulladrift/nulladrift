        {
          "name": "search_tenders",
          "title": "Search open public tenders",
          "description": "Open calls for tenders from public buyers across Europe (TED, the EU tenders journal), closing soonest first. Each tender has the buyer, category (CPV), estimated value, deadline and fit_count: how many Evolc companies won public tenders in the same CPV class since 2024. Pass company (an Evolc slug) to get the open tenders in the categories that company already wins, or filter by country, CPV division and text. Titles are in the buyer's language. The tender page (url) links to where offers are submitted.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Evolc company slug: return open tenders in the CPV classes this company won before (other filters are ignored).",
                "type": "string"
              },
              "countries": {
                "description": "Buyer country, ISO-2.",
                "items": {
                  "enum": ["SK", "CZ", "PL", "HU", "AT", "SI", "DE", "CH", "HR", "RO", "GB", "IE", "FR", "BE", "NL", "LU", "ES", "PT", "IT", "MT", "GR", "CY", "DK", "SE", "NO", "FI", "IS", "EE", "LV", "LT", "BG", "RS", "BA", "ME", "MK", "AL", "UA", "MD", "LI", "MC", "AD", "SM"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "divisions": {
                "description": "CPV divisions (first two digits): 14 Mining & basic metals; 15 Food & beverages; 16 Agricultural machinery; 18 Clothing, footwear & accessories; 19 Leather, textiles, plastic & rubber; 22 Printed matter; 24 Chemical products; 30 Office & computer equipment; 31 Electrical equipment & lighting; 32 Telecom & radio equipment; 33 Medical equipment & pharmaceuticals; 34 Vehicles & transport equipment; 35 Security, fire & defence equipment; 37 Sports goods, toys & instruments; 38 Laboratory & precision equipment; 39 Furniture & cleaning products; 41 Water; 42 Industrial machinery; 43 Mining & construction machinery; 44 Construction materials; 45 Construction work; 48 Software & information systems; 50 Repair & maintenance; 51 Installation services; 55 Hotels, catering & retail; 60 Transport services; 63 Transport support & travel; 64 Postal & telecom services; 65 Public utilities; 66 Financial & insurance services; 70 Real estate services; 71 Architecture & engineering; 72 IT services & software development; 73 Research & development; 75 Public administration services; 76 Oil & gas services; 77 Agricultural & forestry services; 79 Business services: legal, marketing, consulting; 80 Education & training; 85 Health & social work; 90 Waste, cleaning & environmental services; 92 Recreation, culture & sport; 98 Other community services; 03 Agriculture, farming & forestry products; 09 Fuel, energy & electricity.",
                "items": {
                  "enum": ["14", "15", "16", "18", "19", "22", "24", "30", "31", "32", "33", "34", "35", "37", "38", "39", "41", "42", "43", "44", "45", "48", "50", "51", "55", "60", "63", "64", "65", "66", "70", "71", "72", "73", "75", "76", "77", "79", "80", "85", "90", "92", "98", "03", "09"],
                  "type": "string"
                },
                "type": "array",
