      },
      "serverInfo": {
        "name": "evolc-signals",
        "title": "Evolc Signals",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Evolc Signals: companies in Europe and the Americas hiring, funded or changing right now, with evidence links. Use search_signals to find companies (e.g. countries=[\"SK\",\"CZ\"], families=[\"sales\"], subs=[\"sdr_bdr\"] for companies that started hiring SDRs), get_company for one profile, check_accounts to see which of the user's own accounts (a CRM list) have signals, search_moves for the chronological feed of moves (funding, M&A, launches, expansions, partnerships, milestones, layoffs), search_tenders for open public tenders (company=<slug> for ones that fit a company), find_customers_for to turn a company website into its likely customers that changed recently, with a forwardable read-only link. Tool calls that return results count toward the key's monthly quota (empty results and unknown companies are free); results are gated by the account's plan.",
      "tools": [
        {
          "name": "check_accounts",
          "title": "Check my accounts",
          "description": "Check a list of known companies (e.g. the user's CRM accounts or target list, up to 100 per call): which are hiring, raised money or grew in the window, and which are quiet. Matching is exact by domain (website URL or e-mail address at the company also works), else by name within a country, else by a unique name; name matches are marked. The list is used only to answer this call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accounts": {
                "description": "Companies to check, each with a domain or a name.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "country": {
                      "description": "ISO-2 country code; narrows name matching.",
                      "type": "string"
                    },
                    "domain": {
                      "description": "Website domain, URL or an e-mail address at the company.",
                      "type": "string"
                    },
                    "name": {
                      "description": "Company name.",
                      "type": "string"
                    },
                    "ref": {
                      "description": "Your id for this account, echoed back.",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "days": {
                "default": 30,
                "description": "Look-back window in days.",
                "enum": [7, 30, 90],
                "type": "integer"
              },
              "exclude_volume": {
                "default": true,
                "description": "Leave out volume hirers (staffing agencies, branch and field-sales networks).",
                "type": "boolean"
              },
              "families": {
                "description": "Only signals and open roles in these job functions.",
                "items": {
                  "enum": ["engineering", "data", "product", "design", "robotics", "manufacturing", "sales", "marketing", "customer", "operations", "finance", "people", "legal", "executive", "other"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "kinds": {
                "description": "Signal kinds that count (default: all).",
                "items": {
                  "enum": ["hiring", "first_in_function", "hiring_spike", "leadership_role_open", "funding", "revenue_jump", "profitability_flip", "director_change", "news", "acquisition", "launch", "expansion", "partnership", "milestone", "layoffs", "contract_won", "content_push"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "subs": {
                "description": "Sub-roles within the chosen families.",
                "items": {
                  "enum": ["backend", "frontend", "fullstack", "mobile", "devops_sre", "qa", "embedded", "security", "architect", "engineering_management", "data_engineering", "data_science", "ml_ai", "analytics_bi", "product_management", "product_owner", "project_management", "product_design", "ux_research", "graphic_brand", "robot_programming", "plc_controls", "mechatronics", "robotics_software", "cnc_machining", "production", "maintenance", "quality", "process_engineering", "mechanical_design", "welding_fabrication", "account_executive", "sdr_bdr", "sales_management", "partnerships", "presales_solutions", "growth", "content", "performance", "product_marketing", "brand_pr", "marketing_management", "customer_success", "support", "account_management", "implementation", "operations", "supply_chain_logistics", "office_admin", "business_ops", "accounting", "fp_and_a", "controlling", "recruiting", "hr", "people_ops", "legal", "compliance", "c_level", "general_management"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              }
            },
            "required": ["accounts"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d58b78658611b30d96acd064ca0c0cf7020d4666579efbc4afc292f789595d96"
        },
        {
          "name": "find_customers_for",
          "title": "Find customers for a company",
          "description": "Give a company website and get the companies in Europe and the Americas most likely to buy from it that changed recently (hiring in the team that buys, a new leader, funding, better numbers), each with the fit reason, an opening line and the evidence links, plus a read-only link to the live list that can be forwarded to that company. Evolc reads the website first; the first call for a new site answers \"analysing\" (free) and the same call about two minutes later returns the list. The analysis is kept in your account and reused.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "countries": {
                "description": "Up to 12 ISO-2 codes to rank first (one code also filters the list).",
                "items": {
                  "enum": ["SK", "CZ", "PL", "HU", "AT", "SI", "DE", "CH", "HR", "RO", "GB", "IE", "FR", "BE", "NL", "LU", "ES", "PT", "IT", "MT", "GR", "CY", "DK", "SE", "NO", "FI", "IS", "EE", "LV", "LT", "BG", "RS", "BA", "ME", "MK", "AL", "UA", "MD", "LI", "MC", "AD", "SM", "US", "CA", "BR", "MX"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "domain": {
                "description": "The company website, e.g. \"acme.com\".",
                "maxLength": 253,
                "type": "string"
              },
              "goal": {
                "description": "Optional: what kind of customers to look for, in a sentence.",
                "maxLength": 300,
                "type": "string"
              },
              "limit": {
                "description": "Accounts to return (default and cap depend on the plan: 5 on work, 25 on paid).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a56a52ac1b9969ef11a433759a7b43d5a57d5c17fd6a29fd7e1e766ac3ad1983"
        },
        {
          "name": "get_company",
          "title": "Get a company profile",
          "description": "Public Evolc profile of one company by its Evolc slug (from search_signals) or its website domain: description, industry, size, founded year, open jobs, highlights with evidence, filed financials (newest first), public-sector customers and suppliers from the SK/CZ contract registers, and sources. No people or contact details.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Company website domain or URL, e.g. \"acme.sk\".",
                "type": "string"
              },
              "slug": {
                "description": "Evolc company slug, e.g. \"acme\" from companies.evolc.com/company/acme.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:49c1693da35dbe3a470bf66e504ffdf40790f288075197268325bf7ac7572822"
        },
        {
          "name": "list_saved_searches",
          "title": "List my saved searches",
          "description": "The saved Signals searches of the account that owns this API key, with their filters. Pass a search's `query` to search_signals to run it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
