        {
          "name": "search_moves",
          "title": "Search company moves",
          "description": "The moves feed: what companies just did, worldwide (Europe first, US tech press since 2026-11-08), newest first — raised money, bought or merged (both sides when known), launched a product, entered a market or won a major customer, announced a partnership, stated a milestone (ARR, customers, IPO) or cut staff. Read from startup and business news feeds across Europe and US tech press, classified automatically; every move carries the article (url), a one-line English headline, the company (slug for get_company) and its open roles. Use it to screen a market or a week; use search_signals to combine moves with who the company is hiring. Company facts only; executive hires are not listed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "countries": {
                "description": "ISO-2 country codes of the company HQ, e.g. [\"DE\", \"US\"] (default: every country).",
                "items": {
                  "pattern": "^[A-Za-z]{2}$",
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "days": {
                "default": 90,
                "description": "Look-back window in days.",
                "enum": [7, 30, 90, 365],
                "type": "integer"
              },
              "kinds": {
                "description": "Kinds of move (default: all): funding = raised money; acquisition = bought, merged or sold a stake; launch = launched a product or service; expansion = entered a market, opened a site or won a major customer; partnership = announced a partnership; milestone = passed a stated milestone; layoffs = cut staff.",
                "items": {
                  "enum": ["funding", "acquisition", "launch", "expansion", "partnership", "milestone", "layoffs"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "limit": {
                "default": 25,
                "description": "Moves to return.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Skip this many moves (for the next page).",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Company name or headline contains this text.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f0df95d8f16ee4de81a42513c25da67a4be49d3b8dc78b671b186b205496feb9"
        },
        {
          "name": "search_signals",
          "title": "Search company signals",
          "description": "Find companies in Europe and the Americas (US, CA, BR, MX) with fresh buying signals: started hiring in a function (e.g. first SDRs), hiring spikes, leadership roles, funding, acquisitions, product launches, expansions, partnerships, milestones, layoffs, revenue jumps, turning profitable, director changes and news. Data comes from company careers pages, ATS job boards, news feeds and public business registers, deepest in Slovakia, Czechia, Poland, Hungary, Austria and Germany. Filters combine with AND; values inside one filter with OR. Returns companies ranked by signal strength with the evidence (title, link, date) for each signal. Company facts only, no people.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "countries": {
                "description": "ISO-2 country codes of the company (SK Slovakia, CZ Czechia, PL Poland, HU Hungary, AT Austria, SI Slovenia, DE Germany, CH Switzerland, HR Croatia, RO Romania, GB United Kingdom, IE Ireland, FR France, BE Belgium, NL Netherlands, LU Luxembourg, ES Spain, PT Portugal, IT Italy, MT Malta, GR Greece, CY Cyprus, DK Denmark, SE Sweden, NO Norway, FI Finland, IS Iceland, EE Estonia, LV Latvia, LT Lithuania, BG Bulgaria, RS Serbia, BA Bosnia and Herzegovina, ME Montenegro, MK North Macedonia, AL Albania, UA Ukraine, MD Moldova, LI Liechtenstein, MC Monaco, AD Andorra, SM San Marino, US United States, CA Canada, BR Brazil, MX Mexico).",
                "items": {
                  "enum": ["SK", "CZ", "PL", "HU", "AT", "SI", "DE", "CH", "HR", "RO", "GB", "IE", "FR", "BE", "NL", "LU", "ES", "PT", "IT", "MT", "GR", "CY", "DK", "SE", "NO", "FI", "IS", "EE", "LV", "LT", "BG", "RS", "BA", "ME", "MK", "AL", "UA", "MD", "LI", "MC", "AD", "SM", "US", "CA", "BR", "MX"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "days": {
                "default": 30,
                "description": "Look-back window in days.",
                "enum": [7, 30, 90],
                "type": "integer"
              },
              "exclude_volume": {
                "default": true,
                "description": "Leave out volume hirers (staffing agencies, branch and field-sales networks, brokers, fundraisers). Set false to include them; they carry volume_hiring: true.",
                "type": "boolean"
              },
              "families": {
                "description": "Hiring for these job functions. With only event kinds (e.g. funding) the company must also have an open role in one of these functions.",
                "items": {
                  "enum": ["engineering", "data", "product", "design", "robotics", "manufacturing", "sales", "marketing", "customer", "operations", "finance", "people", "legal", "executive", "other"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "industries": {
                "description": "Industry keys of the company.",
                "items": {
                  "enum": ["software_saas", "ai_ml", "devtools", "cybersecurity", "fintech", "insurtech", "ecommerce_retail", "marketplace", "healthtech", "biotech_pharma", "edtech", "hrtech", "martech_adtech", "legaltech", "proptech", "construction", "mobility_logistics", "energy_climate", "manufacturing_industrial", "hardware_iot", "robotics", "gaming", "media_content", "travel_hospitality", "food_agri", "telco", "govtech", "space_defense", "consumer", "it_services", "agency", "consulting", "other"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "kinds": {
                "description": "Signal kinds that qualify a company (default: all). hiring = new roles in the window; first_in_function = first role in that function since we began tracking the company (at least 14 days earlier; job history starts 2026-10-16); hiring_spike = 3+ new roles in one function; leadership_role_open = head/director/VP/C-level role opened; revenue_jump and profitability_flip come from registry filings; funding, acquisition, launch, expansion, partnership, milestone and layoffs are moves read from the news (see search_moves); contract_won = signed a public-sector contract as supplier (SK/CZ registers, ≥ €10k); content_push = started or restarted publishing (≥ 3 blog/news posts in 30 days after a quiet period).",
                "items": {
                  "enum": ["hiring", "first_in_function", "hiring_spike", "leadership_role_open", "funding", "revenue_jump", "profitability_flip", "director_change", "news", "acquisition", "launch", "expansion", "partnership", "milestone", "layoffs", "contract_won", "content_push"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "limit": {
                "default": 25,
                "description": "Companies to return.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Skip this many companies (use `next` from the previous answer).",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Company name, website or one-liner contains this text.",
                "maxLength": 100,
                "type": "string"
              },
              "since": {
                "description": "Only signals newer than this ISO date or timestamp, e.g. 2026-10-01.",
                "type": "string"
              },
              "subs": {
                "description": "Sub-roles within the chosen families, e.g. sales → sdr_bdr. By family: engineering: backend, frontend, fullstack, mobile, devops_sre, qa, embedded, security, architect, engineering_management; data: data_engineering, data_science, ml_ai, analytics_bi; product: product_management, product_owner, project_management; design: product_design, ux_research, graphic_brand; robotics: robot_programming, plc_controls, mechatronics, robotics_software; manufacturing: cnc_machining, production, maintenance, quality, process_engineering, mechanical_design, welding_fabrication; sales: account_executive, sdr_bdr, sales_management, partnerships, presales_solutions; marketing: growth, content, performance, product_marketing, brand_pr, marketing_management; customer: customer_success, support, account_management, implementation; operations: operations, supply_chain_logistics, office_admin, business_ops; finance: accounting, fp_and_a, controlling; people: recruiting, hr, people_ops; legal: legal, compliance; executive: c_level, general_management; other: .",
                "items": {
                  "enum": ["backend", "frontend", "fullstack", "mobile", "devops_sre", "qa", "embedded", "security", "architect", "engineering_management", "data_engineering", "data_science", "ml_ai", "analytics_bi", "product_management", "product_owner", "project_management", "product_design", "ux_research", "graphic_brand", "robot_programming", "plc_controls", "mechatronics", "robotics_software", "cnc_machining", "production", "maintenance", "quality", "process_engineering", "mechanical_design", "welding_fabrication", "account_executive", "sdr_bdr", "sales_management", "partnerships", "presales_solutions", "growth", "content", "performance", "product_marketing", "brand_pr", "marketing_management", "customer_success", "support", "account_management", "implementation", "operations", "supply_chain_logistics", "office_admin", "business_ops", "accounting", "fp_and_a", "controlling", "recruiting", "hr", "people_ops", "legal", "compliance", "c_level", "general_management"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
