{
  "lockfileVersion": 2,
  "subjects": {
    "com.constituchat/constitucion": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://constituchat.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "constituchat",
        "title": "ConstituChat",
        "version": "1.0.2"
      },
      "capabilities": {
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Texto oficial de la Constitución de la República Bolivariana de Venezuela (1999). Usa buscar_articulos para encontrar qué artículos tratan un tema y leer_articulo para el texto completo. Cita el número y la URL del artículo. Contenido educativo: no es asesoría jurídica.",
      "tools": [
        {
          "name": "buscar_articulos",
          "title": "Buscar artículos de la Constitución",
          "description": "Busca en los 350 artículos de la Constitución de Venezuela (1999), con palabras clave o una pregunta en lenguaje natural, y devuelve los más relevantes con su título, un extracto y su URL. Úsala primero cuando no sepas el número del artículo; el extracto va recortado, así que para responder o citar lee después el artículo completo con leer_articulo. Solo lectura y sin clave, con un límite de consultas por minuto (HTTP 429 con Retry-After).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "consulta": {
                "description": "Palabras clave o una pregunta en español, hasta 200 caracteres, p. ej. «derecho a la salud» o «¿quién puede ser presidente?».",
                "maxLength": 200,
                "type": "string"
              },
              "limite": {
                "default": 5,
                "description": "Cuántos artículos devolver (1-20). Por defecto, 5.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["consulta"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "consulta": {
                "type": "string"
              },
              "resultados": {
                "items": {
                  "properties": {
                    "articulo": {
                      "type": "integer"
                    },
                    "extracto": {
                      "type": "string"
                    },
                    "titulo": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["articulo", "extracto", "titulo", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["consulta", "resultados"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c7dde0395079c1bad9677a8cfcf18bb07d565f1c76b8ac33d64cf474d8eae90c"
        },
        {
          "name": "leer_articulo",
          "title": "Leer un artículo de la Constitución",
          "description": "Devuelve el texto oficial completo de un artículo (del 1 al 350), con su título, su ubicación, un resumen en lenguaje claro, la fecha de revisión, la cita sugerida y la fuente oficial. Úsala cuando ya sepas el número; si no, búscalo antes con buscar_articulos. Cita el texto oficial, no el resumen. Un número fuera de 1-350 devuelve un error que lo dice. Solo lectura y sin clave, con un límite de consultas por minuto (HTTP 429 con Retry-After).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "numero": {
                "description": "Número del artículo, del 1 al 350; p. ej. 83 (derecho a la salud).",
                "maximum": 350,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["numero"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "articulo": {
                "type": "integer"
              },
              "cita": {
                "properties": {
                  "oficial": {
                    "type": "string"
                  },
                  "web": {
                    "type": "string"
                  }
                },
                "required": ["oficial", "web"],
                "type": "object"
              },
              "fecha_revision": {
                "format": "date",
                "type": "string"
              },
              "fuente": {
                "properties": {
                  "nombre": {
                    "type": "string"
                  },
                  "url": {
                    "format": "uri",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "resumen": {
                "description": "Resumen en lenguaje claro.",
                "type": "string"
              },
              "texto": {
                "description": "Texto oficial completo.",
                "type": "string"
              },
              "titulo": {
                "type": "string"
              },
              "ubicacion": {
                "properties": {
                  "capitulo": {
                    "type": ["string", "null"]
                  },
                  "seccion": {
                    "type": ["string", "null"]
                  },
                  "titulo": {
                    "type": ["string", "null"]
                  }
                },
                "type": "object"
              },
              "url": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["articulo", "cita", "texto", "titulo", "url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:891eab21222ed79059823daa6740d2aab7433a42f1cb9a13959ff9079e5957aa"
        }
      ],
      "resources": [
        {
          "uri": "constituchat://constitucion",
          "name": "constitucion",
          "title": "Constitución de Venezuela (1999), texto completo",
          "description": "Preámbulo, los 350 artículos y las disposiciones, cada artículo con su URL (lo mismo que https://constituchat.com/llms-full.txt).",
          "mimeType": "text/plain",
          "digest": "sha256:beb8205b0ddafc32cfe5b27d8a3727c7e1526b45d3cc11ab675a16dee681993c"
        }
      ],
      "resourceTemplates": [
        {
          "uriTemplate": "constituchat://articulo/{numero}",
          "name": "articulo",
          "title": "Artículo de la Constitución",
          "description": "Un artículo en markdown: texto oficial, explicación en lenguaje claro y preguntas frecuentes (lo mismo que https://constituchat.com/articulo/N.md).",
          "mimeType": "text/markdown",
          "digest": "sha256:0eadbe6cdde5302bea96ba452bbcd7abd9ffbc09ee5a596d39d3e312f1c64a42"
        }
      ],
      "digest": "sha256:6bfdcd4afd1e87ae1e7d873f14df4441f6ba3716f6b4e165763c25c8c59b4b46"
    }
  }
