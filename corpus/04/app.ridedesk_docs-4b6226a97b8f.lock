{
  "lockfileVersion": 2,
  "subjects": {
    "app.ridedesk/docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ridedesk.app/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Documentation server for building on RideDesk (booking & dispatch SaaS for transfer and rental operators). This platform server is read-only and auth-free. Each operator ACCOUNT has its own authenticated BOOKING MCP server at https://<their-domain>/api/mcp — see the \"mcp-connector\" doc. Flow: list_docs → get_doc (pass the operator's domain as `host` to get examples pointed at the right account), or search_docs for a keyword. get_integration_brief returns a self-contained brief for building a booking website.",
      "tools": [
        {
          "name": "get_doc",
          "title": "Read a documentation topic",
          "description": "One documentation topic as markdown: the booking API contract, checkout, widgets, attribution, live chat, the customer portal, or the per-account booking MCP server.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "host": {
                "description": "The operator's RideDesk domain (e.g. their-workspace.ridedesk.app or a custom domain). Optional — examples use a placeholder without it.",
                "type": "string"
              },
              "topic": {
                "description": "A topic from list_docs",
                "enum": ["overview", "quote-and-book", "checkout", "endpoints", "widgets", "attribution", "live-chat", "customer-portal", "mcp-connector"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a documentation topic"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:947c1a209568cdec0445d4a959acf7c0acd49f5a78d440ed0313d7460272e561"
        },
        {
          "name": "get_integration_brief",
          "title": "Get the integration brief",
          "description": "A self-contained brief for a coding agent building a transfer-booking website on the RideDesk API — the flow, the rules the server enforces, and the acceptance criteria.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "host": {
                "description": "The operator's RideDesk domain (e.g. their-workspace.ridedesk.app or a custom domain). Optional — examples use a placeholder without it.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the integration brief"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:97713d1394e8928329747e373f6ed058bb871dcba1892e2478cef3f3c6d4fec9"
        },
        {
          "name": "get_widget_snippets",
          "title": "Get widget & tag snippets",
          "description": "Copy-paste tags: the attribution script, the live-chat script, and the embeddable booking/enquiry/rental widget iframes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "host": {
                "description": "The operator's RideDesk domain (e.g. their-workspace.ridedesk.app or a custom domain). Optional — examples use a placeholder without it.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get widget & tag snippets"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2f40110b7cf0fe55e9de005e56b702805fac8fea886bdde346892476390e9957"
        },
        {
          "name": "list_docs",
          "title": "List documentation topics",
          "description": "The available documentation topics with one-line summaries. Call first, then get_doc.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "docs": {
                "description": "Every documentation topic this server can serve.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "summary": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "topic": {
                      "description": "Pass this to get_doc",
                      "enum": ["overview", "quote-and-book", "checkout", "endpoints", "widgets", "attribution", "live-chat", "customer-portal", "mcp-connector"],
                      "type": "string"
                    }
                  },
                  "required": ["summary", "title", "topic"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              }
            },
            "required": ["docs", "note"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List documentation topics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d690c94cb29eeaef60a3a1a1d60a97a805b427f4ffd8f181ce2a264e46e5e691"
        },
        {
          "name": "search_docs",
          "title": "Search the documentation",
          "description": "Keyword search across all documentation topics. Returns matching sections with excerpts; follow up with get_doc for the full topic.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "host": {
                "description": "The operator's RideDesk domain (e.g. their-workspace.ridedesk.app or a custom domain). Optional — examples use a placeholder without it.",
                "type": "string"
              },
              "query": {
                "description": "Keywords, an endpoint path, or a field name (e.g. \"quote_ref\", \"apple pay\", \"/api/enquiries\")",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "note": {
                "description": "Present only when there were no matches.",
                "type": "string"
              },
              "results": {
                "description": "Matching sections, best first. Empty when nothing matched.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "excerpt": {
                      "description": "Up to 600 characters of the matching section",
                      "type": "string"
                    },
                    "heading": {
                      "description": "The section heading the match sits under",
                      "type": "string"
                    },
                    "topic": {
                      "description": "Pass this to get_doc for the full topic",
                      "enum": ["overview", "quote-and-book", "checkout", "endpoints", "widgets", "attribution", "live-chat", "customer-portal", "mcp-connector"],
                      "type": "string"
                    }
                  },
                  "required": ["excerpt", "heading", "topic"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the documentation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:718261a85ee9d3f22dd65075ae74bfe01143ee3edda66970bc52f0db52bb1313"
        }
      ],
      "digest": "sha256:62fb7a2e20b5e2dc86a435de0727aad5f9a4b45f09275bc7b5d1a22e0d520d42"
    }
  }
}
