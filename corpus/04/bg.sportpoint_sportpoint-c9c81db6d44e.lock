{
  "lockfileVersion": 2,
  "subjects": {
    "bg.sportpoint/sportpoint": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://sportpoint.bg/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "SportPoint",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "SportPoint (sportpoint.bg) is a Bulgarian marketplace for sports coaches, clubs and venues (places).\nThe data is in Bulgarian: sport names, city names, levels and descriptions. Pass Bulgarian values to the filters; list_sports_and_cities lists the valid sports and cities.\nPrices are in EUR. Session dates and times are the Europe/Sofia wall clock.\nBooking happens on sportpoint.bg, not through this server. Always give the user the `url` of each coach, club, place or session you mention, so they can open it and book there.",
      "tools": [
        {
          "name": "find_sessions",
          "title": "Find Sessions",
          "description": "Find upcoming training sessions on SportPoint (Bulgaria). Filter by sport, city, date or day, time of day, age group, level and maximum price in EUR. Sessions open for online booking come first. Each session has its date and times on the Europe/Sofia wall clock, price in EUR, spots left (null = no limit), whether online booking is open, and a url where the user books it. Twenty per page.",
          "inputSchema": {
            "properties": {
              "age_group": {
                "description": "Who the session is for.",
                "enum": ["children", "adults", "mixed"],
                "type": "string"
              },
              "city": {
                "description": "City name in Bulgarian, e.g. \"София\".",
                "maxLength": 100,
                "type": "string"
              },
              "date": {
                "description": "One calendar day, YYYY-MM-DD (Europe/Sofia). Wins over day.",
                "format": "date",
                "type": "string"
              },
              "day": {
                "description": "A relative day on the Europe/Sofia clock; this_week runs to Sunday.",
                "enum": ["today", "tomorrow", "this_week"],
                "type": "string"
              },
              "level": {
                "description": "Level name as the club or coach wrote it, in Bulgarian (e.g. \"Начинаещи\").",
                "maxLength": 100,
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Result page, starting at 1.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "price_max": {
                "description": "Maximum price per session in EUR.",
                "minimum": 0,
                "type": "number"
              },
              "sport": {
                "description": "Sport name in Bulgarian (e.g. \"Плуване\") or its slug (e.g. \"pluvane\").",
                "maxLength": 100,
                "type": "string"
              },
              "time": {
                "description": "Start time band, Europe/Sofia wall clock.",
                "enum": ["before_10", "10_14", "14_18", "after_18"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find Sessions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1972a4f6a94b1c9cd0efbddb2a925d862c85fd1f6099d2311e7c4df43f78953b"
        },
        {
          "name": "get_club",
          "title": "Get Club",
          "description": "Get one SportPoint club by slug (from search_clubs_and_places): description, places, coaches, and one Monday-to-Sunday week of its sessions with price in EUR and spots left. Pass week as any date (YYYY-MM-DD) in the wanted week; the default is the current week.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The club slug, as returned by search_clubs_and_places.",
                "maxLength": 191,
                "type": "string"
              },
              "week": {
                "description": "Any date (YYYY-MM-DD) in the week to show. Defaults to the current week.",
                "format": "date",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Club"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:45075a64f71ab4d38b4415dbe39ff9a8a4eb4bf4bdec9a86d4e1f320c2d9db00"
        },
        {
          "name": "get_coach",
          "title": "Get Coach",
          "description": "Get the public profile of one SportPoint coach by slug (from search_coaches): sports, age groups, places and clubs where they train, bio, and up to ten upcoming sessions with price in EUR and spots left. Includes the profile url where the user can book.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The coach slug, as returned by search_coaches.",
                "maxLength": 191,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Coach"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1693b9426b7a5ff2fb3d3ea2703b944f01e837749a9faabae76a6a43889d241a"
        },
        {
          "name": "get_place",
          "title": "Get Place",
          "description": "Get one SportPoint place (gym, pool, hall, venue) by slug (from search_clubs_and_places): address, description, and one Monday-to-Sunday week of the sessions held there with price in EUR and spots left. Pass week as any date (YYYY-MM-DD) in the wanted week; the default is the current week.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The place slug, as returned by search_clubs_and_places.",
                "maxLength": 191,
                "type": "string"
              },
              "week": {
                "description": "Any date (YYYY-MM-DD) in the week to show. Defaults to the current week.",
                "format": "date",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Place"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3362ceff89796ea68b27a2ad5a6e6d9be23dcd59312d7441fa1e84c9a393ecd8"
        },
        {
          "name": "list_sports_and_cities",
          "title": "List Sports And Cities",
          "description": "List the sports and the cities that have coaches on SportPoint (Bulgaria). Names are in Bulgarian. Use these values for the sport and city filters of search_coaches and find_sessions.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List Sports And Cities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bf20491f53ea5e362ed3a11c1a54c2dfcef082ae2a6430806bebbcd52448add0"
        },
        {
          "name": "search_clubs_and_places",
          "title": "Search Clubs And Places",
          "description": "Search the sports clubs and the places (gyms, pools, halls, venues) published on SportPoint (Bulgaria) by name and city. type selects clubs, places or both. Each result has a public url; use get_club or get_place with its slug for details and the weekly schedule.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City name in Bulgarian, e.g. \"Пловдив\".",
                "maxLength": 100,
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Result page, starting at 1.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "search": {
                "description": "Words from the club or place name.",
                "maxLength": 100,
                "type": "string"
              },
              "type": {
                "default": "both",
                "description": "What to search: clubs, places, or both.",
                "enum": ["club", "place", "both"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search Clubs And Places"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:782e618e19caa794cadb9c57251abd63e5c09d10ec28a0e8ff95cc8d31286357"
        },
        {
          "name": "search_coaches",
          "title": "Search Coaches",
          "description": "Search the sports coaches listed on SportPoint (Bulgaria). Filter by sport, city, age group or free text (coach name or sport). Returns ten coaches per page, each with a public profile url. Sport and city values are in Bulgarian; call list_sports_and_cities for the valid values.",
          "inputSchema": {
            "properties": {
              "age_group": {
                "description": "Who the coach trains.",
                "enum": ["children", "adults", "mixed"],
                "type": "string"
              },
              "city": {
                "description": "City name in Bulgarian, e.g. \"София\".",
                "maxLength": 100,
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Result page, starting at 1.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "search": {
                "description": "Free text matched against coach names and sport names.",
                "maxLength": 100,
                "type": "string"
              },
              "sport": {
                "description": "Sport name in Bulgarian (e.g. \"Плуване\") or its slug (e.g. \"pluvane\").",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search Coaches"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
