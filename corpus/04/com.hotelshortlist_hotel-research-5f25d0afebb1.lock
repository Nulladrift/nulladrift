          },
          "digest": "sha256:35b05865ee603a0c098a3c2370c22e70adf007a7f4fd9a80f93112a83f09af7b"
        },
        {
          "name": "request_introduction",
          "title": "Request an introduction",
          "description": "Send HotelShortlist a request to get in touch. Only call this when the person asked for it and explicitly agreed to share these details. A person at HotelShortlist replies.",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "Company, for trade enquiries",
                "maxLength": 160,
                "type": "string"
              },
              "consent": {
                "description": "True only if the person explicitly agreed to share these details with HotelShortlist",
                "type": "boolean"
              },
              "email": {
                "description": "Email address",
                "maxLength": 200,
                "type": "string"
              },
              "lane": {
                "description": "Which offer the person is interested in",
                "enum": ["travellers", "tour-operators", "travel-designers", "hotel-managers", "hotel-chains"],
                "type": "string"
              },
              "name": {
                "description": "Full name",
                "maxLength": 120,
                "type": "string"
              },
              "needs": {
                "description": "What the person needs, in their words",
                "maxLength": 1500,
                "type": "string"
              },
              "role": {
                "description": "Job title or role",
                "maxLength": 120,
                "type": "string"
              },
              "whatsapp": {
                "description": "WhatsApp number, if the person wants to be contacted there",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["consent", "email", "name"],
            "type": "object"
          },
