        },
        {
          "name": "list_pitch_lanes",
          "title": "Who HotelShortlist is for",
          "description": "The offers for travellers, tour operators, travel designers and agents, hotel owners and hotel chains, with links and WhatsApp contact.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
