        {
          "name": "request_hotel_page",
          "title": "Request research for a hotel",
          "description": "Ask HotelShortlist to research a hotel that search_hotels did not find. The research takes about a minute: call again with the same hotel and city to get the page link. Pages show the review findings; member rates stay for members.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City, so the right hotel is found",
                "maxLength": 80,
                "type": "string"
              },
              "hotel": {
                "description": "Hotel name",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["hotel"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
