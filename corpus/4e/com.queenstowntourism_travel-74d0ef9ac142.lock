{
  "lockfileVersion": 2,
  "subjects": {
    "com.queenstowntourism/travel": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://queenstowntourism.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "queenstown-tourism",
        "title": "Queenstown Tourism",
        "version": "1.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Queenstown Tourism provides locally supplied information for Queenstown, Milford Sound, Wanaka, and Te Anau, New Zealand. Use search_experiences and plan_trip for local records, get_experience for detail, and travel_faq for logistics. For current information use today_news, today_fact, and live_conditions. For a sourced answer about a named activity, walk, route or town use get_answer, get_entity, check_requirements, get_route or compare_options: each fact names who states it, its source and when it was last confirmed. For where to eat and drink in Queenstown, Wanaka, Arrowtown and Te Anau use find_places_to_eat and get_venue; menu prices are as printed on the capture date and venues change them without notice. Only routes verified by the local content manifest may be returned. Prices are in NZD and indicative. Never invent prices, availability, or conditions.",
      "tools": [
        {
          "name": "check_requirements",
          "description": "List the published age, height, weight, health and safety rules for one activity or track, with sources. Lists rules only: it never decides whether a person can take part, and a rule not listed may still exist.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "activity": {
                "description": "For example \"skydiving\", \"Kepler Track\" or \"Ziptrek\"",
                "type": "string"
              }
            },
            "required": ["activity"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e0417ce6db5e0f8826bbf183065bf8849d6561b3431e7576fe441f659b8b67de"
        },
        {
          "name": "compare_options",
          "description": "Set the reviewed facts on two activities, walks or places side by side, with sources. Offers no ranking or verdict.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "first": {
                "description": "First option",
                "type": "string"
              },
              "second": {
                "description": "Second option",
                "type": "string"
              },
              "topic": {
                "description": "Optional: compare one topic",
                "enum": ["what-why", "suitability", "getting-there", "time-needed", "cost", "booking", "seasons-weather", "access", "rules-safety", "alternatives", "practical"],
                "type": "string"
              }
            },
            "required": ["first", "second"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:04384377331308fdfde1d91810cabe049a2f1d2ca8d22aa93bd2b4fe2369b22d"
        },
        {
          "name": "find_places_to_eat",
          "description": "Find published places to eat and drink in Queenstown, Wanaka, Arrowtown and Te Anau by area, type, price band, name or cuisine text, and whether they are open now (New Zealand time). Business details only, no booking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area": {
                "description": "Restrict to one area",
                "enum": ["queenstown", "wanaka", "arrowtown", "te-anau"],
                "type": "string"
              },
              "limit": {
                "description": "Max results, 1-15 (default 6)",
                "type": "integer"
              },
              "openNow": {
                "description": "Only venues whose structured hours say open right now in New Zealand time",
                "type": "boolean"
              },
              "priceBand": {
                "description": "Price band where known",
                "enum": ["$", "$$", "$$$", "$$$$"],
                "type": "string"
              },
              "query": {
                "description": "Text matched against name, cuisine, type and suburb, e.g. \"thai\", \"bakery\", \"frankton\"",
                "type": "string"
              },
              "type": {
                "description": "Restrict to one venue type",
                "enum": ["restaurant", "cafe", "pub", "bar", "bakery", "takeaway", "hotel_dining", "winery"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a3c83695be1f670a58eee540e2a9b85d1cca0f0c1f1552c259684672bda7d74d"
        },
        {
          "name": "get_answer",
          "description": "Answer a question about a named Queenstown, Fiordland, Wanaka or Arrowtown activity, walk, route or town from reviewed facts, each with who states it, its source link and the date it was last confirmed. Says so when no reviewed fact covers it. Not live information.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "question": {
                "description": "A question naming the activity, walk, route or town, e.g. \"How long is the Rob Roy Track?\"",
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3b94664b1db871dcdac65bd43904b8852c28edf130204329f957679de5ddd05b"
        },
        {
          "name": "get_entity",
          "description": "List every reviewed fact we hold on one activity, walk, route, place or facility, grouped by topic, each with its source and the date it was last confirmed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "For example \"Routeburn Track\", \"Te Anau\" or \"Shotover Jet\"",
                "type": "string"
              },
              "topic": {
                "description": "Optional: only this topic",
                "enum": ["what-why", "suitability", "getting-there", "time-needed", "cost", "booking", "seasons-weather", "access", "rules-safety", "alternatives", "practical"],
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6ef46ccff6a1e83e26608feb59bfdcc83acd9d6e547c64dd58c1601b223fd543"
        },
        {
          "name": "get_experience",
          "description": "Get full details for one experience by its slug: description, highlights, inclusions, price, rating, and cancellation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Experience slug, e.g. \"the-wine-trail-tour-72435p3\"",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:21ba67901255da05d128117860dff1a7cd5126f3857c728df2b227949b7c402e"
        },
        {
          "name": "get_route",
          "description": "List reviewed facts on getting between two places in the Southern Lakes and Fiordland: distances, drive times and services, each with its source. Not live road or timetable information.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "A place, e.g. \"Queenstown\"",
                "type": "string"
              },
              "to": {
                "description": "A place, e.g. \"Te Anau\"",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:58f448a3dfee52097e38dcfe40ea8782272832657ce65784bbd251b528e31015"
        },
        {
          "name": "get_venue",
          "description": "Get one published venue by slug: address, contact, hours, and menu lines with price as printed, capture date and source link. Prices change without notice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Venue slug from find_places_to_eat",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:31adf9cbc3ac8ed5b5392d2aaff053ed3d2773192af854bf2c0de5a47a1ca37a"
        },
        {
          "name": "list_destinations",
          "description": "List the four Queenstown Tourism destinations with a description and bookable-experience count.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ea38bbb9f099809f393dc475dd97037d7c8e7ffcfb8374210b8717227a927ddf"
        },
        {
          "name": "live_conditions",
          "description": "Find the Queenstown weather reader and source timestamps, plus official travel and resort report links. Does not return current condition claims from bundled data. Road and ski status widgets are retired.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f6f4b7d0058a2d3305765dee8fdbf9843dff482b0a00aa45c40e3ee61c281d57"
        },
        {
          "name": "plan_trip",
          "description": "Find locally supplied Queenstown and Milford Sound itinerary records by free-text query and duration.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "Exact trip length in days",
                "type": "integer"
              },
              "query": {
                "description": "e.g. \"family\", \"first time\", \"milford day trip\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:55706b041ed5e96ca977d7f47f5c4dcf6bba652905da80d459d18bb4998f03fd"
        },
        {
          "name": "search_experiences",
          "description": "Search locally supplied Queenstown, Milford Sound, Wanaka and Te Anau experiences by destination, category, maximum price (NZD), and minimum rating. Returns locally supplied details only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "One of: Multi-day Tours, Transfers, Scenic Flights, Winter Sports, Fishing, Adventure, Water Activities, Food & Wine, Cycling, Walks & Hikes, Sightseeing Tours",
                "type": "string"
              },
              "destination": {
                "description": "Restrict to one destination",
                "enum": ["queenstown", "milford-sound", "wanaka", "te-anau"],
                "type": "string"
              },
              "limit": {
                "description": "Max results, 1-15 (default 6)",
                "type": "integer"
              },
              "maxPrice": {
                "description": "Maximum \"from\" price in NZD",
                "type": "number"
              },
              "minRating": {
                "description": "Minimum average rating 0-5",
                "type": "number"
              },
              "query": {
                "description": "Free-text, e.g. \"milford cruise\", \"jet boat\", \"wine tour\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9fe72bcf03872180574cd6b5479138489a10fd0591d40341aa7cd5d8a62c5f45"
        },
        {
          "name": "today_fact",
          "description": "Get a locally supplied verified fact about Queenstown, Fiordland, or the Southern Lakes with its recorded basis.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:93a9b61ea65a5a750568189dfc1483b6ed7edf80cde3e50cd3371c331d245ba3"
        },
        {
          "name": "today_news",
          "description": "Read currently eligible reports from the same accepted news release as the website, with original publication/source dates, citations and revision identity. Historical articles remain in the archive. No live road or ski status.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many recent stories, 1-5 (default 1)",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:937a7cfee44aa4b308576f957006e17d87eec9ef08fe4c8b2b268fa92ff3a7a9"
        },
        {
          "name": "travel_faq",
          "description": "Answer a Queenstown, Milford Sound, Wanaka or Te Anau travel question from published guides. Returns quoted guide text with its source page, or says plainly that no guide covers it. Not live information.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "question": {
                "description": "The traveller's question",
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3e484bd937c2633cf7ffe5382342a06fa3489ffb986a6bd7701421e4c8b279e0"
        }
      ],
      "digest": "sha256:46f8b3bcb1d07edfac187fe6020a85a493c468f802ecaca6b2a316c2d2d13830"
    }
  }
