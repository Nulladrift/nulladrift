        {
          "name": "draft_news",
          "description": "Draft and publish a news article. Open to anyone with a Datronis account — the personal access token is for rate-limiting and audit, not permission-gating. Always drafted in English first; an automated safety classifier must return \"green\" (not political, not likely to be seen as controversial or divisive) before the article goes live. A \"flagged\" result creates the article unpublished and returns the reasons — use resubmit_news with revised content to try again; there is no way to force-publish a flagged article. Publishes English-only unless target_locales is given.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "allow_self_translation": {
                "description": "Reserves (does not yet grant a UI for) your permission to personally translate this article into additional locales later, beyond target_locales. Defaults to true — checked by default. Only ever applies to a locale after the English original has been classified \"green\"; a \"flagged\" article carries no translation permission regardless of this flag.",
                "type": "boolean"
              },
              "api_key": {
                "description": "Your Datronis personal access token (starts with \"dtk_\"). Generate one at /app/api-keys/. Required unless sent as an `Authorization: Bearer <token>` HTTP header instead (preferred — see search_jobs' api_key description for why). Publishing is open to anyone with an account — this token exists for rate-limiting and an audit trail, not to gate who may publish.",
                "type": "string"
              },
              "body": {
                "description": "Article body in the format selected by content_format",
                "minLength": 1,
                "type": "string"
              },
              "category_id": {
                "description": "Category ID; defaults to the site's default news category",
                "type": "integer"
              },
              "content_format": {
                "default": "html",
                "description": "Body format. Use \"markdown\" for headings, tables, lists, code blocks, links and images; use \"html\" for rich HTML with classes and inline CSS. Defaults to html for backward compatibility.",
                "enum": ["html", "markdown"],
                "type": "string"
              },
              "target_locales": {
                "description": "Optional 2-letter locale codes to also translate and publish into (e.g. [\"de\",\"ru\"]). English is always published first. Omit to publish English-only — broad multi-language publishing is only ever done when explicitly requested. There is no limit on how many locales may be requested here.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "title": {
                "description": "Article title (English)",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["body", "title"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
