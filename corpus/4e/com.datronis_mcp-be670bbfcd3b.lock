              "deliverables": {
                "description": "logo: logo only, logo + variants, or a brand kit",
                "enum": ["logo", "logo_variants", "brand_kit"],
                "type": "string"
              },
              "design": {
                "description": "website: ready-made theme, a substantially adapted theme, or designed from scratch",
                "enum": ["template", "customized", "custom"],
                "type": "string"
              },
              "ecommerce": {
                "description": "website: sells products online",
                "type": "boolean"
              },
              "forms": {
                "description": "website: number of forms",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "hosting": {
                "description": "website: the freelancer sets up hosting, domain and launch",
                "type": "boolean"
              },
              "integrations": {
                "description": "website: third-party tools to connect (CRM, newsletter, booking …)",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "languages": {
                "description": "website: languages, counting the first",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "layouts": {
                "description": "website: how many pages look different from each other",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
