        {
          "name": "create_memo_deck",
          "description": "Create a new Memo flashcard deck, optionally with its first cards (up to 200). For language learning set front_lang/back_lang (BCP-47, e.g. \"es-ES\" / \"en-US\") so the user hears correct free text-to-speech in the browser. Requires a personal access token with the \"memo\" scope.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Your Datronis personal access token (starts with \"dtk_\"). Generate one at /app/api-keys/. Required unless sent as an `Authorization: Bearer <token>` HTTP header instead (preferred — see search_jobs' api_key description for why).",
                "type": "string"
              },
              "back_lang": {
                "$ref": "#/properties/front_lang",
                "description": "BCP-47 language of the BACK side, e.g. \"en-US\". Omit to auto-detect."
              },
              "cards": {
                "description": "Optional cards to add right away (up to 200; use add_memo_cards for more).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "back": {
                      "description": "Answer side — e.g. the translation or answer. Markdown is rendered on both the web app and the study flashcard: **bold**, _italic_, ~~strike~~, `code`, bullet/numbered lists, > quotes, and [links](url). A single newline renders as a line break (no need for a blank line between lines of the same side).",
                      "maxLength": 5000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "front": {
                      "description": "Prompt side — e.g. a word in the language being learned, or a question. Markdown is rendered on both the web app and the study flashcard: **bold**, _italic_, ~~strike~~, `code`, bullet/numbered lists, > quotes, and [links](url). A single newline renders as a line break (no need for a blank line between lines of the same side).",
                      "maxLength": 5000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "hint": {
                      "description": "Optional clue shown before the answer is revealed. Markdown is rendered on both the web app and the study flashcard: **bold**, _italic_, ~~strike~~, `code`, bullet/numbered lists, > quotes, and [links](url). A single newline renders as a line break (no need for a blank line between lines of the same side).",
                      "maxLength": 1000,
                      "type": "string"
                    },
                    "tags": {
                      "description": "Optional tags, e.g. [\"verbs\", \"n5\"].",
                      "items": {
                        "maxLength": 50,
                        "type": "string"
                      },
                      "maxItems": 20,
                      "type": "array"
                    }
                  },
                  "required": ["back", "front"],
                  "type": "object"
                },
                "maxItems": 200,
                "type": "array"
              },
              "color": {
                "description": "Hex color, e.g. \"#6366f1\".",
                "maxLength": 20,
                "type": "string"
              },
              "description": {
                "maxLength": 1000,
                "type": "string"
              },
              "front_lang": {
                "description": "BCP-47 language of the FRONT side, e.g. \"ja-JP\" — used for free in-browser text-to-speech. Omit to auto-detect.",
                "maxLength": 16,
                "pattern": "^(|[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8}){0,3})$",
                "type": "string"
              },
              "icon": {
                "description": "One emoji, e.g. \"🇯🇵\". Defaults to 📚.",
                "maxLength": 10,
                "type": "string"
              },
              "title": {
                "description": "Deck name, e.g. \"Japanese N5 vocabulary\".",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "annotations": {
