        {
          "name": "create_form",
          "description": "Create a form (as a draft). Give a plain-language description and Datronis designs the questions, or pass exact questions, or start from a template. The form is checked like any human-made form and cannot ask for passwords, card numbers, one-time codes or recovery phrases. Call publish_form to make it live. Requires the \"forms\" scope.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Your Datronis personal access token (starts with \"dtk_\"). Generate one at /app/api-keys/. Required unless sent as an `Authorization: Bearer <token>` HTTP header instead (preferred — see search_jobs' api_key description for why).",
                "type": "string"
              },
              "description": {
                "description": "Describe the form in plain words and Datronis designs it (recommended).",
                "maxLength": 4000,
                "type": "string"
              },
              "language": {
                "description": "Language to write the form in, e.g. \"en\", \"fa\", \"de\". Default \"en\".",
                "maxLength": 16,
                "type": "string"
              },
              "mode": {
                "enum": ["survey", "quiz", "poll", "interview", "application", "job_application", "rsvp", "registration", "order", "feedback"],
                "type": "string"
              },
              "questions": {
                "description": "Exact questions to use instead of (or with no) description.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "columns": {
                      "description": "Matrix columns.",
