        {
          "name": "add_memo_cards",
          "description": "Add 1–500 flashcards to a deck in one call, or update existing ones. mode \"add\" (default) skips exact duplicates (same front AND back, ignoring case and spacing), so re-sending a list is safe; mode \"update\" overwrites the answer of cards whose front already exists, keeping their review progress. Returns created/updated/unchanged/skipped counts. Requires a personal access token with the \"memo\" scope.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Your Datronis personal access token (starts with \"dtk_\"). Generate one at /app/api-keys/. Required unless sent as an `Authorization: Bearer <token>` HTTP header instead (preferred — see search_jobs' api_key description for why).",
                "type": "string"
              },
              "cards": {
                "description": "Cards to add or update (1–500 per call).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "back": {
                      "description": "Answer side — e.g. the translation or answer. Markdown is rendered on both the web app and the study flashcard: **bold**, _italic_, ~~strike~~, `code`, bullet/numbered lists, > quotes, and [links](url). A single newline renders as a line break (no need for a blank line between lines of the same side).",
                      "maxLength": 5000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "front": {
                      "description": "Prompt side — e.g. a word in the language being learned, or a question. Markdown is rendered on both the web app and the study flashcard: **bold**, _italic_, ~~strike~~, `code`, bullet/numbered lists, > quotes, and [links](url). A single newline renders as a line break (no need for a blank line between lines of the same side).",
                      "maxLength": 5000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "hint": {
                      "description": "Optional clue shown before the answer is revealed. Markdown is rendered on both the web app and the study flashcard: **bold**, _italic_, ~~strike~~, `code`, bullet/numbered lists, > quotes, and [links](url). A single newline renders as a line break (no need for a blank line between lines of the same side).",
                      "maxLength": 1000,
                      "type": "string"
                    },
                    "tags": {
                      "description": "Optional tags, e.g. [\"verbs\", \"n5\"].",
                      "items": {
                        "maxLength": 50,
                        "type": "string"
                      },
                      "maxItems": 20,
                      "type": "array"
                    }
                  },
                  "required": ["back", "front"],
                  "type": "object"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              },
              "deck_id": {
                "description": "Deck to add to — from list_memo_decks or create_memo_deck.",
                "format": "uuid",
                "type": "string"
              },
              "mode": {
                "description": "add (default): add only cards that are not in the deck yet — a duplicate is the same front AND back (ignoring case/spacing), so re-sending a list is safe. update: cards whose front already exists get their back (and hint/tags, when you pass them) overwritten, keeping their review progress; new fronts are added. Replacing a whole deck is intentionally not available over MCP.",
                "enum": ["add", "update"],
                "type": "string"
              }
            },
            "required": ["cards", "deck_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add flashcards to a deck"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8829482e77f8a916490c347ea8d890f6ddef8fe24951b54138858a95f877f029"
        },
        {
          "name": "admin_create_news",
          "description": "Admin-only: publish a news article directly into any locale, any status, with no safety classifier and no English-first requirement. Requires an api_key belonging to an admin account — a valid but non-admin key is rejected. For non-admin accounts, use draft_news instead. Can also queue selected translations or every missing locale without keeping the MCP request open while translation runs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Your Datronis personal access token (starts with \"dtk_\"). Generate one at /app/api-keys/. Required unless sent as an `Authorization: Bearer <token>` HTTP header instead (preferred — see search_jobs' api_key description for why). The token must belong to an admin account — a valid but non-admin key is rejected.",
                "type": "string"
              },
              "body": {
                "description": "Article body in the format selected by content_format",
                "minLength": 1,
                "type": "string"
              },
              "category_id": {
                "description": "Category ID; defaults to the site's default news category",
                "type": "integer"
              },
              "content_format": {
                "default": "html",
                "description": "Body format. Use \"markdown\" for headings, tables, lists, code blocks, links and images; use \"html\" for rich HTML with classes and inline CSS. Defaults to html for backward compatibility.",
                "enum": ["html", "markdown"],
                "type": "string"
              },
              "locale": {
                "description": "2-letter locale code to publish directly into (e.g. \"en\", \"de\") — no English-first requirement, unlike draft_news",
                "type": "string"
              },
              "published": {
                "description": "Whether the article goes live immediately. Defaults to true. No safety classifier runs either way — admin judgment only.",
                "type": "boolean"
              },
              "target_locales": {
                "description": "Optional locale codes to translate in the durable background queue after creating the article. Use translate_to_all instead when every missing locale is wanted.",
                "items": {
                  "type": "string"
                },
                "maxItems": 23,
                "type": "array"
              },
              "title": {
                "description": "Article title, in the target locale",
                "minLength": 1,
                "type": "string"
              },
              "translate_to_all": {
                "description": "When true, queue every missing locale after creating the article. The tool returns immediately; use admin_get_news_translation_status to follow progress.",
                "type": "boolean"
              }
            },
            "required": ["body", "locale", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create and publish news as admin"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:408e5c9971123e42cccc0391fb4bbaff89795ee35d3e8b102795a5b877b70dff"
        },
        {
          "name": "admin_edit_news",
          "description": "Admin-only: edit any existing news article — title, body, category, or published status — regardless of who created it or what locale it is in. Requires an api_key belonging to an admin account. Unlike resubmit_news, there is no ownership restriction and no safety classifier; omit a field to leave it unchanged.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Your Datronis personal access token (starts with \"dtk_\"). Generate one at /app/api-keys/. Required unless sent as an `Authorization: Bearer <token>` HTTP header instead (preferred — see search_jobs' api_key description for why). The token must belong to an admin account — a valid but non-admin key is rejected.",
                "type": "string"
              },
              "body": {
                "description": "New body. Omit to leave unchanged.",
                "minLength": 1,
                "type": "string"
              },
              "category_id": {
                "description": "New category ID. Omit to leave unchanged.",
                "type": "integer"
              },
              "content_format": {
                "default": "html",
                "description": "Body format. Use \"markdown\" for headings, tables, lists, code blocks, links and images; use \"html\" for rich HTML with classes and inline CSS. Defaults to html for backward compatibility.",
                "enum": ["html", "markdown"],
                "type": "string"
              },
              "news_id": {
                "description": "The news_id of any existing article — not limited to ones the caller created",
                "type": "integer"
              },
              "published": {
                "description": "Publish or unpublish the article. Omit to leave the current status unchanged.",
                "type": "boolean"
              },
              "title": {
                "description": "New title. Omit to leave unchanged.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["news_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Edit news as admin"
