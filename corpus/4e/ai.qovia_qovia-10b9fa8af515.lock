      },
      "transport": {
        "type": "http",
        "url": "https://api.qovia.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "qovia",
        "version": "0.1.0",
        "websiteUrl": "https://qovia.ai/docs/mcp/"
      },
      "capabilities": {
        "experimental": {},
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Qovia returns public web data (Douyin, Xiaohongshu (RedNote), Bilibili, Tieba, Taobao, Fliggy and more) as JSON; posts, notes and videos share one record shape across platforms. Find an endpoint with search_endpoints, read its parameters with get_endpoint, then run it with call_endpoint. Only successful, non-empty results are billed (the price is listed per endpoint); empty results and failures are not charged. Finding and describing endpoints needs no sign-in; running one, and get_account, require a Qovia account connected to this MCP server.",
      "tools": [
        {
          "name": "call_endpoint",
          "title": "Call Qovia Endpoint",
          "description": "Run an endpoint and return its data plus billing info (charged_usd and remaining credit). Requires a Qovia account connected to this MCP server; billed only when data is returned, so empty results and failures are free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "endpoint_id": {
                "description": "e.g. raw.douyin.video",
                "type": "string"
              },
              "params": {
                "description": "The endpoint's parameters (see get_endpoint)",
                "type": "object"
              }
            },
            "required": ["endpoint_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Call Qovia Endpoint"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["qovia:data"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:b40f8c24f03b3f6b8b6e78b7ca740b3499dd35bc4d6c6a5efe1541da88ed38ad"
        },
        {
          "name": "get_account",
          "title": "Get Qovia Account",
          "description": "Show the connected Qovia account's credit and plan. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true,
            "title": "Get Qovia Account"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["qovia:data"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:2c28750ed86ad61aa2890a527822b1de81c95bb0361b1f94ce5103319c7d803f"
        },
        {
          "name": "get_endpoint",
          "title": "Get Endpoint Details",
          "description": "Show one endpoint: what it returns, its parameters (JSON Schema), example parameters, a response example and the price. Free; no sign-in required.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "endpoint_id": {
                "description": "e.g. raw.douyin.video",
                "type": "string"
              }
            },
            "required": ["endpoint_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true,
            "title": "Get Endpoint Details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["qovia:data"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:a2c96a037e3689acbc28db8280e83f8ba671143d60c1659d4ba4b14bc6563221"
        },
        {
          "name": "search_endpoints",
          "title": "Search Qovia Endpoints",
          "description": "Search Qovia's data endpoints by keyword (Chinese or English) and/or platform slug (douyin, tiktok, xiaohongshu, pgy, bilibili, tieba, wechat, taobao, jd, fliggy, xingtu, huahuo, cljx, ...). Returns ids, titles, price per call and whether each endpoint is live. Free; no sign-in required.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_unavailable": {
                "default": false,
                "description": "Also list endpoints that are not live yet",
                "type": "boolean"
              },
              "platform": {
                "description": "Platform slug",
                "maxLength": 50,
                "type": "string"
              },
              "query": {
                "description": "Words in the id, path or title",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true,
            "title": "Search Qovia Endpoints"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["qovia:data"],
                "type": "oauth2"
              }
            ]
