      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "kivo-legislation",
        "version": "1.30.0"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "get_precedent",
          "title": "Súmula ou tema de tribunal",
          "description": "Enunciado de súmula do STF, STJ ou TST (inclui OJ do TST), ou tema do STJ ou do STF (repercussão geral), com a questão, a tese e o link da fonte. O mesmo número de tema existe em tribunais diferentes. Cada resultado traz `status`: verified (conferido no texto compilado do Planalto), unverified (ainda não conferido), under_review (o texto desta base difere do oficial e não é exibido) ou revoked (revogado).",
          "inputSchema": {
            "properties": {
              "binding": {
                "default": false,
                "description": "true para súmula vinculante do STF",
                "title": "Binding",
                "type": "boolean"
              },
              "court": {
                "description": "\"STF\", \"STJ\" ou \"TST\"",
                "title": "Court",
                "type": "string"
              },
              "kind": {
                "default": "sumula",
                "description": "\"sumula\" (padrão), \"tema\" (STJ ou STF) ou \"oj\" (OJ do TST)",
                "title": "Kind",
                "type": "string"
              },
              "number": {
                "description": "Número da súmula ou do tema (\"331\", \"677\"). OJ do TST com o órgão: \"SDI-1 191\"",
                "title": "Number",
                "type": "string"
              }
            },
            "required": ["court", "number"],
            "title": "get_precedentArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_precedentDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Súmula ou tema de tribunal"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a63363debcdca4bdfcd873a7704343720575b74fd0ceea4d5ecf57f530d3a8e0"
        },
        {
          "name": "get_provision",
          "title": "Texto de artigo de lei",
          "description": "Texto de um artigo, parágrafo, inciso ou alínea de lei federal brasileira, com o link oficial. Cada resultado traz `status`: verified (conferido no texto compilado do Planalto), unverified (ainda não conferido), under_review (o texto desta base difere do oficial e não é exibido) ou revoked (revogado).",
          "inputSchema": {
            "properties": {
              "article": {
                "description": "Número do artigo. Ex.: \"11\", \"7º\", \"1.022\", \"11-A\"",
                "title": "Article",
                "type": "string"
              },
              "block": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Só para o ADCT da Constituição: \"ADCT\"",
                "title": "Block"
              },
              "item": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Inciso em romano: \"XXIX\"",
                "title": "Item"
              },
              "law": {
                "description": "Lei: apelido ou URN. Ex.: \"CLT\", \"Código Civil\", \"CF\", \"CDC\"",
                "title": "Law",
                "type": "string"
              },
              "paragraph": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Parágrafo: \"1\", \"2º\" ou \"único\"",
                "title": "Paragraph"
              },
              "subitem": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Alínea: \"a\"",
                "title": "Subitem"
              }
            },
            "required": ["article", "law"],
            "title": "get_provisionArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_provisionDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Texto de artigo de lei"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5149fb710599aba40728c05c5b5468a86ff7f26e1de3f8cf3fc8d81078c0eb87"
        },
        {
          "name": "search_legislation",
          "title": "Busca de leis por assunto",
          "description": "Busca dispositivos de lei e súmulas por uma pergunta em linguagem natural e devolve os mais próximos, com o link oficial. Cada resultado traz `status`: verified (conferido no texto compilado do Planalto), unverified (ainda não conferido), under_review (o texto desta base difere do oficial e não é exibido) ou revoked (revogado).",
          "inputSchema": {
            "properties": {
              "law": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Restringe a uma lei: \"CDC\", \"CLT\", \"CF\"…",
                "title": "Law"
              },
              "query": {
                "description": "Pergunta. Ex.: \"prazo para reclamar de vício aparente\"",
                "title": "Query",
                "type": "string"
              },
              "top_k": {
                "default": 5,
                "description": "Quantos artigos devolver (padrão 5)",
                "maximum": 10,
                "minimum": 1,
                "title": "Top K",
                "type": "integer"
              }
            },
            "required": ["query"],
            "title": "search_legislationArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "search_legislationDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Busca de leis por assunto"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:681f8d59e422167147b76db0ff638c85e3f34020b05a43741f385db1cfa19e8d"
        }
      ],
      "digest": "sha256:f1471f0f73285b167824bb103824a5642a3f1e6fd240ffdac7183a0172916a17"
    }
  }
}
