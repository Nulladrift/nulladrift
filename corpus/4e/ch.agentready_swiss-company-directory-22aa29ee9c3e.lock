              },
              "sender_company": {
                "type": "string"
              },
              "sender_email": {
                "type": "string"
              },
              "sender_name": {
                "type": "string"
              },
              "sender_phone": {
                "type": "string"
              },
              "service_area": {
                "type": "string"
              },
              "slug": {
                "type": "string"
              },
              "urgency": {
                "type": "string"
              }
            },
            "required": ["consent", "intent", "message", "sender_email", "sender_name", "slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
