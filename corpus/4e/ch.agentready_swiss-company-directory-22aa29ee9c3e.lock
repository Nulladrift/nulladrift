            "properties": {
              "budget": {
                "type": "string"
              },
              "consent": {
                "const": true,
                "type": "boolean"
              },
              "dry_run": {
                "description": "If true, validate and preview the request without sending email.",
                "type": "boolean"
              },
              "intent": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "preview_only": {
                "description": "Alias for dry_run.",
