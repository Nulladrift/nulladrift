          "name": "agent_intent_search",
          "description": "Find companies by a natural-language user need, location, language and desired action. Returns fit scores and next best actions.",
          "inputSchema": {
            "properties": {
              "category": {
                "type": "string"
              },
              "desired_action": {
                "description": "For example book_call, request_rate, request_quote, callback, ask_question.",
                "type": "string"
              },
              "language": {
                "type": "string"
              },
              "limit": {
                "default": 5,
                "type": "number"
              },
              "location": {
                "type": "string"
              },
              "user_need": {
                "type": "string"
              }
            },
            "required": ["user_need"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
