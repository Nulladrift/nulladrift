              },
              "sender_company": {
                "type": "string"
              },
              "sender_email": {
                "type": "string"
              },
              "sender_name": {
                "type": "string"
              },
              "sender_phone": {
                "type": "string"
              },
              "service_area": {
                "type": "string"
              },
              "slug": {
                "type": "string"
              },
              "urgency": {
                "type": "string"
              }
            },
            "required": ["consent", "function_name", "message", "sender_email", "sender_name", "slug"],
