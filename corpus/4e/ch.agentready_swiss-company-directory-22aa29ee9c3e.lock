        },
        {
          "name": "call_company_function",
          "description": "Execute an email-backed company function returned by search_company_directory, for example request_rate, request_quote, request_meeting, request_callback or ask_question.",
          "inputSchema": {
            "properties": {
              "budget": {
                "type": "string"
              },
              "consent": {
                "const": true,
                "type": "boolean"
              },
              "dry_run": {
                "description": "If true, validate and preview the request without sending email.",
                "type": "boolean"
              },
              "function_name": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "preview_only": {
                "description": "Alias for dry_run.",
