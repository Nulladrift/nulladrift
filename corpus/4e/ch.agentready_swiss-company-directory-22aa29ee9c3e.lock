{
  "lockfileVersion": 2,
  "subjects": {
    "ch.agentready/swiss-company-directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentready.ch/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "agentready.ch",
        "title": "agentready.ch Swiss company directory",
        "version": "1.2.0",
        "description": "Search and read public profiles of Swiss firms, contact firms that take messages, and list a firm for free.",
        "websiteUrl": "https://agentready.ch/en/mcp",
        "icons": [
          {
            "src": "https://agentready.ch/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://agentready.ch/icon-64.png",
            "mimeType": "image/png",
            "sizes": ["64x64"]
          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "agentready.ch is a directory of Swiss firms. search_companies finds firms; read_company_profile reads one. To check whether a firm is listed, search for its domain (e.g. loaded.ch): the profile on that domain has exact_match: true. send_contact_request sends a real message at once: show the user the final text and the firm first, and send only after a clear OK. Listing a firm is free: request_listing, then confirm_listing with the code from the e-mail. List a firm only after the user said it is theirs, or that they act for it, and asked for the listing; if it is not theirs, the firm can list itself for free at https://agentready.ch/#website-check. Send only the website, not profile text. Pass message_for_user on in the user's language and follow next. These tools never charge or take payment.",
      "tools": [
        {
          "name": "confirm_listing",
          "title": "Publish a listing with the code",
          "description": "Publishes a free basic profile with the 6-digit code from the confirmation e-mail: takes the website, the e-mail address the code went to and the code (valid 5 minutes). The profile then is public with that person as owner, marked «Vom Inhaber bestätigt» (confirmed by the owner), and the person gets a sign-in link to the dashboard by e-mail. Returns status, next and message_for_user: published (profile_url), code_invalid, email_mismatch, not_found (no listing waits for a code), exists or listed (profile_url with login_url or takeover_url), draft_incomplete or not_possible (check_url), rate_limited or temporarily_unavailable (retry_after_seconds), invalid_request (invalid_fields) or error.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "The 6 digits from the confirmation e-mail, as a string, e.g. \"482913\".",
                "type": "string"
              },
              "email": {
                "description": "The e-mail address the code went to.",
                "type": "string"
              },
              "language": {
                "description": "Optional. The user's language: de, en, fr or it.",
                "enum": ["de", "en", "fr", "it"],
                "type": "string"
              },
              "name": {
                "description": "Optional. The person's name, for our records (not public).",
                "type": "string"
              },
              "website": {
                "description": "The website the code was requested for.",
                "type": "string"
              }
            },
            "required": ["code", "email", "website"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Publish a listing with the code"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9b9996225424ae334b973eb1cad2c8efceb00c5b34f09acb4a754b67dd04fa42"
        },
        {
          "name": "read_company_profile",
          "title": "Read a company profile",
          "description": "Returns one firm's public profile by its slug: name, trade, region, services, languages, descriptions, sources, the profile and agent-file links, and contact: whether the firm takes messages and which kinds of request (contact.intents).",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The firm's slug, as in its search result or profile link, e.g. muster-garten.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a company profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3f16376e6e48bdeffbf87b3f210ba4334286a08e69ee9e873b30895df2c3712f"
        },
        {
          "name": "request_listing",
          "title": "List a firm for free",
          "description": "Adds a Swiss firm to the agentready.ch directory for free, at the request of its owner or of someone acting for it. agentready.ch researches the public facts itself (Swiss commercial register, the firm's own website) and publishes a basic profile without phone, e-mail or links; text sent with the request is not used (ignored_fields). With an e-mail address at the website's domain, a 6-digit code goes to that address, and the profile is published with that person as owner once the code is confirmed. Without one, an active AG or GmbH is published marked as added through an AI assistant; other firms get a private draft with a link. A request without a valid user_role or user_consent is answered with consent_needed and the question for the user in message_for_user. Returns status, next, message_for_user (in the given language) and the links that apply: profile_url, check_url, login_url (the firm has an owner) or takeover_url (it has none). With dry_run: true nothing is sent or created, and would_status and would_next give the outcome of a real request. Free of charge; no payment is taken.",
          "inputSchema": {
            "properties": {
              "assistant": {
                "description": "Optional. The assistant's product name (ChatGPT, Claude, Gemini, Perplexity, Copilot, Mistral, Cursor), shown on the profile as «Über ChatGPT eingetragen». Over REST the X-Agent-Name header works too.",
                "type": "string"
              },
              "company_name": {
                "description": "Optional. The firm's name, used to find its entry in the commercial register.",
                "type": "string"
              },
              "dry_run": {
                "description": "Optional. true: a test that checks everything, the website too, and sends and creates nothing (no research, no draft, no code, no profile). The answer has next = done; would_status and would_next give the outcome of a real request.",
                "type": "boolean"
              },
              "email": {
                "description": "Optional. An e-mail address at the website's own domain (info@muster.ch); the code goes there. Addresses at other domains are not used.",
                "type": "string"
              },
              "language": {
                "description": "Optional. The user's language: de, en, fr or it (default de; en under /en). The answer is in German for de and in English otherwise; for fr and it, translate_to names the language. Links go to the German pages for de and to the English pages under /en for en; for fr, it or no language they follow the endpoint (/en: English).",
                "enum": ["de", "en", "fr", "it"],
                "type": "string"
              },
              "user_consent": {
                "const": true,
                "description": "true when the user asked for the listing and agreed that the firm's public facts are published.",
                "type": "boolean"
              },
              "user_role": {
                "description": "The user's own statement: owner, or acts_for_firm (acts for the firm). Required.",
                "enum": ["owner", "acts_for_firm"],
                "type": "string"
              },
              "website": {
                "description": "The firm's own website, e.g. muster.ch.",
                "type": "string"
              }
            },
            "required": ["user_consent", "user_role", "website"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "List a firm for free"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:877eecae93023bcbdfd8c293fba8153f868191c3d0923fa5ad576447f18bd767"
        },
        {
          "name": "search_companies",
          "title": "Search Swiss companies",
          "description": "Searches the public profiles of Swiss firms on agentready.ch by trade, service, place, firm name or website, e.g. «Fahrschule Winterthur» or «loaded.ch». Returns up to limit firms, each with slug, name, category, region, short description, services, the full profile link (profile_url_absolute) and can_contact (whether the firm takes messages through agentready.ch). A query with a website returns the profile on that domain first, with exact_match: true; when no result has exact_match: true, that firm is not listed.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the user looks for: trade, service, firm name, place or website, e.g. «Fahrschule Winterthur» or «loaded.ch».",
                "type": "string"
              },
              "region": {
                "description": "Optional. A town, canton or region, e.g. Winterthur or Zug.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Swiss companies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f5ee15a3c16ae95056d831755f92261c35af4cc48aa2438c16c9ce024f488533"
        },
        {
          "name": "send_contact_request",
          "title": "Send a message to a company",
          "description": "Sends a message from the user to a Swiss firm through agentready.ch. The firm receives it by e-mail at once and replies to sender_email; a sent message cannot be withdrawn. Sends only with consent: true, the user's confirmation of the final text. intent is the kind of request. Returns status and next_step: sent, held_for_review, dry_run (with a preview, nothing sent), contact_not_available (the firm takes no messages), intent_not_allowed (with allowed_intents), consent_required, invalid_request (with invalid_fields) or not_found.",
          "inputSchema": {
            "properties": {
              "budget": {
                "description": "Optional.",
                "type": "string"
              },
              "consent": {
                "const": true,
                "description": "true when the user read the final message and confirmed that it is sent.",
                "type": "boolean"
              },
              "dry_run": {
                "description": "true: checks and previews only; nothing is sent.",
                "type": "boolean"
              },
              "intent": {
                "default": "contact_request",
                "description": "The kind of request: contact_request (general), request_quote (an offer), request_rate (rates or fees), request_callback, request_meeting or ask_question.",
                "enum": ["contact_request", "request_quote", "request_rate", "request_callback", "request_meeting", "ask_question"],
                "type": "string"
              },
              "message": {
                "description": "The message as the user approved it, sent word for word.",
                "maxLength": 4000,
                "minLength": 10,
                "type": "string"
              },
              "sender_company": {
                "description": "Optional.",
                "type": "string"
              },
              "sender_email": {
                "description": "The user's e-mail address; the firm replies there.",
                "format": "email",
                "type": "string"
              },
              "sender_name": {
                "description": "The user's name.",
                "type": "string"
              },
              "sender_phone": {
                "description": "Optional.",
                "type": "string"
              },
              "service_area": {
                "description": "Optional. Where the service is needed.",
                "type": "string"
              },
              "slug": {
                "description": "The firm's slug, as in its search result or profile link.",
                "type": "string"
              },
              "urgency": {
                "description": "Optional.",
                "type": "string"
              }
            },
            "required": ["consent", "message", "sender_email", "sender_name", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send a message to a company"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:401fb2ec8feb9344fd58ad3c83a15f49b96bf32dcafdeb1b4c1b66307bc29472"
        }
      ],
      "digest": "sha256:5704d21d01f55fb95be4051dfdf4db677c5a44e77c235bd8a52695a634ec89a8"
    }
  }
}
