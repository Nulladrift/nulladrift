            "readOnly": false
          },
          "digest": "sha256:3e471c6517370f6d940fd3dbf8c05e903e7032db12d9299c75392a4e84316c36"
        },
        {
          "name": "request_listing",
          "description": "Submit a business to be listed on agentready.ch. Prepares an agent-ready profile and emails the company's contact a Stripe pay link to activate. Collect all required fields from the user first. The profile stays private until the company clicks the pay link — nothing is charged automatically.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional. Industry / category.",
                "type": "string"
              },
              "company_name": {
                "description": "The business name.",
                "type": "string"
              },
              "consent": {
                "const": true,
                "description": "Must be true — the company agreed to be listed and emailed.",
                "type": "boolean"
              },
              "contact_email": {
                "description": "The company's real contact email — the pay link is sent here.",
                "type": "string"
              },
              "contact_name": {
                "description": "Name of the person to contact.",
                "type": "string"
              },
              "plan": {
                "description": "Optional. agent_profile_monthly or agent_profile_yearly. Defaults to monthly.",
                "type": "string"
              },
              "region": {
                "description": "Optional. Region, e.g. Zürich.",
                "type": "string"
              },
              "website": {
                "description": "The business website URL.",
                "type": "string"
              }
            },
            "required": ["company_name", "consent", "contact_email", "contact_name", "website"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bbde5163b5f8da3ae89ab4a6385f8e3d67fa2a4457ef8d6dd0756f209ae45565"
        },
        {
          "name": "search_companies",
          "description": "Search public agentready.ch company profiles by name, category, region or service.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "type": "number"
              },
              "query": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:14de219b4c8a0281fc6d875410a141b73ee8430c5a968e764c8a9e7203c10207"
        },
        {
          "name": "search_company_directory",
          "description": "Structured discovery for agents. Search by company name, service, category, region and available function. Returns slugs, profile links, agent files, available functions and contact endpoints.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category such as Versicherung, Beratung, Treuhand.",
                "type": "string"
              },
              "function_name": {
                "description": "Available function such as prepare_contact_request, list_calendar_slots or schedule_setup_call.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "type": "number"
              },
              "query": {
                "description": "Free text such as company name, service or need.",
                "type": "string"
              },
              "region": {
                "description": "Region such as Schweiz, Zürich, Basel, Zug.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
