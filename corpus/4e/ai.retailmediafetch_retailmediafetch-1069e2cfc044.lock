      "instructions": "Product record from gtinfetch.ai (signed); hub layer: seat, market, claim, price, availability. A2A Retailmedia — the agentic retail-media hub for grocery, operated by WeFetch AI Corp. The retailer is the seller of media; the maker's agent is the buyer. Every grocery banner in 20 markets has a signed card with a status: listed · claimed · verified. Reads are open. For a handshake call resolve_jurisdiction, then resolve_actor, then gate_transaction, then find_makers, resolve_gtin, check_eligibility, list_banners, list_packages, quote_package, find_buyer and submit_demand. submit_demand needs four things — the maker, a budget a person has approved, a Global Trade Item Number (GTIN) and a list of banners — or it returns a gap. wefetch owns no inventory, runs no auction, makes no creative and quotes no price. Artificial intelligence makes mistakes. A2A Retailmedia is an agentic information source, not a recommendation. No ads, ever. No rank for sale. Trade only.",
