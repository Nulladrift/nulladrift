      "serverInfo": {
        "name": "seat-sherpa",
        "title": "Seat Sherpa",
        "version": "1.2.1",
        "websiteUrl": "https://seatsherpa.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Seat Sherpa is the carpool marketplace for long-distance trips in California and Nevada: drivers post trips they are already taking and riders book a seat to split gas. Use search_rides to find rides between two places, get_ride for one ride's details. Prices are all-in per seat in USD. Times are Pacific; a time marked estimated is when the car is expected at that stop. When no ride fits, use request_ride_link to give the person a link to post a ride request, so drivers on that route are notified (a search_rides answer with no rides already includes it). When the person is the driver, use post_ride_link to give them a link to post their drive. When the person wants to share an Uber, Lyft or Waymo and split the fare (an airport run, or a trip across town), use search_cabpools to find open cabpools, and cabpool_link to give them a link to post their own. Today is 2026-11-14 (Pacific). Dates are YYYY-MM-DD; a day the person names without a year is the next one on or after today, and past dates are rejected. To book, give the person the ride link: booking, payment and messaging with the driver happen on seatsherpa.app or in the Seat Sherpa app, never through this server. Ride requests and drives are posted on the linked page too, where the person signs in; never ask for names, phone numbers or email addresses.",
      "tools": [
        {
          "name": "cabpool_link",
          "title": "Link to share an Uber or Lyft (Cabpool)",
          "description": "Cabpool: a free Seat Sherpa feature for sharing an Uber, Lyft or Waymo with people going the same way and splitting the fare, most often to or from an airport (SFO, OAK, SJC, LAX, BUR, SAN, SMF and others) or across town in California or Nevada. Use it when the person wants to split a rideshare rather than ride in someone's car, including short trips inside one area (for example \"split an Uber from Nob Hill to SFO\"), which search_rides does not cover. Returns a link that opens the cabpool form with the pickup, drop-off and day filled in; the person signs in, sees a fare estimate and each person's share, and posts it so others going that way can join. Seat Sherpa does not book, run or charge for the ride and is not affiliated with Uber, Lyft or Waymo: one member books it in their own app and the others pay their share directly. This tool only builds the link and posts nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Optional travel date, YYYY-MM-DD (Pacific). Today is 2026-11-14 (Pacific): use today or a later date, and when the person names a day without a year, the next one on or after today. Omit and the person picks the day on the page.",
                "type": "string"
              },
              "from": {
                "description": "Pickup: a place, neighborhood, campus or airport, e.g. \"Nob Hill, San Francisco\", \"UC Davis\", \"LAX\".",
                "type": "string"
              },
              "time": {
                "description": "Optional pickup time, 24-hour HH:MM Pacific (e.g. \"06:30\"); used only together with date.",
                "type": "string"
              },
              "to": {
                "description": "Drop-off, e.g. \"SFO\", \"Downtown Oakland\".",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Link to share an Uber or Lyft (Cabpool)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7d5679a117fe4252c7face06eea7fdec0cafd709297bf54f0a5397bc55c6fb09"
        },
        {
