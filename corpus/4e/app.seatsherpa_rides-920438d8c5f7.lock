        },
        {
          "name": "post_ride_link",
          "title": "Link to post a drive on Seat Sherpa",
          "description": "For a driver: a link where the person posts a drive they are already taking on Seat Sherpa, the carpool marketplace. Drivers set their own seat price, riders share costs like gas and tolls, and riders searching that route get notified. Use it when the person is the one driving (for example \"I'm driving to LA on Friday, can I take people?\"), not to find a ride. Takes the starting place, the destination and an optional date. The driver signs in and posts on the page; this tool only builds the link and posts nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Optional travel date, YYYY-MM-DD (Pacific). Today is 2026-11-14 (Pacific): use today or a later date, and when the person names a day without a year, the next one on or after today. Omit and the driver picks the date on the page.",
                "type": "string"
              },
              "from": {
                "description": "Where the driver starts: a city or place in California or Nevada, e.g. \"San Francisco\", \"Irvine\".",
                "type": "string"
              },
              "to": {
                "description": "Where the driver is going, e.g. \"Los Angeles\", \"Las Vegas\".",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Link to post a drive on Seat Sherpa"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ad8d06c47c5b4576cb1392490ad1776fd8995a0834831d10dbe044f33c5ba0b2"
        },
        {
          "name": "request_ride_link",
          "title": "Link to request a Seat Sherpa ride",
          "description": "For a rider when no ride fits: a link where the person posts a ride request on Seat Sherpa, the carpool marketplace, so drivers on that route see it and get notified, and the person hears back when a matching ride is posted. Use it after search_rides finds nothing that works (that answer already includes this link), or when the person asks to be told about a trip nobody has posted. Takes the same places and optional date as search_rides. The person signs in and posts the request on the page; this tool only builds the link, posts nothing, and never needs names, phone numbers or emails.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Optional travel date, YYYY-MM-DD (Pacific). Today is 2026-11-14 (Pacific): use today or a later date, and when the person names a day without a year, the next one on or after today. Omit and the person picks the date on the page.",
                "type": "string"
              },
              "from": {
                "description": "Where the rider starts: a city or place in California or Nevada, e.g. \"San Francisco\", \"UC Davis\", \"Irvine\".",
                "type": "string"
              },
              "seats": {
                "description": "Optional: seats the rider needs, 1 to 4. Only mentioned in the answer; the person picks it on the page.",
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "Where the rider is going, e.g. \"Los Angeles\", \"Las Vegas\".",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Link to request a Seat Sherpa ride"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ba2520fb4b9aa4eef55a57908648455c6964f58893972607a2c7cb23b109ab69"
        },
        {
          "name": "search_cabpools",
          "title": "Search shared Uber or Lyft rides (Cabpool)",
          "description": "Find open cabpools on Seat Sherpa: people sharing an Uber, Lyft or Waymo going the same way and splitting the fare, often to or from an airport. Takes a pickup and a drop-off (a city, area, neighborhood or airport such as \"San Francisco\", \"UC Davis\", \"SFO\"; both may be in one area) and an optional date. Returns each cabpool's pickup and drop-off place, departure time (Pacific), service, spots left, an estimate of each person's share in USD and a link to join. Seat Sherpa does not book, run or charge for the ride; when nothing fits, the answer includes a link to post a cabpool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Optional travel date, YYYY-MM-DD (Pacific). Today is 2026-11-14 (Pacific): use today or a later date, and when the person names a day without a year, the next one on or after today. Omit to list the soonest cabpools.",
                "type": "string"
              },
              "from": {
                "description": "Pickup area or place, e.g. \"San Francisco\", \"Davis\", \"LAX\".",
                "type": "string"
              },
              "to": {
                "description": "Drop-off area or place, e.g. \"SFO\", \"Los Angeles\".",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search shared Uber or Lyft rides (Cabpool)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fee70442817c5cc99b94d34d2f254fbd68f1cc4297f9a161ca50283264cf9f8f"
        },
        {
          "name": "search_rides",
          "title": "Search Seat Sherpa carpools",
          "description": "Find upcoming long-distance carpool rides on Seat Sherpa (California and Nevada) where everyday drivers sell the empty seats on a trip they are already taking, and riders split the cost of gas. Give a starting place and a destination as city or place names (for example \"San Francisco\" and \"Los Angeles\"), and optionally a travel date. Returns rides with open seats: route, departure date and time (Pacific), seats left, the all-in price per seat in USD (what the rider pays, fees included), the driver's first name, and a link where the person books. Rides that stop in a city count for that city, so a San Jose to San Diego ride with a Los Angeles stop is found for Los Angeles to San Diego. Booking happens on the link; this tool cannot book. Rides on a nearby route (for example a San Francisco ride for a San Jose search) are listed separately as nearby_rides; say they are nearby, not exact. When no ride fits exactly, the answer includes a link to post a ride request for that route (the same link request_ride_link gives).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Optional travel date, YYYY-MM-DD (Pacific). Today is 2026-11-14 (Pacific): use today or a later date, and when the person names a day without a year, the next one on or after today. Omit to list the soonest rides.",
                "type": "string"
              },
              "days_flexible": {
                "description": "With a date: also include rides this many days before and after it. Default 1.",
                "maximum": 7,
                "minimum": 0,
                "type": "integer"
              },
              "from": {
                "description": "Where the rider starts: a city or place in California or Nevada, e.g. \"San Francisco\", \"UC Davis\", \"Irvine\".",
                "type": "string"
              },
              "limit": {
                "description": "Most rides to return. Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "Where the rider is going, e.g. \"Los Angeles\", \"Las Vegas\".",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search Seat Sherpa carpools"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:38c64f4fe99219b44c920f60c0df304a47ffd7161a53d69d8cc8f5f7abc2357b"
        }
