        {
          "name": "plan_trip",
          "title": "Plan a multi-stop trip",
          "description": "Use this when the user plans a trip with several stops. Returns hotels for each stay in travel order (e.g. Lisbon 4 nights, Porto 3, Madrid 5): the best match for each stop by the OKstays Comfort Score (or the travel style's score), alternatives, the stay dates and an indicative total. Each hotel link opens its OKstays page with the stop's dates, so its Book Now button books those nights. Agree the stops and nights with the user first; list_cities shows which destinations of a country we cover. Read-only, no sign-in.",
          "inputSchema": {
            "properties": {
              "adults": {
                "description": "Guests per room (default 2).",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "alternatives": {
                "description": "Other options per stop (default 2).",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum indicative price per night in USD.",
                "minimum": 0,
                "type": "number"
              },
              "min_score": {
                "description": "Minimum Comfort Score (0-10).",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "persona": {
                "description": "Travel style for every stop: digital-nomad, deep-sleep, avoid-crowds, romantic, family, business, solo-safe, luxury, budget-comfort, long-stays.",
                "type": "string"
              },
              "property_type": {
                "description": "property_type: hotels (default), apartments, hostels or any. hotels includes guest houses, B&Bs, aparthotels and resorts; apartments includes holiday homes, villas and homestays; any adds every kind, boats and campsites too. The long-stays persona defaults to any.",
                "enum": ["hotels", "apartments", "hostels", "any"],
                "type": "string"
              },
              "start_date": {
                "description": "Check-in date of the first stop, YYYY-MM-DD; each stop starts when the one before ends. Without it, no dates are set.",
                "type": "string"
              },
              "stops": {
                "description": "The trip's stops in order.",
                "items": {
                  "properties": {
                    "district": {
                      "description": "Optional neighbourhood for this stop.",
                      "type": "string"
                    },
                    "location": {
                      "description": "City name or slug, as in search_hotels.",
                      "type": "string"
                    },
                    "nights": {
                      "maximum": 30,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["location", "nights"],
                  "type": "object"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              },
              "tags": {
                "description": "Filters every hotel must score 8+ on, as in search_hotels.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["stops"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Plan a multi-stop trip"
