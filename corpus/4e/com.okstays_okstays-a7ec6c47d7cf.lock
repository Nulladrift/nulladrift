        },
        {
          "name": "get_filters",
          "title": "Filters and travel styles",
          "description": "Use this to look up the comfort signals and travel styles that search_hotels accepts, when the user's wish doesn't map clearly to one. Returns every filter (id, name, description, category, whether it's a must-have) and every travel style. Plain names also work in search_hotels tags ('quiet', 'wifi'). Read-only, no sign-in.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
