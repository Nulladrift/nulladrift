        {
          "name": "get_city_overview",
          "title": "Destination overview",
          "description": "Use this when the user is still choosing a destination or an area to stay in. Returns how many hotels we score, the average Comfort Score, median price, where its hotels beat and trail the average hotel, the best neighbourhoods with their top hotel, which travel styles it suits, the city tax at a 4-star hotel, when to go (pleasant, cool-night and quiet months, typical weather by month) and, where we have a guide, where to stay: the area for a first visit, quiet nights, nightlife, families and value, with each area's price, comfort, street noise and bars. A request for hotels (e.g. 'quiet hotels in Bangkok') is search_hotels' job. Read-only, no sign-in.",
          "inputSchema": {
            "properties": {
              "adults": {
                "description": "Guests per room (1-8), if given.",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "checkin": {
                "description": "User's check-in date, YYYY-MM-DD (e.g. 2027-03-12), if given: links then open on this stay.",
                "type": "string"
              },
              "checkout": {
                "description": "Check-out date, YYYY-MM-DD (e.g. 2027-03-15).",
                "type": "string"
              },
              "location": {
                "description": "City name or slug (an area such as Canggu gives its destination's overview).",
                "type": "string"
              }
            },
            "required": ["location"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Destination overview"
          },
          "behavior": {
