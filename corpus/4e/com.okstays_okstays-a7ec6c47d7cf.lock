      },
      "instructions": "Hotel comfort rankings: the OKstays Comfort Score (0-10) rates hotels on comfort signals such as quiet, beds, WiFi and cleanliness. A hotel's evidence says when its scores come from what guests wrote in reviews; without it, they are our AI's assessment. When the user asks for hotels (e.g. 'quiet hotels in Bangkok'), call search_hotels straight away: it ranks by travel style, strengths, price, neighbourhood or distance, and hotel_name looks up a hotel the user names. It lists hotels unless property_type asks for apartments, hostels or any kind of stay (the long-stays persona: any). When the user gives travel dates or a number of guests, pass checkin, checkout and adults to the hotel tools: every hotel link then opens on that stay and the page's Book Now books it. Use get_city_overview when they are still choosing a destination or an area, get_hotel for the evidence behind a score (focus on what the user asked about), compare_hotels and find_similar_hotels to choose between options, and plan_trip for a trip with several stops (destinations and nights, in order). Hotel results carry the city tax where we know it, in the currency it's charged in; get_city_overview also says when to go and, for many destinations, which area suits which trip; plan_trip gives each dated stop's typical weather. get_filters lists valid filter ids and travel styles. Prices are indicative; the hotel page link has the live price and booking.",
      "tools": [
        {
          "name": "compare_hotels",
          "title": "Compare hotels",
          "description": "Use this when the user is choosing between 2-4 specific hotels. Returns each hotel's Comfort Score breakdown, price, strengths and complaints, the signals where they differ most, and a verdict: best comfort, cheapest, best value. Hotel ids come from search_hotels (hotel_name finds a hotel the user names). Read-only, no sign-in.",
          "inputSchema": {
            "properties": {
              "adults": {
                "description": "Guests per room (1-8), if given.",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "checkin": {
                "description": "User's check-in date, YYYY-MM-DD (e.g. 2027-03-12), if given: links then open on this stay.",
                "type": "string"
              },
              "checkout": {
                "description": "Check-out date, YYYY-MM-DD (e.g. 2027-03-15).",
                "type": "string"
              },
              "hotel_ids": {
                "description": "2-4 hotel ids from search_hotels.",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["hotel_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare hotels"
          },
          "behavior": {
