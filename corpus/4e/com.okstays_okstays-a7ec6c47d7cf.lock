        {
          "name": "get_hotel",
          "title": "Hotel details",
          "description": "Use this when the user asks about one hotel: why it scores as it does, or whether it's quiet, clean or good for sleep or work. Returns the Comfort Score breakdown, what the scores rest on, the five must-haves, its strengths and complaints with the reason behind each score, price, the city tax where we know it and its okstays.com link. Pass focus with what the user asked about; detail='full' adds every scored signal (about four times longer). Read-only, no sign-in.",
          "inputSchema": {
            "properties": {
              "adults": {
                "description": "Guests per room (1-8), if given.",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "checkin": {
                "description": "User's check-in date, YYYY-MM-DD (e.g. 2027-03-12), if given: links then open on this stay.",
                "type": "string"
              },
              "checkout": {
                "description": "Check-out date, YYYY-MM-DD (e.g. 2027-03-15).",
                "type": "string"
              },
              "detail": {
                "description": "summary (default) or full: every scored signal with its explanation, about four times longer.",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "focus": {
                "description": "Signals the user asked about, as filter ids or names (e.g. ['quiet', 'bed', 'wifi']); always included with their reasons.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "hotel_id": {
                "description": "Hotel id (numeric string) from search_hotels.",
                "type": "string"
              }
            },
            "required": ["hotel_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Hotel details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e3ef397cab89534fbcbd1b548624da4b0515b935fa9500118bca863e3df2b31f"
        },
        {
          "name": "list_cities",
          "title": "Covered destinations",
          "description": "Use this when the user asks which destinations OKstays covers, or before planning a trip through a country. Returns every destination we score with its country, slug and number of hotels; pass country to list one country only. Read-only, no sign-in.",
