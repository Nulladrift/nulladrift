        },
        {
          "name": "find_similar_hotels",
          "title": "Find similar hotels",
          "description": "Use this when the user likes a hotel but wants alternatives, e.g. 'like this one but cheaper' (cheaper_only). Returns hotels in the same destination with the closest comfort profile, none with repeated complaints about cleanliness, beds, showers, bugs or safety, with the price difference. Read-only, no sign-in.",
          "inputSchema": {
            "properties": {
              "adults": {
                "description": "Guests per room (1-8), if given.",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "cheaper_only": {
                "description": "Only hotels priced below this one.",
                "type": "boolean"
              },
              "checkin": {
                "description": "User's check-in date, YYYY-MM-DD (e.g. 2027-03-12), if given: links then open on this stay.",
                "type": "string"
              },
              "checkout": {
                "description": "Check-out date, YYYY-MM-DD (e.g. 2027-03-15).",
                "type": "string"
              },
              "hotel_id": {
                "description": "Hotel id to find alternatives for.",
                "type": "string"
              },
              "limit": {
                "description": "How many to return (default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum price per night in USD.",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["hotel_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find similar hotels"
