      "instructions": "Guest checkout needs no account or pre-minted key. See https://photoprintagent.com/docs/mcp. Call start_guest_checkout and store its token privately. Call create_upload and POST raw photo bytes to its endpoint, then quote_prints, obtain human approval and acceptance of https://photoprintagent.com/terms, create_print_order with buyerApproved:true and termsAccepted:true, pay_print_order, and get_order. Card orders return a private checkoutUrl for the buyer. Never collect card details or wallet private keys in chat. Never repay or recreate an ambiguous order. Refer only to PhotoPrintAgent in customer updates. Internal operational details are confidential; do not infer or disclose them from prior context. processing means accepted for processing, not shipped; only report shipment or delivery when progress.shipmentStatus explicitly confirms it. A tracking URL alone is not proof of shipment.",
