      "instructions": "PhotoPrintAgent consumer commerce. Public catalog and estimates need no account. Guest or OAuth credentials authorize private photos and orders. Purchases require explicit buyer approval and order terms acceptance. Order creation and payment use stable idempotency keys; lookup_order recovers ambiguous responses. get_order reads saved status; processing is not shipped. Guide: https://photoprintagent.com/docs/mcp. Narrow: /mcp-narrow. Commercial: /mcp-commercial. Isolated tests: /mcp/sandbox.",
