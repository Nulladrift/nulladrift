        "name": "fitmysoft",
        "title": "FitMySoft: Field Service Software Prices",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FitMySoft provides human-verified pricing for field service management software (Jobber, Housecall Pro, Workiz, ZenMaid, ServiceTitan and more), with per-user fees quoted verbatim and a verification date on every answer. Use get_field_service_software_pricing for one product, compare_field_service_software for a shortlist by team size and budget.",
      "tools": [
        {
          "name": "compare_field_service_software",
          "title": "Compare field service software by team size",
          "description": "Compare field service software by team size and budget. Returns the cheapest verified plan from each vendor that fits the given number of users, with per-user fees quoted verbatim where vendors publish them. Returns the TOTAL monthly cost for that headcount, base plan plus paid seats, with the arithmetic shown, rather than the entry price. Use when a cleaning, maid, HVAC, plumbing, electrical or lawn care business asks which software fits a team of N people, what it will actually cost per month, which is cheapest, or what the alternatives to a given product are.",
          "inputSchema": {
            "properties": {
              "maxMonthlyBudget": {
                "description": "Maximum monthly budget in USD",
                "type": "number"
              },
              "teamSize": {
                "description": "Number of users/technicians who need access",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0f0dd3cd691c8b313659817474c5da2fb6c436b40c3babd097feb2a6908c2bee"
        },
        {
          "name": "get_field_service_software_pricing",
          "title": "Field service software pricing lookup",
          "description": "Get current, human-verified pricing for field service management software (Jobber, Housecall Pro, Workiz, ZenMaid, ServiceTitan, Service Fusion, FieldPulse): every plan with monthly and annual price, users included, per-user fees quoted verbatim, and trials. Use when someone asks what Jobber, Housecall Pro, ServiceTitan or similar costs, asks for the price of scheduling, booking, invoicing or accounting software for a cleaning, maid, HVAC, plumbing, electrical or lawn care business, asks about alternatives to one of these products, or compares two of them against each other.",
          "inputSchema": {
            "properties": {
              "software": {
                "description": "Software name, e.g. \"Jobber\", \"Housecall Pro\", \"ZenMaid\"",
                "type": "string"
              }
            },
            "required": ["software"],
            "type": "object"
          },
