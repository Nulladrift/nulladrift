{
  "lockfileVersion": 2,
  "subjects": {
    "com.devopscollab/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://devopscollab.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "devopscollab-mcp",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "DevOpsCollab staffs senior Latin American engineers for US teams. Engagements are month-to-month with no long-term contract. Either side can end with 30 days' written notice, so transitions are planned and handovers are clean. No placement fee. Use get_company_profile for published facts, check_role_fit for stack and timeline, and submit_staffing_request to send a request a human reviews within one business day.",
      "tools": [
        {
          "name": "check_role_fit",
          "description": "How DevOpsCollab can staff a role. Optional role, stack, seniority, and engineer count. Returns supported stacks, the typical timeline, monthly commercial terms, and next steps.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "description": "How many engineers.",
                "maximum": 999,
                "minimum": 1,
                "type": "integer"
              },
              "role": {
                "description": "Role title, such as Backend Engineer.",
                "type": "string"
              },
              "seniority": {
                "description": "Seniority. Engagements are for senior engineers.",
                "type": "string"
              },
              "stack": {
                "description": "Stack names, such as .NET, full-stack, mobile, PHP, DevOps/cloud, Backend, Frontend, or AI/ML.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:31352f7814bc3306275bb93f038009c48e96d21b76381eb50d6db5e6133ed51e"
        },
        {
          "name": "get_company_profile",
          "description": "Published facts about DevOpsCollab: nearshore staffing of senior Latin American engineers for US teams, contract terms, screening, and the candidate portal.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f3d411a47385027f9e86ee2bb819d57a4bd3e3a69571c52da5063a39e5c4f23a"
        },
        {
          "name": "submit_staffing_request",
          "description": "Send a staffing request for human review within one business day. Requires name, email, position, and engineerCount. Company is optional.",
          "inputSchema": {
            "properties": {
              "company": {
                "type": "string"
              },
              "email": {
                "type": "string"
              },
              "engineerCount": {
                "maximum": 999,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "type": "string"
              },
              "position": {
                "type": "string"
              }
            },
            "required": ["email", "engineerCount", "name", "position"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6357706041dc696cab8226c2f995e8babfd5033a8c4263bb7e9f6fcdebc742a6"
        }
      ],
      "digest": "sha256:a85f3fa18dc27aaef25d1663d4455628b8a3acc7b2bb24da0ce394362436d155"
    }
  }
