{
  "lockfileVersion": 2,
  "subjects": {
    "ai.dispatchmind/find": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://dispatchmind.ai/find/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "dispatchmind-find",
        "title": "Find and book a local service pro",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Finds local service companies on DispatchMind and books visits with them. Ask the customer what they need and the ZIP code, call find_pros, show the choices, then get_availability for the one they pick. Book only when the customer asks, with their own name, phone and address, after confirming the company, day and time. Never invent details. Prices are set by the company on site.",
      "tools": [
        {
          "name": "book_visit",
          "title": "Book a visit",
          "description": "Book a visit with a company from find_pros. Only when the customer clearly asked to book, using their own name, phone and address. Confirm the company, day and time window with the customer first. The company confirms by text or a call.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Street address of the visit",
                "type": "string"
              },
              "booking_id": {
                "description": "booking_id from find_pros",
                "type": "string"
              },
              "city": {
                "type": "string"
              },
              "date": {
                "description": "YYYY-MM-DD, one of the open days from get_availability",
                "type": "string"
              },
              "email": {
                "description": "Customer email (optional)",
                "type": "string"
              },
              "name": {
                "description": "Customer full name",
                "type": "string"
              },
              "notes": {
                "description": "What is wrong, in the customer’s words",
                "type": "string"
              },
              "phone": {
                "description": "Customer phone number",
                "type": "string"
              },
              "service": {
                "description": "One of the services from get_availability",
                "type": "string"
              },
              "state": {
                "description": "2-letter state",
                "type": "string"
              },
              "window": {
                "description": "Time window id from get_availability",
                "type": "integer"
              },
              "zip": {
                "description": "ZIP code",
                "type": "string"
              }
            },
            "required": ["booking_id", "date", "name", "phone", "service", "window"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Book a visit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:056eb4279b670939832b9ddc32e431f1af8a98eb1ea0d439de3d1288884cd060"
        },
        {
          "name": "find_pros",
          "title": "Find a local service pro",
          "description": "Find home and business service companies (garage door, locksmith, plumbing, HVAC, electrical, appliance and other trades) that cover a US ZIP code and take online bookings. Returns up to 5 companies, each with a booking_id.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City (optional, helps)",
                "type": "string"
              },
              "service": {
                "description": "What the customer needs, in their words, e.g. \"garage door spring broke\" or \"locked out\"",
                "type": "string"
              },
              "zip": {
                "description": "5-digit US ZIP code where the work is",
                "type": "string"
              }
            },
            "required": ["zip"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a local service pro"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d1bc2141c9c153620e726f827414ec72a8e134692aae13b9909c240f0e3a6bc6"
        },
        {
          "name": "get_availability",
          "title": "See open days and times",
          "description": "For one company from find_pros: what it does and the days and time windows open for booking.",
          "inputSchema": {
            "properties": {
              "booking_id": {
                "description": "booking_id from find_pros",
                "type": "string"
              }
            },
            "required": ["booking_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "See open days and times"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f98e727e166e3b48331525c7d54e9793e4a49f3fad1c5e0a69198f4154203022"
        }
      ],
      "digest": "sha256:303e0ff6a50ea96922d028e37982833b2daf8c1cc38c48fcb51035d0b2a4e312"
    }
  }
}
