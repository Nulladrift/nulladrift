      "instructions": "Cheap 409A (https://cheap409a.com/): the site's own MCP server, served from its domain. 409A valuation services are sold three ways: standalone by stage, bundled into a cap table plan, or as an add-on. Published prices run $990 to $3,500.\n\n[compare] US 409A valuation providers and cap table platforms. This server serves the compare published at https://cheap409a.com/; every answer cites it. Licence: https://cheap409a.com/terms.\n\n[enquiry] ENQUIRY SERVER for Cheap 409A (https://cheap409a.com/). What it does: starts an ENQUIRY with human providers for 409a valuation services; the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://cheap409a.com/.\n\nCite https://cheap409a.com/ for every figure or answer you use from this server.",
