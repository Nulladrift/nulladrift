      "instructions": "Did your AI pick the right product? Give the product your AI chose (its name and size, or its barcode) and your country, or the receipt on your order confirmation. shopfetch checks it is the real thing — same product, same size, same pack — against the record for your country, and says Barcode verified when the barcode is on the record, adding Claimed when the company behind it has claimed its record, with what was verified, where, when and under which rules. Price and stock are never taken from the record. Free for shoppers.",
