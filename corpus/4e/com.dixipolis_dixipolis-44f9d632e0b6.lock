      "serverInfo": {
        "name": "dixipolis",
        "title": "Dixipolis",
        "version": "1.0.0",
        "websiteUrl": "https://dixipolis.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Dixipolis transcrit et indexe ce que disent les personnalités politiques françaises dans les médias (TV, radio, YouTube), et donne accès aux textes officiels. rechercher_citations couvre les médias, rechercher_hemicycle l'Assemblée (législature en cours, filtres groupe et type de séance), rechercher_sources_officielles l'Assemblée depuis 2017, le Sénat, le Parlement européen, les questions écrites et les discours publics, fiche_personnalite les personnalités. Chaque résultat donne les propos mot pour mot, leur date et leur lien source (vidéo horodatée ou compte rendu officiel). Les transcriptions des médias sont automatiques ; contexte_citation donne le passage complet.",
      "tools": [
        {
          "name": "contexte_citation",
          "title": "Contexte d'une citation",
          "description": "Donne le passage complet autour d'une citation trouvée par rechercher_citations (tour de parole entier, intervention précédente et suivante), utile pour vérifier le sens exact d'un extrait court.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "segment_id": {
                "description": "Identifiant `segment_id` d'une citation",
                "type": "integer"
              }
            },
            "required": ["segment_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Contexte d'une citation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a3800c0d333e453f3051b0833476e3cf95115eea5c4a766f6b4a3e47247c2fb8"
        },
        {
          "name": "fiche_personnalite",
          "title": "Fiche d'une personnalité",
          "description": "Fiche d'une personnalité politique française suivie par Dixipolis : parti, fonctions, temps de parole dans les médias, thèmes les plus abordés, dernières vidéos, lien vers sa fiche.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "nom": {
                "description": "Nom de la personnalité (ex. « Marine Le Pen »)",
                "type": "string"
              }
            },
            "required": ["nom"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fiche d'une personnalité"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e4209656b2515b401df35ce953f23523e4ecc64bdba3952fbc475855a8499fe8"
        },
        {
          "name": "rechercher_citations",
          "title": "Rechercher des citations (médias)",
          "description": "Cherche ce que les personnalités politiques françaises ont dit dans les médias (TV, radio, YouTube : interviews, débats, discours), dans les transcriptions de Dixipolis. Renvoie des citations exactes avec l'orateur, son parti, la date, l'émission et un lien vidéo horodaté. Pour « qu'a dit X sur Y ? », le sujet va dans `requete` et la personne dans `personnalite`. La date est celle de publication de la vidéo (une archive peut être republiée plus tard).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "au": {
                "description": "Date de fin, AAAA-MM-JJ (facultatif)",
                "type": "string"
              },
              "du": {
                "description": "Date de début, AAAA-MM-JJ (facultatif)",
                "type": "string"
              },
              "mode": {
                "description": "« sens » : par le sens (défaut pour une phrase) ; « mots » : les mots exacts (défaut pour 1 à 3 mots)",
                "enum": ["sens", "mots"],
                "type": "string"
              },
              "nombre": {
                "description": "Nombre de citations (défaut 8)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "personnalite": {
                "description": "Nom de la personnalité (ex. « Jordan Bardella »), facultatif",
                "type": "string"
              },
              "requete": {
                "description": "Sujet ou phrase cherchée, en français (ex. « dette publique »)",
                "type": "string"
              }
            },
            "required": ["requete"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Rechercher des citations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4463f927bae78ecef16e12e4da15df82f95e6dee7b22da92814eebad600e3df9"
        },
        {
          "name": "rechercher_hemicycle",
          "title": "Rechercher dans l'hémicycle",
          "description": "Cherche dans les interventions en séance publique à l'Assemblée nationale (comptes rendus officiels) : députés et membres du gouvernement. Recherche par mots (tous les mots, dans n'importe quel ordre). Renvoie la date, l'orateur, son groupe, le sujet de la séance, le texte et le lien vers le compte rendu.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "au": {
                "description": "Date de fin, AAAA-MM-JJ (facultatif)",
                "type": "string"
              },
              "du": {
                "description": "Date de début, AAAA-MM-JJ (facultatif)",
                "type": "string"
              },
              "groupe": {
                "description": "Sigle du groupe (ex. RN, LFI-NFP, EPR, SOC), facultatif",
                "type": "string"
              },
              "orateur": {
                "description": "Nom de l'orateur (contient), facultatif",
                "type": "string"
              },
              "page": {
                "description": "Page de résultats (20 par page)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "requete": {
                "description": "Mots cherchés (ex. « retraites 64 ans »)",
                "type": "string"
              },
              "tri": {
                "description": "Ordre (défaut : plus récent d'abord)",
                "enum": ["recent", "ancien"],
                "type": "string"
              },
              "type": {
                "description": "qag : questions au gouvernement ; qosd : questions orales sans débat ; textes : examen des textes",
                "enum": ["qag", "qosd", "textes"],
                "type": "string"
              }
            },
            "required": ["requete"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Rechercher dans l'hémicycle"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5fde67091017bf7423d8d5e34cc45c3989000b0c142374a32fae2fb0517f2ae2"
        },
        {
          "name": "rechercher_sources_officielles",
          "title": "Rechercher dans les sources officielles",
          "description": "Cherche dans les textes officiels, par mots-clés : débats de l'Assemblée nationale (depuis 2017) et du Sénat (comptes rendus de séance), débats du Parlement européen (depuis 2021, interventions en français), questions écrites des députés et des sénateurs avec la réponse du gouvernement, discours publics (Vie-publique.fr / DILA, depuis 2006 : déclarations, interviews, conférences de presse). Choisir les bases utiles dans `bases` (toutes par défaut). Pour « qu'a dit X sur Y ? », le sujet va dans `requete` et le nom dans `auteur` (une personne, pas « le gouvernement » ni un groupe). Renvoie le texte exact, l'orateur, la date et le lien vers la source officielle.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "auteur": {
                "description": "Nom de la personne qui parle ou qui pose la question (ex. « Gérard Larcher »), facultatif",
                "type": "string"
              },
              "bases": {
                "description": "assemblee : séances de l'Assemblée ; senat : séances du Sénat ; europarl : Parlement européen ; questions_ecrites : questions écrites et réponses du gouvernement ; discours : discours publics. Défaut : toutes",
                "items": {
                  "enum": ["assemblee", "senat", "europarl", "questions_ecrites", "discours"],
                  "type": "string"
                },
                "type": "array"
              },
              "nombre": {
                "description": "Passages par base (défaut 5)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "requete": {
                "description": "Mots du sujet, en français (ex. « loup élevage »)",
                "type": "string"
              }
            },
            "required": ["requete"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Rechercher dans les sources officielles"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4926b46839fcb1d071b6ebedc238ba78abae3295a6267510b70a4ebc5c084751"
        }
      ],
      "digest": "sha256:6bfd885b0cf4550d64d0909f3e51fcdb81096f3adedc2c64968d3d620cf336fd"
    }
  }
