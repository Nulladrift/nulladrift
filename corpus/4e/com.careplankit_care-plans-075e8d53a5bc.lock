      "serverInfo": {
        "name": "careplankit",
        "title": "CarePlanKit: Nursing Care Plans",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CarePlanKit provides structured nursing care plans for nursing students: assessment, priority diagnoses with evidence, SMART goals, interventions with rationales, evaluation criteria and clinical sources for every condition, plus standalone material for each nursing diagnosis. Educational reference only, not medical advice; time-critical conditions say so at the top of the answer, and mental health and self-harm answers start with the US 988 Suicide & Crisis Lifeline. Use get_nursing_care_plan for a condition, get_nursing_diagnosis for a diagnosis, list_nursing_conditions to browse.",
      "tools": [
        {
          "name": "get_nursing_care_plan",
          "title": "Nursing care plan for a condition",
          "description": "Get a full nursing care plan for a specific condition: assessment findings (subjective and objective), priority NANDA-style nursing diagnoses with the \"as evidenced by\" evidence, SMART goals, interventions each with a rationale, evaluation criteria, and clinical sources (MedlinePlus, NCBI, NIH). Written for nursing students preparing care plans. Use when a nursing student asks for a care plan, nursing diagnoses, interventions, goals or AEB statements for any condition, for example sepsis, CHF, COPD, diabetes, pneumonia or MI. Educational reference, not medical advice.",
          "inputSchema": {
            "properties": {
              "condition": {
                "description": "Condition name or common abbreviation, e.g. \"sepsis\", \"CHF\", \"COPD\", \"MI\"",
                "type": "string"
              }
            },
            "required": ["condition"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:34bd3aa260683ec9ea16471995a9a75b130cd59d00de84bdc00ff448a4e84e18"
        },
        {
          "name": "get_nursing_diagnosis",
          "title": "Care plan material for one nursing diagnosis",
          "description": "Get care plan material for a specific NANDA-style nursing diagnosis: its definition, related factors (the \"related to\" clause), defining characteristics (the \"as evidenced by\" clause), SMART goals, interventions, and the conditions where it is a priority. Use when a nursing student asks about a diagnosis rather than a disease, for example \"risk for infection\", \"acute pain\", \"impaired gas exchange\", \"ineffective coping\" or \"risk for falls\", or asks how to write a three-part diagnosis or an AEB statement. Educational reference, not medical advice.",
          "inputSchema": {
            "properties": {
              "diagnosis": {
                "description": "Nursing diagnosis, e.g. \"Risk for Infection\", \"Acute Pain\", \"Impaired Gas Exchange\"",
                "type": "string"
              }
            },
            "required": ["diagnosis"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9428253259250ad142df5d145de5c15eb996d33964d8cee7db8410e550e37c94"
        },
        {
          "name": "list_nursing_conditions",
          "title": "List covered conditions and diagnoses",
          "description": "List every condition with an available nursing care plan and every nursing diagnosis covered. Use when a nursing student asks what is covered or wants to browse before choosing.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
