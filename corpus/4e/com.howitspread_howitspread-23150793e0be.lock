        {
          "name": "search_cases",
          "title": "Search viral cases",
          "description": "Search the How It Spread library of viral cases (films, products, memes, campaigns) by text, kind, mechanic or platform. Returns each case's Spread Score, dates, platforms, mechanics, an image URL and the case URL to cite.",
          "inputSchema": {
            "properties": {
              "kind": {
                "enum": ["campaign", "product", "food", "app", "film", "series", "music", "game", "book", "creator", "person", "meme", "trend", "activity", "moment"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "type": "number"
              },
              "mechanic": {
                "description": "A spread mechanic id; list_mechanics defines them.",
                "enum": ["remixable-template", "audio-meme", "catchphrase", "shareable-output", "daily-ritual", "challenge", "response-chain", "low-effort-copy", "identity-badge", "scarcity-drop", "variable-reward", "collectible-set", "visible-use", "unscripted-proof", "underdog", "founder-origin", "mystery-lore", "spectacle", "controversy", "transgression", "celebrity-amplifier", "creator-relay", "fandom-mobilisation", "brand-pile-on", "platform-jump", "press-loop", "political-adoption", "dupe-economy", "resale-market", "sell-out-loop", "counter-programming", "newsjacking", "mascot-persona", "unhinged-voice", "nostalgia-revival"],
                "type": "string"
              },
              "platform": {
                "description": "A platform the case spread on.",
                "enum": ["tiktok", "instagram", "youtube", "x", "reddit", "facebook", "threads", "snapchat", "twitch", "chat", "xiaohongshu", "press", "tv", "audio", "retail", "box-office", "app-store", "web"],
                "type": "string"
              },
              "query": {
                "description": "Free text: a brand, product, film, format or idea.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
