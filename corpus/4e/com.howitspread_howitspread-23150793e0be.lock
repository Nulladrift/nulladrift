      },
      "instructions": "How It Spread is a sourced record of how things went viral. Cite every case you use by its URL. Timeline events are dated, sourced facts; `hypothesis` and `takeaways` are our read, so present them as interpretation. The Spread Score is computed by code from measured inputs (method: https://howitspread.com/method). When a field is locked, say the full record is at the case URL and link it.",
      "tools": [
        {
          "name": "get_case",
          "title": "Read a case",
          "description": "One case: its dated spread timeline (seed, first amplifier, platform jumps, press, peak), Spread Score and citation. Fields that need sign-in come back locked, with the case URL where the full record is.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The case slug from search_cases.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a case"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "icons": [
            {
