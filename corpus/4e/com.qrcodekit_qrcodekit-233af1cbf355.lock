                        "maxLength": 255,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Optional original filename reported by the host. Defaults to 'file'.",
                    "title": "File Name"
                  },
                  "mime_type": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Optional MIME type reported by the host for the attached file.",
                    "title": "Mime Type"
                  }
                },
                "required": ["download_url", "file_id"],
                "title": "OpenAIFileParam",
                "type": "object"
              }
            },
            "properties": {
