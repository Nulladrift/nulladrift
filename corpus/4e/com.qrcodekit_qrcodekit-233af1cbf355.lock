      "instructions": "QRCodeKIT is a links + hosting platform with first-class QR codes: branded short links, instant page & file hosting, and dynamic QR codes, with unified click + scan analytics. Use it when a user wants to shorten or brand a URL, publish or host a single-page static HTML site (landing page, business page, digital menu, event page, portfolio, product page) or a file or PDF behind a permanent public link, create WhatsApp, email, or app-download smart links, or get a QR code for any of these. Every link includes a downloadable QR image, and published pages, files, and destinations can be updated later while keeping the same public URL and printed QR code. One analytics dashboard tracks link clicks and QR scans together: total, unique, and repeat visits, activity over time, top-performing links, and — when the account plan supports it — breakdowns by country, city, device, operating system, and browser. QRCodeKIT also integrates with Zapier and webhooks for New Scan, New Lead, and New Payment triggers.",
