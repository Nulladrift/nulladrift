        {
          "name": "get_link_stats",
          "title": "Link & QR Analytics",
          "description": "Retrieve analytics for the whole QRCodeKIT account or for one link. Reports total, unique, and repeat visits, unique-visitor ratio, activity over time, and — when the account plan supports advanced analytics — breakdowns by country, city, device, operating system, and browser. Account-wide results also include the number of links and the top links ranked by lifetime visits. Use this when the user asks about QR scans, short-link clicks, campaign performance, audience location, devices, trends, comparisons, or top-performing links. Every visit to the short URL is counted, so link clicks and QR scans are combined: one campaign can live in a printed QR, an Instagram bio, and an email and report in one place. Select a link by qr_id, slug, or part of its title via `qr`; omit it for the whole account. Defaults to the last 30 days; the interval can be auto, hourly, daily, weekly, or monthly. The structured result contains the full tables for answering questions about the data.",
          "inputSchema": {
            "properties": {
              "end_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Last day of the stats window (YYYY-MM-DD). Defaults to today.",
                "title": "End Date"
              },
              "interval": {
                "default": "auto",
                "description": "Time-series bucket size: 1h, 1d, 1w, or 1M. Use 'auto' (default) to pick a sensible bucket from the range length.",
                "enum": ["auto", "1h", "1d", "1w", "1M"],
                "title": "Interval",
                "type": "string"
              },
              "qr": {
                "anyOf": [
                  {
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional link to deep-dive into: the QRCodeKIT qr_id, the short-link slug, or (part of) the link title. Omit for account-wide stats.",
                "title": "Qr"
              },
              "start_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "First day of the stats window (YYYY-MM-DD). Defaults to 29 days before end_date.",
                "title": "Start Date"
              }
            },
            "title": "get_link_statsArguments",
            "type": "object"
