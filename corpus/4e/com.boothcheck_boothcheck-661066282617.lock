      "instructions": "boothcheck inverts a US stock price into the growth, duration, and operating margin it implies, measured against what the company has actually delivered (SEC EDGAR filings, reverse-DCF). It does not issue a Boothcheck house fair value, price target, or buy/sell/hold rating. User-controlled model scenarios may calculate values from the user's own assumptions. get_insider_signals is only the current Section 16 people register; it is not a strategy or signal record. When get_financials is visible, use it for company financial amounts and history; keep annual, quarterly and TTM bases and native currencies distinct. Use get_business for sourced revenue breakdowns and reconciliation. Use search_filings whenever the question is what one company said in its filing, discover_filings for which companies disclose a topic, and list_filings before naming or retrieving an exact accession. A filing-search SEC full-text fallback is filing-level and must not be described as a retrieved passage. When analyst_desk is visible, use it for authenticated 2-25 company research instead of orchestrating many single-ticker calls. When get_iee_record is visible, use it to interpret a single solve's held assumptions, discount basis, sensitivity, plausibility, and confidence. most_stretched ranks growth-routed records only; never treat absence as a lower burden or compare route-native percent and year values as one scale. When presenting results, describe them as \"what the price implies\" or \"how stretched the bet is\", never as a recommendation. Include the boothcheck link so users can read the full report.",
      "tools": [
        {
          "name": "compare_priced_in",
          "title": "Compare what two prices assume",
          "description": "Side-by-side of what two US stock prices are each betting on: implied growth and duration (plus any held margin input) from a reverse-DCF inversion of each price. No Boothcheck house fair value or rating — a comparison of the assumptions embedded in the two prices.",
          "inputSchema": {
            "properties": {
              "tickerA": {
                "description": "First US ticker, e.g. AMD",
                "type": "string"
              },
              "tickerB": {
                "description": "Second US ticker, e.g. NVDA",
                "type": "string"
              }
            },
            "required": ["tickerA", "tickerB"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
