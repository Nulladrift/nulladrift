        {
          "name": "whats_priced_in",
          "title": "What's priced into a stock",
          "description": "Invert a US stock's current price into the bet it implies: the operating-income growth rate, how many years it must be sustained, and (where the route holds one as an input) the terminal operating margin assumption, versus what the company has actually delivered (from SEC EDGAR filings, reverse-DCF). boothcheck does not return a Boothcheck house fair value, price target, or buy/sell rating — it shows what the price assumes so the user can judge the bet. Covers about 2,000 US tickers.",
