{
  "lockfileVersion": 2,
  "subjects": {
    "com.nythosx.tools/agent-tools": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://tools.nythosx.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "nythosx-agent-tools",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Pay-per-call tools for autonomous agents via x402: get_gas_price (current gas and fee tiers plus the USD cost of a transfer, USDC transfer or swap), compare_gas_costs (cheapest chain for a transaction right now), estimate_custom_tx_cost (USD cost of your own gas limit or compute-unit budget, for anything get_gas_price's 3 canned tx types don't cover), get_native_token_price (just the asset price, no gas data), read_url_as_markdown (web page to clean Markdown), check_url_status (cheap pre-check before paying to read a URL). Free: list_chains. Paid calls carry payment in _meta[\"x402/payment\"]. Failed calls are not charged.",
      "tools": [
        {
          "name": "check_url_status",
          "description": "Check if a URL is reachable before paying to read it. HEAD request following up to five redirects: status code, final URL, content-type, content-length and last-modified — no page body fetched or charged for content. Use before read_url_as_markdown ($0.003) to confirm a URL resolves and is HTML before paying the bigger fee for extraction. Doesn't check robots.txt (that's enforced on the actual read). Some servers reject HEAD (405/403) even though GET works, so a non-2xx here doesn't guarantee read_url_as_markdown will also fail. Costs $0.001 USDC per call (x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public http(s) URL to check",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c7bdfc88379a4763a18b9183ccda7b3fbfa77b1e543492bb7f22b92309fdd4b5"
        },
        {
          "name": "compare_gas_costs",
          "description": "Where is it cheapest to send this transaction right now?. Ranks all 6 supported chains (Base, Ethereum, Arbitrum, Optimism, Polygon, Solana) by USD cost for a transaction type (transfer, USDC transfer or swap) at a speed tier (slow/standard/fast). Returns the ranking, the cheapest chain, and any chains queried in parallel that didn't respond (in failed[]). Costs $0.005 USDC per call (x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "tier": {
                "default": "standard",
                "description": "Speed tier",
                "enum": ["slow", "standard", "fast"],
                "type": "string"
              },
              "tx": {
                "default": "transfer",
                "description": "Transaction type",
                "enum": ["transfer", "usdc_transfer", "swap"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:cc1fc0d7c0719469cf8ff97542b7ba9425c6a56bbc2882badea4a60f08dd933b"
        },
        {
          "name": "estimate_custom_tx_cost",
          "description": "USD cost of a custom gas limit or compute-unit budget. Prices an arbitrary transaction, not just the 3 canned types get_gas_price/compare_gas_costs cover: pass your own gas limit (EVM chains) or compute-unit budget (Solana) and get its USD cost at a speed tier. Use this for a contract call, NFT mint or any tx whose gas usage you already know or estimated via eth_estimateGas/simulation — get_gas_price's 3 canned tx types won't fit it. Typical EVM units: 21,000 plain transfer, 50,000-65,000 ERC20 transfer, 100,000-250,000 typical contract call/NFT mint, 150,000-400,000 DEX swap; typical Solana compute units: 200,000 simple transfer, up to 1,400,000 (the per-tx cap) for a complex instruction. Excludes OP-stack L1 data fee (depends on calldata size, not gas limit) — add a few % for Base/Optimism to be safe. Costs $0.002 USDC per call (x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "Chain to query",
                "enum": ["base", "ethereum", "arbitrum", "optimism", "polygon", "solana"],
                "type": "string"
              },
              "tier": {
                "default": "standard",
                "description": "Speed tier",
                "enum": ["slow", "standard", "fast"],
                "type": "string"
              },
              "units": {
                "description": "Gas limit (EVM) or compute units (Solana)",
                "exclusiveMinimum": 0,
                "type": "integer"
              }
            },
            "required": ["chain", "units"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:905de6d1357ce7a31530065c9c850abbb45cdd6ab190c8e7d0cdd51a93e2704b"
        },
        {
          "name": "get_gas_price",
          "description": "Current gas/fee tiers and USD costs for one chain. Slow/standard/fast gas tiers and USD cost of a transfer, USDC transfer and swap, for Base, Ethereum, Arbitrum, Optimism, Polygon or Solana. Updated every 15s. Solana is compute-unit pricing, not gwei-style gas; the other 5 are EVM. Use for one chain's prices; use compare_gas_costs to rank all 6, or estimate_custom_tx_cost for a gas limit/compute budget outside the 3 canned tx types here. x402: 402 first, retry with PAYMENT-SIGNATURE (MCP: _meta[\"x402/payment\"]) — unpaid/failed calls are never charged. Costs $0.002 USDC per call (x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "Chain to query",
                "enum": ["base", "ethereum", "arbitrum", "optimism", "polygon", "solana"],
                "type": "string"
              }
            },
            "required": ["chain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:06567c8145664ca5062b34cd90c1fd4fe057ca30e0e7726c4d87a53dbf498d0b"
        },
        {
          "name": "get_native_token_price",
          "description": "USD price of a chain's native token, no gas data. Just the native-token USD price (ETH, POL or SOL), sourced from MEXC/Gate.io/Coinbase with the same price feed get_gas_price uses. Use this when you only need the asset price, not fees — get_gas_price and compare_gas_costs already return nativeUsd alongside gas data, so call this instead only to skip the gas lookup (e.g. valuing a wallet balance, not estimating a transaction). Costs $0.001 USDC per call (x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "Chain to query",
                "enum": ["base", "ethereum", "arbitrum", "optimism", "polygon", "solana"],
                "type": "string"
              }
            },
            "required": ["chain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d416473e1dc6b5c18724d2a50ed20c16b5a2aeeea9d63041a812591a32ff03a9"
        },
        {
          "name": "list_chains",
          "description": "List supported chains (Base, Ethereum, Arbitrum, Optimism, Polygon, Solana) and the gas-unit constants used by the paid tools (free). Always returns the full, unfiltered list of all 6 chains (no input/filter params). gasUnits.{transfer|usdc_transfer|swap} are plain integers: the gas units a typical transaction of that type costs on an EVM chain (evm) or in Solana compute units (svm) — multiply by the chain's current fee from get_gas_price to estimate USD cost yourself, or just call get_gas_price/compare_gas_costs which already does this.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:014945317f4ab5df2f1ebc7fe8ad92d29c44d69aab7e54395b91c0aa5ea8196f"
        },
        {
          "name": "read_url_as_markdown",
          "description": "Convert any web page into clean, readable Markdown. Fetches a public web page and returns clean Markdown: title, byline, site name, excerpt, word count and article body. Respects robots.txt, blocks private hosts, follows up to five redirects, caps the page at 3 MB. links=true adds outbound links. Not charged on failure: 403 if robots.txt disallows the path, 415 for non-HTML, 422 if no article text extracts, 502 on upstream error. Costs $0.003 USDC per call (x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "links": {
                "default": false,
                "description": "Include outbound links (max 200)",
                "type": "boolean"
              },
              "url": {
                "description": "Public http(s) URL to read",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8dc108d954cfd7b6feddf6ef9f0052087a244e2aba4429ce8496035eea44ad49"
        }
      ],
      "digest": "sha256:16231024cca849503d49c8631d0ba48ea88e8ccf2aa861bf0f5a4ea2723905f4"
    }
  }
}
