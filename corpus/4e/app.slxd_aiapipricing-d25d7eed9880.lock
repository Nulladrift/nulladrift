{
  "lockfileVersion": 2,
  "subjects": {
    "app.slxd/aiapipricing": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://aiapipricing.slxd.app/mcp/aiapipricing"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "AI API Pricing",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "compare_models",
          "title": "Compare models",
          "description": "Returns the current prices of several models side by side. Amounts in credits are never converted to money, so a credit-billed model is not comparable to a token-billed one. Two dimensions can share a label, so the ones that would collide carry their qualifiers, e.g. 'Web search (context size: high)'.",
          "inputSchema": {
            "properties": {
              "models": {
                "items": {
                  "description": "Model id as `provider/slug`, e.g. `anthropic/claude-sonnet-4-5`.",
                  "type": "string"
                },
                "maxItems": 8,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["models"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a73041f75c98761259d19c3b0916ace42abc14fede7202ddf69f1c2d0535e12d"
        },
        {
          "name": "data_sources",
          "title": "Data sources and their health",
          "description": "Explains where the prices come from: which sources are consulted, their weight and licence, when each last succeeded, and whether any is currently failing. Use this to judge how much to trust a price.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0b3af0beded3c313912537fb6a568debc8cf2186aa630606dfd5b528c4893138"
        },
        {
          "name": "find_tools",
          "title": "Find tools",
          "description": "Searches the full catalogue of available tools by keyword and returns the matching tool names with a short description. Use it when no directly-listed tool fits the task — many tools are available but not listed. Then call tool_schema for the one you picked, and run_tool to execute it.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Space-separated keywords, e.g. 'invoice pdf export'. Matched against tool names and descriptions; any term may match.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:20104eb86272a441bc30b29b18de99997e811e278eeebe198cacef596d9b3cd0"
        },
        {
          "name": "get_model_price",
          "title": "Get a model's prices",
          "description": "Returns every current price for one model — input, output, cached reads, batch and priority tiers, context brackets — with the confidence level and which sources agree. By default these are the maker's own prices; pass `channel` to get what a reseller charges for the same model instead. Two dimensions can share a label, so the ones that would collide carry their qualifiers, e.g. 'Web search (context size: high)'.",
          "inputSchema": {
            "properties": {
              "channel": {
                "description": "Sales channel to price. Omit for the maker's own price. `direct` is the maker, the rest resell the same model at their own rate; a channel that does not sell this model returns the model with no prices.",
                "enum": ["direct", "vertex", "bedrock", "azure", "sagemaker", "databricks", "snowflake", "watsonx", "cloudflare", "fireworks", "alibaba", "openrouter", "github_copilot", "coding_plan", "token_plan", "other"],
                "type": "string"
              },
              "model": {
                "description": "Model id as `provider/slug`, e.g. `anthropic/claude-sonnet-4-5`.",
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8de906d0b67041f48c0725f241daa01329f745f53a0133d73cac88477acaaa40"
        },
        {
          "name": "list_providers",
          "title": "List providers",
          "description": "Lists every provider in the catalogue and how many models each has. These are the houses that MAKE the models: a reseller (Vertex, Bedrock, Azure, OpenRouter, a subscription plan) is a sales channel, not a provider — ask `get_model_price` with a `channel` for what one of those charges.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b6e52233546dcb007c4d1f1073891c66773c5697e1c58507cf13dd91e79a675b"
        },
        {
          "name": "price_history",
          "title": "Price history",
          "description": "Returns a model's price over time. Each point is [date, amount] with the date as YYYY-MM-DD. The series holds only the points where the price CHANGED — prices are step functions, so a stable model is one point, not one per day; when a price changed twice on one day, both points are returned with the same date, in order. One series per price dimension: two dimensions can share a label, so the ones that would collide carry their qualifiers, e.g. 'Web search (context size: high)'.",
          "inputSchema": {
            "properties": {
              "from": {
                "description": "ISO date, inclusive.",
                "type": "string"
              },
              "model": {
                "description": "Model id as `provider/slug`, e.g. `anthropic/claude-sonnet-4-5`.",
                "type": "string"
              },
              "to": {
                "description": "ISO date, inclusive.",
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:069919513a64dfb8756c82d31027d05d3a8e4c4e20c1dc5e58a962cc5deedd83"
        },
        {
          "name": "recent_changes",
          "title": "Recent price changes",
          "description": "Lists recent price increases, decreases, additions and removals across the catalogue, newest first.",
          "inputSchema": {
            "properties": {
              "days": {
                "default": 30,
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "default": 50,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:52af45bba0ab54cb16cec8a72d7c79b7afd51921f1b016d61cf82af425bc117d"
        },
        {
          "name": "run_tool",
          "title": "Run a tool",
          "description": "Executes a tool by name with the given arguments. Use it for tools that are not directly listed — look them up with find_tools and check their arguments with tool_schema first. Prefer a directly-listed tool whenever one fits. If the action is destructive, ask the user to confirm before calling it.",
          "inputSchema": {
            "properties": {
              "arguments": {
                "description": "Arguments object matching the tool's schema.",
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "name": {
                "description": "Exact tool name, as returned by find_tools.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5eb737a91c973f97277788e59dda1221cb76973a38f30162dc4faf69e5039089"
        },
        {
          "name": "search_models",
          "title": "Search models",
          "description": "Searches the catalogue of AI models and returns their current prices, with a confidence level and the sources backing each price.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "provider": {
                "description": "Restrict to one provider slug, e.g. `openai`.",
                "type": "string"
              },
              "query": {
                "description": "Free text matched against name and id.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4465dc2d42d43502775b5c8bc4143df4bbbdffff31a82d939f73448ec013bcd1"
        },
        {
          "name": "tool_schema",
          "title": "Get a tool's schema",
          "description": "Returns the full input schema of a single tool, including which arguments are required. Call it after find_tools and before run_tool.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Exact tool name, as returned by find_tools.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7511cf5374ba4717a849d50c5d31c6b651dc1710ba55c64021ce6316736061d3"
        }
      ],
      "digest": "sha256:7934305005b6b32f89f42c3453d5ee55d580fe3670e4d1d1f288147d0168f2ad"
    }
  }
}
