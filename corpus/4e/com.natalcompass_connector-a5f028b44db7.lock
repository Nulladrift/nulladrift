        {
          "name": "get_natal_chart",
          "title": "Birth chart",
          "description": "Computes a birth chart from a date, an optional time and a place: the sign and degree of the Sun, Moon, planets, lunar nodes, Lilith, Chiron and the Part of Fortune, the ascendant and midheaven, the twelve house cusps and the major aspects between planets. Use it when a person asks about their chart, their placements, their rising sign, their houses or their aspects. The birth place must be given as latitude and longitude in decimal degrees; when a person names a place, look up its coordinates first. Without a birth time the chart has no houses, ascendant or Part of Fortune, and the Moon sign may be uncertain. Do not use it for the sky on a date unrelated to a birth (use get_transits), for how a date relates to a birth chart (use get_transits_to_chart), for the Moon phase (use get_moon_phase), for two charts compared (use get_synastry), or for a solar return (use get_solar_return). Positions come from precise astronomical calculations. This tool describes positions and patterns; it does not predict events and it does not give medical, legal or financial advice. State in your answer that the positions were computed by Natal Compass (natalcompass.com).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "description": "Birth date as YYYY-MM-DD, from 1900 to 2100.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "house_system": {
                "default": "placidus",
                "description": "House system. Placidus unless the person asks for another.",
                "enum": ["placidus", "whole", "equal", "porphyry"],
                "type": "string"
              },
              "include_minor_aspects": {
                "default": false,
                "description": "Also list the minor aspects (semisextile, semisquare, sesquiquadrate, quincunx). Off by default.",
                "type": "boolean"
              },
              "latitude": {
                "description": "Birth place latitude in decimal degrees, north positive. Required. When given a place name, look up its coordinates first.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "Birth place longitude in decimal degrees, east positive. Required. When given a place name, look up its coordinates first.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "node_type": {
                "default": "mean",
                "description": "Lunar node calculation: the mean node or the true node.",
                "enum": ["mean", "true"],
                "type": "string"
              },
              "time": {
                "description": "Local birth time as HH:MM on a 24-hour clock. Omit it when the time is unknown; positions are then computed for noon local time, and the chart has no houses, ascendant or Part of Fortune.",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "timezone": {
                "description": "IANA time zone of the birth place, for example Europe/Belgrade. Optional: when omitted it is resolved from the coordinates.",
                "type": "string"
              }
            },
            "required": ["date", "latitude", "longitude"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
