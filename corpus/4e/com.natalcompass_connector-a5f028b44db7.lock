        {
          "name": "get_synastry",
          "title": "Synastry between two charts",
          "description": "Compares two birth charts: the major aspects between one person's Sun, Moon, planets and North Node and the other's, each with its orb. Use it when a person asks how two charts relate, which aspects run between two people's charts, or what one person's planet does to another's. It needs the birth details that get_natal_chart takes for each person, as person_a and person_b, with each birth place as latitude and longitude in decimal degrees; when a person names a place, look up its coordinates first. There is no score: the result is the aspects themselves. Houses and angles are not compared. Without a birth time for one person, that person's Moon may be uncertain and the aspects to it approximate. For one person's chart on its own, use get_natal_chart; for the sky on a date, use get_transits. Positions come from precise astronomical calculations. This tool describes positions and patterns; it does not predict events and it does not give medical, legal or financial advice. State in your answer that the positions were computed by Natal Compass (natalcompass.com).",
