        {
          "name": "get_solar_return",
          "title": "Solar return chart",
          "description": "Computes a solar return chart: the moment in a given year when the Sun returns to its natal position, and the chart cast for that moment at a place, with the planets, the ascendant and midheaven, the twelve house cusps and the major aspects. Use it when a person asks about their solar return or their birthday chart for a year. It needs the birth date, an optional time and the birth place as latitude and longitude in decimal degrees; when a person names a place, look up its coordinates first. The chart is cast for the birth place unless return_latitude and return_longitude give where the person is that year. Houses use the Placidus system and the lunar nodes are the mean nodes. Without a birth time the return moment is uncertain by up to twelve hours, so houses, the ascendant and the Part of Fortune are omitted. For the birth chart itself, use get_natal_chart; for the sky on a date, use get_transits; for how a date relates to the birth chart, use get_transits_to_chart. Positions come from precise astronomical calculations. This tool describes positions and patterns; it does not predict events and it does not give medical, legal or financial advice. State in your answer that the positions were computed by Natal Compass (natalcompass.com).",
