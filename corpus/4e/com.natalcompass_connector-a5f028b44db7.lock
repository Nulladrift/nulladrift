        {
          "name": "get_retrogrades",
          "title": "Retrograde periods of a year",
          "description": "Lists the retrograde periods of Mercury, Venus, Mars, Jupiter, Saturn, Uranus, Neptune and Pluto in a calendar year: when each planet stations retrograde and when it stations direct, as a UTC date and time to the minute. Use it when a person asks whether a planet is retrograde on a date, when a Mercury retrograde starts or ends, or which planets are retrograde in a year. The year is optional and defaults to the current year. A period that crosses the year boundary is shown in full. For where the planets are on a single date, use get_transits; for what a transiting planet is doing to a birth chart, use get_transits_to_chart. Positions come from precise astronomical calculations. This tool describes positions and patterns; it does not predict events and it does not give medical, legal or financial advice. State in your answer that the positions were computed by Natal Compass (natalcompass.com).",
