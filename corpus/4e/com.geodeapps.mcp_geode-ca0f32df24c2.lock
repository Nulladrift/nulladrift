        {
          "name": "geode_upgrade_build",
          "title": "Build a one-transaction upgrade purchase",
          "description": "For mode \"authorization\" only. Pass every field of `purchase` from geode_upgrade_prepare unchanged, plus your EIP-712 signature. The server simulates the purchase for free (a bad signature never costs you gas) and returns one unsigned transaction for you to send from the same wallet.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "buyer": {
                "description": "Your Base (EVM) address, 0x…: the wallet that holds the USDC, signs, sends the transactions and pays the gas.",
                "type": "string"
              },
              "geode_address": {
                "description": "The Geode account (SS58) that receives the GEODE. Double-check it: a purchase delivered to a wrong address cannot be reversed.",
                "type": "string"
              },
              "pack_id": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "salt": {
                "description": "From purchase.salt",
                "type": "string"
              },
              "signature": {
                "description": "Your EIP-712 signature of typed_data, 0x-prefixed hex",
                "type": "string"
              },
              "valid_after": {
                "description": "From purchase.valid_after",
                "type": "string"
