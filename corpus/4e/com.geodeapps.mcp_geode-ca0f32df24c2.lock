                "description": "The Geode account (SS58) that receives the GEODE. Double-check it: a purchase delivered to a wrong address cannot be reversed.",
                "type": "string"
              },
              "mode": {
                "description": "\"approve\" (default) or \"authorization\"",
                "enum": ["approve", "authorization"],
                "type": "string"
              },
              "pack_id": {
                "description": "From geode_upgrade_packs (1 = Pebble, 2 = Diamond)",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["buyer", "geode_address", "pack_id"],
            "type": "object"
