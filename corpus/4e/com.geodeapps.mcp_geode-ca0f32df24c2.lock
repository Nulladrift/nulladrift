        {
          "name": "geode_balances_transfer",
          "title": "Send GEODE",
          "description": "Send GEODE from `signer` to another account (keep-alive transfer: your account can never be emptied below the minimum balance). Irreversible, so the first call returns a confirm_token and the real cost; call again with it to get the intent. Sign with geode-local-signer, restating the recipient and amount in `expect`, then submit with geode_submit_intent. Sending to a new address creates that account (at least 1 GEODE). Counts toward the per-transaction and rolling 24-hour caps.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "amount": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "raw": {
                        "type": "string"
                      }
                    },
                    "required": ["raw"],
                    "type": "object"
                  }
                ],
                "description": "Amount in GEODE as a decimal string (e.g. \"1.25\"), or {\"raw\": \"<planck>\"}"
              },
              "confirm_token": {
                "description": "Token from the first call",
                "type": "string"
              },
              "dest": {
                "description": "Recipient account address (SS58)",
                "type": "string"
              },
              "signer": {
                "description": "Your account address (SS58). The transaction is prepared for this account; you sign it on your own machine with geode-local-signer.",
                "type": "string"
              }
            },
            "required": ["amount", "dest", "signer"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
