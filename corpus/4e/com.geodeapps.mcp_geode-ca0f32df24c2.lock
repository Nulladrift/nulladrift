        {
          "name": "geode_surveys_make_a_new_survey_1",
          "title": "Surveys: make a new survey 1",
          "description": "Create a 1-question survey that pays each respondent `payout`. `value` must be at least payout × max_responses (the survey's budget). Writes to the chain: this prepares an unsigned transaction (an intent) for `signer`; nothing happens until you sign it with geode-local-signer and submit it with geode_submit_intent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "confirm_token": {
                "description": "Token from the first call, to confirm this irreversible action",
                "type": "string"
              },
              "max_responses": {
                "description": "Non-negative integer as a string of digits",
                "type": "string"
              },
              "payout": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "raw": {
                        "type": "string"
                      }
                    },
                    "required": ["raw"],
                    "type": "object"
                  }
                ],
                "description": "Amount in GEODE as a decimal string (e.g. \"1.25\"), or {\"raw\": \"<planck>\"}"
              },
              "public": {
                "type": "boolean"
              },
              "question_1": {
                "description": "UTF-8 text, at most 512 bytes; no control or invisible characters",
                "type": "string"
              },
              "signer": {
                "description": "Your account address (SS58). The transaction is prepared for this account; you sign it on your own machine with geode-local-signer.",
                "type": "string"
              },
              "survey_name": {
                "description": "UTF-8 text, at most 512 bytes; no control or invisible characters",
                "type": "string"
              },
              "value": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "raw": {
                        "type": "string"
                      }
                    },
                    "required": ["raw"],
                    "type": "object"
                  }
                ],
                "description": "GEODE to send with this call (explicit; never inferred)"
              }
            },
            "required": ["max_responses", "payout", "public", "question_1", "signer", "survey_name", "value"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
