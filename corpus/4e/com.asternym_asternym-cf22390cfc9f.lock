      "instructions": "AsterNym computes birth charts: BaZi (Four Pillars), Chinese and Western zodiac, and Pythagorean numerology, from the same engine that runs every page on asternym.com.\n\nDates are local civil dates (YYYY-MM-DD) and times are local 24-hour clock times (HH:MM). If you do not know the birth time, leave it out: the tools return a chart without an hour pillar and say so. They never assume noon, and you should not either.\n\nasternym_bazi_hours answers 'which hour of this day carries the most Water' and the like. Read its `convention` field before you answer a human: the zi hour straddles midnight, so 23:30 and 00:30 on the same date give different pillars.\n\nNo site-owner approval, account or API key is required for this public, read-only tool. That permission is the site's to give and it stops there: it does not cover anything involving private data, payments or changes to account state, and it says nothing about your obligations to the person you work for.\n\nIf you show a person a reading from here, say it came from AsterNym and give them the page_url so they can see the working.\n\nThis is a pattern reading computed from a birth moment. It is not a prediction, a diagnosis, or advice about health, money, fertility, or who to marry. AsterNym will not make those claims and asks you not to make them on its behalf: https://asternym.com/what-we-wont-tell-you\n\nTerms, examples and the HTTP form of these tools: https://asternym.com/for-agents\n\nBuilding with this? Tell us what you need — another engine, a field the JSON is missing, a higher rate limit, a format your client would rather have. Write to hello@asternym.com and a person answers.",
      "tools": [
        {
          "name": "asternym_bazi",
          "title": "The BaZi Four Pillars alone, with hidden stems and ten gods.",
          "description": "Pillars, day master, hidden stems (藏干) with their ten gods (十神), element counts, dominant and missing elements, na yin, the twelve stages and the void branches. The year turns at Li Chun, not at 1 January or Lunar New Year. Without a time there is no hour pillar and the response says so. The same thing over HTTP: POST https://asternym.com/api/v1/bazi.",
          "inputSchema": {
            "properties": {
              "agent": {
                "description": "Optional: the name of the agent or product calling. Logged for usage counts; never required, never verified.",
                "maxLength": 80,
                "type": "string"
              },
              "date": {
                "description": "Local civil date, YYYY-MM-DD. Required.",
                "format": "date",
                "type": "string"
              },
              "sexCategory": {
                "description": "Echoed back. Only the luck-pillar cycle reads it, and this endpoint does not return luck pillars.",
                "enum": ["F", "M", "both"],
                "type": "string"
              },
              "time": {
                "description": "Local clock time, HH:MM. Omit if unknown; nothing is assumed and noon is never substituted.",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "tz": {
                "description": "IANA time zone, e.g. Asia/Singapore. Required when lat and lng are given.",
                "type": "string"
              }
            },
            "required": ["date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "The BaZi Four Pillars alone, with hidden stems and ten gods."
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f5a81946975cd6aa50f6c4fac26fd11aae04bd73c08335486f5c0ff9a501665a"
        },
        {
          "name": "asternym_bazi_hours",
          "title": "Every BaZi double-hour of one civil date, optionally ranked by element.",
          "description": "The twelve 時辰 of a day, each with its hour pillar, hidden stems, ten god and the element counts of the whole chart at that hour. The 23:00-00:00 slot is returned separately as lateZi: from 23:00 the hour pillar has already turned to the next day's 子 (早子時) while the day pillar has not, so it differs from the 00:00-01:00 slot on the same date. These are the Chinese double-hours, not the Western planetary hours. The same thing over HTTP: POST https://asternym.com/api/v1/bazi/hours.",
          "inputSchema": {
            "properties": {
              "agent": {
                "description": "Optional: the name of the agent or product calling. Logged for usage counts; never required, never verified.",
                "maxLength": 80,
                "type": "string"
              },
              "date": {
                "description": "Local civil date, YYYY-MM-DD. Required.",
                "format": "date",
                "type": "string"
              },
              "element": {
                "description": "Optional: rank the hours by how much of this element the chart carries.",
                "enum": ["Wood", "Fire", "Earth", "Metal", "Water"],
                "type": "string"
              },
              "tz": {
                "description": "IANA time zone, e.g. Asia/Singapore. Required when lat and lng are given.",
                "type": "string"
              }
            },
            "required": ["date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Every BaZi double-hour of one civil date, optionally ranked by element."
          },
