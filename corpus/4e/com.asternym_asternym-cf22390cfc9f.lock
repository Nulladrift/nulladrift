          "digest": "sha256:a1910fb9cd7c0fc7ed3e86e2d39fadba3f7a39656dd06567117c7ebbb490607d"
        },
        {
          "name": "asternym_natal",
          "title": "The Western natal chart: planets, houses, angles, nodes and aspects.",
          "description": "Ten planets with sign, degree, whole-sign house and retrograde flag; the Ascendant, midheaven and their opposites; the twelve whole-sign houses; the mean lunar nodes; the five major aspects with orb and whether each is applying or separating; plus stelliums, retrogrades and the Moon's phase. Tropical zodiac, geocentric apparent positions, astronomy-engine. This is the one endpoint that requires lat, lng and tz: the angles and houses are a place on the Earth meeting the sky. A time is optional, and without one the angles and houses are null rather than taken from noon, and the Moon is a noon estimate the notes warn about. The same thing over HTTP: POST https://asternym.com/api/v1/natal.",
          "inputSchema": {
            "properties": {
              "agent": {
                "description": "Optional: the name of the agent or product calling. Logged for usage counts; never required, never verified.",
                "maxLength": 80,
                "type": "string"
              },
              "date": {
                "description": "Local civil date, YYYY-MM-DD. Required.",
                "format": "date",
                "type": "string"
              },
              "lat": {
                "description": "Decimal degrees.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lng": {
                "description": "Decimal degrees.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "time": {
                "description": "Local clock time, HH:MM. Omit if unknown; nothing is assumed and noon is never substituted.",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "tz": {
                "description": "IANA time zone, e.g. Asia/Singapore. Required when lat and lng are given.",
                "type": "string"
              }
            },
            "required": ["date", "lat", "lng", "tz"],
            "type": "object"
          },
