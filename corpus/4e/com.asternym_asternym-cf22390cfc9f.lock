          "description": "Pythagorean numerology: Life Path, birthday number and its components, and with a name the expression, soul urge, personality, cornerstone, capstone and hidden passion. Master numbers are kept where the position allows. The same thing over HTTP: POST https://asternym.com/api/v1/numerology.",
