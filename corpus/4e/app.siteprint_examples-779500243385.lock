            "readOnly": true
          },
          "digest": "sha256:aa3435c57f29d63750b030110608786f402989dc66bd6297e2629404c8c165bf"
        },
        {
          "name": "get_example_design",
          "title": "Get an example DESIGN.md",
          "description": "The DESIGN.md Siteprint exported from one example scan: exact colours, type, spacing, corners and layout as a design direction for new UI.",
