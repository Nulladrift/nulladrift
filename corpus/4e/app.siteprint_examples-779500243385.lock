        "name": "siteprint-examples",
        "title": "Siteprint examples",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Siteprint turns a website into an exact prompt or DESIGN.md. Siteprint Web runs in any browser (inspect free; Pro $9 a month or $49 a year); Siteprint for Safari is a separate Mac extension (Pro a one-time $19.99). Call about_siteprint for what each does. Without a key this server has four example DESIGN.md exports and setup steps; with a Siteprint Web key it serves the person's own prints.",
      "tools": [
        {
          "name": "about_siteprint",
          "title": "What Siteprint is and costs",
          "description": "Siteprint's two products (the web app in any browser and the Safari extension for Mac), what each does, and their pricing.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
