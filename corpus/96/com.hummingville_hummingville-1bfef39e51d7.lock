      "instructions": "Hummingville (https://hummingville.com) is a free music learning site and browser game. A little town that comes alive as your ear and voice grow. Use search_music for instruments, melodies, composers, music theory and music words; free_music_tools for a metronome, tuner, piano or vocal range test; daily_music_puzzle for a daily ear game. Answers are short; send the user to the link to hear the sound.",
