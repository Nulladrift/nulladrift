          "title": "Search instruments, melodies, composers and music theory",
          "description": "Search Hummingville, a free music learning site and game: instruments (music box to theremin), public domain melodies, composers, music theory explained with sound (intervals, chords, scales, rhythm), Italian music words, the science of sound and free tools (metronome, tuner, piano, vocal range test). Returns a short answer with a sourced fact and a link where the user can hear it.",
