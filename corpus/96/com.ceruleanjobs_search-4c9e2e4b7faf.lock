      "serverInfo": {
        "name": "cerulean-jobs",
        "title": "Cerulean Jobs",
        "version": "3.0.0",
        "description": "Open jobs at luxury houses and brands worldwide: search them, read one in full, find roles like it.",
        "websiteUrl": "https://ceruleanjobs.com",
        "icons": [
          {
            "src": "https://ceruleanjobs.com/.well-known/mcp/icon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
