        {
          "name": "search",
          "title": "Search jobs",
          "description": "Use this when someone wants to find, browse, count or compare open roles at luxury houses and brands, the newest openings included. The listings are read from the houses' own career sites every four hours, and closed roles drop out. query takes keywords or a plain request (\"senior client advisor, Bulgari, Geneva\"), and may be empty to browse; brand, place, employment type, seniority, industry and department can also be set as filters, and they combine; posted_within_days keeps only recent listings. Returns one page of listings — each with an id, a short summary and the url where candidates read it and apply — plus total, the number of matches.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "A brand, by name or slug: \"Tiffany & Co.\", \"LV\", \"louis-vuitton\". A name that matches no brand comes back as an unknown_value warning with close spellings.",
                "type": "string"
              },
              "country": {
                "description": "A country, by name or ISO code — \"Switzerland\", \"US\", \"Deutschland\". Narrower than location, and combinable with it.",
                "type": "string"
              },
              "department": {
                "description": "Department.",
                "enum": ["retail-operations", "wholesale-b2b", "merchandising-buying", "ecommerce-digital", "clienteling-crm", "creative-design", "research-innovation", "visual-merchandising-architecture", "heritage-archives", "manufacturing-artisanal", "supply-chain-logistics", "culinary-food-production", "food-beverage-service", "front-office-guest-experience", "housekeeping-cleaning", "spa-wellness", "engineering-facilities", "real-estate-asset-management", "corporate-affairs-csr", "human-resources", "finance-accounting", "it-technology", "medical-clinical", "legal-compliance", "executive-management", "other"],
                "type": "string"
              },
              "employment_type": {
                "description": "Employment type.",
                "enum": ["full-time", "part-time", "contract", "temporary", "seasonal", "internship", "volunteer", "per-diem", "other"],
                "type": "string"
              },
              "industry": {
                "description": "Industry.",
                "enum": ["fashion-apparel-leather", "watches-horology", "high-jewelry", "perfumes-cosmetics-beauty", "eyewear-vision-care", "wines-spirits-gastronomy", "luxury-hospitality-travel", "selective-retailing", "luxury-real-estate", "yachting-aviation-mobility", "pre-owned-vintage-luxury", "media-art-culture", "luxury-automotive", "luxury-furniture-homewares", "high-end-audio-electronics", "premium-sporting-equipment", "photography-optics"],
                "type": "string"
              },
              "limit": {
                "description": "How many results to return, up to 20. Defaults to 12; more than 20 is served as 20 with a clamped warning.",
                "type": "integer"
              },
              "locale": {
                "description": "The user's language and region, as a BCP 47 tag: fr-CH for someone writing French in Geneva, say. It sets the language of titles and descriptions, and adds localizedUrl, the listing on that locale's Cerulean site, where the site carries it. It does not filter: country and location do. Cerulean's sites are en: ceruleanjobs.com, English, worldwide; fr-FR: cerulean.fr, French, France; fr-CH: ceruleanjobs.ch, French, Switzerland; de-CH: ceruleanjobs.ch, German, Switzerland; en-CA: ceruleanjobs.ca, English, Canada; fr-CA: ceruleanjobs.ca, French, Canada; de-DE: ceruleanjobs.de, German, Germany; en-GB: ceruleanjobs.co.uk, English, UK; es-ES: cerulean.es, Spanish, Spain; it-IT: ceruleanjobs.it, Italian, Italy; en-US: ceruleancareers.com, English, USA. Any other tag takes its language's site, so fr-BE reads as fr-FR and en-US as en; another language reads as en. Defaults to en.",
                "pattern": "^([A-Za-z]{2,3}([-_][A-Za-z0-9]{1,8})*)?$",
                "type": "string"
              },
              "location": {
                "description": "A city, region or country, in any common spelling: \"Geneva\" or \"Genève\", \"New York\" or \"NYC\", \"Lombardy\", \"UAE\".",
                "type": "string"
              },
              "offset": {
                "description": "How many results to skip, for the next page. Defaults to 0, maximum 10000.",
                "type": "integer"
              },
              "posted_within_days": {
                "description": "Only listings posted in the last N days, by when Cerulean first saw them: 1 for today's, 7 for this week's. Up to 365.",
                "type": "integer"
              },
              "query": {
                "description": "Keywords, or the request as a plain sentence (\"senior client advisor, Bulgari, Geneva\"). A brand, place, country or employment type it names is applied as that filter, unless the filter is set, and reported in interpreted. Leave it out, or empty, to browse by filters alone.",
                "type": "string"
              },
              "seniority_level": {
                "description": "Seniority level.",
                "enum": ["intern", "entry-level", "junior", "mid-level", "senior", "lead", "supervisor", "manager", "director", "executive"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "hasMore": {
                "type": "boolean"
              },
              "indexBuiltAt": {
                "description": "When the index was built, RFC 3339: how far results can trail the site.",
                "type": "string"
              },
              "interpreted": {
                "additionalProperties": false,
                "description": "How the query was read, when it named filters or carried words every search does.",
                "properties": {
                  "brand": {
                    "description": "The brand the sentence named, as the brand filter's slug.",
                    "type": "string"
                  },
                  "country": {
                    "description": "A second place the sentence named, a country, applied as the country filter.",
                    "type": "string"
                  },
                  "employmentType": {
                    "description": "The employment type the sentence named, applied as that filter.",
                    "type": "string"
                  },
                  "location": {
                    "description": "The place the sentence named, applied as the location filter.",
                    "type": "string"
                  },
                  "query": {
                    "description": "The words left to search as text: empty when the sentence named only filters.",
                    "type": "string"
                  }
                },
                "required": ["query"],
                "type": ["null", "object"]
              },
              "limit": {
                "type": "integer"
              },
              "offset": {
                "type": "integer"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "brand": {
                      "additionalProperties": false,
                      "properties": {
                        "name": {
                          "type": "string"
                        },
                        "slug": {
                          "description": "The brand filter's value for this brand.",
                          "type": "string"
                        }
                      },
                      "required": ["name", "slug"],
                      "type": "object"
                    },
                    "city": {
                      "type": "string"
                    },
                    "country": {
                      "type": "string"
                    },
                    "datePosted": {
                      "description": "When the listing was first seen, RFC 3339.",
                      "type": "string"
                    },
                    "department": {
                      "description": "A department filter value.",
                      "type": "string"
                    },
                    "employmentType": {
                      "description": "An employment_type filter value.",
                      "type": "string"
                    },
                    "id": {
                      "description": "The listing's id: what fetch and find_similar_jobs take.",
                      "type": "string"
                    },
                    "industry": {
                      "description": "An industry filter value.",
                      "type": "string"
                    },
                    "localizedUrl": {
                      "description": "The listing on the Cerulean site for locale, when that site carries it.",
                      "type": "string"
                    },
                    "region": {
                      "type": "string"
                    },
                    "seniorityLevel": {
                      "description": "A seniority_level filter value.",
                      "type": "string"
                    },
                    "text": {
                      "description": "The listing's summary, up to 300 characters.",
                      "type": "string"
                    },
                    "title": {
                      "description": "The job title, in the language of locale where the listing has a translation.",
                      "type": "string"
                    },
                    "url": {
                      "description": "The listing on ceruleanjobs.com, where a candidate reads it in full and applies.",
                      "type": "string"
                    }
                  },
                  "required": ["brand", "id", "title", "url"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
