      "instructions": "Cerulean lists open jobs at luxury houses and brands worldwide — fashion and leather goods, watches, jewellery, beauty, wines and spirits, luxury hospitality — read from the houses' own career sites every four hours, so closed roles drop out. search finds and filters roles, from keywords or a plain sentence; fetch returns one listing in full (responsibilities, requirements, pay where stated, required languages); find_similar_jobs starts from one listing's id, which every result carries.\n\nBrand, country and location take ordinary names (\"Tiffany & Co.\", \"US\", \"Genève\"). A value Cerulean has no jobs under comes back as an unknown_value warning; its suggestions are spellings of known brands and places, not nearby alternatives.\n\nEach result's url is the listing's page on Cerulean, where candidates read it in full and apply: link each listing you mention to its url, or to localizedUrl where there is one. Results come ranked, and a host that shows them as cards numbers them in that order. locale, the user's language and region as a BCP 47 tag (fr-CH), sets the language of titles and descriptions and adds localizedUrl on that country's Cerulean site; it does not filter.\n\nWhen search returns searchUrl, candidates can follow that link to see all matches on Cerulean. Use the URL as returned.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch a listing",
          "description": "Use this when someone asks about one specific Cerulean listing — its responsibilities, qualifications, skills, experience, education, pay when the employer states it, benefits or required languages — and its id or Cerulean URL is known. Returns that one listing in full as text, with its url and structured details. It does not search. An unknown or closed listing is an error.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The listing's id, as every result carries it, or its URL on a Cerulean site.",
                "type": "string"
              },
              "locale": {
                "description": "The user's language and region, as a BCP 47 tag: fr-CH for someone writing French in Geneva, say. It sets the language of titles and descriptions, and adds localizedUrl, the listing on that locale's Cerulean site, where the site carries it. It does not filter: country and location do. Cerulean's sites are en: ceruleanjobs.com, English, worldwide; fr-FR: cerulean.fr, French, France; fr-CH: ceruleanjobs.ch, French, Switzerland; de-CH: ceruleanjobs.ch, German, Switzerland; en-CA: ceruleanjobs.ca, English, Canada; fr-CA: ceruleanjobs.ca, French, Canada; de-DE: ceruleanjobs.de, German, Germany; en-GB: ceruleanjobs.co.uk, English, UK; es-ES: cerulean.es, Spanish, Spain; it-IT: ceruleanjobs.it, Italian, Italy; en-US: ceruleancareers.com, English, USA. Any other tag takes its language's site, so fr-BE reads as fr-FR and en-US as en; another language reads as en. Defaults to en.",
                "pattern": "^([A-Za-z]{2,3}([-_][A-Za-z0-9]{1,8})*)?$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
