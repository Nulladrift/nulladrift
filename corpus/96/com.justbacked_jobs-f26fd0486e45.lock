      "serverInfo": {
        "name": "justbacked",
        "title": "JustBacked Startup Jobs",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "JustBacked lists every open role at venture-backed startups that raised in the last six months, read daily from each company's own hiring system, with the round, the investors, pay where published and how fast each team is hiring.\nUse it to run the user's job search: search_jobs to find roles, get_job for the full description and apply link, get_company to research a startup, get_application_form to see a role's application questions so you can draft answers, and track_application / update_application to keep the user's tracker current.\nRules: you never submit an application. Draft answers and cover notes for the user to review; the user applies at apply_url themselves. Only call track_application with status \"applied\" after the user confirms they submitted. Don't invent pay, funding or investor facts; quote what the tools return.",
      "tools": [
        {
          "name": "add_to_list",
          "title": "Add company to a list",
          "description": "Add a startup to one of the user's lists. Pass list_id, or list_name (an existing list's name, or a new list to create). Lists with alerts on email the user when a company posts a role or raises.",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "company_slug or name.",
                "type": "string"
              },
              "list_id": {
                "type": "string"
              },
              "list_name": {
                "type": "string"
              }
            },
            "required": ["company"],
            "type": "object"
          },
