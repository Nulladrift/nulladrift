            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ambiguity": {
                "enum": ["earlier", "later"],
                "type": "string"
              },
              "approx_window_minutes": {
                "anyOf": [
                  {
                    "const": 15,
                    "type": "number"
                  },
                  {
                    "const": 30,
                    "type": "number"
                  },
                  {
                    "const": 60,
                    "type": "number"
                  },
                  {
                    "const": 120,
                    "type": "number"
                  }
                ]
              },
              "birth_date": {
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "birth_time": {
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d(:[0-5]\\d)?$",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language code. Published: en, it. Other codes fall back to English with a language.note.",
                "maxLength": 35,
                "type": "string"
              },
              "latitude": {
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "place_id": {
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "time_precision": {
                "enum": ["exact", "approximate", "unknown"],
                "type": "string"
              },
              "timezone": {
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_+-]+(?:\\/[A-Za-z0-9_+-]+)*$",
                "type": "string"
              },
              "utc_offset_override_sec": {
                "maximum": 86400,
                "minimum": -86400,
                "type": "integer"
              }
            },
            "required": ["birth_date", "time_precision"],
            "type": "object"
