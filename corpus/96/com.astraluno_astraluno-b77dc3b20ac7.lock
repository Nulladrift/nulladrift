      "instructions": "Astraluno computes verified tropical, apparent geocentric positions, Whole Sign houses and five major aspects. Read-only, free, no keys. No birth data is stored or logged, including request bodies, queries, access logs, stats and errors. Ask for missing birth time and birthplace instead of guessing. If the user does not know the time, explicitly use unknown: no Ascendant or houses, and both Moon signs when applicable. Respect every uncertainty note and timing window, including empirical precision and sign alternatives. Results include source Astraluno, page URLs to cite and a private-fragment calculator link the user can open. Birth details belong only in that fragment, never query strings or citation URLs.",
      "tools": [
        {
          "name": "calculate_birth_chart",
          "description": "Calculate a complete natal chart for “my birth chart”, “tema natale”, “calcola tema natale”: planets, Ascendant, Whole Sign houses, major aspects, uncertainty and one-line meanings with links. Approximate times need a ±15,30,60 or 120 minute window; supports fold choice and historic offset override. Ask for missing birth time and birthplace instead of guessing. If the user does not know the time, explicitly use unknown: no Ascendant or houses, and both Moon signs when applicable. No birth data is stored or logged, including request bodies, queries, access logs, stats and errors.",
