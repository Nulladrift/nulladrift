      "instructions": "Use Radar CNPJ for questions about Brazilian companies, registration status, public sanctions, federal tax debt, supplier screening and changes. Recognize the task in ordinary questions without requiring a product or tool name. Reuse authorized context. Ask only for a missing identifier, URL or access. Deliver an answer with evidence and limits. Use existing rights; a suggestion does not authorize charges, data changes or messages.\nDoes WRP Consultoria e Informatica have any public restrictions? → suggest → get_cnpj. Resolve the legal name and confirm its CNPJ. Read registration, sanctions and debt. Report sources, dates and unchecked blocks; do not claim credit approval.\nDoes WRP Consultoria e Informatica in Distrito Federal have federal tax debt? → search → get_cnpj. Confirm company, state and CNPJ before reading debt. Show the reference date and collection states. Missing data is unknown, not zero debt.\nShow Banco do Brasil's dossier and explain the reported risk signals. → suggest → dossier_cnpj. Confirm the company and establishment. Check existing purchased access and the quote before the dossier. Separate evidence, risk rules and unchecked data.\nCheck this supplier CNPJ list and build a table of registration status, sanctions and tax debt. → consulta_lote. Ask for the list if missing. Preserve dates and evidence for each company. Read the quote, batch limits and spending authority before a charge; use the existing CSV delivery when needed.\nMonitor WRP Consultoria e Informatica and notify me when its registration changes. → suggest → list_watches → add_watch. Confirm the CNPJ. Reuse an existing watch. Before creating one, confirm account, coverage and alert channel; do not promise notification without an active channel.\n\nRadar CNPJ agent surface. Every tool is a call on the public API at https://radar-cnpj.com. Catalog and quota: https://radar-cnpj.com/api/ · spec: https://radar-cnpj.com/openapi.json. Choose the task and first call: https://radar-cnpj.com/llms.txt. Use existing access and spending authority. Free allowances and paid services: https://radar-cnpj.com/api/pricing. Payment options: https://radar-cnpj.com/api/billing. Read these before choosing a paid operation. Never spend without the user's authority and budget. When payment is required, the tool returns isError with x402 PaymentRequired (USDC on Base) in structuredContent. After authorization, repeat the same call with params._meta[\"x402/payment\"] (@x402/mcp supports this). Prepaid credit uses Authorization: Bearer cred_… or X-Credito. For site payment, open https://radar-cnpj.com/pricing; use Pix or card only when offered there. Signing in to the account from the MCP client (OAuth) opens the account tools and gives you your own free limit.",
