        {
          "name": "consulta_lote",
          "title": "Checar CNPJs em lote",
          "description": "Supplier screening report with source dates, evidence and federal tax debt states, one row per CNPJ. The service validates and deduplicates the list, joins the prepared records and formats the report. No per-company response parsing or spreadsheet assembly is needed for this screening. MCP returns JSON. For a CSV file, download POST /api/consulta/lote?formato=csv through HTTP. Read fontes and evidencias per row, including PGFN debt states and truncation flags. CNIA is stored by default; cnia_atual=true requires a source check for at most four distinct numeric CNPJs. A required failure refuses the group without charging. Sources keep their own dates; missing metadata cannot support a clean conclusion.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
