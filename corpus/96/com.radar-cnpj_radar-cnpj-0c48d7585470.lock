        {
          "name": "cancel_plan",
          "title": "Cancel plan",
          "description": "Cancels the active plan: nothing else is charged, and what you paid for stays active until the end of its period.\nSend `{ \"accept_data_removal\": true }`. The monthly card subscription stops. A purchase made less than 7 days ago and a paid period that has not started yet, such as a renewal, go back the same way they were paid (card or Pix) and end now. The rest of the paid period stays active until `keeps_until`; then what the plan added ends (`account.cancel.losses` in `GET /api/plans` says what). A purchase paid with USDC or with credit from another purchase stays active until its end; ask for its refund by e-mail, as the cancellation page says.",
          "inputSchema": {
            "properties": {
