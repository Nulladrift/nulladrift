              "orcamento": {
                "description": "Advertising: `ate_100`, `100_500`, `500_2000`, `2000_mais` or `a_combinar`. Consulting, in US dollars: `ate_2000`, `2000_5000`, `5000_10000`, `10000_mais` or `nao_sei`.",
                "enum": ["ate_100", "100_500", "500_2000", "2000_mais", "a_combinar", "ate_2000", "2000_5000", "5000_10000", "10000_mais", "nao_sei"],
                "type": "string"
