                "default": false,
                "description": "Require a CNIA source check during this request. At most 4 distinct numeric CNPJs in this mode. If any required check fails, return 503 without charging the group or using stored CNIA. Without this requirement, use stored CNIA. Other sources keep their own reference dates.",
                "type": "boolean"
              },
              "cnpjs": {
                "description": "The CNPJs, with or without punctuation (numeric or alphanumeric), up to 200 valid ones per request.",
                "items": {
                  "type": "string"
                },
                "maxItems": 100,
                "type": "array"
              },
              "credit_token": {
                "description": "Prepaid credit token (`cred_…`) with the lookup balance.",
                "type": "string"
              }
            },
            "required": ["cnpjs"],
            "type": "object"
