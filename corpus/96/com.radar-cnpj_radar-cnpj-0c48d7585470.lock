        {
          "name": "buy_plan",
          "title": "Buy plan",
          "description": "Buys a plan for the signed-in account.\nPix and USDC pay 30 days with no automatic renewal; the card subscribes monthly and renews until you cancel. Without payment, the answer is 402 with the price. Pay with prepaid credit (`X-Credito`) or x402 (`PAYMENT-SIGNATURE` v2 or `X-PAYMENT` v1). Sign in first: a wallet or a credit token without an account does not buy this plan (`account_required`). The `compra` mark prevents repeat credit debits. An x402 nonce can settle only once; keep the receipt after a delivery error.",
          "inputSchema": {
            "properties": {
              "plan": {
                "description": "`carteira-100` (99 more monitored companies; 100 with the free one)",
                "enum": ["carteira-100"],
                "type": "string"
