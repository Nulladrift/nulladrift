        {
          "name": "avaliar",
          "title": "Evaluate a business idea",
          "description": "Evaluates a business idea in Brazil by how many companies are registered for it: the idea is mapped to a CNAE activity code and a place, and the answer counts the active, opened and closed companies there, shows how they are set up and gives a plain reading of the numbers. It does not estimate search volume and does not promise demand: `ficha.limites` says what the numbers do not show. Up to 30 assessments a day per network; after that, the tool answers `limite_diario` with `renova_em`.",
