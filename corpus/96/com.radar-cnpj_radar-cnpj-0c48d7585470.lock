                "enum": ["agora", "1_mes", "1_3_meses", "explorando"],
                "type": "string"
              },
              "prefer_whatsapp": {
                "description": "Request a WhatsApp reply. Requires whatsapp.",
                "type": "boolean"
              },
              "projeto": {
                "description": "Consulting: the kind of project (`llm_privado`, `voz`, `dados_sensiveis`, `gpu`, `integracao` or `outro`).",
                "enum": ["llm_privado", "voz", "dados_sensiveis", "gpu", "integracao", "outro"],
                "type": "string"
              },
              "site": {
                "description": "Website of who is proposing.",
