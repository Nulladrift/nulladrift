        {
          "name": "consulta_cnpj",
          "title": "Check a company (live)",
          "description": "Additional CNPJ lookup with prepared public records and an attempted CNIA source check during the request. Set cnia_atual=true when that check is required: source failure returns 503 without charging or using a previous record. Without this requirement, the last stored CNIA may be returned; read conferidoEm. Select topics to load only the needed blocks. The available free allowance comes before lookup balance or per-call payment. The service checks the company and its headquarters when needed, parses the TCU response and joins it to the prepared company data. This is a source check, not an issued official certificate. Without cnia_atual=true, an older CNIA can be returned; inspect conferidoEm. An unavailable required check does not support a clean conclusion.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cnia_atual": {
                "default": false,
                "description": "Require a CNIA source check during this request. If it fails, return 503 without charging or using a previous record. When selecting topics, include sancoes.",
                "type": "boolean"
              },
              "cnpj": {
                "description": "CNPJ, with or without punctuation.",
                "type": "string"
              },
              "temas": {
                "description": "Comma-separated topics: dados, contagens, socios, sancoes, fiscal, divida, obras, trabalho, ibama, contratos, pep, vendas, campanhas, prefeituras, sicaf, aeronaves, fundos, rntrc, bndes, registros; todos. Omit for the full record. Basic company data always stays. contagens adds a contagens object with only the record counts (socios, pep, sancoes, fiscal, socioambiental, governo, registros). Unrequested blocks are omitted; null means unchecked. Personal data remains masked.",
                "maxLength": 240,
                "type": "string"
              }
            },
            "required": ["cnpj"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a company (live)"
