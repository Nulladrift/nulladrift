              "email": {
                "description": "Where to reply.",
                "type": "string"
              },
              "empresa": {
                "description": "Who is proposing, when it is a company.",
                "type": "string"
              },
              "espaco": {
                "description": "Placement ids from `GET /api/partners`, up to 6.",
                "items": {
                  "type": "string"
                },
                "type": "array"
