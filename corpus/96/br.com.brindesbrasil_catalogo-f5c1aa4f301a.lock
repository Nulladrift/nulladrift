      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "brindesbrasil",
        "title": "BrindesBrasil.com.br",
        "version": "1.11.2",
        "websiteUrl": "https://www.brindesbrasil.com.br/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Catálogo da BrindesBrasil (brindesbrasil.com.br): brindes personalizados com a marca do cliente para empresas, eventos e feiras. Use buscar_produtos para achar itens, detalhes_produto para técnica de gravação e tabela de preço, calcular_preco para um orçamento por quantidade. Preços em reais, sem frete. Produção: até 12 dias úteis, contados do dia útil seguinte à confirmação do pagamento e à aprovação da arte (vale o que vier por último). Não invente preços: use as ferramentas. Para fechar pedido, indique a página do produto ou https://www.brindesbrasil.com.br/contato/",
      "tools": [
        {
          "name": "buscar_produtos",
          "title": "Buscar produtos",
          "description": "Busca brindes no catálogo por texto (nome, tipo, material) ou SKU. Devolve título, SKU, link, imagem, preço unitário a partir de (com gravação), situação de estoque (em_estoque, estoque_baixo, sob_encomenda, sem_estoque), estoque_qtd e primeira_faixa (primeira quantidade da tabela de preço, NÃO é pedido mínimo). a_partir_de_com_cupom_ariel = o mesmo preço com o cupom ariel (como a Ariel orça).",
          "inputSchema": {
            "properties": {
              "busca": {
                "description": "O que procurar. Ex.: \"garrafa inox\", \"caneta metal touch\", \"SPX-08103\".",
                "type": "string"
              },
              "categoria": {
                "description": "Opcional: slug de categoria vindo de listar_categorias.",
                "type": "string"
              },
              "limite": {
                "default": 8,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["busca"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Buscar produtos"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fbe4fe9ba6b95428908bc31dc256d744271eb9d618eee83e6337085f4b93d50e"
        },
        {
          "name": "calcular_frete",
          "title": "Calcular frete",
          "description": "Calcula o frete de um pedido para um CEP brasileiro com o mesmo cálculo do carrinho da loja (preço com gravação, produtos agrupados nas mesmas caixas quando cabem e somente as formas de envio habilitadas). Aceita um produto (produto + quantidade) ou vários em \"itens\" (até 10); o frete de vários produtos é o do pedido inteiro, que difere da soma de cotações separadas. Devolve cada opção com valor e prazo total (produção + entrega).",
          "inputSchema": {
            "properties": {
              "aplicacoes": {
                "default": 1,
                "description": "Para um produto só: número de gravações (0 = sem gravação).",
                "maximum": 4,
                "minimum": 0,
                "type": "integer"
              },
              "cep": {
                "description": "CEP de destino no Brasil, 8 dígitos (ex.: 01310-100).",
                "type": "string"
              },
              "itens": {
                "description": "Produtos do pedido. Use para cotar vários produtos juntos.",
                "items": {
                  "properties": {
                    "aplicacoes": {
                      "default": 1,
                      "description": "Número de gravações (0 = sem gravação).",
                      "maximum": 4,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "produto": {
                      "description": "SKU do produto (ex.: SPX-10338-BCO) ou ID numérico.",
                      "type": "string"
                    },
                    "quantidade": {
                      "minimum": 1,
                      "type": "integer"
                    },
                    "tecnica": {
                      "description": "Opcional: técnica de gravação (ex.: \"Laser\"). Sem ela, a mais barata para a quantidade.",
                      "type": "string"
                    }
                  },
                  "required": ["produto", "quantidade"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "produto": {
                "description": "Para um produto só (alternativa a \"itens\"): SKU ou ID.",
                "type": "string"
              },
              "quantidade": {
                "description": "Para um produto só: quantidade de peças.",
                "minimum": 1,
                "type": "integer"
              },
              "tecnica": {
                "description": "Para um produto só: técnica de gravação (opcional).",
                "type": "string"
              }
            },
            "required": ["cep"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Calcular frete"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5da33099685e9bcc0223c493caab38194136d25753d4899688287d4705751b48"
        },
        {
          "name": "calcular_preco",
          "title": "Calcular preço",
          "description": "Calcula preço unitário e total de um produto para uma quantidade e número de gravações (aplicações), com o mesmo motor do site. Não inclui frete. Cada opção traz também com_cupom_ariel (preço do carrinho com o cupom ariel, como a Ariel orça); `cupom` diz o percentual e o fator.",
          "inputSchema": {
            "properties": {
              "aplicacoes": {
                "default": 1,
                "description": "Número de gravações (0 = sem gravação, 1 a 4).",
                "maximum": 4,
                "minimum": 0,
                "type": "integer"
              },
              "produto": {
                "description": "SKU do produto (ex.: SPX-10338-BCO) ou ID numérico.",
                "type": "string"
              },
              "quantidade": {
                "description": "Quantidade de peças.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["produto", "quantidade"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calcular preço"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f1bce306dbd2e516302eed1e8020e93353a864c4966f93c3e0c43ebdab1b452e"
        },
        {
          "name": "detalhes_produto",
          "title": "Detalhes do produto",
          "description": "Detalhes de um produto: descrição, cores do mesmo modelo, estoque, medidas da caixa, técnicas de gravação disponíveis e tabela de preço por quantidade (preço unitário com 1 gravação; com_cupom_ariel = mesmo preço com o cupom ariel, como a Ariel orça).",
          "inputSchema": {
            "properties": {
              "produto": {
                "description": "SKU do produto (ex.: SPX-10338-BCO) ou ID numérico.",
                "type": "string"
              }
            },
            "required": ["produto"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Detalhes do produto"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b2bf8dca186a76b5c888a6dfa70a15987470255cc3cb591982570809db189947"
        },
        {
          "name": "identificar_imagem",
          "title": "Identificar produto pela foto",
          "description": "Descobre o SKU a partir de uma foto (URL https de brindesbrasil.com.br, ex.: o anexo do chat). Primeiro tenta pelo NOME do arquivo (imagem baixada do nosso site), depois compara com o índice de imagens do catálogo (distancia_hamming <= 10 = mesma forma; distancia_cor alta = mesmo modelo em outra cor; 11 a 16 = provável; acima disso não casa). Também lê o SKU gravado nos metadados do arquivo original. Se nada casar, devolve lista vazia: busque por texto.",
          "inputSchema": {
            "properties": {
              "candidatos": {
                "description": "Opcional: SKUs ou ids dos produtos que o cliente visitou (o radar.js lista). Compara primeiro só com eles; se não casar, usa o catálogo inteiro. `caminho` na resposta diz qual usou.",
                "items": {
                  "type": "string"
                },
                "maxItems": 100,
                "type": "array"
              },
              "limite": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "nome": {
                "description": "Opcional: nome original do arquivo (ex. Caneca-Inox-400ml-26931-1768333656.webp). Se vier de uma imagem do nosso site, acha o produto só pelo nome.",
                "type": "string"
              },
              "url": {
                "description": "URL https da imagem (brindesbrasil.com.br).",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Identificar produto pela foto"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9ec20b08689ca3f16493865d588263206df094bd0f36f7e3a898e547f3420df9"
        },
        {
          "name": "indicar_similares",
          "title": "Indicar similares",
          "description": "Outras cores do mesmo modelo e produtos parecidos, na mesma ordem que a página do produto mostra.",
          "inputSchema": {
            "properties": {
              "limite": {
                "default": 8,
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
