        {
          "name": "show_tours_activities",
          "description": "Present a selection of tours or activities to the traveler as a visual list of cards (photo, rating, price, booking button) rendered inline in the conversation. Showing cards is the default way to present tours to the traveler: whenever your reply features specific tours (recommendations, a shortlist, availability results), call this tool alongside your text instead of waiting to be asked. Don't re-render a selection you already showed unless it changed. Call it AFTER finding tours with the search tools — it is a presentation tool, not a search tool. If you already checked availability with get_product_availability, you can pass each item's sessions (date and start time) and the cards will highlight them with booking links preselecting the date. For clients without UI support the same data is returned as structured text.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "items": {
                "description": "The tours to display, in the order they should appear. Only the first 12 items are rendered; extras are dropped.",
                "items": {
                  "properties": {
                    "events": {
                      "description": "Optional: available sessions for this item as returned by get_product_availability — pass them only when you actually checked availability, never invent dates, and skip sessions reported as unavailable or sold out. The card highlights up to 3 of them with booking links preselecting the date.",
                      "items": {
                        "properties": {
                          "date": {
                            "description": "YYYY-MM-DD.",
                            "type": "string"
                          },
                          "start_time": {
                            "description": "HH:MM, when the session has a start time.",
                            "type": "string"
                          }
                        },
                        "required": ["date"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "product_id": {
                      "description": "The numeric ID of the product or free tour.",
                      "type": "integer"
                    },
                    "type": {
                      "description": "Type of listing, as returned by the search tools.",
                      "enum": ["product", "free_tour"],
                      "type": "string"
                    }
                  },
                  "required": ["product_id", "type"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "language": {
                "description": "Language code. Supported: en, es, de, it; any other value falls back to English. Defaults to en.",
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "attribution": {
                "type": "string"
              },
              "language": {
                "description": "Normalized language of the request; the widget localizes its labels with it.",
                "type": "string"
              },
              "notice": {
                "description": "Present only when the request exceeded the item limit and was truncated.",
                "type": "string"
              },
              "tours": {
                "description": "One card per resolvable item, in request order; unresolvable items are skipped.",
                "items": {
                  "properties": {
                    "events": {
                      "description": "Sessions highlighted on the card, present when the request included them.",
                      "items": {
                        "properties": {
                          "date": {
                            "description": "YYYY-MM-DD.",
                            "type": "string"
                          },
                          "start_time": {
                            "type": "string"
                          },
                          "url": {
                            "description": "Booking link preselecting this date. Share it with the traveler exactly as returned.",
                            "type": "string"
                          }
                        },
                        "required": ["date", "url"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "id": {
                      "type": "integer"
                    },
                    "image": {
                      "type": "string"
                    },
                    "languages": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "more_events": {
                      "description": "How many additional valid sessions were passed but not rendered on the card.",
                      "type": "integer"
                    },
                    "name": {
                      "type": ["string", "null"]
                    },
                    "price": {
                      "description": "Absent for free walking tours (pay-what-you-want).",
                      "properties": {
                        "amount": {
                          "type": "number"
                        },
                        "currency": {
                          "type": ["string", "null"]
                        }
                      },
                      "type": "object"
                    },
                    "rating": {
                      "type": ["number", "null"]
                    },
                    "reviews_count": {
                      "type": ["integer", "null"]
                    },
                    "source": {
                      "type": "string"
                    },
                    "type": {
                      "enum": ["product", "free_tour"],
                      "type": "string"
                    },
                    "url": {
                      "description": "Booking link. Share it with the traveler exactly as returned — never rewrite the domain or drop query parameters, they carry required attribution.",
                      "type": "string"
                    }
                  },
                  "required": ["id", "type", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["tours"],
            "type": "object"
          },
