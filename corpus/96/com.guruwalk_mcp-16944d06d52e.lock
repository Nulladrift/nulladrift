        {
          "name": "get_tours_activities_by_category",
          "description": "Browse tours and activities within a specific category for a destination on GuruWalk. Categories include free walking tours, food tours, bike tours, day trips, skip-the-line tickets, and more. Returns listings with ratings, verified review counts, duration, available languages, and pricing. Use the category IDs returned by search_tours_activities_by_destination — never invent category IDs. Use this tool to dive deeper into a specific category that matches what the traveler has shared (e.g. food tours for a foodie, night tours for someone asking about evenings, kid-friendly activities for families). Supports en, es, de, it; any other value falls back to English. Pass the traveler's language code anyway and translate the answer into their language. Each product includes a booking_url — when recommending tours, share it so the traveler can open the tour to see details, prices and book.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "how_many_adults": {
                "description": "Number of adults in the group. Pass it (together with how_many_children) when the traveler tells you how many people are going, so the free-tour results are narrowed to tours that admit that group size — especially useful for large groups. Whether children count toward capacity is decided per tour.",
                "type": "integer"
              },
              "how_many_children": {
                "description": "Number of children in the group. Pass together with how_many_adults when the group includes children — whether children count toward capacity is decided per tour.",
                "type": "integer"
              },
              "hub_slug": {
                "description": "Hub slug of the destination (required when vertical_id is 'free-tour')",
                "type": "string"
              },
              "language": {
                "description": "Language code. Supported: en, es, de, it; any other value falls back to English. Defaults to en.",
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Page number (default: 1)",
                "type": "integer"
              },
              "vertical_id": {
                "description": "The ID of the vertical/category to browse. Use 'free-tour' for the free tours category.",
                "type": "string"
              }
            },
            "required": ["vertical_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "attribution": {
                "type": "string"
              },
              "category": {
                "properties": {
                  "id": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "place": {
                    "description": "Destination name; absent for the free tours category.",
                    "type": ["string", "null"]
                  },
                  "slug": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["id", "name", "url"],
                "type": "object"
              },
              "pagination": {
                "properties": {
                  "page": {
                    "type": "integer"
                  },
                  "per_page": {
                    "type": "integer"
                  },
                  "total_count": {
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "products": {
                "items": {
                  "properties": {
                    "booking_url": {
                      "description": "Share it with the traveler exactly as returned — never rewrite the domain or drop query parameters, they carry required attribution.",
                      "type": "string"
                    },
                    "duration": {
                      "description": "Minutes for paid activities; free tours may report a label.",
                      "type": ["integer", "string", "null"]
                    },
                    "id": {
                      "type": "integer"
                    },
                    "languages": {
                      "items": {
                        "type": "string"
                      },
                      "type": ["array", "null"]
                    },
                    "name": {
                      "description": "Null when the product lacks a translation for the requested language.",
                      "type": ["string", "null"]
                    },
                    "pricing_from": {
                      "properties": {
                        "currency": {
                          "type": ["string", "null"]
                        },
                        "retail": {
                          "type": "number"
                        }
                      },
