        {
          "name": "search_tours_activities_by_destination",
          "description": "Search a city to explore free walking tours and paid activities on GuruWalk, the world's largest free walking tour platform. Returns destination info, tour categories (free tours, food tours, day trips, tickets, and more), and featured listings with ratings and verified traveler reviews. Covers 1,000+ cities worldwide. Free tours operate on a pay-what-you-want model. Supports English, Spanish, German, and Italian (en, es, de, it); any other value falls back to English. Pass the traveler's language code anyway and translate the answer into their language. Use this tool when the traveler asks what to do, what to see, or what tours or activities are available in a destination, or wants help planning their trip or days there. Do not call it when the destination is only mentioned in passing with no request for plans or recommendations. If the traveler mentions a landmark instead of a city, infer the city (e.g. 'eiffel tower' → Paris, 'colosseum' → Rome, 'sagrada familia' → Barcelona, 'big ben' → London). After getting results, review the categories and featured_products to find the most relevant matches for what the traveler asked about. Each featured product includes a booking_url — when recommending tours, share it so the traveler can open the tour to see details, prices and book.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "Country the destination is in (name in any language or ISO code), to disambiguate cities that share a name across countries (e.g. Bayonne in France vs Bayona in Spain). Provide it whenever the country is clear from context. If the country has no matching city, the search returns no destination — a reliable signal that there's no coverage there.",
                "type": "string"
              },
              "destination": {
                "description": "City name, e.g. 'Rome'",
                "type": "string"
              },
              "end_date": {
                "description": "Only show tours available until this date (YYYY-MM-DD). Use the traveler's booking date plus 2 days if no specific date was mentioned.",
                "type": "string"
              },
              "how_many_adults": {
                "description": "Number of adults in the group. Pass it (together with how_many_children) when the traveler tells you how many people are going, so only free tours that admit that group size are returned — especially useful for large groups. Whether children count toward capacity is decided per tour.",
                "type": "integer"
              },
              "how_many_children": {
                "description": "Number of children in the group. Pass together with how_many_adults when the group includes children — whether children count toward capacity is decided per tour.",
                "type": "integer"
              },
              "language": {
                "description": "Language code. Supported: en, es, de, it; any other value falls back to English. Defaults to en.",
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Page number for featured products (default: 1)",
                "type": "integer"
              },
              "start_date": {
                "description": "Only show tours available from this date (YYYY-MM-DD). Use the traveler's booking date minus 2 days if no specific date was mentioned.",
                "type": "string"
              },
              "text": {
                "description": "Optional text filter. When provided, featured_products are narrowed to paid products whose name matches the text (MATCH AGAINST, all tokens must appear as prefix, tokens of <3 chars ignored), and free tours are automatically excluded (their legacy search doesn't support text filtering). Use when the traveler names a specific attraction ('Casa Batlló', 'Sagrada Familia') or a themed phrase ('food tour'). Leave empty for the full hub listing including free tours.",
                "type": "string"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "attribution": {
                "type": "string"
              },
              "categories": {
                "description": "Tour categories available in the destination; pass a category `id` as vertical_id to browse it.",
                "items": {
                  "properties": {
                    "hub_slug": {
                      "description": "Present on the free tours category.",
                      "type": "string"
                    },
                    "id": {
                      "description": "'free-tour' for the free tours category, numeric for verticals.",
                      "type": ["string", "integer"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "name", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "coverage": {
                "description": "Present only when GuruWalk has no tours or activities in the destination.",
                "enum": ["none"],
                "type": "string"
              },
              "destination": {
                "description": "Echo of the requested destination when coverage is none.",
                "type": "string"
              },
              "featured_products": {
                "items": {
                  "properties": {
                    "booking_url": {
                      "description": "Share it with the traveler exactly as returned — never rewrite the domain or drop query parameters, they carry required attribution.",
                      "type": "string"
                    },
                    "duration": {
                      "description": "Minutes for paid activities; free tours may report a label.",
                      "type": ["integer", "string"]
                    },
                    "id": {
                      "type": "integer"
                    },
                    "name": {
                      "type": "string"
                    },
                    "pricing_from": {
                      "properties": {
                        "currency": {
                          "type": ["string", "null"]
                        },
                        "retail": {
                          "type": "number"
                        }
                      },
                      "type": "object"
                    },
                    "rating": {
                      "type": ["number", "string"]
                    },
                    "reviews_count": {
                      "type": "integer"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "source": {
                      "type": "string"
                    },
                    "type": {
                      "enum": ["product", "free_tour"],
                      "type": "string"
                    }
                  },
                  "required": ["id", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "message": {
                "type": "string"
              },
              "pagination": {
                "properties": {
                  "page": {
                    "type": "integer"
                  },
                  "per_page": {
                    "type": "integer"
                  },
                  "total_count": {
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "place": {
                "properties": {
                  "country": {
                    "type": ["string", "null"]
                  },
                  "has_free_tours": {
                    "type": "boolean"
                  },
                  "id": {
                    "type": "integer"
                  },
                  "name": {
                    "type": "string"
                  },
                  "slug": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "tip": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search Tours Activities By Destination"
          },
          "behavior": {
