        {
          "name": "get_product_detail",
          "description": "Get the full detail of one or more tours or activities on GuruWalk in a single call. Pass an `items` array — each entry has its own type, product_id and language, and is processed independently. Returns a `results` array where every entry echoes its `product_id` and `type` so you can match each response to its request. Always batch when you need details for several tours (e.g. before recommending or comparing them): send them all in one call instead of invoking this tool several times. Each successful entry returns description, images, reviews, duration, available languages, cancellation policies, and meeting point info. Paid `product` entries also return `highlights`, `included`/`excluded`, `pricing_from`, and `where` (address + coordinates). `free_tour` entries return `itinerary` as a flat array of point-title strings (no descriptions), plus `guide.name`, `meeting_point_url`, and `how_to_find_me`. Both types return `meeting_point_url` (Google Maps link) whenever the meeting point has coordinates. For a `free_tour` that is the meeting point. For a paid `product` it is the reference point published on the listing: useful to orient a traveler who has not booked yet, but the operative meeting point of a purchased activity — with the supplier's own instructions — is the one in its voucher. Offer it as a reference, never as the confirmed meeting point of a booking. Paid `product` also returns the address text and coordinates in `where`; `free_tour` also returns `meeting_point_latitude` and `meeting_point_longitude` (use these coords as destination for routing), plus `how_to_find_me`: a free-text note written by the guide describing how the traveler can recognize them at the meeting point. Per-item errors (product not found) are reported inside that item's result without failing the rest of the batch. Use this tool whenever the traveler asks what a tour covers, which places it visits, its itinerary, route, description, meeting point, duration, or any content-related question. For the meeting point of a paid activity the traveler has already booked, the booking's voucher comes first; fall back to this tool only when that voucher has no meeting point yet, and say then that this is the point published on the listing and that the definitive one arrives with the voucher. Always call this tool BEFORE answering questions about a specific tour — never give generic opinions or advice without consulting the real data first. Supports en, es, de, it; any other value falls back to English. Pass the traveler's language code anyway and translate the answer into their language. Each result includes the tour's url — when recommending or confirming a tour, share it so the traveler can open it to book.",
