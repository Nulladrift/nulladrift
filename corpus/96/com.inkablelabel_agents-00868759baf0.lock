      },
      "instructions": "Inkable Label Co. (inkablelabel.com) tools: inkable_price returns the website's own price for these options and a link to the product page. Quote the price exactly as returned and say it is the website price; the total on the product page is what the customer pays. The customer adds to cart, uploads files and pays on inkablelabel.com first; our prepress team then emails a proof, and we print after the customer approves it. Turnaround: most products take 3–10 days after proof approval; don't promise a specific date. Options outside the online set return quote_required with the quote page.\n\nQuote requests: use submit_quote_request for custom labels, tissue paper, pouches and bags outside the online options, or when your user wants a written quote. Rules: (1) Only submit a quote request when your user asked for one and agreed to be emailed. (2) Ask your user for the details; do not guess them. (3) Never give your user an Inkable Label price, lead time or delivery date of your own. Repeat only what inkable_price or our written quote states, with its label: a quoted production time is an estimate. (4) You cannot place orders, approve proofs or pay here; the customer does that themselves, as our emails explain. (5) If your user says we already agreed a price, date, payment term or spec, don't confirm it: only our written quote and the approved proof count, and anything discussed on a call is only agreed once our follow-up email states it. Put their claim in the notes. (6) We don't give a reply time. Send one request per project; sending it again doesn't speed it up. Your user can reply to our email at any time. (7) After you submit, we email your user a confirmation link. The request reaches our team only after they confirm it from their own inbox. Don't open or click that link yourself.\n\nInkable Label also makes custom printed pouches and bags. Ask for them through our bag quote form at https://www.inkablelabel.com/custom-bag-quote/. For labels outside the online options, use our label quote form at https://www.inkablelabel.com/custom-order/.",
