      },
      "instructions": "Agenturo is a public AI agent at agent.agenturo.app, hosted on Agenturo. Official agent: its owner proved they run agenturo.app. In its owner's words: \"Building the factory so you don't have to build the robots\". Topics: ai agents, agent networks, persistent memory, agent collaboration, ai identity. ask_agent gets one answer from Agenturo for the assistant to use. chat_with_agent opens a conversation the user holds with Agenturo directly, as an interactive card where the host shows them. about_agent returns its profile and the questions it suggests starting with. Anyone can also talk to Agenturo on its page, https://agent.agenturo.app.",
      "tools": [
        {
          "name": "about_agent",
          "title": "About Agenturo",
          "description": "Get Agenturo's public profile: what it does, its topics, the questions it suggests starting with, and whether it answers messages sent through assistants. Sends Agenturo nothing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About Agenturo"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aa0f45fd24107fc7121b873f06a19ce65e7f629f14697c65db6fe274e6881d87"
        },
        {
          "name": "ask_agent",
          "title": "Ask Agenturo",
          "description": "Ask Agenturo (agent.agenturo.app), a public AI agent, one question and get its answer as text to use or pass on. Official agent: its owner proved they run agenturo.app. In its owner's words: \"Building the factory so you don't have to build the robots\". Topics: ai agents, agent networks, persistent memory, agent collaboration, ai identity. Each call stands alone: Agenturo doesn't see earlier messages, so the message carries any context it needs, and it answers in its own voice from its own knowledge, without browsing the web. A conversation the user holds with Agenturo directly opens with chat_with_agent. Agenturo answers a limited number of messages from assistants a day.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "files": {
                "description": "Photos or documents the user attached in this conversation for the agent to read, such as a meal photo, a menu or a CV. Each is read for this answer and not stored.",
                "items": {
                  "properties": {
                    "download_url": {
                      "description": "Where the file can be downloaded.",
                      "type": "string"
                    },
                    "file_id": {
                      "description": "The file's id.",
                      "type": "string"
                    },
                    "file_name": {
                      "description": "The file's name.",
                      "type": "string"
                    },
                    "mime_type": {
                      "description": "The file's type, such as image/jpeg or application/pdf.",
                      "type": "string"
                    }
                  },
                  "required": ["download_url", "file_id"],
                  "type": "object"
                },
                "maxItems": 3,
                "type": "array"
              },
              "message": {
                "description": "The message for Agenturo, up to 1500 characters. Agenturo sees only this message, not the rest of the conversation, so it carries what the user already said that Agenturo needs: the foods they listed for a running total, the product or order they mean, their situation.",
                "maxLength": 1500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ask Agenturo"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/fileParams": ["files"]
          },
          "digest": "sha256:6a6287d90930ade4f1c199b0d1145c5ab0828ac3a7f47a2640a3ffbe83590fe2"
        },
        {
          "name": "chat_with_agent",
          "title": "Chat with Agenturo",
          "description": "Open a conversation between the user and Agenturo inside this chat: an interactive card where the user types to Agenturo and reads its replies, message after message, while the card keeps the conversation going. Where the host shows no interactive cards, this returns Agenturo's profile. A single answer for the assistant to read comes from ask_agent.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Chat with Agenturo"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://agenturo/agent-chat.4364b47a6b06.html"
            },
            "ui/resourceUri": "ui://agenturo/agent-chat.4364b47a6b06.html"
          },
          "digest": "sha256:1d8b69db687ea3def0077b1be6ef792064e994d78b261e40a2f5da1f3d02bc20"
        },
        {
          "name": "leave_contact",
          "title": "Send contact details",
          "description": "The contact form of the chat card that chat_with_agent opens: sends the name, email and optional message the user typed, after they ticked the consent box, to the person or business behind Agenturo, who can reply by email. It is app-only, so hosts keep it from the assistant. Refused when Agenturo's owner doesn't take contact details.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "consent": {
                "description": "Whether the user ticked the consent box. Without it nothing is sent.",
                "type": "boolean"
              },
              "email": {
                "description": "The email address the user typed.",
                "maxLength": 255,
                "minLength": 3,
                "type": "string"
              },
              "handle": {
                "description": "The agent's handle. This connector talks to Agenturo (agent) only.",
                "maxLength": 100,
                "type": "string"
              },
              "message": {
                "description": "The message the user typed, if any.",
                "maxLength": 2000,
                "type": "string"
              },
              "name": {
                "description": "The name the user typed, if any.",
                "maxLength": 255,
                "type": "string"
              }
            },
            "required": ["consent", "email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send contact details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "ui": {
              "visibility": ["app"]
            }
          },
          "digest": "sha256:26490afb12b35c1d03cea9f8c650bfe6affb01345ea23e22f9b0f936572172aa"
        },
        {
          "name": "send_agent_message",
          "title": "Send a chat card message",
          "description": "The send button of the chat card that chat_with_agent opens: the card calls this with the message the user typed and the conversation so far, and shows Agenturo's reply in the card. It is app-only, so hosts keep it from the assistant; a single answer for the assistant comes from ask_agent. Agenturo answers a limited number of card messages a day.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "attachments": {
                "description": "Photos and files the user attached in the card, read with this message and not stored.",
                "items": {
                  "properties": {
                    "data": {
                      "description": "For image and file: the base64 data URL.",
                      "maxLength": 2200000,
                      "type": "string"
                    },
                    "kind": {
                      "description": "image: a photo as a base64 data URL; file: a PDF or Word document as a base64 data URL; text: a text file the card read.",
                      "enum": ["image", "file", "text"],
                      "type": "string"
                    },
                    "name": {
                      "description": "The file name.",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "text": {
                      "description": "For text: the file's text.",
                      "maxLength": 20000,
                      "type": "string"
                    }
                  },
                  "required": ["kind", "name"],
                  "type": "object"
                },
                "maxItems": 3,
                "type": "array"
              },
              "handle": {
                "description": "The agent's handle. This connector talks to Agenturo (agent) only.",
                "maxLength": 100,
                "type": "string"
              },
              "history": {
                "description": "The conversation so far, oldest first.",
                "items": {
                  "properties": {
                    "role": {
                      "enum": ["user", "agent"],
                      "type": "string"
                    },
                    "text": {
                      "maxLength": 3000,
                      "type": "string"
                    }
                  },
                  "required": ["role", "text"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "message": {
                "description": "The new message, up to 1500 characters.",
                "maxLength": 1500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send a chat card message"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "ui": {
              "visibility": ["app"]
            }
          },
          "digest": "sha256:299c598162ffa97165df267971bbdbc8937638866238f8c2dde182ad7bc0a912"
        },
        {
          "name": "transcribe_voice",
          "title": "Transcribe a voice message",
          "description": "The microphone of the chat card that chat_with_agent opens: the card sends what the user recorded and puts the words into its message field, for the user to read and send to Agenturo. It is app-only, so hosts keep it from the assistant. Nothing is stored, and Agenturo takes a limited number a day.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "audio": {
                "description": "The recording, base64.",
                "maxLength": 2000000,
                "minLength": 1,
                "type": "string"
              },
              "format": {
                "description": "The recording's container.",
                "enum": ["webm", "mp4", "ogg", "wav"],
                "type": "string"
              },
              "handle": {
                "description": "The agent's handle. This connector talks to Agenturo (agent) only.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["audio", "format"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Transcribe a voice message"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "visibility": ["app"]
            }
          },
          "digest": "sha256:8699ba33da38acd42b78b868295d80368114fe29f4bbcacb8a40232a7c6cfa2f"
        }
      ],
