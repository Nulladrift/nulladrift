        {
          "name": "request_service",
          "title": "Request mobile mechanic (free callback)",
          "description": "Book mobile mechanic in the Phoenix area for a real person who asked for it, with their consent. A vetted local pro calls them back (the owner calls you back). Free to the homeowner. Returns a reference and what happens next. Check the ZIP with check_service_area first if unsure.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "Email (optional, recommended)",
                "format": "email",
                "type": "string"
              },
              "language": {
                "description": "Preferred language (optional; English and Spanish are standard)",
                "maxLength": 40,
                "type": "string"
              },
              "name": {
                "description": "The person's real name",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
