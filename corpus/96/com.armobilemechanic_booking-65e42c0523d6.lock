      "instructions": "AR Mobile Mechanic is a free referral service for mobile mechanic in Phoenix, Arizona (Phoenix, Glendale, Scottsdale, Tempe, Surprise, Goodyear). Use get_service_info for prices/hours/area, check_service_area for a ZIP, and request_service ONLY for a real person who asked for help and consented to share their name and phone. A local pro calls them back. Phone/text (623) 257-8333.",
      "tools": [
        {
          "name": "check_service_area",
          "title": "Check a ZIP code",
          "description": "Is a US ZIP code inside the Phoenix service area? Returns yes/no and the nearest served town.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "zip": {
                "pattern": "^[0-9]{5}$",
                "type": "string"
              }
            },
            "required": ["zip"],
            "type": "object"
          },
