{
  "lockfileVersion": 2,
  "subjects": {
    "com.admitbase/admissions": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://admitbase.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "admitbase-mcp",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "AdmitBase MCP exposes admissions data for professional schools (law, medical, dental, MBA, pharmacy, veterinary, optometry). Three tools, all public, no authentication: search_schools, get_school_stats, calculate_match_score.",
      "tools": [
        {
          "name": "calculate_match_score",
          "title": "Calculate match score",
          "description": "Given a user's GPA and test score, calculate match category (Safety/Target/Reach/Far Reach), admission probability, and percentiles for one school or a ranked list. Public — no authentication required.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "atar": {
                "description": "Australian Tertiary Admission Rank (0-99.95). Used instead of test_score/gpa for Australian schools, which select on a published ATAR cutoff.",
                "maximum": 99.95,
                "minimum": 0,
                "type": "number"
              },
              "gpa": {
                "description": "Cumulative GPA on a 4.0 scale (omit for ATAR-based Australian schools)",
                "maximum": 4,
                "minimum": 0,
                "type": "number"
              },
              "limit": {
                "default": 10,
                "description": "Number of top schools to return when no school_slug given",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "program": {
                "description": "Program type",
                "enum": ["law", "medical", "dental", "veterinary", "optometry", "business", "pharmacy"],
                "type": "string"
              },
              "school_slug": {
                "description": "If provided, calculate for this school only. Otherwise returns a ranked list.",
                "type": "string"
              },
              "test_score": {
                "description": "Test score: LSAT 120-180, MCAT 472-528, DAT 1-30, OAT 200-400, GMAT/GRE for MBA. Omit for pharmacy (PCAT retired 2024 — GPA-only) and for ATAR-based Australian schools.",
                "type": "number"
              },
              "work_experience_years": {
                "description": "Years of full-time work experience (MBA programs only)",
                "type": "number"
              }
            },
            "required": ["program"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3cfa346c500eebfa0cfe2723caf224db96c7c9afe5260e95aca9d7b8406b6a8b"
        },
        {
          "name": "get_school_stats",
          "title": "Get detailed school stats",
          "description": "Get full admissions statistics for a specific school: GPA/test percentiles, acceptance rate, class size, tuition, employment outcomes. Public — no authentication required.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "school_name": {
                "description": "School name to search for (partial match). Used when slug is unknown.",
                "type": "string"
              },
              "school_slug": {
                "description": "School slug (e.g. \"harvard-law-school\"). Use search_schools to find slugs.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:139d203fb97835bdc039705d4a78cb67c61155449a9597c12a4f1c044e36e76f"
        },
        {
          "name": "search_schools",
          "title": "Search professional schools",
          "description": "Search professional schools (law, medical, dental, MBA, pharmacy, veterinary, optometry) by program type, name, or ranking range. Returns admissions stats and AdmitBase links. Public — no authentication required.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 20,
                "description": "Maximum number of results (default 20, max 50)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_ranking": {
                "description": "Only return schools ranked below this number",
                "type": "integer"
              },
              "min_ranking": {
                "description": "Only return schools ranked at or above this number",
                "type": "integer"
              },
              "program": {
                "description": "Type of professional school program",
                "enum": ["law", "medical", "dental", "veterinary", "optometry", "business", "pharmacy"],
                "type": "string"
              },
              "query": {
                "description": "School name search (partial match)",
                "type": "string"
              }
            },
            "required": ["program"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9dea7bd49436a05be9f7af4e5a926fd062e8d87f2b95ce4be131a150b8fa3e6d"
        }
      ],
      "digest": "sha256:66587868407faad330d6811eaa39b14e06262f465559c8f6226986f0a1363ece"
    }
  }
}
