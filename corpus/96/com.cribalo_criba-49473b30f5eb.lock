{
  "lockfileVersion": 2,
  "subjects": {
    "com.cribalo/criba": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://criba.cribalo.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "criba",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "criba identifies and classifies the clients that call an MCP server or A2A agent. It keeps two answers apart: who a client declares to be (User-Agent or MCP clientInfo.name, matched against a catalog of known agent-ecosystem bots) and what it actually does (behaviour over its requests). Nothing sent to these tools is stored or logged. Catalog 2026-11-11, CC-BY-NC-4.0 (non-commercial use with attribution). Docs: https://criba.cribalo.com/",
      "tools": [
        {
          "name": "classify_visitor",
          "title": "Classify a visitor",
          "description": "Classify one visitor from its requests to your MCP server, A2A agent or website. Returns the declared identity, the observed behaviour class (acts-on-results, agent-tool-use, agent-message, probe, indexer, web-scanner, web), the signals and reasons, and mismatch=true when behaviour contradicts the declared identity. All event fields are optional; send what your server parsed. At most 500 events.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "events": {
                "description": "One visitor's requests, in order",
                "items": {
                  "properties": {
                    "argsEmpty": {
                      "description": "tools/call with {} or missing required arguments",
                      "type": "boolean"
                    },
                    "canaryHit": {
                      "description": "Visit to a link that only appeared inside a tool or agent result",
                      "type": "boolean"
                    },
                    "clientName": {
                      "description": "MCP clientInfo.name",
                      "maxLength": 500,
                      "type": "string"
                    },
                    "hasText": {
                      "description": "A2A message with text, or MCP call with a free-text intent",
                      "type": "boolean"
                    },
                    "httpMethod": {
                      "maxLength": 500,
                      "type": "string"
                    },
                    "path": {
                      "description": "Request path, without query string",
                      "maxLength": 500,
                      "type": "string"
                    },
                    "protocol": {
                      "enum": ["mcp", "a2a", "web"],
                      "type": "string"
                    },
                    "rpcError": {
                      "description": "JSON-RPC error code returned, if any",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "rpcMethod": {
                      "description": "JSON-RPC method (MCP or A2A), e.g. initialize, tools/list, tools/call, message/send",
                      "maxLength": 500,
                      "type": "string"
                    },
                    "status": {
                      "description": "HTTP status returned",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "tool": {
                      "description": "Tool name of an MCP tools/call",
                      "maxLength": 500,
                      "type": "string"
                    },
                    "toolKnown": {
                      "description": "false if the tool does not exist on the server",
                      "type": "boolean"
                    },
                    "userAgent": {
                      "maxLength": 500,
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["events"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3ddcc00cf555a3f758385b94c883018ed389b792a90d59105c0bca5bc5c0eb02"
        },
        {
          "name": "identify_client",
          "title": "Identify a client",
          "description": "Who a User-Agent and/or an MCP clientInfo.name claims to be, matched against criba's catalog of known MCP indexers, verifiers, A2A directories, AI crawlers, scanners and HTTP libraries. This is a declaration, not proof: use classify_visitor for behaviour. Pass at least one of the two.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "client_name": {
                "description": "MCP clientInfo.name sent in initialize",
                "maxLength": 500,
                "type": "string"
              },
              "user_agent": {
                "description": "HTTP User-Agent header",
                "maxLength": 500,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4b7c525156f81e234626e971b7d98ab0e1a65e2e02975d751d6ab1bab54999d2"
        },
        {
          "name": "list_known_bots",
          "title": "List known bots",
          "description": "List criba's catalog of known agent-ecosystem bots, optionally filtered by category or protocol. Each entry has its id, name, category, URL, matching rules and what it was seen doing. Catalog 2026-11-11, CC-BY-NC-4.0 (non-commercial use with attribution).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "enum": ["mcp-indexer", "mcp-verifier", "a2a-directory", "agent-marketplace", "agent-runtime", "research", "ai-crawler", "security-scanner", "commercial-crawler", "generic-client"],
                "type": "string"
              },
              "protocol": {
                "enum": ["mcp", "a2a", "web"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1908c27ad17a17056d4be73b4985ea6338b6288d7b4095a62b2c3b6ed0355994"
        }
      ],
      "digest": "sha256:b40133cc08e4337131cbd87fef0213c91a624ad7bf309aaf0f6b8b04c8523969"
    }
  }
}
