{
  "lockfileVersion": 2,
  "subjects": {
    "com.cursivepal/generator": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://cursivepal.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.cursivepal/generator",
        "title": "CursivePal – Cursive Generator – Free Script Fonts (PNG & SVG)",
        "version": "1.0.0",
        "websiteUrl": "https://cursivepal.com/developers/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "convert_text",
          "description": "Turn English letters into copyable decorative Unicode. Preserve accents, digits and emoji.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "style": {
                "default": "u-bold-script",
                "enum": ["u-bold-script", "u-script", "u-bold-italic", "u-italic", "u-sans-bold-italic", "u-sans-italic", "u-swirl", "u-bold-fraktur", "u-fraktur", "u-double"],
                "type": "string"
              },
              "text": {
                "maxLength": 150,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c383f3464663098e1f0e04ea42fa328a5ca25b4763bfbc6ddfe527ab9c153720"
        },
        {
          "name": "list_styles",
          "description": "Find lettering font IDs and licenses for PNG/SVG, or style IDs for copyable Unicode.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "kind": {
                "default": "fonts",
                "enum": ["fonts", "unicode"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:34571ea3f92832554da0d84db3e335555898bcb2fad52d6456a0528ee8364763"
        },
        {
          "name": "render_lettering",
          "description": "Generate actual transparent PNG lettering or an SVG with outlined glyphs. Preserve manual line breaks. Select a font that covers the input.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "align": {
                "default": "center",
                "enum": ["left", "center"],
                "type": "string"
              },
              "color": {
                "default": "#141417",
                "pattern": "^#[0-9a-f]{6}$",
                "type": "string"
              },
              "font": {
                "default": "great-vibes",
                "enum": ["great-vibes", "allura", "dancing-script", "sacramento", "parisienne", "satisfy", "pinyon-script", "alex-brush", "herr-von", "tangerine", "caveat", "marck-script", "kalam", "pacifico", "playball", "yellowtail", "playwrite-us-trad", "homemade-apple"],
                "type": "string"
              },
              "format": {
                "default": "png",
                "enum": ["png", "svg"],
                "type": "string"
              },
              "text": {
                "maxLength": 150,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:41d0c54cae1add3f84e18bdf8b7f2c7debecff9bafae9046d0a473bc668133df"
        }
      ],
      "digest": "sha256:f545377f7ee13c34a8199e18a4e7bd330345d5d4f6ce5270689db52516cd254e"
    }
  }
}
