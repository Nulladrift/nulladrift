            "properties": {
              "departure_date": {
                "description": "Required departure date in ISO YYYY-MM-DD form.",
                "title": "Departure Date",
                "type": "string"
              },
              "destination": {
                "description": "Required three-letter destination airport code.",
                "title": "Destination",
                "type": "string"
              },
              "origin": {
                "description": "Required three-letter origin airport code.",
                "title": "Origin",
                "type": "string"
              },
              "return_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional return date in ISO YYYY-MM-DD form for round-trip pricing context.",
                "title": "Return Date"
              },
              "trip_type": {
                "default": "round_trip",
                "description": "Optional trip context: round_trip (default) or one_way.",
                "title": "Trip Type",
                "type": "string"
              }
            },
            "required": ["departure_date", "destination", "origin"],
            "title": "search_published_charter_flights_for_mcpArguments",
            "type": "object"
          },
