      "instructions": "Provides read-only published charter route and flight information.",
      "tools": [
        {
          "name": "get_charter_route",
          "description": "Look up a published Cuba Te Espera charter route by origin and destination IATA code. It never returns live availability, schedules, or fares.",
          "inputSchema": {
            "properties": {
              "destination_iata": {
                "pattern": "^[A-Za-z]{3}$",
                "title": "Destination Iata",
                "type": "string"
              },
              "locale": {
                "default": "en",
                "enum": ["en", "es"],
                "title": "Locale",
                "type": "string"
              },
              "origin_iata": {
                "pattern": "^[A-Za-z]{3}$",
                "title": "Origin Iata",
                "type": "string"
              }
            },
            "required": ["destination_iata", "origin_iata"],
            "title": "get_charter_route_for_mcpArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "AirportOutput": {
                "additionalProperties": false,
                "properties": {
                  "city": {
                    "title": "City",
                    "type": "string"
                  },
                  "iata": {
                    "title": "Iata",
                    "type": "string"
                  }
                },
                "required": ["city", "iata"],
                "title": "AirportOutput",
                "type": "object"
              },
              "CharterRouteOutput": {
                "additionalProperties": false,
                "properties": {
                  "destination": {
                    "$ref": "#/$defs/AirportOutput"
                  },
                  "destination_guide": {
                    "$ref": "#/$defs/DestinationGuideOutput"
                  },
                  "last_updated": {
                    "title": "Last Updated",
                    "type": "string"
                  },
                  "localized_urls": {
                    "$ref": "#/$defs/LocalizedRouteUrlsOutput"
                  },
                  "origin": {
                    "$ref": "#/$defs/AirportOutput"
                  },
                  "route_key": {
                    "title": "Route Key",
                    "type": "string"
                  },
                  "search_url": {
                    "title": "Search Url",
                    "type": "string"
                  },
                  "service_type": {
                    "title": "Service Type",
                    "type": "string"
                  },
                  "status": {
                    "title": "Status",
                    "type": "string"
                  }
                },
                "required": ["destination", "destination_guide", "last_updated", "localized_urls", "origin", "route_key", "search_url", "service_type", "status"],
                "title": "CharterRouteOutput",
                "type": "object"
              },
              "DestinationGuideOutput": {
                "additionalProperties": false,
                "properties": {
                  "city_slug": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "title": "City Slug"
                  },
                  "city_url": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "title": "City Url"
                  },
                  "province_slug": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "title": "Province Slug"
                  },
                  "province_url": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "title": "Province Url"
                  }
                },
                "required": ["city_slug", "city_url", "province_slug", "province_url"],
                "title": "DestinationGuideOutput",
                "type": "object"
              },
              "LocalizedRouteUrlsOutput": {
                "additionalProperties": false,
                "properties": {
                  "en": {
                    "title": "En",
                    "type": "string"
                  },
                  "es": {
                    "title": "Es",
                    "type": "string"
                  }
                },
                "required": ["en", "es"],
                "title": "LocalizedRouteUrlsOutput",
                "type": "object"
              }
            },
            "additionalProperties": false,
            "properties": {
              "found": {
                "title": "Found",
                "type": "boolean"
              },
              "route": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/CharterRouteOutput"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["found", "route"],
            "title": "GetCharterRouteOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c07d8ffe6fcaed1f852a17a5484866c0c5c388da0c8f3209a55c0880624f27f9"
