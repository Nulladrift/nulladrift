{
  "lockfileVersion": 2,
  "subjects": {
    "co.crossandcovenant/bible": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://crossandcovenant.co/api/mcp/bible"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "cross-covenant-bible",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Public-domain Bible text (World English Bible and King James Version), Bible reading plans, and a daily devotional from Cross + Covenant. All tools are read-only.",
      "tools": [
        {
          "name": "get_devotional",
          "title": "Get the devotional",
          "description": "Returns the Cross + Covenant daily devotional for a date: a scripture passage in the World English Bible or King James Version, a short reflection, and a prayer. Defaults to today in Mountain Time. On a date without a devotional available here, returns that day's scripture instead.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "description": "Date in YYYY-MM-DD form. Defaults to today in Mountain Time.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the devotional"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2f65f8e0b1f8ed811fd2c43b7cfae11fefc5e013cf63fee106ba5e296a3f5837"
        },
        {
          "name": "get_passage",
          "title": "Get a Bible passage",
          "description": "Returns the text of a Bible passage from the World English Bible or the King James Version, both public domain. Accepts a verse, a range, whole chapters, or several references joined with \";\" (for example \"John 3:16\", \"Psalm 23\", \"Romans 8:28-39\", \"1 Cor 13:4-7; Micah 6:8\"). Up to 150 verses or 2 chapters per call; a longer request returns the first part and names the rest.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "reference": {
                "description": "Bible reference, for example \"John 3:16-21\", \"Psalm 23\", or \"Genesis 1-2\".",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "translation": {
                "description": "Translation: \"web\" (World English Bible, the default) or \"kjv\" (King James Version).",
                "enum": ["web", "kjv"],
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a Bible passage"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6493b3dec31ca9ea4013636e5c57d98275b1edaf7d5982f2bde8084ea6a0a0ae"
        },
        {
          "name": "get_reading_plan_day",
          "title": "Get a reading plan day",
          "description": "Returns the passages for one day of a Cross + Covenant reading plan, by day number or, for the one-year M'Cheyne plan, by calendar date (today in Mountain Time when neither is given). With include_text, also returns the passage text (up to 150 verses) in the World English Bible or King James Version.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "description": "Calendar date in YYYY-MM-DD form. One-year plan only.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "day": {
                "description": "Day number in the plan, starting at 1.",
                "maximum": 366,
                "minimum": 1,
                "type": "integer"
              },
              "include_text": {
                "description": "Also return the text of the day's passages. Default false.",
                "type": "boolean"
              },
              "plan_id": {
                "description": "Plan id: \"mcheyne\" (one year) or a topical plan id.",
                "enum": ["mcheyne", "hope", "peace", "strength", "psalms", "life-of-jesus"],
                "type": "string"
              },
              "translation": {
                "description": "Translation: \"web\" (World English Bible, the default) or \"kjv\" (King James Version).",
                "enum": ["web", "kjv"],
                "type": "string"
              }
            },
            "required": ["plan_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a reading plan day"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8b1e713e778804625b760eeb00b4b86cb2e353097fa47b6770d6875dbd8f0ae6"
        },
        {
          "name": "list_reading_plans",
          "title": "List reading plans",
          "description": "Lists the Cross + Covenant Bible reading plans: the M'Cheyne one-year plan, which follows the calendar, and five short topical plans (hope, peace, strength, the Psalms, the life of Jesus). Gives each plan's id, length and purpose.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List reading plans"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a77daced42d8d1a620e0de112d0010da8faff292d4adfa2f3e3e8d2124cc4d95"
        },
        {
          "name": "search_scripture",
          "title": "Search scripture",
          "description": "Finds Bible verses containing the given words in the World English Bible or the King James Version, ranked by how closely each verse matches. Common words are ignored, and a word also matches longer forms (fear matches fears and feared). Can be limited to one book or one testament.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "book": {
                "description": "Limit to one book, for example \"Psalms\" or \"John\".",
                "maxLength": 40,
                "type": "string"
              },
              "limit": {
                "description": "How many verses to return, 1 to 25. Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to find, for example \"do not be afraid\" or \"living water\".",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "testament": {
                "description": "Limit to the \"old\" or \"new\" testament.",
                "enum": ["old", "new"],
                "type": "string"
              },
              "translation": {
                "description": "Translation: \"web\" (World English Bible, the default) or \"kjv\" (King James Version).",
                "enum": ["web", "kjv"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search scripture"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dcec72fb738313f127897e337bf235dbf06208f8058dfa884c0751da4ade64eb"
        }
      ],
      "digest": "sha256:49dcea1d22dca7f619c46746130af469c1ba2d86479f5b66a92ff24f88bf7451"
    }
  }
}
