          "title": "2026 Healthcare B2B Advertising Price Index",
          "description": "Aggregate ad-price benchmarks (CC BY 4.0) across healthcare B2B rate cards: median/quartile entry prices and derived CPMs (rounded, or banded; medians only for groups with 5+ rate cards), by format, category and price band. Optionally filter by group_type (all, format, category, entry_price_band) or group name.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "group": {
