          "digest": "sha256:cf57f992d2dc273943d91349db8084575cc9554141642e138f75d7942893140a"
        },
        {
          "name": "get_publication",
          "title": "Get one publication",
          "description": "Public details for one publication: publisher, audience, circulation, open rate/CTR, entry ad unit with price band, names of other ad units, rate-card year, last verified date, official media kit link and page URL. Look up by slug or (partial) name.",
