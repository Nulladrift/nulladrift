      "instructions": "Read-only access to RateCard Health public data: healthcare B2B trade-publication ad rate cards (price bands), the 2026 price index (aggregates) and the free 10-row sample. Exact prices for all rows require the paid dataset: https://www.creem.io/payment/prod_1rX1CHWqts6KIgDD5lAk9f",
      "tools": [
        {
          "name": "get_free_sample",
          "title": "Free 10-row sample",
          "description": "The 10 free sample rows of the RateCard Health database (full fields, exact prices) — the same rows as the public sample CSV.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
