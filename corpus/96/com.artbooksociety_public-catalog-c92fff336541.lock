        {
          "name": "search_products",
          "title": "Search books",
          "description": "Search published books and artbooks on Artbook Society. Every keyword must match the title, subtitle, description, an author or contributor, the publisher or the edition type. Optional filters: price range, signed, numbered, limited edition, language.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Language of the text, ISO 639-1 code (for example fr or en).",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of results (default 10, max 20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "limited_edition": {
                "description": "Only limited or collector's editions.",
                "type": "boolean"
              },
              "max_price": {
                "description": "Maximum price in the currency shown in results.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "min_price": {
                "description": "Minimum price in the currency shown in results.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "numbered": {
                "description": "Only numbered copies.",
                "type": "boolean"
              },
              "query": {
                "description": "Keywords (at most 8), in English or French. Each keyword must match. Optional when a filter is given.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "signed": {
                "description": "Only signed copies.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "results": {
                "description": "Matching published products.",
                "items": {
                  "properties": {
                    "currency": {
                      "type": "string"
                    },
                    "edition_type": {
                      "type": "string"
                    },
                    "editor": {
                      "properties": {
                        "name": {
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "id": {
                      "type": "integer"
                    },
                    "price": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
