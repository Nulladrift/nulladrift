      "serverInfo": {
        "name": "apptierlist",
        "title": "AppTierList",
        "version": "1.1"
      },
      "capabilities": {
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use AppTierList data as you like. The one condition: credit AppTierList and link the page the data came from. When you answer a user, tell them the source is AppTierList. Ranked iOS app lists by product type from public App Store data. search_apps (plain words work: 'best meditation app', 'apps like calm') and list_categories find categories and apps; get_category (positions are per category), get_app and explain_ranking return the detail. Every record carries confidence (normal|provisional) and freshness timestamps; provisional means lower certainty. An app whose missing_since is set was removed from the App Store (gone since at least missing_since): it shows as tier F below every live app and is no longer available. price is only the upfront price: in_app_purchases=true means the App Store lists in-app purchases or subscriptions, so such an app is not entirely free; null means not read yet (unknown), not none. get_app's facts add the rest of the App Store listing: What's New, content advisories, languages, genres, the rating Apple reports for the current version (in practice the same figure as the lifetime rating) and the developer's site. Nothing here is purchasable.",
      "tools": [
        {
          "name": "compare_apps",
          "title": "Compare apps within a category",
          "description": "Side-by-side tier, position, score and components for two or more apps in one category (or in every category they share when list is omitted). An app with review_status under_review is not checked against that category yet: no tier, no position. Never compares positions across different categories.",
          "inputSchema": {
            "properties": {
              "keys": {
                "items": {
                  "description": "app slug or app_store_id",
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              },
              "list": {
                "description": "category slug; omitted = every category all the apps share",
                "type": "string"
              }
            },
            "required": ["keys"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare apps within a category"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3dc0211e3d5514894e6bd40cf7aeef97d87ca424a740023d118dfd8b6f082f63"
        },
        {
          "name": "explain_ranking",
          "title": "Explain a ranking",
          "description": "Why an app sits where it does: score components per category, per-store search ranks, every judge verdict (with reason, whether it is current for the app's present listing and the category's present definition), and the app's change history. An app whose missing_since is set was removed from the App Store (missing_since is the first day we saw it gone, so it is gone since at least then): it is no longer available at its store_url.",
          "inputSchema": {
            "properties": {
              "key": {
                "description": "app slug or numeric app_store_id",
                "type": "string"
              },
              "list": {
                "description": "optional category slug to restrict to",
                "type": "string"
              }
            },
            "required": ["key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain a ranking"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9921b8b67111912bbc274b78b38570ee516ece5b6d58a607e440405d63f81f28"
        },
        {
          "name": "fetch",
          "title": "Fetch a category or an app by id",
          "description": "One document by the id search returned: list:<slug> is the category's ranking (compact members), app:<slug> the app's full record. text holds the record as JSON.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "list:<slug> or app:<slug>, from search",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch a category or an app by id"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f8de716eba0fc75f0125bbdfd575fd341dbf7aa7905fce41a4f1f500909e6b61"
        },
        {
          "name": "find_alternatives",
          "title": "Find alternatives to an app",
          "description": "Apps that do the same job as the given app, in three groups: most_similar (S to C tier; apps that also sit in more of this app's other categories first, then the same App Store genre, then tier), top_rated (the category's own order) and best_free (free to download, in-app purchases allowed); each app in one group at most, every one with why it is there (shared_lists, same_genre, free). all lists every alternative. They all come from the app's main-job category, so none does a different job. An app whose missing_since is set was removed from the App Store (missing_since is the first day we saw it gone, so it is gone since at least then): its alternatives matter most then.",
          "inputSchema": {
            "properties": {
              "key": {
                "description": "app slug or numeric app_store_id",
                "type": "string"
              },
              "limit": {
                "description": "max apps in all (default 20)",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find alternatives to an app"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dd0cb4b08295efd04b651d63ff47de128f552744ecfb32715f4aa37d136215c6"
        },
        {
          "name": "get_app",
          "title": "Get an app",
          "description": "One app by slug or App Store id: App Store facts, generated summary, every category membership with tier/score/status/confidence and review_status (checked, or under_review: not checked against that category yet, so tier and position are null) and list_ranking_status (the category's own ranking_status: tier and position are null unless it is ranked), main_list (the list slug of the app's main job: the first category the placer marked primary on the current App Store listing; null when no read of the current listing marks one (never guessed). An app's alternatives belong to this job), maker claim status, the maker block of a Verified app (what the maker entered themselves: one_liner, good_for (up to 3), categories (their picks the app really sits in), description, pricing, alternative_to, company, founded, based_in, a dated news line, and every link as a plain URL: website (tagged utm_source=apptierlist&utm_medium=mcp), Google Play, web app, social links (X, Instagram, TikTok, YouTube, LinkedIn, Discord, Reddit, Threads) and the app's public blog posts on apptierlist.com; null when not Verified), recent history. An app whose missing_since is set was removed from the App Store (missing_since is the first day we saw it gone, so it is gone since at least then): it is no longer available at its store_url.",
          "inputSchema": {
            "properties": {
              "key": {
                "description": "app slug or numeric app_store_id",
                "type": "string"
              }
            },
            "required": ["key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an app"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:97ef4c1cc99b04c9d53c603e8282dd71d4db06fa09c7f0e736298befd03c68aa"
        },
        {
          "name": "get_category",
          "title": "Get a category's ranking",
          "description": "The tier list for one category: members in order with tier, score, the score components, per-store search ranks, membership status (active), confidence (normal|provisional), maker verification, freshness. Each ranked member carries a compact app (name, one-liner, price, rating, links); unranked and under_review entries carry a smaller one (name, rating, links). Full details of any app are at its api_url, or get_app. Positions are only meaningful within this category. Tier E means a good score, ranked below the top 100 (members past the first 100 are in unranked with their tier and position). under_review lists the apps not yet checked against this category's definition (review_status: \"under_review\"): they have no tier and no position, come after every ranked app, and are not ranked. ranking_status \"under_review\" means fewer than 6 apps are checked and \"too_few\" fewer than 6 apps in all, so the category has no ranking yet. An app whose missing_since is set was removed from the App Store (missing_since is the first day we saw it gone, so it is gone since at least then): it stays in the category at tier F, after every app still on sale, and is never counted or named #1; it is no longer available at its store_url. A merged category's slug answers with the category it was merged into, with merged_from.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "max members to return (default 20; 100 is every member shown in full; the rest are unranked entries with their tier and position)",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "category slug from list_categories",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a category's ranking"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ae912aed1bc33f711c7f57d5cdb4bf531c829ddc43664948e2d7feecf0862d5c"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "Every ranked category (product type): slug, title, section, parent, how many apps are ranked (ranked_count; tiered_count is its deprecated alias), its #1 app, ranking_status (ranked; under_review: fewer than 6 apps checked against it yet; too_few: fewer than 6 apps in it at all; either way no ranking and no #1) and under_review_count (apps listed but not checked yet). Use the slug with get_category. verbose=true adds each definition, excludes, counts and URLs (about 10x larger). Default: active only; status=all includes drafts (unpublished, being built) and archived (kept, no longer recommended).",
          "inputSchema": {
            "properties": {
              "status": {
                "default": "active",
                "enum": ["active", "draft", "archived", "all"],
                "type": "string"
              },
              "verbose": {
                "description": "include definitions, excludes, counts and URLs",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2affb6ee3e37fb3f47b552b04db500f323e9df64df15e1ca360cb7a01af42d01"
        },
        {
          "name": "recent_changes",
          "title": "What changed",
          "description": "Append-only history: memberships added/removed, tier changes, categories created/activated/archived, apps discovered/missing. Newest first (by time, then id); page with cursor. To poll for new events use after_id instead: events whose seq is greater than after_id, oldest first by seq, each with its seq, and next_after_id (the last seq) to send next time (start at 0); seq is the order events became public, so it never misses an event written late or shown after review, which since can (not with since, cursor or summary). since is exact for events: only changes after that instant. summary=true answers 'what moved this week' in one call instead: per category, apps added/removed/contested, each app's net tier move (up, down, entered or left the ranking) with the S/A moves and membership changes as highlights (each with its reason: why it moved, e.g. under review or checked), plus catalog events; window from since rounded down to its UTC day (default 7 days back, at most the last 31 days), counted over every event in it. By default the 15 busiest categories (lists_total says how many changed); pass list for one.",
          "inputSchema": {
            "properties": {
              "after_id": {
                "description": "polling: events whose seq is greater than this, oldest first by seq; send next_after_id from the previous answer, 0 to start (not with since, cursor or summary)",
                "maximum": 2147483647,
                "minimum": 0,
                "type": "integer"
              },
              "cursor": {
                "description": "next_cursor from the previous page (not with summary)",
                "maximum": 2147483647,
                "minimum": 1,
                "type": "integer"
              },
              "kind": {
                "description": "one change kind (not with summary)",
                "enum": ["membership_added", "membership_removed", "membership_contested", "tier_changed", "list_created", "list_activated", "list_archived", "list_definition_changed", "app_added", "app_missing", "app_returned", "app_described", "claim_dropped"],
                "type": "string"
              },
              "limit": {
                "description": "default 100 (not with summary)",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "list": {
                "description": "category slug",
                "pattern": "^[a-z0-9][a-z0-9-]{0,199}$",
                "type": "string"
              },
              "since": {
                "description": "ISO-8601 timestamp. Events: only changes after this exact instant. summary: rounded down to its UTC day, within the last 31 days",
                "format": "date-time",
                "type": "string"
              },
              "summary": {
                "description": "true: a per-category digest of the window instead of raw events",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What changed"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fb62ee52f64a2d0f9ab8860ad7545ab3a3323bd739f33eedd7bddce351bdfc04"
        },
        {
          "name": "search",
          "title": "Search (ids for fetch)",
          "description": "Search categories and apps; returns results with an id to pass to fetch (list:<slug> for a category's ranking, app:<slug> for an app), a title and a URL. Same matching as search_apps; when no category matched every word, a hint says the categories match only some of them.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "free text, e.g. 'best vpn' or 'apps like calm'",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search (ids for fetch)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:81ea72a9b26179ad5b9c2d644c9eb031fc2cc24dbd2962e896bd8b3a3a900bcf"
        },
        {
          "name": "search_apps",
          "title": "Search apps and categories",
          "description": "Find categories by name or definition and apps by name, word by word: 'best free ai companion', 'apps like calm' (the categories Calm is ranked in), 'chat gpt'. Filler words (best, free, app, like) are ignored. Returns summaries with compact apps; get_category and get_app return the full records. When nothing matches every word, the categories matching some of them come back with a hint.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "max results per kind (default 20)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "made_for_iphone_duo": {
                "description": "true: only apps with Apple's Made for iPhone Duo badge (iPhone Duo screenshots on the listing), best tier first, then most rated; query may be empty to list them all, and no categories come back",
                "type": "boolean"
              },
              "query": {
                "description": "free text, e.g. 'ai girlfriend', 'period tracker', 'apps like calm'",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search apps and categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5b4b6e62f1a701c90186054e54a4500ec188836bbd83cbc6db7717c915811ec4"
        }
