      "serverInfo": {
        "name": "dream-is-free-app",
        "title": "Dream Is Free Commerce MCP",
        "version": "",
        "description": "Shop Dream Is Free: find products, view specifications, recommend matching products with Complete the Look, and manage cart and checkout through interactive UIs."
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Route this store's shopper requests to its UI tools: pairing/matching a referenced product -> render_complete_the_look; product details/specifications -> render_product_detail; browsing -> render_product_search; cart -> render_cart; sizing -> render_size_guide. Call the matching tool rather than answering live store-product requests from memory. Reuse known current-store product IDs; ask which product if 'this' is ambiguous. Do not open extra search/detail UIs for a pairing request. Every request to show, open, view, review, or check the shopper's cart MUST call render_cart. Never answer a cart-view request with text alone and never infer that a bootstrap cart contract is an empty cart. Use render_product_search only for catalog discovery. For one requested product category or concept, call render_product_search exactly once and show that result; do not repeat or rephrase the same search. When the shopper explicitly requests multiple distinct categories, such as pants and shirts, use one search if one faithful query can return both categories; otherwise call render_product_search once per distinct category. Do not split synonyms, colours, styles, audiences, or alternative phrasings into separate searches. An empty search is a valid result: show its explanation and ask before broadening the query or removing constraints; do not automatically issue another search. Do not automatically call render_product_detail for products returned by a discovery search to rank, compare, validate, or explain the recommendations. Call render_product_detail only when the shopper explicitly asks to view, inspect, review, or get specifications for one exact product, or selects one search result. For a shopper-facing exact product request, call render_product_detail directly with the product_id when known or the exact product-name query when it is not; do not call render_product_search first merely to resolve an exact product. The product_details tool is app-only and must not be used as a shopper-facing renderer. Use render_product_search, render_product_detail, render_cart, render_size_guide, render_complete_the_look, and render_action_confirmation when an interactive UI would improve comparison, selection, or cart editing. Use render_size_guide whenever the user asks for a size guide, size chart, measurements, pants sizing, or shoe-size conversion. Pairing intent includes indirect follow-ups such as 'what can I pair with this?', 'what can I match?', 'suggest a suitable pair', 'recommend matching products', and 'what would go well with it?'. When the subject product is clear, use render_complete_the_look even if the shopper does not say the tool name or ask for a UI. A generic request such as 'suggest good pants' without a subject product is discovery, not Complete the Look. For one subject product, call render_complete_the_look exactly once. For multiple explicitly named subject products, call it at most once per subject. Do not call it automatically after product discovery, and do not additionally render product search or product detail merely to prepare, validate, rank, or explain its recommendations. Call render_complete_the_look directly with a known current-store product_id or the subject's exact product title in query, not the whole pairing request or the desired matching category. It resolves the title internally; do not render product search first merely to resolve that product. If the subject is unknown or several products could be meant, ask which product instead of guessing. Use the returned store recommendations, not invented matches. If no pairs are returned, explain that limitation; do not automatically open another UI. Cart identity is private app state; do not request, repeat, or invent cart IDs or session IDs. All commerce actions must route through this MCP server's tools.",
