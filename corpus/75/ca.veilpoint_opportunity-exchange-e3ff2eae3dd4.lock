          "description": "Run Business Health on a real business from details you supply — the free public check. Use this when someone asks about *their own* business: it needs no account, stores nothing, and creates no record. Supply the website to unlock the nine checks that read the site. OEX asserts nothing about the business and holds no record of it; the report describes the details given and the site named. For experimenting with the workflow instead, use create_sandbox_business.",
          "inputSchema": {
            "properties": {
              "address": {
                "type": "string"
              },
              "category": {
                "description": "What the business does.",
                "type": "string"
