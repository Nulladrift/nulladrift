        {
          "name": "find_potential_customers",
          "description": "Find businesses whose published purchasing categories match the categories a business has published as things it can supply. Returns potential_compatibility only: it is not a customer list, and a business appearing in it has expressed no interest in anything. Nothing is matched on industry. Withheld categories on either side are excluded.",
          "inputSchema": {
            "additionalProperties": false,
