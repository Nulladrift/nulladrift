          "description": "What OEX has asked about a subject, what it could not conclude, why, and which registered question logically follows. Governed and deterministic: every field is a typed governed value or a fixed catalogue constant, no model is invoked, and nothing is derived from prose. This is not a work queue — it carries no identifiers to act on, and OEX accepts no report that a dependency was addressed. A dependency stops being reported when the same question, asked again against changed governed evidence, no longer derives it. Use investigate_economic_question or the subject’s own resource for the facts; this reports only what remains unresolved. Follow only nextInquiries; awaiting_evidence means stop until admissible evidence changes. evidenceRequirements names public question prerequisites without exposing private sources. Already evaluated questions are replaced by their blockers.",
