      "instructions": "VeilPoint Opportunity Exchange is economic-intelligence infrastructure for businesses, places, industries, workforce, demand and supply, with governed public evidence, a structured economic graph, and AI-ready access. It connects municipal economies, industries, businesses, workforce demand, wages, housing, trade, facilities, training and emerging activity; job postings are analyzed as labour-demand evidence rather than marketplace inventory. The model is geographically extensible; Saskatchewan is the current evidence footprint, alongside national occupational, wage, vacancy and housing reference data. Every result carries meta.dataStatus — check it before treating figures as measured. For a multi-domain natural-language question, start with investigate_economic_question; inspect its plan, limitations, and nested evidence before synthesis. Resolve user language to a canonical OEX entity before joining datasets. A missing fact is unknown, never zero or false. OEX marks a comparison comparable only when every material observation has compatible concepts, units, geography, and periods. Read meta.evidence before quoting a result, preserve material qualifications, and cite the canonical URL returned with the resource. Atomic public graph assertions also carry citation.id and citation.resolver; resolve either through /api/v1/citations/{citationId} or resolve_citation instead of reconstructing provenance from display text. 64 upstream datasets are registered; 58 are approved for defined uses. 21 runtime providers: 19 runtime providers serve published evidence: Advertised job demand, Community business counts, Community GDP engine, Cost of living, Education and apprenticeship pipeline, Geography, Hiring employers, Housing value and supply evidence, Job postings, Market Basket Measure costs, Municipal business licences, National occupational projection context, Occupational skills and requirements, Open-source economic signals, Rents, Trade, Training catalogue, Training pathways and crosswalks, Wages & vacancies. No runtime provider serves preview evidence. 2 runtime providers are empty. Do not use preview figures for employment, investment, or policy decisions; check each record's provenance and /about/data. OEX answers two different kinds of question. (1) Regional economic intelligence for Saskatchewan and Canada — wages, rents, hiring, trade, procurement, GDP, licensed businesses and the relationships between them. Start with investigate_economic_question for anything open-ended, or resolve_entities when you have a name and need the canonical id. Every investigation also returns an `inquiry` block, and inspect_knowledge_frontier reaches the same thing directly for one subject: the registered questions OEX asked, what it could not conclude and why, the governed dependency standing in the way where naming it is safe, what class of evidence would resolve it, and which registered question follows. Following one of those and asking again is the loop OEX is built around — an answer that changes because the evidence changed, never because anything was marked. It is not a task list: it carries no identifiers to act on and OEX accepts no report that a dependency was addressed. (2) Business Health: a diagnostic OEX runs for an individual business, reporting what is wrong with how it appears in public data, what to do about it, and verifying the fix. Call list_health_capabilities first to see what it can inspect, fix, generate and verify — it is generated from the check registry, so it never promises something OEX cannot do. To try the workflow, call create_sandbox_business and then get_business_health — sandbox subjects are synthetic and let you walk the whole thing, including correcting the record and rechecking; run_business_study composes the deeper three-instrument analysis over the same evidence, and check_opportunity_readiness reports, for each public procurement notice whose categories overlap what the business publishes, what about its representation is in order and what is not — each gap naming the health check that owns it. OEX never scores a business numerically, and reports \"we could not look\" as distinct from \"we looked and found nothing\". Findings about a real business can be acted on directly on that business's own website; changing what OEX itself publishes requires claiming the record, which only a person can do — explain_business_claim describes how.",
