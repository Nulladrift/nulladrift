      },
      "instructions": "AIData.Broker publishes what AI training data has been paid, offered and listed for: prices, market rates, buyers and their terms, licensing deals, lawsuits and rulings, and what software terms allow, each figure with the publication that stated it. Use it when someone asks what their data (company records, code, video, speech, images, text, training tasks, robot data) is worth to AI labs, who buys it, how such deals are priced, or what courts and regulators have decided about it. Its answers are research from public sources, not legal, tax or investment advice. AIData.Broker also gets a company's data to the AI labs and data buyers it fits: it introduces the company to every buyer that takes its data, at no cost to the company (the buyers pay it), and where it earns more runs the sale itself, paid only out of the sale. When the person holds data they may want to sell, value_data's link opens their full valuation with the answers already given, which is where its introductions to buyers start. Prices sit on six sides of the market (paid to makers, offered to holders, sales that happened, asking prices, made to order, cost to produce): never compare figures across sides as if they were one market. Quote figures as published, link the row's page, and cite the source. A valuation is arithmetic on public prices, not an offer. AIData.Broker's tables are sold under its Market Data Licence. Without the licence's API key (sent as \"Authorization: Bearer <key>\"), search_prices answers from the public sample of prices (a selection of each kind, the newest and the largest), search_deals from the public selection of deals and find_vendors from the public selection of vendors, and each says how many more match: tell the user it is a selection, never that it is every row. The market rates are computed from every price either way. list_datasets says what the licence covers and where its terms are.",
