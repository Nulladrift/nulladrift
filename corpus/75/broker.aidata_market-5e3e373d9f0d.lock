        {
          "name": "value_data",
          "title": "Value a holding of data from public prices",
          "description": "What published prices imply for a holding of data: a low-to-high range in US dollars with the arithmetic behind it. Call it first with only `kind` to get the questions and their answer ids, ask the holder, then call again with `answers`. Questions not answered are taken at their defaults and marked as assumed. Where enough companies have valued the same kind with us, `our_valuations` gives what our full valuation gave them (the middle and the middle half). An indication, not an offer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "answers": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Answer ids by question id, as returned in `questions` (for video, for example {\"hours\": \"1000-10000\"}); every answer is one of the listed answer ids, sent as text.",
                "type": "object"
              },
              "kind": {
                "description": "What is being valued: records (Company records), code (Codebases), video (Video and footage), speech (Audio and speech), images (Images), text (Text and archives), robotics (Robot and physical-world data), environments (Simulated environments), tasks (Graded tasks and benchmarks).",
                "enum": ["records", "code", "video", "speech", "images", "text", "robotics", "environments", "tasks"],
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
