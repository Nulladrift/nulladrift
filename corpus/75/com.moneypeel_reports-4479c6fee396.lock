        {
          "name": "get_report",
          "title": "Read a report",
          "description": "Read one published report as Markdown: positioning, marketing, growth plays, social, timeline and takeaways. Requires a connected MoneyPeel account. **This call is metered**: each successful read spends one read from the monthly allowance, a single chapter costs the same one read, and reading the same report again spends another. Free accounts get 2 reads per UTC month. Screen with search_reports / list_reports first — they cost nothing — and read only the reports the user actually needs; a failed lookup or a not_found never spends a read. The 'billing.readCharged' field in the result states whether this call spent one (0 means it was a retry inside the idempotency window). It has one authoritative report-content date: reportContentAsOf; reportResearchAsOf and dataAsOf are deprecated aliases carrying the same value, so never present two research dates. Every chapter carries leadAsOf, snapshotType and figuresAsOf: a lead that quotes money, percentages or subscription counts is a historical_research_snapshot, not current revenue. The source block also carries schemaVersion and dataPolicyVersion.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "chapter": {
                "description": "Read just this chapter (1-6) instead of the whole report.",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "lang": {
                "description": "Report language; defaults to zh.",
                "enum": ["zh", "en"],
                "type": "string"
              },
              "slug": {
                "description": "Report slug, e.g. \"chatbase\".",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "billing": {
                "additionalProperties": false,
                "properties": {
                  "chapter": {
                    "type": ["number", "null"]
                  },
                  "idempotentReplay": {
                    "type": "boolean"
                  },
                  "monthlyLimit": {
                    "type": "number"
                  },
                  "monthlyRemaining": {
                    "type": "number"
                  },
                  "readCharged": {
                    "anyOf": [
                      {
                        "const": 0,
                        "type": "number"
                      },
                      {
                        "const": 1,
                        "type": "number"
                      }
                    ]
                  },
                  "resetAt": {
                    "type": "string"
                  }
                },
                "required": ["chapter", "idempotentReplay", "monthlyLimit", "monthlyRemaining", "readCharged", "resetAt"],
                "type": "object"
              },
              "chapters": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "figuresAsOf": {
                      "description": "NEW-MCP-104: the date the lead figures belong to — the chapter summary capture date when the lead quotes a figure, null when it quotes none. Not the report content date.",
                      "type": ["string", "null"]
                    },
                    "index": {
                      "type": "number"
                    },
                    "lead": {
                      "type": "string"
                    },
                    "leadAsOf": {
                      "type": ["string", "null"]
                    },
                    "snapshotType": {
                      "description": "The released two-value chapter snapshot label. current means snapshotTypeDetail=current; historical_research_snapshot covers both historical and mixed details. Read snapshotTypeDetail for the precise reading.",
                      "enum": ["current", "historical_research_snapshot"],
                      "type": "string"
