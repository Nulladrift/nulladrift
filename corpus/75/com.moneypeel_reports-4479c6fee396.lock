        {
          "name": "search_reports",
          "title": "Search reports",
          "description": "Search public revenue reports by keyword and/or structured filters. No account needed, no reads spent. Pass \"query\" for text (name, domain, description) and/or filters such as minMrr or businessModel; at least one of the two is required — to browse the library instead, use list_reports. A filter on a missing value excludes the row (a null MRR is not $0). Each row carries mrr, revenue30d, business model, metric-level evidence type, a revenue snapshot date, revenue freshness, a dataQuality flag, a public preview link and the metered full-report link — often enough to answer without reading a report. When dataQuality.status is \"needs_review\", quote the caveat before the numbers. When revenueEligibleForRanking is false the amount is stale and must not be cited as current. Structured filters: businessModel, minMrr / maxMrr, minRevenue30d / maxRevenue30d, revenueFreshness, market, economicBasis, basisDetermination, dataQualityStatus, evidenceType, plus sortBy (revenue, mrr, name, growth) and growthWindow. `evidenceType` keeps a row only when every figure it reports (MRR and/or the 30-day amount) carries one of the requested metric-level types; a missing figure is skipped rather than counted as `unknown`. Only the parameters listed in this schema exist — do not invent others. Returns a `nextCursor` when more matches exist; a cursor is bound to the full request — query, filters, sort and `limit` — so keep all of them identical when you page, or it is rejected with invalid_cursor rather than silently reused.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "basisDetermination": {
                "description": "How the economic basis was settled: a person read the evidence, it was inferred from the pricing model, a provider line item settled it (no row today), or nothing did.",
                "items": {
                  "enum": ["human_reviewed", "pricing_model_inferred", "provider_line_item_verified", "unknown"],
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "businessModel": {
                "description": "Business-model labels to include, e.g. [\"Subscription\",\"Marketplace Fee\"]. Exact match against the card label; unknown labels match nothing.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "cursor": {
                "description": "`nextCursor` from a previous search, to read the next page.",
                "type": "string"
              },
              "dataQualityStatus": {
                "description": "Row-level caveat: ok = quotable; needs_review = say why before quoting; not_applicable = MRR is not a meaningful measure for the model.",
                "items": {
                  "enum": ["ok", "needs_review", "not_applicable"],
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "economicBasis": {
                "description": "What the money is, using the same enum the rows return in revenueBasis.economicBasis. Combine with other filters freely.",
                "items": {
                  "enum": ["subscription_charges", "usage_charges", "service_billings", "platform_fee_revenue", "marketplace_gmv", "gross_payment_volume", "merchant_sales", "one_time_sales", "unknown"],
                  "type": "string"
                },
                "maxItems": 9,
                "type": "array"
              },
              "evidenceType": {
                "description": "Metric-level evidence. A row qualifies only when every figure it reports (MRR and/or the 30-day amount) has one of these types: provider_reported = the source stamped a sync time and named the payment provider; unknown = it did not. A figure the row does not report is skipped, not treated as evidence, and a row with no figures matches nothing.",
                "items": {
                  "enum": ["provider_reported", "unknown"],
                  "type": "string"
                },
                "maxItems": 2,
                "type": "array"
              },
              "growthWindow": {
                "description": "Window for sortBy=growth; defaults to 7d (the board default). 30d compares the source-reported 30-day amount with its previous value.",
                "enum": ["7d", "30d"],
                "type": "string"
              },
              "lang": {
                "description": "Description language; defaults to zh.",
                "enum": ["zh", "en"],
                "type": "string"
              },
              "limit": {
                "description": "How many matches to return (default 5, max 10).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "Card market label(s) from the report card, matched case- and whitespace-insensitively: \"AI\", \"ai\" and \" AI \" are the same query. Labels are free text captured from the source (e.g. \"AI\", \"SaaS\", \"Marketing\", \"Mobile Apps\"), not a closed enum — an unknown label returns an empty result, not an error. Read the exact labels from a returned row’s market field.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "maxMrr": {
                "description": "Only rows with mrr <= this (USD).",
                "minimum": 0,
                "type": "number"
              },
              "maxRevenue30d": {
                "description": "Only rows with revenue30d <= this (USD).",
                "minimum": 0,
                "type": "number"
              },
              "minMrr": {
                "description": "Only rows with mrr >= this (USD). Rows without an MRR are excluded, not treated as 0.",
                "minimum": 0,
                "type": "number"
              },
              "minRevenue30d": {
                "description": "Only rows with revenue30d >= this (USD). Rows without a 30-day amount are excluded.",
                "minimum": 0,
                "type": "number"
              },
              "query": {
                "description": "Product name, domain, or keyword.",
                "minLength": 1,
                "type": "string"
              },
              "revenueFreshness": {
                "description": "current = the revenue may be quoted as a current figure; stale = the source flagged it. Omit for both.",
                "enum": ["current", "stale"],
                "type": "string"
              },
              "sortBy": {
                "description": "Sort field; defaults to revenue (the 30-day amount). `growth` ranks by the move over `growthWindow`, using the same rows and order as https://moneypeel.com/revenue?by=growth&window=7d — rows with no daily series, or below the board gate, are not ranked. `economicBasis` orders by the economic-basis enum (subscription_charges first, unknown last), then by the 30-day amount; stale rows stay behind current ones in every order.",
                "enum": ["revenue", "mrr", "name", "growth", "economicBasis"],
                "type": "string"
              },
              "sortDirection": {
                "description": "Defaults to desc for revenue and mrr, asc for name.",
                "enum": ["asc", "desc"],
                "type": "string"
              }
            },
            "type": "object"
          },
