        {
          "name": "search_growth_signals",
          "title": "Search growth signals",
          "description": "Rank revenue or MRR moves over an explicit window. Free: no account needed and no reads spent. Ranking rule — 7-day board: baseline at least $500 over the previous 7 days, or at least $1,000 over the previous 30 days. 30-day board: baseline at least $1,000 over the previous 30 days. Either way the change must be at least 20%. By default only rows that clear that gate are ranked, and total counts them — the sample is the public growth board (https://moneypeel.com/revenue?by=growth), not the whole catalogue. The default order is percentage — the same order the public growth board prints; absolute (largest USD change) and consistency (steady growth above a one-day spike) are explicit alternatives. Every row carries baseline, start, end, absolute change, percentage, dataPoints, windowStart/windowEnd (null when the figure is source-reported rather than observed daily), growth kind, the economic basis and the metric-level evidence type. Percentages are never returned without their base; stale rows are marked and can be filtered out. MRR has no 7-day series: metric=mrr works with window=30d only. include_ineligible=true returns the wider signal pool instead: rows below the gate are appended after the ranked rows with rank=null, never take a rank, and total becomes the pool size, with counts {eligible, ineligible, pool}. The pool read is capped at 500 rows; truncated=true says the cap was hit.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "businessModel": {
                "description": "Business-model labels to include, exact match.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "cursor": {
                "description": "nextCursor from a previous growth search, to read the next page.",
                "type": "string"
              },
              "freshness": {
                "description": "current = the amount may be quoted as current; stale = the source flagged it. Omit for both.",
                "enum": ["current", "stale"],
                "type": "string"
              },
              "include_ineligible": {
                "description": "Default false: only rows that clear the board gate are ranked and total counts them. true: also return the wider signal pool — below-gate rows carry rank=null and never take a rank, total becomes the pool size, and counts says how the pool splits. The pool read is capped at 500 rows; truncated=true says the cap was hit.",
                "type": "boolean"
              },
              "limit": {
                "description": "How many signals to return (default 5, max 10).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "Card market label(s), matched case- and whitespace-insensitively on the same field search_reports filters on: \"AI\", \"ai\" and \" AI \" are one query. Free-text labels, not a closed enum; an unknown label returns an empty result.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "metric": {
                "description": "Which metric the move is measured on (default revenue_30d). MRR and the 30-day amount are never mixed in one ranking.",
                "enum": ["mrr", "revenue_30d"],
                "type": "string"
              },
              "minAbsoluteIncrease": {
                "description": "Only rows whose absolute change is at least this (USD; may be negative).",
                "type": "number"
              },
              "minBaseline": {
                "description": "Only rows whose comparison base is at least this (USD).",
                "minimum": 0,
                "type": "number"
              },
              "minDataPoints": {
                "description": "Only rows backed by at least this many observations (14 for a 7d daily series, 2 for a source-reported 30d figure).",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "description": "Default percentage — the same order the public growth board prints (https://moneypeel.com/revenue?by=growth). absolute ranks by largest USD change first; consistency ranks steady growth above a one-day spike. Every comparator still returns the base amount.",
                "enum": ["absolute", "percentage", "consistency"],
                "type": "string"
              },
              "window": {
                "description": "Window the move is measured over (default 7d). 7d is rebuilt from the daily series; 30d moves are source-reported, so their window dates are null.",
                "enum": ["7d", "30d"],
                "type": "string"
              }
            },
            "type": "object"
          },
