{
  "lockfileVersion": 2,
  "subjects": {
    "app.farefacts/fare-facts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://farefacts.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "farefacts",
        "title": "Fare Facts",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Fare Facts gives read-only, dated facts on US air passenger rights and how to read an airline ticket. Every tool and answer is free, with no account. Each answer ends with a current-as-of stamp, source links and this line: \"General information, not legal advice. Airline policies and government rules change, and which version applies depends on the dates involved (when you bought the ticket, when you flew, or when the problem happened). Check the airline's contract of carriage and the US DOT for your situation.\" Error messages are the message alone, without the stamp, sources or that line. The tools take only codes, ids and numbers; names, confirmation codes, ticket numbers and frequent flyer numbers are not needed or used.",
      "tools": [
        {
          "name": "calculate_bump_compensation",
          "title": "Calculate US denied boarding (bump) compensation",
          "description": "US airline passenger rights: denied boarding compensation calculator for an involuntary bump from an oversold flight under 14 CFR 250.5. Returns the tier (0%, 200% or 400%), the formula result and the cap applied, the right to cash instead of a voucher, the exceptions, and the regulation's definition of fare. It covers involuntary bumps only, not volunteers, who negotiate their own deal with the airline. Input: only the one-way fare, the route type and the optional alternate-flight delay in hours; names, confirmation codes, ticket numbers and frequent flyer numbers aren't needed or used.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "alternate_arrival_delay_hours": {
                "description": "How many hours after the original flight's planned arrival the alternate flight the airline offered is planned to arrive (at the destination or first stopover). Omitted when no alternate flight was offered.",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "one_way_fare_usd": {
                "description": "One-way fare in US dollars to the passenger's destination or first stopover (a planned break of more than 4 hours), including all mandatory taxes and fees but not optional extras such as seat or bag fees. This is how 14 CFR 250.1 defines \"fare\". An award or other zero-fare ticket is 0.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "route": {
                "description": "domestic = within the US; international_from_us = an international flight departing a US airport.",
                "enum": ["domestic", "international_from_us"],
                "type": "string"
              }
            },
            "required": ["one_way_fare_usd", "route"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate US denied boarding (bump) compensation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:98a0c0e7aab61f7e1e020ebe2de90116d02d4ba5f731dc5cf4031369b152eef3"
        },
        {
          "name": "explain_fare_basis",
          "title": "Explain an airline fare basis code",
          "description": "US airline tickets, how to read them: explain a fare basis code (for example KL7NR3). Returns the booking class from the first letter (with a note when the code suggests otherwise, such as UP upgrade fares), labeled notes that match the rest of the code (detail 'full' lists every convention), and a tip to paste the fare rules from your own booking for exact change and refund terms. Tax codes are not covered. Input: only the fare basis code, an optional airline code and the optional detail level; names, confirmation codes, ticket numbers and frequent flyer numbers aren't needed or used.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "airline": {
                "description": "Optional 2-character airline code, for example AA, DL, UA or B6.",
                "pattern": "^[A-Za-z0-9]{2}$",
                "type": "string"
              },
              "detail": {
                "default": "brief",
                "description": "Optional. \"brief\" (default) gives the main facts; \"full\" adds every note we have.",
                "enum": ["brief", "full"],
                "type": "string"
              },
              "fare_basis": {
                "description": "The fare basis code only, 1 to 15 characters.",
                "maxLength": 15,
                "pattern": "^[A-Za-z0-9/]{1,15}$",
                "type": "string"
              }
            },
            "required": ["fare_basis"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain an airline fare basis code"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4a1016e95f117022b33761e4943b72da84fb27ba479652c769b892add193b652"
        },
        {
          "name": "explain_tax_codes",
          "title": "Explain US airline ticket tax and fee codes",
          "description": "US airline ticket taxes and fees: explain two-character tax codes from a ticket receipt (for example US, ZP, AY, XF, YC, XY, XA), with each amount, its effective date and its source (detail 'full' adds every note). Codes not in the verified list are reported as such, never guessed. Fare basis codes are not covered. Input: only the tax codes and the optional detail level; names, confirmation codes, ticket numbers and frequent flyer numbers aren't needed or used.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "codes": {
                "description": "1 to 20 two-character tax codes from the ticket's tax box.",
                "items": {
                  "pattern": "^[A-Za-z0-9]{2}$",
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "detail": {
                "default": "brief",
                "description": "Optional. \"brief\" (default) gives the main facts; \"full\" adds every note we have.",
                "enum": ["brief", "full"],
                "type": "string"
              }
            },
            "required": ["codes"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain US airline ticket tax and fee codes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:89f6969c4a48ee7b2de7038ba83350b74a44e669cdc0dfd0c7269007a90c4851"
        },
        {
          "name": "get_missing_miles_link",
          "title": "Get an airline's missing miles request link",
          "description": "US airline frequent flyer programs: where and how to request missing miles or points for a past flight (American, Delta, United, JetBlue, Alaska/Hawaiian, Southwest, Frontier, Spirit), with the waiting period, deadline, login needs and a basic economy caveat. Passenger rights rules are not covered. Input: one airline id only; names, confirmation codes, ticket numbers and frequent flyer numbers aren't needed or used.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "airline": {
                "description": "The airline whose program you are asking about.",
                "enum": ["american", "delta", "united", "jetblue", "alaska_hawaiian", "southwest", "frontier", "spirit"],
                "type": "string"
              }
            },
            "required": ["airline"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an airline's missing miles request link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5a36e11675cdf4f185b25c4b733fee62fd4c081bfaaf7f5c16f4a370483906fe"
        },
        {
          "name": "get_passenger_right",
          "title": "Get a US air passenger right, with sources",
          "description": "US airline passenger rights: the federal rule for one topic (for example refunds when a flight is cancelled, denied boarding, tarmac delays, the 24-hour rule, lost bags, wheelchairs), questions a passenger can raise with the airline, citations and a current-as-of date. It states rules only; it does not calculate bump payment amounts or explain ticket codes. Input: one topic id only; names, confirmation codes, ticket numbers and frequent flyer numbers aren't needed or used.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "topic": {
                "description": "Topic id; the allowed ids are the values listed in this schema.",
                "enum": ["denied_boarding", "refunds_cancellation_significant_change", "delays_no_federal_compensation", "meals_hotel_transport", "tarmac_delay", "24_hour_rule", "delayed_bag_fee_refund", "lost_damaged_bag_domestic", "lost_damaged_bag_international", "bag_tracing_basics", "pending_changes", "before_you_buy", "wheelchair_mobility_device"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a US air passenger right, with sources"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ca0744a17ec4b18857cbb36c2b588bea0b3eb2283163c02aece63a990061cafd"
        },
        {
          "name": "list_rights_topics",
          "title": "List US air passenger rights topics",
          "description": "US airline passenger rights: list the topics Fare Facts covers (bumping/denied boarding, refunds for cancellations and schedule changes, delays, meals and hotels, tarmac delays, the 24-hour rule, bag fees, lost or damaged bags, bag tracing, wheelchairs and mobility devices, what sellers must disclose before you buy, and pending rule changes), each with its topic id and a one-line summary. Input: none.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List US air passenger rights topics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:861f2b019ea9b3750541aea5c0d49b967a3417a4da2707b7670270a8db4de524"
        }
      ],
      "digest": "sha256:51b189e338522ff79b4aa5893f368c1c185cd8c4799ee899ee646b1b78117c1e"
    }
  }
}
