        {
          "name": "o_chu_hang_ngang",
          "title": "Ô chữ hàng ngang",
          "description": "Dùng khi giáo viên muốn tổ chức trò chơi ô chữ (giải ô chữ hàng ngang, tìm từ khoá hàng dọc) để khởi động hoặc ôn bài trên lớp. Nhận các hàng ngang (câu gợi ý + đáp án) và từ khoá hàng dọc tuỳ chọn; hàng thứ i phải chứa chữ cái thứ i của từ khoá (so sánh sau khi bỏ dấu, viết hoa). Đáp án nên ngắn (1–3 từ, tối đa 20 chữ cái). Mở ô chữ trong widget: chọn hàng, đồng hồ, mở đáp án, đoán từ khoá, cộng điểm theo đội; trả kèm link chơi toàn màn hình trên web. Opens a classroom crossword game with a vertical keyword.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "giay": {
                "default": 20,
                "description": "Số giây cho mỗi hàng, 0 là không bấm giờ / seconds per row",
                "maximum": 600,
                "minimum": 0,
                "type": "integer"
              },
              "goi_y_tu_khoa": {
                "description": "Câu gợi ý cho từ khoá / keyword clue",
                "maxLength": 300,
                "type": "string"
              },
              "hang_ngang": {
                "description": "Các hàng ngang theo thứ tự / rows",
                "items": {
                  "properties": {
                    "dap_an": {
                      "description": "Đáp án, có dấu cũng được, ví dụ \"Hà Nội\"; có thể đặt chữ thuộc từ khoá trong ngoặc vuông: \"Gà t[r]ống\" / answer",
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    },
                    "goi_y": {
                      "description": "Câu gợi ý / clue",
                      "maxLength": 300,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["dap_an", "goi_y"],
                  "type": "object"
                },
                "maxItems": 15,
                "minItems": 2,
                "type": "array"
              },
              "ngon_ngu": {
                "default": "vi",
                "description": "Ngôn ngữ của widget và câu trả lời: \"en\" khi người dùng viết tiếng Anh, \"vi\" khi viết tiếng Việt / UI language: use \"en\" when the user writes in English",
                "enum": ["vi", "en"],
                "type": "string"
              },
              "so_doi": {
                "default": 2,
                "description": "Số đội tính điểm (2–6), 0 là không chia đội / number of teams",
                "maximum": 6,
                "minimum": 0,
                "type": "integer"
              },
              "ten_doi": {
                "description": "Tên các đội / team names",
                "items": {
                  "maxLength": 30,
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "tu_khoa": {
                "description": "Từ khoá hàng dọc; số chữ cái (sau khi bỏ dấu, bỏ khoảng trắng) phải bằng số hàng ngang / vertical keyword",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["hang_ngang"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
