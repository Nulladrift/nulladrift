      "tools": [
        {
          "name": "chia_nhom_ngau_nhien",
          "title": "Chia nhóm ngẫu nhiên",
          "description": "Chia ngẫu nhiên danh sách học sinh thành các nhóm đều nhau và hiện bảng nhóm, có nút Chia lại. Randomly splits students into balanced groups.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "danh_sach": {
                "description": "Danh sách họ tên học sinh, mỗi phần tử một bạn. Student names, one per item.",
                "items": {
                  "type": "string"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              },
              "so_nhom": {
                "default": 4,
                "description": "Số nhóm / number of groups",
                "maximum": 12,
                "minimum": 2,
                "type": "integer"
              }
            },
            "required": ["danh_sach"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://congcugiangday/cong-cu-nhanh-1ucijb4.html"
            },
            "ui/resourceUri": "ui://congcugiangday/cong-cu-nhanh-1ucijb4.html"
          },
          "digest": "sha256:87257e5091e8fddaa51b8a13ec1629932b092899d5d5c10045d014a203018c87"
        },
        {
          "name": "dem_nguoc",
          "title": "Đồng hồ đếm ngược",
          "description": "Mở đồng hồ đếm ngược cho lớp học (làm bài, thảo luận nhóm, giải lao). Giáo viên bấm Bắt đầu trên đồng hồ. Opens a classroom countdown timer widget.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "phut": {
                "default": 5,
                "description": "Số phút đếm ngược / minutes",
                "maximum": 600,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://congcugiangday/cong-cu-nhanh-1ucijb4.html"
            },
            "ui/resourceUri": "ui://congcugiangday/cong-cu-nhanh-1ucijb4.html"
          },
          "digest": "sha256:a451c3f7f533b70e3643c48a1fcdffd8635be0930bcc47506f5494d151e501c7"
        },
        {
          "name": "do_vui_chia_doi",
          "title": "Đố vui chia đội",
          "description": "Dùng khi giáo viên muốn tổ chức trò chơi đố vui, ôn tập hay kiểm tra nhanh theo đội trên lớp. Nhận bộ câu hỏi (trắc nghiệm hoặc tự luận) và mở trò chơi: chiếu từng câu kèm đồng hồ, hiện đáp án, cộng điểm cho đội trả lời đúng, cuối cùng hiện bảng xếp hạng. Trả kèm link mở trò chơi trên web để chiếu toàn màn hình. Opens a team quiz game for classroom review from the given questions.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cau_hoi": {
                "description": "Danh sách câu hỏi / questions",
                "items": {
                  "properties": {
                    "dap_an": {
                      "description": "Đáp án: với câu trắc nghiệm là nguyên văn lựa chọn đúng hoặc chữ cái A–F; với câu tự luận là câu trả lời / answer",
                      "maxLength": 300,
                      "type": "string"
                    },
                    "hoi": {
                      "description": "Nội dung câu hỏi / question",
                      "maxLength": 500,
                      "minLength": 1,
                      "type": "string"
                    },
                    "lua_chon": {
                      "description": "Các lựa chọn A, B, C, D (2 đến 6); bỏ trống nếu là câu tự luận / options, omit for open questions",
                      "items": {
                        "maxLength": 200,
                        "minLength": 1,
                        "type": "string"
                      },
                      "maxItems": 6,
                      "type": "array"
                    }
                  },
                  "required": ["dap_an", "hoi"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "giay": {
                "default": 30,
                "description": "Số giây cho mỗi câu, 0 là không bấm giờ / seconds per question",
                "maximum": 600,
                "minimum": 0,
                "type": "integer"
              },
              "so_doi": {
                "default": 2,
                "description": "Số đội / number of teams",
                "maximum": 6,
                "minimum": 2,
                "type": "integer"
              },
              "ten_doi": {
                "description": "Tên các đội, ví dụ Tổ 1, Tổ 2; bỏ trống để dùng tên màu / team names",
                "items": {
                  "maxLength": 30,
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              }
            },
            "required": ["cau_hoi"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
