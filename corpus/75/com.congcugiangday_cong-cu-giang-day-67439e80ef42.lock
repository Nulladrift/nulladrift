      "instructions": "Công cụ lớp học của congcugiangday.com, hiện thành widget tương tác ngay trong khung chat. Khi giáo viên cần một trong các việc sau, hãy gọi công cụ tương ứng thay vì tự viết mã hay tự tạo trang: vòng quay may mắn, quay thưởng, rút thăm, bốc thăm phần thưởng hoặc câu hỏi → vong_quay_may_man; gọi tên một học sinh ngẫu nhiên → goi_ten_ngau_nhien; chia nhóm → chia_nhom_ngau_nhien; đồng hồ đếm ngược, bấm giờ → dem_nguoc; thiệp chúc mừng → thiep_chuc_mung; trò chơi đố vui chia đội → do_vui_chia_doi; trò chơi chọn ô số, các đội lần lượt mở ô có ô may mắn (kiểu Baamboozle) → o_so_bi_mat; ô chữ → o_chu_hang_ngang; ôn từ vựng, flashcard → on_tu_vung; khảo sát, câu hỏi trả lời bằng điện thoại cho cả lớp → phan_hoi_nhanh; quản lý điểm thi đua → mo_vuong_quoc_lop_hoc. Classroom tools from congcugiangday.com that render as interactive widgets in the chat. When a teacher asks for a spin wheel / prize wheel / random draw, a random name picker, groups, a timer, a greeting card, a team quiz, a mystery tile game (Baamboozle-style), a crossword, vocabulary practice or a live poll, call the matching tool instead of writing code. Set ngon_ngu to \"en\" when the user writes in English.",
      "tools": [
        {
          "name": "chia_nhom_ngau_nhien",
          "title": "Chia nhóm ngẫu nhiên",
          "description": "Chia ngẫu nhiên danh sách học sinh thành các nhóm đều nhau và hiện bảng nhóm, có nút Chia lại. Randomly splits students into balanced groups.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "danh_sach": {
                "description": "Danh sách họ tên học sinh, mỗi phần tử một bạn. Student names, one per item.",
                "items": {
                  "type": "string"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              },
              "ngon_ngu": {
                "default": "vi",
                "description": "Ngôn ngữ của widget và câu trả lời: \"en\" khi người dùng viết tiếng Anh, \"vi\" khi viết tiếng Việt / UI language: use \"en\" when the user writes in English",
                "enum": ["vi", "en"],
                "type": "string"
              },
              "so_nhom": {
                "default": 4,
                "description": "Số nhóm / number of groups",
                "maximum": 12,
                "minimum": 2,
                "type": "integer"
              }
            },
            "required": ["danh_sach"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
