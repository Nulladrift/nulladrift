                "type": "string"
              },
              "loi_chuc": {
                "description": "Lời chúc riêng; bỏ trống để dùng lời chúc mẫu của dịp / custom message",
                "maxLength": 300,
                "type": "string"
              },
              "ten": {
                "description": "Tên người được chúc; bỏ trống nếu chúc cả lớp / recipient name",
                "maxLength": 80,
                "type": "string"
