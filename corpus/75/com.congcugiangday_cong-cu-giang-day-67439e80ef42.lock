        {
          "name": "dem_nguoc",
          "title": "Đồng hồ đếm ngược",
          "description": "Mở đồng hồ đếm ngược cho lớp học (làm bài, thảo luận nhóm, giải lao). Giáo viên bấm Bắt đầu trên đồng hồ. Opens a classroom countdown timer widget.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "ngon_ngu": {
                "default": "vi",
                "description": "Ngôn ngữ của widget và câu trả lời: \"en\" khi người dùng viết tiếng Anh, \"vi\" khi viết tiếng Việt / UI language: use \"en\" when the user writes in English",
                "enum": ["vi", "en"],
                "type": "string"
              },
              "phut": {
                "default": 5,
                "description": "Số phút đếm ngược / minutes",
                "maximum": 600,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
