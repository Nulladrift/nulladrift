            },
            "ui/resourceUri": "ui://congcugiangday/cong-cu-nhanh-p8ad8g.html"
          },
          "digest": "sha256:567032e940e49ded7f978d3959801b64da2b69e9a5fc728b6ec4ea0daabf4484"
        },
        {
          "name": "phan_hoi_nhanh",
          "title": "Phản hồi nhanh (sinh viên trả lời bằng điện thoại)",
          "description": "Dùng khi giảng viên muốn hỏi cả lớp và xem ngay mức hiểu bài: sinh viên quét mã QR, trả lời bằng điện thoại, kết quả hiện trên màn hình chiếu. Nhận danh sách câu hỏi: trắc nghiệm (2–6 lựa chọn, có hoặc không có đáp án đúng; không có đáp án là câu khảo sát) hoặc trả lời ngắn (có thể ghi nhiều đáp án chấp nhận, ngăn bằng \"/\"). Rất hợp với câu hỏi tình huống lâm sàng, dược lý, thuật ngữ cho sinh viên khối sức khoẻ. Trả về link mở sẵn câu hỏi; giảng viên bấm \"Mở phòng\" trên web để có mã QR (phòng cần trình duyệt nên không mở trong khung chat). Opens a live classroom poll / quiz where students answer on their phones.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cau_hoi": {
                "description": "Danh sách câu hỏi / questions",
                "items": {
                  "properties": {
                    "dap_an": {
                      "description": "Đáp án: chữ cái (A, B…) hoặc nội dung lựa chọn đúng; câu trả lời ngắn thì ghi đáp án, nhiều cách viết ngăn bằng \"/\"; bỏ trống là câu khảo sát",
                      "maxLength": 240,
                      "type": "string"
                    },
                    "hoi": {
                      "description": "Nội dung câu hỏi / question",
                      "maxLength": 600,
                      "minLength": 1,
                      "type": "string"
                    },
                    "lua_chon": {
                      "description": "Các lựa chọn; bỏ trống là câu trả lời ngắn / options",
                      "items": {
                        "maxLength": 240,
                        "minLength": 1,
                        "type": "string"
                      },
                      "maxItems": 6,
                      "type": "array"
                    }
                  },
                  "required": ["hoi"],
                  "type": "object"
                },
                "maxItems": 60,
                "minItems": 1,
                "type": "array"
              },
