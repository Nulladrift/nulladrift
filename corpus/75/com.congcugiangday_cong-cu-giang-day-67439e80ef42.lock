        {
          "name": "chia_nhom_ngau_nhien",
          "title": "Chia nhóm ngẫu nhiên",
          "description": "Chia ngẫu nhiên danh sách học sinh thành các nhóm đều nhau và hiện bảng nhóm, có nút Chia lại. Randomly splits students into balanced groups.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "danh_sach": {
                "description": "Danh sách họ tên học sinh, mỗi phần tử một bạn. Student names, one per item.",
                "items": {
                  "type": "string"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              },
              "ngon_ngu": {
                "default": "vi",
                "description": "Ngôn ngữ của widget và câu trả lời: \"en\" khi người dùng viết tiếng Anh, \"vi\" khi viết tiếng Việt / UI language: use \"en\" when the user writes in English",
                "enum": ["vi", "en"],
                "type": "string"
              },
              "so_nhom": {
                "default": 4,
                "description": "Số nhóm / number of groups",
                "maximum": 12,
                "minimum": 2,
                "type": "integer"
              }
            },
            "required": ["danh_sach"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
