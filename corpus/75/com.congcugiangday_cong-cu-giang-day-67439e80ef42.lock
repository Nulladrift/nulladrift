                "maximum": 600,
                "minimum": 0,
                "type": "integer"
              },
              "ngon_ngu": {
                "default": "vi",
                "description": "Ngôn ngữ của widget và câu trả lời: \"en\" khi người dùng viết tiếng Anh, \"vi\" khi viết tiếng Việt / UI language: use \"en\" when the user writes in English",
                "enum": ["vi", "en"],
                "type": "string"
              },
              "o_may_man": {
                "default": true,
                "description": "Xen ô may mắn không có câu hỏi: quà, bom, cướp điểm, đổi điểm, thêm lượt / include lucky tiles",
                "type": "boolean"
              },
              "so_doi": {
                "default": 2,
