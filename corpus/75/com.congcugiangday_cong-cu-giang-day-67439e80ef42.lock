        {
          "name": "on_tu_vung",
          "title": "Ôn từ vựng",
          "description": "Dùng khi giáo viên hoặc học sinh muốn ôn từ vựng (tiếng Anh, ngoại ngữ khác, thuật ngữ chuyên ngành như y khoa) từ một danh sách từ. Nhận danh sách từ (từ, nghĩa tiếng Việt, tuỳ chọn phiên âm, loại từ, câu ví dụ có chứa từ đó). Mở bộ ôn tập trong widget: thẻ ghi nhớ có đọc phát âm, bài tự luyện tự sinh câu hỏi (chọn nghĩa, chọn từ, gõ từ, điền từ vào câu ví dụ), đua xe chia đội chiếu lên lớp, và chuyển sang Đố vui chia đội hay Ô chữ. Trả kèm link gửi học sinh tự ôn trên điện thoại. Nên có câu ví dụ cho từng từ để có dạng câu điền từ. Opens vocabulary flashcards, self-practice and a team race.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "giong_doc": {
                "default": "en-US",
                "description": "Giọng đọc phát âm: en-US, en-GB, fr-FR, zh-CN, ja-JP, ko-KR, de-DE, vi-VN hoặc none / voice",
                "enum": ["en-US", "en-GB", "fr-FR", "zh-CN", "ja-JP", "ko-KR", "de-DE", "vi-VN", "none"],
                "type": "string"
              },
              "ngon_ngu": {
                "default": "vi",
                "description": "Ngôn ngữ của widget và câu trả lời: \"en\" khi người dùng viết tiếng Anh, \"vi\" khi viết tiếng Việt / UI language: use \"en\" when the user writes in English",
                "enum": ["vi", "en"],
                "type": "string"
              },
              "ten_bai": {
                "default": "",
                "description": "Tên bài, ví dụ \"Unit 3 – My friends\" / lesson title",
                "maxLength": 80,
                "type": "string"
              },
              "tu": {
                "description": "Danh sách từ / words",
                "items": {
                  "properties": {
