        {
          "name": "do_vui_chia_doi",
          "title": "Đố vui chia đội",
          "description": "Dùng khi giáo viên muốn tổ chức trò chơi đố vui, ôn tập hay kiểm tra nhanh theo đội trên lớp. Nhận bộ câu hỏi (trắc nghiệm hoặc tự luận) và mở trò chơi: chiếu từng câu kèm đồng hồ, hiện đáp án, cộng điểm cho đội trả lời đúng, cuối cùng hiện bảng xếp hạng. Trả kèm link mở trò chơi trên web để chiếu toàn màn hình. Opens a team quiz game for classroom review from the given questions.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cau_hoi": {
                "description": "Danh sách câu hỏi / questions",
                "items": {
                  "properties": {
                    "dap_an": {
                      "description": "Đáp án: với câu trắc nghiệm là nguyên văn lựa chọn đúng hoặc chữ cái A–F; với câu tự luận là câu trả lời / answer",
                      "maxLength": 300,
                      "type": "string"
                    },
                    "hoi": {
                      "description": "Nội dung câu hỏi / question",
                      "maxLength": 500,
                      "minLength": 1,
                      "type": "string"
                    },
                    "lua_chon": {
                      "description": "Các lựa chọn A, B, C, D (2 đến 6); bỏ trống nếu là câu tự luận / options, omit for open questions",
                      "items": {
                        "maxLength": 200,
                        "minLength": 1,
                        "type": "string"
                      },
                      "maxItems": 6,
                      "type": "array"
                    }
                  },
                  "required": ["dap_an", "hoi"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "giay": {
                "default": 30,
                "description": "Số giây cho mỗi câu, 0 là không bấm giờ / seconds per question",
                "maximum": 600,
                "minimum": 0,
                "type": "integer"
              },
              "ngon_ngu": {
                "default": "vi",
                "description": "Ngôn ngữ của widget và câu trả lời: \"en\" khi người dùng viết tiếng Anh, \"vi\" khi viết tiếng Việt / UI language: use \"en\" when the user writes in English",
                "enum": ["vi", "en"],
                "type": "string"
              },
              "so_doi": {
                "default": 2,
                "description": "Số đội / number of teams",
                "maximum": 6,
                "minimum": 2,
                "type": "integer"
              },
              "ten_doi": {
                "description": "Tên các đội, ví dụ Tổ 1, Tổ 2; bỏ trống để dùng tên màu / team names",
                "items": {
                  "maxLength": 30,
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              }
            },
            "required": ["cau_hoi"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
