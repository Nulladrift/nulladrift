          },
          "digest": "sha256:eef10dc1f04b25185b137c6d993379640e722382e9826581d57ccd2842e04683"
        },
        {
          "name": "goi_ten_ngau_nhien",
          "title": "Gọi tên ngẫu nhiên",
          "description": "Bốc thăm ngẫu nhiên một học sinh trong danh sách và hiện vòng quay gọi tên. Bấm Quay để gọi bạn tiếp theo, không lặp lại bạn đã gọi. Randomly picks a student from the list and shows a name spinner.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "danh_sach": {
                "description": "Danh sách họ tên học sinh, mỗi phần tử một bạn. Student names, one per item.",
                "items": {
                  "type": "string"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["danh_sach"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://congcugiangday/cong-cu-nhanh-1ucijb4.html"
            },
            "ui/resourceUri": "ui://congcugiangday/cong-cu-nhanh-1ucijb4.html"
          },
          "digest": "sha256:94eb789379db6e04b3a695d2532e5fab0a853985b0e394cefd88d9527f4af43e"
        },
        {
          "name": "mo_vuong_quoc_lop_hoc",
          "title": "Vương Quốc Lớp Học",
          "description": "Trả về đường dẫn tới Vương Quốc Lớp Học: app quản lý lớp, cộng điểm, thăng cấp và đổi quà cho học sinh. App lưu dữ liệu trên trình duyệt của giáo viên nên phải mở trên web, không chạy trong khung chat. Returns the link to the classroom management game.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fe68c19ad5143e74282beb05f57950b9c93cc8d5e9b2e546a229c1e96c5686c6"
        },
        {
          "name": "o_chu_hang_ngang",
          "title": "Ô chữ hàng ngang",
          "description": "Dùng khi giáo viên muốn tổ chức trò chơi ô chữ (giải ô chữ hàng ngang, tìm từ khoá hàng dọc) để khởi động hoặc ôn bài trên lớp. Nhận các hàng ngang (câu gợi ý + đáp án) và từ khoá hàng dọc tuỳ chọn; hàng thứ i phải chứa chữ cái thứ i của từ khoá (so sánh sau khi bỏ dấu, viết hoa). Đáp án nên ngắn (1–3 từ, tối đa 20 chữ cái). Mở ô chữ trong widget: chọn hàng, đồng hồ, mở đáp án, đoán từ khoá, cộng điểm theo đội; trả kèm link chơi toàn màn hình trên web. Opens a classroom crossword game with a vertical keyword.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "giay": {
                "default": 20,
                "description": "Số giây cho mỗi hàng, 0 là không bấm giờ / seconds per row",
                "maximum": 600,
                "minimum": 0,
                "type": "integer"
              },
              "goi_y_tu_khoa": {
                "description": "Câu gợi ý cho từ khoá / keyword clue",
                "maxLength": 300,
                "type": "string"
              },
              "hang_ngang": {
                "description": "Các hàng ngang theo thứ tự / rows",
                "items": {
                  "properties": {
                    "dap_an": {
                      "description": "Đáp án, có dấu cũng được, ví dụ \"Hà Nội\"; có thể đặt chữ thuộc từ khoá trong ngoặc vuông: \"Gà t[r]ống\" / answer",
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    },
                    "goi_y": {
                      "description": "Câu gợi ý / clue",
                      "maxLength": 300,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["dap_an", "goi_y"],
                  "type": "object"
                },
                "maxItems": 15,
                "minItems": 2,
                "type": "array"
              },
              "so_doi": {
                "default": 2,
                "description": "Số đội tính điểm (2–6), 0 là không chia đội / number of teams",
                "maximum": 6,
                "minimum": 0,
                "type": "integer"
              },
              "ten_doi": {
                "description": "Tên các đội / team names",
                "items": {
                  "maxLength": 30,
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "tu_khoa": {
                "description": "Từ khoá hàng dọc; số chữ cái (sau khi bỏ dấu, bỏ khoảng trắng) phải bằng số hàng ngang / vertical keyword",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["hang_ngang"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://congcugiangday/cong-cu-nhanh-1ucijb4.html"
            },
            "ui/resourceUri": "ui://congcugiangday/cong-cu-nhanh-1ucijb4.html"
          },
          "digest": "sha256:c661b5340613388f853db61b98359cb62ecbae53ad831b5d048c0c6598e32f2a"
        },
        {
          "name": "thiep_chuc_mung",
          "title": "Thiệp chúc mừng",
          "description": "Dùng khi giáo viên muốn tạo, mở hoặc chiếu thiệp chúc mừng cho học sinh, thầy cô hoặc cả lớp. Hiện thiệp có tên, lời chúc, pháo giấy và nhạc YouTube, kèm link thiệp để gửi qua Zalo. Dịp: sinh-nhat (Sinh nhật), 20-11 (Ngày Nhà giáo 20/11), 8-3 (Quốc tế Phụ nữ 8/3), tet (Năm mới, Tết), khen-thuong (Khen thưởng, thành tích), chao-mung (Chào mừng bạn mới). Thiệp sinh nhật mặc định phát \"Khúc hát mừng sinh nhật\" của Phan Đinh Tùng. Opens a classroom greeting card (birthday, Teachers' Day, Women's Day, New Year, awards, welcome) with an optional YouTube song.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "bai_hat": {
                "description": "Link YouTube của bài hát muốn phát thay bài mặc định, hoặc \"khong\" để không phát nhạc / YouTube link or \"khong\" for no music",
                "type": "string"
              },
              "dip": {
                "default": "sinh-nhat",
                "description": "Dịp chúc mừng / occasion",
                "enum": ["sinh-nhat", "20-11", "8-3", "tet", "khen-thuong", "chao-mung"],
                "type": "string"
              },
              "loi_chuc": {
                "description": "Lời chúc riêng; bỏ trống để dùng lời chúc mẫu của dịp / custom message",
                "maxLength": 300,
                "type": "string"
              },
              "ten": {
                "description": "Tên người được chúc; bỏ trống nếu chúc cả lớp / recipient name",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
