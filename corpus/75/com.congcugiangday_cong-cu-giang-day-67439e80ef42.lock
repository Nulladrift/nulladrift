        },
        {
          "name": "mo_vuong_quoc_lop_hoc",
          "title": "Vương Quốc Lớp Học",
          "description": "Trả về đường dẫn tới Vương Quốc Lớp Học: app quản lý lớp, cộng điểm, thăng cấp và đổi quà cho học sinh. App lưu dữ liệu trên trình duyệt của giáo viên nên phải mở trên web, không chạy trong khung chat. Returns the link to the classroom management game.",
          "inputSchema": {
