        },
        {
          "name": "o_so_bi_mat",
          "title": "Ô số bí mật",
          "description": "Dùng khi giáo viên muốn trò chơi chọn ô số chia đội (kiểu Baamboozle) để khởi động hay ôn bài: câu hỏi giấu sau các ô đánh số, các đội lần lượt chọn ô, trả lời đúng được điểm của ô (điểm bí mật 1–3 lần điểm gốc), xen ô may mắn (quà, bom, cướp điểm, đổi điểm, thêm lượt). Học sinh không cần thiết bị. Khác do_vui_chia_doi (câu hỏi lần lượt, mọi đội cùng trả lời). Trả kèm link mở trò chơi trên web để chiếu toàn màn hình. Opens a Baamboozle-style mystery tile game: teams take turns picking numbered tiles hiding questions, with mystery points and lucky tiles.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cau_hoi": {
                "description": "Danh sách câu hỏi / questions",
                "items": {
                  "properties": {
                    "dap_an": {
                      "description": "Đáp án: với câu trắc nghiệm là nguyên văn lựa chọn đúng hoặc chữ cái A–F; với câu tự luận là câu trả lời / answer",
                      "maxLength": 300,
                      "type": "string"
                    },
                    "hoi": {
                      "description": "Nội dung câu hỏi / question",
                      "maxLength": 500,
                      "minLength": 1,
                      "type": "string"
                    },
                    "lua_chon": {
                      "description": "Các lựa chọn A, B, C, D (2 đến 6); bỏ trống nếu là câu tự luận / options, omit for open questions",
                      "items": {
                        "maxLength": 200,
                        "minLength": 1,
                        "type": "string"
                      },
                      "maxItems": 6,
                      "type": "array"
                    }
                  },
                  "required": ["dap_an", "hoi"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "diem": {
                "default": 10,
                "description": "Điểm gốc mỗi câu đúng / base points per correct answer",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "diem_bi_mat": {
                "default": true,
                "description": "Mỗi ô được 1, 2 hoặc 3 lần điểm gốc, mở ra mới biết / mystery points per tile",
                "type": "boolean"
              },
              "giay": {
