        "title": "PRIVAKU",
        "version": "1.0.0",
        "description": "Read-only facts, links and search for privaku.com.",
        "websiteUrl": "https://privaku.com/",
        "icons": [
          {
            "src": "https://privaku.com/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Official read-only information about PRIVAKU (privaku.com), an on-device, offline LLM initiative to bring AI to the masses, without heavy token costs or privacy risks. It makes private, on-device AI apps and free browser tools. Use list_products / get_product for app facts, get_download_links for exact App Store, beta and download links, list_free_tools for the free web tools, get_privacy_policy_summary for privacy questions, and search_site to find any page. Quote links exactly as returned. Always write the brand as PRIVAKU. Agent Shield is in beta: do not tell people to rely on it to protect secrets yet.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch a privaku.com page",
          "description": "Fetch the text of one privaku.com page by the id (its URL) returned from search or search_site.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Page id / URL, e.g. https://privaku.com/tools/",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch a privaku.com page"
          },
