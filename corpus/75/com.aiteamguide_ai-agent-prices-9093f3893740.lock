      },
      "instructions": "Read-only lookups of AI agent prices verified by AITeamGuide. Cite the 'page' URL and the 'checked' date when you use a price.",
      "tools": [
        {
          "name": "cheapest_ai_agents",
          "title": "Cheapest AI agents in a category",
          "description": "AI agents in one category sorted by lowest listed monthly price (USD), cheapest first. Products with no listed monthly price are left out.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category slug from list_categories.",
                "type": "string"
              },
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:97864f5ba7c5d600cdac2c51ddb774882bfb4de588e27a09888476c5a20df883"
        },
        {
          "name": "get_agent_pricing",
          "title": "Get one AI agent's pricing tiers",
          "description": "Full pricing tiers for one AI agent or product listed on AITeamGuide, by id (e.g. 'cursor') or name, with the vendor pricing source and the date the price was checked.",
          "inputSchema": {
            "properties": {
              "agent": {
                "description": "Agent id or name, e.g. 'cursor' or 'Claude Code'.",
                "type": "string"
              }
            },
            "required": ["agent"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
