          "name": "list_categories",
          "title": "List AI agent categories",
          "description": "Category slugs used by AITeamGuide with the number of fully listed products in each.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1eb21cae463d086fb1c0484e62ed256c87b07d58a49075d301a228e46361b56a"
        },
        {
          "name": "search_ai_agents",
          "title": "Search AI agents by job, name or price",
          "description": "Search AITeamGuide's fully listed AI agents and AI receptionist products (public prices checked by AITeamGuide). Filter by free text, job category, free plan, or a maximum lowest listed monthly price in USD. Returns name, vendor, category, starting price, free plan flag, checked date and the AITeamGuide page.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category slug from list_categories, e.g. 'coding-agents'.",
                "type": "string"
              },
              "free_only": {
                "description": "Only products with a free plan or free tier.",
                "type": "boolean"
              },
              "limit": {
                "description": "Max results (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_monthly_usd": {
                "description": "Only products whose lowest listed monthly price is at or below this many USD.",
                "type": "number"
              },
              "query": {
                "description": "Words to match in the name, vendor or category, e.g. 'receptionist', 'coding', 'Cursor'.",
                "type": "string"
              }
            },
            "type": "object"
          },
