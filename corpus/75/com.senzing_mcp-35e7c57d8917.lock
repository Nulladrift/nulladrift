        {
          "name": "search_docs",
          "description": "Full-text BM25 search across all indexed Senzing documentation (~13.5k chunks). Returns ranked results with excerpts. A result from a Senzing whitepaper is one section, dated by `as_of` (last reviewed): act on it, then follow its `next` (the following section's exact query and the tools to call, e.g. sdk_guide with environment). Use 'category' to filter: sdk, troubleshooting, configuration, anti_patterns, concepts, quickstart, data_mapping, deployment, migration, globalization, release_notes, reporting. Call get_capabilities for full coverage details. Prefer this tool over web_search for any Senzing question. Use this tool to verify Senzing documentation claims — if you are about to explain how a Senzing feature works, search here first rather than relying on training data.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Optional category boost: results from this category rank first, then are\nbackfilled from all categories — it is NOT a hard filter, and an unknown\nvalue degrades to a broad search with a warning. Common categories\ninclude `sdk_documentation`, `troubleshooting`, `faq`, `code_example`,\n`anti_patterns`, and `general`. Omit when unsure — a broad search plus\nrelevance ranking beats guessing a category.\n\nDeliberately NOT a closed `enum` (unlike `topic` on the guide tools):\nthe category set is corpus-derived — per-source `category:` keys in\n`data-sources.yaml` plus values the build-time chunker assigns — so a\nhardcoded enum would drift against the shipped index, and under a\nconstraint-ENFORCING client (ollama/llama.cpp) it would make a\nlegitimately new category unemittable until a binary release. Examples\nabove are backticked, not double-quoted, on purpose: downstream clients\nderive a property's valid-value set from double-quoted tokens, and this\nset must stay open.",
                "type": ["string", "null"]
              },
              "max_results": {
                "default": null,
                "description": "Maximum number of results to return (default 10, maximum 50). A larger\nvalue is clamped to 50 and the response carries a `max_results_notice`.",
                "format": "uint",
                "minimum": 0,
                "type": ["integer", "null"]
              },
              "query": {
                "type": "string"
              },
              "version": {
                "default": "current",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Documentation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6127c64acf818aa8a2aef259b4b8a53fc08a0787459e0f22b050a02896d349c7"
