        {
          "name": "get_sdk_reference",
          "description": "Get authoritative Senzing SDK reference data: method signatures and argument types per language binding, flags, response schemas, and V3→V4 migration. Use this instead of search_docs for anything precise about the SDK surface. Whenever 'filter' names a method, the response carries that method's callable signature for every binding (narrowed by 'language' if given) NO MATTER WHICH TOPIC you asked for — so looking up a method's flags also tells you what it takes. Topics: 'parameters' (aliases: functions, methods, classes, api, signatures, args) returns argument types per binding — the same method differs by binding in BOTH name and argument types: Python find_network_by_entity_id takes List[int], Java findNetwork takes SzEntityIds, C# FindNetwork takes ISet<long>, Rust takes &[EntityId], TypeScript findNetwork takes Array<number> and renames buildOutDegrees to buildOutDegree; 'flags' (all V4 engine flags and the methods they apply to; with a method filter: one line per applicable flag — NAME (default) — meaning, composites as NAME = A|B|C — under group headers, most specific to the method first, under 5k chars); 'flag_details' (the full definitions and response paths for a method filter); 'response_schemas' (JSON response structure per method); 'migration' (V3→V4 breaking changes, renames, flag changes); 'all'. 'filter' accepts any spelling — 'get entity', 'get_entity', and 'getEntity' all resolve. Pass 'language' (python/java/csharp/rust/typescript) to narrow to your binding; cross-binding divergence warnings are still included so you never translate a call between bindings by mistake",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "filter": {
                "default": null,
                "description": "Optional filter: method name, class name, module name, or flag name.\nAny spelling resolves — `get entity`, `get_entity`, and `getEntity` all\nreach the same method.\n\nExamples are backticked, not double-quoted, on purpose: downstream\nclients derive a property's valid-value set from the double-quoted\ntokens in this description, so quoting examples here would advertise\nthem as the only accepted filters.",
                "type": ["string", "null"]
              },
              "language": {
                "default": null,
                "description": "Language binding: \"python\", \"java\", \"csharp\", \"rust\", or \"typescript\".\nNarrows signatures to that binding; cross-binding divergence warnings\nare kept either way. Omit to compare every binding side by side.",
                "type": ["string", "null"]
              },
              "topic": {
                "description": "Topic: \"parameters\" (aliases: functions, methods, classes, api,\nsignatures, args), \"flags\", \"flag_details\" (full flag definitions for a\nmethod filter), \"response_schemas\", \"migration\", or \"all\".\n\nYou do not need \"parameters\" just to see a signature: any topic filtered\nby a method name returns that method's signature in `method_signatures`.",
                "enum": ["parameters", "params", "parameter", "signatures", "signature", "arguments", "args", "functions", "function", "methods", "method", "classes", "class", "api", "flags", "flag_details", "flags_detail", "flags_full", "response_schemas", "response_schema", "responses", "migration", "all"],
                "type": "string"
              },
              "version": {
                "default": "current",
                "description": "Senzing version (default: \"current\")",
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get SDK Reference"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dbd0d24f36a13b892052ad3623cadc5ed2307b69f08fe8ef9a030face7a20b4d"
        },
        {
          "name": "mapping_workflow",
          "description": "Map source data to Senzing JSON through a guided 8-step workflow. Use this INSTEAD of hand-coding Senzing JSON. Optional `environment` — one of snowflake, aws_lambda, azure_functions, kafka, spark, databricks (aliases such as spcs, snowpark, lambda, azure_function, kafka_connect, apache_kafka, apache_spark, pyspark, lakebase, unity_catalog, sz_databricks, databricks_sql are accepted) — names where this deployment runs; the response then opens with `environment_note`, the rules for that environment and the search_docs query to run before writing code or SQL. For mapping_workflow the note is on the start response only; dotted DB.SCHEMA.TABLE source labels (bare or with a data-file extension) infer environment=snowflake.\n\nREQUIRED ARGUMENTS for action='start' — arguments, not files: `file_paths`, the source file name(s) exactly as the user gave them (a LABEL the server never opens, so pass it even when the file is not readable from here), AND `workspace_dir` (e.g. workspace_dir=\"/home/you/sz-workspace\") — a writable directory where scripts, reference docs, mapper code, and outputs are saved. Do NOT assume /tmp exists (some environments like Kiro do not provide it). The call needs both arguments present; it does NOT need the file to exist. OPTIONAL on start: `output_path` — the output file the USER ASKED FOR, if any (a .jsonl path; a directory ending in / for one <schema_name>.jsonl per schema; or a per-schema map {\"<schema_name>\": \"<path>.jsonl\"}). Omit it for the default <workspace_dir>/<name>_output.jsonl. Start arguments are accepted at the top level or inside `payload`.\n\nNO READABLE FILE, NO SHELL — START ANYWAY. If the user only DESCRIBED their columns, or you have no shell to run the profiler, step 1 accepts a `profile_summary` you write yourself: field_count from their column list, record_count as they stated it or 0 (zero means 'not measured' and is expected — it is not fabrication). An unreadable source file is NOT a reason to hand-code a mapping instead.\n\nActions: start, advance, back, status, reset. Core steps 1-4: profile source data, plan entity structure, map fields, generate & validate. Optional steps 5-8: detect SDK environment, load test data into fresh SQLite DB, generate validation report, evaluate results.\n\nSTATE: Every response returns a 'state' JSON object. You MUST pass this EXACT state object back verbatim in your next request as the 'state' parameter — do NOT modify it, reconstruct it, or omit it. The state is opaque and managed by the server. If you have lost the state, call with action='start' instead.\n\nCommon errors: (1) omitting state on advance — always include it, (2) reconstructing state from memory — always echo the exact JSON from the previous response, (3) omitting payload on advance — each step requires specific payload fields documented in the instructions (`data` is a legacy alias of `payload`), (4) omitting the file_paths or workspace_dir ARGUMENTS on start — the server needs the names, not a readable file.\n\nWhy not hand-code: hand-coded mappings produce wrong attribute names (EMPLOYER_NAME vs NAME_ORG, PHONE vs PHONE_NUMBER) and miss required fields like RECORD_ID.",
