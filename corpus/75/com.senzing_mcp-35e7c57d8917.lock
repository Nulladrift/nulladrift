        {
          "name": "find_examples",
          "description": "Find working SOURCE CODE examples from 53 indexed Senzing GitHub repositories. REQUIRED: either `query` (string, for search) or `repo` with `file_path` or `list_files=true` — the call WILL FAIL without one.\n\nThree modes: (1) Search: pass `query` to find examples across all repos, (2) File listing: pass `repo` + `list_files=true`, (3) File retrieval: pass `repo` + `file_path`.\n\nIndexes source code (.py, .java, .cs, .rs, .ts, .js) and READMEs — NOT build/data files. For sample data, use get_sample_data. Covers Python, Java, C# (official SDKs) plus Rust and TypeScript/Node.js (community-maintained wrappers, not official) SDK patterns: initialization, ingestion, search, redo, configuration, message queues, REST APIs. Use max_lines to limit large files. File retrieval returns the file's location instead of its content: follow the returned `resources` / `access_steps` exactly as given.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "file_path": {
                "description": "Return full content of a specific file in the repo (requires repo parameter)",
                "type": ["string", "null"]
              },
              "language": {
                "description": "Filter results by programming language (e.g. \"python\", \"java\", \"csharp\", \"rust\")",
                "type": ["string", "null"]
              },
              "list_files": {
                "default": null,
                "description": "Return the file listing for a repo instead of searching (requires repo parameter)",
                "type": ["boolean", "null"]
              },
              "max_lines": {
                "default": null,
                "description": "Maximum lines to return for file content (default: unlimited). Useful for large files.",
                "format": "uint",
                "minimum": 0,
                "type": ["integer", "null"]
              },
              "query": {
                "default": null,
                "description": "Search query (required for search mode, optional when using repo+file_path or repo+list_files)",
                "type": ["string", "null"]
              },
              "repo": {
                "description": "Filter to a specific indexed repo (e.g. \"brianmacy/sz_mem-v4\"). When combined with\nfile_path, returns full file content. When combined with list_files, returns file listing.",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find Code Examples"
          },
          "behavior": {
            "destructive": false,
