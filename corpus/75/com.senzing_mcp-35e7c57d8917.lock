        {
          "name": "reporting_guide",
          "description": "Guided reporting and visualization for Senzing entity resolution results. Optional `environment` — one of snowflake, aws_lambda, azure_functions, kafka, spark, databricks (aliases such as spcs, snowpark, lambda, azure_function, kafka_connect, apache_kafka, apache_spark, pyspark, lakebase, unity_catalog, sz_databricks, databricks_sql are accepted) — names where this deployment runs; the response then opens with `environment_note`, the rules for that environment and the search_docs query to run before writing code or SQL. Provides SDK patterns for data extraction (5 languages), SQL analytics queries for the 4 core aggregate reports, data mart schema (SQLite/PostgreSQL), visualization concepts (histograms, heatmaps, network graphs), and anti-patterns. Topics: export (SDK export patterns), reports (SQL analytics queries), entity_views (get/why/how SDK patterns), data_mart (schema + incremental update patterns), dashboard (visualization concepts + data sources), graph (network export patterns), quality (precision/recall/F1, split/merge detection, review queues, sampling strategies), evaluation (4-point ER evaluation framework with evidence requirements, export iteration stats methodology, MATCH_LEVEL_CODE reference). Returns decision trees when language/scale not specified.",
