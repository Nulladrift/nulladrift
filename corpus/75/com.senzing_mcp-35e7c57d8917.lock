        {
          "name": "get_sample_data",
          "description": "Get sample data for entity resolution. Available datasets: 'las-vegas', 'london', 'moscow' (CORD — Collections Of Relatable Data, REAL historical data) and 'truthset' (Senzing's SYNTHETIC demo truth set: CUSTOMERS, REFERENCE, WATCHLIST). Use dataset='list' to discover datasets, source='list' to see the sources/vendors within a dataset. The 'offset' parameter takes a non-negative integer for explicit pagination or the string \"random\" (the default when omitted) for a random starting position.\n\nIMPORTANT: The three CORD datasets ('las-vegas', 'london', 'moscow') are REAL data (not synthetic) — historical snapshots for evaluation only, not operational use. Always inform the user of this. This does NOT apply to 'truthset', which is Senzing's own synthetic demo truth set (github.com/Senzing/truth-sets) — do not describe those records as real people's data. Each response's citation carries the provenance for the dataset actually returned; follow it rather than this summary.\n\nWhen records are returned, a 'download_url' in the citation provides a way to fetch the full dataset, and 'source_download_url' points at the complete uncapped file. Always present the fetch instruction to the user exactly as given.\n\nDownloading the dataset TO DISK is expected and encouraged whenever the user wants the data — run the returned download instruction in a shell (a URL to fetch with curl/wget, or a local command) to write it to a file, and work from that file. What you must NOT do is pull the dataset INTO THE CONVERSATION: never echo, cat, paste or summarise raw records back into context, because these files run to hundreds of thousands of records. The inline records above are a small preview of the data shape, not the delivery mechanism. (An earlier wording of this line said only 'Do NOT download it yourself', which was read as a blanket ban on fetching and left users downloading files by hand.)\n\nIf a previously-known download instruction stops working, call this tool again to obtain the current one.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "dataset": {
                "description": "Dataset name (e.g., \"las-vegas\", \"london\", \"moscow\").\nUse \"list\" to discover available datasets and their sources.\n(Required: schema-respecting clients cannot omit it — pass \"list\" to discover.)",
                "type": "string"
              },
              "limit": {
                "default": null,
                "description": "Number of records to PREVIEW inline in this response — at most 5; a\nlarger value is capped. The inline records are a preview, NOT the\ndataset: for N records use the response's `download_url` (or its\nextract command when running locally), which delivers the full file —\nthen take the first N lines (`head -n N`), one JSON record per line.",
                "format": "uint",
                "minimum": 0,
                "type": ["integer", "null"]
              },
              "offset": {
                "default": null,
                "description": "Record offset. Use a number for explicit pagination, or \"random\" for a random starting position. Omit for random.",
                "oneOf": [
                  {
                    "description": "Explicit zero-based record offset for pagination.",
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "const": "random",
                    "description": "Start at a pseudo-random offset (same as omitting the field)."
                  },
                  {
                    "description": "Random start (same as omitting the field).",
                    "type": "null"
                  }
                ]
              },
              "source": {
                "description": "Filter by data source/vendor within a dataset (e.g., \"equifax\", \"ppp_loans\").\nOmit to see all sources. Use \"list\" to list available sources.",
                "type": ["string", "null"]
              }
            },
            "required": ["dataset"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Sample Data"
          },
          "behavior": {
            "destructive": false,
