{
  "lockfileVersion": 2,
  "subjects": {
    "build.toggle/htam": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://htam.toggle.build/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "htam-pilot",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "ask_seller",
          "description": "Ask a bounded product question using its item_id, or submit structured shopping requirements. With multiple items, item-specific questions require an item_id; none is assumed. Answers only supported questions from attributed catalog facts; otherwise not_known/no_match. A persisted receipt is not an answer or promise of a later reply. Free text is not retained, only generic categories and structured requirements. Payment capability is self-reported, never payment authority.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "budget": {
                "additionalProperties": false,
                "properties": {
                  "amount": {
                    "maximum": 1000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "currency": {
                    "pattern": "^[A-Z]{3}$",
                    "type": "string"
                  }
                },
                "required": ["amount", "currency"],
                "type": "object"
              },
              "category": {
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "deadline": {
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "item_id": {
                "pattern": "^[a-zA-Z0-9_-]{1,64}$",
                "type": "string"
              },
              "owner_approval_needed": {
                "type": "boolean"
              },
              "payment_rail_capability": {
                "enum": ["stripe_token", "grok_vault", "x402", "other", "unknown"],
                "type": "string"
              },
              "question": {
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "shopping_brief": {
                "maxLength": 700,
                "minLength": 1,
                "type": "string"
              },
              "topic": {
                "enum": ["condition", "measurements", "price", "availability", "shipping", "returns", "provenance", "other"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:cffb5e8623200de7b4421f6e7125a82b3d0f7fc02948cd3e2d3525d67a0748f1"
        },
        {
          "name": "get_item",
          "description": "Inspect the requested product facts, seller claims, price, measurements, source evidence and photographs. Use prepare_checkout to request a seller route. Unknown IDs return not_found; no private records are exposed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "item_id": {
                "pattern": "^[a-zA-Z0-9_-]{1,64}$",
                "type": "string"
              }
            },
            "required": ["item_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:051464a33e787d646318f6cbd5bf9a48b2bc664dff2d9136443703b044e7829d"
        },
        {
          "name": "prepare_checkout",
          "description": "Record explicit purchase intent for one unit of a catalog item. When enabled and approved, return the seller checkout link. Obtain buyer approval before proceeding. This creates no order or payment and does not verify checkout was reached.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "item_id": {
                "pattern": "^[a-zA-Z0-9_-]{1,64}$",
                "type": "string"
              },
              "purchase_intent": {
                "const": true,
                "type": "boolean"
              }
            },
            "required": ["item_id", "purchase_intent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:e3599206a5ad4f6cc1b820110ba389a4bb8f64a41ea73379621e7ab85bc2b751"
        },
        {
          "name": "search_items",
          "description": "Search all approved catalog products using a shopping description and optional requirements. Matches use attributed listing facts; unknown constraints are never confirmed. Use prepare_checkout to request a seller route. Synthetic test data is explicitly labeled.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "brand": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "budget": {
                "additionalProperties": false,
                "properties": {
                  "amount": {
                    "maximum": 1000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "currency": {
                    "pattern": "^[A-Z]{3}$",
                    "type": "string"
                  }
                },
                "required": ["amount", "currency"],
                "type": "object"
              },
              "category": {
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "color": {
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "deadline": {
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "description": {
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "designer": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "era": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "material": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "model": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "size": {
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:71c8da6502507d462ad87f90701264963de0b66be9a4efdbcb315d1c78c3e6e5"
        }
      ],
      "digest": "sha256:5fb23cdffadac875b12112fbae688057f339af35fc937fa2eb3479ca3664a34e"
    }
  }
}
