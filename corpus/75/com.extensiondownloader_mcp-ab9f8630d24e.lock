          "digest": "sha256:07084521e249bfe874d8d4185b0bf8b0dcfbab63e51347af79743531f0614c42"
        },
        {
          "name": "extension_rankings",
          "description": "Read our saved user-count leaderboard for one date, overall or within a category. Returns positions and pagination; not official store or keyword search ranks. Use extension_rank_history to follow one extension over time.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 50,
                "description": "Ranking rows per page, up to 250.",
                "maximum": 250,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "description": "Page number, starting at 1.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "rankDate": {
                "description": "Ranking date as YYYY-MM-DD in Asia/Shanghai. Omit for today; missing dates are not replaced with another date.",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "scopeKey": {
                "default": "all",
                "description": "Use all for overall scope; for category scope, use the recorded category key, not its translated display name.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "scopeType": {
                "default": "overall",
                "description": "Choose the overall catalog or one category leaderboard.",
                "enum": ["overall", "category"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
