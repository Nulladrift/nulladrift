        {
          "name": "extension_trending",
          "description": "Find growing extensions using saved 7/14/30/90-day user or rating-count growth rankings. Candidates have 1K-1M users and at least 500 net new users in the window. Free without a key for the first 10 by 30-day user gain; omit arguments for that preview. Missing comparison data is not zero growth; requests never rebuild rankings.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "fastGrowth": {
                "const": false,
                "default": false,
                "description": "Free preview does not apply the optional 20% user-growth filter.",
                "type": "boolean"
              },
              "page": {
                "const": 1,
                "default": 1,
                "description": "Free preview includes the first page only.",
                "type": "number"
              },
              "pageSize": {
                "const": 10,
                "default": 10,
                "description": "Free preview returns at most 10 extensions; omit to use this default.",
                "type": "number"
              },
