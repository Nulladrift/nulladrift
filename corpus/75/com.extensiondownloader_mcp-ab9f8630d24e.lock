        },
        {
          "name": "extension_reviews",
          "description": "Read original stored reviews for one extension, with text, star and language filters combined using AND. Returns reviews and pagination. For cross-extension or OR queries, use extension_reviews_search.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "eid": {
                "description": "32-letter Chrome Web Store extension ID (a-p), not a URL, name or slug. Example: cjpalhdlnbpafiamejdnhcphjbkeiagm.",
                "pattern": "^[a-p]{32}$",
                "type": "string"
              },
              "language": {
                "description": "Original review language, e.g. en. Omit for all languages; does not translate reviews.",
                "maxLength": 20,
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Page number, starting at 1.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "pageSize": {
                "default": 20,
                "description": "Results per page, up to 100.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Text to match in review bodies, e.g. subscription.",
                "maxLength": 500,
                "type": "string"
              },
              "rating": {
                "description": "Exact star rating from 1 to 5.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "default": "timestamp_desc",
                "description": "timestamp_desc/asc = newest/oldest first; rating_desc/asc = highest/lowest stars first.",
                "enum": ["timestamp_desc", "timestamp_asc", "rating_desc", "rating_asc"],
                "type": "string"
              }
            },
            "required": ["eid"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
