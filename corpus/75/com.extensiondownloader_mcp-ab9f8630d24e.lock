        },
        {
          "name": "extension_review_summary",
          "description": "Get an existing published AI summary of collected reviews, with pros and cons. Use extension_reviews for original comments. Returns null when unavailable and English when a translation is missing; never calls a model or generates a new summary.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "eid": {
                "description": "32-letter Chrome Web Store extension ID (a-p), not a URL, name or slug. Example: cjpalhdlnbpafiamejdnhcphjbkeiagm.",
                "pattern": "^[a-p]{32}$",
                "type": "string"
              },
              "locale": {
                "default": "en",
                "description": "Preferred response content language, not a review-language filter or a store search market.",
                "enum": ["en", "zh-CN", "es", "pt-BR", "ru", "fr", "ja", "ko"],
                "type": "string"
              }
            },
            "required": ["eid"],
            "type": "object"
          },
          "annotations": {
