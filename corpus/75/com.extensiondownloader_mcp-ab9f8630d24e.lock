          "digest": "sha256:3e69f3c01071a7d8bed6c75261db695e432ba57d8207f3f1b034e8d34d9f5b2c"
        },
        {
          "name": "extension_reviews_search",
          "description": "Search original stored reviews across extensions with AND/OR field filters. Returns reviews and pagination. Example filter: {\"field\":\"body\",\"operator\":\"contains\",\"value\":\"subscription\"}. Use extensionEid to narrow to an extension.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "filters": {
                "default": [],
                "description": "Up to 12 review filters. Example: [{\"field\":\"rating\",\"operator\":\"<=\",\"value\":2}]. Omit to browse retained reviews.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "field": {
                      "description": "Review field to filter. name is the extension name; body is the original review text; rating is stars, not average extension rating.",
                      "enum": ["id", "extensionEid", "name", "authorPicture", "authorId", "authorName", "rating", "body", "timestamp", "language", "version", "helpfulCount"],
                      "type": "string"
                    },
                    "operator": {
                      "description": "oneOf requires an array; exists/notExists need no value. >= and <= apply only to rating, helpfulCount or timestamp; contains/notContains apply to text fields.",
                      "enum": ["=", "!=", "oneOf", "contains", "notContains", "exists", "notExists", ">=", "<="],
                      "type": "string"
                    },
                    "value": {
                      "anyOf": [
                        {
                          "maxLength": 500,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "type": "number"
                        },
                        {
                          "items": {
                            "anyOf": [
                              {
                                "maxLength": 500,
                                "minLength": 1,
                                "type": "string"
                              },
                              {
                                "type": "number"
                              }
                            ]
                          },
                          "maxItems": 100,
                          "minItems": 1,
                          "type": "array"
                        }
                      ],
                      "description": "Scalar value, or an array for oneOf. rating uses 1-5; timestamp accepts Unix seconds/milliseconds or an ISO date/time. Omit for exists/notExists."
                    }
                  },
                  "required": ["field", "operator"],
                  "type": "object"
                },
                "maxItems": 12,
                "type": "array"
              },
              "logic": {
                "default": "AND",
                "description": "AND requires every filter to match; OR requires at least one.",
                "enum": ["AND", "OR"],
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Page number, starting at 1.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "pageSize": {
                "default": 20,
                "description": "Results per page, up to 100.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "default": "timestamp_desc",
                "description": "timestamp_desc/asc = newest/oldest first; rating_desc/asc = highest/lowest stars first.",
                "enum": ["timestamp_desc", "timestamp_asc", "rating_desc", "rating_asc"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
