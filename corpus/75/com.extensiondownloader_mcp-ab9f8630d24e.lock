  "subjects": {
    "com.extensiondownloader/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://extensiondownloader.com/api/mcp"
