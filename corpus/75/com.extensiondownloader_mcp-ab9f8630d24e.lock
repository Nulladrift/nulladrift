        {
          "name": "extension_review_insights",
          "description": "Read stored review statistics and star distribution for an extension, optionally by review language. These describe collected reviews, not all store ratings. Missing statistics return null; no refresh is triggered.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "eid": {
                "description": "32-letter Chrome Web Store extension ID (a-p), not a URL, name or slug. Example: cjpalhdlnbpafiamejdnhcphjbkeiagm.",
                "pattern": "^[a-p]{32}$",
                "type": "string"
              },
              "language": {
                "default": "all",
                "description": "Original review language, e.g. en; all combines languages. This filters reviews rather than translating the response.",
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              },
              "windowDays": {
                "anyOf": [
                  {
                    "const": 0,
                    "type": "number"
                  },
                  {
                    "const": 365,
                    "type": "number"
                  }
                ],
                "default": 0,
                "description": "0 = all retained reviews; 365 = the stored one-year review window."
              }
            },
            "required": ["eid"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
