{
  "lockfileVersion": 2,
  "subjects": {
    "br.net.lupashop/lupa-shop": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://lupashop.net.br/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "lupa-shop",
        "title": "Lupa Shop — comparador de preços do Brasil",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Comparador de preços brasileiro. Valores em reais (BRL). Mostre ao usuário o link da oferta escolhida. Nunca apresente desconto que não venha de \"preco_cheio_informado_pela_loja\" ou \"desconto_pct\".",
      "tools": [
        {
          "name": "buscar_preco",
          "description": "Procura um produto em várias lojas do Brasil (Shopee, Mercado Livre, Amazon, Magalu, lojas parceiras e mais de 130 lojas via Google Shopping) e devolve as ofertas do mais barato para o mais caro, com o \"preço justo\" (mediana do mercado) quando há preços suficientes do mesmo produto. Use para \"qual o menor preço de X\", \"onde comprar X mais barato\", \"X está caro?\".",
          "inputSchema": {
            "properties": {
              "limite": {
                "description": "Quantas ofertas devolver (padrão 10, máximo 25).",
                "type": "number"
              },
              "preco_maximo": {
                "description": "Opcional: não mostrar ofertas acima deste valor em reais.",
                "type": "number"
              },
              "produto": {
                "description": "O que procurar, em português, como uma pessoa diria. Ex.: \"air fryer 4 litros\", \"fone bluetooth jbl\", \"liquidificador mondial l-99\".",
                "type": "string"
              }
            },
            "required": ["produto"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1e89dda5e5d2ae5071a04cef68114ebff17a160924e1eebdfacf482c5de54cbb"
        },
        {
          "name": "comparar_lista",
          "description": "Compara uma LISTA DE COMPRAS inteira (até 10 produtos) nas lojas do Brasil: acha o menor preço de cada item, soma o total mais barato e mostra quanto sai comprando tudo numa loja só (menos frete). Use para \"quanto sai essa lista\", \"onde comprar tudo isso mais barato\", montar enxoval, cozinha, material escolar, presente etc.",
          "inputSchema": {
            "properties": {
              "itens": {
                "description": "Os produtos, em português. Pode pôr quantidade com \"2x\": [\"2x copo térmico\", \"air fryer 4 litros\", \"jogo de panelas antiaderente\"].",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "required": ["itens"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d167507b0cb67c922caa090acf18a8de1e4ab50297dfb61cc14ec41c10d644f9"
        },
        {
          "name": "historico_preco",
          "description": "Mostra o histórico REAL de preços que a Lupa registrou para um produto (menor preço visto por dia), para dizer se o preço de hoje está bom ou se já esteve mais barato. Só existe para produtos que já foram pesquisados; o histórico cresce a cada dia.",
          "inputSchema": {
            "properties": {
              "produto": {
                "description": "O produto, em português. Ex.: \"air fryer 4l\".",
                "type": "string"
              }
            },
            "required": ["produto"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e35b4f9506ceaf93d0f42f7c5a827b41152ea816f028e377a939aed7f0923966"
        },
        {
          "name": "ofertas_do_dia",
          "description": "Ofertas com desconto REAL de hoje (desconto informado pela própria loja, nunca inventado), da Shopee e de lojas parceiras. Filtra por categoria e preço máximo. Use para \"promoções de hoje\", \"ofertas de eletrônicos\", \"achadinhos até R$ 50\".",
          "inputSchema": {
            "properties": {
              "categoria": {
                "description": "Opcional. Uma de: Casa, Cozinha, Moda, Acessórios, Calçados, Beleza, Eletrônicos, Cama e banho, Ferramentas, Esporte, Escritório, Pet.",
                "type": "string"
              },
              "limite": {
                "description": "Padrão 10, máximo 30.",
                "type": "number"
              },
              "preco_maximo": {
                "description": "Opcional, em reais.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:77d2b80d8e5c066ad123e938faa9e965e6b937225bd4e5544be25b2aaec1274e"
        }
      ],
      "digest": "sha256:7015a61f042361baabf8c537495922618cc5429344a219f8dba2d63ded66b1c5"
    }
  }
}
