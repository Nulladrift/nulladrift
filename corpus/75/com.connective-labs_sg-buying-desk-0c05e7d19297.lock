        {
          "name": "quote_office_supplies",
          "title": "Instant quote for office and IT supplies",
          "description": "Current all-in SGD price (9% GST and Singapore delivery included) and ready-by date for office, IT and electronics supplies, single units welcome: cables and adapters (HDMI, DisplayPort, USB-C, VGA, network), USB hubs and docks, storage (flash drives, microSD/SD cards, SSDs, hard drives), peripherals (mice, keyboards, webcams, headsets, speakers), monitors, UPS units, networking (switches, routers), printers, ink and toner, label tapes, tools. Pass category, brand, model, specs, quantity and needed_by whenever you know them, plus the buyer's own words in item. Key specs by category: cables: connector at each end + length in metres; adapters: from + to connector; memory cards: card type (microSD/SD/CF) + capacity; flash drives: capacity + connector (USB-A/USB-C); SSD/HDD: capacity + internal or external; UPS: VA rating or model; ink and toner: printer brand + cartridge code (or printer model) + colour; mice/keyboards: model, or wired/wireless; monitors: size in inches; network switches: port count. Each option carries confidence: exact (model number matches), spec (category and every key spec given match) or similar (closest line, with the differences listed). If the request is too vague to price, the result has match 'needs_detail' and lists what to ask the buyer; ask, then call again. Never invent a price: if nothing matches, call request_quote with category office-it-supplies. Example input: {\"item\":\"HDMI cable 5m\",\"quantity\":2}.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "Brand, e.g. HP, Brother, Canon, Logitech, SanDisk, APC, Eaton, Ugreen.",
                "type": "string"
              },
              "category": {
                "description": "The kind of item, which decides which price table and specs apply; leave it out if unsure. ink-toner covers ink, toner and ribbons; usb-hub covers hubs and docking stations; camera covers webcams.",
                "enum": ["cable", "adapter", "usb-hub", "memory-card", "flash-drive", "ssd", "hdd", "card-reader", "ups", "ups-accessory", "ink-toner", "label-tape", "mouse", "keyboard", "keyboard-mouse", "mousepad", "monitor", "camera", "headset", "speaker", "printer", "network-switch", "router", "kvm", "av-switch", "power", "tool", "ram", "optical", "blocker", "projector"],
                "type": "string"
              },
              "item": {
                "description": "The buyer's own wording, e.g. 'HDMI cable 5m', 'microSD 128GB', 'Logitech M185', 'HP 206A cyan toner'. Kept for compatibility; structured fields below improve matching.",
                "type": "string"
              },
              "model": {
                "description": "Model number or cartridge code exactly as printed, e.g. 'M185', '206A', 'TN-2480', '5E700UI'. For ink or toner the printer model also works, e.g. 'M283fdw'.",
                "type": "string"
              },
              "needed_by": {
                "description": "The date the buyer must have the items in hand, in Singapore time. Each option then shows makes_deadline, meaning whether it arrives in time. If left out, options are listed without a deadline check.",
                "format": "date",
                "type": "string"
              },
              "quantity": {
                "default": 1,
                "description": "How many units the buyer wants priced.",
                "minimum": 1,
                "type": "integer"
              },
              "specs": {
                "description": "Key specs you know. Use the fields that apply to the category; omit the rest.",
                "properties": {
                  "capacity": {
                    "description": "Storage capacity, e.g. '128GB', '2TB'.",
                    "type": "string"
                  },
                  "card_type": {
                    "description": "Memory card type.",
                    "enum": ["microSD", "SD", "CF"],
                    "type": "string"
                  },
                  "colour": {
                    "description": "Ink or toner colour: black, cyan, magenta, yellow.",
                    "type": "string"
                  },
                  "connectors": {
                    "description": "Connector at each end, e.g. ['HDMI','HDMI'], ['USB-C','USB-A'], ['RJ45']. For hubs and flash drives, the host connector.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "interface": {
                    "description": "Other interface detail, e.g. 'USB 3.0', 'Cat6', 'external', 'M.2 NVMe'.",
                    "type": "string"
                  },
                  "length": {
                    "description": "Cable length, e.g. '5m'.",
                    "type": "string"
                  },
                  "ports": {
                    "description": "Number of ports (hubs, switches).",
                    "type": "integer"
                  },
                  "screen_size": {
                    "description": "Monitor size, e.g. '24 inch'.",
                    "type": "string"
                  },
                  "va_rating": {
                    "description": "UPS rating, e.g. '1000VA' or '1.5kVA'.",
                    "type": "string"
                  },
                  "wireless": {
                    "description": "true for wireless, false for wired (mice, keyboards, headsets).",
                    "type": "boolean"
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
