        "name": "com.connective-labs/sg-buying-desk",
        "title": "Singapore Buying Desk (Connective Labs)",
        "version": "0.8.1",
        "description": "Helps agents price and order office, IT and event-print supplies in Singapore: firm all-in SGD quotes with delivery dates, multi-item lists, firm quote requests, plus Singapore address, holiday and errand lookups.",
        "websiteUrl": "https://mcp.connective-labs.com/",
