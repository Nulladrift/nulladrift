        {
          "name": "resolve_sg_address",
          "title": "Look up a Singapore address, postal code or building",
          "description": "Use when the user gives or asks about a Singapore postal code, block and street, unit number, or building or place name: what building or postal code it is, whether it is an HDB block, a condominium or a commercial building, the nearest MRT/LRT station and roughly how long the walk is, which postal district or HDB town it is in, or what a courier or delivery needs to know (guardhouse, loading bay). Returns the normalized address with block, street, postal code and parsed unit (floor and unit number), latitude and longitude, postal district (plus HDB town for HDB blocks), the 2 nearest MRT/LRT stations with straight-line distance and an approximate walking time, the building type and a one-line delivery note ('unknown' when the type cannot be told). Gives up to 3 candidates when the input is ambiguous and warns when the block, street or floor does not match. Singapore only. Data: OneMap search (Singapore Land Authority), LTA station exits and HDB property data from data.gov.sg. Read-only. Example input: {\"query\":\"570151\"}.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "One Singapore location as the user wrote it: a 6-digit postal code, an address with block, street and optional #floor-unit, or a building or place name, e.g. '570151', 'Blk 123 Ang Mo Kio Ave 6 #04-56', 'Suntec Tower 3', 'ION Orchard'. Abbreviations such as Blk, Ave, St, Lor are fine.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Look up a Singapore address, postal code or building"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4901e9a2046748f42e161b57c0d319b852e7d2c7135bc57cc1ffeddcd3720a5d"
        },
        {
          "name": "rush_order_status",
          "title": "Check quote request or order status",
          "description": "Check the status of a custom quote request or order by its reference. Returns its status (received, acknowledged, quoted or closed), the timestamps for each step, the reply-by time, its history and the firm quote once issued. Example input: {\"reference\":\"Q-ABC123\"}.",
          "inputSchema": {
            "properties": {
              "reference": {
                "description": "The Q- or E- reference returned by request_quote, e.g. Q-ABC123.",
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
