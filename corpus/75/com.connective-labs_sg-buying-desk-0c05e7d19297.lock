      "instructions": "Singapore Buying Desk (Connective Labs). Main lane: office and IT supplies (cables, storage, peripherals, monitors, UPS, networking, ink and toner). Call quote_office_supplies with category, brand, model, specs, quantity and needed_by when known, plus the buyer's words in item. For a list of several items, call quote_list once with all lines; it returns per-line match levels, prices, a total and what to clarify, and request_quote converts it to a firm quote via list_id. Each option is labelled exact, spec or similar; if the result says needs_detail, ask the buyer what it lists and call again rather than guessing. Secondary lane: event print and merch. quote_event_print gives instant prices for name cards, lanyards, roll-up banners and tote bags; anything custom goes to request_quote. request_quote also handles unmatched supplies, rush deadlines and orders. Operated by Connective Labs Pte. Ltd. (Singapore UEN 202543350R) as merchant of record. Nothing is charged until the buyer approves a firm quote; full refund if the confirmed date is missed. Also for errands in Singapore, for residents and visitors: resolve_sg_address turns a postal code, address or place name into a confirmed address with building type, nearest MRT and a delivery note; singapore_how_to says which agency or business handles a task (government processes, visitor questions such as visas, GST refunds, transit and SIM cards, HDB matters), the official link, login needs, fees where officially stated, and whether the user must act themselves.",
