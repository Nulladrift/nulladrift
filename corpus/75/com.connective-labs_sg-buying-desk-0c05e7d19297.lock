        },
        {
          "name": "request_quote",
          "title": "Request a firm quote",
          "description": "Submit a request for a firm quote. Use it for one item (category, description, quantity) or for a whole list: pass items (the same line items you gave quote_list) or the list_id that quote_list returned. Covers office or IT items not matched by quote_office_supplies, custom event print and merch (backdrops, signage, branded merch, flyers, packaging), unusual specs, deadlines faster than any instant option, and orders for instantly priced items. Returns a reference; a firm price and date is sent to the contact email, usually the same business day. Nothing is charged until the buyer approves the firm quote. Singapore delivery only. Example input: {\"items\":[\"3 x HDMI cable 5m\"],\"needed_by\":\"2026-11-15\",\"contact_email\":\"buyer@example.com\"}.",
          "inputSchema": {
            "properties": {
              "budget_sgd": {
                "description": "Optional maximum budget in SGD.",
                "type": "number"
              },
              "category": {
                "description": "For a single-item request, the kind of product or print job being quoted. Leave it out when sending items or list_id.",
                "enum": ["office-it-supplies", "name-cards", "lanyards", "roll-up-banners", "tote-bags", "backdrops", "event-merch", "printed-collateral", "packaging"],
                "type": "string"
              },
              "company": {
                "description": "Buyer's company, if any.",
                "type": "string"
              },
              "contact_email": {
                "description": "Where to send the firm quote.",
                "type": "string"
              },
              "contact_name": {
                "description": "Buyer's name, used to address the firm quote.",
                "type": "string"
              },
              "delivery_location": {
                "description": "Delivery address or area in Singapore, or 'self-collect'.",
                "type": "string"
              },
              "description": {
                "description": "Single-item requests: what is needed, with all known specs (brand, model, connectors, capacity, size, material, finish, colours, artwork status). For a list, any overall notes.",
                "type": "string"
              },
              "items": {
                "description": "For a list request, the lines the buyer wants quoted, each a string like '2 x HDMI cable 5m' or an object with item, quantity and optional category, brand, model, specs (same shape as quote_list).",
                "items": {
                  "anyOf": [
                    {
                      "type": "string"
                    },
                    {
                      "type": "object"
                    }
                  ]
                },
                "maxItems": 50,
                "type": "array"
              },
              "list_id": {
                "description": "List requests: the list_id returned by quote_list (valid 14 days). Its lines are used when items is not given.",
                "type": "string"
              },
              "needed_by": {
                "description": "Deadline date, YYYY-MM-DD.",
                "type": "string"
              },
              "quantity": {
                "description": "For a single-item request, how many units the buyer wants quoted.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["contact_email", "needed_by"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a firm quote"
          },
          "behavior": {
            "destructive": true,
