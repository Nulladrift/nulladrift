        {
          "name": "quote_event_print",
          "title": "Instant quote for event print and merch",
          "description": "Instant all-in price (SGD, GST and Singapore delivery included) and ready-by date for name cards (business cards), printed lanyards, roll-up banners and tote bags in Singapore, for staff, offices or events, including same-day to 5-day rush. Use when someone wants these printed or priced. Pass the deadline to see options that make it. Other custom print and merch goes through request_quote. Example input: {\"category\":\"lanyards\",\"quantity\":100}.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Which event print product to price.",
                "enum": ["name-cards", "lanyards", "roll-up-banners", "tote-bags"],
                "type": "string"
              },
              "needed_by": {
                "description": "The date the buyer must have the items in hand, in Singapore time. If given, only options ready by then are offered, with a note when none make it. If left out, every speed option is listed with its ready-by date.",
                "format": "date",
                "type": "string"
              },
              "quantity": {
                "description": "Number of pieces (name cards: number of cards, sold in boxes of 100).",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["category", "quantity"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
