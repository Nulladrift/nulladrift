        {
          "name": "quote_list",
          "title": "Price a list of items (RFQ)",
          "description": "Price a whole shopping list or RFQ in one call: many line items, each with its own quantity, for office and IT supplies and instant event print (name cards, lanyards, roll-up banners, tote bags). Returns per line the match level (exact, spec, similar, needs_detail or no_match), the all-in SGD price (9% GST and Singapore delivery included) and the ready-by date, plus a total for priced lines and a list of what to clarify with the buyer. Pass lines as strings ('3 x HDMI cable 5m') or objects with item, quantity, category, brand, model, specs. Never invent prices for unpriced lines: ask what clarify lists, or convert the list to a firm quote with request_quote (pass list_id). Example input: {\"items\":[\"3 x HDMI cable 5m\",\"microSD 128GB x10\"]}.",
          "inputSchema": {
            "properties": {
              "buyer_email": {
                "description": "Optional: buyer email, used if the list is converted to a firm quote.",
                "type": "string"
              },
              "company": {
                "description": "Optional: buyer company.",
                "type": "string"
              },
              "delivery_area": {
                "description": "Delivery address or area in Singapore (prices already include Singapore delivery).",
                "type": "string"
              },
              "items": {
                "description": "Line items, up to 50.",
                "items": {
                  "anyOf": [
                    {
                      "description": "One line in the buyer's words, quantity included, e.g. '3 x HDMI cable 5m', 'microSD 128GB x10', '2 pcs HP 206A cyan toner'.",
                      "type": "string"
                    },
                    {
                      "properties": {
                        "brand": {
                          "description": "Brand, e.g. HP, Logitech, SanDisk.",
                          "type": "string"
                        },
                        "category": {
                          "description": "Optional: a supplies category (cable, adapter, usb-hub, memory-card, flash-drive, ssd, hdd, card-reader, ...) or an event print category (name-cards, lanyards, roll-up-banners, tote-bags).",
                          "type": "string"
                        },
                        "item": {
                          "description": "The buyer's own wording for this line.",
                          "type": "string"
                        },
                        "model": {
                          "description": "Model number or cartridge code exactly as printed.",
                          "type": "string"
                        },
                        "quantity": {
                          "default": 1,
                          "description": "How many units of this line item the buyer needs.",
                          "minimum": 1,
                          "type": "integer"
                        },
                        "specs": {
                          "description": "Technical details that pin down the exact product, such as connector types, cable length, storage capacity or screen size. Uses the same fields as quote_office_supplies specs: connectors, length, capacity, card_type, va_rating, colour, ports, screen_size, wireless, interface.",
                          "type": "object"
                        }
                      },
                      "type": "object"
                    }
                  ]
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "needed_by": {
                "description": "Deadline for the whole list, YYYY-MM-DD, Singapore time.",
                "type": "string"
              },
              "text": {
                "description": "Alternative to items: a pasted free-text list, one item per line (quantities like '3 x', 'x3', '3 pcs' are recognised).",
                "type": "string"
              }
            },
            "type": "object"
          },
