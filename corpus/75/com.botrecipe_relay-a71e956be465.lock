{
  "lockfileVersion": 2,
  "subjects": {
    "com.botrecipe/relay": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://relay.cloudforbots.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "human-handoff",
        "title": "Human Handoff relay",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Human-in-the-loop relay for AI agents. When your agent hits a CAPTCHA, a 2FA code, an approval or a sign-in it should not do alone, it calls request_human; your person gets a one-tap link, solves it in their own browser or pastes the code, and the answer comes back to your agent. Codes are read once and wiped in 10 minutes. We never solve CAPTCHAs and never ask for passwords. Free 500 calls/day, then $9/month. No model inside: bring your own model. Works with Claude, Codex, ChatGPT, Grok Bot.",
      "tools": [
        {
          "name": "cancel_request",
          "description": "Cancel a pending request (for example your agent got past the step another way). The link stops working and any unread code is wiped.",
          "inputSchema": {
            "properties": {
              "request_id": {
                "type": "string"
              }
            },
            "required": ["request_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9193344b691db21c3079c678d56434aaa756ff1076219175959c3b50e0f0a288"
        },
        {
          "name": "check_request",
          "description": "Poll a request: pending, done, approved, denied, code_ready, expired or cancelled. For 2fa_code, the code is returned exactly once (single read) and only within 10 minutes of the person sending it; then it is wiped.",
          "inputSchema": {
            "properties": {
              "request_id": {
                "type": "string"
              }
            },
            "required": ["request_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:469ebcd24118738bf3dd62c1044336f8d24f69f98bcdfb8c3247c20b431dd3b1"
        },
        {
          "name": "request_human",
          "description": "Hand one blocked step to your human: a CAPTCHA, a 2FA/OTP code, an approval, or a sign-in your agent should not do alone. Pro acts: sends your person a one-tap link (to notify_webhook, Slack/Discord-compatible, and/or notify_email), returns request_id, and later an HMAC-signed POST to callback_url when they answer. Free watch-only logs a would_request for the weekly stuck report and sends nothing. We never solve CAPTCHAs and never ask for passwords.",
          "inputSchema": {
            "properties": {
              "agent": {
                "description": "Your agent's name, shown to the person.",
                "type": "string"
              },
              "callback_url": {
                "description": "Pro: public https URL we POST the answer to, signed with X-Relay-Signature = hex HMAC-SHA256(callback_secret, timestamp + \".\" + body).",
                "type": "string"
              },
              "kind": {
                "description": "captcha (person solves it in their browser), 2fa_code (person pastes the code; you read it once), approve (yes/no), login (person signs in, then taps done).",
                "enum": ["captcha", "2fa_code", "approve", "login"],
                "type": "string"
              },
              "notify_email": {
                "description": "Pro: email address to send the one-tap link to.",
                "type": "string"
              },
              "notify_webhook": {
                "description": "Pro: public https URL we POST {text, human_url} to (Slack/Discord incoming webhooks work).",
                "type": "string"
              },
              "step": {
                "description": "One plain sentence for the person, e.g. \"Paste the 6-digit code GitHub just texted you\".",
                "type": "string"
              },
              "timeout_minutes": {
                "description": "How long the person has, 1-1440. Default 30.",
                "type": "integer"
              },
              "url": {
                "description": "The page the person should open, if any (https).",
                "type": "string"
              }
            },
            "required": ["kind", "step"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7f524a976e3120d0830c79b029c4482790c61f90cbdee7d52d2005e249678a9d"
        },
        {
          "name": "usage_and_upgrade",
          "description": "Show today's usage for your key or IP and the $9/month upgrade link. Free tier: 500 calls/day. Not metered.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9976e3342e295e0be5a023bb57d60324ebd7c104df1c76e8d7effcdadec38b20"
        },
        {
          "name": "weekly_report",
          "description": "Plain-English summary of the last 7 days: where your agent got stuck (by kind and by site), requests sent or that would have been, how many your person answered and how fast. Read-only; sends nothing. Needs a free API key.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:85a6b90c0038a0ab036dada048a16ec4ae4a1899a624162aa0ea93bd9307ec4b"
        }
      ],
      "digest": "sha256:dc05af2b03ada8f942f4ae51f37507f65489f15cef052dbc0d6c2a9cdb896a6b"
    }
  }
}
