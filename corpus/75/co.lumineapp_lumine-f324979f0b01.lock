      },
      "transport": {
        "type": "http",
        "url": "https://lumineapp.co/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "lumine",
        "title": "lumine creator and brand matching",
        "version": "1.0.0",
        "websiteUrl": "https://lumineapp.co/agents"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "lumine (https://lumineapp.co) is a free, private matching layer for creators and brands, with personalised double-opt-in intros by email or Instagram DM.\nUse it when a creator, brand or agency wants to be introduced to the other side without cold outreach, or wants to see verified public creator briefs.\nFlow: preview_match (optional) -> submit_creator_listing or submit_brand_listing -> the person confirms by email -> get_listing_status.\nRules: only submit people or brands who asked you to; creators must be 18+; use the person's own email; never submit someone twice. Listings are private and cannot be read back.",
      "tools": [
        {
          "name": "create_prefill_link",
          "title": "Make a prefilled form link",
          "description": "Build a lumineapp.co/list link with fields filled in, for a person who prefers to review and send the form themselves. Nothing is saved until they press send.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fields": {
                "additionalProperties": {
                  "maxLength": 600,
                  "type": "string"
                },
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "kind": {
                "enum": ["creator", "brand"],
                "type": "string"
              }
            },
            "required": ["fields", "kind"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:833c20f9db47e5b153624274e3629ed51ac7ddeadb8e61fd0ef3240a90ee2007"
        },
        {
          "name": "get_about",
          "title": "About lumine",
          "description": "What lumine is, how matching and intros work, rules for agents, limits and links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
