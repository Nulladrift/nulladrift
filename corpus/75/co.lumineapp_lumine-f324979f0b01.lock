                                    "type": {
                                      "const": "paid",
                                      "type": "string"
                                    }
                                  },
                                  "required": ["currency", "max", "min", "type"],
                                  "type": "object"
                                },
                                {
                                  "additionalProperties": false,
                                  "properties": {
                                    "currency": {
                                      "enum": ["USD", "EUR", "GBP", "CAD", "AUD", "MXN", "INR", "NPR", "AED", "SGD"],
                                      "type": "string"
                                    },
                                    "gift": {
                                      "maxLength": 200,
                                      "minLength": 1,
                                      "type": "string"
                                    },
                                    "max": {
                                      "minimum": 0,
                                      "type": "number"
                                    },
                                    "min": {
                                      "minimum": 0,
