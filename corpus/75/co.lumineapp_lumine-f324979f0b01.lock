                                    },
                                    "type": {
                                      "const": "gift",
                                      "type": "string"
                                    }
                                  },
                                  "required": ["detail", "type"],
                                  "type": "object"
                                },
                                {
                                  "additionalProperties": false,
                                  "properties": {
                                    "currency": {
                                      "enum": ["USD", "EUR", "GBP", "CAD", "AUD", "MXN", "INR", "NPR", "AED", "SGD"],
                                      "type": "string"
