          },
          "digest": "sha256:b63f3c6b5cdfc82fde8c20781cfa6b94d7b1071af16b28c90d3b23343af28c2d"
        },
        {
          "name": "list_open_briefs",
          "title": "List open creator briefs",
          "description": "A few featured public creator briefs (UGC, creator roles, hosting, ambassador), rotated daily, copied from live public postings and verified. Filter by region, category or keyword. Apply on each brief's apply_url, or submit a listing to be matched and introduced instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "enum": ["UGC & short-form video", "Content creator roles", "On-camera & hosting", "Brand & campus ambassador"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "maxLength": 80,
                "type": "string"
              },
              "region": {
                "enum": ["India", "US", "UK", "Global Remote", "Europe", "Asia-Pacific & MEA", "Canada & LatAm"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:85338bdcd387875da1e0b138bd3590940c350e9e9166ce783eb04fa8fe3285da"
        },
        {
          "name": "preview_match",
          "title": "Preview fit and readiness",
          "description": "Send a creator or brand profile and get a readiness score, missing fields, and which public briefs fit and why. Stores nothing and never reveals private listings. Use before submitting.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "enum": ["creator", "brand"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "profile": {
                "additionalProperties": false,
                "properties": {
                  "bio": {
                    "maxLength": 600,
                    "type": "string"
                  },
                  "category": {
                    "maxLength": 60,
                    "type": "string"
                  },
                  "city": {
                    "maxLength": 60,
                    "type": "string"
                  },
                  "compensation_type": {
                    "enum": ["gift", "paid", "either"],
                    "type": "string"
                  },
                  "country": {
                    "maxLength": 60,
                    "type": "string"
                  },
                  "deliverable": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "email": {
                    "description": "Only counted as present or missing. Never stored or echoed.",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "engagement_rate": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "followers": {
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "handle": {
                    "maxLength": 60,
                    "type": "string"
                  },
                  "language": {
                    "maxLength": 60,
                    "type": "string"
                  },
                  "looking_for": {
                    "maxLength": 400,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 100,
                    "type": "string"
                  },
                  "niche": {
                    "maxLength": 60,
                    "type": "string"
                  },
                  "platform": {
                    "enum": ["Instagram", "YouTube", "TikTok"],
                    "type": "string"
                  },
                  "platforms": {
                    "description": "Optional. If sent, this is stored and the single platform/handle fields are taken from the main entry. If omitted, the single platform field works as before.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "handle": {
                          "description": "Handle or link for this platform. Optional on brands; used for a creator's main handle.",
                          "maxLength": 60,
                          "type": "string"
                        },
                        "main": {
                          "description": "True if this is the main platform. Defaults to the first entry if none is marked.",
                          "type": "boolean"
                        },
                        "platform": {
                          "description": "One of the platforms people can pick on /list.",
                          "enum": ["Instagram", "YouTube", "TikTok", "X", "LinkedIn", "Snapchat", "Twitch", "Spotify / podcast", "Other"],
                          "type": "string"
                        },
                        "text": {
                          "description": "The custom platform name. Required when platform is Other.",
                          "maxLength": 60,
                          "type": "string"
                        }
                      },
                      "required": ["platform"],
                      "type": "object"
                    },
                    "maxItems": 9,
                    "minItems": 1,
                    "type": "array"
                  },
                  "remote_ok": {
                    "description": "Creator is open to remote briefs. Defaults to true.",
                    "type": "boolean"
                  },
                  "shop_kind": {
                    "enum": ["Local shop", "Cafe", "Home business", "Indie label", "Maker"],
                    "type": "string"
                  },
                  "social": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "summary": {
                    "maxLength": 600,
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["kind", "profile"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:12dfcd5bfd87bb4116826f3b640b7c9f8199a71df3f7c3e465b64db14b74c194"
        },
        {
          "name": "submit_agency_roster",
          "title": "Import an agency roster",
          "description": "Bulk-list up to 100 creators or brands an agency represents. The agency contact confirms the roster by email first, then every member confirms their own listing. Nobody is matched before their own yes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "_hp": {
                "description": "Leave empty or omit. Requests with a value are rejected.",
                "maxLength": 0,
                "type": "string"
              },
              "agency": {
                "additionalProperties": false,
                "properties": {
                  "email": {
                    "description": "Agency contact email. Confirms the roster when email confirmation is on.",
                    "format": "email",
                    "maxLength": 200,
                    "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  "side": {
                    "description": "Which side the agency represents.",
                    "enum": ["creator", "brand", "both"],
                    "type": "string"
                  },
                  "website": {
                    "format": "uri",
                    "maxLength": 300,
                    "type": "string"
                  }
                },
                "required": ["email", "name", "side"],
                "type": "object"
              },
              "agent": {
                "additionalProperties": false,
                "properties": {
                  "contact_email": {
                    "description": "Where lumine can reach the agent operator about abuse or errors.",
                    "format": "email",
                    "maxLength": 200,
                    "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                    "type": "string"
                  },
                  "name": {
                    "description": "Name of the agent or product submitting, for example 'Acme Talent Assistant'.",
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  "on_behalf_of": {
                    "default": "principal",
                    "description": "Who the listing is for: the agent's own principal, an agency client, or the operator itself.",
                    "enum": ["self", "principal", "agency"],
                    "type": "string"
                  },
                  "url": {
                    "description": "Homepage of the agent or its operator.",
                    "format": "uri",
                    "maxLength": 300,
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "consent": {
                "additionalProperties": false,
                "properties": {
                  "agency_represents_each_member": {
                    "const": true,
                    "description": "The agency represents every person or brand in the roster.",
                    "type": "boolean"
                  },
                  "agrees_to_privacy_policy": {
                    "const": true,
                    "type": "boolean"
                  },
                  "creators_are_18_plus": {
                    "const": true,
                    "description": "Every creator in the roster is 18 or older.",
                    "type": "boolean"
                  },
                  "members_may_be_emailed": {
                    "const": true,
                    "description": "lumine may email each member about their own listing.",
                    "type": "boolean"
                  }
                },
                "required": ["agency_represents_each_member", "agrees_to_privacy_policy", "creators_are_18_plus", "members_may_be_emailed"],
                "type": "object"
              },
              "members": {
                "items": {
                  "oneOf": [
                    {
                      "additionalProperties": false,
                      "properties": {
                        "kind": {
                          "const": "creator",
                          "type": "string"
                        },
                        "profile": {
                          "additionalProperties": false,
                          "properties": {
                            "age_confirmed_18_plus": {
                              "const": true,
                              "description": "Required. The creator is 18 or older. lumine does not accept listings for minors.",
                              "type": "boolean"
                            },
                            "bio": {
                              "description": "Two lines about what they make.",
                              "maxLength": 600,
                              "type": "string"
                            },
                            "city": {
                              "maxLength": 60,
                              "type": "string"
                            },
                            "country": {
                              "maxLength": 60,
                              "type": "string"
                            },
                            "email": {
                              "description": "Creator's own email, never the agent's. Confirmations and intros go here.",
                              "format": "email",
                              "maxLength": 200,
                              "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                              "type": "string"
                            },
                            "engagement_rate": {
                              "description": "Percent, for example 4.5.",
                              "maximum": 100,
                              "minimum": 0,
                              "type": "number"
                            },
                            "followers": {
                              "maximum": 1000000000,
                              "minimum": 0,
                              "type": "integer"
                            },
                            "handle": {
                              "description": "Main social handle, with or without @.",
                              "maxLength": 60,
                              "type": "string"
                            },
                            "language": {
                              "description": "Main language they create in.",
                              "maxLength": 60,
                              "type": "string"
                            },
                            "name": {
                              "description": "Creator's name as they want it shown in an intro.",
                              "maxLength": 80,
                              "minLength": 1,
                              "type": "string"
                            },
                            "niche": {
                              "description": "For example Beauty, Food, Tech, Music, Slow fashion.",
                              "maxLength": 60,
                              "type": "string"
                            },
                            "platform": {
                              "description": "Main platform when sending only one. Still accepted. Instagram, YouTube or TikTok.",
                              "enum": ["Instagram", "YouTube", "TikTok"],
                              "type": "string"
                            },
                            "platforms": {
                              "description": "Optional. If sent, this is stored and the single platform/handle fields are taken from the main entry. If omitted, the single platform field works as before.",
                              "items": {
                                "additionalProperties": false,
                                "properties": {
                                  "handle": {
                                    "description": "Handle or link for this platform. Optional on brands; used for a creator's main handle.",
                                    "maxLength": 60,
                                    "type": "string"
                                  },
                                  "main": {
                                    "description": "True if this is the main platform. Defaults to the first entry if none is marked.",
                                    "type": "boolean"
                                  },
                                  "platform": {
                                    "description": "One of the platforms people can pick on /list.",
                                    "enum": ["Instagram", "YouTube", "TikTok", "X", "LinkedIn", "Snapchat", "Twitch", "Spotify / podcast", "Other"],
                                    "type": "string"
                                  },
                                  "text": {
                                    "description": "The custom platform name. Required when platform is Other.",
                                    "maxLength": 60,
                                    "type": "string"
                                  }
                                },
                                "required": ["platform"],
                                "type": "object"
                              },
                              "maxItems": 9,
                              "minItems": 1,
                              "type": "array"
                            }
                          },
                          "required": ["age_confirmed_18_plus", "email", "name"],
                          "type": "object"
                        }
                      },
                      "required": ["kind", "profile"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "kind": {
                          "const": "brand",
                          "type": "string"
                        },
                        "profile": {
                          "additionalProperties": false,
                          "properties": {
                            "category": {
                              "maxLength": 60,
                              "type": "string"
                            },
                            "city": {
                              "maxLength": 60,
                              "type": "string"
                            },
