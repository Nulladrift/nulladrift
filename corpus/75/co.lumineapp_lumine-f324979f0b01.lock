        {
          "name": "get_listing_status",
          "title": "Check a listing's status",
          "description": "Status of a listing you submitted: pending_confirmation, confirmed, in_review, matched, intro_sent, closed, declined or expired. Needs the status_token from the submit call. Never returns listing details.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "listing_id": {
                "description": "listing_id returned by a submit tool.",
                "type": "string"
              },
              "status_token": {
                "description": "status_token returned by a submit tool.",
                "type": "string"
              }
            },
            "required": ["listing_id", "status_token"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5df95ac1d2cf59d57ac2160ad1dd9d631d5f87acefc5d51a65976685a1e05b46"
        },
        {
          "name": "get_roster_status",
          "title": "Check a roster's status",
          "description": "Counts by status for a roster you submitted. Needs the roster_status_token. Never returns member details.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "roster_id": {
                "type": "string"
              },
              "roster_status_token": {
                "type": "string"
              }
            },
            "required": ["roster_id", "roster_status_token"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
