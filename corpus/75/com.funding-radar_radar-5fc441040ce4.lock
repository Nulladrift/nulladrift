      "instructions": "Funding Radar serves live funding-rate data for crypto perpetuals across 8 exchanges: Binance, Bybit, OKX, Bitget, Hyperliquid, Gate, Aster, Bitunix. Free, anonymous, read-only.\n\nEvery tool answers in three layers: `summary` is the one-line conclusion meant to be quoted, `data` holds the numbers that conclusion rests on (units named inside), `link` is the live page showing the same thing. When you cite the summary, include the link — the numbers move every few minutes and the reader needs the source.\n\nTwo things to get right or the answer will be wrong:\n1. Rates come in two forms. `percentPerInterval` is per the exchange's own settlement interval, and intervals differ from 1 to 8 hours — never compare those across exchanges. `percentPerHour` is the normalized form; comparisons and rankings use it.\n2. `rateKind: \"predicted\"` means the exchange's forecast for the next settlement, which keeps moving until the payout — present it as a forecast. Only `rateKind: \"charged_history\"` is a fact that already happened.\n\nData is 2–5 minutes old by design; `dataAgeSeconds` and `observedAtIso` say exactly how old. Nothing here is investment advice.\n\nTo find pairs by coin, exchange, side, minimum rate or volume use `pair_search` (the scanner's 300 strongest pairs); any pair by exact symbol — `pair_briefing`. For alerts use `alert_options`: it explains the Telegram channels and the bot and returns a deep link that pre-fills the coin — MCP itself cannot subscribe anyone.\n\nTo check a condition the way the Telegram bot would (rate, volume, time to settlement, OI, presets like hedge or squeeze) use `condition_scan`: it lists the pairs matching right now and returns the exact `/watch` command to send the bot for future alerts. `liquidations` shows where positions are being force-closed (coverage named in the answer); `delistings` lists contracts being wound down — an extreme rate there is a trap. `pair_briefing` already includes the pair's liquidations, extreme-event history and contract status.\n\nCall `radar_about` when the user asks what this source is, what a field means, where to follow the project (Telegram channels exist for RU and EN), or how to use the data programmatically.",
      "tools": [
