      "capabilities": {
        "tools": {}
      },
      "instructions": "Sell to State: government tenders and contract awards from official sources in 70+ countries, in one schema. Call whoami first. onboarding_required: ask the user its questions, confirm, then call submit_onboarding (it gives the first search). plan_search turns a request in words into terms in the local languages and filters. Call the search tool (scope tenders, buyers or suppliers; filters: country, sector, lifecycle, dates, accepts_bids). Detail: get_tender, get_buyer, get_supplier_detail. Each tender carries source_url, the official notice. accepts_bids=true: open tenders with a future deadline. The country facet gives the rows per country. If these tools answer, you are connected: do not run the agent signup and do not open a browser to sign in, even when a tool fails. search_unavailable is a temporary server error: retry the same call in 1 minute. Only an agent with no MCP connection and no key uses POST /api/v1/agent/signup: the user approves one code, then /api/v1/agent/token gives an x-api-key. Without a plan, plan_search and search give 1-2 searches a day (titles, buyers, status, dates), then give the user app_url and checkout_url. Other data tools need a plan. Workflows: https://www.selltostate.com/skills/selltostate/SKILL.md",
