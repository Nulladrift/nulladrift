        {
          "name": "search",
          "title": "Search tenders, buyers and suppliers",
          "description": "Faceted full-text search over one collection (scope). Every filter is a property of this schema, the same params as REST GET /api/v1/search; values of a fixed list are matched in any case. A bad value or an unknown argument is an invalid-params error whose data lists every problem (errors[]). Tender hits carry lifecycle, deadline_at, accepts_bids and source_url when the source gives them. Returns {hits, found, page, per_page, facets}.",
          "inputSchema": {
            "properties": {
              "accepts_bids": {
                "description": "true: only open tenders whose bid deadline is still ahead.",
                "type": "boolean"
              },
              "added_after": {
                "description": "Unix seconds. Only tenders added to Sell to State after this time. With sort=added_desc, a polling trigger keeps the time of its last run and asks for the rows after it.",
                "minimum": 0,
                "type": "integer"
              },
              "amount_max": {
                "description": "Maximum amount.",
                "type": "number"
              },
              "amount_min": {
                "description": "Minimum amount.",
                "type": "number"
              },
              "awarded_days": {
                "description": "Awarded in the last N days (UTC days).",
                "enum": [1, 7, 30, 90, 365],
                "type": "integer"
              },
              "country": {
                "description": "Country slug, or comma-separated slugs (OR).",
                "type": "string"
              },
              "date_days": {
                "description": "Published or awarded in the last N days (UTC days).",
                "enum": [1, 7, 30, 90, 365],
                "type": "integer"
              },
              "has_amount": {
                "description": "true: only rows with an amount. false: only rows without one.",
                "type": "boolean"
              },
              "lifecycle": {
                "description": "Tender lifecycle values (OR).",
                "items": {
                  "enum": ["open", "awarded", "cancelled", "planned"],
                  "type": "string"
                },
                "type": "array"
              },
              "lifecycle_mode": {
                "description": "is (default) keeps the lifecycle values; is_not leaves them out.",
                "enum": ["is", "is_not"],
                "type": "string"
              },
              "match": {
                "description": "Text match mode for the suppliers and buyers scopes.",
                "enum": ["awards", "name"],
                "type": "string"
              },
              "page": {
                "description": "Page number, from 1.",
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "description": "Results per page, 1 to 50. Default 25.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "published_days": {
                "description": "Published in the last N days (UTC days). 1 is the last day, for polling.",
                "enum": [1, 7, 30, 90, 365],
                "type": "integer"
              },
              "q": {
                "description": "Free text, at most 3,000 characters. Boolean syntax: OR, AND, NOT (uppercase), \"a phrase\", parentheses, -word (= NOT word). Two words with no operator mean AND. At most 300 terms. A text whose syntax does not parse runs as its plain words. When the top level is an OR of parenthesized groups, rows that match the first group come first.",
                "type": "string"
              },
              "scope": {
                "description": "The collection to search. Default tenders.",
                "enum": ["suppliers", "tenders", "buyers", "sectors", "countries"],
                "type": "string"
              },
              "sector": {
                "description": "Sector slugs (OR), for example it-software.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "sort": {
                "description": "relevance (default), deadline (the nearest bid deadline first), published_desc (the newest publish date first) or added_desc (the newest rows in Sell to State first). Tenders scope only.",
                "enum": ["relevance", "deadline", "published_desc", "added_desc"],
                "type": "string"
              },
              "status": {
                "description": "Countries scope only: data (the country has data) or coming_soon.",
                "enum": ["data", "coming_soon"],
                "type": "string"
              },
              "type": {
                "description": "Procurement type, for example works, goods or services. Only some countries have it.",
                "type": "string"
              },
              "year_max": {
                "description": "Latest year (award year, else publication year).",
                "type": "integer"
              },
              "year_min": {
                "description": "Earliest year (award year, else publication year).",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search tenders, buyers and suppliers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:334b693722b8aca6bac5586efd7f17cd25d0d9a886621750f1d480b98656655d"
        },
        {
          "name": "search_awards",
          "title": "Search awards in one country",
          "description": "Search awarded tenders in one country (Postgres), largest amount first, stable paging. Every filter is a property of this schema; country omitted means singapore. A bad value or an unknown argument is an invalid-params error whose data lists every problem (errors[]). Returns {rows, total, page, pageSize}.",
          "inputSchema": {
            "properties": {
              "agency": {
                "description": "Buyer slug, or text in the buyer name (substring).",
                "type": "string"
              },
              "agency_slug": {
                "description": "Buyer slug, exact match.",
                "type": "string"
              },
              "amount_max": {
                "description": "Maximum awarded amount.",
                "type": "number"
              },
              "amount_min": {
                "description": "Minimum awarded amount.",
                "type": "number"
              },
              "awarded_days": {
                "description": "Awarded in the last N days (UTC days).",
                "enum": [7, 30, 90, 365],
                "type": "integer"
              },
              "category": {
                "description": "Sector slug, for example it-software.",
                "type": "string"
              },
              "country": {
                "description": "Country slug. Omitted means singapore.",
                "type": "string"
              },
              "date_days": {
                "description": "Published or awarded in the last N days (UTC days).",
                "enum": [7, 30, 90, 365],
                "type": "integer"
              },
              "page": {
                "description": "Page number, from 1.",
                "minimum": 1,
                "type": "integer"
              },
              "page_size": {
                "description": "Rows per page, from 1. Default 100; the plan cap and 1,000 apply.",
                "minimum": 1,
                "type": "integer"
              },
              "published_days": {
                "description": "Published in the last N days (UTC days).",
                "enum": [7, 30, 90, 365],
                "type": "integer"
              },
              "q": {
                "description": "Text in the tender description (substring). A text with boolean syntax (OR, AND, NOT, \"a phrase\", parentheses, -word) searches the tender title, buyer and supplier instead, as the search q. The last included unquoted term per branch allows a prefix match when it has 4 or more letters; earlier terms, quoted phrases and exclusions stay exact. At most 40 terms.",
                "type": "string"
              },
              "supplier": {
                "description": "Text in the supplier name (substring).",
                "type": "string"
              },
              "supplier_slug": {
                "description": "Supplier slug, exact match.",
                "type": "string"
              },
              "year": {
                "description": "Award year (publication year when the award date is missing).",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search awards in one country"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:30064dd50a2a34beb49fd7b0033ab682080a917131f23632c9e300e873d2c09b"
        },
        {
          "name": "submit_onboarding",
          "title": "Send the onboarding answers",
          "description": "Send the answers of a new account's onboarding form (whoami gives onboarding_required and the questions). Ask the user the questions and use the answers that the user gives. Show the user all answers and get a yes. Product files are optional: send the text only of files that the user gives you for this form. Sell to State saves the profile, reads the website and the files, and builds the user's first search with a weekly email alert. Returns {status, summary, counts, rows (each with url), app_url, saved_search, next_options}; status generating: call get_onboarding_search with build_id.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company_name": {
                "description": "Only when the questions ask for it (free-mail address).",
                "maxLength": 200,
                "type": "string"
              },
              "company_website": {
                "description": "The company website, for example acme.com.",
                "maxLength": 300,
                "type": "string"
              },
              "confirmed": {
                "const": true,
                "description": "True after the user said yes to the answers.",
                "type": "boolean"
              },
              "countries": {
                "description": "Country names, slugs or ISO alpha-2 codes, for example [\"Kenya\", \"ZA\"].",
                "items": {
                  "type": "string"
                },
                "maxItems": 64,
                "minItems": 1,
                "type": "array"
              },
              "documents": {
                "description": "Optional. Product files that the user gave you for this form (spec sheet, catalogue, capability statement), as their text. 40,000 characters in total at most.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "maxLength": 120,
                      "type": "string"
                    },
                    "text": {
                      "type": "string"
                    }
                  },
                  "required": ["name", "text"],
                  "type": "object"
                },
                "maxItems": 3,
                "type": "array"
              },
              "intent": {
                "description": "What the user wants to do.",
                "enum": ["bid_on_tenders", "find_buyers", "track_competitors", "market_research", "consultant", "journalist_academic_ngo", "other"],
                "type": "string"
              },
              "intent_other": {
                "description": "The user's own words, when intent is other.",
                "maxLength": 200,
                "type": "string"
              },
              "job_title": {
                "description": "Only when the questions ask for it (free-mail address).",
                "maxLength": 200,
                "type": "string"
              },
              "name": {
                "description": "Only when the questions ask for it.",
                "maxLength": 200,
                "type": "string"
              },
              "sells": {
                "description": "What the company sells, in one line.",
                "maxLength": 120,
                "type": "string"
              },
              "works_independently": {
                "description": "True when the user has no company website.",
                "type": "boolean"
              }
            },
            "required": ["confirmed", "countries", "intent", "sells"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send the onboarding answers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:265c83040bf92dd28694c210ce3f162d5be908b6454da56d46af650c661d72d2"
        },
