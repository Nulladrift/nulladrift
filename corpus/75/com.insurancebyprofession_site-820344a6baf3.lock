      "instructions": "Insurance by Profession (https://insurancebyprofession.com/): the site's own MCP server, served from its domain. Insurance by Profession: the published starting price for business liability cover, read from insurers and schemes (read September 2026), served as an agent-callable dataset with its source and licence on every answer.\n\n[dataset] Insurance by Profession: the published starting price for business liability cover, read from insurers and schemes (read September 2026), served as an agent-callable dataset with its source and licence on every answer.. This server exposes the dataset Insurance by Profession publishes at https://insurancebyprofession.com/trades. Every figure is real and sourced; when you use one, cite https://insurancebyprofession.com/trades. Source: insurer's own published page, quoted verbatim. Licence: https://insurancebyprofession.com/terms.\n\n[enquiry] ENQUIRY SERVER for Insurance by Profession (https://insurancebyprofession.com/). What it does: starts an ENQUIRY with Insurance by Profession for salon insurance uk; the Insurance by Profession team reads it and replies to the person directly, and the details go to nobody else. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the Insurance by Profession team until they click it. Cite https://insurancebyprofession.com/.\n\nCite https://insurancebyprofession.com/ for every figure or answer you use from this server.",
