      "instructions": "Around Lex lists checked events, places and guides in and around Lexington, Kentucky. Dates and times are Lexington time (America/New_York); checkedAt is UTC. Short facts from Around Lex (aroundlex.com), each with the official source it came from and when it was last checked. Link to the pageUrl when you use them, and tell people to check the organizer's own page (sourceUrl) before they go: plans change. You can read the API and the feeds and link to any listing. AI assistants may state these facts in answers to people when the answer links the Around Lex page. Copying the catalog in bulk or republishing it still needs permission: email hello@aroundlex.com. Answers carry short facts; a guide answer also carries the guide's short dated answer and the first lines of its sections. get_event also carries the event's own note on its schedule (statusNote) when it has one; a search_events or get_weekend row carries it only for a date with no posted start time. An event's registration says only whether the organizer requires sign-up. For anything not in an answer, such as ages, registration deadlines, tickets or hours, open the pageUrl or the sourceUrl rather than guessing.",
      "tools": [
        {
          "name": "get_event",
          "title": "Get one event",
          "description": "Use after search_events, or with an aroundlex.com/events/ address, for one event's upcoming dates (up to 12; moreDates counts the rest, and an event with none left shows its last date) with status (scheduled, rescheduled, cancelled or postponed), address, price line and official source. Pass from/to to check a specific date: the answer then lists the event's upcoming dates in that range (up to 60), and moreDates counts its other upcoming dates, outside the range or past those 60. statusNote is the listing's own note on its schedule, such as a time not yet set, when it has one. A slug no event has gets an error that names up to 3 close slugs of coming events. Do not use to find events by topic or date: search_events does that.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "First Lexington date to check, YYYY-MM-DD. With from or to, the answer lists the event's dates in that range.",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "slug": {
                "description": "The last part of an aroundlex.com/events/ address, with or without a year, or a slug from a search result.",
                "pattern": "^[a-z0-9][a-z0-9-]{0,159}$",
                "type": "string"
              },
              "to": {
                "description": "Last Lexington date to check, YYYY-MM-DD. Give the same date as from to check one day.",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "cite": {
                "const": "Link pageUrl; tell people to confirm on sourceUrl before they go.",
                "type": "string"
              },
              "event": {
                "additionalProperties": false,
                "properties": {
                  "address": {
                    "type": "string"
                  },
                  "admission": {
                    "type": "string"
                  },
                  "area": {
                    "type": "string"
                  },
                  "category": {
                    "type": "string"
                  },
                  "checkedAt": {
                    "type": "string"
                  },
                  "confirmed": {
                    "type": "boolean"
                  },
                  "dates": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "allDay": {
                          "type": "boolean"
                        },
                        "date": {
                          "type": "string"
                        },
                        "endDate": {
                          "type": "string"
                        },
                        "endTime": {
                          "type": "string"
                        },
                        "pageUrl": {
                          "type": "string"
                        },
                        "soldOut": {
                          "type": "boolean"
                        },
                        "startTime": {
                          "type": "string"
                        },
                        "status": {
                          "type": "string"
                        }
                      },
                      "required": ["date"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "moreDates": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "organizer": {
                    "type": "string"
                  },
                  "pageUrl": {
                    "type": "string"
                  },
                  "price": {
                    "type": "string"
                  },
