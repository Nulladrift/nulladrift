                        "maxItems": 10,
                        "type": "array"
                      },
                      "slug": {
                        "type": "string"
                      },
                      "sourceUrl": {
                        "type": "string"
                      },
                      "sources": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "state": {
                        "type": "string"
                      },
                      "title": {
                        "type": "string"
                      },
                      "type": {
