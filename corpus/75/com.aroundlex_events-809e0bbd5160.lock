          "name": "search_places",
          "title": "Search Lexington places",
          "description": "Use for a kind of place or a named place in and around Lexington, KY (parks, venues, museums, libraries, restaurants, bars and shops). Returns 10 places by default (limit, up to 20) with names, addresses, official websites and check dates, best match first, plus how many matched in all; no hours or reviews. The query may be in plain words: filler words are dropped and a town's name after in, near, around, at or from, or before KY, sets town (Richmond Road stays a road, and a town's name on its own stays a word; when nothing in that town matches, a place whose name holds the town's and that holds every other word is the answer, with namedFor set to the town: it may be elsewhere, as its address says; droppedWords lists the words left out), and town keeps one town's places. When no place holds every word of three or more, the answer lists the places that hold at least two and at least half of them, most first, and says matched=loose. No hours: for holiday hours or what's open on a date, use get_guide. Do not use for events: search_events has them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
