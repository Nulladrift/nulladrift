        {
          "name": "search_events",
          "title": "Search Lexington events",
          "description": "Use when someone asks what's on in or near Lexington, KY: tonight, today, this weekend, a date or range, a holiday, a kind of event, a nearby town or free admission. Use when=tonight for tonight (from 4 pm, or now if later, until 3 am; with no query words left to match, what starts in it comes first, by start time), when=today or when=this-weekend, or from and to for other dates. The query may be a question in plain words: when they are not given, its time words (tonight, today, tomorrow, this or next weekend, a weekday) set the dates, a town's name after in, near, around, at or from, or before KY, sets town (Richmond Road stays a road, and a town's name on its own stays a word; when nothing in that town matches, an event whose title names the town and that holds every other word is the answer, with namedFor set to the town: it may be held elsewhere, as each event's venue says), and free or kids words set those filters; filler words are dropped, and droppedWords lists every word left out. town keeps one town's venues. Returns 10 upcoming events by default (limit, up to 20) with time, venue, price line, official source and check date, and for a date with no posted time the event's statusNote, plus how many matched in all, best match first for a query and by date otherwise; times are Lexington time. When no event holds every word of three or more, the answer lists the events that hold at least two and at least half of them, most first, and says matched=loose. When nothing matches, emptyReason says why and next is the next matching event. Does not sell tickets or confirm availability. Do not use for holiday hours, what is open on a holiday or church service times: get_guide has those.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area": {
                "description": "A part of Lexington, as on aroundlex.com/near: downtown, distillery-district, northside, east-end, university, chevy-chase, hamburg, south-lexington, west-lexington, north-lexington. downtown includes Rupp Arena, Central Bank Center and the Lexington Opera House.",
                "enum": ["downtown", "distillery-district", "northside", "east-end", "university", "chevy-chase", "hamburg", "south-lexington", "west-lexington", "north-lexington"],
                "type": "string"
              },
              "free": {
                "description": "true for events whose listing says admission is free.",
                "type": "boolean"
              },
              "from": {
                "description": "First Lexington date to include, YYYY-MM-DD. Defaults to today.",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "kids": {
                "description": "true for events Around Lex tags as good with kids.",
                "type": "boolean"
              },
              "limit": {
                "description": "How many events to return, 1 to 20. Defaults to 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for, like \"live music\", \"farmers market\", a venue name or a question in plain words (\"basketball tonight\", \"things to do in Georgetown\"). Leave out to list the next events by date.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "to": {
                "description": "Last Lexington date to include, YYYY-MM-DD.",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "town": {
                "description": "A town, as Around Lex's places name it (case, punctuation and \"KY\" do not matter): Lexington, Berea, Carlisle, Danville, Frankfort, Georgetown, Harrodsburg, Lawrenceburg, Louisville, Midway, Millersburg, Mt. Sterling, Nicholasville, Paris, Perryville, Richmond, Stamping Ground, Versailles, Wilmore, Winchester.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "when": {
                "description": "today; tonight, from 4 pm (or now, if later) to 3 am Lexington time (with no query words left to match, dates that start in it by start time, then those already under way, then dates that post no start time; a query's matches keep their ranking); or this-weekend, the Friday to Sunday get_weekend covers. Instead of from and to.",
                "enum": ["today", "tonight", "this-weekend"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "area": {
                "type": "string"
              },
              "cite": {
                "const": "Link pageUrl; tell people to confirm on sourceUrl before they go.",
                "type": "string"
              },
