        {
          "name": "get_guide",
          "title": "Get one guide",
          "description": "Use when someone asks what is open or closed on a holiday, holiday hours, trash and recycling schedule changes, church service times, parking and bag rules for UK games, ice skating, date night, rainy-day or snow-day plans, Christmas lights, parades, Thanksgiving or New Year's Eve in Lexington, KY. Returns the best current guide and up to 2 alternatives for a query (or none, with the guides page), or one guide by slug (a slug no guide has gets an error that names up to 3 close guide slugs), with up to 10 of its section titles and of the official pages it cites, with its dated answer and up to 10 of its sections as question and answer (each answer up to 300 characters); link its page for the rest. A past edition or a guide due for a fresh check, opened by slug, gives its titles and state only. Do not use for events on a date: search_events has them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Words to find the best matching current guide, like \"christmas lights\" or \"rainy day\".",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "slug": {
                "description": "The last part of an aroundlex.com/guides/ address, with or without a year, or a slug from a search result.",
                "pattern": "^[a-z0-9][a-z0-9-]{0,159}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "alternatives": {
