                "description": "How many places to return, 1 to 20. Defaults to 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for, like \"distillery\", \"playground\", \"coffee\", a place name or a question in plain words (\"brunch places in Georgetown\").",
