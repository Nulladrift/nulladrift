{
  "lockfileVersion": 2,
  "subjects": {
    "com.paycheckhours/calculators": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://paycheckhours.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "paycheckhours",
        "title": "PaycheckHours calculators",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Free US hourly pay and time calculators. Results are arithmetic, not legal or tax advice; each result links to the page with its sources.",
      "tools": [
        {
          "name": "calculate_time_card",
          "title": "Time card hours and overtime",
          "description": "Adds up a time card (up to 14 days, 7 per workweek) from start and end times in 24-hour HH:MM, subtracting unpaid breaks; shifts past midnight are handled. Splits overtime per workweek under US federal law (over 40 hours, 1.5x) or under the daily rules of California, Alaska, Nevada or Colorado, and gives gross pay when an hourly rate is given.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "Days in workweek order; days 1-7 are week 1, 8-14 week 2",
                "items": {
                  "properties": {
                    "end": {
                      "description": "End time, 24-hour HH:MM",
                      "type": "string"
                    },
                    "start": {
                      "description": "Start time, 24-hour HH:MM",
                      "type": "string"
                    },
                    "unpaid_break_minutes": {
                      "type": "number"
                    }
                  },
                  "required": ["end", "start"],
                  "type": "object"
                },
                "type": "array"
              },
              "hourly_rate": {
                "description": "US dollars per hour",
                "type": "number"
              },
              "overtime_after_hours": {
                "description": "Weekly overtime threshold when no state is given; default 40",
                "type": "number"
              },
              "state": {
                "description": "Apply this state's daily overtime rules",
                "enum": ["CA", "AK", "NV", "CO"],
                "type": "string"
              }
            },
            "required": ["days"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b15b383285f058016826a0c124045956e700e17e976ac7e736b5ccee4049335b"
        },
        {
          "name": "convert_decimal_hours",
          "title": "Decimal hours converter",
          "description": "Converts hours and minutes (H:MM) to decimal hours, or decimal hours to hours and minutes. 7:45 is 7.75 hours.",
          "inputSchema": {
            "properties": {
              "decimal_hours": {
                "description": "e.g. 7.75",
                "type": "number"
              },
              "hours_minutes": {
                "description": "H:MM, e.g. 7:45",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:491f7b4a173b88a3e2880340b2efd8b74e6877a8ecc7bc0451d4c25b5eefa859"
        },
        {
          "name": "overtime_pay",
          "title": "Overtime pay",
          "description": "Regular, overtime and double-time pay from an hourly rate and hours. Overtime multiplier defaults to 1.5 (US federal minimum for covered, non-exempt work over 40 hours a week); double time is 2x.",
          "inputSchema": {
            "properties": {
              "double_time_hours": {
                "type": "number"
              },
              "hourly_rate": {
                "type": "number"
              },
              "overtime_hours": {
                "type": "number"
              },
              "overtime_multiplier": {
                "type": "number"
              },
              "regular_hours": {
                "type": "number"
              }
            },
            "required": ["hourly_rate", "overtime_hours", "regular_hours"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:98ac1e56a9aff46a3727ad3a7e008cf5774ed217dfe1a82649f1717fe880424f"
        },
        {
          "name": "split_tip_pool",
          "title": "Tip pool split by hours",
          "description": "Splits a tip pool by hours worked, rounded to the cent so the shares add up exactly to the total.",
          "inputSchema": {
            "properties": {
              "people": {
                "items": {
                  "properties": {
                    "hours": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["hours", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "total_tips": {
                "description": "US dollars",
                "type": "number"
              }
            },
            "required": ["people", "total_tips"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:07b6101996c651635704f5268387d4dff51a32d5de2239f2dda2b91460bc7577"
        }
      ],
      "digest": "sha256:44fb3c3dd3f85789d283ab0f2fb929b17d3eab7960e2f9bddf00294e900a4365"
    }
  }
}
