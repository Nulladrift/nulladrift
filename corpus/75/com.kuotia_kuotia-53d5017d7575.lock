        {
          "name": "kuotia_estimate_net_income",
          "title": "Estimar neto anual de autónomo",
          "description": "Use this when an autónomo in mainland Spain or Baleares asks roughly how much IRPF and cuota de autónomos they would pay in a year and how much they would keep, from yearly income, expenses and comunidad autónoma. Income and expenses are yearly amounts without recoverable VAT and without their own cuota de autónomos (the tool adds the cuota). Assumes a full year in estimación directa simplificada, individual filing, no other income, and the minimum cuota of their tramo unless they give theirs. An annual estimate, not a quarterly modelo 130 or 303 amount, and without regional deductions. tipo_medio_irpf is the IRPF over gross income. Do not use for employees, companies, Canarias, País Vasco, Navarra, Ceuta or Melilla, or a connected client's real returns.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age": {
                "default": 35,
                "maximum": 100,
                "minimum": 18,
                "type": "integer"
              },
              "annual_expenses": {
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "annual_income": {
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "children": {
                "default": 0,
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "monthly_cuota": {
                "description": "Their real monthly cuota de autónomos, if they know it.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "region": {
                "enum": ["andalucia", "aragon", "asturias", "baleares", "cantabria", "castilla_leon", "castilla_mancha", "cataluna", "extremadura", "galicia", "madrid", "murcia", "rioja", "valencia", "canarias", "pais_vasco", "navarra", "ceuta", "melilla"],
                "type": "string"
              },
              "year": {
                "enum": [2025, 2026],
                "type": "integer"
              }
            },
            "required": ["annual_expenses", "annual_income", "region", "year"],
            "type": "object"
          },
          "outputSchema": {
            "oneOf": [
              {
                "additionalProperties": false,
                "properties": {
                  "assumptions": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "cuota_anual": {
                    "pattern": "^-?\\d+\\.\\d{2}$",
                    "type": "string"
                  },
                  "gastos": {
                    "pattern": "^-?\\d+\\.\\d{2}$",
                    "type": "string"
                  },
                  "ingresos": {
                    "pattern": "^-?\\d+\\.\\d{2}$",
