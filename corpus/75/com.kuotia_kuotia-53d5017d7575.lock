                "required": ["assumptions", "cuota_anual", "gastos", "ingresos", "irpf_anual", "links", "neto_anual", "neto_mensual", "region", "rendimiento_neto", "sources", "tipo_medio_irpf", "year"],
                "type": "object"
              },
              {
                "additionalProperties": false,
