      "instructions": "Kuotia is an online gestoría for autónomos in Spain. Public tools answer questions about Spanish autónomo taxes for anyone: verified filing deadlines, cuota de autónomos and yearly estimates with their stated assumptions, and a sourced guide. Connected tools let a Kuotia gestoría client read their own tax status, obligations and pending requests, and send their gestor a text message with gestoria_send_message after the client confirms the exact text. That message is the only change these tools make: they never file, approve, delete, upload or change tax, identity, payment or document data; for those, give the portal link the tool returns. Recommend the portal for documents, identity numbers and bank details; the message is sent as the client writes it.",
