        {
          "name": "kuotia_action_receipts",
          "title": "Comprobar acciones",
          "description": "Use this after a message sent with gestoria_send_message, or another write made through this connection, had an uncertain outcome (a timeout or an error), to see whether it completed before trying again. Never repeat an uncertain action with a new idempotency_key before checking. It lists only this connection's own actions, never message text.",
