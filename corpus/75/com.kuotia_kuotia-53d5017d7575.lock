        {
          "name": "kuotia_estimate_reta",
          "title": "Estimar cuota de autónomos",
          "description": "Use this when someone asks how much cuota de autónomos (RETA, Seguridad Social) they would pay in Spain, or which tramo applies, from expected yearly income and expenses. Assumes a full year of activity as a persona física autónoma (not societario) in estimación directa simplificada of the common IRPF, income and expenses without recoverable VAT and without their own cuota, the 5 % allowance for gastos de difícil justificación (at most 2,000 EUR a year) and then the general 7 % deduction for generic expenses. The tramo table is the same in all of Spain, but the rendimiento is computed with these common-regime rules: under módulos, estimación directa normal or the foral IRPF of País Vasco and Navarra the tramo may differ. Does not decide whether they qualify for the tarifa plana. Do not use for employees, for companies or for a connected client's real payments.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annual_expenses": {
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "annual_income": {
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "year": {
                "enum": [2025, 2026],
                "type": "integer"
              }
            },
            "required": ["annual_expenses", "annual_income", "year"],
            "type": "object"
          },
          "outputSchema": {
            "oneOf": [
              {
                "additionalProperties": false,
                "properties": {
                  "assumptions": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "gasto_dificil_justificacion": {
                    "pattern": "^-?\\d+\\.\\d{2}$",
                    "type": "string"
                  },
                  "gastos_genericos": {
                    "pattern": "^-?\\d+\\.\\d{2}$",
                    "type": "string"
                  },
                  "links": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "label": {
                          "type": "string"
                        },
                        "url": {
                          "format": "uri",
                          "type": "string"
                        }
                      },
                      "required": ["label", "url"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "rendimiento_anual": {
                    "pattern": "^-?\\d+\\.\\d{2}$",
                    "type": "string"
                  },
                  "rendimiento_mensual_computable": {
                    "pattern": "^-?\\d+\\.\\d{2}$",
                    "type": "string"
                  },
                  "sources": {
                    "items": {
                      "format": "uri",
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "tarifa_plana_cuota": {
                    "pattern": "^-?\\d+\\.\\d{2}$",
                    "type": "string"
                  },
                  "tipo_cotizacion": {
                    "pattern": "^-?\\d+\\.\\d{2}$",
                    "type": "string"
                  },
                  "tramo": {
                    "additionalProperties": false,
                    "properties": {
                      "base_maxima": {
                        "pattern": "^-?\\d+\\.\\d{2}$",
                        "type": "string"
                      },
                      "base_minima": {
                        "pattern": "^-?\\d+\\.\\d{2}$",
                        "type": "string"
                      },
                      "cuota_maxima": {
                        "pattern": "^-?\\d+\\.\\d{2}$",
                        "type": "string"
                      },
                      "cuota_minima": {
                        "pattern": "^-?\\d+\\.\\d{2}$",
                        "type": "string"
                      },
                      "numero": {
                        "type": "integer"
                      },
                      "tabla": {
                        "enum": ["general", "reducida"],
                        "type": "string"
                      }
                    },
                    "required": ["base_maxima", "base_minima", "cuota_maxima", "cuota_minima", "numero", "tabla"],
                    "type": "object"
                  },
                  "year": {
                    "type": "integer"
                  }
                },
                "required": ["assumptions", "gasto_dificil_justificacion", "gastos_genericos", "links", "rendimiento_anual", "rendimiento_mensual_computable", "sources", "tarifa_plana_cuota", "tipo_cotizacion", "tramo", "year"],
                "type": "object"
