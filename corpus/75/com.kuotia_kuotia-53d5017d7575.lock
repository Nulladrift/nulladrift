            "additionalProperties": false,
            "properties": {
              "period": {
                "description": "One period (2026-T3, 2026-07 or 2026). Without it: the open periods and the last four filed.",
                "pattern": "^20\\d\\d-T[1-4]$|^20\\d\\d$|^20\\d\\d-(0[1-9]|1[0-2])$",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
