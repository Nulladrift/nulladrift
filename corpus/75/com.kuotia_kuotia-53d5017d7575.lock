        {
          "name": "gestoria_get_tax_status",
          "title": "Ver cómo van mis impuestos",
          "description": "Use this when a connected Kuotia gestoría client asks how their taxes are going: which periods are being prepared, ready to file or filed, deadlines, and the amounts their gestor has made ready or filed. Amounts appear only for ready or filed returns. Read only: it never files, approves or changes anything. Do not use for general deadlines or estimates (public tools).",
