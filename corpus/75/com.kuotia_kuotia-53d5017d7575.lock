        {
          "name": "gestoria_send_message",
          "title": "Escribir a mi gestor",
          "description": "Use this when a connected Kuotia gestoría client explicitly asks to send a text message to their gestor (a question, a heads-up, a reply). It sends exactly the text the client approved, as the client, to their own gestor in the Kuotia portal, where the gestor answers; it cannot be unsent. Show the final text and get the client's confirmation before calling. Recommend sending documents, identity numbers (DNI, NIF, NIE) and bank details through the Kuotia portal instead of this message; the text is sent as the client writes it. No attachments, and it never reads messages back. Reuse the same idempotency_key when retrying the same message. Do not use for questions general tools answer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "body": {
                "description": "The exact text to send.",
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "idempotency_key": {
                "description": "A new random UUID (for example 0f8fad5b-d9cb-469f-a165-70867728950e) for each action. Reuse exactly the same UUID only when retrying the same action.",
                "maxLength": 36,
                "minLength": 36,
                "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$",
                "type": "string"
              },
              "new_conversation": {
                "default": false,
                "description": "Start a new conversation instead of writing in the latest open one.",
                "type": "boolean"
              },
              "subject": {
                "description": "Subject, only when starting a new conversation.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "topic": {
                "default": "otro",
                "enum": ["documentos", "impuestos", "alta", "otro"],
                "type": "string"
              }
            },
            "required": ["body", "idempotency_key"],
            "type": "object"
          },
          "outputSchema": {
            "oneOf": [
              {
                "additionalProperties": false,
                "properties": {
                  "conversation": {
                    "enum": ["new", "existing"],
                    "type": "string"
                  },
                  "portal_url": {
                    "format": "uri",
                    "type": "string"
                  },
                  "receipt_id": {
                    "type": "integer"
                  },
                  "sent": {
                    "const": true,
                    "type": "boolean"
                  }
                },
                "required": ["conversation", "portal_url", "receipt_id", "sent"],
                "type": "object"
              },
              {
                "additionalProperties": false,
                "properties": {
                  "error": {
                    "additionalProperties": false,
                    "properties": {
                      "code": {
                        "enum": ["invalid_arguments", "not_covered", "not_verified", "login_required", "not_available", "not_ready", "limit_reached"],
                        "type": "string"
                      },
                      "field": {
                        "type": "string"
                      },
                      "message": {
                        "type": "string"
                      }
                    },
                    "required": ["code", "message"],
                    "type": "object"
                  },
                  "sources": {
                    "items": {
                      "format": "uri",
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "statutory_window": {
                    "type": "string"
                  }
                },
                "required": ["error"],
                "type": "object"
              }
            ],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
