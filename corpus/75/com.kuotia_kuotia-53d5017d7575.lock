                    "type": "string"
                  },
                  "links": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "label": {
                          "type": "string"
                        },
                        "url": {
                          "format": "uri",
                          "type": "string"
                        }
                      },
                      "required": ["label", "url"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "neto_anual": {
                    "pattern": "^-?\\d+\\.\\d{2}$",
                    "type": "string"
                  },
                  "neto_mensual": {
                    "pattern": "^-?\\d+\\.\\d{2}$",
                    "type": "string"
                  },
                  "region": {
                    "type": "string"
                  },
                  "rendimiento_neto": {
                    "pattern": "^-?\\d+\\.\\d{2}$",
                    "type": "string"
                  },
