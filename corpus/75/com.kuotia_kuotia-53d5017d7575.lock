                                  {
                                    "pattern": "^-?\\d+\\.\\d{2}$",
                                    "type": "string"
                                  },
                                  {
                                    "type": "null"
                                  }
                                ]
                              },
                              "label": {
                                "type": "string"
                              },
                              "modelo": {
                                "type": "string"
                              },
                              "name": {
                                "type": "string"
                              },
                              "outcome": {
                                "enum": ["pay", "compensate", "refund", "zero", null],
                                "type": ["string", "null"]
                              },
                              "payment_method": {
                                "enum": ["domiciliacion", "nrc", "reconocimiento_deuda", null],
                                "type": ["string", "null"]
                              },
                              "source": {
                                "enum": ["engine", "manual"],
                                "type": "string"
                              }
                            },
                            "required": ["amount", "label", "modelo", "name", "outcome", "payment_method", "source"],
                            "type": "object"
                          },
                          "type": "array"
                        },
                        "label": {
                          "type": "string"
                        },
                        "period": {
                          "type": "string"
                        },
                        "status": {
                          "additionalProperties": false,
                          "properties": {
                            "key": {
                              "type": "string"
                            },
                            "label": {
                              "type": "string"
                            }
                          },
                          "required": ["key", "label"],
                          "type": "object"
                        }
                      },
                      "required": ["days_left", "deadline", "filed_on", "filings", "label", "period", "status"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "portal_url": {
                    "format": "uri",
                    "type": "string"
                  }
                },
                "required": ["engagement_status", "periods", "portal_url"],
