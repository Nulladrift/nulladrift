                      },
                      "label": {
                        "type": "string"
                      }
                    },
                    "required": ["key", "label"],
                    "type": "object"
                  },
                  "periods": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "days_left": {
                          "type": ["integer", "null"]
                        },
                        "deadline": {
