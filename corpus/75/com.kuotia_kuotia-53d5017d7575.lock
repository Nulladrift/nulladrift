        {
          "name": "kuotia_get_tax_calendar",
          "title": "Consultar plazos fiscales",
          "description": "Use this when someone asks until when an autónomo in Spain can file or pay a specific tax return (modelo 303 IVA, 130 IRPF, 111, 115, 390, 347, 180, 190 or 100 renta) for a given tax period, or the last day to pay it by domiciliación. Give the modelo and the tax period it declares (for example 303 for 2026-T3, or 100 for tax year 2025), not the filing year. Only periods whose dates Kuotia has checked against the AEAT calendar are answered; others return not_verified with the official rule. Mainland Spain and Baleares only. Do not use for a connected client's own status (gestoria_get_tax_status) or for other countries.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "modelo": {
                "enum": ["303", "130", "111", "115", "390", "347", "180", "190", "100"],
                "type": "string"
              },
              "period": {
                "description": "Tax period declared: 2026-T3 for a quarterly modelo, 2025 for an annual one.",
