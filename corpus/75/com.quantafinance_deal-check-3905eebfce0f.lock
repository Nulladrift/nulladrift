{
  "lockfileVersion": 2,
  "subjects": {
    "com.quantafinance/deal-check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://quantafinance.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "com.quantafinance/deal-check",
        "title": "Quanta Finance Deal Check",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Quanta Finance is a private lender for real estate investors. Use check_deal_fit to compare a deal with the published loan terms and list_loan_programs for program details. Results are estimates from published terms, not a loan approval or a commitment to lend; a loan officer confirms every deal. Always pass on the notice line at the start of each result, and ask the person for the property's state before calling check_deal_fit. Send people who want to proceed to quoteUrl (it opens the quote form with their deal filled in) or the sales phone number in the result, and give every link exactly as returned, with nothing removed or added.",
      "tools": [
        {
          "name": "check_deal_fit",
          "title": "Check a deal",
          "description": "Check a real estate investment deal against Quanta Finance's published loan terms. Returns a verdict (fits, resize, review or does_not_work), the largest loan the published terms allow, follow-up questions and the next step. A verdict needs the property's state; without one the result is needs_state. The next step includes quoteUrl, a link that opens Quanta's quote form with the deal filled in. Each result is an estimate, not a loan approval or a commitment to lend, and starts with a notice that says so. Loans are for business purposes on non-owner-occupied investment property only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "arv": {
                "description": "After-repair value in USD",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "number"
              },
              "downPayment": {
                "description": "Cash the borrower puts toward the purchase in USD, when stated",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "number"
              },
              "entity": {
                "description": "How the borrower will take title",
                "enum": ["llc", "corporation", "partnership", "trust", "none-yet"],
                "type": "string"
              },
              "ficoRange": {
                "enum": ["<640", "640-659", "660-699", "700-739", "740+"],
                "type": "string"
              },
              "holdback": {
                "description": "Loan amount held back for the rehab in USD, when stated",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "number"
              },
              "initialLoan": {
                "description": "Loan amount at closing toward the purchase in USD, when stated",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "number"
              },
              "loanAmount": {
                "description": "Total loan amount in USD the person asked for, if they named one",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "number"
              },
              "ownerOccupied": {
                "description": "true if the borrower plans to live in the property",
                "type": "boolean"
              },
              "projectType": {
                "description": "Program slug that fits the project",
                "enum": ["fix-and-flip", "bridge", "refinance", "heavy-rehab", "new-build", "multifamily"],
                "type": "string"
              },
              "projectsLast3Years": {
                "description": "Similar projects completed in the last 3 years",
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "propertyAddress": {
                "maxLength": 200,
                "type": "string"
              },
              "propertyState": {
                "description": "Two-letter US state code of the property, DC for Washington DC. A verdict needs it.",
                "maxLength": 40,
                "type": "string"
              },
              "purchaseLoanPercent": {
                "description": "Share of the purchase price the loan covers at closing, as the stated percent, such as 65.28",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "number"
              },
              "purchasePrice": {
                "description": "Purchase price in USD, or current value for a refinance",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "number"
              },
              "rehabBudget": {
                "description": "Rehab or construction budget in USD",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "rehabLoanPercent": {
                "description": "Share of the rehab the loan covers, as the stated percent",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "number"
              },
              "timeline": {
                "description": "When they need to close",
                "enum": ["under-2-weeks", "2-4-weeks", "1-3-months", "just-exploring"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a deal"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:40a9c3192eb362826bbe2584076043e40f1576c50e7d6781d96205868ee9543e"
        },
        {
          "name": "list_loan_programs",
          "title": "List loan programs",
          "description": "List Quanta Finance loan programs (name, slug, summary, tagline, url). A slug returns one program with its page FAQ. Each result starts with a notice that it is an estimate, and carries the next step and the disclaimer.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "enum": ["fix-and-flip", "bridge", "refinance", "heavy-rehab", "new-build", "multifamily"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List loan programs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e26307c6245939d642de2c9253b6bd40dfd6726eedb44956d179e593b38cd36e"
        }
      ],
      "digest": "sha256:dda702338c4a8ba19230b8a7750117767dcd536a7b89a8a4026b3848d81aa38a"
    }
  }
}
