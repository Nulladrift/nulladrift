        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Datos oficiales del gasto público español, tal como los publica Cuentas a la vista (involucrados.com): la ejecución del presupuesto del Estado (IGAE/BOE, mensual), las cuentas de las ~8.100 entidades locales (CONPREL, anual), las subvenciones concedidas (BDNS) y los contratos adjudicados (PLACSP). Cada cifra trae su documento oficial (url y sha256) y su enlace al sitio: cítalos. Reglas que no se rompen: 1) No sumes cifras de cortes distintos (Estado, entidades locales, subvenciones, contratos): son miradas distintas al mismo dinero y la suma lo cuenta dos veces. 2) Di siempre el periodo de cada cifra. La ejecución del Estado es acumulada de enero al mes publicado, no el año entero; el detalle municipal es anual y va uno o dos años por detrás. 3) Una entidad que no ha rendido cuentas no tiene datos: no es una entidad con 0 €. 4) Si una herramienta no devuelve el dato, di que no lo sabes. No estimes ni completes con conocimiento general. Empieza por buscar_pregunta si la pregunta es concreta; llama a reglas antes de un análisis propio. Esta es la DEMO sin clave: solo hay reglas, buscar_pregunta, gasto_estado, buscar_entidad, entidad_local. Para ministerios, subvenciones, contratos, señales y la tabla completa hace falta una clave, con prueba gratis sin tarjeta en https://involucrados.com/panel/ — si te preguntan por eso, dilo así en vez de estimar.",
      "tools": [
        {
          "name": "buscar_entidad",
          "title": "Buscar un ayuntamiento u otra entidad local",
          "description": "Busca entre las ~8.600 entidades locales (ayuntamientos, diputaciones, mancomunidades…) por nombre y devuelve su código oficial, que es lo que pide entidad_local.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "maximo": {
                "description": "Cuántas devolver (10 si no se dice).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "nombre": {
                "description": "Nombre o parte del nombre (sin «Ayuntamiento de»).",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "provincia": {
                "description": "Código de dos cifras (28) o nombre de la provincia.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["nombre"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Buscar un ayuntamiento u otra entidad local"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d4337b0cadb6b7f2bd508bfe8a67d26e96b517b1a4fe19f41a91693461a231ca"
        },
        {
          "name": "buscar_pregunta",
          "title": "Buscar en las preguntas ya respondidas",
          "description": "Busca la pregunta entre las ~660 que el sitio ya responde con una consulta verificada contra los datos publicados, y devuelve las más parecidas con su respuesta, su aviso y su enlace. Si la más parecida es una plantilla (por ejemplo «¿cuánto gasta {entidad}?»), dice qué herramienta la responde.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "maximo": {
                "description": "Cuántas devolver (5 si no se dice).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "pregunta": {
                "description": "La pregunta, en lenguaje natural.",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["pregunta"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Buscar en las preguntas ya respondidas"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0652f5d0d968a31f0010e7506cea8e78b9e4a6fdb1300a5deaf7fe93078acf06"
        },
        {
          "name": "entidad_local",
          "title": "Las cuentas de un ayuntamiento",
          "description": "La ficha de una entidad local por su código oficial (p. ej. 28079AA000, Madrid): cuánto gasta, en qué (capítulos), para qué (áreas), de dónde le llega el dinero, la cadena de lo autorizado a lo pagado y, en la liquidación, el gasto por habitante y su percentil en su banda de población. La liquidación es lo gastado de verdad (más vieja); el presupuesto, lo planeado (más reciente).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "codigo": {
                "description": "Código de la entidad (de buscar_entidad).",
                "pattern": "^\\d{5}[A-Z]{2}\\d{3}$",
                "type": "string"
              },
              "documento": {
                "description": "liquidacion (por defecto) o presupuesto.",
                "enum": ["liquidacion", "presupuesto"],
                "type": "string"
              },
              "ejercicio": {
                "description": "Año. Si no se da, el último publicado de ese documento.",
                "pattern": "^\\d{4}$",
                "type": "string"
              }
            },
            "required": ["codigo"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Las cuentas de un ayuntamiento"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c6c9e08558d73c82f7dfeb906bcaacc5b9519ab7a7fc3086c5b7bf62941e67e7"
        },
        {
          "name": "gasto_estado",
          "title": "Gasto del Estado por área o política",
          "description": "La ejecución del presupuesto del Estado (IGAE/BOE): crédito inicial, modificaciones, crédito definitivo, obligaciones reconocidas y pagos, acumulados de enero al mes publicado. Sin código, el total y sus seis áreas; con el código de un área («9») sus políticas; con el de una política («95» o «9.95»), la política. Incluye por qué se movió el crédito (nueve tipos de modificación).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "codigo": {
                "description": "Área (un dígito) o política (dos dígitos, o área.política). Vacío = el total.",
                "pattern": "^(\\d|\\d{2}|\\d[./]\\d{2})?$",
                "type": "string"
              },
              "periodo": {
                "description": "Mes publicado, AAAA-MM. Si no se da, el último.",
                "pattern": "^\\d{4}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Gasto del Estado por área o política"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1a124f0735b5c2b7f48170c4aa9dac23849f480a4a10afc71d715f44969266b7"
        },
        {
          "name": "reglas",
          "title": "Reglas y periodos de los datos",
          "description": "Qué datos hay, de qué periodos y las reglas para no dar una cifra falsa (qué no se suma con qué, cómo citar). Llámala antes de un análisis propio. Incluye el diccionario completo de la tabla.",
