        {
          "name": "fire_variants",
          "title": "Lean, fat, coast and barista FIRE",
          "description": "Use this when the user asks for their coast FIRE number, lean FIRE, fat FIRE or barista FIRE number, a coast FIRE calculator, barista FIRE calculator or FIRE number calculator for a variant, or what the 4% rule gives at leaner or richer spending. Needs age, invested savings, monthly spending and optionally monthly investing and the age to coast to (default 65). Use coast when the user wants to know if they can stop investing and still retire on time (amount needed now to coast to that age). Use barista when the user wants to leave full-time work early and cover the rest with part-time income (part-time income needed on top of what savings pay). Use lean when the user wants the number for a frugal, minimal budget. Use fat when the user wants the number for a comfortable or generous lifestyle. Do not use for an exact retire-at-age check (use retire_at_age), job or salary advice, tax, or picking investments. An estimate, not financial advice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "age": {
                "description": "Current age in years.",
                "maximum": 90,
                "minimum": 14,
                "type": "integer"
              },
              "currency": {
                "default": "USD",
                "description": "ISO currency code used only for display.",
                "enum": ["USD", "EUR", "GBP", "CAD", "AUD", "NZD", "CHF", "SEK", "NOK", "DKK", "SGD", "JPY"],
                "type": "string"
              },
              "fatMonthlyExpenses": {
                "description": "Fat monthly spending. Default 150% of monthlyExpenses.",
                "maximum": 1000000,
                "minimum": 1,
                "type": "number"
              },
              "kind": {
                "default": "all",
                "description": "Which FIRE variant: lean, fat, coast, barista, or all.",
                "enum": ["lean", "fat", "coast", "barista", "all"],
                "type": "string"
              },
              "leanMonthlyExpenses": {
                "description": "Lean monthly spending. Default 75% of monthlyExpenses.",
                "maximum": 1000000,
                "minimum": 1,
                "type": "number"
              },
              "monthlyExpenses": {
                "description": "Monthly spending today; the plan keeps this lifestyle.",
                "maximum": 1000000,
                "minimum": 1,
                "type": "number"
              },
              "monthlyInvestment": {
                "default": 0,
                "description": "Amount invested each month. 0 if nothing.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "netWorth": {
                "description": "Invested savings today (not counting the home you live in).",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "realReturnPct": {
                "default": 5,
                "description": "Yearly growth after inflation, in percent. Default 5.",
                "maximum": 12,
                "minimum": 0.5,
                "type": "number"
              },
              "targetAge": {
                "default": 65,
                "description": "Traditional retirement age that coast FIRE coasts to. Default 65.",
                "maximum": 100,
                "minimum": 15,
                "type": "integer"
              },
              "withdrawalRatePct": {
                "default": 4,
                "description": "Safe withdrawal rate in percent. Default 4.",
                "maximum": 10,
                "minimum": 2,
                "type": "number"
              }
            },
            "required": ["age", "monthlyExpenses", "netWorth"],
            "type": "object"
          },
