        {
          "name": "how_long_will_savings_last",
          "title": "How long will savings last",
          "description": "Use this when the user asks how long will my savings last at a monthly withdrawal, for example how long will $500k or $1 million last in retirement, how long can I live on $X, will my money last to 90, a career break or sabbatical runway, the 4% rule in reverse, a safe withdrawal rate or whether X% is a safe withdrawal rate. Returns years until it runs out (or that growth covers it), the monthly amount that never runs out, a range and a year-by-year table. Do not use for annuity quotes, pension or Social Security payouts, tax on withdrawals, or choosing investments. An estimate, not financial advice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "balance": {
                "description": "Savings today.",
                "maximum": 100000000,
                "minimum": 100,
                "type": "number"
              },
              "currency": {
                "default": "USD",
                "description": "ISO currency code used only for display.",
                "enum": ["USD", "EUR", "GBP", "CAD", "AUD", "NZD", "CHF", "SEK", "NOK", "DKK", "SGD", "JPY"],
                "type": "string"
              },
              "monthlyWithdrawal": {
                "description": "Amount taken out every month, in today’s money.",
                "maximum": 1000000,
                "minimum": 1,
                "type": "number"
              },
              "realReturnPct": {
                "default": 5,
                "description": "Yearly growth after inflation, in percent. Default 5.",
                "maximum": 12,
                "minimum": 0.5,
                "type": "number"
              }
            },
            "required": ["balance", "monthlyWithdrawal"],
            "type": "object"
          },
