        {
          "name": "retire_at_age",
          "title": "Retire at a chosen age",
          "description": "Use this when the user wants a retirement calculator for a chosen age: \"how much do I need to retire\", \"how much do I need to retire at 45 / 50 / 55 / 60 / 65\", \"how to retire at 50\", \"can I retire at 50 with $500k\", \"am I on track to retire at 55\", \"when can I retire\" at a specific age, or the 25x rule / 4% rule for their spending (also in GBP, CAD, AUD or EUR). Needs monthly or yearly spending in retirement and the target age. Age, invested savings and monthly contribution are optional: without them it returns the amount needed with 4%, 3.5% and 3.3% withdrawal rate variants; with them it adds the age they reach it, the shortfall or surplus at the target age and the extra monthly amount needed. Do not use for an open \"when can I retire\" question with no age in mind (use calculate_freedom_day), pension, Social Security or annuity amounts and full retirement age rules, tax, or picking investments. An estimate, not financial advice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "age": {
                "description": "Current age. Optional; with it the tool shows how far current savings are from the target.",
                "maximum": 90,
                "minimum": 14,
                "type": "integer"
              },
              "currency": {
                "default": "USD",
                "description": "ISO currency code used only for display.",
                "enum": ["USD", "EUR", "GBP", "CAD", "AUD", "NZD", "CHF", "SEK", "NOK", "DKK", "SGD", "JPY"],
                "type": "string"
              },
              "monthlyInvestment": {
                "description": "Amount invested each month. Optional, defaults to 0 when age is given.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "netWorth": {
                "description": "Invested savings today. Optional, defaults to 0 when age is given.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "realReturnPct": {
                "default": 5,
                "description": "Yearly growth after inflation, in percent. Default 5.",
                "maximum": 12,
                "minimum": 0.5,
                "type": "number"
              },
              "spending": {
                "description": "Spending in retirement, in today’s money.",
                "maximum": 12000000,
                "minimum": 1,
                "type": "number"
              },
              "spendingPeriod": {
                "default": "monthly",
                "description": "Whether spending is per month or per year.",
                "enum": ["monthly", "yearly"],
                "type": "string"
              },
              "targetAge": {
                "description": "Age at which the person wants to retire or make work optional.",
                "maximum": 100,
                "minimum": 15,
                "type": "integer"
              },
              "withdrawalRatePct": {
                "default": 4,
                "description": "Safe withdrawal rate in percent. Default 4.",
                "maximum": 10,
                "minimum": 2,
                "type": "number"
              }
            },
            "required": ["spending", "targetAge"],
            "type": "object"
          },
