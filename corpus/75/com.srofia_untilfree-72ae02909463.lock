      "tools": [
        {
          "name": "calculate_freedom_day",
          "title": "Calculate freedom day",
          "description": "Use this when the user wants a FIRE calculator or asks when can I retire, when can I retire early or stop working, their FIRE number or financial independence date, or how long until work is optional (also retire early in the UK, Canada or Australia), given age, invested savings, monthly investing and monthly spending; or what a purchase or a monthly cost does to that date (how many days of freedom a car, phone, holiday or recurring bill costs, the opportunity cost of buying it). Returns the FIRE number (4% rule by default, adjustable safe withdrawal rate), the date and days left, the age then, a cautious/base/optimistic range and a year-by-year table; with a purchase, also how many days it moves the date and what the money would grow to if invested instead. Ask for any missing number instead of guessing. Do not use for a question about one specific retirement age (use retire_at_age), comparing products or shop prices, loans, stock or fund picks, tax, pension or Social Security benefit rules, or live market data. An estimate, not financial advice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "age": {
                "description": "Current age in years.",
                "maximum": 90,
                "minimum": 14,
                "type": "integer"
              },
              "currency": {
                "default": "USD",
                "description": "ISO currency code used only for display.",
                "enum": ["USD", "EUR", "GBP", "CAD", "AUD", "NZD", "CHF", "SEK", "NOK", "DKK", "SGD", "JPY"],
                "type": "string"
              },
              "monthlyExpenses": {
                "description": "Monthly spending today; the plan keeps this lifestyle.",
                "maximum": 1000000,
                "minimum": 1,
                "type": "number"
              },
              "monthlyInvestment": {
                "description": "Amount invested each month.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "netWorth": {
                "description": "Invested savings today (not counting the home you live in).",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "purchase": {
                "description": "Optional: a purchase or monthly cost. Adds how many days it moves the freedom day and what the money would grow to if invested instead.",
                "properties": {
                  "amount": {
                    "description": "The price.",
                    "maximum": 10000000,
                    "minimum": 1,
                    "type": "number"
                  },
                  "frequency": {
                    "default": "one_off",
                    "description": "one_off for a single purchase, monthly for a recurring cost (subscription, car payment, rent increase).",
                    "enum": ["one_off", "monthly"],
                    "type": "string"
                  },
                  "item": {
                    "description": "Short name of the item, for display only.",
                    "maxLength": 60,
                    "type": "string"
                  }
                },
                "required": ["amount"],
                "type": "object"
              },
              "realReturnPct": {
                "default": 5,
                "description": "Yearly growth after inflation, in percent. Default 5.",
                "maximum": 12,
                "minimum": 0.5,
                "type": "number"
              },
              "withdrawalRatePct": {
                "default": 4,
                "description": "Safe withdrawal rate in percent. Default 4.",
                "maximum": 10,
                "minimum": 2,
                "type": "number"
              }
            },
            "required": ["age", "monthlyExpenses", "monthlyInvestment", "netWorth"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
