      "instructions": "Words in, barcode out, with how sure. Give a shopper's phrase or a merchant's offer line and a country; get back one barcode with a confidence, or the candidates when it is ambiguous (never a guess), or unknown. Every result carries four verification readings (source authority, disagreement, freshness and authorisation) and one result: verified, listed, stale or unknown. Price and stock are never verified from the record: they are read live, or unknown.",
