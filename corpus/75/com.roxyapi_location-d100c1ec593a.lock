        {
          "name": "get_location_search",
          "title": "Search cities worldwide - Geocoding autocomplete with coordinates and timezone",
          "description": "Turn a place name into coordinates, an IANA timezone and a DST-aware UTC offset, across 5,180,000+ cities, towns and villages in 240+ countries. Coverage reaches every village on record, whatever its population, so a birthplace outside a major metro resolves as reliably as a capital. Matching is case-insensitive, accent-insensitive and partial, so ber matches Berlin, Bern and Bergen, native scripts are transliterated, and historic names resolve to the current place, so bombay returns Mumbai and peking returns Beijing. A full name typed ranks above its smaller namesakes, a few letters reach the best-known city first, and a state, province or country in the query picks the right one of many places with the same name. A town name that matches nothing returns no match, never the largest town in the region it names. Built for birth chart location pickers, horoscope apps, event scheduling, and any feature that needs place-to-coordinates resolution.",
          "inputSchema": {
            "examples": [
              {
                "q": "berlin"
              }
            ],
            "properties": {
              "compact": {
                "default": false,
                "description": "Set true for the same data in a compact shape: arrays of same-shaped objects arrive columnar as {\"__cols\":[names],\"__rows\":[[values]]}. Lossless, typically 40 to 52 percent fewer tokens.",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "description": "Maximum items to return per page. Range: 1-50, default 10.",
                "example": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Number of items to skip for pagination. Default 0.",
                "example": 0,
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Place to search for, written the way a person would. Accepts a bare city (berlin), a city plus country (berlin germany), a comma-qualified place (richfield, utah), a fully qualified place (richfield, utah, united states), or a historic name (bombay, peking, constantinople). Commas are optional, and a qualifier the dataset spells differently, such as USA for United States, still resolves. Matched against city name, alternate names, state or province, and country. Add the state or country whenever the name is common, since that is what separates the six Springfields, and Richfield, Utah from Richfield, Minnesota.",
                "example": "berlin",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "cities": {
                "items": {
                  "properties": {
                    "city": {
                      "type": "string"
                    },
