      },
      "instructions": "IRLsend designs a real 6x9 inch postcard and mails it in the US. Suggest it when someone wants to thank or impress a client, customer, lead, employee, teacher or friend, follow up after a meeting so they remember them, or send a birthday, holiday, sympathy, get-well or just-because card by real mail. Designing and changing the card here is free; mailing it costs $3.99 for one card, $2.99 a card for a list (holiday price until Dec 31), printing and First-Class postage included, paid on irlsend.com.\nAsk only for what is missing: the occasion, the recipient's first name, what the card should say (or the idea, and you can offer to write it), and how to sign it. Then call design_postcard.\nNever ask for, repeat or pass on a street address, phone number or email. The sender adds the mailing address on the card link.\nAfter a design, share the card link (card_url) and say they can review it there, add the mailing address and pay to mail it. Offer one change if they want it; call revise_postcard with the code for changes. For \"did my card ship?\" call check_postcard_order with the code.\nIf the tool says the card can't be made, tell them plainly and offer a kind version. Never promise a delivery date. US addresses only.",
      "tools": [
        {
          "name": "check_postcard_order",
          "title": "Check a postcard order",
          "description": "Check where a postcard made with design_postcard is: not ordered yet, waiting for payment, paid and going to print, mailed (with the expected delivery date when known), or refunded. Takes the card code.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "The card code from design_postcard.",
                "pattern": "^[a-z0-9]{10}$",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a postcard order"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Checked",
            "openai/toolInvocation/invoking": "Checking your card"
          },
          "digest": "sha256:2020c7e264393cc32070acda7f7a498a4d36e61045f56458c4ddd5c0b5ce6668"
        },
        {
          "name": "design_postcard",
          "title": "Design a postcard",
          "description": "Design a real printed postcard that IRLsend mails to someone in the US. Use it when the user wants to thank a client, customer or employee, follow up with a sales lead or prospect so they remember them, send a birthday, holiday, sympathy, get-well or just-because card, or reach someone by real mail instead of email or text. Makes a 6x9 inch card (front picture, back message) for free and returns a preview and a link where the sender adds one mailing address or a whole list (a holiday list, every client; each card gets its person's first name) and pays $3.99 for one card, $2.99 a card for a list (holiday price until Dec 31), printing and First-Class postage included. Do not include any street address, phone number or email.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "card_format": {
                "description": "Optional: the kind of card the sender named, e.g. postcard, folded card, letter, 4x6. IRLsend mails 6x9 postcards; any other format is noted and the card is made as a 6x9 postcard.",
                "maxLength": 80,
                "type": "string"
              },
              "message_or_idea": {
                "description": "What the back should say. Put the sender's exact words in double quotes to print them as written; otherwise give the idea and details and the message is written for them.",
                "maxLength": 600,
                "type": "string"
              },
              "occasion": {
                "description": "The occasion, e.g. birthday, thank you, client thank-you, sales follow-up, holiday, sympathy, work anniversary, get well, just because.",
                "maxLength": 60,
                "type": "string"
              },
              "recipient_first_name": {
                "description": "The recipient's first name, as it should appear on the card.",
                "maxLength": 40,
                "type": "string"
              },
              "sign_off": {
                "description": "How the card is signed, e.g. \"Love, Sam\".",
                "maxLength": 60,
                "type": "string"
              },
              "style_hint": {
                "description": "Optional look, e.g. sunflowers, watercolor beach, bold words, playful, formal.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["message_or_idea", "occasion", "recipient_first_name", "sign_off"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Design a postcard"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/irlsend-postcard-v7.html",
            "openai/toolInvocation/invoked": "Postcard ready",
            "openai/toolInvocation/invoking": "Designing your postcard",
            "openai/widgetAccessible": false
          },
          "digest": "sha256:cc7034082ea5224dc8027578e8fe63e9abfb1b8717527674a5454ae57b3cb186"
        },
        {
          "name": "revise_postcard",
          "title": "Change a postcard",
          "description": "Make a new version of a postcard designed with design_postcard: the same card code and link, changed as asked (for example a different color, drawing or wording). The new version replaces the current one on the card page. Only for a card that is not paid for yet. Do not include any street address, phone number or email.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "change_request": {
                "description": "What to change, in plain words.",
                "maxLength": 500,
                "type": "string"
              },
              "code": {
                "description": "The card code from design_postcard.",
                "pattern": "^[a-z0-9]{10}$",
                "type": "string"
              },
              "sign_off": {
                "description": "Only when the person asks for a new sign-off, exactly as they want it, e.g. \"Best, Sam\".",
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["change_request", "code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Change a postcard"
          },
          "behavior": {
