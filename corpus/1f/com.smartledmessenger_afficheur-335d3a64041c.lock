{
  "lockfileVersion": 2,
  "subjects": {
    "com.smartledmessenger/afficheur": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.smartledmessenger.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "smart-led-messenger",
        "version": "1.0.0"
      },
      "capabilities": {
        "logging": {},
        "tools": {}
      },
      "instructions": "Pilotage d'un afficheur LED Smart Led Messenger : lire et modifier les réglages (message, heure, date, saint du jour, dicton, météo et sa ville, qualité de l'air, lever et coucher du soleil, phase de la lune, actualités, Bitcoin, couleur Tempo, prix du carburant, vélos en libre-service (Vélib, Vélo'v, levélo Marseille, VélôToulouse), prochains passages (Île-de-France, Lyon), temps de trajet en voiture, musique en cours via ListenBrainz, événements poussés par la domotique du client — « Portail ouvert », « Lumière salon allumée » — qui défilent quelques minutes puis disparaissent seuls), gérer des rappels programmés (anniversaires, rendez-vous, routines : un texte affiché entre deux heures — à une date, chaque année, chaque semaine, chaque mois ou tous les jours) ou envoyer un message immédiat. Les modifications sont visibles sur le bandeau en moins d'une minute.",
      "tools": [
        {
          "name": "slm_ajouter_rappel",
          "title": "Ajouter un rappel programmé",
          "description": "Ajoute un rappel sur le bandeau LED : un texte affiché tel quel, entre deux heures, selon une fréquence. Les champs de date fournis sont des contraintes : jour+mois = chaque année (anniversaires) ; jour+mois+annee = une seule fois, disparaît ensuite ; jour seul = le même jour de chaque mois ; jourSemaine seul = chaque semaine ; aucun champ de date = tous les jours. Exemples : « Anniversaire de Margot ! » jour=26 mois=8 de 8 à 20 heures ; « Sortir les poubelles » tous les mardis = jourSemaine=2. Active d'office l'affichage des rappels.",
          "inputSchema": {
            "properties": {
              "annee": {
                "default": null,
                "description": "Année de la date, pour un rappel PONCTUEL uniquement. Exige jour et mois. L'omettre rend le rappel récurrent.",
                "type": ["integer", "null"]
              },
              "heureDebut": {
                "default": 0,
                "description": "Heure à partir de laquelle le rappel s'affiche (0 à 23). Défaut : 0, dès minuit.",
                "type": "integer"
              },
              "heureFin": {
                "default": 24,
                "description": "Heure à laquelle il cesse de s'afficher (1 à 24, strictement après le début). Défaut : 24, toute la journée.",
                "type": "integer"
              },
              "jour": {
                "default": null,
                "description": "Jour du mois (1 à 31). Avec mois : une date ; seul : « le N de chaque mois ».",
                "type": ["integer", "null"]
              },
              "jourSemaine": {
                "default": null,
                "description": "Jour de la semaine pour un rappel HEBDOMADAIRE : 1 = lundi … 7 = dimanche. À la place de la date, jamais avec.",
                "type": ["integer", "null"]
              },
              "mois": {
                "default": null,
                "description": "Mois de la date du rappel (1 à 12). Exige jour.",
                "type": ["integer", "null"]
              },
              "texte": {
                "default": "",
                "description": "Le texte du rappel, affiché tel quel sur le bandeau (pas de préfixe ajouté).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "title": "Ajouter un rappel programmé"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:3f87c1f0c86591a917584d341408aec5d9f3e7b36589245af33921c4e17dfd0f"
        },
        {
          "name": "slm_envoyer_message",
          "title": "Envoyer un message sur l'afficheur",
          "description": "Envoie immédiatement un message sur le bandeau LED du client (équivalent du lien « push » utilisé par la domotique). Remplace le message personnel précédent et force son affichage. L'afficheur le montre à sa prochaine interrogation, sous une minute.",
          "inputSchema": {
            "properties": {
              "texte": {
                "default": "",
                "description": "Le texte à faire défiler sur le bandeau.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "title": "Envoyer un message sur l'afficheur"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:c0ac98a2d2e628ed3b0d2710efcd65d312f76a5b3b71bcf2e2e7081456bdb847"
        },
        {
          "name": "slm_lire_reglages",
          "title": "Lire les réglages de l'afficheur",
          "description": "Lit les réglages de l'afficheur LED Smart Led Messenger du client (message, heure, date, saint du jour, dicton, météo et sa ville, flux d'actualités, Bitcoin, Tempo, qualité de l'air, prix du carburant, lever et coucher du soleil, phase de la lune, vélos en libre-service Vélib, Vélo'v, levélo ou VélôToulouse, prochains passages en Île-de-France ou à Lyon, temps de trajet, musique en cours via ListenBrainz, rappels programmés avec leurs numéros, événements poussés par la domotique avec le temps qu'il leur reste à l'écran) et montre un aperçu du texte qui défile sur le bandeau.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Lire les réglages de l'afficheur"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d96e811ecb03d14df9d80a610fd7254103ee5b274b9fe5c43c9c393ab4e12aac"
        },
        {
          "name": "slm_modifier_reglages",
          "title": "Modifier les réglages de l'afficheur",
          "description": "Modifie les réglages de l'afficheur LED du client. Seuls les paramètres fournis changent, les autres restent tels quels. Exemples : pour « affiche la météo de Paris », appeler avec meteoVille=\"Paris\" ; pour « enlève le dicton », appeler avec dicton=false. Renvoie les nouveaux réglages et l'aperçu du bandeau.",
          "inputSchema": {
            "properties": {
              "afficherMessage": {
                "default": null,
                "description": "Afficher le message personnel (true) ou le masquer (false). Attention : le masquer EFFACE le message enregistré.",
                "type": ["boolean", "null"]
              },
              "bitcoin": {
                "default": null,
                "description": "Afficher le cours du Bitcoin en euros.",
                "type": ["boolean", "null"]
              },
              "carburant": {
                "default": null,
                "description": "Afficher le prix du carburant à la station-service la plus proche. Activé d'office si carburantLieu est fourni.",
                "type": ["boolean", "null"]
              },
              "carburantLieu": {
                "default": null,
                "description": "Lieu du carburant (code postal ou nom de ville, en France), par exemple \"44000\". Indépendant de la ville de la météo.",
                "type": ["string", "null"]
              },
              "carburantType": {
                "default": null,
                "description": "Carburants suivis, un a trois separes par des virgules, parmi gazole, sp95, sp98, e10, e85 et gplc. Exemple pour un foyer a deux vehicules : \"gazole,e85\". Chacun affiche sa propre station la plus proche.",
                "type": ["string", "null"]
              },
              "dateDuJour": {
                "default": null,
                "description": "Afficher la date du jour.",
                "type": ["boolean", "null"]
              },
              "dicton": {
                "default": null,
                "description": "Afficher le dicton du jour.",
                "type": ["boolean", "null"]
              },
              "evenements": {
                "default": null,
                "description": "Afficher les événements poussés par la domotique du client (Home Assistant, Jeedom, Node-RED) : « Portail ouvert », « Lumière salon allumée »... Chaque événement défile quelques minutes puis disparaît de lui-même. Le texte ne se règle pas ici, il est envoyé par l'installation domotique — ce paramètre n'est que l'interrupteur, et pousser un événement l'allume d'office.",
                "type": ["boolean", "null"]
              },
              "fluxRss": {
                "default": null,
                "description": "Flux d'actualités : 0 = désactivé, 1 = Le Monde, 2 = météo Île-de-France, 3 = Wall Street Journal, 4 = CNN.",
                "type": ["integer", "null"]
              },
              "heure": {
                "default": null,
                "description": "Afficher l'heure.",
                "type": ["boolean", "null"]
              },
              "listenbrainz": {
                "default": null,
                "description": "Afficher le titre et l'artiste en cours d'écoute, lus sur le compte ListenBrainz du client. Activé d'office si listenbrainzUser est fourni.",
                "type": ["boolean", "null"]
              },
              "listenbrainzUser": {
                "default": null,
                "description": "Nom d'utilisateur ListenBrainz (listenbrainz.org) dont les écoutes s'affichent. Le client y relaie son lecteur (Spotify ou autre) une fois, dans les réglages de listenbrainz.org.",
                "type": ["string", "null"]
              },
              "lune": {
                "default": null,
                "description": "Afficher la phase de la lune (nouvelle lune, premier quartier, pleine lune...). Calculée sur place, aucun réglage de lieu.",
                "type": ["boolean", "null"]
              },
              "message": {
                "default": null,
                "description": "Nouveau message personnel à faire défiler. Le fournir active son affichage, sauf si afficherMessage=false.",
                "type": ["string", "null"]
              },
              "meteo": {
                "default": null,
                "description": "Afficher la météo. Activée d'office si meteoVille est fournie.",
                "type": ["boolean", "null"]
              },
              "meteoVille": {
                "default": null,
                "description": "Ville de la météo (nom de ville ou code postal), par exemple \"Paris\".",
                "type": ["string", "null"]
              },
              "passages": {
                "default": null,
                "description": "Afficher les prochains passages de bus, métro, RER ou tram à un arrêt (Île-de-France ou Lyon). Activé d'office si passagesArret est fourni.",
                "type": ["boolean", "null"]
              },
              "passagesArret": {
                "default": null,
                "description": "Nom de l'arrêt surveillé, par exemple \"Val de Fontenay\" ou \"Bellecour\". Indépendant de la ville de la météo.",
                "type": ["string", "null"]
              },
              "passagesLigne": {
                "default": null,
                "description": "Ligne à afficher, facultative : \"RER A\", \"62\", \"D\". Sans elle, toutes les lignes de l'arrêt sont candidates.",
                "type": ["string", "null"]
              },
              "passagesReseau": {
                "default": null,
                "description": "Réseau des passages : \"idf\" (Île-de-France, le défaut) ou \"lyon\" (TCL). Toute autre valeur est refusée.",
                "type": ["string", "null"]
              },
              "qualiteAir": {
                "default": null,
                "description": "Afficher la qualité de l'air et les pollens (utilise la ville de la météo).",
                "type": ["boolean", "null"]
              },
              "rappels": {
                "default": null,
                "description": "Afficher les rappels programmés du compte (chacun à sa date, dans sa fenêtre horaire). Pour en ajouter ou en supprimer, utiliser slm_ajouter_rappel et slm_supprimer_rappel.",
                "type": ["boolean", "null"]
              },
              "saintDuJour": {
                "default": null,
                "description": "Afficher le saint du jour.",
                "type": ["boolean", "null"]
              },
              "soleil": {
                "default": null,
                "description": "Afficher les heures de lever et de coucher du soleil (utilise la ville de la météo).",
                "type": ["boolean", "null"]
              },
              "tempo": {
                "default": null,
                "description": "Afficher la couleur Tempo (EDF) : celle du lendemain, ou celle du jour tant qu'elle n'est pas publiée.",
                "type": ["boolean", "null"]
              },
              "trajet": {
                "default": null,
                "description": "Afficher le temps de trajet en voiture entre deux adresses, avec le trafic en direct. Activé d'office si les deux adresses sont fournies.",
                "type": ["boolean", "null"]
              },
              "trajetArrivee": {
                "default": null,
                "description": "Adresse d'arrivée complète (numéro, rue, ville), par exemple \"5 place Bellecour, Lyon\".",
                "type": ["string", "null"]
              },
              "trajetDepart": {
                "default": null,
                "description": "Adresse de départ complète (numéro, rue, ville), par exemple \"10 rue de la République, Lyon\".",
                "type": ["string", "null"]
              },
              "velib": {
                "default": null,
                "description": "Afficher les vélos en libre-service à une station : Vélib (Île-de-France), Vélo'v (Lyon), levélo (Marseille) ou VélôToulouse (Toulouse). Activé d'office si velibStation est fourni.",
                "type": ["boolean", "null"]
              },
              "velibPlaces": {
                "default": null,
                "description": "Afficher les places libres à la station Vélib. Sans velibVelos ni velibPlaces, les deux sont affichés.",
                "type": ["boolean", "null"]
              },
              "velibStation": {
                "default": null,
                "description": "Station suivie : son nom, ou le code inscrit sur la borne (cinq chiffres Vélib, quatre chiffres Vélo'v, numéro court VélôToulouse ; à Marseille, le nom seul). Le code lève les homonymies — \"République\" correspond à 23 stations Vélib.",
                "type": ["string", "null"]
              },
              "velibVelos": {
                "default": null,
                "description": "Afficher les vélos disponibles à la station Vélib.",
                "type": ["boolean", "null"]
              },
              "velosReseau": {
                "default": null,
                "description": "Réseau des vélos : \"idf\" (Vélib, le défaut), \"lyon\" (Vélo'v), \"marseille\" (levélo) ou \"toulouse\" (VélôToulouse). Toute autre valeur est refusée.",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "title": "Modifier les réglages de l'afficheur"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:f78da5050a8a9ee92a45be2afa488250d7f2ed06f1d29d2f6656aeb09cb65714"
        },
        {
          "name": "slm_supprimer_rappel",
          "title": "Supprimer un rappel programmé",
          "description": "Supprime un rappel programmé du compte, désigné par son numéro. Les numéros figurent dans la liste des rappels renvoyée par slm_lire_reglages et slm_ajouter_rappel.",
          "inputSchema": {
            "properties": {
              "identifiant": {
                "default": 0,
                "description": "Numéro du rappel à supprimer (cf. la liste des rappels dans slm_lire_reglages).",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "title": "Supprimer un rappel programmé"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d1907a2d94958ee60b9c32a97fb0169b368a52e8c3fac08e15c9cda4793ddfbd"
        }
      ],
      "digest": "sha256:a3929ba7c5f177c807c704eb0b904bc8586a5023a15c38359fc42a1b26818936"
    }
  }
