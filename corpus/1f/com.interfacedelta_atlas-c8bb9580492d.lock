        {
          "name": "get_atlas_entry",
          "title": "Get atlas entry",
          "description": "Read an atlas entry, labels and publicly displayed AI readings. Returns a short summary by default; pass view: \"full\" for the complete record. Example: {\"target\":\"rupturebrief.com\"}.",
