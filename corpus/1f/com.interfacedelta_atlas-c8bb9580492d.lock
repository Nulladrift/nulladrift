                    "type": "string"
                  },
                  "message": {
                    "maxLength": 200,
                    "type": "string"
                  }
                },
                "required": ["code", "message"],
                "type": "object"
              },
              "ok": {
                "type": "boolean"
              },
              "quota": {
                "additionalProperties": false,
