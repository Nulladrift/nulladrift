        {
          "name": "report_issue",
          "title": "Report issue",
          "description": "Report a record problem, tool problem or feature request for a person to review. Requires a free agent key or Record API key with record:read in Authorization. At most 5 reports per key and 50 total per UTC day; identical observed text per key is refused for 24 hours. observed and suggested_fix: 2,000 characters each; evidence_url: HTTPS, 500 characters, never fetched. No personal data, secrets, attachments or automatic record changes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "contact_ok": {
                "default": false,
                "description": "Allow contact through the existing key owner record.",
                "type": "boolean"
              },
              "evidence_url": {
                "description": "Public evidence link. Never fetched by InterfaceDelta.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "kind": {
                "enum": ["record_inaccurate", "record_missing", "tool_misbehaved", "feature_request"],
                "type": "string"
              },
              "observed": {
                "description": "What you saw. Do not include personal data or secrets.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "suggested_fix": {
                "description": "Suggested correction. Do not include personal data or secrets.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "target": {
                "anyOf": [
                  {
                    "maxLength": 71,
                    "minLength": 1,
                    "pattern": "^(?:sha256:)?[a-f0-9]{64}$",
                    "type": "string"
                  },
                  {
                    "maxLength": 128,
                    "minLength": 1,
                    "pattern": "^[a-zA-Z0-9_.-]+$",
                    "type": "string"
                  },
                  {
                    "maxLength": 35,
                    "pattern": "^capability:[a-f0-9]{24}$",
                    "type": "string"
                  },
                  {
                    "maxLength": 2048,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "Target key, MCP tool name (up to 128 characters), capability id, or HTTPS service URL (up to 2,048 characters)."
              }
            },
            "required": ["kind", "observed"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "message": {
