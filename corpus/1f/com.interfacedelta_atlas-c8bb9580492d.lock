            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3e8e257474df6be443def2fbf642ca2d74322c1db933c7c98b392529d781d704"
        }
      ],
      "digest": "sha256:06d322ff20d799d817f4185cd01916139e8fb45ec00e8b74631ae6309583ed86"
    }
  }
