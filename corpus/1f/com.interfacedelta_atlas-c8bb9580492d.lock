      "tools": [
        {
          "name": "check_tool",
          "title": "Check a tool (Record Check)",
          "description": "Read the stored facts and effect classes for one MCP tool, with a signature; never a verdict. No live inspection. A few free checks per day work without a key on /mcp/public: a shared pool of 300 per UTC day and 5 per minute globally. Optional network limits (off by default): 10 per UTC day and 5 per minute per network. Get a free agent key for 250 requests a month: POST https://interfacedelta.com/api/v1/agent-keys. With a Record API key in the Authorization header, each check uses one Record API request.",
