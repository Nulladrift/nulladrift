            "readOnly": true
          },
          "digest": "sha256:3e8e257474df6be443def2fbf642ca2d74322c1db933c7c98b392529d781d704"
        }
      ],
      "digest": "sha256:906552012385f4b01270ea85404e263b997b98cac01fe6052f780ec725853f62"
    }
