            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "endpoint": {
                "maxLength": 2048,
                "type": "string"
              },
              "since": {
                "type": "string"
              },
              "tool": {
                "maxLength": 128,
                "type": "string"
              }
            },
            "required": ["endpoint", "tool"],
