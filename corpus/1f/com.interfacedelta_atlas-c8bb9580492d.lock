        {
          "name": "get_passport",
          "title": "Get Passport",
          "description": "Read a Passport someone shared with you, by the observation ID in its link (/passport/<targetKey>/observations/<observationId>). Example: {\"observationId\":\"<UUID>\"}.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "observationId": {
                "description": "Observation UUID from a shared Passport link: /passport/<targetKey>/observations/<observationId>.",
                "format": "uuid",
                "maxLength": 36,
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["observationId"],
            "type": "object"
          },
