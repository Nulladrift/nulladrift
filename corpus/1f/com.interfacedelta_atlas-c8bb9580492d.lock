        {
          "name": "list_changes",
          "title": "List public changes",
          "description": "Read-only recorded atlas changes strictly after since, oldest first. No key or Record API quota. Example: {\"since\":\"2026-11-01T00:00:00Z\",\"domain\":\"example.com\"}.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "Copy nextCursor; keep since, domain and limit unchanged.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              },
              "domain": {
                "description": "Optional domain or http(s) URL, matching host and subdomains.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum items to return, from 1 to 50. Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "RFC 3339 UTC timestamp ending in Z; optional 1–3 fractional second digits.",
                "pattern": "^\\d{4}-\\d\\d-\\d\\dT\\d\\d:\\d\\d:\\d\\d(?:\\.\\d{1,3})?Z$",
                "type": "string"
              }
            },
            "required": ["since"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "error": {
                "additionalProperties": false,
                "properties": {
                  "candidates": {
                    "items": {},
                    "type": "array"
                  },
                  "code": {
                    "enum": ["NOT_FOUND", "AMBIGUOUS_TARGET", "INSUFFICIENT_SCOPE", "NO_OBSERVATIONS", "INVALID_CURSOR", "SERVICE_UNAVAILABLE", "INTERNAL_ERROR", "INVALID_DOMAIN", "INVALID_TIMESTAMP", "CURSOR_EXPIRED"],
                    "type": "string"
                  },
                  "message": {
                    "maxLength": 200,
                    "type": "string"
                  }
                },
                "required": ["code", "message"],
                "type": "object"
              },
              "ok": {
