                    "const": true
                  },
                  "remainingToday": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "resetAt": {
                    "type": "string"
                  }
                },
                "required": ["keyless", "remainingToday", "resetAt"],
                "type": "object"
              },
              "result": {}
