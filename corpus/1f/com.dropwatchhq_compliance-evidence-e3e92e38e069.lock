{
  "lockfileVersion": 2,
  "subjects": {
    "com.dropwatchhq/compliance-evidence": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://evidence.dropwatchhq.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "compliance-evidence",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "build_evidence_pack",
          "description": "Build a dated, source-linked, SIGNED compliance-evidence pack for a regulated-AI deployer to file with their auditor. Grounds each ticker's claims against CURRENT public gov facts (contradiction-engine: SEC 10-K vs USAspending), screens each named entity against federal exclusion/sanctions (exclude-feed: OFAC/LEIE/SAM), and runs N trap-fact refusals (planted false facts refuted by live public data). Output is an EVIDENCE ARTIFACT with a hash-chain receipt — NOT a 'you are compliant' claim.",
          "inputSchema": {
            "properties": {
              "entities": {
                "description": "Named entities to screen: [{name, npi?, uei?, state?}] (max 20).",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "tickers": {
                "description": "Public-company tickers whose disclosure claims to ground (max 10).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "traps": {
                "description": "Optional custom trap-fact battery; omit to use the default battery.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:71874e529e3fd96d4cb9f9af397db96579cccc45d96f75479cc591115423baa9"
        },
        {
          "name": "ground_claim",
          "description": "Ground one public-company claim against CURRENT gov facts via the live contradiction-engine. Returns the dual-cited record if a verifiable 10-K-vs-USAspending contradiction exists, else an HONEST null ('checked, no contradiction at medium/high confidence as of T') — itself audit evidence.",
          "inputSchema": {
            "properties": {
              "ticker": {
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:10afad6f5b5dc6b1f21d7479e2c7c539bb2e6e6de1fd0fe7c616d03966a34a47"
        },
        {
          "name": "screen_entity",
          "description": "Screen a named entity across federal exclusion/sanctions lists (OFAC SDN, OFAC Consolidated, OIG LEIE; SAM where enabled) via the live exclude-feed. FCRA-safe KYB/sanctions screen, not a consumer report.",
          "inputSchema": {
            "properties": {
              "name": {
                "type": "string"
              },
              "npi": {
                "type": "string"
              },
              "state": {
                "type": "string"
              },
              "uei": {
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ca71f2df90dd699c9a93aebd94ca9aa93938587366481b15196ad3ac7bbf7c6d"
        },
        {
          "name": "verify_pack",
          "description": "Verify a previously-issued pack's hash-chain receipt (proves the artifact is unaltered since generatedAt). Pass the pack id.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:461205a81fd2f449932d84f17d8ba1483d2f83f62125b17ebab507ad64ed399a"
        }
      ],
      "digest": "sha256:a734a5fbdcd9b2ebe1bf170a756b87aeb9e3454c030897672364b4ae50bcaa4e"
    }
  }
}
