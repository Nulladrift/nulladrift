      "serverInfo": {
        "name": "pagecritic",
        "title": "PageCritic",
        "version": "1.0.0",
        "websiteUrl": "https://pagecritic.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PageCritic audits public landing pages for conversion problems and checks whether AI crawlers can read them. Free results; a $5 full report can be unlocked by a human at the report_url.",
      "tools": [
        {
          "name": "audit_landing_page",
          "title": "Audit a landing page for conversions",
          "description": "Loads a public landing page in a real browser (desktop and mobile), and returns a conversion score from 0 to 100, seven sub-scores (clarity, value proposition, CTA, trust, design, mobile, SEO basics), the top 3 issues with concrete fixes, what already works, a short AI-readiness score, and fix_prompt: a Markdown prompt that hands the fixes to a coding agent such as Claude Code or Cursor. Use it when someone wants feedback on why a homepage, landing page or pricing page does not convert, wants a second opinion before a launch, or wants to compare their page with a competitor's. Do not use it for pages behind a login, for non-HTML files, or for general SEO keyword research. It takes 30 to 90 seconds; if it returns status \"running\", call get_audit_result with the audit_id. The free result is complete on its own. The full report (every other issue ranked by the points it costs, the 36-check list, 3 headline and 3 CTA rewrites, 5 quick wins, mobile review, full AI-readiness fixes) costs $5 USD one-time, paid by a human at report_url. Set language to \"pt\" for a report in Brazilian Portuguese. Without usable credits, results for the same URL and language are normally reused for 24 hours; selected well-known sites can reuse reports for up to 7 days. Paid-credit audits run fresh within the daily spend cap; idempotent REST retries return their original audit without another charge. The free web report shows issue titles and a prompt preview; this agent result includes the top-3 fixes and prompt. The 3 included web rechecks are not API credits. Limit: 5 new audits per hour per client, 20 with an API key. With an API key that has credits (Authorization: Bearer header; 10 full reports for $29, see https://pagecritic.app/developers), the result includes the full report.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Language of the report: \"en\" (English, default), \"pt\" (Brazilian Portuguese), \"es\" (Latin American Spanish). Headline and CTA rewrites stay in the page's own language. Prices stay in USD.",
                "enum": ["en", "pt", "es"],
                "type": "string"
              },
              "url": {
                "description": "Full URL of the public web page, e.g. https://example.com or https://example.com/pricing.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Audit a landing page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d31dd2bc84e550a405a89874a43d39133e983b4307d5da73e42802dde80594b9"
        },
        {
          "name": "check_ai_readiness",
          "title": "Check if AI crawlers and agents can read a page",
          "description": "Fetches a public page as a normal browser and as GPTBot, OAI-SearchBot, ChatGPT-User, ClaudeBot, Claude-User and PerplexityBot, then reports which AI bots are blocked or get a challenge page, the robots.txt rule for each AI bot, how much text is visible without JavaScript, JSON-LD types, sitemap, Markdown versions and llms.txt, with a 0-100 score and prioritized fixes. Use it when someone asks whether ChatGPT, Claude or Perplexity can see or cite their site, or why their site does not show up in AI answers. Do not use it to judge design or copy (use audit_landing_page). It uses plain HTTP fetches, takes about 5-15 seconds, and is free (15 checks per hour per client).",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Full URL of the public web page, e.g. https://example.com or https://example.com/pricing.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check AI readiness"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:228064effa858d05a9c3483632db134767bb631cce59e6e73ce9e5ca319ef545"
        },
        {
          "name": "get_audit_result",
          "title": "Get an audit result by id",
          "description": "Returns the current result of an audit started with audit_landing_page, by its audit_id. Use it only when audit_landing_page returned status \"running\"; wait about 20 seconds between calls. Returns the same fields as audit_landing_page.",
          "inputSchema": {
            "properties": {
              "audit_id": {
                "description": "The 24-character audit_id returned by audit_landing_page.",
                "type": "string"
              }
            },
            "required": ["audit_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get audit result"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:84c1944328fab6974b0976c96945ecb89e4774eb391e89b7d5dd7c8fa228f463"
        }
      ],
      "digest": "sha256:5f11c1c48f181e2a9acb090eb7966bd9958b2d13af57c614e1c5d10380312789"
    }
  }
