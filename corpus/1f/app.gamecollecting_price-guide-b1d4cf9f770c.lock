{
  "lockfileVersion": 2,
  "subjects": {
    "app.gamecollecting/price-guide": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://gamecollecting.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "gamecollecting",
        "title": "gamecollecting.app",
        "version": "1.0.0",
        "websiteUrl": "https://gamecollecting.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Video game prices from completed sales on eBay and Vinted: loose, complete, sealed and graded copies, by platform, region (NTSC, PAL, Japan) and edition. Find a game with search_games, then call get_game_prices with its URL. The figures are the ones on the game's page; link that page when you cite them.",
      "tools": [
        {
          "name": "browse_platform",
          "title": "Browse a platform",
          "description": "One platform's games with their prices, most popular first or by price: the most valuable games on a console, the cheapest, A to Z. Optionally only PAL, NTSC or Japanese releases.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "Currency for prices, an ISO 4217 code: USD (the default), EUR, GBP, CAD, AUD, JPY, PLN and others.",
                "type": "string"
              },
              "limit": {
                "description": "Games a page, 1 to 60 (20 when left out).",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "description": "Page of games; a sort shows the platform's first 180.",
                "minimum": 1,
                "type": "integer"
              },
              "platform": {
                "description": "A platform slug from list_platforms, e.g. \"super-nintendo\".",
                "type": "string"
              },
              "region": {
                "description": "pal, ntsc-u (North America) or ntsc-j (Japan and Asia); every region when left out.",
                "enum": ["pal", "ntsc-u", "ntsc-j"],
                "type": "string"
              },
              "sort": {
                "description": "most-listed (most popular, the default), name (A to Z), price (highest first), price-asc (lowest first).",
                "enum": ["most-listed", "name", "price", "price-asc"],
                "type": "string"
              }
            },
            "required": ["platform"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Browse a platform"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1d62b666418d0d266495124a75b0ab4095210706b908ed0902cab9023449aa7b"
        },
        {
          "name": "get_game_prices",
          "title": "Game prices",
          "description": "What one game sells for, from completed sales: the range and typical price of loose, incomplete, complete, sealed and graded copies, each region's and each edition's price, how fast it sells and its newest sales. Name the game by its page URL from search_games, optionally a region and an edition.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "Currency for prices, an ISO 4217 code: USD (the default), EUR, GBP, CAD, AUD, JPY, PLN and others.",
                "type": "string"
              },
              "edition": {
                "description": "An edition slug from the answer's editions, e.g. \"platinum\". Needs region.",
                "type": "string"
              },
              "region": {
                "description": "A region code from the answer's regions, e.g. \"us\" (NTSC), \"eu\" (PAL), \"asia\" (Japan and Asia).",
                "type": "string"
              },
              "sales": {
                "description": "How many of the newest sales to include, 0 to 10 (10 when left out).",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "url": {
                "description": "The game's page URL or path, e.g. \"https://gamecollecting.app/games/playstation-2/gran-turismo-4\". An edition's URL from this tool's answer works too.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Game prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:81899efb0515f70b9d2e13a92e4e96db901988dfb8ba26f0e2dc96a38e8b8023"
        },
        {
          "name": "list_platforms",
          "title": "List platforms",
          "description": "Every platform the price guide covers, with its slug (for the other tools), its number of games and its page URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List platforms"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8f4fa47b08901327a213baec0a47647ef0e08ae2ebe7cdc90942659d0a6facec"
        },
        {
          "name": "search_games",
          "title": "Search games",
          "description": "Find video games by name, on every platform or one. Each match comes with its platform, its page URL and what loose, complete and sealed copies typically sell for.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "Currency for prices, an ISO 4217 code: USD (the default), EUR, GBP, CAD, AUD, JPY, PLN and others.",
                "type": "string"
              },
              "page": {
                "description": "Page of results, 24 a page, up to page 3.",
                "minimum": 1,
                "type": "integer"
              },
              "platform": {
                "description": "A platform slug from list_platforms, e.g. \"playstation-2\" or \"nintendo-switch\".",
                "type": "string"
              },
              "query": {
                "description": "The game's name or words from it, e.g. \"ocarina of time\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search games"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:225a537fee92fb39cc3a20d17e89c3dfc997c5fc7ba94c8c2e868f03ddc8ec98"
        }
      ],
      "digest": "sha256:0a3c6763c904cb7ebf180ca2dd6e5c32dd4debc6dad9fd10df1e009f6321006f"
    }
  }
}
