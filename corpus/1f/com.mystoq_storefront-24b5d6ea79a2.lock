          },
          "digest": "sha256:f6ab6e172464f3e5577ecc4e71d63839f03c344df0879a00c3d1e934e50d168a"
        },
        {
          "name": "publish",
          "description": "Publish a product (set status=active) so it shows on the storefront. Requires Bearer token. WRITE.",
          "inputSchema": {
            "properties": {
              "product_id": {
                "description": "Product id to publish.",
                "type": "integer"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Publish product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:38f7d2c4e9eda1bccd65f3cd0370a7eaa673a9476e158beadb53a3cbea84ce80"
        },
        {
          "name": "search_stores",
          "description": "Search the public Mystoq store directory (Algerian online shops). Filter by keyword (store name), wilaya, or plan. Returns store name, wilaya, storefront URL and plan tier. Public business listings only — no merchant personal data.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max results (1-25, default 12).",
                "type": "integer"
              },
              "offset": {
                "description": "Pagination offset (default 0).",
                "type": "integer"
              },
              "query": {
                "description": "Keyword in the store name.",
                "type": "string"
              },
              "wilaya": {
                "description": "Wilaya filter: code (1-69) or name (e.g. \"16\", \"Alger\", \"الجزائر\").",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Mystoq stores"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:96d0b693016d801377dbc9e3996831791c0e04545b76c6e04e841270cf19a565"
        },
        {
          "name": "set_price",
          "description": "Update a product's price (and optional compare_price) in the authenticated store. Requires Bearer token. WRITE.",
          "inputSchema": {
            "properties": {
              "compare_price": {
                "description": "Optional old/compare price.",
                "type": "number"
              },
              "price": {
                "description": "New price in DZD.",
                "type": "number"
              },
              "product_id": {
                "description": "Product id.",
                "type": "integer"
              }
            },
            "required": ["price", "product_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Set product price"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:43cb17c19403987f2f63a83c3084e2432ade48c8c7ee0383e38099682bb64fd3"
        },
        {
          "name": "yalidine_delivery",
          "description": "Estimate delivery success/return rate and typical delivery time for a destination wilaya in Algeria (region-based network estimate).",
          "inputSchema": {
            "properties": {
              "wilaya": {
                "description": "Destination wilaya: slug, name or number (e.g. \"oran\", \"Alger\", \"31\").",
                "type": "string"
              }
            },
            "required": ["wilaya"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Yalidine delivery estimate"
          },
          "behavior": {
            "destructive": false,
