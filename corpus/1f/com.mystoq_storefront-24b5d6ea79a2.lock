          },
          "digest": "sha256:4367c08860e6e0b909eef144d89e0809128e6223fa6ba373e1c747e40259cce5"
        },
        {
          "name": "order_risk",
          "description": "Score the fraud/return risk of an Algerian COD order from its signals (phone, history, etc.) — Mystoq FakeShield logic.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Delivery address.",
                "type": "string"
              },
              "hour": {
                "description": "Hour the order was placed, 0-23.",
                "type": "integer"
              },
              "name": {
                "description": "Customer full name.",
                "type": "string"
              },
              "phone": {
                "description": "Customer phone (Algerian mobile).",
                "type": "string"
              },
              "wilaya": {
                "description": "Destination wilaya.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Order fraud-risk score"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:36bdc719e4dc4314efdc15aa00e71f626eeb02a391472030dbca641b033c06ea"
        },
        {
          "name": "platform_stats",
          "description": "Mystoq network statistics: number of active stores and wilayas covered.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Mystoq platform stats"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
