{
  "lockfileVersion": 2,
  "subjects": {
    "com.mystoq/storefront": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mystoq.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "mystoq",
        "title": "Mystoq — Algerian COD e-commerce",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Mystoq is Algeria's cash-on-delivery (COD) e-commerce platform. Use search_stores and get_store to discover public Algerian online shops and their storefronts; list_plans for Mystoq pricing; platform_stats for network figures; and cod_profit / yalidine_delivery / order_risk to analyse a COD business (true CAC & profit, shipping estimate, fraud-risk of an order).",
      "tools": [
        {
          "name": "cod_profit",
          "description": "Compute true CAC and net cash-on-delivery profit for an Algerian online store, accounting for the return/refusal rate. Returns base and confirmation-call scenarios.",
          "inputSchema": {
            "properties": {
              "ad_cost_per_order": {
                "description": "Ad spend to acquire one confirmed order (DZD).",
                "type": "number"
              },
              "product_cost": {
                "description": "Product cost (DZD).",
                "type": "number"
              },
              "return_cost": {
                "description": "DZD lost per refused/returned parcel (default 600).",
                "type": "number"
              },
              "return_rate_pct": {
                "description": "Percent of confirmed orders refused/undelivered (e.g. 25 for 25%).",
                "type": "number"
              },
              "selling_price": {
                "description": "Selling price per order (DZD).",
                "type": "number"
              }
            },
            "required": ["ad_cost_per_order", "product_cost", "selling_price"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "COD profit / CAC"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d91cd31ef25c5c28584d60142133ff902e0242c95c14fc719c5c1603b992b6fd"
        },
        {
          "name": "create_product",
          "description": "Create a product in the authenticated merchant's store. Requires Bearer token. WRITE.",
          "inputSchema": {
            "properties": {
              "auto_delete_at": {
                "description": "ISO timestamp after which a demo product is auto-deleted server-side.",
                "type": "string"
              },
              "compare_price": {
                "description": "Strikethrough/old price (optional).",
                "type": "number"
              },
              "description": {
                "description": "Description.",
                "type": "string"
              },
              "is_demo": {
                "description": "Mark as an ephemeral demo product (server auto-deletes it after auto_delete_at).",
                "type": "boolean"
              },
              "name": {
                "description": "Product name.",
                "type": "string"
              },
              "price": {
                "description": "Price in DZD.",
                "type": "number"
              },
              "status": {
                "description": "active | draft | archived (default draft).",
                "type": "string"
              },
              "stock": {
                "description": "Stock quantity (optional).",
                "type": "integer"
              },
              "translations": {
                "description": "Optional {ar|fr|en:{name,description}}.",
                "type": "object"
              }
            },
            "required": ["name", "price"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:39a521290ebbd41fd46a84df305f4bae8f6897d6cc3642a3f6b6cbba86c3bb72"
        },
        {
          "name": "create_store",
          "description": "Register a NEW Mystoq store (tenant). Returns the store id, slug and an access token. No auth needed. WRITE.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "Owner email.",
                "type": "string"
              },
              "name": {
                "description": "Store name.",
                "type": "string"
              },
              "password": {
                "description": "Account password (min 8).",
                "type": "string"
              },
              "phone": {
                "description": "Owner phone in Algeria (e.g. 0555123456). Required — a cash-on-delivery store cannot take an order without one.",
                "type": "string"
              },
              "slug": {
                "description": "Desired store address, the <slug>.mystoq.com part. Optional: derived from the store name when omitted. Latin letters, digits and hyphens, 3-30 chars.",
                "type": "string"
              },
              "wilaya_id": {
                "description": "Wilaya code 1-69 (optional).",
                "type": "integer"
              }
            },
            "required": ["email", "name", "password", "phone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create store"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d6532eb4386c0ef8be0474aacd36cc76400c17f256c3e71a862eb9d8187c4624"
        },
        {
          "name": "delete_product",
          "description": "Delete a product from the authenticated store (reversible cleanup — used by the agent's ephemeral live-demo). Requires Bearer token; only the owner's own product. WRITE/DESTRUCTIVE.",
          "inputSchema": {
            "properties": {
              "product_id": {
                "description": "Product id to delete.",
                "type": "integer"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Delete product"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:817bd9cb2222a9299d2018620dca13b90596eb4874371d92f94db19bf70db12f"
        },
        {
          "name": "get_store",
          "description": "Get a public Mystoq store by its slug: name, wilaya, storefront URL, plan tier and member-since. Public info only.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Store slug, e.g. \"islem-uk\".",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Mystoq store"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a427eb0f4259b1fd50c44e8caf95d93ed62711e3b609774e61ade4f1c8f83d06"
        },
        {
          "name": "list_plans",
          "description": "List Mystoq subscription plans with monthly/yearly/lifetime prices (DZD) — useful to answer \"how much does Mystoq cost\".",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Mystoq plans"
          },
          "behavior": {
            "destructive": false,
