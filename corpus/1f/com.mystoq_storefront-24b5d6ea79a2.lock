          },
          "digest": "sha256:caddc27bbe52f4a80e87198c5a39dec7fd6efbaac2e5cd37f663a5d324043e11"
        }
      ],
      "digest": "sha256:155ec21dd6e96844acd8737e9a0357c2ae08a1c3c7d33c4fbfe3ed1b1bdaf48b"
    }
  }
