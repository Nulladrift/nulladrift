        },
        {
          "name": "find_venues",
          "description": "Restaurants bookable through this network, and what each one's system supports.\n\n        Returns every venue that has opted in, across restaurant groups. Two optional filters\n        narrow it, never widen it: `signup_form_id` to one website's venues when you found an\n        Orion signup embed on a restaurant's page, and `venue_id` to a single venue when\n        you already have its loyalist-venue-id (off a page's markup or a ReserveAction entry\n        point) and want just that one rather than listing them all and matching yourself.\n        Neither can reach a venue that has not opted in.\n\n        A venue with `bookable: false` has no reservation system connected and will return\n        no availability.\n        ",
          "inputSchema": {
            "properties": {
              "signup_form_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Signup Form Id"
              },
              "venue_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Venue Id"
              }
            },
            "title": "find_venuesArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find venues"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8e575087fc1a3717c452f5962ebf8306b2e5e2da533d19005a7a5eca8bb8c739"
        },
        {
          "name": "get_availability",
          "description": "Bookable times at one venue, on one date, for one party size.\n\n        `date` is the venue's own local calendar date, `YYYY-MM-DD`. Each slot carries a\n        `slot_id` to pass to book and a `starts_at` that is a full venue-local datetime, so\n        a service running past midnight is unambiguous without you having to infer the day.\n\n        An empty `slots` list means nothing is open on those terms, not that the venue is\n        closed. Try a different time, party size or date before telling someone it is full.\n        ",
          "inputSchema": {
            "properties": {
              "date": {
                "title": "Date",
                "type": "string"
              },
              "party_size": {
                "title": "Party Size",
                "type": "integer"
              },
              "venue_id": {
                "title": "Venue Id",
                "type": "string"
              }
            },
            "required": ["date", "party_size", "venue_id"],
            "title": "get_availabilityArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check availability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:91d18ab0e0b5d0f06c98dc76d0f6c0412ce46be4c26c4c5ed414deb2de8e5aa2"
        },
        {
          "name": "get_reservation",
          "description": "Read one booking this credential made back from the venue.\n\n        Use it to confirm a booking landed. A `status` of `pending` means the venue has not\n        answered yet, not that it failed; treat anything you do not recognise as\n        non-terminal rather than reporting a failure.\n        ",
          "inputSchema": {
            "properties": {
              "reservation_id": {
                "title": "Reservation Id",
                "type": "string"
              }
            },
            "required": ["reservation_id"],
            "title": "get_reservationArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a reservation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:04617c115df4013d32dfdfbe896f13a804213c77c5bbc373e918882b3756af74"
        },
        {
          "name": "join_waitlist",
          "description": "Ask to be told if a table opens at a time the guest actually wants.\n\n        This is not a reservation and never becomes one by itself. The venue contacts the\n        guest if something frees up, so say that plainly rather than implying a table is\n        held.\n\n        Offer it whenever the guest cannot get a time that suits them, which is far more\n        often than a venue being completely full: someone who wants 7:30 and is offered\n        5:00 or 9:45 may well prefer to wait for 7:30. An empty get_availability is only\n        the most obvious case. Try other times, party sizes and dates first, then ask\n        whether they would rather wait than take a time that does not work. Record what\n        they wanted in `time_range`, not the time you found.\n\n        `date` is the venue's own local calendar date, `YYYY-MM-DD`. `time_range` is\n        required and is the window in the guest's words, like \"7:00 PM - 9:00 PM\" or\n        \"7:00 PM\"; ask the guest for it rather than guessing, because the venue works the\n        list by when people wanted to come. The email address is where the confirmation\n        goes, so it must be the guest's own.\n\n        Not every venue accepts these. One that does not refuses with a message saying so,\n        which is an answer, not an error to retry.\n\n        There is no reference number to give the guest, so the response is the only record\n        either of you gets. Confirm it back to them by the restaurant, date and time.\n\n        Mention the confirmation email only when `confirmation_sent` is true. When it is\n        false the request is still on the venue's list, the note simply did not go out, so\n        say they are on the list and that no email is coming rather than promising one.\n        ",
          "inputSchema": {
            "properties": {
              "date": {
                "title": "Date",
                "type": "string"
              },
              "email": {
                "title": "Email",
                "type": "string"
              },
              "first_name": {
                "title": "First Name",
                "type": "string"
              },
              "last_name": {
                "title": "Last Name",
                "type": "string"
              },
              "notes": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Notes"
              },
              "party_size": {
                "title": "Party Size",
                "type": "integer"
              },
              "phone": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Phone"
              },
              "time_range": {
                "title": "Time Range",
                "type": "string"
              },
              "venue_id": {
                "title": "Venue Id",
                "type": "string"
              }
            },
            "required": ["date", "email", "first_name", "last_name", "party_size", "time_range", "venue_id"],
            "title": "join_waitlistArguments",
            "type": "object"
