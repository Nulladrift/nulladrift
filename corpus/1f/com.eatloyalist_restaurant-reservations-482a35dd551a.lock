      "instructions": "Book restaurant tables at venues that have joined the Orion agent network.\n\nfind_venues and get_availability need no credential: look around freely before deciding whether this is useful. Booking needs one, and a slot_id read anonymously cannot be booked, so once you have a credential re-read availability under it and book the slot it returns.\n\nFlow: find_venues to get a venue_id, get_availability for that venue on a date and party size, then book with one of the slot_ids it returned. A slot_id is an offer, not a hold: it is valid for about 30 minutes, is tied to this credential, and someone else can take the table before you redeem it. If booking returns slot_unavailable, re-read availability and pick another slot rather than retrying the same one.\n\nA guest's first name, last name and email are required, and phone is effectively required too: some venues cannot create a guest record without one and refuse the booking with guest_field_required. Collect it up front rather than discovering this at the end.\n\nIf you arrived from a restaurant's own website and it gave you a source value to pass (in its markup or llms.txt), send it to book as `source`, so the restaurant can see that its own site drove the booking. Leave it out if you did not come through one.\n\nOnly public inventory is offered. Tables a venue holds back for its own use are never returned here, and booking past a venue's pacing cap is not possible.\n\nWhen a guest cannot get a time that works for them, join_waitlist records what they actually wanted, at venues that accept one. That covers an empty get_availability, and equally a venue holding 5:00 and 9:45 when the guest wants 7:30. A time they have turned down is not availability. Try other times, party sizes and dates first, then ask whether they would rather wait. It is not a reservation and never becomes one on its own: the restaurant contacts the guest if a table frees up. Say that plainly rather than implying a table is held. The guest gets a confirmation email from Orion that they cannot reply to.\n\nTHERE IS NO CANCEL AND NO MODIFY. This is a property of the authorisation model rather than a missing feature, so do not look for another tool or endpoint: a guest who needs to change or cancel a booking contacts the restaurant directly. Say so plainly rather than implying you can undo it later.\n\nIf the venue someone names is not in find_venues, it has not joined the network. Say that rather than booking somewhere else you did find.",
      "tools": [
        {
          "name": "book",
          "description": "Book a table. This takes a real table at a real restaurant.\n\n        Pass a `slot_id` from get_availability. Confirm the venue, date, time and party size\n        with the person before calling this, and do not call it speculatively: there is no\n        cancel tool, so a booking made by mistake has to be undone by the guest phoning the\n        restaurant.\n\n        Calling it twice with identical arguments is safe and returns the same reservation\n        rather than taking a second table. Changing the slot or the guest makes it a\n        different booking, so re-read availability rather than editing the arguments to\n        \"retry\".\n\n        `phone` is optional here but required by some venues; omitting it can come back as\n        `guest_field_required`. `note` reaches the restaurant as the reservation's note.\n\n        `source` is where you found this venue: if the restaurant's own website told you a\n        value to pass (in its markup or llms.txt), send it here so the restaurant can see its\n        own site drove the booking. Leave it out if you did not arrive through one.\n\n        `reservation_id` is for your own use, to read the booking back with get_reservation.\n        It is not a confirmation number the venue knows, so do not read it out to the guest:\n        tell them the restaurant, date, time and party size instead.\n        ",
          "inputSchema": {
            "properties": {
              "email": {
                "title": "Email",
                "type": "string"
              },
              "first_name": {
                "title": "First Name",
                "type": "string"
              },
              "last_name": {
                "title": "Last Name",
                "type": "string"
              },
              "note": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
