                "type": "string"
              },
              "source": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Source"
              }
            },
            "required": ["email", "first_name", "last_name", "slot_id"],
            "title": "bookArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
