        {
          "name": "lo_que_no_se",
          "title": "Los huecos de esta fuente (lo que le pidieron y no supo)",
          "description": "Devuelve lo que gente real de Puerto Rico le pidió a esta fuente y la fuente NO pudo contestar, agregado por categoría y pueblo. Sirve para 2 cosas: saber cuándo NO confiar en esta fuente, y ver demanda local medida que hoy nadie está sirviendo. Se ordena por personas distintas, no por número de preguntas, porque 40 preguntas de una sola persona no son demanda. Solo agregados: el texto de lo que escribió cada persona nunca se expone.",
          "inputSchema": {
            "properties": {
              "dias": {
                "description": "Ventana hacia atrás (7-365, default 90)",
                "type": "number"
              },
              "limite": {
