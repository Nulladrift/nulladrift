        {
          "name": "que_dijeron",
          "title": "Qué dijo quién, con minuto (memoria cívica de PR)",
          "description": "Busca en los transcripts completos de vistas públicas, entrevistas y programas de análisis de Puerto Rico (Senado, Cámara, alcalde de Cabo Rojo, Jay Fonseca, Telemundo, Jugando Pelota Dura) guardados por CaboRojo.com. Devuelve el fragmento textual, quién lo dijo, la fecha y el enlace al minuto exacto del video. OJO: es lo que ALGUIEN DIJO, no un dato verificado (nivel_verificacion = fuente). Sirve para citar textual con derecho a réplica, no para afirmar hechos. Úsalo para \"¿qué dijo la AAA sobre el agua de Esencia?\", \"¿qué prometió el alcalde sobre el balneario?\", \"¿qué dijo Jay Fonseca de las baterías de Tesla?\".",
          "inputSchema": {
            "properties": {
              "desde": {
                "description": "Fecha mínima YYYY-MM-DD (opcional)",
                "type": "string"
              },
              "frente": {
                "description": "Tema para filtrar: \"La luz\", \"El agua\", \"Esencia\", \"La cita\" (opcional)",
                "type": "string"
              },
              "limite": {
                "description": "Máximo de fragmentos (1-12, default 6)",
                "type": "number"
              },
              "pregunta": {
                "description": "Qué quieres saber que se dijo (ej: \"baterías Tesla sin instalar\")",
                "type": "string"
              }
            },
            "required": ["pregunta"],
            "type": "object"
          },
