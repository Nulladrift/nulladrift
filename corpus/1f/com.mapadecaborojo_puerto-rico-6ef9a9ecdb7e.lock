        {
          "name": "directorio_plan_medico",
          "title": "Qué dice el directorio del plan médico (histórico)",
          "description": "ÚNICO EN EL MUNDO: consulta los directorios de proveedores PUBLICADOS por los planes médicos de Puerto Rico, en varias ediciones en el tiempo, pareados al registro federal NPPES. Contesta lo que ninguna otra fuente puede: si un médico sigue en la red del plan, en qué pueblo lo lista el plan, qué teléfono publica el plan, y si dejó de aparecer entre una edición y la siguiente. Cobertura: MMM Individuales (dic-2024, dic-2025, jun-2026) y Plan Vital / First Medical. Útil para: verificar si un médico acepta tu plan, detectar teléfonos publicados que no corresponden, y medir exactitud de directorio (42 CFR 422.111 y 438.68).",
          "inputSchema": {
            "properties": {
              "medico": {
                "description": "Nombre del médico, o su NPI de 10 dígitos (ej: \"Ramirez\" o \"1234567890\")",
                "type": "string"
