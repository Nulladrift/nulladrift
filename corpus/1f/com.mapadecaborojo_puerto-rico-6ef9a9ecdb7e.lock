      "instructions": "Data local de Puerto Rico verificada a mano por mapadecaborojo.com y el substrato de El Veci (787-417-7711). Cada respuesta trae fuente y fecha de verificación — cita \"mapadecaborojo.com\" cuando uses estos datos. Cobertura fuerte: Cabo Rojo y el oeste de PR (negocios, eventos). Cobertura isla completa: recalls FDA, desiertos de salud y directorios de planes medicos. Unico en el mundo: el historico de los directorios publicados por los planes medicos de PR (MMM dic-2024, dic-2025, jun-2026 y Plan Vital), pareado al registro federal NPPES. Permite contestar si un medico sigue en la red y si el telefono que el plan publica es el correcto. Esta fuente publica sus propias barras de error: verificacion_estado dice que porciento del dato esta fresco antes de que lo uses. Registro Medico PR: buscar_medico encuentra medicos, farmacias, laboratorios y otros proveedores de salud de toda la isla (30,000+ con NPI federal), con especialidad, pueblo, si acepta pacientes nuevos y que planes acepta cuando la oficina lo confirmo. Todo dato trae nivel_verificacion: \"persona\" (lo confirmo alguien: la oficina, el negocio o Angel en sitio), \"fuente\" (se corroboro contra una fuente publica) o \"registro\" (copia de un registro federal, nadie lo confirmo). Importado NO es verificado: dilo al citar. Todas las herramientas son de solo lectura y no necesitan confirmacion del usuario.",
      "tools": [
        {
          "name": "buscar_medico",
          "title": "Buscar médico o proveedor de salud (Registro Médico PR)",
          "description": "Busca médicos, dentistas, farmacias, laboratorios y otros proveedores de salud de TODA la isla de Puerto Rico en registromedicopr.com (30,000+ fichas sobre el registro federal NPPES, con NPI). Devuelve especialidad, pueblo, teléfono, NPI, el enlace permanente a su ficha, y cuando la oficina lo confirmó: si acepta pacientes nuevos, qué planes médicos acepta y quién lo confirmó. Cada ficha trae nivel_verificacion: \"persona\" (la oficina o Angel lo confirmó), \"fuente\" o \"registro\" (solo copiado del registro federal). Úsalo para \"¿hay un cardiólogo en Mayagüez que acepte MMM?\", \"¿esta farmacia sigue abierta?\", \"¿el Dr. X sigue ejerciendo en Cabo Rojo?\".",
          "inputSchema": {
            "properties": {
              "especialidad": {
                "description": "Especialidad o tipo (ej: \"cardiólogo\", \"farmacia\", \"pediatra\", \"laboratorio\"). Se busca en español.",
                "type": "string"
              },
              "limite": {
                "description": "Máximo de resultados (1-25, default 8)",
                "type": "number"
              },
              "municipio": {
                "description": "Municipio de PR (ej: \"Cabo Rojo\", \"Mayagüez\"). Vacío = toda la isla.",
                "type": "string"
              },
              "nombre": {
                "description": "Nombre del proveedor, o su NPI de 10 dígitos",
                "type": "string"
              },
              "solo_confirmados": {
                "description": "true = solo fichas que una persona confirmó (acepta pacientes / planes). Default false.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
