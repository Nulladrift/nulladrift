      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "triple-trigger",
        "title": "Triple-Trigger",
        "version": "2.0.0",
        "description": "Triple-Trigger by ScriptMasterLabs: SPEC v2 triple-trigger scans of one ticker on live Schwab data (T1 liquidity sweep + Fibonacci reclaim, T2 VWAP reclaim + RVOL thrust, T3 same-side unusual options premium vs the ticker's own 20-session baseline), $0.05 USDC on Base via x402."
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "triple_trigger_scan",
          "title": "Triple-Trigger Scan",
          "description": "Run one SML Triple-Trigger SPEC v2 scan of a ticker on live Schwab data and get a VERDICT (all three triggers true, with entry/stop/target/R plan), WATCH (two of three), or NONE result, with market/volatility/cap tags and data timestamps. Use it to check whether a ticker currently shows a liquidity sweep + Fibonacci reclaim (T1), a VWAP reclaim with relative-volume thrust (T2), and same-side unusual options premium vs the ticker's own 20-session baseline (T3). Missing data is reported as no_data, never estimated. $0.05 USDC on Base per accepted scan. First 3 VERDICT scans free with a trial key (pass trial_key; get one via POST /triple-trigger/trial); WATCH/NONE never consume credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "mode": {
                "default": "intraday",
                "description": "Scan mode: intraday (default) or swing",
                "enum": ["intraday", "swing"],
                "type": "string"
              },
              "ticker": {
                "description": "US-listed ticker symbol, e.g. NVDA",
                "type": "string"
              },
              "trial_key": {
                "description": "Optional free-trial key (tt_trial_...). When valid with credits left the scan runs unpaid; one credit is consumed only when the result is a VERDICT.",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "outputSchema": {
            "description": "SPEC v2 result JSON: {ticker, mode, side, verdict, triggers:{t1,t2,t3}, plan, tags:{market,volatility,cap}, data_ts, scan_ts, source:\"schwab\"} plus filter/zone detail and trace_ids.",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5f4bb1bcc565eba5e50fb2af9ada6194d1b25d8f36e3589fbae7448b16667b3f"
        }
      ],
      "digest": "sha256:bc1b076e7dfafb8dc84e732975c62650497d810c3b530b6bff8dc1c3125db1a7"
    }
  }
