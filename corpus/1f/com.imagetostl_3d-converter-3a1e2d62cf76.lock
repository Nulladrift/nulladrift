{
  "lockfileVersion": 2,
  "subjects": {
    "com.imagetostl/3d-converter": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.imagetostl.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.imagetostl/3d-converter",
        "title": "3D Model and Image Conversion by imagetostl.com",
        "version": "1.0.0"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Converts 3D model files and image files. Image conversions are image to image; converting an image to a 3D model is not available. STEP (.step and .stp) is an input and is not an output. SKP, IGES, 3DM, DXF, other CAD, documents, video, and ABC as an input are not available.",
      "tools": [
        {
          "name": "create_upload_link",
          "title": "Create upload link",
          "description": "Creates a single-use upload link for one file. The link expires after 10 minutes and accepts a file up to 50 MB. page_url opens the upload page. The file name is sent with the conversion so the download is named from it.",
          "inputSchema": {
            "properties": {
              "filename": {
                "description": "Original file name, for example model.stl or photo.png. The extension must match the format. The base name is used for the converted file.",
                "type": "string"
              },
              "from": {
                "description": "Input format, for example stl or png. Use step for a STEP or STP file. STEP is not an output. Image inputs convert only to image outputs.",
                "type": "string"
              },
              "language": {
                "default": null,
                "description": "Language the user is chatting in, for example de, pt-BR, or zh-TW. Used for the upload page.",
                "type": ["string", "null"]
              },
              "size_bytes": {
                "description": "File size in bytes. A file over 50 MB is rejected here. The upload itself can be any size up to 50 MB.",
                "type": "integer"
              }
            },
            "required": ["filename", "from", "size_bytes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create upload link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d88ef547abdb2f6d48a183fbade021941a56f1d86659b64dbc8a32b01937d3f0"
        },
        {
          "name": "delete_conversion",
          "title": "Delete conversion files",
          "description": "Deletes the conversion's files.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "description": "job_id from start_conversion.",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Delete conversion files"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9d14be29d95b041b26c4a35c1ad002c7533bdea001de2da4a91c34e8d376cfbc"
        },
        {
          "name": "get_conversion",
          "title": "Get conversion result",
          "description": "Returns the status of a conversion. When it is finished, download_url is the target file when the API offers that link, otherwise the default link. filename is the API's name for that file when the result includes one. output has the target format and, when the API sends a size, bytes. other_downloads lists the remaining zip, 7z, and default links. An image result omits triangles.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "description": "job_id from start_conversion.",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get conversion result"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d0321c90f24977c27126906f7f5c6d8f83383b72961716e78cfb70589d2e0a8e"
        },
        {
          "name": "list_formats",
          "title": "List formats",
          "description": "Lists the 3D model and image formats this connector converts, and which pairs are available. It converts 3D models, and images to images. It does not convert an image to a 3D model. formats gives each id a category of 3d or image. STEP (.step and .stp) is an input and is not an output. SKP, IGES, 3DM, DXF, other CAD, documents, video, and ABC as an input stay excluded. An uploaded file can be up to 50 MB. A file given as a URL can be up to 100 MB; the conversion API enforces that.",
          "inputSchema": {
            "properties": {
              "from": {
                "default": null,
                "description": "Optional input format. When set, pairs lists only that format's targets.",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List formats"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:cfc74da4101473b45438a67ceaa5fdabbb7e492241ae87e5b6a94a3c6541fbe6"
        },
        {
          "name": "start_conversion",
          "title": "Convert a file",
          "description": "Starts a 3D model conversion or an image-to-image conversion. It does not convert an image to a 3D model. The file comes from a public http or https URL, or from an uploaded file. The conversion API downloads the URL, up to 100 MB. Uploads are limited to 50 MB. A finished result includes output, and filename when the API names the file.",
          "inputSchema": {
            "properties": {
              "from": {
                "default": null,
                "description": "Input format. Inferred from the filename when omitted. Use step for a STEP or STP file. Image inputs convert only to image outputs.",
                "type": ["string", "null"]
              },
              "source_url": {
                "default": null,
                "description": "Public http or https URL of the file. At most 2,000 characters, with no username or password. The conversion API downloads it.",
                "type": ["string", "null"]
              },
              "to": {
                "description": "Output format, for example obj or png. STEP is not an output. An image output is only available from an image input.",
                "type": "string"
              },
              "upload_id": {
                "default": null,
                "description": "upload_id from create_upload_link, after the file has been uploaded.",
                "type": ["string", "null"]
              }
            },
            "required": ["to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Convert a file"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
