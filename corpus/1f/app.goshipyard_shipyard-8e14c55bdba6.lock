{
  "lockfileVersion": 2,
  "subjects": {
    "app.goshipyard/shipyard": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://goshipyard.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "shipyard",
        "title": "Shipyard",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Shipyard lists AI-built apps and finds threads where people ask about what an app does. Shipyard never posts for anyone: suggest replies, and let the person post them from their own account.",
      "tools": [
        {
          "name": "get_project",
          "description": "One listing by id, with its upvotes, reactions and screenshots.",
          "inputSchema": {
            "properties": {
              "project_id": {
                "type": "string"
              }
            },
            "required": ["project_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5ce08f6b57e4bbf8bce5fee80c1c2b12da10ed5b5052a5b072e5dfeef837c367"
        },
        {
          "name": "like_project",
          "description": "Upvote a listing.",
          "inputSchema": {
            "properties": {
              "project_id": {
                "type": "string"
              }
            },
            "required": ["project_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d5c8773ae2218c84b61da8736d3a3dbc4950d14dcc279865cec7a1a073838b46"
        },
        {
          "name": "list_opportunities",
          "description": "Your listing's board: threads where people ask about what the app does, best fit first, each with a suggested first reply that helps without naming the app. Post replies yourself, from your own account. Needs a subscribed workspace.",
          "inputSchema": {
            "properties": {
              "project_id": {
                "type": "string"
              },
              "view": {
                "enum": ["live", "posted", "dismissed"],
                "type": "string"
              }
            },
            "required": ["project_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9d1643996dd78f8d9e5f3558cba34677f4eebb8e338b20dfce31ff3d5c816cf2"
        },
        {
          "name": "list_projects",
          "description": "Browse apps listed on Shipyard, newest or most upvoted first.",
          "inputSchema": {
            "properties": {
              "category": {
                "enum": ["ai", "creative", "data", "design", "devtools", "games", "productivity", "social", "other"],
                "type": "string"
              },
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "type": "string"
              },
              "sort": {
                "enum": ["new", "top"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f24e8f26e187506a3458a15b82333702812bd6ec42e4b076dc69a825c1556781"
        },
        {
          "name": "mark_opportunity",
          "description": "Mark a board card posted (give reply_url, the link to your own reply, so Shipyard watches for replies to it), dismissed, or live again.",
          "inputSchema": {
            "properties": {
              "opportunity_id": {
                "type": "string"
              },
              "reply_url": {
                "type": "string"
              },
              "status": {
                "enum": ["posted", "dismissed", "live"],
                "type": "string"
              }
            },
            "required": ["opportunity_id", "status"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:960428ce7f91a910ff469701c626d34e22c7ba88db63bef9f7adc26270502616"
        },
        {
          "name": "my_projects",
          "description": "Listings in your workspaces, taken-down ones included.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1c47402c35b59d8e140001955d98f10207b3bca07123a5d098aaea537290ad96"
        },
        {
          "name": "ship_project",
          "description": "List an app on Shipyard. Its page is public at once. Give `handle` to start your workspace if you have none, or `workspace` if you are in more than one.",
          "inputSchema": {
            "properties": {
              "body": {
                "description": "A few paragraphs about it",
                "type": "string"
              },
              "category": {
                "enum": ["ai", "creative", "data", "design", "devtools", "games", "productivity", "social", "other"],
                "type": "string"
              },
              "handle": {
                "type": "string"
              },
              "pitch": {
                "description": "One line on what it does, up to 140 characters",
                "type": "string"
              },
              "repo_url": {
                "description": "Source repository, if public",
                "type": "string"
              },
              "title": {
                "description": "App name, up to 60 characters",
                "type": "string"
              },
              "url": {
                "description": "Where to try it (https)",
                "type": "string"
              },
              "workspace": {
                "type": "string"
              }
            },
            "required": ["category", "pitch", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:c0ca56519f180866ff07b754b5eb660d1f3de3597ea08fffd6f2658661664894"
        },
        {
          "name": "unlike_project",
          "description": "Take back an upvote.",
          "inputSchema": {
            "properties": {
              "project_id": {
                "type": "string"
              }
            },
            "required": ["project_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:20ee1d045fae43f060eaa011a50446f898f65bb3684fcc6342452596c74afb62"
        },
        {
          "name": "update_project",
          "description": "Change a listing's details. Only the fields you give change.",
          "inputSchema": {
            "properties": {
              "body": {
                "description": "A few paragraphs about it",
                "type": "string"
              },
              "category": {
                "enum": ["ai", "creative", "data", "design", "devtools", "games", "productivity", "social", "other"],
                "type": "string"
              },
              "pitch": {
                "description": "One line on what it does, up to 140 characters",
                "type": "string"
              },
              "project_id": {
                "type": "string"
              },
              "repo_url": {
                "description": "Source repository, if public",
                "type": "string"
              },
              "title": {
                "description": "App name, up to 60 characters",
                "type": "string"
              },
              "url": {
                "description": "Where to try it (https)",
                "type": "string"
              }
            },
            "required": ["project_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:ffe0d7f7b3cd068ffebf18ebb51bb65513641d0afad6c52b8f98998350079b08"
        }
      ],
      "digest": "sha256:f725d4cd3f869b7db79d881172d4a7308cd399faa0e718d3b3717c3c310c78da"
    }
  }
