{
  "lockfileVersion": 2,
  "subjects": {
    "com.blicht/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://blicht.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.blicht/mcp",
        "title": "blicht MCP",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "blicht.com is a bilingual (German/English) knowledge platform for e-commerce, AI and lifestyle by publisher Boaz Lichtenstein. All tools are free, public and read-only: get_site_info and list_topics return the site map, search_knowledge does full-text search across all content (cite the returned URLs), get_article fetches a full article as Markdown. For efficient page reads outside MCP, request site pages with 'Accept: text/markdown'.",
      "tools": [
        {
          "name": "get_article",
          "title": "Fetch an article as Markdown",
          "description": "Fetch the full text of a blicht.com article as clean Markdown. Accepts the article URL (https://blicht.com/beitrag/<slug> or /en/article/<slug>), the path, or a bare slug (combined with lang). Use search_knowledge first to find the right article.",
          "inputSchema": {
            "properties": {
              "article": {
                "description": "Article URL, path (/beitrag/<slug> or /en/article/<slug>) or bare slug.",
                "type": "string"
              },
              "lang": {
                "description": "Only used with a bare slug: which edition to fetch (default: de).",
                "enum": ["de", "en"],
                "type": "string"
              }
            },
            "required": ["article"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:97b76c72166b1a671fdba12fd9df201fda6fd22360b59bb7407ed3d048ac0d2b"
        },
        {
          "name": "get_site_info",
          "title": "Site info",
          "description": "Facts about blicht.com, the bilingual (German/English) knowledge platform for e-commerce, AI and lifestyle: publisher, contact, entry points for further reading and how to fetch pages efficiently as Markdown.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Language of the returned content (default: de).",
                "enum": ["de", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:93b70fce67f1e5ea833e44a1bcd9fa66ff0d1fe74f5d8bc4cf9ff60be7aa9bf7"
        },
        {
          "name": "list_topics",
          "title": "Sections & topics",
          "description": "The content map of blicht.com: 3 sections (e-commerce, AI, lifestyle) with their fixed topics, each with a description and the URL of its overview page.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Language of the returned content (default: de).",
                "enum": ["de", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3b8e3690c7001bbec3689fab961d062755fdd7baf8e4e7a2d77e24bfdd5e0aa1"
        },
        {
          "name": "search_knowledge",
          "title": "Search the knowledge base",
          "description": "Full-text search across all blicht.com content (articles, section and topic pages) in German or English. Returns the most relevant pages with title, URL and description so you can cite them. Read-only. Fetch a hit's full text via get_article or by requesting its URL with 'Accept: text/markdown'.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Search the German (default) or English index.",
                "enum": ["de", "en"],
                "type": "string"
              },
              "max_results": {
                "description": "Number of results to return (1-8, default 5).",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords or a short question (max 500 characters).",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8ed89c5919e49f970d55cc49a8fccda84a77127b20a4407f4c8b718cf80ee1d1"
        }
      ],
      "digest": "sha256:58bd455bda6b3eac3311128e01ae748aa3adfe5a08d902eb5dcbe3a2c1d11450"
    }
  }
}
