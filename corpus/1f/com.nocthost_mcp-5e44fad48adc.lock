        {
          "name": "create_load_balancer",
          "title": "Create load balancer",
          "description": "Creates a managed load balancer in a city in front of your servers there, $0.0247/hour ($18.00/month), billed per hour from the balance until delete_load_balancer. Spends money: tell the user the price first. Backends are ACTIVE vultr or hetzner servers in that city, all on one cloud. Refused with the price if it is above max_hourly_usd (default $1).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "algorithm": {
                "enum": ["roundrobin", "leastconn"],
                "type": "string"
              },
              "backend_server_ids": {
                "description": "Server ids to balance across; can be added later.",
                "items": {
                  "maxLength": 64,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "forwarding_rules": {
                "description": "E.g. [{\"frontend_protocol\":\"HTTP\",\"frontend_port\":80,\"backend_protocol\":\"HTTP\",\"backend_port\":80}].",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "backend_port": {
                      "maximum": 65535,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "backend_protocol": {
                      "$ref": "#/properties/forwarding_rules/items/properties/frontend_protocol"
                    },
                    "frontend_port": {
                      "maximum": 65535,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "frontend_protocol": {
                      "enum": ["HTTP", "HTTPS", "TCP"],
                      "type": "string"
                    }
                  },
                  "required": ["backend_port", "backend_protocol", "frontend_port", "frontend_protocol"],
                  "type": "object"
                },
                "maxItems": 15,
                "minItems": 1,
                "type": "array"
              },
              "label": {
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "max_hourly_usd": {
                "exclusiveMinimum": 0,
                "maximum": 10000,
                "type": "number"
              },
              "region": {
                "description": "City id or name, e.g. \"fra\".",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["forwarding_rules", "label", "region"],
            "type": "object"
          },
