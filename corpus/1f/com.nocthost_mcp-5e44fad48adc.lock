      "instructions": "NoctHost deploys cloud servers on Vultr, DigitalOcean, Hetzner and Linode, plus NVIDIA GPU servers on OVHcloud, from one prepaid USD balance billed by the hour. The balance is topped up with crypto or a card.\nTypical flow: get_account (balance), recommend_plan or list_options (sizes, prices, cities), quote (exact price and whether the balance covers it), create_server (returns the IP and SSH command once ACTIVE), destroy_server when the work is done; billing stops in the hour the server is destroyed.\nBefore anything that spends money (create_server, restore_backup, create_load_balancer), tell the user the hourly and monthly price and get an OK; pass that total as max_hourly_usd. Defaults per call: at most 3 servers and $1/hour.\nAsk for an SSH public key and pass it as ssh_public_key. Tools that set a root password without a key (create_server, reinstall_server, change_ip, restore_backup, reset_root_password) return it once, and it stays in the chat history; say so to the user.\nDestructive tools (destroy_server, reinstall_server, change_ip, delete_backup, delete_load_balancer) need confirm: true and the exact label; call them first without confirm to show the user what would happen.\nServer management: rename_server, set_rdns, get_bandwidth, console_link, get_windows_password, get_app_password; one-click apps via list_apps and the app parameter of create_server; backups via list_backups, create_backup, restore_backup.\nMoney: billing_history, list_deposits, list_invoices, request_server_limit. To top up, call list_payment_methods, agree the amount and method with the user, then top_up; it returns a payment link or address and nothing is charged until the user pays. top_up needs the user's own confirmation of the sanctions statement it shows. If it asks for the user's country, send them to the dashboard; never pick a country for them.\nSupport: support_read shows the account's own support chat; support_send writes to the NoctHost team on the user's behalf, marked as sent by an AI assistant, at most 5 messages per hour. Send only what the user wants sent, in one message with server ids and what was tried.\nWhen something cannot be done the way it was asked, the tools say what can be done instead; pass that on.",
