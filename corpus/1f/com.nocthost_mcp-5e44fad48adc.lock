        {
          "name": "create_server",
          "title": "Create server",
          "description": "Creates 1 to 10 servers (default limit 3 per call) and waits up to about two minutes for ACTIVE, then returns ids, IPv4 and the SSH command. Spends money: billed per hour from the balance until destroy_server. Show the user the price from quote first. Refused with the quote if the total hourly price is above max_hourly_usd (default $1); more than 3 servers also need an explicit max_hourly_usd. Pass ssh_public_key whenever possible; without it a random root password is generated and returned once, and it stays in the chat history. app installs a one-click app (Docker, WireGuard, WordPress and others from list_apps) on Ubuntu 24.04 instead of a plain OS.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "app": {
                "description": "One-click app id from list_apps, e.g. \"docker\" or \"wireguard\". Replaces os; the app installs on first boot.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "count": {
                "description": "How many identical servers, default 1.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "label": {
                "description": "Server name: Latin letters, digits, dot, dash, underscore. With count > 1 it gets -1, -2, ...",
                "maxLength": 61,
                "type": "string"
              },
              "max_hourly_usd": {
                "description": "Upper bound for the total hourly price of this call, default 1.",
                "exclusiveMinimum": 0,
                "maximum": 10000,
                "type": "number"
              },
              "os": {
                "description": "OS id or name, default \"ubuntu-24.04\". Ignored for GPU plans.",
                "maxLength": 64,
                "type": "string"
              },
              "plan": {
                "description": "Plan id from list_options, e.g. \"vc2-1c-1gb\", or a plan name like \"Micro\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "provider": {
                "description": "Cloud; default is the cheapest that deploys this plan in this city.",
                "enum": ["vultr", "digitalocean", "hetzner", "linode", "ovh"],
                "type": "string"
              },
              "region": {
                "description": "City id or name, e.g. \"fra\" or \"Frankfurt\".",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "ssh_public_key": {
                "description": "One public key line (ssh-ed25519 ..., ssh-rsa ...), installed for root.",
                "maxLength": 4096,
                "type": "string"
              }
            },
            "required": ["plan", "region"],
            "type": "object"
          },
