          "description": "銘柄コードで株主優待を1件取得する。sections で返す情報を選ぶ(不要なものは返さない)。\n\n- basic (既定): 銘柄の基本情報。優待内容・権利確定日(vestingDates)・\n  空クロス日(karaDates)・信用区分(lendingType)・制度信用の規制状態(systemLendingStatus:\n  none/warn=注意喚起/prohibited=売禁)・増担保の最高料率倍率(marginRateMultiplier)・\n  長期条件・難易度・株価・必要資金・実質利回り(actualYield)・\n  現時点の一般信用残数(normalLendingStatus)・details(候補と長期保有条件)。\n- negativeInterests: 逆日歩(制度信用売りで発生しうる、金額が事前に確定しない追加費用)の履歴。\n  prev(前回権利付最終日の1件)/ worst10(過去ワースト10、逆日歩/日 の降順)/ latest(直近10日)。\n  negativeInterestPerDiem / highestNegativeInterestPerDiem は「円/株」の文字列で lendingDays 日分。\n  1日あたりは negativeInterestPerDiem / lendingDays。balancePrice はその日の建値。\n  逆日歩は過去実績であり将来を保証・予測するものではない点をユーザーに必ず伝えること。\n- remainingHistories: 一般信用売りの在庫ステータスの推移。prev(前回権利前3ヶ月)/ latest(直近1ヶ月)。\n\nnegativeInterests / remainingHistories は銘柄ごとに個別管理された詳細データが必要で、無い銘柄では notes に理由が入る。\nbasic のみ(既定)なら詳細データは取得しないため軽量。",
