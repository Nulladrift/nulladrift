      "instructions": "yutai-mcp は日本株の株主優待クロス取引を支援するツール群です。\n\n- search_benefits: 優待の一覧検索。keyword で優待内容(「コストコ」「株主優待券」等)も検索でき、\n  権利確定月(vestingDate) / 空クロス日(karaDate) / 優待種別(benefitTypes) / 優待評価額 /\n  必要資金 / 実質利回り / 難易度(rarity) / 信用取引区分(lendingType) /\n  制度信用の規制(sellProhibited=売禁, sellCaution=注意喚起, sellRestricted=いずれか) /\n  増担保の最高料率倍率(minMarginRateMultiplier/maxMarginRateMultiplier) / 前回逆日歩 /\n  一般信用売りの可否・残数(証券会社別) などで絞り込む。sortBy で並べ替え:\n  actualYield=額面利回り(手数料考慮なし)、netYield=手取り利回り(優待評価額−今実際にできる最安の\n  一般信用クロスコスト。証券会社プラン・約定日は引数で指定可)、requiredFunds=必要資金、\n  minValue=評価額、prevLendingInterest=前回逆日歩、nextVestingDate=権利確定日、update=更新日。\n  「○月のおすすめ優待」「手取り利回りトップN」「予算内で取れる優待」「今クロスできる銘柄」等はこれで答える。\n- get_benefit: 個別優待を1件取得。sections で basic(基本情報)/ negativeInterests(逆日歩履歴)/\n  remainingHistories(一般信用在庫推移)を選ぶ。既定は basic のみ。\n- estimate_cross_fee: 1銘柄について証券会社×売り方(一般信用 短期/無期限・制度信用)別のクロス手数料を\n  内訳付きで試算。「今 ○○ をクロスしたらいくら?」に答える。\n- predict_gyakuhibu: 次回優待権利付き最終日の逆日歩を1株あたりの円額で推定する。\n  codeを指定。予想売り超過株数shortageSharesは省略でき、省略時は前回権利日の超過株数を使う。日付と品貸日数は自動計算する。\n  品貸日数分の合計と1日換算の円/株を返す。\n- calc_max_gyakuhibu: 貸借値段と条件から最高逆日歩（上限額）を計算。株式等とETF等の別表に対応。\n  price以外を省略すると、株式・100株単位・権利付き最終日・規制なし・1日分。通常時はrightsPeriod=\"none\"を指定。\n  isRegulatedで注意喚起・申込制限・申込停止の倍率適用中を、temporaryMultiplierで臨時措置の倍率（4または10）を指定する。\n- calc_dates: 権利付最終日・権利落ち日・一般信用「短期」の注文解禁日など日付計算。",
      "tools": [
        {
          "name": "calc_dates",
          "description": "権利日を入力すると、クロス取引に必要な各種日付・日数を計算して返す。\n\n【入力 vestingDate】\n・\"2026-09-30\" のような具体的な日付(その年で固定)\n・\"9月末\" / \"09\" / \"9\"（月のみ）→ その月末で、次に到来する回\n・\"9月20日\" / \"09-20\" / \"9/20\" / \"0920\" → その日で、次に到来する回\n\n【tradeDate】省略時は「今注文したとき」の約定日(JST 15:30より前なら当日、以降なら翌営業日、\n土日祝はさらに繰り上げ)。「今から」系の日数(interestDays 等)はこの日を起点にする。\n\n【返す主なフィールド】\n・vestingDate: 権利確定日(基準日)  ・lastDayWithRights: 権利付最終日  ・exRightsDate: 権利落ち日\n・interestDays: 今建てた場合の信用金利/貸株料の対象日数(決済が間に合わなければ -1)\n・negativeInterestDays: 逆日歩の対象日数(権利付最終日が金曜だと土日を挟んで増える)\n・managementFeeMonths: 信用売り建玉の事務管理費がかかる月数\n・crossable: 今から建てて権利落ち日までに決済が間に合うか\n・shortSellingLiberation: 一般信用「短期」つなぎ売りの解禁スケジュール。\n  - sbiGmo: SBI・GMOは同一ルール(営業日ベース、「権利落ち日を含めて15営業日前」)。\n    liberationDate=売建可能日、orderAcceptedFrom=その前営業日(19:00頃から新規売り注文を受付、翌営業日に先着約定)。\n  - rakuten: 実効権利確定日の13暦日前を求め、休場日なら翌営業日に調整して最早売建日を計算。orderAcceptedFrom=その前営業日(19時頃から受付)。実際の取扱・在庫・個別期日は別途確認。\n  - auカブコム・SMBC日興は短期一般信用の取扱いが無いため対象外(詳細は note 参照)。\n・prevYear: 前年の同一権利の基準日(get_benefit の negativeInterests / remainingHistories の prev データと突き合わせるのに使う)\n・businessDaysUntilLastDayWithRights / calendarDaysUntilLastDayWithRights: 権利付最終日までの残り\n\n日付は \"YYYY-MM-DD\" 形式の文字列で返す。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "tradeDate": {
                "description": "約定日 (YYYY-MM-DD)。省略時は「今」から自動算出",
                "type": "string"
              },
              "vestingDate": {
                "description": "権利日。例: \"9月末\" / \"9月20日\" / \"2026-09-30\"",
                "type": "string"
              }
            },
            "required": ["vestingDate"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "businessDaysUntilLastDayWithRights": {
                "description": "tradeDateから権利付最終日までの営業日数(tradeDate自身は除く)",
                "type": "number"
              },
              "calendarDaysUntilLastDayWithRights": {
                "description": "tradeDateから権利付最終日までの暦日数",
                "type": "number"
              },
              "canWeekendOrder": {
                "description": "今(tradeDate起点)から土日をまたぐ注文ができるか",
                "type": "boolean"
              },
              "crossable": {
                "description": "interestDays !== -1。今から建てて権利落ち日までに決済が間に合うか",
                "type": "boolean"
              },
              "deliveredDate": {
                "description": "tradeDateの現物/信用建て分の受渡日",
                "type": "string"
              },
              "exRightsDate": {
                "description": "権利落ち日。クロスの決済(現渡し等)を入れる日",
                "type": "string"
              },
              "input": {
                "description": "入力された権利日指定(正規化前の生テキスト)",
                "type": "string"
              },
              "interestDays": {
                "description": "今建てた場合の信用金利/貸株料の対象日数。決済が間に合わなければ-1",
                "type": "number"
              },
              "lastDayWithRights": {
                "description": "権利付最終日。この日までに現物を約定していれば権利が取れる",
                "type": "string"
              },
              "managementFeeMonths": {
                "description": "信用売り建玉の事務管理費がかかる月数(今から権利まで)",
                "type": "number"
              },
              "negativeInterestDays": {
                "description": "逆日歩(品貸料)の対象日数。権利付最終日が金曜だと土日を挟んで増える",
                "type": "number"
              },
              "prevYear": {
                "additionalProperties": false,
                "description": "前年の同一権利。get_benefit の negativeInterests/remainingHistories の prev データの基準日と突き合わせるのに使う",
                "properties": {
                  "lastDayWithRights": {
                    "type": "string"
                  },
                  "vestingDate": {
                    "type": "string"
                  }
                },
                "required": ["lastDayWithRights", "vestingDate"],
                "type": "object"
              },
              "shortSellingLiberation": {
                "additionalProperties": false,
                "description": "一般信用「短期」つなぎ売りの解禁スケジュール",
                "properties": {
                  "note": {
                    "description": "auカブコム・SMBC日興は短期一般信用の取扱いが無いため対象外、等の補足",
                    "type": "string"
                  },
                  "rakuten": {
                    "additionalProperties": false,
                    "properties": {
                      "orderAcceptedFrom": {
                        "description": "ルール上の最早売建日の前営業日。19時頃の受付目安、取扱・在庫は別途確認",
                        "type": "string"
                      }
                    },
                    "required": ["orderAcceptedFrom"],
                    "type": "object"
                  },
                  "sbiGmo": {
                    "additionalProperties": false,
                    "description": "SBI・GMOは同一ルール(営業日ベース、「権利落ち日を含めて15営業日前」)",
                    "properties": {
                      "liberationDate": {
                        "description": "売建可能日(この日ザラ場から在庫が出る)",
                        "type": "string"
                      },
                      "orderAcceptedFrom": {
                        "description": "その前営業日。19:00頃から新規売り注文を受付(翌営業日に先着約定)",
                        "type": "string"
                      }
                    },
                    "required": ["liberationDate", "orderAcceptedFrom"],
                    "type": "object"
                  }
                },
                "required": ["note", "rakuten", "sbiGmo"],
                "type": "object"
              },
              "tradeDate": {
                "description": "起点にした約定日",
                "type": "string"
              },
              "vestingDate": {
                "description": "権利確定日(基準日)",
                "type": "string"
              }
            },
            "required": ["businessDaysUntilLastDayWithRights", "calendarDaysUntilLastDayWithRights", "canWeekendOrder", "crossable", "deliveredDate", "exRightsDate", "input", "interestDays", "lastDayWithRights", "managementFeeMonths", "negativeInterestDays", "prevYear", "shortSellingLiberation", "tradeDate", "vestingDate"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b438a08956c346f4b1975067dc8ec8e79dd175d0d1bff1a754c4c5cc18c77fc8"
        },
        {
          "name": "calc_max_gyakuhibu",
          "description": "貸借値段と適用条件から最高逆日歩（上限額）を計算する。株式等とETF等は別表を使用する。株価だけを入力した場合は株式・100株単位・権利付き最終日・規制なし・1日分として計算する。通常時の日額が必要な場合はrightsPeriod=\"none\"を指定する。フラグは計算対象日に倍率が適用される状態を指定する。貸借値段の代わりに市場株価を入力した場合は試算。返す金額は1株（ETF等は1口）あたり。実際に発生する逆日歩の予測値ではない。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "isRegulated": {
                "description": "注意喚起・申込制限・申込停止のいずれかの倍率適用期間中。省略時false",
                "type": "boolean"
              },
              "lendingDays": {
                "description": "品貸日数。省略時1。calc_datesのnegativeInterestDaysを指定できる",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "price": {
                "description": "貸借値段（円）。市場株価を使う場合は試算",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "rateTable": {
                "description": "stock:株式等（REIT等を含む）、etf:ETF等。省略時stock",
                "enum": ["stock", "etf"],
                "type": "string"
              },
              "rightsPeriod": {
                "description": "none:権利日による倍率なし、beforeExRights:権利落日6〜2営業日前、lastCumRights:権利落日の前営業日。省略時lastCumRights（4倍）",
                "enum": ["none", "beforeExRights", "lastCumRights"],
                "type": "string"
              },
              "temporaryMultiplier": {
                "description": "臨時措置で指定された通常時基準に対する倍率。指定可能な値は4または10。他の倍率とは掛け合わせない",
                "enum": [4, 10],
                "type": "number"
              },
              "tradingUnit": {
                "description": "取引所の売買単位。注文株数とは別。stockは省略時100、etfは指定必須",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              }
            },
            "required": ["price"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "baseDailyYenPerShare": {
                "description": "通常時の最高料率（倍率適用前、円／株／日。ETF等は円／口／日）",
                "type": "number"
              },
              "dailyYenPerShare": {
                "description": "適用後の最高料率（円／株／日。ETF等は円／口／日）",
                "type": "number"
              },
              "multiplier": {
                "description": "適用倍率",
                "type": "number"
              },
              "totalYenPerShare": {
                "description": "品貸日数分の最高料率（円／株。ETF等は円／口）",
                "type": "number"
              }
            },
            "required": ["baseDailyYenPerShare", "dailyYenPerShare", "multiplier", "totalYenPerShare"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
