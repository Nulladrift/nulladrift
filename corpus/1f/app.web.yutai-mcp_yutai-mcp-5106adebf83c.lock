        },
        {
          "name": "estimate_cross_fee",
          "description": "株主優待クロス取引(現物買い+信用売りを同時に建てて優待だけ受け取る手法)の手数料を試算する。\n\n【対象範囲】\n・同一証券会社内で「買い」と「売り」の両方を建てるケースのみを計算する。証券会社をまたいだ\n  組み合わせ(例: 楽天で買ってカブコムで売る)は計算しない。\n・buyMethod: 'spot'=現物買い(sbi/gmo/rakuten/kabucom) / 'system_margin_then_receipt'=制度信用買い+現引き(smbcのみ)\n・sellMethod: 'general_short'=一般信用(短期) / 'general_long'=一般信用(無期限・長期) / 'system'=制度信用\n  ユーザーへの回答時はこれらの値をそのまま出さず、日本語(現物買い、制度信用買い+現引き、短期一般信用、\n  無期限一般信用、制度信用)に訳して説明すること。\n\n【sellMethod=systemの行について】\n逆日歩(金額が事前に確定しない追加費用)が別途発生しうる。total はあくまで「逆日歩が0だった場合の金額」\nであり、確定額ではないことを必ず説明すること。前回の逆日歩率が分かる場合は note に参考値として付くが、\n将来の逆日歩を予測するものではない。\n\n【note フィールドについて】\n一般信用の売り建てが現在できない・残数が無い証券会社も除外せず参考値として計算し、その旨を note に\n記載する。note が無い行は現時点で実際にクロス可能。\n\n【日付フィールドについて】\nvestingDate=権利確定日(基準日)、lastDayWithRights=権利付最終日、exRightsDate=権利落ち日。\nユーザーが「いつまでに買えばいいか」を知りたいときは lastDayWithRights を案内すること\n(vestingDate は権利が確定する日そのものであり、買い付けの締切ではない)。\n\n【assumptions フィールドについて】\n実際に使用した証券会社プラン設定(ゼロ革命の有無、楽天のコース、カブコムの大口優遇ランク等)を毎回\nそのまま返す。呼び出し側のAIは回答時に必ずこの内容(特にユーザーによって異なりうる設定)を明示し、\n実際の契約プランと違う場合は指定し直せることを案内すること。\n例:「楽天は\"ゼロコース\"、カブコムは大口優遇なしを前提に計算しています。異なるプランをご利用でしたら教えてください」",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "銘柄コード。例: \"7476\"",
                "type": "string"
              },
              "date": {
                "description": "約定日 (YYYY-MM-DD)。省略時は「今注文したとき」の約定日を自動算出する(JST 15:30より前なら当日、以降なら翌営業日。土日祝ならさらに翌営業日まで繰り上げる)",
                "type": "string"
              },
              "gmoVip": {
                "description": "GMO VIPプラン。既定false",
                "type": "boolean"
              },
              "kabucomLargeLot": {
                "description": "カブコム大口優遇ランク。既定\"none\"",
                "enum": ["crown", "diamond", "sapphire", "platinum", "gold", "silver", "none"],
                "type": "string"
              },
              "kabucomSor": {
                "description": "カブコムSOR(スマート・オーダー・ルーティング)。既定false",
                "type": "boolean"
              },
              "price": {
                "description": "実勢株価を上書きする場合に指定。省略時は取得済みの概算株価を使う",
                "type": "number"
              },
              "rakutenCourse": {
                "description": "楽天のコース。既定\"zero\"(ゼロコース)",
                "enum": ["zero", "chowari"],
                "type": "string"
              },
              "rakutenPreferentialRate": {
                "description": "楽天優遇金利適用。既定false",
                "type": "boolean"
              },
              "rakutenVip": {
                "description": "楽天大口優遇。既定false",
                "type": "boolean"
              },
              "sbiVip": {
                "description": "SBI大口優遇(建玉5億円以上)。既定false",
                "type": "boolean"
              },
              "sbiZeroRevolution": {
                "description": "SBIゼロ革命(電子交付設定)。既定true",
                "type": "boolean"
              },
              "units": {
                "description": "クロスする株数。省略時は minRequiredUnits(優待に必要な最小株数)を使う",
                "type": "number"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "assumptions": {
                "additionalProperties": false,
                "description": "実際に使用した証券会社プラン設定",
                "properties": {
                  "gmoVip": {
                    "description": "GMO VIPプランの前提",
                    "type": "boolean"
                  },
                  "kabucomLargeLot": {
                    "description": "カブコム大口優遇ランクの前提",
                    "enum": ["crown", "diamond", "sapphire", "platinum", "gold", "silver", "none"],
                    "type": "string"
                  },
                  "kabucomSor": {
                    "description": "カブコムSORの前提",
                    "type": "boolean"
                  },
                  "rakutenCourse": {
                    "description": "楽天のコースの前提",
                    "enum": ["zero", "chowari"],
                    "type": "string"
                  },
                  "rakutenPreferentialRate": {
                    "description": "楽天優遇金利適用の前提",
                    "type": "boolean"
                  },
                  "rakutenVip": {
                    "description": "楽天大口優遇の前提",
                    "type": "boolean"
                  },
                  "sbiVip": {
                    "description": "SBI大口優遇の前提",
                    "type": "boolean"
                  },
                  "sbiZeroRevolution": {
                    "description": "SBIゼロ革命(電子交付設定)の前提",
                    "type": "boolean"
                  }
                },
                "required": ["gmoVip", "kabucomLargeLot", "kabucomSor", "rakutenCourse", "rakutenPreferentialRate", "rakutenVip", "sbiVip", "sbiZeroRevolution"],
                "type": "object"
              },
              "code": {
                "type": "string"
              },
              "crossUnit": {
                "description": "クロスする株数",
                "type": "number"
              },
              "exRightsDate": {
                "description": "権利落ち日。クロスの決済(現渡し等)を入れる日",
                "type": "string"
              },
