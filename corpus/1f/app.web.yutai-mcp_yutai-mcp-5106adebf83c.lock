              "canNormalSelling_any": {
                "description": "いずれかの証券会社で条件を満たす銘柄を返す (OR検索)。「どこかで一般信用売りができる銘柄」を探すときに使う。個別の canNormalSelling_* と併用すると AND になる。enableSelling=売り可, enableLongSelling=長期売りのみ",
                "enum": ["enableSelling", "enableLongSelling", "notEnableSelling"],
                "type": "string"
