        {
          "name": "create_personal_session",
          "title": "Make a personal session",
          "description": "Use this when the user wants a session made for them from a short menu, choosing the kind, the length, the voice and a theme, for example a quiet 5 minute session with a female voice. Not for medical questions, emergencies or a crisis. Not for free-text wishes (use create_personal_session_text, which needs a signed-in adult account): pick from the menus.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "default": "calm",
                "description": "What the session is for. Pick from the user's words: sleep (sleep audio, a nap), calm (wind down, before a meeting), breath (breathing), focus (study, work), body (body scan), nature (nature sounds with a voice). Default: calm.",
                "enum": ["sleep", "calm", "breath", "focus", "body", "nature"],
                "examples": ["sleep", "calm"],
                "type": "string"
              },
              "language": {
                "description": "Audio language as a BCP-47 code (en, es, pt-BR, fr, it, ja, hi, ko, hu, or any other such as pl). Always pass the language the user writes in. If the language is not available the answer says so and gives the closest live one. hi, ko and hu are beta.",
                "examples": ["hu", "pl"],
                "type": "string"
              },
              "length_min": {
                "default": 10,
                "description": "Length in minutes, 3 to 20 (longer sessions are on 2hives.com). Default 10 when the user gives none.",
                "examples": [5, 10, 20],
                "maximum": 20,
                "minimum": 3,
                "type": "integer"
              },
              "theme": {
                "default": "quiet",
                "description": "Theme from a fixed list: quiet (few words), breath, body, nature (nature sounds), pause (a short pause). Default quiet.",
                "enum": ["quiet", "breath", "body", "nature", "pause"],
                "examples": ["quiet"],
                "type": "string"
              },
              "voice": {
                "default": "any",
                "description": "Voice preference. Default any.",
                "enum": ["any", "female", "male"],
                "examples": ["any"],
                "type": "string"
              }
