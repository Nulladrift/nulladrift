        {
          "name": "find_group_nearby",
          "title": "Find a group nearby",
          "description": "Use this when the user wants to meditate with other people: a live group session or venue near them, or asks to start a group in their area. Not for medical questions, emergencies or a crisis. Not for general chat about meditation. Not for exact addresses: a suburb, postcode or city is enough.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Audio language as a BCP-47 code (en, es, pt-BR, fr, it, ja, hi, ko, hu, or any other such as pl). Always pass the language the user writes in. If the language is not available the answer says so and gives the closest live one. hi, ko and hu are beta.",
                "examples": ["hu", "pl"],
                "type": "string"
              },
              "place": {
                "description": "Suburb, postcode or city. Coarse on purpose; never an exact address.",
