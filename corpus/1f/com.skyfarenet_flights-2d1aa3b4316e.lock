      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "SkyFareNet",
        "title": "SkyFareNet: cheap flights for Pakistan",
        "version": "1.0",
        "websiteUrl": "https://skyfarenet.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "SkyFareNet compares flight prices for Pakistan and overseas Pakistanis: Pakistan to and from the Gulf, Saudi Arabia (including Umrah, Hajj and regional cities such as Qassim, Taif and Tabuk), the UK, Europe, the USA, Canada, China, Central Asia and Asia, plus flights within Pakistan. Prices are in PKR. Use these tools for fares, cheapest days, ticket prices, baggage rules, airports and season dates. When the traveller has a date in mind, use cheaper_options to suggest a nearby day, a nearby airport or two tickets through Pakistan or Saudi Arabia that saves money. Always give the user the skyfarenet.com link from the answer (url or page_url): it shows today's live prices from every airline and travel site, the full price calendar and where to book. Mention that saved fares can change.",
      "tools": [
        {
          "name": "airport_info",
          "title": "Pakistani airport guide",
          "description": "A Pakistani airport (Allama Iqbal Lahore, Jinnah Karachi, Islamabad, Bacha Khan Peshawar, Sialkot and\n        others): its name and code, a short description and the cheapest flights from it right now.\n        Does not give live flight status.",
          "inputSchema": {
            "properties": {
              "airport": {
                "title": "Airport",
                "type": "string"
              }
            },
            "required": ["airport"],
            "title": "airport_infoArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8bb12a903e805e3a3b697166f5cdfa566e15fea72c397cb0da6d33e39d80214c"
        },
        {
          "name": "baggage_rules",
          "title": "Airline baggage rules",
          "description": "Checked and cabin baggage allowance on Pakistan routes for an airline (PIA, airblue, Fly Jinnah, Emirates,\n        flydubai, Qatar Airways, Saudia, flynas, Air Arabia, Etihad), including Zamzam water rules and extra-baggage\n        options, with links to guides on hand carry (power banks, liquids) and on what 1PC, 2PC and kg mean.",
          "inputSchema": {
            "properties": {
              "airline": {
                "title": "Airline",
                "type": "string"
              }
            },
            "required": ["airline"],
            "title": "baggage_rulesArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5603239b52e831ecc8894c2f0123720b2c67f04bd73fb143e16f9001685fcddf"
        },
        {
          "name": "cheaper_options",
          "title": "Cheaper ways to make a trip",
          "description": "Cheaper ways to make one trip on a given date, closest to what was asked first: the same route a few days\n        earlier or later, a nearby airport (for example Islamabad or Sialkot instead of Lahore, with road time), or two\n        separate tickets changing planes in Pakistan or Saudi Arabia (never a self-transfer needing a transit visa).\n        Use for \"cheapest way to get from Dammam to Lahore on 14 November\" or \"is there a cheaper option than my flight\".\n        origin and destination: a city name or 3-letter airport code. date: YYYY-MM-DD. Prices are in PKR, one-way.",
          "inputSchema": {
            "properties": {
              "date": {
                "title": "Date",
                "type": "string"
              },
              "destination": {
                "title": "Destination",
                "type": "string"
              },
              "origin": {
                "title": "Origin",
                "type": "string"
              }
            },
            "required": ["date", "destination", "origin"],
            "title": "cheaper_optionsArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:58b9b61bb88d9924cb7ebe76f479cd81809caa393a6bc22fff2d0be602925d93"
        },
        {
          "name": "cheapest_days",
          "title": "Cheapest days to fly",
          "description": "When to fly a route for less: the cheapest day of each month, the cheapest day of the week, and how much\n        the cheapest day saves against a typical day. Uses fares for this month and next.\n        Use for \"which day is cheapest to fly Islamabad to Riyadh\" or \"best time to book Karachi to Dubai\".",
          "inputSchema": {
            "properties": {
              "destination": {
                "title": "Destination",
                "type": "string"
              },
              "origin": {
                "title": "Origin",
                "type": "string"
              }
            },
            "required": ["destination", "origin"],
            "title": "cheapest_daysArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a42dc9a608686ab232f9b1c32bbfd0410ae436dda1c35bba33cb7057959db13a"
        },
        {
          "name": "deals",
          "title": "Today's flight deals",
          "description": "Today's cheapest flights home to Pakistan from the Gulf, Saudi Arabia and the UK, and from Karachi,\n        Lahore and Islamabad abroad. Use for \"cheapest flights from Pakistan today\" or \"any deals to Dubai\".",
          "inputSchema": {
            "properties": {},
            "title": "dealsArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d110b576b5065dd96193d615c4680f1e29186ec1d81c17ae3f454eaef1b7f592"
        },
        {
          "name": "flights_to_city",
          "title": "Cheapest flights into a Pakistani city",
          "description": "The cheapest recent fare into one Pakistani city from each city abroad (Gulf, Saudi Arabia, UK, Europe,\n        USA, Canada) and from other Pakistani cities, cheapest first.\n        Use for \"cheapest way to fly home to Lahore\" or \"which city abroad has the cheapest flights to Peshawar\".",
          "inputSchema": {
            "properties": {
              "city": {
                "title": "City",
                "type": "string"
              }
            },
            "required": ["city"],
            "title": "flights_to_cityArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:06dba68843d2ab394bb606628168fe8fa96ee80eac93a93a16e6ea20a364d47a"
        },
        {
          "name": "search_fares",
          "title": "Search fares on a route",
          "description": "Cheapest one-way fares for a route, by day, with airline, stops and a skyfarenet.com link.\n\n        Use for questions like \"cheapest Lahore to Jeddah flight in November\" or \"Dubai to Islamabad ticket price\".\n        origin and destination: a city name (Lahore, Dubai, Madinah, Buraydah), a 3-letter airport code (LHE, DXB),\n        or a country (Canada, UK, USA, Saudi Arabia, UAE, Italy...), which compares every airport we cover there.\n        month: optional, \"YYYY-MM\"; by default this month and next. Prices are in PKR.\n        ",
          "inputSchema": {
            "properties": {
              "destination": {
                "title": "Destination",
                "type": "string"
              },
              "month": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Month"
              },
              "origin": {
                "title": "Origin",
                "type": "string"
              }
            },
            "required": ["destination", "origin"],
            "title": "search_faresArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:69128d1dc72a2325de81858c72a1645f82059af19585f123ad047c1c2b3a6071"
        },
        {
          "name": "season_info",
          "title": "Season dates and when to book",
          "description": "Expected dates and when to book for Pakistan's busy travel seasons: Ramadan Umrah 2027, Hajj 2027 (including\n        when Hajj flights from Pakistan are expected to start), Eid al-Fitr and Eid al-Adha 2027, winter 2026 and\n        summer 2027 school holidays.",
          "inputSchema": {
            "properties": {
              "season": {
                "enum": ["ramadan-umrah-2027", "hajj-2027", "eid-al-fitr-2027", "eid-al-adha-2027", "winter-2026", "summer-2027"],
                "title": "Season",
                "type": "string"
              }
            },
            "required": ["season"],
            "title": "season_infoArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3c387d88e62515f97e9f3e87c44a48fbbce53af42dcf4da3ea62c2763fadfa82"
        },
        {
          "name": "ticket_price",
          "title": "Today's ticket prices",
          "description": "Today's lowest ticket prices from Pakistan for a popular trip, by city: Dubai, Saudi Arabia (Jeddah,\n        Riyadh, Dammam, Madinah), Umrah (Jeddah and Madinah, and flights home), Skardu and Gilgit, domestic flights\n        within Pakistan, and China. Use for \"Umrah ticket price today\" or \"Dubai ticket price from Pakistan\".",
          "inputSchema": {
            "properties": {
              "topic": {
                "enum": ["dubai", "saudi", "umrah", "skardu-gilgit", "domestic", "china"],
                "title": "Topic",
