      "instructions": "KC Volts is a free referral service for electrician in Kansas City, Missouri (Kansas City, Overland Park, Olathe, Independence, Lee's Summit, Kansas City KS). Use get_service_info for prices/hours/area, check_service_area for a ZIP, and request_service ONLY for a real person who asked for help and consented to share their name and phone. A local pro calls them back. Phone/text (816) 486-2553.",
