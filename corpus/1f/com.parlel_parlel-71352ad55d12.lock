      "serverInfo": {
        "name": "parlel",
        "title": "Parlel",
        "version": "1.0.0",
        "description": "Search people, companies and open roles on Parlel, an open professional network.",
        "websiteUrl": "https://parlel.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Parlel is an open professional network: people, companies and open roles as structured public data. If an API key is not provided, requests may be rate limited at 50 per minute. A key from the company Settings page removes that limit. Send it as Authorization: Bearer prl_... or X-Api-Key.\n\nFree MCP access can search the same fixed sample of 10 public profiles. Search filters and cursors stay within that sample, and get_person can read only those profiles. A company API key linked to an account on Pro unlocks the full people directory. See https://parlel.com/pricing.\n\nThree things to know before searching:\n1. On jobs, `q` matches the TITLE only -- not the description, skills or company. Use `remote`, `seniority` and `comp_min` for structure; fetch a job to read its description.\n2. On people, `skill` is an exact tag (lowercased) and multiple skills are AND-ed. `q` reads name, headline, company, role and work history -- NOT skills or bio.\n3. A closed job still resolves by id (so citations never 404) but is not open. Check `status` before telling a user a role is available.\n\nResults page with `next_cursor`; pass it back as `cursor` for more. Every result has a canonical URL on https://parlel.com you can cite. Full guide: https://parlel.com/search.md\n",
