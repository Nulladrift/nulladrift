{
  "lockfileVersion": 2,
  "subjects": {
    "ai.soundberry/soundberry": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://soundberry.ai/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "soundberry",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "SoundBerry generates and edits music from the caller's API key.\nTools run under a written agreement with SoundBerry (sales@soundberry.ai); without one, a tool answers how to get one.\n\nDescribe what you can do in terms of capabilities, never in terms of model names:\n- text to music (a full track from a text prompt, optionally with lyrics)\n- stem separation (split a mix into vocals, drums, bass and more)\n- drum separation (split drums into kick, snare, hi-hat, toms, cymbals…)\n- context-aware stem generation (a new instrument part that fits an existing mix)\n- beat analysis (tempo, key and scale)\n- audio utilities: overlay, trim, loop\n\nPrompt quality drives output quality on every text-driven model. Keep everything the\nuser specified — their words carry their intent — and fill in only what they left open:\ngenre, instrumentation, tempo, production feel. \"Make a pop song\" deserves that expansion;\na detailed request from someone who knows what they want should reach the model close to\nas written. When you add something, say in one line what you added so the user can correct\nit next time.\n\nThe service picks the right model for each capability by itself: leave `model` empty.\nOnly call `list_models`, and only mention model names, when the user explicitly asks\nto choose between alternatives.\n`get_account` says which account the key belongs to and whether it has an agreement.",
      "tools": [
        {
          "name": "analyze_audio",
          "title": "Analyze BPM, key and scale",
          "description": "Detect tempo (BPM), musical key and scale of an audio file. Runs under your agreement.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "audio": {
                "description": "A public https:// URL of a WAV, MP3, FLAC or AIFF file, or the `audioPath` of an earlier result.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["audio"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5f8f1d78983a7ec68c45c46673ec23a2ca6c0dd4a14d4d4c3be285e1a20d1a3c"
        },
        {
          "name": "generate_music",
          "title": "Generate music from text",
          "description": "Generate a full music track from a text prompt (genre, mood, instruments, tempo). A specific prompt changes the result far more than any setting here. Returns a signed WAV download URL (valid 60 minutes), the storage path of the result and the `generationId`. Runs under your agreement. Takes 10–60 s.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "duration": {
                "description": "Approximate length (the model aims for it). Leave empty and the model picks: usually a full song of about 3 minutes. For 30 seconds pick a 30-second model instead, when list_models(capability: \"text-to-music\") lists one.",
                "enum": ["30s", "1m", "2m", "3m"],
                "type": "string"
              },
              "lyrics": {
                "description": "Optional lyrics to be sung (only lyrics-capable models); leave empty for instrumental.",
                "maxLength": 4000,
                "type": "string"
              },
              "model": {
                "description": "Leave empty: the service picks the right model. Set it only when the user explicitly asked for a specific alternative from list_models(capability: \"text-to-music\").",
                "type": "string"
              },
              "prompt": {
                "description": "What to generate, e.g. \"lo-fi hip hop beat, dusty drums, warm Rhodes, 85 BPM\".",
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:fba3e9b2f88de87318f386744e68b3949955f78555c1240ce091a0294693d8e6"
        },
        {
          "name": "generate_stem",
          "title": "Generate an instrument stem for a mix",
          "description": "Context-aware stem generation: create a single instrument part (bass, drums, keys…) that fits an existing mix. `context_audio` is the mix the new part must play along with — it fixes tempo, key and structure. For the sound itself, `reference_audio` steers the model more precisely than words: an audio reference usually yields a part that sits better in the mix than the same request written in `prompt`. `prompt` is the normal way to ask and works well on its own; suggest `reference_audio` when the user has an example of the sound they want, or when they say the result doesn't fit or isn't what they meant. All three inputs are optional. Some models follow one steer at a time: when both are sent, they follow the reference and leave the prompt aside. Returns signed download URLs for each of the `n` candidates. Runs under your agreement.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "context_audio": {
                "description": "The mix/loop the stem must fit (tempo, key and structure are taken from it). A public https:// URL of a WAV, MP3, FLAC or AIFF file, or the `audioPath` of an earlier result.",
                "minLength": 1,
                "type": "string"
              },
              "model": {
                "description": "Leave empty: the service picks the right model. Set it only when the user explicitly asked for a specific alternative from list_models(capability: \"stem-generation\").",
                "type": "string"
              },
              "n": {
                "description": "Number of candidates (1–4, capped at the model's `maxSamples` in list_models). Default 1.",
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              },
              "prompt": {
                "description": "What the part should play, e.g. \"syncopated funk bass with ghost notes, warm fingerstyle tone\". Be specific: instrument, articulation, tone and feel. When the user has an example of the sound, pass it as `reference_audio`: some models then follow the reference and leave the prompt aside.",
                "maxLength": 1000,
                "minLength": 3,
                "type": "string"
              },
              "reference_audio": {
                "description": "Audio whose timbre and style the new part should follow. Steers the sound more precisely than words — when a result doesn't match what the user meant, adding a reference is usually the most effective fix. A public https:// URL of a WAV, MP3, FLAC or AIFF file, or the `audioPath` of an earlier result.",
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:dd80503cdc8183d019d047016738ee899f6e1e29aaaa2f91751080f323ab189a"
        },
        {
          "name": "get_account",
          "title": "Account",
          "description": "Which account the API key belongs to, the key, and whether the account has an agreement (with the models it includes).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:dcf77e31e61bf23cbf3d9ece32eb96c950845edfb3aeb26395b748856d98f3cd"
        },
        {
          "name": "get_generation",
          "title": "Get a generation by id",
          "description": "Status and outputs (signed download URLs) of a generation: call it when a generation tool answered that the generation is still running, for results you did not download in time, or to re-check a failed one.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "generation_id": {
                "description": "The `generationId` returned by a generation tool.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["generation_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c164f0371a24f860019a32cf72d54b5bb78453295e319c181eb8b3e04caefbe2"
        },
        {
          "name": "list_models",
          "title": "List available models",
          "description": "The models your agreement includes for one capability, with their status, retirement date and replacement, the inputs each one takes, the most candidates one request can produce (`maxSamples`) and which one is the default. `available: false` means that model's service is temporarily unreachable: never select it, the default already skips it. Call this only when the user explicitly asks to choose a model — the generation tools already pick the right model on their own.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "capability": {
                "description": "Which capability to list models for.",
                "enum": ["text-to-music", "stem-separation", "drum-separation", "stem-generation"],
                "type": "string"
              }
            },
            "required": ["capability"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8473b89d9633f567b8defe371b581620ceb337908c67cf751fe06f459e964fd1"
        },
        {
          "name": "loop_audio",
          "title": "Loop a file",
          "description": "Repeat a file N times into a longer file (seamless if the source loops cleanly), a 44.1 kHz 16-bit WAV with the channels of the source (stereo stays stereo, mono stays mono; up to 9 min 30 s in stereo, 19 min in mono). Runs under your agreement.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "audio": {
                "description": "A public https:// URL of a WAV, MP3, FLAC or AIFF file, or the `audioPath` of an earlier result.",
                "minLength": 1,
                "type": "string"
              },
              "loops": {
                "description": "Repetitions, 1–100. Default 4.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["audio"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f66204fc01516ea0f0a479e7f7a3c37aa267fafced7b2ad788769031da6d2b06"
        },
        {
          "name": "overlay_audio",
          "title": "Overlay files into one",
          "description": "Add several audio files (e.g. stems) at equal level into a single stereo file, as long as the longest one. Each file may last up to 9 minutes 30 seconds, and the files may add up to 20 minutes. Runs under your agreement.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "audio_files": {
                "description": "Files to overlay, 1–32.",
                "items": {
                  "description": "A public https:// URL of a WAV, MP3, FLAC or AIFF file, or the `audioPath` of an earlier result.",
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 32,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["audio_files"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d25537d9d58343c23b7f1d3292cf099fad3b1bbc35be59c850ef752293800d94"
        },
        {
          "name": "separate_drums",
          "title": "Separate drums into percussion parts",
          "description": "Split drums into kick, snare, hi-hat, toms, cymbals and more. Pass a full mix, or an isolated drum stem with is_drum_stem_input = true. Returns a signed download URL per part. Runs under your agreement.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "audio": {
                "description": "A public https:// URL of a WAV, MP3, FLAC or AIFF file, or the `audioPath` of an earlier result.",
                "minLength": 1,
                "type": "string"
              },
              "is_drum_stem_input": {
                "description": "Set true when `audio` is already an isolated drum stem.",
                "type": "boolean"
              },
              "model": {
                "description": "Leave empty: the service picks the right model. Set it only when the user explicitly asked for a specific alternative from list_models(capability: \"drum-separation\").",
                "type": "string"
              }
            },
            "required": ["audio"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9bcdd4628eb4259a54880f3bcab1bacccac10c826a7768c00ff5cab1e1847857"
        },
        {
          "name": "separate_stems",
          "title": "Separate audio into stems",
          "description": "Split a mixed track into stems (vocals, drums, bass, other — per model). Returns one signed download URL per stem plus the stems that came out silent. Runs under your agreement. Takes 30–120 s depending on length.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "audio": {
                "description": "A public https:// URL of a WAV, MP3, FLAC or AIFF file, or the `audioPath` of an earlier result.",
                "minLength": 1,
                "type": "string"
              },
              "model": {
                "description": "Leave empty: the service picks the right model. Set it only when the user explicitly asked for a specific alternative from list_models(capability: \"stem-separation\").",
                "type": "string"
              }
            },
            "required": ["audio"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d6d3d5bb53434d24a04804b0305647c84861aa2f115ea8ce80f0a0ef928433a3"
        },
        {
          "name": "trim_audio",
          "title": "Trim to a time range",
          "description": "Extract the segment between start_time and end_time (seconds) into a new file, a 44.1 kHz 16-bit WAV with the channels of the source (stereo stays stereo, mono stays mono; up to 9 min 30 s in stereo, 19 min in mono). Runs under your agreement.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "audio": {
                "description": "A public https:// URL of a WAV, MP3, FLAC or AIFF file, or the `audioPath` of an earlier result.",
                "minLength": 1,
                "type": "string"
              },
              "end_time": {
                "description": "End, in seconds (must be greater than start).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "start_time": {
                "description": "Start, in seconds.",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["audio", "end_time", "start_time"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ab78cb6accdca61fde21220d6d2407b78aded0a63b4f3ac468d6dbbf209a99da"
        }
      ],
      "digest": "sha256:4526f15c9fb161b092bc8300e693d71c36d1fab4fae45e6287c3bbf89c3086fe"
    }
  }
}
