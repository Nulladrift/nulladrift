            "readOnly": true
          },
          "digest": "sha256:6ecdd0ba27a8ac0c4059fa58f7d0cf33e7d8a571d856cce1d46ea8bd43be742f"
        },
        {
          "name": "get_job",
          "title": "Get batch status",
          "description": "Status of a photoshoot batch: per-item status and output_url. The batch is done when `settled` >= `expected_total`. `total` only counts rows written so far, so it can lag while the queue drains.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "batch_id": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["batch_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
