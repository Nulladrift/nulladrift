          },
          "digest": "sha256:e068951fd1cd004f97bd296fe19b0e87ea0019922a97be561ba836dea0cf1b9b"
        },
        {
          "name": "wait_for_job",
          "title": "Wait for batch",
          "description": "Poll a batch (backoff 2s up to 10s) until every item is completed or failed, or until timeout. Pass expected_total (the `total` from create_photoshoot_batch) until the server reports its own. On timeout returns done=false with the latest status; call again to keep waiting.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "batch_id": {
                "minLength": 1,
                "type": "string"
              },
              "expected_total": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "timeout_seconds": {
                "description": "Default 50.",
                "maximum": 90,
                "minimum": 5,
                "type": "integer"
              }
            },
            "required": ["batch_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b083189ebe32ee66634c3beb76eef315905e25aca22a4c894318797060492c3d"
        }
      ],
      "digest": "sha256:e95c08178540ac492fe5da33d734129395e0db7ce7214c9113bf40f6d1601288"
    }
  }
