{
  "lockfileVersion": 2,
  "subjects": {
    "ai.socialshot/socialshot": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.socialshot.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "socialshot",
        "title": "SocialShot AI",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "SocialShot AI turns product photos into on-model, studio and lifestyle product images. Authenticate with a SocialShot Merchant API key (Settings > API keys) sent as 'Authorization: Bearer sk_ss_...'. get_account, list_options, get_job and wait_for_job are free; create_photoshoot_batch spends the account's paid credits, so call it only when the user asks for images and check get_account first.",
      "tools": [
        {
          "name": "create_photoshoot_batch",
          "title": "Create photoshoot batch",
          "description": "COSTS MONEY: every successful submission spends real, paid credits from the account's SocialShot balance (about credits_estimated in the result; higher tier / output_quality cost more). Only call it when the user has asked for images to be generated, and check get_account (credits, dailyCap) first. Queues AI product-photoshoot generation for 1-50 publicly reachable product image URLs (one output each) and returns batch_id, total and credits_estimated immediately; poll with wait_for_job or get_job. Identical inputs never charge twice: they reuse an idempotency_key derived from the inputs, so the server replays the ORIGINAL batch (idempotent_replay: true) and no new images are made. Pass force_new: true only when the user explicitly wants a new, separately charged run of the same inputs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "angle": {
                "type": "string"
              },
              "aspect_ratio": {
                "enum": ["1:1", "4:5", "3:4", "9:16", "16:9"],
                "type": "string"
              },
              "backdrop": {
                "description": "Studio backdrop colour (default \"white\").",
                "type": "string"
              },
              "backdrop_id": {
                "type": "string"
              },
              "background": {
                "description": "Scene background (default \"urban street\").",
                "type": "string"
              },
              "background_id": {
                "type": "string"
              },
              "brand_name": {
                "type": "string"
              },
              "composition": {
                "type": "string"
              },
              "defaults": {
                "additionalProperties": false,
                "description": "Batch-wide overrides applied to every item.",
                "properties": {
                  "angle": {
                    "type": "string"
                  },
                  "aspect_ratio": {
                    "enum": ["1:1", "4:5", "3:4", "9:16", "16:9"],
                    "type": "string"
                  },
                  "backdrop": {
                    "type": "string"
                  },
                  "background": {
                    "type": "string"
                  },
                  "brand_name": {
                    "type": "string"
                  },
                  "composition": {
                    "type": "string"
                  },
                  "garment_fit": {
                    "enum": ["auto", "oversized", "relaxed", "regular", "slim"],
                    "type": "string"
                  },
                  "include_human_model": {
                    "type": "boolean"
                  },
                  "lighting": {
                    "type": "string"
                  },
                  "logo_alignment": {
                    "type": "string"
                  },
                  "logo_enabled": {
                    "type": "boolean"
                  },
                  "output_quality": {
                    "enum": ["1k", "2k", "4k"],
                    "type": "string"
                  },
                  "pose": {
                    "maxLength": 500,
                    "type": "string"
                  },
                  "product_category": {
                    "type": "string"
                  },
                  "style_mood": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "force_new": {
                "description": "Start a new, separately charged batch even though identical inputs ran before. Only on the user's explicit request.",
                "type": "boolean"
              },
              "garment_fit": {
                "enum": ["auto", "oversized", "relaxed", "regular", "slim"],
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional. Reuse to safely retry the same request; derived from the inputs if omitted.",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "include_human_model": {
                "description": "On-model shot (default true).",
                "type": "boolean"
              },
              "items": {
                "description": "1-50 product images; one output image each.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "angle": {
                      "type": "string"
                    },
                    "aspect_ratio": {
                      "enum": ["1:1", "4:5", "3:4", "9:16", "16:9"],
                      "type": "string"
                    },
                    "backdrop": {
                      "type": "string"
                    },
                    "custom_prompt": {
                      "description": "Extra per-image direction.",
                      "type": "string"
                    },
                    "image_url": {
                      "description": "Publicly reachable https URL of the product photo (the server fetches it).",
                      "format": "uri",
                      "type": "string"
                    },
                    "output_quality": {
                      "enum": ["1k", "2k", "4k"],
                      "type": "string"
                    }
                  },
                  "required": ["image_url"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "lighting": {
                "type": "string"
              },
              "logo_alignment": {
                "type": "string"
              },
              "logo_enabled": {
                "type": "boolean"
              },
              "output_quality": {
                "description": "1k (default), 2k or 4k. Higher costs more credits.",
                "enum": ["1k", "2k", "4k"],
                "type": "string"
              },
              "pose": {
                "maxLength": 500,
                "type": "string"
              },
              "product_category": {
                "type": "string"
              },
              "scene_type": {
                "description": "studio = clean backdrop; lifestyle = styled scene.",
                "enum": ["studio", "lifestyle"],
                "type": "string"
              },
              "style_mood": {
                "type": "string"
              },
              "tier": {
                "description": "economy (default), standard or premium. Higher tiers cost more credits.",
                "enum": ["economy", "standard", "premium"],
                "type": "string"
              }
            },
            "required": ["items", "scene_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c674925e64f0cdd2fdfb41f8575be9f90fbd10a64b0782caf34be848853b1f0a"
        },
        {
          "name": "get_account",
          "title": "Get SocialShot account",
          "description": "Shop metadata, plan, credit balance and dailyCap {used, limit, resetsAt} (the rolling 24-hour API credit cap) for this API key. Free; call before spending credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
