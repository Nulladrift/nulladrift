          "digest": "sha256:88083dc99f84c9d5fce09e398fd843b6b127aeb5630f1147865a1aaee0c99b7f"
        },
        {
          "name": "list_options",
          "title": "List generation options",
          "description": "Catalog of accepted generation options (currently the output tiers). Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
