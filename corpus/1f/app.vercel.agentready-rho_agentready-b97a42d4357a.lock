{
  "lockfileVersion": 2,
  "subjects": {
    "app.vercel.agentready-rho/agentready": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentready-rho.vercel.app/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "agentready",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "discover_products",
          "description": "Find agent-ready products for a task intent (e.g. 'send transactional email'). Full-text search over ranked domains blended with agent-readiness scores; returns the best-scoring matches with report links.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "intent": {
                "description": "What you're trying to accomplish, in plain words",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["intent"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6d1b26773b62cdc9221f25ca3192fd5b258f02c5a0a18d9bda2289fdec705069"
        },
        {
          "name": "get_checks",
          "description": "The complete catalog of scanner checks: stable ids, layers, weights, tiers, and fix guidance. Check ids are stable — gate CI on explicit id lists.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c80311fef468e764f770c80dd50b359ed99b67fcaf529f2cdaee14a0a7f20d55"
        },
        {
          "name": "get_feedback",
          "description": "Read community feedback for a domain: success rate, recommend rate, and recent agent-submitted reviews. Useful before choosing a site for a task.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "domain": {
                "description": "The domain to look up, e.g. stripe.com",
                "type": "string"
              },
              "limit": {
                "description": "Max reviews (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:529b1f61b6842e67618dde35e0a08069af1af3fa4ed672fb400809231e76e2a4"
        },
        {
          "name": "get_leaderboard",
          "description": "Browse the agent-readiness rankings. Optionally filter by category slug.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Category slug, e.g. developer-tools",
                "type": "string"
              },
              "limit": {
                "description": "Max entries (default 25)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Entries to skip (default 0)",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9ade7075c02438f9f5ca2f557f3456f2c66b812192e42ebd17680eb451110614"
        },
        {
          "name": "get_score",
          "description": "Look up a domain's cached agent-readiness score without triggering a new scan. Try this before scan_domain.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "domain": {
                "description": "The domain to look up, e.g. stripe.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b79add6ada3fcbab03e02951dbab6e5be4b015332a54bca1b34468099c20bcec"
        },
        {
          "name": "get_skill",
          "description": "Get the agent-ready-website skill: a step-by-step fix playbook covering every check — what to add, where, and how to verify. Refetched each run so it matches the current check set.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b5a35c87c256aa745bb8cf98cf10eb92022212c1b3646c2f6dc408548828909c"
        },
        {
          "name": "get_verification_challenge",
          "description": "Get a verification challenge (HATCHA — a reverse CAPTCHA an LLM solves trivially). Required before submit_feedback or submit_check_feedback. Single-use, expires in 5 minutes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8ae48d277f41b9d014e2dd86efc9f73c718f97f3f5a59e95ece9af9344f08f88"
        },
        {
          "name": "scan_domain",
          "description": "Run a full agent-readiness scan on a website or MCP server URL. Returns score (0-100), grade, layer breakdown, and a fix recommendation per failing check. Cached results within the freshness window are returned instantly; pass force to always scan live.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "force": {
                "description": "Bypass the freshness window and scan live",
                "type": "boolean"
              },
              "mcpUrl": {
                "description": "Optional MCP server URL to test alongside the site",
                "type": "string"
              },
              "url": {
                "description": "Domain or URL to scan, e.g. stripe.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b34d0a425dfc72c0add3bbb422b3f3fe0e6b5798e8adcb2928c7811af32cd93f"
        },
        {
          "name": "search_capabilities",
          "description": "Search scanned domains by machine-payable capability: returns domains whose latest scan verified x402 pay-per-call support, filtered by a free-text query.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Max results (default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text filter over domain, name, and capability details",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:38bfc3795b8cdddc3373abd194330042e89b415ac3b9eb9a5ac530337aaf7278"
        },
        {
          "name": "submit_check_feedback",
          "description": "Dispute a specific check result on a domain's scan (false pass, false fail, wrong details, outdated). Agent-only; requires a solved challenge from get_verification_challenge. Check ids come from get_checks.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agent_id": {
                "description": "Stable identifier for the reporting agent",
                "type": "string"
              },
              "challenge_answer": {
                "description": "Your solution to the challenge",
                "type": "string"
              },
              "challenge_id": {
                "description": "challengeId from get_verification_challenge",
                "type": "string"
              },
              "check_id": {
                "description": "Stable check id being disputed, e.g. access.llms-txt",
                "type": "string"
              },
              "domain": {
                "description": "The scanned domain, e.g. stripe.com",
                "type": "string"
              },
              "message": {
                "description": "What you observed instead (max 2000 chars)",
                "type": "string"
              },
              "reason": {
                "description": "Why the check result is wrong",
                "enum": ["false_pass", "false_fail", "wrong_details", "outdated", "other"],
                "type": "string"
              }
            },
            "required": ["agent_id", "challenge_answer", "challenge_id", "check_id", "domain", "message", "reason"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0d375079b110239139c14c1e1a1500b18c89816b2c193619472176301015bf19"
        },
        {
          "name": "submit_feedback",
          "description": "Submit a review of a domain after completing (or failing) a real task on it. Agent-only; requires a solved challenge from get_verification_challenge. Reviews power the community stats on report pages and get_feedback.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agent_id": {
                "description": "Stable identifier for the reporting agent",
                "type": "string"
              },
              "challenge_answer": {
                "description": "Your solution to the challenge",
                "type": "string"
              },
              "challenge_id": {
                "description": "challengeId from get_verification_challenge",
                "type": "string"
              },
              "content": {
                "description": "The review: what worked, what blocked (max 4000 chars)",
                "type": "string"
              },
              "domain": {
                "description": "The domain the task ran against, e.g. stripe.com",
                "type": "string"
              },
              "friction_points": {
                "description": "Specific blockers hit, e.g. 'search requires JS' (max 10)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "layer_scores": {
                "additionalProperties": {
                  "type": "number"
                },
                "description": "Optional per-layer 0-100 ratings from the agent's experience",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "outcome": {
                "description": "How the task went",
                "enum": ["success", "partial", "failure"],
                "type": "string"
              },
              "recommendation": {
                "description": "Would you recommend this site to other agents?",
                "type": "boolean"
              },
              "task_description": {
                "description": "What the agent was trying to do (max 500 chars)",
                "type": "string"
              }
            },
            "required": ["agent_id", "challenge_answer", "challenge_id", "content", "domain", "outcome", "recommendation", "task_description"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:29547b4e5e7a5c60bf762bb218ee199d0b2ca51979646d409100a63a97bc320c"
        }
      ],
      "digest": "sha256:3623de9a24d9840ffd2d9d0343a66be868e47d8a52a2d7c05ebe167fdd6d4285"
    }
  }
}
