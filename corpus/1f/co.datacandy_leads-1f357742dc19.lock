        {
          "name": "buy_leads",
          "title": "Buy leads",
          "description": "Buy leads. THIS SPENDS MONEY AND CANNOT BE UNDONE. max_price_usd is required: nothing is bought if the price is higher. Paid from the account's credits (API key needed) it returns the leads at once: the first 25 inline and download links for the full set. Otherwise it returns a checkout link and an order id; a person pays on that page, then get_order returns the leads. Run quote_leads first.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "after_id": {
                "description": "Continue after this lead id (use next_after_id from an earlier order to get new leads).",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "email": {
                "description": "Email for the receipt and for recovering the order.",
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "filters": {
                "additionalProperties": false,
                "description": "Search filters, all optional. Combine as needed; more filters means fewer leads.",
                "properties": {
                  "category": {
                    "description": "Specific category, e.g. \"Roofing contractor\" (find names with list_industries and its search argument).",
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  "city": {
                    "description": "Exact city name (case-insensitive). Use together with state.",
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  "has_cell": {
                    "description": "Only leads that have a mobile phone number.",
                    "type": "boolean"
                  },
                  "has_email": {
                    "description": "Only leads that have an email address.",
                    "type": "boolean"
                  },
                  "has_facebook": {
                    "description": "Only leads that have a Facebook page.",
                    "type": "boolean"
                  },
                  "has_owner_name": {
                    "description": "Only leads that have the owner's name.",
                    "type": "boolean"
                  },
                  "has_phone": {
                    "description": "Only leads that have any phone number.",
                    "type": "boolean"
                  },
                  "has_website": {
                    "description": "Only leads that have a website.",
                    "type": "boolean"
                  },
                  "industry": {
                    "description": "Exact industry name from list_industries, e.g. \"Construction & Contractors\".",
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  "keyword": {
                    "description": "Business name contains this text (case-insensitive).",
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  "state": {
                    "description": "2-letter US state code, or a comma-separated list such as \"TX,OK\".",
                    "maxLength": 120,
                    "minLength": 2,
                    "type": "string"
                  },
                  "zip": {
                    "description": "5-digit ZIP code, or a comma-separated list of ZIP codes.",
                    "maxLength": 300,
                    "minLength": 5,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "fresh": {
                "description": "Skip leads this account already received for the same search (default true when an API key is used).",
                "type": "boolean"
              },
              "idempotency_key": {
                "description": "Optional. Send the same value when retrying after a timeout so you are never charged twice for one purchase.",
                "maxLength": 128,
                "minLength": 8,
                "pattern": "^[A-Za-z0-9_.:-]+$",
                "type": "string"
              },
              "max_price_usd": {
                "description": "REQUIRED spending cap in US dollars. Nothing is bought if the price is higher.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "payment_method": {
                "description": "auto (default): account credits when enough, else a Shared Payment Token if given, else a checkout link. checkout: always return a link for a person to pay.",
                "enum": ["auto", "credits", "checkout", "stripe_spt"],
                "type": "string"
              },
              "quantity": {
                "description": "How many leads (1 to 25,000). If fewer match, you get what matches.",
                "maximum": 25000,
                "minimum": 1,
                "type": "integer"
              },
              "shared_payment_token": {
                "description": "Stripe Shared Payment Token (spt_...), only with payment_method \"stripe_spt\".",
                "maxLength": 200,
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["max_price_usd", "quantity"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "checkout_url": {
                "description": "Open this page to pay (a person must do it).",
                "type": ["string", "null"]
              },
              "created_at": {
                "type": ["string", "null"]
