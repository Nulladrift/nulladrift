        {
          "name": "add_credits",
          "title": "Add credits",
          "description": "Start a credit top-up of $10 to $1,000. THIS SPENDS MONEY once a person pays. Returns a Stripe checkout link that a person must open; the credits arrive after payment and buy_leads then spends them. Needs an API key.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "amount_usd": {
                "description": "Top-up amount in US dollars, 10 to 1000.",
                "maximum": 1000,
                "minimum": 10,
                "type": "number"
              },
              "idempotency_key": {
                "description": "Optional. Send the same value when retrying after a timeout so you are never charged twice for one purchase.",
                "maxLength": 128,
                "minLength": 8,
                "pattern": "^[A-Za-z0-9_.:-]+$",
                "type": "string"
              }
            },
            "required": ["amount_usd"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "amount_usd": {
                "type": ["number", "null"]
              },
              "balance_usd": {
                "type": ["number", "null"]
              },
              "checkout_url": {
                "description": "A person must open this page to pay.",
                "type": "string"
              },
              "expires_at": {
                "type": ["string", "null"]
              },
              "next_step": {
                "type": "string"
              },
              "session_id": {
                "type": ["string", "null"]
              },
              "url_elicitation": {
                "anyOf": [
                  {
                    "enum": ["sent", "not_supported", "declined", "completed"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["checkout_url", "next_step"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Add credits"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0468a89ac683d8b30f0a17482c5129110b0991ea654edf99fe1e4369ab6c17c6"
