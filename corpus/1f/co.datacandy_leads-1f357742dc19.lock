        {
          "name": "database_overview",
          "title": "Database overview",
          "description": "Overview of the Data Candy US business-lead database: how many records it holds, how many have an email, a mobile number or a website, how fresh the data is, the fields on each lead, and the current prices and payment options. Free, no account needed.",
