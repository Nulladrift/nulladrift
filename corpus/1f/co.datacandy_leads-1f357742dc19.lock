                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "address": {
                      "type": ["string", "null"]
                    },
                    "business": {
                      "type": ["string", "null"]
                    },
                    "category": {
                      "type": ["string", "null"]
                    },
                    "cell": {
                      "type": ["string", "null"]
                    },
                    "city": {
                      "type": ["string", "null"]
                    },
                    "email": {
                      "type": ["string", "null"]
                    },
                    "facebook": {
                      "type": ["string", "null"]
                    },
                    "id": {
                      "type": ["number", "string", "null"]
                    },
                    "industry": {
                      "type": ["string", "null"]
                    },
                    "owner_first": {
                      "type": ["string", "null"]
                    },
                    "owner_last": {
                      "type": ["string", "null"]
                    },
                    "phone": {
                      "type": ["string", "null"]
                    },
                    "phone_type": {
                      "type": ["string", "null"]
                    },
                    "state": {
                      "type": ["string", "null"]
                    },
                    "website": {
                      "type": ["string", "null"]
                    },
                    "zip": {
                      "type": ["string", "null"]
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "leads_shown": {
                "type": "number"
              },
              "leads_total": {
                "description": "How many leads the order holds.",
                "type": "number"
              },
              "leads_truncated": {
                "description": "True when more leads exist than the 25 shown inline.",
                "type": "boolean"
              },
              "livemode": {
                "type": ["boolean", "null"]
              },
              "matched": {
                "type": ["number", "null"]
              },
              "next_after_id": {
                "type": ["number", "null"]
              },
              "next_step": {
                "description": "What to do next, in plain words.",
                "type": "string"
              },
              "notes": {
                "description": "Plain sentences from the API about this order, for example that the same search already has an unpaid order.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "order_id": {
                "description": "The order id. Keep it secret.",
                "type": "string"
              },
              "paid_at": {
                "type": ["string", "null"]
              },
              "payment_method": {
                "type": ["string", "null"]
              },
              "price_cents": {
                "type": ["number", "null"]
              },
              "price_usd": {
                "type": ["number", "null"]
              },
              "quantity": {
                "type": ["number", "null"]
              },
              "status": {
                "description": "awaiting_payment, paid, fulfilled, expired, canceled, refunded or failed.",
                "type": "string"
              },
              "unit_price_cents": {
                "type": ["number", "null"]
              },
              "url_elicitation": {
                "anyOf": [
                  {
                    "enum": ["sent", "not_supported", "declined", "completed"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Whether the checkout link was also offered through URL-mode elicitation."
              }
            },
            "required": ["leads", "leads_shown", "leads_total", "leads_truncated", "next_step", "order_id", "status"],
            "type": "object"
          },
