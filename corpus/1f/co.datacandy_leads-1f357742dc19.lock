                "type": ["number", "null"]
              },
              "credits_usd": {
                "description": "Prepaid credit balance in dollars.",
                "type": ["number", "null"]
              },
              "email": {
                "type": ["string", "null"]
              },
              "key_prefix": {
                "description": "The first characters of the API key in use (never the whole key).",
                "type": ["string", "null"]
              },
