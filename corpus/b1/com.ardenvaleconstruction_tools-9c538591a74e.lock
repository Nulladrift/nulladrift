        },
        {
          "name": "child_care_space_checker",
          "description": "Check indoor play space, outdoor play space and sleeping area per child for an Ontario licensed child care centre. Preliminary planning check only. Licensing is decided by the ministry. The architect, the engineer and the permit set govern the design.",
          "inputSchema": {
            "properties": {
              "groups": {
                "description": "Required. Licensed age groups as group:children:floor_area, comma separated, for example preschool:24:70,infant:10:25.",
                "type": "string"
              },
              "outdoor_area": {
                "default": 0,
                "description": "Outdoor play space available. 0 shows only the requirement. Unit: unit.",
                "type": "number"
              },
              "six_hours": {
                "default": true,
                "description": "Program runs six hours or more in a day.",
                "type": "boolean"
              },
              "sleeping_area": {
                "default": 0,
                "description": "Sleeping area available. Unit: unit.",
                "type": "number"
              },
              "sleeping_children": {
                "default": 0,
                "description": "Children sleeping at one time. Unit: children.",
                "type": "integer"
              },
              "unit": {
                "default": "m2",
                "description": "Area unit for every area value.",
                "enum": ["m2", "ft2"],
                "type": "string"
              }
            },
            "required": ["groups"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
