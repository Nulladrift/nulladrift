        {
          "name": "restaurant_seating_and_washroom_requirement",
          "description": "Occupant load, seat capacity and minimum patron and employee water closets and lavatories for an Ontario restaurant or bar (Building Code Table 3.7.4.3.-D, -E and -F). Preliminary planning figure only. The architect, the public health unit, the building official and the permit set govern the seat count and the fixture count.",
          "inputSchema": {
            "properties": {
              "dining_area_m2": {
                "description": "Dining, beverage and cafeteria floor area open to patrons (required). Unit: m2.",
                "type": "number"
              },
              "employees": {
                "default": 8,
                "description": "Employees normally present at one time, those present more than 25 percent of the working day (Sentence 3.7.4.3.(9)). Unit: people.",
                "type": "integer"
              },
              "male_pct": {
                "default": 50,
                "description": "Share counted as male, 0 to 100. The rest are counted as female. Unit: percent.",
                "type": "number"
              },
              "seats": {
                "default": 0,
                "description": "Seats planned. 0 to use the occupant load from the area. The occupant load is the larger of the two. Unit: seats.",
                "type": "integer"
              },
              "service": {
                "default": "restaurant",
                "description": "restaurant: a dining room or cafeteria (Table 3.7.4.3.-D). bar: an establishment used primarily for alcoholic beverages with limited or no food service (Table 3.7.4.3.-E).",
                "enum": ["restaurant", "bar"],
                "type": "string"
              },
              "storeys": {
                "default": 1,
                "description": "Storeys in the building (sets the minimum number of universal washrooms). Unit: storeys.",
                "type": "integer"
              },
              "urinals": {
                "default": true,
                "description": "Use urinals for males up to the Code limit.",
                "type": "boolean"
              }
            },
            "required": ["dining_area_m2"],
            "type": "object"
          },
