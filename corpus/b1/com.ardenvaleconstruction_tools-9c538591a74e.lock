      "instructions": "Free planning calculators for Ontario commercial space. Every result is a preliminary planning figure. Tool page and free quote links are in each answer.",
      "tools": [
        {
          "name": "accessible_washroom_clearance_checker",
          "description": "Pass or fail check of barrier-free stall, ambulatory stall or universal washroom clear dimensions against Ontario Building Code Articles 3.8.3.8 and 3.8.3.12. Preliminary clearance check only. The architect, the accessibility consultant and the building official govern. This does not certify a washroom.",
          "inputSchema": {
            "properties": {
              "change_table_space_length_mm": {
                "description": "Universal washroom: clear space length for an adult change table. Unit: mm.",
                "type": "number"
              },
              "change_table_space_width_mm": {
                "description": "Universal washroom: clear space width for an adult change table. Unit: mm.",
                "type": "number"
              },
              "door_clear_opening_mm": {
                "description": "Door clear opening with the door open (all types). Unit: mm.",
                "type": "number"
              },
              "door_swing": {
                "description": "Stall door swing.",
                "enum": ["outward", "inward"],
                "type": "string"
              },
              "front_clear_diameter_mm": {
                "description": "Stall only: diameter of clear floor space in front of the stall. Unit: mm.",
                "type": "number"
              },
              "inward_door_clear_area_ok": {
                "description": "Stall with inward door: is a clear floor area of 820 mm by 1,440 mm inside the stall, clear of the door swing?",
                "type": "boolean"
              },
              "latch_height_mm": {
                "description": "Universal washroom: latch height above the floor. Unit: mm.",
                "type": "number"
              },
              "lavatory_knee_clearance_mm": {
                "description": "Clearance under the lavatory at the front edge. Unit: mm.",
                "type": "number"
              },
              "lavatory_rim_height_mm": {
                "description": "Lavatory rim height above the floor. Unit: mm.",
                "type": "number"
              },
              "power_door_operator": {
                "description": "Universal washroom: power door operator fitted.",
                "type": "boolean"
              },
              "room_length_mm": {
                "description": "Universal washroom internal length. Unit: mm.",
                "type": "number"
              },
              "room_width_mm": {
                "description": "Universal washroom internal width. Unit: mm.",
                "type": "number"
              },
              "seat_height_mm": {
                "description": "Stall only: water closet seat height above the floor. Unit: mm.",
                "type": "number"
              },
              "stall_depth_mm": {
                "description": "Stall clear depth (stall and ambulatory). Unit: mm.",
                "type": "number"
              },
              "stall_face_to_door_mm": {
                "description": "Stall with inward washroom door: clearance from stall face to that door. Unit: mm.",
                "type": "number"
              },
              "stall_face_to_obstruction_mm": {
                "description": "Stall only: clearance from stall face to any wall-mounted fixture or obstruction. Unit: mm.",
                "type": "number"
              },
              "stall_width_mm": {
                "description": "Stall clear width (stall and ambulatory). Unit: mm.",
                "type": "number"
              },
              "transfer_space_depth_mm": {
                "description": "Stall only: clear transfer space depth beside the water closet. Unit: mm.",
                "type": "number"
              },
              "transfer_space_width_mm": {
                "description": "Stall only: clear transfer space width beside the water closet. Unit: mm.",
                "type": "number"
              },
              "turning_diameter_mm": {
                "description": "Universal washroom: diameter of open turning space. Unit: mm.",
                "type": "number"
              },
              "type": {
                "default": "stall",
                "description": "stall: barrier-free water closet stall. ambulatory: ambulatory stall. universal: universal washroom.",
                "enum": ["stall", "ambulatory", "universal"],
                "type": "string"
              },
              "wc_centre_to_wall_mm": {
                "description": "Stall only: water closet centre line to the nearest side wall. Unit: mm.",
                "type": "number"
              }
            },
            "required": [],
            "type": "object"
