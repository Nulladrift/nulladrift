        {
          "name": "parking_stall_count_for_change_of_use",
          "description": "Indicative parking stall count for a change of use in Toronto, Mississauga or Brampton from the zoning by-law rates, with the by-law named. Confirm with the municipality. Indicative only. Parking requirements differ by municipality, zone and site-specific exceptions. Confirm with the municipality's zoning examiner.",
          "inputSchema": {
            "properties": {
              "brampton_core": {
                "default": false,
                "description": "Brampton only: the property is inside the Downtown, Central Area and Hurontario/Main Corridor area (Schedule B-7), which has no minimum.",
                "type": "boolean"
              },
              "city": {
                "description": "Municipality (required). Only cities whose by-law we opened are offered.",
                "enum": ["toronto", "mississauga", "brampton"],
                "type": "string"
              },
              "gross_floor_area_m2": {
                "description": "Gross floor area of the use (required). Each by-law defines its own gross floor area. Unit: m2.",
                "type": "number"
              },
              "use": {
                "description": "Proposed use (required). Not every use is mapped for every city.",
                "type": "string"
              },
              "zone": {
                "default": "other",
                "description": "Toronto: parking zone pza, pzb or other. Mississauga: parking precinct 1, 2, 3 or 4. Ignored for Brampton.",
                "enum": ["pza", "pzb", "other", "1", "2", "3", "4"],
                "type": "string"
              }
            },
            "required": ["city", "gross_floor_area_m2", "use"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
