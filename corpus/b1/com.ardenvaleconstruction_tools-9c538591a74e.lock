        {
          "name": "change_of_use_document_checklist",
          "description": "Printable Toronto building permit document checklist for a commercial change of use or interior alteration, from the City of Toronto Building guide. Organizes forms and drawings only. Document organizer only. It is not a permit determination or a fee estimate. The City of Toronto examiner and your designer decide what the application needs.",
          "inputSchema": {
            "properties": {
              "assembly_work": {
                "default": false,
                "description": "The project changes wall or floor assemblies, fire separations, stairs, guards or handrails.",
                "type": "boolean"
              },
              "designer": {
                "default": "architect_engineer",
                "description": "Who prepares the drawings: architect_engineer, other_designer, or owner_exempt (a property owner exempt from qualification).",
                "enum": ["architect_engineer", "other_designer", "owner_exempt"],
                "type": "string"
              },
              "exterior_work": {
                "default": false,
                "description": "The project includes exterior, parking or loading changes.",
                "type": "boolean"
              },
              "professional_review": {
                "default": "unsure",
                "description": "Whether the Building Code requires professional design and field review: yes, no or unsure.",
                "enum": ["yes", "no", "unsure"],
                "type": "string"
              },
              "roof_work": {
                "default": false,
                "description": "The project includes roof changes or new rooftop equipment.",
                "type": "boolean"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
