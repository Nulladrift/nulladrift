        },
        {
          "name": "exit_width_and_egress_door_calculator",
          "description": "Required exit width, number of exits, door count and travel distance limit for an occupant load under Ontario Building Code Subsections 3.4.2 and 3.4.3. Preliminary planning figure only. The architect, the fire protection engineer and the permit set govern the means of egress.",
          "inputSchema": {
            "properties": {
              "door_clear_width_mm": {
                "default": 850,
                "description": "Clear opening of one door leaf you plan to use, 850 mm or more. Unit: mm.",
                "type": "number"
              },
              "element": {
                "default": "doorway",
                "description": "Exit element to size in the headline answer.",
                "enum": ["doorway", "corridor", "ramp", "ramp-steep", "stair", "stair-other"],
                "type": "string"
              },
              "floor_area_m2": {
                "description": "Floor area, to test the one-exit option. Unit: m2.",
                "type": "number"
              },
              "group": {
                "default": "mercantile",
                "description": "Major occupancy of the floor area.",
                "enum": ["assembly", "residential", "business", "mercantile", "industrial-low", "industrial-medium", "industrial-high", "care"],
                "type": "string"
              },
              "max_diagonal_m": {
                "description": "Maximum diagonal dimension of the floor area, to find the least distance between two exits. Unit: m.",
                "type": "number"
              },
              "occupant_load": {
                "description": "Occupant load of the floor area served (required). Use the occupant load calculator for the table value. Unit: persons.",
                "type": "integer"
              },
              "sprinklered": {
                "default": false,
                "description": "Floor area sprinklered throughout.",
                "type": "boolean"
              },
              "stairs_storeys_served": {
                "default": 2,
                "description": "Storeys the exit stair serves above the lowest exit level. Over 2 sets the 1,100 mm minimum stair width. Unit: storeys.",
                "type": "integer"
              },
              "storeys": {
                "default": 1,
                "description": "Building height in storeys. Unit: storeys.",
                "type": "integer"
              },
              "travel_distance_m": {
                "description": "Longest travel distance from any point to an exit, measured along the path of travel. Unit: m.",
                "type": "number"
              }
            },
            "required": ["occupant_load"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
