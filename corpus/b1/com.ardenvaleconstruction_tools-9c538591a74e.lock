                "description": "Use of the floor area (required). One slug, or several separated by commas to match area.",
                "type": "string"
              }
            },
            "required": ["area", "use"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
