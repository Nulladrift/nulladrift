        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://istointents.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "istointents-forwarder",
        "title": "Isto Intents",
        "version": "0.2.0",
        "websiteUrl": "https://istointents.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Isto Intents lets a person ask an independent listing portal in their country to keep looking for a used car or a home that is not on offer today (Isto Intents protocol, istointents.org). Use intent_publish_intent with the person's own words, the country (ISO code, never a city) and the category. It returns that portal's consentUrl: the USER must open it and confirm with their own e-mail on the portal's site — nothing is watched before that, and their contact stays with that portal. Never ask for or pass the user's e-mail, and never open or fill in the link for them. If several portals fit, ask the user to choose and call again with holder. If none serves the country yet, say so plainly. Keep the returned intentCode in the conversation; use intent_get_intent for the state, intent_list_matches for found listings and intent_withdraw_intent to stop. Show every url unchanged.",
      "tools": [
        {
          "name": "intent_get_intent",
          "title": "State of a forwarded intent",
          "description": "Returns the state of an intent published with intent_publish_intent, as the portal that holds it reports it, and which portal that is. Matches come from the chosen portal's own aggregation of its national market and may be incomplete.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "intentCode": {
                "description": "The intentCode returned by intent_publish_intent.",
                "pattern": "^[A-Za-z0-9_-]{32}$",
                "type": "string"
              }
            },
            "required": ["intentCode"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "found": {
                "type": "boolean"
              },
              "holder": {
                "properties": {
                  "host": {
                    "type": "string"
                  },
                  "operator": {
                    "type": "string"
                  },
                  "title": {
                    "type": "string"
                  }
                },
                "required": ["host", "operator"],
                "type": "object"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["found"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "State of a forwarded intent"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1a75aa59a53dd30ca12e75e4078cd9f33b7e79d56953d69b2f7f54a91aa2fbe6"
        },
        {
          "name": "intent_list_matches",
          "title": "Listings the portal found for a forwarded intent",
          "description": "Returns the listings the portal found for the intent, unchanged — show every url as given. Works once the user has confirmed on the portal's page. Matches come from the chosen portal's own aggregation of its national market and may be incomplete.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "intentCode": {
                "description": "The intentCode returned by intent_publish_intent.",
                "pattern": "^[A-Za-z0-9_-]{32}$",
                "type": "string"
              },
              "since": {
                "description": "Optional ISO time; only matches delivered after it.",
                "type": "string"
              }
            },
            "required": ["intentCode"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "found": {
                "type": "boolean"
              },
              "holder": {
                "properties": {
                  "host": {
                    "type": "string"
                  },
                  "operator": {
                    "type": "string"
                  },
                  "title": {
                    "type": "string"
                  }
                },
                "required": ["host", "operator"],
                "type": "object"
              },
              "matches": {
                "type": "array"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["found"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Listings found for a forwarded intent"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:efa1dcf7e0d06e231aba85bdce7c48ee16a3a32aec71510a33d962d2c0aab2de"
        },
        {
          "name": "intent_publish_intent",
          "title": "Ask a local portal to keep looking for the user (needs the user's confirmation)",
          "description": "Use this when the user wants to be told over time about a used car or a home that is not on offer today, in a given country — e.g. \"let me know until March about an estate car in Portugal under 15 000 €, not diesel\". The wish goes to an independent listing portal that serves that country and has asked to receive wishes this way (Isto Intents registry, istointents.org). It returns that portal's own consentUrl: the USER must open it, enter their own e-mail there and confirm — nothing is watched before that, and the contact stays with that portal. Never ask the user for their e-mail and never open or fill in the link for them. If several portals fit, the answer is outcome \"choose_holder\" with their names: ask the user which one, then call again with holder. If none serves the country yet, the answer is outcome \"no_holder\": tell the user plainly. Send the country only, never a city or address. hiddenLimit is optional and only if the user said it: it is passed once to the portal, sealed there, never stored here or shown to sellers. Matches come from the chosen portal's own aggregation of its national market and may be incomplete.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "buyBy": {
                "description": "Date (YYYY-MM-DD) by which the user wants to buy; watching stops after it.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "category": {
                "description": "vehicle = cars and other road vehicles; property = homes, flats and land.",
                "enum": ["vehicle", "property"],
                "type": "string"
              },
              "country": {
                "description": "Country where the user wants to buy, ISO 3166-1 alpha-2 (e.g. PT, SK, CZ). Country only.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "hiddenLimit": {
                "additionalProperties": false,
                "description": "Optional private maximum price, only if the user stated it.",
                "properties": {
                  "amount": {
                    "maximum": 1000000000,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "currency": {
                    "description": "ISO 4217, e.g. EUR, CZK, PLN",
                    "pattern": "^[A-Za-z]{3}$",
                    "type": "string"
                  }
                },
                "required": ["amount", "currency"],
                "type": "object"
              },
              "holder": {
                "description": "Only after a \"choose_holder\" answer: the host of the portal the user chose.",
                "maxLength": 253,
                "type": "string"
              },
              "niceToHave": {
                "description": "Wishes that are not required (never filters), e.g. \"tow bar, automatic\".",
                "maxLength": 500,
                "type": "string"
              },
              "statement": {
                "description": "What it MUST be, in the user's own words and language, e.g. \"estate car under 15000 €, not diesel\".",
                "maxLength": 500,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["category", "country", "statement"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "consentExpiresAt": {
                "type": "string"
              },
              "consentUrl": {
                "description": "The portal's page where the USER confirms with their own e-mail. Show it unchanged.",
                "type": "string"
              },
              "hiddenLimit": {
                "description": "What happened to the hidden limit. If not passed, tell the user.",
                "enum": ["none", "passed", "currency_not_accepted", "not_supported"],
                "type": "string"
              },
              "holder": {
                "properties": {
                  "host": {
                    "type": "string"
                  },
                  "operator": {
                    "type": "string"
                  },
                  "title": {
                    "type": "string"
                  }
                },
                "required": ["host", "operator"],
                "type": "object"
              },
              "holders": {
                "items": {
                  "properties": {
                    "host": {
                      "type": "string"
                    },
                    "languages": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "operator": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["host", "operator"],
                  "type": "object"
                },
                "type": "array"
              },
              "intentCode": {
                "description": "Keep it in the conversation; use it with intent_get_intent, intent_list_matches and intent_withdraw_intent.",
                "type": "string"
              },
              "notUnderstood": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "outcome": {
                "enum": ["forwarded", "choose_holder", "no_holder"],
                "type": "string"
              },
              "served": {
                "description": "With no_holder: where portals can be reached today.",
                "items": {
                  "properties": {
                    "category": {
                      "type": "string"
                    },
                    "country": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "type": "string"
              },
              "understood": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["outcome"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ask a local portal to keep looking"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:91ddac4ffc4e4068956aa7c77055e5745b96478881052611952189782e367e88"
        },
        {
          "name": "intent_withdraw_intent",
          "title": "Stop a forwarded intent",
          "description": "Stops the intent at the portal immediately; nothing more is sent to the user. Cannot be undone — publishing again needs a new confirmation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "intentCode": {
                "description": "The intentCode returned by intent_publish_intent.",
                "pattern": "^[A-Za-z0-9_-]{32}$",
                "type": "string"
              }
            },
            "required": ["intentCode"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "found": {
                "type": "boolean"
              },
              "holder": {
                "properties": {
                  "host": {
                    "type": "string"
                  },
                  "operator": {
                    "type": "string"
                  },
                  "title": {
                    "type": "string"
                  }
                },
                "required": ["host", "operator"],
                "type": "object"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["found"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Stop a forwarded intent"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:16d277a00dd37339a969c100304785a6d78ed15d739a974a4b7e291d670cb104"
        }
      ],
      "digest": "sha256:730f628da18eb2a3ecd98d9e6938f13c3a9f84d54288c6dcef941b3dc7a73df8"
    }
  }
}
