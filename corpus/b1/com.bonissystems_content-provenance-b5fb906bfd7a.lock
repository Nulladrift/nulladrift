{
  "lockfileVersion": 2,
  "subjects": {
    "com.bonissystems/content-provenance": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bonissystems.com/api/knox/agents/content-provenance/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "content-provenance",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Bonis Content Provenance — anchor any creation event (human-original, AI-generated, or AI-assisted hybrid) to the Knox event chain and receive a provenance bundle (Knox anchor + C2PA-aligned envelope + FRE 902(13)/(14)-shape affidavit). Bitcoin-rolled via OpenTimestamps. Look up any receipt at bonissystems.com.",
      "tools": [
        {
          "name": "anchor_creation",
          "description": "Anchor any creation event to the Knox event chain and return a provenance bundle. Three creation modes are supported: human_original (camera capture, original writing, recording), ai_generated (model + prompt + parameters anchored), and ai_assisted_hybrid (human-AI collaboration with edit chain). Returns the Knox anchor record, a C2PA-aligned envelope, and an FRE 902(13)/(14)-shape affidavit. Bonis Systems anchors what creators present; it does not adjudicate authorship, does not grant copyright, and does not enforce any IP claim. Requires a Knox Bearer API key on the Authorization header — unauthenticated calls are rejected.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ai": {
                "description": "AI-generation metadata (required when source = ai_generated).",
                "properties": {
                  "generatedAt": {
                    "description": "ISO timestamp from the provider.",
                    "type": "string"
                  },
                  "model": {
                    "description": "Model identifier (e.g., openai/sora-2, google/veo-3).",
                    "type": "string"
                  },
                  "parameters": {
                    "description": "Model parameters (hashed in the anchor).",
                    "type": "object"
                  },
                  "prompt": {
                    "description": "Plain-text prompt (will be hashed in the anchor).",
                    "type": "string"
                  },
                  "promptHash": {
                    "description": "Pre-hashed prompt (preferred for privacy).",
                    "type": "string"
                  },
                  "provider": {
                    "description": "Provider name.",
                    "type": "string"
                  },
                  "providerReceiptId": {
                    "description": "Provider's job/run ID.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "contentHash": {
                "description": "SHA-256 digest of the content as 64 lowercase hex chars. The content itself is not transmitted.",
                "pattern": "^[a-fA-F0-9]{64}$",
                "type": "string"
              },
              "contentType": {
                "description": "MIME type (max 128 chars).",
                "type": "string"
              },
              "human": {
                "description": "Human-original metadata (optional when source = human_original).",
                "properties": {
                  "authorClaim": {
                    "description": "Author identity claim (name, DID, etc.).",
                    "type": "string"
                  },
                  "captureAt": {
                    "description": "ISO timestamp of capture.",
                    "type": "string"
                  },
                  "captureLocation": {
                    "description": "Location string; hashed before anchoring.",
                    "type": "string"
                  },
                  "captureMethod": {
                    "description": "Camera / device / instrument used.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "hybrid": {
                "description": "Hybrid-creation metadata (required when source = ai_assisted_hybrid).",
                "properties": {
                  "ai": {
                    "description": "Optional AI metadata (same shape as 'ai').",
                    "type": "object"
                  },
                  "aiContribution": {
                    "description": "Description of the AI's role.",
                    "type": "string"
                  },
                  "editChain": {
                    "description": "Optional edit-history entries; hashed.",
                    "items": {
                      "properties": {
                        "at": {
                          "type": "string"
                        },
                        "description": {
                          "type": "string"
                        }
                      },
                      "required": ["at", "description"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "humanContribution": {
                    "description": "Description of the human creative role.",
                    "type": "string"
                  }
                },
                "required": ["aiContribution", "humanContribution"],
                "type": "object"
              },
              "name": {
                "description": "Display name for the work (max 256 chars).",
                "type": "string"
              },
              "sizeBytes": {
                "description": "Content size in bytes.",
                "minimum": 0,
                "type": "integer"
              },
              "source": {
                "description": "Creation source.",
                "enum": ["human_original", "ai_generated", "ai_assisted_hybrid"],
                "type": "string"
              }
            },
            "required": ["contentHash", "name", "source"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:937ced3908d8c4afc7a80ea4bb7cf9bb4092af0841a2912600c297c3a12dbc5a"
        },
        {
          "name": "verify_provenance",
          "description": "Verify an anchored content-provenance record. Given a SHA-256 anchor hash (the payload_hash from a prior anchor_creation call), return the anchor record, predecessor hash, sequence number, and timestamp. Public — no authentication required. The verification path itself is also accessible at GET /api/knox/verify?hash=<hash>.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hash": {
                "description": "SHA-256 anchor hash (64 lowercase hex chars).",
                "pattern": "^[a-fA-F0-9]{64}$",
                "type": "string"
              }
            },
            "required": ["hash"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ac536e913872d70913af3b0c2f67fe3555d7172124c8a93682161762c3249d3f"
        }
      ],
      "digest": "sha256:423d381e8571973f0af48f27a5c09782db04394ca1b51bdc055a78b4eaa1a85e"
    }
  }
}
