        {
          "name": "get_new_arrivals",
          "title": "New Arrivals",
          "description": "Browse the latest new arrivals on Realry.com, sorted by newest first. Optionally filter by keyword, price, gender, or color.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "Brand name or slug, e.g. \"Nike\", \"new-balance\". Also keep the brand in query together with the model (query \"le labo santal 33\", brand \"Le Labo\"): an unknown brand is dropped, and query then still finds it.",
                "type": "string"
              },
              "category": {
                "description": "Top-level category. Set it only when the shopper asked for a whole category (\"show me bags\") or query alone is ambiguous; leave it unset when query already names the product type. ACC = accessories, jewellery, watches, eyewear, hats, fragrance and beauty.",
                "enum": ["CLOTHING", "SHOES", "BAG", "ACC"],
                "type": "string"
              },
              "colors": {
                "description": "Colour filter, English colour names, comma-separated (e.g. \"black\" or \"black,white\"). Use this instead of putting the colour in query.",
                "type": "string"
              },
              "country": {
                "description": "Two-letter market code deciding shipping availability, prices and currency. Defaults to US when omitted or unrecognised. Pass the shopper's own country — prices and stock differ per market.",
                "enum": ["AE", "AU", "CA", "DE", "ES", "FR", "GB", "HK", "ID", "IE", "IN", "IT", "JP", "KR", "NL", "SG", "US"],
                "type": "string"
              },
              "gender": {
                "description": "Who the item is for. Use this instead of writing \"women's\"/\"men's\" in query.",
                "enum": ["women", "men", "kids"],
                "type": "string"
              },
              "min_discount": {
                "description": "Minimum discount percentage (e.g. 30 for 30% off or more)",
                "type": "number"
              },
              "page": {
                "description": "Page number (default: 1)",
                "type": "number"
              },
              "page_length": {
                "description": "Results per page (default: 5, max: 36)",
                "type": "number"
              },
              "price_max": {
                "description": "Maximum price in the market currency for `country` (USD for US, GBP for GB, EUR for euro markets, JPY for JP, KRW for KR). Put shopper-stated limits here (e.g. \"under $100\"), not in query.",
                "type": "number"
              },
              "price_min": {
                "description": "Minimum price in the market currency for `country` (USD for US, GBP for GB, EUR for euro markets, JPY for JP, KRW for KR). Put shopper-stated limits here (e.g. a floor of $50), not in query.",
                "type": "number"
              },
              "query": {
                "description": "Optional product as a short noun phrase, 1-4 words (e.g. \"sneakers\", \"wool coat\"). No gender, price, colour or filler words — use the other parameters.",
                "type": "string"
              },
              "sale_only": {
                "description": "Show sale items only",
                "type": "boolean"
              },
              "sort": {
                "description": "Sort order. Omit for best match (default). \"new\" (newest), \"likes\" (most liked), \"views\" (most viewed), \"sales\" (highest discount), \"pricelow\" (cheapest first), \"pricehigh\" (most expensive first).",
                "type": "string"
              }
            },
            "type": "object"
