      "tools": [
        {
          "name": "compare_products",
          "title": "Compare Products",
          "description": "Compare multiple fashion products side-by-side on Realry.com — shows best price, discount rate, and number of stores for each. Use Product IDs from search_products results. Ideal for \"which is cheaper?\" or \"help me decide between these\" questions.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Two-letter market code deciding shipping availability, prices and currency. Defaults to US when omitted or unrecognised. Pass the shopper's own country — prices and stock differ per market.",
                "enum": ["AE", "AU", "CA", "DE", "ES", "FR", "GB", "HK", "ID", "IE", "IN", "IT", "JP", "KR", "NL", "SG", "US"],
                "type": "string"
              },
              "product_ids": {
                "description": "List of 2–5 Product IDs to compare (shown as \"Product ID: `xxx`\" in search results)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["product_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6212c167a001c14acdbaa0762584a8ee6f52082ac16beebfcda424d6bd88b4d5"
        },
