{
  "lockfileVersion": 2,
  "subjects": {
    "com.blueteamjobs/jobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.blueteamjobs.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "blueteamjobs",
        "title": "BlueTeamJobs",
        "version": "1.0.0",
        "websiteUrl": "https://blueteamjobs.com/mcp/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Search open defensive cybersecurity (blue team) jobs and salary data from BlueTeamJobs. Offensive roles such as penetration testing are not listed. Always give the user the job page link from the results; that page has the full description and the apply button.",
      "tools": [
        {
          "name": "get_job",
          "title": "Get a job",
          "description": "Details of one job: pay, location, clearance, certifications, skills and a short excerpt.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "The 6-character job id, or a blueteamjobs.com job URL.",
                "maxLength": 300,
                "minLength": 6,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a job"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:26e0bad528029b6eda4aa9c487347cbaa0177b62e418681a1bd851c86bc84ed4"
        },
        {
          "name": "get_salary_stats",
          "title": "Blue team salary statistics",
          "description": "Pay percentiles (USD a year) from salaries published in BlueTeamJobs postings over the last 12 months, by role, US state, seniority or work arrangement. Needs at least 3 postings with pay.",
          "inputSchema": {
            "properties": {
              "remote": {
                "enum": ["remote", "hybrid", "onsite"],
                "type": "string"
              },
              "role": {
                "description": "Role slug or name. Omit for all blue team roles.",
                "maxLength": 80,
                "type": "string"
              },
              "seniority": {
                "enum": ["entry", "mid", "senior", "lead"],
                "type": "string"
              },
              "state": {
                "description": "US state name, code or slug, e.g. \"Texas\", \"TX\".",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Blue team salary statistics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0b1b3dfe5f33335ada8e356f97c17e7540534ca7d1b257e74dc19c5e898e986a"
        },
        {
          "name": "latest_jobs",
          "title": "Latest blue team jobs",
          "description": "Jobs first seen on BlueTeamJobs in the last few days, newest first, optionally for one role.",
          "inputSchema": {
            "properties": {
              "days": {
                "default": 7,
                "description": "How far back to look.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "remote": {
                "enum": ["remote", "hybrid", "onsite"],
                "type": "string"
              },
              "role": {
                "description": "Role slug or name, e.g. \"soc-analyst\". See list_roles.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Latest blue team jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1cf64e255e96b57189f235c18e002cb99e9eb14a074d4bef9f157f35148de228"
        },
        {
          "name": "list_locations",
          "title": "List job locations",
          "description": "Places with open jobs (countries, US states and cities), most jobs first, plus the remote count.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 30,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "role": {
                "description": "Role slug or name, e.g. \"soc-analyst\". See list_roles.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List job locations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:104d1d4ccdbb7180fad2c671fc5b87a075ca4db7405cd5fb4be32865fa814614"
        },
        {
          "name": "list_roles",
          "title": "List blue team roles",
          "description": "The role categories BlueTeamJobs uses, with open job counts. Use the slugs in other tools.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List blue team roles"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:701ef60c03f35eec6d137849610102b2ec875c7d14d8d18ace3be892f939fe04"
        },
        {
          "name": "search_jobs",
          "title": "Search blue team jobs",
          "description": "Search open defensive cybersecurity jobs (SOC, incident response, DFIR, threat hunting, CTI, detection and security engineering) on BlueTeamJobs. Newest first. Each result links to the job page, where the user applies.",
          "inputSchema": {
            "properties": {
              "certification": {
                "description": "Certification slug or name, e.g. \"security-plus\", \"GCIH\".",
                "maxLength": 40,
                "type": "string"
              },
              "clearance": {
                "description": "\"none\" for jobs without a clearance, \"any\" for any clearance, or a specific level.",
                "enum": ["none", "any", "public-trust", "secret", "top-secret", "ts-sci"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "City, US state, state code or country, e.g. \"Virginia\", \"VA\", \"austin-tx\", \"Canada\".",
                "maxLength": 80,
                "type": "string"
              },
              "min_salary": {
                "description": "Minimum yearly pay in USD; only jobs that publish pay match.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords matched against title, company, description and skills.",
                "maxLength": 200,
                "type": "string"
              },
              "remote": {
                "description": "Work arrangement.",
                "enum": ["remote", "hybrid", "onsite"],
                "type": "string"
              },
              "role": {
                "description": "Role slug or name, e.g. \"soc-analyst\". See list_roles.",
                "maxLength": 80,
                "type": "string"
              },
              "seniority": {
                "enum": ["entry", "mid", "senior", "lead"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search blue team jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b22576867f2e20a6191c1e5dd82c256b00c70b802b4c002eb2139dcfd67adc3e"
        }
      ],
      "digest": "sha256:84a630d275d21fd46f53705fa56fe67e28ac865881ee7f810e9b06a19fbc513c"
    }
  }
