{
  "lockfileVersion": 2,
  "subjects": {
    "ai.wondel/flightaware": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.wondel.ai/flightaware/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "FlightAware",
        "title": "FlightAware MCP",
        "version": "1.0.0",
        "description": "Live flight status and scheduled-route search via the official FlightAware AeroAPI.",
        "websiteUrl": "https://mcps.wondel.ai/servers/flightaware/",
        "icons": [
          {
            "src": "https://mcps.wondel.ai/favicon.svg",
            "mimeType": "image/svg+xml"
          },
          {
            "src": "https://mcps.wondel.ai/logo-96-inverse.png",
            "mimeType": "image/png",
            "sizes": ["96x96"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Data from FlightAware (AeroAPI) (https://www.flightaware.com) for this one query. Attribute it to that source, keep the original links and do not present it as Wondel.ai's; all rights stay with the source operator. Have the user verify prices and availability at the source. For the user's personal use, not bulk extraction or redistribution. Unofficial, as-is. Terms: https://mcp.wondel.ai/legal.txt; contact: support@wondel.ai.",
      "tools": [
        {
          "name": "flightaware_flight_status",
          "title": "FlightAware flight status (AeroAPI)",
          "description": "Live or planned status of a flight via the official FlightAware AeroAPI: times (scheduled/estimated/actual), delays, gates/terminals, aircraft, progress, cancelled/diverted flags, plus flightaware.com tracking links. Operational data, not prices. Requires the FLIGHTAWARE_API_KEY secret; each call bills AeroAPI usage.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "ident": {
                "description": "Flight ident: IATA number (LO281), ICAO number (BAW123), or tail/registration (SP-LVD).",
                "minLength": 1,
                "type": "string"
              },
              "max_pages": {
                "description": "AeroAPI pagination cap — how many result pages to fetch (each page bills separately). Default 1.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "no_cache": {
                "description": "Force a fresh AeroAPI fetch and bypass this server's result cache. Default false.",
                "type": "boolean"
              }
            },
            "required": ["ident"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:127cd06daa079b564010551d8d24f6f4068287d5f8d6935d0ef891ef2751aede"
        },
        {
          "name": "flightaware_search_scheduled",
          "title": "FlightAware scheduled flights on a route (AeroAPI)",
          "description": "Scheduled (future) flights between two airports in a date window via the official FlightAware AeroAPI /schedules endpoint: ident, operator, scheduled out/in times and aircraft type per flight. Use it to see what actually flies a route on given days; it returns no prices. Requires the FLIGHTAWARE_API_KEY secret; each call bills AeroAPI usage.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date_end": {
                "description": "Window end date, YYYY-MM-DD (exclusive per AeroAPI semantics).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "date_start": {
                "description": "Window start date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "destination": {
                "description": "Destination airport IATA or ICAO code.",
                "minLength": 3,
                "type": "string"
              },
              "max_pages": {
                "description": "AeroAPI pagination cap — how many result pages to fetch (each page bills separately). Default 1.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "no_cache": {
                "description": "Force a fresh AeroAPI fetch and bypass this server's result cache. Default false.",
                "type": "boolean"
              },
              "origin": {
                "description": "Origin airport IATA or ICAO code (e.g. WAW or EPWA).",
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["date_end", "date_start", "destination", "origin"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a0376288934e951b936021fe4b488c61256ea5edd39057fb322f22b719645b96"
        }
      ],
      "digest": "sha256:084a829ff4c6dbb7e854e4292e863b3aaa7a448cf6c831189a81578c1ccd47d6"
    }
  }
}
