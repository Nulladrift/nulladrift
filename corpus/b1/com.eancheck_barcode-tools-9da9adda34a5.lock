{
  "lockfileVersion": 2,
  "subjects": {
    "com.eancheck/barcode-tools": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://eancheck.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "eancheck",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Barcode and GS1 tools from eancheck.com. Every tool computes its answer from the input with the GS1 General Specifications rules; nothing is looked up in a product database, so the tools cannot say which product or company a number belongs to. Use validate_gtins for complete numbers and calculate_check_digits for numbers without their last digit. identify_code tells what an unknown code is. Each answer ends with a link to the matching page on eancheck.com.",
      "tools": [
        {
          "name": "barcode_size",
          "description": "Give the printed size of a barcode type at a GS1 magnification (retail and carton types) or an X-dimension, with the GS1 allowed range.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "magnification": {
                "description": "GS1 types: size in percent",
                "type": "number"
              },
              "type": {
                "description": "Barcode type",
                "enum": ["upc-a", "ean-13", "ean-8", "itf-14", "code-128", "code-39", "code-93", "interleaved-2-of-5", "codabar", "msi", "pharmacode", "data-matrix", "pdf417", "aztec"],
                "type": "string"
              },
              "x_mm": {
                "description": "Other types: narrowest bar width in mm",
                "type": "number"
              }
            },
            "required": ["type"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0ec69bcebfb37464166e6377a90df07b1d032aa80d6a8197b9c6e077eddaf721"
        },
        {
          "name": "calculate_check_digits",
          "description": "Add the GS1 check digit to GTIN numbers that are missing it (7, 11, 12 or 13 digits become GTIN-8, UPC-A, EAN-13 or GTIN-14). One number per line or comma separated.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "codes": {
                "description": "Numbers without their check digit, one per line",
                "type": "string"
              }
            },
            "required": ["codes"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a9d2772525b152afdab247ff61b77d5ec13e313f0e123b2cb4ae210758b2d930"
        },
        {
          "name": "check_amazon_code",
          "description": "Read the code from an Amazon sticker: tells an LPN (License Plate Number) from an FNSKU, ASIN, FBA box label, Amazon Logistics tracking number or UPC/EAN, and explains each part. It cannot look up which product a code belongs to.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "code": {
                "description": "The code as printed on the sticker, e.g. LPN RR AB1234567",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8b6784bbb20db064b98807577d0634ac7fa53b2cd05b4131b57a0991e986f4fc"
        },
        {
          "name": "convert_isbn",
          "description": "Convert an ISBN-10 to ISBN-13 or back, with the check digit recalculated and the hyphenated form. ISBN-13 starting with 979 has no ISBN-10.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "isbn": {
                "description": "An ISBN-10 or ISBN-13, with or without hyphens",
                "type": "string"
              }
            },
            "required": ["isbn"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5cdbe241bc763c91ceba205fc8f91c9ff31eeb2eee3461ea1f5a8e5ab173e2d4"
        },
        {
          "name": "convert_upc_e",
          "description": "Convert a UPC-E (6, 7 or 8 digits) to the full 12-digit UPC-A, or a UPC-A to UPC-E when one of the four GS1 zero-suppression rules fits. Checks the check digit.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "code": {
                "description": "A UPC-E or a UPC-A, digits only",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e61986ba5f8aec3259fcac3065fe489cdf6d2a85a7eb9d1164a744db76efc182"
        },
        {
          "name": "identify_code",
          "description": "Find out what kind of code a string is: GTIN, ISBN, ISSN, SSCC, GLN, GS1-128 data, GS1 Digital Link, VIN, IMEI, ASIN, Amazon LPN or FNSKU, with its check digit status.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "code": {
                "description": "The code exactly as printed or scanned",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5e7faf9abb40d347b0c04c7b9844d5fb89280c8d135191d39f1672c0156d36cd"
        },
        {
          "name": "make_barcode",
          "description": "Draw a print-ready barcode and return it as SVG (or EPS) in millimetres, plus a link that opens it in the generator. Types: upc-a, ean-13, ean-8, itf-14, code-128, code-39, code-93, interleaved-2-of-5, codabar, msi, pharmacode, data-matrix, pdf417, aztec. GS1 retail types use magnification 80 to 200 (percent).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "format": {
                "description": "File format, default svg",
                "enum": ["svg", "eps"],
                "type": "string"
              },
              "gs1": {
                "description": "Data Matrix only: treat the value as GS1 data like (01)09506000134352(17)271231",
                "type": "boolean"
              },
              "magnification": {
                "description": "GS1 types only: size in percent, 100 is the standard size",
                "type": "number"
              },
              "type": {
                "description": "Barcode type",
                "enum": ["upc-a", "ean-13", "ean-8", "itf-14", "code-128", "code-39", "code-93", "interleaved-2-of-5", "codabar", "msi", "pharmacode", "data-matrix", "pdf417", "aztec"],
                "type": "string"
              },
              "value": {
                "description": "The data. GTIN types accept the number without its check digit.",
                "type": "string"
              },
              "x_mm": {
                "description": "Other types: narrowest bar or module width in mm",
                "type": "number"
              }
            },
            "required": ["type", "value"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:312a5e0c688cd07255350167a0a947b50246afc81d9273e4ff41775b4bae0198"
        },
        {
          "name": "parse_gs1",
          "description": "Split GS1 data (GS1-128, GS1 DataMatrix, Digital Link) into its Application Identifiers, with the name of each AI and any format error.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "data": {
                "description": "GS1 data such as (01)09506000134352(17)271231(10)ABC123, FNC1 form or a Digital Link URL",
                "type": "string"
              }
            },
            "required": ["data"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f69c7e16050dcc61130d3aaf89e02625c24eee725b317a4da6169fa4909a9fa3"
        },
        {
          "name": "repair_gtin",
          "description": "Recover a GTIN with unreadable digits: mark each unknown digit with ? or * and get every number that passes the GS1 check digit.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "code": {
                "description": "The GTIN with ? or * for each unknown digit, e.g. 59012341?3457",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bcee727d207d56e2e279164490aad931da5529c2e9d1b7caaab8faaab2e17841"
        },
        {
          "name": "validate_gtins",
          "description": "Check complete GTIN, EAN, UPC and ITF-14 numbers: says for each one whether the check digit is right and which GTIN length it is.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "codes": {
                "description": "Complete numbers, one per line or comma separated",
                "type": "string"
              }
            },
            "required": ["codes"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:646cc77bfb1a4fb3f538c043c0f1aaba671f4da246c712d3a8dff9994c3c082f"
        }
      ],
      "digest": "sha256:1748a0de128245031baaa743587c4fa5b55019158f5600bcb90827716e635edc"
    }
  }
}
