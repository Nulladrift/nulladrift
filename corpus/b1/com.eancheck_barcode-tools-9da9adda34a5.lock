          },
          "digest": "sha256:5e7faf9abb40d347b0c04c7b9844d5fb89280c8d135191d39f1672c0156d36cd"
        },
        {
          "name": "julian_date",
          "description": "Convert a day-number date code (a \"Julian date\" on packaging: DDD, YDDD, YYDDD, CYYDDD or YYYYDDD) or an astronomical Julian Date (JD, MJD) to a calendar date, or a calendar date to every code form. Give `code` or `date`, not both. Dates from 1583-01-01 to 9999-12-31. A code that is not a date gets an error and a hint, not a guess. An answer for a code with a year in it says how old the date is, counted from `today`; for a three-digit code, the day this year once it has come.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "code": {
                "description": "One code as printed: 3 digits (day of year, as on egg cartons), 4 (last digit of year + day), 5 (two-digit year + day), 6 (JD Edwards CYYDDD) or 7 (four-digit year + day). A separator between year and day is allowed (25-319, 2025-319, 2025.319). Letters around one group of digits are left out (\"LOT 25319 B2\" reads 25319); two groups of digits (\"042 155\") are refused as two codes. For an astronomy number send the decimals (2460994.5) or put JD or MJD in front (MJD 61360). One code per call.",
                "type": "string"
              },
              "date": {
                "description": "A Gregorian calendar date as YYYY-MM-DD, from 1583-01-01 to 9999-12-31, to get its day number and codes.",
                "type": "string"
              },
              "today": {
                "description": "Optional, YYYY-MM-DD, from 1583-01-01 to 9999-12-31 (default: today in UTC). The date a one-digit or two-digit year is read against, and the date the age of the result is counted from. A two-digit year is read as a year from today minus 89 years to today plus 10, moved to stay inside 1583 to 9999; a one-digit year as the latest year ending in that digit, not after this year. Set it to the date the item was handled when the code is old.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e648cf1b9e81834210e512d5a4772344130fa4d6e466311e48f0221874bb5f62"
        },
        {
          "name": "make_barcode",
          "description": "Draw a print-ready barcode and return it as SVG (or EPS) in millimetres, plus a link that opens it in the generator. Types: upc-a, ean-13, ean-8, itf-14, code-128, code-39, code-93, interleaved-2-of-5, codabar, msi, pharmacode, data-matrix, pdf417, aztec. GS1 retail types use magnification 80 to 200 (percent).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "format": {
                "description": "File format, default svg",
                "enum": ["svg", "eps"],
                "type": "string"
              },
              "gs1": {
                "description": "Data Matrix only: treat the value as GS1 data like (01)09506000134352(17)271231",
                "type": "boolean"
              },
              "magnification": {
                "description": "GS1 types only: size in percent, 100 is the standard size",
                "type": "number"
              },
              "type": {
                "description": "Barcode type",
                "enum": ["upc-a", "ean-13", "ean-8", "itf-14", "code-128", "code-39", "code-93", "interleaved-2-of-5", "codabar", "msi", "pharmacode", "data-matrix", "pdf417", "aztec"],
                "type": "string"
              },
              "value": {
                "description": "The data. GTIN types accept the number without its check digit.",
                "type": "string"
              },
              "x_mm": {
                "description": "Other types: narrowest bar or module width in mm",
                "type": "number"
              }
            },
            "required": ["type", "value"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:312a5e0c688cd07255350167a0a947b50246afc81d9273e4ff41775b4bae0198"
        },
