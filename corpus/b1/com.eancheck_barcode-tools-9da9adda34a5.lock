      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "eancheck",
        "version": "1.0.4"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Barcode, GS1, freight and date-code tools from eancheck.com. Every tool computes its answer from the input; nothing is looked up in a product database, so the tools cannot say which product or company a number belongs to. The barcode tools follow the GS1 General Specifications. freight_class works out density and the LTL freight class on the NMFC density scale with 13 steps, in force since 2025-07-19; it does not look up NMFC items or rates. cbm_calculator works out the volume of a shipment in cubic metres and cubic feet, the share of a 20 ft, 40 ft or high cube container it fills and the chargeable weight; its container capacities are typical figures and each carrier sets its own divisor. julian_date reads day-number date codes (DDD, YDDD, YYDDD, CYYDDD, YYYYDDD) and astronomical Julian Dates; a one-digit or two-digit year is read against today's date, so pass `today` when the code is old. shelf_life_calculator gives the expiry date, the production date or the shelf life from the other two, adding calendar months (a missing month end becomes the last day of the month), reads printed and GS1 dates, and gives the days and percent left on a check date; it does not know how long a product keeps. Use validate_gtins for complete numbers and calculate_check_digits for numbers without their last digit. identify_code tells what an unknown code is. Each answer ends with a link to the matching page on eancheck.com.",
      "tools": [
        {
          "name": "barcode_size",
          "description": "Give the printed size of a barcode type at a GS1 magnification (retail and carton types) or an X-dimension, with the GS1 allowed range.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "magnification": {
                "description": "GS1 types: size in percent",
                "type": "number"
              },
              "type": {
                "description": "Barcode type",
                "enum": ["upc-a", "ean-13", "ean-8", "itf-14", "code-128", "code-39", "code-93", "interleaved-2-of-5", "codabar", "msi", "pharmacode", "data-matrix", "pdf417", "aztec"],
                "type": "string"
              },
              "x_mm": {
                "description": "Other types: narrowest bar width in mm",
                "type": "number"
              }
            },
            "required": ["type"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0ec69bcebfb37464166e6377a90df07b1d032aa80d6a8197b9c6e077eddaf721"
        },
        {
          "name": "calculate_check_digits",
          "description": "Add the GS1 check digit to GTIN numbers that are missing it (7, 11, 12 or 13 digits become GTIN-8, UPC-A, EAN-13 or GTIN-14). One number per line or comma separated.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "codes": {
                "description": "Numbers without their check digit, one per line",
                "type": "string"
              }
            },
            "required": ["codes"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a9d2772525b152afdab247ff61b77d5ec13e313f0e123b2cb4ae210758b2d930"
        },
        {
          "name": "cbm_calculator",
          "description": "Work out the volume of a shipment in cubic metres (CBM) and cubic feet, how much of a 20 ft, 40 ft, 40 ft high cube and 45 ft high cube dry container it fills, how many pieces of one size go into each container by size, and, when weights are given, the chargeable weight for air freight (divisor 6000), courier (5000) and sea freight LCL (1 m3 = 1000 kg). Each line is one piece size: length x width x height, optionally x quantity, optionally x weight of one piece. Up to 20 lines. A malformed line, unit or divisor gets an error, not a volume.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "divisor": {
                "description": "Optional. The carrier's own volumetric divisor in cubic centimetres per kilogram, for example 4000. Adds one more chargeable weight to the answer. From 100 to 100000.",
                "type": ["string", "number"]
              },
              "lines": {
                "description": "One line per piece size, as LxWxH, LxWxHxQUANTITY or LxWxHxQUANTITYxWEIGHT (3 to 5 values), for example 60x40x50x10x12 for ten cartons of 60 by 40 by 50 at 12 each. The separator inside a line is x, X, × or *. Separate lines with a new line or a semicolon (a comma followed by a space and the next line works too). A comma between digits inside a value is a decimal comma (47,5 is 47.5), with two exceptions that get an error, not a volume: a comma followed by exactly three digits (1,250 could be 1250 or 1.25: send one of them without the comma), and a comma that could also be a line break. Write decimals with a point to be safe. WEIGHT is the weight of one piece. At most 20 lines: put pieces of the same size on one line with a quantity.",
                "type": "string"
              },
              "may_turn": {
                "description": "Optional. true when a piece may be laid on its side for the count by size. Default false: the third value of each line stays the height, as for a loaded pallet or a this-side-up carton.",
                "type": "boolean"
              },
              "size_unit": {
                "description": "Unit of the sizes: mm, cm, m, in or ft (also the full names; any case). Default cm.",
                "type": "string"
              },
              "weight_unit": {
                "description": "Unit of the weights: kg or lb (also kgs, kilogram(s), lbs, pound(s); any case). Default kg.",
                "type": "string"
              }
            },
            "required": ["lines"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a76d5bb64ed80fea0a49625dca5deb035e64b78e4d1734f4a72fba249adc8d23"
        },
