        {
          "name": "freight_class",
          "description": "Work out the density (pounds per cubic foot) and the freight class of a US LTL shipment on the NMFC density scale with 13 steps, in force since 2025-07-19. Each line is one piece size: length x width x height x weight of one piece, and optionally x number of pieces. Up to 20 lines. A malformed line or unit gets an error, not a class.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "lines": {
                "description": "One line per piece size, as LxWxHxWEIGHT or LxWxHxWEIGHTxPIECES (4 or 5 values), for example 48x40x48x500 or 24x18x12x30x3. The separator inside a line is x, X, × or *. Separate lines with a new line, a semicolon, or a comma followed by the next line (48x40x48x500, 24x18x12x30x3). A decimal comma inside a value is read as a decimal point (47,5 is 47.5). At most 20 lines: put pieces of the same size on one line with a piece count.",
                "type": "string"
              },
              "size_unit": {
                "description": "Unit of the sizes: in or cm (also inch, inches, centimeter(s), centimetre(s); any case). Default in.",
                "type": "string"
              },
              "weight_unit": {
                "description": "Unit of the weights: lb or kg (also lbs, pound(s), kgs, kilogram(s); any case). Default lb.",
                "type": "string"
              }
            },
            "required": ["lines"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
