      },
      "transport": {
        "type": "http",
        "url": "https://business-contact-finder-mcp.ottobot2025.workers.dev/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "business-contact-finder",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "check_contact_path",
          "description": "Given a business website URL, report how a human is meant to make contact and whether that path is actually reachable. Returns a verdict of 'reachable' or 'inconclusive', the forms found with their resolved handler URLs, and any published phone or email. Never submits anything. Answers 'inconclusive' rather than guessing when a site is client-rendered, bot-protected or parked -- about 64% of real sites cannot be judged from outside, and a confident wrong answer is worse than an honest one.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "The business website URL, e.g. https://example.com",
                "pattern": "^https?://",
                "patternMessage": "url must be an absolute http(s) URL",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a4789518369d09247c49fee1fb0fe142bbbbd88d6cf8aa675db7c54fda883797"
        }
      ],
      "digest": "sha256:0cb0f23d4e4d8dcd80e0aa01eb0be7a4e4f1968719981f7dadee5cbf42324970"
    }
  }
