                    "type": "integer"
                  },
                  "total_potential": {
                    "type": "integer"
                  },
                  "total_realized": {
                    "type": "integer"
                  }
                },
                "required": ["held_back_pending", "held_back_settled", "immediate", "total_potential", "total_realized"],
                "type": "object"
              },
              "escrow_pending": {
                "additionalProperties": false,
                "properties": {
                  "cashback": {
                    "type": "integer"
                  },
                  "held_back": {
                    "type": "integer"
                  },
                  "total": {
                    "type": "integer"
                  }
                },
                "required": ["cashback", "held_back", "total"],
                "type": "object"
              },
              "total_earnings": {
                "type": "integer"
              },
              "usdc_wallet_balance": {
                "type": "string"
              }
            },
            "required": ["cashback", "commission", "escrow_pending", "total_earnings"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:32c3665281d162f2822a6650bada29af26f22d2ba329aaa904cac41df526bc23"
