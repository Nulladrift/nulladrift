{
  "lockfileVersion": 2,
  "subjects": {
    "ai.buildwithorbit/orbit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.buildwithorbit.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "fabric-gateway",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "integrate",
          "description": "Get integration details for public endpoints and MCPs from `search` results. Provide a `task` describing what you want to accomplish and up to 10 `resources` — each with an `id` and `type` taken from the matching search result's `resourceType`. Returns a task brief covering authentication, base URLs, request steps, parameters, expected responses, dependencies between steps, and other important considerations.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "clientName": {
                "description": "Name of the client application or agent invoking this tool (e.g. \"cursor/composer-2.5\", \"claude/sonnet-4.6\", \"codex/gpt-5.6-sol\"). Used for anonymous usage analytics.",
                "maxLength": 128,
                "minLength": 1,
                "pattern": "^[^\\r\\n]+$",
                "type": "string"
              },
              "resources": {
                "description": "Up to 10 endpoints or MCPs to integrate. Each entry needs an `id` and `type` from a search result (`type` is the result's `resourceType`).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "description": "Resource id from a search result's `id` field.",
                      "maxLength": 256,
                      "minLength": 1,
                      "type": "string"
                    },
                    "type": {
                      "description": "Resource type from a search result's `resourceType` field (`endpoint` or `mcp`).",
                      "maxLength": 64,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["id", "type"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "task": {
                "description": "What you want to accomplish with the selected resources (max 512 characters).",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["resources", "task"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:71cc859d909bb3d5cae5961e857535e5d5d1ca65b85f20a2a12bbf2aea0e1f6b"
        },
        {
          "name": "search",
          "description": "Find and evaluate public API endpoints and MCPs that match your query. Set `q` to a natural language query, keywords, an API name, or a question — results are matched by meaning and keyword; each result includes `id`, `resourceType` (`endpoint` or `mcp`), `name`, `description`, `method` (for an `endpoint`) or `transport` (for an `mcp`), `url`, and `evaluateGuide` — an evaluation of what the endpoint or MCP does, when to use it, and its limitations. Review `evaluateGuide` to pick the best fit, then pass each chosen result's `id` and `resourceType` (as `type`) to `integrate`. Paginate with `cursor` from `meta.nextCursor` (`limit` defaults to 10, max 25; pagination stops at 40 results total). No authentication required.\n\nBest practices for querying:\n- Use focused keyword queries that include the product or provider name along with the endpoint details, for example \"PayPal create invoice\".\n- Alternatively, use natural language queries such as \"PayPal API to create an invoice\".\n- Avoid jumbled queries that cram many unrelated keywords into a single query, for example \"paypal invoice payment delivery payments ordering\".\n- Avoid OR-separated queries such as \"paypal invoice OR paypal create invoice OR paypal OR invoice creation\".\n- If you need to explore multiple intents, try each as a separate call.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "clientName": {
                "description": "Name of the client application or agent invoking this tool (e.g. \"cursor/composer-2.5\", \"claude/sonnet-4.6\", \"codex/gpt-5.6-sol\"). Used for anonymous usage analytics.",
                "maxLength": 128,
                "minLength": 1,
                "pattern": "^[^\\r\\n]+$",
                "type": "string"
              },
              "cursor": {
                "description": "Pagination cursor from a prior response's `meta.nextCursor`. Omit for the first page.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Results per page (default 10, max 25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Free-text search: a natural language query, keywords, an API name, or a question (e.g. \"weather forecast\", \"twilio\", \"Add tracking details for an existing paypal order\"). Matched by meaning and keyword.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bfc8a2568841d54b85cf90d494a1e966046678a46074118b610ad18c8c524cf4"
        }
      ],
      "digest": "sha256:64718922cee1d02f7d87d3107b455c0e566d7bc4ad48015db9aaeb6f8514d633"
    }
  }
}
