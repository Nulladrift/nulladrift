        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.kooma.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "kooma",
        "title": "Kooma — IA bambara",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Kooma donne acces a la synthese vocale et a la traduction en bambara. Appelle kooma_list_voices avant kooma_text_to_speech : les identifiants de voix varient d'un compte a l'autre.",
      "tools": [
        {
          "name": "kooma_list_voices",
          "description": "Liste les voix bambara disponibles pour la synthese vocale, avec leur identifiant, leur nom et leur genre. A appeler avant kooma_text_to_speech : les identifiants varient d'un compte a l'autre et ne doivent jamais etre codes en dur.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9bb959fa514e58a4e2075363c132e362ebed22b6d9641d7c8f39a439884e868f"
        },
        {
          "name": "kooma_text_to_speech",
          "description": "Transforme un texte en audio avec une voix bambara. Renvoie l'audio. Utiliser kooma_list_voices pour obtenir un identifiant de voix valide.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "format": {
                "default": "wav",
                "description": "Format de sortie. wav est sans perte, mp3 est plus leger.",
                "enum": ["wav", "mp3"],
                "type": "string"
              },
              "text": {
                "description": "Le texte a lire a voix haute.",
                "type": "string"
              },
              "voice": {
                "description": "Identifiant de voix, obtenu via kooma_list_voices.",
                "type": "string"
              }
            },
            "required": ["text", "voice"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:22aa10c4c08835d93f3116713d8d9834ebe7a477b291e7b4f1102483b32ab553"
        },
        {
          "name": "kooma_translate",
          "description": "Traduit un texte entre le bambara et 13 autres langues. Les codes de langue combinent langue et ecriture : bam_Latn (bambara), fra_Latn (francais), eng_Latn (anglais), et ainsi de suite.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "source": {
                "description": "Code de la langue source. Facultatif : detecte sinon.",
                "type": "string"
              },
              "target": {
                "description": "Code de la langue cible, par exemple bam_Latn.",
                "type": "string"
              },
              "text": {
                "description": "Le texte a traduire.",
                "type": "string"
              }
            },
            "required": ["target", "text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bd270534c7da9ddf56b2b43d97833829ba60c93bcb97298601b519d232d0bcb6"
        }
      ],
      "digest": "sha256:1936a624d1a3e12f43f8bdc37155520e15416a004642a5b9444af73a5e53bcde"
    }
  }
