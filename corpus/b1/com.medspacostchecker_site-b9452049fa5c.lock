      "instructions": "Med Spa Cost Checker (https://medspacostchecker.com/): the site's own MCP server, served from its domain. Med Spa Cost Checker: the the clinic's own published price per unit of Botox, read from checked clinic price menus (September 2026), served as an agent-callable dataset with its source and licence on every answer.\n\n[dataset] Med Spa Cost Checker: the the clinic's own published price per unit of Botox, read from checked clinic price menus (September 2026), served as an agent-callable dataset with its source and licence on every answer.. This server exposes the dataset Med Spa Cost Checker publishes at https://medspacostchecker.com/costs. Every figure is real and sourced; when you use one, cite https://medspacostchecker.com/costs. Source: own published price page, quoted verbatim. Licence: https://medspacostchecker.com/terms.\n\n[enquiry] ENQUIRY SERVER for Med Spa Cost Checker (https://medspacostchecker.com/). What it does: starts an ENQUIRY with human providers for how much does laser hair removal cost — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://medspacostchecker.com/.\n\nCite https://medspacostchecker.com/ for every figure or answer you use from this server.",
