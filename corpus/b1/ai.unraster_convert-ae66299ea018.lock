{
  "lockfileVersion": 2,
  "subjects": {
    "ai.unraster/convert": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://unraster.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "unraster",
        "title": "Unraster",
        "version": "1.0.0",
        "websiteUrl": "https://unraster.ai/docs/agents"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Unraster converts images (PNG, JPEG, WebP) into editable PowerPoint and SVG files. Call quote_conversion to see the price, convert_image to convert (pass image_url for public https images or image_base64 + mime_type for local files), and get_conversion to poll a conversion that is still running. Download links are valid for 7 days and anyone with a link can download the file. Do not share them publicly. The first PowerPoint-only conversion (outputs: pptx) of an account signed up with Google is free.",
      "tools": [
        {
          "name": "convert_image",
          "title": "Convert an image",
          "description": "Convert a PNG, JPEG or WebP image into an editable PowerPoint (.pptx) and/or SVG and return download links. Spends credits only when files are delivered (SVG 1, PowerPoint 2); a failed conversion is not charged. Waits up to about 45 seconds; if still running, returns conversion_id for get_conversion. Identical requests within 10 minutes reuse the same conversion. The first PowerPoint-only conversion (outputs: pptx) of an account signed up with Google is free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "image_base64": {
                "description": "Base64-encoded PNG, JPEG or WebP bytes (up to 5 MB decoded). Use instead of image_url for local files.",
                "type": "string"
              },
              "image_url": {
                "description": "Public https URL of a PNG, JPEG or WebP image (up to 25 MiB). Private or internal addresses are refused.",
                "type": "string"
              },
              "mime_type": {
                "description": "Required with image_base64.",
                "enum": ["image/png", "image/jpeg", "image/webp"],
                "type": "string"
              },
              "outputs": {
                "default": "pptx",
                "description": "pptx = editable PowerPoint (2 credits), svg = editable SVG (1 credit), both = 3 credits.",
                "enum": ["pptx", "svg", "both"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Convert an image"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4e9c4082dbb29e3267e1cd026d2bc85bdb222c3b349b07e2b310470d624424ae"
        },
        {
          "name": "get_conversion",
          "title": "Get a conversion",
          "description": "Check the status, progress and download links of a conversion started with convert_image. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "conversion_id": {
                "description": "The conversion_id returned by convert_image.",
                "type": "string"
              }
            },
            "required": ["conversion_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a conversion"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:682e21f720fd2ac5ae2462bc7bd35784155ce751e2a1d2dbd76427feccb4ee27"
        },
        {
          "name": "quote_conversion",
          "title": "Quote a conversion",
          "description": "Show the credit price of converting an image to editable PowerPoint and/or SVG, and the account balance. Free; nothing is charged.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "image_base64": {
                "description": "Base64-encoded PNG, JPEG or WebP bytes (up to 5 MB decoded). Use instead of image_url for local files.",
                "type": "string"
              },
              "image_url": {
                "description": "Public https URL of a PNG, JPEG or WebP image (up to 25 MiB). Private or internal addresses are refused.",
                "type": "string"
              },
              "mime_type": {
                "description": "Required with image_base64.",
                "enum": ["image/png", "image/jpeg", "image/webp"],
                "type": "string"
              },
              "outputs": {
                "default": "pptx",
                "description": "pptx = editable PowerPoint (2 credits), svg = editable SVG (1 credit), both = 3 credits.",
                "enum": ["pptx", "svg", "both"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Quote a conversion"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0a99807255113a029d3e7fcdc12aa4d19b632c59c855a5ed8efc4697c3f29dc7"
        }
