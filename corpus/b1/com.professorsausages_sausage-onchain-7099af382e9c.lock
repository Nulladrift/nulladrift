  "subjects": {
    "com.professorsausages/sausage-onchain": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://x402.professorsausages.com/mcp/onchain"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "sausage-onchain",
        "title": "Gas Prices, Token Safety, Swap Quotes & ENS — onchain data for agents, pay-per-call (Sausage Onchain)",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {},
        "tools": {}
      },
      "instructions": "Professor Sausages' on-chain counter — everything an agent should check before it signs a transaction: what gas costs, whether the token is a trap, what the swap prices at, and who the address really is. Free tools: find_data, pricing, request_data. Paid tools charge per call in USDC on Base via x402: call one without x_payment to get its exact terms, sign them, and call again with x_payment. No signup, no API keys. Gas covers Ethereum, Base, Arbitrum, Optimism, Polygon and BSC; prices are read from Chainlink oracles on-chain; token safety and swap quotes cover Base and Ethereum. Safety verdicts always ship the evidence that produced them — read it before acting.",
      "tools": [
        {
          "name": "address_screen",
          "title": "Screen a crypto address against OFAC",
          "description": "Screen a crypto address against the full live OFAC SDN list, segmented by chain. Returns a verdict with the matching SDN entries as evidence — never a silent all-clear. Paid: call without x_payment to receive this call's exact terms (amount, asset, network), sign them, then call again with x_payment. The free `pricing` tool lists every price at once.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "The address to screen, in that chain's native format.",
                "examples": ["0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"],
                "type": "string"
              },
              "chain": {
                "default": "base",
                "description": "Which chain the address belongs to.",
                "enum": ["base", "ethereum", "bitcoin", "tron", "litecoin", "monero", "dash", "zcash", "bitcoin-cash", "dogecoin", "bitcoin-gold", "verge", "solana"],
                "examples": ["base"],
                "type": "string"
              },
              "x_payment": {
                "description": "Optional signed x402 payment payload (base64, what the X-PAYMENT header carries). Omit to receive the exact payment terms; sign them (e.g. @x402/fetch) and call again with this argument to settle and get the data.",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2123ae06552db2c00454f95939b9a002e7beeccee2926217e887da1d08568bd3"
        },
        {
          "name": "chain_info",
          "title": "EVM chain registry",
          "description": "Canonical record for an EVM chain — name, native currency, explorers, liveness-scored public RPCs. view='rpcs' returns only the ranked, eth_chainId-probed RPC list; view='wallet_config' returns a ready-to-submit EIP-3085 wallet_addEthereumChain object; view='search' finds chains by name or symbol; view='l2s' lists a parent chain's L2s. Paid: call without x_payment to receive this call's exact terms (amount, asset, network), sign them, then call again with x_payment. The free `pricing` tool lists every price at once.",
          "inputSchema": {
            "properties": {
              "chain_id": {
                "description": "Numeric chain id (required for record/rpcs/wallet_config).",
                "examples": ["8453"],
                "type": "string"
              },
              "parent": {
                "default": "1",
                "description": "Parent chain id for view='l2s'.",
                "examples": ["1"],
                "type": "string"
              },
              "q": {
                "description": "Name/symbol fragment (view='search').",
                "examples": ["scroll"],
                "type": "string"
              },
              "view": {
                "default": "record",
                "description": "Which shape of chain data to return.",
                "enum": ["record", "rpcs", "wallet_config", "search", "l2s"],
                "examples": ["rpcs"],
                "type": "string"
              },
              "x_payment": {
                "description": "Optional signed x402 payment payload (base64, what the X-PAYMENT header carries). Omit to receive the exact payment terms; sign them (e.g. @x402/fetch) and call again with this argument to settle and get the data.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:db37cecf0cf864eae3181d05a4d4640064da1837817638661b74073679bee2cd"
        },
        {
          "name": "ens_resolve",
          "title": "Resolve ENS names and addresses",
          "description": "Resolve an ENS name to an address, or an address to its forward-verified primary name — direction is detected from the input. view='profile' returns the full identity card (multichain addresses, text records, contenthash, avatar); view='avatar' dereferences the avatar to an image URL. Paid: call without x_payment to receive this call's exact terms (amount, asset, network), sign them, then call again with x_payment. The free `pricing` tool lists every price at once.",
          "inputSchema": {
            "properties": {
              "keys": {
                "description": "Comma-separated ENS text-record keys (view='text').",
                "examples": ["avatar,url"],
                "type": "string"
              },
              "query": {
                "description": "An ENS name (ends in .eth) or a 0x address.",
                "examples": ["ens.eth"],
                "type": "string"
              },
              "view": {
                "default": "resolve",
                "description": "resolve = name↔address; profile/avatar/text need a name.",
                "enum": ["resolve", "profile", "avatar", "text"],
                "examples": ["profile"],
                "type": "string"
              },
              "x_payment": {
                "description": "Optional signed x402 payment payload (base64, what the X-PAYMENT header carries). Omit to receive the exact payment terms; sign them (e.g. @x402/fetch) and call again with this argument to settle and get the data.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0282eb09ff8448c356638044956747fa8248f602dd0b99a96327b74e83ed26ed"
        },
        {
          "name": "find_data",
          "title": "Find the right data source",
          "description": "Describe the data you need in plain language (e.g. 'Apple risk factors 2023', 'is this token a honeypot', 'is this email deliverable', 'read this page'). Searches this server's datasets first, then the whole Professor Sausages catalog, and returns matching endpoints with method, URL, price, and how to call them. Free.",
          "inputSchema": {
            "properties": {
              "task": {
                "description": "What you're trying to find or do, in your own words",
                "examples": ["Apple risk factors 2023"],
                "type": "string"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:74bf25410f49fc1649e80b6b0fd003b464a9f17e5b9e238e4ce647fd6547c50c"
        },
        {
          "name": "gas_compare",
          "title": "Cheapest chain right now",
          "description": "Rank every supported chain by all-in USD transaction cost — the 'where should I send this' routing decision, with the OP-stack L1 data fee included. Paid: call without x_payment to receive this call's exact terms (amount, asset, network), sign them, then call again with x_payment. The free `pricing` tool lists every price at once.",
          "inputSchema": {
            "properties": {
              "gas": {
                "description": "Optional gas limit override.",
                "examples": [21000],
                "type": "integer"
              },
              "speed": {
                "default": "standard",
                "description": "Fee tier to compare at.",
                "enum": ["slow", "standard", "fast"],
                "examples": ["standard"],
                "type": "string"
              },
              "tx_type": {
                "default": "transfer",
                "description": "Transaction shape to price on every chain.",
                "enum": ["transfer", "erc20", "swap", "nftMint", "deploy"],
                "examples": ["erc20"],
                "type": "string"
              },
              "x_payment": {
                "description": "Optional signed x402 payment payload (base64, what the X-PAYMENT header carries). Omit to receive the exact payment terms; sign them (e.g. @x402/fetch) and call again with this argument to settle and get the data.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a04741e7e078a45fc695da0f5a7984e1286bc1a0642419a28aaef756dc67c5dd"
        },
        {
          "name": "gas_price",
          "title": "Current gas market for a chain",
          "description": "Bid-ready EIP-1559 fees (slow/standard/fast maxFeePerGas + maxPriorityFeePerGas, tx-ready wei) for one chain, read live from public RPCs. Pass tx_type to get the USD cost of that specific transaction instead, including the OP-stack L1 data fee naive estimators miss. Paid: call without x_payment to receive this call's exact terms (amount, asset, network), sign them, then call again with x_payment. The free `pricing` tool lists every price at once.",
          "inputSchema": {
            "properties": {
              "chain": {
                "default": "base",
                "description": "Which chain's gas market to read.",
                "enum": ["ethereum", "base", "arbitrum", "optimism", "polygon", "bsc"],
                "examples": ["base"],
                "type": "string"
              },
              "gas": {
                "description": "Optional gas limit override when tx_type is set.",
                "examples": [21000],
                "type": "integer"
              },
              "speed": {
                "default": "standard",
                "description": "Which fee tier to price the estimate at.",
                "enum": ["slow", "standard", "fast"],
                "examples": ["fast"],
                "type": "string"
              },
              "tx_type": {
                "description": "Optional: cost a specific transaction shape rather than returning raw fees.",
                "enum": ["transfer", "erc20", "swap", "nftMint", "deploy"],
                "examples": ["erc20"],
                "type": "string"
              },
              "x_payment": {
                "description": "Optional signed x402 payment payload (base64, what the X-PAYMENT header carries). Omit to receive the exact payment terms; sign them (e.g. @x402/fetch) and call again with this argument to settle and get the data.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:aaaf04856ec383a00702009cb27fdd32a28a7fe745dea5e2d327f9c2f71670f6"
        },
        {
          "name": "nft_scam_check",
          "title": "NFT scam / copymint check",
          "description": "Deterministic scam checklist with a verdict and evidence (spam flags, copymint collisions, holder concentration). Pass a collection contract to check the collection, or a wallet to check that wallet's whole scam exposure holding by holding. Paid: call without x_payment to receive this call's exact terms (amount, asset, network), sign them, then call again with x_payment. The free `pricing` tool lists every price at once.",
          "inputSchema": {
            "properties": {
              "chain": {
                "default": "eth",
                "description": "Which chain to read (Ethereum mainnet today).",
                "enum": ["eth"],
                "examples": ["eth"],
                "type": "string"
              },
              "contract": {
                "description": "Collection contract address to check.",
                "examples": ["0xBC4CA0EdA7647A8aB7C2061c2E118A18a936f13D"],
                "type": "string"
              },
              "wallet": {
                "description": "Wallet address — checks scam exposure across its holdings instead.",
                "examples": ["0xFe89cc7aBB2C4183683ab71653C4cdc9B02D44b7"],
                "type": "string"
              },
              "x_payment": {
                "description": "Optional signed x402 payment payload (base64, what the X-PAYMENT header carries). Omit to receive the exact payment terms; sign them (e.g. @x402/fetch) and call again with this argument to settle and get the data.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5fd3a489d65ace651311d82d432812c53bbdb97095b29cd2dd9832e1c17654aa"
        },
