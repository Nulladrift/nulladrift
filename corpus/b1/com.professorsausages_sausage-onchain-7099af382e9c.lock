        {
          "name": "request_data",
          "title": "Request missing data",
          "description": "The suggestion box: ask for data we don't have (a pre-2015 filing, an uncovered ticker, an unsupported chain, a whole dataset). Requests feed the nightly ingestion queue — filings are usually available within ~24h. Include contact if you want to hear back. Free.",
          "inputSchema": {
            "properties": {
              "contact": {
                "description": "Optional: URL/email/handle for follow-up",
                "examples": ["https://example.com/contact"],
                "type": "string"
