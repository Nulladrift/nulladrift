            "readOnly": false
          },
          "digest": "sha256:1532a22044b752d95dec892179788d26c0dbe5dc99bd459b3d252ac53bdf645d"
        },
        {
          "name": "spot_price",
          "title": "Oracle spot price",
          "description": "Live Chainlink on-chain spot price for an asset (latestRoundData, with round metadata). Pass `to` as well to cross-convert two assets via their USD feeds, with both legs reported. Paid: call without x_payment to receive this call's exact terms (amount, asset, network), sign them, then call again with x_payment. The free `pricing` tool lists every price at once.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Amount to convert (with `to`).",
                "examples": [1],
                "type": "number"
              },
              "asset": {
                "description": "Asset symbol with a Chainlink feed (call /prices/feeds free to list them).",
                "examples": ["ETH"],
                "type": "string"
              },
              "chain": {
                "default": "base",
                "description": "Which chain's oracle to read.",
                "enum": ["ethereum", "base"],
                "examples": ["base"],
                "type": "string"
              },
              "to": {
                "description": "Optional second asset — converts `asset` into it instead of quoting USD.",
                "examples": ["USDC"],
                "type": "string"
              },
              "x_payment": {
                "description": "Optional signed x402 payment payload (base64, what the X-PAYMENT header carries). Omit to receive the exact payment terms; sign them (e.g. @x402/fetch) and call again with this argument to settle and get the data.",
                "type": "string"
              }
            },
            "required": ["asset"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
