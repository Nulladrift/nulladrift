          "digest": "sha256:f776f69a4c46da7a58268d60e4b07ccb6aa8717056001c06a83f50381a6d47f3"
        },
        {
          "name": "swap_quote",
          "title": "DEX swap quote",
          "description": "Indicative UniswapV2 swap quote from live on-chain reserves: amount out, execution price, and price impact — what the trade will actually cost before you sign it. Paid: call without x_payment to receive this call's exact terms (amount, asset, network), sign them, then call again with x_payment. The free `pricing` tool lists every price at once.",
          "inputSchema": {
