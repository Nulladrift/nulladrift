        {
          "name": "mountain_forecast",
          "title": "Mountain weather forecast at a place",
          "description": "The weather forecast at a place in the Alps, for its elevation: weather, precipitation, fresh snow, freezing level, temperature, wind and gusts, sunshine and thunderstorm risk, in six-hour periods of local time for up to ten days. Computed from several weather models like the forecast in the topo^alpin app. Say the elevation elevationM and the period, and the weather, precipitation, fresh snow, freezing level, wind with gusts and thunderstorm risk where they matter. temperatureC is the spread of the models, from the coldest to the warmest: give it as a range. Where precipitationMm is above 0 and rainMm and fresh snow are 0, only a trace falls: say so, not that it stays dry. A period marked past has ended: do not give it as forecast, and say that the day totals include it.",
