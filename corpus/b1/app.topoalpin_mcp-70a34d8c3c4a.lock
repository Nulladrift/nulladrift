                "type": "string"
              },
              "detail": {
                "description": "summary: ratings, problems and main message. full (default): all texts as plain text. original: also the bulletin as published.",
                "enum": ["summary", "full", "original"],
                "type": "string"
              },
              "elevationM": {
                "description": "The elevation that matters, if not the one of the place itself.",
                "maximum": 5000,
                "minimum": 0,
                "type": "number"
              },
              "lang": {
                "description": "Language for region names and, if the service publishes in it, report texts. Default en.",
                "enum": ["de", "en", "fr", "it"],
                "type": "string"
              },
              "lat": {
                "description": "Latitude, WGS 84. topo^alpin covers the Alps only.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "description": "Longitude, WGS 84.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "placeId": {
                "description": "When query matched several places, the placeId of the one the user means, from that list. Give it together with the same query.",
                "maxLength": 40,
                "type": "string"
              },
              "query": {
                "description": "Name of a summit, hut, pass or town, or of an area such as Valais or Tyrol for all its warning regions, or of a warning region.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "regionId": {
                "description": "EAWS micro-region id, from avalanche_region or avalanche_coverage.",
                "maxLength": 32,
                "type": "string"
              },
              "when": {
                "description": "Default current.",
                "enum": ["current", "next"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
