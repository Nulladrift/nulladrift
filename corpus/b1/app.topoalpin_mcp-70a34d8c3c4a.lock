              "days": {
                "description": "Days from today, if no date is given. Default 3.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "elevationM": {
                "description": "The elevation that matters, if not the one of the place itself.",
                "maximum": 5000,
                "minimum": 0,
                "type": "number"
