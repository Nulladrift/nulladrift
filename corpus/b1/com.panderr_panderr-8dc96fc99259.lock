  "subjects": {
    "com.panderr/panderr": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://panderr.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Panderr",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "start_website_migration",
          "title": "Start website migration",
          "description": "Prepare an existing public website for migration into Panderr. Returns a Panderr link where the user can begin the migration and open the resulting website project for editing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "mode": {
                "description": "Migration approach. Preserve keeps the existing website presentation as faithfully as possible. Improve preserves the source as an editable baseline for deliberate improvements. Panderr Redesign creates a new design direction using the existing website content, business information, and assets as its source.",
                "enum": ["preserve", "improve", "redesign"],
                "type": "string"
              },
              "websiteUrl": {
                "description": "The public website address to migrate.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["websiteUrl"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "migrationUrl": {
                "description": "The Panderr URL where the user can continue the migration.",
                "type": "string"
              },
              "mode": {
                "description": "The selected Panderr migration approach.",
                "enum": ["preserve", "improve", "redesign"],
                "type": "string"
              },
              "websiteUrl": {
                "description": "The normalized public website address being migrated.",
                "type": "string"
              }
            },
            "required": ["migrationUrl", "mode", "websiteUrl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c26c0aa1f9b155c13902ae8b112f980660b3f8bbce58c9a455992e358a81aab3"
        }
      ],
      "digest": "sha256:2f595802a120ecd9016bd9f94f0f145d518d41e5491f7c79698ce3d92da07dd0"
    }
  }
