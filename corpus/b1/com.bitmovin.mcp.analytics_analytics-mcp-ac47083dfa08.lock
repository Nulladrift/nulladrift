        {
          "name": "getImpressionOverview",
          "title": "Get impression overview",
          "description": "The facts of a SINGLE playback session identified by an impressionId, together with the findings evaluated over them. Facts cover the session context (device, location, player, stream, CDN), its QoE numbers (startup time, rebuffering, bitrates, quality changes, dropped frames), time spent per state, errors placed in the phase they arrived in, ad data, and the collector limits that make any of these incomplete. Findings rate startup, quality switching, rebuffering, errors by phase and start failures, flag the collector limits, and state what two co-occurring findings mean together. Each carries a severity, evidence paths pointing back at the facts it was derived from, and an explanation covering the mechanism behind it, the causes one session cannot separate, and what commonly addresses it. They are computed from fixed thresholds, so the same session always yields the same findings; `analyzeImpression` adds an AI-written interpretation of the same session. An impressionId is required, and `fetchImpressions` lists the ids for a license and timeframe. The tool takes no start/end and covers one session: metrics over a time period come from `query` / `queryTotal`, breakdowns by category from `queryGroupBy`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
