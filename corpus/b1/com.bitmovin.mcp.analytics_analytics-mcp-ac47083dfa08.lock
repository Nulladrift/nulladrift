        {
          "name": "analyzeImpression",
          "title": "Analyze impression",
          "description": "Deep-dive analysis of a SINGLE playback session identified by a specific impressionId: static properties, aggregated metrics, state-transition timeline, and an AI-powered interpretation of session quality. Use for detailed single-session troubleshooting. REQUIRES an impressionId. Do NOT use this for license-wide metrics, totals, trends, or any time-range ('last week', start/end) analysis — this tool does not accept start/end. For metrics over a time period use the 'query' tool; for breakdowns by category use 'queryGroupBy'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "impressionId": {
                "description": "Impression ID",
                "type": "string"
              },
              "licenseKey": {
                "description": "license key (uuid) to query",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["impressionId", "licenseKey"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7c3f99be5ccb9d986b953bb26b01c1d1aa4bef28c2a6a3fb5b3f4ee92785c8d8"
        },
        {
          "name": "fetchImpressions",
          "title": "List impression ids for a timeframe",
          "description": "List the impression ids (individual playback session ids) for a license over a time range, optionally narrowed by filters. Returns the ids themselves — NOT counts, totals, or trends. Use this to enumerate sessions before drilling into specific ones with `getImpressionOverview` or `analyzeImpression`. Typical uses: 'give me impression ids from yesterday', 'list sessions on Safari that errored last week', 'sample sessions from country US'. Every matching session is eligible (including failed/setup sessions), not only successful plays. Results are capped (default 100, max 200); if truncated, narrow the timeframe/filters or raise `limit`. A licenseKey is required, and `peekAllLicenses` lists the available ones; `searchFilters` resolves the filter attributes and operators used by the optional `filters` input. For metric counts/trends over a period use `query` / `queryTotal`; for category breakdowns use `queryGroupBy`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "end": {
                "description": "end date/time in ISO 8601 format (e.g., '2025-10-02T00:00:00')",
                "type": "string"
              },
              "filters": {
                "description": "optional filters to apply to the query",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "description": "category name to filter on",
                      "type": "string"
                    },
                    "operator": {
                      "description": "the filter operator",
                      "enum": ["eq", "ne", "gt", "gte", "lt", "lte", "in", "contains"],
                      "type": "string"
                    },
                    "value": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "number"
                        },
                        {
                          "items": {
                            "type": ["string", "number"]
                          },
                          "type": "array"
                        }
                      ],
                      "description": "the value to filter by. For 'in' operator, provide an array of values"
                    }
                  },
                  "required": ["name", "operator", "value"],
                  "type": "object"
                },
                "type": "array"
              },
              "licenseKey": {
                "description": "license key (uuid) to query",
                "format": "uuid",
                "type": "string"
              },
              "limit": {
                "description": "maximum number of impression ids to return (1-200, default 100)",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "start": {
                "description": "start date/time in ISO 8601 format (e.g., '2025-10-01T00:00:00')",
                "type": "string"
              }
            },
