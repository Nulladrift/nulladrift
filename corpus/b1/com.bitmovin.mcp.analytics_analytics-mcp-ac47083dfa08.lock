        {
          "name": "searchFilters",
          "title": "Search filters",
          "description": "Find the exact filter/group-by attribute keyword for a topic or question (e.g. 'browser', 'device type', 'content tier'). Preferred way to resolve an attribute; use 'licenseKey' to resolve custom namings of attributes; use getAvailableFilters only to list the full static catalog.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "licenseKey": {
                "description": "license key (uuid) to query",
                "format": "uuid",
                "type": "string"
