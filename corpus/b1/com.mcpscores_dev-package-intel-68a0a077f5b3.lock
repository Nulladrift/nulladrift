{
  "lockfileVersion": 2,
  "subjects": {
    "com.mcpscores/dev-package-intel": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://devpkg-intel.bowling-anthony.workers.dev/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.mcpscores/dev-package-intel",
        "title": "MCPFax Dev Package Intelligence",
        "version": "1.0.2",
        "websiteUrl": "https://mcpscores.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "You are about to add a dependency and do not know if it is current, licensed for this use, deprecated, or already carries a CVE. Tool calls are x402-paid in USDC on Base — send the base64 X-PAYMENT header on this POST /mcp request (or params._meta['x402/payment']). package_info costs $0.005; package_vulnerabilities $0.008; package_audit $0.01, and package_audit answers 'is this dependency safe to add' in one call, so prefer it over calling the other two separately. An unpaid call returns a PaymentRequired result and settles nothing; initialize, ping and tools/list are free, as are request_data and demand_report. An unknown package returns not_found and is NOT charged. A clean audit verdict means nothing was found in these sources — it is not a security guarantee.",
      "tools": [
        {
          "name": "demand_report",
          "title": "What agents are asking for most (free)",
          "description": "FREE, no payment. The aggregate of what agents have told us they are looking for, most-requested first, with the categories nothing available yet serves.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "Window in days, default 30, max 90.",
                "examples": ["30"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:461261ad42bf84d61377fdd16143b94cfa57291dcfeff96122da0471054405cb"
        },
        {
          "name": "package_audit",
          "title": "Should I add this dependency?",
          "description": "One call that answers whether a dependency is safe to add: latest version, licence, deprecation, advisories affecting the current version, how long since the last release, and a verdict with the specific concerns found. Prefer this over calling package_info and package_vulnerabilities separately — it is one payment instead of two and applies the judgement. A clean verdict means nothing was found in these sources, not that the package is guaranteed safe. Costs $0.01 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ecosystem": {
                "description": "One of 'npm', 'pypi', 'crates'.",
                "examples": ["npm"],
                "type": "string"
              },
              "name": {
                "description": "Package name.",
                "examples": ["lodash"],
                "type": "string"
              }
            },
            "required": ["ecosystem", "name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9cc754f9ee3e644a075c03a9e0898d151359af0bba334ea5073e4a45be14db26"
        },
        {
          "name": "package_info",
          "title": "Latest version and metadata for a package",
          "description": "Look up a package in npm, PyPI or crates.io: latest version, licence, whether it is deprecated or yanked, when it was last published, dependency count and repository. Use before writing a dependency line, or to check whether a pinned version is behind. Registries answer with hundreds of kilobytes; this returns only the facts that decide the question. Costs $0.005 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ecosystem": {
                "description": "One of 'npm', 'pypi', 'crates' (aliases: node, python, rust).",
                "examples": ["npm"],
                "type": "string"
              },
              "name": {
                "description": "Package name, e.g. 'express', '@scope/pkg', 'requests', 'serde'.",
                "examples": ["express"],
                "type": "string"
              }
            },
            "required": ["ecosystem", "name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a8b62094664fbb2101d65119803f7457ada9746831892a21251700ed5df466fb"
        },
        {
          "name": "package_vulnerabilities",
          "title": "Known vulnerabilities for a package",
          "description": "Known security advisories for a package from OSV, the open advisory database. Returns advisory ids, severity, summary and the versions that fix each one. Pass 'version' to ask only about the version you are about to install; omit it to see advisories affecting any version. Use before pinning a dependency or when auditing a lockfile. Costs $0.008 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ecosystem": {
                "description": "One of 'npm', 'pypi', 'crates'.",
                "examples": ["npm"],
                "type": "string"
              },
              "name": {
                "description": "Package name.",
                "examples": ["lodash"],
                "type": "string"
              },
              "version": {
                "description": "Optional exact version, e.g. '4.17.20'. Narrows advisories to that version.",
                "examples": ["4.17.20"],
                "type": "string"
              }
            },
            "required": ["ecosystem", "name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e03431a521552d4bd820ede857dba25929feb0d611a74bd2cec8613e46dc8eb6"
        },
        {
          "name": "request_data",
          "title": "Tell us what data you are looking for (free)",
          "description": "FREE, no payment. Describe in your own words the data you are trying to buy — anything, not just packages — and get back whether we operate a service that supplies it, with the MCP endpoint if so. Every request is catalogued so repeatedly-requested data gets built. Nothing identifying is stored, only the words of the request.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "need": {
                "description": "What you are looking for.",
                "examples": ["live electricity spot prices by ZIP"],
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c6b9797891247bc42653ed5e960e5b09a9fa515aa9728e4b5a6557635c41df3d"
        }
      ],
      "digest": "sha256:47ad53ee2b55f2e31b344b5e28038a0a73977fe7ccb2ff8e2888654fd12296f5"
    }
  }
}
