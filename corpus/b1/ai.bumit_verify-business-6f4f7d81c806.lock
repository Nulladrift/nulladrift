{
  "lockfileVersion": 2,
  "subjects": {
    "ai.bumit/verify-business": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bumit.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "bumit",
        "title": "BUMIT",
        "version": "1.1.0-phase17"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_company_profile",
          "title": "Get Swiss company profile",
          "description": "Retrieve the canonical Swiss commercial-register (Zefix) profile for one company by UID: legal name, legal form, register status, seat, canton, registered address, purpose and official register links, with provenance, attribution and a freshness envelope (evidence age, freshness threshold, stale flag and source state). The UID is normalized and its check digit validated before any source request. FOUND means a register record was retrieved, not that the business passed verification. For sanctions, FINMA and full verification outcomes, use verify_business.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Retrieve the canonical Swiss commercial-register (Zefix) profile for one company by UID. Retrieval only: FOUND means a register record was retrieved, not that the business passed verification.",
            "properties": {
              "uid": {
                "description": "Swiss UID (e.g. CHE-116.281.549). Formatting is normalized; the mod-11 check digit is validated before any source request.",
                "type": "string"
              }
            },
            "required": ["uid"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b5c3b54824edf1373afcb6ff8147025cb7907b9c5f0c0259dcb84dfb1bbd7ff2"
        },
        {
          "name": "search_companies",
          "title": "Search Swiss companies",
          "description": "Search the Swiss commercial register (Zefix) by company name and receive bounded, deduplicated candidate summaries (UID, legal name, legal form, register status, seat, canton) with source attribution. Use this to find a company's UID before calling get_company_profile, or to review candidates after verify_business reports an ambiguous name. Discovery only: no candidate is selected automatically, results are not ranked or scored, and a name match is not a verification result. For direct one-call verification, use verify_business.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Search the Swiss commercial register (Zefix) by company name. Discovery only: returns bounded register candidates; nothing is selected, ranked or verified.",
            "properties": {
              "name": {
                "description": "Company name to search for. Trimmed; 3–300 characters. Do not guess spellings; use the name as claimed.",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:67004d9bc623fcd4b206d4e54ab8fcd7a1c90c4908d5906e37f018efc925797b"
        },
        {
          "name": "verify_business",
          "title": "Verify Swiss business",
          "description": "Verify a Swiss company using official commercial-register data (Zefix), SECO sanctions data, and FINMA authorisation data. Search by UID or company name (optionally narrowed by address); a UID is not required. Returns structured verification outcomes, source provenance, and data freshness. If a name matches multiple companies, returns candidates for the agent or user to disambiguate; never assume a partial match is the intended company. Unavailable evidence must not be interpreted as a failed verification.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Identify a Swiss company by uid or name; supply at least one of them. A uid is not required when a name is given. address is optional and only assists; address alone is not supported (result outcome UNSUPPORTED). If uid is given, it identifies the company and a supplied name is checked against the registered name. Only uid, name and address are accepted.",
            "minProperties": 1,
            "properties": {
              "address": {
                "additionalProperties": false,
                "description": "Optional Swiss postal address; all four fields are required when address is supplied. It is checked against the official building-address directory (this never proves the company is at that address). With name, locality may narrow several exact legal-name matches by registered seat; it never turns a non-exact match into an identity. Address alone cannot identify a company.",
                "properties": {
                  "house_number": {
                    "description": "House number.",
                    "maxLength": 20,
                    "minLength": 1,
                    "type": "string"
                  },
                  "locality": {
                    "description": "Locality (town). Also compared with the registered seat when narrowing exact name matches.",
                    "maxLength": 100,
                    "minLength": 1,
                    "type": "string"
                  },
                  "postcode": {
                    "description": "Postcode.",
                    "maxLength": 10,
                    "minLength": 1,
                    "type": "string"
                  },
                  "street": {
                    "description": "Street name, without house number.",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["house_number", "locality", "postcode", "street"],
                "type": "object"
              },
              "name": {
                "description": "Optional company legal name; use it when no UID is known. Name-only resolution needs at least 3 characters. A company is resolved only on a unique exact normalized legal-name match — never fuzzy. Otherwise candidates are returned for explicit selection: do not guess; resubmit with the chosen candidate's uid. With uid, the name is compared against the registered name instead.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "uid": {
                "description": "Optional Swiss UID, canonical (CHE-123.456.789) or compact (CHE123456789). When present it identifies the company directly. Check digit validated server-side; an invalid UID is rejected before any source lookup.",
                "maxLength": 64,
                "pattern": "^[\\s._/-]*[Cc][\\s._/-]*[Hh][\\s._/-]*[Ee](?:[\\s._/-]*[0-9]){9}[\\s._/-]*$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4615b363f6d5506b33c206ed91c353199239dd774e489d6ec865ff68884f57fc"
        }
      ],
      "digest": "sha256:0fe8e56cd6ab7bdcecb27bfacdd88e0f2b7e39444f90d651e3dbbdb78cf40d0a"
    }
  }
}
