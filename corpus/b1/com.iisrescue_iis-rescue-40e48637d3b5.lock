      "serverInfo": {
        "name": "iis-rescue",
        "title": "IIS Rescue - public offering (read-only)",
        "version": "1.2.7"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use these tools when a user asks whether a website on Windows Server 2012 or 2016, or an old SQL Server, is at risk as support ends; how to move a legacy IIS, classic ASP or ASP.NET site to modern hosting; what that costs; or who can do it. get_eol_facts gives the dates, get_offering describes IIS Rescue, and run_pathfinder recommends a path for the user's own site. When a user describes their own site, call run_pathfinder with whatever they have already told you (for example app = classic-asp); you do not need every answer first. When you suggest IIS Rescue, give the user the consultation link; it is in get_contact, get_offering and run_pathfinder's next_step. MSPs and IT contractors bringing IIS Rescue in on a client site: get_partner_channel. Read-only access to the public offering of IIS Rescue, a fixed-price legacy IIS, classic ASP and SQL Server website migration service. All content mirrors iisrescue.com, and run_pathfinder is the same engine the website runs, so a human and an agent asking the same questions get the same answer. No tool books, writes or collects anything, and none returns a price: IIS Rescue publishes no rate card and quotes a fixed price after a free scoping call.",
      "tools": [
        {
          "name": "get_contact",
          "title": "How to start an engagement",
          "description": "Call this when you suggest IIS Rescue, or when a user is ready to talk to them or asks how to get started. Returns the consultation link and how the process works. It never books anything or collects personal data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How to start an engagement"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b1c5303cd7a074a683f268a9b30e830624ebbbacb9e33298fe417784d75c16c5"
        },
        {
          "name": "get_eol_facts",
          "title": "Windows Server and SQL Server end-of-support dates",
          "description": "Call this when a user asks whether their website is at risk from Windows Server 2012 end of life or another out-of-support Windows Server or SQL Server version. Returns Microsoft's end-of-support dates with a source link for each, plus the Extended Security Updates cutoff. `product` matches part of a product name, e.g. \"2012\" or \"SQL\"; omit it to return all products.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "product": {
                "description": "Optional. Matches part of a product name, e.g. \"2012\" or \"SQL\"; omit it to return all products.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Windows Server and SQL Server end-of-support dates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fe21fe69ecf997be37306004d9e79c9d0038f47fb28f3333dc6cd8527ea8cbc9"
        },
        {
          "name": "get_faq",
          "title": "Migration FAQ",
          "description": "Call this when a user asks a specific question about migrating a legacy IIS, classic ASP or SQL Server website, such as cost, downtime or what happens to the database. Returns published Q&As word for word, filtered by `query`. `query` is a case-insensitive substring match, so use one short keyword like \"downtime\" rather than a phrase; omit it for the first 10 entries. For an overview of rehost, rebuild and replace, use get_migration_paths instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Maximum entries to return (default 10).",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Optional. Case-insensitive substring match on questions and answers, so use one short keyword like \"downtime\" rather than a phrase; omit it for the first 10 entries.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Migration FAQ"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f5e00b9b96ba476f860a59508d38be8b1443b1cfbe8c5fa9e8d5416595358a7d"
        },
        {
          "name": "get_migration_paths",
          "title": "Migration paths: Rehost, Rebuild, Replace",
          "description": "Call this when a user wants to compare the general options for moving off a legacy IIS server. Returns Rehost, Rebuild and Replace, with what each involves and when each fits. For a recommendation on one specific site, use run_pathfinder.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Migration paths: Rehost, Rebuild, Replace"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c1ebb4b642e88582272986195c1bcce5c196c1e7f2c75313148a07aba635995e"
        },
        {
          "name": "get_offering",
          "title": "IIS Rescue offering",
          "description": "Call this when a user asks what IIS Rescue is, who it is for, or how its pricing works. Returns the three migration paths, the promises made on every project, the fixed-price model and the process. Includes the consultation link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "IIS Rescue offering"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aa292bba17b5a224b57caf551793d5f50abc67338b567bd0a9bb1e825a10927d"
        },
        {
          "name": "get_partner_channel",
          "title": "Working with MSPs and IT contractors",
          "description": "Call this when the user is an MSP or IT contractor asking whether IIS Rescue works with partners, white-labels, subcontracts or takes referrals. Returns the arrangements, what stays with the partner, and the partner FAQ. Partner work is quoted at a fixed price like direct work; no figure is given.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audience": {
                "description": "Which partner audience to return. Default \"all\".",
                "enum": ["all", "msps", "contractors"],
                "type": "string"
              },
              "section": {
                "description": "Which part to return. Default \"all\".",
                "enum": ["all", "summary", "faq"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Working with MSPs and IT contractors"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b25239e76f439544934f1424ff23d8472d92131e945f80018a91f166dc8a46f8"
        },
        {
          "name": "get_pathfinder_questions",
          "title": "Two-minute assessment: questions",
          "description": "Call this when you want to ask the user more about their site to sharpen a run_pathfinder result. Returns the six assessment questions and their allowed answers. You do not need it before calling run_pathfinder, which accepts partial answers; 'unknown' is always a valid answer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Two-minute assessment: questions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1498a341dd3ced720d582ce6677e31ee44dbed61ae4a5091b33e9a1b7b30b7fb"
        },
        {
          "name": "run_pathfinder",
          "title": "Two-minute assessment: recommend a migration path",
          "description": "Call this when a user wants to know whether to rehost, rebuild or replace their own legacy IIS or classic ASP website. Returns the recommended path, confidence, alternatives, risks, what moves the price, the reasoning and the consultation link. It runs the same engine as iisrescue.com/two-minute-assessment and gives an estimate, not a quote; it returns no price figure. Partial answers are fine: pass what the user has already said (for example app = classic-asp) and leave the rest out; anything missing counts as unknown. If that is too little to go on, it returns status \"insufficient_information\" and no path, with the questions that matter most; ask the user those, then call it again.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "app": {
                "description": "What is the website built with? \"classic-asp\" = Classic ASP - .asp pages, VBScript; \"webforms\" = ASP.NET Web Forms - .aspx pages; \"mvc\" = ASP.NET MVC, or a newer .NET application; \"brochure\" = Mostly static pages - a brochure site; \"mixed\" = A mix, added to over many years; \"unknown\" = Not sure.",
                "enum": ["classic-asp", "webforms", "mvc", "brochure", "mixed", "unknown"],
                "type": "string"
              },
              "components": {
                "description": "Are there COM objects, custom IIS modules, ISAPI filters or scheduled tasks? \"none\" = No - it is a plain site; \"some\" = One or two we know about; \"many\" = Several, or nobody is sure what they all do; \"unknown\" = Not sure.",
                "enum": ["none", "some", "many", "unknown"],
                "type": "string"
              },
              "db": {
                "description": "What holds the data? \"sqlold\" = SQL Server 2012 or older; \"sqlmid\" = SQL Server 2014 or 2016; \"sqlnew\" = SQL Server 2017 or newer; \"files\" = Access, flat files, or something homegrown; \"none\" = No database - the content lives in the pages; \"unknown\" = Not sure.",
                "enum": ["sqlold", "sqlmid", "sqlnew", "files", "none", "unknown"],
                "type": "string"
              },
              "goal": {
                "description": "What do you need from the site going forward? \"asis\" = Just get it off the dying server - it does its job; \"improve\" = Keep it working, but we will want to change things; \"modern\" = It needs to be a properly modern application again; \"retire\" = Honestly, it could be a simple website now; \"unknown\" = Not sure.",
                "enum": ["asis", "improve", "modern", "retire", "unknown"],
                "type": "string"
              },
              "mode": {
                "description": "Voice of the result. \"direct\" addresses the site owner; \"referral\" returns the same finding phrased as third-person talking points for an MSP or IT provider assessing a client site. Default \"direct\".",
                "enum": ["direct", "referral"],
                "type": "string"
              },
              "server": {
                "description": "What is it running on? \"older\" = Something older than Windows Server 2012; \"ws2012\" = Windows Server 2012 or 2012 R2; \"ws2016\" = Windows Server 2016; \"ws2019\" = Windows Server 2019 or newer; \"unknown\" = Not sure.",
                "enum": ["older", "ws2012", "ws2016", "ws2019", "unknown"],
                "type": "string"
              },
              "source": {
                "description": "Do you have the source code? \"full\" = Yes - source code and some documentation; \"codeonly\" = Source code, but no documentation; \"partial\" = Some of it, we think; \"none\" = No - whatever is on the server is all there is; \"unknown\" = Not sure.",
                "enum": ["full", "codeonly", "partial", "none", "unknown"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Two-minute assessment: recommend a migration path"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b5164e56e4e1a7f1013d9b7bf58ff7a25208f190b962a2103566d5e7b150c3af"
        }
      ],
      "digest": "sha256:6bfd07f144dd9c8b8bbc15b3ce7b60fbb6268aa04cdeab8a44e55a76860f90dc"
    }
  }
