{
  "lockfileVersion": 2,
  "subjects": {
    "br.api.rendafixa/renda-fixa": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://rendafixa.api.br/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "rendafixa",
        "title": "Renda Fixa API",
        "version": "1.0.0",
        "websiteUrl": "https://rendafixa.api.br/docs/api"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Brazilian fixed-income offers (CDB, LCI, LCA, CRI, CRA, debêntures, Tesouro Direto) from several banks and brokers, with net return after income tax (IR) and real return above IPCA already computed from Boletim Focus projections. Use search_bonds to answer questions such as 'which tax-free bond pays the most?' or 'best CDB up to 2 years'. Returns are decimals: 0.1165 means 11.65% a year. Without an API key only a 5-bond preview is returned; the full list needs a subscription (https://rendafixa.api.br/pricing) and the key sent as 'Authorization: Bearer <key>' or '?key=<key>' on the URL.",
      "tools": [
        {
          "name": "list_issuers",
          "title": "Listar emissores e corretoras",
          "description": "List the banks/brokers present in the data with their numeric codes and how many bonds each has, to use as the 'bank' filter of search_bonds.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:13eab86419d59be9574574a9686329af95b95d1681f571b28ee4f59169d623ce"
        },
        {
          "name": "search_bonds",
          "title": "Buscar títulos de renda fixa",
          "description": "Search active Brazilian fixed-income bonds and rank them. Every bond comes with net_annualized_return (after IR, to maturity) and real_annualized_return (above IPCA), both decimals. 'rate' depends on 'index': cdi* 1.05 = 105% of CDI, cdi+ 0.02 = CDI + 2% a.a., ipca+ 0.06 = IPCA + 6% a.a., pre 0.13 = 13% a.a. fixed. Without an API key the result is a short preview.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bank": {
                "description": "Issuer/broker codes, as listed by list_issuers (e.g. 341 Itaú, 77 Inter, 208 BTG).",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "fgc": {
                "description": "true: only bonds covered by the FGC guarantee (up to R$ 250,000 per CPF per institution).",
                "type": "boolean"
              },
              "index": {
                "description": "Indexers: cdi* (% of CDI), cdi+ (CDI + spread), ipca*, ipca+ (IPCA + spread), selic*, selic+, pre (fixed rate).",
                "items": {
                  "enum": ["cdi*", "cdi+", "ipca*", "ipca+", "selic*", "selic+", "pre"],
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "default": 20,
                "description": "How many bonds to return (max 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_min_investment": {
                "description": "Only bonds whose minimum investment is at most this amount in BRL.",
                "minimum": 0,
                "type": "number"
              },
              "max_years": {
                "description": "Only bonds maturing within this many years from today.",
                "minimum": 0,
                "type": "number"
              },
              "product": {
                "description": "Product types: cdb, lci, lca, cri, cra, deb (debênture), tpf/td (Tesouro Direto), lf (letra financeira), misc.",
                "items": {
                  "enum": ["cdb", "lci", "lca", "cri", "cra", "deb", "tpf", "td", "lf", "misc"],
                  "type": "string"
                },
                "type": "array"
              },
              "sort_by": {
                "default": "net_return",
                "description": "net_return / real_return: highest first. maturity: soonest first. min_investment: lowest first.",
                "enum": ["net_return", "real_return", "maturity", "min_investment"],
                "type": "string"
              },
              "tax_free": {
                "description": "true: only IR-exempt bonds (LCI, LCA, CRI, CRA, incentivized debêntures). false: only taxed ones.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6df63adf2f3df418358bdffb6d8609c1cd834439b67b68675d1d62d524601877"
        }
      ],
      "digest": "sha256:a08c4267e1673411c48a9fd85c767cb1ad8cbb2ea779c659cf82bcef7d0eddb0"
    }
  }
}
