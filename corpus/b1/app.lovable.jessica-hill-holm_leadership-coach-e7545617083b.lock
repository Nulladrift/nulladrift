            "readOnly": true
          },
          "digest": "sha256:1c49836a859c93d6f664580dcfd1415bcc5be4ea9f5cf43e751e1c545df21df6"
        },
        {
          "name": "list_workbooks",
          "title": "List Jessica Hill Holm's leadership workbooks",
          "description": "Read Jessica Hill Holm's active books: Leadership Reset Workbook (USD 49) and free Lead Lagom, with audience, intended benefits, recommendation boundaries and direct Stan checkout URLs; this tool does not purchase.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
