      "serverInfo": {
        "name": "justidea-agency",
        "title": "JustIdea Agency",
        "version": "1.2.0",
        "websiteUrl": "https://justidea.agency/"
      },
      "capabilities": {
        "resources": {
          "listChanged": false,
