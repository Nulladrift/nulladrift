            "title": "Result of a scan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b1c2998689602bff7c9c058e94189fee750e0268ec20f142eb5cf671e8df4675"
        },
        {
          "name": "list_services",
          "title": "Services and prices",
          "description": "List JustIdea Agency services with the published starting (\"from\") prices and links. Returns the price list (12 service categories, each with its packages) and every service page with its short description. All prices are net (VAT excluded) and exactly as published on justidea.agency. Use get_page for the full scope of a service and search_site for city pages, case studies and articles.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "default": "pl",
                "description": "Site language: \"pl\" (prices in PLN) or \"en\" (prices in EUR for clients outside Poland).",
                "enum": ["pl", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Services and prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:513a9404df2efd3225eeeefbece24f734c4afc57fdbb6fb2e571de8939f66d26"
        },
        {
          "name": "scan_ai_visibility",
          "title": "Free AI visibility scan",
          "description": "Free check of how ready a website is for AI assistants and AI search (ChatGPT, Perplexity, Gemini, Claude): whether their crawlers get in (robots.txt, firewalls), whether the content is readable without JavaScript, structured data, llms.txt and the signals models use to cite a source. Takes about 10-30 seconds. Returns the grade (A-F), the score and the list of problems, without fixes. The full report with step-by-step fixes and a PDF is sent by JustIdea Agency to the user's e-mail. Use only details the user gave you: never invent or guess an e-mail address. Before calling, tell the user the report goes to their e-mail and ask for consent under the privacy policy (https://justidea.agency/en/privacy-policy/); set zgoda to true only after they agree. At most 2 scans per e-mail address per day. If it returns status \"running\", call get_scan_result with the scan_id after 30-60 seconds.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "The user's own e-mail address. The full report with fixes is sent there, and only there.",
                "format": "email",
                "maxLength": 254,
                "type": "string"
              },
              "language": {
                "default": "pl",
                "description": "Report language. Use \"pl\" for Polish-speaking users, \"en\" for everyone else.",
                "enum": ["pl", "en"],
                "type": "string"
              },
              "name": {
                "description": "Optional. The user's first name, only if they gave it.",
                "maxLength": 80,
                "type": "string"
              },
              "phone": {
                "description": "Optional. The user's phone number, only if they gave it and want a call about the results.",
                "maxLength": 40,
                "type": "string"
              },
              "url": {
                "description": "The website to scan: a domain or URL, e.g. \"mystore.com\". Only the home domain is used.",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              },
              "zgoda": {
                "const": true,
                "description": "Must be true: the user agreed to receive the report by e-mail, to be contacted by JustIdea about the results, and to the processing of this data under the privacy policy.",
                "type": "boolean"
              }
            },
            "required": ["email", "url", "zgoda"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Free AI visibility scan"
          },
          "behavior": {
