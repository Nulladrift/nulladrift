      "instructions": "JustIdea Agency is a Polish e-commerce and performance marketing agency from Kraków: online stores (PrestaShop, WooCommerce), websites, SEO, paid ads, content and branding. Services, prices and page texts come from the published website justidea.agency. Prices are net starting prices; the final quote depends on scope. Quote them with the page URL so the user can check. Do not state prices this server did not return. send_inquiry contacts a real sales team: call it only when the user asks to get in touch, with their own contact details and explicit consent. scan_analytics, scan_ai_visibility and scan_google_visibility run a free scan of the user's own website and need the user's e-mail and consent: you get the grade and the list of problems, and JustIdea e-mails the full report with fixes to the user. The Google scan may add an Ahrefs estimate of keywords and traffic: present it as an estimate, and it is not always available.",
      "tools": [
        {
          "name": "get_page",
          "title": "Read a page",
          "description": "Full text of one justidea.agency page as Markdown: a service, a price list, the company profile, reviews, a blog article. Accepts a full URL or a path, e.g. \"/pl/cennik/sklepy-internetowe/\" or \"https://justidea.agency/en/pricing/online-stores/\". Only pages published on the site; use list_services or search_site to find the URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Page URL or path on justidea.agency.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:86f4483bbb87fa845c90f6a6226cbed9b286aeb7398cf0609adfd2257af30a03"
        },
        {
          "name": "get_scan_result",
          "title": "Result of a scan",
          "description": "Result of a scan started with scan_analytics, scan_ai_visibility or scan_google_visibility that was still running. Returns the same grade and problem list; sends the full report by e-mail if it has not gone yet. Scan IDs expire after 2 days.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "scan_id": {
                "description": "The scan_id returned by the scan tool.",
                "pattern": "^[a-z0-9]{16}$",
                "type": "string"
              }
            },
            "required": ["scan_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
