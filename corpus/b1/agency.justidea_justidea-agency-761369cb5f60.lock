        {
          "name": "send_inquiry",
          "title": "Send an inquiry to JustIdea",
          "description": "Send a sales inquiry to JustIdea Agency (Kraków, Poland) on behalf of the user. It goes to the agency CRM and the sales team, the sender gets a short confirmation e-mail, and a person replies within one business day. Use only details the user gave you. Never invent a name, e-mail or phone number. Before sending, show the user what will be sent and ask for consent to data processing under the privacy policy (https://justidea.agency/en/privacy-policy/); set zgoda to true only after they agree. Budgets are in PLN net (\"tys. zł\" = thousand PLN). At most 2 inquiries per e-mail address per day. Urgent matters: phone +48 12 400 40 40.",
          "inputSchema": {
            "properties": {
              "budzet": {
                "description": "Budget range, exactly one of the listed values, and it must match the service. One-off projects (\"sklep\", \"strona\", \"audyt\", \"kreacja\", \"inne\") take a project budget: \"do 15 tys. zł\", \"15-40 tys. zł\", \"40-80 tys. zł\", \"80-150 tys. zł\", \"150-300 tys. zł\", \"powyżej 300 tys. zł\", \"jeszcze nie wiem\". Monthly services (\"seo\", \"wizytowka\", \"kampanie\", \"marketing\", \"content\", \"opieka\") take a monthly budget: \"do 2 tys. zł\", \"2-6 tys. zł\", \"6-15 tys. zł\", \"15-40 tys. zł\", \"40-100 tys. zł\", \"powyżej 100 tys. zł\", \"jeszcze nie wiem\". If the user does not know the budget, use \"jeszcze nie wiem\" instead of guessing.",
                "enum": ["do 15 tys. zł", "15-40 tys. zł", "40-80 tys. zł", "80-150 tys. zł", "150-300 tys. zł", "powyżej 300 tys. zł", "jeszcze nie wiem", "do 2 tys. zł", "2-6 tys. zł", "6-15 tys. zł", "40-100 tys. zł", "powyżej 100 tys. zł"],
                "type": "string"
              },
              "email": {
                "description": "Email address for the reply.",
                "format": "email",
                "maxLength": 200,
                "type": "string"
              },
              "firma": {
                "description": "Company name, optional.",
                "maxLength": 200,
                "type": "string"
              },
              "imie": {
                "description": "Full name of the person sending the inquiry.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "strona": {
                "description": "Current website or online store address, optional.",
                "maxLength": 300,
                "type": "string"
              },
              "telefon": {
                "description": "Phone number with at least 9 digits, country code welcome.",
                "maxLength": 60,
                "minLength": 9,
                "type": "string"
              },
              "usluga": {
                "description": "What the inquiry is about: \"sklep\" = Sklep internetowy; \"strona\" = Strona internetowa; \"seo\" = Pozycjonowanie SEO; \"wizytowka\" = Wizytówka Google i Bing; \"kampanie\" = Kampanie reklamowe; \"marketing\" = Marketing, pełny zakres; \"content\" = Content marketing i treści; \"opieka\" = Opieka i rozwój serwisu; \"audyt\" = Audyt; \"kreacja\" = Identyfikacja i kreacja; \"inne\" = Coś innego.",
                "enum": ["sklep", "strona", "seo", "wizytowka", "kampanie", "marketing", "content", "opieka", "audyt", "kreacja", "inne"],
                "type": "string"
              },
              "wiadomosc": {
                "description": "The request in the user's own language, at least two sentences: what they need, scope, deadline.",
                "maxLength": 5000,
                "minLength": 20,
                "type": "string"
              },
              "zgoda": {
                "const": true,
                "description": "Must be true: the user agreed to the processing of the data in this inquiry under the privacy policy.",
                "type": "boolean"
              }
            },
            "required": ["budzet", "email", "imie", "telefon", "usluga", "wiadomosc", "zgoda"],
