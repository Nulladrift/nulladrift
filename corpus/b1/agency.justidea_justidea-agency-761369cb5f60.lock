          "name": "search_site",
          "title": "Search the site",
          "description": "Search justidea.agency pages by titles, descriptions and section headings. Polish and English queries both work. Returns titles, URLs and descriptions; read a result with get_page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Limit to one kind of page.",
                "enum": ["services_index", "service_area", "service", "city_page", "pricing", "case_studies", "event", "blog", "company"],
                "type": "string"
              },
              "language": {
                "default": "any",
                "description": "Limit to one site language.",
                "enum": ["pl", "en", "any"],
                "type": "string"
              },
              "limit": {
                "default": 8,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
