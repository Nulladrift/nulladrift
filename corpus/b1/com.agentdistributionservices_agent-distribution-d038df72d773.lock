{
  "lockfileVersion": 2,
  "subjects": {
    "com.agentdistributionservices/agent-distribution": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentdistributionservices.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Agent Distribution",
        "version": "0.1.0",
        "websiteUrl": "https://agentdistributionservices.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Free distribution preflight. No orders, payment, publishing, credentials or URL fetching. Save returned plans client-side.",
      "tools": [
        {
          "name": "get_service_info",
          "description": "Read current coverage, free preflight pricing and release limits.",
          "inputSchema": {
            "properties": {},
            "title": "get_service_infoArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_service_infoDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d6cda32b6de1bcc30282f4ebc1108958856bc3c1c569eeb80deaa811d464c007"
        },
        {
          "name": "plan_distribution",
          "description": "Build a free plan from public product data. Returns channel candidates and missing permissions; does not publish or verify URLs.",
          "inputSchema": {
            "$defs": {
              "Product": {
                "additionalProperties": false,
                "properties": {
                  "a2a_card_url": {
                    "anyOf": [
                      {
                        "maxLength": 2048,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "A2A Card Url"
                  },
                  "description": {
                    "maxLength": 2000,
                    "minLength": 20,
                    "title": "Description",
                    "type": "string"
                  },
                  "kind": {
                    "enum": ["agent_service", "software", "physical_product", "other"],
                    "title": "Kind",
                    "type": "string"
                  },
                  "mcp_url": {
                    "anyOf": [
                      {
                        "maxLength": 2048,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Mcp Url"
                  },
                  "name": {
                    "maxLength": 100,
                    "minLength": 2,
                    "title": "Name",
                    "type": "string"
                  },
                  "website": {
                    "maxLength": 2048,
                    "title": "Website",
                    "type": "string"
                  }
                },
                "required": ["description", "kind", "name", "website"],
                "title": "Product",
                "type": "object"
              }
            },
            "properties": {
              "product": {
                "$ref": "#/$defs/Product"
              }
            },
            "required": ["product"],
            "title": "mcp_plan_distributionArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "mcp_plan_distributionDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ac4b29b83aa968eaf06f9154f46c7ea8e6e38a4a51da1d37a7ee3bc4cc71f5df"
        }
      ],
      "digest": "sha256:450571da8c7b5fdd2e3c5f33974128957b704c7d2d08fa89fe3efb92d1f52250"
    }
  }
}
