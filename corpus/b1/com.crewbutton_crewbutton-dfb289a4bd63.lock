      "serverInfo": {
        "name": "crewbutton",
        "title": "CrewButton",
        "version": "1.0.0",
        "description": "Send one home-repair request to local businesses and get prices back in writing.",
        "websiteUrl": "https://www.crewbutton.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CrewButton helps US homeowners get prices for a home job from local businesses. Use find_local_pros when someone needs a local pro for a home repair or service, compare_a_quote when they already have a price and want to compare it, and what_to_tell_a_pro when they ask what details a business needs to price the job. The tools count local businesses and give a link; they never book work, take payment, or share anyone's contact details. Pass the trade as one of the listed trade names and the 5-digit US ZIP code where the work is.",
      "tools": [
        {
          "name": "compare_a_quote",
          "title": "Compare a quote with more local prices",
          "description": "For a homeowner who already has a price for a home job and wants to know if it is fair. CrewButton does not judge prices: this tool counts the other local businesses near their US ZIP code that CrewButton can send the same job to, so they can compare written prices, and lists what to check when comparing quotes. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "trade": {
                "description": "The kind of work, as one of CrewButton's trade names (for example Plumbing, Electrical, HVAC, Cleaning, Roofing). For a general repair, use Handyman.",
                "enum": ["Appliance repair", "Bathroom remodel", "Cabinets", "Carpentry", "Carpet cleaning", "Chimney", "Christmas lights", "Cleaning", "Closets", "Concrete", "Countertops", "Crawl space", "Decks", "Demolition", "Doors", "Drywall", "Duct cleaning", "Electrical", "Epoxy flooring", "Excavation", "Fencing", "Fireplace", "Flooring", "Foundation repair", "Garage door", "Garage organization", "General contractor", "Generator", "Gutter cleaning", "HVAC", "Handyman", "Home inspection", "Insulation", "Irrigation", "Junk removal", "Kitchen remodel", "Landscaping", "Lawn care", "Locksmith", "Masonry", "Mold remediation", "Moving", "Painting", "Patios", "Paving", "Pest control", "Pet care", "Plumbing", "Pool service", "Pressure washing", "Remodeling", "Restoration", "Roofing", "Security systems", "Septic", "Siding", "Smart home", "Snow removal", "Solar", "Stucco", "Tile", "Tree service", "Water damage restoration", "Waterproofing", "Well pump", "Window treatments", "Windows"],
                "type": "string"
              },
              "zip": {
                "description": "The 5-digit US ZIP code where the work is.",
                "pattern": "^[0-9]{5}$",
                "type": "string"
              }
            },
            "required": ["trade", "zip"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "businesses_found": {
                "minimum": 0,
                "type": "integer"
              },
              "compare_checklist": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "how_it_works_url": {
                "type": "string"
              },
              "iphone_app_url": {
                "type": "string"
              },
              "status": {
                "enum": ["found", "none_yet"],
                "type": "string"
              },
              "trade": {
                "type": "string"
              },
              "zip": {
                "type": "string"
              }
            },
            "required": ["businesses_found", "compare_checklist", "how_it_works_url", "iphone_app_url", "status", "trade", "zip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare a quote with more local prices"
          },
          "behavior": {
