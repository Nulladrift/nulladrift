      "instructions": "Website builder for small local businesses. Call build_site_preview with a one-sentence description of the business (and optionally its name and city) to get a link to a real, complete website preview. The person opens the link and can claim and publish the site there on the free plan (yourbusiness.sites.0xpi.com). Previews expire after 72 hours unless claimed. Limited to 3 previews per hour per network and a daily total.",
      "tools": [
        {
          "name": "build_site_preview",
          "title": "Build a website preview for a small business",
          "description": "Builds a real, complete website preview for a small business from a one-sentence description (optionally its name and city), using AI Site Builder (sitebuilder.adcreator-ai.com). Returns a link to the live preview and a one-tap link to publish it as the person's free site (set a password, then Go Live). No signup or email needed to see the preview; it expires after 72 hours unless claimed. Limited to 3 previews per hour per network. Use it when someone wants to see what a website for their business could look like.",
          "inputSchema": {
            "properties": {
              "business_name": {
                "description": "Optional business name. If omitted the preview shows an editable \"Your Business Name\" placeholder.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "city": {
                "description": "Optional city or area, e.g. \"Tacoma, WA\".",
                "maxLength": 100,
                "minLength": 3,
                "type": "string"
              },
              "description": {
                "description": "One sentence describing the business, e.g. \"Family-run wood-fired pizzeria, takeout and dine-in, since 2019.\"",
                "examples": ["Family-run wood-fired pizzeria, takeout and dine-in, since 2019.", "Licensed plumber doing emergency repairs and water heaters"],
                "maxLength": 400,
                "minLength": 5,
                "type": "string"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Build a website preview"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:591c51b1e61c84ec250964737e352a2f1be0c2e70dcfb60dce3204dd65ab6e6f"
        }
      ],
