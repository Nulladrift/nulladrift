          },
          "digest": "sha256:8305a22b9692c87e5a5a91c92516c80b84d6d9ad59fb4ddb71fee8440da55f95"
        },
        {
          "name": "search_facts",
          "title": "Search checked facts",
          "description": "Search checked facts about getting a family ready for illness or death: Medicare permission forms, Social Security, hospital stays, unclaimed money, and more. Each result has the official source, the date checked, and a guide link.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Plain words, like \"medicare form for family\" or \"social security representative payee\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search checked facts"
          },
          "behavior": {
