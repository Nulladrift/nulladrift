          },
          "digest": "sha256:8919bb5c0db8d32884cabf4f91b71afc7b4360281e24d5cbf73d92b7887d8a58"
        },
        {
          "name": "state_rules",
          "title": "Read a state reference row",
          "description": "Return the complete published state row, conditions and source passages, each with its official source and the date it was checked. Topics: death_certificates (death certificates), small_estate (small estate limits), estate_tax (estate and inheritance tax), unclaimed_money (unclaimed money), advance_directive_forms (advance directive forms), caregiver_programs (paid family caregiver programs), intestacy (who inherits without a will, from each state intestacy statute). This reference does not decide eligibility, a share of an estate, or any individual legal result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "state": {
                "description": "U.S. state or District of Columbia",
                "enum": ["AK", "AL", "AR", "AZ", "CA", "CO", "CT", "DC", "DE", "FL", "GA", "HI", "IA", "ID", "IL", "IN", "KS", "KY", "LA", "MA", "MD", "ME", "MI", "MN", "MO", "MS", "MT", "NC", "ND", "NE", "NH", "NJ", "NM", "NV", "NY", "OH", "OK", "OR", "PA", "RI", "SC", "SD", "TN", "TX", "UT", "VA", "VT", "WA", "WI", "WV", "WY"],
                "type": "string"
              },
              "topic": {
                "description": "Published reference topic",
                "enum": ["death_certificates", "small_estate", "estate_tax", "unclaimed_money", "advance_directive_forms", "caregiver_programs", "intestacy"],
                "type": "string"
              }
            },
            "required": ["state", "topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a state reference row"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:249322cb2efaf13881c3390381aa17806ffa1f3e05dca9a6e920524872e904d4"
        }
      ],
      "digest": "sha256:b9813de2b5427e905fada622f46d0491c92bbdc304832d01bf4803e6a797f3ac"
    }
  }
