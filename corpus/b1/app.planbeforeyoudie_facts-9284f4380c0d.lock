        {
          "name": "readiness_checklist",
          "title": "Family Readiness Standard checklist",
          "description": "The Family Readiness Standard: 25 checks a family should be able to pass if someone gets sick or dies, grouped by area.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Family Readiness Standard checklist"
          },
          "behavior": {
            "destructive": false,
