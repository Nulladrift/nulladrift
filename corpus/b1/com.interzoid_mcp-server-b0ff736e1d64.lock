        {
          "name": "interzoid_enrich_records",
          "description": "Enrich up to 100 records in one call. Send the records as JSON objects (for example [{\"id\": 1, \"company\": \"Cisco\"}, {\"id\": 2, \"company\": \"Nvidia\"}]) and get every record back with the chosen function's output fields appended after its own fields: company profiles, executives, industry codes, email, phone, and IP scoring, tax and duty rates, standardization, custom fields you define, and more. Use this instead of calling a single-record tool once per record. Call interzoid_enrich_functions (free) to see each function's inputs, output fields, and price. Fields named after the function's inputs (usually \"lookup\") are used automatically; otherwise set lookup_field. Other fields, such as ids, pass through unchanged. Premium functions accept an optional language for results in that language. Cost: the function's price per record times the number of records, from $0.01 to $0.35 per record ($1.00 to $35.00 for 100 records); the x402 payment-required result states the exact total. Check with the user before running premium functions on many records. Functions and price per record (* = accepts language): address-parse $0.01, building-profile $0.25*, business-info $0.25*, business-info-domain $0.10*, business-info-name $0.10*, buying-signals $0.25*, city-standard $0.01, company-verification $0.25*, competitor-analysis $0.25*, country-standard $0.01, custom $0.25*, customs-duty-rates $0.35*, email-domain-type $0.01, email-trust-score $0.25*, entity-type $0.01, esg-profile $0.25*, eu-vat-rates $0.25*, executive-profile $0.25*, facilities-profile $0.25*, gender-from-name $0.01, gov-contracts $0.25*, industry-codes $0.25*, ip-profile $0.25*, irs-per-diem-rates $0.25*, muni-issuer-profile $0.25*, name-origin $0.01, org-standard $0.01, parent-company $0.25*, phone-profile $0.25*, private-company-deal-intel $0.25*, property-history $0.25*, sales-use-tax-rates $0.25*, sic-codes $0.25*, state-standard $0.01, stock-analysis $0.25*, tech-stack $0.25*, translate $0.01, university-info $0.25*, x-handle $0.05*.",
          "inputSchema": {
            "properties": {
              "fixed_values": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "One value for an input on every record, for example {\"to\": \"Spanish\"} for translate.",
                "properties": {},
                "type": "object"
              },
              "function": {
                "description": "Enrichment function. See interzoid_enrich_functions for inputs, outputs, and prices.",
                "enum": ["address-parse", "building-profile", "business-info", "business-info-domain", "business-info-name", "buying-signals", "city-standard", "company-verification", "competitor-analysis", "country-standard", "custom", "customs-duty-rates", "email-domain-type", "email-trust-score", "entity-type", "esg-profile", "eu-vat-rates", "executive-profile", "facilities-profile", "gender-from-name", "gov-contracts", "industry-codes", "ip-profile", "irs-per-diem-rates", "muni-issuer-profile", "name-origin", "org-standard", "parent-company", "phone-profile", "private-company-deal-intel", "property-history", "sales-use-tax-rates", "sic-codes", "state-standard", "stock-analysis", "tech-stack", "translate", "university-info", "x-handle"],
                "examples": ["business-info"],
                "type": "string"
              },
              "input_fields": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "For functions with several inputs: maps each input name to a record field, for example {\"origin\": \"from_country\", \"hscode\": \"hs_code\"} for customs-duty-rates. Not needed for fields already named after the inputs.",
                "properties": {},
                "type": "object"
              },
              "language": {
                "description": "Optional. Two-letter code for results in that language (premium functions only; default English): fr French, de German, it Italian, es Spanish, ja Japanese, pt Portuguese, zh Mandarin, ar Arabic, nl Dutch, el Greek, tr Turkish, ko Korean, sv Swedish, vi Vietnamese, th Thai, id Indonesian. Same price in every language.",
                "enum": ["fr", "de", "it", "es", "ja", "pt", "zh", "ar", "nl", "el", "tr", "ko", "sv", "vi", "th", "id"],
                "type": "string"
              },
              "lookup_field": {
                "description": "The record field that holds the lookup value, for example \"company\". Not needed when the records have a field named like the input (usually \"lookup\") or have only one field.",
                "examples": ["company"],
                "type": "string"
              },
              "output_fields": {
                "description": "function=custom only: the output field names you want (up to 12), for example [\"Population\", \"Mayor\"].",
                "items": {
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "records": {
                "description": "1 to 100 records. JSON objects are recommended, for example [{\"id\": 1, \"company\": \"Cisco\"}]; each comes back with the output fields appended. Plain values (for single-input functions) and arrays of values also work. All records must have the same shape.",
                "items": {},
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "topic": {
                "description": "function=custom only: what the data is about, for example \"City statistics\".",
                "type": "string"
              }
            },
            "required": ["function", "records"],
            "type": "object"
          },
