        {
          "name": "interzoid_custom_data",
          "description": "AI Custom, Self-Defined Data Enrichment. Define your own data API: describe a topic, provide a lookup value, and specify the output fields you want. Returns real-world data as a JSON object with your self-defined fields. Example: topic='detailed information about companies', lookup='IBM', output='[\"headquarters\",\"ceo\",\"website\"]'. Premium API, cost varies by model.",
          "inputSchema": {
            "properties": {
              "lookup": {
                "description": "The lookup value to retrieve data for (e.g. 'IBM', 'Las Vegas', '85250')",
                "examples": ["IBM"],
                "type": "string"
              },
              "model": {
