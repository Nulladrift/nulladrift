      "instructions": "Interzoid provides data matching, standardization, enrichment, and business intelligence tools. All tools are read-only lookups and return JSON; a \"Code\" of \"Success\" means the call succeeded.\n\nFinding duplicates: call a similarity key tool (for example interzoid_company_match_advanced) once per record and group records that share the same SimKey. Records with the same key are likely matches. Use the match score tools (interzoid_org_match_score, interzoid_fullname_match_score) only to compare a specific pair; do not score every pair in a list. When records should match on two fields at once, use the combined key tools (company and address, name and address, company and name).\n\nCost: each tool's description states its price per call: $0.01 for matching, standardization, and utility tools, $0.05 for X (Twitter) tools, $0.10 for the official company name, $0.25 for premium intelligence, and $0.35 for customs duty rates. Prefer the lower-cost tool when either would answer the question, and check with the user before running higher-priced tools across many records. For x402 payments, the payment-required result gives the exact amount.\n\nEnriching many records: to add data to a list of records, use interzoid_enrich_records (up to 100 records per call) instead of calling a single-record tool once per record. Send the records as JSON objects; each comes back with the function's output fields appended, and other fields such as ids pass through unchanged. Call interzoid_enrich_functions first (free) to choose the function and see its inputs, output fields, and price. Premium functions accept an optional language (fr, de, it, es, ja, pt, zh, ar, nl, el, tr, ko, sv, vi, th, id) for results in that language at the same price.\n\nLanguages: the premium single-record tools (business info, parent company, executives, competitors, buying signals, deal intel, ESG, tax rates, and the others whose schema lists it) take the same optional language parameter. Use it when the user wants results in another language instead of translating afterward.\n\nChoosing a tool: interzoid_org_standard gives a canonical name at low cost; interzoid_business_info_name resolves abbreviations, brands, tickers, and misspellings to the official company name ($0.10); interzoid_official_name adds legal form, country, and registry details (premium). For an email, interzoid_email_domain_type classifies the domain cheaply and interzoid_email_trust_score scores the address itself. interzoid_business_info is the general company profile; the other company tools each cover one area in depth (executives, news, competitors, buying signals, deal intel, ESG, government contracts, facilities, tech stack). For customs duty rates, pass the origin country as well as the destination.\n\nPaying for calls: there are two ways, and both work with every tool. With an Interzoid API key (sent by the client as an \"Authorization: Bearer <key>\" header, as ?license=<key> on the server URL, or as INTERZOID_API_KEY for local installs), calls draw on the account's credits. Without a key, tools are paid per call with x402 (USDC on Base) and no account is needed: a call returns an x402 payment-required result (x402Version and accepts), the client pays and retries the same call with the payment in _meta[\"x402/payment\"], and the settlement receipt comes back in the result's _meta[\"x402/payment-response\"]. If you cannot make x402 payments, tell the user they can add an API key; do not retry the call unchanged.",
