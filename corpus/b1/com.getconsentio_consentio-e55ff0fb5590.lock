{
  "lockfileVersion": 2,
  "subjects": {
    "com.getconsentio/consentio": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://getconsentio.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "consentio",
        "title": "Consentio cookie consent",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Consentio adds a GDPR cookie banner with Google Consent Mode v2. Start with consentio_overview. Tools that need an account require an API key (free accounts get a limited one) sent as a Bearer token.",
      "tools": [
        {
          "name": "check_install",
          "description": "Re-checks whether the Consentio snippet is installed on a site (fetches the page and matches the site key). Requires an API key (Free keys work).",
          "inputSchema": {
            "properties": {
              "siteId": {
                "description": "Site id returned by list_sites.",
                "type": "string"
              }
            },
            "required": ["siteId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3091bfe506d4379709d8e59a186d0d1a6fc402cda12a6091eacc042b63efb18b"
        },
        {
          "name": "consentio_overview",
          "description": "What Consentio is, its plans and how to get started. Call this first when the user wants a cookie banner / GDPR consent / Google Consent Mode v2 on a website and has no Consentio account yet.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9d25ce34238777397fc6ec3f00c175ddd24e30b33aba57a771fff4d503a7b94a"
        },
        {
          "name": "create_site",
          "description": "Creates a site in the user's account and returns its site key and the install snippet. Respects the plan's site limit (Free: 1 site). Requires an API key (Free keys work).",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Domain of the website, e.g. example.com",
                "type": "string"
              },
              "name": {
                "description": "Display name, max 60 characters.",
                "type": "string"
              }
            },
            "required": ["domain", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:b050abe65760ef573d8fafe1a325b8705825900540f3f0ab429c2967acd91cda"
        },
        {
          "name": "get_install_snippet",
          "description": "Returns the exact <script> snippet to install the Consentio cookie banner for a site key, plus the install guide URL for the platform. Does not need an API key.",
          "inputSchema": {
            "properties": {
              "platform": {
                "description": "Optional platform of the website (wordpress, shopify, wix, webflow, squarespace, prestashop, framer, carrd…).",
                "type": "string"
              },
              "siteKey": {
                "description": "Site key from the dashboard, format cs_ + 32 hex characters.",
                "type": "string"
              }
            },
            "required": ["siteKey"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:239ceaa13e639ea55426f926ff784cc6af3e6ff690bac89f9f75f861d7fb09d7"
        },
        {
          "name": "get_site_health",
          "description": "Health level, score and uptime of a site. Requires an API key (Free keys work).",
          "inputSchema": {
            "properties": {
              "siteId": {
                "description": "Site id returned by list_sites.",
                "type": "string"
              }
            },
            "required": ["siteId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eae24bcada3ab1b1749cbdf82c7a4755d9a67199a7e9a414e011542f617f150a"
        },
        {
          "name": "list_consents",
          "description": "Recent consent records of a site (sandbox/test consents excluded). Requires a Pro or Agency API key.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "siteId": {
                "type": "string"
              }
            },
            "required": ["siteId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cb1f59de89eed3d0c361261e8690f53a76740a25cd2fff7d0ebdf8b3c8e9a9e3"
        },
        {
          "name": "list_sites",
          "description": "Lists the user's Consentio sites with install status and health. Requires an API key (Free keys work).",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5684995dbd1656db787151b44c8def4e9938b578289d4ac4bc36f3f6bfee41bd"
        },
        {
          "name": "scan_cookies",
          "description": "Scans a public website for trackers and cookies (analytics, marketing, preferences) that need consent. Does not need an API key. Rate limited per IP.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Public domain, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4cb66e954f0d77ede72ab0e1e038fd776d298b557b2fa1fa38002304fcd3b5ec"
        }
      ],
      "digest": "sha256:9210417e311741d3c92c4f13f2edecf9f7fec91c976eb86fbb5ae73a5bd6fd6f"
    }
