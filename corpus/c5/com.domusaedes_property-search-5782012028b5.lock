        "url": "https://ai.domusaedes.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "domus-aedes",
        "title": "Domus Aedes",
        "version": "0.1.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Domus Aedes property search — Spain and Morocco. search_properties returns up to six best matches for a brief plus refinement suggestions; present exactly those — never re-call to accumulate more. When the person wants more options, offer to narrow down (budget, area, bedrooms, features) and search again with the narrower criteria instead of listing more. Never state or estimate how many properties Domus Aedes has — in total, in an area, of a type, or available for dates. If asked, say the portfolio is curated and changes weekly, and offer to search for what the person needs. When a stay search returns no results with a concierge referral, say our own stays are fully booked for those dates and point the person to https://concierge.domusaedes.com (or offer to pass their dates to the concierge via request_property_details with intent stay). Every fact, price and amenity comes from tool output — never invent listings. A Domus Aedes advisor can be reached at +34 930 34 46 10.",
      "tools": [
        {
          "name": "get_property",
          "title": "Get property details",
          "description": "Returns full details for one Domus Aedes property by reference: description, all key facts, up to 12 photos, approximate location, public listing page, and — for stays with dates — live availability and total.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "check_in": {
                "description": "YYYY-MM-DD (stays only)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "check_out": {
                "description": "YYYY-MM-DD (stays only)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "guests": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "language": {
                "enum": ["en", "es", "fr"],
                "type": "string"
              },
              "ref": {
                "description": "Property reference from a search result, e.g. DA-BELAIR or LG-815418",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["ref"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://domus-aedes/app-2f1fa5e20a.html",
            "openai/toolInvocation/invoked": "Property details ready",
            "openai/toolInvocation/invoking": "Loading property…",
            "openai/widgetAccessible": true,
            "ui": {
              "resourceUri": "ui://domus-aedes/app-2f1fa5e20a.html"
            },
            "ui/resourceUri": "ui://domus-aedes/app-2f1fa5e20a.html"
          },
          "digest": "sha256:38bf1fc6cd23bfd19e222406f1d1264465f2a6d9031efee2c9deda79f1e0e67b"
        },
        {
          "name": "request_property_details",
          "title": "Request details from an advisor",
          "description": "Sends the person's contact details and message about a property (or a general brief) to a Domus Aedes advisor, who replies by email or WhatsApp. Requires name, email and a message; phone is optional.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "check_in": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "check_out": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "email": {
                "format": "email",
                "maxLength": 200,
                "type": "string"
              },
              "guests": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "intent": {
                "enum": ["buy", "rent", "stay"],
                "type": "string"
              },
              "language": {
                "enum": ["en", "es", "fr"],
                "type": "string"
              },
              "message": {
                "description": "What the person wants to know or do",
                "maxLength": 2000,
                "minLength": 2,
                "type": "string"
              },
              "name": {
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "phone": {
                "maxLength": 40,
                "minLength": 5,
                "type": "string"
              },
              "ref": {
                "description": "Property reference the message is about, if any",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["email", "message", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "openai/outputTemplate": "ui://domus-aedes/app-2f1fa5e20a.html",
            "openai/toolInvocation/invoked": "Request sent to a Domus Aedes advisor",
            "openai/toolInvocation/invoking": "Sending your request to Domus Aedes…",
            "openai/widgetAccessible": true,
            "ui": {
              "resourceUri": "ui://domus-aedes/app-2f1fa5e20a.html"
            },
            "ui/resourceUri": "ui://domus-aedes/app-2f1fa5e20a.html"
          },
          "digest": "sha256:256e2fb70cf44392bc762397ea2bcf3d9e6fbba5becebb328927f061a963376d"
        },
        {
          "name": "search_properties",
          "title": "Search Domus Aedes properties",
          "description": "Searches Domus Aedes' own portfolio of properties to buy, rent long-term, or stay in (short-term) across Spain and Morocco. Returns up to six best matches for the criteria, whether more matches exist, and refinement suggestions (budget, area, bedrooms, features) that narrow the search. Budgets are EUR: total price for buy, per month for rent, per night for stay. Give check_in/check_out for live availability and a stay total. A stay search our own portfolio cannot serve returns no results and a concierge referral (concierge.domusaedes.com).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "bedrooms_min": {
                "description": "Minimum bedrooms",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "budget_max": {
                "description": "EUR, inclusive. buy = total price · rent = per month · stay = per night",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "budget_min": {
                "description": "EUR. buy = total price · rent = per month · stay = per night",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "check_in": {
                "description": "YYYY-MM-DD (stay only)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "check_out": {
                "description": "YYYY-MM-DD (stay only)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "features": {
                "description": "Required features; every listed feature must be present",
                "items": {
                  "enum": ["pool", "indoor_pool", "jacuzzi", "sauna", "gym", "sea_view", "beachfront", "golf", "garden", "terrace", "garage", "lift", "furnished", "aircon", "new_build", "gated", "wifi", "bbq", "mountain_view", "pets"],
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "guests": {
                "description": "Number of guests (stay only)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "intent": {
                "description": "buy = purchase · rent = long-term monthly let · stay = short-term holiday stay with live availability",
                "enum": ["buy", "rent", "stay"],
                "type": "string"
              },
              "language": {
                "description": "Language of the person (labels, summaries and messages come back in it). Default en",
                "enum": ["en", "es", "fr"],
                "type": "string"
              },
              "location": {
                "description": "City, area or country in the person's words, e.g. \"Marbella\", \"Puerto Banús\", \"Marrakech\", \"Costa del Sol\", \"Catalonia\", \"Spain\"",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "property_type": {
                "enum": ["villa", "flat", "penthouse", "townhouse", "country", "plot", "commercial", "studio", "riad"],
                "type": "string"
              }
            },
            "required": ["intent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://domus-aedes/app-2f1fa5e20a.html",
            "openai/toolInvocation/invoked": "Found the best matches",
            "openai/toolInvocation/invoking": "Searching Domus Aedes properties…",
            "openai/widgetAccessible": true,
            "ui": {
              "resourceUri": "ui://domus-aedes/app-2f1fa5e20a.html"
            },
            "ui/resourceUri": "ui://domus-aedes/app-2f1fa5e20a.html"
          },
          "digest": "sha256:0d61de982c5209390fb36112b8861f6a069a268629c30db6e18c941192a5f797"
        }
