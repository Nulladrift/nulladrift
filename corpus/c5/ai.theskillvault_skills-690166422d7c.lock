                "enum": ["frontend", "backend", "deployment", "debugging", "design", "coding-prompts", "writing-prompts", "research-prompts", "marketing-prompts", "apps", "ai-agents"],
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 5)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "model": {
                "description": "Optional AI model family filter: chatgpt (ChatGPT), claude (Claude), gemini (Gemini), grok (Grok), llama (Llama), deepseek (DeepSeek), mistral (Mistral), qwen (Qwen), kimi (Kimi K). Skills written for \"any\" AI match every family.",
                "enum": ["chatgpt", "claude", "gemini", "grok", "llama", "deepseek", "mistral", "qwen", "kimi"],
                "type": "string"
              },
              "proven": {
                "description": "Optional. true limits results to skills marked works-on-5-models: the latest logged result is a pass on 5+ AI families within 365 days.",
                "type": "boolean"
              },
              "query": {
                "description": "What the user is trying to do, in plain words",
                "type": "string"
