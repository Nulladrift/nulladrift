{
  "lockfileVersion": 2,
  "subjects": {
    "com.nafafy/storefront": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://nafafy.com/api/mcp/storefront"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "xavio-storefront",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Public Nafafy storefront. Use search_shop_catalog to find products, get_product for detail, create_quote to lock a price, then /api/ucp/authorize (signed agent mandate) to check out.",
      "tools": [
        {
          "name": "create_quote",
          "description": "Create a firm 5-minute checkout quote for a set of items. Returns quote_id (pass it to /api/ucp/authorize with a signed agent mandate to complete checkout).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "items": {
                "items": {
                  "properties": {
                    "product_id": {
                      "type": "string"
                    },
                    "qty": {
                      "maximum": 1000,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["product_id", "qty"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c7b071f7bc4b23b90080f0cbd8a53d310447df731739ccef457fbc72d07f7c60"
        },
        {
          "name": "get_product",
          "description": "Fetch one product by its Nafafy product id.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Nafafy product id (uuid).",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d7ff8f7e9d2622efd2a061d565748ad2c56a2299b458c5a55c448e4c4e5faa6d"
        },
        {
          "name": "search_shop_catalog",
          "description": "Search the public Nafafy catalog. Returns in-stock products with price, availability, URL, and merchant.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional category breadcrumb prefix.",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price_cents": {
                "description": "Optional max unit price in minor units.",
                "type": "integer"
              },
              "query": {
                "description": "Free-text search over product titles.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a314104f75aab92d3a56a507579d8b98b8bbec7cb40d161b27d90cf6b1d059c1"
        },
        {
          "name": "search_shop_knowledge",
          "description": "Semantic + keyword search over Nafafy's commerce knowledge: a merchant's product details, policies and FAQs (when `host` is given) plus platform buying guides. Use this to answer questions like sizing, materials, returns, or shipping before recommending a product.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "host": {
                "description": "Optional merchant slug to include that store's docs.",
                "type": "string"
              },
              "k": {
                "description": "Max passages (default 6).",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The shopper's question.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bee3810c477dcfad96915736dc5875a0b3ffaad3c3d861d012b878c298dbffad"
        }
      ],
      "digest": "sha256:80e8fe92af754a5d565f400679da006f21b0e622d048bd69f3f8a7fbff8e6f72"
    }
  }
}
