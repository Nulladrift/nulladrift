        },
        {
          "name": "prepare_ecard",
          "description": "Save or update an owned text-only draft or published card using only creative IDs currently enabled in the server MCP card catalog configuration. Cards support a separate optional title and required message and signature. Suggest title and message when appropriate without unnecessary questions. Recipient details are optional for link sharing. Show preview_url for review, then offer publish_ecard or send_ecard. To edit a published card, first get_ecard and supply its current fields with the desired title, message or signature, draft_id and expected_revision. Published edits take effect immediately at the same public URL and require a verified account; show the revised preview afterward. Design and language cannot change. Recipient and scheduling details can change before dispatch. Pending or unresolved email processing blocks edits; after transport submission only title, message and signature can change. Editing never sends another email or changes a previous dispatch receipt.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "design_id": {
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "draft_id": {
                "pattern": "^[a-f0-9]{32}$",
                "type": "string"
              },
              "expected_revision": {
                "maximum": 2147483646,
                "minimum": 1,
                "type": "integer"
              },
              "language": {
                "description": "Name and site localization only: fr for French, en for any other language. Every design suits every language; message text may use any language.",
                "enum": ["en", "fr"]
              },
              "message": {
                "description": "Required main message text, separate from the optional title and signature.",
                "maxLength": 10000,
                "minLength": 1,
                "type": "string"
              },
              "recipient_email": {
                "format": "email",
                "maxLength": 254,
                "type": "string"
              },
              "recipient_name": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "scheduled_at": {
                "format": "date-time",
                "type": ["string", "null"]
              },
              "signature": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "timezone": {
                "maxLength": 100,
                "type": ["string", "null"]
              },
              "title": {
                "description": "Optional short greeting or heading displayed separately from the main message. Defaults to empty.",
                "maxLength": 200,
                "minLength": 0,
                "type": "string"
              }
            },
            "required": ["design_id", "language", "message", "signature"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
