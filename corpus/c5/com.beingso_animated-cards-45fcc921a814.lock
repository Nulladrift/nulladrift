        {
          "name": "list_ecards",
          "description": "List cards and drafts created through BeingSo MCP by the connected account, newest first. Returns titles, recipient names, creation times, revisions and draft_ids with pagination. Use to find a previously created card, then get_ecard to recover its content and sharing links. Does not include cards created through the website or send any email.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "pattern": "^(0|[1-9][0-9]{0,6})$",
                "type": "string"
              },
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
