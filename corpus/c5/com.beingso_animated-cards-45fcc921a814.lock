        },
        {
          "name": "send_ecard",
          "description": "Request dispatch of the exact reviewed draft revision. Requires a verified sender. Recipient, message and time cannot be replaced here. Reuse the idempotency key on retries. Acceptance creates a durable request only; never report pending_handoff as sent or as transport acceptance.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "draft_id": {
                "pattern": "^[a-f0-9]{32}$",
                "type": "string"
              },
              "expected_revision": {
                "maximum": 2147483646,
                "minimum": 1,
                "type": "integer"
              },
              "idempotency_key": {
                "pattern": "^[A-Za-z0-9._:-]{16,128}$",
                "type": "string"
              }
            },
            "required": ["draft_id", "expected_revision", "idempotency_key"],
            "type": "object"
          },
