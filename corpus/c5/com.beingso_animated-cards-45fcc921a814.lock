              }
            ]
          },
          "digest": "sha256:a3de7e9771acb2bede108825f70eabc57ad0578ac4a7ee0197bb1c6a46d100ee"
        },
        {
          "name": "publish_ecard",
          "description": "Publish the exact reviewed draft revision as a public personalized card without sending or scheduling email. Requires a verified account. Returns card_url, sender share_page_url and sharing_methods. Offer these options and any messaging, email or social tools available to you, then ask which method the user prefers. Share only card_url with recipients. Repeated calls return the same card. Use prepare_ecard with the current revision to edit published text while preserving its URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "draft_id": {
                "pattern": "^[a-f0-9]{32}$",
                "type": "string"
              },
              "expected_revision": {
                "maximum": 2147483646,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["draft_id", "expected_revision"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["drafts:write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:419e8af448d39641417b415a7271dd5077cfa9da2d518ec636f4602de0704413"
        },
        {
          "name": "search_ecards",
          "description": "Search public animated card designs from the events and creative IDs currently enabled in the server MCP card catalog configuration. Every design suits every language. Use fr for French creative names, en for default names for all other languages. Returns posters and design demos, not personalized drafts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "pattern": "^(0|[1-9][0-9]{0,9})$",
                "type": "string"
              },
              "language": {
                "description": "Name and site localization only: fr for French, en for any other language. Every design suits every language; message text may use any language.",
                "enum": ["en", "fr"]
              },
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "occasion": {
                "maxLength": 80,
                "minLength": 0,
                "type": "string"
              },
              "query": {
                "maxLength": 200,
                "minLength": 0,
                "type": "string"
              }
            },
            "required": [],
