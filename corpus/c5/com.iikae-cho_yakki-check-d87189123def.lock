      "instructions": "日本の化粧品・健康食品・育毛剤の広告表現を点検する道具です。点数は目安で、法的な判断ではありません。",
      "tools": [
        {
          "name": "check_ad_expression",
          "description": "Checks Japanese advertising sentences for cosmetics, health foods or hair-growth products and scores how strongly each sentence reads as asserting a bodily effect (a common issue under Japan's Pharmaceutical and Medical Device Act / 薬機法). Returns a score per sentence (0-100%) and links to rephrasing examples. Up to 5 sentences per call, 3 calls per day per user. Not legal advice.",
          "inputSchema": {
            "properties": {
              "text": {
                "description": "Japanese sentences to check (max 400 characters)",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2480b3a0f97db2df9cfca9be2977a4f12c0684a4947562b284b8215e10697e5b"
        },
        {
          "name": "scan_affiliate_articles",
          "description": "For a Japanese cosmetics / health product name, finds up to 6 affiliate or review articles that introduce the product via web search, and flags sentences that may assert bodily effects (薬機法 risk). Returns a summary and a shareable result page URL (kept 30 days). 2 calls per day per user. Not legal advice.",
          "inputSchema": {
            "properties": {
              "product": {
                "description": "Product name in Japanese (include the brand for accuracy)",
                "type": "string"
              }
            },
