{
  "lockfileVersion": 2,
  "subjects": {
    "com.flexpa/registry": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.flexpa.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "flexpa",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "This connection is the public registry and has no access to patient records. To use a patient's own health records, add https://api.flexpa.com/mcp/consent as a separate connection and complete Flexpa Consent OAuth.",
      "tools": [
        {
          "name": "execute_tool",
          "title": "Execute a Flexpa capability",
          "description": "Invoke a local tool (kind=tool) found with search_tools using its input schema. Entries with kind=mcp_server or mcp_tool return guidance for the direct provider connection. Call indexed tools by their original toolName on that server after checking its current tools/list. A care_service entry has no MCP server and returns its website for the patient to use directly. Entries with kind=local_resource return repository and usage guidance; they cannot run through this server. Check tool annotations before execution; some tools can change or share data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "arguments": {
                "description": "Arguments for the entry, matching the inputSchema search_tools returned for it. An object, or a JSON string of one",
                "anyOf": [
                  {
                    "additionalProperties": {},
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  {
                    "type": "string"
                  }
                ]
              },
              "name": {
                "description": "Exact entry name returned by search_tools, for example directory.search_endpoints",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:20b97a5c67d52a56f240f83e41ecadd4d7e8b8b269e11284bcd4adca6f620708"
        },
        {
          "name": "search_tools",
          "title": "Search the Flexpa tool marketplace",
          "description": "Find health tools and MCP servers by task or exact tool name. Local tool entries include input schemas for execute_tool. Indexed mcp_tool entries include the owning server, original toolName, and direct connection details. For schemaStatus=requires_connection, call tools/list on that server after connecting. Set include_locked=true to discover direct tools, servers requiring another connection, planned servers, and care services with no MCP server. Local_resource entries link to models that run locally; read their documentation before use. Use kind to narrow results.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "include_locked": {
                "default": false,
                "description": "Also return entries that need another connection: direct MCP tools and servers, planned servers, and care services",
                "type": "boolean"
              },
              "kind": {
                "description": "Only return entries of this kind",
                "enum": ["tool", "mcp_tool", "mcp_server", "care_service", "local_resource"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Maximum number of matches to return, 1 to 20",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Task or exact tool name to search for, for example \"find a payer endpoint\" or \"directory.search_endpoints\"",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e1a8548b667cb04511319eb35ff9ba27231da42a029652a981a5ce10f430a34a"
        }
      ],
      "digest": "sha256:8cba014f697bd77b4410877309bffb759198504678daa79e24df0038a39cb336"
    }
  }
}
