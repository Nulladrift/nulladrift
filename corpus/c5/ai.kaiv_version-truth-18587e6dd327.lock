{
  "lockfileVersion": 2,
  "subjects": {
    "ai.kaiv/version-truth": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.kaiv.ai/api/bridge/mcp/version-truth-ca7b5b8c"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "version-truth",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "\"version-truth\" is a governed MCP server hosted by Kaiva Bridge. Tools carry a JSON Schema for both input and, where the source documents one, output. Read inputSchema before calling rather than guessing argument names. Every tool here is read-only unless its annotations say otherwise — check readOnlyHint and destructiveHint before calling. A failed call returns isError with a machine-readable `error` code and a message saying whether to fix the arguments, wait, or stop retrying.",
      "tools": [
        {
          "name": "get_cycle",
          "title": "Get Cycle",
          "description": "One release cycle of a product: its latest patch version, release date, LTS/support/EOL dates and whether extended support exists. Use when you already know the major version, e.g. product=nodejs cycle=24. Answers: is Node 18 still supported? What is the newest 24.x patch?",
          "inputSchema": {
            "properties": {
              "cycle": {
                "description": "Release cycle / major version, e.g. '24' or '3.12'",
                "type": "string",
                "x-in": "path"
              },
              "product": {
                "description": "Product slug, e.g. 'nodejs'",
                "type": "string",
                "x-in": "path"
              }
            },
            "required": ["cycle", "product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Cycle"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7fffcdb3e6a281689474596de39753acf519aff3cdeaefed26d40917e1908278"
        },
        {
          "name": "get_product",
          "title": "Get Product",
          "description": "All release cycles for a product, newest first: latest patch version, release date, LTS status/date, end-of-life date, and end of active support. Answers: what is the CURRENT version of X? Which major versions are still supported? When does version Y reach EOL? Use exact slugs from list_products (e.g. nodejs, python, django, postgresql, ubuntu, amazon-eks).",
          "inputSchema": {
            "properties": {
              "product": {
                "description": "Product slug from list_products, e.g. 'nodejs', 'python', 'react', 'postgresql'",
                "type": "string",
                "x-in": "path"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2bdac76823375476c26c526137bf5752ce66b346fcad7d2f05314de81e7601f3"
        },
        {
          "name": "list_products",
          "title": "List Products",
          "description": "List every product slug tracked (nodejs, python, react, postgresql, ubuntu, …). Call this first when unsure of the exact product slug to pass to get_product.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List Products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cc1a589a3b9616b2eba059444bf22307e780e9001eca13bdabd2299cf6eaa773"
        }
      ],
      "digest": "sha256:7d16f00fcbfde60d51a0df32185a8d51dd1cbdfec9206399538b819f0e0ab0ac"
    }
  }
}
