        {
          "name": "get_gex_profile",
          "title": "Gamma by strike",
          "description": "The SPX dealer gamma LADDER for one minute of a finished session: gamma by strike around spot, the level set, and the heaviest strikes. Read by default as the VOLUME book, the one the terminal's chart draws; also as the MEASURED book (signed off the trade tape, FirmTape's own read) or the OPEN_INTEREST convention every other public GEX chart draws — the same minute through three lenses. The level set is the volume book's whichever ladder is read. Use when: the question is about SHAPE — where gamma sits, how heavy a wall is, how far the three conventions disagree — or about one moment inside a session rather than the day as a whole. Not for: a day's headline numbers (get_session), the level set alone (get_levels), or movement across days (get_level_history). ES: pass symbol ES (or MES) for ES strikes, the SPX ladder moved by the ES basis at the frame's minute. Limits: finished sessions only, one frame every 5 minutes (a requested minute snaps back to the frame at or before it), published window ±2.5% of spot; the three books are not comparable in magnitude. Measurements only, no buy/sell signals.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "book": {
                "description": "Which book's ladder to read (default volume, the chart's book). open_interest is the convention rival tools print.",
                "enum": ["measured", "open_interest", "volume"],
                "type": "string"
              },
              "contract": {
                "description": "Optional dated contract for a future symbol. Default is the front contract; in the two weeks before a roll the next one is measured too.",
                "examples": ["ESZ26", "ESH27"],
                "pattern": "^M?(ES|NQ)[FGHJKMNQUVXZ]\\d{1,2}$",
                "type": "string"
              },
              "day": {
                "description": "A finished trading day, YYYY-MM-DD. Call list_sessions if unsure which days exist.",
                "examples": ["2026-08-24"],
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "expiry_scope": {
                "description": "all = every expiry the session's book was pulled with (default); 0dte = the same-day slice alone",
                "enum": ["all", "0dte"],
                "type": "string"
              },
              "minute": {
                "description": "ET minute HH:MM inside 09:30-16:00. Snaps back to the frame at or before it, so quote the minute the answer returns. Default: the last frame of the session.",
                "examples": ["10:30"],
                "pattern": "^\\d{2}:\\d{2}$",
                "type": "string"
              },
              "strikes_around_spot": {
                "description": "How many strikes to return each side of spot (default 20). Raise it for the whole published window, which is +/-2.5% of spot.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "symbol": {
                "description": "SPX (default), or ES / MES: every strike, spot and level moved by the ES basis at the frame's minute. A day without a measured basis answers with SPX strikes and says so.",
                "examples": ["SPX", "ES", "MES"],
                "type": "string"
              }
            },
            "required": ["day"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "basis": {
                "description": "Present when an ES/MES (or NQ/MNQ, RTY/M2K) symbol was asked: the futures basis every price here was moved by; null when the day has no measured basis and the answer is the index's",
                "properties": {
                  "at": {
                    "description": "ET minute the basis belongs to",
                    "type": "string"
                  },
                  "contract": {
                    "description": "The quarterly contract, e.g. ESZ26",
                    "type": ["string", "null"]
                  },
                  "contracts": {
                    "description": "History only: the contracts the window's sessions were priced as",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "expiry": {
                    "type": ["string", "null"]
                  },
                  "future": {
                    "type": "string"
                  },
                  "index": {
                    "description": "The index whose book was moved: SPX, NDX or RUT",
                    "type": "string"
                  },
                  "method": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "passes": {
                    "description": "Basis passes measured that day",
                    "type": "integer"
                  },
                  "points": {
                    "description": "Future minus index, index points, added to every level, strike and spot",
                    "type": "number"
                  },
                  "source": {
                    "format": "uri",
                    "type": "string"
                  }
                },
                "type": ["object", "null"]
              },
              "book": {
                "description": "Which book was read: measured, open_interest or volume",
                "type": "string"
              },
              "book_note": {
                "description": "How this book is built, and what it can and cannot be compared with",
                "type": "string"
              },
              "data_as_of": {
                "description": "The time this answer's data is true as of, ISO 8601 with the ET offset: a finished session's close (13:00 on an early close), the minute a ladder was read at, or the source's own build stamp. Null when the source states none.",
                "type": ["string", "null"]
              },
              "day": {
                "description": "Trading day, YYYY-MM-DD",
                "type": "string"
              },
              "expiry_scope": {
                "description": "all = every expiry this session's book was pulled with; 0dte = the same-day slice alone",
                "type": "string"
              },
              "heaviest": {
                "description": "The largest strikes by absolute gamma inside the window, heaviest first",
                "items": {
                  "properties": {
                    "gamma": {
                      "type": ["number", "null"]
                    },
                    "strike": {
                      "type": "number"
                    }
                  },
                  "required": ["gamma", "strike"],
                  "type": "object"
                },
                "type": "array"
              },
              "levels": {
                "description": "Dealer-positioning levels in SPX index points (in ES points when `symbol` is ES or MES); null when the session did not produce one",
                "properties": {
                  "call_resistance": {
                    "description": "Largest positive-gamma strike above spot",
                    "type": ["number", "null"]
                  },
                  "put_support": {
                    "description": "Largest positive-gamma strike below spot",
                    "type": ["number", "null"]
                  },
                  "zero_gamma_flip": {
                    "description": "Strike where net dealer gamma changes sign",
                    "type": ["number", "null"]
                  }
                },
                "required": ["call_resistance", "put_support", "zero_gamma_flip"],
                "type": "object"
              },
              "minute": {
                "description": "The ET minute (HH:MM) this profile actually belongs to. The archive keeps a frame every 5 minutes, so a requested minute snaps back to the frame at or before it — quote the minute returned here, not the one asked for.",
                "type": "string"
              },
              "net_gamma_in_window": {
                "description": "Sum of the returned strikes — a window total, not the session's net gamma",
                "type": ["number", "null"]
              },
              "note": {
                "description": "Present when a future was asked and its basis is not measured for the day",
                "type": "string"
              },
              "replay": {
                "description": "Free minute-by-minute replay of the session on FirmTape",
                "format": "uri",
                "type": "string"
              },
              "requested_symbol": {
                "description": "Present when a future was asked but the day has no measured basis, so the answer is SPX's",
                "type": "string"
              },
              "server_version": {
                "description": "Version of the FirmTape MCP server that produced this answer",
                "type": "string"
              },
              "spot": {
                "description": "SPX at that minute",
                "type": ["number", "null"]
              },
              "strikes": {
                "description": "Dealer gamma by strike at that minute, lowest strike first",
                "items": {
                  "properties": {
                    "gamma": {
                      "type": ["number", "null"]
                    },
                    "strike": {
                      "type": "number"
                    }
                  },
                  "required": ["gamma", "strike"],
                  "type": "object"
                },
                "type": "array"
              },
              "strikes_returned": {
                "description": "How many strikes the window actually held",
                "type": "integer"
              },
              "summary": {
                "description": "One sentence carrying this answer's numbers, its trading day and its source, written to be quoted verbatim to a reader rather than paraphrased.",
                "type": "string"
              },
              "symbol": {
                "description": "What the prices are in: SPX, or ES / MES when asked and the day's basis is measured",
                "type": "string"
              },
              "unit": {
                "description": "Unit of every gamma number below",
                "type": "string"
              }
            },
            "required": ["book", "data_as_of", "day", "expiry_scope", "heaviest", "levels", "minute", "net_gamma_in_window", "replay", "server_version", "spot", "strikes", "strikes_returned", "summary", "unit"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Gamma by strike"
          },
          "behavior": {
