        {
          "name": "get_events",
          "title": "Market calendar",
          "description": "The scheduled US market events for a window of days, from the same calendar the FirmTape terminal draws: FOMC decisions, press conferences and minutes, CPI, payrolls, PCE, PPI, GDP, retail sales, JOLTS, ISM, the Fed Chair's speeches, the Beige Book, 10/20/30-year Treasury auctions, mega-cap earnings, monthly and quarterly expiration and early closes. Each event carries its minute in ET, a link to its source, and, where the archive has measured it, what usually follows, what the dealer book did, and for the releases the forecast, the prior and the actual print. Use when: 'what is on the calendar this week', 'when is the next FOMC', 'is there anything at 14:00 today'. Not for: session measurements (get_session) or levels (get_levels). Limits: US only, 2019 to about a year ahead, at most 31 days per call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "First day, YYYY-MM-DD (default today, ET)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "impact": {
                "description": "Lowest impact to include (default med: high and medium)",
                "enum": ["high", "med", "low"],
                "type": "string"
              },
              "to": {
                "description": "Last day, YYYY-MM-DD (default from + 6 days; at most 31 days)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data_as_of": {
                "description": "The time this answer's data is true as of, ISO 8601 with the ET offset: a finished session's close (13:00 on an early close), the minute a ladder was read at, or the source's own build stamp. Null when the source states none.",
                "type": ["string", "null"]
              },
              "events": {
                "description": "Scheduled US market events in the window, in date and time order",
                "items": {
                  "properties": {
                    "book": {
                      "description": "What the dealer book did around this kind of event, from the archive, when measured: the flip and the gamma sign at the start of the window",
                      "type": "string"
                    },
                    "date": {
                      "description": "Trading day, YYYY-MM-DD",
                      "type": "string"
                    },
                    "impact": {
                      "description": "high, med or low",
                      "type": "string"
                    },
                    "in_session": {
                      "description": "True when the event falls inside 09:30-16:00 ET",
                      "type": "boolean"
                    },
                    "kind": {
                      "description": "fomc, macro, fed, auction, earn, opex, early or ff",
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "prints": {
                      "description": "The release's numbers, when known: label, forecast, prior and (after the print) actual, as the release quotes them",
                      "items": {
                        "properties": {
                          "actual": {
                            "type": ["string", "null"]
                          },
                          "forecast": {
                            "type": ["string", "null"]
                          },
                          "label": {
                            "type": "string"
                          },
                          "prior": {
                            "type": ["string", "null"]
                          }
                        },
                        "required": ["label"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "time": {
                      "description": "Clock time in ET, HH:MM; empty for an all-day item such as expiration",
                      "type": "string"
                    },
                    "url": {
                      "description": "Where to read the event itself (statement, release, report), when known",
                      "type": "string"
                    },
                    "usually": {
                      "description": "What usually follows this kind of event, from the archive, when measured",
                      "type": "string"
                    }
                  },
                  "required": ["date", "impact", "in_session", "kind", "name", "time"],
                  "type": "object"
                },
                "type": "array"
              },
              "from": {
                "description": "Trading day, YYYY-MM-DD",
                "type": "string"
              },
              "server_version": {
                "description": "Version of the FirmTape MCP server that produced this answer",
                "type": "string"
              },
              "summary": {
                "description": "One sentence carrying this answer's numbers, its trading day and its source, written to be quoted verbatim to a reader rather than paraphrased.",
                "type": "string"
              },
              "to": {
                "description": "Trading day, YYYY-MM-DD",
                "type": "string"
              }
            },
            "required": ["data_as_of", "events", "from", "server_version", "summary", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Market calendar"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
