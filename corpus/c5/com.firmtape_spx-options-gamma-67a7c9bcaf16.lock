        {
          "name": "get_level_history",
          "title": "Level history",
          "description": "How the SPX dealer-positioning levels MOVED across recent finished sessions: the zero-gamma flip, call wall and put wall day by day, each session's change from the one before, and summary statistics for the window (flip range, net drift, mean daily movement, how often price closed above the flip). Use when: the question is about a trend or a window — has the flip been climbing, how far does it travel in a week — instead of calling get_levels once per day. Not for: one day (get_levels / get_session) or anything inside a session (get_gex_profile). ES: pass symbol ES (or MES) for the same series in E-mini prices, each session moved by its own ES basis. Limits: finished sessions only, max 40 per call; days absent from the archive are reported in `missing`, never interpolated. Measurements only — no buy/sell signals, no forecast.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "contract": {
                "description": "Optional dated contract for a future symbol. Default is the front contract; in the two weeks before a roll the next one is measured too.",
                "examples": ["ESZ26", "ESH27"],
                "pattern": "^M?(ES|NQ)[FGHJKMNQUVXZ]\\d{1,2}$",
                "type": "string"
              },
              "days": {
                "description": "How many of the most recent finished sessions to read (default 20, max 40). Ignored when `from` is given.",
                "maximum": 40,
                "minimum": 2,
                "type": "integer"
              },
              "from": {
                "description": "Start of an explicit window, YYYY-MM-DD (inclusive). Overrides `days`.",
                "examples": ["2026-08-01"],
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "symbol": {
                "description": "SPX (default), or ES / MES: each session's levels and close moved by that session's ES basis at its close. Sessions without a measured basis are left out and listed in no_basis; with fewer than two measured, the answer is SPX's and says so.",
                "examples": ["SPX", "ES", "MES"],
                "type": "string"
              },
              "to": {
