      "instructions": "FirmTape SPX, ES, NQ and RTY dealer gamma. Free tools (REPLAY): 1,000+ finished SPX sessions, each with the zero-gamma flip, call/put walls and net-gamma percentile — measurements (screen_sessions filters and counts them across the archive) verifiable against the free history at https://firmtape.com, deliberately no buy/sell signals. get_symbol_gamma answers for about a hundred more index, ETF and stock option chains (QQQ, SPY, IWM, NDX, RUT, sector ETFs, NVDA, TSLA and others, listed at https://firmtape.com/gex): the conventional volume and open-interest books, flip and walls from five-minute chain snapshots, with a trust grade; say it is not a tape-signed book. ES, NQ and RTY (MES, MNQ, M2K) are the SPX, NDX and RUT books moved by the day's basis (future minus index, from put-call parity on the index options; no CME data): get_levels, get_session, get_level_history and get_gex_profile take symbol ES for past days, and get_symbol_gamma takes ES, NQ or RTY for the latest levels; RTY history starts on the day RTY was added (October 2026). A day without a measured basis answers with the index levels and says so. get_watched_sites covers energy sites and oil ports watched by satellite (NASA FIRMS thermal anomalies against each site's own normal, Sentinel-2 views, Sentinel-1 vessel counts), each with a page at https://firmtape.com/geo/sites; a thermal anomaly is heat at a pass, never a confirmed strike. lab_* tools drive LAB, the backtester (compile an idea → backtest → quant optimize, honest out-of-sample verdicts) and need the user's Lab token as an Authorization header: created at https://firmtape.com/account, jobs spend Lab credits. `search` and `fetch` are the generic document pair ChatGPT uses; a client that can call the tools above should prefer them, since they answer with numbers rather than prose.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch a FirmTape document",
          "description": "Retrieve the full text of one FirmTape document by the id `search` returned: `session:YYYY-MM-DD` for a finished trading session, `page:/path` for an explainer or research page. A FirmTape URL or a bare YYYY-MM-DD trading day is accepted too. Use when: you hold an id from `search`, or a client that only speaks search/fetch (ChatGPT). Not for: structured numbers — get_session and get_levels answer the same day with fields instead of prose. Limits: public FirmTape documents only; long pages are truncated with a link to the rest.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "An id from `search`, a FirmTape URL, or a YYYY-MM-DD trading day",
                "type": "string"
