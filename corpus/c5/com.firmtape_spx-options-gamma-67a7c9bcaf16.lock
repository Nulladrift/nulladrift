        {
          "name": "get_coverage",
          "title": "Archive coverage",
          "description": "What the free FirmTape SPX archive holds: the first and last finished session, how many sessions, and the NYSE trading days in that span that are MISSING from it (weekdays minus US market holidays; early closes count as trading days), optionally inside a from/to window. Use when: 'is 2024-03-15 in the archive', 'how complete is 2023', 'which days are missing' before a study that needs every session. Not for: the newest days themselves (list_sessions) or any measurement (get_session). Limits: the trading calendar covers 2022 to 2026; missing days are reported, never filled in.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "First day of the window, YYYY-MM-DD (default: the archive's first session)",
                "examples": ["2024-01-01"],
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "to": {
                "description": "Last day of the window, YYYY-MM-DD (default: the archive's last session)",
                "examples": ["2024-12-31"],
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "calendar": {
                "description": "Which trading calendar the missing days were computed against",
                "type": "string"
              },
              "data_as_of": {
                "description": "The time this answer's data is true as of, ISO 8601 with the ET offset: a finished session's close (13:00 on an early close), the minute a ladder was read at, or the source's own build stamp. Null when the source states none.",
                "type": ["string", "null"]
              },
              "first_session": {
                "description": "Oldest session the archive holds in the window, YYYY-MM-DD",
                "type": ["string", "null"]
              },
              "last_session": {
                "description": "Newest session the archive holds in the window, YYYY-MM-DD",
                "type": ["string", "null"]
              },
              "missing": {
                "description": "NYSE trading days in that span the archive does not hold, oldest first",
                "items": {
                  "description": "Trading day, YYYY-MM-DD",
