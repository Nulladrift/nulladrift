                      "description": "geopolitics, macro, central_bank, energy, rates, stock, clock or other",
                      "type": ["string", "null"]
                    },
                    "tape_confirmed": {
                      "description": "True when the tape itself moved at the minute (a one-minute index move of 4 sigma of the trailing half hour, or 3 sigma with the book moving too)",
                      "type": "boolean"
                    },
                    "time": {
                      "description": "Clock minute in ET, HH:MM",
                      "type": "string"
                    },
                    "url": {
                      "description": "The first official article on the item, from the publisher's own feed (flash rows, when matched)",
                      "type": "string"
                    },
                    "url_at": {
                      "description": "HH:MM ET the article appeared",
                      "type": "string"
                    },
                    "usually": {
                      "description": "What usually followed this class of minute across every session measured: count, median 15-minute move, share that continued the 5-minute move",
                      "type": "string"
                    },
                    "z": {
                      "description": "The one-minute spot move in sigmas of the trailing half hour",
                      "type": ["number", "null"]
                    }
