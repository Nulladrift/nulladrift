                  },
                  "expiry": {
                    "type": ["string", "null"]
                  },
                  "future": {
                    "type": "string"
                  },
                  "index": {
                    "description": "The index whose book was moved: SPX, NDX or RUT",
                    "type": "string"
                  },
                  "method": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
