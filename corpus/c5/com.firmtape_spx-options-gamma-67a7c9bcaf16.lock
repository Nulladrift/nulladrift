                "type": "string"
              },
              "tape_only": {
                "description": "Only minutes the tape confirmed (default true; false adds the flashes the tape ignored and the calendar events it did not react to)",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data_as_of": {
                "description": "The time this answer's data is true as of, ISO 8601 with the ET offset: a finished session's close (13:00 on an early close), the minute a ladder was read at, or the source's own build stamp. Null when the source states none.",
                "type": ["string", "null"]
              },
              "day": {
                "description": "Trading day, YYYY-MM-DD",
                "type": "string"
              },
              "minutes": {
                "description": "The marked minutes of the session in clock order",
                "items": {
                  "properties": {
                    "desks": {
                      "description": "How many public desks carried an item inside three minutes (flash rows)",
                      "type": "integer"
                    },
                    "flash_at": {
                      "description": "HH:MM:SS ET of the first desk's item (flash rows)",
                      "type": ["string", "null"]
                    },
                    "flip": {
                      "description": "The zero-gamma flip at the minute",
                      "type": ["number", "null"]
                    },
                    "kind": {
                      "description": "calendar (a scheduled event owned the minute), flash (public news desks carried an item beside it), or book (no headline: the dealer book moved on its own)",
                      "type": "string"
                    },
                    "label": {
                      "description": "FirmTape's own label: the event's name, a headline class, or 'no headline, the book did this'. Never a headline's text.",
                      "type": "string"
                    },
                    "move_15": {
                      "description": "Index points from the minute before to fifteen minutes on",
                      "type": ["number", "null"]
                    },
                    "move_5": {
                      "description": "Index points from the minute before to five minutes on",
                      "type": ["number", "null"]
                    },
                    "publisher": {
                      "description": "The publisher of that article",
                      "type": "string"
