        {
          "name": "get_symbol_gamma",
          "title": "Gamma for another symbol, ES, NQ or RTY",
          "description": "The latest dealer gamma picture for a symbol OTHER than the SPX archive: index, ETF and stock option chains (for example QQQ, SPY, IWM, NDX, RUT, NVDA, TSLA, GLD, TLT), and the E-mini futures ES, NQ and RTY (MES, MNQ, M2K): ES/NQ/RTY are the SPX/NDX/RUT books moved by the day's basis (future minus index, from put-call parity on the index options; no CME data). Returns spot, the zero-gamma flip, call and put walls and net gamma for the VOLUME book and the OPEN_INTEREST book, the heaviest strikes, a per-expiry table and a trust grade. Use when: the question is about a ticker's gamma exposure, flip or walls right now or at the last close, including ES, NQ or RTY gamma levels. Not for: SPX or ES history or a past date (get_session, get_levels, get_gex_profile, which take symbol ES for past days); anything inside a past session. Limits: latest snapshot only (rebuilt every few minutes in session hours); calls count as dealer-long and puts as dealer-short, which is a convention, not a measurement, and on single stocks it is an approximation (see trust.grade: A and B are indices and ETFs, C and D single stocks). Units: US dollars of dealer delta per 1% move.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "contract": {
                "description": "Optional dated contract for a future symbol. Default is the front contract; in the two weeks before a roll the next one is measured too.",
                "examples": ["ESZ26", "NQH27", "RTYZ26"],
                "pattern": "^(M?ES|M?NQ|RTY|M2K)[FGHJKMNQUVXZ]\\d{1,2}$",
                "type": "string"
              },
              "symbol": {
                "description": "The ticker, or ES / MES / NQ / MNQ / RTY / M2K (a dated code such as ESZ26 or RTYZ26 works too). Carried symbols are listed at https://firmtape.com/gex; an unknown ticker returns an error naming that page.",
                "examples": ["QQQ", "NVDA", "ES", "NQ", "RTY"],
                "pattern": "^\\$?([A-Za-z]{1,5}|[Mm]2[Kk][A-Za-z]?)(\\d{1,2})?$",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Gamma for another symbol, ES, NQ or RTY"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
