        {
          "name": "screen_sessions",
          "title": "Screen sessions",
          "description": "Filter the finished SPX sessions in the FirmTape archive by their closing measurements and count them: regime at the close and at the open, zero-gamma flip crossings, direction and size of the move, net-gamma percentile, 0DTE ATM IV at the open, the calendar event, weekday and year. Returns how many sessions match, two shares over them (closed above the flip, mean absolute move) printed next to the same shares over the whole archive, and the matched days. A matched share close to the archive's share is a base rate, not a pattern. Use when: 'how often did FOMC days close in negative gamma', 'the days that closed below the flip with the percentile under 20', 'largest moves on CPI days since 2024'. Not for: one day's numbers (get_session), gamma by strike (get_gex_profile), or testing a rule with out-of-sample statistics (the Lab). Limits: counts over finished sessions' closing measurements only, no per-strike data; at most 50 sessions listed per call. Counts, not investment advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cross": {
                "description": "Flip crossings in the session: 0 = none, 1 = exactly one, 2 = two or more",
                "enum": ["0", "1", "2"],
                "type": "string"
              },
              "dir": {
                "description": "Direction of the open-to-close move",
                "enum": ["up", "down"],
                "type": "string"
              },
              "dow": {
                "description": "Day of the week",
                "enum": ["mon", "tue", "wed", "thu", "fri"],
                "type": "string"
              },
              "event": {
                "description": "Event the day carried: fomc (decision days), cpi, nfp (payrolls), pce, ppi, gdp, retail (retail sales), jolts, ism, claims, auctions (Treasury), fed (speeches, Beige Book), opex (expiration), vix (VIX settlement), umich, confidence, eia, halts (halt in a top name), housing (housing and durables), refunding, rebalances (index), none (no event of these kinds)",
                "enum": ["fomc", "cpi", "nfp", "pce", "ppi", "gdp", "retail", "jolts", "ism", "claims", "auctions", "fed", "opex", "vix", "umich", "confidence", "eia", "halts", "housing", "refunding", "rebalances", "none"],
                "type": "string"
              },
              "gpct": {
                "description": "Net-gamma percentile at the close: under 20, 20 to 50, 50 to 80, 80 and above",
                "enum": ["lt20", "20-50", "50-80", "gt80"],
                "type": "string"
              },
              "iv": {
                "description": "0DTE ATM implied vol at the open: under 10%, 10-15%, 15-20%, 20% and above",
                "enum": ["lt10", "10-15", "15-20", "gt20"],
                "type": "string"
              },
              "limit": {
                "description": "How many matched sessions to list (default 20, max 50); the counts always cover every match",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "move": {
                "description": "Size of the open-to-close move: under 0.5%, 0.5% or more, 1% or more, 2% or more",
                "enum": ["lt05", "gt05", "gt1", "gt2"],
                "type": "string"
              },
              "open": {
                "description": "Regime at the open: pos = opened above the flip, neg = below",
                "enum": ["pos", "neg"],
                "type": "string"
              },
              "regime": {
                "description": "Regime at the close: pos = closed above the zero-gamma flip, neg = below",
                "enum": ["pos", "neg"],
                "type": "string"
              },
              "sort": {
                "description": "Order of the sessions list: newest (default), oldest, move (largest absolute move first), gpct (highest percentile first)",
                "enum": ["newest", "oldest", "move", "gpct"],
                "type": "string"
              },
              "year": {
                "description": "Calendar year, e.g. 2025; a year outside the archive is dropped",
                "pattern": "^\\d{4}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "archived": {
                "description": "Finished sessions in the archive",
                "type": "integer"
              },
              "data_as_of": {
                "description": "The time this answer's data is true as of, ISO 8601 with the ET offset: a finished session's close (13:00 on an early close), the minute a ladder was read at, or the source's own build stamp. Null when the source states none.",
                "type": ["string", "null"]
              },
              "filters": {
                "description": "The filters the screener accepted; a value outside the vocabulary is dropped, not an error",
