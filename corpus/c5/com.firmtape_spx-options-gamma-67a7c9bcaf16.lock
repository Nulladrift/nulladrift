        {
          "name": "similar_days",
          "title": "Similar days",
          "description": "Find the finished SPX sessions whose state at the same time of day was nearest to one moment, and what the rest of each of those days did. The state is eight volume-book measurements: distance from the zero-gamma flip, move since the open, distance from the session mean, net-gamma percentile, 0DTE ATM IV and its change since the open, the range so far, and the time spent above the flip. Returns the nearest days (one moment each, with a replay link), their shares (rest of day up, mean move to the close, closed above the flip) and the SAME shares over every archived moment in the same quarter-hours: a matched share close to the archive's is a base rate, not a pattern. Use when: 'what happened on days like this', 'days that looked like 2026-10-14 at 11:00'. Not for: filtering by named conditions such as FOMC or a percentile band (screen_sessions), or testing a rule out of sample (the Lab). Limits: finished sessions from 09:45 to 15:30 ET, SPX only. Similar on these eight numbers and nothing else; history, not a forecast and not investment advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "day": {
                "description": "The trading day of the moment, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "k": {
                "description": "How many similar days to return (default 15)",
                "maximum": 30,
                "minimum": 5,
                "type": "integer"
              },
              "lanes": {
                "description": "Only for a session still running, which the archive does not hold yet: the day's minute series from 09:30, one entry per minute (volume-book flip and percentile). FirmTape's own terminal sends these.",
                "properties": {
                  "atmiv": {
                    "items": {
                      "type": ["number", "null"]
                    },
                    "type": "array"
                  },
                  "b2u": {
                    "items": {
                      "type": ["number", "null"]
                    },
                    "type": "array"
                  },
                  "flip": {
                    "items": {
                      "type": ["number", "null"]
                    },
                    "type": "array"
                  },
                  "gpct": {
                    "items": {
                      "type": ["number", "null"]
                    },
                    "type": "array"
                  },
                  "minutes": {
                    "items": {
                      "pattern": "^\\d{2}:\\d{2}$",
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "spot": {
                    "items": {
                      "type": ["number", "null"]
                    },
                    "type": "array"
                  },
                  "vwap": {
                    "items": {
                      "type": ["number", "null"]
                    },
                    "type": "array"
                  }
                },
                "required": ["atmiv", "b2u", "flip", "gpct", "minutes", "spot", "vwap"],
                "type": "object"
              },
              "minute": {
                "description": "The ET minute, HH:MM; default the last minute with a full state (the close for a finished day)",
                "pattern": "^\\d{2}:\\d{2}$",
                "type": "string"
              }
            },
            "required": ["day"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "archive": {
                "description": "The same shares over every archived moment in the same quarter-hours; n counts days",
                "properties": {
                  "closed_above_flip_pct": {
                    "description": "Percent that closed above the day's closing zero-gamma flip",
                    "type": ["number", "null"]
                  },
                  "mean_abs_rest_pct": {
                    "description": "Mean absolute move from that minute to the close, %",
                    "type": ["number", "null"]
                  },
                  "mean_rest_pct": {
                    "description": "Mean move from that minute to the close, %",
                    "type": ["number", "null"]
                  },
                  "n": {
                    "description": "Days counted",
                    "type": "integer"
                  },
                  "up_pct": {
                    "description": "Percent whose rest of the day went up",
                    "type": ["number", "null"]
                  }
                },
                "type": "object"
              },
              "data_as_of": {
                "description": "The time this answer's data is true as of, ISO 8601 with the ET offset: a finished session's close (13:00 on an early close), the minute a ladder was read at, or the source's own build stamp. Null when the source states none.",
                "type": ["string", "null"]
              },
              "day": {
                "type": "string"
              },
              "days": {
