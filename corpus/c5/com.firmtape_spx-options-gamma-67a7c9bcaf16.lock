              },
              "label": {
                "description": "The filters in words",
                "type": "string"
              },
              "matched": {
                "description": "Sessions matching every filter",
                "type": "integer"
              },
              "question_url": {
                "description": "When the filters are one of the screener's common questions, that question's own page (e.g. /screener/negative-gamma-closes), the address to cite",
                "format": "uri",
                "type": "string"
              },
              "screened": {
                "description": "Sessions whose closing measurements were available to screen",
                "type": "integer"
              },
              "server_version": {
                "description": "Version of the FirmTape MCP server that produced this answer",
                "type": "string"
              },
              "sessions": {
                "description": "Matched sessions in the requested order (default newest first), at most `limit`",
                "items": {
                  "properties": {
                    "close": {
                      "type": ["number", "null"]
                    },
                    "close_vs_flip": {
                      "description": "Close minus flip, index points",
                      "type": ["number", "null"]
                    },
