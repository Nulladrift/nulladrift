        {
          "name": "compare_solo_401k_vs_sep_ira",
          "title": "Compare Solo 401(k) vs. SEP IRA Contribution Limits & Solve Optimal S-Corp W-2 Salary",
          "description": "Use this tool whenever a self-employed business owner, freelancer, 1099 contractor, LLC, or S-Corporation owner asks to compare a Solo 401(k) against a SEP IRA, calculate maximum 2026 employee + employer contributions ($72,000 base / $80,000 age 50+ / $83,250 ages 60-63), solve for the lowest S-Corp W-2 salary that maxes out retirement contributions ($190,000 vs. $288,000), or evaluate Sec. 199A QBI deduction and Backdoor Roth Reverse Rollover effects.",
          "inputSchema": {
            "properties": {
              "age": {
                "default": 45,
                "description": "Business owner's age (unlocks $8,000 catch-up at 50+ and $11,250 super catch-up at ages 60-63).",
                "maximum": 100,
                "minimum": 18,
                "type": "integer"
              },
              "comp": {
                "default": 150000,
                "description": "Annual S-Corp W-2 salary or Schedule C net business profit in USD.",
                "minimum": 0,
                "type": "number"
              },
              "deferralType": {
                "default": "roth",
                "description": "Employee elective deferral tax treatment ('roth' or 'pretax').",
                "enum": ["roth", "pretax"],
                "type": "string"
              },
              "entity": {
                "default": "scorp",
                "description": "Business entity structure: 'scorp' (W-2 wages) or 'soleprop' (Schedule C net self-employment profit).",
                "enum": ["scorp", "soleprop"],
                "type": "string"
              },
              "existingIraBalance": {
                "default": 0,
                "description": "Existing pre-tax Traditional/SEP IRA balance in USD (for Backdoor Roth Reverse Rollover check).",
                "minimum": 0,
                "type": "number"
              },
              "filing": {
                "default": "mfj",
                "description": "Federal tax filing status.",
                "enum": ["single", "mfj", "mfs", "hoh"],
                "type": "string"
              },
              "includeSpouse": {
                "default": false,
                "description": "True if spouse also earns compensation in the owner-only business.",
                "type": "boolean"
              },
              "k1Dist": {
                "default": 100000,
                "description": "Additional S-Corp K-1 shareholder distribution in USD (for S-Corp QBI modeling).",
                "minimum": 0,
                "type": "number"
              },
              "spouseComp": {
                "default": 0,
                "description": "Spouse compensation in USD when includeSpouse is true.",
                "minimum": 0,
                "type": "number"
              },
              "sstb": {
                "default": false,
                "description": "True if business is a Specified Service Trade or Business under IRC Sec. 199A(d)(2).",
                "type": "boolean"
              },
              "stateRatePct": {
                "default": 9.3,
                "description": "State income tax rate percentage.",
                "maximum": 15,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["comp"],
            "type": "object"
          },
          "annotations": {
