              },
              "liquidityNeeded": {
                "default": 400000,
                "description": "Net after-tax cash liquidity required in USD.",
                "minimum": 10000,
                "type": "number"
              },
              "loanYears": {
                "default": 3,
                "description": "Number of years the bridge loan / SBLOC will remain outstanding.",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "marketReturn": {
                "default": 7.5,
                "description": "Expected annual portfolio return percentage while invested.",
                "maximum": 15,
                "minimum": 0,
                "type": "number"
              },
              "portfolioCostBasis": {
                "default": 400000,
                "description": "Total original cost basis of the taxable portfolio in USD.",
                "minimum": 0,
                "type": "number"
              },
              "portfolioValue": {
                "default": 2000000,
                "description": "Total taxable brokerage portfolio market value in USD.",
                "minimum": 50000,
                "type": "number"
              },
              "sblocRate": {
                "default": 6.25,
