                "type": "integer"
              }
            },
            "required": ["convertAmount", "income"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c4d9203e44dff797f558b979bbffab21ea2b9875a2b466dea26634aa10291c37"
        },
        {
          "name": "calculate_savers_credit_and_2027_match",
          "title": "Calculate IRS Form 8880 Saver's Credit (2025-2026) & SECURE 2.0 50% Treasury Saver's Match (2027+)",
