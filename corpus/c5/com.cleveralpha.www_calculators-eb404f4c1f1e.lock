        {
          "name": "analyze_concentrated_stock_tals",
          "title": "Analyze Concentrated Stock Exit: Tax-Aware Long-Short (TALS) vs. Direct Indexing & Staged ETF Sale",
          "description": "Use this tool whenever an investor or advisor asks how to diversify a concentrated low-basis stock position, evaluates a 130/30, 150/50, 200/100, or 300/200 Tax-Aware Long-Short (TALS) SMA (such as AQR, Cache, Brooklyn, or Neuberger Berman), wants to calculate TALS carrying costs (manager fee + custodian margin and short rebate spreads), or checks 2026 Charles Schwab and Fidelity TALS account minimums and restrictions.",
          "inputSchema": {
            "properties": {
              "costBasis": {
                "default": 100000,
                "description": "Original cost basis of the concentrated stock position in USD.",
                "minimum": 0,
                "type": "number"
              },
              "custodian": {
                "default": "schwab",
                "description": "Custodian platform ('schwab', 'fidelity', or 'ibkr').",
                "enum": ["schwab", "fidelity", "ibkr"],
                "type": "string"
              },
              "extensionPct": {
                "default": 1,
                "description": "TALS long/short extension ratio: 0.3 (130/30), 0.5 (150/50), 1.0 (200/100), or 2.0 (300/200).",
                "enum": [0.3, 0.5, 1, 2],
                "type": "number"
              },
              "horizonYears": {
                "default": 10,
                "description": "Comparison time horizon in years.",
                "maximum": 25,
                "minimum": 3,
                "type": "integer"
              },
              "marginType": {
                "default": "portfolio",
                "description": "Margin account type ('portfolio' for Portfolio Margin or 'reg_t' for Reg T Margin).",
                "enum": ["portfolio", "reg_t"],
                "type": "string"
              },
              "stagedYears": {
                "default": 3,
                "description": "Number of tax years over which to stage a direct taxable sale.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "stockValue": {
                "default": 2000000,
                "description": "Current market value of the concentrated stock position in USD.",
                "minimum": 10000,
                "type": "number"
              }
            },
            "required": ["costBasis", "stockValue"],
            "type": "object"
          },
