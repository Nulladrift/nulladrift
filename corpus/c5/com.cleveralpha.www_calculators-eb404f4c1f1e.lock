                "type": "string"
              },
              "hasLtcg": {
                "default": false,
                "description": "Whether household holds long-term capital gains or qualified dividends affected by the 0% LTCG ceiling.",
                "type": "boolean"
              },
              "income": {
                "default": 180000,
                "description": "Baseline household income (MAGI) in USD before the Roth conversion.",
                "minimum": 0,
                "type": "number"
              },
              "iraBasis": {
                "default": 0,
                "description": "Existing non-deductible after-tax basis in Traditional IRAs reported on IRS Form 8606 in USD.",
                "minimum": 0,
                "type": "number"
              },
              "itemizesSalt": {
                "default": false,
