        {
          "name": "simulate_form_1040_and_bracket_room",
          "title": "Simulate 2026 Federal Form 1040 Return (Lines 1a-38), Remaining Bracket Room & ACA / 0% LTCG Ceilings",
          "description": "Use this tool whenever a user asks for a complete 2025, 2026, or 2027 Form 1040 federal tax return estimate, how much room they have left in their current marginal tax bracket, how much Long-Term Capital Gains they can harvest at 0% federal tax, whether they will breach the 2026 ACA 400% FPL health insurance subsidy cliff (Form 8962), or how Social Security taxation (Line 6b), the OBBBA Schedule 1-A Senior Deduction (Line 13a), and Form 8995 QBI (Line 13b) flow through Form 1040.",
          "inputSchema": {
            "properties": {
              "filing": {
                "default": "mfj",
                "description": "Federal tax filing status (single, mfj, hoh, or mfs).",
                "enum": ["single", "mfj", "hoh", "mfs"],
                "type": "string"
              },
              "iraDistributions": {
                "default": 0,
                "description": "Form 1040 Line 4b Taxable IRA, 401(k), or RMD distributions in USD.",
                "minimum": 0,
                "type": "number"
              },
              "netLtcg": {
                "default": 42000,
                "description": "Form 1040 Line 7a Net Long-Term Capital Gain in USD.",
                "type": "number"
              },
              "qualifiedDividends": {
                "default": 12000,
                "description": "Form 1040 Line 3a Qualified Dividends in USD.",
                "minimum": 0,
                "type": "number"
              },
              "rothConversions": {
                "default": 20000,
                "description": "Form 1040 Line 4b Taxable Roth conversions in USD.",
                "minimum": 0,
                "type": "number"
              },
              "seniors65Plus": {
                "default": 0,
                "description": "Number of taxpayers on the return age 65 or older (0, 1, or 2).",
                "maximum": 2,
                "minimum": 0,
                "type": "integer"
              },
