        {
          "name": "analyze_estate_tax_and_stepup",
          "title": "Analyze Estate Tax, Revocable Trust Step-Up in Basis (IRC Sec. 1014) vs. Lifetime Gifting (Sec. 1015)",
          "description": "Use this tool whenever a user asks about federal or state estate taxes, the 2026 $15,000,000 Single / $30,000,000 Married OBBBA estate tax exemption, whether to gift appreciated stock/real estate during life (IRC Sec. 1015 carryover basis) vs. holding in a Revocable Living Trust until death for the IRC Sec. 1014 step-up in basis, Irrevocable Grantor Trusts / SLATs under IRS Revenue Ruling 2023-2 and Sec. 675(4)(C) swap powers, or state estate tax cliffs (NY, MA, WA, OR, IL, MD, MN, CT).",
          "inputSchema": {
            "properties": {
              "appreciatedAssetValue": {
                "default": 2500000,
                "description": "Current market value of appreciated taxable assets (stocks, ETFs, real estate) in USD.",
                "minimum": 0,
                "type": "number"
              },
              "assetCostBasis": {
                "default": 250000,
                "description": "Original cost basis of the appreciated assets in USD.",
                "minimum": 0,
                "type": "number"
              },
              "filing": {
                "default": "mfj",
                "description": "'mfj' for Married Couple (with DSUE Portability) or 'single' for Single/Widowed.",
                "enum": ["single", "mfj"],
                "type": "string"
              },
              "heirStateRate": {
                "description": "Heirs' state capital gains tax rate percentage (defaults to selected stateCode rate).",
                "maximum": 16,
                "minimum": 0,
                "type": "number"
              },
              "horizonYears": {
                "default": 15,
                "description": "Projected years until estate transfer.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "stateCode": {
                "default": "NONE",
                "description": "State estate tax jurisdiction code.",
                "enum": ["NONE", "NY", "MA", "OR", "WA", "IL", "MD", "MN", "CT"],
                "type": "string"
              },
              "totalEstateNow": {
                "default": 6000000,
                "description": "Total current net worth / gross estate in USD.",
                "minimum": 0,
                "type": "number"
              },
              "useSwapPower": {
                "default": true,
                "description": "True if grantor exercises IRC Sec. 675(4)(C) cash substitution power before death on Path C SLAT.",
                "type": "boolean"
              },
              "year": {
                "default": 2026,
                "description": "Exemption year (2025 $13.99M, 2026 $15.0M OBBBA, or 2027 $15.45M Projected).",
                "enum": [2025, 2026, 2027],
                "type": "integer"
              }
            },
            "required": ["appreciatedAssetValue", "totalEstateNow"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:28f97082da4be4401fad08e00457aa56f39feae242b0725265ef55f559cbc7d6"
        },
        {
          "name": "calculate_rmd_and_tax_cliffs",
          "title": "Calculate Lifetime Required Minimum Distribution (RMD), Tax Cliffs, Surviving Spouse Widow's Penalty & W-4R Withholding Plan",
          "description": "Use this tool whenever a user asks to calculate the account owner's own lifetime Required Minimum Distribution (RMD) for 2025, 2026, or 2027 (Uniform Lifetime Table III, or Joint Table II when the sole-beneficiary spouse is more than 10 years younger), the federal and state tax cost of that RMD including Social Security taxation, the $6,000 OBBBA senior deduction phase-out and Medicare IRMAA tiers, Qualified Charitable Distribution (QCD) offsets, a surviving-spouse treat-as-own vs. inherited comparison with the Widow's Penalty tax jump, and an optional Form W-4R withholding plan (federal/state withholding on the RMD, net cash, and the IRC Sec. 6654 / Pub 505 prior-year safe-harbor gap). This tool does NOT compute inherited (non-spouse beneficiary) RMD schedules or missed-RMD excise penalties; for those, direct the user to the interactive calculator's Inherited and Missed-RMD modes at the returned interactiveCalculatorUrl.",
          "inputSchema": {
            "properties": {
              "balance": {
                "default": 1000000,
                "description": "Prior December 31 retirement account balance in USD (Form 5498 FMV).",
                "minimum": 0,
                "type": "number"
              },
              "fedWithholdingPct": {
                "description": "OPTIONAL. Federal income tax withholding percentage to elect on Form W-4R line 2 for this RMD (0-100). Nonperiodic IRA distributions default to 10% if the payee makes no election. Supplying this (or any withholding* / priorYear* field) adds a withholdingPlan block to the output.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "federalTaxPaidToDate": {
                "default": 0,
                "description": "OPTIONAL. Federal tax already paid for the current year in USD (paycheck/pension withholding plus Form 1040-ES estimates), not counting withholding on this RMD.",
                "minimum": 0,
                "type": "number"
              },
              "filing": {
                "default": "mfj",
                "description": "Federal tax filing status (single, mfj, mfs, or hoh).",
                "enum": ["single", "mfj", "mfs", "hoh"],
                "type": "string"
              },
              "otherIncome": {
                "default": 60000,
                "description": "Estimated other ordinary taxable income in USD for the tax year, EXCLUDING this RMD and Social Security. For filing status mfj this must be the COMBINED income of both spouses (wages, pensions, interest, other IRA distributions, etc.). Used only for the tax-cliff and withholding layers; the RMD amount itself never depends on income or filing status. If uncertain, use last year's AGI minus last year's RMD.",
                "minimum": 0,
                "type": "number"
              },
              "ownerBirthYear": {
                "default": 1952,
                "description": "Account owner's 4-digit birth year (determines Applicable RMD Age: 70.5, 72, 73, or 75).",
                "maximum": 2000,
                "minimum": 1920,
                "type": "integer"
              },
              "priorYearAgi": {
                "description": "OPTIONAL. Prior-year adjusted gross income (Form 1040 line 11) in USD; determines whether the 100% or 110% prior-year safe-harbor percentage applies.",
                "minimum": 0,
                "type": "number"
              },
              "priorYearTax": {
                "description": "OPTIONAL. Prior-year total federal tax (Form 1040 line 24) in USD. Unlocks the IRC Sec. 6654 / Pub 505 safe-harbor check: prepaying 100% of prior-year tax (110% if prior-year AGI exceeded $150,000; $75,000 mfs) avoids an underpayment penalty regardless of current-year income.",
                "minimum": 0,
                "type": "number"
              },
              "qcdAmount": {
                "default": 0,
                "description": "Qualified Charitable Distribution (QCD) amount in USD transferred directly from IRA to charity (IRC Sec. 408(d)(8)).",
                "minimum": 0,
                "type": "number"
              },
              "spouseBirthYear": {
                "default": 1954,
                "description": "Spouse's 4-digit birth year. Triggers Joint Table II when the spouse is the sole primary beneficiary and more than 10 years younger; also used for the surviving-spouse comparison and (for mfj) the household age-65+ deductions.",
                "maximum": 2005,
                "minimum": 1920,
                "type": "integer"
              },
              "ssBenefits": {
                "default": 40000,
                "description": "Annual gross Social Security benefits in USD for the household (both spouses combined for mfj); enter 0 if not yet claiming.",
                "minimum": 0,
                "type": "number"
              },
              "stateRatePct": {
                "default": 9.3,
                "description": "State income tax rate percentage (e.g. 9.3 for California, 0 for Texas/Florida).",
                "maximum": 15,
                "minimum": 0,
                "type": "number"
              },
              "stateWithholdingPct": {
                "default": 0,
                "description": "OPTIONAL. State income tax withholding as a percentage of the distribution. California defaults to 10% of the federal amount (1% of the distribution at 10% federal) unless the payee elects otherwise on Form DE 4P.",
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              },
              "year": {
                "default": 2026,
                "description": "Distribution calendar year (2025, 2026, or 2027).",
                "enum": [2025, 2026, 2027],
                "type": "integer"
              }
            },
            "required": ["balance", "ownerBirthYear"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5be8b28c2f114e8db972dd2c420728573f9000ed9ca6280d4f3286cc78314ac4"
        },
        {
          "name": "calculate_roth_conversion",
          "title": "Calculate Roth Conversion Tax Cost, Backdoor Roth Pro-Rata & IRMAA / Bracket Cliff Ceilings",
          "description": "Use this tool whenever a user asks how much to convert from a Traditional/Rollover IRA to a Roth IRA, how to avoid crossing the next federal tax bracket or Medicare IRMAA cliff, how the IRC Sec. 408(d)(2) Pro-Rata rule affects a Backdoor Roth IRA, or how to model a $72,000 Mega Backdoor Roth 401(k) conversion.",
          "inputSchema": {
            "properties": {
              "age": {
                "default": 58,
                "description": "Current age of the taxpayer (triggers Medicare IRMAA lookback at 63+ and OBBBA Senior Deduction at 65+).",
                "maximum": 100,
                "minimum": 18,
                "type": "integer"
              },
              "convertAmount": {
                "default": 50000,
                "description": "Proposed dollar amount in USD to convert to a Roth IRA this year.",
                "minimum": 0,
                "type": "number"
              },
              "filing": {
                "default": "mfj",
                "description": "Federal tax filing status (single, mfj, mfs, or hoh).",
