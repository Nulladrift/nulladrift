              },
              "stateRatePct": {
                "default": 9.3,
                "description": "State income tax rate percentage.",
                "maximum": 15,
                "minimum": 0,
                "type": "number"
              },
              "taxYear": {
                "default": 2026,
                "description": "Tax year (2025, 2026, or 2027).",
