      },
      "transport": {
        "type": "http",
        "url": "https://mcp.pdfdocpreflight.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Book Preflight",
        "title": "Book Preflight",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Book Preflight answers print-book questions for Amazon KDP, IngramSpark and Lulu with the same engine as pdfdocpreflight.com. Numbers come from each platform's own published documentation (sources and verification dates are in every result).\n- Use get_platform_specs for a platform's trim sizes, bleed, margins, page limits and file rules.\n- Use calculate_spine_width for spine width only, and calculate_cover_size for the full wraparound cover (back + spine + front + bleed).\n- If the author hasn't said which paper, leave paper out: the result then lists every paper so you can show the options instead of guessing.\n- Page count means interior pages (both sides of every sheet), including blank pages.\n- For hardcovers and anything going to print, tell the author to confirm with the platform's own cover template or calculator before ordering.",
      "tools": [
        {
          "name": "calculate_cover_size",
          "title": "Book cover size calculator",
          "description": "Use this when an author asks how big their full wraparound paperback or hardcover cover file must be for KDP, IngramSpark or Lulu. Takes the trim size, interior page count, binding and paper; returns the total width and height including bleed and spine, the back/spine/front breakdown, the barcode area and a link to check it on pdfdocpreflight.com.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "binding": {
                "default": "paperback",
                "description": "Binding. 'paperback' (default). KDP hardcover: 'hardcover' (KDP only offers case laminate). Lulu and IngramSpark: 'hardcover-casewrap' (printed case) or 'hardcover-jacket' (cloth case with dust jacket).",
                "enum": ["paperback", "hardcover", "hardcover-casewrap", "hardcover-jacket"],
                "type": "string"
              },
              "page_count": {
                "description": "Interior page count: every page of the interior PDF, including blank and front-matter pages (not sheets or leaves).",
                "maximum": 2000,
                "minimum": 1,
                "type": "integer"
              },
              "paper": {
                "description": "Interior paper and ink. KDP: 'bw-white' (Black ink, white paper), 'bw-cream' (Black ink, cream paper), 'bw-groundwood' (Black ink, groundwood paper), 'standard-color' (Standard color ink, white paper), 'premium-color' (Premium color ink, white paper). IngramSpark: 'groundwood-38-bw' (38# Groundwood, B&W), 'groundwood-40-bw-uk' (40# Groundwood, B&W (UK)), 'creme-50-bw' (50# Crème, B&W), 'white-50' (50# White, B&W or Color), 'white-70' (70# White, B&W / Color / Premium / Ultra Premium Color). Lulu: leave out (its spine width does not depend on paper). If you leave it out for KDP or IngramSpark, the result lists every paper so you can compare.",
                "enum": ["bw-white", "bw-cream", "bw-groundwood", "standard-color", "premium-color", "groundwood-38-bw", "groundwood-40-bw-uk", "creme-50-bw", "white-50", "white-70"],
                "type": "string"
              },
              "platform": {
                "description": "Print platform: 'kdp' (Amazon KDP), 'ingramspark' or 'lulu'.",
                "enum": ["kdp", "ingramspark", "lulu"],
                "type": "string"
              },
              "trim_size": {
                "description": "Finished book size, width × height, e.g. '6x9', '5.5 x 8.5 in', '152 x 229 mm', or a trim id from get_platform_specs (e.g. Lulu 'us-trade'). Width first.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["page_count", "platform", "trim_size"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3c8ce884a5e336e6f77bce1d692d1c55a5cc7d0fc554a14c26b0e0b9ab15f044"
        },
        {
          "name": "calculate_spine_width",
          "title": "Spine width calculator",
          "description": "Use this when an author asks for a book's spine width for KDP, IngramSpark or Lulu, or whether their book is thick enough for spine text. Takes the interior page count, binding and paper; returns the width in inches and mm, the formula used, the spine-text rule and a link to check it on pdfdocpreflight.com. For the full cover size, use calculate_cover_size instead.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "binding": {
                "default": "paperback",
                "description": "Binding. 'paperback' (default). KDP hardcover: 'hardcover' (KDP only offers case laminate). Lulu and IngramSpark: 'hardcover-casewrap' (printed case) or 'hardcover-jacket' (cloth case with dust jacket).",
                "enum": ["paperback", "hardcover", "hardcover-casewrap", "hardcover-jacket"],
                "type": "string"
              },
              "page_count": {
                "description": "Interior page count: every page of the interior PDF, including blank and front-matter pages (not sheets or leaves).",
                "maximum": 2000,
                "minimum": 1,
                "type": "integer"
              },
              "paper": {
                "description": "Interior paper and ink. KDP: 'bw-white' (Black ink, white paper), 'bw-cream' (Black ink, cream paper), 'bw-groundwood' (Black ink, groundwood paper), 'standard-color' (Standard color ink, white paper), 'premium-color' (Premium color ink, white paper). IngramSpark: 'groundwood-38-bw' (38# Groundwood, B&W), 'groundwood-40-bw-uk' (40# Groundwood, B&W (UK)), 'creme-50-bw' (50# Crème, B&W), 'white-50' (50# White, B&W or Color), 'white-70' (70# White, B&W / Color / Premium / Ultra Premium Color). Lulu: leave out (its spine width does not depend on paper). If you leave it out for KDP or IngramSpark, the result lists every paper so you can compare.",
                "enum": ["bw-white", "bw-cream", "bw-groundwood", "standard-color", "premium-color", "groundwood-38-bw", "groundwood-40-bw-uk", "creme-50-bw", "white-50", "white-70"],
                "type": "string"
              },
              "platform": {
                "description": "Print platform: 'kdp' (Amazon KDP), 'ingramspark' or 'lulu'.",
                "enum": ["kdp", "ingramspark", "lulu"],
                "type": "string"
              }
            },
            "required": ["page_count", "platform"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
