              }
            ]
          },
          "digest": "sha256:d9717bd90ab7072e9ada8dc8676afa9e88b8179c53995b3297661e4b53736e80"
        },
        {
          "name": "fix_scan",
          "title": "Fix a scanned book",
          "description": "Turn a scanned book (PDF or DjVu, up to 1,000 pages) into a clean, searchable PDF for e-readers: pages cropped to the text, straightened, sharp black and white, two-page spreads split, and searchable text added. Use it when the user wants to fix, clean up, OCR or convert a scan for a Kindle, Kobo, reMarkable or tablet. Give exactly one source: file (a file the user attached here), source_url (a public https link to the file) or upload_id (from create_upload_link, after the user uploaded). It returns a scan_id at once and the book converts in the background; then call get_scan_status until it is ready and give the user the download link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "file": {
                "additionalProperties": false,
                "description": "A PDF or DjVu file the user attached in this chat.",
                "properties": {
                  "download_url": {
                    "description": "Where the attached file can be downloaded.",
                    "type": "string"
                  },
                  "file_id": {
                    "description": "The attachment's id.",
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "idempotency_key": {
                "description": "Optional. Repeat it on a retry so the same book is not started twice.",
                "maxLength": 128,
                "type": "string"
              },
              "language": {
                "default": "auto",
                "description": "The book's language for searchable text, as a Tesseract code; auto detects it.",
                "enum": ["auto", "ara", "chi_tra", "deu", "ell", "eng", "fra", "frk", "grc", "ita", "lat", "nld", "pol", "por", "rus", "san", "spa", "swe", "tam", "ukr"],
                "type": "string"
              },
              "output": {
                "default": "bw",
                "description": "bw: sharp black and white, best on e-ink. grey: gentle greyscale.",
                "enum": ["bw", "grey"],
                "type": "string"
              },
              "source_url": {
                "description": "A public https link to the PDF or DjVu file.",
                "format": "uri",
                "pattern": "^https://",
                "type": "string"
              },
              "split_spreads": {
                "default": true,
                "description": "Split scans of two facing pages into single pages.",
                "type": "boolean"
              },
              "trim_margins": {
                "default": true,
                "description": "Crop each page to its text block. Covers and picture pages stay whole.",
                "type": "boolean"
              },
              "upload_id": {
                "description": "The upload_id from create_upload_link, once the user has uploaded the file.",
                "pattern": "^job_[A-Za-z0-9_-]{1,60}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Fix a scanned book"
          },
          "behavior": {
            "destructive": false,
