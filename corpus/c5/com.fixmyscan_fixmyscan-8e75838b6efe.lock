      },
      "instructions": "FixMyScan turns scanned books (PDF or DjVu) into clean, searchable PDFs for e-readers. Start a book with fix_scan, then poll get_scan_status with its scan_id until it is ready and give the reader the download link. If you cannot pass the reader's file, call create_upload_link first; that includes a file attached in a chat that cannot hand attachments to tools. Files are deleted 24 hours after a book is ready.",
      "tools": [
        {
          "name": "cancel_scan",
          "title": "Stop a book",
          "description": "Stop a book that is converting or waiting to start. Use it only when the user asks to stop or cancel it. A cancelled book does not count as used.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "scan_id": {
                "description": "The scan_id fix_scan or list_my_scans gave.",
                "pattern": "^job_[A-Za-z0-9_-]{1,60}$",
                "type": "string"
              }
            },
            "required": ["scan_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Stop a book"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
