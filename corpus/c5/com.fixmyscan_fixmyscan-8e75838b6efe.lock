                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:67c843b16b1b8c0b8db1509871bf94882adbd40af86546a063875bbe29c60658"
        },
        {
          "name": "create_upload_link",
          "title": "Get an upload link",
          "description": "Get a link where the user uploads a scanned PDF or DjVu from their device. Use it when you cannot pass the user's file to fix_scan: no attachment, a file too large to attach, or a file attached in a chat that cannot hand attachments to tools. Show the user the link; when they say it is uploaded, call fix_scan (or preview_scan) with the upload_id. The link works for one hour and one file.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Get an upload link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["books"],
                "type": "oauth2"
              }
            ],
            "ui": {
              "resourceUri": "ui://fixmyscan/upload-box-v2.html"
            }
          },
          "digest": "sha256:0cd9ed63332081f376c831d2e33d26dd8e8c7bc485deb75a2d9b329f3ea9f8b5"
        },
        {
          "name": "delete_scan",
          "title": "Delete a book",
          "description": "Delete a book's upload and finished files from FixMyScan now, rather than after 24 hours. Use it only when the user asks to delete the book. This cannot be undone.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "scan_id": {
                "description": "The scan_id fix_scan or list_my_scans gave.",
                "pattern": "^job_[A-Za-z0-9_-]{1,60}$",
                "type": "string"
              }
            },
            "required": ["scan_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Delete a book"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
