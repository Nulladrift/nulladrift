        {
          "name": "ask_framework",
          "description": "Ask a value-investing framework question answered from the Dadao Value knowledge base (127 rules, 141 historical teaching cases): what makes a good business, moats, pricing power, valuation discipline, position discipline. Education only; stock picks and price predictions are declined.",
