{
  "lockfileVersion": 2,
  "subjects": {
    "com.gruptalepleri/grup-ucus": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://gruptalepleri.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "gruptalepleri",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "GrupTalepleri.com is a TÜRSAB-licensed travel agency in Türkiye that handles group air ticket requests. These tools search scheduled flights, look up airports, and find GrupTalepleri.com announcements and travel guides. Prices are not returned; group fares are quoted after a group request. Group requests are accepted from 6 passengers (Turkish Airlines international groups start at 6; Pegasus and SunExpress groups start at 10). For a private jet, helicopter or charter aircraft (any passenger count, including under 6) use the ozel_ucus_talebi tool; for other special flights (air ambulance, organ transport, cargo, animal transport, repatriation, concert/tour, humanitarian, empty leg, ACMI) refer the user to https://gruptalepleri.com/charter-ucak or phone +90 532 426 26 30.",
      "tools": [
        {
          "name": "duyuru_rehber_ara",
          "title": "Search announcements and travel guides",
          "description": "Search GrupTalepleri.com announcements (airline news, strikes, new routes, events) and destination travel guides by keyword. Returns titles and links.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "sorgu": {
                "description": "Keyword, e.g. 'Bangkok', 'grev', 'Paskalya', 'Amsterdam'",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["sorgu"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search announcements and travel guides"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:bdb0d873afa1d9bab9c12bf8ff125e8d1dfedd3d7f1cb10103b1ef01622efc3e"
        },
        {
          "name": "grup_talebi_olustur",
          "title": "Create group flight request",
          "description": "Creates a group flight request for GrupTalepleri.com from the route, date and passenger count, plus the contact person's name, phone number and email address. The GrupTalepleri.com team handles the request and contacts the user; this does not automatically create an account or send a message. Before calling this tool, show the user the full request details and get their explicit confirmation. Only use a name, phone number and email address that the user gave you themselves in this conversation; never invent, guess or reuse placeholder contact details. Personal data is processed under the KVKK information text at https://gruptalepleri.com/kvkk. Prices are not returned.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ad_soyad": {
                "description": "Contact person's full name",
                "maxLength": 100,
                "minLength": 3,
                "type": "string"
              },
              "donus_tarihi": {
                "description": "Return date YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "email": {
                "description": "Contact email address",
                "format": "email",
                "type": "string"
              },
              "kalkis": {
                "description": "Departure IATA code, e.g. IST",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "kisi": {
                "description": "Number of passengers, from 6 to 400",
                "maximum": 400,
                "minimum": 6,
                "type": "integer"
              },
              "not": {
                "description": "Optional note, up to 500 characters",
                "maxLength": 500,
                "type": "string"
              },
              "tarih": {
                "description": "Departure date YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "telefon": {
                "description": "Contact phone number",
                "maxLength": 25,
                "minLength": 7,
                "pattern": "^\\+?[0-9 ()\\-]{7,25}$",
                "type": "string"
              },
              "varis": {
                "description": "Arrival IATA code, e.g. FCO",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              }
            },
            "required": ["ad_soyad", "email", "kalkis", "kisi", "tarih", "telefon", "varis"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create group flight request"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:3d6475ac2b4b72db1dfa8d562fb1980c722fa91c2e9d73b9cc35a45bb92e5bd3"
        },
        {
          "name": "havalimani_bul",
          "title": "Find airport codes",
          "description": "Look up IATA airport codes by city or airport name (Turkish or English). Use this before ucus_ara when the user gives a city name instead of a 3-letter code.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "sorgu": {
                "description": "City or airport name, e.g. 'Roma', 'Istanbul', 'Düsseldorf'",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["sorgu"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find airport codes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:68414cee0279da8d4a89e410d8757b756d4b0bc931335fd67a84b7f99ea05ea0"
        },
        {
          "name": "ozel_ucus_talebi",
          "title": "Create private jet / helicopter / charter request",
          "description": "Creates a private jet, helicopter or charter aircraft request for GrupTalepleri.com (1 to 400 passengers) with route, date, passenger count and the contact person's name, phone and email. Use havalimani_bul first to get IATA codes. The GrupTalepleri.com team handles the request and contacts the user; prices are not returned. Before calling this tool, show the user the full request details and get their explicit confirmation. Only use a name, phone number and email address that the user gave you themselves in this conversation; never invent, guess or reuse placeholder contact details. Personal data is processed under the KVKK information text at https://gruptalepleri.com/kvkk.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ad_soyad": {
                "description": "Contact person's full name",
                "maxLength": 100,
                "minLength": 3,
                "type": "string"
              },
              "donus_tarihi": {
                "description": "Return date YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "email": {
                "description": "Contact email address",
                "format": "email",
                "type": "string"
              },
              "kalkis": {
                "description": "Departure IATA code, e.g. IST",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "kisi": {
                "description": "Number of passengers, 1 to 400",
                "maximum": 400,
                "minimum": 1,
                "type": "integer"
              },
              "not": {
                "description": "Optional note, up to 500 characters",
                "maxLength": 500,
                "type": "string"
              },
              "tarih": {
                "description": "Departure date YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "telefon": {
                "description": "Contact phone number with country code",
                "maxLength": 25,
                "minLength": 7,
                "pattern": "^\\+?[0-9 ()\\-]{7,25}$",
                "type": "string"
              },
              "ucak_turu": {
                "description": "jet = private jet, helikopter = helicopter, charter_ucak = charter airliner",
                "enum": ["jet", "helikopter", "charter_ucak"],
                "type": "string"
              },
              "varis": {
                "description": "Arrival IATA code, e.g. AYT",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              }
            },
            "required": ["ad_soyad", "email", "kalkis", "kisi", "tarih", "telefon", "ucak_turu", "varis"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create private jet / helicopter / charter request"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:16ba7a5f4b9fa8a1a0df21320075fbef9252a7e4194099f4d6402dfb77151e01"
        },
        {
          "name": "talep_durumu",
          "title": "Check group request status",
          "description": "Returns the current status of a GrupTalepleri.com group flight request. Requires both the request number (e.g. UG-XXXXXX) and the phone number used in that request. Returns route, dates, passenger count and a status sentence; prices are not returned.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "talep_no": {
                "description": "Request number, e.g. UG-AB12CD",
                "maxLength": 30,
                "minLength": 4,
                "type": "string"
              },
              "telefon": {
                "description": "Phone number used when the request was created",
                "maxLength": 20,
                "minLength": 10,
                "type": "string"
              }
            },
            "required": ["talep_no", "telefon"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check group request status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:15c6750eee3085ec3afd71bab65fec0635cb079189115cd40d5edec004cc3e68"
        },
        {
          "name": "ucus_ara",
          "title": "Search group flight options",
          "description": "Search scheduled flight options between two airports on a date for a group trip, optionally including nearby airports. Returns airlines, flight numbers, times, duration and stops. Does not return prices; group fares are quoted by GrupTalepleri.com after a group request.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "donus_tarihi": {
                "description": "Return date YYYY-MM-DD for a round trip",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "kabin": {
                "default": "economy",
                "enum": ["economy", "premium-economy", "business", "first"],
                "type": "string"
              },
              "kalkis": {
                "description": "Departure IATA code, e.g. IST",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "kisi": {
                "description": "Number of passengers in the group, up to 400",
                "maximum": 400,
                "minimum": 1,
                "type": "integer"
              },
              "tarih": {
                "description": "Departure date YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "varis": {
                "description": "Arrival IATA code, e.g. FCO",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "yakin_havalimanlari": {
                "default": false,
                "description": "Also search nearby airports (e.g. Milan MXP + LIN + BGY)",
                "type": "boolean"
              }
            },
            "required": ["kalkis", "kisi", "tarih", "varis"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search group flight options"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d95e7755e9b72e75942b1a6e0ebcdba7d4b7ec05ba40ac87a94868938d2ee51e"
        }
      ],
      "digest": "sha256:0ae3cd3ec77cd21b8f4cddd647ab8b8017b82a96dbb6914aff9b7cc64a816337"
    }
  }
}
