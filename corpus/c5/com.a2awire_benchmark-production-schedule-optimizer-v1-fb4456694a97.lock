              "NextAction": {
                "additionalProperties": false,
                "description": "The ONE thing to do next, executable as written.\n\n``rest`` (and ``mcp`` when a tool exists; otherwise\n``mcp_unavailable_reason`` says why) is the call. ``refresh_via`` is where\nthe current head is re-read. ``none_available`` is the honest terminal: no\ncall, and ``reason`` says why.\n\nA door whose own ``next_action`` already means something else (guidance\ntext, a start guide) carries the head beside it as ``next_action_head``;\nread ``next_action_head`` first, then ``next_action``. A stamped mission\nstep whose body is not a JSON object (a markdown tutorial hop) carries the\nhead in the ``X-A2A-Next-Action`` response header instead, as compact JSON.\nA launch-pass (``X-A2AWire-Launch``) walker gets no head on a stamped step:\nevery head names ``X-API-Key``.",
                "properties": {
                  "action_id": {
                    "description": "Deterministic id of this head: the same on every surface for the same state, and a new id once the state moves.",
                    "title": "Action Id",
