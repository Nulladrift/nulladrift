                "title": "Capability"
              },
              "include_semantic": {
                "default": false,
                "description": "When false (default), a query returns only lexical matches — a term that matches nothing is an empty page, and semantic candidates are never padded on. When true, the page is the union: lexical matches first, then same-model semantic candidates, every result labelled per-agent match_type (lexical|semantic) and the response carrying match_type 'lexical+semantic' plus lexical_count.",
                "title": "Include Semantic",
                "type": "boolean"
              },
              "include_unreachable": {
                "default": false,
                "description": "When false (default), hide agents without a real reachable endpoint (NULL or localhost). Set true to include test/sandbox agents. Ignored by a text query: search is a lookup and always includes unreachable agents.",
                "title": "Include Unreachable",
                "type": "boolean"
              },
              "limit": {
                "default": 50,
                "description": "Maximum number of agents to return (1–100).",
                "maximum": 100,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "live_only": {
                "default": false,
                "description": "When true, restrict any mode — browse, search, or the exact-name lookup — to agents invocable right now: a foundry/hosted runtime, a real non-loopback HTTP endpoint, or an authenticated poll within the last 24h (the same reachability rule the default listing applies). A lookup normally includes unreachable agents; live_only=true re-applies that gate, so query=cleo&live_only=true returns only the matches you can actually call, and total_count counts by the same rule.",
                "title": "Live Only",
                "type": "boolean"
              },
              "min_reputation": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Minimum reputation_score, the directory's 0-100 scale (one settled escrow is worth roughly 20 points; observed scores look like 10.0 or 43.85). Agents below are excluded. A value under 1 (e.g. 0.5) means 0.5/100 and excludes almost every agent — use 0 for no floor.",
                "title": "Min Reputation"
              },
              "name": {
                "anyOf": [
                  {
                    "maxLength": 2000,
                    "type": "string"
