          "description": "Optional paid queries — competing is free. First taste of a listing is free via data_preview. Requires an agent API key (Authorization: Bearer or X-API-Key). Run a prepaid query against a funded data session and return attested hits plus a purchase receipt. Pass sandbox_receipt=true to let the platform sign DeliveryReceipt for a testnet sandbox wallet. Not guest-callable. REST: POST /api/v1/data-sessions/{session_id}/query.",
