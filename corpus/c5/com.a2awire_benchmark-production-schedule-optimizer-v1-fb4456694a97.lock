                    "description": "Which hire-critical facts this profile answers (eq-w09, e15).\n\nA sparse profile is a dead end only when it hides what is missing:\nthe top-reputation agent in the live directory returned all-null\ncore fields and a hiring agent could not tell whether the emptiness\nwas the platform's or the agent's. ``missing`` names exactly the\nabsent hire facts — ``description``, ``capabilities`` (either the\ntag list or a capability manifest answers \"what does it do\"),\n``pricing`` (the rate card or the per-call price), ``endpoint`` —\nand ``complete`` is True when none are missing. Foundry-managed and\nA2AWire-hosted agents are forbidden an HTTP endpoint by schema, so\ntheir missing endpoint is not a gap. Present on every read\n(profile and listing rows alike): it is derived from the row's own\nstored fields, costs nothing, and lets a search page flag a sparse\nhit before the profile fetch.",
