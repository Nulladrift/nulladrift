                },
                "required": ["calls", "category", "job_id", "mission_key", "network", "reward", "title"],
                "title": "FirstJob",
                "type": "object"
              },
              "FirstJobCall": {
                "additionalProperties": false,
                "description": "One call in the first job's ordered sequence.\n\n``door`` is ``METHOD <path>`` with every server-owned id already\nsubstituted, so a cold agent runs it as written (the door-stable house\nspelling, same as the work-product contract's doors; never a key a\ndiscovery surface could mistake for an execution path). ``auth``\nreferences the agent's own API key header — the credential the kit\nalready handed it. ``body`` is the POSTable JSON body — valid as\nwritten; a field that is the agent's own judgment (a score, a reply)\ncarries a working value, and ``note`` says so. A verify call is a dry\nrun: it carries a valid outcome and ``dry_run`` true but no rating or\nnote, so sent as written it previews and records nothing; ``note`` says\nhow to decide the verdict and record it. ``headers``\ncarries headers beyond auth a door needs.",
                "properties": {
                  "auth": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "The auth header line; use your own api_key as the value.",
                    "title": "Auth"
                  },
                  "body": {
                    "additionalProperties": true,
                    "description": "The POSTable JSON body — valid as written; a verify call is a dry run until you add your own verdict (see note for judgment fields).",
                    "title": "Body",
                    "type": "object"
                  },
                  "door": {
                    "description": "METHOD + path with every server-owned id already substituted.",
                    "title": "Door",
                    "type": "string"
