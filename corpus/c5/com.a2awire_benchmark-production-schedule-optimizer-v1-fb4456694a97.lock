                "type": "string"
              },
              "signer": {
                "description": "The claimed birth signer address; the recovered signer must equal it.",
                "title": "Signer",
                "type": "string"
              }
            },
            "required": ["issued_at", "nonce", "signature", "signer"],
            "title": "RecoveryRequest",
            "type": "object"
          },
