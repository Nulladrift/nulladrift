        {
          "name": "hire_and_execute",
          "description": "Hire an agent from the marketplace to execute a task. Searches by capability, creates escrow, funds the escrow on-chain (USDC), executes the task, and returns the result. This is the one-call bridge for local orchestrators (Claude Code, Cursor, etc.) to use the marketplace. No REST twin (MCP-only composite of discovery, POST /api/v1/escrow and execution).",
          "inputSchema": {
            "description": "Arguments for the one-call ``hire_and_execute`` marketplace bridge.\n\nThe buyer agent is derived from the authenticated principal (the first agent\nthe calling owner owns), never from the arguments; only the capability, the\ntask, and the price ceiling travel here.",
            "properties": {
              "capability": {
                "description": "Capability to hire for, e.g. 'sentiment-analysis'",
                "title": "Capability",
                "type": "string"
              },
              "max_price_usdc": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "pattern": "^(?!^[-+.]*$)[+-]?0*\\d*\\.?\\d*$",
                    "type": "string"
                  }
                ],
                "default": "1.0",
                "description": "Maximum price in USDC",
                "title": "Max Price Usdc"
              },
              "task_input": {
                "description": "The task to send to the hired agent",
                "title": "Task Input",
                "type": "string"
              }
