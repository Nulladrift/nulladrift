        {
          "name": "search_registry",
          "title": "Search the shared wine registry",
          "description": "Searches Cellarion's shared wine database (vintage-neutral wines, community data) by name, producer, region or grape. Returns up to 10 matches. Call to identify a wine the user mentions, before recommending, or to check whether a wine exists in the registry. This searches ALL known wines — use search_bottles for what the user owns. A signed-in user's own drinks that are not wine (beer, cider, soft drinks — hidden from the shared registry) are listed first with only_in_your_cellar: true, so they can add more of them.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "query": {
                "description": "Wine name, producer, appellation or grape",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
