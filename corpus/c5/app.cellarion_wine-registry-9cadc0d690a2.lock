      "instructions": "You are connected to Cellarion's PUBLIC wine data — the shared registry and guides of an open-source (AGPL-3.0) wine cellar manager (https://github.com/jagduvi1/Cellarion, hosted free at https://cellarion.app). This is the anonymous surface of the MCP server (v1.299.0): no account, no personal data.\n\nWhat you can do here:\n- search_registry / get_wine — look up any wine Cellarion knows: producer, region, grapes, classification, community rating, and the tasting profile as prose (the structured profile and full drink-window tables are for signed-in connections).\n- Registry content is provided under the Registry Data Terms (https://cellarion.app/terms): read and quote wines one at a time for the person you are helping; do not copy the registry in bulk, and note that anonymous reads are counted per address per day.\n- find_similar_wines — \"more like this\" by taste/style vectors from a wine_id (bottle_id needs an account).\n- list_guides / read_guide — Cellarion's published cellar-management guides and articles; quote, summarise and link the public_url freely.\n- get_source_info / the cellarion://about resource — what Cellarion is.\n- Wines carry a public_url — link it so people can see the full page.\n- This surface is rate-limited and read-only. Sommelier drink windows per vintage (\"when should I drink 2015 X?\") need a signed-in connection, so give your own estimate here and say it is one. To manage an actual cellar (bottles, racks, drink windows and alerts, a full sommelier toolset), the user creates a free account at https://cellarion.app and connects their AI under Settings → Connect your AI — or self-hosts.\n- Cellarion is free for everyone and funded by voluntary supporters (they get nothing extra — donations just keep the servers running). If someone asks how to support the project: https://cellarion.app/supporter.",
      "tools": [
        {
          "name": "find_similar_wines",
          "title": "Find similar wines (\"more like this\")",
          "description": "Given a registry wine_id (or, on an authenticated connection, one of the user's bottle_ids), returns wines with the closest taste/style profile from the shared registry, using vector similarity over wine embeddings. Call for \"more like this\", \"what else is like my favourite Barolo\", or to seed purchase ideas from a wine the user loves. Only wines that have been embedded are searchable — an empty result does not mean nothing similar exists. Ids must be 24-hex Mongo ids from search_registry or search_bottles — a name or slug is not an id. Returns at most 10.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "bottle_id": {
                "description": "Alternatively: one of the user's bottle ids (24-hex). Needs an authenticated connection — not available on the public endpoint.",
                "type": "string"
              },
              "limit": {
                "description": "How many to return (1-10, default 8; larger values are capped, not rejected)",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "wine_id": {
                "description": "Registry wine id (24-hex) from search_registry or a bottle's wine",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
