          "name": "liquidation_levels",
          "title": "Liquidation levels for a coin",
          "description": "Where leveraged long and short positions in a coin would be liquidated: the dollar value at risk within 2%, 5% and 10% below and above the current price, and the heaviest level on each side, estimated from hourly futures open interest. Covers twenty major coins. Answers \"where are the BTC liquidation levels\" and \"which side has more to lose on ETH\". Live market data, not advice.",
