      "serverInfo": {
        "name": "Provyan",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Provyan follows the crypto market live and tests trading signals against history. Live: whale_orders lists large orders as they trade, whale_wallets shows what the biggest Hyperliquid traders hold now, liquidation_levels gives where leveraged positions in a coin would be liquidated. History: find_evidence lists the signals that held up, get_study covers one coin and one signal, latest_signals is the sealed record. Every answer carries its source page on https://provyan.com; none is advice or a prediction.",
      "tools": [
        {
          "name": "find_evidence",
          "title": "Find the strongest studies",
          "description": "Lists the coin-and-signal studies with the strongest historical evidence, best first. Filter by coin, by signal, by lean (bullish or bearish) and by minimum proof score (default 55). Answers questions such as \"which crypto signals actually worked\" or \"what has worked on <coin>\". Statistics about past price behaviour on Binance daily candles. Not financial advice and not a prediction.",
          "inputSchema": {
            "properties": {
              "coin": {
                "type": "string"
              },
              "lean": {
                "enum": ["bullish", "bearish"],
                "type": "string"
              },
              "limit": {
                "type": "number"
              },
              "min_score": {
                "type": "number"
              },
              "signal": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find the strongest studies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a8b83f01dfe27f6b2e93d80e2201c694ef76666fd59e6d4a73dd022a79548d5b"
        },
        {
          "name": "get_study",
          "title": "Get one signal study",
          "description": "What historically happened to a crypto coin's price after a specific signal (e.g. RSI oversold, a 20% weekly drop, a breakout), measured on every past occurrence and compared with the coin's ordinary days. Returns case count, win rate, median move before and after trading costs, typical dip on the way, the luck probability after multiple-testing correction, and a 0-100 proof score. Statistics about past price behaviour on Binance daily candles. Not financial advice and not a prediction.",
          "inputSchema": {
            "properties": {
              "coin": {
                "description": "Ticker or slug, e.g. BTC or bitcoin",
                "type": "string"
              },
              "signal": {
                "description": "Signal id, e.g. rsi-oversold, weekly-drop-20, golden-cross",
                "type": "string"
              }
            },
            "required": ["coin", "signal"],
            "type": "object"
          },
