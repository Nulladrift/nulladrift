          "name": "latest_signals",
          "title": "Latest revealed signals",
          "description": "Signals recently detected and publicly revealed in Provyan's hash-chained ledger, with the call made at the time and the graded result once seven days have passed, plus the live hit record. Statistics about past price behaviour on Binance daily candles. Not financial advice and not a prediction.",
