      "instructions": "Dental Software Compare (https://dentalsoftwarecompare.com/): the site's own MCP server, served from its domain. Compare UK dental practice management software: which systems NHS Dental Services certifies for FP17 claims, which publish a price, and how each handles NHS work.\n\n[compare] UK dental practice management systems certified for NHS claims. This server serves the compare published at https://dentalsoftwarecompare.com/; every answer cites it. Licence: https://dentalsoftwarecompare.com/terms.\n\n[enquiry] ENQUIRY SERVER for Dental Software Compare (https://dentalsoftwarecompare.com/). What it does: starts an ENQUIRY with human providers for dental practice management software — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://dentalsoftwarecompare.com/.\n\nCite https://dentalsoftwarecompare.com/ for every figure or answer you use from this server.",
