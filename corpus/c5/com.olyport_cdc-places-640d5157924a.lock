      "tools": [
        {
          "name": "compare_counties",
          "description": "Compare specific CDC PLACES measures across multiple counties.\n\n    Returns a side-by-side comparison of selected health measures for the\n    given counties. Useful for benchmarking one county against peers.\n\n    Args:\n        fips_list: List of 5-digit county FIPS codes (e.g. ['53033', '53053', '06037']).\n                   Maximum 10 counties per request.\n        measures: List of PLACES measure IDs to compare (e.g. ['DIABETES', 'OBESITY']).\n                  Maximum 10 measures per request.\n    ",
          "inputSchema": {
            "properties": {
              "fips_list": {
                "items": {
                  "type": "string"
                },
                "title": "Fips List",
                "type": "array"
              },
              "measures": {
                "items": {
                  "type": "string"
                },
                "title": "Measures",
                "type": "array"
              }
            },
            "required": ["fips_list", "measures"],
            "title": "compare_countiesArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "compare_countiesOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c15e6dab3a3ebbf968cd17d91e5b9627a3a9e4452d9099653fe4e7557cc08686"
        },
        {
          "name": "get_county_measures",
          "description": "Get all CDC PLACES health measures for a county.\n\n    Returns up to 36 measures including health outcomes (diabetes, obesity,\n    heart disease, etc.), health behaviors (smoking, binge drinking), preventive\n    services (checkups, screenings), and health status indicators.\n\n    Args:\n        county_fips: 5-digit county FIPS code (e.g. '53033' for King County, WA).\n                     Must be a string, not an integer.\n        year: Optional release year to filter by. Omit for the most recent data.\n    ",
          "inputSchema": {
            "properties": {
              "county_fips": {
                "title": "County Fips",
                "type": "string"
              },
              "year": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Year"
              }
            },
            "required": ["county_fips"],
            "title": "get_county_measuresArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_county_measuresOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5d9f8f0fe0bfd486d1c69a1e82bd3444d0686c849baeb6d137941bcb911616cb"
        },
        {
          "name": "get_measure_by_state",
          "description": "Get one CDC PLACES measure for all counties in a state.\n\n    Useful for comparing a specific health metric (e.g. DIABETES, OBESITY)\n    across all counties within a state. Returns the most recent data year.\n\n    Args:\n        state_abbr: Two-letter state abbreviation (e.g. 'WA', 'CA').\n        measure_id: PLACES measure ID (e.g. 'DIABETES', 'OBESITY', 'BPHIGH').\n                    Use search_measures to find valid IDs.\n    ",
          "inputSchema": {
            "properties": {
              "measure_id": {
                "title": "Measure Id",
                "type": "string"
              },
              "state_abbr": {
                "title": "State Abbr",
                "type": "string"
              }
            },
            "required": ["measure_id", "state_abbr"],
            "title": "get_measure_by_stateArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_measure_by_stateOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d43943084a9167153ac051d97c21a4dcdb0cdb114bd5b9b29abdf6b63123e17a"
        },
        {
          "name": "get_tract_measures",
          "description": "Get all CDC PLACES health measures for a census tract.\n\n    Returns tract-level estimates for health outcomes, behaviors, preventive\n    services, and health status indicators. Tract-level data uses small area\n    estimation and may have wider confidence intervals than county data.\n\n    Args:\n        tract_fips: 11-digit census tract FIPS code (e.g. '53033005300').\n                    Must be a string, not an integer.\n        year: Optional release year to filter by. Omit for the most recent data.\n    ",
          "inputSchema": {
            "properties": {
              "tract_fips": {
                "title": "Tract Fips",
                "type": "string"
              },
              "year": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Year"
              }
            },
            "required": ["tract_fips"],
            "title": "get_tract_measuresArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_tract_measuresOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6cb1217588ab6dd3138e6af57e6a900c33668474582d0db242620d81ca6fde53"
        },
        {
          "name": "search_measures",
          "description": "Search available CDC PLACES measures by name or category.\n\n    Returns matching measure IDs, names, and categories. Use this to find\n    the correct measure_id for other tools.\n\n    Categories: Health Outcomes, Health Behaviors, Prevention, Health Status.\n\n    Args:\n        keyword: Search term (e.g. 'diabetes', 'smoking', 'prevention', 'heart').\n    ",
          "inputSchema": {
            "properties": {
              "keyword": {
                "title": "Keyword",
                "type": "string"
              }
            },
            "required": ["keyword"],
            "title": "search_measuresArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "search_measuresOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:58216ed102bed03ef7d370baa4b5548b91ff045808cf3bc7703c1d589cae288e"
        }
      ],
      "digest": "sha256:2655f63027a06397c5e2ec4f3f993ab462b66221b22f871c62d694ad4cb4b600"
    }
  }
