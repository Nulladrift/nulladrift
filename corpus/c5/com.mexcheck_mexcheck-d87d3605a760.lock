        {
          "name": "geo_zip_search",
          "title": "Find the zip codes of a place in Mexico",
          "description": "Find the zip codes of a place in Mexico. Asks the government registry for real and is billed to the connected account: see get_account for what it costs you. Only send identifiers the user gave you. Details: read_doc \"geo/endpoints/geo-zip-search\".",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 50,
                "description": "How many results to return.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "municipality": {
                "description": "Letters found anywhere in the municipality's name.",
                "minLength": 3,
                "type": "string"
              },
              "settlement": {
                "description": "Letters found anywhere in the settlement's name.",
                "minLength": 3,
                "type": "string"
              },
              "state": {
                "description": "The state's name or how it starts (`Veracruz`). `Estado de México` and `CDMX` are understood. Narrows a search; cannot be sent alone.",
                "type": "string"
              },
              "zip": {
                "description": "The first two to five digits of the zip code.",
                "pattern": "^\\d{2,5}$",
                "type": "string"
              }
