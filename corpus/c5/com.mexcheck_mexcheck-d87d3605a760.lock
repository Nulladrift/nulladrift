  "subjects": {
    "com.mexcheck/mexcheck": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mexcheck.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "MexCheck",
        "title": "MexCheck API",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "MexCheck checks Mexican identifiers with the registries that own them: RFCs, CFDI invoices, and Constancias de Situación Fiscal with SAT, CURPs with RENAPO, voter IDs with INE, electricity receipts with CFE, and cédulas profesionales with SEP; the geo_* tools look zip codes up in Correos de México's catalogue. The rfc_*, cfdi_*, csf_*, curp_*, ine_*, cfe_*, cedula_*, and geo_* tools run real, billed lookups on the connected account: call get_account to see who pays and what each costs, and never run one on an identifier the user did not give you. To integrate the REST API into the user's code, read the docs with list_docs and read_doc, which need no login, and create the server's key with create_api_key.",
      "tools": [
        {
          "name": "cedula_search",
          "title": "Search cédulas profesionales at SEP",
          "description": "Search cédulas profesionales at SEP. Asks the government registry for real and is billed to the connected account: see get_account for what it costs you. Only send identifiers the user gave you. Details: read_doc \"cedula/endpoints/cedula-search\".",
          "inputSchema": {
            "properties": {
              "cedula": {
                "description": "The cédula number, up to 8 digits. A shorter number is padded with zeros to SEP's 7 digits.",
                "pattern": "^[0-9]{1,8}$",
                "type": ["string", "integer"]
              },
              "curp": {
                "description": "The holder's 18-character CURP.",
                "type": "string"
              },
              "mothers_maiden_name": {
                "description": "The second surname. Narrows a common name.",
                "minLength": 2,
                "type": "string"
              },
              "names": {
                "description": "The holder's given names.",
                "minLength": 2,
                "type": "string"
              },
              "paternal_surname": {
                "description": "The first surname.",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cedfeb435b35678556ef85c4fdfd8e913c4edf1c209fa34f41ee041d6e34dd5d"
        },
        {
          "name": "cfdi_verify",
          "title": "Verify a CFDI with SAT",
          "description": "Verify a CFDI with SAT. Asks the government registry for real and is billed to the connected account: see get_account for what it costs you. Only send identifiers the user gave you. Details: read_doc \"cfdi/endpoints/cfdi-verify\".",
          "inputSchema": {
            "properties": {
              "rfc_emisor": {
                "description": "RFC of the issuer (emisor).",
                "type": "string"
              },
              "rfc_receptor": {
                "description": "RFC of the receiver (receptor).",
                "type": "string"
              },
              "uuid": {
                "description": "Folio fiscal (UUID) of the CFDI, any case.",
                "format": "uuid",
                "type": "string"
              },
              "xml": {
                "description": "The CFDI XML document as a string, as stamped by the PAC (with its tfd:TimbreFiscalDigital).",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8e74e70bcfe5db0d17dbd0b688bec9184ec2bbbd0687afe9946b21584f0ecc97"
        },
        {
          "name": "cfe_verify",
          "title": "Verify a CFE electricity receipt",
          "description": "Verify a CFE electricity receipt. Asks the government registry for real and is billed to the connected account: see get_account for what it costs you. Only send identifiers the user gave you. Details: read_doc \"cfe/endpoints/cfe-verify\".",
          "inputSchema": {
            "properties": {
              "file": {
                "contentEncoding": "base64",
                "description": "The receipt as base64: CFE's PDF, a scan, or a PNG or JPEG photo that shows the payment barcode. A `data:` URL prefix is accepted. Up to 8 MB. Send this, or the three values below.",
                "type": "string"
              },
              "name": {
                "description": "The holder's name exactly as the receipt prints it, cut short if the receipt cuts it short.",
                "type": "string"
              },
              "service_number": {
                "description": "The 12-digit service number (No. de servicio).",
                "type": "string"
              },
              "total": {
                "description": "The amount to pay (Total a pagar) in whole pesos.",
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a9a28b3159a048544149043e11f58e236233eb4f78152e26e067494125a35268"
        },
        {
          "name": "charge_saved_card",
          "title": "Add balance by charging the saved card",
          "description": "Charges the connected account's saved card and adds the amount to its balance. This spends the user's money at once. It only works if the user allowed card charges when connecting, up to their daily limit (see get_account). Use it when the user asked you to, or told you to keep the balance funded.",
          "inputSchema": {
            "properties": {
              "amount_usd": {
                "description": "US dollars to charge.",
                "minimum": 5,
                "type": "number"
              }
            },
            "required": ["amount_usd"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
