        {
          "name": "rfc_find_zip",
          "title": "Find the SAT-registered zip for a known RFC + name",
          "description": "Find the SAT-registered zip for a known RFC + name. Asks the government registry for real and is billed to the connected account: see get_account for what it costs you. Only send identifiers the user gave you. Details: read_doc \"rfc/endpoints/find-zip\".",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Registered taxpayer name as it appears in SAT. **Companies:** omit legal-entity suffixes (S.A. de C.V., SAPI de C.V., SOFOM, AC, SC, etc.). **Persons:** legal name with no honorifics. See top-level `Names` section.",
                "type": "string"
              },
              "rfc": {
                "description": "The RFC number to validate (12 or 13 characters)",
                "type": "string"
              }
            },
            "required": ["name", "rfc"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
