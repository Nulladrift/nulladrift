{
  "lockfileVersion": 2,
  "subjects": {
    "com.gaitkit/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://gaitkit.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "gaitkit",
        "title": "Gaitkit",
        "version": "0.4.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Gaitkit: a catalogue of low-poly 3D assets as code (characters, creatures, mechs, vehicles, buildings, props, nature) for three.js, React Three Fiber, Godot, Unity and Blender. Use it whenever the user needs a 3D model, game asset or scene prop instead of drawing primitives: many assets move (creatures walk with procedural IK, wheels roll, doors open). search_assets first, then get_asset for code and GLB links; get_variant turns plain words into knob values. If coverage is none or poor, say so and call report_need.",
      "tools": [
        {
          "name": "get_asset",
          "title": "Get a 3D asset",
          "description": "Full metadata for one asset: real size in metres, palette, knob schema, rigged parts, gait for walkers, file URLs and ready-to-paste three.js code.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a 3D asset"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d73f53d658bd2277b34a94aada15483d7e82e23dc6cea14fc24d5f06f6f69d1a"
        },
        {
          "name": "get_variant",
          "title": "Words to knob values",
          "description": "Turn plain words into a createAsset({...}) call: colours (\"red\", \"dark green\"), sizes (\"big claws\", \"tall\", \"8 eyes\"), features (\"no horn\", \"with porch\"), option and preset names. English or Turkish. Check confidence; on none it returns the vocabulary.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "want": {
                "type": "string"
              }
            },
            "required": ["id", "want"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Words to knob values"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:64f472a420a9a9eb668ced0314a2d516f361e5e164c9ea1b4c882575a4a7b462"
        },
        {
          "name": "report_need",
          "title": "Request a missing asset",
          "description": "Register an asset the catalogue does not have yet. Use when search coverage is none or poor.",
          "inputSchema": {
            "properties": {
              "context": {
                "type": "string"
              },
              "need": {
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Request a missing asset"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:97535287fbea17b9489290e085e0dcb0ec5c27984de8680e1719ad9a3d3531e6"
        },
        {
          "name": "search_assets",
          "title": "Search 3D assets",
          "description": "Search remixable low-poly 3D assets: creatures and mechs that walk with procedural IK, vehicles, buildings, nature and props. Returns coverage none|poor|ok; on none/poor say so honestly. Each result has tier free|pro (pro GLB downloads need a plan).",
          "inputSchema": {
            "properties": {
              "class": {
                "enum": ["creature", "mech", "vehicle", "building", "nature", "prop", "character"],
                "type": "string"
              },
              "legs": {
                "type": "integer"
              },
              "limit": {
                "type": "integer"
              },
              "max_triangles": {
                "type": "integer"
              },
              "query": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search 3D assets"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:57f290f975914ea76148bf5d1835863feeb92c5edd972fb16fe21051eccbb718"
        },
        {
          "name": "who_am_i",
          "title": "Who am I",
          "description": "Which Gaitkit account is calling (from the API key in the Authorization header), its plan, and the CDN token to put in shipped code. Anonymous callers get the free catalogue.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Who am I"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a9a3e2aeea21a08fe7036a9989549657639e6b3e750ec25322a43838f1febc57"
        }
      ],
      "digest": "sha256:f44a938f307646392ab39e37b43c4a4d4c52094ed0ffb4cfc11947e05934b726"
    }
  }
}
