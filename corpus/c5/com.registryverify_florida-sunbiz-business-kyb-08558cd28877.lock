      "tools": [
        {
          "name": "verify_california_business",
          "title": "Verify a California business (Secretary of State records)",
          "description": "Looks up a company by name in the records of the California Secretary of State, from its bizfile Online bulk data. Two files. A monthly file lists every company with its status on the file's last day, and it is the only source of status changes. A weekly file adds the companies first filed that week. A company suspended or revived after the monthly file's last day keeps its earlier status here until the next monthly file. This tool is free: it checks the name, reports the dates of the newest California data we hold, lists the legal names of up to 3 candidate companies while the hourly free preview lasts, and returns the pay URL for the full lookup. What the full lookup returns for each candidate: Entity number, name, status in California's own words and what it means, standing with the Secretary of State, the Franchise Tax Board and for its agent, entity type, first filing date, home state and the company's name there, principal, mailing and California office addresses, the agent for service of process, up to 25 officers, managers and members from the latest Statement of Information, and that statement's date. It costs 0.10 USDC per lookup over x402 v2 on Base, charged even when nothing matches. Limits: No status history and no former names, because California's file has neither. No warning flags, shared record counts or fact checks, and California publishes no EIN. California publishes this data without a promise of accuracy. The buyer's own x402 wallet pays at the pay URL; this server never receives payment, signatures or keys. A no match result is not proof that a company does not exist. This tool covers California only. verify_florida_business and verify_new_york_business, on this server, check Florida and New York names the same way, at the same price. Not affiliated with the California Secretary of State.",
          "inputSchema": {
            "properties": {
              "business_name": {
                "description": "The company name to look up, such as Apple Inc. 2 to 200 characters.",
                "maxLength": 200,
                "minLength": 2,
