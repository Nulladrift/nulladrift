{
  "lockfileVersion": 2,
  "subjects": {
    "com.registryverify/florida-sunbiz-business-kyb": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://registryverify.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "registry-verify",
        "title": "Registry Verify",
        "version": "1.0.0",
        "description": "Florida business lookups from Florida Division of Corporations public records, paid per lookup through Proceeds. Not affiliated with the Florida Department of State.",
        "websiteUrl": "https://registryverify.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "verify_florida_business",
          "title": "Verify a Florida business (Sunbiz records)",
          "description": "Looks up a company by name in Florida Division of Corporations public records (the records behind Sunbiz). This tool is free: it checks the name, reports the date of the newest Florida file we hold, lists the legal names of up to 3 candidate filings while the hourly free preview lasts, and returns the pay URL for the full lookup. The full lookup (document number, status as reported, filing type, filing date, principal city, registered agent, officers, home state, annual report status, status history and source file) costs 0.10 USDC per lookup over x402 v2 on Base, charged even when nothing matches. Paid answers carry warning flags, each with the Florida record behind it. The buyer's own x402 wallet pays at the pay URL; this server never receives payment, signatures or keys. A no match result is not proof that a company does not exist. This tool covers Florida only. New York and California companies have pay URLs of their own, https://myproceeds.xyz/api/pay/cmupojkok000bjz043ecdfmec/verify-new-york-business?name=<business name> and https://myproceeds.xyz/api/pay/cmupojkok000bjz043ecdfmec/verify-california-business?name=<business name>, at the same price, described at https://registryverify.com/llms.txt. Not affiliated with the Florida Department of State.",
          "inputSchema": {
            "properties": {
              "business_name": {
                "description": "The company name to look up, such as Publix Super Markets. 2 to 200 characters.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "home_state": {
                "description": "Optional two letter US state code where the company was formed, such as DE. The paid lookup lists filings from that state first.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "max_results": {
                "default": 5,
                "description": "How many candidate filings the paid lookup returns, 1 to 5. Default 5.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["business_name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "dataset": {
                "properties": {
                  "authoritative_no_match": {
                    "type": "boolean"
                  },
                  "complete_registry": {
                    "type": "boolean"
                  },
                  "note": {
                    "type": "string"
                  },
                  "source_file_date_end": {
                    "type": ["string", "null"]
                  },
                  "stale": {
                    "type": "boolean"
                  }
                },
                "required": ["authoritative_no_match", "complete_registry", "source_file_date_end", "stale"],
                "type": "object"
              },
              "payment": {
                "properties": {
                  "amount_base_units": {
                    "type": "string"
                  },
                  "asset": {
                    "type": "string"
                  },
                  "body": {
                    "type": "null"
                  },
                  "charged_even_if_no_match": {
                    "type": "boolean"
                  },
                  "method": {
                    "enum": ["GET"],
                    "type": "string"
                  },
                  "network": {
                    "type": "string"
                  },
                  "network_name": {
                    "type": "string"
                  },
                  "paid_by": {
                    "type": "string"
                  },
                  "pay_to": {
                    "type": "string"
                  },
                  "pay_url": {
                    "type": "string"
                  },
                  "price": {
                    "type": "string"
                  },
                  "protocol": {
                    "type": "string"
                  },
                  "schema_note": {
                    "type": "string"
                  },
                  "wallets": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "x402_version": {
                    "type": "integer"
                  }
                },
                "required": ["asset", "body", "charged_even_if_no_match", "method", "network", "paid_by", "pay_url", "price", "protocol", "schema_note", "wallets", "x402_version"],
                "type": "object"
              },
              "preview": {
                "properties": {
                  "available": {
                    "type": "boolean"
                  },
                  "candidate_count": {
                    "maximum": 3,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "candidate_count_capped": {
                    "type": "boolean"
                  },
                  "candidate_names": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "note": {
                    "type": "string"
                  },
                  "reason": {
                    "enum": ["limit_reached", "disabled"],
                    "type": "string"
                  }
                },
                "required": ["available"],
                "type": "object"
              },
              "query": {
                "properties": {
                  "business_name": {
                    "type": "string"
                  },
                  "home_state": {
                    "type": ["string", "null"]
                  },
                  "max_results": {
                    "type": "integer"
                  }
                },
                "required": ["business_name", "home_state", "max_results"],
                "type": "object"
              }
            },
            "required": ["dataset", "payment", "preview", "query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Verify a Florida business (Sunbiz records)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "x402/network": "eip155:8453"
          },
          "digest": "sha256:146f81c1de440ab93264422532e7e0fc0f72fadadac5ce48605115ade24b152b"
        }
      ],
      "digest": "sha256:62833a08d2ee98c33723f40a5d61dd4252b33e53787ffccd6bd8615e4e27467f"
    }
  }
