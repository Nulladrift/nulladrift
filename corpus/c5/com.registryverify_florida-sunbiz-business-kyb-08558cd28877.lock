        {
          "name": "verify_florida_business",
          "title": "Verify a Florida business (Sunbiz records)",
          "description": "Looks up a company by name in Florida Division of Corporations public records (the records behind Sunbiz). This tool is free: it checks the name, reports the date of the newest Florida file we hold, lists the legal names of up to 3 candidate filings while the hourly free preview lasts, and returns the pay URL for the full lookup. The full lookup (document number, status as reported, filing type, filing date, principal city, registered agent, officers, home state, annual report status, status history and source file) costs 0.10 USDC per lookup over x402 v2 on Base, charged even when nothing matches. Paid answers carry warning flags, each with the Florida record behind it. The buyer's own x402 wallet pays at the pay URL; this server never receives payment, signatures or keys. A no match result is not proof that a company does not exist. This tool covers Florida only. verify_new_york_business and verify_california_business, on this server, check New York and California names the same way, at the same price. Not affiliated with the Florida Department of State.",
          "inputSchema": {
            "properties": {
              "business_name": {
                "description": "The company name to look up, such as Publix Super Markets. 2 to 200 characters.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "home_state": {
                "description": "Optional two letter US state code where the company was formed, such as DE. The paid lookup lists filings from that state first.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "max_results": {
                "default": 5,
                "description": "How many candidate filings the paid lookup returns, 1 to 5. Default 5.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["business_name"],
