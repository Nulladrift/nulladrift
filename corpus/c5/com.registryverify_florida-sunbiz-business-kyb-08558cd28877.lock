        "name": "registry-verify",
        "title": "Registry Verify",
        "version": "1.0.0",
        "description": "Business lookups for Florida, New York and California from each state's public company records (the Florida Division of Corporations, the New York Department of State and the California Secretary of State), paid per lookup through Proceeds. One free tool per state: verify_florida_business, verify_new_york_business and verify_california_business. Not affiliated with the Florida Department of State, the New York Department of State or the California Secretary of State.",
