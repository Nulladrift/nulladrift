        {
          "name": "verify_new_york_business",
          "title": "Verify a New York business (Department of State records)",
          "description": "Looks up a company by name in the records of the New York Department of State, Division of Corporations, from its company register published on data.ny.gov. Updated every day: at 16:30 UTC we add New York's daily filings and status changes. This tool is free: it checks the name, reports the date of the newest New York data we hold, lists the legal names of up to 3 candidate companies while the hourly free preview lasts, and returns the pay URL for the full lookup. What the full lookup returns for each candidate: DOS ID, name, status and the filing that set it, entity type, formation date, county, home state, the service of process, registered agent, chief executive and principal office addresses, its five newest filings, and its former and fictitious names. It costs 0.10 USDC per lookup over x402 v2 on Base, charged even when nothing matches. Limits: No officers beyond the chief executive, and New York LLCs name no members or managers. No warning flags, shared record counts or fact checks, and New York publishes no EIN. New York says its open data is not an official record. The buyer's own x402 wallet pays at the pay URL; this server never receives payment, signatures or keys. A no match result is not proof that a company does not exist. This tool covers New York only. verify_florida_business and verify_california_business, on this server, check Florida and California names the same way, at the same price. Not affiliated with the New York Department of State.",
