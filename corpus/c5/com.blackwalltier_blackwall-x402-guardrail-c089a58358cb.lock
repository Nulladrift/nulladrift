      "serverInfo": {
        "name": "blackwall-x402-mcp",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "forecast_payment",
          "description": "Pre-signature x402 payment verdict: GO / HOLD / STOP for paying a counterparty, from settlement reputation, price-anomaly (quoted vs the payee's own median), and OFAC sanctions — with a third-party-verifiable Ed25519 signed receipt. Verdict only; never takes custody. Free under $10 at risk; over that, returns an x402 payment challenge.",
          "inputSchema": {
            "properties": {
              "agent_id": {
                "description": "caller DID/identity",
                "type": "string"
              },
              "amount": {
                "description": "amount as a decimal string, e.g. \"0.09\"",
                "type": "string"
              },
              "asset": {
                "description": "e.g. USDC",
                "type": "string"
              },
              "chain": {
                "description": "e.g. base",
                "type": "string"
              },
              "context": {
                "description": "{quoted_price_history, expected_recipient}",
                "type": "object"
              },
              "counterparty": {
                "description": "recipient wallet from the 402",
                "type": "string"
              },
              "payer": {
                "description": "agent's EVM wallet (optional; binds settlement)",
                "type": "string"
              },
              "resource": {
                "description": "what's being paid for",
                "type": "string"
              }
            },
            "required": ["amount", "asset", "chain", "counterparty"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0f015fd1d9b946260156d63a4b6f5ce1eec9b52f8776fb48d092ce48cddb5baa"
        }
      ],
      "digest": "sha256:ccc49a0aef1586eb8d038477f48f78c9407c43701e6fd5e1b4a404a4f412c4fd"
    }
  }
