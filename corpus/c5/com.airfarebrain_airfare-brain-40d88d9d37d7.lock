              },
              "method": {
                "type": "string"
              },
              "note": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get capabilities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:91e279dbf1e44732553fcb615ab95300e02f63eed786336718fe3ab3cbdcc4e4"
        },
        {
          "name": "list_airlines",
          "title": "List airlines",
          "description": "List every airline with a fee table: name, IATA code, the date its fees were checked, and its page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "airlines": {
                "type": "array"
              },
              "error": {
                "type": "string"
              },
              "note": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List airlines"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:890829b59b23ff0962ce50c8df0a33a898486e5855f4091524a00310531f0ad2"
        },
        {
          "name": "trip_at_airport",
          "title": "Trip at airport",
          "description": "The whole trip into one airport in one answer: the flight's extras on an airline (bags, seats, fees, as true_cost) AND what car hire there really costs (Car Rental Brain's measured median per day, car only, dated). Use for 'flying to Faro with Ryanair, bags and a hire car: what will it cost?'. Car only: deposits, second-driver fees and desk cover are not included; the answer links to the airport's full car-hire report.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "airline": {
                "description": "Airline name or IATA code (optional; without it you get car hire only)",
                "type": "string"
              },
              "airport": {
                "description": "IATA code or name of the airport you fly INTO, e.g. 'FAO', 'Faro', 'Malaga'",
                "type": "string"
              },
              "cabin_bag": {
                "description": "A large cabin bag for the overhead locker (the small under-seat bag is free)",
                "type": "boolean"
              },
              "car_days": {
                "description": "Days of car hire (default 7)",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "checked_bag_kg": {
                "description": "Checked bag(s) per person of this weight allowance, e.g. 20 or 23; omit for none",
                "type": "integer"
              },
              "currency": {
                "description": "Currency of the answer: EUR (default) or GBP, as the airline publishes it",
                "enum": ["EUR", "GBP"],
                "type": "string"
              },
              "domestic": {
                "description": "true for a flight within the US: US airlines charge different bag prices there than on international routes",
                "type": "boolean"
              },
              "fare": {
                "description": "Total fare for the whole party, if known",
                "type": "number"
              },
              "group_bags": {
                "description": "Checked bags shared by the whole party, fewer than the people (e.g. 1 bag between 2): priced as that many 1st bags; needs checked_bag_kg",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "hold_bags": {
                "description": "Checked bags per person (default 1); the 2nd bag often costs more",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "infants": {
                "description": "Under-2s on a lap (default 0)",
                "maximum": 4,
                "minimum": 0,
                "type": "integer"
              },
              "passengers": {
                "description": "People aged 2+ (default 1)",
                "maximum": 9,
                "minimum": 1,
                "type": "integer"
              },
              "priority": {
                "description": "Priority boarding",
                "type": "boolean"
              },
              "seat": {
                "description": "Paid seat choice: none (random seat), standard, or extra (legroom / front)",
                "enum": ["none", "standard", "extra"],
                "type": "string"
              },
              "trip": {
                "description": "one_way (default) or return: return counts each extra on both flights",
                "enum": ["one_way", "return"],
                "type": "string"
              }
            },
            "required": ["airport"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "airport": {
                "type": "object"
              },
              "car_hire": {
                "type": "object"
              },
              "error": {
                "type": "string"
              },
              "flight": {
                "type": "object"
              },
              "note": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Trip at airport"
          },
          "behavior": {
            "destructive": false,
