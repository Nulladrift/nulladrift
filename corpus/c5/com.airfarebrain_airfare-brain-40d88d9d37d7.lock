      "serverInfo": {
        "name": "airfare-brain",
        "title": "Airfare Brain",
        "version": "1.0.6",
        "websiteUrl": "https://airfarebrain.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Airfare Brain gives the TRUE cost of a flight's extras on low-cost and full-service airlines in Europe and North America (list_airlines has the current list) - bags, seats, priority, airport check-in, changes - from each airline's own published fee pages, every figure dated and sourced. It has no live fares of its own. For a full answer, use the fare the person found (on any flight search or booking site; ask if they haven't given it), THEN call true_cost with that airline and the total fare for the party; it adds the bags, seats and fees the fare leaves out. Comparing flights? Call true_cost once per option - the cheapest fare is often not the cheapest trip once bags are added. Figures are ranges the airline publishes, not quotes; give the person the page link to check, and book on the flight site.",
      "tools": [
        {
          "name": "airline_fees",
          "title": "Airline fees",
          "description": "One airline's published extra fees (bags, seats, priority, check-in, changes, payment), each with the price range, when bought (at booking / later / airport), how it is charged, its source URL and the date checked. Optionally filter by category.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "airline": {
                "description": "Name or IATA code, e.g. 'Ryanair', 'FR', 'easyJet', 'W6'",
                "type": "string"
              },
              "category": {
                "description": "Only fees of this kind; omit for every fee the airline publishes",
                "enum": ["cabin_bag", "checked_bag", "seat", "priority", "airport_checkin", "boarding_pass", "payment", "name_change", "flight_change", "other"],
                "type": "string"
              },
              "currency": {
                "description": "Currency of the answer: EUR (default) or GBP, as the airline publishes it",
                "enum": ["EUR", "GBP"],
                "type": "string"
              }
            },
            "required": ["airline"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "airline": {
                "type": "string"
              },
              "error": {
                "type": "string"
              },
              "fees": {
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "page": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Airline fees"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:87a590598b10dff70254e3d37721d35cf3a080fcd67435e9b7772d3153e52147"
        },
        {
          "name": "get_capabilities",
          "title": "Get capabilities",
          "description": "What Airfare Brain covers: airlines, how fees are researched and dated, what it does NOT do (no live fares, no booking), and what car hire at the destination airport typically costs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "airlines": {
                "type": "array"
              },
