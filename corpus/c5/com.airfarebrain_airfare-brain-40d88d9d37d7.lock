          "digest": "sha256:fb1b0a60f4b16dad9de966372b1e333f61be8bd65c5207f401cb664fc3840bfd"
        },
        {
          "name": "true_cost",
          "title": "True cost",
          "description": "The true cost of a flight on one airline. Pass `fare` (the total for the whole party, from a flight-search tool or the person) to get fare + extras; without it you get the extras alone. Extras = what the person chooses (cabin bag, checked bag by kg, seat, priority, infants) for their party and trip, as the range the airline publishes. Also lists what costs more if left until the airport, unchosen fees that may apply (admin, card %), and extras the airline does not publish a price for.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "airline": {
                "description": "Name or IATA code",
                "type": "string"
              },
              "cabin_bag": {
                "description": "A large cabin bag for the overhead locker",
                "type": "boolean"
              },
              "checked_bag_kg": {
                "description": "Checked bag(s) per person of this weight allowance",
                "type": "integer"
              },
              "currency": {
                "description": "Currency of the answer: EUR (default) or GBP, as the airline publishes it",
                "enum": ["EUR", "GBP"],
                "type": "string"
              },
              "domestic": {
                "description": "true for a flight within the US: US airlines charge different bag prices there than on international routes",
                "type": "boolean"
              },
              "fare": {
                "description": "Total fare already found for the whole party, if known",
                "type": "number"
              },
              "group_bags": {
                "description": "Checked bags shared by the whole party, fewer than the people (e.g. 1 bag between 2): priced as that many 1st bags; needs checked_bag_kg",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "hold_bags": {
                "description": "Checked bags per person (default 1); the 2nd bag often costs more",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "infants": {
                "description": "Under-2s on a lap",
                "maximum": 4,
                "minimum": 0,
                "type": "integer"
              },
              "passengers": {
                "description": "People aged 2+ (default 1)",
                "maximum": 9,
                "minimum": 1,
                "type": "integer"
              },
              "priority": {
                "description": "Priority boarding",
                "type": "boolean"
              },
              "seat": {
                "description": "extra = legroom / front",
                "enum": ["none", "standard", "extra"],
                "type": "string"
              },
              "trip": {
                "description": "one_way (default) or return: return counts each extra on both flights",
                "enum": ["one_way", "return"],
                "type": "string"
              }
            },
            "required": ["airline"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "airline": {
                "type": "string"
              },
              "error": {
                "type": "string"
              },
              "extras_total": {
                "type": "string"
              },
              "lines": {
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "page": {
                "type": "string"
              },
              "true_cost": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "True cost"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0ab2ca3cf941a0383f6f651f6994f98add7deb73a89e91446f6d1188476f3c87"
        }
      ],
