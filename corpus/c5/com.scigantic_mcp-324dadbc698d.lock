          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b2f4a7f6d12d4ba0365c77e92442f0d6dbd83a374e41b45e5be70394c3cb5168"
        },
        {
          "name": "surechembl_patents_for_compound",
          "description": "List the patents in which a compound was found (SureChEMBL). Accepts the same identifier forms as surechembl_compound. Aspirin is in ~700,000 documents, so read the total and narrow with surechembl_search_patents when it is large.",
          "inputSchema": {
            "properties": {
              "identifier": {
                "description": "A SureChEMBL id (\"SCHEMBL1353\" or \"1353\"), a ChEMBL id (\"CHEMBL25\"), a PubChem CID as \"pubchem:2244\", a DrugBank id as \"drugbank:DB00945\", a standard InChIKey, a SMILES, or a chemical name (\"aspirin\"; resolved through PubChem to a structure, since SureChEMBL has no name lookup).",
                "type": "string"
              },
              "limit": {
                "description": "Max patents to list (default 20, max 200).",
                "type": "number"
              }
            },
            "required": ["identifier"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2bb64e60e77f734b5d622157cfbc6827f1385bea926955236ffbcabd529ce124"
        },
        {
          "name": "surechembl_search_patents",
          "description": "Full-text patent search over SureChEMBL with Solr syntax. Plain terms search all text; field prefixes narrow: ttl (title), ab (abstract), clm (claims), desc, asg (assignee), inv (inventor), pdyear, cpc, ic (IPCR), fam (family id). Quote publication numbers: pn:\"US-10000000-B2\". Combine with AND/OR/NOT. Only US, EP, WO, JP and CN publications are searchable.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max patents to list (default 20, max 200).",
                "type": "number"
              },
              "query": {
                "description": "e.g. 'ttl:kinase AND asg:novartis AND pdyear:2024'.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7b1bf7f47287888031dc46ebff3cdc28b4d44a67e8933f45eed8fbcd09df4f59"
        },
        {
          "name": "surechembl_structure_search",
          "description": "Search SureChEMBL's 31 million patent compounds by chemical structure.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max hits (default 20, max 500).",
                "type": "number"
              },
              "mode": {
                "description": "\"similarity\" (Tanimoto at or above 0.8, default), \"substructure\" (at least 5 atoms; the server caps results at 10,000), \"identical\" (all features must match), or \"connectivity\" (same skeleton, any stereo/isotopes).",
                "enum": ["substructure", "similarity", "identical", "connectivity"],
                "type": "string"
              },
              "structure": {
                "description": "A SMILES.",
                "type": "string"
              }
            },
            "required": ["structure"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4939f3f8bb1156b4fcf05595d05af49934c0dbf7ee0e2679b587c0ce36cd381d"
        }
