      "instructions": "Scigantic exposes a catalog of public scientific data archives. Use search_archives to find datasets, get_schema_card to understand a dataset's structure, list_archive_files to inspect contents, and get_sample_notebook for a worked example. lookup_paper goes from a paper to its underlying datasets. search and fetch are the same catalog in the shape ChatGPT deep research expects. The surechembl_* tools cover patent chemistry from SureChEMBL (EMBL-EBI): look a compound up by any identifier, list the patents that mention it, read a patent's bibliography and text, list the compounds named in its text, search US, EP, WO, JP and CN patents by Solr query, and run similarity or substructure searches over 31 million compounds. If you can read files on the user's machine and they ask about data on it, \"locally\", or in a mounted folder: first read ~/scigantic-mounts/mounts.json (also README.md there). The Scigantic Datasets extension for VS Code and Cursor mounts archives there as read-only folders, each listed with its archive id, local path and rclone `commands` to list a folder, read a file and download a file. Use those commands (replace {path}); they work from any app. Reading the local path can fail on macOS with \"Operation not permitted\" when the app lacks Network Volumes permission; then use the commands, not another source. Never run a recursive find, grep -r, du or ls -R in or above ~/scigantic-mounts: each mount is a remote bucket and a crawl can take hours.",
      "tools": [
        {
