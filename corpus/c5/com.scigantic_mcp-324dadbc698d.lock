        {
          "name": "lookup_paper",
          "description": "Look up a research paper on arXiv, by bare arXiv id (e.g. \"1706.03762\") or by keywords/title, and return its metadata plus any Scigantic archives linked to or suggested by it. Useful for going from a paper an agent is reading to the underlying datasets. Lookup is arXiv-backed: DOIs, \"arXiv:\"-prefixed ids, and papers that are not on arXiv do not resolve.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Bare arXiv id (e.g. \"1706.03762\"), or keywords/title to search arXiv. Not a DOI.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f4e3024ca44823beb3e2226dda8f80784c06b78973bbb155007fcee88dcd5500"
        },
        {
          "name": "search",
          "description": "Search the Scigantic catalog of public scientific datasets. Returns matching datasets as {results: [{id, title, url}]}; pass an id to fetch for the full description and schema card.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Natural-language search, e.g. \"single-cell RNA-seq of human cortex\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:12bb744894e52e26176ca59210cc9a9e4aa9d6d967369a26557cdee7ead73849"
        },
        {
          "name": "search_archives",
          "description": "Search the Scigantic catalog of public scientific data archives by natural-language query. Matching considers both the archive's description AND a sample of its actual object/file names, so a distinctive filename or path pattern can surface a match even when the prose description never mentions it. Returns ranked matches with id, title, category, a short summary, and two payload-derived trust signals: probeStatus (\"empty\" means the archive's storage was probed and found to have no accessible objects despite being tagged public — likely credentialed, don't spend a turn on it) and objectCountEstimate (a real count/estimate from that probe, not the description's prose). Follow up with get_schema_card to understand a match's structure before doing any analysis.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category filter, e.g. \"Genomics & Bioinformatics\". Comma-separate for several.",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10, max 50).",
                "type": "number"
              },
              "query": {
                "description": "Natural-language search, e.g. \"single-cell RNA-seq of human cortex\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d6a61d17d84eb474634b0169e5e46553c269ed818510cc0a327665e68f9e4070"
        },
        {
          "name": "surechembl_compound",
          "description": "Look up a compound in SureChEMBL, EMBL-EBI's database of chemistry extracted from patents, by any identifier, and report its structure, properties, cross-references (ChEMBL, PubChem, DrugBank, ChEBI, PDB) and how many patents mention it.",
          "inputSchema": {
            "properties": {
              "identifier": {
                "description": "A SureChEMBL id (\"SCHEMBL1353\" or \"1353\"), a ChEMBL id (\"CHEMBL25\"), a PubChem CID as \"pubchem:2244\", a DrugBank id as \"drugbank:DB00945\", a standard InChIKey, a SMILES, or a chemical name (\"aspirin\"; resolved through PubChem to a structure, since SureChEMBL has no name lookup).",
                "type": "string"
              }
            },
            "required": ["identifier"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6f6cc5946ff9c364bdf4c0de16df6076381ad1197f42ca74e88fa0e707fdd13a"
        },
        {
          "name": "surechembl_patent",
          "description": "A patent document from SureChEMBL: title, dates, applicants, inventors, assignees, family, priority claims, number of compounds named in the text, abstract, and (optionally) the claims and description text. SureChEMBL no longer returns CPC codes, citations or legal events with a document.",
          "inputSchema": {
            "properties": {
              "doc_id": {
                "description": "Publication number with kind code, e.g. \"US-10000000-B2\", \"WO2016144528A1\", \"EP-3268771-B1\".",
                "type": "string"
              },
              "include_text": {
                "description": "Also return the claims and description (can be long). Default false.",
                "type": "boolean"
              }
            },
            "required": ["doc_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5a5524850b37b85e669b12daca4e2311dc77efd73edb09829c4122ce9236f440"
        },
        {
          "name": "surechembl_patent_chemistry",
          "description": "The compounds SureChEMBL's text-mining finds named in a patent's text: SCHEMBL id, name, SMILES, InChIKey, formula, weight. Structures that appear only in images or MOL attachments are not included.",
          "inputSchema": {
            "properties": {
              "doc_id": {
                "description": "Publication number with kind code, e.g. \"US-5399578-A\".",
                "type": "string"
              },
              "limit": {
                "description": "Max compounds to list (default 50, max 500).",
