          "name": "get_lead_status",
          "title": "Check lead status",
          "description": "Look up a previously submitted service request by lead_id.",
          "inputSchema": {
            "properties": {
              "lead_id": {
                "description": "ID returned by request_home_service.",
                "title": "Lead Id",
                "type": "string"
              }
            },
            "required": ["lead_id"],
            "title": "get_lead_statusArguments",
            "type": "object"
          },
