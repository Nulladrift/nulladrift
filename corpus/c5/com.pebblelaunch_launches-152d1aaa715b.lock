{
  "lockfileVersion": 2,
  "subjects": {
    "com.pebblelaunch/launches": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pebblelaunch.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "pebblelaunch-launches",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_status",
          "title": "Check a submission",
          "description": "Status of a submission you made (needs its id + status_key). While ownership is pending this re-checks the proof (at most once a minute). Set resend_email to re-send the maker's confirmation link.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "resend_email": {
                "type": "boolean"
              },
              "status_key": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id", "status_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9c9a914831da7b5a0c8796f1d48658e03212531d0d1ba8c51905058ba29f88ac"
        },
        {
          "name": "get_launch",
          "title": "Get one launch",
          "description": "One launched/scheduled product by slug: details, launch day, votes, rank, and the badge snippet once live.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:41d4c011791bd580ee0309d68f9dd9b0be0ba5633ee41e3c4afd34bc132805d8"
        },
        {
          "name": "get_launch_calendar",
          "title": "Launch calendar",
          "description": "Seats left per upcoming UTC day (free queue, premium, featured) and the next day with a free seat.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "days": {
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "from": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fb66439a3b7a1bb1fbdca6606d9b3b42b5c744887818c28dc843a787a606f910"
        },
        {
          "name": "list_launches",
          "title": "List PebbleLaunch launches",
          "description": "Products launching on PebbleLaunch on a given UTC day (default today), ranked by human votes. Featured items are labelled.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "description": "UTC day, YYYY-MM-DD",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6886eadaf3e9dcde76fb4ce4ae5ac44e956e7a34a7953057ba66237e79a20419"
        },
        {
          "name": "submit_product",
          "title": "Submit a product to PebbleLaunch",
          "description": "Submit the user's own product for a free launch day on PebbleLaunch. Only submit products the user owns and has asked you to list. Returns an id, a one-time status_key (save it) and ownership-proof options. Next: add ONE proof on the product's domain (a .well-known file, a meta tag, or a DNS TXT record), then call check_status. The maker then confirms by email; nothing is listed before a human confirms. Rules: https://pebblelaunch.com/rules.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "categories": {
                "items": {
                  "enum": ["developer-tools", "ai", "productivity", "design", "marketing", "finance", "health", "education", "games", "mobile", "mac", "data-api", "faith", "sports", "other"],
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "description": {
                "description": "≤600 chars, plain text, no links; claims must match the site",
                "type": "string"
              },
              "logo_url": {
                "type": "string"
              },
              "maker_email": {
                "description": "The maker's email; we send ONE confirmation link to it. Never shown publicly.",
                "type": "string"
              },
              "maker_name": {
                "description": "Person or company shown as maker",
                "type": "string"
              },
              "name": {
                "description": "Product name, ≤40 chars",
                "type": "string"
              },
              "preferred_date": {
                "description": "Optional UTC day YYYY-MM-DD, tomorrow or later",
                "type": "string"
              },
              "pricing": {
                "enum": ["free", "freemium", "paid", "open-source"],
                "type": "string"
              },
              "screenshots": {
                "items": {
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "tagline": {
                "description": "≤60 chars, plain text, no links",
                "type": "string"
              },
              "url": {
                "description": "https:// product URL on the maker's own domain",
                "type": "string"
              }
            },
            "required": ["categories", "description", "maker_email", "maker_name", "name", "pricing", "tagline", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:50d30a436bffc9e8ec0e738ebba67ee294bda2cda786bfc83d1670aeaace9f2e"
        }
      ],
      "digest": "sha256:d3aacfa0be2a98064771045e1ea3d0046c196046d198e58973ff501146053518"
    }
  }
}
