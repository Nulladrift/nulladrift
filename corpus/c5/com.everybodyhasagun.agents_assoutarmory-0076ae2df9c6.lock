      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only. (1) Catalog of comedy printables and novelty desk toys: list_products, get_product. Agents never pay: give the human the checkout_url. (2) Free carry-law basics for 50 states + DC: carry_state, carry_reciprocity, carry_route. Every carry answer has official sources, a checked_on date and a not-legal-advice disclaimer; null fields are unverified (needs_review).",
      "tools": [
        {
          "name": "carry_reciprocity",
          "title": "Does a visit state honor a home state's carry permit?",
          "description": "Directional lookup: does the visit state recognize a carry permit issued by the home state? Returns status (honored / honored_with_conditions / not_honored / no_permit_exists), the honoring state's explanation and official source URL, verification date, and the visit state's permitless-carry status. Not legal advice. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "home": {
                "description": "Two-letter state code (e.g. TX) or full state name. DC is included.",
                "type": "string"
              },
              "visit": {
                "description": "Two-letter state code (e.g. TX) or full state name. DC is included.",
                "type": "string"
              }
            },
            "required": ["home", "visit"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bebc38f540006fbdf909940d92b0736416df3c009493a329eb4a96e964941264"
        },
        {
          "name": "carry_route",
          "title": "Road-trip carry rundown",
          "description": "Per-state rundown for a road trip: for each state in order, whether the home permit is recognized, whether the state has permitless carry, sources, and a summary of states where the home permit is not recognized. Up to 20 states. Not legal advice. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "home": {
                "description": "Two-letter state code (e.g. TX) or full state name. DC is included.",
                "type": "string"
              },
              "states": {
                "description": "State codes in travel order, e.g. [\"TX\",\"LA\",\"MS\"]. A comma-separated string is also accepted.",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["home", "states"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a6b223593cf1699f0cfdfd50ed6e4b1d5f17878006868eb659683f255912ff0f"
        },
        {
          "name": "carry_state",
          "title": "Carry-law basics for one state",
          "description": "Concealed/open-carry basics for one US state or DC: permitless carry yes/no, permit requirement, reciprocity lists, sourced vehicle-transport/storage/restricted-place facts where verified (null + needs_review where not), official source URLs, checked_on date, confidence. Not legal advice. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "state": {
                "description": "Two-letter state code (e.g. TX) or full state name. DC is included.",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
