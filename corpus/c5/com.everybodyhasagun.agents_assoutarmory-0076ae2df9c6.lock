        },
        {
          "name": "get_product",
          "title": "Get product",
          "description": "Get one product by id, including checkout_url (Etsy, primary; human approval required) and, where available, alternate_checkout_url / checkout_options (PayPal).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "enum": ["patient-side-wedges", "return-my-container-labels", "gift-wrap-code-labels", "funny-range-signs", "christmas-elf-report-pack", "pre-stripped-screws"],
