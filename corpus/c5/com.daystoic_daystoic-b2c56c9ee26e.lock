          "description": "Runs a dayStoic.com quiz over MCP. Call without answers to receive question text and option labels (no scoring values). Call again with zero-based option indexes to score. Free tier: -quick quizzes only, short band summary, up to 3 runs per day. Premium: any quiz, detailed reading, unlimited runs. Optional language.",
