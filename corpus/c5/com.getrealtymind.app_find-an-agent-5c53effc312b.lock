{
  "lockfileVersion": 2,
  "subjects": {
    "com.getrealtymind.app/find-an-agent": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.getrealtymind.com/find-an-agent/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "realtymind-find-an-agent",
        "title": "Find a real estate agent",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Find a licensed real estate brokerage for a person who wants to sell their home or start buying one, and book a meeting with it. First call find_brokerages with the place (a city and state, a ZIP code or an address). Show the person the brokerages that serve it and let them choose; the list is not a ranking. Then use that brokerage’s id with the other tools: about_brokerage, open_times, book_time (only after the person confirms the time, their name and a phone or an email), or request_consultation. Home tours (showings) need a signed buyer agreement first, so they are never booked here: book a buyer consultation. No prices, commission, fees or home values are given; the agent covers those. Booking never signs the person up for texts or calls. Dates are month/day/year in the brokerage’s time zone. Every brokerage listed is an Equal Housing Opportunity brokerage.",
      "tools": [
        {
          "name": "about_brokerage",
          "title": "About the brokerage",
          "description": "What the chosen brokerage does, the areas it serves, and what can be booked here.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brokerage_id": {
                "description": "A brokerage id, as listed by the brokerage search.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["brokerage_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About the brokerage"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c907316f62ceffd5ca3b1b0b17dec1dca71e9a8179575b9b003b9878d2d8b0ae"
        },
        {
          "name": "book_time",
          "title": "Book a time",
          "description": "Books one open time for a buyer consultation or a listing appointment with the chosen brokerage. Needs the start of an open time, a first name, a phone or an email, and person_confirmed. Showings are not offered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "assistant": {
                "description": "Which assistant is sending this.",
                "enum": ["chatgpt", "claude", "gemini", "copilot", "perplexity", "siri", "alexa", "meta", "other"],
                "type": "string"
              },
              "brokerage_id": {
                "description": "A brokerage id, as listed by the brokerage search.",
                "maxLength": 60,
                "type": "string"
              },
              "email": {
                "description": "Give a phone or an email.",
                "maxLength": 160,
                "type": "string"
              },
              "first_name": {
                "maxLength": 60,
                "type": "string"
              },
              "kind": {
                "description": "buyer_consult: the person wants to buy a home. listing_appt: the person wants to sell their home.",
                "enum": ["buyer_consult", "listing_appt"],
                "type": "string"
              },
              "language": {
                "description": "The language the person wants.",
                "enum": ["en", "es"],
                "type": "string"
              },
              "last_name": {
                "maxLength": 60,
                "type": "string"
              },
              "note": {
                "description": "What they want, in their words (area, timing, the home).",
                "maxLength": 1000,
                "type": "string"
              },
              "person_confirmed": {
                "description": "true when the person agreed to this time and these details.",
                "type": "boolean"
              },
              "phone": {
                "description": "A US phone number. Give a phone or an email.",
                "maxLength": 30,
                "type": "string"
              },
              "start": {
                "description": "The start of an open time, exactly as listed.",
                "type": "string"
              }
            },
            "required": ["brokerage_id", "first_name", "kind", "person_confirmed", "start"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Book a time"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:fcbd9ec2b6b6f63951374dab5e699ad120ec53dc4afb94ae2e98ca0c039f9562"
        },
        {
          "name": "check_area",
          "title": "Check the area",
          "description": "Does the chosen brokerage serve this place? Give a city, a county, a ZIP code or an address.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brokerage_id": {
                "description": "A brokerage id, as listed by the brokerage search.",
                "maxLength": 60,
                "type": "string"
              },
              "place": {
                "description": "A city and state, a ZIP code or an address.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["brokerage_id", "place"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check the area"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d3d53928aa9b8241bb35cb0ab805f1fed34ed4af76a8f5b69857fa21d0677986"
        },
        {
          "name": "find_brokerages",
          "title": "Find brokerages for an area",
          "description": "The real estate brokerages that serve a place and can be booked or asked here. Not a ranking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "place": {
                "description": "A city and state, a ZIP code or an address.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["place"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find brokerages for an area"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c650a0699081d26589bf013b110fdbfae48b36b28ae91fe8f9408fe6c363fbb6"
        },
        {
          "name": "open_times",
          "title": "Open times",
          "description": "Lists the open times for a buyer consultation or a listing appointment with the chosen brokerage. Showings are not offered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brokerage_id": {
                "description": "A brokerage id, as listed by the brokerage search.",
                "maxLength": 60,
                "type": "string"
              },
              "days": {
                "description": "How many open days to list (1 to 14, default 7).",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "from": {
                "description": "First day to look at, MM/DD/YYYY. Leave out for the next open days.",
                "type": "string"
              },
              "kind": {
                "description": "buyer_consult: the person wants to buy a home. listing_appt: the person wants to sell their home.",
                "enum": ["buyer_consult", "listing_appt"],
                "type": "string"
              }
            },
            "required": ["brokerage_id", "kind"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Open times"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:65654b983b67f63d1e5326df40940a84e850d9f7ba90aaac3c39bf1fb10c8c3c"
        },
        {
          "name": "request_consultation",
          "title": "Request a consultation",
          "description": "Sends the chosen brokerage a request for a buyer consultation or a listing appointment. An agent reaches out to set a time; nothing is booked.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "about": {
                "description": "What they want, in their words.",
                "maxLength": 1000,
                "type": "string"
              },
              "assistant": {
                "description": "Which assistant is sending this.",
                "enum": ["chatgpt", "claude", "gemini", "copilot", "perplexity", "siri", "alexa", "meta", "other"],
                "type": "string"
              },
              "brokerage_id": {
                "description": "A brokerage id, as listed by the brokerage search.",
                "maxLength": 60,
                "type": "string"
              },
              "email": {
                "maxLength": 160,
                "type": "string"
              },
              "kind": {
                "description": "buyer_consult: the person wants to buy a home. listing_appt: the person wants to sell their home.",
                "enum": ["buyer_consult", "listing_appt"],
                "type": "string"
              },
              "language": {
                "description": "The language the person wants.",
                "enum": ["en", "es"],
                "type": "string"
              },
              "name": {
                "maxLength": 120,
                "type": "string"
              },
              "phone": {
                "description": "Give a phone or an email.",
                "maxLength": 30,
                "type": "string"
              },
              "times": {
                "description": "Days and times they prefer, in their words.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["brokerage_id", "kind", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Request a consultation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:0438460e56eb42002d7bdc8ee9e8a7a3704a0e10f414efd7e81988af527a7b00"
        }
      ],
      "digest": "sha256:55b75692872762cbd0f48afbe7f8f02968f90b97ad9a91bcd0e1ab99818bff16"
    }
  }
