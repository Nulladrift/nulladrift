{
  "lockfileVersion": 2,
  "subjects": {
    "app.staticradio/static-radio": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://staticradio.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "static-radio",
        "title": "Static Radio",
        "version": "1.0.0",
        "websiteUrl": "https://staticradio.app/developers#mcp",
        "icons": [
          {
            "src": "https://staticradio.app/assets/img/STATIC-icon-logo.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Static is free live radio made from independent podcasts, with stations like News, Learn, Weird, Nature and Sleep. It's one shared live timeline: everyone tuned to a station hears the same moment. You don't pick an episode, rewind or skip ahead; you tune in to a station and land where everyone else is. Use these tools to say what is on now, what is next, or where a topic is airing, then hand the listener the station's listen link (https://staticradio.app/listen/<station>), which tunes in live. Credit the show by name and link its episodeUrl. When a supportUrl is present, that's how listeners can support the show. Community bulletins are 30-second spots anyone can book, played between episodes. Describe them as community bulletins, never as shows. Times are in UTC (startsAt) and US Central (startsAtCentral); the broadcast day runs on US Central time.",
      "tools": [
        {
          "name": "find_on_now",
          "title": "Find something on now",
          "description": "Looks across every station for what's on now and in the next few hours, matching the words of a topic against show names and episode titles (simple word matching). Leave the topic out for a guide to everything on now and coming up soon. Good for 'is anything about birds on?' or 'when's the next PBS News Hour?'.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "hours": {
                "description": "How far ahead to look, in hours (default 3, at most 12).",
                "maximum": 12,
                "minimum": 0.25,
                "type": "number"
              },
              "topic": {
                "description": "Words to look for in show names and episode titles, like \"jazz\" or \"PBS News Hour\".",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find something on now"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:29ee529586be8f053470b006b89f1975c979d754d75c4027778bd3bfa26353c0"
        },
        {
          "name": "list_stations",
          "title": "List stations",
          "description": "Lists Static's stations in dial order: id, name, a one-line description, how many people are listening right now (when known) and a link that tunes in live. Start here to find a station's name or id.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List stations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d5bf82d8004687e555f392018f3ba65f9ad8fc2d66d3287dc426eb241650d6fc"
        },
        {
          "name": "show_details",
          "title": "Show details",
          "description": "Details for one episode, by its episodeId (from the other tools), or for a show, by name: the show and episode titles, the episode's web page, the show's support link when there is one, and which station airs it and when in the next 24 hours, according to today's schedule.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "episodeId": {
                "description": "An episodeId from whats_on, whats_next or find_on_now.",
                "maxLength": 200,
                "type": "string"
              },
              "show": {
                "description": "A show name, like \"PBS News Hour\". Matched loosely.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Show details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9907f3e2c11752f870e4aed2b76fa12266bc9e01d1250e9aaa5a63ca89065acb"
        },
        {
          "name": "whats_next",
          "title": "What's next",
          "description": "The next items coming up on one station, in airing order, with start times (UTC and US Central), shows, episode titles and links. Community bulletins in the lineup are labeled as community bulletins. To hear any of them, tune in to the station live when it airs; there is no way to play an episode on demand.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "count": {
                "description": "How many upcoming items to return (1 to 20, default 5).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "includeBulletins": {
                "description": "Include the community bulletins between episodes (default true).",
                "type": "boolean"
              },
              "station": {
                "description": "A station: its name (News, SHEILA B), its slug (news) or its id (news_01). See list_stations.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["station"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What's next"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:84bad6ca48f45a97af41c13f46c3a515a90c078597bc4cbb1ed3d3da3221cc49"
        },
        {
          "name": "whats_on",
          "title": "What's on now",
          "description": "What's playing right now on one station, or on every station if none is given: the show and episode title, how far in it is and how long is left, the episode's web page, the show's support link when there is one, cover art, and the station's listen link (which tunes in live; listeners don't pick an episode). Community bulletins between episodes are reported as community bulletins.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "station": {
                "description": "A station: its name (News, SHEILA B), its slug (news) or its id (news_01). See list_stations.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What's on now"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:02404f5dfb46a2728c0a267f9cc42b9f2d8c85dd31888666976e0679ec7f554d"
        }
      ],
      "digest": "sha256:75fb19012d3298995cb114b15f91d0b7e71aed54309422a0c0093eef0ea1bb4c"
    }
  }
