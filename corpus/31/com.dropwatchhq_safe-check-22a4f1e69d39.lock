      "tools": [
        {
          "name": "counterfeit_risk",
          "description": "Assess counterfeit RISK for a collectible listing (a risk SIGNAL, never proof of fake). Combines marketplace base-risk + a price-vs-retail-median check when the item is a known collectible niche. Returns a risk level (low/med/high), a score, the signals, and authenticity advice.",
          "inputSchema": {
            "properties": {
              "marketplace": {
                "description": "Optional: where it's listed, e.g. 'aliexpress', 'ebay', 'etsy'.",
                "type": "string"
              },
              "price": {
                "description": "Optional: the listed price to compare against the retail median.",
                "type": "number"
              },
              "query": {
                "description": "Product or brand, e.g. 'Funko Batman' or 'LEGO 10307'.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cec2417395811af3e7bf2f696182b51143dab6f7a0234c12b04ebe7f8000826d"
        },
        {
          "name": "recall_lookup",
          "description": "Look up active US product recalls for a product or brand against live government feeds (CPSC/FDA/NHTSA-style aggregate). Returns matching recalls with the official agency source link and last-updated date. Use to check if something is recalled before buying/using it.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Product name or brand, e.g. 'Peloton bike' or 'stroller'.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4fbd8709f2441d43b59424ce9b66ea246f70b397759565e1109c79cb18d64ab4"
        },
        {
          "name": "safe_check",
          "description": "Run both a recall lookup and a counterfeit-risk check in one call. Best general-purpose product-safety screen.",
          "inputSchema": {
