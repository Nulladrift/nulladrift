      "capabilities": {
        "tools": {}
      },
      "instructions": "Read-only reference for cancelling subscriptions and memberships by mail. Use search_companies to find a company's slug, get_cancellation_guide for how it takes cancellations (notice period, traps, mailing address) and get_cancellation_letter for a ready-to-send letter. Every answer matches the company's page on postbye.com.",
      "tools": [
        {
          "name": "get_cancellation_guide",
          "title": "Get a cancellation guide",
          "description": "How to cancel one company's subscription or membership: how it takes cancellations, the notice period, the traps to check first, billing-partner notes, sources, when the facts were verified, the mailing address(es) on file and the guide and address page URLs. Accepts a company slug from search_companies (merged duplicate slugs resolve to the current one).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Company slug, for example \"netflix\".",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a cancellation guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:46d7c6bfd595258c0f631e89a8e0b3fce309522d3a4f5e2639fdbf818062f7b8"
        },
        {
          "name": "get_cancellation_letter",
          "title": "Get a cancellation letter",
          "description": "A plain-text cancellation letter for one company, built from the same template as Postbye's free letter tool, plus where to send it. Fields not supplied stay as [bracketed placeholders] to fill in. Nothing is stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "account_number": {
                "description": "Account, membership or reference number (optional).",
                "maxLength": 64,
                "type": "string"
              },
              "customer_name": {
                "description": "Your full name as it appears on the account (optional).",
                "maxLength": 100,
                "type": "string"
              },
              "slug": {
                "description": "Company slug from search_companies.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a cancellation letter"
          },
