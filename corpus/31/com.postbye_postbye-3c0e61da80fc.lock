          },
          "digest": "sha256:38faa11153b55d5b56af2a91f53a602b50157e23951c72e0849a1cb462f2c956"
        },
        {
          "name": "list_categories",
          "title": "List guide categories",
          "description": "The category hubs of the cancellation guides (streaming, gyms, phone and internet, insurance and more) with the number of guides in each and the hub URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
