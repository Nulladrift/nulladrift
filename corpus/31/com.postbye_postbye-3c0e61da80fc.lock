          },
          "digest": "sha256:e76dd2b35371517e9af38c2613cb488ea77e4d63ee89b271674e279daefffafd"
        },
        {
          "name": "search_companies",
          "title": "Search cancellation guides",
          "description": "Find companies by name (for example \"netflix\" or \"planet fitness\") among the subscriptions and memberships Postbye has a cancellation guide for. Returns each match's slug, category, how the company takes cancellations and the guide URL. Use the slug with get_cancellation_guide.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "Maximum number of matches (1 to 10).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Company or service name, or part of it.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
