        "type": "http",
        "url": "https://fronterasignal.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "frontera-signal",
        "title": "Frontera Signal",
        "version": "1.1.0",
        "websiteUrl": "https://fronterasignal.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Frontera Signal sells market data for the Rio Grande Valley, Texas, per call over x402 (construction, border crossings and bridge waits, peso and diesel, city sales tax, new businesses, alcohol sales, home health): USDC on Base, no account or API key. These tools are free and read-only. Start with list_endpoints, read a real answer with get_sample, then use how_to_pay to check your parameters and get the exact URL and price. get_free_series returns the latest 4 weeks of each weekly series at no cost. Payment happens on the HTTP API with an x402 client, never through these tools.",
      "tools": [
        {
          "name": "get_free_series",
          "title": "Free weekly series",
          "description": "Get the latest 4 weeks of a weekly Rio Grande Valley series for free: permits-weekly (building permits by city), cost-basket-weekly (building-input prices), absorption (housing supply), labor-ranges (labor and financing conditions) or calls (graded forecasts). Each row carries its week, as_of date and status. The full history is a paid endpoint; how_to_pay with series-<name> gives its URL and price.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "series": {
                "description": "permits-weekly, cost-basket-weekly, absorption, labor-ranges or calls.",
                "enum": ["permits-weekly", "cost-basket-weekly", "absorption", "labor-ranges", "calls"],
                "type": "string"
              }
            },
            "required": ["series"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Free weekly series"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d442b3bb733999fff391092b235b974e0d328eda49fcff362843b751c7be939b"
        },
        {
          "name": "get_sample",
          "title": "Free sample answer",
          "description": "Get a real answer from one paid endpoint for free, exactly as a paid call returns it, so you can check the fields, dates and coverage before you pay. Pass the endpoint key from list_endpoints, such as snapshot, projects or series-permits-weekly.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "endpoint": {
                "description": "Endpoint key from list_endpoints, e.g. snapshot or series-permits-weekly.",
                "enum": ["snapshot", "projects", "companies", "nearby", "parcel", "cost-per-sqft", "materials", "series-permits-weekly", "series-permits-monthly", "series-cost-basket-weekly", "series-absorption", "series-labor-ranges", "series-calls", "issue", "bridge-wait", "bridge-hourly", "crossings", "peso", "diesel", "sales-tax", "new-outlets", "alcohol-sales", "home-health", "industry", "ask"],
                "type": "string"
              }
            },
            "required": ["endpoint"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Free sample answer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0715e33fa2f17b58325249c943f4f3b12876044596c5127d78601a1167fdda40"
        },
        {
          "name": "how_to_pay",
          "title": "Paid URL and price",
          "description": "Get the exact URL to call for a paid answer, with its price, network and asset. Pass the endpoint key and the query parameters you plan to send; they go through the same free check the API runs before payment, so a query that would be refused or come back empty shows up here. This tool never calls the paid endpoint and never pays. Payment is x402: no account or API key, USDC on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "endpoint": {
                "description": "Endpoint key from list_endpoints, e.g. snapshot or series-permits-weekly.",
                "enum": ["snapshot", "projects", "companies", "nearby", "parcel", "cost-per-sqft", "materials", "series-permits-weekly", "series-permits-monthly", "series-cost-basket-weekly", "series-absorption", "series-labor-ranges", "series-calls", "issue", "bridge-wait", "bridge-hourly", "crossings", "peso", "diesel", "sales-tax", "new-outlets", "alcohol-sales", "home-health", "industry", "ask"],
                "type": "string"
              },
              "params": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Query parameters you plan to send, as strings, e.g. {\"city\": \"McAllen\"}. list_endpoints gives each endpoint's parameters and valid values. Omit for a call with no parameters.",
                "type": "object"
              }
            },
            "required": ["endpoint"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Paid URL and price"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:114234ff4c561259eda66a77d1988ba4b1fb1d250c361ba7c6793581daa51301"
        },
        {
          "name": "list_endpoints",
          "title": "List paid endpoints",
          "description": "List every paid Frontera Signal endpoint before you spend anything. Covers Rio Grande Valley, Texas market data: construction (permits, building-input prices, housing supply, labor, commercial projects filed with the state, company track records, filed cost per square foot, material shelf prices, the weekly briefing), bridge wait times, border crossings, peso, diesel, city sales tax, new businesses, bar and restaurant alcohol sales and home health agencies. Each entry has the price per call in USDC, what the call returns, an example question, its parameters with valid values and a free sample URL. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List paid endpoints"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e639e1fddcf07781d7b1f6d2da7e4df7f53890ba09832605db90814f210f63fa"
        }
      ],
      "digest": "sha256:b53acf2b05baca21ff02e05617f3cec06109ea4de8adf81d0d31b24a4011ecab"
    }
  }
}
