            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:923f53b84ddf0470815a589cbb6c14c4abe1cd89b64ab7d78489d2318c739796"
        },
        {
          "name": "latest_warnings",
          "title": "Latest regulator warnings",
          "description": "The newest warnings added to the compiled lists, newest first. Optionally filter by regulator code (from list_sources) or by ISO country code of the regulator (for example GB, US, FR, ES, IT, SG).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "default": 15,
                "maximum": 50,
                "minimum": 1,
