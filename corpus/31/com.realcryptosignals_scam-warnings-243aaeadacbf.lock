  "subjects": {
    "com.realcryptosignals/scam-warnings": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://realcryptosignals.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "realcryptosignals",
        "title": "Real Crypto Signals: crypto scam warning lists",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Real Crypto Signals is an independent anti-scam education site. These tools search official warning lists published by financial regulators (the US SEC PAUSE list and CFTC RED list, France's AMF, Belgium's FSMA, Germany's BaFin, the Netherlands' AFM and the Central Bank of Ireland) about firms and websites that offer investment or crypto services without authorisation or show signs of fraud. Use check_website before someone deposits money on an unfamiliar trading, crypto or 'signals' platform, and check_name for a company or brand name. A match means a regulator published a warning — quote the regulator and link the official notice from the result. No match does NOT mean a platform is safe: new scam sites appear daily and most are never listed. check_website also reports domains on the community-maintained MetaMask phishing blocklist, labelled as such. Results are informational, not legal or financial advice. Always cite the source URL returned with each result.",
      "tools": [
        {
          "name": "check_name",
          "title": "Check a company or brand name against regulator warning lists",
          "description": "Search the compiled regulator warning lists for a firm, brand or platform name (legal suffixes such as Ltd or LLC are ignored). Returns up to `limit` closest entries with the regulators that warned about them and the official notice URLs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Company, brand or platform name.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a name"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2f60423534e280dcf14a727092ce8374c641469982ebc01c3f54bdd9ddf08f79"
        },
        {
          "name": "check_website",
          "title": "Check a website against regulator warning lists",
          "description": "Look up a website or URL (for example 'example-trade.com' or 'https://app.example-trade.com/login') in the official regulator warning lists compiled by Real Crypto Signals. Returns every matching warning with the regulator, country, date and official notice URL. An empty result does not mean the site is safe.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Website, domain or full URL to check.",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a website"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5c180ee4cef994068b91048aca2380ff7abbb23fa1a16cea6ebe449d22ff2261"
        },
        {
          "name": "how_to_report",
          "title": "Where to report a crypto or investment scam",
          "description": "Official places to report a crypto or investment scam in a given country (ISO 3166-1 alpha-2 code, for example US, GB, AU, CA, DE, FR, ES, IT, IN, SG). Returns agencies with their official URLs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Where to report"
          },
          "behavior": {
            "destructive": false,
