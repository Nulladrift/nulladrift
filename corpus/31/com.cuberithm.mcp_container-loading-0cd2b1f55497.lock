      "instructions": "Brimload Container Loading: calculate how many identical boxes/cartons fit in a shipping container or rectangular space, where they go, and a 3D loading plan, using the exact single-SKU solver behind the Brimload T1 tool at brimload.com.\n\nUse `pack_boxes` for any 'how many fit / loading plan / container utilisation' question with ONE carton size. Provide the box L*W*H and either a `container` preset (e.g. 40HQ) or an explicit space L*W*H - ALL IN MILLIMETRES. Explicit spaces may be larger than standard container maxima, up to 32000 mm per dimension; a larger dimension is refused with a message. When the count safety limit is exceeded, the response is marked as a heuristic fallback and says why. For a partial load, pass `count` plus the corner flags. Set `include_image=true` only when the user wants to SEE the layout; the result includes a shareable `image_url` when the 3D renderer supports the input.\n\nUse `send_feedback` to relay the user's questions or suggestions to the maintainers. Single carton type only (mixed SKUs are out of scope). Free, no API key; from brimload.com.",
      "tools": [
        {
          "name": "pack_boxes",
          "description": "Calculate how many identical boxes fit in a rectangular space, and where.\n\n        The space is a shipping container, a pallet area, leftover container space,\n        or a larger box. Give the box's L/W/H and EITHER a `container` preset OR the\n        space's L/W/H (all in millimetres - container presets are mm). Boxes mix\n        orientations across regions to pack densely; the plain maximum-load answer\n        uses the exact T1 solver.\n\n        Args:\n            box_length: Box length.\n            box_width: Box width.\n            box_height: Box height.\n            container: Container preset instead of explicit space dims (fills the\n                internal usable L/W/H in mm; overrides space_* when recognised).\n                ISO dry: 20GP 20HQ 40GP 40HQ 45GP 45HQ; NA domestic: 53HC 48HC;\n                reefers: 20RF 40RF 40RH; EU pallet-wide: 40HQ-PW 45HQ-PW. Many\n                aliases (20/40/45, 20ft, 40HC, 40', 40 reefer, ...).\n            space_length: Space length (front-back). Use this OR `container`.\n            space_width: Space width (left-right).\n            space_height: Space height (up).\n            count: How many boxes to load. 0 (default) loads the maximum.\n            to_front: Anchor a partial load to the front (else the back).\n            to_left: Anchor a partial load to the left (else the right).\n            to_bottom: Kept for compatibility, no effect: boxes always rest on\n                the floor.\n            box_weight: Weight of one box (optional; same unit as max_weight).\n            max_weight: Max total load weight (optional; 0 = no weight limit).\n            include_image: Set true ONLY when the user wants to SEE or visualize\n                the loading plan / 3D layout (e.g. \"show the loading plan\",\n                \"visualize it\", \"what does it look like?\"). Default false is\n                faster and lighter and still returns `image_url`, a shareable\n                link to the 3D render. When true, the image is ALSO embedded\n                inline (Claude Desktop and Cherry Studio display it; the\n                claude.ai web app shows only the link either way).\n\n        Returns the maximum that fits, how many were loaded, the fill rate, the\n        region/block decomposition (each block's position, orientation, and\n        grid), any weight limit applied, an `image_url` link to the rendered 3D\n        loading plan, and - when include_image is true - the inline image too.\n        ",
          "inputSchema": {
            "properties": {
              "box_height": {
                "title": "Box Height",
                "type": "integer"
              },
              "box_length": {
                "title": "Box Length",
                "type": "integer"
              },
              "box_weight": {
                "default": 0,
                "title": "Box Weight",
                "type": "integer"
              },
              "box_width": {
                "title": "Box Width",
                "type": "integer"
              },
              "container": {
                "default": "",
                "title": "Container",
                "type": "string"
              },
              "count": {
                "default": 0,
                "title": "Count",
                "type": "integer"
              },
              "include_image": {
                "default": false,
                "title": "Include Image",
                "type": "boolean"
              },
              "max_weight": {
                "default": 0,
                "title": "Max Weight",
                "type": "integer"
              },
              "space_height": {
                "default": 0,
                "title": "Space Height",
                "type": "integer"
              },
              "space_length": {
                "default": 0,
                "title": "Space Length",
                "type": "integer"
              },
              "space_width": {
                "default": 0,
                "title": "Space Width",
                "type": "integer"
              },
              "to_bottom": {
                "default": true,
                "title": "To Bottom",
                "type": "boolean"
              },
              "to_front": {
                "default": true,
                "title": "To Front",
                "type": "boolean"
              },
              "to_left": {
                "default": true,
                "title": "To Left",
                "type": "boolean"
              }
            },
            "required": ["box_height", "box_length", "box_width"],
            "title": "pack_boxes_toolArguments",
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Pack boxes into a container or space"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:516499dd63a26985d4ca722447b6062ef4abb7acad96b062d07d9d942acaa8ed"
        },
        {
          "name": "send_feedback",
          "description": "Send a question, suggestion, or bug report about this container-loading tool to the Zhihuo maintainers.\n\n        Use this when the user wants to ask the tool's authors a question,\n        suggest an improvement (e.g. another container type or output field),\n        or report a result that looks wrong. The note reaches the Zhihuo team.\n\n        Args:\n            message: The question, suggestion, or bug report, in plain text.\n            contact: Optional email or handle if the user would like a reply.\n            category: Optional tag - \"question\", \"suggestion\", \"bug\", or \"other\".\n\n        Returns a short confirmation string.\n        ",
          "inputSchema": {
            "properties": {
              "category": {
                "default": "",
                "title": "Category",
                "type": "string"
              },
              "contact": {
                "default": "",
                "title": "Contact",
                "type": "string"
              },
              "message": {
                "title": "Message",
                "type": "string"
              }
            },
            "required": ["message"],
            "title": "send_feedback_toolArguments",
            "type": "object"
          },
          "outputSchema": {
