              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "send_feedback_toolOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send feedback to the Zhihuo maintainers"
          },
          "behavior": {
