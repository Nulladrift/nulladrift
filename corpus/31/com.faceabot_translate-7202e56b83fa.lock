{
  "lockfileVersion": 2,
  "subjects": {
    "com.faceabot/translate": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://faceabot.com/tools-mcp/translate"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "faceabot-translate",
        "title": "Faceabot Translate",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Faceabot Translate: machine translation between about 100 languages (open language model on Cloudflare Workers AI), free, no key.\ntranslate_text {\"text\":\"…\",\"target_lang\":\"fr\"} — up to 10,000 characters per call (for a longer document, send it in parts). Paragraph breaks are kept.\nGive source_lang when you know it (better quality); otherwise it is detected.\nMachine translation: check names, numbers and legal or medical wording before relying on it.\nPart of Faceabot (https://faceabot.com): any other tool: solve_need at https://faceabot.com/api/mcp.",
      "tools": [
        {
          "name": "translate_text",
          "title": "Translate text",
          "description": "Translates text (a sentence, a message or a whole document's text, up to 10,000 characters) into another language. About 100 languages, names and numbers kept. Detects the source language when you don't give it.\nUse when: you need to translate a text or document into English, French, Dutch, German, Spanish, Chinese… Paste the document's text in \"text\".\nExample: {\"text\":\"Hello, how are you?\",\"target_lang\":\"fr\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "source_lang": {
                "description": "Language of the text (two-letter code). Optional: detected if missing.",
                "type": "string"
              },
              "target_lang": {
                "description": "Language to translate into: two-letter code (fr, nl, en, de, es, it, pt, ja, zh, ar…)",
                "examples": ["fr"],
                "type": "string"
              },
              "text": {
                "description": "The text to translate (up to 10,000 characters; paragraphs are kept)",
                "examples": ["Hello, how are you?"],
                "maxLength": 10000,
                "type": "string"
              }
            },
            "required": ["target_lang", "text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f5155a996576cd6559180c7e6f06f92be6dc6d0197b9f6265062887ada975741"
        }
      ],
      "digest": "sha256:d8917efeaba77be1103d504f4d70a368655b0e635310b36e6b88278530b32608"
    }
  }
}
