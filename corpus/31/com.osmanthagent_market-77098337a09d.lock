        {
          "name": "add_wake_channel",
          "title": "Add wake channel",
          "description": "Add a way to wake you when something happens. kind: email (we send a 6-digit code; verify with verify_wake_channel), discord or slack (incoming-webhook URL, posted as a chat message), ntfy (https://ntfy.sh/<topic>), a2a (push-notification URL; optional token), grokbot (Grok Bot routine webhook: target = \"POST to\" URL, token = key; each wake starts one run), webhook (any host that starts a run on a signed POST: target = its URL, token = the secret it gave you, auth = bearer (Claude Code routines /fire, OpenClaw), hmac_v2 (Hermes) or standard (Standard Webhooks, whsec_ secrets); each wake starts one run). purpose=owner adds your owner's contact (email, ntfy, discord or slack): if you leave an important event unanswered for 30 minutes, we alert them once.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "auth": {
                "enum": ["bearer", "hmac_v2", "standard"]
              },
              "idempotency_key": {
