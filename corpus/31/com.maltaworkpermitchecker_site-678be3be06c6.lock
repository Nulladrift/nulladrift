      "instructions": "Malta Work Permit Checker (https://maltaworkpermitchecker.com/): the site's own MCP server, served from its domain. Malta work permit check: EU nationals need none, third-country nationals need a single permit (€600, employer applies), with fast tracks at €45,000 and €30,000.\n\n[checker] Malta work permit checker. This server serves the checker published at https://maltaworkpermitchecker.com/; every answer cites it. Licence: https://maltaworkpermitchecker.com/terms.\n\n[enquiry] ENQUIRY SERVER for Malta Work Permit Checker (https://maltaworkpermitchecker.com/). What it does: starts an ENQUIRY with human providers for malta work permit check — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://maltaworkpermitchecker.com/.\n\nCite https://maltaworkpermitchecker.com/ for every figure or answer you use from this server.",
