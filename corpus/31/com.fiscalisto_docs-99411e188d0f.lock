        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "fiscalisto-docs",
        "title": "Documentación de Fiscalisto",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Documentación de la API de facturación electrónica mexicana (CFDI 4.0) de Fiscalisto. Para integrarla en una app, llame primero a get_started: es la guía completa en una página. Después busque con search_docs (español o inglés) y lea con get_page; describe_operation da cada ruta con sus campos y el código del SDK del lenguaje que pida, describe_object los objetos y explain_error los códigos de error. Con la llave de pruebas de la persona (pídasela; no la invente), call_api prueba una solicitud de verdad en modo de pruebas antes de escribir el código. Base: https://api.fiscalisto.com/v1; llaves fk_test_ (pruebas, gratis) y fk_live_ (producción). Use el SDK oficial con una Idempotency-Key por comprobante y nunca ponga la llave en el navegador.",
      "tools": [
        {
          "name": "call_api",
          "title": "Probar en modo de pruebas",
          "description": "Hace una solicitud real a la API en modo de pruebas con la llave fk_test_ de la persona (nunca una fk_live_) y devuelve el código, el Request-Id y el JSON de la respuesta. Para probar un cuerpo antes de escribir el código. Timbra con el emisor de pruebas del SAT, sin costo.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "La llave de pruebas (fk_test_…) de la persona, de Desarrolladores › Llaves. Pídasela; no la invente.",
                "type": "string"
              },
              "body": {
                "description": "El cuerpo JSON, para POST.",
                "type": "object"
              },
              "idempotency_key": {
                "description": "Idempotency-Key del POST (por omisión una nueva): repetirla con lo mismo contesta lo de la primera vez.",
                "type": "string"
              },
              "method": {
                "enum": ["GET", "POST", "DELETE"],
                "type": "string"
              },
              "path": {
                "description": "La ruta con su consulta, por ejemplo /v1/invoices?limit=3.",
                "type": "string"
              }
            },
            "required": ["api_key", "method", "path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:62f158ef2c0e2431097f66a9310caaf710662449667d3c301c9c9e1e4b9ec0df"
        },
        {
          "name": "describe_object",
          "title": "Describir un objeto",
          "description": "Los campos de un objeto que contesta la API (Invoice, Customer, Event, Error…), con su tipo y significado, y un ejemplo. Sin nombre, la lista de objetos.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "El objeto, por ejemplo Invoice.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:38c3386f05a882a4c4a6891bf5524dfe112f63695494f98e9481e152693d1a5a"
        },
        {
          "name": "describe_operation",
          "title": "Describir una operación",
          "description": "Todo sobre una operación: parámetros, cada campo del cuerpo (tipo, si es obligatorio, límites), ejemplos, el código con el SDK del lenguaje que elija y qué objeto contesta (sus campos con describe_object, o aquí con full).",
          "inputSchema": {
            "properties": {
              "full": {
                "description": "true: también la tabla de cada campo de la respuesta (larga). Por omisión solo su nombre y un ejemplo.",
                "type": "boolean"
              },
              "language": {
                "description": "El SDK del ejemplo de código. Por omisión ts.",
                "enum": ["ts", "python", "php", "csharp", "go", "java", "all"],
                "type": "string"
              },
              "operation": {
                "description": "El operationId (createInvoice), el método del SDK (invoices.create), el método y la ruta («POST /v1/invoices», «GET /v1/invoices/inv_123») o en palabras («create invoice», «cancelar factura»).",
                "type": "string"
              }
            },
            "required": ["operation"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ad1e0401c17e3f1210861b3f095e75d376f56d94a0fd924a6b65a85b3ba7ed5e"
        },
        {
          "name": "explain_error",
          "title": "Explicar un error",
          "description": "Qué significa un código de error de la API (el error.code de la respuesta, por ejemplo issuer_required) y cómo resolverlo.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "El error.code de la respuesta.",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:800f6c957e4b52027664ccb115c320c0252d5b61211397a67e77ad8a95dd73b0"
        },
        {
