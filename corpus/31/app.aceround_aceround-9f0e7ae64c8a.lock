          "description": "Start a live or mock interview for the user and return the interview page link for the user to open in a browser (web only; it does not launch the desktop app; the user must be signed in to the same account in that browser). Live: the user shares the meeting tab with audio as prompted and, after clicking \"Start interview\", minutes are deducted by time online. Mock: one mock interview credit is deducted on creation. Only one session of each type can be in progress. Advanced settings not given (answer style, custom instructions, translation, answer recording, web search, knowledge bases) follow the user's saved interview preferences. Target IDs come from list_interview_targets, resume IDs from list_resumes. Uses the user's minutes or credits or creates a payment; tell the user what it costs and get their agreement first. (Requires the user's sign-in with scope interviews:write.)",
