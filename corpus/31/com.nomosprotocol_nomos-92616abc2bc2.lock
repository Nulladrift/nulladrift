      "tools": [
        {
          "name": "ask_authority",
          "description": "Query a published authority on the NOMOS Exchange marketplace — a different system from verify_decision's own sealed policies. Every public authority (e.g. eu-ai-act.nomos) is queryable with no key. Returns the authority's own verdict (AUTHORIZED/DENIED/ESCALATED), the exact rule and reason, and a permanent, cryptographically-bound transcript (query_id + url) — replayable evidence, not just a reply. Nothing is invented or paraphrased: the verdict is the authority's sealed rules evaluated against your inputs. The default response is a short, curated summary (verdict, matched rule, source citation when the artifact has one, transparency/completeness disclosures, transcript link) — not the full rule-by-rule evaluation trace. Set include_evaluation_trace: true to get that complete diagnostic record when you or the user actually need it.",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "Optional label for what this query represents, for the caller's own transcript record (e.g. \"pre-deployment check\"). Purely descriptive — does not affect the verdict.",
                "type": "string"
              },
              "acts_for": {
                "description": "Optional organisation the agent acts for. Recorded as declared; when an Exchange key is used, the key's account is recorded instead.",
                "type": "string"
              },
              "agent_id": {
                "description": "Optional stable name for the agent asking (e.g. \"acme-credit-agent\"). Recorded on the transcript and shown in the authority's public history as who relies on it.",
                "type": "string"
              },
              "authority": {
                "description": "The Exchange artifact's standard name — its short slug, optionally \".nomos\"-suffixed (e.g. \"eu-ai-act\" or \"eu-ai-act.nomos\"), or its raw artifact ID. Browse the catalog at https://www.nomosprotocol.com/exchange.",
                "type": "string"
              },
              "exchange_api_key": {
                "description": "Exchange API key (nxk_...). Optional for free/public queries. Required only for metered access to licensed (paid) authorities beyond their free allotment.",
                "type": "string"
              },
              "include_evaluation_trace": {
                "description": "Set true to receive the full rule-by-rule evaluation trace (every rule checked, every missing field) instead of the default curated summary. Most callers never need this.",
                "type": "boolean"
              },
              "inputs": {
                "description": "Key/value facts to evaluate against the authority's rules (e.g. {\"ai_categorises_biometric_data_for_sensitive_attributes\": true}). Fields must match the authority's vocabulary — see the atlas endpoint or the artifact's catalog page.",
                "type": "object"
              },
              "purpose": {
                "description": "Set \"test\" for test or evaluation queries: they are answered and sealed, but kept out of the authority's public history and counts. Defaults to production.",
                "enum": ["production", "test"],
                "type": "string"
              }
            },
            "required": ["authority", "inputs"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "expected_fields": {
                "description": "Present only when ESCALATED for lack of data — the fields this authority still needs",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "matched_rule_id": {
                "description": "ID of the rule that determined the verdict — null when AUTHORIZED with no matching rule",
                "type": ["string", "null"]
              },
              "matched_rule_name": {
                "description": "Human-readable name/description of the matched rule — use this for display, not matched_rule_id",
                "type": ["string", "null"]
              },
              "open_higher_priority_count": {
                "description": "0 means every relevant fact was known when this was sealed; >0 means facts were still missing above the matched rule",
                "type": "number"
              },
              "open_higher_priority_rules": {
                "description": "The actual rules behind open_higher_priority_count (capped to 20) — use this to answer \"which ones?\" instead of guessing. Each has the rule name, what it would do if it matched, and exactly which input fields are missing.",
                "items": {
                  "properties": {
                    "consequence": {
                      "enum": ["blocks", "requires_review", "permits"],
                      "type": "string"
                    },
                    "description": {
                      "type": "string"
                    },
                    "missing_fields": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "rule_id": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "query_id": {
                "description": "Permanent transcript ID — reopen any time at the returned url",
                "type": "string"
              },
              "response_source": {
                "description": "Provenance label — this is a sealed NOMOS verdict, not Claude's own reasoning. Preserve or restate this distinction when relaying the answer.",
                "type": "string"
              },
              "rules_evaluated": {
                "description": "Only present when include_evaluation_trace was true",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "rules_evaluated_count": {
                "description": "Total rules checked during evaluation — the size of the full trace, whether or not it was returned",
                "type": "number"
              },
              "source_reference": {
                "description": "Citation for the matched rule, when the source document's structure was captured at extraction time. Names where the rule TEXT was extracted from (e.g. \"Article 5\"), not a legal claim about what it covers. Null if unavailable.",
                "properties": {
                  "document": {
                    "type": "string"
                  },
                  "section": {
                    "type": "string"
                  }
                },
                "type": ["object", "null"]
              },
              "url": {
                "description": "Path to the permanent, shareable transcript for this query",
                "type": "string"
              },
              "verdict": {
                "description": "The authority's own verdict",
                "enum": ["AUTHORIZED", "DENIED", "ESCALATED"],
                "type": "string"
              },
              "verdict_description": {
                "description": "Human-readable reason — the exact rule and its consequence",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
