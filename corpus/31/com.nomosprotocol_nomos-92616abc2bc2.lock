        },
        {
          "name": "ask_by_context",
          "description": "Ask whether an action is allowed WITHOUT choosing the law yourself (NOMOS-SPEC-014). Describe where the act happens and who it involves; NOMOS works out from its signed registrar log which laws govern it, asks every one, and combines strictly: any deny denies, a yes needs every law. Prefer this over ask_authority whenever you do not already know which law applies: naming one law leaves out the others. Each law's own answer is a permanent, signed transcript (members[].query_id). If a fact that decides which law applies is missing, the answer is INSUFFICIENT_DATA with open_facts naming it: ask the user, never guess. A place the registrar does not cover is answered INSUFFICIENT_DATA, never as permission; say so plainly. Relay `coverage`: the registrar lists only its own laws, so other law may also apply.",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "Optional label for what is being done (e.g. \"share_customer_data_with_analytics_vendor\"), recorded on each transcript.",
                "type": "string"
              },
              "acts_for": {
                "description": "Optional organisation the agent acts for.",
                "type": "string"
              },
              "agent_id": {
                "description": "Optional stable name for the agent asking, recorded on each transcript.",
                "type": "string"
              },
              "context": {
                "description": "The facts that decide which law applies. Codes: EU (an EU member state), QA (Qatar), AE (the UAE outside free zones with their own data law), DIFC, ADGM, QFC, US, SA, and so on.",
                "properties": {
                  "established_in": {
                    "description": "Where the acting organisation is incorporated or established",
                    "type": "string"
                  },
                  "jurisdiction": {
                    "description": "Where the act takes effect",
                    "type": "string"
                  },
                  "output_used_in": {
                    "description": "Where any AI system output is used (the same as jurisdiction if no AI is involved)",
                    "type": "string"
                  },
                  "subjects_in": {
                    "description": "Where the people the act concerns are located or resident",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "exchange_api_key": {
                "description": "Exchange API key (nxk_...). Optional; needed only for licensed (paid) authorities.",
                "type": "string"
              },
              "inputs": {
                "description": "Facts about the action itself, evaluated by every law that applies (e.g. {\"processing_fair_and_transparent\": true}). A law that needs a fact you did not give holds the answer open and names it.",
                "type": "object"
              },
              "purpose": {
                "description": "Set \"test\" for test or evaluation queries: answered and sealed, but kept out of public history and counts.",
                "enum": ["production", "test"],
                "type": "string"
              }
            },
            "required": ["context"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "answered_under": {
                "description": "The laws the answer was computed under",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "authorized": {
                "description": "True only when every applicable law authorizes; never true over an empty set of laws",
                "type": "boolean"
              },
              "coverage": {
                "description": "What the answer covers; relay it to the user",
                "type": "string"
              },
              "deciding_authorities": {
                "description": "The laws that decided the verdict",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "escalations": {
                "description": "Each law that requires approval, with its escalation",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "members": {
                "description": "Each law's own answer, with its permanent transcript (query_id)",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "mode": {
                "description": "\"resolution\": the laws were worked out from the context, not chosen by the caller",
                "type": "string"
              },
              "open_facts": {
                "description": "Facts to supply when the answer is held open",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "reason": {
                "description": "Why, in words",
                "type": "string"
              },
              "resolution": {
                "description": "How the laws were resolved (status, applicable, missing, proof with the log head consulted)",
                "type": "object"
              },
              "verdict": {
                "description": "The strict combination of every applicable law's verdict",
                "enum": ["AUTHORIZED", "DENIED", "ESCALATED", "INSUFFICIENT_DATA", "CONFLICT"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:374f42ed26eb97ccfec2a6829a89345feee383fb093770a815a0a21f230d7bb2"
        },
        {
          "name": "detect_contradictions",
          "description": "Analyze policy documents (and optional behavioral decision logs) to detect contradictions, hidden rules, and gaps between declared policy and observed behavior. Stateless — no artifact is created and nothing is persisted. Returns contradictions of three types: rule_collision (two rules that apply to the same case with different decisions where the policy does not settle it soundly, each with that case and what the policy would do), ghost_term (an undefined standard such as \"reasonable\" in a rule's own text), and layer_divergence (a policy rule and a rule of practice that one case meets with different decisions); with behavioral logs, policy_gaps measured from the decisions.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "NOMOS API key (nmk_live_...).",
                "type": "string"
              },
              "behavioral_logs": {
                "description": "Optional historical decision records. Enables layer_divergence detection — surfaces behavioral patterns that deviate from written policy.",
                "items": {
                  "description": "One row of historical decision data.",
                  "type": "object"
                },
                "type": "array"
              },
              "documents": {
                "description": "Policy documents to analyze for contradictions.",
                "items": {
                  "properties": {
                    "content": {
                      "description": "Plain text content of the document.",
                      "type": "string"
                    },
                    "filename": {
                      "description": "Original filename (e.g. credit-policy.txt).",
                      "type": "string"
                    },
                    "source_type": {
                      "description": "Document type hint.",
                      "enum": ["policy", "email", "spreadsheet", "transcript"],
                      "type": "string"
                    }
                  },
                  "required": ["content", "filename"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["documents"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "contradictions": {
                "description": "List of detected contradictions",
                "items": {
                  "properties": {
                    "description": {
                      "description": "Human-readable description of the conflict",
                      "type": "string"
                    },
                    "rules": {
                      "description": "Conflicting rule texts",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "severity": {
                      "enum": ["high", "medium", "low"],
                      "type": "string"
                    },
                    "type": {
                      "description": "Contradiction type",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "hidden_rules": {
                "description": "Rules inferred from behavior not in written policy",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "summary": {
                "description": "Plain-language summary of findings",
                "type": "string"
              },
              "total_contradictions": {
                "description": "Total contradictions found",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7893e3f0196ae285d084451fc1f7dcc7707516816ec833daf5b22b75e87c88f6"
        },
        {
          "name": "find_authority",
          "description": "Find which published authorities on the NOMOS Exchange govern something you are about to do, from a plain description (e.g. \"deploy a recruitment model in the EU\"). No name needed. Returns the matching authorities ranked, and for each the facts it reads that match your description (what to pass to ask_authority as inputs) and its most relevant rules with where they come from in the source. Also returns authorities others have requested that are not listed yet. Matches by words and by meaning (a small multilingual model on the server, so questions in Arabic and other languages work); it only chooses what to ask, never a verdict. Call this before ask_authority when you do not know the authority's name.",
          "inputSchema": {
            "properties": {
              "description": {
                "description": "What you are about to do, in plain words.",
                "type": "string"
              },
              "jurisdiction": {
                "description": "Optional jurisdiction tag to restrict to, e.g. \"EU\" or \"AE\".",
                "type": "string"
              },
              "limit": {
                "description": "Maximum authorities to return (default 10).",
                "type": "number"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "matches": {
                "items": {
                  "properties": {
                    "facts": {
                      "description": "Input fields this authority reads that match the description.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "matched_by": {
                      "enum": ["words", "meaning", "both"],
                      "type": "string"
                    },
                    "matched_terms": {
                      "description": "Words of the description that matched. Empty when it matched by meaning alone (e.g. a question in Arabic).",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "name": {
                      "description": "Pass this as `authority` to ask_authority.",
                      "type": "string"
                    },
                    "rules": {
                      "items": {
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "score": {
                      "type": "number"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "next": {
                "type": "string"
              },
              "places": {
                "description": "Jurisdictions the description names (e.g. AE for Dubai). An authority that covers none of them is not returned.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "requested": {
                "description": "Requested, not yet listed.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "search": {
                "description": "How the search ran: method \"hybrid\" (meaning and words) or \"keyword\", and the model used for meaning.",
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:48e367c40a784ae83608b74fe46a900a8f3b434f35f1d2fdea688121acfade44"
        },
        {
          "name": "generate_governance",
          "description": "Convert one or more policy documents into a sealed NOMOS governance artifact (.nomos). Extracts executable rules using Claude, detects contradictions between rules, computes an Autonomy Readiness Index (ARI) score (0–1), and cryptographically seals the result. Returns an artifact_id you can use with verify_decision immediately. Optionally accepts historical behavioral decision logs to add a behavioral evidence layer and reach CERTIFIED confidence tier.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "NOMOS API key (nmk_live_...).",
                "type": "string"
              },
              "behavioral_logs": {
                "description": "Optional historical decision records (CSV rows as objects) for behavioral triangulation. Minimum 10 rows recommended.",
                "items": {
                  "description": "One row of historical decision data as a key/value object.",
                  "type": "object"
                },
                "type": "array"
              },
              "documents": {
                "description": "Policy documents to extract rules from. Each item must have filename and content (plain text).",
                "items": {
                  "properties": {
                    "content": {
                      "description": "Plain text content of the document.",
                      "type": "string"
                    },
                    "filename": {
                      "description": "Original filename including extension (e.g. \"credit-policy.pdf\"). Used for provenance tracking.",
                      "type": "string"
                    },
                    "source_type": {
                      "description": "Document type hint for extraction heuristics. Defaults to \"policy\".",
                      "enum": ["policy", "email", "spreadsheet", "transcript"],
                      "type": "string"
                    }
                  },
                  "required": ["content", "filename"],
                  "type": "object"
                },
                "type": "array"
              },
              "domain": {
                "description": "Industry or domain hint (e.g. \"lending\", \"hr\", \"e-commerce\", \"healthcare\", \"insurance\"). Improves extraction accuracy.",
                "type": "string"
              },
              "name": {
                "description": "Human-readable name for the governance artifact (e.g. \"Loan Approval Policy v2\", \"HR Leave Rules\").",
                "type": "string"
              },
              "organization": {
                "description": "Name of the organization this artifact governs (e.g. \"Acme Bank\", \"HealthCorp\").",
                "type": "string"
              }
            },
            "required": ["documents", "name", "organization"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "ari_score": {
                "description": "Autonomy Readiness Index 0–1 (≥0.60 autonomous, ≥0.30 bounded, <0.30 human-governed)",
                "type": "number"
              },
              "artifact_id": {
                "description": "Unique ID for the sealed artifact — use this with verify_decision",
                "type": "string"
              },
              "autonomy_band": {
                "description": "Recommended deployment mode",
                "enum": ["autonomous", "bounded", "human_governed"],
                "type": "string"
              },
              "confidence_tier": {
                "description": "Artifact confidence tier",
                "enum": ["DECLARED", "VALIDATED", "CERTIFIED"],
                "type": "string"
              },
              "contradictions": {
                "description": "Number of contradictions detected",
                "type": "number"
              },
              "rules_extracted": {
                "description": "Number of executable rules extracted",
                "type": "number"
              },
              "seal_hash": {
                "description": "SHA-256 cryptographic seal of the artifact",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:67eec37a20cf106cbc11163470996d50bcf7a291de5b1e343872ad98f2e25887"
        },
