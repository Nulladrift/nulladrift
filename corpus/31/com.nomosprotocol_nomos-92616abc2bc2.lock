      "tools": [
        {
          "name": "ask_authority",
          "description": "Query a published authority on the NOMOS Exchange marketplace — a different system from verify_decision's own sealed policies. Every public authority (e.g. eu-ai-act.nomos) is queryable with no key. Returns the authority's own verdict (AUTHORIZED/DENIED/ESCALATED), the exact rule and reason, and a permanent, cryptographically-bound transcript (query_id + url) — replayable evidence, not just a reply. Nothing is invented or paraphrased: the verdict is the authority's sealed rules evaluated against your inputs. The default response is a short, curated summary (verdict, matched rule, source citation when the artifact has one, transparency/completeness disclosures, transcript link) — not the full rule-by-rule evaluation trace. Set include_evaluation_trace: true to get that complete diagnostic record when you or the user actually need it.",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "Optional label for what this query represents, for the caller's own transcript record (e.g. \"pre-deployment check\"). Purely descriptive — does not affect the verdict.",
                "type": "string"
              },
              "acts_for": {
                "description": "Optional organisation the agent acts for. Recorded as declared; when an Exchange key is used, the key's account is recorded instead.",
                "type": "string"
              },
              "agent_id": {
                "description": "Optional stable name for the agent asking (e.g. \"acme-credit-agent\"). Recorded on the transcript and shown in the authority's public history as who relies on it.",
                "type": "string"
              },
              "authority": {
                "description": "The Exchange artifact's standard name — its short slug, optionally \".nomos\"-suffixed (e.g. \"eu-ai-act\" or \"eu-ai-act.nomos\"), or its raw artifact ID. Browse the catalog at https://www.nomosprotocol.com/exchange.",
                "type": "string"
              },
              "exchange_api_key": {
                "description": "Exchange API key (nxk_...). Optional for free/public queries. Required only for metered access to licensed (paid) authorities beyond their free allotment.",
                "type": "string"
              },
              "include_evaluation_trace": {
                "description": "Set true to receive the full rule-by-rule evaluation trace (every rule checked, every missing field) instead of the default curated summary. Most callers never need this.",
                "type": "boolean"
              },
              "inputs": {
                "description": "Key/value facts to evaluate against the authority's rules (e.g. {\"ai_categorises_biometric_data_for_sensitive_attributes\": true}). Fields must match the authority's vocabulary — see the atlas endpoint or the artifact's catalog page.",
                "type": "object"
              },
              "purpose": {
                "description": "Set \"test\" for test or evaluation queries: they are answered and sealed, but kept out of the authority's public history and counts. Defaults to production.",
                "enum": ["production", "test"],
                "type": "string"
              }
            },
            "required": ["authority", "inputs"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "expected_fields": {
                "description": "Present only when ESCALATED for lack of data — the fields this authority still needs",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "matched_rule_id": {
                "description": "ID of the rule that determined the verdict — null when AUTHORIZED with no matching rule",
                "type": ["string", "null"]
              },
              "matched_rule_name": {
                "description": "Human-readable name/description of the matched rule — use this for display, not matched_rule_id",
                "type": ["string", "null"]
              },
              "open_higher_priority_count": {
                "description": "0 means every relevant fact was known when this was sealed; >0 means facts were still missing above the matched rule",
                "type": "number"
              },
              "open_higher_priority_rules": {
                "description": "The actual rules behind open_higher_priority_count (capped to 20) — use this to answer \"which ones?\" instead of guessing. Each has the rule name, what it would do if it matched, and exactly which input fields are missing.",
                "items": {
                  "properties": {
                    "consequence": {
                      "enum": ["blocks", "requires_review", "permits"],
                      "type": "string"
                    },
                    "description": {
                      "type": "string"
                    },
                    "missing_fields": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "rule_id": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "query_id": {
                "description": "Permanent transcript ID — reopen any time at the returned url",
                "type": "string"
              },
              "response_source": {
                "description": "Provenance label — this is a sealed NOMOS verdict, not Claude's own reasoning. Preserve or restate this distinction when relaying the answer.",
                "type": "string"
              },
              "rules_evaluated": {
                "description": "Only present when include_evaluation_trace was true",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "rules_evaluated_count": {
                "description": "Total rules checked during evaluation — the size of the full trace, whether or not it was returned",
                "type": "number"
              },
              "source_reference": {
                "description": "Citation for the matched rule, when the source document's structure was captured at extraction time. Names where the rule TEXT was extracted from (e.g. \"Article 5\"), not a legal claim about what it covers. Null if unavailable.",
                "properties": {
                  "document": {
                    "type": "string"
                  },
                  "section": {
                    "type": "string"
                  }
                },
                "type": ["object", "null"]
              },
              "url": {
                "description": "Path to the permanent, shareable transcript for this query",
                "type": "string"
              },
              "verdict": {
                "description": "The authority's own verdict",
                "enum": ["AUTHORIZED", "DENIED", "ESCALATED"],
                "type": "string"
              },
              "verdict_description": {
                "description": "Human-readable reason — the exact rule and its consequence",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:7b7f175797a59d19db61a0d4675e9e4e2e14fd5b4caf45b5e31cafa2ea353030"
        },
        {
          "name": "detect_contradictions",
          "description": "Analyze policy documents (and optional behavioral decision logs) to detect contradictions, hidden rules, and gaps between declared policy and observed behavior. Stateless — no artifact is created and nothing is persisted. Returns contradiction types: threshold_conflicts (numeric rule overlaps), ghost_terms (undefined terms used in rules), role_conflicts (same action allowed by one role, denied by another), rule_collisions (direct logical conflicts), and layer_divergences (policy says X but behavioral data shows Y).",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "NOMOS API key (nmk_live_...).",
                "type": "string"
              },
              "behavioral_logs": {
                "description": "Optional historical decision records. Enables layer_divergence detection — surfaces behavioral patterns that deviate from written policy.",
                "items": {
                  "description": "One row of historical decision data.",
                  "type": "object"
                },
                "type": "array"
              },
              "documents": {
                "description": "Policy documents to analyze for contradictions.",
                "items": {
                  "properties": {
                    "content": {
                      "description": "Plain text content of the document.",
                      "type": "string"
                    },
                    "filename": {
                      "description": "Original filename (e.g. credit-policy.txt).",
                      "type": "string"
                    },
                    "source_type": {
                      "description": "Document type hint.",
                      "enum": ["policy", "email", "spreadsheet", "transcript"],
                      "type": "string"
                    }
                  },
                  "required": ["content", "filename"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["documents"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "contradictions": {
                "description": "List of detected contradictions",
                "items": {
                  "properties": {
                    "description": {
                      "description": "Human-readable description of the conflict",
                      "type": "string"
                    },
                    "rules": {
                      "description": "Conflicting rule texts",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "severity": {
                      "enum": ["high", "medium", "low"],
                      "type": "string"
                    },
                    "type": {
                      "description": "Contradiction type",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "hidden_rules": {
                "description": "Rules inferred from behavior not in written policy",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "summary": {
                "description": "Plain-language summary of findings",
                "type": "string"
              },
              "total_contradictions": {
                "description": "Total contradictions found",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:673aa74632727f3756786818c54a572579a707d53fc1f4b655b1dfc0436f5030"
        },
        {
          "name": "find_authority",
          "description": "Find which published authorities on the NOMOS Exchange govern something you are about to do, from a plain description (e.g. \"deploy a recruitment model in the EU\"). No name needed. Returns the matching authorities ranked, and for each the facts it reads that match your description (what to pass to ask_authority as inputs) and its most relevant rules with where they come from in the source. Also returns authorities others have requested that are not listed yet. Matches by words and by meaning (a small multilingual model on the server, so questions in Arabic and other languages work); it only chooses what to ask, never a verdict. Call this before ask_authority when you do not know the authority's name.",
          "inputSchema": {
            "properties": {
              "description": {
                "description": "What you are about to do, in plain words.",
                "type": "string"
              },
              "jurisdiction": {
                "description": "Optional jurisdiction tag to restrict to, e.g. \"EU\" or \"AE\".",
                "type": "string"
              },
              "limit": {
                "description": "Maximum authorities to return (default 10).",
                "type": "number"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "matches": {
                "items": {
                  "properties": {
                    "facts": {
                      "description": "Input fields this authority reads that match the description.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "matched_by": {
                      "enum": ["words", "meaning", "both"],
                      "type": "string"
                    },
                    "matched_terms": {
                      "description": "Words of the description that matched. Empty when it matched by meaning alone (e.g. a question in Arabic).",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "name": {
                      "description": "Pass this as `authority` to ask_authority.",
                      "type": "string"
                    },
                    "rules": {
                      "items": {
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "score": {
                      "type": "number"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "next": {
                "type": "string"
              },
              "places": {
                "description": "Jurisdictions the description names (e.g. AE for Dubai). An authority that covers none of them is not returned.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "requested": {
                "description": "Requested, not yet listed.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "search": {
                "description": "How the search ran: method \"hybrid\" (meaning and words) or \"keyword\", and the model used for meaning.",
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:48e367c40a784ae83608b74fe46a900a8f3b434f35f1d2fdea688121acfade44"
        },
        {
          "name": "generate_governance",
          "description": "Convert one or more policy documents into a sealed NOMOS governance artifact (.nomos). Extracts executable rules using Claude, detects contradictions between rules, computes an Autonomy Readiness Index (ARI) score (0–1), and cryptographically seals the result. Returns an artifact_id you can use with verify_decision immediately. Optionally accepts historical behavioral decision logs to add a behavioral evidence layer and reach CERTIFIED confidence tier.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "NOMOS API key (nmk_live_...).",
                "type": "string"
              },
              "behavioral_logs": {
                "description": "Optional historical decision records (CSV rows as objects) for behavioral triangulation. Minimum 10 rows recommended.",
                "items": {
                  "description": "One row of historical decision data as a key/value object.",
                  "type": "object"
                },
                "type": "array"
              },
              "documents": {
                "description": "Policy documents to extract rules from. Each item must have filename and content (plain text).",
                "items": {
                  "properties": {
                    "content": {
                      "description": "Plain text content of the document.",
                      "type": "string"
                    },
                    "filename": {
                      "description": "Original filename including extension (e.g. \"credit-policy.pdf\"). Used for provenance tracking.",
                      "type": "string"
                    },
                    "source_type": {
                      "description": "Document type hint for extraction heuristics. Defaults to \"policy\".",
                      "enum": ["policy", "email", "spreadsheet", "transcript"],
                      "type": "string"
                    }
                  },
                  "required": ["content", "filename"],
                  "type": "object"
                },
                "type": "array"
              },
              "domain": {
                "description": "Industry or domain hint (e.g. \"lending\", \"hr\", \"e-commerce\", \"healthcare\", \"insurance\"). Improves extraction accuracy.",
                "type": "string"
              },
              "name": {
                "description": "Human-readable name for the governance artifact (e.g. \"Loan Approval Policy v2\", \"HR Leave Rules\").",
                "type": "string"
              },
              "organization": {
                "description": "Name of the organization this artifact governs (e.g. \"Acme Bank\", \"HealthCorp\").",
                "type": "string"
              }
            },
            "required": ["documents", "name", "organization"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "ari_score": {
                "description": "Autonomy Readiness Index 0–1 (≥0.60 autonomous, ≥0.30 bounded, <0.30 human-governed)",
                "type": "number"
              },
              "artifact_id": {
                "description": "Unique ID for the sealed artifact — use this with verify_decision",
                "type": "string"
              },
              "autonomy_band": {
                "description": "Recommended deployment mode",
                "enum": ["autonomous", "bounded", "human_governed"],
                "type": "string"
              },
              "confidence_tier": {
                "description": "Artifact confidence tier",
                "enum": ["DECLARED", "VALIDATED", "CERTIFIED"],
                "type": "string"
              },
              "contradictions": {
                "description": "Number of contradictions detected",
                "type": "number"
              },
              "rules_extracted": {
                "description": "Number of executable rules extracted",
                "type": "number"
              },
              "seal_hash": {
                "description": "SHA-256 cryptographic seal of the artifact",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:67eec37a20cf106cbc11163470996d50bcf7a291de5b1e343872ad98f2e25887"
        },
        {
          "name": "request_authority",
          "description": "Ask for an authority (a law, regulation, standard or policy) to be added to the NOMOS Exchange when find_authority finds nothing. Requests are public and ranked by how many asked; they decide what is compiled next. Repeated requests from one caller count once. This never creates an authority: only its issuer, or NOMOS compiling the public text, can.",
          "inputSchema": {
            "properties": {
              "jurisdiction": {
                "description": "Optional jurisdiction, e.g. \"AE\".",
                "type": "string"
              },
              "source_url": {
                "description": "Optional link to the official text.",
                "type": "string"
              },
              "title": {
                "description": "The authority by its usual name, e.g. \"UAE Personal Data Protection Law (Federal Decree-Law 45/2021)\".",
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "counted": {
                "type": "boolean"
              },
              "id": {
                "type": "number"
              },
              "note": {
                "type": "string"
              },
              "requests": {
                "type": "number"
              },
              "status": {
                "type": "string"
              },
              "title": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:5291ddfcf531ca9ddc04dfa2a26b34b4e1ea27aedbfd61d07e2cb550aca571db"
        },
        {
          "name": "verify_decision",
          "description": "Check whether an AI decision is allowed, denied, or needs escalation according to a sealed NOMOS governance artifact. Always returns `allowed` (boolean) — that field is safe to read regardless of which artifact type answered. The rest of the shape genuinely differs by artifact type, because it proxies two different underlying endpoints: pub_ demo artifacts return a flat shape (`outcome`: auto_approved/auto_rejected/escalated, `rule_applied`, `rule_reference`, flat `confidence` and `audit_hash`); your own sealed artifacts from Studio return a nested shape (`verdict`: approved/rejected/escalated, a nested `rule` object, and nested `confidence`/`audit`/`performance` objects). See outputSchema for both exact shapes — do not assume one without checking which kind of artifact_id was passed. Use artifact IDs starting with pub_ for public demo artifacts that require no API key: pub_lending_v1 (loan approval), pub_refund_v1 (refund policy), pub_fraud_v1 (fraud detection), pub_hr_leave_v1 (HR leave approval), pub_kyc_v1 (KYC/identity).",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "NOMOS API key (nmk_live_...). Not required for pub_ artifacts.",
                "type": "string"
              },
              "artifact_id": {
                "description": "Sealed artifact ID to evaluate against. Use pub_lending_v1, pub_refund_v1, pub_fraud_v1, pub_hr_leave_v1, or pub_kyc_v1 for public demos. Use your own artifact ID from Studio for custom governance.",
                "type": "string"
              },
              "decision": {
                "description": "The action or decision being checked, as a verb phrase (e.g. \"approve_loan\", \"process_refund\", \"approve_leave\"). Should match an action defined in the artifact.",
                "type": "string"
              },
              "domain_id": {
                "description": "Your NOMOS domain ID. Required for custom artifacts created in Studio. Not needed for pub_ artifacts.",
                "type": "number"
              },
              "inputs": {
                "description": "Key/value input fields for rule evaluation (e.g. {\"amount\": 5000, \"credit_score\": 720}). Fields must match the artifact's declared data contract.",
                "type": "object"
              }
            },
            "required": ["artifact_id", "decision", "inputs"],
            "type": "object"
          },
          "outputSchema": {
            "anyOf": [
              {
                "description": "Shape returned for pub_ demo artifacts (via /api/v1/verify).",
                "properties": {
                  "allowed": {
                    "type": "boolean"
                  },
                  "artifact_id": {
                    "type": "string"
                  },
                  "artifact_name": {
                    "type": "string"
                  },
                  "audit_hash": {
                    "type": "string"
                  },
                  "audit_record": {
                    "type": "string"
                  },
                  "confidence": {
                    "description": "Flat 0–1 score for this shape",
                    "type": "number"
                  },
                  "latency_ms": {
                    "type": "number"
                  },
                  "outcome": {
                    "enum": ["auto_approved", "auto_rejected", "escalated"],
                    "type": "string"
                  },
                  "rule_applied": {
                    "type": "string"
                  },
                  "rule_description": {
                    "type": ["string", "null"]
                  },
                  "rule_id": {
                    "type": "string"
                  },
                  "rule_reference": {
                    "type": "string"
                  },
                  "verdict_description": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              {
                "description": "Shape returned for your own sealed artifacts from Studio (via /api/v1/verify-decision).",
                "properties": {
                  "allowed": {
                    "type": "boolean"
                  },
                  "artifact_id": {
                    "type": "string"
                  },
                  "artifact_name": {
                    "type": "string"
                  },
                  "audit": {
                    "properties": {
                      "hash": {
                        "type": "string"
                      },
                      "timestamp": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "confidence": {
                    "description": "Nested for this shape, not a flat number.",
                    "properties": {
                      "description": {
                        "type": "string"
                      },
                      "score": {
                        "type": "number"
                      },
                      "tier": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "performance": {
                    "properties": {
                      "latency_ms": {
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "rule": {
                    "description": "Present only when a rule matched.",
                    "properties": {
                      "action": {
                        "type": "string"
                      },
                      "description": {
                        "type": ["string", "null"]
                      },
                      "id": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "verdict": {
                    "enum": ["approved", "rejected", "escalated"],
                    "type": "string"
                  },
                  "verdict_description": {
                    "type": "string"
                  }
                },
                "type": "object"
              }
            ],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:edd4a11fcdb047fcd59d5db3cc7c17074cf1c037944cfc23ee6d4b11c3cdad75"
        }
      ],
