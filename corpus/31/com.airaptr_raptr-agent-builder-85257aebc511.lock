{
  "lockfileVersion": 2,
  "subjects": {
    "com.airaptr/raptr-agent-builder": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.airaptr.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "agent-builder",
        "version": "1.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Build single-file AI agents people can use immediately: get_agent_template, write the agent, check_agent until it passes, then use_agent_here to run it in this chat on the user's own data. Always give the user the complete agent file after check_agent passes. Nothing to install. Use find_agents to reuse existing ones. how_to_run_agent is only for keeping an agent on their own computer later. share_agent only when the user asks to share. rejection_rescue_preview explains an App Store rejection message (free).",
      "tools": [
        {
          "name": "check_agent",
          "title": "Check an agent file",
          "description": "Checks a finished agent file against the template rules (manifest, naming, class, perform method, no hardcoded secrets). Call it on every agent you write, fix anything it reports, and call it again until it passes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "The full Python source of the agent file",
                "type": "string"
              },
              "filename": {
                "description": "File name, must end with _agent.py, e.g. invoice_triage_agent.py",
                "type": "string"
              }
            },
            "required": ["code", "filename"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c2a47eb68e2af0456892332243e5de465b593ccfe8df2e1eae02e81f34dcadc7"
        },
        {
          "name": "find_agents",
          "title": "Find existing agents",
          "description": "Searches the open agent registry (about 1,700 single-file agents) for agents that already do what the user wants, for example when they ask 'is there an AI tool for...' or want a ready-made automation instead of building one. Use it before building from scratch, or when the user asks whether an agent exists for a task.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many results, default 5",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Plain words describing the task, e.g. 'summarize sales calls'",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1d5e290e9157766f1da1f7c7863aef1c3a05cc5b3c4bde16b5276e6403cbb40c"
        },
        {
          "name": "get_agent_code",
          "title": "Get an agent's code",
          "description": "Returns the full source of one agent from the registry, by its name (e.g. @bill/neuron_agent), so it can be read or adapted.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "Registry name, e.g. @kody/memory_agent",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8f9267fe7b5f435a98a7c5b8069595b77f70b58c0b2fbd0bd6dc461d379f9e02"
        },
        {
          "name": "get_agent_template",
          "title": "Get the agent template",
          "description": "Use this when the user wants to build an AI agent, assistant, bot or automation from an idea, a repetitive task, a process description, or a meeting transcript (for example: automate invoices, triage support tickets, summarize meetings, follow up with leads). Returns the official single-file agent template and its rules. Fill it in yourself from what the user described, then call check_agent on the finished file before showing it to the user. Then call use_agent_here so the user can use it right away in this chat.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:177e9226feda7d8aa14e2fa4188c9649625505a28c512a0d69e95ca05b1f5c75"
        },
        {
          "name": "how_to_run_agent",
          "title": "Keep an agent running on your computer",
          "description": "Optional, for later: how to keep an agent running on the user's own computer with the free Brainstem. Only offer this after the user has used the agent in the chat and wants to keep it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filename": {
                "description": "The agent file name, if known",
                "type": "string"
              },
              "os": {
                "description": "The user's operating system",
                "enum": ["mac", "windows", "linux"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fde8ee112fde5c58bed4c10609489352bbc5b8eba7947915060d11f87c787e5e"
        },
        {
          "name": "rejection_rescue_preview",
          "title": "Explain an App Store rejection",
          "description": "Use when the user pastes a rejection message from Apple App Review (it cites guidelines such as \"Guideline 5.1.1(i)\"). Free. Returns each cited guideline section it recognizes, with its title and what Apple means by it, and lists sections it does not know. The full version (likely causes, a fix list and a reply draft to App Review) is a separate paid HTTP call; the result says its price and route.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "text": {
                "description": "Apple's rejection message, as received (up to 20 KB)",
                "maxLength": 20480,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:946a5e7e5a955d33ee707c67c4808ecb2f5888f8fa5f867dd8672b45212cd054"
        },
        {
          "name": "request_service",
          "title": "Ask us to build something",
          "description": "Use when the person wants something none of these tools can do and says yes to passing the request on. Records only the request text they agree to send (no name or contact). Ask before calling it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "description": "What they want, in a sentence, as they agreed to send it",
                "type": "string"
              }
            },
            "required": ["request"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:a38ff77e8ec3cc7544d83683bb90d1918c09a320529b8c63330eb558dcd6db15"
        },
        {
          "name": "share_agent",
          "title": "Share an agent with everyone",
          "description": "Use only when the user says they want to share an agent they built. Checks the agent and scans it for personal details (emails, phone numbers, secrets), then explains how to publish it to the free open agent registry under their own GitHub account. Nothing is published by this tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "The full Python source of the agent",
                "type": "string"
              },
              "filename": {
                "description": "Agent file name, ending in _agent.py",
                "type": "string"
              }
            },
            "required": ["code", "filename"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3a04ea81fbf82c5d447b5bb8a8a327c26146d89966a32da64a631fe4348b68aa"
        },
        {
          "name": "use_agent_here",
          "title": "Use the agent in this chat",
          "description": "Use this right after an agent passes check_agent, or whenever the user wants to try an agent. Returns a short Python runner so you can run the agent in this chat with your own Python tool on the user's own data (pasted text, an uploaded spreadsheet, a list). Nothing to install. If Python is unavailable, apply the agent's logic yourself by reading its code. Ask the user for their real data, run the agent, and show the result in plain words.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filename": {
                "description": "The agent file name, e.g. invoice_triage_agent.py",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d8720380671f5fd7b3f2c7a3213752782d6a7f8a280f32193acaa459a238c44d"
        }
      ],
      "digest": "sha256:83539244da47b5632b50e6d38e32f4492559b1f14ef8d65bd84f21b610668563"
    }
  }
}
