{
  "lockfileVersion": 2,
  "subjects": {
    "com.eoslog/free-tools": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://eoslog.com/mcp/free"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "EosLog Free Tools",
        "title": "EosLog Free Tools for Service Businesses",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "EosLog Free Tools make quotes and invoices and answer pricing and compliance questions for small US\nservice businesses with EosLog's own sourced data. No account or sign-in is needed.\n- estimate_house_cleaning_price prices a residential cleaning with the same math as EosLog's free\n  cleaning price calculator. Prices are estimates: tell the user they can change any input (hourly\n  rate, square footage, market, add-ons) in the linked calculator.\n- create_quote_pdf and create_invoice_pdf make a PDF from the business name, customer and line items\n  the user gives, and save it behind an unguessable link for 90 days. Use the user's own prices; if a price\n  is missing, ask for it rather than guessing. Anyone with the link can open the document.\n- cleaning_sales_tax_by_state says whether home and commercial cleaning are taxable in a state, as\n  that state's own official pages say, with the date the sources were checked. It is not tax advice\n  and does not cover local taxes; say so.\n- gas_leaf_blower_rules lists adopted local gas leaf blower bans and limits with effective dates and\n  official sources. No row does not prove there is no rule.\n- find_free_tool returns the right free EosLog quote or invoice generator, price calculator or\n  contract template.\nEvery successful result includes an https://eoslog.com link. Include the link so the user can open the\ndocument or the free tool.\n",
      "tools": [
        {
          "name": "cleaning_sales_tax_by_state",
          "title": "Check if cleaning is taxable in a state",
          "description": "Says whether state sales tax (or the state's equivalent) applies to home (residential) and commercial cleaning services in one US state or DC, from EosLog's state by state reference. Each answer is what that state's own official pages say, with the official source links, the state base rate where the source states one, and the date it was checked. It is not tax advice and does not cover local taxes.",
          "inputSchema": {
            "properties": {
              "audience": {
                "default": "both",
                "description": "home for residential cleaning, commercial for offices and other businesses, or both.",
                "enum": ["home", "commercial", "both"],
                "type": "string"
              },
              "state": {
                "description": "Two-letter code (TX) or full name (Texas). DC is included.",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check if cleaning is taxable in a state"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:02c9ae3f8f41ab072b4801f2f8a33a43e4ceb8efc5e23c43ba29569bba3fcfa4"
        },
        {
          "name": "create_invoice_pdf",
          "title": "Create an invoice PDF",
          "description": "Makes a professional invoice PDF for a small service business from the details the user gives: the business name, the customer, and each line item's name, quantity and price, plus an optional tax rate, discount, payment terms, service date, invoice number and note. EosLog adds up the subtotal, discount, tax and total due, sets the due date from the payment terms, saves the invoice behind an unguessable link for 90 days, and returns that link (view, download or email the PDF) and a direct PDF link. Use it when the user wants an invoice to send a customer. It uses the user's prices and never sets them.",
          "inputSchema": {
            "properties": {
              "business_email": {
                "description": "Business email to print on it.",
                "maxLength": 120,
                "type": "string"
              },
              "business_name": {
                "description": "The business sending the document, as it should print at the top.",
                "maxLength": 100,
                "type": "string"
              },
              "business_phone": {
                "description": "Business phone to print on it.",
                "maxLength": 30,
                "type": "string"
              },
              "customer_name": {
                "description": "Who the document is for, a person or a company. Printed as Customer when left out.",
                "maxLength": 100,
                "type": "string"
              },
              "discount_percent": {
                "description": "Optional discount, as a percent off the subtotal.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "invoice_number": {
                "description": "Optional invoice number. One based on the date and time is used when left out.",
                "maxLength": 40,
                "type": "string"
              },
              "line_items": {
                "description": "One row per service or item, with the prices the user gives.",
                "items": {
                  "properties": {
                    "description": {
                      "description": "Optional detail under the name.",
                      "maxLength": 500,
                      "type": "string"
                    },
                    "name": {
                      "description": "What the line is for.",
                      "maxLength": 120,
                      "type": "string"
                    },
                    "quantity": {
                      "default": 1,
                      "description": "Units, hours or visits.",
                      "maximum": 10000,
                      "minimum": 0.01,
                      "type": "number"
                    },
                    "unit_price": {
                      "description": "Price per unit in US dollars.",
                      "maximum": 1000000,
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["name", "unit_price"],
                  "type": "object"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "notes": {
                "description": "Optional note, such as how to pay.",
                "maxLength": 1000,
                "type": "string"
              },
              "payment_terms": {
                "default": "upon_receipt",
                "description": "When payment is due: on receipt, or 15, 30 or 45 days after the invoice date.",
                "enum": ["upon_receipt", "net_15", "net_30", "net_45"],
                "type": "string"
              },
              "service_date": {
                "description": "Optional date or period of the work, as text, for example October 2026 or 10/1 to 10/15.",
                "maxLength": 60,
                "type": "string"
              },
              "tax_rate": {
                "default": 0,
                "description": "Sales tax percent on the subtotal after any discount, for example 8.25. The user supplies it.",
                "maximum": 25,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["business_name", "line_items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create an invoice PDF"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:16b73ce81803515abc53fd3a7ee5966eb33acb879e7d68a9a1fac59f01dfa8bf"
        },
        {
          "name": "create_quote_pdf",
          "title": "Create a quote PDF",
          "description": "Makes a professional quote (estimate) PDF for a small service business from the details the user gives: the business name, the customer, and each line item's name, quantity and price, plus an optional tax rate, discount, deposit, note and how many days the quote stays valid. EosLog adds up the subtotal, discount, tax and total, saves the quote behind an unguessable link for 90 days, and returns that link (view, download or email the PDF) and a direct PDF link. Use it when the user wants a quote or estimate to send a customer. It uses the user's prices and never sets them.",
          "inputSchema": {
            "properties": {
              "business_email": {
                "description": "Business email to print on it.",
                "maxLength": 120,
                "type": "string"
              },
              "business_name": {
                "description": "The business sending the document, as it should print at the top.",
                "maxLength": 100,
                "type": "string"
              },
              "business_phone": {
                "description": "Business phone to print on it.",
                "maxLength": 30,
                "type": "string"
              },
              "customer_name": {
                "description": "Who the document is for, a person or a company. Printed as Customer when left out.",
                "maxLength": 100,
                "type": "string"
              },
              "deposit_percent": {
                "description": "Optional deposit to schedule the job, as a percent of the total.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "discount_percent": {
                "description": "Optional discount, as a percent off the subtotal.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "line_items": {
                "description": "One row per service or item, with the prices the user gives.",
                "items": {
                  "properties": {
                    "description": {
                      "description": "Optional detail under the name.",
                      "maxLength": 500,
                      "type": "string"
                    },
                    "name": {
                      "description": "What the line is for.",
                      "maxLength": 120,
                      "type": "string"
                    },
                    "quantity": {
                      "default": 1,
                      "description": "Units, hours or visits.",
                      "maximum": 10000,
                      "minimum": 0.01,
                      "type": "number"
                    },
                    "unit_price": {
                      "description": "Price per unit in US dollars.",
                      "maximum": 1000000,
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["name", "unit_price"],
                  "type": "object"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "message": {
                "description": "Optional note to the customer.",
                "maxLength": 1000,
                "type": "string"
              },
              "tax_rate": {
                "default": 0,
                "description": "Sales tax percent on the subtotal after any discount, for example 8.25. The user supplies it.",
                "maximum": 25,
                "minimum": 0,
                "type": "number"
              },
              "title": {
                "description": "Optional subject line, for example Biweekly house cleaning.",
                "maxLength": 150,
                "type": "string"
              },
              "valid_days": {
                "default": 30,
                "description": "How many days the quote stays valid.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["business_name", "line_items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a quote PDF"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:80efa237af030cc375a5b242b38084df25a071eb858489447405963f4975fbc6"
        },
        {
          "name": "estimate_house_cleaning_price",
          "title": "Estimate a house cleaning price",
          "description": "Prices one residential house cleaning visit with the math behind EosLog's free cleaning price calculator: time on site from the home's size and square footage, times a frequency factor and the cleaner's hourly rate, plus supplies, drive and add-ons, adjusted for the local market and rounded to $5. Returns the price, a low to high range, hours on site, a per square foot cross-check, the math, and a link that opens the calculator with these inputs so the user can adjust them. Every input is optional and has the calculator's default.",
          "inputSchema": {
            "properties": {
              "addons": {
                "description": "Extras that apply: pets (+$15), kids under 10 (+$20), oven inside (+$35), fridge inside (+$30), trash takeout (+$10), laundry, one load washed and folded (+$20).",
                "items": {
                  "enum": ["pets", "kids", "oven", "fridge", "trash", "laundry"],
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array",
                "uniqueItems": true
              },
              "frequency": {
                "default": "biweekly",
                "description": "How often the home is cleaned. deep is a first or one-time deep clean; moveout is a one-time move-out clean.",
                "enum": ["weekly", "biweekly", "monthly", "deep", "moveout"],
                "type": "string"
              },
              "hourly_rate": {
                "default": 40,
                "description": "What the cleaner bills per cleaner-hour, in US dollars.",
                "maximum": 120,
                "minimum": 20,
                "type": "integer"
              },
              "market": {
                "default": "standard",
                "description": "rural (0.80x), standard for most US metros (1.00x), or coastal for a high-cost coastal metro (1.30x).",
                "enum": ["rural", "standard", "coastal"],
                "type": "string"
              },
              "size": {
                "default": "2br1ba",
                "description": "Bedrooms and bathrooms, for example 3br2ba for 3 bedrooms and 2 bathrooms.",
                "enum": ["1br1ba", "2br1ba", "2br2ba", "3br2ba", "4br2ba", "4br3ba", "5br3ba", "5br4ba", "6br4ba", "6br5ba", "7br5ba"],
                "type": "string"
              },
              "sqft": {
                "description": "Square footage. Defaults to the typical size for the layout (1,600 for 3br2ba).",
                "maximum": 10000,
                "minimum": 300,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate a house cleaning price"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ecbff78d751e4ab60613b5e0eb039bf492e55bb5e753faea18e0c83c68e6b15c"
        },
        {
          "name": "find_free_tool",
          "title": "Find a free EosLog tool",
          "description": "Finds the free EosLog tool for a service business task: a quote or invoice generator (with a page for the trade where one exists), a price calculator for house, move-out, deep, commercial or Airbnb cleaning, pressure washing or landscaping (with the URL params that prefill it), or contract and form templates, filtered by trade when given. Returns titles and https://eoslog.com URLs. Every tool is free and needs no account.",
          "inputSchema": {
            "properties": {
              "need": {
                "description": "What the user is trying to do.",
                "enum": ["quote", "invoice", "house_cleaning_price", "move_out_cleaning_price", "deep_cleaning_price", "commercial_cleaning_bid", "airbnb_cleaning_price", "pressure_washing_price", "landscaping_price", "contract_or_form_template"],
                "type": "string"
              },
              "trade": {
                "description": "Optional trade, used to pick trade pages and templates.",
                "enum": ["hvac", "plumbing", "electrical", "landscaping", "cleaning", "pest_control", "handyman", "property_management", "pressure_washing"],
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a free EosLog tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d28ee9e0c71282fd98e198c04e35addf6cd0002c8c96989f59d460f3e9280d52"
        },
        {
          "name": "gas_leaf_blower_rules",
          "title": "Look up gas leaf blower rules",
          "description": "Lists adopted local laws that ban or restrict gas leaf blowers in one US state, or one city or town in it, from EosLog's sourced table: the rule, when it took or takes effect and any later phases, who is cited, the penalty, and the official sources with the date each row was checked. Also reports a state law that blocks local bans (Florida, Georgia, Texas, Iowa, and Indiana). Without a city it lists every place in the state briefly; pass city for the full row. A place with no row may still have a rule EosLog has not confirmed.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "Optional city, town, village or county name, for example Los Angeles.",
                "maxLength": 100,
                "type": "string"
              },
              "state": {
                "description": "Two-letter code (CA) or full name (California). DC is included.",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up gas leaf blower rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:348aa00688997b8fd8699d60468375c9442ea11de2677b5c3649b5064f619789"
        }
      ],
      "digest": "sha256:4fb8fa0c22a2789814e48e867749be1fb5009bd9a6dda6733bd88dd7ae8b0184"
    }
  }
