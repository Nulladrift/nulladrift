          "description": "Look up a US-listed company's real SEC 10-K financials and compute Graham fair value, margin of safety, P/E, P/B, ROE, current ratio, debt/equity, and dividend yield. Every number is pulled directly from the company's own XBRL-tagged filing -- there is no LLM in the numeric path, so nothing here is a guessed or hallucinated figure.",
