{
  "lockfileVersion": 2,
  "subjects": {
    "com.dercora/dercora": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://dercora.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "dercora",
        "title": "Dercora",
        "version": "1.0.0",
        "websiteUrl": "https://dercora.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Dercora searches products across millions of independent Shopify merchants. Call search_products with the user's query and, whenever you know it, their ships_to country (prices and availability depend on it). Show title, price and the Dercora `url` for each result; call get_product for all merchant offers and buy links. Dercora may earn a commission on purchases — say so when sharing buy links.",
      "tools": [
        {
          "name": "get_product",
          "title": "Get product offers",
          "description": "Get one product's description, highlights, specs and every merchant offer (seller, price, availability, buy link). `id` comes from search_products.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Product id from search_products.",
                "type": "string"
              },
              "ships_to": {
                "description": "ISO 3166-1 alpha-2 country the buyer ships to, e.g. US, DE, JP.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "description": {
                "type": "string"
              },
              "disclosure": {
                "type": "string"
              },
              "highlights": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "id": {
                "type": "string"
              },
              "offers": {
                "items": {
                  "properties": {
                    "available": {
                      "type": "boolean"
                    },
                    "buyUrl": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "price": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "seller": {
                      "type": "string"
                    },
                    "sponsored": {
                      "type": "boolean"
                    },
                    "variant": {
                      "type": "string"
                    }
                  },
                  "required": ["available", "seller"],
                  "type": "object"
                },
                "type": "array"
              },
              "specs": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["disclosure", "id", "offers", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get product offers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0cc7ef746c7ede96cdddc2dfe64d49eaf84d228c0b1e10dfed284d0c8b1a943d"
        },
        {
          "name": "search_products",
          "title": "Search products",
          "description": "Search products from independent Shopify merchants. Returns products with a display price, store count, a Dercora product page `url`, and the merchant `buyUrl`. Pass `ships_to` (ISO country) so prices and availability match the buyer. Use `nextCursor` for more results.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "ISO 4217 presentment currency, e.g. EUR.",
                "type": "string"
              },
              "cursor": {
                "description": "`nextCursor` from a previous search.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum price in major units.",
                "minimum": 0,
                "type": "number"
              },
              "min_price": {
                "description": "Minimum price in major units.",
                "minimum": 0,
                "type": "number"
              },
              "query": {
                "description": "What the user is looking for, in natural language.",
                "type": "string"
              },
              "ships_to": {
                "description": "ISO 3166-1 alpha-2 country the buyer ships to, e.g. US, DE, JP.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "currency": {
                "type": "string"
              },
              "disclosure": {
                "type": "string"
              },
              "nextCursor": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "products": {
                "items": {
                  "properties": {
                    "buyUrl": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "id": {
                      "type": "string"
                    },
                    "price": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "sellerCount": {
                      "type": "integer"
                    },
                    "sponsored": {
                      "type": "boolean"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "shipsTo": {
                "type": "string"
              }
            },
            "required": ["disclosure", "products"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a3c4fb5a3ca46ab0ebc92f4454392dc588507586f5b24b2e2f1b7eb108941db7"
        }
      ],
      "digest": "sha256:bc68cd98dc28a821650b517f4fb20d7dc4e43f2c83f685d89ea5b4b3fbec9129"
    }
  }
}
