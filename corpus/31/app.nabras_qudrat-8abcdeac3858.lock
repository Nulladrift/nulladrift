          "name": "calculate_mawzona",
          "title": "Weighted admission score | احسب نسبتي الموزونة",
          "description": "Answers «احسب نسبتي الموزونة», «كم موزونتي؟», «كيف أحسب النسبة الموزونة؟». Calculates the Saudi university weighted admission score from the high-school %, Qudrat and Tahsili scores (each 0 to 100) and the university's weights (they must sum to 100). Tahsili is optional (weight 0).",
