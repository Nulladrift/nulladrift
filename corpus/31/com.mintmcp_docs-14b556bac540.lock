      "instructions": "Search and read the official Mintive (formerly MintMCP) documentation, the authoritative source for how Mintive works.\n\nMintive is an enterprise gateway for the Model Context Protocol (MCP). It sits between AI clients (Claude Code, Cursor, ChatGPT, Claude, agents) and MCP servers, adding authentication, access control, audit logging, and governance.\n\nUse these tools to answer any question about Mintive setup, capabilities, security posture, or a specific integration. The documentation covers:\n\n- MCP Gateway: curated MCP store, hosted connectors, pre-configured credentials, role-based tool sets, agent identities, centralized governance.\n- Agent Monitor: real-time visibility into coding agents (file reads, command execution, MCP tool calls) with rules to block or mask risky behavior.\n- Coworker Agents: autonomous agents with their own identity, Slack integration, ambient mode, sub-agents, and skills.\n- Prebuilt connector setup guides across data and analytics (Snowflake, BigQuery, Databricks, Looker, dbt, Postgres, MySQL, MongoDB...), engineering (GitHub, Datadog, PagerDuty, Azure DevOps...), collaboration (Slack, Zoom, Microsoft 365, Atlassian, Asana...), sales and marketing (Salesforce, HubSpot, Gong...), business operations (NetSuite, QuickBooks, Ramp, DocuSign...), and security and IT (Okta, CrowdStrike, Freshservice).\n- Enterprise and security: SSO/SCIM, roles and permissions, Cross App Access, SIEM export, prompt security, tool governance, audit and observability.\n- Configuration as Code and the Admin MCP for programmatic administration.\n\nGround answers in the docs. Use search to find pages on a topic, list_docs to browse what the docs cover by category, fetch to read a page by its id, and get_page when a user gives you a docs URL or slug. When a user asks whether Mintive can do something, search before answering.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch a Mintive docs page",
          "description": "Fetch the full markdown content of a Mintive documentation page by its id. Use it after search (or list_docs) to read a page in full before answering, for example the Snowflake connector setup, the SCIM provisioning guide, or the tool governance reference. If you have a public docs URL or a slug instead of a search-result id, use get_page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "The document id returned by search or list_docs.",
                "maxLength": 512,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
