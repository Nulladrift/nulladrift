      "tools": [
        {
          "name": "check_gulf_shipping",
          "title": "Check GCC Air-Cargo Shipping Eligibility",
          "description": "Verify GCC air-shipping eligibility (SA, AE, QA, KW, BH, OM) via BASMA Global & SMSA Express (4-7 business days) and flag restricted items (colognes, perfumes, acetone, aerosols).",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Destination GCC ISO country code (SA, AE, QA, KW, BH, or OM)",
                "enum": ["SA", "AE", "QA", "KW", "BH", "OM"],
                "type": "string"
              },
              "query": {
                "description": "Optional product name, category, or keyword to check air-cargo eligibility",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check GCC Air-Cargo Shipping Eligibility"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6a4eaeb87172f4782779b7329a1ce8d43baacbad93a56eacf8eb64762f0c43b0"
        },
        {
          "name": "get_product",
          "title": "Get Product Details & ÜTS Verification",
          "description": "Get full product details (title, short description, TRY price, ÜTS barcode verification, FAQ, safety notes, shipping & return policies) by ID, SKU, GTIN, slug, or title.",
          "inputSchema": {
            "properties": {
              "identifier": {
                "description": "Product ID, SKU, GTIN/barcode, URL slug, or partial title",
                "type": "string"
              }
            },
            "required": ["identifier"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Product Details & ÜTS Verification"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9c1c0f04215618d17ab05b0225268b2974a7390192f80ce30443bbae5e240e7c"
        },
        {
          "name": "get_store_info",
          "title": "Get AL-KARA Store Info & Policies",
          "description": "Get canonical AL-KARA store metadata, legal registration (BASMA GLOBAL LOJİSTİK LİMİTED ŞİRKETİ), Türkiye & GCC shipping policies, PayTR payment rules, and optional llms.txt markdown summary.",
          "inputSchema": {
            "properties": {
              "include_llms_markdown": {
                "default": false,
                "description": "Include full llms.txt markdown summary in response (default: false)",
                "type": "boolean"
              },
              "language": {
                "default": "tr",
                "description": "Response language: 'tr' for Turkish or 'ar' for Arabic (default: 'tr')",
                "enum": ["tr", "ar"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get AL-KARA Store Info & Policies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3fb4de81d21183269090fe1d57622fb503581a76084847a285a6c40ab5bdbe03"
        },
        {
          "name": "search_products",
          "title": "Search AL-KARA Cosmetics Catalog",
          "description": "Search AL-KARA bilingual (Turkish & Arabic) cosmetics & personal care catalog with TRY prices, stock, GTIN barcodes, and GCC air-cargo eligibility.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "Brand filter (e.g. Bee Beauty, Dalin, SKIN1004, Morfose, Maybelline)",
                "type": "string"
              },
              "gulf_only": {
                "default": false,
                "description": "Only products eligible for GCC air cargo (SA, AE, QA, KW, BH, OM)",
                "type": "boolean"
              },
              "in_stock_only": {
                "default": true,
                "description": "Only return products currently in stock (default: true)",
                "type": "boolean"
              },
              "limit": {
                "default": 8,
                "description": "Maximum number of matching products to return (1-25, default: 8)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_price_try": {
                "description": "Maximum price in TRY",
                "type": "number"
              },
              "query": {
                "description": "Keyword in Turkish, Arabic, English, SKU, or GTIN barcode",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search AL-KARA Cosmetics Catalog"
          },
          "behavior": {
