      "instructions": "NestCalc.ai rental analysis. deal_score returns published, dated Deal Scores for listings in covered cities (Cincinnati today). analyze_rental analyzes any US residential property from its facts and the user's own numbers. Not an appraisal.",
      "tools": [
        {
          "name": "analyze_rental",
          "title": "Analyze a rental property",
          "description": "Analyze a US residential property as a rental investment. Give an address or the key facts (price, beds, baths, square feet, ZIP). Add any numbers the user knows, such as their expected rent, tax or insurance; they override our estimates. Returns an investment score, IRR over a 15-year hold, monthly cash flow, cap rate, cash-on-cash return and DSCR, with the source of every input shown. Estimates only, not an appraisal.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "address": {
                "description": "Street address, ideally with city, state and ZIP.",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              },
              "bathrooms": {
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              },
              "bedrooms": {
                "description": "Total bedrooms (all units together for a 2- or 3-family).",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "down_payment_pct": {
                "description": "Down payment as a percent of price (default 20).",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "hoa_monthly": {
                "description": "Monthly HOA fee in dollars; 0 when omitted.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "insurance_annual": {
                "description": "Annual insurance in dollars; overrides our estimate.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "interest_rate": {
                "description": "Annual mortgage rate in percent (default: the current 30-year average we use).",
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              },
              "list_price": {
                "description": "Asking or purchase price in US dollars.",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "number"
              },
              "loan_term_years": {
                "description": "Loan term in years (default 30).",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "monthly_rent": {
                "description": "The user's expected total monthly rent; overrides our estimate.",
                "exclusiveMinimum": 0,
                "maximum": 1000000,
                "type": "number"
              },
              "property_tax_annual": {
                "description": "Annual property tax in dollars; overrides our estimate.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "property_type": {
                "enum": ["single-family", "condo/townhome", "2-family", "3-family", "multi-family"],
                "type": "string"
              },
              "square_feet": {
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "units": {
                "description": "Number of units in the building, when known.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "zip": {
                "description": "5-digit US ZIP code. Needed when no address with a ZIP is given.",
                "pattern": "^\\d{5}(-\\d{4})?$",
                "type": "string"
              }
            },
            "required": ["list_price"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "band": {
                "type": "string"
              },
              "cap_rate": {
                "type": "number"
              },
              "cash_on_cash": {
                "type": "number"
              },
              "disclaimer": {
                "type": "string"
              },
              "dscr": {
                "type": "number"
              },
