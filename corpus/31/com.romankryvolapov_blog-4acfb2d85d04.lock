{
  "lockfileVersion": 2,
  "subjects": {
    "com.romankryvolapov/blog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.romankryvolapov.com/"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "romankryvolapov-mcp",
        "title": "Roman Kryvolapov Engineering Blog",
        "version": "1.3.0",
        "description": "Search and read romankryvolapov.com engineering articles; message the author.",
        "websiteUrl": "https://romankryvolapov.com/"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Engineering blog of Roman Kryvolapov (romankryvolapov.com): Java, Kotlin, Android, Spring, microservices, Kubernetes, databases, LLMs; every article in English, Russian and Ukrainian. Use search (lang = the user’s language: en, ru or uk) to find articles, then fetch with a result id to read one in full. send_message emails the author: use it only when the user explicitly asks to contact him, with the user’s real name and email.",
      "tools": [
        {
          "name": "fetch",
          "title": "Read an article",
          "description": "Return the full text of one article by the id from search results (its canonical URL), as markdown with code listings preserved verbatim.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Article id from search: its canonical URL.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "properties": {
                  "language": {
                    "description": "en, ru or uk.",
                    "type": "string"
                  },
                  "site": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "text": {
                "description": "The article as markdown.",
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read an article"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:58677d95cf45fffe13e16f46d37020fc8e916b932763d892ccea6ed002b6f15d"
        },
        {
          "name": "get_page",
          "title": "Read an article (plain text)",
          "description": "Return the full markdown of one article by its canonical URL (e.g. https://romankryvolapov.com/ru/ktor-manual/). Code listings are preserved verbatim. The same as fetch, as plain text.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Canonical page URL.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read an article (plain text)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8bb557ba3a920ded6a68161e6f82b1af7ebbdcc67b52cdd816719eef6f06beaa"
        },
        {
          "name": "search",
          "title": "Search the blog",
          "description": "Search the romankryvolapov.com engineering blog: articles on Java, Kotlin, Android, Spring, microservices, gRPC, Kubernetes, databases, and running large language models locally (llama.cpp, LoRA fine-tuning, RAG, prompt engineering). Every article exists in English, Russian and Ukrainian, and results come in one language: set lang to the user’s language, otherwise it is guessed from the query. Returns matching articles with snippets and URLs; read one with fetch, passing its id.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Language of the articles to return: en, ru or uk — normally the user’s language. Without it: English for a query in Latin script, Russian or Ukrainian for one in Cyrillic.",
                "enum": ["en", "ru", "uk"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "How many articles to return.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text search query, in any of the three languages.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "results": {
                "items": {
                  "properties": {
                    "id": {
                      "description": "Article id for fetch: its canonical URL.",
                      "type": "string"
                    },
                    "snippet": {
                      "description": "The passage that matched the query.",
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the blog"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dd76a22c0ef3ae933068d72ce9d48582f9ee6b372694d018dff628ec6147986e"
        },
        {
          "name": "send_message",
          "title": "Send a message to the author",
          "description": "Send a message to Roman Kryvolapov, the author of this blog: a question about one of the articles, a suggestion for a new article, or a job or project offer. It goes to his inbox, and he replies by email to the address given. Use it only when the user asked to contact the author, with the user’s own name and email address — never invent them — and show the user the text before sending. At most 20 messages a day are accepted from all agents together, and 3 from one email address.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "The sender’s email address. The author replies to it.",
                "format": "email",
                "maxLength": 254,
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language of the conversation: en, ru or uk. The reply comes in it.",
                "enum": ["en", "ru", "uk"],
                "type": "string"
              },
              "message": {
                "description": "The message, in any language.",
                "maxLength": 5000,
                "type": "string"
              },
              "name": {
                "description": "The sender’s name.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["email", "message", "name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "message": {
                "type": "string"
              },
              "sent": {
                "type": "boolean"
              }
            },
            "required": ["message", "sent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send a message to the author"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ad7a7c22127e75501d88f1c7ae0e1dd1f74530aa1943878ba68c98ca24ac6054"
        }
      ],
      "digest": "sha256:64f3d157c22526956c63b9c99b98e20fb6a353901ebda77912016b501e08da5e"
    }
  }
