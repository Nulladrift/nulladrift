{
  "lockfileVersion": 2,
  "subjects": {
    "ai.sidetrip.connect/weather": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://demo-weather.sidetrip.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "weather",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Keyless Open-Meteo weather and places. No account and no API key. When the user names a place, call geocode_place first, then pass that latitude and longitude to current_weather, daily_forecast, hourly_forecast, or air_quality. Do not invent coordinates. All tools are read-only. Attribute the data to Open-Meteo.",
      "tools": [
        {
          "name": "air_quality",
          "description": "Read the current European AQI, US AQI, and pollutant concentrations at a latitude and longitude from the Open-Meteo air-quality API. Use this for air quality, smoke, or pollution. Call geocode_place first when you only have a place name. Read-only, no API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "latitude": {
                "description": "Latitude in decimal degrees, from -90 to 90. Use geocode_place when you start from a place name.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "Longitude in decimal degrees, from -180 to 180.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "timezone": {
                "description": "IANA timezone such as Europe/Berlin, or auto. Defaults to auto.",
                "pattern": "^(?:auto|[A-Za-z][A-Za-z0-9_+-]{0,40}(?:\\/[A-Za-z0-9_+-]{1,40}){0,2})$",
                "type": "string"
              }
            },
            "required": ["latitude", "longitude"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:21e6cd9c5f372ed97bbb040dad0e11286836b95fe5d11b93388c2f85d6eee358"
        },
        {
          "name": "current_weather",
          "description": "Read the current temperature, wind, precipitation, cloud cover, and conditions at a latitude and longitude from Open-Meteo. Use this for the weather right now. Call geocode_place first when you only have a place name. Read-only, no API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "latitude": {
                "description": "Latitude in decimal degrees, from -90 to 90. Use geocode_place when you start from a place name.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "Longitude in decimal degrees, from -180 to 180.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "precipitation_unit": {
                "description": "Precipitation unit. Defaults to mm.",
                "enum": ["mm", "inch"],
                "type": "string"
              },
              "temperature_unit": {
                "description": "Temperature unit. Defaults to celsius.",
                "enum": ["celsius", "fahrenheit"],
                "type": "string"
              },
              "timezone": {
                "description": "IANA timezone such as Europe/Berlin, or auto. Defaults to auto.",
                "pattern": "^(?:auto|[A-Za-z][A-Za-z0-9_+-]{0,40}(?:\\/[A-Za-z0-9_+-]{1,40}){0,2})$",
                "type": "string"
              },
              "wind_speed_unit": {
                "description": "Wind speed unit. Defaults to kmh.",
                "enum": ["kmh", "ms", "mph", "kn"],
                "type": "string"
              }
            },
            "required": ["latitude", "longitude"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c9939e9d8c55e7628624d170db04676a35cc08d62861f35e0f98f8ac3734d340"
        },
        {
          "name": "daily_forecast",
          "description": "Read the daily high, low, precipitation, wind, sunrise, and sunset for a latitude and longitude from Open-Meteo. Use this for a multi-day outlook, up to 16 days. Call geocode_place first when you only have a place name. Read-only, no API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "forecast_days": {
                "description": "Number of days to return, from 1 to 16. Defaults to 7.",
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              },
              "latitude": {
                "description": "Latitude in decimal degrees, from -90 to 90. Use geocode_place when you start from a place name.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "Longitude in decimal degrees, from -180 to 180.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "precipitation_unit": {
                "description": "Precipitation unit. Defaults to mm.",
                "enum": ["mm", "inch"],
                "type": "string"
              },
              "temperature_unit": {
                "description": "Temperature unit. Defaults to celsius.",
                "enum": ["celsius", "fahrenheit"],
                "type": "string"
              },
              "timezone": {
                "description": "IANA timezone such as Europe/Berlin, or auto. Defaults to auto.",
                "pattern": "^(?:auto|[A-Za-z][A-Za-z0-9_+-]{0,40}(?:\\/[A-Za-z0-9_+-]{1,40}){0,2})$",
                "type": "string"
              },
              "wind_speed_unit": {
                "description": "Wind speed unit. Defaults to kmh.",
                "enum": ["kmh", "ms", "mph", "kn"],
                "type": "string"
              }
            },
            "required": ["latitude", "longitude"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f610e057facae8b0b758d0ccbc5c39fe213bb30006c673fea061214d1c5c4e57"
        },
        {
          "name": "geocode_place",
          "description": "Resolve a place name to latitude, longitude, timezone, and country with the Open-Meteo geocoding API. Use this when you have a city or landmark and still need coordinates. Do not use it for weather. Returns up to 10 matches. Read-only, no API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "count": {
                "description": "Maximum number of matches to return, from 1 to 10. Defaults to 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "country_code": {
                "description": "Optional ISO 3166-1 alpha-2 country code that limits the search.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "language": {
                "description": "Result language, such as en or de. Defaults to en.",
                "pattern": "^[A-Za-z]{2}(?:-[A-Za-z]{2,8})?$",
                "type": "string"
              },
              "name": {
                "description": "Place name to search, such as a city, neighborhood, or landmark.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
