          "digest": "sha256:a35e1034a5383465e8515c02ea28293153042ffa9eed5f0812b42b03cd0a60e2"
        },
        {
          "name": "hourly_forecast",
          "description": "Read hour-by-hour temperature, precipitation probability, wind, and cloud cover for a latitude and longitude from Open-Meteo. Use this when the hour matters. Call geocode_place first when you only have a place name. Read-only, no API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "forecast_days": {
                "description": "Number of days of hours to return, from 1 to 7. Defaults to 2.",
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              },
              "latitude": {
                "description": "Latitude in decimal degrees, from -90 to 90. Use geocode_place when you start from a place name.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "Longitude in decimal degrees, from -180 to 180.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "precipitation_unit": {
                "description": "Precipitation unit. Defaults to mm.",
                "enum": ["mm", "inch"],
                "type": "string"
              },
              "temperature_unit": {
                "description": "Temperature unit. Defaults to celsius.",
                "enum": ["celsius", "fahrenheit"],
                "type": "string"
              },
              "timezone": {
                "description": "IANA timezone such as Europe/Berlin, or auto. Defaults to auto.",
                "pattern": "^(?:auto|[A-Za-z][A-Za-z0-9_+-]{0,40}(?:\\/[A-Za-z0-9_+-]{1,40}){0,2})$",
                "type": "string"
              },
              "wind_speed_unit": {
                "description": "Wind speed unit. Defaults to kmh.",
                "enum": ["kmh", "ms", "mph", "kn"],
                "type": "string"
              }
            },
            "required": ["latitude", "longitude"],
            "type": "object"
          },
          "annotations": {
