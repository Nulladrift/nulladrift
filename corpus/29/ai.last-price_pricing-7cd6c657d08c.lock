        {
          "name": "compute_price",
          "description": "Compute a price. Returns the price, the function that produced it, the metered cost and a `trace` of each stage. search_tools gives its full definition.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "buyer_agent": {
                "description": "Optional.",
                "maxLength": 100,
                "type": ["string", "null"]
              },
              "buyer_ceiling": {
                "description": "Optional.",
                "exclusiveMinimum": 0,
                "type": ["number", "null"]
              },
              "buyer_type": {
                "description": "Optional.",
                "enum": ["agent", "person", null],
                "type": ["string", "null"]
              },
              "channel": {
                "description": "Optional.",
                "maxLength": 64,
                "type": "string"
              },
              "currency": {
                "description": "Three-letter ISO currency code, e.g.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "current_price": {
                "description": "The current or reference price.",
                "minimum": 0,
                "type": "number"
              },
              "customer_segment": {
                "description": "Optional segment, e.g.",
                "type": "string"
              },
              "function_id": {
                "description": "Optional explicit pricing function UUID to use.",
                "format": "uuid",
                "type": "string"
              },
              "geo": {
                "description": "Optional geography hint, e.g.",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional.",
                "maxLength": 255,
                "minLength": 8,
                "type": "string"
              },
              "include_buyer_envelope": {
                "description": "If true, with metadata.category set, the result adds buyer_envelope: what buyers' spend limits…",
                "type": "boolean"
              },
              "include_explanation": {
                "description": "If true, ask for an explanation and confidence with the price.",
                "type": "boolean"
              },
              "intent": {
                "description": "Optional.",
                "type": "object"
              },
              "learned_routing": {
                "description": "Optional.",
                "type": "boolean"
              },
              "max_price": {
                "description": "Optional maximum acceptable price.",
                "minimum": 0,
                "type": "number"
              },
              "metadata": {
                "description": "Optional context.",
                "type": "object"
              },
              "min_price": {
                "description": "Optional minimum acceptable price.",
                "minimum": 0,
                "type": "number"
              },
              "no_explore": {
                "description": "If true, give this price exactly as computed, without the small per-call variation a workspace may…",
                "type": "boolean"
              },
              "outcome_terms": {
                "description": "Optional, for a price charged per outcome: when the outcome counts as failed and what is owed then.",
                "type": "object"
              },
              "payer": {
                "description": "Optional.",
                "enum": ["agent_wallet", "person_card", "company_invoice", null],
                "type": ["string", "null"]
              },
              "payment": {
                "description": "Optional.",
                "maxLength": 8192,
                "minLength": 20,
                "type": "string"
              },
              "product_id": {
                "description": "Optional identifier of what is being priced.",
                "type": "string"
              },
              "product_type": {
                "description": "Optional category.",
                "enum": ["saas", "ecommerce", "marketplace", "digital", "api", "custom"],
                "type": "string"
              },
              "routing": {
                "description": "Optional.",
                "type": "object"
              },
              "routing_preference": {
                "description": "How to route across pricing functions.",
                "enum": ["cheapest", "fastest", "explicit", "round_robin", "weighted", "policy", "default"],
                "type": "string"
              },
              "target_margin_pct": {
                "description": "Margin on price for cost-plus, not markup on cost: price = unit_cost / (1 - margin).",
                "maximum": 95,
                "minimum": 0,
                "type": "number"
              },
              "unit_cost": {
                "description": "What the work costs you.",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["currency"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "alternatives": {
                "description": "Other prices the function considered, each with its confidence and a label.",
                "type": ["array", "null"]
              },
              "computed_price": {
                "description": "The price the function returned, after the caller's bounds and the workspace's guardrails. Term: lp:computed-price.",
                "type": "number"
              },
              "confidence": {
                "description": "The function's own 0 to 1 score for this price; not a probability that a buyer accepts. Term: lp:confidence.quote.",
                "maximum": 1,
                "minimum": 0,
                "type": ["number", "null"]
              },
              "currency": {
                "description": "ISO 4217 code of computed_price.",
                "type": "string"
              },
              "explanation": {
                "description": "Why the function chose this price, in plain words; null when it gave none.",
                "type": ["string", "null"]
              },
              "function_id": {
                "description": "The pricing function that produced the price. Term: lp:pricing-function.",
                "type": ["string", "null"]
              },
              "function_name": {
                "description": "Its name, such as lastprice/cost-plus. Term: lp:pricing-function.",
                "type": ["string", "null"]
              },
              "kind": {
                "description": "What sort of claim the price is: an estimate by a pricing function, advice rather than a commitment. Term: lp:price-kind.computed.",
                "enum": ["computed"],
                "type": "string"
              },
              "message": {
                "description": "A short sentence about the result that an agent can show its person.",
                "type": "string"
              },
              "price_object": {
                "description": "What the price means beside the number: the expected acceptance at each price, the range it was chosen in, what it was conditioned on, the evidence behind it, what it cost to compute and whether it was an exploring draw. Term: lp:price-object.",
                "type": ["object", "null"]
              },
              "price_statement": {
                "description": "What this answer is: a third party's estimate for you (standing estimate), or the workspace's commitment until valid_until when a signed quote is attached (speaker seller, standing commitment). Term: lp:price-statement.",
                "properties": {
                  "audience": {
                    "enum": ["public", "one_counterparty", "private"],
                    "type": "string"
                  },
                  "interval_meaning": {
                    "enum": ["credible_interval", "evidence_spread", "acceptance_range", "negotiation_room"],
                    "type": "string"
                  },
                  "speaker": {
                    "enum": ["seller", "buyer", "both", "third_party", "market"],
                    "type": "string"
                  },
                  "standing": {
                    "enum": ["proposal", "commitment", "executed", "estimate", "constraint"],
                    "type": "string"
                  }
                },
                "required": ["audience", "speaker", "standing"],
                "type": "object"
              },
              "receipt": {
                "description": "The usage event that records this call. Pass receipt.id to report_outcome only when it differs from request_id; when no usage event was recorded, receipt.id falls back to request_id and there is nothing to report against. Term: lp:usage-event.",
                "type": ["object", "null"]
              },
              "request_id": {
                "description": "This call's id; the receipt id unless receipt.id says otherwise.",
                "type": "string"
              },
              "valid_until": {
                "description": "RFC 3339; the price holds only until then.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Compute price"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
