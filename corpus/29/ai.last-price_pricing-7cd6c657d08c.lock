        {
          "name": "pricing_conversation",
          "description": "Ask Last Price what pricing inputs are missing. Start with request: {}, return its questions to the caller, then send continuation.request and answers. Prepare is free and does not compute. When ready, action compute uses the existing authenticated pricing API; configure a credential first. Never invent answers or treat a continuation as authorization.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "default": "prepare",
                "description": "prepare (free) returns the questions still open; compute prices once nothing is missing.",
                "enum": ["prepare", "compute"],
                "type": "string"
              },
              "answers": {
                "additionalProperties": false,
                "description": "Answers to the questions the last call asked, by field, e.g. {\"currency\":\"USD\",\"unit_cost\":4}.",
                "properties": {
                  "currency": {
                    "pattern": "^[A-Z]{3}$",
                    "type": "string"
                  },
                  "current_price": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "max_price": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "min_price": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "target_margin_pct": {
                    "maximum": 95,
                    "minimum": 0,
                    "type": "number"
                  },
                  "unit_cost": {
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "request": {
                "description": "Partial REST PricingComputeRequest, including nested context, constraints, an explicit function selection and options. Reuse continuation.request on subsequent calls.",
                "type": "object"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "assumptions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "continuation": {
                "properties": {
                  "request": {
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "explanation": {
                "type": "string"
              },
              "message": {
                "description": "A short sentence about the result that an agent can show its person.",
                "type": "string"
              },
              "questions": {
                "items": {
                  "properties": {
                    "field": {
                      "type": "string"
                    },
                    "question": {
