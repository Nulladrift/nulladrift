{
  "lockfileVersion": 2,
  "subjects": {
    "ai.last-price/pricing": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.last-price.ai/api/mcp/rpc"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "lastprice-mcp",
        "version": "0.10.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Last Price prices what you sell. To get a price now, call compute_price with what you charge today, for example {\"current_price\":49,\"currency\":\"USD\"}. Missing an input? Call pricing_conversation with what you know and it asks for the rest. With no MCP client, POST JSON-RPC to this URL: initialize, then {\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/call\",\"params\":{\"name\":\"compute_price\",\"arguments\":{\"current_price\":49,\"currency\":\"USD\"}}}; you do not need tools/list first. This connection lists the 6 tools that reach a price, plus search_tools and call_tool: search_tools finds any of the other 356 tools by task and call_tool runs it. With no key, prices come from a public demo workspace, limited per address. For your own workspace, POST https://api.last-price.ai/api/agents/register with {\"name\":\"your-system/role-name\"} and send the key as x-api-key. Check the changelog at https://last-price.ai/changelog before relying on behaviour you learned earlier.",
      "tools": [
        {
          "name": "call_tool",
          "description": "Run any Last Price tool by name, including one this connection does not list. Find the name and its arguments with search_tools first. What it does, and whether it changes anything, is what that tool says.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "arguments": {
                "description": "The arguments for that tool, as its input schema from search_tools describes. Defaults to {}.",
                "type": "object"
              },
              "name": {
                "description": "The tool to run, e.g. \"list_webhooks\".",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "message": {
                "description": "A short sentence about the result that an agent can show its person.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Call tool"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8f26755af72fa56552b45cf07d4bbf4da4a8ef867573e1b3fa0ac85b679f6c5a"
        },
        {
          "name": "compute_price",
          "description": "Compute a price. Returns the price, the function that produced it, the metered cost and a `trace` of each stage. Send currency plus unit_cost (what the work costs you) or current_price. Missing inputs return an error naming them. For a competitor offer, put competitor_price, competitor_currency and competitive_action in metadata. To pay for this one call with x402, pass payment (call without it to read the price). A result with valid_until (RFC 3339) holds only until then. confidence is the function's own 0 to 1 score for its price, not a probability that a buyer accepts. price_statement says what the answer is: a third party's estimate for you, or the workspace's commitment when a signed quote is attached.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "buyer_agent": {
                "description": "Optional. The buying agent, e.g. chatgpt. A label recorded with the quote only.",
                "maxLength": 100,
                "type": ["string", "null"]
              },
              "buyer_ceiling": {
                "description": "Optional. The most the buyer says it will pay, in the request currency (its budget, spend limit or offer cap). Never reaches the pricing function, so it cannot set the price; the model layer reads it as evidence about the buyer and checks it against what the buyer then does. Echoed in price_object.evidence.declared_ceiling.",
                "exclusiveMinimum": 0,
                "type": ["number", "null"]
              },
              "buyer_type": {
                "description": "Optional. Who the price is for: an AI agent or a person. Recorded with the quote only.",
                "enum": ["agent", "person", null],
                "type": ["string", "null"]
              },
              "channel": {
                "description": "Optional. The sales channel, e.g. an agent marketplace. With a rate saved by set_channel_rates, the price covers the channel's cut.",
                "maxLength": 64,
                "type": "string"
              },
              "currency": {
                "description": "Three-letter ISO currency code, e.g. USD.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "current_price": {
                "description": "The current or reference price. Optional: functions that price relative to an incumbent need it, but lastprice/cost-plus prices from unit_cost instead.",
                "minimum": 0,
                "type": "number"
              },
              "customer_segment": {
                "description": "Optional segment, e.g. enterprise.",
                "type": "string"
              },
              "function_id": {
                "description": "Optional explicit pricing function UUID to use.",
                "format": "uuid",
                "type": "string"
              },
              "geo": {
                "description": "Optional geography hint, e.g. US.",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional. A new value (e.g. a UUID) for each call you mean to make; send the SAME value if you retry after a timeout or error you cannot interpret, and the call is computed and charged once. Ignored without a credential.",
                "maxLength": 255,
                "minLength": 8,
                "type": "string"
              },
              "include_buyer_envelope": {
                "description": "If true, with metadata.category set, the result adds buyer_envelope: what buyers' spend limits allowed in that category (pooled over 5 or more buyers) and where this price sits. It never changes the price.",
                "type": "boolean"
              },
              "include_explanation": {
                "description": "If true, ask for an explanation and confidence with the price.",
                "type": "boolean"
              },
              "intent": {
                "description": "Optional. The spending limit the buyer approved, e.g. a card network mandate. The result says whether the price fits it.",
                "properties": {
                  "currency": {
                    "description": "Three-letter ISO code. Defaults to the price currency.",
                    "maxLength": 3,
                    "minLength": 3,
                    "type": "string"
                  },
                  "expires_at": {
                    "description": "When the approval stops being valid (RFC 3339).",
                    "format": "date-time",
                    "type": "string"
                  },
                  "id": {
                    "description": "The approval id from the rail or issuer.",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "max_amount": {
                    "description": "The most the buyer approved.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "merchant": {
                    "description": "The merchant the approval names. Carried into the quote as sent.",
                    "maxLength": 253,
                    "type": "string"
                  }
                },
                "required": ["id", "max_amount"],
                "type": "object"
              },
              "learned_routing": {
                "description": "Optional. With routing_preference cheapest, fastest, round_robin or weighted, let the router learn from your own calls which function serves you best (see get_learned_routing). Ignored with a function_id.",
                "type": "boolean"
              },
              "max_price": {
                "description": "Optional maximum acceptable price.",
                "minimum": 0,
                "type": "number"
              },
              "metadata": {
                "description": "Optional context. Competitive pricing: competitor_price, competitor_currency and competitive_action (match, or undercut with undercut_pct); confirm the products are comparable. Or market_query (the job in plain words) to look up market prices instead.",
                "type": "object"
              },
              "min_price": {
                "description": "Optional minimum acceptable price. A competitive offer needs this or a declared unit_cost and target_margin_pct.",
                "minimum": 0,
                "type": "number"
              },
              "no_explore": {
                "description": "If true, give this price exactly as computed, without the small per-call variation a workspace may run so learned pricing can learn what buyers will pay (see get_price_exploration).",
                "type": "boolean"
              },
              "outcome_terms": {
                "description": "Optional, for a price charged per outcome: when the outcome counts as failed and what is owed then. The result echoes the terms normalised, with complete false until success_definition, resolve_by and on_timeout are all set.",
                "properties": {
                  "evidence": {
                    "description": "What proves the outcome, e.g. [\"delivery_receipt\"].",
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "on_timeout": {
                    "description": "What is owed when the deadline passes without success.",
                    "enum": ["no_charge", "partial", "full"],
                    "type": "string"
                  },
                  "resolve_by": {
                    "description": "The deadline: an ISO 8601 duration from the quote (P30D, PT48H) or an RFC 3339 time. After it, with no success, the outcome has failed.",
                    "type": "string"
                  },
                  "success_definition": {
                    "description": "What the buyer must see for the outcome to count.",
                    "maxLength": 500,
                    "type": "string"
                  },
                  "timeout_share": {
                    "description": "With on_timeout \"partial\": the fraction of the price owed, e.g. 0.3 for 30%.",
                    "exclusiveMaximum": 1,
                    "exclusiveMinimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "payer": {
                "description": "Optional. Who pays, as distinct from who calls: an agent wallet, a person by card, or a company billed later.",
                "enum": ["agent_wallet", "person_card", "company_invoice", null],
                "type": ["string", "null"]
              },
              "payment": {
                "description": "Optional. The signed x402 payment, base64, as sent in an X-PAYMENT or PAYMENT-SIGNATURE header; or, where the answer offers MPP tempo, the whole Payment-Authorization value (\"Payment \" and the credential). Omit it to read what the call costs and how to pay; nothing is charged until you send it.",
                "maxLength": 8192,
                "minLength": 20,
                "type": "string"
              },
              "product_id": {
                "description": "Optional identifier of what is being priced.",
                "type": "string"
              },
              "product_type": {
                "description": "Optional category. Defaults to \"custom\".",
                "enum": ["saas", "ecommerce", "marketplace", "digital", "api", "custom"],
                "type": "string"
              },
              "routing": {
                "additionalProperties": false,
                "description": "Optional. Which functions may answer this call, by UUID from list_functions. If none qualifies, the call is refused before any charge.",
                "properties": {
                  "allow_fallbacks": {
                    "description": "false: fail instead of trying another function when the chosen one fails.",
                    "type": "boolean"
                  },
                  "excluded_functions": {
                    "description": "These may not answer, not even as a fallback.",
                    "items": {
                      "format": "uuid",
                      "type": "string"
                    },
                    "maxItems": 50,
                    "type": "array"
                  },
                  "max_cost_per_unit": {
                    "description": "Most you will pay per metered unit (rate x multiplier).",
                    "minimum": 0,
                    "type": "number"
                  },
                  "max_latency_ms": {
                    "description": "Skip functions slower than this on average, and stop waiting after it.",
                    "minimum": 1,
                    "type": "integer"
                  },
                  "only_functions": {
                    "description": "Only these may answer.",
                    "items": {
                      "format": "uuid",
                      "type": "string"
                    },
                    "maxItems": 50,
                    "minItems": 1,
                    "type": "array"
                  },
                  "preferred_functions": {
                    "description": "Tried first, in this order.",
                    "items": {
                      "format": "uuid",
                      "type": "string"
                    },
                    "maxItems": 50,
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "routing_preference": {
                "description": "How to route across pricing functions. Defaults to \"default\".",
                "enum": ["cheapest", "fastest", "explicit", "round_robin", "weighted", "policy", "default"],
                "type": "string"
              },
              "target_margin_pct": {
                "description": "Margin on price for cost-plus, not markup on cost: price = unit_cost / (1 - margin). Defaults to 30.",
                "maximum": 95,
                "minimum": 0,
                "type": "number"
              },
              "unit_cost": {
                "description": "What the work costs you. It lets lastprice/cost-plus price with no current_price, which is the usual case when pricing a task you are about to run. Routing picks a function that can use it; to require cost-plus, pass its UUID from list_functions as function_id.",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["currency"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "alternatives": {
                "description": "Other prices the function considered, each with its confidence and a label.",
                "type": ["array", "null"]
              },
              "computed_price": {
                "description": "The price the function returned, after the caller's bounds and the workspace's guardrails. Term: lp:computed-price.",
                "type": "number"
              },
              "confidence": {
                "description": "The function's own 0 to 1 score for this price; not a probability that a buyer accepts. Term: lp:confidence.quote.",
                "maximum": 1,
                "minimum": 0,
                "type": ["number", "null"]
              },
              "currency": {
                "description": "ISO 4217 code of computed_price.",
                "type": "string"
              },
              "explanation": {
                "description": "Why the function chose this price, in plain words; null when it gave none.",
                "type": ["string", "null"]
              },
              "function_id": {
                "description": "The pricing function that produced the price. Term: lp:pricing-function.",
                "type": ["string", "null"]
              },
              "function_name": {
                "description": "Its name, such as lastprice/cost-plus. Term: lp:pricing-function.",
                "type": ["string", "null"]
              },
              "kind": {
                "description": "What sort of claim the price is: an estimate by a pricing function, advice rather than a commitment. Term: lp:price-kind.computed.",
                "enum": ["computed"],
                "type": "string"
              },
              "message": {
                "description": "A short sentence about the result that an agent can show its person.",
                "type": "string"
              },
              "price_object": {
                "description": "What the price means beside the number: the expected acceptance at each price, the range it was chosen in, what it was conditioned on, the evidence behind it, what it cost to compute and whether it was an exploring draw. Term: lp:price-object.",
                "type": ["object", "null"]
              },
              "price_statement": {
                "description": "What this answer is: a third party's estimate for you (standing estimate), or the workspace's commitment until valid_until when a signed quote is attached (speaker seller, standing commitment). Term: lp:price-statement.",
                "properties": {
                  "audience": {
                    "enum": ["public", "one_counterparty", "private"],
                    "type": "string"
                  },
                  "interval_meaning": {
                    "enum": ["credible_interval", "evidence_spread", "acceptance_range", "negotiation_room"],
                    "type": "string"
                  },
                  "speaker": {
                    "enum": ["seller", "buyer", "both", "third_party", "market"],
                    "type": "string"
                  },
                  "standing": {
                    "enum": ["proposal", "commitment", "executed", "estimate", "constraint"],
                    "type": "string"
                  }
                },
                "required": ["audience", "speaker", "standing"],
                "type": "object"
              },
              "receipt": {
                "description": "The usage event that records this call. Pass receipt.id to report_outcome only when it differs from request_id; when no usage event was recorded, receipt.id falls back to request_id and there is nothing to report against. Term: lp:usage-event.",
                "type": ["object", "null"]
              },
              "request_id": {
                "description": "This call's id; the receipt id unless receipt.id says otherwise.",
                "type": "string"
              },
              "valid_until": {
                "description": "RFC 3339; the price holds only until then.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Compute price"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:745f9dea248dea17033e250d2fc07ba5617a32ee391031f45dbcf655d9a1eddb"
        },
        {
          "name": "get_receipt",
          "description": "Get the receipt for one of your workspace's priced calls, by its usage event id (the id list_usage_events returns and report_outcome takes): what was priced, by which function and agent, when, the amount, how it was paid, and the outcome if one was reported. Receipts are made only when you ask, never sent for every call. For CSV or a printable page, call GET /api/receipts/{id} with format=csv or format=html. Needs a Last Price credential with price compute or billing read scope. Needs a claimed workspace: a sandbox key from self-registration is refused (403) until a person claims the workspace.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "usage_event_id": {
                "description": "The priced call's usage event id, as list_usage_events returns it.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["usage_event_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "issued_at": {
                "type": "string"
              },
              "issuer": {
                "type": "object"
              },
              "message": {
                "description": "A short sentence about the result that an agent can show its person.",
                "type": "string"
              },
              "object": {
                "enum": ["receipt"],
                "type": "string"
              },
              "receipt": {
                "properties": {
                  "amount": {
                    "type": "number"
                  },
                  "currency": {
                    "type": "string"
                  },
                  "payment": {
                    "type": "string"
                  },
                  "usage_event_id": {
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get receipt"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ai.last-price/requires": "claimed_workspace"
          },
          "digest": "sha256:2c7ca9e314b67ac8671373652eb0887956a4d32c06058835491689b35b2dc28d"
        },
        {
          "name": "list_functions",
          "description": "List the pricing functions registered for the authenticated tenant.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "execution_type": {
