        {
          "name": "verify_price",
          "description": "Ask whether a price makes sense for its context, rather than what the price should be. Returns a verdict (within_band, too_high, too_low, or unknown), the band it was judged against, a signed deviation from the reference, a confidence, and the evidence behind it. search_tools gives its full definition.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "buyer_agent": {
                "description": "Optional.",
                "maxLength": 100,
                "type": ["string", "null"]
              },
              "buyer_type": {
