      "serverInfo": {
        "name": "lastprice-mcp",
        "version": "0.11.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Last Price prices what you sell. To get a price now, call compute_price with what the work cost you, for example {\"unit_cost\":0.47,\"currency\":\"USD\"}, or with what you charge today, {\"current_price\":49,\"currency\":\"USD\"}. Missing an input? Call pricing_conversation with what you know and it asks for the rest. With no MCP client, POST JSON-RPC to this URL: initialize, then {\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/call\",\"params\":{\"name\":\"compute_price\",\"arguments\":{\"unit_cost\":0.47,\"currency\":\"USD\"}}}; you do not need tools/list first. This connection lists the 7 tools that reach a price, plus search_tools and call_tool: search_tools finds any of the other 374 tools by task and call_tool runs it. With no key, prices come from a public demo workspace, limited per address. For your own workspace, call register_agent with {\"name\":\"your-system/role-name\"}, or, holding a key already (a saved file or LASTPRICE_API_KEY), call use_api_key with it; this session then runs as that agent, no header to add. Check the changelog at https://last-price.ai/changelog before relying on behaviour you learned earlier.",
      "tools": [
        {
          "name": "call_tool",
          "description": "Run any Last Price tool by name, including one this connection does not list. Find the name and its arguments with search_tools first. What it does, and whether it changes anything, is what that tool says.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "arguments": {
                "description": "The arguments for that tool, as its input schema from search_tools describes. Defaults to {}.",
                "type": "object"
              },
              "name": {
                "description": "The tool to run, e.g. \"list_webhooks\".",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "message": {
                "description": "A short sentence about the result that an agent can show its person.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Call tool"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8f26755af72fa56552b45cf07d4bbf4da4a8ef867573e1b3fa0ac85b679f6c5a"
