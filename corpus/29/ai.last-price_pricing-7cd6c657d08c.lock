        {
          "name": "verify_price",
          "description": "Ask whether a price makes sense for its context, rather than what the price should be. Returns a verdict (within_band, too_high, too_low, or unknown), the band it was judged against, a signed deviation from the reference, a confidence, and the evidence behind it. A verdict of \"unknown\" means the price could not be judged, which is not the same as within_band. Act on next_step: buy (within band on confident, independent evidence), negotiate (too high), walk_away (far too high, confidently) or check_more (unknown, too low, or weak evidence); next_step_reason says why. Pass quote_valid_until from the compute_price result the price came from, and where quote expiry is switched on the answer says quote_expired when that quote is stale. Where paid verdicts are switched on, a caller with no key can pay for one verdict with x402: pass payment, a signed payment for the price and terms listed under payments.x402.verify_price in /.well-known/agents.json; a verdict of unknown is not charged. Where buyers' spend limits are switched on and metadata.category names a category, the evidence includes buyer_budget: what buyers' own spend checks allowed for it (buyer_envelope), reported and never counted in the verdict. price_statement says what the answer is: a third party's estimate whose band is an acceptance range around the reference, not an interval of value.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "buyer_agent": {
                "description": "Optional. The buying agent, e.g. chatgpt. A label recorded with the quote only.",
                "maxLength": 100,
                "type": ["string", "null"]
              },
              "buyer_type": {
                "description": "Optional. Who the price is for: an AI agent or a person. Recorded with the quote only.",
                "enum": ["agent", "person", null],
                "type": ["string", "null"]
              },
              "channel": {
                "description": "Optional. The sales channel, e.g. an agent marketplace. With a rate saved by set_channel_rates, the price covers the channel's cut.",
                "maxLength": 64,
                "type": "string"
              },
              "currency": {
                "description": "Three-letter ISO currency code, e.g. USD. Defaults to USD.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "current_price": {
                "description": "Optional incumbent price. Not required: asking whether a price is sensible does not presuppose an existing one.",
                "minimum": 0,
                "type": "number"
              },
              "customer_segment": {
                "description": "Optional segment, e.g. enterprise.",
                "type": "string"
              },
              "geo": {
                "description": "Optional geography hint, e.g. US.",
                "type": "string"
              },
              "max_price": {
                "description": "Optional hard ceiling. Binding: a verdict will never relax it.",
                "minimum": 0,
                "type": "number"
              },
              "metadata": {
                "description": "Optional free-form context.",
                "type": "object"
              },
              "min_price": {
                "description": "Optional hard floor. Binding: a verdict will never relax it.",
                "minimum": 0,
                "type": "number"
              },
              "outcome_terms": {
                "description": "Optional, for a price charged per outcome: when the outcome counts as failed and what is owed then. The result echoes the terms normalised, with complete false until success_definition, resolve_by and on_timeout are all set.",
                "properties": {
                  "evidence": {
                    "description": "What proves the outcome, e.g. [\"delivery_receipt\"].",
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "on_timeout": {
                    "description": "What is owed when the deadline passes without success.",
                    "enum": ["no_charge", "partial", "full"],
                    "type": "string"
                  },
                  "resolve_by": {
                    "description": "The deadline: an ISO 8601 duration from the quote (P30D, PT48H) or an RFC 3339 time. After it, with no success, the outcome has failed.",
                    "type": "string"
                  },
                  "success_definition": {
                    "description": "What the buyer must see for the outcome to count.",
                    "maxLength": 500,
                    "type": "string"
                  },
                  "timeout_share": {
                    "description": "With on_timeout \"partial\": the fraction of the price owed, e.g. 0.3 for 30%.",
                    "exclusiveMaximum": 1,
                    "exclusiveMinimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "payment": {
                "description": "Optional. The signed x402 payment, base64, as sent in an X-PAYMENT or PAYMENT-SIGNATURE header; or, where the answer offers MPP tempo, the whole Payment-Authorization value (\"Payment \" and the credential). Omit it to read what the call costs and how to pay; nothing is charged until you send it.",
                "maxLength": 8192,
                "minLength": 20,
                "type": "string"
              },
              "product_id": {
                "description": "Optional identifier of what is being priced.",
                "type": "string"
              },
              "product_type": {
                "description": "Optional category of what is being priced.",
                "enum": ["saas", "ecommerce", "marketplace", "digital", "api", "custom"],
                "type": "string"
              },
              "proposed_price": {
                "description": "The price to judge. This is the subject of the call.",
                "minimum": 0,
                "type": "number"
              },
              "quote_valid_until": {
                "description": "Optional. The valid_until of the compute_price result this price came from (RFC 3339). Where quote expiry is switched on, a time already past is answered with quote_expired: true.",
                "format": "date-time",
                "type": "string"
              }
            },
            "required": ["proposed_price"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "band": {
                "description": "The range the price was judged against; a null bound is open on that side. Term: lp:band.verification.",
                "properties": {
                  "lower": {
                    "type": ["number", "null"]
                  },
                  "upper": {
                    "type": ["number", "null"]
                  }
                },
                "type": ["object", "null"]
              },
              "confidence": {
                "description": "The lowest evidence weight, halved when sources disagree. Term: lp:confidence.verdict.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "currency": {
                "description": "ISO 4217 code of proposed_price and the band.",
                "type": "string"
              },
              "deviation_pct": {
                "description": "Percent from the reference price; positive is above it. Term: lp:deviation.",
                "type": ["number", "null"]
              },
              "evidence": {
                "description": "Each source's reference, band and weight. Term: lp:evidence.",
                "type": "array"
              },
              "independent_evidence": {
                "description": "False means the verdict partly reasoned from the price itself. Term: lp:independent-evidence.",
                "type": "boolean"
              },
              "message": {
                "description": "A short sentence about the result that an agent can show its person.",
                "type": "string"
              },
              "next_step": {
                "description": "What a buyer should do with this price. Term: lp:next-step.",
                "enum": ["buy", "negotiate", "walk_away", "check_more"],
                "type": "string"
              },
              "next_step_reason": {
                "description": "Why next_step was chosen, in one sentence.",
                "type": "string"
              },
              "price_statement": {
                "description": "What this answer is: a third party's estimate whose band is an acceptance range around the reference (interval_meaning acceptance_range), not an interval of value. Term: lp:price-statement.",
                "properties": {
                  "audience": {
                    "enum": ["public", "one_counterparty", "private"],
                    "type": "string"
                  },
                  "interval_meaning": {
                    "enum": ["credible_interval", "evidence_spread", "acceptance_range", "negotiation_room"],
                    "type": "string"
                  },
                  "speaker": {
                    "enum": ["seller", "buyer", "both", "third_party", "market"],
                    "type": "string"
                  },
                  "standing": {
                    "enum": ["proposal", "commitment", "executed", "estimate", "constraint"],
                    "type": "string"
                  }
                },
                "required": ["audience", "speaker", "standing"],
                "type": "object"
              },
              "proposed_price": {
                "description": "The price that was judged. Term: lp:proposed-price.",
                "type": "number"
              },
              "reference_price": {
                "description": "The price the evidence points at. Term: lp:reference-price.",
                "type": ["number", "null"]
              },
              "valid_until": {
                "description": "RFC 3339; the verdict holds only until then.",
                "type": "string"
              },
              "verdict": {
                "description": "unknown means nothing could judge the price, which is not within_band. Term: lp:verdict.",
                "enum": ["within_band", "too_high", "too_low", "unknown"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Verify price"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:09e34974bb833153918affb1decbc4fe3e4bacc90d3fc752f68736409d3d009d"
        }
      ],
