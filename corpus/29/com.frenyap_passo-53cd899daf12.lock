        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://passo-mcp.frenyap.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "PASSO",
        "version": "0.1.0",
        "icons": [
          {
            "src": "https://passo-mcp.frenyap.com/icon.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "find_motorcycle_passes",
          "title": "Find motorcycle passes",
          "description": "Lists up to 10 mountain passes and famous roads for motorcycles in one country, with their names, locations and elevations. Give a point and a radius to list the nearest first, or a name to filter; otherwise the most notable come first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter ISO 3166-1 country code, for example DE",
                "maxLength": 2,
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of results",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "near": {
                "additionalProperties": false,
                "description": "Optional point; results are ordered by distance from it",
                "properties": {
                  "lat": {
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "lon": {
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  }
                },
                "required": ["lat", "lon"],
                "type": "object"
              },
              "query": {
                "description": "Optional name filter",
                "maxLength": 120,
                "type": "string"
              },
              "radius_km": {
                "description": "Search radius around near, in kilometres (default 100)",
                "maximum": 300,
                "minimum": 5,
                "type": "integer"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find motorcycle passes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e62b2fec814ee55d865e082ed0a555fc84970812cd510d502a828d294f092d3c"
        },
        {
          "name": "find_place",
          "title": "Find a place",
          "description": "Finds up to 5 places matching a name in one country and returns their names and coordinates. Results come from OpenStreetMap data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter ISO 3166-1 country code, for example DE",
                "maxLength": 2,
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "lang": {
                "description": "Optional language code for the reply, for example en",
                "maxLength": 8,
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of results",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Name to search for",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["country", "query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a place"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1a9e5a7261307403ff7036cf710341cb8678cb5b76f8814f25a082341bb26b3e"
        },
        {
          "name": "get_pass_details",
          "title": "Get pass details",
          "description": "Returns the details of one mountain pass or famous road: name, location, elevation, length, steepness, road surface and season where known, from its id.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "pass_id": {
                "description": "Pass id as returned by find_motorcycle_passes",
                "maxLength": 130,
                "pattern": "^(wd:Q[1-9][0-9]{0,11}|osm:[nw][1-9][0-9]{0,14}|road-[a-z0-9-]{1,120}|road:[a-z]{2}:[a-z0-9-]{1,120})$",
                "type": "string"
              }
            },
            "required": ["pass_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get pass details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ddf7062bafd5b6eb995306a27f8460d708c0952da1236d52dfbd3ffdad5f63f0"
        },
        {
          "name": "plan_curvy_route",
          "title": "Plan a curvy motorcycle route",
          "description": "Plans a motorcycle route between two points in one country, with a choice of how winding the road should be, and returns the distance, the travel time and the main steps. It does not return a map, and riders must follow road signs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter ISO 3166-1 country code, for example DE",
                "maxLength": 2,
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "curviness": {
                "description": "0 for the direct motorcycle route, 1 for a more winding one",
                "maximum": 1,
                "minimum": 0,
                "type": "integer"
              },
              "from": {
                "additionalProperties": false,
                "description": "Start point: latitude and longitude",
                "properties": {
                  "lat": {
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "lon": {
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  }
                },
                "required": ["lat", "lon"],
                "type": "object"
              },
              "lang": {
                "description": "Optional language code for the reply, for example en",
                "maxLength": 8,
                "type": "string"
              },
              "to": {
                "additionalProperties": false,
                "description": "End point: latitude and longitude",
                "properties": {
                  "lat": {
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "lon": {
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  }
                },
                "required": ["lat", "lon"],
                "type": "object"
              }
            },
            "required": ["country", "from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Plan a curvy motorcycle route"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:59359d73c5fe8440ea03ff264db33c98b57f5290e7df9cb2df4cba5ee309dbf5"
        }
      ],
