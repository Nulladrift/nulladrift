        {
          "name": "contact_search",
          "title": "Contact Search",
          "description": "POST /v1/contact/search. Search for contacts at specified companies. Returns a job_id (async, 202). enrich_fields required (at least one of contact.emails or contact.phones). Use company_list (slug) instead of domains to search a saved list.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "company_list": {
                "description": "List slug instead of domains.",
                "type": "string"
              },
              "domains": {
                "description": "Company domains to search.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "enrich_fields": {
                "description": "At least one of \"contact.emails\" or \"contact.phones\". Each email costs 1 credit; phone 4 credits.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "job_titles": {
                "additionalProperties": false,
                "description": "Optional include/exclude job title filters.",
                "properties": {
                  "exclude": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "include": {
                    "additionalProperties": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "description": "Priority-keyed: {\"1\": [\"CEO\"], \"2\": [\"VP Sales\"]} — priority \"1\" is highest.",
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "location": {
                "additionalProperties": {},
                "description": "Location filters: include/exclude with type and value (country, region, city).",
                "type": "object"
              },
