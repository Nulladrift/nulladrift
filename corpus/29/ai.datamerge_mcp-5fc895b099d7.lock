        {
          "name": "run_company_enrichment",
          "title": "Run Company Enrichment",
          "description": "Agent-friendly company enrichment. On the first call provide enrichment params (domain, domains, company_name, country_code, etc.); the server starts the job and polls internally for up to ~25s. If the job is still running, the response will be {status:\"pending\", continuation_token, attempt, elapsed_seconds}. When you see status \"pending\" you MUST immediately call run_company_enrichment again with only continuation_token set — do not ask the user, do not call any other tool first. Typical jobs finish within 5 attempts (~125s). On completion the response contains record_ids and full company records.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "company_name": {
                "type": "string"
              },
              "continuation_token": {
                "description": "Opaque token from a prior pending response. When set, all other params are ignored.",
                "type": "string"
              },
              "country_code": {
                "type": "string"
              },
              "domain": {
                "description": "Company website domain.",
                "type": "string"
              },
              "domains": {
                "description": "Batch: multiple domains in one job.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "global_ultimate": {
                "type": "boolean"
              },
              "list": {
                "description": "List slug to add enriched companies to.",
                "type": "string"
              },
              "max_wait_seconds": {
                "description": "Server-side wait budget per call. Default 25, hard-capped to stay under 30s timeouts.",
                "type": "number"
              },
              "refresh": {
                "description": "When true, bypass DataMerge dedup: always re-enrich and charge credits even if the domain is already on a list. Use for multi-tenant resellers (e.g. Faro).",
                "type": "boolean"
              },
              "skip_if_exists": {
                "type": "boolean"
              },
              "strict_match": {
                "type": "boolean"
              },
              "webhook_url": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false
          },
