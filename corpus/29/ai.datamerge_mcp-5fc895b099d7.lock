        {
          "name": "run_contact_enrich",
          "title": "Run Contact Enrich",
          "description": "Agent-friendly contact enrichment. On the first call provide contacts and enrich_fields; the server starts the job and polls internally for up to ~25s. If still running, returns {status:\"pending\", continuation_token, attempt, elapsed_seconds} — you MUST immediately call run_contact_enrich again with only continuation_token set. Do not ask the user. Typical jobs finish within 5 attempts. On completion the response contains record_ids and full contact records.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "contacts": {
                "description": "Array of contacts. Identify each with `linkedin_url` and/or (`firstname`+`lastname`). ALWAYS include `domain` (company website) when you know it — FullEnrich's email accuracy drops sharply without a domain hint.",
                "items": {
                  "additionalProperties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "continuation_token": {
                "description": "Opaque token from a prior pending response. When set, all other params are ignored.",
                "type": "string"
              },
              "enrich_fields": {
                "description": "e.g. [\"contact.emails\",\"contact.phones\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "max_wait_seconds": {
                "description": "Server-side wait budget per call. Default 25, hard-capped to stay under 30s timeouts.",
                "type": "number"
              },
              "refresh": {
                "description": "When true, bypass DataMerge dedup: always re-enrich every contact and charge credits, even if the same contact was enriched in the last 30 days. Use for multi-tenant resellers (e.g. Faro).",
                "type": "boolean"
              },
              "return_any_domain": {
                "description": "Set to true to allow enrichment for contacts that have no `domain`. FullEnrich will pick whichever current employer it considers most probable, which may not match what you expect for people with multiple plausible affiliations. Default false: server returns `status: \"domain_required\"` if any contact lacks `domain`.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
