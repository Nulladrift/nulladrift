      "instructions": "Sevana voice quality analysis.\n\n1. Get a file onto the server: create_upload (returns a one-time URL; PUT the file there, e.g. with curl -T) or upload_inline (base64, small files). Use kind \"wav\" for recordings and \"pcap\" for packet captures.\n2. Analyze it with its upload_id:\n   - pvqa_analyze: MOS and impairments of one WAV recording, no reference needed.\n   - aqua_compare: compare a degraded WAV with its reference WAV (MOS, percent, fault analysis).\n   - pcap_analyze: VoIP calls in a .pcap/.pcapng: SIP calls, RTP streams, MOS per stream, loss, jitter, call health. Runs as a job; read the result with pcap_summary, pcap_get_call, pcap_get_stream, pcap_sip_messages, pcap_dtmf, pcap_network_stats. Reports never contain decoded audio.\n3. Read sevana://docs/* for what the report fields mean.\n\nWithout an API key the free tier allows 10 analyses per hour. Uploads and results are deleted after an hour.",
      "tools": [
        {
          "name": "aqua_compare",
          "title": "AQuA: compare with a reference",
          "description": "Intrusive voice quality analysis (Sevana AQuA, wideband): compares a degraded/test WAV with its reference WAV and returns MOS, percent similarity and a fault analysis explaining the loss of quality. Upload both files first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "channel_reference": {
                "description": "reference channel, from 0 (default: AQuA's choice)",
                "type": ["null", "integer"]
              },
              "channel_test": {
                "description": "test channel, from 0 (default: AQuA's choice)",
                "type": ["null", "integer"]
              },
              "reference_upload_id": {
                "description": "upload_id of the original/reference WAV",
                "type": "string"
              },
              "test_upload_id": {
                "description": "upload_id of the degraded/test WAV",
                "type": "string"
              }
            },
            "required": ["reference_upload_id", "test_upload_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "faults": {
                "description": "AQuA's fault analysis: why quality is lost (delay, spectrum, level, noise), with per-file values",
                "type": "string"
              },
              "mos": {
                "description": "AQuA MOS (1-5)",
                "type": ["null", "number"]
              },
              "percent": {
                "description": "similarity of the test file to the reference, 0-100",
                "type": ["null", "number"]
              },
              "reference_upload_id": {
                "type": "string"
              },
              "test_upload_id": {
                "type": "string"
              }
            },
            "required": ["faults", "mos", "percent", "reference_upload_id", "test_upload_id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:779364d9f24f4cf9d22f502ce00f1f29e48a275564fc59315a13095336a532fc"
        },
        {
          "name": "create_upload",
          "title": "Create an upload URL",
          "description": "Start uploading a WAV recording (kind \"wav\") or a packet capture (kind \"pcap\"). Returns an upload_id and a one-time upload_url; send the file as the body of an HTTP PUT to that URL (for example: curl -T recording.wav '<upload_url>'), then pass the upload_id to an analysis tool. The URL works once and expires after 15 minutes; the file is deleted after an hour. Use upload_inline instead if you can only pass tool arguments.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filename": {
                "description": "original file name, for display only",
                "type": "string"
              },
              "kind": {
                "description": "file kind: \"wav\" (default) or \"pcap\" (.pcap/.pcapng)",
                "type": "string"
              },
              "size_bytes": {
                "description": "file size, if known; larger than the limit is refused at once",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "curl_example": {
                "type": "string"
              },
              "expires_at": {
                "description": "the URL must be used before this time",
                "type": "string"
              },
              "max_bytes": {
                "description": "largest file accepted (0 = no limit)",
                "type": "integer"
              },
              "max_seconds": {
                "description": "longest WAV accepted (0 = no limit)",
                "type": "number"
              },
              "method": {
                "type": "string"
              },
              "upload_id": {
                "type": "string"
              },
              "upload_url": {
                "description": "one-time URL: HTTP PUT the file as the request body",
                "type": "string"
              }
            },
            "required": ["curl_example", "expires_at", "method", "upload_id", "upload_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
