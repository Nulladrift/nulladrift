        {
          "name": "pcap_summary",
          "title": "PCAP: summary",
          "description": "Overview of a finished PCAP analysis: packet totals, SIP calls with their health warnings, and streams ordered worst Sevana MOS first, each with codec, MOS, loss, jitter and impairments.",
