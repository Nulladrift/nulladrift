                "additionalProperties": {
                  "type": "string"
                },
                "description": "main packet counters",
                "type": "object"
              },
              "software": {
                "type": "string"
              },
              "stream_list": {
                "description": "worst Sevana MOS first",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "call_id": {
                      "type": "string"
                    },
                    "codec": {
                      "type": "string"
                    },
                    "delay_ms": {
                      "type": ["null", "number"]
                    },
