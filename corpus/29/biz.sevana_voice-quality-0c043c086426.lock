                    "call_id": {
                      "type": "string"
                    },
                    "diagnostics": {
                      "type": "string"
                    },
                    "health": {
                      "description": "analyzer warnings: one-way audio, codec/ptime asymmetry, late media, ...; empty = healthy",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "explanation": {
                            "type": "string"
                          },
                          "stream_ids": {
                            "items": {
