        {
          "name": "pvqa_analyze",
          "title": "PVQA: voice quality of a recording",
          "description": "Non-intrusive voice quality analysis (Sevana PVQA) of an uploaded WAV file: predicted MOS (1-5) and the impairments found (low SNR, noise, dead air, clipping, clicks, echo, packet-loss artifacts, ...). No reference recording is needed. report_type \"extended\" adds the per-interval detector table.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "channel": {
                "description": "channel to analyze, from 0 (default 0); -1 mixes all channels",
                "type": "integer"
              },
              "report_type": {
                "description": "\"basic\" (default) or \"extended\" (adds the per-interval table)",
                "type": "string"
              },
              "upload_id": {
                "description": "upload_id of a WAV file",
                "type": "string"
              }
            },
            "required": ["upload_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "channel": {
                "type": "integer"
              },
              "impairments": {
                "description": "detectors that fired, with their interval counts",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "detector": {
                      "description": "detector name, e.g. SNR, Echo, Click, DeadAir-00",
                      "type": "string"
                    },
                    "intervals": {
                      "description": "number of intervals where this detector fired",
                      "type": "integer"
                    }
                  },
                  "required": ["detector", "intervals"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "intervals": {
                "additionalProperties": false,
                "properties": {
                  "excluded": {
                    "description": "intervals excluded from the score (silence, DTMF)",
                    "type": "integer"
                  },
                  "poor": {
                    "description": "intervals with an impairment",
                    "type": "integer"
                  },
                  "total": {
                    "description": "number of 0.68 s analysis intervals",
                    "type": "integer"
                  },
                  "uncertain": {
                    "description": "intervals the detectors could not classify",
                    "type": "integer"
                  }
                },
                "required": ["excluded", "poor", "total", "uncertain"],
                "type": "object"
              },
              "is_silent": {
                "description": "true when the file contains no signal",
                "type": "boolean"
              },
              "mos": {
                "description": "predicted MOS (1-5); null when the file has no speech to score",
                "type": ["null", "number"]
              },
              "mos_model": {
                "description": "name of the learned MOS model that produced the score",
                "type": "string"
              },
              "rfactor": {
                "description": "share of good intervals (0-1)",
                "type": ["null", "number"]
              },
              "timeline": {
                "additionalProperties": false,
                "description": "per-interval detector values (report_type=extended only)",
                "properties": {
                  "columns": {
                    "description": "column names: Time, then one per detector, then Status",
                    "items": {
                      "type": "string"
                    },
                    "type": ["null", "array"]
                  },
                  "rows": {
                    "description": "one row per 0.68 s interval, values as printed by the analyzer",
                    "items": {
                      "items": {
                        "type": "string"
                      },
                      "type": ["null", "array"]
                    },
                    "type": ["null", "array"]
                  }
                },
                "required": ["columns", "rows"],
                "type": ["null", "object"]
              },
              "upload_id": {
                "type": "string"
              }
            },
            "required": ["channel", "impairments", "intervals", "is_silent", "mos", "upload_id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
