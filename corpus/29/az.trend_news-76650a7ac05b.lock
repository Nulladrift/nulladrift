        {
          "name": "trendaz_taxonomy_search",
          "title": "Find a Trend section",
          "description": "Find the section slug for a subject or a country, so the other tools can be narrowed correctly. Matches on title and slug — \"Kazakhstan\", \"energy\", \"casia\" — and returns the slug to pass as the section argument, along with the public URL of that section. Call it with no query to see the whole section tree of an edition.",
