        {
          "name": "trendaz_front_page",
          "title": "Trend front page right now",
          "description": "What Trend News Agency is leading with at this moment, grouped the way the newsroom groups it: the main story block, the editor's picks, and the regional sections. This is editorial judgement rather than recency — use it for \"what is the news from Azerbaijan today\" or \"what is Trend leading with\", where the answer should be what editors chose rather than whatever was filed last. Metadata only; follow up with trendaz_article_get.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "blocks": {
                "description": "How many blocks to return, in front-page order. Defaults to 5.",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "lang": {
                "description": "Language edition. Defaults to en. Each edition has its own front page chosen by its own desk.",
                "enum": ["en", "az", "ru"],
                "type": "string"
              },
              "per_block": {
                "description": "Maximum articles per block. Defaults to 4.",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "blocks": {
                "type": "array"
              },
              "lang": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "total_articles": {
                "type": "integer"
              }
            },
            "required": ["blocks", "lang"],
            "type": "object"
          },
