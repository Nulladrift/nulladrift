                "enum": ["en", "az", "ru"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum sections to return. Defaults to 20.",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Part of a section name or slug. Omit to list every section.",
                "type": "string"
              }
            },
            "type": "object"
          },
