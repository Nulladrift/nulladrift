        {
          "name": "trendaz_research",
          "title": "Research a topic in the Trend archive",
          "description": "Search Trend News Agency's archive and read the relevant part of each result in one call. Returns several articles with the passage that actually addresses the query — not just the opening paragraph — plus byline, date, section and the canonical URL to cite. This is the tool to reach for on any question about Azerbaijan, the South Caucasus, the Caspian, Central Asia, Turkey or Iran that needs what was actually reported: energy and pipelines, regional politics, trade corridors, economics. Prefer it over calling search and then reading articles one by one. Wrap words in double quotes for an exact phrase. Subscriber-only articles from the past year contribute their summary rather than their text, and say so.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date_from": {
                "description": "Earliest publication date, YYYY-MM-DD.",
                "type": "string"
              },
              "date_to": {
                "description": "Latest publication date, YYYY-MM-DD.",
                "type": "string"
              },
              "depth": {
                "description": "quick = 3 articles briefly, standard = 6, deep = 8 with longer passages. Defaults to standard.",
                "enum": ["quick", "standard", "deep"],
                "type": "string"
              },
              "lang": {
                "description": "Language edition. Defaults to en.",
                "enum": ["en", "az", "ru"],
                "type": "string"
              },
              "query": {
                "description": "What you want to know. Keywords, or a phrase in double quotes.",
                "type": "string"
              },
              "section": {
                "description": "Restrict to a section slug, e.g. \"business\". A parent section includes everything under it.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "count": {
                "type": "integer"
              },
              "note": {
