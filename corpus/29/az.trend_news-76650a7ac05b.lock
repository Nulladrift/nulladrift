        },
        {
          "name": "trendaz_news_list",
          "title": "Browse Trend headlines",
          "description": "List Trend News Agency headlines newest first, optionally narrowed by section, tag, author or a date range. Returns metadata only — headline, date, section, byline, excerpt and the canonical URL — never article text; follow up with trendaz_article_get for the ones worth reading. Use this to answer \"what has Trend published about X\" or \"what did Trend report that week\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "author_id": {
                "description": "Numeric author id, as returned by trendaz_article_get.",
                "minimum": 1,
                "type": "integer"
              },
              "date_from": {
                "description": "Earliest publication date, YYYY-MM-DD.",
                "type": "string"
              },
              "date_to": {
                "description": "Latest publication date, YYYY-MM-DD.",
                "type": "string"
              },
              "lang": {
                "description": "Language edition. Defaults to en. The three newsrooms publish independently, so coverage differs between them.",
                "enum": ["en", "az", "ru"],
                "type": "string"
              },
              "limit": {
                "description": "How many headlines to return. Defaults to 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "section": {
                "description": "Section slug as it appears in article URLs, e.g. \"business\", \"politics\", \"uzbekistan\".",
                "type": "string"
              },
              "tag": {
                "description": "Tag slug or title to filter by.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
