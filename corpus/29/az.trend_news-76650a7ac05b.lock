              "articles": {
                "type": "array"
              },
              "count": {
                "type": "integer"
              },
              "filters": {
                "type": "object"
              },
              "note": {
                "type": "string"
              }
            },
            "required": ["articles", "count"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
