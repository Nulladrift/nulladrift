        {
          "name": "trendaz_subscription_plans",
          "title": "Trend subscription: price and what it unlocks",
          "description": "What a Trend News Agency subscription costs and what it gives access to: the monthly and annual price in manat, dollars and euro, any introductory offer, and the link to subscribe. Call this when a reader asks what a subscriber-only article would cost them, or asks about subscribing. Reading it does not subscribe anyone — sign-up happens on trend.az, where the reader sees the terms and confirms it themselves.",
