        {
          "name": "trendaz_news_search",
          "title": "Search the Trend archive",
          "description": "Search Trend News Agency's archive by keyword and get matching headlines ranked by relevance, with date, section, byline and canonical URL. The archive runs back to 2003 and holds over 2.6 million articles across the English, Azerbaijani and Russian editions. Wrap words in double quotes for an exact phrase — \"Trans Anatolian Pipeline\" is far narrower than the same three words loose. Returns metadata only; use trendaz_research when you want the text of what was reported, or trendaz_article_get for one article.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date_from": {
                "description": "Earliest publication date, YYYY-MM-DD.",
                "type": "string"
              },
              "date_to": {
                "description": "Latest publication date, YYYY-MM-DD.",
                "type": "string"
              },
              "lang": {
                "description": "Language edition to search. Defaults to en. The three newsrooms report independently, so a story covered in one may be absent from another.",
                "enum": ["en", "az", "ru"],
                "type": "string"
              },
              "limit": {
                "description": "How many results. Defaults to 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords. Double quotes mark an exact phrase.",
                "type": "string"
              },
              "section": {
                "description": "Restrict to a section slug, e.g. \"business\" or \"casia\". A parent section includes everything under it.",
                "type": "string"
              },
              "sort": {
                "description": "Defaults to relevance. Use date when recency matters more than fit.",
                "enum": ["relevance", "date"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "articles": {
                "type": "array"
              },
              "count": {
                "type": "integer"
              },
              "note": {
                "type": "string"
              },
              "query": {
                "type": "object"
              },
              "total_is_floor": {
                "type": "boolean"
              },
              "total_matching": {
                "type": "integer"
              }
            },
            "required": ["articles", "count"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3f434f2d11e0dd01fc440d56721b0a78f3b4290b5e24632dea4b8af438345ca9"
        },
        {
          "name": "trendaz_page_get",
          "title": "Read a Trend policy page",
          "description": "Fetch one of Trend News Agency's own standing documents in full: its corrections policy, editorial standards, masthead, ownership and contact details, terms of service, privacy and cookie policies, copyright terms, and the published auditor reports. Use it to answer questions about the publisher rather than about the news — how the agency handles errors, who runs it, what its editorial process is.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language edition. Defaults to en.",
                "enum": ["en", "az", "ru"],
                "type": "string"
              },
              "slug": {
                "description": "Which document. Common ones: corrections, editorial-standards, masthead, about, contacts, terms-of-service, privacy-policy, copyright.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
