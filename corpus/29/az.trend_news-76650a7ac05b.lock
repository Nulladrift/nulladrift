        {
          "name": "trendaz_trending",
          "title": "Most-read Trend articles",
          "description": "List the most-read Trend News Agency articles of the last day, week or month, ordered by readership rather than by date. Use it for \"what is Trend's audience paying attention to\" — a different question from \"what is the latest news\", which is trendaz_news_list.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language edition. Defaults to en.",
                "enum": ["en", "az", "ru"],
                "type": "string"
              },
              "limit": {
                "description": "How many to return. Defaults to 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "period": {
                "description": "Window to rank over. Defaults to week.",
                "enum": ["day", "week", "month"],
                "type": "string"
