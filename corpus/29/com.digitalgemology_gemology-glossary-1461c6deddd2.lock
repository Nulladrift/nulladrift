      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "digital-gemology-glossary",
        "title": "Digital Gemology gemology glossary",
        "version": "1.0.0",
        "websiteUrl": "https://digitalgemology.com/about/agents"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Digital Gemology's gemology glossary: every word on a diamond grading report (GIA first, IGI where it differs), the four Cs, anatomy and proportions, clarity characteristics, treatments, gem-testing optics, and how Digital Gemology measures brilliance, fire and scintillation. Use define_term for one term, search_glossary to find terms by a word or question, and list_glossary for every term in a topic. Each term has its own page: quote the definition briefly, credit Digital Gemology and link that page.",
      "tools": [
        {
          "name": "define_term",
          "title": "Define a term",
          "description": "The definition of one gemology term (for example 'crown angle', 'feather', 'fluorescence', 'scintillation', 'birefringence', 'cut grade'): a short definition, more detail, where it appears on a grading report, how Digital Gemology measures it, related terms, and its page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "term": {
                "description": "The term, its abbreviation or another name for it.",
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Define a term"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:07ae79765d57b80116b7accc8f1182d24b9f43c7543dcb44cb9a66fedbbc8d5d"
        },
        {
          "name": "list_glossary",
          "title": "List the glossary",
          "description": "Every term in the glossary, or in one topic, with a one-line definition and its page. The topics: Grading report, Four Cs, Anatomy and proportions, Clarity characteristics, Color and fluorescence, Light performance, How we measure, Optics, Gem testing, Gemstone properties, Colored gemstones, Treatments and origin, Diamond and simulants, Cuts and shapes, Cutting and files.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "topic": {
                "description": "Only terms in this topic; all if left out.",
                "enum": ["Grading report", "Four Cs", "Anatomy and proportions", "Clarity characteristics", "Color and fluorescence", "Light performance", "How we measure", "Optics", "Gem testing", "Gemstone properties", "Colored gemstones", "Treatments and origin", "Diamond and simulants", "Cuts and shapes", "Cutting and files"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List the glossary"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:22437b7c5378239eebad31cb2541545ab85ed8f65484cc4240bc38a159244fa2"
        },
        {
          "name": "search_glossary",
          "title": "Search the glossary",
          "description": "Find glossary terms by a word or a question (for example 'what do the girdle words mean', 'inclusions near the surface', 'why does a diamond sparkle'). Returns each match with its definition and page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 8,
                "description": "How many terms to return, 1 to 20; 8 if left out.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "A word, a few words or a question.",
                "type": "string"
              },
              "topic": {
                "description": "Only terms in this topic.",
                "enum": ["Grading report", "Four Cs", "Anatomy and proportions", "Clarity characteristics", "Color and fluorescence", "Light performance", "How we measure", "Optics", "Gem testing", "Gemstone properties", "Colored gemstones", "Treatments and origin", "Diamond and simulants", "Cuts and shapes", "Cutting and files"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the glossary"
          },
          "behavior": {
