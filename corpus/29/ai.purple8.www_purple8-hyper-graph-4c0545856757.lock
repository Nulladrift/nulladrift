              "DocumentContextClaims": {
                "description": "Content-derived 4D context-signal fields — the *claim* half of the barcode.\n\nThese are extracted from the document by Purple8-DocIntel and are, by nature,\n*claims* (the document asserting facts about itself), as opposed to the\nengine-stamped high-trust fields (``_ctx.ingested_at`` / ``_ctx.tenant`` /\n``_ctx.ingest_actor``) which the graph engine writes itself.\n\nEvery field is **optional** — the barcode degrades gracefully when a signal is\nabsent (missing → neutral at scoring time, never a penalty).  The ingest\nrouter translates these to reserved ``_ctx.*`` node properties and runs\n:func:`~purple8_graph.core.context_signal.validate_context_types` before\nwriting, so a malformed claim is rejected at the boundary rather than silently\ncorrupting the retrieval scorer downstream.  See ``purple8-company: ip/trade-secrets/context-signal-4d.md``.",
