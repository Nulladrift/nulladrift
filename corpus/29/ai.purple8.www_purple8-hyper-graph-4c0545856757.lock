                "description": "Restrict retrieval to nodes with these labels.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "max_hops": {
                "default": 2,
                "description": "BFS expansion depth (1-5).  Default 2.",
                "type": "integer"
              },
              "max_nodes": {
                "default": 50,
                "description": "Maximum subgraph nodes in context (5-200).  Default 50.",
                "type": "integer"
              },
              "max_tokens": {
                "default": 1024,
                "description": "LLM output token budget.  Default 1024.",
                "type": "integer"
              },
              "mode": {
                "default": "balanced",
                "description": "Fusion mode.  'balanced' for most questions; 'graph_first' for dense-relationship queries; 'vector_first' for semantic similarity.",
                "enum": ["balanced", "graph_first", "vector_first"],
                "type": "string"
              },
              "question": {
                "description": "The question to answer.",
                "type": "string"
              },
              "seed_k": {
                "default": 5,
                "description": "Seed nodes per signal (1-20).  Default 5.",
                "type": "integer"
              },
              "semantic_path_scoring": {
                "default": true,
                "description": "Rank paths by keyword overlap + edge-type bonuses.  Default true.",
                "type": "boolean"
              },
              "temperature": {
                "default": 0,
                "description": "LLM sampling temperature.  Default 0.0.",
                "type": "number"
              },
              "vector_expansion": {
                "default": true,
                "description": "Filter BFS neighbours by cosine similarity.  Default true.",
                "type": "boolean"
              },
              "write_inferred": {
                "default": false,
