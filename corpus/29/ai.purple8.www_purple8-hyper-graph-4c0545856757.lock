      "instructions": "You are connected to Purple8 Hyper Graph — an AI-native complete backend and SOTA software infrastructure in a single process (Unified LPG + RDF + Hypergraph + Vector + Structured Tables + Document Store + Full-Text + Stateful Workflows + Event Bus + RBAC/KMS + Compliance/Audit).\n\n══ 3-PHASE AI-NATIVE APPLICATION LIFECYCLE ══\n1. PHASE 1 — CONFIGURE THE BACKEND OVER MCP (ZERO SERVER LLM OR DOCINTEL REQUIRED):\n   You do NOT need a server-side LLM key or DocIntel configured to build an application. Configure `schema.*`, `graph.*` (Unified LPG + RDF), `data.commit`, `data.get_table`, `data.query_table_rows`, `journey.*`, `scheduler.*`, `egress.*`, `quantum.*`, `guardrails.*`, and `admin.*` directly — they execute deterministically in-process, and YOU (the connected agent) provide the reasoning.\n   • App-generated data, structured records, tables, or entities YOU extract → call `graph.add_node`, `graph.add_edge`, `graph.assert_statement`, or `data.commit` (no DocIntel needed).\n   • External binary documents (70+ formats: PDF, DOCX, XLSX, IFC/BIM, CAD, OCR) → call `data.ingest_file` / `data.ingest_text` (pairs with Purple8 DocIntel when configured).\n   • Zero-LLM retrieval for agents → call `graph.hybrid_search`, `graph.vector_search`, `graph.traverse`, `graph.query`, or `graph.semantic_query`.\n2. PHASE 2 — BUILD THE FRONTEND WHEN ASKED ('FRONTEND-ONLY' APPLICATION PATTERN):\n   Because Purple8 IS the complete backend (DB, graph, vector search, workflows, HITL, RBAC, audit), never scaffold a separate custom backend (no Express/FastAPI/Prisma glue). When the user asks for a UI/frontend, generate a zero-dependency TypeScript SDK with `p8 sdk ts --out src/lib/purple8.ts` (or call REST `/nodes`, `/edges`, `/query`, `/semantic/query`, `/v1/journeys`, `/mcp/invoke`) and build the React/Next.js/Vite UI directly against Purple8.\n3. PHASE 3 — POST-BUILD RUNTIME LLM & MODEL ROUTER CONFIGURATION (POC & PRODUCTION):\n   After the application is built, customers configure their preferred LLM provider (OpenAI, Anthropic, Google/Vertex, AWS Bedrock, Azure OpenAI, Mistral, Cohere, xAI, or local Ollama/vLLM in `/dashboard/ai` / `PUT /ai/config`) or configure the dynamic Model Router via `models.*` (`models.search_known`, `models.upsert`, `models.set_policy`, `models.route_explain`). This powers runtime `rag.query` / `rag.hybrid_query` synthesis, autonomous RAG tuning (`rag.profile_collection` → `rag.tune_collection`), and Journey `ai_step` stage hooks in POC and production.\n\n══ UNIFIED LPG + RDF ON A SINGLE INSTANCE (USE BOTH FOR BEST OUTCOMES) ══\nThe database industry is divided between Property Graphs (LPG) and Semantic RDF — Purple8 runs BOTH natively on the same engine and joins them in a single query:\n  1. LPG (`graph.add_node`, `graph.add_edge`, `graph.traverse`, `graph.query`): Use for operational application entities, mutable state, weights, and vector embeddings.\n  2. RDF (`graph.assert_statement`, `graph.import_nquads`): Use for domain ontologies (FIBO, SNOMED, ISO, IFC/bSDD), regulatory rules, canonical taxonomies, and named-graph provenance quads.\n  3. The LPG ↔ RDF Bridge (`iri_properties` + `graph.semantic_query`):\n     Store an IRI string on any LPG node/edge property (e.g. `{\"jurisdiction_iri\": \"urn:fibo:jurisdiction:VG\"}`), assert RDF quads about that IRI via `graph.assert_statement`, and join LPG patterns (`model='lpg'`, `model='lpg_edge'` with `iri_properties: {\"jurisdiction_iri\": {\"name\": \"jur\"}}`) with RDF quad patterns (`model='rdf'`, `subject: {\"name\": \"jur\"}`) in ONE indexed conjunctive call to `graph.semantic_query`!\n\n══ 176 TOOLS ACROSS 19 NAMESPACES ══\n\nSCHEMA NAMESPACE (schema.*) — read tools require viewer; define/update/delete require admin\n  schema.define_node_type  Define a node type with property constraints (type: string|integer|float|number|boolean|datetime|list|array|dict|object, required, enum, indexed), immutable_properties, and data_classification (public|internal|restricted|highly_restricted).\n  schema.define_edge_type  Define an edge type with source_node_types, target_node_types, and cardinality (one_to_one|one_to_many|many_to_one|many_to_many).\n  schema.validate          Validate live graph nodes/edges against the schema.\n  schema.get / list_node_types / get_node_type / update_node_type / list_edge_types / get_edge_type / update_edge_type\n\nGRAPH NAMESPACE (graph.*) — LPG + RDF + Vector + Analytics\n  graph.add_node          Insert an LPG node. Required: node_id, type (singular label string, e.g. 'Borrower' — NOT 'labels' list). Optional: properties ({}).\n  graph.add_edge          Create a directed LPG edge. Required: source_id, target_id, edge_type. Optional: edge_id (auto-UUID), properties ({}), weight (1.0).\n  graph.update_node       Patch properties or labels on an existing node. Required: node_id.\n  graph.get_node / get_edge / edges_exist (batch check up to 500 pairs) / counts / labels\n  graph.assert_statement  Idempotently assert a native RDF quad: {statement: {subject: {kind:'iri'|'blank', value:...}, predicate: {kind:'iri', value:...}, object: {kind:'iri'|'literal'|'blank', value:...}, graph?: {kind:'iri', value:...}}}.\n  graph.import_nquads     Bulk import RDF 1.1 N-Quads with explicit blank_node_scope.\n  graph.semantic_query    Unified conjunctive query joining RDF quads (model='rdf'), LPG nodes (model='lpg' + iri_properties), and LPG edges (model='lpg_edge') with policy-filtered provenance (supports).\n  graph.hybrid_search     Vector + BFS traversal for highest-recall lookup (zero LLM needed). Required: query_text. Optional: label, k (default 10).\n  graph.vector_search     HNSW k-NN search (zero LLM needed). Required: query_text. Optional: label, k.\n  graph.traverse          Multi-hop neighbourhood walk. Required: node_id. Optional: depth (2), edge_type, direction (both/outgoing/incoming).\n  graph.shortest_path     Weighted Dijkstra shortest path. Required: node_id, target_id.\n  graph.query             Cypher query (MATCH/RETURN/CREATE). Required: cypher. ⚠ Purple8 Cypher is a SUBSET — avoid MERGE, SET, DELETE; use graph.add_node/update_node.\n  graph.pagerank / temporal_pagerank / dynamic_pagerank / communities / dynamic_communities\n  graph.centrality (exact Brandes or approximate with sample_size + pivot_strategy) / structural_roles / rolesim\n  graph.link_prediction / personalised_pagerank / morans_i / local_morans_i\n  graph.triangles / bridges / articulation_points / bipartite_check / bipartite_matching / mst / motifs\n  graph.fraud_rings / simrank / laundering_paths / supply_chain_route / attack_paths / recommend\n  graph.poll_changes / wait_for_changes (CDC event stream) / auto_config\n\nDATA NAMESPACE (data.*) — Direct Commit, Structured Tables & DocIntel Ingestion\n  data.commit               Commit entities, relationships, Markdown chunks, and structured tables directly into Hyper Graph (NO DocIntel required). Pass file_bytes_b64 (base64 of raw_text/markdown) when committing `tables` so a File anchor node is created automatically, and use `links` ([{column, target_label, match, edge}]) to auto-link table rows to graph nodes.\n  data.get_table            Inspect table schema, column_types, and link_rules. Required: table_id.\n  data.query_table_rows     Filter structured table rows. Required: table_id. Optional: where ({col: val}).\n  data.link_table_rows / index_table_columns / replace_file / patch_file_properties / list_file_versions\n  data.ingest_text / data.ingest_file  Route raw text or remote files (PDF/DOCX/XLSX/IFC) through Purple8 DocIntel for automated extraction.\n\nJOURNEY NAMESPACE (journey.*) — Stateful Workflows, SLAs & HITL Gates\n  journey.define       Define a workflow type (MUST call before journey.start). Required: journey_type (snake_case), stages ([{name, owner_system?, description?, sla_warn_seconds?, sla_breach_seconds?}]). Optional: description, overwrite (false).\n  journey.start        Start a workflow instance for an entity. Required: journey_type, entity_id.\n  journey.advance      Advance instance to next stage. Required: instance_id, to_stage. Optional: notes.\n  journey.status / audit / list / sla_alerts / list_hitl / resolve_hitl\n\nAUTOMATION, GOVERNANCE & QUANTUM NAMESPACES\n  scheduler.*   add_trigger (interval/cron/event), list_triggers, remove_trigger, status.\n  egress.*      add_sink (HMAC-signed webhook for CDC event_types: node_added, edge_added, journey_started, stage_advanced, journey_completed, sla_breached, hitl_created, etc.), list_sinks, remove_sink, status.\n  guardrails.*  evaluate (check_type: 'input'|'output'|'structural', text: ...).\n  admin.*       audit_verify (verify hash-chain), hold_place / hold_list / hold_release (legal holds), retention_set (match: {labels: [...]}, retain_days: N, action: 'purge'|'archive'|'anonymise'), retention_list, retention_sweep, recovery_status, smtp_status.\n  quantum.*     optimize, anneal, simulate, encode_state, measure, vqe_step, compare, profile.\n  evolution.*   create_experiment, suggest, report, propose, production, rag_retrieval, routing_policy.\n  sentinel.*    summary, list_findings, get_finding, reject, drift_check.\n  registry.*    register_tool, register_mcp_server, register_a2a_agent, list_tools, test_tool.\n  feedback.*    record, open, summary, resolve.  |  memory.*  history, search.\n  models.*      list, search_known, upsert, remove, get_policy, set_policy, route_explain.\n  rag.*         profile_collection, tune_collection, rerank, query, graph_query, hybrid_query.\n\n══ COMMON MISTAKES TO AVOID ══\n• `graph.add_node` param is `type` (singular string), NOT `labels` (list).\n• `journey.define` MUST be called before `journey.start` for a new `journey_type`.\n• `data.get_table` and `data.query_table_rows` take `table_id` (from `data.commit` → `structured_content.linked_tables`), NOT `doc_id`.\n• `admin.retention_set` requires `match: {\"labels\": [\"...\"]}`, `retain_days` (>0), and `action` (`'purge'`, `'archive'`, or `'anonymise'`).\n• `fusion_alpha` overrides `mode` in `rag.hybrid_query` — do not pass both.\n• Tools marked `human_only` (`graph.delete_node`, `graph.delete_edge`, `graph.retract_statement`, `schema.delete_node_type`, `schema.delete_edge_type`, `admin.smtp_configure`) are blocked for API-key agents; surface them to a human operator.",
      "tools": [
        {
          "name": "data.commit",
          "description": "Commit a reviewed extraction or your own extractor's output without invoking DocIntel. Uses the complete POST /ingest/commit contract: entities, relationships, Markdown, spans, tables/pages, context, file_ref or inline file_bytes_b64 and ingestion options. Existing entities are linked, not edited, unless update_entities=true. For extractor-generated IDs use identity_policy='review_conflicts': name matches alone are not identity proof. On entity_identity_conflict nothing was written; correct/exclude the incoming entity and update relationship endpoints, or explicitly confirm identity_resolution='link_existing', then retry. link_existing never edits existing facts. After interruption or a lost response, ask the user to confirm retrying the retained reviewed payload. Reuse entity IDs, assertion keys and file_ref; do not automatically re-extract. Retain metadata.sha256 (original bytes) and optional metadata.file_version. On source_version_conflict nothing was written: obtain and review current-source extraction and ask for confirmation, rather than replaying or relabeling the old review. SIMILAR_TO edges (enabled by default) are similarity, not factual assertions. Inspect embedding, document_chunks, structured_content and original_file outcomes; a successful write alone does not guarantee retrieval readiness. Requires editor role.",
