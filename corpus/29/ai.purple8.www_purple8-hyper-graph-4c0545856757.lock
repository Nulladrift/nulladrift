        {
          "name": "rag.hybrid_query",
          "description": "Hybrid Graph-Vector RAG — fuses vector similarity AND graph structural signals at every stage: dual-seed fusion (Weighted RRF over vector rank + degree centrality), vector-guided BFS, and semantic path scoring.  Highest accuracy: MRR 0.85, multi-hop 0.91.  ~5x slower (p50 ~240 ms).  Recommended as the default RAG tool for agents that need high quality.",
          "inputSchema": {
            "properties": {
              "collection_profile": {
                "description": "Name of a saved CollectionProfile (from rag.tune_collection save_as).  Fills in mode/fusion_alpha/max_hops/seed_k as defaults — explicit params always win.",
