      "instructions": "Dubai Table books tables for Dubai's best nights: The List at Billionaire (Sunday), We Ain't Saints at Raspoutine (Tuesday), Decadence at Verde (Wednesday), plus direct table booking at Billionaire, Gigi Rigolatto, Bagatelle, Le Piaf, Verde and Raspoutine every night they are open.\nFlow: whats_on or list_venues → check_availability (venue + date, optionally party/zone/budget) → request_table with the guest's name and mobile → share the booking reference; there is no booking fee and no payment link. Never invent prices, minimum spends or line-ups: quote only what the tools return. Minimum spends are per table, in AED, fully redeemable on food and drink. No booking fee: requesting a table through Dubai Table is free, and your relationship manager confirms it on WhatsApp. Every table remains subject to the venue’s confirmation. The table’s minimum spend is separate. Dubai Table does not own most of these venues — CouCou is Dubai Table's own room; every other room is run by its own operator. Only events flagged rize_night are Dubai Table's own nights.\nUCP clients: this server also binds dev.ucp.shopping.checkout (create/get/update/complete/cancel_checkout); profile at https://rizelists.com/.well-known/ucp.",
