        {
          "name": "create_checkout",
          "title": "UCP: create checkout",
          "description": "Universal Commerce Protocol checkout. Creates a checkout session for one or more table requests. line_items[].item.id uses the grammar rz:<venue>:<table_id|zone:<Zone>|any>:<YYYY-MM-DD>:<party>. Returns the full UCP checkout resource (status incomplete | ready_for_complete | requires_escalation | completed | canceled).",
          "inputSchema": {
            "properties": {
              "checkout": {
                "properties": {
                  "buyer": {
                    "properties": {
                      "email": {
                        "type": "string"
                      },
                      "first_name": {
                        "type": "string"
                      },
                      "last_name": {
                        "type": "string"
                      },
                      "phone_number": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "context": {
                    "type": "object"
                  },
                  "line_items": {
                    "items": {
                      "properties": {
                        "item": {
                          "properties": {
                            "id": {
                              "type": "string"
                            }
                          },
                          "required": ["id"],
                          "type": "object"
                        },
                        "quantity": {
                          "type": "integer"
                        }
                      },
                      "required": ["item"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "required": ["line_items"],
                "type": "object"
              },
              "meta": {
                "properties": {
                  "idempotency-key": {
                    "type": "string"
                  },
                  "ucp-agent": {
                    "properties": {
                      "profile": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  }
                },
                "type": "object"
