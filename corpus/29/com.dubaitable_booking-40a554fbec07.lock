        {
          "name": "request_table",
          "title": "Request a table",
          "description": "Place a real table request with Dubai Table. Records the request, returns a booking reference (there is no booking fee and no payment link) and alerts the guest's relationship manager, who confirms with the venue on WhatsApp. Requires the guest's name and mobile number with country code. Accepts an exact table_id, a zone, or neither (the relationship manager places the party).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "Kept for compatibility. There is no booking fee.",
                "enum": ["AED", "USD"],
                "type": "string"
              },
              "date": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "email": {
                "type": "string"
              },
              "name": {
                "description": "Guest name for the booking",
                "type": "string"
              },
              "notes": {
                "maxLength": 600,
                "type": "string"
              },
              "occasion": {
                "description": "birthday, anniversary, business, celebration…",
                "type": "string"
              },
              "party": {
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "phone": {
                "description": "Guest mobile with country code, e.g. +971501234567",
                "type": "string"
              },
              "source": {
                "description": "Which agent/app is booking, e.g. \"chatgpt\", \"claude\", \"concierge-x\"",
                "type": "string"
              },
              "table_id": {
                "description": "Exact table id as listed in table availability",
                "type": "string"
              },
              "time": {
                "description": "Arrival time, e.g. 21:00",
                "type": "string"
              },
              "venue": {
                "type": "string"
              },
              "whatsappConsent": {
                "description": "True only if the guest explicitly agrees to WhatsApp booking updates from Dubai Table.",
                "type": "boolean"
              },
              "zone": {
                "description": "Preferred zone if no table_id",
                "type": "string"
              }
            },
            "required": ["date", "name", "party", "phone", "venue"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
