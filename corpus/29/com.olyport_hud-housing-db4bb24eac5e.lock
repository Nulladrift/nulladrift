            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5552efbba2ca0bcf7e58466b2389cd8d33e695d88d375f58b3d86a5fee49c08e"
        },
        {
          "name": "get_public_housing",
          "description": "Get public housing buildings and developments in a state.\n\n    Queries HUD's open ArcGIS data for public housing inventory.\n    No API key required. Returns building names, addresses, unit counts,\n    and managing Public Housing Agency information.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'WA', 'TX').\n        city: Optional city name to filter results.\n        limit: Maximum number of records to return (default 50, max 500).\n    ",
          "inputSchema": {
