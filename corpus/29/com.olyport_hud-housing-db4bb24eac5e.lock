              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_housing_vouchersOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a8890a93cefb307b6ad91a8da935fccf227fcf182a1270074d1409b9dae685eb"
        },
        {
          "name": "get_income_limits",
          "description": "Get HUD income limits (very low, low, median) by family size.\n\n    Returns income limit data used to determine eligibility for HUD\n    assisted housing programs. Requires HUD User API token.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'CA', 'NY').\n        county_fips: Optional 5-digit county FIPS code (e.g. '06037').\n                     If omitted, returns data for all areas in the state.\n        year: Income limit fiscal year (default 2024).\n    ",
          "inputSchema": {
            "properties": {
              "county_fips": {
                "default": null,
                "title": "County Fips",
                "type": "string"
              },
              "state": {
                "title": "State",
                "type": "string"
              },
              "year": {
                "default": 2024,
