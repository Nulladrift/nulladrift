        {
          "name": "get_fair_market_rents",
          "description": "Get HUD Fair Market Rent (FMR) values for 0-4 bedroom units.\n\n    Returns FMR data used to determine Housing Choice Voucher payment\n    standards and other HUD program parameters. Requires HUD User API\n    token; returns registration guidance if token is not configured.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'CA', 'WA').\n        county_fips: Optional 5-digit county FIPS code (e.g. '06037' for LA County).\n                     If omitted, returns statewide FMR data.\n        year: FMR fiscal year (default 2024).\n    ",
          "inputSchema": {
            "properties": {
              "county_fips": {
                "default": null,
                "title": "County Fips",
                "type": "string"
              },
              "state": {
                "title": "State",
                "type": "string"
              },
              "year": {
                "default": 2024,
                "title": "Year",
                "type": "integer"
              }
            },
            "required": ["state"],
            "title": "get_fair_market_rentsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_fair_market_rentsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e324401e437be3479f9ad7cbb8dc922418a14aec23da7094848e5e6f38d5c73a"
        },
        {
          "name": "get_homeless_data",
          "description": "Get Point-in-Time (PIT) homeless count data by Continuum of Care region.\n\n    Returns homeless population counts from the annual PIT count, broken\n    down by sheltered/unsheltered status and sub-populations. Data sourced\n    from HUD Exchange via ArcGIS open data. No API key required.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'CA', 'WA').\n                At least one of state or coc_code must be provided.\n        coc_code: Optional Continuum of Care code (e.g. 'WA-500', 'CA-600').\n        year: Optional year to filter results.\n    ",
          "inputSchema": {
            "properties": {
              "coc_code": {
                "default": null,
                "title": "Coc Code",
                "type": "string"
              },
              "state": {
                "default": null,
                "title": "State",
                "type": "string"
              },
              "year": {
                "default": null,
                "title": "Year",
                "type": "integer"
              }
            },
            "title": "get_homeless_dataArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_homeless_dataOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b3f4b37c1aa1d5870429c9bc8903bc24632a820d918eb39261db6a3198bb96c7"
        },
        {
          "name": "get_housing_vouchers",
          "description": "Get Housing Choice Voucher (Section 8) program data by Public Housing Agency.\n\n    Returns information about voucher programs administered by PHAs in\n    the specified state, including total vouchers, utilization rates,\n    and spending. Queries HUD ArcGIS open data (no auth required).\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'CA', 'NY').\n        limit: Maximum number of records to return (default 50, max 500).\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 50,
                "title": "Limit",
                "type": "integer"
              },
              "state": {
                "title": "State",
                "type": "string"
              }
            },
            "required": ["state"],
            "title": "get_housing_vouchersArguments",
            "type": "object"
          },
          "outputSchema": {
