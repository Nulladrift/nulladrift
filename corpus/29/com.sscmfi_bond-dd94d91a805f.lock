  "subjects": {
    "com.sscmfi/bond": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.sscmfi.com/api/sscmfiMCPAPI"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "sscmfi-bond-mcp",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "calculate_bond_periodic",
          "title": "Calculate Periodic Bond Price/Yield",
          "description": "Calculate price, yield, and accrued interest for Periodic bonds. Powered by the Standard Securities Calculation Methods - Fixed Income (https://api.sscmfi.com).",
          "inputSchema": {
            "properties": {
              "callSchedule": {
                "description": "Optional. List of discrete call dates and prices. AI Hint: The engine will automatically calculate the Yield-to-Worst using this schedule.",
                "items": {
                  "properties": {
                    "date": {
                      "description": "Required format: MM/DD/YYYY.",
                      "type": "string"
                    },
                    "price": {
                      "type": "number"
                    }
                  },
                  "required": ["date", "price"],
                  "type": "object"
                },
                "type": "array"
              },
              "couponRate": {
                "description": "Annual coupon rate as a percentage (e.g., 5.0 for 5%). Use 0 for zero coupon bonds.",
                "type": "number"
              },
              "givenType": {
                "description": "Are you providing the clean Price or the Yield to find the other?",
                "enum": ["Price", "Yield"],
                "type": "string"
              },
              "givenValue": {
                "description": "The numeric value of the Price (e.g. 98.75) or Yield (as a percent e.g. 4.25).",
                "type": "number"
              },
              "maturityDate": {
                "description": "The date the principal is due. Required format: MM/DD/YYYY (e.g., 01/05/2030). AI: Must use leading zeros and 4-digit years. (Ensure this is in the future relative to settlement).",
                "type": "string"
              },
              "securityType": {
                "description": "Crucial for math accuracy. Treasury: Usually uses Actual/Actual. Corporate/Agency/Municipal: Usually uses 30/360. CD: Usually uses Actual/360.",
                "enum": ["Treasury", "Agency", "Corporate", "Municipal", "CD"],
                "type": "string"
              },
              "settlementDate": {
                "description": "Optional. Defaults to today. The date the money actually changes hands. Required format: MM/DD/YYYY (e.g., 07/04/2025).",
                "type": "string"
              }
            },
            "required": ["couponRate", "givenType", "givenValue", "maturityDate", "securityType"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Calculate Periodic Bond Price/Yield"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:23f207959117aa43c6b036ea7b5434d12d1d9e6ae86ba003ceecf05a23dfa84a"
        }
      ],
      "digest": "sha256:a7ca200879cdbb56d7f32445fb4f7387d711506561f3d131cfa817a0f19de501"
    }
  }
