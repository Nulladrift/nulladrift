      "serverInfo": {
        "name": "industrylens-public",
        "version": "0.1.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "IndustryLens Public — live competitive intelligence on the B2B SaaS markets IndustryLens monitors (sales intelligence, AI-search & brand visibility, GTM engineering, spend management), plus published reports and head-to-head comparisons.\n\nQuery tools (reach for these first):\n  • get_competitive_profile — USE WHEN the user asks who competes with a company, what a competitor recently did, or for a competitive overview of a domain. Input a domain or name → profile + recent strategic moves + linked reports.\n  • list_competitor_moves   — recent tracked moves for one competitor, newest-first.\n  • find_competitors        — who competes with a given company.\n\nCatalog tools:\n  • list_reports        — browse published reports (filter by industry / target_role)\n  • get_report          — full body of a report by slug\n  • list_comparisons    — browse competitor-vs-competitor breakdowns\n  • get_comparison      — full body of a comparison by slug\n  • subscribe_to_newsletter — sign the user up for weekly briefings (consent required)\n\nAll tools return real data from industry-lens.com. The public tier shows facts\nabout companies and the existence of strategic shifts (with the real analysis\ndate) — never a customer's private data, and never a fabricated date. Quote\nslugs/URLs back so the user can verify. A { covered: false } result means the\ncompany isn't publicly tracked yet — surface the CTA. Subscribe only after the\nuser explicitly asks.",
      "tools": [
        {
          "name": "find_competitors",
          "title": "Find who competes with a company",
          "description": "Use when the user asks who else competes in a company's market, or wants a peer/competitor set for a given company. Given a company domain or name, returns the other companies IndustryLens tracks in the same market. Returns { covered: false } for companies not publicly tracked.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Company domain or homepage URL (e.g. 'apollo.io'). Preferred.",
                "type": "string"
              },
              "limit": {
                "description": "Max competitors (default 10, max 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Company name (e.g. 'Apollo'). Used when no domain is given.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7e82d4c90282881fc4be49aa2898ae475c358d76f2e187afcf11be62867962ff"
        },
        {
          "name": "get_comparison",
          "title": "Get a full IndustryLens comparison",
          "description": "Use when the user wants the full head-to-head detail for one published comparison (after finding its slug via list_comparisons). Fetches the full structured body of a published competitor comparison by slug. Returns content_json (the structured breakdown: pricing, recent moves, positioning, displacement signals, when-to-choose, etc.) plus metadata.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Comparison slug from list_comparisons.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9396c9a52568bf0f2af1154bdddfa19b222373614919b2aa2e740a72d65eb402"
        },
        {
          "name": "get_competitive_profile",
          "title": "Get a competitive profile for a company",
          "description": "Use when the user asks who competes with a company, what a competitor recently did, or for a competitive overview of one or more domains. Input a company domain or name and get a privacy-safe profile: firmographics (business model, stage, HQ, plus `firmographics.funding_stage` / `last_raise` / `investors` / `employee_count` — these read `collected: false` with a plain 'not yet collected' note until that enrichment source is wired up, never a guess), recent strategic moves (the existence of a shift + a was→now summary, with the real analysis date), and links to published reports/comparisons. Returns { covered: false } for companies IndustryLens doesn't publicly track. Pass `companies` (up to 10 names/domains) instead of domain/name to look up several companies in one call — each gets its own result block, in the order given, each tagged with a `status` (account / public / not_covered / ambiguous).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "companies": {
                "description": "Batch alternative to domain/name: up to 10 company names or domains. Omit domain/name when using this. Returns one profile per entry, in input order.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "domain": {
                "description": "Company domain or homepage URL (e.g. 'apollo.io'). Preferred — most precise.",
                "type": "string"
              },
              "name": {
                "description": "Company name (e.g. 'Apollo'). Used when no domain is given.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7efcefe518195acdbe817833f543c46a6feb4a7fae4fcef26ab08573c8dbdb95"
        },
        {
          "name": "get_competitor_moves_diff",
          "title": "Get a competitor's dated change feed",
          "description": "Use when the user asks what changed, what's new, or wants a timeline of a competitor's moves. Returns the dated CHANGE-FEED for one competitor: every real was→now strategic shift IndustryLens detected, newest-first, each stamped with its real analysis date (never a fabricated date) — optionally since a given date. Input a domain or name. Returns { covered: false } with a CTA for companies not publicly tracked. Pass `companies` (up to 10 names/domains) instead of domain/name to get a change feed for several competitors in one call — each gets its own result block, in the order given.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "companies": {
                "description": "Batch alternative to domain/name: up to 10 company names or domains. Omit domain/name when using this. Returns one change feed per entry, in input order; `since`/`limit` apply to every entry.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "domain": {
                "description": "Company domain or homepage URL (e.g. 'apollo.io'). Preferred — most precise.",
                "type": "string"
              },
              "limit": {
                "description": "Max moves (default 20, max 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Company name (e.g. 'Apollo'). Used when no domain is given.",
                "type": "string"
              },
              "since": {
                "description": "Optional ISO date (YYYY-MM-DD). Only moves analyzed on/after this date are returned.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:516248b0dc5dca49aef43ef0385be3e34d5df57274bccc4f65247be815020526"
        },
        {
          "name": "get_market_landscape",
          "title": "Get the whole-category map for a market",
          "description": "Use when the user wants an overview of a whole market/category — every player in it, not just a self-selected competitor set. Given a market (a vertical slug or name), returns the published category overview plus every player IndustryLens tracks in that market — the whole-CATEGORY map, not a self-selected competitor set. Returns the hub (title, abstract, tldr, hero_stats, url), the deduped list of players (name, domain, business_model), and `market_news` — the latest weekly market summary (narrative, top topics, new entrants, topic momentum, source URLs). Returns { covered: false } for markets IndustryLens doesn't publicly track. Use list_markets to discover slugs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "market": {
                "description": "A vertical slug (exact) or market name (ILIKE), e.g. 'sales-intelligence' or 'sales intelligence'.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["market"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:84eb0ba241f61bc5fa62221fcc21c31f5ea89c9ba564fb1fd6cc54389222a200"
        },
        {
          "name": "get_pricing_changes",
          "title": "Get recent competitor pricing changes",
          "description": "Use when the user asks about a competitor's pricing/packaging changes, or wants a recent pricing-change feed. Returns structured pricing/packaging changes IndustryLens has detected — each with a change_type, severity, materiality score, a plain-language summary, and the real detection date. Pass a `competitor` (name or domain) to scope to one company, or omit it for a recent pricing feed. Pass `competitors` (up to 10 names/domains) instead to get a feed per company in one call, each in input order. The feed spans the markets IndustryLens publicly tracks. No other public source exposes structured competitor pricing-diffs like this.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "competitor": {
                "description": "Competitor name or domain (e.g. 'Apollo' or 'apollo.io'). Omit for a market-wide recent pricing feed.",
                "type": "string"
              },
              "competitors": {
                "description": "Batch alternative to `competitor`: up to 10 competitor names or domains. Omit `competitor` when using this. Returns one pricing feed per entry, in input order; `since`/`limit` apply to every entry.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "limit": {
                "description": "Max changes (default 20, max 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "ISO date lower bound for detection (e.g. '2026-01-01'). Defaults to 90 days ago.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5daa5cf1c9c8db48a9180f5af4d0ef854f7eec38a6ff898578f3287889d4cf5a"
        },
        {
          "name": "get_report",
          "title": "Get a full IndustryLens report",
          "description": "Use when the user wants the full text of one published IndustryLens report (after finding its slug via list_reports). Fetch the full body of a published report by slug. Returns the report's structured fields plus content_html (the canonical body) and the report's web URL. There is no standalone hosted PDF file — `pdf_url` is always null (verified live: the marketing_reports.pdf_url column is unpopulated for every published report; an earlier version of this description incorrectly claimed a real generated-PDF link existed). A PDF IS available, but gated by design: `pdf_download.url` is the report's own web page, where a 'Download PDF' button opens after the reader submits a work email (IndustryLens's deliberate lead-capture gate) and then renders the PDF client-side in the browser via print-to-PDF — there is no URL an MCP client (or anything else) can fetch directly to get the PDF bytes. Never construct or guess a .pdf URL yourself; point the user at `pdf_download.url` (same as `url`) and tell them a work email is required.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Report slug from list_reports (e.g. '/devops-hiring-q1-2026' or 'devops-hiring-q1-2026').",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f834a462b26bc6268b3b641aaa3e0a021e225afa23c1e936c2549b71214ab3df"
        },
        {
          "name": "list_comparisons",
          "title": "List IndustryLens head-to-head comparisons",
          "description": "Use when the user wants to browse published competitor-vs-competitor breakdowns, or find one involving a specific competitor, rather than fetch one specific comparison by slug. Optionally filter by a competitor name (matches either side). Each item has a slug usable with get_comparison. URLs follow https://industry-lens.com/compare/<slug>.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "competitor": {
                "description": "Competitor name filter (matches either side, ILIKE).",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10, max 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:247b1103b4665aac96ee9b82182cf088e4b348fe779b265288d9572f76301c0a"
        },
        {
          "name": "list_competitor_moves",
          "title": "List a competitor's recent moves",
          "description": "Use when the user asks what a specific competitor has recently done or changed. Returns recent tracked strategic moves for one competitor, newest-first — the existence of each shift plus a was→now summary and the real analysis date (never a fabricated date). Returns { covered: false } for companies IndustryLens doesn't publicly track, and an empty list for covered companies with no moves detected yet.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "competitor": {
                "description": "Competitor name or domain (e.g. 'Apollo' or 'apollo.io').",
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "description": "Max moves (default 10, max 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["competitor"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:514cd8aef3caf84b33643c7677af6fcbc35510a35a18a9ad6463e605217c2ea9"
        },
        {
          "name": "list_markets",
          "title": "List the markets IndustryLens tracks",
          "description": "Use when the user wants to know which B2B SaaS markets/categories IndustryLens tracks, or needs a slug for get_market_landscape. Returns the list of markets, ordered by name. Each item has a `slug` usable with get_market_landscape for the full category map.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d93c91f40e065dd8fc618d501e25ed82bd3b2932d318aebca1156d213260bf1f"
        },
        {
          "name": "list_reports",
          "title": "List IndustryLens intelligence reports",
          "description": "Use when the user wants to browse or discover published competitive-intelligence reports (e.g. by topic, role, or industry) rather than fetch one specific report by slug. Filter by industry or target_role; results are ordered newest-first. Each returned item has a slug usable with get_report. URLs follow https://industry-lens.com/reports/<slug>.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "industry": {
                "description": "Industry filter, ILIKE match (e.g. 'hr tech', 'devops', 'fintech').",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10, max 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "target_role": {
                "description": "Target role filter, ILIKE match (e.g. 'marketing', 'sales', 'product').",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c8aebb879e8b4b058c93bfe42b13d0752c8dd34f3f758c6325dbaac60bdc0ae9"
        },
        {
          "name": "subscribe_to_newsletter",
          "title": "Subscribe to IndustryLens weekly briefings",
          "description": "Use ONLY after the user explicitly asks to subscribe to IndustryLens's weekly intelligence-report newsletter — never subscribe an email without their direct, informed consent. Signs the given email up and returns a confirmation. The source argument is recorded for attribution and defaults to 'mcp'.",
