        {
          "name": "market_brief",
          "title": "Competitive market brief for a company",
          "description": "Build a dated, cited competitive brief for one company using the public IndustryLens tools (get_competitive_profile + get_competitor_moves_diff).",
          "arguments": [
            {
              "name": "company",
              "description": "Company name or domain (e.g. 'Apollo' or 'apollo.io').",
              "required": true
