                "format": "email",
                "type": "string"
              },
              "source": {
                "description": "Where the request came from (e.g. 'mcp_claude_desktop'). Defaults to 'mcp'.",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
