        {
          "name": "directiq_read_request",
          "description": "Issue an authenticated GET request to any DirectIQ endpoint and return the JSON response. Prefer a dedicated directiq_* tool when one exists; use this for read operations without one, found with directiq_list_endpoints (e.g. segments for a contact, email client reports). Full request/response schemas for each group are in the DirectIQ API docs at https://rest.directiq.com/{group}/swagger/index.html (core, contacts, subscription).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "group": {
                "description": "DirectIQ API group: core, contacts, or subscription",
                "enum": ["core", "contacts", "subscription"],
                "type": "string"
              },
              "path": {
                "description": "Endpoint path within the group, e.g. '/contact/list' or '/email/send'",
                "minLength": 1,
                "pattern": "^\\/",
                "type": "string"
              },
              "query": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean"]
                },
                "description": "Optional query parameters",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              }
            },
            "required": ["group", "path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
