        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.youraitools.co/toolpick/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "toolpick",
        "title": "ToolPick",
        "version": "0.1.3"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Call find_paid_api with the capability you need (e.g. \"web search\", \"solana token safety\", \"pdf to text\") to see how many paid x402 APIs offer it and the top 3 services with price and 30-day payers. Resource URLs, live 402 checks and a best verified pick are on the paid x402 routes (/v1/lite, /v1/pick); /v1/market gives sellers the competition and pricing picture. Listings are self-described by sellers; ToolPick ranks, it does not endorse.",
      "tools": [
        {
          "name": "find_paid_api",
          "title": "Find a paid x402 API for a task (free preview)",
          "description": "Which paid API should my agent call? Searches the 36,000+ paid x402 resources on the public x402 discovery indexes and returns how many match your need, how many seller hosts there are, and the top 3 services ranked by relevance, 30-day unique payers and calls, recency and price (service name, USD price, networks, payers). Optional max_price and network filters. Free preview tier. The paid x402 routes add resource URLs and usage detail for the top 5 (/v1/lite), live 402 checks of the top candidates with a best verified pick (/v1/pick) and a market report with price quartiles and top sellers (/v1/market).",
          "inputSchema": {
            "properties": {
              "max_price": {
                "description": "Only resources priced at or below this many USD per call, e.g. 0.01",
                "type": "number"
              },
              "need": {
                "description": "The capability you need, in plain words, e.g. \"solana token safety\", \"web search\", \"pdf to text\", \"hyperliquid funding rates\" (2-200 chars)",
                "type": "string"
              },
              "network": {
                "description": "Only resources payable on this network (default any)",
                "enum": ["any", "base", "solana", "polygon", "arbitrum", "optimism", "ethereum", "avalanche"],
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3fcdbc8fc07fa10d0f9a0567b4ca507afdbaa3cfd9bd7a47e8d5f67e9f108e57"
        }
      ],
      "digest": "sha256:eb5d9311753572dbf9758aeb99a54fa0f28fdc6a8e56dabd2eedcd487b72ef66"
    }
  }
