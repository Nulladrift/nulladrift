            "openai/toolInvocation/invoked": "Read directory coverage",
            "openai/toolInvocation/invoking": "Reading directory coverage",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:6e17e9caf4e13ee8e479a7a1a656ae8fd31486358460f28f17844d8d1821f702"
        },
        {
          "name": "get_prep_center",
          "title": "Get one prep center profile",
          "description": "Use this to look up the full verified record for a single Amazon FBA prep center by its slug, after search_prep_centers has returned that slug. Do not guess slugs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "The center slug exactly as returned by search_prep_centers.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "openai/toolInvocation/invoked": "Retrieved the center record",
            "openai/toolInvocation/invoking": "Looking up the center",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:06c53e08b459c915c9c46df4ba431e0a2046ca44e8212abada0e565cfcf9ac9a"
        },
        {
          "name": "search_prep_centers",
          "title": "Search verified FBA prep centers",
          "description": "Use this when the user wants to find, compare, or filter Amazon FBA prep centers by name, US state, country, operator type, hazmat capability, or sales-tax-free location. Returns editorially verified centers with the date each was last verified and a link to its full profile. Do not use this for general Amazon FBA policy questions, FBA fee calculations, or for finding Amazon fulfillment centers.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "accepting_new_clients_only": {
                "type": "boolean"
              },
              "country": {
                "description": "Country code. Defaults to all countries.",
                "enum": ["US", "GB", "DE", "CA"],
                "type": "string"
              },
              "hazmat_confirmed_only": {
                "description": "Only centers we have positively confirmed accept hazmat. Most records are unconfirmed rather than negative, so this narrows results sharply.",
                "type": "boolean"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "operator_type": {
                "description": "prep_specialist is prep only, multi_service adds adjacent services, full_3pl is a full fulfillment provider. Small Amazon-only sellers usually want prep_specialist.",
                "enum": ["prep_specialist", "multi_service", "full_3pl"],
                "type": "string"
              },
              "q": {
                "description": "Case-insensitive name search. Use this when the user names a specific prep center, for example 'Urva'. Matches anywhere in the center name.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state or Canadian province code the user explicitly named, for example 'TX'. Do not infer this from the user's location.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "tax_free_state_only": {
                "description": "Only centers in US sales-tax-free states (NH, OR, DE, MT, AK).",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
