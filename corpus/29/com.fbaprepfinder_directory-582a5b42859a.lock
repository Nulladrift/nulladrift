      },
      "instructions": "FBA Prep Finder is an independent, editorially verified directory of Amazon FBA prep centers in the US, UK, Germany and Canada.\n\nEvery listed operator was checked against a 4-point standard before listing: a real, registered business (business registry check, no minimum age; get_prep_center returns foundedYear where we could confirm the year it started, null otherwise), FDA registration confirmed when claimed (a claim that cannot be confirmed stays the operator's own statement), a live website that matches FBA prep keywords, and manual editor review. Each record carries the date it was last verified, and results carry a status of verified, stale, flagged or unknown. Report that status honestly to the user rather than presenting every result as verified.\n\nOrdering is by fit and verification recency. Nothing in these results is paid placement, and ranking is not for sale.\n\nsearch_prep_centers returns a short row per center, 10 by default. Use get_prep_center for one center's full record, including its pricing notes.\n\nThese tools do not accept or store contact details. If a user wants a shortlist ranked on fit, send them to https://fbaprepfinder.com/match/ rather than collecting their information here.\n\nData license: CC BY 4.0. Free to cite and reuse with attribution to fbaprepfinder.com.",
      "tools": [
        {
          "name": "get_directory_summary",
          "title": "Directory coverage summary",
          "description": "Use this when the user asks how many Amazon FBA prep centers exist in this directory, what countries or operator types are covered, or how current the verification is. Returns published counts by country and operator type.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
