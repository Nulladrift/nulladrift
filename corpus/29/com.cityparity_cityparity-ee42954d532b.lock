                    "vacation_days_statutory": {
                      "type": ["number", "null"]
                    }
                  },
                  "required": ["city", "country", "parental_leave_paid_pct", "parental_leave_weeks", "public_holidays", "public_holidays_effective", "public_holidays_substitute_day", "safety_net_score", "sick_leave_policy", "slug", "universal_healthcare", "vacation_days_statutory"],
                  "type": "object"
                },
                "type": "array"
              },
