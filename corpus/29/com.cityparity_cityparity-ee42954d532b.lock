              },
              "slug": {
                "type": "string"
              },
              "tax": {
                "additionalProperties": true,
                "properties": {},
                "type": "object"
              }
            },
            "required": ["compensation_index", "cost_snapshot", "country", "currency", "data_last_updated_field", "data_year_range", "govt_benefits", "inbound_tax_regime", "methodology_url", "name", "safety_net", "slug", "tax"],
            "type": "object"
          },
