                  "maxLength": 64,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["cities"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cities": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "city": {
                      "type": "string"
                    },
                    "country": {
                      "type": "string"
                    },
                    "parental_leave_basis": {
                      "enum": ["percentage", "flat", "capped", "mixed", "unpaid", "unknown", "none"],
                      "type": "string"
                    },
                    "parental_leave_capped": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "cap_amount": {
                              "type": ["number", "null"]
                            },
                            "cap_period": {
                              "type": ["string", "null"]
                            },
                            "currency": {
                              "type": ["string", "null"]
                            },
                            "income_eligibility_ceiling": {
                              "type": ["number", "null"]
                            },
                            "label": {
                              "type": ["string", "null"]
                            },
                            "pct": {
                              "type": ["number", "null"]
                            },
                            "weeks": {
                              "type": "number"
                            }
                          },
                          "required": ["cap_amount", "cap_period", "currency", "income_eligibility_ceiling", "label", "pct", "weeks"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "parental_leave_effective_pct_at_benchmark": {
                      "type": ["number", "null"]
                    },
                    "parental_leave_flat": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "currency": {
                              "type": ["string", "null"]
                            },
                            "label": {
                              "type": ["string", "null"]
                            },
                            "weekly_amount": {
                              "type": ["number", "null"]
                            },
                            "weeks": {
                              "type": "number"
                            }
                          },
                          "required": ["currency", "label", "weekly_amount", "weeks"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "parental_leave_note": {
                      "type": ["string", "null"]
                    },
