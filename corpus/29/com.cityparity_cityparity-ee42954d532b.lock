        {
          "name": "get_city_summary",
          "title": "Get a one-city profile",
          "description": "Concise profile of one city: currency, tax shape (bracket count + top rate + payroll/national insurance), headline costs (rent / groceries / transit / childcare), safety-net values (parental leave, vacation, universal healthcare), and data freshness. Lighter than compare_cities; use when the user is asking about one place rather than a comparison. On parental leave, quote safety_net.parental_leave_summary rather than building your own sentence: some countries (Ireland, Australia, the UK, Czechia, part of Sweden) pay a flat weekly cash sum instead of a share of salary, so parental_leave_paid_pct is 0 or partial for them and stating it alone would wrongly call their leave unpaid. safety_net.avg_commute_minutes is a ONE-WAY commute, a single leg rather than a daily round trip: report it as \"about N minutes each way\", and double it yourself if the user asked what they spend commuting per day. It is door to door, averaged over every commuter regardless of mode, for the metro area, and excludes people who work from home. Childcare monthly fields are raw rates before modeled help. When childcare_income_tested or child_benefits_income_tested is present, use compare_cities with household income and child ages to price the rules; a flat subsidy or allowance alone is incomplete. Read-only, no side effects; returns a text summary plus structured JSON.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City slug. Use list_cities to discover valid slugs.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "compensation_index": {
                "type": ["number", "null"]
              },
              "cost_snapshot": {
                "additionalProperties": true,
                "properties": {},
                "type": "object"
              },
              "country": {
                "type": "string"
              },
              "currency": {
                "type": "string"
              },
              "data_last_updated_field": {
                "type": ["string", "null"]
              },
              "data_year_range": {
                "type": ["string", "null"]
              },
              "govt_benefits": {
                "additionalProperties": true,
                "properties": {},
                "type": "object"
              },
              "inbound_tax_regime": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "properties": {},
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "methodology_url": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
