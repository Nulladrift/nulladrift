{
  "lockfileVersion": 2,
  "subjects": {
    "com.outagedeck/outagedeck-status": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://outagedeck.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "outagedeck",
        "title": "OutageDeck",
        "version": "1.2.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "OutageDeck reports the live status of major cloud and SaaS providers (AWS, Azure, Google Cloud, GitHub, OpenAI, Anthropic, Cloudflare, and 160+ more) from the official status source that publishes each one, refreshed about every 10 minutes. Use it to answer \"is X down?\", to check a whole stack at once before debugging, and to read independent uptime history. Provider arguments accept slugs, names, or product names (\"claude\" resolves to Anthropic); use search_providers when unsure. Every status here is read from the official source that publishes it: usually the provider's own status page, and for a few providers the parent company's page that carries them. OutageDeck never probes a service and never takes a user report. Cite the included links when reporting a status, and cite the source each one names rather than the provider.",
      "tools": [
        {
          "name": "add_custom_provider",
          "title": "Add a custom provider",
          "description": "Registers a vendor OutageDeck does not track by pointing at its Statuspage or Instatus status page, so it joins the caller's account with live status, incident history, and alerting. Requires an API key and a plan that includes custom providers. The feed is read live before anything is saved, and it must be reachable from the public internet. Feeds behind authentication are set up on the account page instead, so credentials never travel through a conversation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "Optional display name. Defaults to the name the status page publishes.",
                "type": "string"
              },
              "url": {
                "description": "The vendor's status page address, for example https://status.yourvendor.com.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fabf382cfb2df76dd914b97f75df0ee9380ca277868a58de68a970bac5875b5e"
        },
        {
          "name": "check_my_stack",
          "title": "Check a whole stack",
          "description": "One verdict across up to 12 providers: whether any vendor in the list is reported as having a problem right now. Use before debugging an integration failure to answer \"is it us or them?\" in a single call. Returns a shareable status-board link and a prefilled alert setup link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "providers": {
                "description": "Provider slugs, names, or product names, one per vendor the stack depends on.",
                "items": {
                  "type": "string"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["providers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:365651ebd9b645f65979a864b923bc039b57bc2651e0d1d0a64624c860eed654"
        },
        {
          "name": "fetch",
          "title": "Fetch an OutageDeck document",
          "description": "Retrieve the full text of one search result by its id: a provider's current status with its services and open incidents, or an incident's complete timeline. Ids come from the search tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "A document id returned by search, e.g., \"provider:aws\" or \"incident:github-actions-delays-2026-07-31\".",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "additionalProperties": {
                  "type": "string"
                },
                "type": "object"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f433fd7fa73017943832e21d5ba0a437eab71fe96ad9d55684da697e5d04f6e3"
        },
        {
          "name": "get_incident_details",
          "title": "Get incident details",
          "description": "Full detail for one incident: updates from the official incident source in chronological order, the services OutageDeck matched to it, severity, and resolution state. Pass the incident slug returned by list_active_incidents or get_provider_status. Use to read what the official source has actually said about an outage.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "incident": {
                "description": "Incident slug, e.g., from an earlier list_active_incidents result.",
                "type": "string"
              }
            },
            "required": ["incident"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:db17a6c64a7658c29777727e0e5f76342022883a8050cf611b051db37fce8e65"
        },
        {
          "name": "get_outage_report",
          "title": "Get the cross-vendor outage report",
          "description": "A reliability summary across every tracked provider over a trailing window (7-90 days, default 30): incident totals, severity and category breakdowns, the providers hit hardest by major outages, and the longest-running severe incidents. Use to answer \"which vendors had outages recently?\" or to compare vendor reliability.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "Trailing window in days (default 30).",
                "maximum": 90,
                "minimum": 7,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:55192f79745b65640138c6b6786d3c6cd727ce81e21c54d1632a925b2072e5a2"
        },
        {
          "name": "get_provider_status",
          "title": "Get provider status",
          "description": "Live status for one tracked provider: overall state, non-operational services, and open incidents, read from the vendor's official status feed. Accepts a slug, provider name, or product name (e.g., \"claude\" resolves to Anthropic). Use this first for any \"is X down?\" question. When regions are present, reportedCodes lists published codes; notOperational lists impaired rows. If those rows are truncated, notOperationalCodes lists every impaired code. For an inventory feed, a reported code absent from the complete impaired list is operational; an unreported code has no published status. Withdrawn readings omit these lists. When only some services sit behind a feed OutageDeck could not re-read, services.notOperationalCount is null, confirmedNotOperationalCount counts the impaired services it could read, and unconfirmedServices names the rest.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "provider": {
                "description": "Provider slug, name, or product name, e.g., \"aws\", \"GitHub\", \"chatgpt\".",
                "type": "string"
              }
            },
            "required": ["provider"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5f9c2385a7a42c76b22edbbb7456096f75320e69dc22430318d51018b2eccf04"
        },
        {
          "name": "get_uptime",
          "title": "Get uptime history",
          "description": "Independent uptime record for one provider over a trailing window (7-90 days, default 30), computed from OutageDeck's readings of the official source that publishes the provider's status: share of time free of major outages, strict uptime with partial outages counted as downtime, and total impaired durations.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "Trailing window in days (default 30).",
                "maximum": 90,
                "minimum": 7,
                "type": "integer"
              },
              "provider": {
                "description": "Provider slug, name, or product name.",
                "type": "string"
              }
            },
            "required": ["provider"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5fa1dd23df24977033e1f3bc554a3a81f98a8823680b7531c69e54ffc3764ec4"
        },
        {
          "name": "list_active_incidents",
          "title": "List active incidents",
          "description": "Every incident currently open across all tracked providers, most severe first. Optionally filter by severity (critical, major, minor, maintenance). Use to answer \"what is down right now?\" across the whole cloud landscape.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "severity": {
                "description": "Only incidents of this severity.",
                "enum": ["minor", "major", "critical", "maintenance"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:33f665a8f12bf6193c85c4edaa66dd4559be6a687fab40f44f412f5b3db60240"
        },
        {
          "name": "list_custom_providers",
          "title": "List my custom providers",
          "description": "Lists the custom providers on the caller's own OutageDeck account: vendors they registered themselves by pointing at a status feed we do not track in the public catalog. Requires an API key, and only ever returns that key owner's providers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1d7a9176c5a2aa2a182fa9263efc1187f972922780bb67efbdebeb969e7a6ceb"
        },
        {
          "name": "remove_custom_provider",
          "title": "Remove a custom provider",
          "description": "Deletes one of the caller's custom providers and its stored incident history, freeing a slot on their plan. Requires an API key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "provider": {
                "description": "The custom provider's name or id.",
                "type": "string"
              }
            },
            "required": ["provider"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:280e63d7f7a4a427b93550abc7e3fc863897de87de7a525aa516564fcf1c548c"
        },
        {
          "name": "search",
          "title": "Search OutageDeck",
          "description": "Search everything OutageDeck tracks: cloud and SaaS providers, and their incident history. Returns citable results with stable ids for the fetch tool. Use for open questions like \"who had outages last week\" or \"find the GitHub Actions incident\"; use get_provider_status when the question is simply whether one named vendor is down right now.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "What to look for: a vendor name, a product, or words from an incident title, e.g., \"cloudflare\", \"elevated error rates\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7600ffd1c87257db1720fec24b78b52f2d7e4575f6c3238c90087b1eaa2d3a02"
        },
        {
          "name": "search_providers",
          "title": "Search tracked providers",
          "description": "Find tracked providers by name, product name, or fragment (\"postgres\", \"auth\", \"claude\"). Returns slugs to use with the other tools plus each match's current status. Use when a provider argument did not resolve or to discover what OutageDeck tracks.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Free-text search over provider names and aliases.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:363f57eece5e09da43168789f0eb42c9e60af366c72501d9f5b6a043f46f48fd"
        },
        {
          "name": "update_custom_provider",
          "title": "Update a custom provider",
          "description": "Renames one of the caller's custom providers, points it at a different status page, or pauses and resumes OutageDeck reading it. Requires an API key. A new address is read live before it is stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "New display name.",
                "type": "string"
              },
              "provider": {
                "description": "The custom provider's name or id.",
                "type": "string"
              },
              "state": {
                "description": "Resume or pause reading it. An active feed is read about every 10 minutes.",
                "enum": ["active", "paused"],
                "type": "string"
              },
              "url": {
                "description": "New status page address.",
                "type": "string"
              }
            },
            "required": ["provider"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8ddf1345611f01f2d9824bbc48304c7edaf2050c8db9d66c99dd26cd4dc3c1cd"
        },
        {
          "name": "watch_provider",
          "title": "Watch a provider",
          "description": "Starts sending the caller outage alerts for one provider, either from the tracked catalog or from their own custom providers. Requires an API key. A new watch is added to the owner's email alert. An existing alert counts only when delivery is allowed; otherwise a new owner-email watch is added or the request is refused with an explanation. A successful result always means delivery is allowed and reports the alert's channel. Other channels are set up on the account page; their destination URLs are never returned.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "provider": {
                "description": "A tracked provider (slug, name, or product name) or one of the caller's own custom providers.",
                "type": "string"
              }
            },
            "required": ["provider"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:8bcfa0e277b365dba19bf7559d1561699f9b4912ca77a5150d9f5d2ba4bd4738"
        }
      ],
      "prompts": [
        {
          "name": "cover_my_stack",
          "title": "Get alerted for this project's vendors",
          "description": "Work out which vendors this project actually depends on, then set up outage alerts for them, registering any vendor OutageDeck does not track yet from its own status page. Needs an API key on the connection.",
          "arguments": [
            {
              "name": "stack",
              "description": "Comma-separated vendors to cover. Leave empty to infer them from the project's dependencies, deploy target, and integrations.",
              "required": false
            }
          ],
          "digest": "sha256:c365b498267f233560424425e9d335dffa3ecc504908bbc69ff14b6e9e67fb06"
        },
        {
          "name": "triage_outage",
          "title": "Triage an outage",
          "description": "Work out whether a failure is your own change or a vendor outage: check every vendor the stack depends on, dig into anything not operational, and report a verdict with citations.",
          "arguments": [
            {
              "name": "stack",
              "description": "Comma-separated vendors to check, as names or slugs, e.g., \"aws, github, vercel\". Leave empty to infer the stack from the current project or ask.",
              "required": false
            }
          ],
          "digest": "sha256:ceb59aece0440f060ddfc989c12aff8316bd2ad34abc30b0d4d41db00a4baab3"
        }
      ],
      "digest": "sha256:f2ff11ff10aeaacbe8521fa189e51fb443bdd46bfc197f1f92f023774b2a0512"
    }
  }
}
