      "instructions": "# Static site deploy contract — READ BEFORE building a zip or calling deploy tools\n\nrules_version: 1\n\n## URLs and HTML\n- Files are served under a path prefix: `/sites/{site_id}/{staging|prod}/current/`.\n- Use RELATIVE `href` / `src` (no leading `/`) so assets resolve under that prefix.\n- **cleanUrls trap:** If `static-hosting.json` materializes `somepath/index.html`, the browser URL is `.../somepath/`. Relative `app.js` then resolves to `.../somepath/app.js`, not the zip root. Fix with `../app.js` / `../style.css` in that HTML, link to `.html` instead of `path/`, or duplicate assets under `somepath/`.\n\n## Zip contents\n- `index.html` at zip root is required.\n- Max zip size: 52428800 bytes (~50 MiB).\n- Optional zip root `static-hosting.json`: cleanUrls, preflight.forbidRootRelative, navigationFallback (declares **SPA** vs **MPA** routing; the file itself is **not** uploaded to S3, but its routing intent is honored by the CDN).\n- **SPA** (history-mode router) → set `navigationFallback.enabled: true`. Extensionless paths under the site prefix render the shell HTML (`navigationFallback.rewrite`, default `/index.html`); list path patterns under `navigationFallback.exclude` to skip the shell.\n- **MPA** (multi-page) → omit `navigationFallback` or set `enabled: false`. Extensionless paths resolve to `{path}.html`; unknown extensions are passed through to origin (may 404).\n- With **no** `static-hosting.json` in the zip, routing defaults to **SPA** for backward compatibility.\n\n## MCP workflow (order matters)\n1. `create_site` or `list_sites` → obtain `site_id`.\n2. **`get_deployment_rules`** with that `site_id` → read the full JSON; copy **`deploy_ack_token`**.\n3. Build the zip following the rules above, then `create_deploy_upload` + `commit_deploy_upload` (always staging) — pass the same **`deploy_ack_token`** on both.\n4. When staging looks good, call **`promote_staging_to_prod`** to go live on production.\n5. To edit an older version: **`list_deployments`** → **`download_deployment`** (presigned zip) → change files → redeploy to staging.\n6. Only the current deployment plus **5 previous versions** per environment are kept; older versions are marked **deleted** (artifacts removed, history row retained).\n\n## Custom domain (BYO DNS, prod only)\n- Requires an **active prod** deployment and an **active domain subscription** (subscribe in the web console first; deploys are free).\n- `connect_custom_domain` → add returned **cert_validation** CNAMEs at your DNS host (apex + www).\n- Poll `get_custom_domain_status` until status is `active` (typically 10–30 minutes).\n- When status reaches `awaiting_routing_dns`, add **routing** DNS: point apex (ALIAS/A) and www (CNAME) to the CloudFront domain shown.\n- `disconnect_custom_domain` removes the connection (best-effort CDN/ACM cleanup).\n\n## When deploy returns 400\n- Parse tool error JSON: **`details.agent_fix`** and **`details.violation`**; fix the artifact and retry (do not recreate the site unless the slug was wrong).\n\n\n---\n\nAuthentication required. To use the webprompter MCP server:\n  1. Create an account at https://webprompter.ai/console#signup\n  2. Log in and create an API key in the \"API keys\" panel\n  3. Add it to mcp.json under headers[\"X-Api-Key\"] as your raw key: wpk_live_...\n\nSign up: https://webprompter.ai/console#signup\nConsole: https://webprompter.ai/console",
      "tools": [
