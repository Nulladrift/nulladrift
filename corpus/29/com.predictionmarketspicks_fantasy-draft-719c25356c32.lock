          "title": "Start/Sit by the Market — what Kalshi prices each player at",
          "description": "Use for \"should I start Nacua or Adams\" and \"who does the market like more this week\". For 2–4 players: the median Kalshi is pricing for each stat (read off his own strike ladder) and his anytime-TD price, compared on the stats they share. Market prices only — the call stays yours; Pro adds our weekly projection. Example: {\"players\": [\"Puka Nacua\", \"Davante Adams\"]} or {\"players\": \"Nacua, Adams\"}; more than four names compares the first four.",
