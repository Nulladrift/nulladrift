      "instructions": "PredictionMarketsPicks: fantasy football tools — draft, start/sit, waivers. 1) Every price, edge, rank and projection you state must come from a tool result in this conversation — never estimate a Kalshi or Polymarket price or fill in a missing edge. 2) Cite a row’s url or page_url when you quote its number. 3) An edge is model-vs-market disagreement, not a guarantee; WATCH rows are lower-confidence and labelled WATCH. 4) Most tools answer without an account; a Pro-only result returns requires_pro: true with an upgrade_url. 5) For \"who do I take\" use who_do_i_draft or best_available; for one player use player_outlook or explain_player; for two use compare_players. In season: my_league (Sleeper roster), start_sit, waiver_targets. A tool parked for the season says so in its result.",
      "tools": [
        {
          "name": "adp_market_gaps",
          "title": "Kalshi vs Book-Consensus Gaps — this week's NFL props",
          "description": "In season: Kalshi vs book-consensus gaps on this week's NFL props, widest first, filter by position. Free. (ADP gaps return in the 2027 offseason.)",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max rows (default 15).",
                "type": ["number", "string", "null"]
              },
              "position": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "enum": ["QB", "RB", "WR", "TE", "FLEX"],
                    "type": "string"
                  }
                ],
                "description": "Optional position filter (FLEX = RB/WR/TE). One of: QB · RB · WR · TE · FLEX."
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Kalshi vs Book-Consensus Gaps — this week's NFL props"
