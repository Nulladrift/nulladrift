        {
          "name": "compare_players",
          "title": "Compare Players This Week — Kalshi prop lines",
          "description": "Compare 2–4 NFL players this week: every Kalshi prop strike each has, the best price per side across venues, our probability where we publish one, and a ranked verdict on whose price the model disagrees with most, and on which strike. Use for \"<A> or <B> this week\", \"compare <A> and <B> props\", \"who has the better prop, <A> or <B>\", \"<A> vs <B> receiving yards\".",
          "inputSchema": {
            "properties": {
              "platform": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "enum": ["yahoo", "espn", "sleeper", "nfl", "cbs", "fantrax", "draftkings", "underdog"],
                    "type": "string"
                  }
                ],
                "description": "League platform — applies its default scoring, size, roster + best-ball settings (overridable by explicit scoring/teams). Underdog/DraftKings are best ball. One of: yahoo · espn · sleeper · nfl · cbs · fantrax · draftkings · underdog."
              },
              "players": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "string"
                  },
                  {
                    "additionalProperties": {},
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  }
                ],
                "description": "2–4 player full names to compare."
              },
              "scoring": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "enum": ["standard", "half_ppr", "ppr"],
                    "type": "string"
                  }
                ],
                "description": "Scoring format: standard, half_ppr (default), or ppr (full PPR). Overrides a platform preset. Works for Yahoo/ESPN/Sleeper defaults. One of: standard · half_ppr · ppr."
              }
            },
            "type": "object"
          },
