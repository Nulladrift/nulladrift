        },
        {
          "name": "list_events",
          "description": "List upcoming public events and tastings with dates, venue, cost and a booking link. Read-only; it cannot reserve anything: book at the booking_url (Tock).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "Earliest date YYYY-MM-DD (default today).",
                "format": "date",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum results (1-20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "Latest date YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List events"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0c642f4da62b119ad0aa3ea80d8daf96dd6d62066fca8bfaf9b2ac4b866bb8ee"
        },
        {
          "name": "search_wines",
          "description": "Search the wines currently for sale. Returns price, size, tasting notes, accolades and scores, spice pairings, vineyards and the product URL. Read-only; to buy, use the wine's url.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "description": "Maximum results (1-20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum price in USD.",
                "minimum": 0,
                "type": "number"
              },
              "query": {
                "description": "Free-text search across the wine record.",
                "maxLength": 80,
                "type": "string"
              },
              "varietal": {
                "description": "Varietal or blend component, e.g. Cabernet Franc.",
                "maxLength": 80,
                "type": "string"
              },
              "vintage": {
                "description": "Vintage year, e.g. 2022.",
                "maxLength": 16,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search wines"
