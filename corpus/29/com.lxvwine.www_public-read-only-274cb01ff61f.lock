        },
        {
          "name": "get_wine",
          "description": "Get one wine by its slug (from search_wines). Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The wine slug, e.g. 2022-cabernet-franc.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
