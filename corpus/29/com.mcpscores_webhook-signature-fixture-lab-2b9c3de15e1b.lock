      "serverInfo": {
        "name": "com.mcpscores/webhook-signature-fixture-lab",
        "title": "Webhook Signature Fixture Lab",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Generates deterministic webhook HMAC-SHA256 fixtures and optionally verifies a supplied signature using a customer-owned TEST secret and payload. It is offline and never delivers HTTP requests or validates a live endpoint. Tool calls cost 0.03 USDC on Base. Initialization, tool discovery and unpaid price challenges are free. Send x402 v2 PAYMENT-SIGNATURE on the POST or params._meta['x402/payment']. Reuse the identical input and authorization when recovering a pending purchase; do not sign a fresh charge. Results are retained24hours. Generates fixtures from only the supplied TEST secret, payload, and timestamp inputs; it never sends HTTP requests or checks a live endpoint. github_sha256 follows GitHub’s HMAC-SHA256 header shape. timestamped_sha256 is a generic timestamp-bound test scheme and is not Stripe or any other vendor’s certified implementation. The timestamped scheme signs the exact UTF-8 bytes of timestamp + \".\" + payload and checks freshness against the supplied now value; the real wall clock is never read. Requests are bounded to 131072 serialized UTF-8 bytes, 8 nesting levels, 20000 JSON nodes, and 10000 items per array. Payloads are bounded to 65536 UTF-8 bytes; secrets are bounded to 1024 characters. This tool does not certify a provider integration, retrieve provider configuration, manage production credentials, or make a security determination about a verifier. Results at most 96 KiB; retry identical input and authorization within 24 hours to recover a purchase.",
      "tools": [
        {
          "name": "webhook_signature_fixture_lab",
          "description": "Generates deterministic webhook HMAC-SHA256 fixtures and optionally verifies a supplied signature using a customer-owned TEST secret and payload. It is offline and never delivers HTTP requests or validates a live endpoint. Price: 0.03 USDC per completed bounded job on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "mode": {
                "enum": ["github_sha256", "timestamped_sha256"],
                "type": "string"
              },
              "now": {
                "description": "Required by timestamped_sha256: supplied comparison epoch seconds.",
                "pattern": "^[1-9][0-9]{0,11}$",
                "type": "string"
              },
              "payload": {
                "description": "Exact UTF-8 payload text, at most 65536 bytes; never parsed or reformatted.",
                "type": "string"
              },
              "supplied_signature": {
                "description": "Optional exact header value to verify; malformed values produce a negative verification result.",
                "maxLength": 256,
                "type": "string"
              },
              "test_secret": {
                "description": "Customer-owned TEST secret; never returned in output.",
                "maxLength": 1024,
                "minLength": 1,
                "type": "string"
              },
              "timestamp": {
                "description": "Required by timestamped_sha256: canonical positive epoch seconds.",
                "pattern": "^[1-9][0-9]{0,11}$",
                "type": "string"
              },
              "tolerance_seconds": {
                "default": 300,
                "maximum": 3600,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["mode", "payload", "test_secret"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
