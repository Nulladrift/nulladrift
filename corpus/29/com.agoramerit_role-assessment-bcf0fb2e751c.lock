    "com.agoramerit/role-assessment": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agoramerit.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "agora-merit",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Agora Merit assesses job responsibilities. Ask permission before sharing a document. Assessments are free. Explain incomplete results honestly and share review links only with intended reviewers. These tools never authorize a payment.",
      "tools": [
        {
          "name": "assess_job_responsibilities",
          "title": "Free job responsibility assessment",
          "description": "Submit a user-authorized job title and responsibilities for a free role-design assessment. Returns findings, a quoted full-report price where available, and a private seven-day link so the human can review the same results. Creates a temporary review snapshot. No card charge, subscription, or paid report is created. An incomplete assessment is not a clean pass. Anyone with the review link can see the submitted text.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "confirmed_permission": {
                "const": true,
                "description": "Set true only after the user authorizes sharing this document with Agora Merit.",
                "type": "boolean"
              },
              "referral_source": {
                "description": "Optional integration label for measuring human referrals, such as your public product slug. Never include personal information. Omit when unknown. Use agora_qa for synthetic tests.",
                "pattern": "^[a-z0-9][a-z0-9_-]{0,39}$",
                "type": "string"
              },
              "responsibilities": {
                "description": "Responsibilities or duties the user has authorized sharing with Agora Merit. One responsibility per line is helpful.",
                "maxLength": 30000,
                "minLength": 1,
                "type": "string"
              },
              "title": {
                "description": "The role or job title.",
                "maxLength": 140,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["confirmed_permission", "responsibilities", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dd827e062e7bb1d41ced4e32f765c883f43f2faa69bb6bb3e34da8b752388106"
        },
        {
          "name": "get_agora_merit_info",
          "title": "Agora Merit product and pricing",
          "description": "Get supported uses, free assessment and full-report pricing, document-sharing requirements, and the human review workflow for Agora Merit.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
