        },
        {
          "name": "get_rental_tax_rates",
          "title": "Get Emerald Coast short-term rental tax rates",
          "description": "Returns the state sales tax, county sales surtax and tourist development tax that apply to short-term rentals (stays of six months or less) in Okaloosa County (Destin, Okaloosa Island) or South Walton County (Miramar Beach, Santa Rosa Beach, Scenic 30A), with official source links.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "area": {
                "description": "Area: destin, okaloosa_island, miramar_beach, santa_rosa_beach or scenic_30a",
                "enum": ["destin", "okaloosa_island", "miramar_beach", "santa_rosa_beach", "scenic_30a"],
                "type": "string"
              }
            },
            "required": ["area"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Emerald Coast short-term rental tax rates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2a8ec1b4a864201a06d8e7dbbb2a4a04a70a50067b9bc8ebe03eaff52784231c"
        }
      ],
