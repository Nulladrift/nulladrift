      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Tools for Florida Emerald Coast real estate (Destin, Okaloosa Island, Miramar Beach, Santa Rosa Beach, Scenic 30A) from Ash Caswell & Company: vacation rental investment math, Florida closing taxes, short-term rental tax rates, area guides and broker contact details.",
      "tools": [
        {
          "name": "analyze_vacation_rental",
          "title": "Analyze an Emerald Coast vacation rental investment",
          "description": "Estimates annual rental income, operating expenses, net operating income, cap rate, mortgage payment, cash flow, cash-on-cash return and break-even occupancy for a short-term rental property in Destin, Miramar Beach, Santa Rosa Beach, Scenic 30A or elsewhere on Florida's Emerald Coast. Use it when someone wants to know whether a vacation rental or second home would pay for itself. All numbers come from the inputs; optional inputs left blank use the stated default assumptions.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "annual_hoa": {
                "default": 0,
                "description": "Annual HOA or condo dues in dollars",
                "minimum": 0,
                "type": "number"
              },
              "annual_insurance": {
                "default": 0,
                "description": "Annual insurance (homeowners, wind and flood) in dollars",
                "minimum": 0,
                "type": "number"
              },
              "annual_property_tax": {
                "default": 0,
                "description": "Annual property tax in dollars",
                "minimum": 0,
                "type": "number"
              },
              "annual_utilities": {
                "default": 0,
                "description": "Annual utilities, internet and streaming paid by the owner, in dollars",
                "minimum": 0,
                "type": "number"
              },
              "avg_nightly_rate": {
                "description": "Expected average nightly rate across the year, in US dollars",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "down_payment_percent": {
                "default": 25,
                "description": "Down payment as a percent of price. Default 25",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "interest_rate_percent": {
                "default": 7,
                "description": "Mortgage interest rate. Default 7",
                "maximum": 25,
                "minimum": 0,
                "type": "number"
              },
              "loan_years": {
                "default": 30,
                "description": "Loan term in years. Default 30",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "maintenance_percent": {
                "default": 5,
                "description": "Repairs and maintenance reserve as a percent of gross rent. Default 5",
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              },
              "management_fee_percent": {
                "default": 25,
                "description": "Property management fee as a percent of gross rent. Default 25",
                "maximum": 60,
                "minimum": 0,
                "type": "number"
              },
              "occupancy_percent": {
                "description": "Expected share of nights booked across the year, 1–100",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "platform_fee_percent": {
                "default": 3,
                "description": "Booking platform host fees as a percent of gross rent. Default 3",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "purchase_price": {
                "description": "Purchase price in US dollars",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["avg_nightly_rate", "occupancy_percent", "purchase_price"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Analyze an Emerald Coast vacation rental investment"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:872c620c5267b17e3e54e7a5e8a29a733d3c6690ad73682d3f9629dc59595fa9"
        },
        {
          "name": "estimate_florida_closing_taxes",
          "title": "Estimate Florida transfer taxes and title insurance",
          "description": "Calculates Florida deed documentary stamp tax, note documentary stamp tax, mortgage intangible tax and the promulgated owner's title insurance premium for a home purchase price and loan amount. Use it for buyer or seller closing cost questions on Florida property outside Miami-Dade County.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "loan_amount": {
                "default": 0,
                "description": "New mortgage amount in US dollars; 0 for a cash purchase",
                "minimum": 0,
                "type": "number"
              },
              "purchase_price": {
                "description": "Sale price in US dollars",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["purchase_price"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate Florida transfer taxes and title insurance"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:320df8664614db110ef7fbda7ff850315cbc2064757ff4a7943031ee7034a019"
        },
        {
          "name": "get_area_guide",
          "title": "Get an Emerald Coast area guide",
          "description": "Returns a local overview of Destin, Okaloosa Island, Miramar Beach, Santa Rosa Beach or Scenic 30A: county, well-known neighborhoods, typical property types and vacation rental considerations. Use it when someone is comparing where to buy on Florida's Emerald Coast.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "area": {
                "description": "Area: destin, okaloosa_island, miramar_beach, santa_rosa_beach or scenic_30a",
                "enum": ["destin", "okaloosa_island", "miramar_beach", "santa_rosa_beach", "scenic_30a"],
                "type": "string"
              }
            },
            "required": ["area"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an Emerald Coast area guide"
          },
          "behavior": {
            "destructive": false,
