      },
      "instructions": "Tools for Florida Emerald Coast real estate (Destin, Okaloosa Island, Miramar Beach, Santa Rosa Beach, Scenic 30A and nearby) from Ash Caswell & Company, a licensed Florida brokerage: vacation rental investment math, Florida closing taxes, short-term rental tax rates, area guides, live homes-for-sale searches, home value reports, seller net proceeds and affordability estimates, market reports, and booking a call with the broker.",
      "tools": [
        {
          "name": "analyze_vacation_rental",
          "title": "Analyze an Emerald Coast vacation rental investment",
          "description": "Estimates annual rental income, operating expenses, net operating income, cap rate, mortgage payment, cash flow, cash-on-cash return and break-even occupancy for a short-term rental property in Destin, Miramar Beach, Santa Rosa Beach, Scenic 30A or elsewhere on Florida's Emerald Coast. Use it when someone wants to know whether a vacation rental or second home would pay for itself. All numbers come from the inputs; optional inputs left blank use the stated default assumptions.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "annual_hoa": {
                "default": 0,
                "description": "Annual HOA or condo dues in dollars",
                "minimum": 0,
                "type": "number"
              },
              "annual_insurance": {
                "default": 0,
                "description": "Annual insurance (homeowners, wind and flood) in dollars",
                "minimum": 0,
                "type": "number"
              },
              "annual_property_tax": {
                "default": 0,
                "description": "Annual property tax in dollars",
                "minimum": 0,
                "type": "number"
              },
              "annual_utilities": {
                "default": 0,
                "description": "Annual utilities, internet and streaming paid by the owner, in dollars",
                "minimum": 0,
                "type": "number"
              },
              "avg_nightly_rate": {
                "description": "Expected average nightly rate across the year, in US dollars",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "down_payment_percent": {
                "default": 25,
                "description": "Down payment as a percent of price. Default 25",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "interest_rate_percent": {
                "default": 7,
                "description": "Mortgage interest rate. Default 7",
                "maximum": 25,
                "minimum": 0,
                "type": "number"
              },
              "loan_years": {
                "default": 30,
                "description": "Loan term in years. Default 30",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "maintenance_percent": {
                "default": 5,
                "description": "Repairs and maintenance reserve as a percent of gross rent. Default 5",
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              },
              "management_fee_percent": {
                "default": 25,
                "description": "Property management fee as a percent of gross rent. Default 25",
                "maximum": 60,
                "minimum": 0,
                "type": "number"
              },
              "occupancy_percent": {
                "description": "Expected share of nights booked across the year, 1–100",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "platform_fee_percent": {
                "default": 3,
                "description": "Booking platform host fees as a percent of gross rent. Default 3",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "purchase_price": {
                "description": "Purchase price in US dollars",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["avg_nightly_rate", "occupancy_percent", "purchase_price"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Analyze an Emerald Coast vacation rental investment"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:872c620c5267b17e3e54e7a5e8a29a733d3c6690ad73682d3f9629dc59595fa9"
        },
        {
          "name": "estimate_florida_closing_taxes",
          "title": "Estimate Florida transfer taxes and title insurance",
          "description": "Calculates Florida deed documentary stamp tax, note documentary stamp tax, mortgage intangible tax and the promulgated owner's title insurance premium for a home purchase price and loan amount. Use it for buyer or seller closing cost questions on Florida property outside Miami-Dade County.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "loan_amount": {
                "default": 0,
                "description": "New mortgage amount in US dollars; 0 for a cash purchase",
                "minimum": 0,
                "type": "number"
              },
              "purchase_price": {
                "description": "Sale price in US dollars",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["purchase_price"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate Florida transfer taxes and title insurance"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:320df8664614db110ef7fbda7ff850315cbc2064757ff4a7943031ee7034a019"
        },
        {
          "name": "estimate_home_affordability",
          "title": "Estimate how much home a buyer can afford",
          "description": "Estimates a comfortable maximum home price from gross income, monthly debts, down payment, interest rate and expected taxes, insurance and HOA, using common 28% housing and 36% total debt-to-income guidelines. Use it when someone asks how much house or condo they can afford on Florida's Emerald Coast. Lenders' actual limits vary by loan program.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "annual_gross_income": {
                "description": "Household gross (pre-tax) income per year, in US dollars",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "annual_insurance": {
                "default": 6000,
                "description": "Homeowners, wind and flood insurance per year, in dollars. Default 6,000",
                "minimum": 0,
                "type": "number"
              },
              "annual_property_tax_percent": {
                "default": 1,
                "description": "Property tax as a percent of price per year. Default 1",
                "maximum": 5,
                "minimum": 0,
                "type": "number"
              },
              "down_payment": {
                "description": "Cash available for the down payment, in dollars",
                "minimum": 0,
                "type": "number"
              },
              "interest_rate_percent": {
                "default": 7,
                "description": "Mortgage interest rate. Default 7",
                "maximum": 25,
                "minimum": 0,
                "type": "number"
              },
              "loan_years": {
                "default": 30,
                "description": "Loan term in years. Default 30",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "monthly_debt_payments": {
                "default": 0,
                "description": "Other monthly debt payments (car, student loans, minimum card payments), in dollars. Default 0",
                "minimum": 0,
                "type": "number"
              },
              "monthly_hoa": {
                "default": 0,
                "description": "HOA or condo dues per month. Default 0",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["annual_gross_income", "down_payment"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate how much home a buyer can afford"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f4318c43c1ba20b72482053295fba22fe479502fbacf6ca5860962a04ecb8eb7"
        },
        {
          "name": "estimate_seller_net_proceeds",
          "title": "Estimate what a Florida home seller walks away with",
          "description": "Estimates a seller's net proceeds on a Florida home sale: sale price minus mortgage payoff, real estate commission, Florida deed documentary stamp tax, the owner's title insurance premium (if the seller pays it) and any other costs entered. Use it when an Emerald Coast homeowner asks how much they would net or walk away with if they sell. Commission is whatever rate the user enters; it is negotiable and there is no default.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "mortgage_payoff": {
                "default": 0,
                "description": "Remaining mortgage and other liens to pay off, in dollars. Default 0",
                "minimum": 0,
                "type": "number"
              },
              "other_costs": {
                "default": 0,
                "description": "Other seller costs such as HOA estoppel, prorated property taxes or settlement fees, in dollars. Default 0",
                "minimum": 0,
                "type": "number"
              },
              "sale_price": {
                "description": "Expected sale price in US dollars",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "seller_concessions": {
                "default": 0,
                "description": "Closing cost credits or repairs paid for the buyer, in dollars. Default 0",
                "minimum": 0,
                "type": "number"
              },
              "seller_pays_owners_title": {
                "default": true,
                "description": "Whether the seller pays the owner's title insurance policy. Set by the contract and local custom. Default true",
                "type": "boolean"
              },
              "total_commission_percent": {
                "description": "Total real estate commission as a percent of the sale price, as negotiated with the seller's broker",
                "maximum": 15,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["sale_price", "total_commission_percent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate what a Florida home seller walks away with"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:107e7aa59509bfc367caa418f671629d2b60250e987cc65a0eb4503ed72bf064"
        },
