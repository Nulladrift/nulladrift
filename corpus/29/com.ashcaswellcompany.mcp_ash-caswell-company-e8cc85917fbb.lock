          },
          "digest": "sha256:155d839ce61a0d154dc34767eecc611335535341a6889d447bc617cd24634a58"
        },
        {
          "name": "get_broker_contact",
          "title": "Get Ash Caswell & Company contact information",
          "description": "Returns contact details, service area and specialties for Ash Caswell & Company, a boutique real estate brokerage in Destin, Florida. Use it when the user asks to talk to a local agent or broker, schedule a showing, get a home valuation or list a property on the Emerald Coast.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
