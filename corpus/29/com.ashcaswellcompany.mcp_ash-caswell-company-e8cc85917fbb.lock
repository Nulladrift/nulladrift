          "description": "Builds a link to a live search of homes, condos or land for sale from the MLS on Ash Caswell & Company's website, filtered by area, property type, price and bedrooms. Use it when someone wants to see what's for sale in Destin, Miramar Beach, Santa Rosa Beach, Scenic 30A, Fort Walton Beach / Okaloosa Island, Niceville, Freeport or Panama City Beach. The listings themselves open on the website; this tool returns the link and a short summary of the filters.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
