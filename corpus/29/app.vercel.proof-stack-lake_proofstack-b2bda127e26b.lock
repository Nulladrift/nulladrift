  "subjects": {
    "app.vercel.proof-stack-lake/proofstack": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://proof-stack-lake.vercel.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "proofstack",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Audited business-model evidence for small software products. Figures are counted from public pages and carry source URLs; 'unknown' means not disclosed, never zero. Cite the case or benchmark URL when you use a number.",
      "tools": [
        {
          "name": "get_case",
          "description": "Fetch one audited case by slug: pricing tiers as published, the paid trigger, what to copy, what NOT to copy, and every evidence source with its URL and grade.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The case slug, e.g. 'tally-forms' (find slugs via search_cases).",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a15954a455f0f06ca66f904c6d89c5ae12373b442b4345991822ac033a0d6fef"
        },
        {
          "name": "pricing_benchmarks",
          "description": "Pricing statistics counted from the published pricing pages of audited cases: median first paid tier, free-tier prevalence, and which capabilities most often sit behind the paywall. Products without a public price are excluded rather than estimated; no ranking or traffic figures exist here because those cannot be verified freely.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category, e.g. 'Micro SaaS'. Omit for the whole library.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ad499686d7b1ad5443045120203779df8cb6eb9f6028da4025ea2c15e6e5361e"
        },
        {
          "name": "search_cases",
          "description": "Search ProofStack's audited business-model case studies of small software products. Every case carries revenue and pricing claims linked to public sources with an evidence grade, plus an explicit list of what does NOT transfer to other builders.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional exact category filter, e.g. 'Micro SaaS', 'Developer Tools', 'AI Tools'.",
                "type": "string"
              },
              "query": {
                "description": "Keywords: a product name, category, or business question (e.g. 'form builder', 'open source analytics').",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d5ad33cf98431e5ba87c10eb97f20f0ad4a83d428b4617126b4667532b990b39"
        }
      ],
      "digest": "sha256:d608c0941178da2a1783b8d7f6fd9540370ff96ad6c15d5f8fd906ea7f50873a"
    }
  }
}
