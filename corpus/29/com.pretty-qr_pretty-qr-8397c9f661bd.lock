{
  "lockfileVersion": 2,
  "subjects": {
    "com.pretty-qr/pretty-qr": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pretty-qr.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "pretty-qr",
        "title": "Pretty QR",
        "version": "1.0.0",
        "websiteUrl": "https://pretty-qr.com/docs/api#mcp"
      },
      "capabilities": {
        "prompts": {},
        "resources": {},
        "tools": {}
      },
      "instructions": "Make styled QR codes with Pretty QR. Call list_templates to pick a look, create_qr_code for the file, and open_in_editor for a link the user can keep editing. To put a photo, video, audio file or PDF behind a QR code, call create_file_upload, upload the file with its curl command, then create_qr_code with the file_url.",
      "tools": [
        {
          "name": "create_file_upload",
          "title": "Host a file",
          "description": "Start hosting a photo, video, audio file or PDF for a hosted file QR code (up to 10 files per account). Returns a one-time upload_url (valid 30 minutes) and the file_url the file will have. Upload the raw file with the returned curl command, then call create_qr_code with content set to file_url. Counts as one QR API request.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "file_name": {
                "description": "Name of the file, e.g. menu.pdf. Shown when someone downloads it.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9e2c5f6fcd99151a4d8ea66cfa5b3373a3e33a6b1b9c06b961ff9a179e8eba04"
        },
        {
          "name": "create_qr_code",
          "title": "Create a QR code",
          "description": "Make the QR code file Download makes in the Pretty QR editor: a 2048 px PNG or an SVG. Counts as one QR API request.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "content": {
                "description": "Text or URL to encode.",
                "minLength": 1,
                "type": "string"
              },
              "design": {
                "additionalProperties": false,
                "description": "Design fields as in POST /api/v1/qr. Each top-level field replaces the template's. Without template or design the code is black on white.",
                "properties": {
                  "backgroundColor": {
                    "example": "#000000",
                    "pattern": "^#[0-9a-fA-F]{6}$",
                    "type": "string"
                  },
                  "cornerRadius": {
                    "maximum": 1000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "eyeShape": {
                    "default": "square",
                    "enum": ["square", "circle", "rounded"],
                    "type": "string"
                  },
                  "foregroundStyle": {
                    "additionalProperties": false,
                    "properties": {
                      "colors": {
                        "description": "One colour draws a solid code. Two or more draw one gradient over the code and its shape, the colours evenly spaced.",
                        "items": {
                          "example": "#000000",
                          "pattern": "^#[0-9a-fA-F]{6}$",
                          "type": "string"
                        },
                        "maxItems": 5,
                        "minItems": 1,
                        "type": "array"
                      },
                      "direction": {
                        "default": "top-bottom",
                        "description": "Linear gradients only: where the first colour starts and the last one ends.",
                        "enum": ["top-bottom", "left-right", "top-left-bottom-right", "top-right-bottom-left", "bottom-top", "right-left", "bottom-right-top-left", "bottom-left-top-right"],
                        "type": "string"
                      },
                      "type": {
                        "default": "linear",
                        "enum": ["linear", "radial"],
                        "type": "string"
                      }
                    },
                    "required": ["colors"],
                    "type": "object"
                  },
                  "frame": {
                    "additionalProperties": false,
                    "properties": {
                      "borderColor": {
                        "example": "#000000",
                        "pattern": "^#[0-9a-fA-F]{6}$",
                        "type": "string"
                      },
                      "borderWidth": {
                        "maximum": 20,
                        "minimum": 1,
                        "type": "number"
                      },
                      "cornerRadius": {
                        "maximum": 240,
                        "minimum": 0,
                        "type": "number"
                      },
                      "enabled": {
                        "const": true
                      },
                      "outerColor": {
                        "example": "#000000",
                        "pattern": "^#[0-9a-fA-F]{6}$",
                        "type": "string"
                      },
                      "padding": {
                        "maximum": 48,
                        "minimum": 8,
                        "type": "number"
                      },
                      "text": {
                        "additionalProperties": false,
                        "properties": {
                          "content": {
                            "maxLength": 24,
                            "type": "string"
                          },
                          "enabled": {
                            "type": "boolean"
                          }
                        },
                        "required": ["content", "enabled"],
                        "type": "object"
                      },
                      "type": {
                        "enum": ["rectangle", "speech-bubble", "banner", "shopping-bag", "coffee-cup"],
                        "type": "string"
                      }
                    },
                    "required": ["borderColor", "borderWidth", "cornerRadius", "enabled", "padding", "type"],
                    "type": ["object", "null"]
                  },
                  "logo": {
                    "additionalProperties": false,
                    "properties": {
                      "hideBackgroundDots": {
                        "type": "boolean"
                      },
                      "margin": {
                        "maximum": 50,
                        "minimum": 0,
                        "type": "number"
                      },
                      "size": {
                        "maximum": 0.5,
                        "minimum": 0.1,
                        "type": "number"
                      },
                      "src": {
                        "description": "Base64 data URL. SVGs must be self-contained.",
                        "pattern": "^data:image/(png|jpeg|webp|svg\\+xml);base64,",
                        "type": "string"
                      }
                    },
                    "required": ["hideBackgroundDots", "margin", "size", "src"],
                    "type": ["object", "null"]
                  },
                  "moduleShape": {
                    "default": "square",
                    "enum": ["square", "circle", "rounded", "dot"],
                    "type": "string"
                  },
                  "shape": {
                    "additionalProperties": false,
                    "properties": {
                      "type": {
                        "enum": ["square", "circle", "heart", "shield", "house", "pin"],
                        "type": "string"
                      }
                    },
                    "required": ["type"],
                    "type": ["object", "null"]
                  }
                },
                "type": "object"
              },
              "format": {
                "default": "png",
                "enum": ["png", "svg"],
                "type": "string"
              },
              "template": {
                "description": "Template id from list_templates. Its design is the starting point.",
                "enum": ["heart", "circle", "real-estate", "find-us", "cafe-menu", "speech-bubble", "banner", "shopping-bag", "instagram", "linkedin", "tiktok", "youtube", "twitter", "facebook", "classic", "modern", "warm", "nature", "elegant", "vibrant", "logo", "midnight-dots", "teal-rounded", "sunset-classy", "indigo-dots", "forest-classy", "amber-rounded", "aurora", "sunset-glow", "ocean-depth", "berry-burst", "citrus-fresh", "lagoon", "gradient-heart", "prism", "royal-gold", "espresso"],
                "type": "string"
              }
            },
            "required": ["content"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:11e15e488002c83a0413d22137b6c2d11083436c1dd5414e758fb8723d58a6f0"
        },
        {
          "name": "list_templates",
          "title": "List templates",
          "description": "The Pretty QR templates: id, name, description and a preview image URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5d5e09e3c0e0c2d00dc5a54753edf822ca39b5a2a198c35aaff31a519972fe27"
        },
