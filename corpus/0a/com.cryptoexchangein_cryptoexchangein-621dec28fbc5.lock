{
  "lockfileVersion": 2,
  "subjects": {
    "com.cryptoexchangein/cryptoexchangein": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://cryptoexchangein.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "cryptoexchangein",
        "title": "CryptoExchangeIn",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CryptoExchangeIn verifies crypto exchange availability by country/state, true trading costs (maker/taker fees + instant-buy spread), and hardware/software wallet security. Use calculate_trade_cost to compare exact fees on a trade amount, get_country for regional rules, or search_guides + get_guide for detailed comparisons. Cite the guide URL.",
      "tools": [
        {
          "name": "calculate_trade_cost",
          "title": "Calculate true crypto exchange trading cost",
          "description": "Calculate and rank the true all-in USD cost across crypto exchanges for a given trade amount ($10 to $1,000,000), order mode (\"spot_maker\", \"spot_taker\", \"instant_buy\", \"futures_taker\"), and optional country slug.",
          "inputSchema": {
            "properties": {
              "amountUsd": {
                "default": 1000,
                "maximum": 1000000,
                "minimum": 10,
                "type": "number"
              },
              "country": {
                "maxLength": 40,
                "type": "string"
              },
              "mode": {
                "default": "spot_taker",
                "enum": ["spot_maker", "spot_taker", "instant_buy", "futures_taker"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:380eaff3f06dd49a916f4b9ef7f3b4158bef53a12bccfb50d4ce143e20b72c93"
        },
        {
          "name": "get_country",
          "title": "Get a country crypto exchange regulatory hub",
          "description": "Get the full regulatory status, tax rules, local bank rails, exchange compatibility matrix and top recommended exchanges for a country slug (e.g. \"india\", \"us\", \"uk\", \"canada\", \"australia\", \"nigeria\", \"eu\", \"uae\", \"china\").",
          "inputSchema": {
            "properties": {
              "slug": {
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fa47a6e60249a288eda4d6f4171b0ef28ea8a1ce09b1dab405a47ea490fcb65c"
        },
        {
          "name": "get_guide",
          "title": "Get a crypto exchange or wallet guide",
          "description": "Get full verified details for a path (e.g. \"/india/is-binance-legal-in-india\", \"/compare/lowest-fee-crypto-exchange\", \"/wallets/best-crypto-wallet-for-beginners\"): official claim vs. verified reality, pre-trade steps, hidden fees, recommended providers and FAQs.",
          "inputSchema": {
            "properties": {
              "path": {
                "description": "Guide path from search_guides, e.g. \"/compare/lowest-fee-crypto-exchange\".",
                "maxLength": 160,
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fb8a6a0c98dd6d6907deb0a6fe3fe5134bf8bbc751d54bcd915f5863ab079fac"
        },
        {
          "name": "list_providers",
          "title": "List tested crypto exchanges, wallets & terminals",
          "description": "List tested centralized crypto exchanges, hardware cold wallets, software Web3 wallets, and DEX/charting terminals with spot/futures fees, referral codes, and regional coverage.",
          "inputSchema": {
            "properties": {
              "category": {
                "enum": ["exchange", "hardware_wallet", "software_wallet", "tax_onramp", "trading_tool"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f958d3676871dbdd5a6b6a68e826e2a02c8402bab9884af4dfcbd83e0765944b"
        },
        {
          "name": "report_outdated_info",
          "title": "Report outdated exchange fee or regulatory info",
          "description": "Submit a field report if an exchange fee tier, country KYC rule, bank rail or withdrawal limit has changed.",
          "inputSchema": {
            "properties": {
              "field": {
                "enum": ["status", "steps", "pricing", "limits", "broken_link", "other"],
                "type": "string"
              },
              "message": {
                "maxLength": 800,
                "minLength": 5,
                "type": "string"
              },
              "path": {
                "maxLength": 160,
                "type": "string"
              }
            },
            "required": ["field", "message", "path"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:cdee87e892727e4fbd187ca68116b7e62fdea048ec82238847e49ff7b253cf96"
        },
        {
          "name": "search_guides",
          "title": "Search crypto exchange & wallet guides",
          "description": "Search CryptoExchangeIn guides and comparisons by query, country slug (e.g. \"india\", \"us\", \"uk\", \"canada\", \"australia\", \"nigeria\", \"eu\", \"uae\", \"china\"), or topic (\"fees\", \"availability\", \"wallets\", \"beginners\", \"cash_out\", \"no_kyc\").",
          "inputSchema": {
            "properties": {
              "country": {
                "maxLength": 60,
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "maxLength": 200,
                "type": "string"
              },
              "topic": {
                "enum": ["fees", "availability", "wallets", "beginners", "cash_out", "no_kyc"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e54a4566c4a6dede48d1ee9ce5a5544ddf5b7606022ecd047d2ccd3d4bbf8f63"
        }
      ],
      "digest": "sha256:2f678fc4f00a4e881a689528db5a405ef39bf30d6ed5b9477ca2952a96772975"
    }
  }
}
