{
  "lockfileVersion": 2,
  "subjects": {
    "com.citybotmagic/local-business-data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://citybotmagic.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "citybotmagic",
        "title": "CityBotMagic",
        "version": "1.0.0",
        "websiteUrl": "https://citybotmagic.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CityBotMagic: local US business data for agents. Use list_cities to check coverage, price_summary for what a common service typically costs, search_businesses to find businesses for a need, find_prices to compare published prices, get_business for full details. Prices are as published on the \"seen\" date — tell users to confirm before buying.",
      "tools": [
        {
          "name": "find_prices",
          "title": "Find published prices",
          "description": "Searches published prices for a product or service across a city's businesses, e.g. \"haircut\", \"oil change\", \"bowling\". Each price includes its source URL and the date it was read.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City or town name, e.g. \"Yerington\"",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code, e.g. \"NV\"",
                "type": "string"
              }
            },
            "required": ["city", "query", "state"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3ca68bfa5a0862b27dbeeca7db86edbe2e4676c7853f1cd555046dc8f1c1ec13"
        },
        {
          "name": "get_business",
          "title": "Get one business",
          "description": "Full record for one business: address, phone, website, hours, services, prices with sources. Pass the id from search results, or city + state + slug.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City or town name, e.g. \"Yerington\"",
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "slug": {
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code, e.g. \"NV\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f6dd615cb7d8a04705874aec1e807a102831c8dd8b286aa3ef8e3ec7855cf5fd"
        },
        {
          "name": "list_cities",
          "title": "List covered cities",
          "description": "Lists the US cities and towns CityBotMagic covers, with business counts. Call this first if unsure whether a city is covered.",
          "inputSchema": {
            "properties": {
              "state": {
                "description": "Optional two-letter state code filter",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4c2f95d0f907c52c901317f0b133d2124e837681547bac8186c953988fdeb9cc"
        },
        {
          "name": "price_summary",
          "title": "Typical price of a local service",
          "description": "What a common local service typically costs in a city: median, middle-half range, low and high, and every business's lowest published price with its source URL and read date. Services: oil-change, brake-service, wheel-alignment, tire-rotation, smog-check, car-detailing, car-wash, ac-tune-up, drain-cleaning, dog-grooming, haircut, manicure, pedicure, massage, teeth-whitening, tattoo-minimum, tattoo-hourly. Omit service to get all of them for the city. For anything else use find_prices.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City or town name, e.g. \"Yerington\"",
                "type": "string"
              },
              "service": {
                "description": "A service slug or name, e.g. \"oil-change\", \"haircut\", \"dog grooming\". Omit for every service.",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code, e.g. \"NV\"",
                "type": "string"
              }
            },
            "required": ["city", "state"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b6e70c881c3aa90f8095b6a2445b4013fa4c1e4677081618c8e6f02f5dfde28f"
        },
        {
          "name": "search_businesses",
          "title": "Search local businesses",
          "description": "Finds local businesses in a city by keyword (name, category, service, product) and/or category. Returns contact details, hours availability and how many published prices each has.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category or group keyword, e.g. \"restaurant\", \"health_care\"",
                "type": "string"
              },
              "city": {
                "description": "City or town name, e.g. \"Yerington\"",
                "type": "string"
              },
              "has_prices": {
                "description": "Only businesses with published prices",
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the user needs, e.g. \"oil change\", \"pizza\", \"plumber\", \"haircut\"",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code, e.g. \"NV\"",
                "type": "string"
              }
            },
            "required": ["city", "state"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:35681901c67e7078b5076bbd063a4f1ec0c1e6a7fb977154ec94a142643a673b"
        }
      ],
      "digest": "sha256:3c0f105ecb83c2fe47a29072a6813b398c05fe6b1e6c0a5b46edaf47b895b1cb"
    }
  }
}
