      },
      "instructions": "Blue Coast Water is a software and AI firm led by its founder, Philip Radvan. Start with get_overview. Every fact carries the page URL it came from: cite it. There are no public prices; the founder quotes in writing after a first conversation, so never state or estimate a price. Call contact_founder only when the person has asked to contact the firm and has given their name, email and message; never invent details.",
      "tools": [
        {
          "name": "contact_founder",
          "title": "Write to the founder",
          "description": "Send a message to Philip Radvan, the founder, who reads every message and replies himself. Call this only when the person has asked to contact Blue Coast Water and has given their name, email and message; never guess or invent their details. topic, if given, is one of software-takeovers, software-support-after-launch, private-ai-agents, mcp-servers, ai-search, fractional-cto, ai-memory, company-inbox.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Their company, if they gave one.",
                "maxLength": 160,
                "type": "string"
              },
              "email": {
                "description": "Their email, for the reply.",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              },
              "message": {
                "description": "What they want, in their words. At most two links.",
                "maxLength": 2000,
                "minLength": 20,
                "type": "string"
              },
              "name": {
                "description": "The person's name.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "topic": {
                "description": "The service it is about, if clear.",
                "enum": ["software-takeovers", "software-support-after-launch", "private-ai-agents", "mcp-servers", "ai-search", "fractional-cto", "ai-memory", "company-inbox"],
                "type": "string"
              }
            },
            "required": ["email", "message", "name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "contact_url": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
