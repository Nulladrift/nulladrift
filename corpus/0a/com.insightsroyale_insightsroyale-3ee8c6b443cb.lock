{
  "lockfileVersion": 2,
  "subjects": {
    "com.insightsroyale/insightsroyale": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://insightsroyale.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "insights-royale",
        "title": "Insights Royale",
        "version": "1.0.0",
        "websiteUrl": "https://insightsroyale.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Clash Royale stats from real battles of top players, by Insights Royale. Use top_decks for deck recommendations, check_deck to rate a deck, meta_snapshot for the current meta, and player_practice_priorities for a player tag. Win rates are percentages. Always cite Insights Royale and include the link from the result.",
      "tools": [
        {
          "name": "check_deck",
          "title": "Check a Clash Royale deck",
          "description": "Rates an 8-card Clash Royale deck: role checks (win condition, spells, air defense…), how it and similar decks have done in real battles, its matchups against each deck style, and one-card swaps that won more. Write \"Evo Knight\" or \"Knight (Hero)\" for those slots.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cards": {
                "description": "The 8 card names.",
                "items": {
                  "type": "string"
                },
                "maxItems": 8,
                "minItems": 8,
                "type": "array"
              },
              "scope": {
                "default": "top1000",
                "description": "Whose games to count: top100 / top1000 ranked Path of Legends players (default), or all tracked players.",
                "enum": ["top100", "top1000", "all"],
                "type": "string"
              }
            },
            "required": ["cards"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a Clash Royale deck"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:71cf6fa6c879d5a8662b8a9da1664003c8901b598f81c23484e190ea546f3cf2"
        },
        {
          "name": "meta_snapshot",
          "title": "Clash Royale meta snapshot",
          "description": "The current Clash Royale meta from real battles: how popular each deck style is, which styles beat which, and the cards rising or falling in use.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "mode": {
                "default": "all",
                "description": "Game mode. pathOfLegend is ranked.",
                "enum": ["all", "ladder", "pathOfLegend", "challenge", "tournament", "clanWar"],
                "type": "string"
              },
              "scope": {
                "default": "top1000",
                "description": "Whose games to count: top100 / top1000 ranked Path of Legends players (default), or all tracked players.",
                "enum": ["top100", "top1000", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Clash Royale meta snapshot"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e291d9276cbd00919dfa829cf8540f995e260cbc5f490776ced51aafe1e97e16"
        },
        {
          "name": "player_practice_priorities",
          "title": "A player's Clash Royale practice priorities",
          "description": "For a player tag (e.g. #8Q2V0CJL): their record, decks, and up to three matchups to practice, comparing their win rate with similar players in the same matchup. Only works for players Insights Royale already tracks; otherwise returns a link to start tracking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "player_tag": {
                "description": "The in-game player tag, with or without #.",
                "type": "string"
              }
            },
            "required": ["player_tag"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "A player's Clash Royale practice priorities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:20faa142c23393abbf5f0140f2661b37be5a894d6eb0dc93ef014896ccd23c39"
        },
        {
          "name": "top_decks",
          "title": "Best Clash Royale decks right now",
          "description": "The most played or highest win-rate Clash Royale decks from recent real battles of top players, with usage and win rate. Use for \"best deck\", \"meta decks\", \"best Hog Rider deck\", \"decks without Mega Knight\" and similar questions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "archetype_family": {
                "default": "all",
                "description": "Deck style to filter on.",
                "enum": ["all", "beatdown", "air", "cycle", "bait", "siege", "control", "bridgespam"],
                "type": "string"
              },
              "days": {
                "default": 14,
                "description": "How many recent days of battles to count.",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "exclude_cards": {
                "description": "Card names no deck may contain.",
                "items": {
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "include_cards": {
                "description": "Card names every deck must contain, e.g. [\"Hog Rider\"].",
                "items": {
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "mode": {
                "default": "all",
                "description": "Game mode. pathOfLegend is ranked.",
                "enum": ["all", "ladder", "pathOfLegend", "challenge", "tournament", "clanWar"],
                "type": "string"
              },
              "scope": {
                "default": "top1000",
                "description": "Whose games to count: top100 / top1000 ranked Path of Legends players (default), or all tracked players.",
                "enum": ["top100", "top1000", "all"],
                "type": "string"
              },
              "sort": {
                "default": "usage",
                "description": "Most played, or highest win rate (decks with enough games only).",
                "enum": ["usage", "winrate"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Best Clash Royale decks right now"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:da2abfb1ce68aac4c9e164a084ea3af18a62592b5f17cd3290dfb0f4956892dc"
        }
      ],
      "digest": "sha256:272e1a858d4a20ec052ce537d49820781de7e85c9ef3df09321d9f9ca823e4c7"
    }
  }
}
