      "instructions": "Directory of x402-paid + MCP services on agent-tools.cloud. Built for AGENT consumers — humans use the website, agents use these tools.\n\nTypical flow:\n  1. `ask_services(intent=...)` for an LLM-ranked recommendation, or\n     `search(intent=..., has_mcp=True)` to manually inspect candidates.\n  2. Inspect `match_reason` + `confidence` + `tx_30d` on each item to\n     judge quality. Prefer `popular+healthy` items.\n  3. `get(slug)` to fetch the service card: payment, call, quality,\n     resource samples, and ready-to-paste MCP/x402 call hints.\n  4. Use `list_categories` to discover the taxonomy and `stats` for\n     directory size + health.\n  5. `scan_mcp_safety(endpoint_url)` screens an MCP server for malware /\n     prompt-injection lures: returns our latest stored verdict if it is\n     already indexed, otherwise probes + scans it live and adds it to the\n     directory.\n  6. `prepare_paid_verification` -> sign `typed_data` in your wallet ->\n     `execute_paid_verification`: pay a service once and record the\n     result. Needs an API key (`create_api_key` or POST /api/v1/keys).\n  7. With an account API key in the Authorization: Bearer header, use `claim_service_url(url)` -> publish the returned token -> `verify_service_url(claim_id, token)` -> `get_owned_listing` / `edit_owned_listing`. A claim covers only its exact public HTTPS URL, not the host or sibling services.",
      "tools": [
        {
          "name": "ask_services",
          "description": "Ask for the best x402/MCP services for an agent intent.\n\n    This is the high-level discovery tool: it retrieves candidates from the\n    directory, asks the configured backend LLM to rank only those candidates,\n    and returns service cards for the selected recommendations. If the LLM is\n    unavailable, it falls back to the directory ranker.\n\n    Args:\n        intent: Natural-language job the agent wants to accomplish.\n        top_k: Max recommendations to return (1-10).\n        max_price_usd: Optional per-call budget cap.\n        category: Optional directory category filter.\n        chain: Optional payment network filter, e.g. \"base\" or \"solana\".\n        require_healthy: When true, only consider services marked health=ok.\n        min_confidence: Optional x402scan quality floor (0.0-1.0).\n        has_mcp: When true, only consider services with MCP endpoints.\n        use_llm: Set false for deterministic retrieval-only fallback.\n    ",
          "inputSchema": {
            "properties": {
              "category": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
