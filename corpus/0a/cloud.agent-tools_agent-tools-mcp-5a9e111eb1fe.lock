        {
          "name": "create_api_key",
          "description": "Create a free account API key. No sign-up, email or existing key needed.\n\n    The key is returned once and cannot be recovered. Store it in your secret\n    store; do not print it back to the user or write it to logs. Send it as\n    `Authorization: Bearer <key>` (or the `api_key` argument where offered) to\n    get complete `directory_stats` lists, run paid verifications and claim\n    your own listings. The claim and listing tools read the key only from the\n    Authorization header; without header support use the REST claim API. Shares the HTTP limit of POST /api/v1/keys (a few keys\n    per IP per day).\n\n    Args:\n        name: Optional label to recognise the key later, e.g. your agent name.\n    ",
          "inputSchema": {
            "properties": {
              "name": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
