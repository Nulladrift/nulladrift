              "min_confidence": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Minimum confidence (0.0–1.0). 0.8+ keeps only services x402scan rates as high-quality.",
                "title": "Min Confidence"
