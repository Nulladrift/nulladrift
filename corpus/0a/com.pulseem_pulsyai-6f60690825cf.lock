      "tools": [
        {
          "name": "call_pulseem_api",
          "description": "Executes any Pulseem API operation.\nBEFORE CALLING: Always call GetPulseemInstructions first.\n\noperationId (case-insensitive):\n  SendSms, GetSMSReport, GetIncomingSmsReport,\n  SendEmail, GetEmailReport,\n  SendWhatsAppChat, SendWhatsAppTemplate, SubmitWhatsAppTemplate,\n  GetTemplateStatus, GetWhatsAppReport, DeleteWhatsAppTemplate, GetIncomingWhatsApp,\n  GetCreditBalance, CreditTransfer, AddNewSubaccountAndDirectAccount,\n  ChangeClientStatus, GetClientStatus, GetRemovedClients\n\npathParamsJson — ONLY for DeleteWhatsAppTemplate: {\"templateId\":\"HXxxxx\"}\nDATE FORMAT: Use yyyyMMddHHmmss, NOT ISO 8601.",
          "inputSchema": {
            "properties": {
              "operationId": {
                "description": "Operation name. Case-insensitive.",
                "type": "string"
              },
              "pathParamsJson": {
                "default": "{}",
                "description": "Path parameters as JSON — ONLY for DeleteWhatsAppTemplate.",
                "type": "string"
              },
              "payloadJson": {
                "default": "{}",
                "description": "JSON body for the request. Use {} for operations with no body.",
                "type": "string"
              }
            },
            "required": ["operationId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6dc0af83e77d0c43a16fee4801dee1ab7ce8cef0d017f8f6296ec356a9eece0d"
        },
        {
          "name": "get_pulseem_api_docs",
          "description": "Returns the FULL detailed Pulseem API documentation for a specific category.\ncategory: 'sms' | 'email' | 'whatsapp' | 'accounts' | 'clients' | 'all'",
          "inputSchema": {
            "properties": {
              "category": {
                "default": "all",
                "description": "Category: 'sms' | 'email' | 'whatsapp' | 'accounts' | 'clients' | 'all'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:47655b816df5b41d3cc8b861455065a75a3fe7fe58f7eccc5e2f13f77b6fd3a3"
        },
        {
          "name": "get_pulseem_instructions",
          "description": "⚠️ ALWAYS call this tool FIRST before any other Pulseem tool.\n\nReturns:\n- Date/time format rules (CRITICAL — wrong format = server error)\n- Required fields for every operation type\n- Full JSON examples for SendSms, SendEmail, SendWhatsAppChat, SendWhatsAppTemplate\n- All error codes and their meanings\n- API authentication rules\n- Credit balance, CreditTransfer, AddNewSubAccount rules\n- ChangeClientStatus / GetClientStatus / GetRemovedClients rules",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:37e7742097bebbd91601ba82b38c90ac195f7bfbacc0f02c383a7d52c9634467"
        },
        {
          "name": "list_pulseem_operations",
          "description": "Returns live list of ALL available Pulseem operations (from the live Swagger spec).\nUse this ONLY if you need to verify exact operationIds before calling CallPulseemApi.",
          "inputSchema": {
