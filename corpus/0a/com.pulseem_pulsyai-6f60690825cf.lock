      "tools": [
        {
          "name": "call_pulseem_api",
          "description": "Executes any Pulseem API operation.\nBEFORE CALLING: Always call GetPulseemInstructions first.\n\noperationId (case-insensitive):\n  SendSms, GetSMSReport, GetIncomingSmsReport,\n  SendEmail, GetEmailReport,\n  SendWhatsAppChat, SendWhatsAppTemplate, SubmitWhatsAppTemplate,\n  GetTemplateStatus, GetWhatsAppReport, DeleteWhatsAppTemplate, GetIncomingWhatsApp,\n  GetCreditBalance, CreditTransfer, AddNewSubaccountAndDirectAccount,\n  ChangeClientStatus, GetClientStatus, GetRemovedClients\n\npathParamsJson — ONLY for DeleteWhatsAppTemplate: {\"templateId\":\"HXxxxx\"}\nDATE FORMAT: Use yyyyMMddHHmmss, NOT ISO 8601.",
          "inputSchema": {
            "properties": {
              "operationId": {
                "description": "Operation name. Case-insensitive.",
                "type": "string"
              },
              "pathParamsJson": {
                "default": "{}",
                "description": "Path parameters as JSON — ONLY for DeleteWhatsAppTemplate.",
                "type": "string"
              },
              "payloadJson": {
                "default": "{}",
                "description": "JSON body for the request. Use {} for operations with no body.",
                "type": "string"
              }
            },
            "required": ["operationId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "optional"
          },
          "digest": "sha256:e5f890471c9d130c2f30d6390368c644bbd80b00e0ccb4b33bcc905d90a2e489"
        },
        {
          "name": "get_pulseem_api_docs",
          "description": "Returns the FULL detailed Pulseem API documentation for a specific category.\ncategory: 'sms' | 'email' | 'whatsapp' | 'accounts' | 'clients' | 'all'",
          "inputSchema": {
            "properties": {
              "category": {
                "default": "all",
                "description": "Category: 'sms' | 'email' | 'whatsapp' | 'accounts' | 'clients' | 'all'",
