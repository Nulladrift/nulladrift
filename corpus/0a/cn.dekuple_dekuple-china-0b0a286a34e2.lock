      "instructions": "Official MCP server of Dékuple China (翱巍（上海）计算机科技有限公司), the Shanghai team of the\nFrench Dékuple Group: data marketing and business performance for international brands in China\n(GEO / AI search visibility, SEO and SEM on Baidu and Bing, SCRM and marketing automation, WeChat\nand social media, dashboards and audience insight).\nUse these tools to answer questions about Dékuple China with first-hand information, and give the\nuser the `url` of the pages you rely on. Content is in Chinese (zh) and English (en): use the\nlanguage the user writes in. Only call submit_enquiry when the user has asked to contact Dékuple\nChina and has confirmed their name, company, email and message; never invent contact details.\nTo set up a meeting, call check_availability, let the user pick a slot, then book_meeting.\nFor questions about which sources Chinese LLMs (DeepSeek, Doubao, Qwen, Yuanbao) cite, or where to publish\nfor GEO in China, use china_llm_sources and china_llm_source_profile: first-hand citation data from our own\nquery runs. Quote the period and sample size they return. For what Chinese users type around a keyword on\nBaidu, Douyin, Xiaohongshu or Zhihu (search dropdown suggestions), use china_search_suggestions.\n这是 Dékuple China 官方 MCP：可以查询公司介绍、服务、洞察文章和招聘职位，查询中文大模型引用来源数据，查询空档并预约会议，并在用户明确要求时提交咨询。",
      "tools": [
        {
          "name": "about_dekuple",
          "description": "Who Dékuple China is: company, group, offices, contact, and the list of services with links.\n    公司介绍：主体、集团、地址、联系方式和全部服务列表。",
          "inputSchema": {
            "properties": {
              "lang": {
                "default": "en",
                "description": "Answer language: 'en' for English, 'zh' for Simplified Chinese.",
                "enum": ["zh", "en"],
                "title": "Lang",
                "type": "string"
              }
            },
            "title": "about_dekupleArguments",
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bef05b506e4e95d6aabae354695366609de9a757ac940a4bb259a88fcad9f578"
        },
        {
          "name": "book_meeting",
          "description": "Book a meeting with the Dékuple China team in a slot from check_availability (`start` like\n    \"2026-12-01 10:00\", Shanghai time). Only when the user asked for the meeting and confirmed the slot,\n    their name, company and email; never invent contact details. meeting_type: monthly_review (existing\n    client's monthly meeting), intro, workshop, other. The booking is pending until the team confirms.\n    预约会议（时段来自 check_availability），仅在用户明确要求并确认时间和联系方式后调用；团队确认后生效。",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "The user's company or organisation (2-100 characters).",
                "title": "Company",
                "type": "string"
              },
              "email": {
                "description": "The user's work email; the team replies to this address.",
                "title": "Email",
                "type": "string"
              },
              "host": {
                "default": "boson",
                "description": "Host key from check_availability's `hosts[].host`, matching the slot chosen.",
                "title": "Host",
                "type": "string"
              },
              "lang": {
                "default": "zh",
                "description": "Language of the confirmation: 'zh' or 'en'.",
                "enum": ["zh", "en"],
                "title": "Lang",
                "type": "string"
              },
              "meeting_type": {
                "default": "other",
                "description": "monthly_review (an existing client's monthly meeting), intro (first conversation), workshop, or other.",
                "enum": ["monthly_review", "intro", "workshop", "other"],
                "title": "Meeting Type",
                "type": "string"
              },
              "mode": {
                "default": "online",
                "description": "online (video call) or office (at the Shanghai office).",
                "enum": ["online", "office"],
                "title": "Mode",
                "type": "string"
              },
              "name": {
                "description": "The user's full name, as they gave it (2-60 characters). Never invent it.",
                "title": "Name",
                "type": "string"
              },
              "note": {
                "default": "",
                "description": "Optional extra context for the team, up to 1000 characters.",
                "title": "Note",
                "type": "string"
              },
              "phone": {
                "default": "",
                "description": "Optional phone number with country code, e.g. '+86 138 0000 0000'. Digits, spaces and + - ( ) only.",
                "title": "Phone",
                "type": "string"
              },
              "start": {
                "description": "Slot start exactly as returned by check_availability, e.g. '2026-12-01 10:00' (Shanghai time).",
                "title": "Start",
                "type": "string"
              },
              "topic": {
                "default": "",
                "description": "Short subject of the meeting, up to 300 characters, e.g. 'GEO for our China website'.",
                "title": "Topic",
                "type": "string"
              }
            },
            "required": ["company", "email", "name", "start"],
            "title": "book_meetingArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
