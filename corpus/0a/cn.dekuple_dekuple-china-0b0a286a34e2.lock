        {
          "name": "check_availability",
          "description": "Open 1-hour meeting slots with the Dékuple China team (Shanghai time), within the next 3 weeks.\n    Dates are YYYY-MM-DD; leave them empty for the whole window. The answer includes today's date and the\n    dates of next week's Mon-Fri, so you can turn \"next Tuesday\" into a date. Then call book_meeting.\n    查询可预约的会议时段（上海时间，1 小时一档，未来 3 周内）；结果附带今天和下周一到周五的日期。",
          "inputSchema": {
            "properties": {
              "date_from": {
                "default": "",
                "title": "Date From",
                "type": "string"
              },
              "date_to": {
                "default": "",
                "title": "Date To",
                "type": "string"
              },
              "lang": {
