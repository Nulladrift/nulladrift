          "digest": "sha256:e74d10b52d88730955c8d1283a3fdfb5f0c02743409f2f09faedeb0c5abd7c70"
        },
        {
          "name": "china_search_suggestions",
          "description": "What Chinese users actually type around a keyword: the search-box dropdown suggestions (下拉词) that\n    Baidu, Douyin, Xiaohongshu and Zhihu show for it, collected daily by Dékuple China's crawler since May 2026.\n    Use it to understand user intent and long-tail questions per platform, and to write GEO prompts or content\n    that match how people search in China. If the exact keyword was never crawled, returns stored suggestions\n    that contain it.\n    中国用户围绕某个词实际搜什么：百度、抖音、小红书、知乎的搜索下拉词（Dékuple China 每日抓取）。",
          "inputSchema": {
            "properties": {
              "keyword": {
                "description": "A Chinese keyword or short phrase (2-30 characters), e.g. '跑步', '鸿蒙系统', '离婚财产分割'. Search suggestions are mostly in Chinese, so pass the Chinese term.",
                "title": "Keyword",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum suggestions per platform (1-50; larger values are capped at 50).",
                "title": "Limit",
                "type": "integer"
              },
              "platform": {
                "default": "all",
                "description": "baidu, douyin (抖音), xiaohongshu (小红书), zhihu (知乎), or 'all' for the four side by side.",
                "enum": ["all", "baidu", "douyin", "xiaohongshu", "zhihu"],
                "title": "Platform",
                "type": "string"
              }
            },
            "required": ["keyword"],
            "title": "china_search_suggestionsArguments",
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
