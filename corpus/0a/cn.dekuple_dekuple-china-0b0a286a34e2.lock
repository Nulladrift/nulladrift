        {
          "name": "check_availability",
          "description": "Open 1-hour meeting slots with the Dékuple China team (Shanghai time), within the next 3 weeks.\n    Dates are YYYY-MM-DD; leave them empty for the whole window. The answer includes today's date and the\n    dates of next week's Mon-Fri, so you can turn \"next Tuesday\" into a date. Then call book_meeting.\n    查询可预约的会议时段（上海时间，1 小时一档，未来 3 周内）；结果附带今天和下周一到周五的日期。",
          "inputSchema": {
            "properties": {
              "date_from": {
                "default": "",
                "description": "First day to look at, YYYY-MM-DD (Shanghai time). Empty = today.",
                "title": "Date From",
                "type": "string"
              },
              "date_to": {
                "default": "",
                "description": "Last day to look at, YYYY-MM-DD. Empty = end of the 3-week window.",
                "title": "Date To",
                "type": "string"
              },
              "lang": {
                "default": "zh",
                "description": "Language of the slot labels and host roles: 'zh' or 'en'.",
                "enum": ["zh", "en"],
                "title": "Lang",
                "type": "string"
              },
              "part_of_day": {
                "default": "any",
                "description": "Only morning slots (before 12:00), only afternoon slots, or any.",
                "enum": ["any", "morning", "afternoon"],
                "title": "Part Of Day",
                "type": "string"
              }
            },
            "title": "check_availabilityArguments",
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:66f18ac1173e82a9613ed9761a863bf2a6e8f7861aac619de1034e250d44c8f0"
        },
        {
          "name": "china_llm_source_profile",
          "description": "How often Chinese LLMs cite one website: citations per platform (DeepSeek, Doubao, Qwen, Yuanbao), its rank\n    among all cited third-party sites, and the industries it is cited for. Use it to judge whether a media outlet\n    or platform is worth publishing on for GEO in China. Covers sites with at least 20 citations in the study.\n    某个网站被中文大模型引用的情况：各平台引用次数、总排名、主要被引用的行业。",
          "inputSchema": {
            "properties": {
              "site": {
                "description": "Site name or domain as Chinese LLMs cite it, e.g. '知乎专栏', '搜狐', '百度百科', 'zhihu.com', 'sohu.com'. Partial names work.",
                "title": "Site",
                "type": "string"
              }
            },
            "required": ["site"],
            "title": "china_llm_source_profileArguments",
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:32d7c22940966590ddbbc2bba14f0f6ea62fab62dec7f495ae85e678470440e4"
        },
        {
          "name": "china_llm_sources",
          "description": "Which websites Chinese LLMs (DeepSeek, Doubao, Qwen, Tencent Yuanbao) actually cite in their answers,\n    by industry and platform: the share of each source type (brand sites, trade media, portals, social, e-commerce,\n    academic, government) and the 20 most-cited third-party sites. First-hand data from Dékuple China's own query\n    runs (tens of thousands of citations), useful for GEO: where to publish so Chinese AI answers cite you.\n    中文大模型（DeepSeek、豆包、千问、元宝）回答时实际引用哪些网站：按行业和平台看来源类型占比和引用最多的 20 个第三方网站。",
          "inputSchema": {
            "properties": {
              "industry": {
                "default": "all",
                "description": "Industry of the questions, or 'all'. E.g. 'automotive', 'chemicals-materials', 'finance'.",
                "enum": ["all", "chemicals-materials", "industrial-manufacturing", "tech-internet", "automotive", "ecommerce-shopping", "legal-policy", "energy-environment", "food-restaurants", "finance", "travel", "construction", "healthcare", "home-living", "education", "other"],
                "title": "Industry",
                "type": "string"
              },
              "platform": {
                "default": "all",
                "description": "Chinese LLM: deepseek, doubao (豆包, ByteDance), qianwen (千问 / Qwen, Alibaba), yuanbao (元宝, Tencent), or 'all'.",
                "enum": ["all", "deepseek", "doubao", "qianwen", "yuanbao"],
                "title": "Platform",
                "type": "string"
              }
            },
            "title": "china_llm_sourcesArguments",
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
