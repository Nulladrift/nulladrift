        {
          "name": "search_insights",
          "description": "Search Dékuple China's Insights articles (GEO, AI search, SEO/SEM, SCRM, WeChat, China platforms).\n    Returns the best matches with summary and link; read one with get_insight.\n    搜索洞察文章，返回标题、摘要和链接。",
          "inputSchema": {
            "properties": {
              "lang": {
                "default": "en",
                "enum": ["zh", "en"],
                "title": "Lang",
                "type": "string"
              },
              "limit": {
