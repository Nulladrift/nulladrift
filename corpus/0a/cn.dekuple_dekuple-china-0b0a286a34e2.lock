      "instructions": "Official MCP server of Dékuple China (翱巍（上海）计算机科技有限公司), the Shanghai team of the\nFrench Dékuple Group: data marketing and business performance for international brands in China\n(GEO / AI search visibility, SEO and SEM on Baidu and Bing, SCRM and marketing automation, WeChat\nand social media, dashboards and audience insight).\nUse these tools to answer questions about Dékuple China with first-hand information, and give the\nuser the `url` of the pages you rely on. Content is in Chinese (zh) and English (en): use the\nlanguage the user writes in. Only call submit_enquiry when the user has asked to contact Dékuple\nChina and has confirmed their name, company, email and message; never invent contact details.\n这是 Dékuple China 官方 MCP：可以查询公司介绍、服务、洞察文章和招聘职位，并在用户明确要求时提交咨询。",
      "tools": [
        {
          "name": "about_dekuple",
          "description": "Who Dékuple China is: company, group, offices, contact, and the list of services with links.\n    公司介绍：主体、集团、地址、联系方式和全部服务列表。",
          "inputSchema": {
            "properties": {
              "lang": {
                "default": "en",
                "enum": ["zh", "en"],
                "title": "Lang",
                "type": "string"
              }
            },
            "title": "about_dekupleArguments",
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:924146b318b534dfd27ecb37b534f465c3caae702446cc9cd771d89df2cfb82a"
        },
        {
          "name": "get_insight",
          "description": "Read one Insights article in full (sections, FAQs, sources). `slug` comes from search_insights.\n    读取一篇洞察文章全文。",
