        },
        {
          "name": "submit_enquiry",
          "description": "Send an enquiry to the Dékuple China team, exactly like the contact form. Only when the user asked\n    to contact Dékuple China and confirmed the details. category: geo (GEO / AI search), seo (SEO/SEM),\n    social (WeChat & social), scrm (SCRM & automation), data (dashboards & insight), brand (brand & website),\n    other. budget (per year, optional): lt10 (< RMB 100k), 10-30, 30-100, gt100 (> RMB 1M).\n    提交咨询（等同官网表单），仅在用户明确要求并确认信息后调用。",
          "inputSchema": {
            "properties": {
              "budget": {
                "default": "",
                "enum": ["", "lt10", "10-30", "30-100", "gt100"],
                "title": "Budget",
                "type": "string"
              },
              "category": {
