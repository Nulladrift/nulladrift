          "inputSchema": {
            "properties": {
              "redact_pii": {
                "description": "Redact PII in sanitized output (default true)",
                "type": "boolean"
              },
              "text": {
                "description": "Untrusted input text",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b8a20961119f56a3af7a48484a371711dff8fe7691172d49de1ba6f365a923e7"
        },
        {
          "name": "agent_output_validator",
          "description": "Validate LLM output: repair JSON, enforce schema, check grounding against a source, extract citations",
          "inputSchema": {
            "properties": {
              "output": {
                "description": "Raw LLM output",
                "type": "string"
              },
              "schema": {
                "description": "JSON Schema subset to enforce",
                "type": "object"
              },
              "source": {
                "description": "Source text for grounding check",
                "type": "string"
              }
            },
            "required": ["output"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
