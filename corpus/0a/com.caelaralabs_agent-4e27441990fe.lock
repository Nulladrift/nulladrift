            "properties": {
              "text": {
                "description": "Text containing citations",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
