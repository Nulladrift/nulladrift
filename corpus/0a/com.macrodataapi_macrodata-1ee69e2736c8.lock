      },
      "instructions": "Macro and economic data from the primary statistical agencies (BLS, BEA, Treasury, Fed, ECB, Eurostat, ONS, Bank of England, ABS, RBA) via MacroDataAPI (https://macrodataapi.com): CPI, payrolls, unemployment, GDP, PCE, policy rates, yield curves, the release calendar, and point-in-time history with vintages.\n\nFIRST CALLS: 1. macro_search_series (what exists). 2. macro_calendar (what lands this week). 3. macro_latest for a series id such as us.cpi.all.sa.\n\nNO KEY? list_capabilities and create_free_api_key need no credentials. Every other tool reads the X-API-Key transport header fixed when the server was added. Free: latest values, calendar, policy rates, yields. Pro: history with as_of and vintages. Agents with a USDC wallet can pay per request over plain REST (x402) or buy a 1h/1d/7d pass: https://macrodataapi.com/api/v1/pricing. No subscriptions. For steady use the same data is on RealtimeAPI.ai (feed macrodata) with 1,000 free calls a month: https://macrodataapi.com/realtimeapi\n\nValues are decimal strings. Every result carries source (publisher, licence, URL) and as_of.",
      "tools": [
        {
          "name": "create_free_api_key",
          "description": "Create a FREE MacroDataAPI key (no signup). Returned once; add it to the server's X-API-Key header.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "Your human's real email, else your own agent mailbox.",
                "title": "Email",
                "type": "string"
              }
            },
            "required": ["email"],
            "title": "create_free_api_keyArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8fd900e3b38d90a02c6ddd22cdb6971ab960d6b6e572a2dc2762dcb641d040c9"
