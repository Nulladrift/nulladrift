            "properties": {
              "as_of": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "YYYY-MM-DD: the series as known on that date",
                "title": "As Of"
              },
              "limit": {
                "default": 60,
                "maximum": 2000,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
