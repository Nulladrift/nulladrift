{
  "lockfileVersion": 2,
  "subjects": {
    "com.finallyoffline.www/culture": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.finallyoffline.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "finallyoffline-mcp",
        "title": "Finally Offline",
        "version": "2.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Public news, search and trends are free without registration. To identify an integration, call register_agent with agent_name and operator_name, save its agent_token, then use that token for subscribe and generate_digest. Tokens authenticate integrations; operator profiles are self-reported. Never send tokens in URLs. Live Culture Pulse: https://www.finallyoffline.com/agents/culture-trending",
      "tools": [
        {
          "name": "generate_digest",
          "description": "Generate a branded HTML digest for your subscribed integration. Call register_agent, then subscribe with its agent_token; use that same token here.",
          "inputSchema": {
            "properties": {
              "agent_name": {
                "description": "Optional attribution label. The digest uses the name saved during registration.",
                "type": "string"
              },
              "agent_token": {
                "description": "Credential from register_agent. Alternative to Authorization: Bearer. Never put it in URLs.",
                "type": "string"
              },
              "category": {
                "default": "all",
                "description": "Category focus for the digest",
                "enum": ["sports", "music", "fashion", "culture", "all"],
                "type": "string"
              },
              "since": {
                "default": "7d",
                "description": "Time window for articles",
                "enum": ["24h", "7d", "30d"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c7131c4bea772dba66be2e41246f7313a1ef0d4b95e48db20b29c3676fbdcbbd"
        },
        {
          "name": "get_culture_news",
          "description": "Get the latest human culture news from Finally Offline. Covers sports, music, fashion, and general culture.",
          "inputSchema": {
            "properties": {
              "agent_token": {
                "description": "Credential from register_agent. Alternative to Authorization: Bearer. Never put it in URLs.",
                "type": "string"
              },
              "category": {
                "default": "all",
                "description": "Filter by category. Use 'all' for everything.",
                "enum": ["sports", "music", "fashion", "culture", "all"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Number of articles to return (1-20)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "default": "24h",
                "description": "Time window for articles",
                "enum": ["1h", "24h", "7d", "30d"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7c3defefcd3442bc9b2171bd714a9a1911f18f3f2e8d9aa32111a8f6837d1e99"
        },
        {
          "name": "get_trending_topics",
          "description": "Get what's trending right now in human culture. Returns topic frequency analysis, top headlines per category, and cultural pulse data. Perfect for agents that need to stay current.",
          "inputSchema": {
            "properties": {
              "agent_token": {
                "description": "Credential from register_agent. Alternative to Authorization: Bearer. Never put it in URLs.",
                "type": "string"
              },
              "timeframe": {
                "default": "this_week",
                "description": "Time window for trending analysis",
                "enum": ["today", "this_week", "this_month"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:55e0b1e02ada6f52880d86b872a73700eff90e4eb88cf68c50fad8ebd8df0ec6"
        },
        {
          "name": "register_agent",
          "description": "Register an integration with a self-reported operator profile. Returns a new server-owned agent_id and a one-time agent_token. Save the token securely. It identifies this integration, not a verified person. Public reading needs no registration.",
          "inputSchema": {
            "properties": {
              "agent_name": {
                "description": "Name of your integration",
                "maxLength": 120,
                "type": "string"
              },
              "contact_email": {
                "description": "Optional contact address, self-reported and not email verified",
                "maxLength": 254,
                "type": "string"
              },
              "is_test": {
                "default": false,
                "description": "Mark your own diagnostic/test integration",
                "type": "boolean"
              },
              "operator_name": {
                "description": "Person, team or company operating it (self-reported)",
                "maxLength": 160,
                "type": "string"
              },
              "operator_website": {
                "description": "Optional public HTTPS website",
                "maxLength": 2048,
                "type": "string"
              },
              "usage_purpose": {
                "description": "How this integration uses Finally Offline content",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["agent_name", "operator_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:f490a7bb381461dae02cf557c4468686997eb2283394c9ef33fff68ae589c322"
        },
        {
          "name": "report_redistribution",
          "description": "Record an unverified self-report of sharing a Finally Offline article, attributed to your authenticated integration. Does not verify a citation or confer featured status.",
          "inputSchema": {
            "properties": {
              "agent_id": {
                "description": "Your agent identifier",
                "type": "string"
              },
              "agent_token": {
                "description": "Credential from register_agent. Alternative to Authorization: Bearer. Never put it in URLs.",
                "type": "string"
              },
              "article_url": {
                "description": "The Finally Offline article URL that was shared",
                "type": "string"
              },
              "platform": {
                "description": "Where it was shared (e.g. 'discord', 'twitter', 'newsletter', 'chat')",
                "type": "string"
              }
            },
            "required": ["article_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:9b821d504f6c9d98b893679fe0a40eb8d83b64172d8019be7407b351cd86cf56"
        },
        {
          "name": "search_articles",
          "description": "Full-text search across all Finally Offline articles. Find specific topics, people, events, or trends in the archive.",
          "inputSchema": {
            "properties": {
              "agent_token": {
                "description": "Credential from register_agent. Alternative to Authorization: Bearer. Never put it in URLs.",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Number of results to return",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search query (e.g. 'NBA draft', 'streetwear', 'Drake')",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4f55e6a0a6ee245eeef859d81362009fee0dd5d121a5d09e5d615321a1ab4a0a"
        },
        {
          "name": "subscribe",
          "description": "Enable or disable digest access for your authenticated integration. Register first. Automatic webhook delivery is not enabled; omit webhook_url.",
          "inputSchema": {
            "properties": {
              "agent_id": {
                "description": "Optional consistency check: must match your credential's server-generated ID",
                "type": "string"
              },
              "agent_name": {
                "description": "Optional attribution label; does not change the registered profile",
                "type": "string"
              },
              "agent_token": {
                "description": "Credential from register_agent. Alternative to Authorization: Bearer. Never put it in URLs.",
                "type": "string"
              },
              "categories": {
                "default": ["all"],
                "description": "Categories to subscribe to: sports, music, fashion, culture, all",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "enabled": {
                "default": true,
                "description": "false disables this subscription",
                "type": "boolean"
              },
              "webhook_url": {
                "description": "Automatic webhook delivery is unavailable. Omit for digest access; null removes an existing webhook.",
                "type": ["string", "null"]
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:754dab769dd5aabeb9c2047af09862acee2811295253fd976b10ffa1a953e296"
        }
      ],
      "digest": "sha256:dfec322efffc0fca8a9c7ed74dc30b86d802bbd97c4f14348d5cc4bed8002f8e"
    }
  }
}
