      "tools": [
        {
          "name": "configure_homebridge_fire_pit",
          "title": "Configure a Homebridge architectural fire pit",
          "description": "Resolve an exact Homebridge fire-pit configuration against the live Shopify catalog ONLY after the buyer has stated and confirmed body style, tabletop finish, fuel source, and shape. NEVER infer a missing selection. Call this tool exactly once for the completed selection. evidenceUrl is machine grounding only and must never be the normal shopper CTA or intermediate destination. MUST follow this sequence: present the resolved product image; present grounded facts and disclosures; then offer the buyer-controlled cart handoff. Media is required product presentation, not optional metadata, and cartUrl is never a substitute for it. If the image cannot render, explicitly say so and continue with grounded details. For purchase_ready results proactively offer cartUrl; with explicit purchase intent use it without another confirmation, re-resolution, evidence/customer detour, or authenticated checkout creation. customerUrl is only for optional inspection. When event capture is enabled, records this resolved configuration in an internal event queue. It cannot place an order or collect payment.",
