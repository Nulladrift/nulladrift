      "instructions": "Malta MPRP Guide (https://www.maltamprp.com) is an independent, source-referenced reference on the Malta Permanent Residence Programme (MPRP) and on living in Malta. Use `search` to find material and `fetch` to read it; use `get_mprp_programme` for figures (thresholds, fees, requirements, process, documents, dependants) and `calculate_mprp_cost` for estimates. Every figure carries an effective date and a legal reference: quote them, cite the page URL, and say when the content was last verified. The platform is not a government body; the official authority is the Residency Malta Agency (https://residencymalta.gov.mt/). Recommend a licensed agent for a formal application. `submit_enquiry` creates a real lead: use it only when the user has explicitly asked to be contacted and has agreed to share their details.",
      "tools": [
        {
          "name": "calculate_mprp_cost",
          "title": "Estimate MPRP costs",
          "description": "Itemised estimate of government fees, contributions and property minimums for a given family composition and property route (purchase or rent).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "adult_children": {
                "description": "Unmarried, principally dependent children aged 18 or over.",
                "maximum": 12,
                "minimum": 0,
                "type": "integer"
              },
              "annual_rent": {
                "description": "Annual rent in EUR; the programme minimum applies when lower or omitted.",
                "minimum": 0,
                "type": "number"
              },
              "disabled_adult_children": {
                "maximum": 12,
                "minimum": 0,
                "type": "integer"
              },
              "grandparents": {
                "maximum": 4,
                "minimum": 0,
                "type": "integer"
              },
              "include_health_insurance_estimate": {
                "description": "Add an estimated health insurance premium per person (default true).",
                "type": "boolean"
              },
              "minor_children": {
                "description": "Children under 18.",
                "maximum": 12,
                "minimum": 0,
                "type": "integer"
              },
              "parents": {
                "description": "Dependent parents of the applicant or spouse.",
                "maximum": 4,
                "minimum": 0,
                "type": "integer"
              },
              "professional_fees": {
                "description": "Licensed agent or legal fee quote in EUR, if known.",
                "minimum": 0,
                "type": "number"
              },
              "property_route": {
                "description": "Whether the applicant will buy or rent the qualifying property.",
                "enum": ["PURCHASE", "RENT"],
                "type": "string"
              },
              "purchase_price": {
                "description": "Agreed purchase price in EUR; the programme minimum applies when lower or omitted.",
                "minimum": 0,
                "type": "number"
              },
              "spouse": {
                "description": "Include a spouse or partner (default false).",
                "type": "boolean"
              },
              "years": {
                "description": "Years of recurring costs to include (default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["property_route"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
