        {
          "name": "submit_enquiry",
          "title": "Submit an enquiry",
          "description": "Sends a consultation or property enquiry to the platform's consultants on behalf of a user who has given explicit consent. Returns a reference only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "consent": {
                "const": true,
                "description": "Must be true: the user explicitly agreed that these details are sent to the platform's consultants and stored under its privacy policy.",
                "type": "boolean"
              },
              "country": {
                "description": "Country of residence or nationality, if known.",
                "maxLength": 80,
                "type": "string"
              },
              "email": {
                "description": "The user's e-mail address, where the consultant will reply.",
                "format": "email",
                "maxLength": 200,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "message": {
                "description": "What the user wants (consultation, viewing, details) and any context they shared: family size, budget, timing, property route.",
                "maxLength": 3000,
                "minLength": 5,
                "type": "string"
              },
              "name": {
                "description": "The user's full name.",
                "maxLength": 160,
                "minLength": 2,
                "type": "string"
              },
              "phone": {
                "description": "Phone number with country code, if the user wants a call or WhatsApp.",
                "maxLength": 40,
                "type": "string"
              },
              "preferred_contact": {
                "enum": ["email", "phone", "whatsapp"],
                "type": "string"
              },
              "property_reference": {
                "description": "Listing reference (e.g. P-1206) when the enquiry is about a specific property.",
                "maxLength": 160,
                "type": "string"
              }
            },
            "required": ["consent", "email", "message", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
