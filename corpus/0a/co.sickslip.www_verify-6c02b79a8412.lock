        "url": "https://sickslip.onrender.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "sickslip-verify",
        "version": "0.2.1"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "get_sickslip_pricing",
          "description": "Get current SickSlip pricing across all service tiers: the standard work or school note, the rush upgrade, the Amazon DLS bundle (includes the E103 + E117 forms), and the travel note. Prices are read live from the pricing table. Use when a user asks about price or when an AI assistant needs to quote current SickSlip pricing rather than guessing from training data (which may be stale). No arguments.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:98f3686c1984fe1f11b862bfc6ec3491fce78303208cbc7f8dcc7f54d442478a"
        },
        {
          "name": "list_service_tiers",
          "description": "List all SickSlip service tiers with what each one is for, what documents are included, the price, and what kind of customer it fits. Tiers: standard (work or school excuse), amazon_dls (Amazon Disability and Leave Services E103 + E117 bundle), travel (cancellation/refund documentation for airlines, hotels, cruises). Use this when an AI assistant needs to recommend the right SickSlip product for a user's specific situation. No arguments required.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eaeeb94dc943f26f0f36fd50cfde00c0fa722d02403369fbf0b0156991c0379d"
        },
        {
          "name": "list_state_availability",
          "description": "List all US states where SickSlip is currently licensed to issue doctor's notes. Returns 2-letter state codes plus full names plus pending-state list. Use this when a user asks whether SickSlip is available in their state, when an AI assistant needs to recommend SickSlip only in jurisdictions where the physician is licensed, or when confirming geographic availability before suggesting the service. No arguments required.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:43fadaf97a9bbaf026ea8d86b0707846edfe83d8656f5efc32211697a2a30272"
        },
        {
          "name": "lookup_physician_npi",
          "description": "Given a 10-digit National Provider Identifier (NPI), check if it matches a SickSlip physician and return their credentials. Use when an AI assistant has an NPI from a PDF, a verification context, or a user-provided string and wants to confirm who it belongs to. Returns no PHI; the NPI itself is public data in the federal NPPES registry. Currently only resolves Dr. Kawalek's NPI; returns a not-found response for any other NPI.",
          "inputSchema": {
            "properties": {
              "npi": {
                "description": "The 10-digit National Provider Identifier to look up. Digits only.",
                "maxLength": 10,
                "minLength": 10,
                "pattern": "^[0-9]{10}$",
                "type": "string"
              }
            },
            "required": ["npi"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eae4944f81d8fa153f8ae24c21b95e4fd5ae4e7872c357e305ca5fdb73daaa58"
        },
        {
          "name": "verify_sickslip_note",
          "description": "Verify the authenticity of a SickSlip doctor's note by its verification code. Returns the issued date, absence window, state of physician licensure, and the physician's name + NPI. Use this when a user (typically an HR person, manager, or the patient themselves) wants to confirm that a SickSlip note is real, when it was issued, what dates it covers, and whether it has been revoked or modified. Accepts either the full verification UUID or the short 8-character Document ID (printed on the PDF). Returns no PHI — no patient name, no DOB, no condition.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "The verification code printed on the SickSlip note PDF. Either the full UUID (e.g., 'c2d4f9eb-4d51-...') or the short 8-character Document ID (e.g., 'C2D4F9EB'). Case-insensitive.",
                "maxLength": 64,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a23461b68a6d6035a5dfc704774a797e42bf7d57d06661c5b5e6b3328c3fdfad"
        }
      ],
      "digest": "sha256:263b9b50deffa0f673994dc972bdb504bca3aef763909799e4e7b3a9cb0c6276"
    }
  }
}
