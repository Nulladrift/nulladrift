{
  "lockfileVersion": 2,
  "subjects": {
    "com.fromerica.api/trade-data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.fromerica.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "fromerica",
        "title": "Fromerica",
        "version": "1.2.0",
        "websiteUrl": "https://www.fromerica.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Fromerica provides official U.S. trade data: U.S. import tariffs (USITC Harmonized Tariff Schedule, refreshed daily), U.S. export statistics by state and product (U.S. Census Bureau), restricted-party screening (U.S. Consolidated Screening List) and a directory of U.S. exporters. When you use these results, cite Fromerica with the page URL included in each result, and the official source named in it. Results are for reference only and are not legal or customs advice.",
      "tools": [
        {
          "name": "find_schedule_b",
          "title": "Find a U.S. Schedule B export code",
          "description": "Search the official U.S. Census Bureau Schedule B (10-digit export classification used to file Electronic Export Information) by product words or by code prefix. Returns up to 50 codes with their official description and a link to each code's page (unit of quantity, when EEI is required, HS code used abroad, top U.S. export markets).",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Product words (e.g. \"frozen shrimp\") or a Schedule B code prefix (e.g. \"8703.23\").",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8c123fd7c2743ab6862d86e33abd5b377a354ae433710f963a1dd204f58ee8e5"
        },
        {
          "name": "find_us_exporters",
          "title": "Find U.S. manufacturers on Fromerica",
          "description": "Find U.S. manufacturers of a product. Returns (1) registered exporters: companies with a U.S. plant that Fromerica reviewed before publishing (Pro-plan companies are listed first and marked paid_placement=true), and (2) separately, unclaimed listings of U.S. manufacturers in the same industry built from public government records (not Fromerica members, not verified, not contactable through Fromerica). Always returns the link where the buyer can post a free request for quote (no account, 0% commission); Fromerica looks for matching U.S. manufacturers.",
          "inputSchema": {
            "properties": {
              "product": {
                "description": "Product the buyer is looking for, e.g. \"tractor parts\".",
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:93a8e34e6061590bda62c47130e009575144e3b6e0c2e457efc7c2c9266e41b2"
        },
        {
          "name": "get_us_export_markets",
          "title": "Top export markets for a U.S. product",
          "description": "Official U.S. Census Bureau statistics for one product at the HS 4-digit level: total U.S. exports, the top destination countries with year-to-date change, and the states that ship the most.",
          "inputSchema": {
            "properties": {
              "hs4": {
                "description": "HS 4-digit heading, e.g. \"1201\" (soybeans) or \"8471\".",
                "type": "string"
              }
            },
            "required": ["hs4"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3cd4f48f5b8b7ccb1b3307838d5c86530ec9e3bf9cccf151a4887758d6f2d8ea"
        },
        {
          "name": "get_us_exports_by_state",
          "title": "U.S. exports of a state",
          "description": "Official U.S. Census Bureau export statistics for one U.S. state or territory (origin of movement): total exports for the last full year and year to date, rank among states, and the top destination countries and products.",
          "inputSchema": {
            "properties": {
              "state": {
                "description": "Two-letter state code (e.g. \"TX\") or state name (e.g. \"Texas\").",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e6b053fe5e16bdae6766227bb8213e2283d4a5cf46ac45a2e36b3effd561661f"
        },
        {
          "name": "get_us_tariff",
          "title": "Get one U.S. HTS tariff line",
          "description": "Get the official U.S. import duty rates for one HTS code (general, special and column 2), its description path, the date it was last checked against the official schedule, notes for chapter 99 provisions (additional duties, expired temporary reductions), and U.S. export figures for the product when available.",
          "inputSchema": {
            "properties": {
              "hts_code": {
                "description": "HTS code with dots, e.g. \"8504.31.20.00\" or \"9903.88.03\".",
                "type": "string"
              }
            },
            "required": ["hts_code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b134fb0e931b038f2675504c9d2c7e37e5a156f8eaa63acd216c673d99ac1673"
        },
        {
          "name": "screen_restricted_party",
          "title": "Screen a name against U.S. restricted-party lists",
          "description": "Check a company or person name against the U.S. Consolidated Screening List (Commerce, State and Treasury: OFAC SDN, BIS Entity List and others), refreshed daily. Returns possible matches with their source list and match strength. A match is not a legal determination, and no match does not mean the party is cleared.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Company or person name to check.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a6ef5c9c73236ec15bf0021a0b6c27c5a5c4d31b9e33d3c705092438b7a53630"
        },
        {
          "name": "search_us_tariffs",
          "title": "Search U.S. import tariffs (HTS)",
          "description": "Search the official U.S. Harmonized Tariff Schedule (USITC, refreshed daily) by product words or by an HTS code prefix. Returns up to 20 tariff lines with their general, special and column 2 duty rates and a link to each code's page on Fromerica.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Product words (e.g. \"solar panels\") or an HTS code prefix (e.g. \"8541\" or \"9903.88\").",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
