          },
          "digest": "sha256:a0d0b4268459f7c0b3dbfae734161a972bc9d64828da6ed5ba64b925e3f8b04e"
        },
        {
          "name": "verify_fmc_license",
          "title": "Verify an FMC ocean freight forwarder / NVOCC license",
          "description": "Check whether a company appears on the Federal Maritime Commission's list of licensed and bonded Ocean Transportation Intermediaries (ocean freight forwarders and NVOCCs), by company name or license number. Returns license number, type, location and renewal date.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Company name (e.g. \"Young Sea Cargo\") or FMC license number.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
