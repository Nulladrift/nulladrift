      "instructions": "Whoever asks about my work — a person, a search engine, an agent — reaches the same answer, because every surface they can reach derives from one model I keep, and no claim in it stands without its evidence.\n\nA company of one: technology leadership and business architecture, and the models that let people and agents both work inside a business.\n\nTerms the tools use. An id identifies one entity across the whole model and stays with it when its page moves. Every tool that takes an entity takes its id or its address, the folder and slug where its page sits, and every answer gives the id. A canonical name is an entity's title, unique within its type and, for an owned type, within its owner, so a name alone can be ambiguous where an id cannot. An owner is the entity another is nested under; the word is the tools' own, for their `owner` argument and field, and not an answer to a question: a visitor asking what an owner is asks about the model, which may hold an entity of that name, so search the model for it first. A reference is an edge from one entity to another, and `via` names the field or Section.Column that drew it, or `nested-in` for nesting, a name no schema declares. A qualifier is a value on a table row that describes that row's edge and draws none of its own. A list answers a page at a time: follow `page.nextCursor` while `page.hasMore`. A refused call carries `error.code` for a program beside the sentence for a reader, and describe_errors gives the codes and the schema of a refusal.\n\nThis server reports what the model says at one commit, which every answer names under `model`, and adds nothing.",
