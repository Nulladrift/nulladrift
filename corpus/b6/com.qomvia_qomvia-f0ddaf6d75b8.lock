{
  "lockfileVersion": 2,
  "subjects": {
    "com.qomvia/qomvia": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://qomvia.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "Qomvia Market and AI readiness",
        "version": "1.0.0",
        "websiteUrl": "https://qomvia.com/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "cancel_checkout_session",
          "description": "Cancel an open checkout session and release the offer.",
          "inputSchema": {
            "properties": {
              "sessionId": {
                "description": "Checkout session id",
                "type": "string"
              }
            },
            "required": ["sessionId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f3079b141ee6cc05f85c5d2969d00ceebcd5d18b3ac1a5a1f9749a32ecab84de"
        },
        {
          "name": "complete_checkout",
          "description": "Complete a checkout session and receive the merchant-hosted payment URL. The buyer pays the merchant there; Qomvia never takes payment for the goods.",
          "inputSchema": {
            "properties": {
              "sessionId": {
                "description": "Checkout session id",
                "type": "string"
              }
            },
            "required": ["sessionId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ccb6ee22338c9d414cf7fed4f31a81a629dffbc3eb4a8b3349ab91cf796c19f3"
        },
        {
          "name": "create_checkout_session",
          "description": "Open a checkout session on an offer: freezes the agent price, quantity and shipping. Qomvia never takes the payment; complete_checkout returns the merchant's payment URL.",
          "inputSchema": {
            "properties": {
              "buyer": {
                "description": "Buyer JSON: {email, name?, phone?}",
                "type": "string"
              },
              "offerId": {
                "description": "Offer id from search_products",
                "type": "string"
              },
              "qty": {
                "description": "Quantity (default 1)",
                "type": "number"
              },
              "shipTo": {
                "description": "Ship-to JSON: {name, line1, line2?, zip, city, state?, country, company?, phone?}",
                "type": "string"
              }
            },
            "required": ["offerId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5f0e7ca9ef5ff79728a978a0e44586b35c4a6babc636bcee1da82e7bc144ebdb"
        },
        {
          "name": "extend_offer",
          "description": "Extend an offer's validity once by its TTL. A second extension is refused.",
          "inputSchema": {
            "properties": {
              "offerId": {
                "description": "Offer id to extend",
                "type": "string"
              }
            },
            "required": ["offerId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:72150a38970e9a8061ea15844a011549c837b2fa4e192d7987efe20ebc830c64"
        },
        {
          "name": "get_ai_readiness_score",
          "description": "Return the published AI-readiness score for a website: core score out of 100 (same checks for every site), grade, per-dimension breakdown, separate add-on scores (e.g. e-commerce) and the status of every measured check. Reads the cached public scan; use scan_website to force a fresh measurement.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Domain or URL, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2e761de57095b20f35ca137c4e4410c60b8c7e2336284689582a6f14f93a93c7"
        },
        {
          "name": "get_checkout_session",
          "description": "Read a checkout session's status, amounts and expiry.",
          "inputSchema": {
            "properties": {
              "sessionId": {
                "description": "Checkout session id",
                "type": "string"
              }
            },
            "required": ["sessionId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2708eb578275607a8d32a46a46cb4428b770a57afa64fb769267727c8567e330"
        },
        {
          "name": "get_offer",
          "description": "Re-read an offer by id: merchant, product, agent price, shipping, landed price, terms and expiry.",
          "inputSchema": {
            "properties": {
              "offerId": {
                "description": "Offer id from search_products",
                "type": "string"
              }
            },
            "required": ["offerId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d5a7a677452792c6408c2803d575c8b11dea6473afb10ce8774a407c28bfe766"
        },
        {
          "name": "list_readiness_checks",
          "description": "List the rubric: every pack (core, e-commerce), its dimensions and the individual checks with why each one matters and how to fix it.",
          "inputSchema": {
            "properties": {
              "pack": {
                "description": "Optional pack id: core or ecommerce",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9c8a04911b70349ba6a7b3b8d5ea68936cba990bfcbce69ff9e03fdcf81f6a4f"
        },
        {
          "name": "scan_website",
          "description": "Measure a website's AI-readiness now and return the score. Read-only HTTP requests only; a domain can be scanned once per hour and results become part of the public index. A fresh measurement needs the email the full report goes to — pass the human's address, never the agent's.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Domain or URL to measure",
                "type": "string"
              },
              "email": {
                "description": "Address the full report is mailed to. Required for a fresh scan.",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c4c19d9f78efec42f9024fa6105db65da9d64d5b0248544472bdad280f7a248a"
        },
        {
          "name": "search_products",
          "description": "Search every shop listed on Qomvia Market in one call and get signed, time-limited offers. Prices are the merchant's own prices with an agent discount applied; the buyer always pays the merchant on the returned payment URL, never Qomvia.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "Brand filter",
                "type": "string"
              },
              "category": {
                "description": "Category filter",
                "type": "string"
              },
              "currency": {
                "description": "ISO-4217 currency for a converted price hint",
                "type": "string"
              },
              "gtin": {
                "description": "Exact GTIN/EAN match, wins over q",
                "type": "string"
              },
              "limit": {
                "description": "Max offers (default 10, max 25)",
                "type": "number"
              },
              "maxPriceCents": {
                "description": "Upper price bound in minor units",
                "type": "number"
              },
              "q": {
                "description": "Free-text product search, e.g. 'bike helmet'",
                "type": "string"
              },
              "qty": {
                "description": "Quantity (default 1)",
                "type": "number"
              },
              "shipTo": {
                "description": "ISO-2 country the goods ship to, e.g. CH",
                "type": "string"
              },
              "sku": {
                "description": "Exact SKU match",
                "type": "string"
              }
            },
            "required": ["shipTo"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7d889c51f04fedec0468205e306e6e702ff33b91eeab8190dca555453968ab3b"
        }
      ],
      "digest": "sha256:98f2c47a54bf90303796c183e8a07a36417a530cd409caa9def9bdaaceab76e1"
    }
  }
}
