        {
          "name": "zoek_basisverzekeringen",
          "title": "Search basic health insurance policies",
          "description": "Searches Dutch basic health insurance policies (basisverzekering) for an insurance year. Returns per policy the premium per month and per year at the chosen voluntary deductible (vrijwillig eigen risico), the policy type, freedom of choice of care providers (zorgkeuze, based on reimbursement of non-contracted care, niet-gecontracteerde zorg), customer rating, a link to the policy page (detailUrl; afsluitUrl is only filled over the REST API) and source ids. Filter by policy type, insurer, minimum reimbursement for non-contracted care and care type (zorgsoort); sort by premie, zorgkeuze or rating and always tell the user the sort key (meta.sorteersleutel). The insured care itself is the same in every basic policy by law; policies differ in premium and choice of providers. Paginated with limit and cursor. Provides information, not advice: the user makes the decision and signs up with the insurer themselves.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cursor": {
                "description": "Opaque pagination cursor: pass meta.cursor from the previous response to get the next page.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "eigenRisico": {
                "default": "0",
                "description": "Voluntary deductible (vrijwillig eigen risico) in whole euros used to price the premium: 0 (default), 100, 200, 300, 400 or 500. It comes on top of the mandatory deductible (verplicht eigen risico).",
                "enum": ["0", "100", "200", "300", "400", "500"],
                "type": "string"
              },
              "jaar": {
                "description": "Insurance year (verzekeringsjaar), e.g. 2027. During the switching season (November-December) users usually mean the coming year.",
                "maximum": 2100,
                "minimum": 2020,
                "type": "integer"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of results per page (1-50, default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "minVergoedingNietGecontracteerd": {
                "description": "Minimum reimbursement percentage (0-100) for care from non-contracted providers (niet-gecontracteerde zorg). Applies to zorgsoort if given, otherwise to every care type of the policy.",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "sorteer": {
                "default": "premie",
                "description": "Sort order: premie (lowest annual premium first, default), zorgkeuze (most freedom of choice first), rating (highest customer rating first).",
                "enum": ["premie", "zorgkeuze", "rating"],
                "type": "string"
              },
              "taal": {
                "default": "nl",
                "description": "Response language: nl (Dutch, default) or en (English).",
                "enum": ["nl", "en"],
                "type": "string"
              },
              "type": {
                "description": "Policy type: natura (only contracted care fully reimbursed), restitutie (free choice of provider), combinatie (mix), budget (lowest premium, limited choice).",
                "enum": ["natura", "restitutie", "combinatie", "budget"],
                "type": "string"
              },
              "verzekeraarId": {
                "description": "Insurer id (verzekeraar), e.g. 'vgz', as returned by list_verzekeraars.",
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]*$",
                "type": "string"
              },
              "zorgsoort": {
                "description": "Type of care (zorgsoort), lowercase key such as 'ziekenhuis' (hospital), 'kliniek', 'ggz' (mental healthcare), 'fysio', 'wijkverpleging', 'apotheek'.",
                "maxLength": 40,
                "minLength": 2,
                "pattern": "^[a-z][a-z0-9_]*$",
                "type": "string"
              }
            },
            "required": ["jaar"],
            "type": "object"
          },
