                "minLength": 1,
                "type": "string"
              },
              "jaar": {
                "description": "Insurance year (verzekeringsjaar), e.g. 2027.",
                "maximum": 2100,
                "minimum": 2020,
                "type": "integer"
              },
              "personen": {
                "description": "1 to 8 persons in the household, each with a unique id.",
                "items": {
                  "properties": {
                    "geboortejaar": {
                      "description": "Year of birth (geboortejaar).",
                      "maximum": 2027,
                      "minimum": 1900,
                      "type": "integer"
                    },
                    "geboortemaand": {
                      "description": "Month of birth (1-12), optional. Only used in the year the person turns 18 (premium and deductible start the month after the birthday); if omitted, June is assumed.",
                      "maximum": 12,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "id": {
                      "description": "Short person id, e.g. 'p1'. Unique within the scenario.",
                      "pattern": "^[A-Za-z0-9_-]{1,32}$",
                      "type": "string"
                    },
                    "polisAanvullendIds": {
                      "default": [],
                      "description": "Chosen supplementary and dental package (aanvullend/tand) ids.",
                      "items": {
                        "maxLength": 100,
                        "minLength": 1,
                        "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]*$",
                        "type": "string"
                      },
                      "maxItems": 6,
                      "type": "array"
                    },
                    "polisBasisId": {
                      "anyOf": [
                        {
                          "maxLength": 100,
                          "minLength": 1,
                          "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]*$",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Chosen or current basic policy (basisverzekering) id; null = not chosen yet."
                    },
                    "vasteZorgaanbieders": {
                      "default": [],
                      "description": "Care providers this person wants to keep using.",
                      "items": {
                        "properties": {
                          "agbCode": {
                            "description": "AGB code (8 digits) of the care provider, from zoek_zorgaanbieder.",
                            "pattern": "^\\d{8}$",
                            "type": "string"
                          },
                          "zorgsoort": {
                            "description": "Type of care, e.g. 'ziekenhuis', 'fysio', 'ggz'.",
                            "maxLength": 40,
                            "minLength": 2,
                            "pattern": "^[a-z][a-z0-9_]*$",
                            "type": "string"
                          }
                        },
                        "required": ["agbCode", "zorgsoort"],
                        "type": "object"
                      },
                      "maxItems": 10,
                      "type": "array"
                    },
                    "verwachtErPlichtigCent": {
                      "description": "Expected deductible-liable (eigen-risicoplichtige) costs in euro cents; overrides the estimate from verwachtGebruik.",
                      "maximum": 10000000,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "verwachtGebruik": {
                      "default": [],
                      "description": "Expected care use per category and count. No diagnoses, no free text.",
                      "items": {
                        "properties": {
