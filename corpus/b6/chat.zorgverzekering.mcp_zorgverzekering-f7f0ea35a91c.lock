                    "label": {
                      "type": "string"
                    },
                    "type": {
                      "enum": ["bewaar", "afsluiten", "bekijk"],
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["label", "type", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "bronnen": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "anchor": {
                      "type": ["string", "null"]
                    },
                    "datum": {
                      "type": ["string", "null"]
                    },
                    "id": {
                      "type": "string"
                    },
                    "titel": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    },
                    "versie": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["anchor", "datum", "id", "titel", "url", "versie"],
                  "type": "object"
                },
                "type": "array"
              },
              "data": {
                "additionalProperties": false,
                "properties": {
