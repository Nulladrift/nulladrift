                            "enum": ["fysio", "oefentherapie", "ergotherapie", "logopedie", "dietetiek", "podotherapie", "huidtherapie", "tand_controle", "tand_behandeling", "tand_kronen_bruggen", "orthodontie_kind", "orthodontie_volwassen", "tand_ongeval", "bril_lenzen", "ooglaser", "hoortoestel", "buitenland_spoed", "buitenland_gepland", "repatriering", "vaccinaties_reis", "alternatieve_geneeswijzen", "acupunctuur", "chiropractie_osteopathie", "homeopathische_middelen", "kraamzorg_eigen_bijdrage", "bevalling_ziekenhuis_zonder_indicatie", "anticonceptie", "kinderopvang_ziek", "ivf_extra", "preventie_cursus", "sportmedisch", "stoppen_met_roken", "dieetadvies", "psychologische_zorg_extra", "mindfulness", "hulpmiddelen", "medicijnen_eigen_bijdrage", "plastische_chirurgie", "sterilisatie", "overgangsconsulent", "herstel_zorghotel", "mantelzorg_vervanging", "overlijden_vervoer", "eigen_risico_compensatie", "medische_pedicure", "stottertherapie", "ontharing", "camouflagetherapie", "kunstgebit", "orthoptie", "buitenland_tand_spoed", "buitenland_hulpverlening", "kraampakket", "kraamzorg_extra", "lactatiekunde", "zwangerschapscursus", "therapeutisch_kamp", "griepvaccinatie", "beweegprogramma", "gezondheidscheck", "lidmaatschap_patientenvereniging", "steunzolen", "borstkolf", "plaswekker", "pruik", "borstprothese", "hospice", "verblijf_bezoek", "vervoer_verblijf_behandeling", "ziekenvervoer_extra", "mantelzorgmakelaar", "mantelzorg_cursus", "second_opinion", "juridische_bijstand", "huisarts", "medisch_specialist", "medicijnen", "ggz_basis", "fysio_basis", "hulpmiddelen_basis", "ziekenvervoer", "wijkverpleging", "verloskunde", "kraamzorg", "lab_diagnostiek", "mondzorg_basis", "fysio_chronisch", "fysio_artrose", "fysio_etalagebenen", "bekkenfysio", "lab_huisartspraktijk", "ziekenvervoer_zittend", "medicijnen_gvs_bijdrage"],
                            "type": "string"
