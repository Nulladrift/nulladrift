        {
          "name": "get_bron",
          "title": "Quote a source passage",
          "description": "Returns a short passage (at most 500 characters, in Dutch) from an official source document (bron), such as an insurer's policy conditions (modelovereenkomst), coverage overview (vergoedingenwijzer), premium overview or a government publication, with its URL, version and date. Use a bronId and anchor (page or section) from the bronnen of another tool response to quote and cite the exact wording. Provides information, not advice: the user makes the decision and signs up with the insurer themselves.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "anchor": {
                "description": "Page or section within the source, e.g. 'p.14', from bronnen[].anchor.",
                "maxLength": 60,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9 ._#:-]+$",
                "type": "string"
              },
              "bronId": {
                "description": "Source id (bronId) from the bronnen list of another tool response.",
                "pattern": "^[A-Za-z0-9._-]{1,128}$",
                "type": "string"
              },
