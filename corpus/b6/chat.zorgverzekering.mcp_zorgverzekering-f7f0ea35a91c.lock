        {
          "name": "check_zorgaanbieder",
          "title": "Check care provider contract status",
          "description": "Checks per basic policy whether a care provider (zorgaanbieder, by AGB code) has a contract with the insurer (gecontracteerd) for a care type (zorgsoort), and which percentage of the costs is reimbursed without a contract. Each result states its origin (herkomst: insurer publication, the insurer's provider search (zorgzoeker), or cache) and the date it was retrieved. If herkomst is null the dataset has no contract information for that policy (status onbekend); calling again does not change that. Contracts can change during the year, so suggest the user confirms with the insurer. Provides information, not advice: the user makes the decision and signs up with the insurer themselves.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agbCode": {
                "description": "AGB code (8 digits) of the care provider, from zoek_zorgaanbieder.",
                "pattern": "^\\d{8}$",
                "type": "string"
              },
              "jaar": {
                "description": "Insurance year (verzekeringsjaar), e.g. 2027. During the switching season (November-December) users usually mean the coming year.",
                "maximum": 2100,
                "minimum": 2020,
                "type": "integer"
              },
              "polisIds": {
                "description": "Basic policy ids (polisId) to check, e.g. from zoek_basisverzekeringen.",
                "items": {
                  "maxLength": 100,
                  "minLength": 1,
                  "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]*$",
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "taal": {
                "default": "nl",
                "description": "Response language: nl (Dutch, default) or en (English).",
                "enum": ["nl", "en"],
                "type": "string"
              },
              "zorgsoort": {
                "description": "Type of care (zorgsoort), lowercase key such as 'ziekenhuis' (hospital), 'kliniek', 'ggz' (mental healthcare), 'fysio', 'wijkverpleging', 'apotheek'.",
                "maxLength": 40,
                "minLength": 2,
                "pattern": "^[a-z][a-z0-9_]*$",
                "type": "string"
              }
            },
            "required": ["agbCode", "jaar", "polisIds", "zorgsoort"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "aannames": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
