        {
          "name": "my_service_links",
          "title": "The affiliate's own link for each service",
          "description": "Each service this affiliate holds, with their own referral link and an HTML snippet to embed it. A service the affiliate has switched off is reported as disabled: sharing it credits no referral. No price, fee or coverage is returned, and there is none here to look up.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "The language the affiliate is writing in — set it from their own messages. Everything meant to be read back to them comes back in this language.",
                "enum": ["es", "en"],
                "type": "string"
              }
            },
            "required": ["locale"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "note": {
                "type": "string"
              },
              "services": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "enabled": {
                      "description": "A service the affiliate has switched off credits no referral.",
                      "type": "boolean"
                    },
                    "link": {
                      "description": "The affiliate's own referral link for this service.",
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "widget_snippet": {
                      "description": "HTML to embed the link on a site.",
                      "type": "string"
                    }
                  },
                  "required": ["enabled", "link", "name", "slug", "widget_snippet"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["note", "services"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
