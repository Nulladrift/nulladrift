        },
        {
          "name": "request_service",
          "title": "Ask an affiliate to call the customer about a service",
          "description": "Leaves the customer's name and phone number with Multiservicios so an affiliate calls them about one service. It does not quote, price, sell, take payment or bind anything, and it confirms no coverage.\n\nAsk for consent in the customer's own words before calling this — \"is it alright if an affiliate calls you about this?\" — and send `consent: true` only once they have said so. Without it nothing is recorded.\n\nThe intake asks for the service, a name, a phone number, consent and a language, and nothing else. An address, a document or ID number, an immigration status or a date of birth is refused rather than dropped, because nothing here has anywhere to put it.\n\nA successful call is final: it comes back with `status: \"received\"` and a `reference`, and there is nothing more to send. Do not call it again for the same customer and service — a repeat inside the same conversation returns the same reference rather than a second call to the customer, but a request that genuinely failed says so, with `delivery_failed` and `isError`, and that one is worth retrying.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "consent": {
                "const": true,
                "description": "The customer has said, in their own words, that an affiliate may call them about this service. Ask them; never assume it from the fact that they gave a number.",
                "type": "boolean"
              },
              "locale": {
                "description": "The language the customer is writing in — set it from their own messages. Everything the customer is meant to hear comes back in this language.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "name": {
                "description": "What the customer wants to be called when the affiliate phones. A first name is enough; do not ask for a full legal name.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "description": "The number to call back, as the customer writes it. An affiliate dials this, so ordinary shapes are fine: +1 555 010 0000, 512 555 0123, (512) 555-0123.",
                "maxLength": 40,
                "pattern": "^\\+?\\(?[0-9][0-9\\s().+-]{5,39}$",
                "type": "string"
              },
              "service_slug": {
                "description": "The `slug` of a service from list_services. Only a live service can be requested.",
                "pattern": "^[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?$",
                "type": "string"
              },
              "socio_code": {
                "description": "Only when the customer read an affiliate's code off a flyer, a card or a link they were given. Leave it out otherwise — it is not something to ask for, and never something to invent. The answer is the same either way.",
                "maxLength": 16,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["consent", "locale", "name", "phone", "service_slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "follow_up": {
                "additionalProperties": false,
                "properties": {
                  "by": {
                    "const": "phone",
                    "type": "string"
                  },
                  "typical_business_days": {
                    "const": 1,
                    "type": "number"
                  }
                },
                "required": ["by", "typical_business_days"],
                "type": "object"
              },
              "message": {
                "description": "What to tell the customer, in their language.",
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "reference": {
                "description": "Stable for this request. Repeating the call with the same details returns it again.",
                "type": "string"
              },
              "scope_note": {
                "type": "string"
              },
              "service_slug": {
                "type": "string"
              },
              "status": {
                "const": "received",
                "type": "string"
              }
            },
            "required": ["follow_up", "message", "note", "reference", "scope_note", "service_slug", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
