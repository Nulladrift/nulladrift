{
  "lockfileVersion": 2,
  "subjects": {
    "ai.multiservicios/services": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.multiservicios.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "multiservicios",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Multiservicios connects a customer with an affiliate — a local business that refers customers — who calls them back about a service. This connector can do exactly two things: list the services that are live, and take one request for a call back (a name, a phone number and the customer's consent).\n\nIt cannot quote, price, sell, take payment, bind or confirm any coverage, and it holds no policy or claim information. Sigo Seguros is a licensed insurance agency, not an insurance carrier; an affiliate refers customers and never quotes, sells or handles money. If the customer asks what something costs, the honest answer is that no price can be given here and an affiliate can go through the options on the call.\n\nThe intake asks for a service, a name, a phone number, consent and a language, and nothing else. Do not send an address, a document or ID number, an immigration status or a date of birth: the connector refuses them, because nothing here has anywhere to put them.\n\nAnswer the customer in the language they are writing in, and pass that language as `locale`. Spanish is the default of the business, not of the customer.",
      "tools": [
        {
          "name": "apply_as_provider",
          "title": "Apply for a business to sell its services through Multiservicios",
          "description": "For a BUSINESS that wants to offer its own services through the Multiservicios affiliate network — not for a customer looking for a service (use request_service) and not for someone who wants to refer customers as an affiliate. It sends an application that a person reviews; it does not list the business, promise approval, or create any service.\n\nAsk for the business name, a contact name, email, phone, the kind of service, the US states where it is offered and a short description. Ask for consent in the person's own words — \"is it alright if Multiservicios contacts you about this?\" — and send `consent: true` only once they have said so. No document, ID number or immigration status is asked for or accepted.\n\nA successful call comes back with `status: \"received\"`. Do not send it again.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "business_name": {
                "description": "The business's name, as its owner writes it.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "category": {
                "description": "The closest kind of service. Use `other` when nothing fits.",
                "enum": ["insurance", "mobile_internet", "taxes_accounting", "money_transfer", "auto", "home", "health", "education", "other"],
                "type": "string"
              },
              "consent": {
                "const": true,
                "description": "The person has said, in their own words, that Multiservicios may contact them about this application. Ask them; never assume it.",
                "type": "boolean"
              },
              "contact_name": {
                "description": "Who we should talk to about the application.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "description": {
                "description": "What the business offers, to whom, and in which languages — in its own words.",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              },
              "email": {
                "description": "Where we write back about the application.",
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "locale": {
                "description": "The language the person is writing in. The reply comes back in it.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "phone": {
                "description": "A number to reach the contact, as they write it.",
                "maxLength": 40,
                "pattern": "^\\+?\\(?[0-9][0-9\\s().+-]{5,39}$",
                "type": "string"
              },
              "states": {
                "description": "Two-letter codes of the US states where the business offers the service.",
                "items": {
                  "type": "string"
                },
                "maxItems": 51,
                "minItems": 1,
                "type": "array"
              },
              "website": {
                "description": "The business's website, if it has one.",
                "format": "uri",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["business_name", "category", "consent", "contact_name", "description", "email", "locale", "phone", "states"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "message": {
                "description": "What to tell the person, in their language.",
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "status": {
                "const": "received",
                "type": "string"
              }
            },
            "required": ["message", "note", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:349da3e977b96f02407273e963e72b9f60ef79f2677a8d23cbcd636b723ceb60"
        },
        {
          "name": "list_services",
          "title": "Services Multiservicios can put an affiliate on",
          "description": "The services that are live right now, with the `slug` to pass to request_service. Call it before asking the customer anything: a service that is not in this list cannot be requested, and offering one that is not there costs the customer a wait for a call that never comes.\n\nNo price, fee or coverage is returned, and there is none to look up: Multiservicios puts an affiliate on the phone, and the affiliate goes through it with the customer. Sigo Seguros is a licensed insurance agency, not an insurance carrier.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "The language the customer is writing in — set it from their own messages. Everything the customer is meant to hear comes back in this language.",
                "enum": ["es", "en"],
                "type": "string"
              }
            },
            "required": ["locale"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "note": {
                "type": "string"
              },
              "pricing": {
                "additionalProperties": false,
                "properties": {
                  "note": {
                    "type": "string"
                  },
                  "prices_available": {
                    "const": false,
                    "type": "boolean"
                  }
                },
                "required": ["note", "prices_available"],
                "type": "object"
              },
              "services": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "type": ["string", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "slug": {
                      "description": "Pass this back as `service_slug` to request the service.",
                      "type": "string"
                    }
                  },
                  "required": ["description", "name", "slug"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["note", "pricing", "services"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
