        },
        {
          "name": "my_account",
          "title": "The affiliate's own profile and referral code",
          "description": "The affiliate's own profile: the referral code their links carry, the state of their account, and their public affiliate page. Needs the affiliate's own token; it answers for nobody else, and it holds nothing about a customer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "The language the affiliate is writing in — set it from their own messages. Everything meant to be read back to them comes back in this language.",
