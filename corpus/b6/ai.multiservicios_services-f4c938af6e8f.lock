        },
        {
          "name": "my_referrals",
          "title": "The affiliate's own referrals",
          "description": "The referrals credited to this affiliate, with the milestone each one reached and where its review stands. Every referral is reviewed by a person, so a pending one is not an earned reward. Nothing identifies the customer: the connector cannot show who was referred, because that data is not on this surface.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Only referrals of this milestone.",
                "enum": ["lead", "quote", "sale"],
                "type": "string"
              },
              "limit": {
                "description": "How many rows to return. Default 20.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "The language the affiliate is writing in — set it from their own messages. Everything meant to be read back to them comes back in this language.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "offset": {
                "description": "Rows to skip, for the next page.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "service_slug": {
                "description": "Only referrals for this service.",
                "type": "string"
              },
              "status": {
                "description": "Only referrals in this review state.",
                "enum": ["pending", "approved", "denied"],
                "type": "string"
              }
            },
            "required": ["locale"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "type": "number"
              },
              "note": {
                "type": "string"
              },
              "offset": {
                "type": "number"
              },
              "referrals": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "kind": {
                      "description": "The milestone this referral reached: lead, quote or sale.",
                      "type": "string"
                    },
                    "occurred_at": {
                      "type": "string"
                    },
                    "payout_status": {
                      "description": "Where the gift card stands, when one is owed.",
                      "type": ["string", "null"]
                    },
                    "reviewed_at": {
                      "type": ["string", "null"]
                    },
                    "reward_cents": {
                      "description": "The reward on this referral, in cents. Only an approved one is confirmed.",
                      "type": "number"
                    },
                    "service_name": {
                      "type": "string"
                    },
                    "service_slug": {
                      "type": "string"
                    },
                    "state": {
                      "type": ["string", "null"]
                    },
                    "status": {
                      "description": "pending, approved or denied. Pending is still in review.",
                      "type": "string"
                    }
                  },
                  "required": ["id", "kind", "occurred_at", "payout_status", "reviewed_at", "reward_cents", "service_name", "service_slug", "state", "status"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "type": "number"
              }
            },
            "required": ["limit", "note", "offset", "referrals", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
