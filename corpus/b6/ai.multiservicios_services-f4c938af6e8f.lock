        },
        {
          "name": "my_earnings",
          "title": "The affiliate's own totals, approved and in review",
          "description": "Clicks, referrals and rewards for this affiliate over a date range, per service and in total. Approved and in-review rewards are two separate numbers and must stay that way: a reward in review has not been approved and is not owed, because a person reviews every referral and may decide against it. Never add them together.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "First day, YYYY-MM-DD. Default 30 days ago.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "locale": {
                "description": "The language the affiliate is writing in — set it from their own messages. Everything meant to be read back to them comes back in this language.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "to": {
                "description": "Last day, YYYY-MM-DD. Default today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["locale"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "by_service": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "approved_cents": {
                      "type": "number"
                    },
                    "clicks": {
                      "type": "number"
                    },
                    "conversions": {
                      "type": "number"
                    },
                    "in_review_cents": {
                      "type": "number"
                    },
                    "leads": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    },
                    "rewarded_kind": {
                      "type": ["string", "null"]
                    },
                    "slug": {
                      "type": "string"
                    }
                  },
                  "required": ["approved_cents", "clicks", "conversions", "in_review_cents", "leads", "name", "rewarded_kind", "slug"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "range": {
                "additionalProperties": false,
                "properties": {
                  "from": {
                    "type": "string"
                  },
                  "to": {
                    "type": "string"
                  }
                },
                "required": ["from", "to"],
                "type": "object"
              },
              "totals": {
                "additionalProperties": false,
                "properties": {
                  "approved_cents": {
                    "description": "Rewards on approved referrals. Confirmed.",
                    "type": "number"
                  },
                  "clicks": {
                    "type": "number"
                  },
                  "conversions": {
                    "description": "Referrals that reached their service's rewarded milestone.",
                    "type": "number"
                  },
                  "in_review_cents": {
                    "description": "Rewards still in review. Not approved, not owed.",
                    "type": "number"
                  },
                  "leads": {
                    "type": "number"
                  }
                },
                "required": ["approved_cents", "clicks", "conversions", "in_review_cents", "leads"],
                "type": "object"
              }
            },
            "required": ["by_service", "note", "range", "totals"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
