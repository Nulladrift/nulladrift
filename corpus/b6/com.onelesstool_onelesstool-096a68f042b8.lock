        {
          "name": "search_catalog",
          "title": "Search software, capabilities and workflows",
          "description": "Natural-language search across software products, capabilities (what software does) and replacement workflows. Understands synonyms, e.g. 'make thumbnails' finds YouTube thumbnail workflows. Returns ranked hits with URLs, plus the tool and capabilities the query most likely refers to.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "kinds": {
                "description": "Restrict result types",
                "items": {
                  "enum": ["tool", "capability", "workflow", "guide"],
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "description": "Max results (default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the user is looking for: a product name, a task, or an outcome",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
