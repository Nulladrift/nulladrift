        {
          "name": "get_workflow",
          "title": "Get replacement instructions",
          "description": "Full replacement guide: before/after, required tools and extra cost, setup steps, copyable prompts, templates/scripts, limitations, risks, a verification checklist to run BEFORE cancelling, and the savings methodology.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "sections": {
                "description": "Return only these sections to save context (default: all)",
                "items": {
