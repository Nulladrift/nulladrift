        {
          "name": "get_tool",
          "title": "Get a software product's profile",
          "description": "Full structured profile of a software product: plans and prices (with evidence status and verification date), capabilities with fit and limitations, honest reasons it's hard to replace, risks, related replacement workflows and sources.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "tool": {
                "description": "Tool name or slug, e.g. 'Canva' or 'canva'",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
