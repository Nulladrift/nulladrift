      "serverInfo": {
        "name": "onelesstool",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "OneLessTool helps people stop paying for software they don't need by finding what they can do with tools they already own.\n\nHow to use these tools well:\n- Start with search_catalog for free-text questions (\"make thumbnails\", \"Canva\", \"replace Zapier\").\n- For \"can I drop X?\" use find_alternatives with the tool and, ideally, the specific capabilities the user actually uses plus the tools they already own.\n- For a whole stack, use estimate_savings with what they pay and what they use each tool for. It never double-counts and never recommends cancelling business-critical tools.\n- Use get_workflow to give step-by-step replacement instructions, prompts and a verification checklist.\n\nEvidence: every fact has an evidence status — verified: Checked against the cited primary source (usually the vendor's own page) on verifiedAt. editorial: OneLessTool's reasoned judgement (e.g. quality scores, fit). Not a vendor claim. estimate: A calculated or approximate figure; the methodology is stated alongside it. illustrative: An example scenario, not a measurement. ai_suggested: Generated by an AI model and not yet reviewed by a human. unverified: Believed accurate but not checked against a primary source recently.\nAlways tell the user when a price is unverified, and that savings are estimates to verify before cancelling. OneLessTool cannot cancel or modify anyone's subscriptions.",
      "tools": [
        {
          "name": "compare_solutions",
          "title": "Compare every way to accomplish a capability",
          "description": "For one capability (e.g. 'youtube-thumbnails', 'crm-contacts', 'workflow-automation'), compare all known tools: fit, quality scores on the dimensions that matter, required skill, cheapest qualifying plan and limitations.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "capability": {
                "description": "Capability slug, or a phrase like 'make thumbnails' (resolved via search)",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["capability"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5e32441efd64258f3cf3c536c5171369a8b5c6e2d64d162657d60ec8d5a27ab6"
        },
        {
          "name": "estimate_savings",
          "title": "Audit a software stack and estimate savings",
          "description": "Audit the user's subscriptions. For each: keep, downgrade, redundant, test_replacement, review_unused or keep_critical — with the arithmetic. Savings are split into 'likely' and 'possible' and never double-counted. Costs are what the user actually pays (monthly, all seats).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "skill": {
                "enum": ["none", "basic", "technical"],
                "type": "string"
              },
              "subscriptions": {
                "items": {
                  "properties": {
                    "capabilities_used": {
                      "description": "Capability slugs they actually use it for (improves accuracy)",
                      "items": {
                        "maxLength": 80,
                        "type": "string"
                      },
                      "maxItems": 30,
                      "type": "array"
                    },
                    "criticality": {
                      "enum": ["low", "medium", "high"],
                      "type": "string"
                    },
                    "monthly_cost_usd": {
                      "description": "What they pay per month in total",
                      "maximum": 1000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "plan": {
                      "maxLength": 80,
                      "type": "string"
                    },
                    "seats": {
                      "maximum": 100000,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "tool": {
                      "description": "Tool name or slug",
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "usage": {
                      "enum": ["daily", "weekly", "monthly", "rarely", "never"],
                      "type": "string"
                    }
                  },
                  "required": ["monthly_cost_usd", "tool"],
                  "type": "object"
                },
                "maxItems": 60,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["subscriptions"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:74d87c5ebe664ff7fdf7b0e1f49fb41ae8938e492460946e0e2d55878e8c32e4"
        },
        {
          "name": "find_alternatives",
          "title": "Find cheaper ways to do what a tool does",
          "description": "For a specific product (e.g. Canva), list each capability it provides and the best alternatives — ranking tools the user ALREADY owns first at $0 extra. Pass the capabilities the user actually uses (from get_tool) for a precise answer. Includes the honest case for keeping the tool.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "capabilities": {
                "description": "Capability slugs the user actually uses this tool for (default: its core capabilities)",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "owned_tools": {
                "description": "Tools the user already pays for, by name or slug, e.g. [\"ChatGPT Plus\", \"google-workspace\"]",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "team_size": {
                "description": "People who need access (affects per-seat costs)",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "tool": {
                "description": "The tool the user is considering dropping",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
