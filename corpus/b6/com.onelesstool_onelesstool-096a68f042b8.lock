        {
          "name": "recommend_stack",
          "title": "Recommend the cheapest practical stack",
          "description": "Given the outcomes the user needs (free text or capability slugs) and what they already own, recommend per-capability options (owned tools at $0 first) and a minimal stack covering everything, with incremental monthly cost and warnings about skill, collaboration and data sensitivity.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "capabilities": {
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "needs_collaboration": {
                "type": "boolean"
              },
              "owned_tools": {
                "description": "Tools the user already pays for, by name or slug, e.g. [\"ChatGPT Plus\", \"google-workspace\"]",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "query": {
                "description": "Outcome in plain English, e.g. 'I need 15 YouTube thumbnails a month and a simple CRM'",
                "maxLength": 300,
                "type": "string"
              },
              "sensitive_data": {
                "type": "boolean"
              },
              "skill": {
                "description": "User's technical skill",
                "enum": ["none", "basic", "technical"],
                "type": "string"
              },
              "team_size": {
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
