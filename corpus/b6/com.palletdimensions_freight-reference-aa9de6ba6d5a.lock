        },
        {
          "name": "pallets_per_trailer",
          "title": "Pallets that fit in a trailer",
          "description": "How many pallets fit on the floor of a trailer, loaded straight, turned, as the best mix or as side-by-side pinwheel lanes, and stacked when loadHeight and stackable are given. Choose equipment from list_equipment and pallet from its ids, or give palletLength and palletWidth in inches for a custom size. weight is the weight of ONE pallet in pounds and is checked against the trailer payload.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "equipment": {
                "description": "Trailer id",
                "enum": ["dry-van-53", "dry-van-48", "reefer-53"],
                "type": "string"
              },
              "loadHeight": {
                "description": "Loaded pallet height in inches (1–144), used when stackable is true",
                "maximum": 144,
                "minimum": 1,
                "type": "number"
              },
              "pallet": {
                "default": "48x40",
                "description": "Pallet id. Ignored when palletLength and palletWidth are given",
                "enum": ["48x40", "42x42", "48x48", "euro", "epal2"],
                "type": "string"
              },
              "palletLength": {
                "description": "Custom pallet length, in inches (12–120). Give with palletWidth",
                "maximum": 120,
                "minimum": 12,
                "type": "number"
              },
              "palletWidth": {
                "description": "Custom pallet width, in inches (12–120). Give with palletLength",
                "maximum": 120,
                "minimum": 12,
                "type": "number"
              },
              "stackable": {
                "default": false,
                "description": "Whether the freight can be double-stacked",
                "type": "boolean"
              },
              "weight": {
                "description": "Weight of ONE pallet in pounds (0.1–10000)",
                "maximum": 10000,
                "minimum": 0.1,
                "type": "number"
              }
            },
            "required": ["equipment"],
            "type": "object"
          },
          "annotations": {
