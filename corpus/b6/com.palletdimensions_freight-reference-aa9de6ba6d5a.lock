      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "calculate_cube",
          "title": "Cubic feet and cubic metres of a shipment",
          "description": "Total volume of up to 20 lines of identical pieces, in cubic feet, cubic metres, cubic inches, cubic yards and litres. Each item has length, width, height in unit (in, ft, yd, mm, cm or m; default in) and quantity (default 1). When every item has a weight, also returns total weight, density in lb/ft³ and kg/m³, and ocean weight/measurement (the larger of m³ and tonnes). weight is per piece unless weightBasis is line. rounding (default exact) can round each side up or to the nearest whole inch first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "height": {
                      "description": "Height of one piece, in unit",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "length": {
                      "description": "Length of one piece, in unit",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "quantity": {
                      "default": 1,
                      "maximum": 9999,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "unit": {
                      "default": "in",
                      "enum": ["in", "ft", "yd", "mm", "cm", "m"],
                      "type": "string"
                    },
                    "weight": {
                      "description": "Weight in weightUnit, per piece unless weightBasis is line. Give it on every item or on none",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "weightBasis": {
                      "default": "piece",
                      "enum": ["piece", "line"],
                      "type": "string"
                    },
                    "weightUnit": {
                      "default": "lb",
                      "enum": ["lb", "kg"],
                      "type": "string"
                    },
                    "width": {
                      "description": "Width of one piece, in unit",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["height", "length", "width"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "rounding": {
                "default": "exact",
                "description": "exact, ceil-in (each side up to a whole inch) or nearest-in",
                "enum": ["exact", "ceil-in", "nearest-in"],
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cubic feet and cubic metres of a shipment"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:18b4c2bf6d8535e8b3ce164783224b074977b37bc91fb375b01a461dc95163a6"
        },
        {
          "name": "calculate_dim_weight",
          "title": "Dimensional weight of a package",
          "description": "Dimensional (DIM) weight of one package in pounds and kilograms: length × width × height in inches, rounded as the service rules say, divided by that service divisor. service picks the carrier and rate (default ups-daily): ups-daily = UPS UPS packages, Daily Rates; ups-retail-domestic = UPS UPS domestic packages, Retail Rates; ups-retail-export = UPS UPS export packages, Retail Rates; fedex-packages = FedEx FedEx U.S. and international package services and Express Freight (not International Deferred Freight or One Rate); fedex-intl-deferred = FedEx FedEx International Deferred Freight; fedex-ground-economy = FedEx FedEx Ground Economy at 1 lb or more, including Bound Printed Matter, Media and Returns; usps-priority = USPS USPS Priority Mail, retail, to Zones 1-9. Services whose checked sources state no rounding rule are left unrounded. USPS retail Priority Mail applies dimensional weight only above its volume floor. Give actualWeight to compare it with the dimensional weight; this tool does not work out a charge.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "actualWeight": {
                "description": "Actual weight, in actualWeightUnit. Optional",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "actualWeightUnit": {
                "default": "lb",
                "enum": ["lb", "kg"],
                "type": "string"
              },
              "height": {
                "description": "Package height, in unit",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "length": {
                "description": "Package length, in unit",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "service": {
                "default": "ups-daily",
                "description": "Carrier service id",
                "enum": ["ups-daily", "ups-retail-domestic", "ups-retail-export", "fedex-packages", "fedex-intl-deferred", "fedex-ground-economy", "usps-priority"],
                "type": "string"
              },
              "unit": {
                "default": "in",
                "enum": ["in", "cm"],
                "type": "string"
              },
              "width": {
                "description": "Package width, in unit",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["height", "length", "width"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Dimensional weight of a package"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f112cbce950677801ed3fe2e27a5a5a527327b4e77264a2b785740a8f68661b2"
        },
        {
          "name": "calculate_ti_hi",
          "title": "Cartons per layer and per pallet (Ti × Hi)",
          "description": "Cartons per layer (Ti), layers per pallet (Hi) and cartons per pallet for one carton size, the load height and the total weight. Ti is the best of an all-one-way pattern, an all-turned pattern and two two-block mixes; the carton height stays vertical. All lengths are in unit (in or cm). Choose pallet from list_equipment ids (default 48x40) or give palletLength and palletWidth. overhang is how far the load may hang past each pallet edge (default 0). Give maxHeight (total load height, pallet included) with deckHeight (the empty pallet height) for Hi; without them only Ti is returned. Neither is assumed: the page offers sourced starting values. Give cartonWeight (and palletWeight) for the total weight. Capacity ratings for a 48 × 40 pallet appear only as a warning.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cartonWeight": {
                "description": "Weight of one carton, in weightUnit",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "deckHeight": {
                "description": "Height of the empty pallet, in unit. Required with maxHeight",
                "minimum": 0,
                "type": "number"
              },
              "height": {
                "description": "Carton height, in unit. This side stays vertical",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "length": {
                "description": "Carton length, in unit",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "maxHeight": {
                "description": "Greatest total load height, pallet included, in unit. Give with deckHeight",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "overhang": {
                "default": 0,
                "description": "Overhang allowed past each pallet edge, in unit",
                "minimum": 0,
                "type": "number"
              },
              "pallet": {
                "default": "48x40",
                "description": "Pallet id. Ignored when palletLength and palletWidth are given",
                "enum": ["48x40", "42x42", "48x48", "euro", "epal2"],
                "type": "string"
              },
              "palletLength": {
                "description": "Custom pallet length, in unit. Give with palletWidth",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "palletWeight": {
                "description": "Weight of the empty pallet, in weightUnit",
                "minimum": 0,
                "type": "number"
              },
              "palletWidth": {
                "description": "Custom pallet width, in unit. Give with palletLength",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "unit": {
                "default": "in",
                "description": "Unit for every length",
                "enum": ["in", "cm"],
                "type": "string"
              },
              "weightUnit": {
                "default": "lb",
                "enum": ["lb", "kg"],
                "type": "string"
              },
              "width": {
                "description": "Carton width, in unit",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["height", "length", "width"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cartons per layer and per pallet (Ti × Hi)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6440449ab61d6298a56636b7369a32fb883631d3ac87778ea562a7d03cfca113"
        },
        {
          "name": "freight_class",
          "title": "Freight class from size and weight",
          "description": "Freight class for one LTL handling unit from its size and weight, under the NMFC 13-sub density scale (effective July 19, 2025). weight is the weight of ONE piece, not the total; pieces (default 1) multiplies the cube and the weight. Dimensions default to inches and weight to pounds; set dimUnit to cm and/or weightUnit to kg for metric. roundUp (default false, as the calculator) rounds each side up to the next whole inch when true.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dimUnit": {
                "default": "in",
                "enum": ["in", "cm"],
                "type": "string"
              },
              "height": {
                "description": "Height of one handling unit, pallet included, in dimUnit (same range as length)",
                "maximum": 2540,
                "minimum": 1,
                "type": "number"
              },
              "length": {
                "description": "Length of one handling unit, pallet included, at its greatest point, in dimUnit: 1–1000 in or 2.54–2540 cm",
                "maximum": 2540,
                "minimum": 1,
                "type": "number"
              },
              "pieces": {
                "default": 1,
                "description": "Identical pieces in the handling unit",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "roundUp": {
                "default": false,
                "description": "Round each side up to the next whole inch",
                "type": "boolean"
              },
              "weight": {
                "description": "Weight of ONE piece, in weightUnit (per piece, not the total): 0.1–100000 lb",
                "maximum": 100000,
                "minimum": 0.045359237000000004,
                "type": "number"
              },
              "weightUnit": {
                "default": "lb",
                "enum": ["lb", "kg"],
                "type": "string"
              },
              "width": {
                "description": "Width of one handling unit, in dimUnit (same range as length)",
                "maximum": 2540,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["height", "length", "weight", "width"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Freight class from size and weight"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:846aab48d292f6a15e2c3de0a0fbc09625cc96a8a0492faed59ae9ba2a4e493d"
        },
        {
          "name": "get_dataset",
          "title": "Read one dataset",
          "description": "Returns the verified rows of one published dataset, with their sources. Unverified rows are never returned; the result says how many were left out.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Dataset id from list_datasets",
                "enum": ["nmfc-density-scale", "nmfc-classes", "us-pallet-sizes", "pallet-48x40-height", "pallet-height-more", "pallet-height-construction", "loaded-pallet-height", "pallet-stacking-limits", "ltl-height-rules", "trailer-height-clearance", "ispm15-treatments", "ispm15-fumigant-ct", "ispm15-mark", "ispm15-exemptions", "ispm15-national-rules", "ispm15-us-border", "pallet-weight-by-material", "pallet-load-capacity", "epal-pallets", "epal-cp-pallets", "iso-6780-sizes", "trailer-vans", "trailer-decks", "us-federal-truck-limits", "us-federal-truck-size-rules", "federal-measurement-exclusions", "grandfathered-semitrailer-lengths", "state-truck-height-kingpin-rules", "semi-truck-overall-length", "semi-tractor-dimensions", "semi-trailer-specs-by-maker", "box-truck-dimensions", "pallets-per-trailer", "container-dimensions", "pallets-per-container", "container-weights-by-carrier", "us-inland-container-cargo-caps", "ltl-size-range", "ltl-rate-factors", "ltl-accessorials", "ltl-carrier-tariffs", "ltl-space-rules", "ltl-accessorial-rules", "ltl-bill-layers", "ltl-capacity-rules", "ltl-overlength-bands", "ltl-reweigh-rules", "ltl-undescribed-freight", "nmfc-guide-access", "nmfc-guide-bol", "nmfc-guide-misclass", "drum-dimensions", "drums-per-pallet", "ibc-tote-dimensions", "ibc-totes-per-load", "volume-conversion-constants", "ltl-cube-rules", "chargeable-weight-rules", "container-cbm-capacity", "container-usable-cbm-estimates", "parcel-service-limits", "parcel-limits-and-thresholds", "parcel-dim-rules", "carrier-branded-packaging"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read one dataset"
