        {
          "name": "list_equipment",
          "title": "List trailers and pallet ids",
          "description": "Lists the trailers and pallet ids that pallets_per_trailer accepts, with the inside dimensions it loads against.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List trailers and pallet ids"
          },
          "behavior": {
