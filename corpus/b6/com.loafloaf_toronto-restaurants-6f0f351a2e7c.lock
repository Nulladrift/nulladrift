        "name": "toronto-restaurants",
        "title": "Toronto Restaurants",
        "version": "0.1.0",
        "description": "Restaurant search, profiles, booking links, awards, and menus for Toronto and the Greater Toronto Area, via a read-only Model Context Protocol (MCP) server.",
        "websiteUrl": "https://toronto-restaurant-mcp.vercel.app/"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
