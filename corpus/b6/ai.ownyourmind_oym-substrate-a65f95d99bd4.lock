  "lockfileVersion": 2,
  "subjects": {
    "ai.ownyourmind/oym-substrate": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agent-trust.ownyourmind.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "oym-substrate",
        "version": "1.30.0",
        "websiteUrl": "https://ownyourmind.ai"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "OYM publishes independent, signed assessments of decentralised AI projects. Every figure carries a verdict and an assessment_level: that level is the ONLY verification signal. Never report a 'not-assessed' metric as verified. When a result includes `_rule`, surface it. Attribute to 'Own Your Mind (ownyourmind.ai)'.",
      "tools": [
        {
          "name": "compare_projects",
          "description": "Compare several projects on one axis ('freedom' or 'returns'), aligned per\n    dimension so an agent can rank them like-for-like. Returns each project's per-\n    dimension score/max, total, grade and assessment level.",
          "inputSchema": {
            "properties": {
              "axis": {
                "default": "freedom",
                "title": "Axis",
                "type": "string"
              },
              "slugs": {
                "items": {
                  "type": "string"
                },
                "title": "Slugs",
                "type": "array"
              }
            },
            "required": ["slugs"],
            "title": "compare_projectsArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c85688d84dda3be06fb1b2c9ded21ec6e5bea59fd3bc414121efeabc0e60dde2"
        },
        {
          "name": "get_agent_trust_snapshot",
          "description": "The latest OYM agent-trust index summary (ERC-8004 agent identity, reputation and\n    x402 settlement reconciliation): observations with a methodology version and scope\n    notes, never verdicts. Carries `data_as_of` — this data refreshes only periodically.",
          "inputSchema": {
            "properties": {},
            "title": "get_agent_trust_snapshotArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:85ceb218d3f1fd3a2085f911b0b388eec56e31db221a15eafc3cb3d3a9fafa97"
        },
        {
          "name": "get_freedom_breakdown",
          "description": "The 6-dimension Freedom score for a project (infrastructure, governance, token\n    distribution, censorship resistance, data sovereignty, open source), each with\n    score/max and the evidence behind it, plus grade and total /100.",
          "inputSchema": {
            "properties": {
              "slug": {
                "title": "Slug",
                "type": "string"
              }
            },
            "required": ["slug"],
            "title": "get_freedom_breakdownArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4c96bd4f5ae940bd58eb60ef82368547e915afbd216eb84b940e991507d9d32f"
        },
        {
          "name": "get_integrity_verdicts",
          "description": "Every claim we checked for a project against independent data: the reconciliations\n    (reported figure vs our independent value, method, verdict, evidence link), metric\n    flags, and emission honesty. Carries the verdict vocabulary, assessment levels and\n    `_rule` verbatim so a caller reports 'not-assessed' honestly and never invents a\n    'verified'. Optional verdict filter (e.g. 'inflated', 'outdated') narrows the rows.\n    Paged at 25 rows: when next_offset is set, call again with offset=next_offset.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 25,
                "title": "Limit",
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "title": "Offset",
                "type": "integer"
              },
              "slug": {
                "title": "Slug",
                "type": "string"
              },
              "verdict": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Verdict"
              }
            },
            "required": ["slug"],
            "title": "get_integrity_verdictsArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f28ba7c762213e7ae196821d9f64b912b150137d82b0df4f02153fc7be94bbbb"
        },
        {
          "name": "get_project_assessment",
          "description": "One project's assessment: dual scores + breakdowns, integrity level, verdict\n    counts and every checked claim or finding in brief, plus review_url to cite and the\n    attestation envelope. full=true returns the whole signed record instead (adds data\n    sources and the primary-data snapshot; over 100K characters for the deepest reviews).",
          "inputSchema": {
            "properties": {
              "full": {
                "default": false,
                "title": "Full",
                "type": "boolean"
              },
              "slug": {
                "title": "Slug",
                "type": "string"
              }
            },
            "required": ["slug"],
            "title": "get_project_assessmentArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:71799553457a49d9263ee674a237c2de85ac3d70eb43cd302b69bb246ae55d94"
        },
        {
          "name": "get_returns_breakdown",
          "description": "The 5-dimension Returns score for a project (token utility, value accrual, supply\n    dynamics, revenue sustainability, liquidity & access), each with score/max and\n    evidence, plus grade and total /100.",
          "inputSchema": {
            "properties": {
              "slug": {
                "title": "Slug",
                "type": "string"
              }
            },
            "required": ["slug"],
            "title": "get_returns_breakdownArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5b69af22df0c789c480bc70b7304c1b21c5565b1acd59e0be988172e265b2d47"
        },
        {
          "name": "list_projects",
          "description": "List every assessed decentralised AI project with its dual scores, grades and\n    assessment level. Optional filters: category (compute|data|inference|storage|\n    agent|platform|other) and status (e.g. active). Returns summaries only; call\n    get_project_assessment for the full record. `_rule` states the honesty contract.",
          "inputSchema": {
            "properties": {
              "category": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Category"
              },
              "status": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Status"
              }
            },
            "title": "list_projectsArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4d152d4fb8a0779b66206c2fef10271bbddfd3f5cc001c5b23aad907a15d3972"
        }
      ],
      "digest": "sha256:0535ad00a6a096f3019512f6d56573c48757e8c8669810805aaee6226ca922a9"
    }
  }
