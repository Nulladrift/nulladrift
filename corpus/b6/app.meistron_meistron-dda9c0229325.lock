        {
          "name": "einstellungen_aendern",
          "title": "Einstellungen ändern",
          "description": "Ändert eine Firmen- oder Rechnungsvorgabe. Wirkt auf ALLE künftigen Rechnungen und Angebote; Firmendaten wie die Anschrift erscheinen auch in noch nicht ausgestellten Entwürfen. Ausgestellte Belege behalten ihr Original.\n\nNICHT änderbar, auch nicht mit Freigabe: Bankverbindung, Steuernummer, USt-IdNr., Rechnungs- und Angebotsnummern samt Präfixen, Steuerberater-Anbindung. Ebenso wenig die Schalter, die die Arbeitsweise umstellen (Bestandsführung, E-Rechnung, öffentliche Buchung). Wer danach gefragt wird, verweist auf Meistron.\n\nVorher „einstellungen_ansehen\" aufrufen, um den heutigen Wert zu kennen.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "feld": {
                "description": "Was geändert werden soll, z. B. default_payment_terms, default_hourly_rate, phone, closing_name. „einstellungen_ansehen\" nennt die möglichen Namen.",
