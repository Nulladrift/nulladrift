          "description": "Zeigt einen einzelnen Auftrag ausführlich: Beschreibung, Termin, Ort, Kunde, Projekt, Vor-Ort-Kontakt (nur der Name), zugewiesene Mitarbeiter, zugewiesenes Material mit Abrechnungsstand und noch nicht abgerechnete Stunden (sofern die Bereiche „Material\" bzw. „Zeiterfassung\" freigegeben sind), Zahl der Fotos, bei Storno den Grund — und die zugehörigen Rechnungen sowie den am Auftrag hinterlegten Nettopreis, sofern der Bereich „Rechnungen\" für den KI-Zugang freigegeben ist. Der übliche Blick, BEVOR aus dem Auftrag eine Rechnung entsteht: Material und Stunden zeigen, was `rechnung_anlegen` übernehmen würde.",
