      "instructions": "Meistron ist die Auftrags- und Rechnungssoftware dieses Handwerksbetriebs. Dieser Zugang liefert per Werkzeug die Live-Daten des Betriebs — Aufträge, Termine, Rechnungen, Angebote, Material und Bestand, Zeiten — und daneben die gepflegte Hilfe als Resources. Fragen zu diesen Daten immer über ein Werkzeug beantworten, nie aus der Hilfe und nie aus allgemeinem Wissen. Welche Werkzeuge bereitstehen, sagt tools/list; es hängt davon ab, was dieser Betrieb freigegeben hat. Was dort nicht steht, kann dieser Zugang nicht — dann das sagen, statt einen Werkzeugnamen zu raten. Wenn `beleg_pdf`, `auftragsnachweis_pdf` oder `bestandsliste_pdf` angeboten wird, kann der Assistent die jeweilige PDF lesen. Der Dokumentbereich ist ab Werk aus; bei einer Absage nie um einen Token-Link bitten und nie eine Ersatzfassung erfinden. Kunden lassen sich mit `kunden_suchen` finden. Das gibt Kennung, Kundennummer, Name und Ort heraus, bewusst aber KEINE Kontaktdaten. Vor `kunde_anlegen` immer erst suchen — sonst entstehen zwei Karteien zum selben Kunden, mit getrennter Rechnungshistorie. Den Empfänger einer Sendung löst der Server selbst aus dem Kundenstamm auf; eine Adresse muss nie erfragt werden. Manche Werkzeuge schreiben; was an Endkunden hinausgeht, verlangt im Standardmodus eine ausdrückliche Bestätigung. Nur wenn der Inhaber für genau diesen Zugang in Meistron Vollautonomie aktiviert hat, entfällt diese einzelne Rückfrage serverseitig. Nur für Fragen zur Bedienung gilt: aus den Hilfe-Quellen antworten, nicht aus allgemeinem Wissen über Handwerkersoftware, und sagen, wenn es dort nicht steht.",
      "tools": [
        {
          "name": "angebot_anlegen",
          "title": "Angebot anlegen",
          "description": "Legt einen ANGEBOTS-Entwurf an. Ein Angebot ist noch keine Rechnung: Es fordert kein Geld und wird nicht gebucht. Verschickt NICHTS an den Kunden.\n\nWird ein Auftrag angegeben, übernimmt das Angebot dessen noch nicht abgerechnetes Material und erfasste Arbeitszeit als Positionen — sofern der Betrieb die Bereiche „Material\" und „Zeiterfassung\" für den KI-Zugang nicht abgeschaltet hat; die Antwort sagt, was übernommen wurde. Zusätzlich oder stattdessen können eigene Positionen angegeben werden.\n\nBetreff und Belegkopf kommen ebenfalls aus dem Auftrag: Ohne Angabe wird der Auftragstitel zum Betreff, und Auftragsnummer, Objekt und Leistungstag/-zeitraum werden übernommen wie mit dem Knopf „Aus Auftrag & Projekt übernehmen\" — gedruckt werden nur die Kopffelder, die der Betrieb unter Rechnungen → Einstellungen gewählt hat; die Kundennummer kommt aus dem Kundenstamm. Ist am Auftrag ein Nettopreis hinterlegt, nennt die Antwort die Abweichung der Positionen dazu.\n\nDie Umwandlung eines Angebots in eine Rechnung geschieht in Meistron und ist über diesen Zugang NICHT möglich.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "auftrag_id": {
                "description": "Auftrag, dessen Material und Arbeitszeit übernommen werden sollen — und aus dem Betreff und Belegkopf gefüllt werden.",
                "type": "string"
              },
              "belegkopf": {
                "additionalProperties": false,
                "description": "Angaben rechts oben im Belegkopf. Ohne Angabe werden Auftragsnummer, Objekt und Leistungszeitraum aus dem Auftrag übernommen (siehe `belegkopf_aus_auftrag`); jede Angabe hier gewinnt je Feld. Gedruckt wird NUR, was der Betrieb unter Rechnungen → Einstellungen „Angaben im Belegkopf\" gewählt hat — die Antwort sagt, welche Angaben deshalb nicht auf dem Beleg stehen. Die Kundennummer lässt sich hier nicht setzen; sie kommt aus dem Kundenstamm.",
                "properties": {
                  "auftragsnummer": {
                    "description": "Auftragsnummer(n) auf dem Beleg, mehrere durch Komma. Vorgabe: die des Auftrags.",
                    "maxLength": 60,
                    "type": "string"
                  },
                  "kundenreferenz": {
                    "description": "Bestell- oder Vorgangsnummer des Kunden („Ihre Nr.\"), z. B. PO-4711.",
                    "maxLength": 60,
                    "type": "string"
                  },
                  "leistung_bis": {
                    "description": "Ende des Leistungszeitraums, JJJJ-MM-TT.",
                    "type": "string"
                  },
                  "leistung_modus": {
                    "description": "`tag` druckt einen Leistungstag (`leistung_von`), `zeitraum` eine Spanne (`leistung_von` bis `leistung_bis`), `keine` druckt nichts. Ohne Angabe ergibt sich der Modus aus den Daten bzw. aus dem Termin des Auftrags.",
                    "enum": ["keine", "tag", "zeitraum"],
                    "type": "string"
                  },
                  "leistung_von": {
                    "description": "Leistungstag oder Beginn, JJJJ-MM-TT.",
                    "type": "string"
                  },
                  "leistungsempfaenger": {
                    "description": "Wer die Leistung erhalten hat, wenn nicht der Rechnungsempfänger — etwa der Mieter.",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "objektadresse": {
                    "description": "Bezeichnung des Objekts, z. B. „Wohnanlage Süd, Haus 3\". Vorgabe: Projektname, sonst Ort des Auftrags.",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "objektnummer": {
                    "description": "Objekt- oder Projektnummer. Vorgabe: die Nummer des Projekts am Auftrag.",
                    "maxLength": 60,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "belegkopf_aus_auftrag": {
                "description": "Vorgabe true: übernimmt Auftragsnummer, Objektnummer, Objektadresse und Leistungstag/-zeitraum aus dem Auftrag — wie der Knopf „Aus Auftrag & Projekt übernehmen\" in Meistron. Auf false setzen, wenn der Belegkopf ausschließlich aus `belegkopf` kommen soll.",
                "type": "boolean"
              },
              "betreff": {
                "description": "Betreff des Angebots, eine Zeile unter der Belegnummer (z. B. „Heizungswartung Reihenhaus\"). Ohne Angabe wird der Titel des Auftrags übernommen.",
                "maxLength": 120,
                "type": "string"
              },
              "hinweis": {
                "description": "Text für den Kunden auf dem Angebot.",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Im vollautonomen Betrieb erforderlich. Beim ersten Aufruf weglassen: Der Server liefert dann einen UUID-Key, ohne die Aktion auszuführen. Den Aufruf mit diesem Key wiederholen und bei Retry/Reconnect denselben Key verwenden. Eine neue beabsichtigte Aktion braucht einen neuen Key.",
                "format": "uuid",
                "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$",
                "type": "string"
              },
              "kunde_id": {
                "description": "Die Kennung des Kunden. Ohne Angabe wird der Kunde des Auftrags übernommen.",
                "type": "string"
              },
              "ohne_material": {
                "description": "Nur Stunden übernehmen, kein Material.",
                "type": "boolean"
              },
              "ohne_zeiten": {
                "description": "Nur Material übernehmen, keine Stunden.",
                "type": "boolean"
              },
              "positionen": {
                "description": "Eigene Positionen. Höchstens 50.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "beschreibung": {
                      "type": "string"
                    },
                    "einheit": {
                      "type": "string"
                    },
                    "einzelpreis": {
                      "description": "Netto, ohne Steuer.",
                      "type": "number"
                    },
                    "menge": {
                      "type": "number"
                    }
                  },
                  "required": ["beschreibung", "einzelpreis", "menge"],
                  "type": "object"
                },
                "type": "array"
              },
              "steuersatz": {
                "description": "Steuersatz für den GESAMTEN Beleg in Prozent — 19, 7 oder 0. Ohne Angabe der im Betrieb hinterlegte Satz. Ein Beleg trägt genau EINEN Satz, im Kopf wie in jeder Position; gemischte Sätze lehnt Meistron beim Finalisieren ab. Wer beides braucht, legt zwei Belege an.",
                "type": "number"
              }
            },
            "type": "object"
          },
