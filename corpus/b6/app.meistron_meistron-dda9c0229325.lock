        {
          "name": "auftrag_aendern",
          "title": "Auftrag ändern",
          "description": "Ändert Titel, Beschreibung, Ort oder Termin eines bestehenden Auftrags. Nur die angegebenen Felder werden angefasst. Den Status setzt das Werkzeug nicht selbst — wie in der App stellt aber eine geänderte Beschreibung einen geplanten Auftrag auf „In Bearbeitung“, und zurück auf „geplant“ geht es danach nicht. Bei einer echten Terminverschiebung können die zugewiesenen Mitarbeiter eine Push-Meldung erhalten, wenn der Betrieb die Aussenwirkung erlaubt hat; dem Kunden wird nichts geschickt.",
