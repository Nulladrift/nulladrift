        {
          "name": "kunden_suchen",
          "title": "Kunden suchen",
          "description": "Findet Kunden des Betriebs nach Name, Firma oder Ort und nennt ihre Kennung. Diese Kennung verlangen `rechnung_anlegen`, `angebot_anlegen` und `auftrag_anlegen`.\n\nZUERST SUCHEN, DANN ANLEGEN. Wer stattdessen `kunde_anlegen` benutzt, weil er den vorhandenen Eintrag nicht findet, erzeugt eine Dublette — zwei Karteien zum selben Kunden, mit getrennter Rechnungshistorie.\n\nGibt bewusst KEINE Kontaktdaten heraus: Kennung, Kundennummer, Name, Ort und ob eine E-Mail-Adresse hinterlegt ist. Zum Versenden braucht es die Adresse nicht — den Empfänger löst der Server selbst aus dem Kundenstamm auf.",
