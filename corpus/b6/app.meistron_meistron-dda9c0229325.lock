        {
          "name": "rechnung_versenden",
          "title": "Rechnung versenden",
          "description": "Nur für den tatsächlichen Versand verwenden. Für eine bloße Prüfung ohne Datenänderung immer `rechnung_versand_vorschau` aufrufen. Versendet einen Rechnungs-Entwurf per E-Mail an den Kunden. Dabei wird die Rechnungsnummer vergeben, das PDF eingefroren und der Versand protokolliert; ab dann ist die Rechnung nach GoBD unveränderlich. Die interne Rechnungskennung vorher selbst mit `rechnungen_suchen` ermitteln; den Menschen niemals bitten, eine UUID einzugeben oder zu wiederholen.\n\nBRIEFE GEHEN ÜBER DIESEN ZUGANG NICHT. Das ist Absicht, kein Fehler: Die Anschrift eines Kunden kann über denselben Zugang angelegt worden sein — ein Brief ginge dann an eine Adresse, die nie ein Mensch geprüft hat, auf Kosten des Post-Guthabens des Betriebs. Wer einen Brief verschicken will, tut das in Meistron. Das dem Handwerker so sagen, statt es anders zu versuchen.\n\nNORMALER MODUS — ZWEI SCHRITTE:\n1. Ohne „freigabe\" aufrufen → es geht NICHTS hinaus. Zurück kommt eine Vorschau: alle Positionen und Summen, Empfänger, Mailtext, der in Meistron gewählte Standard-Absender, Antwortadresse, die vollständige Anhangsliste und ein geschütztes Entwurfs-PDF — dazu ein Freigabewort.\n2. Die Vorschau dem Menschen zeigen und ihn ausdrücklich fragen. Erst mit seinem Ja erneut aufrufen, diesmal mit „freigabe\".\n\nDas Freigabewort NIEMALS selbst erfinden und den zweiten Schritt NIEMALS ohne ausdrückliche Zustimmung tun. Ausnahme: Hat der Inhaber für genau diesen Zugang in Meistron „Vollzugriff und Vollautonomie\" aktiviert, führt der Server den Versand direkt ohne Vorschau-Runde aus. Diesen Modus kann das Modell weder wählen noch einschalten. Eine E-Mail ist nicht zurückholbar und trifft einen echten Kunden.\n\nEmpfänger, Betreff und Text lassen sich hier NICHT angeben: Die Rechnung geht an die Adresse, die beim Kunden hinterlegt ist, mit den Vorlagen des Betriebs. Im normalen Modus muss diese Adresse menschlich bestätigt sein. Eine vom KI-Zugang angelegte Kundenadresse ist ausschließlich unter der für denselben Zugang aktivierten Vollautonomie samt E-Mail-Kanal sendefähig und wird in der Antwort so ausgewiesen. Der Absender ist ebenfalls kein Argument: Der Server nutzt exakt den aktiven Standard unter E-Mail-Absender. Nur wenn kein aktiver betrieblicher Absender existiert, wird der Meistron-Systemabsender klar ausgewiesen. Ein fehlender oder ungültiger Default neben aktiven Konten bricht ohne Fallback ab. Wer an eine andere Adresse senden will, ändert sie beim Kunden in Meistron.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "freigabe": {
                "description": "Das Freigabewort aus der Vorschau (Form „SENDEN-1234\"). Nur setzen, wenn der Mensch die Vorschau gesehen und ausdrücklich zugestimmt hat.",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Im vollautonomen Betrieb erforderlich. Beim ersten Aufruf weglassen: Der Server liefert dann einen UUID-Key, ohne die Aktion auszuführen. Den Aufruf mit diesem Key wiederholen und bei Retry/Reconnect denselben Key verwenden. Eine neue beabsichtigte Aktion braucht einen neuen Key.",
                "format": "uuid",
                "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$",
                "type": "string"
              },
              "rechnung_id": {
                "description": "Interne Kennung des Entwurfs aus `rechnungen_suchen`. Selbst zwischen Werkzeugen weiterreichen und niemals vom Menschen eintippen oder wiederholen lassen. Die Rechnung muss im Status „Entwurf\" sein.",
                "type": "string"
              },
              "weg": {
                "description": "Nur E-Mail. Briefe lassen sich über diesen Zugang NICHT versenden — sie werden in Meistron ausgelöst.",
                "enum": ["email"],
                "type": "string"
              }
            },
            "required": ["rechnung_id"],
            "type": "object"
          },
