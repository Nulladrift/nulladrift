          "description": "Nennt die aktuellen Eckdaten: wie viele Aufträge offen und wie viele terminiert sind, wie viele Rechnungen unbezahlt und davon überfällig, und die Summe der offenen Posten — als RESTBETRAG, Teilzahlungen sind also bereits abgezogen. Guter erster Aufruf, um zu verstehen, worum es gerade geht.",
