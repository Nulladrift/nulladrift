        {
          "name": "kunde_anlegen",
          "title": "Kunde anlegen",
          "description": "Legt einen neuen Kunden an. Name genügt; Firma und Anschrift sind optional. Die Kundennummer vergibt Meistron selbst; die Antwort nennt sie. Gibt es schon genau einen Kunden mit diesem Namen, wird KEIN zweiter angelegt; dort werden nur Angaben ergänzt, die noch leer sind (Firma, Anschrift, Kontaktdaten). Vorhandene Angaben werden nie überschrieben oder gelöscht; Korrekturen macht der Betrieb in Meistron. Bei mehreren gleichnamigen Kunden erfolgt KEINE Änderung.\n\nE-Mail, Festnetz und Mobilnummer werden NUR gespeichert, wenn der Inhaber für genau diesen KI-Zugang „Vollzugriff und Vollautonomie\" bestätigt hat. Im normalen Modus bleiben diese Kontaktdaten gesperrt. Bei zusätzlich aktivem autonomen E-Mail-Kanal darf die so gespeicherte Adresse für den strikt gebundenen Rechnungsversand verwendet werden.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "E-Mail-Adresse des Kunden. Nur mit serverseitig aktiver Vollautonomie für diesen Zugang.",
                "maxLength": 254,
                "pattern": "^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$",
                "type": "string"
              },
              "firma": {
