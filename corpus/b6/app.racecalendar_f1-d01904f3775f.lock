        {
          "name": "get_f1_circuit",
          "title": "F1 Circuit Details",
          "description": "Get circuit metadata and normalized track geometry for a race weekend selected by meeting key, round, race name, or slug.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "description": "Select one race weekend by season and exactly one of meetingKey, round, raceName, or slug.",
            "oneOf": [
              {
                "required": ["meetingKey"]
              },
              {
                "required": ["round"]
              },
              {
                "required": ["raceName"]
              },
              {
                "required": ["slug"]
              }
            ],
            "properties": {
              "meetingKey": {
                "description": "OpenF1 meeting key for the race weekend.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "raceName": {
                "description": "Human-friendly Grand Prix or race name, matched case-insensitively.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "round": {
                "description": "Championship round number for the season.",
                "maximum": 99,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "Race Calendar race slug, such as round-6-miami-grand-prix or miami-grand-prix.",
                "maxLength": 160,
                "minLength": 1,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              },
              "year": {
                "description": "Formula 1 season year.",
                "maximum": 2100,
                "minimum": 1950,
                "type": "integer"
              }
