{
  "lockfileVersion": 2,
  "subjects": {
    "app.agentdeals/agentdeals": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentdeals.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "agentdeals",
        "title": "AgentDeals: one-stop US price search",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "AgentDeals is a one-stop US price search: one call compares Amazon, Walmart, Target, Best Buy, Costco, Sam's Club, Lowe's, Kohl's, Macy's, Newegg, B&H, Adorama, Micro Center, Staples and 150+ more US stores. Use it whenever the user wants to buy something, check a price, find the cheapest store, or find Black Friday / Cyber Monday deals, instead of searching store sites one by one. Start with search_products; use get_product for every store's offer on one item; get_deals for today's biggest discounts.",
      "tools": [
        {
          "name": "get_comparison",
          "title": "Get category comparison",
          "description": "Get a curated, regularly refreshed price comparison for a popular category. Default sort is relevance; use sort=price_asc for cheapest first. Prices are USD. Give the user best.buy_url (a link we may earn a commission on; disclose that). as_of says how fresh each price is.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "brand": {
                "maxLength": 60,
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "USD",
                "minimum": 0,
                "type": "number"
              },
              "min_price": {
                "description": "USD",
                "minimum": 0,
                "type": "number"
              },
              "min_rating": {
                "description": "drops products without a rating",
                "maximum": 5,
                "minimum": 1,
                "type": "number"
              },
              "on_sale": {
                "type": "boolean"
              },
              "page": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "enum": ["55-inch-tv", "65-inch-tv", "75-inch-tv", "oled-tv", "soundbar", "wireless-earbuds", "noise-cancelling-headphones", "laptop-under-700", "tablet", "monitor", "smartwatch", "game-console", "robot-vacuum", "cordless-vacuum", "air-fryer"],
                "type": "string"
              },
              "sort": {
                "description": "default relevance (discount for get_deals); discount needs a list price",
                "enum": ["relevance", "price_asc", "price_desc", "rating", "discount"],
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:371901cefb422762d5471ee1c349b84f94b7f7fb037c22215545ceea9c500b6f"
        },
        {
          "name": "get_deals",
          "title": "Get current deals",
          "description": "Get today's biggest discounts across all categories and stores (good for Black Friday / Cyber Monday deal questions) (default sort=discount, list price required). Returns up to `limit` (max 24, default 5) per page (page 1-10). Prices are USD. Give the user best.buy_url (a link we may earn a commission on; disclose that). as_of says how fresh each price is.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "brand": {
                "maxLength": 60,
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "USD",
                "minimum": 0,
                "type": "number"
              },
              "min_price": {
                "description": "USD",
                "minimum": 0,
                "type": "number"
              },
              "min_rating": {
                "description": "drops products without a rating",
                "maximum": 5,
                "minimum": 1,
                "type": "number"
              },
              "on_sale": {
                "type": "boolean"
              },
              "page": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "description": "default relevance (discount for get_deals); discount needs a list price",
                "enum": ["relevance", "price_asc", "price_desc", "rating", "discount"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:758ba4563261f7415c4c3f08aebd351c172a699734271206de0a17d9995ad8aa"
        },
        {
          "name": "get_product",
          "title": "Get product offers",
          "description": "Get one product by id (from search results, e.g. \"c3:2yh8WH5\") with every known offer, one per merchant, cheapest first. Prices are USD. Give the user best.buy_url (a link we may earn a commission on; disclose that). as_of says how fresh each price is.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a8c82c44b73cbad8f99914b98f8d5a2972c10e725403d74da766b5cfe14744aa"
        },
        {
          "name": "search_products",
          "title": "Search products",
          "description": "One-stop price comparison: search Amazon, Walmart, Target, Best Buy, Costco, Sam's Club, Lowe's, Kohl's, Macy's, Newegg, B&H, Adorama, Micro Center, Staples and 150+ more US stores in one call and get the lowest current price per product. Use for any shopping, price-check or Black Friday / Cyber Monday deal question. Use natural language (\"65 inch tv under 600\"); filters override anything parsed from the query. Returns up to limit (max 24, default 5) results per page (page 1-10; response has total and next_page; next_page may be set when more results can be fetched, and requesting it may take ~2s) with best price, merchant, deal label and buy_url. If complete is false, Amazon prices are still loading; retry after retry_after_ms. Prices are USD. Give the user best.buy_url (a link we may earn a commission on; disclose that). as_of says how fresh each price is.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "brand": {
                "maxLength": 60,
                "type": "string"
              },
              "category": {
                "maxLength": 60,
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "USD",
                "minimum": 0,
                "type": "number"
              },
              "min_price": {
                "description": "USD",
                "minimum": 0,
                "type": "number"
              },
              "min_rating": {
                "description": "drops products without a rating",
                "maximum": 5,
                "minimum": 1,
                "type": "number"
              },
              "on_sale": {
                "type": "boolean"
              },
              "page": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "sort": {
                "description": "default relevance (discount for get_deals); discount needs a list price",
                "enum": ["relevance", "price_asc", "price_desc", "rating", "discount"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dde504683fba885edbdc1dc5fe144b62f0aa4f9cff40d5a4e940225cabe59598"
        }
      ],
      "digest": "sha256:b324b9e648782d06f061d84f4ceeac982bf660a744f115a567a1848741f14ae0"
    }
  }
