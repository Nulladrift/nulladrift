      },
      "instructions": "CRLN (Clinical Research Learning Network) is free clinical research education. Use practice_decision to give the person one real trial decision, then check_answer with their choice; CRLN scores it on its server. Use explain_rule for ICH E6(R3) and GCP questions, career_path for roles, and site_readiness_info for research sites. Education only: CRLN does not recruit, screen, match or refer anyone to a study.",
      "tools": [
        {
          "name": "career_path",
          "title": "Find a clinical research career path",
          "description": "For a clinical research role and a country, link to CRLN's Career Path Finder page for that role and country, plus free training for it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "The country, for example Nigeria or United States.",
                "type": "string"
              },
              "language": {
                "description": "Preferred language. Optional.",
                "type": "string"
              },
              "role": {
                "description": "The role, for example CRC, CRA, research nurse or regulatory.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a clinical research career path"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c954bd4195f519dad243910626d78774f6433c2ec520735552976dd0a7439675"
        },
        {
          "name": "check_answer",
          "title": "Check a practice answer",
          "description": "Score the person's choice for a CRLN practice decision. Returns the score out of 4, the feedback, the rule it rests on and a link to continue that scenario in CRLN. It never says which option is best. Call it only after the person has chosen.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "attempt_id": {
                "description": "The attempt_id from practice_decision.",
                "type": "string"
              },
              "choice": {
                "description": "The letter the person chose, for example B.",
                "type": "string"
              },
              "scenario_id": {
                "description": "The scenario_id from practice_decision.",
                "type": "string"
              }
            },
            "required": ["choice", "scenario_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attempt_id": {
                "type": "string"
              },
              "choice": {
                "type": "string"
              },
              "consequence": {
                "type": ["string", "null"]
              },
              "decisions_in_scenario": {
                "type": "integer"
              },
              "feedback": {
                "type": "string"
              },
              "first_answer_stands": {
                "type": "boolean"
              },
              "link": {
                "description": "A link straight to the page on CRLN.",
                "type": "string"
              },
              "option": {
                "type": "string"
              },
              "out_of": {
                "type": "integer"
              },
              "result": {
                "type": "string"
              },
              "rule": {
                "type": "string"
              },
              "scenario_id": {
                "type": "string"
              },
              "score": {
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a practice answer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Scored",
            "openai/toolInvocation/invoking": "Scoring your answer",
            "openai/widgetAccessible": true
          },
          "digest": "sha256:52d4aa21759fe9c69e6e656f43f2bf39f03714bc0626cfa33808637b5d8beb67"
        },
        {
          "name": "explain_rule",
          "title": "Explain a GCP rule",
          "description": "Plain-language answer from CRLN's published pages to a question about ICH E6(R3), Good Clinical Practice, US FDA rules for site staff, free GCP training, clinical research careers, or taking part in research, with the primary sources cited and a link straight to the page. Says so when CRLN has no page for the question.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "question": {
                "description": "The question, in the person's words.",
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain a GCP rule"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2799350dbc89af9d0a831121f81976854fca52412d4eb8550c29fedc46ac032e"
        },
        {
          "name": "practice_decision",
          "title": "Practice a clinical research decision",
          "description": "Get one real clinical research decision from CRLN's public Practice Lab scenarios: the situation, the question and the options, with no answer. Optional role filter (for example CRC, CRA, CTA, PI, regulatory, data manager, research nurse, pharmacovigilance). Show the options to the person and let them choose before calling check_answer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Preferred language, for example es or Spanish. Decisions are served in English for now; the CRLN page offers other languages.",
                "type": "string"
              },
              "role": {
                "description": "Role to practice, for example CRC, CRA, PI or regulatory. Optional.",
                "type": "string"
              },
              "scenario_id": {
                "description": "A specific public scenario id, to show that decision again. Optional.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attempt_id": {
                "type": "string"
              },
              "decisions_in_scenario": {
                "type": "integer"
              },
              "language": {
                "type": "string"
              },
              "link": {
                "description": "A link straight to the page on CRLN.",
                "type": "string"
              },
              "options": {
                "items": {
                  "properties": {
                    "choice": {
                      "type": "string"
                    },
                    "text": {
                      "type": "string"
                    }
                  },
                  "required": ["choice", "text"],
