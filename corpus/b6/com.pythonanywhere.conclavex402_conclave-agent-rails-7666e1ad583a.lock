      "instructions": "Conclave Agent-Rails x402 data seller: crypto price & market data, Solana token snapshots, decision-grade Solana account/wallet on-chain data, package-registry metadata (PyPI & npm), and x402/payment-rail status. All pay-per-call over x402 (USDC on Base) behind one public payTo. Paid routes: GET /v1/price?ids=<coingecko-ids> (live crypto price / market data), GET /v1/token?mint=<base58|0x> (token metadata, price snapshot & verdict; Solana or Base), GET /v1/solana/snapshot/{address} (on-chain account/wallet snapshot), GET /v1/pkg?ecosystem=<pypi|npm>&name=<pkg> (package version & metadata), GET /v1/x402-integrity (x402 catalog integrity / ecosystem health), GET /v1/rail-status (multi-rail status), plus deterministic /u/* micro-utilities. Paid calls use x402 (HTTP 402): call a path with no payment header for the payment requirement, then retry with the base64 PAYMENT-SIGNATURE header. Free MCP tools: list_services, ping, and the deterministic /u/* micro-utilities (free over MCP, but paid per-request over HTTP). brick-blue-key=5cYu3MiyiMtWR7Az2FBH5Hk96Qis5A2MLMMuGAQb7kPQ Measured by brick.blue: https://brick.blue/agent/f106af5328500b4c",
