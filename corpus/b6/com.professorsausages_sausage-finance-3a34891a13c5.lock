        "name": "sausage-finance",
        "title": "SEC Filings, Insider Trades & 13F Holdings — pay-per-call, no API key (Sausage Finance)",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {},
        "tools": {}
      },
      "instructions": "Professor Sausages' finance data counter — ground-truth US public-company data from EDGAR, parsed into agent-readable JSON. Free tools: find_data (describe what you need), coverage (what exists), pricing (exact costs), request_data (ask for data we don't have yet — most requests are ingested within ~24h). Paid tools charge per call in USDC on Base via x402: call one without x_payment to get its exact terms, sign them, and call again with x_payment. No signup, no API keys. A definitive 'not found' is a paid answer with found:false and a reason, never a 404.",
      "tools": [
        {
          "name": "coverage",
          "title": "What's in the corpus",
          "description": "Corpus coverage: which SEC datasets exist, 10-K backfill progress by quarter (2015→now), and — given a ticker — which fiscal years are on file for it. Free.",
          "inputSchema": {
            "properties": {
              "ticker": {
                "description": "Optional stock ticker to check company-specific 10-K coverage",
                "examples": ["AAPL"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1cf277f3037e4de31c435428dfbcaa1ee36cba1ce72b1c10d6cbb5dca2505d57"
        },
        {
          "name": "find_data",
          "title": "Find the right data source",
          "description": "Describe the data you need in plain language (e.g. 'Apple risk factors 2023', 'is this token a honeypot', 'is this email deliverable', 'read this page'). Searches this server's datasets first, then the whole Professor Sausages catalog, and returns matching endpoints with method, URL, price, and how to call them. Free.",
          "inputSchema": {
            "properties": {
              "task": {
                "description": "What you're trying to find or do, in your own words",
                "examples": ["Apple risk factors 2023"],
                "type": "string"
              }
