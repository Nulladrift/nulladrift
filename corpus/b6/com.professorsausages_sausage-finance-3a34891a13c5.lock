        },
        {
          "name": "fx_rate",
          "title": "FX reference rate",
          "description": "ECB reference exchange rate for a currency pair (e.g. EUR/USD). Paid: call without x_payment to receive this call's exact terms (amount, asset, network), sign them, then call again with x_payment. The free `pricing` tool lists every price at once.",
          "inputSchema": {
            "properties": {
              "base": {
                "description": "Base currency, ISO 4217 code.",
                "examples": ["EUR"],
                "type": "string"
              },
              "quote": {
                "description": "Quote currency, ISO 4217 code.",
                "examples": ["USD"],
                "type": "string"
              },
              "x_payment": {
                "description": "Optional signed x402 payment payload (base64, what the X-PAYMENT header carries). Omit to receive the exact payment terms; sign them (e.g. @x402/fetch) and call again with this argument to settle and get the data.",
