      "tools": [
        {
          "name": "get_flood_status",
          "description": "Get current flood conditions for USGS monitoring sites in a state.\n\n    Returns sites where water levels are above flood stage, indicating\n    active flooding or near-flood conditions. Checks the most recent\n    instantaneous values against known flood stages.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'CA', 'TX', 'LA').\n    ",
          "inputSchema": {
            "properties": {
              "state": {
                "title": "State",
                "type": "string"
              }
            },
            "required": ["state"],
            "title": "get_flood_statusArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_flood_statusOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:11fa21411f84a374bb26e67a23509fd44014a37392bd40822573c57af0cedc05"
        },
        {
          "name": "get_sites_by_state",
          "description": "Find USGS water monitoring sites in a state.\n\n    Returns a list of monitoring stations with their site numbers, names,\n    and locations. Use site numbers with get_water_levels to retrieve data.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'CA', 'TX').\n        site_type: Type of monitoring site. 'ST' for stream/river, 'GW' for groundwater well, 'SP' for spring.\n        limit: Maximum number of sites to return (default 50).\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 50,
                "title": "Limit",
                "type": "integer"
              },
              "site_type": {
                "default": "ST",
                "title": "Site Type",
                "type": "string"
              },
              "state": {
                "title": "State",
                "type": "string"
              }
            },
            "required": ["state"],
            "title": "get_sites_by_stateArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_sites_by_stateOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:834521e6fd9af90165b8372d8f1d0af96380d470e3b82ee2b5435570c028b9c7"
        },
        {
          "name": "get_water_levels",
          "description": "Get recent water level and streamflow data for a USGS monitoring site.\n\n    Returns time-series data including discharge (streamflow) and gage height\n    for the specified monitoring station.\n\n    Args:\n        site_number: USGS site number (e.g. '01646500' for Potomac River at Little Falls).\n        days: Number of days of data to retrieve (default 7, max 120).\n    ",
          "inputSchema": {
            "properties": {
              "days": {
                "default": 7,
                "title": "Days",
                "type": "integer"
              },
              "site_number": {
                "title": "Site Number",
                "type": "string"
              }
            },
            "required": ["site_number"],
            "title": "get_water_levelsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_water_levelsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bacf0a41fd03c4fb32d92e8616c522f96b809333175baf5e08fa1e72e4d19ede"
        }
      ],
      "digest": "sha256:4e9c3c7ae1a55ad67af61aa6c33d1324cc2d21348688c870ce30afaccc33630a"
    }
  }
