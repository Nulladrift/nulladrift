      "capabilities": {
        "tools": {}
      },
      "instructions": "ThreatCrush security tools for your organization. CrushAV file-hash reputation with no key (av_hash_lookup), IP and domain reputation from the ThreatCrush community threat database (reputation_lookup, reputation_bulk), your org's tracked scan/pentest/ai-scan findings (findings_list, findings_get, findings_triage), incidents raised to your team with host/time filtering, linked event and block context, saved AI triage and fix tracking (incidents_list, incidents_get, incidents_update, incidents_raise), and your org's webhook endpoints (webhooks_list, webhooks_create, webhooks_update, webhooks_delete, webhooks_test, webhooks_rotate_secret, webhooks_deliveries). Everything except av_hash_lookup needs a ThreatCrush credential: connect with OAuth (sign in to threatcrush.com when asked) or send a tc_agent_ key as the Bearer token; keyless public lookups are at nichedb.dev/mcp. Read tools are safe to call freely; findings_triage, incidents_update, incidents_raise (pages humans by SMS and email) and the webhook write tools change shared state, so confirm with the user first.",
      "tools": [
        {
          "name": "av_hash_lookup",
          "title": "Look up file hashes (CrushAV)",
          "description": "CrushAV file reputation, no key needed: look up up to 100 SHA-256 file hashes. For each hash something is known about, returns `knownMalicious` (the source listing it as malware), `malwareName`, `trust` (0-100: how sure CIRCL hashlookup is that this is a published, known-good file from NSRL or a major OS/package repo) and a `fileName` it was seen as. Unknown hashes are omitted. Send hashes only, never file contents.",
          "inputSchema": {
            "properties": {
              "hashes": {
                "description": "Lower-case hex SHA-256 hashes (max 100)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["hashes"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Look up file hashes (CrushAV)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:59a1dca16b4849d8ecfc05a853a76046308d3704476b76df16c0eaa9f3213f90"
        },
        {
