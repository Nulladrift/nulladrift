        {
          "name": "incidents_list",
          "title": "List incidents",
          "description": "Your org's incidents: what `threatcrush investigate --raise`, the daemon (critical detections) and people raised to humans. Filter by host and explicit since timestamp; only teams you can see. Session token or tc_agent_ key.",
