        {
          "name": "incidents_update",
          "title": "Update an incident",
          "description": "Update fix work performed by your assigned agent or human: set multiple assignees, fix status, PR URL, test status and evidence, verification or blocker, and/or add a note. ThreatCrush catalogs the incident and does not execute remediation. Closing requires status fixed with passing tests and verification, or false_positive with a reason and verification, plus resolution.reason/action/verification. Needs write.",
          "inputSchema": {
            "properties": {
              "assignee_id": {
                "type": ["string", "null"]
              },
              "assignee_ids": {
                "description": "Replace the assignee list with these active org/team member user IDs; [] clears it. An assignee receives write access to this incident. Use incidents_get to find member IDs and emails.",
                "items": {
                  "format": "uuid",
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "fix_work": {
                "additionalProperties": false,
                "properties": {
                  "blocked_reason": {
                    "maxLength": 2000,
                    "type": ["string", "null"]
                  },
                  "pr_url": {
                    "description": "HTTPS URL to the remediation PR",
                    "format": "uri",
                    "type": ["string", "null"]
                  },
                  "status": {
                    "enum": ["unassigned", "assigned", "in_progress", "blocked", "pr_open", "testing", "tested", "fixed", "false_positive"],
                    "type": "string"
                  },
                  "test_status": {
                    "enum": ["not_run", "running", "passed", "failed", "skipped"],
                    "type": "string"
                  },
                  "test_summary": {
                    "maxLength": 4000,
                    "type": ["string", "null"]
                  },
                  "test_url": {
                    "description": "HTTPS URL to the CI run or test report",
                    "format": "uri",
                    "type": ["string", "null"]
                  },
                  "verification": {
                    "maxLength": 2000,
                    "type": ["string", "null"]
                  }
                },
                "type": "object"
              },
              "id": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "org_id": {
                "type": "string"
              },
              "resolution": {
                "additionalProperties": false,
                "properties": {
                  "action": {
                    "maxLength": 2000,
                    "minLength": 1,
                    "type": "string"
                  },
                  "reason": {
                    "maxLength": 2000,
                    "minLength": 1,
                    "type": "string"
                  },
                  "verification": {
                    "maxLength": 2000,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["action", "reason", "verification"],
                "type": "object"
              },
              "status": {
                "enum": ["open", "acknowledged", "resolved"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Update an incident"
