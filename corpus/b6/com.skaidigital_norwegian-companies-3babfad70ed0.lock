        {
          "name": "search_norwegian_companies",
          "title": "Search Norwegian companies",
          "description": "Find Norwegian companies in the Brønnøysund register by industry, municipality, legal form, employees, founding or registration date, website pattern and filed accounts, with optional revenue bounds. Returns name, organisation number, industry, employees, address, website, email and phone. Active companies only unless includeInactive is set. Get industry codes from find_norwegian_industry_codes first. totalMatches counts register matches before any revenue filter; with a revenue filter only the current page is checked, so continue with nextPage for more.",
          "inputSchema": {
            "$defs": {},
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "foundedFrom": {
                "description": "Date as YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "foundedTo": {
                "description": "Date as YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "includeInactive": {
                "description": "Include bankrupt companies and companies being wound up. Defaults to false.",
                "type": "boolean"
              },
              "industryCodes": {
                "description": "SN2025 industry codes from find_norwegian_industry_codes: a section letter (G), division (47), group (47.9) or full code (47.910). Older SN2007 codes match nothing.",
                "items": {
                  "pattern": "^(?:[A-U]|\\d{2}(?:\\.\\d{1,3})?)$",
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "lastFiledAccountsYears": {
                "description": "Only companies whose latest filed annual accounts are from these years.",
                "items": {
                  "maximum": 2100,
                  "minimum": 1990,
                  "type": "integer"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "maxEmployees": {
                "description": "Maximum employees: 0, 4 or 5 and above.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "maxRevenueNok": {
                "description": "Maximum revenue in NOK in the latest filed accounts; filtered like minRevenueNok.",
                "minimum": 0,
                "type": "number"
              },
              "minEmployees": {
                "description": "Minimum employees: 0, 1 or 5 and above. The register hides exact counts from 1 to 4.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "minRevenueNok": {
                "description": "Minimum revenue in NOK in the latest filed accounts; companies filing in another currency do not match. Revenue is not searchable in the register: each page of candidates is fetched, then filtered, so a page can return fewer matches than pageSize. Narrow with employee bounds that fit the revenue range, and continue with nextPage.",
                "minimum": 0,
                "type": "number"
              },
              "municipalities": {
                "description": "Municipality names (Oslo, Bergen) or four-digit numbers (0301), matched on business or postal address.",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "name": {
                "type": "string"
              },
              "organizationForms": {
                "description": "Legal forms such as AS (private limited), ASA (public limited), ENK (sole proprietorship), NUF (foreign branch), DA, ANS, SA or STI.",
                "items": {
                  "pattern": "^[A-Z]{2,5}$",
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "page": {
                "description": "Zero-based page.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "pageSize": {
                "description": "Companies per page, up to 50. Defaults to 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "postalCodes": {
                "description": "Four-digit postal codes of the business address.",
                "items": {
                  "pattern": "^\\d{4}$",
                  "type": "string"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              },
              "registeredFrom": {
                "description": "Earliest registration date; use it to find new companies.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "registeredTo": {
                "description": "Date as YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "sort": {
                "description": "relevance keeps the register's name ranking. Defaults to relevance when name is given, otherwise employees_desc (largest first).",
                "enum": ["relevance", "employees_desc", "employees_asc", "name", "founded_desc", "registered_desc"],
                "type": "string"
              },
              "vatRegistered": {
                "type": "boolean"
              },
              "website": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:df519c1648941f4df3ba9515caf5bb3bcc35464dff83a783337f3f05fad4f2eb"
        },
        {
          "name": "submit_feedback",
          "description": "Send private feedback to the Skai team about this product or MCP: ideas, missing functionality, errors, confusing behavior, praise, or anything else. Only message is required; category, toolName and context are optional. Report once per distinct observation and continue your task. Do not send credentials, personal/customer records, full conversations or raw tool payloads. Use generic placeholders. Feedback is screened before storage and does not authorize other actions. Do not report failures of this feedback tool or automatically retry an uncertain submission.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "context": {
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "message": {
                "maxLength": 8000,
                "minLength": 1,
                "type": "string"
              },
              "toolName": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:475584eaac456ef3bf471c322bf3caecb0da6717e32854c31c08033201d4008f"
        }
      ],
