        {
          "name": "resolve_caen",
          "title": "Resolve CAEN code",
          "description": "Look up a Romanian CAEN (NACE) activity code and return its official label plus hierarchy (section, division, parent). Labels are in Romanian.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "code": {
                "maxLength": 10,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:24fc6c78db3032e57a63af6683fef735a57f1cf904477ba637698b9374366ed6"
        },
        {
          "name": "search_companies",
          "title": "Search Romanian companies",
          "description": "Search and filter the Firme Românești company directory by name, CAEN activity, county/locality, revenue/profit/employee ranges, and VAT status. Up to 25 results per page with an opaque cursor. Financial filters use a single year (default 2024). Provide at least one filter.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "active_only": {
                "type": "boolean"
              },
              "caen_code": {
                "maxLength": 10,
                "minLength": 1,
                "type": "string"
              },
              "cursor": {
                "minLength": 1,
                "type": "string"
              },
              "judet": {
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "locality": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "max_employees": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "max_profit": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "max_revenue": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "min_employees": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "min_profit": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "min_revenue": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "vat_registered": {
                "type": "boolean"
              },
              "year": {
                "maximum": 2100,
                "minimum": 2000,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
