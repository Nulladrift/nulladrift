      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "firme-romanesti",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_company_financials",
          "title": "Get company financials",
          "description": "Yearly financial history for a company by CUI: revenue, profit, employees, total assets and liabilities. Amounts in RON.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cui": {
                "anyOf": [
                  {
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  }
                ]
              },
              "years": {
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["cui"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6165d87abb1c0c6fff0e325bb7fadb9e7964827fe9be2b059ea04f0f31933ab3"
        },
        {
          "name": "get_company_profile",
          "title": "Get company profile",
          "description": "Fetch a single Romanian company by CUI (accepts an 'RO' prefix): identity, address, CAEN activities, latest public financials, and data-source freshness. Does not return contact details.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cui": {
                "anyOf": [
                  {
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  }
                ]
              }
            },
            "required": ["cui"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:443da7e3b0402434101da7c8fb2c218a5a02ff4c69c0127b081f439bd65d007f"
        },
        {
          "name": "get_company_status",
          "title": "Get company status",
          "description": "Public status flags for a company by CUI: registration status, VAT (TVA) registration, fiscal activity, insolvency, dissolution (radiere), and e-Factura.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cui": {
                "anyOf": [
                  {
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  }
                ]
              }
            },
            "required": ["cui"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:63cf00af88b2ccbd672d40a935762af6caa28e081135330e56cb0601b39a4e03"
        },
        {
          "name": "resolve_caen",
          "title": "Resolve CAEN code",
          "description": "Look up a Romanian CAEN (NACE) activity code and return its official label plus hierarchy (section, division, parent). Labels are in Romanian.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "code": {
                "maxLength": 10,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5e92a130c9ec4cabae517683be6519f9ed4699a147880298feb3f05a8fb17e93"
        },
        {
          "name": "search_companies",
          "title": "Search Romanian companies",
          "description": "Search and filter the Firme Românești company directory by name, CAEN activity, county/locality, revenue/profit/employee ranges, and VAT status. Up to 25 results per page with an opaque cursor. Financial filters use a single year (default 2024). Provide at least one filter.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "active_only": {
                "type": "boolean"
              },
              "caen_code": {
                "maxLength": 10,
                "minLength": 1,
                "type": "string"
              },
              "cursor": {
                "minLength": 1,
                "type": "string"
              },
              "judet": {
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "locality": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "max_employees": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "max_profit": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "max_revenue": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "min_employees": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "min_profit": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "min_revenue": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "vat_registered": {
                "type": "boolean"
              },
              "year": {
                "maximum": 2100,
                "minimum": 2000,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:24d4faefe0298382cb24bf8b69ba51c166d1b5c821e36148103e7b7a3ecd4dec"
        }
      ],
      "digest": "sha256:77cf67d791fcdfb64f299af0b12186f9c52c0b9c6706c5b1db567c6e646be79d"
    }
