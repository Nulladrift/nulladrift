{
  "lockfileVersion": 2,
  "subjects": {
    "ai.piishield/pii-shield": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://piishield.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "PII Shield",
        "title": "PII Shield",
        "version": "1.0.0",
        "icons": [
          {
            "src": "https://piishield.ai/icon-128.png",
            "mimeType": "image/png",
            "sizes": ["128x128"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PII Shield redacts personal data before it reaches the model. Use `redact` on any text you're about to share, `redact_document` on a file, and `set_coverage` to choose what gets masked.",
      "tools": [
        {
          "name": "detect_pii",
          "description": "Report what personal data appears in text (counts by type) without returning the raw values. Use to check whether text is safe to share. NOTE: detection is automated and is not a guarantee; a clean result does not prove the text is free of personal data.",
          "inputSchema": {
            "properties": {
              "text": {
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e4e6b5a8467b55977eafcfb99a98abf6c853542e2df5b10dca4c112303187036"
        },
        {
          "name": "get_coverage",
          "description": "Show your workspace's current PII coverage (which detectors are on, custom terms, custom patterns). Uses the workspace key from your MCP server URL.",
          "inputSchema": {
            "properties": {
              "shield_key": {
                "description": "optional — only if not already in the server URL",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:448db2705f962dff0daca4b1172be15f9696130df80fd15f42d675700fb1fd05"
        },
        {
          "name": "list_detectors",
          "description": "List the PII types this shield can mask, and confirm custom regex/terms are supported. Call this to see what coverage is available.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:69659a4b110c496a32a71edead8a26535eeb5f44e5caa081f4a0130df4b88faa"
        },
        {
          "name": "redact",
          "description": "Redact personal data (email, phone, cards, SA ID, SSN, IP, IBAN, names, custom terms) from text, replacing each value with a stable token like [EMAIL_1]. Call this before putting sensitive text into a prompt or context. NOTE: detection is automated and is not a guarantee; it can miss personal data. Review the output before relying on it.",
          "inputSchema": {
            "properties": {
              "customPatterns": {
                "description": "Custom PII as regexes, e.g. {type:'EMPID', pattern:'EMP-\\\\d{5}'}.",
                "items": {
                  "properties": {
                    "flags": {
                      "type": "string"
                    },
                    "pattern": {
                      "type": "string"
                    },
                    "type": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "customTerms": {
                "description": "Extra literal terms to always mask (custom PII).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "detectors": {
                "description": "Optional map of detector→bool to override defaults.",
                "type": "object"
              },
              "preview": {
                "description": "Dry run: return what WOULD be redacted (type, confidence, rationale) without changing the text or consuming quota.",
                "type": "boolean"
              },
              "reject": {
                "description": "Finding ids (from a preview) to leave unredacted — a human said 'not PII here'.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "text": {
                "description": "The text to redact.",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:96c1000cf9e7e35b441d43be7cdca8592a1c1b15e8209894c2727026ce46fc12"
        },
        {
          "name": "redact_document",
          "description": "Redact PII from an uploaded file or document before sharing it with an AI. Works on PDFs, Word (.docx), Excel (.xlsx), and text-based files (txt, csv, json, code, transcripts, logs). Pass base64 file data with media_type/filename, OR raw text. Returns the redacted text and counts. Requires your workspace key (via the MCP server URL). NOTE: detection is automated and is not a guarantee; it can miss personal data. Review the file yourself before sharing it.",
          "inputSchema": {
            "properties": {
              "base64": {
                "description": "base64-encoded file bytes",
                "type": "string"
              },
              "customPatterns": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "customTerms": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "detectors": {
                "type": "object"
              },
              "filename": {
                "type": "string"
              },
              "media_type": {
                "description": "e.g. application/pdf, text/csv",
                "type": "string"
              },
              "text": {
                "description": "or raw text instead of a file",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cf600fad583a13d56719d1c34c4cea9cd8fed7fbcd2ec1f7eee903675aefe93d"
        },
        {
          "name": "set_coverage",
          "description": "Change what this workspace masks, right from your chat. Turn detectors on/off (e.g. enable PERSON name masking), add always-mask terms, or add custom PII as regex (e.g. employee IDs 'EMP-\\\\d{5}'). Uses the workspace key from your MCP server URL.",
          "inputSchema": {
            "properties": {
              "customPatterns": {
                "description": "custom PII as regex",
                "items": {
                  "properties": {
                    "flags": {
                      "type": "string"
                    },
                    "pattern": {
                      "type": "string"
                    },
                    "type": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "customTerms": {
                "description": "literal terms to always mask",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "detectors": {
                "description": "map of detector→bool, e.g. {\"PERSON\":true}",
                "type": "object"
              },
              "shield_key": {
                "description": "optional — only if not already in the server URL",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:54c87adc36d63f2d010f563c08f6972834975328434ef69dc31b5ff5741579b4"
        }
      ],
      "digest": "sha256:d4ffe2e4479338f6427431b840dea47d7781b35cfbd846182c8dc88ab1321b8f"
    }
  }
}
