      "instructions": "83b Election Calculator (https://83belectioncalculator.com/): the site's own MCP server, served from its domain. 83b election calculator: the income an 83(b) election recognises now against the income at vesting, at your own tax rate, with the filing deadline from the rule.\n\n[calculator] 83(b) election: income now against income at vesting: an agent-callable calculator for 83b election calculator; Income recognised now if you elect, Income recognised at vesting if you do not, Tax on electing now, at your rate, computed from your inputs with sources.. This server runs the 83(b) election: income now against income at vesting calculator published at https://83belectioncalculator.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://83belectioncalculator.com/. Licence: https://83belectioncalculator.com/terms.\n\n[enquiry] ENQUIRY SERVER for 83b Election Calculator (https://83belectioncalculator.com/). What it does: starts an ENQUIRY with 83b Election Calculator for 83b election calculator; the 83b Election Calculator team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the 83b Election Calculator team until they click it. Cite https://83belectioncalculator.com/.\n\nCite https://83belectioncalculator.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
          "title": "83(b) election: income now against income at vesting",
          "description": "Run the 83(b) election: income now against income at vesting calculator: Income recognised now if you elect; Income recognised at vesting if you do not; Tax on electing now, at your rate; Tax at vesting without the election, at your rate. Missing inputs fall back to their documented defaults.",
