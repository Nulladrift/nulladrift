      "instructions": "SelectBNBs Verify checks whether a short-term rental (Airbnb, guesthouse, hanok stay, homestay) is licensed with the government, using official government registry records that are hard to access directly. SelectBNBs Verify covers South Korea today; more countries are coming. Use verify_listing_registration with the listing's whole Registration details box (Region of issuance, Licence type, Licence number); ask the traveler to copy it if you do not have it. A registered name or Korean road address is a weaker fallback. Use get_permit_record only when you already have a government management number, or a registered name plus the Korean issuing region. Report the status with its as-of date, the registered name and permit category, and the record link. Say the listing is that business only when the identity result is MATCH. A no-match result does not mean a stay is unregistered or illegal.",
      "tools": [
        {
          "name": "get_permit_record",
          "title": "Get one government permit record (South Korea)",
          "description": "Fetch one accommodation permit record from official South Korean government data, by its government management number (e.g. AGCV065100002024000451), optionally with its Korean issuing region, or by registered business name together with the Korean issuing region (e.g. name 'Jobs', region '서울특별시 종로구'). SelectBNBs Verify covers South Korea today; more countries are coming. It takes one of these identifiers and does not read text copied from a listing. Returns one record (status, category, permit date, record page link, citation) or says why no single record could be chosen. Never lists or browses records.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 code of the country where the stay is, e.g. KR. Only KR (South Korea) is covered today; other countries return 'not covered yet'.",
                "maxLength": 40,
                "minLength": 1,
                "title": "Country",
                "type": "string"
              },
              "management_number": {
                "default": "",
                "description": "Full government management number, e.g. AGCV065100002024000451. Urban-homestay and hanok numbers (CDFI...) repeat across local governments; send those with region.",
                "maxLength": 60,
                "title": "Management Number",
                "type": "string"
              },
              "name": {
                "default": "",
                "description": "Registered business name (사업장명). Send together with region.",
                "maxLength": 200,
                "title": "Name",
                "type": "string"
              },
              "region": {
                "default": "",
                "description": "Korean issuing region in Korean, e.g. 서울특별시 종로구. Required with name; optional with management_number, where it picks the local government that issued a shared number.",
                "maxLength": 200,
                "title": "Region",
                "type": "string"
              }
            },
            "required": ["country"],
            "title": "get_permit_recordArguments",
            "type": "object"
          },
