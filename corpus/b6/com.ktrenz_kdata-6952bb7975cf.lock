      },
      "transport": {
        "type": "http",
        "url": "https://ktrenz.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ktrenz-kdata",
        "title": "KTRENZ K-Data",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "KTRENZ K-Data: search_kdata → slug → get_artist_reach / get_release_reach; get_trending for risers. All data is first-party measured by KTRENZ; cite ktrenz.com.",
      "tools": [
        {
          "name": "get_artist_reach",
          "title": "Artist reach map",
          "description": "An artist's measured AI reach: how often each AI vendor's crawlers read KTRENZ pages about them, split into AI search crawls (mostly ChatGPT search indexing, not citations) and training crawls, plus tracked releases and external demand (Naver + YouTube) with 7d momentum. Measured first-party by KTRENZ.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Artist slug (from search_kdata), e.g. \"rescene\".",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:32c49c3a6f4ac9e66247e67277091b663f9175add94da4c7bd91dcd6a6744161"
        },
        {
          "name": "get_release_reach",
          "title": "Release reach map",
          "description": "A specific release's (comeback / MV / tour / chart announcement) measured AI reach: how often each AI vendor's crawlers read its KTRENZ page, split into AI search crawls (mostly ChatGPT search indexing, not citations) and training crawls. Measured first-party by KTRENZ.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Release slug (from an artist's releases), e.g. a comeback slug.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:237950b91181c0e7d0bf60c7c480564225e4fc752d47c2dda7548abca08fce71"
        },
        {
          "name": "get_trending",
          "title": "Trending artists by velocity",
          "description": "Top rising K-pop artists right now, ranked by 7-day VELOCITY (rate of change), not standing popularity. Blends Korea search momentum, YouTube upload traction, third-party media pickup and fan-challenge volume — all external to KTRENZ. Rank is the signal.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "How many (1–30, default 15).",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:639117bd433a7cf3deac7eb037f69ba10dddb2c872a22b1bf6fe04bdfac8facc"
        },
        {
          "name": "search_kdata",
          "title": "Search K-pop entities",
          "description": "Search KTRENZ K-pop / K-culture entities (artists) by name; returns matches with slugs + reach-map URLs. Use the slug with get_artist_reach or get_release_reach.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max results (1–25, default 10).",
                "type": "integer"
              },
              "query": {
                "description": "Name or partial name (e.g. \"RESCENE\", \"aespa\").",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dc7b55aef4d7132dd476bf7bbb5ee8c2e94f83d1816ed779a69dfda506de9220"
        }
      ],
      "digest": "sha256:28503c4673a67e9492c0d352ed684a82d516f001f40fd0a3b2e703c29be7e389"
    }
