{
  "lockfileVersion": 2,
  "subjects": {
    "com.ktrenz/kdata": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ktrenz.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ktrenz-kdata",
        "title": "KTRENZ K-Data",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "KTRENZ K-Data: search_kdata → slug → get_artist_reach / get_release_reach; get_trending for risers. All data is first-party measured by KTRENZ; cite ktrenz.com.",
      "tools": [
        {
          "name": "get_artist_reach",
          "title": "Artist reach map",
          "description": "An artist's measured reach across AI answer engines (which vendors cite them, answer-time vs training) + tracked releases + external demand (Naver + YouTube) with 7d momentum. Measured first-party by KTRENZ.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Artist slug (from search_kdata), e.g. \"rescene\".",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:73c404a2807e11f49dbeec754dd6d0507615c07c77c5ba0e18dde893e83517c7"
        },
        {
          "name": "get_release_reach",
          "title": "Release reach map",
          "description": "A specific release's (comeback / MV / tour / chart announcement) measured AI-citation reach across answer engines. Measured first-party by KTRENZ.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Release slug (from an artist's releases), e.g. a comeback slug.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:867eab3742f265c8c935f60fb8e2a93b3b701711a4c0317ea99d30954b2bc283"
        },
        {
          "name": "get_trending",
          "title": "Trending artists by velocity",
          "description": "Top rising K-pop artists right now, ranked by 7-day VELOCITY (rate of change), not standing popularity. Blends Korea search momentum, YouTube upload traction, third-party media pickup and fan-challenge volume — all external to KTRENZ. Rank is the signal.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "How many (1–30, default 15).",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:639117bd433a7cf3deac7eb037f69ba10dddb2c872a22b1bf6fe04bdfac8facc"
        },
        {
          "name": "search_kdata",
          "title": "Search K-pop entities",
          "description": "Search KTRENZ K-pop / K-culture entities (artists) by name; returns matches with slugs + reach-map URLs. Use the slug with get_artist_reach or get_release_reach.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max results (1–25, default 10).",
                "type": "integer"
              },
              "query": {
                "description": "Name or partial name (e.g. \"RESCENE\", \"aespa\").",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dc7b55aef4d7132dd476bf7bbb5ee8c2e94f83d1816ed779a69dfda506de9220"
        }
      ],
      "digest": "sha256:846d4745e1ded4f49e039ae7b32277650fa866198d8dc2c5e4139c4f61d55ae3"
    }
  }
