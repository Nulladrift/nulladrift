      },
      "transport": {
        "type": "http",
        "url": "https://market-category-booster.com/mcp/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "mcb",
        "version": "0.1.3",
        "websiteUrl": "https://market-category-booster.com"
      },
      "capabilities": {
        "experimental": {},
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "logging": {},
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": false
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Market Category Booster maps free-text product descriptions onto the live\ncategory taxonomy of a marketplace (Amazon, eBay, Shopify, Google).\n\nRecommended order of calls:\n  1. `list_stores` (free) to learn the valid `store_id` values;\n  2. `payment_info` (free) if you have no API key and intend to pay per call;\n  3. `categorize_product` for the actual work.\n\nTwo things surprise most clients:\n  - `categorize_product` returns a LIST, one match per taxonomy level, from the\n    broadest to the most specific — not a single category id. Read the whole\n    list as a path.\n  - the descent has a token budget per request. When it runs out the last match\n    carries `truncated: true`: the path is valid but is not necessarily a leaf,\n    and the call is billed in full.\n\nAuthentication accepts either an `X-API-Key` HTTP header on the MCP session, or\nan x402 payment proof in the JSON-RPC `_meta` under `x402/payment`. With\nneither, `categorize_product` answers with the x402 payment requirements\ninstead of a result.\n",
      "tools": [
        {
          "name": "categorize_product",
          "description": "Map a free-text product description to a marketplace category path.\n\nWalks the taxonomy of the target marketplace one level at a time and\nreturns the full path: one match per level, from the broadest category down\nto the most specific one, each with the reason it was picked. Use it to\nassign a listing category to a product you only have prose for.\n\nThe last match carries `truncated: true` when the per-request token budget\nstopped the descent before a leaf. Every successful call is billed: with no\n`X-API-Key` header and no x402 payment proof the tool answers with the\npayment requirements instead of a result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "description": {
                "description": "free-text product description, up to 2000 characters.",
                "type": "string"
              },
              "store_id": {
                "description": "target marketplace, one of the values from `list_stores`.",
                "type": "string"
              }
            },
            "required": ["description", "store_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "categories": {
                "description": "One match per taxonomy level, from broadest to most specific. The last item may carry truncated=true",
                "items": {
                  "description": "One level of the taxonomy descent: the category matched at that depth.",
                  "properties": {
                    "category": {
                      "description": "Category name as it appears in the taxonomy",
                      "type": "string"
                    },
                    "id": {
                      "anyOf": [
                        {
                          "type": "integer"
                        },
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null,
                      "description": "Category identifier in the target taxonomy"
                    },
                    "level": {
                      "anyOf": [
                        {
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null,
                      "description": "Zero-based depth in the taxonomy tree; null on legacy records"
                    },
                    "reason": {
                      "description": "Why the model picked this category",
                      "type": "string"
                    },
                    "truncated": {
                      "default": false,
                      "description": "True on the last match when the per-request token budget stopped the descent: the path is valid but not necessarily a leaf",
                      "type": "boolean"
                    }
                  },
                  "required": ["category", "reason"],
                  "type": "object"
                },
                "type": "array"
              },
              "judge_approved": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Whether a separate LLM judge confirmed the final category path is consistent with the description; null when the token budget ran out before the judge could run"
              },
              "judge_reason": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The judge's stated reason for its verdict on the final path; null when the judge did not run or the final path was never judged"
              },
              "name": {
                "description": "Product name",
                "type": "string"
              }
            },
            "required": ["categories", "name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:37cd679fc0f7bccabfbb9130a973755fa83733b96cca30486088922b04bf2d40"
        },
        {
          "name": "list_stores",
          "description": "List the marketplaces whose taxonomies are loaded, as `store_id` values.\n\nThese are the only accepted values for the `store_id` argument of\n`categorize_product`. Free of charge on purpose: without it an agent would\nhave to pay for a failed call to discover them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["result"],
            "type": "object",
            "x-fastmcp-wrap-result": true
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:4568c8cb20124e655065146593554fd81a803ee43bd910af28b2bcf35ec438c8"
        },
        {
          "name": "payment_info",
          "description": "Return the x402 payment requirements for one categorization call.\n\nMeant for an agent that holds no API key: gives network, asset, recipient\naddress and amount as JSON, so the payment authorization can be signed\nbefore calling `categorize_product`. Free of charge.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "type": "string"
              }
            },
            "required": ["result"],
            "type": "object",
            "x-fastmcp-wrap-result": true
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:38ffbb76350c41f76473d59db82a46c8d1f136cec316a40f1ddf0b943be9b76d"
        }
      ],
      "resources": [
        {
          "uri": "mcb://pricing",
          "name": "pricing",
          "title": "What a call costs and how to pay for it",
          "description": "Price, payment network and per-request token budget.\n\nThe x402 price is flat: it covers the worst case at the token budget,\nso a call whose descent was truncated is billed the same as a complete\none.",
          "mimeType": "application/json",
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:b40ed7e2942f71d9519d426557509baa85dd5dd2b479c1e7c7217f9c63b6f7bb"
        },
        {
          "uri": "mcb://stores",
          "name": "supported_stores",
          "title": "Supported marketplaces",
          "description": "The marketplaces whose taxonomy is loaded, with their id and quirks.\n\n`uses_external_category_codes` tells whether the ids returned by\n`categorize_product` are the marketplace's own codes rather than\ninternal node ids.",
          "mimeType": "application/json",
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:985384928b4e1bf7b3459d9b594ddf0036b29fa9dcb6af6716d4ac07c75f5405"
        }
      ],
      "resourceTemplates": [
        {
          "uriTemplate": "mcb://stores/{store_id}/taxonomy-roots",
          "name": "taxonomy_roots",
          "title": "Top-level categories of a marketplace",
          "description": "The top-level categories of one marketplace taxonomy.\n\nUseful to check that a marketplace covers a product line before paying\nfor a categorization. Deeper levels are not exposed: they are what\n`categorize_product` navigates.",
          "mimeType": "application/json",
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:722ed57466fc5c518ec5e5ed3c9e04f958f8870f3de63ae5d50bc88cbde2ea42"
        }
      ],
      "prompts": [
