              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:16ec7140026476b24f4457860219840c9dc20bd86e24845c5ffcc661165a28b8"
        },
        {
          "name": "get_offer",
          "description": "Get 1001locals' operator offer and pricing: new operators get their first 100 bookings free, then a flat 5% commission forever — the cheapest tours marketplace.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
