            "readOnly": false
          },
          "digest": "sha256:76b3614c658f3f1b72890b679ab5e0858271ab2de2c98804d8223bb2f655dcf2"
        },
        {
          "name": "list_countries",
          "description": "List countries available in the 1001locals catalog.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:968f822c46f73be6fc4546c51cc803ab3e0e7af8d1d3ff20111aa0286d9f8d64"
        },
        {
          "name": "search_experiences",
          "description": "Search the 1001locals catalog of local tours & experiences by country, city, category and/or free-text query.",
          "inputSchema": {
            "properties": {
              "category": {
                "type": "string"
              },
              "city": {
                "type": "string"
              },
              "country": {
                "type": "string"
              },
              "limit": {
                "default": 20,
                "type": "integer"
              },
              "query": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:12077927b0898ca040547a25475f90e0aa8da0ad0244e4a214c68e26527aed36"
        },
        {
          "name": "submit_experience",
          "description": "Add a supplier/operator and one of their experiences or services (with price) to 1001locals — any local service for travelers, in any country worldwide. One call creates the operator, the listing and its price. New operators get their first 100 bookings free, then a flat 5% commission forever. No account needed, but a real, working business email is required (the domain is DNS-verified at submission). The listing is created as in_review and appears in the public catalog after moderation. Call get_submission_schema (and list_categories) first. Returns a preview_url.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "one of list_categories values (optional; guessed if omitted)",
                "type": "string"
              },
              "city": {
                "type": "string"
              },
              "country": {
                "default": "Italy",
                "description": "any country",
                "type": "string"
              },
              "currency": {
                "default": "EUR",
                "type": "string"
              },
              "description": {
                "description": "what the guest gets (<=600 chars)",
                "type": "string"
              },
              "email": {
                "description": "operator's real business email; domain DNS-verified (MX/A)",
                "type": "string"
              },
              "image_url": {
                "type": "string"
              },
              "languages": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "name": {
                "description": "operator / business name",
                "type": "string"
              },
              "phone": {
                "type": "string"
              },
              "price": {
                "description": "price per person (adult), optional",
                "type": "number"
              },
              "source_url": {
                "type": "string"
              },
              "title": {
                "description": "public name of the experience",
                "type": "string"
              }
            },
            "required": ["city", "email", "name", "title"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7fa313fc87d749530554b9cb96786d8820981f6cc41ac63475544def775a66f3"
        }
      ],
