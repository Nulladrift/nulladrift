        },
        {
          "name": "get_submission_schema",
          "description": "Describe how to add an operator/experience to 1001locals: required and optional fields, allowed categories, the free-100-then-5% offer, and the moderation flow. Call this before submit_experience.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
