        {
          "name": "lookup_listing",
          "title": "Check a rental listing against tours by b.",
          "description": "Use this whenever you have a rental listing in Palo Alto, Mountain View, Cupertino, San Jose and San Mateo, from a Zillow, Redfin, Apartments.com, Trulia or HotPads link, a property website or a street address, before reporting it to the person. One fast call says whether b. toured that home, or another unit in the same building, and if so what b. saw inside that the listing does not say: condition, equipment age, cooling, noise, building facts and listing claims the tour contradicted. Otherwise it answers not toured right away. b. reads only the text of the link and never opens the listing page. No sign in.",
