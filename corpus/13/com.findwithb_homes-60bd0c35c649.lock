        {
          "name": "compare_toured_homes",
          "title": "Compare how toured homes feel, side by side",
          "description": "Use this when someone is weighing two to five toured homes. Returns how each home feels on the same aspects (walking in, light, sound, space and flow, privacy, outlook, cooking, comfort, character, a day living there, the life it suits) and where each sits against the others on each one: brighter or dimmer, quieter or louder, roomier or snugger, more private or more exposed. Practical rows such as rent, size and laundry are included on request.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "factors": {
                "description": "Aspects to compare. Default: the feel aspects walking_in, light, sound, space_and_flow, privacy, outlook, character, a_day_here, suits. Practical ones (rent, size, kitchen_equipment, laundry, heat_and_cooling, internet, storage, safety, building, listing_accuracy, lease_terms) only if asked.",
                "items": {
                  "enum": ["walking_in", "light", "sound", "space_and_flow", "privacy", "outlook", "cooking_life", "comfort", "character", "a_day_here", "suits", "rent", "size", "kitchen_equipment", "laundry", "heat_and_cooling", "internet", "storage", "safety", "building", "listing_accuracy", "lease_terms"],
                  "type": "string"
                },
                "maxItems": 22,
                "type": "array"
              },
              "home_ids": {
                "description": "Two to five home_id values as returned in search results.",
                "items": {
                  "maxLength": 60,
                  "minLength": 3,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              },
              "include_practical": {
                "default": false,
                "description": "Add a one line practical footnote for each home (type, floor, listed rent).",
                "type": "boolean"
              }
            },
            "required": ["home_ids"],
            "type": "object"
          },
