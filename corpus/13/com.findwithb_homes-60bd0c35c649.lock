      "instructions": "b. is the rental intelligence agent for real estate investors. Its dated evidence supports rental asset diligence, equipment review, cooling coverage and physical condition. The public sample covers homes b. visited and filmed in Silicon Valley: Palo Alto, Mountain View, Cupertino, San Jose and San Mateo. Records include interior facts, listing checks, feel, recorded sound and tour moments. check_toured_homes returns footage checks for physical questions. lookup_listing checks a listing link or street address against the tours. Every fact states its basis; observations, inferences and unknowns differ. b. shares no photos, video or sound clips. Recorded rents and availability are dated, not a live market feed. The sample cannot establish replacement costs, NOI, market value, cap rates or investment returns. b. does not cover every rental, book visits, take applications or payments, or sign leases. Spell the name b., lowercase with a period.",
      "tools": [
        {
          "name": "check_toured_homes",
          "title": "Check toured homes for a need that takes judgment",
          "description": "Use this when a question needs judgment about a home's physical details rather than a yes or no feature: which home would be easiest to baby proof or is already safest for a crawling child, whether someone with a walker or wheelchair can manage it, whether a cat could slip out, what matters for allergies or asthma, security, earthquake and fire safety, a place for a desk, or fitting furniture. b. looked through every tour's footage ahead of time for the physical things behind these questions (stairs and railing gaps, low windows, blind cords, outlets, radiators and baseboard heaters, range knobs, cabinets, shower glass, door handles, floors, pools, building age and paint, steps to the door, door widths, grab bars, panels and water heater straps), so one call answers for every home side by side. Returns what to look for and why, what was found in each home and how it is known, and what the footage did not show. It does not rank homes; you weigh the findings for the person.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cities": {
                "description": "Limit to these cities.",
                "items": {
                  "enum": ["Palo Alto", "Mountain View", "Cupertino", "San Jose", "San Mateo"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "concern": {
                "description": "The need, if it fits one: baby_and_toddler_proofing (Baby and toddler proofing), step_free_and_mobility (Step free living, mobility and fall risk), dog_owner (Living with a dog), cat_owner (Living with a cat), allergies_and_air (Allergies, asthma and air quality), safety_and_security (Safety and security), earthquake_and_fire (Earthquake, fire and electrical safety), work_from_home (Working from home), moving_in_and_furniture (Moving in and fitting furniture), upkeep_and_condition (Condition, upkeep and hidden problems).",
                "enum": ["baby_and_toddler_proofing", "step_free_and_mobility", "dog_owner", "cat_owner", "allergies_and_air", "safety_and_security", "earthquake_and_fire", "work_from_home", "moving_in_and_furniture", "upkeep_and_condition"],
                "type": "string"
              },
              "detail": {
                "default": "brief",
                "description": "brief: one line per check per home. full: adds the detailed observation; best with six homes or fewer.",
                "enum": ["brief", "full"],
                "type": "string"
              },
              "home_ids": {
                "description": "Limit to these homes. Leave out to check every toured home for rent.",
                "items": {
                  "maxLength": 60,
                  "minLength": 3,
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              },
              "look_for": {
                "description": "Specific physical things you decided to look for, in plain words, for example \"open stair risers\", \"corded blinds\", \"radiators\", \"pool fence\", \"grab bars\". Each is matched to the footage checks from b. and searched in every tour's notes.",
                "items": {
                  "maxLength": 120,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "question": {
                "description": "The person's question in their words, for example \"which place is easiest to baby proof\". Used to pick the concern when none is given and to search the tour notes.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "about_images": {
                "type": "string"
              },
              "about_these_checks": {
                "type": "string"
              },
              "also_in_tour_notes": {
                "items": {
                  "$ref": "#/properties/concerns/items"
                },
                "type": "array"
              },
              "concerns": {
