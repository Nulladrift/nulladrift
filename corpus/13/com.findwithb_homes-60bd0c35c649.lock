          "description": "Use this when someone wants to know what one toured home is really like. By default returns how it feels to live in (walking in, light through the day, sound, space and flow, privacy, outlook, cooking, comfort, character, a day living there), where it sits against the other toured homes on each of those, its sound profile measured from the tour audio, the index of moments in the tour recording, and the renter brief. Other sections such as kitchen, laundry, heat_and_cooling, practical facts and listing_check are returned on request. Every fact says how it is known: seen on the tour, read on a label, from the listing, researched or inferred.",
