        {
          "name": "phone_temp_number",
          "title": "Lease disposable temp phone number",
          "description": "Lease a cheap, instant, receive-only US phone number from a pool to receive one SMS verification code — the phone analogue of a disposable temp email inbox. $0.20 for 30 min (ttl_seconds, clamped 300–1800), returned to the pool at expiry; call wait_for_otp to catch the code. Good for one-time SMS verification and phone-gated signups. Works with major sites like Google, X, and Discord; some (Telegram, WhatsApp, OpenAI) may reject it as a VoIP number — for strict sites, buy a dedicated number with phone_buy_number. Pool numbers are recycled after the lease, so use them for one-time codes only, not long-term 2FA. Costs 0.20 USDC, paid per-action via x402.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "payment": {
                "description": "base64 x402 payment payload (X-PAYMENT); omit on first call to receive payment instructions",
                "type": "string"
              },
              "ttl_seconds": {
                "description": "Lease lifetime in seconds before auto-expiry (default 1800 = 30min, min 300, max 1800)",
                "type": "number"
              }
            },
            "type": "object"
