      },
      "instructions": "Palmyr exposes real-world capabilities (email, phone, X/TikTok, domains, VPS, and the i402 intent resolver) that agents pay for per-action via x402 (USDC on Solana or Base). No account or API key. Call a paid tool once with no `payment` to receive x402 instructions, then sign and call again with `payment`.",
      "tools": [
        {
          "name": "card_buy",
          "title": "Buy prepaid Visa card",
          "description": "Buy a USA prepaid Visa card loaded with EXACTLY the requested balance ($5–$1000). Dynamic x402 price = amount + fee (3% min 0.50 USDC) — the 402 instructions carry the exact total. Returns 202 with an operation_id: poll card_status until ready (~10s), then fetch the number with card_get. US merchants only; non-reloadable (spend across transactions until depleted); max 6 cards per agent per rolling 24h (issuer limit).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "USD balance to load on the card (min $5, max $1000, whole cents)",
                "type": "number"
              },
              "payment": {
                "description": "base64 x402 payment payload (X-PAYMENT); omit on first call to receive payment instructions",
                "type": "string"
              }
            },
            "required": ["amount"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f5927010d56c098288b5b9119352c99b473baf621fa8e20887864f7ec506cf52"
        },
