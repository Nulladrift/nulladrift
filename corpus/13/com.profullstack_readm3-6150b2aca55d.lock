  "subjects": {
    "com.profullstack/readm3": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://readm3.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "readm3",
        "title": "readm3 document reader",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Call read_url with a link to get the document's text, then summarize or answer from it.",
      "tools": [
        {
          "name": "read_url",
          "title": "Read a document at a URL",
          "description": "Fetch a document by URL and return its text: PDFs (arXiv papers, reports), web pages, Word, Excel, PowerPoint, OpenDocument, EPUB, Markdown and other text. Use it to summarize, quote or answer questions about a link. Returns title, kind, page count, character count, whether the text was truncated, and the text. maxChars caps the text (default 100,000, up to 400,000). No account needed; a free hourly allowance, then an x402 reader pass.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "maxChars": {
                "maximum": 400000,
                "minimum": 1000,
                "type": "integer"
              },
              "url": {
                "description": "An http(s) URL on the public internet.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8c9722d4a15f22721ceac16b7c9632bafcf81a9e7bc4ea137574bdaca7b1ba48"
        }
      ],
