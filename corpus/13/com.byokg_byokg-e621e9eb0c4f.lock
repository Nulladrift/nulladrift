                              "id_case": {
                                "description": "Added in contract revision 4.8.1. On a DUPLICATE_NAME finding, what the stored external ids of every node of the group say, in this order of precedence: SAME_EXTERNAL_ID (several nodes hold one external id: one source term stored twice), MISSING_EXTERNAL_ID (a node holds none: a managed-memory entity) or DISTINCT_EXTERNAL_IDS (all differ: the data cannot tell a deliberate homonym from a source error).",
                                "enum": ["SAME_EXTERNAL_ID", "MISSING_EXTERNAL_ID", "DISTINCT_EXTERNAL_IDS"],
                                "type": "string"
                              },
                              "loop_case": {
                                "description": "Added in contract revision 4.8.1. On a SELF_LOOP finding, what the edge's stored record says of its ends: SOURCE_STATED (it names one id at both ends: the source states the loop, and it is kept), ENDS_RESOLVED_TO_ONE_NODE (it names two ids the import resolved to one node: an import fault) or NOT_RECORDED (a managed edge: no record names its ends).",
                                "enum": ["ENDS_RESOLVED_TO_ONE_NODE", "NOT_RECORDED", "SOURCE_STATED"],
                                "type": "string"
                              },
                              "node_id_list": {
                                "description": "Added in contract revision 4.9.0. On a DUPLICATE_NAME finding, the ids of every node of the group, the finding's own id first, up to 50 (nodes holds the exact count; node_ids_truncated says when the list was cut). Absent from a report stored before 4.9.0 until the room's next check.",
                                "items": {
                                  "maxLength": 256,
                                  "minLength": 1,
                                  "type": "string"
                                },
                                "maxItems": 50,
                                "type": "array"
                              },
                              "node_ids": {
                                "deprecated": true,
                                "description": "On a DUPLICATE_NAME finding, at most five of the other nodes of the group as one comma-separated string, with an ellipsis when there are more. Deprecated since contract revision 4.9.0: read node_id_list instead (every id of the group, the finding's own first, flagged when cut); kept for a transition.",
                                "maxLength": 1024,
                                "type": "string"
                              },
                              "node_ids_truncated": {
                                "description": "Added in contract revision 4.9.0. True when node_id_list holds fewer ids than nodes counts.",
                                "type": "boolean"
                              }
                            },
                            "type": "object"
                          },
                          "id": {
                            "maxLength": 256,
                            "minLength": 1,
                            "type": "string"
                          },
                          "kind": {
                            "enum": ["NODE", "EDGE", "RELATION_TYPE", "SOURCE", "CURATED", "ROOM"],
                            "type": "string"
                          },
                          "label": {
                            "maxLength": 256,
                            "minLength": 1,
                            "type": "string"
                          }
                        },
                        "required": ["detail", "id", "kind", "label"],
                        "type": "object"
                      },
                      "maxItems": 20,
                      "type": "array"
                    },
