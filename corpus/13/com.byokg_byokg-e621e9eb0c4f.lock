                                "description": "Added in contract revision 4.9.0. On a DUPLICATE_EDGE finding, the ids of every stored copy of the edge, the finding's own id first, up to 50 (edges holds the exact count; edge_ids_truncated says when the list was cut).",
                                "items": {
                                  "maxLength": 256,
                                  "minLength": 1,
                                  "type": "string"
