        {
          "name": "get_node",
          "title": "Read a node",
          "description": "Resolve one node by its id or an exact name, without a search, when the user names a thing the room holds (a verse by reference, a root by its letters, a term by its id). Input: ref (required: the external id as the bundle states it, one of its alt_ids, its IRI, an exact name, or a node_id) and namespace_id. Returns the node, its properties and external_id, and resolved_by, which says how the ref matched; explore returns it with its relations. Several nodes named so are NODE_REF_AMBIGUOUS with candidates, never a guess: pass the external id or a node_id. None is GRAPH_NODE_NOT_FOUND. Imported graph nodes; deterministic, no model call, nothing stored. The ref is the node's external id as the bundle states it (ayah:24:35 and r68 in the Quran graph, GO:0008150 in an ontology, a page's address in a vault), resolved by its digest in one lookup, else its node_id as search, neighbors and paths hand it out, else a name a property of exactly one node states (n-w-r, نور, part of, or the node's own name) while its name holds every word of it, the value typed as given before one equal only once folded; resolved_by says which. That is the only rank: the node's own name and another node's property rank alike, so a value one node states as its name and another in a property (n-s-y as a root's name and as another root's romanized_ascii) is NODE_REF_AMBIGUOUS with both as candidates, never a guess. Several nodes named so give the count: search for the name and pass a hit's node_id. Example: {\"ref\": \"GO:0008150\", \"namespace_id\": \"obo-go\"}. Added in contract revision 4.6.0. Since contract revision 4.7.0 ref also resolves one of a node's alt_ids (resolved_by ALT_ID), and an ambiguous name lists its candidates in the error. Since contract revision 4.9.0 ref also resolves the IRI a record states beside its id (resolved_by IRI): a converter that shortens an IRI to a CURIE keeps the IRI as the iri property, so both forms name the node. Since contract revision 4.9.2 the description states the rank between a name and another property (unchanged behaviour). The contract revision in force is the one every response repeats in _meta.contract_revision and server_info reports; a revision note (Added in, Since) says when a field or a tool appeared, never which revision is current.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "namespace_id": {
                "description": "Room name; omitted: the default room.",
                "maxLength": 128,
                "minLength": 1,
