                                "maxItems": 50,
                                "type": "array"
                              },
                              "edge_ids": {
                                "deprecated": true,
                                "description": "On a DUPLICATE_EDGE finding, at most five of the other edges as one comma-separated string. Deprecated since contract revision 4.9.0: read edge_id_list instead; kept for a transition.",
                                "maxLength": 1024,
                                "type": "string"
                              },
                              "edge_ids_truncated": {
                                "description": "Added in contract revision 4.9.0. True when edge_id_list holds fewer ids than edges counts.",
                                "type": "boolean"
