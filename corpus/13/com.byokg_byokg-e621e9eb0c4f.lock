        {
          "name": "explore",
          "title": "Explore a node",
          "description": "Explore one node in a single call, when the user asks about a thing the room holds: the node by its reference, its relations per type and direction with counts, weight sums and the limit strongest partners, and its place in a sequence. Input: ref (required, as get_node takes it: external id, alt id, IRI, exact name or node_id), namespace_id, limit, relation_types and sequence_relation. Replaces search, get_node_stats and query_graph_neighbors for the first look at a node; paths stay with query_graph_paths. sequence comes from sequence_relation or the relations the room card declares, and is null when there is none: nothing is guessed. The bounds of get_node_stats; deterministic, no model call, nothing stored. sequence_relation names a relation type that orders nodes (NEXT_AYAH gives a verse's previous and next); without it the relations the room card declares in sequence_relations are used, and sequence is null when neither names one the node has an edge of. The reference resolves as in get_node. Several nodes on one side give the sibling and every candidate. sequence_direction: forward (the default, unless the room card declares the relation inverse) reads an edge from the earlier node to the later one; inverse reads a preceded-by relation, whose OUT edge is the node before. limit is the name every tool uses for the size of its answer (top_n is its deprecated alias; passing both is SCHEMA_VALIDATION_FAILED). Example: {\"ref\": \"GO:0008150\", \"namespace_id\": \"obo-go\"}. Added in contract revision 4.6.0. Since contract revision 4.7.0 nothing is guessed: sequence comes from sequence_relation or the card's sequence_relations, sequence_direction reads a preceded-by relation (inverse), candidates lists every node of a side with several, and ref resolves an alt id (resolved_by ALT_ID). Since contract revision 4.9.0 ref also resolves a record's iri property (resolved_by IRI), and limit is the name of top_n (kept as a deprecated alias). The contract revision in force is the one every response repeats in _meta.contract_revision and server_info reports; a revision note (Added in, Since) says when a field or a tool appeared, never which revision is current.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "Strongest partners per relation type and direction.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "namespace_id": {
                "description": "Room name; omitted: the default room.",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "ref": {
                "description": "External id, alt id, IRI, exact name or node_id.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "relation_types": {
                "description": "Count only relations of these types.",
                "items": {
                  "maxLength": 128,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "sequence_direction": {
                "description": "forward: edges run from the earlier node. inverse: a preceded-by relation.",
                "enum": ["forward", "inverse"],
                "type": "string"
              },
              "sequence_relation": {
                "description": "Relation type whose edges order nodes; omitted: what the room card declares.",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "top_n": {
                "default": 5,
                "deprecated": true,
                "description": "Deprecated since contract revision 4.9.0: pass limit instead (one name for every answer's size); still accepted.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["ref"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "description": "Added in contract revision 4.6.0. One node with its relations summarized and its place in a sequence.",
            "properties": {
              "external_id": {
                "description": "The id the bundle states for the node; null when the record states none.",
                "maxLength": 512,
                "type": ["string", "null"]
              },
              "generation": {
                "maxLength": 128,
                "type": ["string", "null"]
              },
              "namespace_id": {
                "maxLength": 128,
                "minLength": 1,
