                      "description": "How many findings the sample pages can reach in all, not the length of this page: equal to count when every finding is pageable, 1000 for a stored graph check whose report kept its first 1000 findings (the count stays exact beyond them), and count for a check computed at read time. Documented since contract revision 4.9.0; the value is unchanged.",
                      "minimum": 0,
