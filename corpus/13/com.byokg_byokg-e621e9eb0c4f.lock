        {
          "name": "find_rooms",
          "title": "Find rooms",
          "description": "Find rooms by what they are about, when the user names a topic or asks which rooms exist; pass the chosen namespace_id to the other tools. Input: no required field; context ranks the rooms, limit and cursor page them. Returns rooms ranked for the given conversation context by deterministic word overlap with each room's title, name and description, each naming its visibility; score is overlap, not confidence, and an empty context lists every room by title. With the MCP token the user's own rooms, private and public, and every public room; without it the public rooms only. Show the ranked titles and let the user confirm. No model call sees the context and nothing is stored. When truncated, pass next_cursor as cursor (same context) for the next page. Use it when the user asks for a room or mentions a topic a room may cover; the chosen namespace_id goes to search, fetch, query_graph_neighbors, query_graph_paths or get_node_stats. context is what the user is working on or asking about, in their words; it is used only to rank rooms by their words. Example: {\"context\": \"gene ontology biological process\"}. (Named find_shared_rooms until contract 4.0.0.) Since contract revision 5.2.0 each room carries the owner's collection, contents and tags, and its tags, collection and contents are ranked with its title; rooms that score alike come by the owner's priority, ascending. The contract revision in force is the one every response repeats in _meta.contract_revision and server_info reports; a revision note (Added in, Since) says when a field or a tool appeared, never which revision is current.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "context": {
                "description": "What the user is asking about, in their words; used only for ranking.",
                "maxLength": 4096,
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor of the previous page of the same request.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
