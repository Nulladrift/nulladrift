                                "description": "Added in contract revision 4.4.0. What the evidence carries, computed by the server at read time from the stored items, their checks and the as_of day; never accepted from a client and never truth. An item counts when it is not SYNTHETIC, not past its refresh_due and its quote_check is neither NOT_FOUND nor TARGET_MISSING. CONTESTED: a counting CONTRADICTS item exists (both sides are returned). ACCEPTED: counting SUPPORTS items in at least one independent group (two when risk is HIGH). PROVISIONAL: SUPPORTS items exist but too few count (only synthetic or stale ones, or one group for HIGH risk). UNSUPPORTED: no SUPPORTS item counts. Cite ACCEPTED as supported by its cited evidence, label PROVISIONAL tentative, give both sides of CONTESTED, and call UNSUPPORTED unsupported.",
