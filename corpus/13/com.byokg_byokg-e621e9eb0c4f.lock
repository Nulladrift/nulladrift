                  "properties": {
                    "evaluated": {
                      "type": "boolean"
                    },
                    "parent": {
                      "additionalProperties": false,
                      "description": "Added in contract revision 4.8.0. A node a gap candidate names: its node_id, external id and name.",
                      "properties": {
                        "external_id": {
                          "maxLength": 512,
                          "type": ["string", "null"]
                        },
                        "id": {
                          "maxLength": 256,
