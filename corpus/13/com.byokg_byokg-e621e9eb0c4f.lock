        {
          "name": "get_room_changes",
          "title": "Room changes",
          "description": "List what changed in a room since a cursor you kept, when a conversation returns to a room. Input: namespace_id (optional), since (a cursor you kept), cursor and limit. Returns the room's change feed, newest first, one event per import cutover, managed write, curated version, room-card change, visibility change and copy, each with its kind, the audited object's id, its time, content-free facts (counts, ids, enum values; never a text) and a cursor. Keep changes_cursor from get_room_overview (or newest_cursor from a feed) in your own memory and pass it as since next time to read only the events after it; the cursor outlives imports. Pass next_cursor as cursor to page towards older events. A public room lists only the events since it was published and never where a copy came from. Deterministic, no model call, nothing stored. Example: {\"namespace_id\": \"obo-go\", \"since\": \"<changes_cursor>\"}. Added in contract revision 4.4.0. The contract revision in force is the one every response repeats in _meta.contract_revision and server_info reports; a revision note (Added in, Since) says when a field or a tool appeared, never which revision is current.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "next_cursor of the previous page, towards older events.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "Events per page, newest first.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "namespace_id": {
                "description": "Room name; omitted: the default room.",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "since": {
                "description": "A cursor kept from an earlier read: only later events are listed.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "description": "Added in contract revision 4.4.0. The events of a room, newest first; with since only the events after that cursor. newest_cursor names the newest event the caller may see (the room card's changes_cursor), null for a room without any.",
            "properties": {
              "events": {
                "items": {
                  "additionalProperties": false,
                  "description": "Added in contract revision 4.4.0. One change of a room.",
                  "properties": {
                    "at": {
                      "format": "date-time",
                      "type": "string"
                    },
                    "cursor": {
                      "description": "This event's position; pass it as since to read what came after it.",
                      "maxLength": 2048,
                      "minLength": 1,
                      "type": "string"
                    },
                    "facts": {
                      "description": "Null for an event recorded before 4.4.0.",
                      "oneOf": [
                        {
                          "additionalProperties": {
                            "anyOf": [
                              {
                                "type": "integer"
                              },
                              {
                                "type": "boolean"
                              },
                              {
                                "type": "null"
                              },
                              {
                                "maxLength": 128,
                                "minLength": 1,
                                "pattern": "^[A-Za-z0-9._:-]{1,128}$",
                                "type": "string"
                              },
                              {
                                "additionalProperties": {
                                  "minimum": 0,
                                  "type": "integer"
                                },
                                "maxProperties": 16,
                                "type": "object"
                              }
                            ]
                          },
                          "description": "Added in contract revision 4.4.0. Content-free facts of an event; a string value is an id, a generation or an enum value, never a text; a nested object holds counts (the grounding counts of a write).",
                          "maxProperties": 16,
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "kind": {
                      "description": "Added in contract revision 4.4.0. What an event records: an import that cut over to a new generation (facts: generation, node_count, edge_count), a managed write that completed (episodes, entities, relations, the grounding counts, largest_episode_bytes, origin), a curated relation written, revised or retired (relation_id, version, assessment at write, risk), a room-card field changed (field: title, description or usage_notes), a visibility change (visibility), or the completed copy this room started from (source_namespace_id, source_generation, node_count, edge_count, evidence_count; owners only).",
                      "enum": ["IMPORT_CUTOVER", "MEMORY_WRITE", "CURATED_CREATED", "CURATED_REVISED", "CURATED_RETIRED", "CARD_CHANGED", "VISIBILITY_CHANGED", "CLONED_FROM"],
                      "type": "string"
                    },
                    "object_id": {
                      "description": "The audited object (a job id, a curated relation_id, a draft id); null for a room-level change.",
                      "maxLength": 256,
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["at", "cursor", "facts", "kind", "object_id"],
                  "type": "object"
                },
                "maxItems": 200,
                "type": "array"
              },
              "namespace_id": {
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "newest_cursor": {
                "maxLength": 2048,
