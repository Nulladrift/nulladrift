        {
          "name": "export_reasoning_chain",
          "title": "Export a reasoning chain",
          "description": "Turn a path of stored edges the user picked into a research-plan scaffold, when the user wants to write up or test a chain of relations. Input: steps (required: edge ids from query_graph_paths or find_shortest_paths, or triples of from_ref, relation_type and to_ref with every ref as get_node takes it), question, hypothesis, format and namespace_id. Returns seven sections: the question, the evidence chain, the hypothesis marked HYPOTHESIS, gap candidates, empty slots for experiments and risks, the cited sources and what reproduces it. Each step continues where the one before ends, and nothing is filled in: a step that names no stored edge is CHAIN_STEP_NOT_STORED, a triple matching several edges CHAIN_STEP_AMBIGUOUS with the edges as candidates, a broken chain CHAIN_NOT_CONNECTED. One room per chain. Deterministic, read-only, no model call, nothing stored. A step may walk its edge against the stored direction (direction reverse); a triple must match exactly one stored edge, stored either way, and an edge id is the id query_graph_paths or find_shortest_paths gives, or the bundle's edge id. The answer's seven sections: the user's question, the evidence chain (relation types as stored), the user's hypothesis marked HYPOTHESIS and never among the evidence, find_gaps candidates at the chain's nodes (candidates, not facts), empty slots for experiments and risks, the cited sources with release and licence from the room's stored source metadata (NOT_STATED otherwise), and what reproduces it. format markdown adds it as one text with the user's text escaped; json gives the sections only. question and hypothesis are the user's own, plain text, escaped in markdown. Several rooms are not supported. Without the MCP token it reads the public rooms. Example: {\"steps\": [{\"from_ref\": \"GO:0005739\", \"relation_type\": \"IS_A\", \"to_ref\": \"GO:0043231\"}], \"namespace_id\": \"obo-go\"}. Added in contract revision 4.8.0. The contract revision in force is the one every response repeats in _meta.contract_revision and server_info reports; a revision note (Added in, Since) says when a field or a tool appeared, never which revision is current.",
