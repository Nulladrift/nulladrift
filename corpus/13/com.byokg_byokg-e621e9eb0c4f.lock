          "description": "Read a room's card before using it for the first time in a conversation: its usage notes, data modes, counts and your access. Input: namespace_id (optional: the default room when omitted). Returns its title and the owner-written usage_notes (follow them for this room), data_modes and recommended_data_mode, whether MANAGED_MEMORY search is available right now (managed_search_available, with the reason in managed_search_blocked_by), exact node and edge counts, the most frequent relation types, evidence_count, last_activity_at, your access level (OWNER, GRANTED or PUBLIC) and whether the room is writable. known_limitations counts and lists the nodes without any edge. changes_cursor names the newest change event: keep it and ask get_room_changes with since next time. Deterministic, no model call, nothing stored. Omit namespace_id for the default room: the account's default room (or its only room) with the MCP token, the deployment's only public room without it (contract 4.6.0); NAMESPACE_SELECTOR_REQUIRED when several rooms could be meant. MANAGED_MEMORY is searched by meaning. The nodes known_limitations lists are such as lemmas whose root is null. Example: {\"namespace_id\": \"obo-go\"}. Since contract revision 4.8.1 known_limitations also counts, from the stored health check, the duplicate-name groups whose external ids differ or are missing (duplicate_names). It also counts the self-loops the source states (self_loops), kept as stated. Since contract revision 5.1.0 dataset names the imported graph's dataset, its revision and its license. Since contract revision 5.2.0 collection, contents, tags and priority are the owner's. The contract revision in force is the one every response repeats in _meta.contract_revision and server_info reports; a revision note (Added in, Since) says when a field or a tool appeared, never which revision is current.",
