                          "type": "string"
                        },
                        "label": {
                          "maxLength": 256,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["detail", "id", "kind", "label"],
                      "type": "object"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  "message": {
                    "maxLength": 1024,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["items", "message"],
                "type": "object"
              },
              "checks": {
                "items": {
                  "additionalProperties": false,
                  "description": "Added in contract revision 4.4.0. One check of the report: its exact count, one page of its sample (at most 20 findings; next_cursor with check_id pages on while truncated), sampled (how many findings the pages reach: the count, or 1000 for a stored check with more), a breakdown (per reason, label, relation type or assessment) and a constant message.",
                  "properties": {
                    "breakdown": {
                      "items": {
