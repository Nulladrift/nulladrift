                "items": {
                  "maxLength": 128,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "external_id": {
                "maxLength": 512,
                "type": ["string", "null"]
              },
              "generation": {
                "maxLength": 128,
                "type": ["string", "null"]
              },
              "groups": {
                "items": {
                  "additionalProperties": false,
