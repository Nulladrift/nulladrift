        {
          "name": "query_graph_neighbors",
          "title": "Neighbors of a node",
          "description": "List the stored relations around one node, one page at a time, when you need the edges themselves (get_node_stats first when the node has many). Input: node_id (required: this room's opaque node id from search, get_node, explore or paths, never an external id) and namespace_id; limit pages. Returns each edge with its relation type, stored direction, weight (the bundle's strength, such as the shared-ayah count on CO_OCCURS) and properties, and the node it reaches; total counts every match. Filter by relation_types, labels of the far node and direction; sort_by weight (the default), degree or id. Pass next_cursor as cursor to page until it is null. Deterministic for one generation, no model call. A node without any edge returns warning ISOLATED_NODE with the reason its record gives (LEMMA_WITHOUT_ROOT), so an empty page is never silent. No answer synthesis. node_id is the node_id of a search or fetch result, or an id from overview, neighbors or paths, never an internal key. depth walks 1 or 2 hops. sort_by: weight lists the heaviest first (unweighted last), degree the best-connected far nodes first, id by far node id; ties by edge id, and hop 1 before hop 2; the same request on the same generation returns the same pages. direction is seen from the near node; an undirected edge has no direction and matches OUT and IN. labels are a bundle node's own labels, such as Root, Lemma, Ayah or Surah; relation_types for example CO_OCCURS or OCCURS_IN. Example: {\"node_id\": \"<node_id>\", \"namespace_id\": \"obo-go\", \"limit\": 20}. Since contract 4.3.0 curated relations (typed, versioned, evidence-backed edges kept over the imported graph, made with curate_relation) appear among the edges with layer CURATED and their curation: author, version, status and evidence. The contract revision in force is the one every response repeats in _meta.contract_revision and server_info reports; a revision note (Added in, Since) says when a field or a tool appeared, never which revision is current.",
