        {
          "name": "find_gaps",
          "title": "Find possible gaps",
          "description": "List patterns in the stored data where an edge might be missing at one node, when the user asks what a term may lack or how complete a neighborhood is. Input: ref (required, as get_node takes it: external id, alt id, IRI, exact name or node_id), namespace_id, relation_types and limit. Returns candidates of two rules over the node's outgoing edges: SIBLING_PATTERN (most siblings under one IS_A parent satisfy a relation to a target the node does not) and TWO_HOP_ONLY (the node reaches a target through several intermediate nodes and no stored edge joins them). A candidate is a pattern, not a fact: report it as such, with the notice the answer carries, and never as a missing truth. Deterministic, read-only, no model call, nothing stored; at most 20000 edges a call, truncated beyond. SIBLING_PATTERN needs at least min_share of a group of min_group siblings; TWO_HOP_ONLY needs at least min_support distinct intermediate nodes along one two-step path, neither step transitive. The defaults are global, the same for every room. Satisfied patterns (an edge to the target or to an IS_A descendant, a chain of a transitive relation, an edge an IS_A ancestor holds, a declared inverse) are never candidates, nor are obsolete nodes, the structural types and the card's sequence relations. relation_types limits the candidate relations (SIBLING_PATTERN: the relation; TWO_HOP_ONLY: both steps); satisfaction always reads every relation. The relations the room card declares derived from the data (derived_relations on get_room_overview, a co-occurrence count with its basis) are no step of TWO_HOP_ONLY unless relation_types names them, because almost every pair of nodes is two such edges apart; the answer lists them in derived_relation_types. The ref resolves as in get_node (alt ids, NODE_REF_AMBIGUOUS with its candidates). limit counts the candidates returned, in order; candidates_total counts them all, and limit is the name every tool uses for the size of its answer (top_n is its deprecated alias; passing both is SCHEMA_VALIDATION_FAILED). Without the MCP token it reads the public rooms. Example: {\"ref\": \"CL:0000094\", \"namespace_id\": \"obo-cl\"}. Added in contract revision 4.8.0. Since contract revision 4.9.0 limit is the name of top_n (kept as a deprecated alias). Since contract revision 4.9.2 the card's derived relations are skipped by TWO_HOP_ONLY unless named in relation_types, and derived_relation_types lists them. The contract revision in force is the one every response repeats in _meta.contract_revision and server_info reports; a revision note (Added in, Since) says when a field or a tool appeared, never which revision is current.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "description": "Candidates to return, in order.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "min_group": {
                "default": 5,
                "description": "SIBLING_PATTERN: fewest siblings that make a group.",
                "maximum": 1000,
                "minimum": 2,
                "type": "integer"
              },
              "min_share": {
                "default": 0.8,
                "description": "SIBLING_PATTERN: share of siblings that must satisfy the relation.",
                "maximum": 1,
                "minimum": 0.5,
                "type": "number"
              },
              "min_support": {
                "default": 3,
                "description": "TWO_HOP_ONLY: fewest distinct intermediate nodes.",
                "maximum": 1000,
                "minimum": 2,
                "type": "integer"
              },
              "namespace_id": {
                "description": "Room name; omitted: the default room.",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "ref": {
                "description": "External id, alt id, IRI, exact name or node_id.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "relation_types": {
                "description": "Only these candidate relations.",
                "items": {
                  "maxLength": 128,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "top_n": {
                "default": 10,
                "deprecated": true,
                "description": "Deprecated since contract revision 4.9.0: pass limit instead (one name for every answer's size); still accepted.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["ref"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "description": "Added in contract revision 4.8.0. The gap candidates at one node, ordered by support (share or intermediate nodes) descending, then by rule, relation type and target external id: the same input gives the same output.",
            "properties": {
              "candidates": {
                "items": {
                  "additionalProperties": false,
                  "description": "Added in contract revision 4.8.0. One pattern where an edge might be missing: never a fact, never written as an edge.",
                  "properties": {
                    "parent": {
                      "additionalProperties": false,
                      "description": "Added in contract revision 4.8.0. A node a gap candidate names: its node_id, external id and name.",
                      "properties": {
                        "external_id": {
                          "maxLength": 512,
                          "type": ["string", "null"]
                        },
                        "id": {
                          "maxLength": 256,
                          "minLength": 1,
                          "type": "string"
                        },
                        "label": {
                          "maxLength": 256,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["external_id", "id", "label"],
                      "type": "object"
                    },
                    "relation_type": {
                      "description": "SIBLING_PATTERN: the relation the siblings satisfy and the node does not.",
                      "maxLength": 128,
                      "minLength": 1,
