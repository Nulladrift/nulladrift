                      },
                      "maxItems": 50,
                      "type": "array"
                    },
                    "by_case": {
                      "description": "Added in contract revision 4.8.1. On a check that sorts its findings into cases, every case with its count, zeros included: DUPLICATE_NAME by id_case, SELF_LOOP by loop_case. Absent on the other checks and on a report stored before 4.8.1.",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "count": {
                            "minimum": 0,
                            "type": "integer"
                          },
                          "key": {
                            "maxLength": 64,
                            "minLength": 1,
                            "type": "string"
                          }
                        },
                        "required": ["count", "key"],
                        "type": "object"
                      },
                      "maxItems": 10,
                      "type": "array"
                    },
                    "check_id": {
                      "description": "Added in contract revision 4.4.0. The checks of a room health report. Stored by the CHECK_ROOM job for one generation and revision: ISOLATED_NODE (nodes without any edge, by the reason their record states), STATED_COUNT_MISMATCH (a stated <label>_count differs from the stored edges to nodes of that label; occurrences and word_count count no edge and are never compared), DUPLICATE_NAME (nodes of one label whose names fold to the same text; never merged), DUPLICATE_EDGE (one source, target and type stored more than once), SELF_LOOP, RELATION_TYPE_VARIANT (types equal after case and separator folding, across the stored graph and the curated layer), EDGE_WITHOUT_SOURCE (no source_refs or no episode, by type), SOURCE_UNCITED (bundle sources no node or edge cites). Computed at read time: CURATED_TARGET_MISSING (an end or an evidence target not in this generation), CURATED_QUOTE_NOT_FOUND (quote_check NOT_FOUND), CURATED_ASSESSMENT (the active relations not ACCEPTED for as_of; the breakdown counts every assessment), MEMORY_UNGROUNDED (managed relations written UNGROUNDED), ROOM_CARD_INCOMPLETE (no description or no usage_notes; WARN for a public room).",
                      "enum": ["ISOLATED_NODE", "STATED_COUNT_MISMATCH", "DUPLICATE_NAME", "OBSOLETE_WITHOUT_SUCCESSOR", "DUPLICATE_EDGE", "SELF_LOOP", "RELATION_TYPE_VARIANT", "EDGE_WITHOUT_SOURCE", "SOURCE_UNCITED", "CURATED_TARGET_MISSING", "CURATED_QUOTE_NOT_FOUND", "CURATED_ASSESSMENT", "MEMORY_UNGROUNDED", "ROOM_CARD_INCOMPLETE"],
                      "type": "string"
                    },
                    "count": {
                      "minimum": 0,
                      "type": "integer"
                    },
                    "message": {
                      "maxLength": 1024,
                      "minLength": 1,
                      "type": "string"
                    },
                    "next_cursor": {
                      "maxLength": 2048,
                      "type": ["string", "null"]
                    },
                    "sample": {
                      "items": {
                        "additionalProperties": false,
                        "description": "Added in contract revision 4.4.0. One finding of a check: the id a reader can pass on (a node id for the graph tools, an edge id, a curated relation_id, a bundle source id, a folded relation type, or the room's name), its kind, a short label and content-free detail (ids, counts, property names; a node's stated counts; never a text).",
                        "properties": {
                          "detail": {
                            "additionalProperties": {
                              "maxLength": 1024,
                              "type": ["string", "integer", "number", "boolean", "null"]
                            },
                            "maxProperties": 24,
