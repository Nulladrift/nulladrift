        {
          "name": "find_shortest_paths",
          "title": "Shortest paths between two nodes",
          "description": "Find every shortest path between two nodes when the user asks how two things are connected. Input: both ends, each as a node_id (source_node_id, target_node_id) or as a reference as get_node takes it (source_ref, target_ref); namespace_id, max_hops, limit. Returns hops, the length found, and paths, every shortest path up to limit ordered by edge ids (paths_found counts them all). Each step is an EXISTING edge with its stable id, stored orientation, relation type and evidence references (fetch accepts the ids). An indirect A->B->C path is not an asserted A->C relation; label any such hypothesis NOT_CONFIRMED and cite the observed path. complete false with truncation_reasons means a budget ended the search, never that no connection exists; hops null with complete true means the data holds no path. No model is called and nothing is written. The search runs from both ends by hops (the source side walks direction, the target side its reverse) within budgets of nodes, edge records and time and stops at the first depth the two sides meet, so a connection four or five hops away costs a few hundred nodes rather than a quarter of the room. An indirect path is graph evidence, never an asserted relation between its ends. truncation_reasons names a budget that ended the search (NODE_BUDGET, EDGE_WORK, DEADLINE, MAX_HOPS when the two sides do not meet within max_hops) or cut the answer (MAX_PATHS, when the list was cut; PATHS_SCAN). Warnings say when an end has no edges the way it is walked (ISOLATED_NODE, NO_OUTGOING_EDGES, NO_INCOMING_EDGES). For a curated relation a step carries its curation. relation_types restricts every hop. direction takes the values of query_graph_paths; each relationship reports its stored orientation whichever way it was walked. data_mode: one kind of data per request; AUTO resolves the room's single data mode and fails with DATA_MODE_SELECTOR_REQUIRED when ambiguous. For the paths that lead from one node, use query_graph_paths. One of the two forms is required at each end, not both; the two ends are different nodes (INVALID_PATH_SELECTION otherwise). A reference resolves as get_node resolves ref (its external id as the bundle states it, such as GO:0008150, one of its alt_ids, its IRI, a name a property of exactly one node states, or a node_id), with NODE_REF_AMBIGUOUS and its candidates when several nodes match and GRAPH_NODE_NOT_FOUND when none does; the response's source_node_id and target_node_id are the nodes it resolved to. A node_id from another room is GRAPH_NODE_NOT_FOUND with a message saying so: a node_id belongs to one room, as search, get_node, neighbors or paths hand it out, never an internal key. limit is the name every tool uses for the size of its answer (max_paths is its deprecated alias; passing both is SCHEMA_VALIDATION_FAILED). Example: {\"source_ref\": \"GO:0005739\", \"target_ref\": \"GO:0005737\", \"namespace_id\": \"obo-go\"}. Added in contract revision 4.6.0. Since contract revision 4.9.0 either end may be given by reference (source_ref, target_ref), and limit is the name of max_paths (which stays as a deprecated alias). The contract revision in force is the one every response repeats in _meta.contract_revision and server_info reports; a revision note (Added in, Since) says when a field or a tool appeared, never which revision is current.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "data_mode": {
                "default": "AUTO",
                "description": "Edge model to read; AUTO resolves the room's single mode.",
                "enum": ["AUTO", "IMPORTED_GRAPH", "MANAGED_MEMORY"],
                "type": "string"
              },
              "direction": {
                "default": "OUTGOING",
                "description": "How a directed edge is walked from the source.",
                "enum": ["OUTGOING", "INCOMING", "BOTH"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Shortest paths returned.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_hops": {
                "default": 4,
                "description": "Longest path searched.",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "max_paths": {
                "default": 10,
                "deprecated": true,
                "description": "Deprecated since contract revision 4.9.0: pass limit instead (one name for every answer's size); still accepted.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "namespace_id": {
                "description": "Room name; omitted: the default room.",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "relation_types": {
                "description": "Only these relation types, at every hop.",
                "items": {
                  "maxLength": 128,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "source_node_id": {
                "description": "Start node's node_id, or pass source_ref.",
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              },
              "source_ref": {
                "description": "Start node by reference, as get_node's ref.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "target_node_id": {
                "description": "End node's node_id, or pass target_ref.",
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              },
              "target_ref": {
                "description": "End node by reference, as get_node's ref.",
                "maxLength": 512,
                "minLength": 1,
