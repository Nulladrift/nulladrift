        {
          "name": "fetch",
          "title": "Read evidence",
          "description": "Read one piece of evidence in full by its id (a search hit's id, or a node_id) when you need the text behind a hit: the stored text and its provenance, never a generated answer or a provider credential. Input: id (required: a search hit's id, an evidence id, a node_id, or the next_id of the page before) and offset for a later page. Returns at most 30000 characters from offset (default 0) in text and the whole length in text_total_chars. A long text is paged, never cut silently: when text_truncated is true the evidence continues at next_offset (pass it as offset with the same id) or under next_id (pass it as id, nothing else). Read every page before treating the evidence as complete, and never quote beyond the page you read. Browser URL requires independent BYOKG session reauthorization. Evidence of an imported graph node carries node_id, the start for query_graph_neighbors and query_graph_paths; id also accepts a node_id. An episode can be as large as the upload that carried it and a note up to 262144 characters. offset is not used with a next_id, which already carries its offset; beyond the text it is SOURCE_OFFSET_OUT_OF_RANGE (422). Example: {\"id\": \"<hit id>\"}. Since contract revision 4.4.0 a long text is paged. The contract revision in force is the one every response repeats in _meta.contract_revision and server_info reports; a revision note (Added in, Since) says when a field or a tool appeared, never which revision is current.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "A search hit's id, an evidence id, a node_id, or the next_id of the page before.",
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              },
              "offset": {
                "description": "Character the page starts at: the next_offset of the page before.",
                "maximum": 2147483647,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              },
              "metadata": {
                "additionalProperties": false,
                "properties": {
                  "content_origin": {
                    "description": "Immutable content-provenance label; never upgrade synthesized chat note to original file.",
                    "enum": ["ORIGINAL_FILE", "CLIENT_SYNTHESIZED_CONTEXT", "USER_AUTHORED", "IMPORTED_GRAPH"],
                    "type": "string"
                  },
                  "evidence_class": {
                    "maxLength": 64,
                    "type": "string"
                  },
                  "locator": {
                    "maxLength": 512,
                    "type": "string"
                  },
                  "namespace_id": {
                    "maxLength": 128,
                    "type": "string"
                  },
                  "source_kind": {
                    "maxLength": 64,
                    "type": "string"
                  },
                  "source_revision": {
                    "maxLength": 128,
                    "type": "string"
                  }
                },
                "required": ["content_origin"],
                "type": "object"
              },
              "next_id": {
                "description": "Added in contract revision 4.4.0. An id that fetches the next page as the only argument; set exactly when text_truncated is true.",
                "maxLength": 256,
                "type": ["string", "null"]
              },
              "next_offset": {
                "description": "Added in contract revision 4.4.0. The offset of the next page; set exactly when text_truncated is true.",
                "minimum": 0,
                "type": ["integer", "null"]
              },
              "node_id": {
                "description": "Present when the evidence records an imported graph node: its opaque node id for query_graph_neighbors and query_graph_paths. Never an internal key.",
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              },
              "text": {
                "maxLength": 30000,
                "type": "string"
              },
              "text_offset": {
                "description": "Added in contract revision 4.4.0. The character of the whole text at which this page starts.",
                "minimum": 0,
                "type": "integer"
              },
              "text_total_chars": {
                "description": "Added in contract revision 4.4.0. The length of the whole stored text in characters; text holds at most 30000 of them.",
                "minimum": 0,
                "type": "integer"
              },
              "text_truncated": {
                "description": "Added in contract revision 4.4.0. True when the text continues after this page: read on at next_offset or next_id before treating the evidence as complete.",
                "type": "boolean"
              },
              "title": {
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              },
              "url": {
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id", "metadata", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
