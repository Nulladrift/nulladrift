          "description": "List the rooms the MCP token's account may use, when the user asks which rooms exist; without the token, find_rooms lists the public ones. Input: no required field; limit and cursor page the list. Returns only the account's authorized rooms, by stable account identity independent of OAuth token rotation, each naming its visibility (PUBLIC or PRIVATE); without the token the list holds the public rooms only, and _meta.auth says which caller you are. At most limit (100) rooms per page in name order; when truncated, pass next_cursor as cursor until it is null. Never returns an internal key. Example: {}. Since contract revision 4.9.0 every room names its visibility. The contract revision in force is the one every response repeats in _meta.contract_revision and server_info reports; a revision note (Added in, Since) says when a field or a tool appeared, never which revision is current.",
