                        "properties": {
                          "curation": {
                            "additionalProperties": false,
                            "description": "Added in contract revision 4.3.0. Who asserted a curated relation, in which version and on which evidence; relation_id and version are what curate_relation revises. Since 4.4.0 also what the evidence carries (assessment).",
                            "properties": {
                              "as_of": {
                                "description": "Added in contract revision 4.4.0. The day the assessment was computed for (today in UTC unless the read asked for another).",
                                "format": "date",
                                "type": "string"
                              },
