{
  "lockfileVersion": 2,
  "subjects": {
    "com.govbase/govbase": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.govbase.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "govbase",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_effort",
          "title": "Get Effort Details",
          "description": "Retrieve an effort by ID: the maintained plain-language answer to \"what is happening with this?\", the full bill lineage across Congresses, current status, next actor, and story coverage.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "effort_id": {
                "description": "Effort slug ID (e.g. \"safeguard-american-voter-eligibility\")",
                "type": "string"
              }
            },
            "required": ["effort_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0cca2dda935b37434e54f6ecf94d1ef5e7586d72fa989d4db00d750c0a28006d"
        },
        {
          "name": "get_member",
          "title": "Get Member of Congress Details",
          "description": "Retrieve detailed information about a specific U.S. member of Congress by their Bioguide ID (e.g., \"P000197\" for Nancy Pelosi).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "bioguide_id": {
                "description": "Bioguide ID (e.g., \"P000197\")",
                "type": "string"
              }
            },
            "required": ["bioguide_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4d8c0fbbabdb9de918c1d4bc9e4e8d7357737d5b55baf88199322c7fd055d6d0"
        },
        {
          "name": "get_member_vote",
          "title": "Get Member Vote on Policy",
          "description": "Check how a specific U.S. member of Congress voted on a policy by providing their Bioguide ID and the policy ID. Returns all roll call votes for that member on the given policy.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "bioguide_id": {
                "description": "Bioguide ID of the member",
                "type": "string"
              },
              "policy_id": {
                "description": "Policy ID to check vote on",
                "type": "string"
              }
            },
            "required": ["bioguide_id", "policy_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:172b8908936afd2730027195689f13bd2a6b3766e2ef3a4af57e07f0dcba1bfb"
        },
        {
          "name": "get_policy",
          "title": "Get Policy Details",
          "description": "Retrieve detailed information about a specific U.S. federal policy by its ID (e.g., \"bill-119-hr-22\" or \"eo-2025-1234\").",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "policy_id": {
                "description": "Policy ID (e.g., \"bill-119-hr-22\" or \"eo-2025-1234\")",
                "type": "string"
              }
            },
            "required": ["policy_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4250fe7c2297d7a67bd319683cf75eec79f793c70b541b202fff8dd494461689"
        },
        {
          "name": "get_policy_text",
          "title": "Get Policy Full Text",
          "description": "Retrieve the full text of a U.S. federal policy document. Returns the raw legislative or regulatory text.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "format": {
                "default": "markdown",
                "description": "Text format",
                "enum": ["markdown", "plain"],
                "type": "string"
              },
              "policy_id": {
                "description": "Policy ID",
                "type": "string"
              }
            },
            "required": ["policy_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0e2f09c1c9abbd76d3df13c392ad726bcb42e23084800c1350c2c2922bb6ba88"
        },
        {
          "name": "get_representatives",
          "title": "Get Representatives",
          "description": "Look up elected representatives for a given U.S. address, including federal, state, and local officials.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "description": "Street address (e.g., \"1600 Pennsylvania Ave, Washington DC\")",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d6efa926decdf446dcd5da1f5047fc61488cac4042894aaec4a2600889feb332"
        },
        {
          "name": "get_stories",
          "title": "Get Story Bundles",
          "description": "List current story bundles tracking ongoing policy issues. Returns a feed of active stories grouping related policies and developments.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 10,
                "description": "Number of stories",
                "maximum": 20,
                "minimum": 1,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c61c47fe5ad893ed9c12d1bd8d9cffe4905196ae45549b4443ad403c3db78c4d"
        },
        {
          "name": "get_story",
          "title": "Get Story Details",
          "description": "Retrieve detailed information about a specific story bundle by its ID, including the full timeline of related events.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "bundle_id": {
                "description": "Story bundle ID",
                "type": "string"
              }
            },
            "required": ["bundle_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6e7a9811a9fedeb012e18e8d5bf8f9e97e4b419b7f0ae24783bfb827d0f2a694"
        },
        {
          "name": "get_voter_info",
          "title": "Get Voter Information",
          "description": "Get election and polling location information for a registered U.S. voter address, including upcoming elections and early vote sites.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "description": "Registered voter address",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c04d9c23117bb018ac690516786a2d5e80d1b7a7b46dfdfbbcc57fef15c6076a"
        },
        {
          "name": "resolve_effort",
          "title": "Resolve Effort by Name",
          "description": "Answer \"what is going on with policy X?\" — resolve a bill nickname, acronym, or media name (\"SAVE Act\", \"big beautiful bill\") to the effort tracking that policy goal across every bill that has carried it, through reintroductions and new Congresses.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "name": {
                "description": "A name for the effort: bill nickname, acronym, or media name (e.g. \"SAVE Act\", \"big beautiful bill\")",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:100bd980d8aa2eb656073fc53e0cc159a7ba05cae1764d67c87ae9a8dda2e5a2"
        },
        {
          "name": "search_members",
          "title": "Search Members of Congress",
          "description": "Search current U.S. members of Congress by name, state, party, or chamber. Returns a list of matching members with key details.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "chamber": {
                "description": "Congressional chamber",
                "enum": ["house", "senate"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Number of results",
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "party": {
                "description": "Political party",
                "enum": ["Democratic", "Republican", "Independent"],
                "type": "string"
              },
              "query": {
                "description": "Search by name",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code (e.g., \"CA\")",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:687335bdbf038fac6ee9f5a924791edea39525cbcfa48ed685a147628f674f25"
        },
        {
          "name": "search_policies",
          "title": "Search Policies",
          "description": "Search U.S. federal policies and legislation by keyword, topic, or bill name. Returns a list of matching policies with summaries.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 10,
                "description": "Number of results (max 25)",
                "maximum": 25,
                "minimum": 1,
                "type": "number"
              },
              "query": {
                "description": "Search query (bill name, topic, keyword)",
                "type": "string"
              },
              "sort": {
                "default": "importance",
                "description": "Sort order",
                "enum": ["date", "importance"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:117d55c5dba046c196ac37d6d2ffab1f41afb2681cd7d896401374a0102dac2d"
        }
      ],
      "digest": "sha256:08d6093d95c32f090fa93a00d4e66dd2eb22a2087de72e196c580943fe4c8396"
    }
  }
}
