        {
          "name": "lookup_coin",
          "title": "Look up a coin",
          "description": "Look up a single coin and its core metrics (price, trend, metadata) by symbol, name, CoinGecko/internal id, or on-chain contract address. Read the coin's CURRENT trend from `currentTrend` ({ trend: UP|DOWN|HODL, since, days, asOf, incompleteDayExcluded }; `currentTrendWeekly` when present is the weekly one), not from the last row of `trends` — `trends` is the history of past trend runs. Quote it as \"<trend> since <since> (<days> days, as of <asOf>)\". Only when `currentTrend` is absent, fall back to the last `trends` row.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "by": {
                "default": "symbol",
                "description": "How `identifier` is interpreted.",
                "enum": ["symbol", "name", "id", "contract"],
                "type": "string"
              },
              "chain": {
                "description": "Chain for contract lookups (ethereum, bsc, solana, base, …). Required when by=\"contract\".",
                "type": "string"
              },
              "identifier": {
                "description": "The symbol (BTC), name (Bitcoin), id (bitcoin), or contract address.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["identifier"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "data": {
                "additionalProperties": {},
                "properties": {
                  "average_streak": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "band_position": {
                    "anyOf": [
                      {
                        "additionalProperties": {},
                        "propertyNames": {
                          "type": "string"
                        },
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "coin": {
                    "anyOf": [
                      {
                        "additionalProperties": {},
                        "propertyNames": {
                          "type": "string"
                        },
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "currentTrend": {
                    "anyOf": [
                      {
                        "additionalProperties": {},
                        "properties": {
                          "asOf": {
