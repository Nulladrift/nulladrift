        {
          "name": "scan_coins",
          "title": "Scan / filter coins",
          "description": "Filter the tracked universe by trend direction, category and market-cap band, and sort the result. For movers questions (\"what's pumping\", \"top gainers/losers today\", \"biggest movers\") use sort_by=\"change24h\" (\"change7d\" for the week) — sort_order=\"desc\" for gainers, \"asc\" for losers — and quote each row's change from the row itself (`change_24h_pct` / `change_7d_pct`, or `change24h` / `change7d`). With the default marketCap sort rows are plain coin names; a change sort may return `{ rows: [...] }` with a coverage summary instead of a bare list. Pass ONE category per call; the server ignores case and punctuation (\"meme\", \"Layer 2\" and \"DeFi\" all work) and rejects an unknown name with close matches (list_categories has the names). There is no exchange filter yet: `exchange` is rejected with an explanation, because the only venue data behind this scan is spot listings. Do not present a scan as \"coins on <exchange>\". An empty result means no coin matched all the filters.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "ONE category, e.g. \"Meme\", \"Layer 2\" or \"DeFi\"; case and punctuation are ignored (list_categories has the names). Comma-joined values are rejected; call once per category.",
                "type": "string"
              },
              "exchange": {
                "description": "Not supported yet: the server rejects it with an explanation (its venue data covers spot listings only, so a filtered answer would mislead). Leave unset.",
                "type": "string"
              },
              "fields": {
                "description": "Token-saving: comma-separated top-level fields to keep.",
                "type": "string"
              },
              "interval": {
                "description": "Trend interval: 1d (daily) or 1w (weekly).",
                "enum": ["1d", "1w"],
                "type": "string"
              },
              "limit": {
                "description": "Max results.",
                "exclusiveMinimum": 0,
                "maximum": 200,
                "type": "integer"
              },
              "mcap_max": {
                "description": "Maximum market cap in USD.",
                "type": "number"
              },
              "mcap_min": {
                "description": "Minimum market cap in USD.",
                "type": "number"
              },
              "sort_by": {
                "description": "Sort key (default marketCap). change24h / change7d = 24h / 7d price change, for movers / \"what's pumping\" questions.",
                "enum": ["marketCap", "change24h", "change7d", "streak", "price"],
                "type": "string"
              },
              "sort_order": {
                "description": "desc (default) = largest first; asc = smallest first (e.g. biggest 24h losers).",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "top": {
                "description": "Keep only the first N items (default 50). Raise for more, lower to save tokens.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "trend": {
                "description": "Filter by trend direction.",
                "enum": ["UP", "HODL", "DOWN"],
                "type": "string"
              }
            },
            "type": "object"
          },
