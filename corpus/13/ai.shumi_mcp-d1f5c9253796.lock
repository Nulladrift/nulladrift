      "serverInfo": {
        "name": "shumi",
        "version": "1.3.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Shumi exposes crypto trade-intelligence (prices, trends, funding rates, sentiment, narratives, regime, signals, pair/delta-neutral ideas) over the same data surface as the shumi CLI. Prefer the specific typed tools (get_coin_risk, get_market_health, scan_trends, …) for deterministic data; use ask_shumi for free-form or multi-part questions. All tools are read-only.",
      "tools": [
        {
          "name": "ask_shumi",
          "title": "Ask Shumi (free-form)",
          "description": "Ask Shumi any crypto-market question in natural language. Shumi classifies the query, fetches the relevant data, and returns a synthesized answer. Use this when no specific typed tool fits, or for multi-part / comparative questions.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "archetype": {
                "description": "Specialization path (default \"base\"; e.g. \"perp-dex\").",
                "type": "string"
              },
              "query": {
                "description": "The natural-language question, e.g. \"is funding extreme on SOL right now?\".",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "answer": {
                "description": "The synthesized natural-language answer. Absent only when the engine produced no prose.",
                "type": "string"
              },
              "steps": {
                "description": "Raw engine steps. Present only as a fallback when `answer` is absent."
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1b1f3905aa2916a5f0f286742dcdf6768b9c0a6bbb80c1931e2f5979216e5575"
        },
