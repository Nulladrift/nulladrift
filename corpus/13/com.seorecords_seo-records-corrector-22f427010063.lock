{
  "lockfileVersion": 2,
  "subjects": {
    "com.seorecords/seo-records-corrector": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.seorecords.com/mcp/corrector"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "seo-records-corrector",
        "title": "SEO Records Corrector",
        "version": "1.1.0",
        "websiteUrl": "https://seorecords.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "SEO Records Corrector runs the SEO Records correction engine on a public web page. fix_page_seo returns each correction the engine would apply (title, meta description, canonical URL, share preview, structured data, image alt texts, indexing directives), with its value, its source and the exact HTML tag, plus the Google snippet before and after, and the points left to the author. get_automatic_fix_offer returns the products that apply these corrections automatically, with prices and payment links. fix_page_seo requires this connector's access key (access_key): without it, it answers with the two ways to buy one (€9.90 for 24 hours, or €29 per month).",
      "tools": [
        {
          "name": "fix_page_seo",
          "title": "Fix the SEO of a web page",
          "description": "Runs the SEO Records correction engine (the one inside the SEO Records module) on a public page and returns every correction it would apply: the value, the source it comes from, and the exact HTML tag to add or replace in <head> — title, meta description, canonical URL, hreflang, Open Graph and Twitter preview, JSON-LD structured data, image alt texts, robots directives. Also returns the Google snippet before and after, and the issues left to the author because they touch visible content (missing h1, vague link texts…). The page is read, corrected in memory, and forgotten. Requires this connector's access pass (€9.90 for 24 hours, or €29 per month). Docs: https://seorecords.com/assistants",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "access_key": {
                "description": "Access key (pass_…) of this connector, shown after buying its 24-hour pass or monthly subscription. Required.",
                "maxLength": 600,
                "type": "string"
              },
              "url": {
                "description": "The page address, e.g. example.com/page or https://example.com/",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Fix the SEO of a web page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fda8ee539abe49281d197c4577bd3500f7476304dbdd12fe28b84f13598ac8cf"
        },
        {
          "name": "get_automatic_fix_offer",
          "title": "Apply the fixes automatically: offer and payment links",
          "description": "Returns the SEO Records products that apply these corrections automatically on every page: the SEO Records module (WordPress, PrestaShop, Joomla, Drupal, custom PHP; from €199/year) and SEO Outpost (the same corrections at the network edge, any hosting; from €199 for a year), with what each does, prices and secure Stripe payment links. Docs: https://seorecords.com/assistants",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "description": "Language of the product pages (default en)",
                "enum": ["en", "fr", "de", "es", "it", "pt", "pl", "nl"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Apply the fixes automatically: offer and payment links"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:17dddfdf9a0f4e93b1d6aae2665f7c4d20ceebdc3b846fbb1cc73b13aadacc84"
        }
      ],
      "digest": "sha256:7b2c9363ac3aa1b48e6299109d5ede6d7820bf7bee1375cfcb290c798e4430cf"
    }
  }
}
