      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "com.fernwaylabs/finished-listing-stage",
        "title": "Finished Listing: stage an empty room",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Stages one empty interior room from a public listing photo. The result is labelled \"Virtually staged\" and the original comes back with it; walls, windows, doors, floors and fixtures never change. Staging takes 10 to 30 minutes: call stage_room, then stage_status with the id until it is delivered. Use only for listings you represent or may market, and follow your MLS rules for altered photos.",
      "tools": [
        {
          "name": "stage_room",
          "title": "stage_room",
          "description": "Queue virtual staging of one empty interior room from a public photo URL (https, JPG/PNG/WebP up to 15 MB). Returns an id to poll with stage_status. Furnished rooms, exteriors and photos with people are skipped. The public sampler stages up to 10 rooms a day for free.",
          "inputSchema": {
            "properties": {
              "photo_url": {
                "description": "https URL of the room photo",
                "type": "string"
              },
              "ref": {
                "description": "optional reference, up to 80 characters",
                "type": "string"
              }
            },
            "required": ["photo_url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:712dcfd408055fe2ec0d8e9f8303344bf48fa064fb39634092108709ec722181"
        },
        {
          "name": "stage_status",
          "title": "stage_status",
          "description": "Check a queued staging job. Returns queued, working, delivered (with the labelled staged image URL and the original, valid 30 days), skipped (with the reason) or failed.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a8800fac55388016bb8d06119b264062f053366982563f8594daa5d485b3cafc"
        }
      ],
      "digest": "sha256:c734d92a4e53f9193c140b92d0440d67ef9238400be2dcf16ecc1450fa84f232"
    }
  }
