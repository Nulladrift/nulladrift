          "description": "Screens a corporate entity or individual counterparty against the U.S. Treasury OFAC Specially Designated Nationals (SDN) and consolidated sanctions registries using exact identifier matching (LEI/CIK/CRN) and Jaro-Winkler fuzzy phonetic resolution, returning a compliance verdict and SHA-256 Merkle audit proof. Use when: verifying whether a specific company, vessel, wallet counterparty, or individual is sanctioned before onboarding or settlement. Do not use when: retrieving macro-level weekly sanctions policy trends (use get_sovereign_policy_brief instead) or drafting regulatory comment letters on FinCEN/OFAC rulemakings (use synthesize_regulatory_docket instead). Behavior: Read-only, deterministic compliance check ($0.50 USD per call via HTTP header x-api-key or x-payment-token; returns an x402/MPP paymentChallenge without charging if credentials are omitted).",
          "inputSchema": {
            "properties": {
              "country": {
                "default": "US",
