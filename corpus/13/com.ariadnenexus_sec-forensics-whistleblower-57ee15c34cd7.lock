        {
          "name": "synthesize_regulatory_docket",
          "title": "APA 5 U.S.C. § 553 Regulatory Docket Comment Letter Synthesizer",
          "description": "Drafts a formal Administrative Procedure Act (APA, 5 U.S.C. § 553) Public Comment Letter cited with empirical Ariadne Nexus FINRA TRACE G-SIB spread and x402 OFAC SDN screening telemetry for active Federal Reserve/OFR, FinCEN/OFAC, SEC DERA, or FSOC rulemaking dockets. Use when: preparing a statutory public comment submission or empirical policy memorandum for a specific federal financial regulatory docket (`FED_TREASURY_OFR`, `FINCEN_OFAC_X402`, `SEC_DERA_TRACE`, or `FSOC_NONBANK_CONTAGION`). Do not use when: reading the weekly macro-prudential policy monitor (use get_sovereign_policy_brief instead) or screening an entity against OFAC sanctions lists (use screen_ofac_entity instead). Behavior: Read-only local document synthesis ($2.50 USD per call via HTTP header x-api-key or x-payment-token). Does NOT automatically transmit or file comments with regulations.gov or any external agency; returns the structured comment text and cryptographic SHA-256 citation hash for human review.",
          "inputSchema": {
            "properties": {
              "agency_id": {
                "default": "FED_TREASURY_OFR",
                "description": "Target federal regulatory docket identifier: \"FED_TREASURY_OFR\" (Treasury OFR / Fed Systemic Liquidity), \"FINCEN_OFAC_X402\" (FinCEN/OFAC Autonomous Agent AML/Sanctions), \"SEC_DERA_TRACE\" (SEC DERA Fixed-Income Transparency), or \"FSOC_NONBANK_CONTAGION\" (FSOC Nonbank RWA Contagion). Default: \"FED_TREASURY_OFR\".",
                "enum": ["FED_TREASURY_OFR", "FINCEN_OFAC_X402", "SEC_DERA_TRACE", "FSOC_NONBANK_CONTAGION"],
                "type": "string"
