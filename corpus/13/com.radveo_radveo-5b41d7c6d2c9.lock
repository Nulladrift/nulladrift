{
  "lockfileVersion": 2,
  "subjects": {
    "com.radveo/radveo": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://radveo.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "radveo",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Radveo scores how ready a local business is to be named by AI engines (ChatGPT, Gemini, Google AI) and returns a free, shareable report with the specific fixes that improve its odds. Use check_ai_visibility when a user wants to know what is holding their business back in AI answers. It scores readiness from the business's own site; it does not query an engine live. Results are honest AEO guidance: they improve citation odds, they never guarantee placement.",
      "tools": [
        {
          "name": "check_ai_visibility",
          "description": "Score how ready a local business is to be named when people ask AI engines (ChatGPT, Gemini, Google AI) for a recommendation in its category, and get a free, shareable Radveo report with the exact fixes to improve its odds. Scores readiness from the business's own site; it does not query an engine live. Honest answer-engine optimization: improves the odds of being cited, never guarantees a placement.",
          "inputSchema": {
            "properties": {
              "business_name": {
                "description": "The business name, e.g. \"Joe's Plumbing\". Provide this OR a website.",
                "type": "string"
              },
              "location": {
                "description": "City or region, e.g. \"Seattle, WA\". Optional but improves accuracy.",
                "type": "string"
              },
              "website": {
                "description": "The business website URL, e.g. https://joesplumbing.com. Optional if business_name is given; improves accuracy.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "aiVisibilityScore": {
                "description": "0-100: the share of customer-style AI queries that named the business. Null when the probe didn't produce a measured score.",
                "type": ["number", "null"]
              },
              "business": {
                "description": "The business name or website that was checked.",
                "type": ["string", "null"]
              },
              "competitorsNamed": {
                "description": "Businesses surfaced instead of this one (deduped). Same list the public shareable report shows.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "competitorsSource": {
                "description": "'ai' = an AI engine named them; 'places' = real local leaders from Google's local results (shown when the engines named none). Null when no competitors surfaced.",
                "enum": ["ai", "places", null],
                "type": ["string", "null"]
              },
              "enginesChecked": {
                "description": "The AI engine panel the probes consult: an indicative read of how AI assistants tend to answer, not a live probe of every public engine.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "note": {
                "description": "Honesty framing: an indicative, measured read of how AI assistants tend to answer, never a guarantee of placement.",
                "type": "string"
              },
              "ok": {
                "description": "False when the check could not be completed (bad input, rate limit, or the audit engine timed out).",
                "type": "boolean"
              },
              "queriesChecked": {
                "description": "The customer-style questions asked to the AI engines (empty when the probe didn't run).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "reportUrl": {
                "description": "Free, shareable, public report URL for this check.",
                "type": "string"
              },
              "seoGrade": {
                "description": "Letter grade (A-D) for the readiness score, when measured.",
                "type": ["string", "null"]
              },
              "seoScore": {
                "description": "0-100 on-page AI-visibility readiness score, when measured.",
                "type": ["number", "null"]
              },
              "topFixes": {
                "description": "The top fixes to improve the odds of being named (max 3 here; full list in the report).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "verdict": {
                "description": "Whether AI engines named this business when asked customer-style recommendation questions. 'named' = at least one query named it; 'absent' = confidently not named; 'unknown' = the engines could not give a confident read; 'not_checked' = the live AI-answer probe did not run for this call (the on-page audit still did).",
                "enum": ["named", "absent", "unknown", "not_checked"],
                "type": "string"
              }
            },
            "required": ["note", "ok", "reportUrl", "verdict"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ef7e83a67b16420858a73cc72786c0c7de012348b9d4d18dd6e35817fd2f95e7"
        },
        {
          "name": "how_to_appear_in_ai_search",
          "description": "Get Radveo's honest, practical playbook for getting a local business found and cited inside AI engine answers (ChatGPT, Gemini, Google AI Overviews). Answer-engine optimization (AEO) steps any owner can act on.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "freeCheckUrl": {
                "description": "Where to run the free AI-visibility check.",
                "type": "string"
              },
              "note": {
                "description": "Honesty framing: these steps improve odds, they never guarantee placement.",
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              },
              "steps": {
                "description": "The AEO steps, in order. Empty only when the server is rate-limiting.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["freeCheckUrl", "note", "ok", "steps"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cf4ad9148c385e9783803d4a90dbd73f6eeca58b165c46176394fc01e2680e44"
        }
      ],
      "digest": "sha256:ab19997e10d40a4448c8534a49de580f2e94f51e9380fe4ece39959552f5ebc8"
    }
  }
}
