{
  "lockfileVersion": 2,
  "subjects": {
    "app.getstringer/synthesizer": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://synthesis.getstringer.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "stringer-synthesizer",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "synthesize_intelligence",
          "description": "Return extractive quotations with citations and source provenance from verified public sources. The first 3 calls are free, total, with no signup and no claim header. The allowance does not reset. Free calls include web discovery when no source URLs are given.",
          "inputSchema": {
            "properties": {
              "depth": {
                "description": "Research depth: 'brief' ($0.10, >=2 sources) or 'deep' ($0.25, >=3 sources). Default is 'brief'.",
                "enum": ["brief", "deep"],
                "type": "string"
              },
              "domains_filter": {
                "description": "Optional list of domains to filter discovery.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "source_urls": {
                "description": "Public source URLs supplied by the caller. Brief requires >=2 distinct verified URLs; deep requires >=3.",
                "items": {
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "topic": {
                "description": "The topic, entity, or research query to synthesize.",
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:27227dde332f6f31198aa4084c503975277899917dfce4b7f539c049dbd30c41"
        }
      ],
      "digest": "sha256:7c8f6c794bc7df4765772a56d2cc55b2cbe6efde2c5661f902bda3fb8bde2dbe"
    }
  }
}
