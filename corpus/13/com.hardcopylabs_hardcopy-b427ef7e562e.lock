        {
          "name": "preview_print_order",
          "title": "Preview the exact parts before ordering",
          "description": "MANDATORY before creating any order or checkout, including reorders.\n\n    Render exact validated geometry and quote the whole order. Display EVERY returned\n    part image with name, dimensions, material/color, quantity, notes and total to the\n    buyer. The in-chat card shows images where supported; otherwise embed image_url\n    values or give viewer_url and ask the buyer to review there. Never substitute an\n    AI illustration, or describe unshown images as reviewed. Ask for explicit buyer\n    confirmation of this version only after presenting the preview. Changes require\n    a new preview and new confirmation; pass replaces_preview_id to revoke the old preview. Preview failure blocks ordering.\n\n    After confirmation call submit_print_job (or reorder_print_job) using preview_id,\n    preview_version, buyer_confirmed=true and shipping/contact details; do not resend\n    models or option overrides. Preview generation and viewing never create an order.\n    Separate parts are displayed individually, not as an inferred assembly.\n    ",
          "inputSchema": {
            "$defs": {
              "OrderPart": {
                "additionalProperties": false,
                "properties": {
                  "color": {
                    "default": "black",
                    "description": "Filament color for this part.",
                    "maxLength": 40,
                    "title": "Color",
                    "type": "string"
                  },
                  "material": {
                    "default": "pla",
                    "description": "PLA or PETG only.",
                    "maxLength": 20,
                    "title": "Material",
                    "type": "string"
                  },
                  "model_id": {
                    "default": "",
                    "description": "Reusable id from validate_stl; valid for 24 hours.",
                    "maxLength": 64,
                    "title": "Model Id",
                    "type": "string"
                  },
                  "name": {
                    "description": "Short part name, shown on the card and receipt.",
                    "maxLength": 120,
                    "minLength": 1,
                    "title": "Name",
                    "type": "string"
                  },
                  "openscad_source": {
                    "default": "",
                    "description": "OpenSCAD in millimeters; give exactly one model source.",
                    "maxLength": 50000,
                    "title": "Openscad Source",
                    "type": "string"
                  },
                  "quantity": {
                    "default": 1,
                    "description": "Copies of THIS part. Capped by how long this part takes to print, not a flat number -- checked once its geometry is known; a rejected order reports the real cap for this part's size.",
                    "maximum": 500,
                    "minimum": 1,
                    "title": "Quantity",
                    "type": "integer"
                  },
                  "stl_base64": {
                    "default": "",
                    "description": "STL in millimeters; give exactly one model source.",
                    "maxLength": 25000000,
                    "title": "Stl Base64",
                    "type": "string"
                  }
                },
                "required": ["name"],
                "title": "OrderPart",
                "type": "object"
              }
            },
            "properties": {
              "color": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Selected filament color. Default black for new models; omit to retain reorder colors.",
                "title": "Color"
              },
              "job_name": {
                "default": "",
                "description": "Short order name shown with the preview.",
                "title": "Job Name",
                "type": "string"
              },
              "material": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "PLA or PETG. Default PLA for new models; omit to retain reorder materials.",
                "title": "Material"
              },
              "notes": {
                "default": "",
                "description": "Operator instructions to show and bind to this preview; changes require a new preview.",
                "title": "Notes",
                "type": "string"
              },
              "openscad_source": {
                "default": "",
                "description": "OpenSCAD source in millimeters. Rendered and validated before preview; never an illustrative AI image.",
                "title": "Openscad Source",
                "type": "string"
              },
              "parts": {
                "anyOf": [
                  {
                    "items": {
                      "$ref": "#/$defs/OrderPart"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The WHOLE order, one entry per part. Use a model_id from earlier validation, an STL, or OpenSCAD. Each entry has its own name, material, color and quantity. Each part's quantity is capped by its own print time, not a flat count. Shipping and handling are charged once; never add independent quote totals.",
                "title": "Parts"
              },
              "quantity": {
                "default": 1,
                "description": "How many identical copies. The totals cover all of them. Capped by how long the part takes to print, not a flat number -- a quick part allows many copies, a very large or slow one may allow as few as 1; submit_print_job reports the real cap if this is too many.",
                "title": "Quantity",
                "type": "integer"
              },
              "reorder_of": {
                "default": "",
                "description": "Existing order ID to preview for reorder; omit new model inputs when using this.",
                "title": "Reorder Of",
                "type": "string"
              },
              "replaces_preview_id": {
                "default": "",
                "description": "When revising an unplaced order, pass its previous preview id. It is invalidated even if the new render fails.",
                "title": "Replaces Preview Id",
                "type": "string"
              },
              "stl_base64": {
                "default": "",
                "description": "The model as a base64-encoded STL file (binary or ASCII), in millimeters.",
                "title": "Stl Base64",
                "type": "string"
              }
            },
            "title": "preview_print_orderArguments",
            "type": "object"
          },
