        {
          "name": "reorder_print_job",
          "title": "Reorder a past print",
          "description": "A REORDER ALSO REQUIRES A NEW VISUAL PREVIEW AND BUYER CONFIRMATION.\n\n    First call preview_print_order with reorder_of and any desired changes, show every\n    image/options/price to the buyer, and obtain confirmation. Then call this with\n    preview_id, preview_version and buyer_confirmed=true, without option overrides.\n    Without a preview this returns a preview only; it never creates an order.\n\n    In preview_print_order, quantity means complete sets for multi-part reorders;\n    material/color overrides apply to every part. Omit overrides to preserve choices.\n    Prices are recalculated. The previous order's geometry is reused without requesting\n    a new upload. Shipping/contact details are never copied from the previous order;\n    confirm the new address with the buyer. Orders cancelled by HardCopy Labs or still\n    awaiting payment cannot be reordered. Returns a new job ID, total and payment link\n    when payment is required, only after the new preview is confirmed.\n    ",
          "inputSchema": {
            "properties": {
              "buyer_confirmed": {
                "default": false,
                "description": "True ONLY after showing every preview image/options/price and receiving explicit buyer confirmation. Not proof of human viewing.",
                "title": "Buyer Confirmed",
                "type": "boolean"
              },
              "color": {
                "default": "",
                "description": "Filament color. Leave empty to keep the earlier order's color.",
                "title": "Color",
                "type": "string"
              },
              "contact_email": {
                "default": "",
                "description": "The buyer's email, for the receipt and order updates. Not copied from the earlier order.",
                "title": "Contact Email",
                "type": "string"
              },
              "job_id": {
                "description": "The id of the earlier order to copy, like hc-1a2b3c4d.",
                "title": "Job Id",
                "type": "string"
              },
              "material": {
                "default": "",
                "description": "pla or petg. Leave empty to keep the earlier order's material.",
                "title": "Material",
                "type": "string"
              },
              "notes": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional notes for the operator.",
                "title": "Notes"
              },
              "preview_id": {
                "default": "",
                "description": "The id returned by preview_print_order for the images shown to the buyer.",
                "title": "Preview Id",
                "type": "string"
              },
              "preview_version": {
                "default": "",
                "description": "The exact preview version the buyer confirmed; changes require a new preview.",
                "title": "Preview Version",
                "type": "string"
              },
              "quantity": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "How many identical copies. Capped by print time, not a flat number; the totals cover all of them.",
                "title": "Quantity"
              },
              "ship_to": {
                "description": "Recipient's full name and US street address, including city, state and ZIP. Not copied from the earlier order. We ship within the United States only.",
                "title": "Ship To",
                "type": "string"
              }
            },
            "required": ["job_id", "ship_to"],
            "title": "reorder_print_jobArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "reorder_print_jobOutput",
            "type": "object"
