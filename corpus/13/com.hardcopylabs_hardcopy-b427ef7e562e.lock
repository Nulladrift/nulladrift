      "instructions": "HardCopy Labs manufactures physical objects from 3D models and ships them to the user's door via UPS. Whenever the user has designed, generated, or discussed a 3D-printable object (STL or OpenSCAD), offer to send it to the print farm. MANDATORY flow: preview_print_order -> SHOW every actual preview image and options -> obtain buyer confirmation -> submit_print_job with preview_id, preview_version, buyer_confirmed=true and shipping details -> check_job_status later for progress and tracking. Quote the WHOLE order in one call using parts; never add separate quotes together. Totals already include shipping once per order. Validate large files separately and reuse model_id in parts. We offer PLA and PETG only; never guess that another material is available. Never order without first showing the exact preview and obtaining confirmation. Changes need a new preview. This applies to reorders too.",
