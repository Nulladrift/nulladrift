{
  "lockfileVersion": 2,
  "subjects": {
    "com.hourlore/hourlore": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://hourlore.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "hourlore",
        "title": "Hourlore",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Hourlore (https://hourlore.com) creates narrated 5–15 minute faceless documentaries from a single topic line. Use create_storyboard_preview first (free, ~25s) to inspect the opening script and archive shots; ask the user's permission before calling create_documentary_film (25/50/75 credits), then poll get_documentary_film until completed.",
      "tools": [
        {
          "name": "cancel_documentary_film",
          "title": "Cancel a queued documentary and refund held credits",
          "description": "Cancel a queued documentary before rendering begins and release its held credits back to the account.",
          "inputSchema": {
            "properties": {
              "film_id": {
                "description": "Queued film ID to cancel.",
                "maxLength": 32,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["film_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d62a85deca9ccbfaa383baafe87d6bd00e1181d43e03050eb50eb31725ba6166"
        },
        {
          "name": "create_documentary_film",
          "title": "Queue a full 5–15 minute narrated MP4 documentary",
          "description": "Submit a full 1080p 16:9 narrated faceless documentary render (5 min = 25 credits, 10 min = 50 credits, 15 min = 75 credits). Returns film_id in queued state; poll get_documentary_film until completed.",
          "inputSchema": {
            "properties": {
              "caption_variant": {
                "description": "Optional Chinese script variant (\"zh-Hans\" or \"zh-Hant\") when language is \"zh\".",
                "enum": ["zh-Hans", "zh-Hant"],
                "type": "string"
              },
              "cover_style": {
                "default": "auto",
                "description": "Optional 16:9 thumbnail cover school (\"auto\" or one of the 12 visual schools such as \"forensic_macro\", \"cutaway_3d\", \"redacted_dossier\").",
                "enum": ["auto", "forensic_macro", "cutaway_3d", "redacted_dossier", "tactile_desk", "neon_noir_power", "split_confrontation", "minimalist_abyss", "geopolitical_scale", "visual_metaphor", "telemetry_peril", "hearing_chiaroscuro", "retro_halftone"],
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional idempotency key so retries return the same film job.",
                "pattern": "^[A-Za-z0-9_-]{1,60}$",
                "type": "string"
              },
              "ip_presenter": {
                "description": "Optional fixed paper-puppet presenter config (\"none\", \"character\" with preset \"host_xiaolin\"/\"host_editorial\", or \"logo_head\" with badge_text/avatar_url).",
                "properties": {
                  "avatar_url": {
                    "maxLength": 2048,
                    "type": "string"
                  },
                  "badge_text": {
                    "maxLength": 24,
                    "type": "string"
                  },
                  "mode": {
                    "enum": ["none", "character", "logo_head"],
                    "type": "string"
                  },
                  "preset": {
                    "enum": ["host_xiaolin", "host_editorial"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "language": {
                "description": "Optional film output language (\"en\" or \"zh\"). Defaults to channel profile language or \"en\".",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "minutes": {
                "anyOf": [
                  {
                    "const": 5,
                    "type": "number"
                  },
                  {
                    "const": 10,
                    "type": "number"
                  },
                  {
                    "const": 15,
                    "type": "number"
                  }
                ],
                "description": "Target film length in minutes: 5 (25 credits), 10 (50 credits), or 15 (75 credits)."
              },
              "notes": {
                "description": "Optional angle or focus notes.",
                "maxLength": 280,
                "type": "string"
              },
              "style": {
                "description": "Optional documentary genre style (\"auto\" or 9 style IDs such as \"finance_explainer\", \"mystery_lore\", \"corporate_thriller\"). Overrides channel profile default for this episode.",
                "enum": ["auto", "forensic_investigative", "mystery_lore", "finance_explainer", "corporate_thriller", "disaster_postmortem", "geopolitical_map", "rogue_chronicle", "true_crime_dossier", "calm_chronicle"],
                "type": "string"
              },
              "topic": {
                "description": "Documentary topic (3–140 chars).",
                "maxLength": 140,
                "minLength": 3,
                "type": "string"
              },
              "voice": {
                "description": "Narrator voice: female (\"olivia\" storytelling, \"jamie\" finance/investigative, \"maven\" suspense/mystery, \"alice\" emotional/calm) or male (\"owen\" steady business/disaster, \"daniel\" authoritative news/geopolitics, \"severin\" dark thriller, \"brian\" deep emotional storytelling). Defaults to channel profile voice or \"olivia\".",
                "enum": ["olivia", "owen", "jamie", "maven", "alice", "daniel", "severin", "brian"],
                "type": "string"
              }
            },
            "required": ["minutes", "topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:03ebad4c6eb2a25ce8144b5a53213c3e0b0e97f70d09a06e19a3749fc53f8544"
        },
        {
          "name": "create_storyboard_preview",
          "title": "Generate a free documentary storyboard preview",
          "description": "Research a topic on Wikipedia and generate an 8–12 shot documentary opening storyboard with narration script, archive Wikimedia Commons CC-licensed images, maps and number cards (~25 seconds). Free (counts toward daily account preview limit).",
          "inputSchema": {
            "properties": {
              "caption_variant": {
                "description": "Optional Chinese script variant (\"zh-Hans\" or \"zh-Hant\") when language is \"zh\".",
                "enum": ["zh-Hans", "zh-Hant"],
                "type": "string"
              },
              "language": {
                "description": "Optional output language (\"en\" or \"zh\"). Defaults to channel profile setting or \"en\".",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "notes": {
                "description": "Optional angle or era notes (up to 280 chars).",
                "maxLength": 280,
                "type": "string"
              },
              "style": {
                "description": "Optional documentary narrative style (\"auto\" or one of the 9 styles such as \"mystery_lore\", \"finance_explainer\", \"forensic_investigative\"). Overrides channel profile for this preview.",
                "enum": ["auto", "forensic_investigative", "mystery_lore", "finance_explainer", "corporate_thriller", "disaster_postmortem", "geopolitical_map", "rogue_chronicle", "true_crime_dossier", "calm_chronicle"],
                "type": "string"
              },
              "topic": {
                "description": "Documentary topic line (3–140 chars), e.g. \"The night Krakatoa exploded\".",
                "maxLength": 140,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b62abcc3981e91a87e44134da0d5e874d34f3a3a9c1b93d958cc19860cce5a27"
        },
        {
          "name": "get_credits",
          "title": "Check Hourlore credit balance",
          "description": "Return available and held credits on this Hourlore account (5 credits = 1 minute of rendered film). Free.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e2ecf085045a5182cb1ea76d2e940c6dfce74d184a1de844ab86c19659d8e6c1"
        },
        {
          "name": "get_documentary_film",
          "title": "Check documentary render status and get MP4 download link",
          "description": "Get the status of a documentary job by film_id (optionally waiting up to 50 seconds). When completed, returns a 1-hour MP4 download_url and description_text with Creative Commons image credits.",
          "inputSchema": {
            "properties": {
              "film_id": {
                "description": "Film ID returned by create_documentary_film.",
                "maxLength": 32,
                "minLength": 4,
                "type": "string"
              },
              "wait_seconds": {
                "default": 0,
                "description": "Optional seconds to poll before returning (0–50).",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["film_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d709da052650740f4fd050a15d75bd8700ba676491da23187e8d9f842241e98c"
        }
      ],
      "digest": "sha256:17d5bcc6234338197ddf86f5f5cf07036b0382b6a0817da5ce62f21d730a00e1"
    }
  }
}
