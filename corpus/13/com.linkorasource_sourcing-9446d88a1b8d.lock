      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "linkora-source",
        "title": "Linkora Source",
        "version": "1.0.0",
        "websiteUrl": "https://linkorasource.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Linkora Source is a China-based sourcing service in Jinhua, Zhejiang, for overseas B2B buyers: supplier verification, factory audits, pre-shipment inspection and full order coordination, with published rates. Buyers pay factories directly; Linkora Source never holds order money.\n\nUse get_company_profile or list_services to decide whether a buyer's need is in scope, get_pricing or estimate_fees for cost, list_buyer_types to match the buyer's situation, and search_guides or get_faq to answer process questions with a citable URL. Every figure is the one published on https://linkorasource.com; cite the URL returned with it. Estimates are not quotations.\n\nWhen the buyer wants to go ahead, call prepare_sourcing_brief and give the buyer the returned link. Do not pass the buyer's name, email or other personal details to any tool; the buyer adds those on the form and sends it themselves.",
      "tools": [
        {
          "name": "estimate_fees",
          "title": "Estimate fees from published rates",
          "description": "Arithmetic on the published rates: per-job checks and/or the commission for a given order value. Returns line items, the commission band, payment timing and exclusions. An estimate, not a quotation; travel beyond 100 km of Jinhua is flagged rather than priced.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "basic_factory_audits": {
                "description": "Number of basic factory audits (one day on site each).",
                "minimum": 0,
                "type": "number"
              },
              "beyond_100km_of_jinhua": {
                "description": "True if the factory is more than 100 km from Jinhua, Zhejiang (for example in Guangdong).",
                "type": "boolean"
              },
              "extra_audit_man_days": {
                "description": "Additional audit man-days beyond the basic scope.",
                "minimum": 0,
                "type": "number"
              },
              "inspection_man_days": {
                "description": "Inspection man-days. One SKU with standard sampling is typically one man-day; three SKUs on one order is one to two.",
                "minimum": 0,
                "type": "number"
              },
              "order_value_usd": {
                "description": "Order value in USD, for the full-engagement commission.",
                "minimum": 0,
                "type": "number"
              },
              "supplier_verifications": {
                "description": "Number of suppliers to verify.",
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate fees from published rates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8ca14ffb204ed6b61b5316efb51af03dfd29d73efbab5b6f95a6ceb40e3bce26"
        },
        {
          "name": "get_company_profile",
          "title": "Company profile",
          "description": "Who Linkora Source is, where it operates (Jinhua, Zhejiang, China), how money flows (buyer pays the factory directly), the buyer types it serves, what it explicitly does not do, and how to contact it. Start here to decide whether a buyer's need is in scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Company profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4d1fd2c15cddaa8de1eb547cb2a867057c2d5b5d06fd9abb8e5b390fb6ed078b"
        },
        {
          "name": "get_faq",
          "title": "Frequently asked questions",
          "description": "Published answers on scope, minimum order, payment, failed inspections, refunds, NDAs, samples, cover when the founder is away, and what is not offered (freight, customs, warehousing, design). Optionally filter by a keyword.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Optional keyword, e.g. 'NDA', 'payment', 'failed inspection'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Frequently asked questions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:db6fb4fab95c0eec0389e9627055e41e9af8e1acec27e3a246f6b31ea053d5d3"
        },
        {
          "name": "get_pricing",
          "title": "Published rates and payment terms",
          "description": "Published prices in USD: per-job checks (supplier verification, inspection per man-day, basic factory audit), commission bands for a full order engagement, the monthly retainer, worked examples, exclusions, travel and payment conditions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
