        {
          "name": "hemmabo_search_properties",
          "title": "Search Properties",
          "description": "Search available vacation rental properties by location and travel dates. Use when the user wants to find or browse places to stay. Discovery only, and price-free: call vrp_get_verified_stay_offer with the host domain and same dates before the final answer so the client can render the verified stay offer widget; the price and the signed booking link come only from that offer. Do NOT use when the user already has a propertyId or host domain. Returns propertyId, host domain, the host's booking_url, live availability and capacity. Parameters combine as one filter with guests and the checkIn/checkOut range (checkIn strictly before checkOut): region matches broadly against region, city, and country names, while country matches the country field alone — omit both and the search spans every published property. Capacity misses are excluded; date-unavailable matches return separately in unavailableMatches with up to three alternative windows. Booking and payment happen only on the host's own domain, at the signed direct_booking_url. The agent never books, pays, cancels or changes a booking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "checkIn": {
                "description": "Arrival date in ISO 8601 calendar format YYYY-MM-DD (e.g. '2026-07-15'). Must be today or later in the property's timezone. Must be strictly before checkOut; together they define the stay length used for pricing and availability.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "checkOut": {
                "description": "Departure date in ISO 8601 calendar format YYYY-MM-DD (e.g. '2026-07-22'). Must be strictly after checkIn on the same calendar. The guest does not stay the departure night.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "country": {
                "description": "Country name to filter by (e.g. 'Sweden', 'Italy', 'Morocco'). Partial case-insensitive match against the country field. Optional — omit both region and country and the search spans every published property.",
                "type": "string"
              },
              "guests": {
                "description": "Total guest count as a positive integer (e.g. 2, 4, 6). Used for capacity filtering and staircase pricing tiers. Properties with maxGuests below this value are excluded from search results.",
                "minimum": 1,
                "type": "integer"
              },
              "region": {
                "description": "Region, area, or destination to search within (e.g. 'Skåne', 'Kävlinge', 'Toscana', 'Bavaria'). Partial case-insensitive match against region, city, and country. Optional — omit both region and country and the search spans every published property.",
                "type": "string"
              }
            },
            "required": ["checkIn", "checkOut", "guests"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "checkIn": {
                "description": "Echoed check-in date (YYYY-MM-DD).",
                "type": "string"
              },
              "checkOut": {
                "description": "Echoed check-out date (YYYY-MM-DD).",
                "type": "string"
              },
              "error": {
                "description": "Present only when isError=true.",
                "type": "string"
              },
              "guests": {
                "description": "Echoed guest count.",
                "type": "integer"
              },
              "properties": {
                "description": "Available properties matching the search criteria: each host domain and its own booking URL, without a price.",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "available": {
                      "description": "Always true in search results because unavailable properties are filtered out.",
                      "type": "boolean"
                    },
                    "booking_url": {
