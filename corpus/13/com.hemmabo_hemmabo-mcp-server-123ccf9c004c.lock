        {
          "name": "vrp_verify_node",
          "title": "Verify Vacation Rental Node",
          "description": "Verify that a vacation-rental host domain is a valid Vacation Rental Protocol (VRP) node before trusting it. Reads the domain's .well-known/vacation-rental.json and JWKS. Read-only trust check: no availability, pricing, booking, or payment — do NOT use it to answer those questions. Use when a host domain arrives from outside search (user-typed or third-party); domains returned by hemmabo_search_properties can go straight to vrp_get_verified_stay_offer. On success, call vrp_get_verified_stay_offer with the same domain and stay dates. The single input is the host domain as a bare hostname (no scheme or path); public domains only — IPs, ports, and local/private hostnames are refused. Pass the node's canonical domain exactly — www and apex are distinct identities, and verification fails when the domain's declared canonical_domain differs from the one you passed. Verification reads that domain's own .well-known and JWKS, so the result is only as trustworthy as the exact domain you pass. Booking and payment happen only on the host's own domain, at the signed direct_booking_url. The agent never books, pays, cancels or changes a booking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Host-owned domain without protocol or path (e.g. 'villaakerlyckan.se', 'myvilla.it'). Invalid: 'https://...', paths, ports, or booking URLs.",
                "pattern": "^(?!-)(?:[a-zA-Z0-9-]{1,63}\\.)+[a-zA-Z]{2,63}$",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "discovery_url": {
                "description": "The .well-known vacation-rental discovery URL read from the host domain.",
                "format": "uri",
                "type": "string"
              },
              "domain": {
                "description": "Echoed canonical host domain that was checked.",
                "type": "string"
              },
              "error": {
                "description": "Present when verified=false or the node cannot be checked.",
                "type": "string"
              },
              "jwks_url": {
                "description": "Host-domain JWKS URL containing the Ed25519 public keys used to verify signed offers.",
                "format": "uri",
                "type": "string"
              },
              "protocol": {
                "description": "Protocol identifier discovered on the host domain. A valid node declares exactly 'vacation-rental-protocol' in its .well-known/vacation-rental.json protocol field, and that is the value returned here.",
                "type": "string"
              },
              "protocol_version": {
                "description": "VRP version declared by the host discovery document.",
                "type": "string"
              },
              "signing": {
                "additionalProperties": true,
                "description": "Summary of accepted signing algorithms, key ids, and signing-key checks.",
                "type": "object"
              },
              "verified": {
                "description": "True only when discovery, JWKS, signing metadata, and verified-offer endpoint checks pass.",
                "type": "boolean"
              },
              "verified_stay_offer_url": {
                "description": "Host-domain endpoint template or URL used to request signed verified stay offers.",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["domain", "verified"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Verify Vacation Rental Node"
          },
