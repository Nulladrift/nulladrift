        {
          "name": "vrp_get_verified_stay_offer",
          "title": "Get Verified Stay Offer",
          "description": "Use this tool for the final, host-signed price and booking link for exact dates — the only numbers an agent may quote. For a bare availability yes/no on a propertyId, hemmabo_check_availability is lighter and sufficient. Fetch, verify, and render a live host-domain signed VRP stay offer for exact dates and guest count. Verifies Ed25519 JWS against domain JWKS. Call after hemmabo_search_properties returns a host domain, or after vrp_verify_node confirms a domain from outside search, always before quoting final price or a booking link. Read-only: must not lock a quote, create a booking or collect guest details. Route booking only to the signed direct_booking_url. The parameters work as a set: pass the same domain, checkIn, checkOut and guests the guest used at search; checkIn must be strictly before checkOut, and the resulting night count — not the dates themselves — drives the signed price and the host capacity check, so changing either date re-prices the offer. Always pass language as the guest's actual conversation language so the rendered widget matches the guest; it never affects the signed price or availability, only formatting. Booking and payment happen only on the host's own domain, at the signed direct_booking_url. The agent never books, pays, cancels or changes a booking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "checkIn": {
                "description": "Requested arrival date in YYYY-MM-DD format (e.g. '2026-11-14'). Must be strictly before checkOut. Use the same dates the guest requested in search.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "checkOut": {
                "description": "Requested departure date in YYYY-MM-DD format (e.g. '2026-11-17'). Must be strictly after checkIn. Guest does not stay the departure night.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "domain": {
                "description": "Host-owned domain without protocol or path (e.g. 'villaakerlyckan.se', 'myvilla.it'). Invalid: 'https://...', paths, ports, or booking URLs.",
                "pattern": "^(?!-)(?:[a-zA-Z0-9-]{1,63}\\.)+[a-zA-Z]{2,63}$",
                "type": "string"
              },
              "guests": {
                "description": "Total guest count as positive integer (e.g. 2, 4). Used by the host node for capacity validation and guest-tier pricing on the signed offer.",
                "minimum": 1,
                "type": "integer"
              },
              "language": {
                "description": "The guest's conversation language, as a BCP-47 tag (e.g. 'en', 'sv', 'de', 'sv-SE') — ALWAYS pass this, matching the language the guest is chatting in, so the rendered widget's labels, dates and currency formatting match the guest instead of falling back to the rendering client's own locale (which can silently disagree with the conversation). Never changes the signed price value or availability — only how it is displayed.",
                "type": "string"
              }
            },
            "required": ["checkIn", "checkOut", "domain", "guests"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "agent_citation": {
                "additionalProperties": true,
                "description": "Citation permission and safe-to-quote status derived from the signed offer.",
                "type": "object"
              },
              "agent_guardrails": {
                "additionalProperties": true,
                "description": "Rules the agent must follow when presenting or acting on this offer.",
                "type": "object"
              },
              "checkIn": {
                "description": "Echoed requested arrival date.",
                "type": "string"
              },
              "checkOut": {
                "description": "Echoed requested departure date.",
                "type": "string"
              },
              "domain": {
                "description": "Echoed host domain that issued the signed offer.",
                "type": "string"
              },
              "error": {
                "type": "string"
              },
              "fresh": {
                "description": "True when the signed offer is still within its validity/freshness window.",
                "type": "boolean"
              },
              "guests": {
                "description": "Echoed requested guest count.",
                "type": "integer"
              },
              "official_offer_summary": {
                "additionalProperties": true,
                "description": "Small signed-offer summary for agents to quote without inventing a price, a lower price, savings, availability, comparisons, or booking details.",
                "type": "object"
              },
              "payload_matches_offer": {
                "description": "True when the signed payload matches the structured offer returned to the agent.",
                "type": "boolean"
              },
              "signature": {
                "additionalProperties": true,
                "description": "Ed25519/JWS verification details, including key id and verification status.",
                "type": "object"
              },
              "verified": {
                "description": "True only when the host-domain offer signature and payload checks pass.",
                "type": "boolean"
              },
              "widget_media": {
                "additionalProperties": true,
                "description": "Images and media hydrated from the verified host discovery document for the ChatGPT widget.",
                "type": "object"
              }
            },
            "required": ["domain", "verified"],
            "type": "object"
          },
