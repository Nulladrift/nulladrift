      "serverInfo": {
        "name": "holidayfox",
        "title": "HolidayFox",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "HolidayFox lists independent UK holiday accommodation — farm stays, glamping, shepherd huts, caravan and camping pitches, and self-catering cottages.\n\nRules for using these tools:\n- Never state a price you have not got from get_quote. Prices vary by party size, length of stay and season, and many sites have minimum-stay and check-in-day rules.\n- Availability is not a booking. Nothing here holds dates; another guest can take them until payment completes.\n- Payment always happens on holidayfox.com. Give the guest the begin_checkout link and let them pay there. Never ask for card details, and never say a booking is confirmed unless the guest tells you they completed payment.\n- Some sites confirm instantly; others are request-to-book, where the owner confirms within about 24 hours and the card is only charged once accepted. Say which one applies.\n- Answer questions about a site from get_listing_details, not general knowledge; prices and rules change.\n- Call begin_checkout only once the guest has clearly said they want to book.\n- If the person is an accommodation owner or host asking what HolidayFox offers them (for example calendar sync with Airbnb, Booking.com or Pitchup), call get_host_features rather than the guest booking tools.\n- If dates are sold out, the site is request-to-book, or the guest has a question the details do not answer, offer to message the owner (message_owner). If the site is bookable for their dates, offer checkout instead. Only send with the guest’s name, email, and their explicit go-ahead — never invent contact details.\n- Guest reviews (get_reviews) are the honest source on what a site is like; use them rather than describing a site from your own impression.\n- Today's date matters: check the current date before interpreting \"next weekend\" or \"August\".",
      "tools": [
        {
          "name": "begin_checkout",
          "title": "Open HolidayFox checkout",
          "description": "Produce the secure HolidayFox checkout link for a quote. The guest opens the link and pays on holidayfox.com. This tool takes no payment and does not confirm a booking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accommodationTypeId": {
                "type": "string"
              },
              "checkinDate": {
                "description": "YYYY-MM-DD — must match the quote.",
                "type": "string"
              },
              "checkoutDate": {
                "description": "YYYY-MM-DD — must match the quote.",
                "type": "string"
              },
              "destinationId": {
                "type": "string"
              },
              "numAdults": {
                "type": "integer"
              },
              "numChildren": {
                "type": "integer"
              },
              "numInfants": {
                "type": "integer"
              },
              "quoteId": {
                "description": "The quote id returned by get_quote.",
                "type": "string"
              }
            },
            "required": ["accommodationTypeId", "checkinDate", "checkoutDate", "destinationId", "numAdults", "quoteId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Open HolidayFox checkout"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eb5c358b0b62e5332c1da01f2ebdaa158c71ad8effbb51bbd4e9f1cffe794f08"
        },
        {
          "name": "check_availability",
          "title": "Check HolidayFox availability",
          "description": "Check which dates are free. With destinationId alone it returns the site-wide availability calendar. With accommodationTypeId it returns per-date availability and the party-adjusted nightly price for that one unit. Dates are YYYY-MM-DD and the window is limited to 120 days. Returns availability and nightly prices only; the full stay total comes from get_quote.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accommodationTypeId": {
                "description": "Optional — narrows to one unit type.",
                "type": "string"
              },
              "destinationId": {
                "type": "string"
              },
              "endDate": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "numAdults": {
                "type": "integer"
              },
              "numChildren": {
                "type": "integer"
              },
              "numDogs": {
                "description": "Dogs in the party. Affects availability at dog-friendly sites; not a separate charge here.",
                "type": "integer"
              },
              "numInfants": {
                "type": "integer"
              },
              "startDate": {
                "description": "YYYY-MM-DD",
                "type": "string"
              }
            },
            "required": ["destinationId", "endDate", "startDate"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check HolidayFox availability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bdbffb53ba41e5d8dfd359474d2b9f16aed3268469b63bdf6d86ecb5bc9e573d"
        },
        {
          "name": "get_host_features",
          "title": "HolidayFox features for accommodation owners",
          "description": "What HolidayFox offers accommodation owners and hosts (not guests): the booking widget, live chat, websites, listings and calendar sync with Airbnb, Booking.com, Pitchup and other booking sites, including one export link per site, linked whole-site and exclusive-use bookings, 15-minute imports and nightly link tests. Returns features, setup steps, FAQs and contact details.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "topic": {
                "description": "all (default) or calendar_sync for the calendar sync detail only.",
                "enum": ["all", "calendar_sync"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "HolidayFox features for accommodation owners"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:36705afeba486913c21b83615d85027e9917cbe0a72d242a06dbb96bb466aee0"
        },
        {
          "name": "get_listing_details",
          "title": "Get HolidayFox listing details",
          "description": "Full facts about one HolidayFox destination: description, location, amenities, restrictions, check-in/out times, cancellation policy, whether it confirms instantly or by request, and every accommodation type with its size, sleeps, minimum stay and price. Data is live from the HolidayFox booking system.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "checkinDate": {
                "description": "YYYY-MM-DD. With checkoutDate, prices each unit for that stay.",
                "type": "string"
              },
              "checkoutDate": {
                "description": "YYYY-MM-DD.",
                "type": "string"
              },
              "destinationId": {
                "description": "From search_stays, e.g. \"dest-MGaRjAwxGUrG\".",
                "type": "string"
              },
              "numAdults": {
                "type": "integer"
              },
              "numChildren": {
                "type": "integer"
              },
              "numDogs": {
                "description": "Dogs in the party. Affects availability at dog-friendly sites; not a separate charge here.",
                "type": "integer"
              },
              "numInfants": {
                "type": "integer"
              }
            },
            "required": ["destinationId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get HolidayFox listing details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9947234414264d325678d6901809e37654b4c5e7b1a1155488f43087d4d4ef1b"
        },
        {
          "name": "get_quote",
          "title": "Price a HolidayFox stay",
          "description": "Get the authoritative total price for a specific stay directly from the HolidayFox booking system, including any length-of-stay discount and any optional extras passed in `addons`. Returns a quote id for begin_checkout, so the checkout total matches this quote, extras included. Does not hold the dates or make a booking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accommodationTypeId": {
                "description": "From search_stays or get_listing_details.",
                "type": "string"
              },
              "addons": {
                "description": "Optional extras to include, from list_addons. The quoted total includes them.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "productId": {
                      "type": "string"
                    },
                    "quantity": {
                      "description": "Default 1.",
                      "type": "integer"
                    }
                  },
                  "required": ["productId"],
                  "type": "object"
                },
                "type": "array"
              },
              "checkinDate": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "checkoutDate": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "numAdults": {
                "type": "integer"
              },
              "numChildren": {
                "type": "integer"
              },
              "numInfants": {
                "type": "integer"
              },
              "quantity": {
                "description": "Number of units, default 1.",
                "type": "integer"
              }
            },
            "required": ["accommodationTypeId", "checkinDate", "checkoutDate", "numAdults"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Price a HolidayFox stay"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:28ef8a3061c9d47b61a646b2f56ec6eef203a03d3a9fb356db6761c72e5573eb"
        },
        {
          "name": "get_reviews",
          "title": "Read HolidayFox guest reviews",
          "description": "Read published guest reviews for a HolidayFox destination — star ratings, what guests said, and any reply from the owner. Returns an average rating and the most recent reviews.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "destinationId": {
                "description": "From search_stays or get_listing_details.",
                "type": "string"
              },
              "limit": {
                "description": "Max reviews to return, 1–10, default 5.",
                "type": "integer"
              }
            },
            "required": ["destinationId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read HolidayFox guest reviews"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4f57b32514707dbdd9fd6626be413387dda61f9987a3dcc9ae5598cdd5a0ba7e"
        },
        {
          "name": "list_addons",
          "title": "List HolidayFox extras",
          "description": "List the optional extras a specific accommodation type offers — things like firewood, a hot-tub session, an extra guest, or breakfast — with their prices. Returns product ids accepted by get_quote as `addons`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accommodationTypeId": {
                "description": "From search_stays or get_listing_details.",
                "type": "string"
              },
              "destinationId": {
                "type": "string"
              }
            },
            "required": ["accommodationTypeId", "destinationId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List HolidayFox extras"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3da98207679d62c9add17f188e4f41011d3df2f221e357270a9ad4bf5899919d"
        },
        {
          "name": "message_owner",
          "title": "Send a message to the owner",
          "description": "Send a guest's enquiry to the site owner by email; the owner replies to the guest directly. Suited to sold-out dates, questions the listing details leave open, and request-to-book sites. Requires the guest's name, email address and message.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "checkinDate": {
                "description": "Optional YYYY-MM-DD the enquiry is about.",
                "type": "string"
              },
              "checkoutDate": {
                "description": "Optional YYYY-MM-DD.",
                "type": "string"
              },
              "destinationId": {
                "description": "The site the enquiry is about.",
                "type": "string"
              },
              "guestEmail": {
                "description": "The guest's email, so the owner can reply. Must be a real address the guest gave you.",
                "type": "string"
              },
              "guestName": {
                "description": "The guest's name, as they gave it.",
                "type": "string"
              },
              "message": {
                "description": "The enquiry in the guest’s words — dates, party, and the specific question.",
                "type": "string"
              },
              "numAdults": {
                "type": "integer"
              },
              "numChildren": {
                "type": "integer"
              },
              "phone": {
                "description": "Optional phone number, only if the guest offered it.",
                "type": "string"
              }
            },
            "required": ["destinationId", "guestEmail", "guestName", "message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send a message to the owner"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b01dfc0722314fd1906240923ff07cbad2959882525ac0d06fd2b4e08d7745c0"
        },
        {
          "name": "search_stays",
          "title": "Search HolidayFox stays",
          "description": "Search HolidayFox for UK holiday accommodation — farm stays, glamping, shepherd huts, caravan and camping pitches, and self-catering cottages. Filter by area and by amenity/audience tags. When checkinDate and checkoutDate are supplied, each result carries the live total price for that exact stay and only genuinely bookable options are counted. Returns destination ids used by the other tools.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "after": {
                "description": "Pagination cursor from a previous search.",
                "type": "string"
              },
              "area": {
                "description": "Region key, lowercase and hyphenated, e.g. \"cornwall\", \"north-devon\", \"peak-district\".",
                "type": "string"
              },
              "checkinDate": {
                "description": "YYYY-MM-DD. Supply with checkoutDate for live stay pricing.",
                "type": "string"
              },
              "checkoutDate": {
                "description": "YYYY-MM-DD.",
                "type": "string"
              },
              "limit": {
                "description": "1–25, default 10.",
                "type": "integer"
              },
              "numAdults": {
                "description": "Default 2.",
                "type": "integer"
              },
              "numChildren": {
                "type": "integer"
              },
              "numDogs": {
                "description": "Dogs in the party. Affects availability at dog-friendly sites; not a separate charge here.",
                "type": "integer"
              },
              "numInfants": {
                "type": "integer"
              },
              "tags": {
                "description": "Optional facet filters, e.g. [{\"key\":\"hot-tub\",\"category\":\"AMENITY\"}].",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "category": {
                      "enum": ["ACTIVITY", "AMENITY", "AUDIENCE", "DESCRIPTION", "LOCATION", "ACCOMMODATION", "RESTRICTION"],
                      "type": "string"
                    },
                    "key": {
                      "type": "string"
                    }
                  },
                  "required": ["category", "key"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search HolidayFox stays"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:501f23d37122ce49865d426f9b9184381f25221717ebeac7e5cb58da5c0d910d"
        }
      ],
