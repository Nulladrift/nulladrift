      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "SendFaxFast sends faxes. get_fax_price shows the price for a destination. Documents: ChatGPT passes files attached in the chat to send_fax as the \"file\" parameter. In other apps, create_upload_link returns a one-time upload_url; after the user has uploaded the file there, send_fax accepts the upload_id. A direct public HTTPS link to a PDF works as document_url. Each send_fax result states whether the fax was sent, scheduled or is awaiting payment. Without an API key, send_fax returns a Stripe checkout link (pay-per-fax) and the fax is only sent after the user has paid. With a Mini/Flex subscription key (sff_..., sent as \"Authorization: Bearer sff_...\" or ?key=sff_... in the connector URL) send_fax sends directly from the subscription quota. send_fax transmits a real fax to the given number.",
      "tools": [
        {
          "name": "create_upload_link",
          "title": "Create upload link",
          "description": "Creates a secure one-time upload link (valid 30 minutes) for the fax document (PDF, JPG or PNG, max. 10 MB) – upload from phone or computer by drag & drop, file picker or camera. For files on the user's device, or chat attachments that are not available as send_fax's \"file\" parameter. The user opens upload_url and uploads the file; send_fax then accepts the returned upload_id. Creating a link sends nothing and costs nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
