        {
          "name": "get_fax_price",
          "title": "Check fax price",
          "description": "Calculate the pay-per-fax price for sending a fax to a specific number. No API key required. Supported: USA, Canada, Australia, New Zealand and 39 more countries (same list as sendfaxfast.com); premium-rate numbers are not supported.",
          "inputSchema": {
            "properties": {
              "fax_number": {
                "description": "Recipient fax number in E.164 format (e.g. +12125550100 for USA, +61212345678 for Australia, +911123456789 for India)",
                "type": "string"
              },
              "pages": {
                "default": 1,
                "description": "Number of pages in the document (default: 1)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
