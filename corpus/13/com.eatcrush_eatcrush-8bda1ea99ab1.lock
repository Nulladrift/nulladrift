      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "eatcrush",
        "title": "Eatcrush",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Eatcrush finds dishes on Sydney (Australia) restaurant and cafe menus and shows which are free of allergens (gluten, dairy, nuts, egg, soy, sesame, shellfish, fish ...), either free by default or able to be made free on request. search_dishes answers questions like 'gluten free pasta warriewood' or 'nut free thai inner west'. get_venue gives one venue's menus, dishes, allergen notes, diner ratings and links. list_allergen_free ranks venues by how many dishes are free of one allergen. compare puts one kind of dish across menus (cheapest or nearest gluten-free burgers) or named venues side by side, by printed price, allergen status and distance. Every answer says the day the menu was read and links to the venue page. Menus change and allergen status is read from them, not verified: always tell the person to confirm with the venue, especially for coeliac disease or anaphylaxis. allergens.free / option / contains are the venue's own word (printed on its menu or stated by it); allergens.likelyContains is only our guess from the listed ingredients, so say it is a guess. A family in none of the lists is not stated: never call it free or safe. No account or key is needed.",
      "tools": [
        {
          "name": "compare",
          "title": "Compare dishes or venues",
          "description": "Compare one kind of dish across Sydney menus, or named venues side by side, by printed price, allergen status and distance. Examples: dish_type 'burger' with free_of ['gluten'] near 'Manly' (cheapest or nearest gluten-free burgers, with the price spread); venues ['Grill'd', 'Betty's Burgers'] with dish_type 'burger' (how many burgers each serves, how many fit, the cheapest). Prices are only what the menu prints, never estimated. Every answer links the same comparison as a table on the site (page).",
          "inputSchema": {
            "properties": {
              "dish_type": {
                "description": "A kind of dish: burger, pizza, pasta, curry, sushi, steak, dumplings, tacos, dessert, breakfast, ... Required unless venues are given.",
                "type": "string"
              },
              "free_of": {
                "description": "Optional. Allergens or diets every dish must be free of (by default or on request): gluten, dairy, nuts, egg, soy, sesame, shellfish, fish, vegetarian, vegan; 'coeliac' means gluten.",
                "items": {
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "limit": {
                "description": "Dishes to return. Default 12.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Optional. Highest printed price in AUD dollars; dishes with no printed price are left out when set.",
                "maximum": 500,
                "minimum": 1,
                "type": "number"
              },
              "near": {
                "description": "Optional place name: a Sydney suburb or region, such as 'Manly' or 'Inner West', to measure distance from. Coordinates as 'lat,lng' also work.",
                "type": "string"
              },
              "sort": {
                "description": "Optional. price (default, cheapest first), distance (needs near; default when near is given) or fit (free by default before on request).",
                "enum": ["price", "distance", "fit"],
                "type": "string"
              },
              "venues": {
                "description": "Optional. Two or more venue names to compare side by side ('Grill'd', 'Betty's Burgers'). The nearest branch to `near` is used for chains.",
                "items": {
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare dishes or venues"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:363d4f94b872595da595e97dc7c6715e5728671b44285a6b9cc30f4188696747"
        },
        {
          "name": "get_venue",
          "title": "Get venue",
          "description": "Everything known about one Sydney venue: its menus and dishes with allergen status per dish, venue-wide allergen notes (dedicated fryer, shared prep), how many dishes are free of each allergen, diner ratings for coeliac and allergy friendliness, opening state, address, booking and map links, and the pages the menus were read from with dates. Use the id or slug returned by search_dishes or list_allergen_free.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Venue id from a search result.",
                "type": "integer"
              },
              "slug": {
                "description": "Venue slug from a search result, e.g. 'pinocchio-cremorne', or its page URL.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get venue"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:21e1c53605e8fff7c16a3f293470aeed0029f18ff27fcaade02a2a028e38b500"
        },
        {
          "name": "list_allergen_free",
          "title": "List allergen-free venues",
          "description": "Rank Sydney venues by how many dishes are free of one allergen (free by default, or able to be made free), optionally within a region or suburb and for one kind of dish. Examples: family 'gluten' in 'Northern Beaches'; family 'nuts' with dish_type 'dessert'; family 'dairy' in 'Inner West' with dish_type 'pasta'. Returns venues with their counts, links and the day each menu was read, plus example dishes when a dish type is given.",
          "inputSchema": {
            "properties": {
              "dish_type": {
                "description": "Optional. A kind of dish: pasta, pizza, burger, sandwich, salad, soup, curry, noodles, dumplings, sushi, rice, steak, seafood, breakfast, dessert, ...",
                "type": "string"
              },
              "family": {
                "description": "The allergen: gluten (coeliac), dairy, nuts, peanut, treenut, egg, soy, sesame, shellfish, fish, seafood, lupin, sulphite; or the diets vegetarian, vegan.",
                "type": "string"
              },
              "limit": {
                "description": "Venues to return. Default 10.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "region": {
                "description": "Optional. A Sydney region or suburb: 'Northern Beaches', 'Inner West', 'Parramatta', 'Manly'.",
                "type": "string"
              }
            },
            "required": ["family"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List allergen-free venues"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:25df963e7606e479f9d79caadda6a88a588c0e890dbbf491334d52bfb0209bf9"
        },
        {
          "name": "search_dishes",
          "title": "Search dishes",
          "description": "Search dishes on Sydney restaurant and cafe menus and see which are free of allergens. Write the query the way a person would say it: 'gluten free pasta warriewood', 'nut free thai inner west', 'coeliac friendly brunch bondi', 'vegan dumplings surry hills'. Allergen, diet and place words are understood, and so are things a table needs from the venue: 'dog friendly', 'kid friendly', 'outdoor seating', 'private room for 12', 'set menu', 'group bookings', 'harbour view', 'rooftop', 'takes bookings', 'walk in only', 'baby change', 'wheelchair accessible'. Those are hard filters (all of them must hold, as on the website): only venues whose own data says yes are returned, a venue that has not said is never counted, and a party size with a private room leaves out rooms that print a smaller capacity. Each dish shows its status per allergen (free by default, or can be made free with what to ask for, such as 'GF pasta +$4'), the venue, a link, and the day the menu was read.",
          "inputSchema": {
            "properties": {
              "accredited": {
                "description": "Optional. If true, only venues with evidence-backed Coeliac Australia accreditation (the same as accredited=1 on /api/search). The words 'accredited', 'coeliac accredited' or 'CA accredited' in query also apply this filter and are removed from text match.",
                "type": "boolean"
              },
              "exact": {
                "description": "Skip spelling correction.",
                "type": "boolean"
              },
              "free_of": {
                "description": "Optional. Allergens every dish must be free of, free by default or able to be made free: gluten, dairy, nuts, peanut, treenut, egg, soy, sesame, shellfish, fish, seafood, lupin, sulphite. 'coeliac' means gluten. Diets vegetarian and vegan also work.",
                "items": {
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "limit": {
                "description": "Dishes to return. Default 12.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "near": {
                "description": "Optional place name: a Sydney suburb or region, such as 'Manly' or 'Inner West'. Suburbs and regions mean within 4 km, nearest first. Coordinates as 'lat,lng' also work.",
                "type": "string"
              },
              "query": {
                "description": "What to eat, in plain words, including allergens and place. Example: 'gluten free pizza manly'.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search dishes"
          },
          "behavior": {
            "destructive": false,
