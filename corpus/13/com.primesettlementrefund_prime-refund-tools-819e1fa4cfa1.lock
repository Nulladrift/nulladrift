{
  "lockfileVersion": 2,
  "subjects": {
    "com.primesettlementrefund/prime-refund-tools": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.primesettlementrefund.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "com.primesettlementrefund/prime-refund-tools",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "check_prime_refund_eligibility",
          "description": "Check Amazon Prime FTC settlement refund eligibility and map to refund phase (Phase 1, 2, or 3). Matches primesettlementrefund.com criteria.",
          "inputSchema": {
            "properties": {
              "benefits_used": {
                "description": "Level of Prime benefits actually used",
                "enum": ["none", "some", "substantial"],
                "type": "string"
              },
              "failed_cancellation": {
                "description": "Whether cancellation was attempted and failed/confused",
                "enum": ["yes", "no", "unsure"],
                "type": "string"
              },
              "join_period": {
                "description": "When Prime was joined: 'pre' (Before June 2019), '19_23' (June 2019 - June 2023), or 'post' (After June 2023)",
                "enum": ["pre", "19_23", "post"],
                "type": "string"
              }
            },
            "required": ["benefits_used", "failed_cancellation", "join_period"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7c2bbe38fd368a1bcf09da4eb21d1cf9e0b2c816d915c3e7644374479d9f3c77"
        },
        {
          "name": "estimate_prime_refund_amount",
          "description": "Estimate eligible Amazon Prime settlement refund payment amount ($51 standard, up to $200 Phase 4 top-up) and scam alert verification.",
          "inputSchema": {
            "properties": {
              "is_individual": {
                "default": true,
                "description": "Individual subscriber claimant",
                "type": "boolean"
              },
              "phase": {
                "default": "general",
                "description": "Refund phase (defaults to general)",
                "enum": ["phase_1", "phase_2", "phase_3", "phase_4", "general"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ed31fa319cc97f7526fce5cb5ca74afd6701c7711a0304f491a0c6a0a5bf0715"
        },
        {
          "name": "get_prime_refund_deadline_info",
          "description": "Get authoritative claim deadlines, official communication channels, and fraud prevention guidance for the Prime FTC settlement.",
          "inputSchema": {
            "properties": {
              "topic": {
                "default": "all",
                "description": "Topic to retrieve (defaults to all)",
                "enum": ["deadlines", "channels", "scam_warnings", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9547bf2bd2792dbfa1071ddd6f16e81d7cca60cd93d4683c0c5aa5fb024053c5"
        }
      ],
      "digest": "sha256:5ea4e24569ffd2a5c8c0b9c06f5b08ef801668636dcc32417b71e082c4dbbae9"
    }
  }
}
