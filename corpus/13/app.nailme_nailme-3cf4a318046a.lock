{
  "lockfileVersion": 2,
  "subjects": {
    "app.nailme/nailme": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.nailme.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "nailme-booking",
        "title": "NailMe booking",
        "version": "1.0.0",
        "websiteUrl": "https://www.nailme.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "NailMe lists nail artist studios with online booking (manicure, gel and acrylic nails, nail art, pedicure and foot care, lashes and brows). Appointments: search_studios → get_studio → find_free_slots → prepare_booking. Courses and training sessions with limited seats (nails and hair only): find_courses; get_studio lists a studio's upcoming courses too. Give the user the confirm_url of a course. Nothing is booked by these tools: always give the user the confirm_url so they confirm themselves. Times are in the studio time zone.",
      "tools": [
        {
          "name": "find_courses",
          "title": "Find courses",
          "description": "Upcoming courses and training sessions with limited seats near a location or in a city, in-person ones nearest first, then by date. Online sessions are not limited by location. Only sessions still open for booking: canceled and past sessions are left out, a full session has seats.free 0 and waitlist true. Each session lists its dates, price or deposit, certificate and free seats. Nothing is booked: give the user the confirm_url. Times are in the studio time zone.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City name, used when no coordinates are known",
                "type": "string"
              },
              "format": {
                "enum": ["in_person", "online"],
                "type": "string"
              },
              "from_date": {
                "description": "YYYY-MM-DD: only courses that last until this day or later",
                "type": "string"
              },
              "latitude": {
                "type": "number"
              },
              "level": {
                "description": "beginner, advanced or master",
                "enum": ["beginner", "advanced", "master"],
                "type": "string"
              },
              "limit": {
                "description": "Max courses, default 10, at most 30",
                "type": "integer"
              },
              "longitude": {
                "type": "number"
              },
              "query": {
                "description": "Words the course title or description must contain, e.g. \"gel\"",
                "type": "string"
              },
              "radius_km": {
                "description": "Search radius for in-person courses, default 25",
                "type": "number"
              },
              "to_date": {
                "description": "YYYY-MM-DD: only courses that start on or before this day",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e2bf01e84907c85ac7641f429f5d294d3c895640c0b037c096aa5d049c717d3e"
        },
        {
          "name": "find_free_slots",
          "title": "Free times",
          "description": "Free start times for one service, in the studio's time zone. Days from tomorrow up to 90 days ahead, at most 14 days per call. A time with a promotion field has a discount of the studio (percent, discounted price); it applies automatically when booked.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "Number of days, default 7, at most 14",
                "type": "integer"
              },
              "earliest_time": {
                "description": "HH:mm, only times starting at or after",
                "type": "string"
              },
              "employee_id": {
                "description": "Only this employee (group studios)",
                "type": "string"
              },
              "from_date": {
                "description": "YYYY-MM-DD, default tomorrow",
                "type": "string"
              },
              "latest_time": {
                "description": "HH:mm, only times starting at or before",
                "type": "string"
              },
              "service_id": {
                "type": "string"
              },
              "studio_id": {
                "description": "studio_id from search_studios (or the handle from a profile link)",
                "type": "string"
              }
            },
            "required": ["service_id", "studio_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:25b775921f7af69b8dacbb8d54e627d3bda28c9daf4ed93bc782bc56e7256a3c"
        },
        {
          "name": "get_studio",
          "title": "Studio details and services",
          "description": "Name, address, rating and the bookable services (id, duration, price) of one studio. Nail and hair studios also list their upcoming courses.",
          "inputSchema": {
            "properties": {
              "studio_id": {
                "description": "studio_id from search_studios (or the handle from a profile link)",
                "type": "string"
              }
            },
            "required": ["studio_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:02f433baccebe0a55083a7fdfbd5e2c2534acf212ba0bebc2451aefab950e2bf"
        },
        {
          "name": "prepare_booking",
          "title": "Prepare a booking",
          "description": "Checks that the time is still free and returns a confirm_url. Nothing is booked yet: the user opens the link, signs in and confirms (deposit and terms of the studio apply there).",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "employee_id": {
                "description": "Optional, group studios",
                "type": "string"
              },
              "service_id": {
                "type": "string"
              },
              "start_time": {
                "description": "HH:mm in the studio time zone",
                "type": "string"
              },
              "studio_id": {
                "description": "studio_id from search_studios (or the handle from a profile link)",
                "type": "string"
              }
            },
            "required": ["date", "service_id", "start_time", "studio_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9cefbd9a28962a5e0915c16f324d965adb570e379ffedd9b484b4d1b23728080"
        },
        {
          "name": "search_studios",
          "title": "Search studios",
          "description": "Find bookable nail artist studios on NailMe near a location or in a city, nearest first. Optionally only studios with a matching service.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City name, used when no coordinates are known",
                "type": "string"
              },
              "latitude": {
                "type": "number"
              },
              "limit": {
                "description": "Max studios, default 10, at most 20",
                "type": "integer"
              },
              "longitude": {
                "type": "number"
              },
              "radius_km": {
                "description": "Search radius around the coordinates, default 25",
                "type": "number"
              },
              "service_query": {
                "description": "Words the service name must contain, e.g. \"pedicure\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e449ce8ea2488ff3b19220ada15b7d04721cd87f4469f4b35018557fbef7b853"
        }
      ],
      "digest": "sha256:df174220c97ca6a49d204ade17f40f6a5348c6dd317e7fc4f3d2951ef927fafe"
    }
  }
}
