      },
      "instructions": "The Exercise Images library: 1 017 exercises, each with its own line drawing, a public PNG.\nfind_exercise returns one exercise for a name; list_exercises returns the exercises for a body part, an equipment or a pattern. In a client with MCP Apps, such as Claude, every call of either shows the person its result as a card of its own.\nshow_workout shows a session or a programme as one card, each exercise with its drawing; it matches each exercise's name to the library itself, as find_exercise does.\nThe images may be used anywhere, in an answer, a page, a program or print, with the credit \"Illustrations: exerciseimages.com\" linked to https://exerciseimages.com wherever a link is possible.",
      "tools": [
        {
          "name": "find_exercise",
          "title": "Find an exercise",
          "description": "The exercise for a name in English; word order, plurals, abbreviations such as db, kb and rdl, and a small misspelling are understood. A match is the exercise of that name, or the one it means when the name leaves out the equipment or a word such as biceps. Returns id, name, category, equipment, body part and the still's URL; where written, the pattern, the primary and secondary muscles, the cues and the common mistakes; and the URL of its guide page where it has one. When no exercise matches that closely, returns null and up to five exercises sharing words with the name. In a client with MCP Apps, such as Claude, every call shows the person its result as a card.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "name": {
                "description": "The exercise's name, such as goblet squat or db romanian deadlift.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find an exercise"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://exercise-images/drawings"
            },
            "ui/resourceUri": "ui://exercise-images/drawings"
          },
          "digest": "sha256:78496479aa59e799796f7fece9740c8e5521d842e2fdadd205259da7284597f0"
        },
        {
          "name": "list_exercises",
          "title": "List exercises",
          "description": "The exercises matching every filter given, at least one. Returns their count and, for each in the library's order, id, name and the still's URL. In a client with MCP Apps, such as Claude, every call shows the person its result as a card.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "bodyPart": {
                "description": "The body part.",
                "enum": ["back", "calves", "chest", "core", "forearms", "full-body", "glutes", "neck", "shoulders", "thighs", "upper-arms"],
                "type": "string"
              },
              "equipment": {
                "description": "The equipment.",
                "enum": ["ab-wheel", "barbell", "battle-rope", "bike", "bodyweight", "bosu", "cable", "dumbbell", "elliptical", "ez-bar", "foam-roller", "jump-rope", "kettlebell", "machine", "medicine-ball", "none", "parallettes", "resistance-band", "rower", "sandbag", "sled", "smith-machine", "stability-ball", "stair-climber", "suspension", "trap-bar", "treadmill", "weight-plate"],
                "type": "string"
              },
              "pattern": {
                "description": "The movement pattern.",
                "enum": ["squat", "hinge", "lunge", "push horizontal", "push vertical", "pull horizontal", "pull vertical", "carry", "knee extension", "knee flexion", "elbow flexion", "elbow extension", "wrist", "shoulder raise", "hip", "ankle", "neck", "trunk flexion", "rotation", "anti-extension", "anti-rotation", "anti-lateral", "jump", "run", "cardio", "mobility", "stretch"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List exercises"
