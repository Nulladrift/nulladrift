        {
          "name": "show_workout",
          "title": "Show a workout",
          "description": "Shows a training session, or a programme of several, as one card: each exercise with its drawing and what was prescribed, opening to its details when tapped. Exercises are named in English, in the call and on the card, and matched to the library's names, with word order, plurals, abbreviations and small misspellings understood; one that matches nothing is shown by its name with the closest exercises. Every field but an exercise's name is optional, so a plain list of exercises is a workout too. Returns the workout as text with each drawing's URL, and the exercises as JSON with their data and image URLs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "aim": {
                "description": "What the workout is for.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "duration_min": {
                "description": "The length in minutes.",
                "exclusiveMinimum": 0,
                "maximum": 1440,
                "type": "number"
              },
              "lang": {
                "description": "The language of the card's own words, such as headings, rounds and rest: en or sv, English for any other. Exercise names stay English.",
                "maxLength": 35,
                "type": "string"
              },
              "sessions": {
                "description": "One session, or a programme's sessions in order.",
                "items": {
                  "properties": {
                    "aim": {
                      "description": "What it is for.",
                      "maxLength": 300,
                      "minLength": 1,
                      "type": "string"
                    },
                    "cool_down": {
                      "description": "The cool-down, in blocks.",
                      "items": {
                        "properties": {
                          "format": {
                            "description": "How the block is done; the card groups a superset's or a circuit's exercises.",
                            "enum": ["straight_sets", "superset", "circuit", "intervals", "continuous", "drill", "mobility"],
                            "type": "string"
                          },
                          "iterations": {
                            "description": "Rounds of the block.",
                            "maximum": 100,
                            "minimum": 1,
                            "type": "integer"
                          },
                          "rest_sec": {
                            "description": "Rest between rounds, in seconds.",
                            "maximum": 3600,
                            "minimum": 0,
                            "type": "integer"
                          },
                          "steps": {
                            "description": "The block's exercises, in order.",
                            "items": {
                              "properties": {
                                "cue": {
                                  "description": "The coach's words on this exercise, shown when it is opened.",
                                  "maxLength": 300,
                                  "minLength": 1,
                                  "type": "string"
                                },
                                "distance_m": {
                                  "description": "Distance per set or interval, in metres.",
                                  "exclusiveMinimum": 0,
                                  "maximum": 1000000,
                                  "type": "number"
                                },
                                "load": {
                                  "description": "The load in the person's terms, such as 20 kg, 45 lb, bodyweight or a light band.",
                                  "maxLength": 60,
                                  "minLength": 1,
                                  "type": "string"
                                },
                                "move": {
                                  "description": "The exercise's name in English, shown as given.",
                                  "maxLength": 120,
                                  "minLength": 1,
                                  "type": "string"
                                },
                                "reps": {
                                  "anyOf": [
                                    {
                                      "maximum": 10000,
                                      "minimum": 1,
                                      "type": "integer"
                                    },
                                    {
                                      "maxLength": 40,
                                      "minLength": 1,
                                      "type": "string"
                                    }
                                  ],
                                  "description": "Reps per set: a number, or words such as 8 to 12 or 10 each side."
                                },
                                "rest_sec": {
                                  "description": "Rest between sets, in seconds.",
                                  "maximum": 3600,
                                  "minimum": 0,
                                  "type": "integer"
                                },
                                "sets": {
