      },
      "instructions": "Fibre Compare (fibrecompare.com) checks which fibre and broadband deals are available at a UK address.\n\ncheck_fibre_availability is the tool to use for any question about what broadband, fibre or full-fibre someone can get, what speeds are available, or which providers serve a UK postcode. Call it as soon as you have a postcode; do not ask for the full address first. If the user already gave a house number or name, pass it as `address` in the same call and the check is done for that exact premises.\n\nThe result is at postcode level unless an address was matched (address_level tells you which). A postcode-level result also includes `addresses`, the premises at that postcode, each with an address_key. Present the deals first; then, if it would help (for example the user wants to be sure, or wants to sign up), offer to narrow it to their address and call the tool again with `address_key` (or `address` text). Never require the address before showing results.\n\nBy default the top 5 deals are returned in fibrecompare.com's recommended order; total_deals says how many exist and view_more_url opens the full list on the website. Prices are in GBP per month; speeds are average download speeds in Mbps. Each deal has a deal_url on fibrecompare.com where the user can sign up. search and fetch exist only for clients that require that tool pair; prefer check_fibre_availability.\n\nEvery result carries a visitor_id. Pass it back as visitor_id on every later check_fibre_availability call in the same conversation so the user's checks and any deal they click are attributed to one visit; do not invent or alter it.\n\nDo not guess availability: if the tool returns no deals, say so and suggest checking with the exact address.",
      "tools": [
        {
          "name": "check_fibre_availability",
          "title": "Check fibre broadband availability",
          "description": "Check which fibre and broadband deals are available at a UK postcode (or exact address via UPRN/UDPRN) using fibrecompare.com. Returns providers, download speeds, monthly prices, contract lengths, key features and a sign-up link for each deal. Optionally filter by minimum speed, maximum price, provider or contract length.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "House number/name and optionally street, e.g. '12', 'Flat 3, 12', 'Rose Cottage'. If it matches one premises at the postcode the check is done at address level in this same call.",
                "maxLength": 120,
                "type": "string"
              },
              "address_key": {
                "description": "An address_key from a previous result's addresses list. Runs the check for that exact premises.",
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of deals to return (default 5). The full list is always available at view_more_url.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "max_contract_months": {
                "description": "Only return deals with a contract of at most this many months (0 = rolling/no contract).",
                "minimum": 0,
                "type": "integer"
              },
              "max_monthly_cost_gbp": {
                "description": "Only return deals costing at most this much per month in GBP.",
                "minimum": 0,
                "type": "number"
              },
              "min_download_mbps": {
                "description": "Only return deals whose average download speed is at least this many Mbps (e.g. 100, 500, 900).",
                "minimum": 0,
                "type": "number"
              },
              "postcode": {
                "description": "UK postcode to check, e.g. 'SW1A 1AA'. Spacing and case do not matter.",
                "maxLength": 10,
                "minLength": 5,
                "type": "string"
              },
              "provider": {
                "description": "Only return deals from providers whose name contains this text, e.g. 'BT', 'Hyperoptic'.",
                "type": "string"
              },
              "sort": {
                "description": "Ordering: 'recommended' (default; fibrecompare.com's editorial ranking), 'value' (cheapest effective monthly cost), 'price' (cheapest headline monthly cost), 'speed' (fastest first) or 'site' (backend order).",
                "enum": ["recommended", "value", "price", "speed", "site"],
                "type": "string"
              },
              "udprn": {
                "description": "Royal Mail Unique Delivery Point Reference Number, if known and no UPRN is available.",
                "type": "string"
              },
              "uprn": {
                "description": "Unique Property Reference Number for the exact premises, if known. Gives an address-level rather than postcode-level answer.",
                "type": "string"
              },
              "visitor_id": {
                "description": "The visitor_id from a previous result in this conversation. Reuse it so checks and deal clicks are attributed to the same visit. Omit on the first call.",
                "maxLength": 20,
                "type": "string"
              }
            },
            "required": ["postcode"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address_level": {
                "enum": ["premises", "postcode"],
                "type": "string"
              },
              "addresses": {
                "description": "For postcode-level results: the premises at this postcode. Pass one's address_key back to get an exact-address check.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "address": {
                      "type": "string"
                    },
                    "address_key": {
                      "type": "string"
                    }
                  },
                  "required": ["address", "address_key"],
                  "type": "object"
                },
                "type": "array"
              },
              "addresses_note": {
                "type": "string"
              },
              "deals": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "average_download_mbps": {
                      "type": ["number", "null"]
                    },
                    "contract_length_months": {
                      "type": ["number", "null"]
                    },
                    "cost_basis": {
                      "description": "Whether the cost figures come from fibrecompare's computed pricing (models price rises) or are a local estimate.",
                      "enum": ["backend", "estimated"],
                      "type": "string"
                    },
                    "data_allowance_gb": {
                      "type": ["number", "null"]
                    },
                    "deal_url": {
                      "type": "string"
                    },
                    "effective_monthly_cost_gbp": {
                      "type": ["number", "null"]
                    },
                    "estimated_speed": {
                      "type": ["string", "null"]
                    },
                    "extras": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "features": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "first_year_cost_gbp": {
                      "type": ["number", "null"]
                    },
                    "initial_cost_gbp": {
                      "type": ["number", "null"]
                    },
                    "initial_period_months": {
                      "type": ["number", "null"]
                    },
                    "monthly_cost_after_contract_gbp": {
                      "type": ["number", "null"]
                    },
                    "monthly_cost_gbp": {
                      "type": ["number", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "offer_ends": {
                      "type": ["string", "null"]
                    },
                    "pricing_summary": {
                      "type": ["string", "null"]
                    },
                    "product_id": {
                      "type": "number"
                    },
                    "provider": {
                      "type": "string"
                    },
                    "provider_accent_colour": {
                      "type": "string"
                    },
                    "provider_logo_url": {
                      "type": "string"
                    },
                    "provider_slug": {
                      "type": "string"
                    },
                    "qualification": {
                      "type": ["string", "null"]
                    },
                    "setup_cost_gbp": {
                      "type": ["number", "null"]
                    },
                    "speed_class": {
                      "type": ["string", "null"]
                    },
                    "technology": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "title": {
                      "type": "string"
                    },
                    "total_contract_cost_gbp": {
                      "type": ["number", "null"]
                    }
                  },
                  "required": ["average_download_mbps", "contract_length_months", "cost_basis", "data_allowance_gb", "effective_monthly_cost_gbp", "estimated_speed", "extras", "features", "first_year_cost_gbp", "initial_cost_gbp", "initial_period_months", "monthly_cost_after_contract_gbp", "monthly_cost_gbp", "name", "offer_ends", "pricing_summary", "product_id", "provider", "qualification", "setup_cost_gbp", "speed_class", "technology", "title", "total_contract_cost_gbp"],
                  "type": "object"
                },
                "type": "array"
              },
              "display_address": {
                "type": "string"
              },
              "postcode": {
                "type": "string"
              },
              "returned_deals": {
                "type": "number"
              },
              "total_deals": {
                "type": "number"
              },
              "udprn": {
                "type": "string"
              },
              "uprn": {
                "type": "string"
              },
              "view_more_url": {
                "description": "fibrecompare.com results page for this address, listing every available deal.",
                "type": "string"
              },
              "visitor_id": {
                "description": "Pass back as visitor_id on later calls in this conversation.",
                "type": "string"
              }
            },
            "required": ["address_level", "deals", "postcode", "returned_deals", "total_deals", "view_more_url"],
            "type": "object"
          },
