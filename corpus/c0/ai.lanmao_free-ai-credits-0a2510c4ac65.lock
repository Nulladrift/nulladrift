          "title": "Get offer",
          "description": "按 id 取一条免费额度的全部字段。Get all fields of one free AI credit offer by id.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              },
              "locale": {
                "enum": ["zh", "en", "ja", "ko", "es", "pt"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
