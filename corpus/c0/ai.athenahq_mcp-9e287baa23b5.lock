                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "has_unpublished_changes": {
                    "type": "boolean"
                  },
                  "id": {
                    "format": "uuid",
                    "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                    "type": "string"
                  },
                  "is_default": {
                    "type": "boolean"
                  },
                  "name": {
                    "type": "string"
                  },
                  "published_version": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "maximum": 9007199254740991,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "required": ["draft_version", "generation_status", "has_unpublished_changes", "id", "is_default", "name", "published_version"],
                "type": "object"
