      "tools": [
        {
          "name": "add_brand_facts",
          "description": "Add brand facts to a website's Knowledge Base in bulk (1-50 per call). Each fact runs the full ingestion pipeline (deduplication, approval gates, pillar routing); there is no way to force-approve. Returns one outcome per fact (approved | pending | duplicate; extensible) with the created fact id and the pillar it was filed under. Facts without a pillar_id are routed automatically and may land unfiled. A fact similar to facts already in the Knowledge Base is not added: its outcome is duplicate and lists them under matches, and the response carries a match_token. To resolve, call again with those facts, the match_token, one decision per listed match (approve, optionally with new text, or delete) and save_submitted (true adds the facts as written, false only applies the decisions).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "decisions": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "action": {
                      "enum": ["approve", "delete"],
                      "type": "string"
                    },
                    "claim_id": {
                      "type": "string"
                    },
                    "text": {
                      "maxLength": 2000,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["action", "claim_id"],
                  "type": "object"
                },
                "type": "array"
              },
              "facts": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "pillar_id": {
                      "format": "uuid",
                      "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                      "type": "string"
                    },
                    "source_url": {
                      "maxLength": 2048,
                      "type": "string"
                    },
                    "text": {
                      "maxLength": 2000,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["text"],
                  "type": "object"
                },
                "type": "array"
              },
              "match_token": {
                "maxLength": 200,
                "type": "string"
              },
              "save_submitted": {
                "type": "boolean"
              },
              "website_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["facts", "website_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "match_token": {
                "type": "string"
              },
              "outcomes": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "fact_id": {
                      "type": ["string", "null"]
                    },
                    "index": {
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "matches": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "created_at": {
                            "type": "string"
                          },
                          "first_party": {
                            "type": ["boolean", "null"]
                          },
                          "id": {
                            "type": "string"
                          },
                          "pillar_id": {
                            "type": ["string", "null"]
                          },
                          "pillar_name": {
                            "type": ["string", "null"]
                          },
                          "source_type": {
                            "enum": ["research", "upload", "content_hub"],
                            "type": "string"
                          },
                          "source_url": {
                            "type": ["string", "null"]
                          },
                          "status": {
                            "enum": ["pending", "approved"],
                            "type": "string"
                          },
                          "text": {
                            "type": "string"
                          }
                        },
                        "required": ["created_at", "first_party", "id", "pillar_id", "pillar_name", "source_type", "source_url", "status", "text"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "outcome": {
                      "enum": ["approved", "pending", "duplicate"],
                      "type": "string"
                    },
                    "pillar_id": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["fact_id", "index", "outcome", "pillar_id"],
                  "type": "object"
                },
                "type": "array"
              },
              "resolved": {
                "additionalProperties": false,
                "properties": {
                  "approved_fact_ids": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "pending_fact_ids": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "removed_fact_ids": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["approved_fact_ids", "pending_fact_ids", "removed_fact_ids"],
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Add brand facts"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
