                    "anyOf": [
                      {
                        "enum": ["default", "manual"],
                        "type": "string"
                      },
                      {
                        "format": "uuid",
                        "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                        "type": "string"
                      }
                    ],
                    "description": "One schedule: \"default\" or a custom/archived schedule UUID. Omit for Default, which includes all pre-cutover history and ad hoc runs. Schedules cannot be combined."
                  },
                  "start_date": {
                    "description": "Start of the date range, YYYY-MM-DD (UTC), inclusive. Required.",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "target_identifiers": {
                    "description": "Target identifier strings to filter responses to, as an array even for one value. The literal string \"no-identifier\" selects responses with no target identifier. Omit for all.",
