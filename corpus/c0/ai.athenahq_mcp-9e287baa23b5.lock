        {
          "name": "get_responses",
          "description": "Get LLM responses for a website. Shows how AI models answer queries, with sources, sentiment, and ranking data. Filter by whether a model used search queries or by text within those queries. For a variation-level export at volume, pair filters.variation_filter with include_response: false and compact_sources: true. That keeps the prompt, its variation, the model, the mentioned/cited flags and the cited domains while dropping the answer text, cutting each row to roughly a tenth of its size.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "compact_sources": {
                "description": "Replace the per-source `sources` objects with `source_domains`, a deduped, sorted list of cited root domains. Defaults to false. Use when you need which domains were cited but not their exact URLs.",
                "type": "boolean"
              },
              "filters": {
                "properties": {
                  "competitor_ids": {
                    "description": "Competitor UUIDs to filter to, as an array even for one id. Omit for all competitors.",
                    "items": {
                      "format": "uuid",
                      "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "end_date": {
                    "description": "End of the date range, inclusive. Date-only values include the UTC day through 23:59:59.999; timestamps keep their exact instant. Accepts YYYY-MM-DD, ISO 8601 timestamps (timezone omitted means UTC), English month names with a four-digit year, and unambiguous numeric dates separated by /, -, or .; ambiguous dates are rejected.",
                    "type": "string"
                  },
                  "has_search_queries": {
                    "description": "Filter by whether the model used at least one non-empty web or map search query.",
                    "type": "boolean"
                  },
                  "location_ids": {
                    "description": "Location UUIDs to filter to, as an array even for one id. The literal string \"no-location\" selects responses that ran without a location. Omit for all locations.",
                    "items": {
                      "anyOf": [
                        {
                          "format": "uuid",
                          "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                          "type": "string"
                        },
                        {
                          "const": "no-location",
                          "type": "string"
                        }
                      ]
                    },
                    "type": "array"
                  },
                  "models": {
                    "description": "AI models to include, as an array even for one model — e.g. [\"chatgpt\", \"perplexity\"]. Omit to include all models.",
                    "items": {
                      "enum": ["chatgpt", "perplexity", "gemini", "google_ai_overview", "copilot", "claude", "ai_mode", "grok", "deepseek", "meta_ai", "mistral"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "persona_ids": {
                    "description": "Persona UUIDs to filter to, as an array even for one id. Omit for all personas.",
                    "items": {
                      "format": "uuid",
                      "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "prompt_ids": {
                    "description": "Prompt UUIDs to filter to, as an array even for one id. Omit for all prompts.",
                    "items": {
                      "format": "uuid",
                      "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "prompt_status": {
                    "description": "Filter prompts by tracking status: \"active\" or \"paused\". Omit for both.",
                    "enum": ["active", "paused"],
                    "type": "string"
                  },
                  "prompt_tags": {
                    "description": "Prompt tag IDs to filter prompts by, as an array (list tags with get_prompt_tags). Omit for all tags.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "prompt_tags_operator": {
                    "description": "How prompt_tags combine: \"is_any_of\" matches prompts with any listed tag, \"has_all_of\" only prompts carrying every listed tag.",
                    "enum": ["is_any_of", "has_all_of"],
                    "type": "string"
                  },
                  "prompt_type": {
                    "description": "Filter prompts by type: \"branded\" (mentions the brand) or \"non_branded\". Omit for both.",
                    "enum": ["branded", "non_branded"],
                    "type": "string"
                  },
                  "schedule_id": {
                    "anyOf": [
                      {
                        "enum": ["default", "manual"],
                        "type": "string"
                      },
                      {
                        "format": "uuid",
                        "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                        "type": "string"
                      }
                    ],
                    "description": "One schedule: \"default\" or a custom/archived schedule UUID. Omit for Default, which includes all pre-cutover history and ad hoc runs. The retired \"manual\" token is accepted as an alias of \"default\". Schedules cannot be combined."
                  },
                  "search_query_text": {
                    "description": "Case-insensitive text to match within the web or map search queries used for a response.",
                    "type": "string"
                  },
                  "search_query_text_operator": {
                    "description": "How search_query_text matches: \"contains\" (default) or \"does_not_contain\".",
                    "enum": ["contains", "does_not_contain"],
                    "type": "string"
                  },
                  "start_date": {
                    "description": "Start of the date range. Required. Accepts YYYY-MM-DD, ISO 8601 timestamps (timezone omitted means UTC), English month names with a four-digit year, and unambiguous numeric dates separated by /, -, or .; ambiguous dates are rejected.",
                    "type": "string"
                  },
                  "target_identifiers": {
                    "description": "Target identifier strings to filter to, as an array even for one value. The literal string \"no-identifier\" selects responses with no target identifier. Omit for all.",
                    "items": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "const": "no-identifier",
                          "type": "string"
                        }
                      ]
                    },
                    "type": "array"
                  },
                  "variation_filter": {
                    "description": "Which prompt rows to include, as an array: \"prompt\" for base prompts, \"variation\" for generated variations, or both. Omit for both.",
                    "items": {
                      "enum": ["variation", "prompt"],
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["start_date"],
                "type": "object"
              },
              "include_response": {
                "description": "Include the full answer text on each row. Defaults to true. Set false to omit the `response` field entirely (the heaviest part of a row) when you only need which prompt/variation ran and how it scored.",
                "type": "boolean"
              },
              "page_num": {
                "minimum": 0,
                "type": "number"
              },
              "page_size": {
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "website_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["filters", "website_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "has_more": {
                "type": "boolean"
              },
              "notice": {
                "type": "string"
              },
              "page_num": {
                "type": "number"
              },
              "page_size": {
                "type": "number"
              },
              "responses": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "base_prompt": {
                      "type": "string"
                    },
                    "cited": {
                      "type": "boolean"
                    },
                    "competitors": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "id": {
                            "type": "string"
                          },
                          "name": {
                            "type": "string"
                          },
                          "position": {
                            "type": "number"
                          },
                          "url": {
                            "type": "string"
                          }
                        },
                        "required": ["id", "name", "position", "url"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "country": {
                      "type": ["string", "null"]
                    },
                    "created_at": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "mentioned": {
                      "type": "boolean"
                    },
                    "model": {
                      "type": "string"
                    },
                    "position": {
                      "type": ["number", "null"]
                    },
                    "prompt": {
                      "type": ["string", "null"]
                    },
                    "prompt_id": {
                      "type": "string"
                    },
                    "response": {
                      "type": "string"
                    },
                    "schedule": {
                      "anyOf": [
                        {
                          "const": "default",
                          "type": "string"
                        },
                        {
                          "format": "uuid",
                          "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                          "type": "string"
                        }
                      ]
                    },
                    "source_domains": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "sources": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
