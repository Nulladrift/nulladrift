                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "A teammate with analytics access on the website, as get_user_by_email or an earlier assignee.id gives it; null unassigns every page (chat tools send unassign true instead); absent leaves assignees as they are."
              },
              "check": {
                "description": "The check id of the issue, from the issue list.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "unassign": {
                "description": "true clears the assignee. Chat tools must use this: a null assignee_user_id is dropped as unspecified. Cannot be sent with an assignee_user_id.",
                "type": "boolean"
              },
              "website_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "work_status": {
                "description": "todo, in_progress or dismissed (not an issue).",
                "enum": ["todo", "in_progress", "dismissed"],
