            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "data": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "attribute_id": {
                      "type": "string"
                    },
                    "attribute_name": {
                      "type": "string"
