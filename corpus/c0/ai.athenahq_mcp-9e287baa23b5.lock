        {
          "name": "get_content_citation_prompts",
          "description": "For a single tracked content item, list every prompt whose AI responses cited it — with citations, citation %, and estimated impressions. Use after get_tracked_content to drill into which prompts a given URL is appearing for. This is CITED-BY, measured over the requested date range, not the targeting the page was written for: an empty prompts array means no AI response cited this URL in that window, which is expected for new or never-cited pages and is not missing data. For the prompts a page was written to target, read `prompts` on get_content_detail (or prompt_ids on list_content) — those come from the content record itself and do not depend on any citation having happened.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "content_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "filters": {
                "properties": {
                  "competitor_ids": {
                    "description": "Competitor UUIDs to filter to, as an array even for one id. Omit for all competitors.",
                    "items": {
                      "format": "uuid",
                      "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "end_date": {
                    "description": "End of the date range, inclusive. Date-only values include the UTC day through 23:59:59.999; timestamps keep their exact instant. Accepts YYYY-MM-DD, ISO 8601 timestamps (timezone omitted means UTC), English month names with a four-digit year, and unambiguous numeric dates separated by /, -, or .; ambiguous dates are rejected.",
                    "type": "string"
                  },
                  "location_ids": {
                    "description": "Location UUIDs to filter to, as an array even for one id. The literal string \"no-location\" selects responses that ran without a location. Omit for all locations.",
                    "items": {
                      "anyOf": [
                        {
                          "format": "uuid",
                          "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                          "type": "string"
                        },
                        {
                          "const": "no-location",
                          "type": "string"
                        }
                      ]
                    },
                    "type": "array"
                  },
                  "models": {
                    "description": "AI models to include, as an array even for one model — e.g. [\"chatgpt\", \"perplexity\"]. Omit to include all models.",
                    "items": {
                      "enum": ["chatgpt", "perplexity", "gemini", "google_ai_overview", "copilot", "claude", "ai_mode", "grok", "deepseek", "meta_ai", "mistral"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "persona_ids": {
                    "description": "Persona UUIDs to filter to, as an array even for one id. Omit for all personas.",
                    "items": {
                      "format": "uuid",
                      "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "prompt_ids": {
                    "description": "Prompt UUIDs to filter to, as an array even for one id. Omit for all prompts.",
                    "items": {
                      "format": "uuid",
                      "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "prompt_status": {
                    "description": "Filter prompts by tracking status: \"active\" or \"paused\". Omit for both.",
                    "enum": ["active", "paused"],
                    "type": "string"
                  },
                  "prompt_tags": {
                    "description": "Prompt tag IDs to filter prompts by, as an array (list tags with get_prompt_tags). Omit for all tags.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "prompt_tags_operator": {
                    "description": "How prompt_tags combine: \"is_any_of\" matches prompts with any listed tag, \"has_all_of\" only prompts carrying every listed tag.",
                    "enum": ["is_any_of", "has_all_of"],
                    "type": "string"
                  },
                  "prompt_type": {
                    "description": "Filter prompts by type: \"branded\" (mentions the brand) or \"non_branded\". Omit for both.",
                    "enum": ["branded", "non_branded"],
                    "type": "string"
                  },
                  "schedule_id": {
                    "anyOf": [
                      {
                        "enum": ["default", "manual"],
                        "type": "string"
                      },
                      {
                        "format": "uuid",
                        "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                        "type": "string"
                      }
                    ],
                    "description": "One schedule: \"default\" or a custom/archived schedule UUID. Omit for Default, which includes all pre-cutover history and ad hoc runs. The retired \"manual\" token is accepted as an alias of \"default\". Schedules cannot be combined."
                  },
                  "start_date": {
                    "description": "Start of the date range. Required. Accepts YYYY-MM-DD, ISO 8601 timestamps (timezone omitted means UTC), English month names with a four-digit year, and unambiguous numeric dates separated by /, -, or .; ambiguous dates are rejected.",
                    "type": "string"
                  },
                  "target_identifiers": {
                    "description": "Target identifier strings to filter to, as an array even for one value. The literal string \"no-identifier\" selects responses with no target identifier. Omit for all.",
                    "items": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "const": "no-identifier",
                          "type": "string"
                        }
                      ]
                    },
                    "type": "array"
                  },
                  "variation_filter": {
                    "description": "Which prompt rows to include, as an array: \"prompt\" for base prompts, \"variation\" for generated variations, or both. Omit for both.",
                    "items": {
                      "enum": ["variation", "prompt"],
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["start_date"],
                "type": "object"
              },
              "mentioned": {
                "type": "boolean"
              },
              "website_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["content_id", "filters", "website_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "content_id": {
                "type": "string"
              },
              "content_normalized_url": {
                "type": ["string", "null"]
              },
              "content_url": {
                "type": ["string", "null"]
              },
              "prompts": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "citation_percent": {
                      "type": "number"
                    },
                    "citations": {
                      "type": "number"
                    },
                    "estimated_impressions": {
                      "type": ["number", "null"]
                    },
                    "prompt": {
                      "type": "string"
                    },
                    "prompt_id": {
                      "type": "string"
                    }
                  },
                  "required": ["citation_percent", "citations", "estimated_impressions", "prompt", "prompt_id"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["content_id", "content_normalized_url", "content_url", "prompts"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get content citation prompts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": [],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:371696c46c16f9e4b0383e9630421bf5108568ccc25dc71590b6d061bed57f16"
        },
        {
          "name": "get_content_detail",
          "description": "Fetch the full detail of a single tracked content item — its brief and body text (drafts, optimize rewrites, snipes, authored and scraped pages), plus status, cited source URLs, and links. Use after get_tracked_content to read the actual text behind a content_id. A status of generated_brief means the brief is ready while the article is still being written. Pages registered via track_content_urls return a null body and null status until their page text is fetched from the app — a null body on an external page means not fetched yet, not missing content; citation tracking does not need the body. `prompts` lists the prompts this page was WRITTEN FOR (the same ids create_content takes), newest-linked last, capped at 100 with the true size in `prompts_total`. When prompts_total exceeds 100 the rest are not currently readable through any tool — report the total, do not imply the list is complete. Entries carry status active, paused or deleted: a deleted prompt is still part of what the page was written for and still shows in the Content Hub, but get_prompts will not list it, so use the text returned here. An empty array means the page has no prompt targeting, which is normal for imported or externally tracked pages. That is a different question from get_content_citation_prompts, which lists prompts whose AI responses CITED the page. For an optimize item, source_url is the live page it is based on, available as soon as the item exists; url stays null until publish_content records the published page and marks the item done, so read source_url to link a request in review to its page. source_url is null for other content types and for optimize items based on pasted text or a file. To see the reworded variants actually asked of the models for these prompts, pass their ids to get_responses (each row carries base_prompt plus the variation as prompt) or query the responses cube via query_rows on the prompt_variation dimension.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "content_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "website_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["content_id", "website_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "body": {
                "type": ["string", "null"]
              },
              "brief": {
                "type": ["string", "null"]
              },
              "brief_cited_urls": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "brief_internal_links": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "cited_urls": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "content_id": {
                "type": "string"
              },
              "created_at": {
                "type": "string"
              },
              "facebook_post": {
                "type": ["string", "null"]
              },
              "instagram_post": {
                "type": ["string", "null"]
              },
              "internal_links": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "linkedin_post": {
                "type": ["string", "null"]
              },
              "mark_as_done_time": {
                "type": ["string", "null"]
              },
              "meta_description": {
                "type": ["string", "null"]
              },
              "normalized_url": {
                "type": ["string", "null"]
              },
              "optimize_summary": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "changes": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "description": {
                              "type": "string"
                            }
                          },
                          "required": ["description"],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "overview": {
                        "type": "string"
                      }
                    },
                    "required": ["changes", "overview"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "prompts": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "prompt": {
                      "type": "string"
                    },
                    "status": {
                      "enum": ["active", "paused", "deleted"],
                      "type": "string"
                    },
                    "topic_name": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["id", "prompt", "status", "topic_name"],
                  "type": "object"
                },
                "type": "array"
              },
              "prompts_total": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "reddit_post": {
                "type": ["string", "null"]
              },
