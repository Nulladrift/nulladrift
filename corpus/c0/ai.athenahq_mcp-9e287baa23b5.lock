                    "description": "Shopping-capable models to include, as an array even for one model: any of \"chatgpt\", \"ai_mode\", \"gemini\", \"perplexity\" and \"copilot\". Omit for all.",
                    "items": {
                      "enum": ["chatgpt", "ai_mode", "gemini", "perplexity", "copilot"],
                      "type": "string"
                    },
                    "type": "array"
                  },
