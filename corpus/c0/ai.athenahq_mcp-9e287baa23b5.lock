        {
          "name": "get_content_hub_sheets",
          "description": "List the Content Hub tabs/sheets configured for a website. Use to discover available tabs (e.g. 1st-party content, 3rd-party placements, Reddit) before calling get_tracked_content with a specific sheet_id (metrics; excludes in-flight pipeline items) or list_content (every item including unpublished drafts).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
