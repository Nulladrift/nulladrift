                "type": "string"
              },
              "url": {
                "type": ["string", "null"]
              },
              "x_post": {
                "type": ["string", "null"]
              }
            },
            "required": ["body", "brief", "brief_cited_urls", "brief_internal_links", "cited_urls", "content_id", "created_at", "facebook_post", "instagram_post", "internal_links", "linkedin_post", "mark_as_done_time", "meta_description", "normalized_url", "optimize_summary", "prompts", "prompts_total", "reddit_post", "sheet_id", "source_url", "status", "title", "topic_name", "type", "updated_at", "url", "x_post"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
