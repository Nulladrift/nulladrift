        {
          "name": "get_site_health_issue_pages",
          "description": "Page through every page one Site Health issue affects, 50 per page, open pages first and most recently seen first within a status. Give the check from the issue list; filter by status; page is 0-based and has_more says whether to continue; page 0 starts from the first affected page, so it repeats the sample pages the issue list showed inline. page_id returns that one page's row for the check. Each row carries the finding_id and task_revision an update of the page's task needs, the finding's detail, recommendation and evidence, the assignee, and the dates it was first and last seen and last checked. Requires Site Health on the website's plan; otherwise the call fails with 403.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "check": {
                "description": "The check id of the issue, from the issue list.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "page": {
                "description": "Zero-based page of 50 affected pages.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "page_id": {
                "description": "Only this page's row for the check, wherever it sits.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "status": {
                "description": "Only pages in this status.",
                "enum": ["open", "in_progress", "fixed", "verified", "dismissed"],
                "type": "string"
              },
              "website_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["check", "website_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "has_more": {
                "type": "boolean"
              },
              "pages": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "assignee": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "id": {
                              "type": "string"
                            },
                            "name": {
                              "type": "string"
                            }
                          },
                          "required": ["id", "name"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "detail": {
                      "type": "string"
                    },
                    "draft": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "run_id": {
                              "format": "uuid",
                              "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                              "type": "string"
                            },
                            "status": {
                              "type": "string"
                            }
                          },
                          "required": ["run_id", "status"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "evidence": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "evidence_links": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "label": {
                            "type": "string"
                          },
                          "url": {
                            "type": "string"
                          }
                        },
                        "required": ["label", "url"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "finding_id": {
                      "format": "uuid",
                      "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                      "type": "string"
                    },
                    "first_seen_at": {
                      "type": "string"
                    },
                    "last_checked_at": {
                      "type": ["string", "null"]
                    },
                    "last_seen_at": {
                      "type": "string"
                    },
                    "page_id": {
                      "format": "uuid",
                      "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                      "type": "string"
                    },
                    "page_title": {
