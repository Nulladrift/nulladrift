        {
          "name": "create_saved_view",
          "description": "Create a saved view (filter preset) for a website. Saved views appear in the dashboard filter bar for every member of the website. filters is an object keyed by filter field key, each value shaped {\"id\": \"<unique string>\", \"field\": \"<same field key>\", \"operator\": \"is_any_of\", \"values\": [...]}. Common field keys: \"models\" (slugs like \"chatgpt\", \"perplexity\", \"google_ai_overview\"), \"competitors\", \"prompts\", \"personas\", \"locations\", \"promptTags\", \"attributes\" (arrays of UUIDs from the matching list tools), \"countries\", \"sourceTag\". \"promptTags\" also accepts the builtin tokens \"type:high_intent\" (branded prompts) and \"type:discovery\" (non-branded) alongside tag UUIDs. \"sourceTag\" values are the builtin categories \"owned\", \"competitor\", \"partner\", \"third_party\" or custom source tag UUIDs, not display labels; custom source tag ids appear on existing saved views (list the website's saved views to find them). When unsure, list the website's saved views and mirror their filter shapes. icon, when set, must be a supported Remix icon name (e.g. \"RiStarLine\"); invalid names are rejected with the full list. When talking to the user about a view or its filters, use the dashboard names (Branded / Non-branded prompts, Owned / Competitor / Partner / Third party sources), never internal tokens, field keys, operator strings, or icon identifiers.",
