                      "type": "boolean"
                    },
                    "last_audit_status": {
                      "type": ["string", "null"]
                    },
                    "last_audited_at": {
                      "type": ["string", "null"]
                    },
                    "open_findings": {
                      "type": "number"
                    },
                    "path": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "is_priority", "last_audit_status", "last_audited_at", "open_findings", "path", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "type": "number"
              }
            },
            "type": "object"
