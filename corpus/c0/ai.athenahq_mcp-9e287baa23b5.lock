        {
          "name": "get_site_health_pages",
          "description": "Browse the pages of one Site Health property, 50 per page (page is 1-based) sorted by URL, each with its last audit status and time, its count of open findings and whether it is a priority page (cited by AI answers or a top Google page, so audits read it first). Narrow by check (pages with an open finding of it), one URL, or a search term; total counts the pages that match. groups lists every check with an open finding on the property and its page count, ignoring the filters, highest priority first. Page ids feed get_site_health_page and start_site_health_audit. Requires Site Health on the website's plan; otherwise the call fails with 403.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "check": {
                "description": "Only pages with an open finding of this check.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "page": {
                "description": "One-based page of 50 pages, sorted by URL.",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              },
              "property_id": {
                "description": "The property to browse, from the properties list.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "search": {
                "description": "Only pages whose URL contains this text.",
                "maxLength": 500,
                "type": "string"
              },
              "url": {
                "description": "Only the page at this URL.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              },
              "website_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["property_id", "website_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "groups": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "check": {
                      "type": "string"
                    },
