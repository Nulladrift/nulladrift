        {
          "name": "update_brand_kit",
          "description": "Change one brand kit's name, guidance text, voice settings, or kit writing rules, and optionally publish it, under the same rules as the Brand Profile page. Call get_brand_kit first. Edits save to the kit's draft; content generation keeps using the published version until publish is true, which creates a new immutable version (the Brand Profile page can restore earlier ones). A guidance entry without find replaces the whole field with text (empty text clears it); with find, text replaces that passage, which must occur exactly once in the field text get_brand_kit returned (empty text deletes it). Voice settings take 1-5 or \"auto\"; omitted settings keep their value. Rules: add new ones, update by id (omitted fields keep their value; category \"\" clears it), or remove by id. Kit rules need the writing rules feature on the plan. A rule that contradicts an existing kit or global rule is refused with the explanation and nothing is saved; a rename to a name another kit uses is refused. When the result says the kit changed in another session, call get_brand_kit again and retry. outcome saved_publish_failed means the draft was saved but not published; publish_error says why. Global writing rules are changed with update_global_rules, not here.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "guidance": {
                "description": "Guidance text changes, one entry per field. Without find, text replaces the whole field (empty text clears it). With find, text replaces that passage (empty text deletes it).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "field": {
                      "description": "voice is the writing direction; the others are audience, perspective (point of view), author (author guidance), terminology, channel (format and channel), locale (language and locale), disclosures (claims and disclosures).",
                      "enum": ["voice", "audience", "perspective", "author", "terminology", "channel", "locale", "disclosures"],
                      "type": "string"
                    },
                    "find": {
                      "description": "A passage to replace with text, copied exactly from the field text get_brand_kit returned; it must occur exactly once. Omit it to replace the whole field.",
                      "maxLength": 12000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "text": {
                      "description": "The new text. Markdown paragraphs, headings, bullets and numbered items are kept as structure.",
                      "maxLength": 12000,
                      "type": "string"
                    }
                  },
                  "required": ["field", "text"],
                  "type": "object"
                },
                "type": "array"
              },
              "kit_id": {
                "description": "The brand kit, from get_brand_kit's available_kits.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "name": {
                "description": "A new name, unique on the website.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "publish": {
                "description": "true publishes the saved draft as a new version, which content generation uses from then on. Only when the user asked to publish.",
                "type": "boolean"
              },
              "rules": {
                "additionalProperties": false,
                "description": "Writing rules to add, update by id, or remove by id. Ids come from get_brand_kit.",
                "properties": {
                  "add": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "category": {
                          "description": "A short grouping label; \"\" clears it.",
                          "maxLength": 100,
                          "type": "string"
                        },
                        "text": {
                          "description": "One writing rule, as an instruction to the writer.",
                          "maxLength": 2000,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["text"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "remove": {
                    "description": "Rule ids to delete.",
                    "items": {
                      "format": "uuid",
                      "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "update": {
                    "description": "By id; omitted fields keep their value.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "category": {
                          "description": "A short grouping label; \"\" clears it.",
                          "maxLength": 100,
                          "type": "string"
                        },
                        "id": {
                          "format": "uuid",
                          "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                          "type": "string"
                        },
                        "is_active": {
                          "description": "false keeps the rule but stops applying it.",
                          "type": "boolean"
                        },
                        "text": {
                          "description": "One writing rule, as an instruction to the writer.",
                          "maxLength": 2000,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["id"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "voice_settings": {
                "additionalProperties": false,
                "description": "Each 1 (formality: casual, expression: reserved, humor: serious, stance: neutral, technicality: plain) to 5 (formal, expressive, playful, opinionated, technical), or \"auto\" to let the writer decide. Omitted dimensions keep their value.",
                "properties": {
                  "expression": {
                    "anyOf": [
                      {
                        "maximum": 5,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "const": "auto",
                        "type": "string"
                      }
                    ]
                  },
                  "formality": {
                    "anyOf": [
                      {
                        "maximum": 5,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "const": "auto",
                        "type": "string"
                      }
                    ]
                  },
                  "humor": {
                    "anyOf": [
                      {
                        "maximum": 5,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "const": "auto",
                        "type": "string"
                      }
                    ]
                  },
                  "stance": {
                    "anyOf": [
                      {
                        "maximum": 5,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "const": "auto",
                        "type": "string"
                      }
                    ]
                  },
                  "technicality": {
                    "anyOf": [
                      {
                        "maximum": 5,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "const": "auto",
                        "type": "string"
                      }
                    ]
                  }
                },
                "type": "object"
              },
              "website_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["kit_id", "website_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "changed": {
                "additionalProperties": false,
                "properties": {
                  "guidance_fields": {
                    "items": {
                      "description": "voice is the writing direction; the others are audience, perspective (point of view), author (author guidance), terminology, channel (format and channel), locale (language and locale), disclosures (claims and disclosures).",
                      "enum": ["voice", "audience", "perspective", "author", "terminology", "channel", "locale", "disclosures"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "name": {
                    "type": "boolean"
                  },
                  "rules_added": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "rules_removed": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "rules_updated": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "voice_settings": {
                    "type": "boolean"
                  }
                },
                "required": ["guidance_fields", "name", "rules_added", "rules_removed", "rules_updated", "voice_settings"],
                "type": "object"
