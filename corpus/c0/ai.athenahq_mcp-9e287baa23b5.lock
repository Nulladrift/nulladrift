        {
          "name": "query_metrics",
          "description": "Query aggregated metrics for brand performance, competitors, sources, citations, and response trends. Use query_rows for individual records.\n\nMentions: from \"response_mentions\". Citations: from \"citations\". On either, where { is_website: true } selects the brand; { is_competitor: true } selects competitors; { entity_id: { eq: \"<uuid>\" } } selects one entity.\nFilter/group models by model_category (display names like \"ChatGPT\", \"Claude\"), never \"model\". Dimensions vary by cube; source_mentions has no prompt/model dimensions.\nGroup by week (Monday start) or month wherever date groups. prompt_status is the paused flag (true = paused).\n\nMeasures: count, count_distinct, avg, sum, min, max; per-measure where enables conditional aggregation. Use compare for two date ranges.\nWhen grouping by IDs, use alsoSelect for names: entity_id/entity_name, prompt_id/prompt_text, prompt_topic_id/topic_name (prompts uses topic_id).\n\nCited pages mentioning competitors but not the brand: from \"sources\", where { source_mentions_entity: { hasSome: [competitorIds], hasNone: [brandId] } }. Also works on \"source_mentions\". Checks all stored page mentions per URL/website. Date/model on sources scope AI responses; extracted page content may be older than the live page.\n\nContent-hub attribution: on \"sources\", where { is_attributed_content: true }; by: [\"content_id\"], alsoSelect: [\"content_title\"]. Add content_type to by for type, or group by content_type alone. Read articles from \"contents\" via query_rows.\n\nSchedule: select one \"default\" or custom/archived UUID from the catalog, or an array of them to combine schedules. Omit for caller default (current page in Ask Athena); explicit schedule overrides it. Top-level prompt_schedule_kind/id equality filters remain supported but must not conflict with schedule. Historical provenance is independent of current prompt membership; website-level cubes are unaffected.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "definitions": {
              "CompareSlice": {
                "description": "One side of a compare. `where` is the filter that scopes this slice (non-empty — empty means 'all rows', which trivializes the comparison). `label` defaults to 'baseline' / 'current' and forms the suffix on expanded column names; override for non-temporal compares.",
                "properties": {
                  "label": {
                    "type": "string"
                  },
                  "where": {
                    "$ref": "#/definitions/Filter"
                  }
                },
                "required": ["where"],
                "type": "object"
              },
              "Expr": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "number"
                  },
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  },
                  {
                    "items": {
                      "$ref": "#/definitions/Expr"
                    },
                    "minItems": 1,
                    "type": "array"
                  }
                ],
                "description": "S-expression. Strings are refs (to a measure alias or by-dim). Numbers/booleans/null are literals. Arrays are [op, ...args] where op is a binary operator (+ - * / % = != < <= > >= AND OR) or one of the allowed scalar functions: nullIf, coalesce, ifNull, if, multiIf, abs, round, floor, ceil, sqrt, pow, least, greatest, log, exp, sign. Examples: [\"-\", \"n_current\", \"n_baseline\"], [\"/\", \"num\", [\"nullIf\", \"denom\", 0]], [\"coalesce\", \"value\", 0]."
              },
              "Filter": {
                "additionalProperties": {},
                "description": "Prisma-style filter. A bare scalar value on a dim is shorthand for `eq` (e.g. `{ is_website: true }`); bare arrays and op-less objects throw — use `{ in: [...] }` / `{ hasSome: [...] }` explicitly. Operators: eq, neq, in, notIn, gt, gte, lt, lte, isNull, like, ilike, startsWith, hasSome, hasEvery, hasNone. Combinators: AND, OR, NOT. On semi-join dims (e.g. `response_mentions_entity`, `prompt_tag_ids`), `hasSome`/`in` emit `IN (SELECT …)` and `hasNone`/`notIn` emit `NOT IN (SELECT …)`; combine both on one dim to express \"includes any of A but none of B\". Empty `AND: []` / `OR: []` throw (the math identities are asymmetric — drop the clause before passing). Empty list operators (`hasSome: []` / `hasNone: []` / `hasEvery: []`) also throw — drop the predicate or supply at least one value. NOT accepts a single Filter only — for arrays use `NOT: { AND: [...] }` (`not all`) or `NOT: { OR: [...] }` (`none`). NOT keeps rows whose value is NULL: `NOT { sentiment: { eq: \"positive\" } }` returns unanalyzed responses as well as negative and neutral ones, because \"not positive\" is true of a row with no sentiment. Exclude them explicitly with `AND: [{ NOT: {...} }, { sentiment: { isNull: false } }]`.",
                "properties": {
                  "AND": {
                    "anyOf": [
                      {
                        "$ref": "#/definitions/Filter"
                      },
                      {
                        "items": {
                          "$ref": "#/definitions/Filter"
                        },
                        "minItems": 1,
                        "type": "array"
                      }
                    ]
                  },
                  "NOT": {
                    "allOf": [
                      {
                        "$ref": "#/definitions/Filter"
                      }
                    ]
                  },
                  "OR": {
                    "items": {
                      "$ref": "#/definitions/Filter"
                    },
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "type": "object"
              }
            },
            "properties": {
              "alsoSelect": {
                "description": "Label dimensions carried via any(). Must be determined by a by dim (cube's dependentDims). Example: entity_name when entity_id is in by.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "by": {
                "description": "GROUP BY dimensions. Omit for scalar result.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "compare": {
                "description": "Compare the same measures across two slices. Each base measure `m` expands to `m_<baseline.label>` and `m_<current.label>`; the result also gets `m_delta` (= current − baseline) and `m_pct_change` (= (current − baseline) / baseline, null when baseline = 0). For a min/max of `date`, `m_delta` is in days and `m_pct_change` is null. Default labels are 'baseline' and 'current'; override per side for non-temporal compares (e.g. brand vs competitors). One scan; orderBy on `m_delta` works push-down.",
                "properties": {
                  "baseline": {
                    "$ref": "#/definitions/CompareSlice"
                  },
                  "current": {
                    "$ref": "#/definitions/CompareSlice"
                  }
                },
                "required": ["baseline", "current"],
                "type": "object"
