        {
          "name": "start_prompt_discovery",
          "description": "Start a Discover study to find evidence-grounded, untracked prompt opportunities for a website. Invoke after explicit user intent to start research and review the sources, country, language, requested prompt count and custom instructions with the user. This launches asynchronous external research and model calls; the prompt count is a target, not a guaranteed yield. Sources: website_analysis (website), social (market discussions), search_console (connected Search Console), keyword_gaps (plan-gated keyword opportunities), competitive_landscape (plan-gated category questions and comparisons researched from the website's tracked competitors; requires at least one tracked competitor), brand_guidelines (requires custom instructions). Returns the run ID and version when startup succeeds. Prompts are not automatically added to tracking. Poll the discovery history/progress tool with the returned run ID; do not start another study to check status. Requires prompt-management permission and source entitlements. Candidate results can be reviewed in the application's Discover page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
