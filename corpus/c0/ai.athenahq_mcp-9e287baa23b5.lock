        {
          "name": "get_source_pages",
          "description": "List individual cited URLs (pages) for a website with citation, mention, and impression metrics plus a per-URL daily sparkline. Each row is classified as owned / competitor / partner / third_party. Companion to get_sources (root-domain-level). Supports filters (date range, models, prompts, competitors, locations, personas), search, sort, and pagination.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "competitors_mentioned": {
                "enum": ["yes", "no"],
                "type": "string"
              },
              "filters": {
                "properties": {
                  "competitor_ids": {
                    "description": "Competitor UUIDs to filter to, as an array even for one id. Omit for all competitors.",
                    "items": {
                      "format": "uuid",
                      "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "end_date": {
                    "description": "End of the date range, inclusive. Date-only values include the UTC day through 23:59:59.999; timestamps keep their exact instant. Accepts YYYY-MM-DD, ISO 8601 timestamps (timezone omitted means UTC), English month names with a four-digit year, and unambiguous numeric dates separated by /, -, or .; ambiguous dates are rejected.",
                    "type": "string"
                  },
                  "location_ids": {
                    "description": "Location UUIDs to filter to, as an array even for one id. The literal string \"no-location\" selects responses that ran without a location. Omit for all locations.",
                    "items": {
                      "anyOf": [
                        {
                          "format": "uuid",
                          "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                          "type": "string"
                        },
                        {
                          "const": "no-location",
                          "type": "string"
                        }
                      ]
                    },
                    "type": "array"
                  },
                  "models": {
                    "description": "AI models to include, as an array even for one model — e.g. [\"chatgpt\", \"perplexity\"]. Omit to include all models.",
                    "items": {
                      "enum": ["chatgpt", "perplexity", "gemini", "google_ai_overview", "copilot", "claude", "ai_mode", "grok", "deepseek", "meta_ai", "mistral"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "persona_ids": {
                    "description": "Persona UUIDs to filter to, as an array even for one id. Omit for all personas.",
                    "items": {
                      "format": "uuid",
                      "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "prompt_ids": {
                    "description": "Prompt UUIDs to filter to, as an array even for one id. Omit for all prompts.",
                    "items": {
                      "format": "uuid",
                      "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "prompt_status": {
                    "description": "Filter prompts by tracking status: \"active\" or \"paused\". Omit for both.",
                    "enum": ["active", "paused"],
                    "type": "string"
                  },
                  "prompt_tags": {
                    "description": "Prompt tag IDs to filter prompts by, as an array (list tags with get_prompt_tags). Omit for all tags.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "prompt_tags_operator": {
                    "description": "How prompt_tags combine: \"is_any_of\" matches prompts with any listed tag, \"has_all_of\" only prompts carrying every listed tag.",
                    "enum": ["is_any_of", "has_all_of"],
                    "type": "string"
                  },
                  "prompt_type": {
                    "description": "Filter prompts by type: \"branded\" (mentions the brand) or \"non_branded\". Omit for both.",
                    "enum": ["branded", "non_branded"],
                    "type": "string"
                  },
                  "schedule_id": {
                    "anyOf": [
                      {
                        "enum": ["default", "manual"],
                        "type": "string"
                      },
                      {
                        "format": "uuid",
                        "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                        "type": "string"
                      }
                    ],
                    "description": "One schedule: \"default\" or a custom/archived schedule UUID. Omit for Default, which includes all pre-cutover history and ad hoc runs. The retired \"manual\" token is accepted as an alias of \"default\". Schedules cannot be combined."
                  },
                  "start_date": {
                    "description": "Start of the date range. Required. Accepts YYYY-MM-DD, ISO 8601 timestamps (timezone omitted means UTC), English month names with a four-digit year, and unambiguous numeric dates separated by /, -, or .; ambiguous dates are rejected.",
                    "type": "string"
                  },
                  "target_identifiers": {
                    "description": "Target identifier strings to filter to, as an array even for one value. The literal string \"no-identifier\" selects responses with no target identifier. Omit for all.",
                    "items": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "const": "no-identifier",
                          "type": "string"
                        }
                      ]
                    },
                    "type": "array"
                  },
                  "variation_filter": {
                    "description": "Which prompt rows to include, as an array: \"prompt\" for base prompts, \"variation\" for generated variations, or both. Omit for both.",
                    "items": {
                      "enum": ["variation", "prompt"],
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["start_date"],
                "type": "object"
              },
              "mentioned": {
                "enum": ["yes", "no"],
                "type": "string"
              },
              "page_num": {
                "default": 0,
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "page_size": {
                "default": 30,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "search": {
                "type": ["string", "null"]
              },
              "sort_direction": {
                "default": "desc",
