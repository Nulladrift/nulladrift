                    "type": "string"
                  },
                  "location_ids": {
                    "description": "Location UUIDs to filter to, as an array even for one id. The literal string \"no-location\" selects responses that ran without a location. Omit for all locations.",
                    "items": {
                      "anyOf": [
                        {
                          "format": "uuid",
                          "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                          "type": "string"
                        },
                        {
                          "const": "no-location",
                          "type": "string"
                        }
                      ]
                    },
                    "type": "array"
                  },
                  "models": {
                    "description": "AI models to include, as an array even for one model — e.g. [\"chatgpt\", \"perplexity\"]. Omit to include all models.",
                    "items": {
                      "enum": ["chatgpt", "perplexity", "gemini", "google_ai_overview", "copilot", "claude", "ai_mode", "grok", "deepseek", "meta_ai", "mistral"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "persona_ids": {
                    "description": "Persona UUIDs to filter to, as an array even for one id. Omit for all personas.",
                    "items": {
                      "format": "uuid",
                      "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "prompt_ids": {
                    "description": "Prompt UUIDs to filter to, as an array even for one id. Omit for all prompts.",
                    "items": {
                      "format": "uuid",
                      "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "prompt_status": {
                    "description": "Filter prompts by tracking status: \"active\" or \"paused\". Omit for both.",
                    "enum": ["active", "paused"],
                    "type": "string"
                  },
                  "prompt_tags": {
                    "description": "Prompt tag IDs to filter prompts by, as an array (list tags with get_prompt_tags). Omit for all tags.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
