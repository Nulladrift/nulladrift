              }
            ]
          },
          "digest": "sha256:50b2f689e1fa4400b8fd38ea8502456aa2d5f6aa2f12fb818a842243535d7b2e"
        },
        {
          "name": "add_competitors",
          "description": "Start tracking competitors on a website, 1 to 25 per call, under the same rules as the Competitors page. Each competitor needs a name and its website url, or no_website: true for a brand with no website of its own; identifiers and additional_urls are optional. Returns one result per competitor, in order: added, already_tracked (the website already tracks that url; nothing changes), or rejected with the reason (a url on the website's own domains, an invalid url, or the limit of 500 competitors per website). New AI responses count mentions of an added competitor right away. Past responses are reanalyzed only when someone runs the backfill on the Competitors page, which costs credits; this tool never starts it and costs no credits.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "competitors": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "additional_urls": {
                      "description": "Other domains the competitor owns, e.g. acme.co.uk.",
                      "items": {
                        "maxLength": 2048,
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "identifiers": {
                      "description": "Other names and aliases to count as a mention, beyond the name and domain.",
                      "items": {
                        "maxLength": 500,
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "name": {
                      "maxLength": 255,
                      "minLength": 1,
                      "type": "string"
                    },
                    "no_website": {
                      "const": true,
                      "description": "Pass true only for a brand that has no website of its own. Mentions still match on the name and identifiers.",
                      "type": "boolean"
                    },
                    "url": {
                      "description": "The competitor's website, e.g. acme.com. Required unless no_website is true.",
                      "maxLength": 2048,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "type": "array"
              },
              "website_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["competitors", "website_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "competitor_id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "reason": {
                      "type": "string"
                    },
                    "status": {
                      "enum": ["added", "already_tracked", "rejected"],
                      "type": "string"
                    }
                  },
                  "required": ["name", "status"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add competitors"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
