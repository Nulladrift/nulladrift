                                },
                                "required": ["id", "text"],
                                "type": "object"
                              },
                              "minItems": 1,
                              "type": "array"
                            },
                            "kind": {
                              "const": "confirmed_statement",
                              "type": "string"
                            },
                            "sourceFindingId": {
                              "format": "uuid",
                              "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                              "type": "string"
                            },
                            "statement": {
                              "minLength": 1,
                              "type": "string"
                            }
                          },
                          "required": ["confirmationId", "facts", "kind", "sourceFindingId", "statement"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "When present, the complete team-confirmed statement and ALL supporting facts are the evidence. The legacy fact ID and text are only a compatibility anchor, not independent proof."
                    },
                    "id": {
                      "type": "string"
