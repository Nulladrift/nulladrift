        {
          "name": "track_content_urls",
          "description": "Register existing pages or third-party URLs as tracked Content Hub items so Athena attributes citations and mentions to them. Creates external content rows from bare URLs with no generation and no credit cost. Tracking starts immediately: the normalized URL becomes the citation/metric join key, so pages cited in the website's monitored AI responses accrue metrics with no publish step (use it for guest posts, partner placements, or any page Athena did not generate). Idempotent per URL: a URL already present on the website (any content type) is not duplicated; the response lists it under skipped with the existing content_id and type. Check that type before chaining destructive calls (a skip can resolve to first-party generated content that shares the URL). Rows are created without page text, which citation tracking does not need; the body can be filled from the app later. Duplicate URLs within one call (including tracking-param variants of the same page) collapse to one row, first occurrence wins. Optional sheet_id files rows under a Content Hub tab; view-type tabs resolve to the main pool (null), echoed per row. Optional per-URL fields set the customer's own Content Hub columns on the created row, addressed by column name as shown on the destination tab (text, number, date, checkbox, link, and multi-select columns; unknown multi-select options are created). An unknown column name or a value that does not fit the column type rejects the whole call and nothing is tracked; skipped URLs keep their existing values. If the user names a destination tab, resolve its id with get_content_hub_sheets before tracking. Omitting sheet_id uses the shared pool, not the user's currently open tab. After the call, report created_count and skipped_count separately, name the returned destination_name, and share content_hub_url so the user can open each item. Skipped rows keep their existing tab: use their returned destination and never describe them as newly added or moved.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "sheet_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "urls": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "fields": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "column": {
                            "maxLength": 200,
                            "minLength": 1,
                            "type": "string"
                          },
                          "value": {
                            "anyOf": [
                              {
                                "maxLength": 10000,
                                "type": "string"
                              },
