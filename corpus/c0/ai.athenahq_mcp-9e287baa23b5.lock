                            "type": ["string", "null"]
                          },
                          "url": {
                            "type": "string"
                          }
                        },
                        "required": ["normalized_url", "root_domain", "suffix", "url"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "website_id": {
                      "type": "string"
                    }
                  },
                  "required": ["base_prompt", "cited", "competitors", "country", "created_at", "id", "mentioned", "model", "position", "prompt", "prompt_id", "schedule", "website_id"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "type": "number"
              }
            },
            "required": ["has_more", "page_num", "page_size", "responses", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
