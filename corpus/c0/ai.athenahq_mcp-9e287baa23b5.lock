        {
          "name": "create_brand_kit",
          "description": "Create a brand kit from text the user provides: a name, guidance text per field (voice is the writing direction), voice settings and writing rules, all authored by the caller; nothing is generated. The kit starts as a draft; content generation uses it only once published, which publish: true does as version 1 (or update_brand_kit later). The website's first kit becomes its default. A name another kit uses is refused; a rule that contradicts an existing global rule is refused with the explanation and no kit is created. Kit rules need the writing rules feature on the plan. To change an existing kit, use update_brand_kit; to generate a kit from the website or uploaded documents, use the Brand Profile page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "guidance": {
                "description": "Guidance text per field, one entry per field.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "field": {
                      "description": "voice is the writing direction; the others are audience, perspective (point of view), author (author guidance), terminology, channel (format and channel), locale (language and locale), disclosures (claims and disclosures).",
                      "enum": ["voice", "audience", "perspective", "author", "terminology", "channel", "locale", "disclosures"],
                      "type": "string"
                    },
                    "text": {
                      "description": "The field's text. Markdown paragraphs, headings, bullets and numbered items are kept as structure.",
                      "maxLength": 12000,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["field", "text"],
                  "type": "object"
                },
                "type": "array"
              },
              "name": {
                "description": "The kit's name, unique on the website.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "publish": {
                "description": "true publishes the new kit as version 1 so content generation can use it. Only when the user asked to publish.",
                "type": "boolean"
              },
              "rules": {
                "additionalProperties": false,
                "description": "Writing rules for this kit.",
                "properties": {
                  "add": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "category": {
                          "description": "A short grouping label; \"\" clears it.",
                          "maxLength": 100,
                          "type": "string"
                        },
                        "text": {
                          "description": "One writing rule, as an instruction to the writer.",
                          "maxLength": 2000,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["text"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "voice_settings": {
                "additionalProperties": false,
                "description": "Each 1 (formality: casual, expression: reserved, humor: serious, stance: neutral, technicality: plain) to 5 (formal, expressive, playful, opinionated, technical), or \"auto\" to let the writer decide. Omitted dimensions keep their value.",
                "properties": {
                  "expression": {
                    "anyOf": [
                      {
                        "maximum": 5,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "const": "auto",
                        "type": "string"
                      }
                    ]
                  },
                  "formality": {
                    "anyOf": [
                      {
                        "maximum": 5,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "const": "auto",
                        "type": "string"
                      }
                    ]
                  },
                  "humor": {
                    "anyOf": [
                      {
                        "maximum": 5,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "const": "auto",
                        "type": "string"
                      }
                    ]
                  },
                  "stance": {
                    "anyOf": [
                      {
                        "maximum": 5,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "const": "auto",
                        "type": "string"
                      }
                    ]
                  },
                  "technicality": {
                    "anyOf": [
                      {
                        "maximum": 5,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "const": "auto",
                        "type": "string"
                      }
                    ]
                  }
                },
                "type": "object"
              },
              "website_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["name", "website_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "changed": {
                "additionalProperties": false,
                "properties": {
                  "guidance_fields": {
                    "items": {
                      "description": "voice is the writing direction; the others are audience, perspective (point of view), author (author guidance), terminology, channel (format and channel), locale (language and locale), disclosures (claims and disclosures).",
                      "enum": ["voice", "audience", "perspective", "author", "terminology", "channel", "locale", "disclosures"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "name": {
                    "type": "boolean"
                  },
                  "rules_added": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "rules_removed": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "rules_updated": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "voice_settings": {
                    "type": "boolean"
                  }
                },
                "required": ["guidance_fields", "name", "rules_added", "rules_removed", "rules_updated", "voice_settings"],
                "type": "object"
              },
              "kit": {
                "additionalProperties": false,
                "properties": {
