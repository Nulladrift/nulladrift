            "readOnly": true
          },
          "digest": "sha256:9839386505bb8a4c93f1de28a7923ed853a0cbc42eed6523aa19854bd4aed060"
        },
        {
          "name": "planificar_ruta",
          "title": "Planificar ruta y pernoctas",
          "description": "Planifica dónde dormir en un viaje por carretera. Úsela cuando el usuario pregunte dónde hacer noche, en cuántas etapas hacer un viaje o cómo repartir un trayecto largo en coche, camper, autocaravana o caravana. Calcula la ruta con el perfil del vehículo, la hora a la que conviene parar según la hora de salida, el máximo de conducción, la comida y los descansos, y devuelve 8-12 campings de pernocta alcanzables a esa hora (con desvío real por carretera, hora de llegada y estado de temporada) más un itinerario por noches con alternativas. Cada camping lleva su URL en buscatucamping.com.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "comida_min": {
                "description": "Minutos de parada para comer si se cruzan las 14:00, por defecto 60.",
                "maximum": 180,
                "minimum": 0,
                "type": "integer"
              },
              "descanso_cada_min": {
                "description": "Cada cuántos minutos de conducción se descansa (0 = sin descansos), por defecto 120.",
                "maximum": 300,
                "minimum": 0,
                "type": "integer"
              },
              "descanso_min": {
                "description": "Duración de cada descanso, por defecto 15.",
                "maximum": 60,
                "minimum": 0,
                "type": "integer"
              },
              "destino": {
                "description": "Nombre de la población o provincia (p. ej. \"Burgos\", \"Asturias\"); se reconocen provincias y poblaciones con campings en la guía. Si no se reconoce, coordenadas \"lat,lng\" del lugar.",
                "type": "string"
              },
              "fecha": {
                "description": "Fecha del viaje YYYY-MM-DD (por defecto hoy). Decide el estado de temporada de cada camping.",
                "type": "string"
              },
              "hora_dormir": {
                "description": "Hora (0-24) a la que se quiere estar en el camping, por defecto 20.",
                "maximum": 24,
                "minimum": 12,
                "type": "integer"
              },
              "hora_salida": {
                "description": "HH:MM, por defecto 10:30.",
                "type": "string"
              },
              "max_conduccion_h": {
                "description": "Horas máximas al volante por jornada, por defecto 6. Use max_km si prefiere un tope en km.",
                "maximum": 12,
                "minimum": 1,
                "type": "number"
              },
              "max_km": {
                "description": "Kilómetros máximos por jornada (alternativa a max_conduccion_h).",
                "maximum": 1200,
                "minimum": 100,
                "type": "integer"
              },
              "origen": {
                "description": "Nombre de la población o provincia (p. ej. \"Burgos\", \"Asturias\"); se reconocen provincias y poblaciones con campings en la guía. Si no se reconoce, coordenadas \"lat,lng\" del lugar.",
                "type": "string"
              },
              "perro": {
                "description": "Solo campings que admiten perros.",
                "type": "boolean"
              },
              "prioridad": {
                "description": "Entre trazados alternativos (solo coche): comoda = vías anchas y rápidas (por defecto), rapida = menos tiempo.",
                "enum": ["comoda", "rapida"],
                "type": "string"
              },
              "radio_km": {
                "description": "Desvío máximo en línea recta desde la carretera, por defecto 25.",
                "maximum": 30,
                "minimum": 5,
                "type": "number"
              },
              "vehiculo": {
                "description": "coche = turismo; camper, autocaravana o caravana = perfil de vehículo grande.",
                "enum": ["coche", "camper", "autocaravana", "caravana"],
                "type": "string"
              },
              "velocidad_kmh": {
                "description": "Velocidad media del viajero como tope tramo a tramo, por defecto 90.",
                "maximum": 130,
                "minimum": 40,
                "type": "integer"
              }
            },
            "required": ["destino", "origen"],
            "type": "object"
          },
