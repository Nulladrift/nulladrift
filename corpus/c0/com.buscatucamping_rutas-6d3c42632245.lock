        "name": "buscatucamping",
        "title": "BuscaTuCamping",
        "version": "0.1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "BuscaTuCamping es la guía de campings de España, Portugal, Francia, Andorra, Suiza, Italia, Marruecos y Alemania (más de 10.900 fichas con temporada verificada). Use planificar_ruta cuando alguien viaje en coche, camper, autocaravana o caravana y pregunte dónde hacer noche, en cuántas etapas hacer el viaje o cómo repartir un trayecto largo: devuelve la parada propuesta para la primera jornada con 8-12 campings alcanzables a la hora objetivo y el itinerario completo por noches. Use campings_en_ruta para listar todos los campings cerca de un trayecto («qué campings hay entre A y B») cuando no hacen falta horarios ni etapas. Cada camping devuelto lleva la URL de su ficha, con el resto de sus datos. Origen y destino: escriba el nombre de la población o provincia; el nombre se reconoce si es una provincia o una población con campings en la guía. Si no se reconoce (pueblo sin camping, barrio o dirección), repita con las coordenadas \"lat,lng\" de ese lugar o con la población con campings más cercana, y use siempre las coordenadas exactas si el usuario las da. Los tiempos se calculan con perfil de vehículo grande cuando vehiculo es camper, autocaravana o caravana (velocidades y carreteras de vehículo pesado). Cite siempre el nombre del camping y enlace su url; los datos de temporada indican si está abierto en la fecha del viaje (abierto, cerrado, consultar o desconocido). Añadir un camping a un plan no reserva plaza: recomiende confirmar con el camping. planificar_ruta y campings_en_ruta admiten 10 cálculos por hora y sesión: reúna los datos del viaje antes de llamarlas y no repita la misma ruta. Para buscar campings en una zona sin ruta (servicios, fechas, precio, ficha completa) está el conector de guía de BuscaTuCamping: https://www.buscatucamping.com/mcp-guia.",
      "tools": [
        {
          "name": "campings_en_ruta",
          "title": "Campings en ruta",
          "description": "Lista los campings que quedan cerca de un trayecto por carretera, en el sentido del viaje, con el km de la ruta en el que caen, el desvío, el estado de temporada en la fecha y la URL de su ficha. Para \"qué campings hay entre A y B\" sin planificar horarios.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "destino": {
                "description": "Nombre de la población o provincia (p. ej. \"Burgos\", \"Asturias\"); se reconocen provincias y poblaciones con campings en la guía. Si no se reconoce, coordenadas \"lat,lng\" del lugar.",
                "type": "string"
              },
              "fecha": {
                "description": "Fecha del viaje YYYY-MM-DD (por defecto hoy). Decide el estado de temporada de cada camping.",
                "type": "string"
              },
              "origen": {
                "description": "Nombre de la población o provincia (p. ej. \"Burgos\", \"Asturias\"); se reconocen provincias y poblaciones con campings en la guía. Si no se reconoce, coordenadas \"lat,lng\" del lugar.",
                "type": "string"
              },
              "perro": {
                "description": "Solo campings que admiten perros.",
                "type": "boolean"
              },
              "radio_km": {
                "description": "Desvío máximo en línea recta desde la carretera, por defecto 25.",
                "maximum": 30,
                "minimum": 5,
                "type": "number"
              },
              "vehiculo": {
                "description": "coche = turismo; camper, autocaravana o caravana = perfil de vehículo grande.",
                "enum": ["coche", "camper", "autocaravana", "caravana"],
                "type": "string"
              }
            },
            "required": ["destino", "origen"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Campings en ruta"
          },
