        {
          "name": "ira_deduction_and_roth_limit",
          "title": "Traditional IRA deduction and Roth IRA limit at a modified AGI (2026; 2027 ranges projected)",
          "description": "Runs IRS Publication 590-A Worksheet 1-2 (the deductible part of a traditional IRA contribution when you or your spouse is covered by a plan at work) and Worksheet 2-2 (the reduced Roth IRA contribution limit) for 2026 or 2027 on a given modified AGI, line by line, with the age-50 catch-up, the compensation cap, the spousal IRA rule and the worksheets' rounding and minimum; returns the deductible and nondeductible parts of a traditional contribution, the Roth IRA limit and the Roth room left. The limits and ranges are the website's IRA and Roth income-limit pages' own figures (the 2027 limit and ranges are projections under the statutory indexing formula until the IRS publishes them, labelled as such). Not tax advice.",
          "inputSchema": {
            "properties": {
              "age": {
                "description": "Your age on December 31 of the tax year (18-110): 50 or older adds the catch-up.",
                "type": "integer"
              },
              "amount": {
                "description": "The contribution for the year. Default: your full limit.",
                "type": "number"
              },
              "contribution_type": {
                "description": "traditional (default): the deductible and nondeductible parts of the contribution. roth: your Roth IRA limit at this MAGI.",
                "enum": ["traditional", "roth"],
                "type": "string"
              },
              "covered": {
                "description": "You are covered by a retirement plan at work (the W-2 'Retirement plan' box). Default false.",
                "type": "boolean"
              },
              "filing_status": {
                "description": "single, mfj, hoh, mfs (lived with the spouse at some time in the year) or mfs_apart (married filing separately, lived apart all year: treated as unmarried).",
                "enum": ["single", "mfj", "hoh", "mfs", "mfs_apart"],
                "type": "string"
              },
              "magi": {
                "description": "Modified AGI: the income the worksheets run on.",
                "type": "number"
              },
              "spouse_covered": {
                "description": "mfj or mfs: your spouse is covered by a plan at work. Default false.",
                "type": "boolean"
              },
              "spouse_ira_contributions": {
                "description": "Joint return only: the spouse's own IRA contributions (the spousal IRA rule). Default 0.",
                "type": "number"
              },
              "spouse_wages": {
                "description": "Joint return only: the spouse's wages. Default 0.",
                "type": "number"
              },
              "tax_year": {
                "description": "2026 (default) or 2027. 2027: the limits and phase-out ranges are the 2027 pages' PROJECTIONS under each limit's statutory indexing formula (the IRS's 2027 retirement-plan limits notice is not out yet), labelled as such. Stated in the result.",
                "type": "integer"
              },
              "wages": {
                "description": "Your wages (W-2 box 1): your compensation, which caps the contribution. Default: the MAGI is taken as your compensation.",
                "type": "number"
              }
            },
            "required": ["age", "filing_status", "magi"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:26b734f85985a93e091d75bb89524ce6e22e862535dc2564bb40d7172101187d"
        },
        {
          "name": "irmaa_check",
          "title": "Medicare IRMAA tier for a MAGI",
          "description": "Returns the Medicare IRMAA tier a MAGI sets: the official 2026 tier (from 2024 MAGI) and the 2027 and 2028 tiers (from 2025 and 2026 MAGI) on the tables as QuantCalc projects them, labelled projected; with each the monthly Part B and Part D surcharge per person, the annual total for the people on Medicare, and the distance to the next tier. Reads the same CMS tables as the website's IRMAA calculator.",
          "inputSchema": {
            "properties": {
              "both_spouses_on_medicare": {
                "description": "Joint return only: both spouses are on Medicare (the surcharge is per person). Default true, stated.",
                "type": "boolean"
              },
              "cpi_assumption_percent": {
                "description": "The CPI-U assumption of the projected 2028 floors and the 2027-2028 surcharge amounts: 2.0, 2.5 (default) or 3.0. The 2027 floors do not depend on it: they come from the published CPI-U, as on /irmaa-brackets-2027/.",
                "enum": [2, 2.5, 3],
                "type": "number"
              },
              "filing_status": {
                "description": "Filing status: single, married filing jointly (mfj), married filing separately (mfs) or head of household (hoh).",
                "enum": ["single", "mfj", "mfs", "hoh"],
                "type": "string"
              },
              "magi": {
                "description": "Modified AGI (AGI plus tax-exempt interest) of the 2024 return, which sets the 2026 premiums; also used for 2025 and 2026 unless they are given.",
                "type": "number"
              },
              "magi_2025": {
                "description": "2025 MAGI, which sets the 2027 premiums. Default: magi.",
                "type": "number"
              },
              "magi_2026": {
                "description": "2026 MAGI, which sets the 2028 premiums. Default: magi.",
                "type": "number"
              }
            },
            "required": ["filing_status", "magi"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
