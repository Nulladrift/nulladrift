        {
          "name": "retirement_plan_deferral_savings",
          "title": "401(k), 403(b), 457(b), TSP or SIMPLE IRA deferral limit at an age (2026; 2027 projected)",
          "description": "Returns the 2026 or 2027 elective-deferral limit for a 401(k), 403(b), governmental 457(b), the TSP or a SIMPLE IRA at an age: the base limit, the age-50 and ages 60-63 catch-ups, the SIMPLE higher limit, a non-governmental 457(b) without a catch-up, the part of the catch-up the Roth catch-up wage rule sends in as Roth, and the amount a deferral is figured on when it is over the limit or over the wages. It states that a deferral saves no Social Security or Medicare tax. The limits are the website's contribution-limit pages' own figures (the 2027 limits are projections under the statutory indexing formula until the IRS publishes its 2027 limits notice, labelled as such). Not tax advice.",
          "inputSchema": {
            "properties": {
              "age": {
                "description": "Your age on December 31 of the tax year (18-110): sets the catch-up (50+, and the higher catch-up in the years you turn 60 to 63).",
                "type": "integer"
              },
              "amount": {
                "description": "The pre-tax deferral for the year. Default: your full limit at your age. Over the limit or over your wages it is figured on the lower.",
                "type": "number"
              },
              "higher_limit_simple": {
                "description": "simple only: the employer uses the SECURE 2.0 higher-limit SIMPLE.",
                "type": "boolean"
              },
              "non_governmental_457": {
                "description": "457b only: a tax-exempt (non-governmental) employer's 457(b), which has no catch-up.",
                "type": "boolean"
              },
              "plan": {
                "description": "The workplace plan: 401(k), 403(b), governmental 457(b), the TSP, or a SIMPLE IRA.",
                "enum": ["401k", "403b", "457b", "tsp", "simple"],
                "type": "string"
              },
              "roth_catchup": {
                "description": "Not for simple: true when your prior-year Social Security wages from this employer were over the year's threshold, so the catch-up must go in as Roth (no tax saved now). Default: whether wages are over the threshold, stated in the result.",
                "type": "boolean"
              },
              "tax_year": {
                "description": "2026 (default) or 2027. 2027: the limits and phase-out ranges are the 2027 pages' PROJECTIONS under each limit's statutory indexing formula (the IRS's 2027 retirement-plan limits notice is not out yet), labelled as such. Stated in the result.",
                "type": "integer"
              },
              "wages": {
                "description": "Your wages before the contribution (more than 0): the deferral comes out of them.",
                "type": "number"
              }
            },
            "required": ["age", "plan", "wages"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
