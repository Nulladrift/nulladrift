        {
          "name": "run_tax_aware_projection",
          "title": "Tax-aware projection with the recommended withdrawal order",
          "description": "Runs the retirement projection with the household's accounts split by tax type and returns the withdrawal order and Roth-conversion programme the engine selected, its present-value advantage and range against drawing traditional first, and the after-tax success rate. Federal and state income tax (50 states and DC), Social Security taxability, required minimum distributions, Medicare IRMAA surcharges and the early-withdrawal penalty are paid from the portfolio year by year; spending is what the household keeps after tax. The result states every assumption it used, including the defaults for inputs that were not given, and what the engine does not model.",
          "inputSchema": {
            "properties": {
              "aca_marketplace": {
                "description": "Optional: the household buys marketplace (ACA) health coverage in the retirement years before Medicare. Each path's premium tax credit is figured each year by the federal engine's Form 8962 at that path's own income (no credit above 400% of the poverty line; Medicaid below 138% in expansion states), and the premium after the credit is funded each year and counted by the withdrawal-order search. Needs state.",
                "properties": {
                  "benchmark_premium": {
                    "description": "The household's 2026 annual benchmark (second-lowest-cost silver) premium at its 2026 ages, from healthcare.gov or the state's marketplace. Default: the state-average model, stated in the result.",
                    "type": "number"
                  },
                  "cover_spouse": {
                    "description": "Joint return: the spouse is on the plan too. Default true.",
                    "type": "boolean"
                  },
                  "household_size": {
                    "description": "Tax family size for the poverty line (you, a spouse on a joint return, dependents). Default 2 on a joint return, else 1.",
                    "type": "integer"
                  },
                  "spending_includes_premium": {
