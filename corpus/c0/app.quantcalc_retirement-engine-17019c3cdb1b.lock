      "tools": [
        {
          "name": "aca_premium_tax_credit",
          "title": "2027 ACA marketplace benchmark, poverty line and the 400% cliff",
          "description": "Returns a household's 2027 ACA marketplace position from its state, the ages on the plan, household size and income: the county's benchmark (second-lowest-cost silver) premium from CMS's plan-year-2027 files for the HealthCare.gov states, or a given one; the poverty line that sets 2027 credits (2026 HHS guidelines) and the income as a percentage of it; the 400% cliff income and the headroom below it or the amount over it; and whether the income is below the Medicaid line of an expansion state or below the poverty line. The premium tax credit itself is not figured. Not tax advice.",
          "inputSchema": {
            "properties": {
              "ages": {
                "description": "The ages of the people on the marketplace plan. Ages 21-64 are priced; 65 and over (Medicare) and under 21 are not.",
                "items": {
                  "type": "integer"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "benchmark_monthly": {
                "description": "The household's own monthly benchmark (second-lowest-cost silver) premium for the people on the plan, from healthcare.gov or the state's marketplace. Default: the county's CMS figure when county is given; stated in the result.",
                "type": "number"
              },
              "county": {
                "description": "The county (name, e.g. Miami-Dade, or 5-digit FIPS code) whose CMS plan-year-2027 benchmark premium is read; published for the HealthCare.gov states. Default: none, stated in the result.",
                "type": "string"
              },
              "coverage_year": {
                "description": "The coverage year: 2027 (the CMS county benchmark, the poverty line, the 400% cliff and the headroom, from published data).",
                "enum": [2027],
                "type": "integer"
              },
              "household_size": {
                "description": "Tax family size for the poverty line (the filer, a spouse on a joint return, dependents). Default: the number of ages given, stated in the result.",
                "type": "integer"
              },
              "income": {
                "description": "The household's modified AGI for the credit: AGI plus tax-exempt interest plus the Social Security not taxed, for the coverage year.",
                "type": "number"
              },
              "state": {
                "description": "Two-letter state of residence, or DC.",
                "type": "string"
              }
            },
            "required": ["ages", "coverage_year", "income", "state"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:46ecf307799378d5a5bc25c49a2a4173d9dfa091ee224988cc59cf4a0dd18328"
        },
        {
          "name": "calculate_rmd",
          "title": "Required minimum distribution (RMD) for 2026 or 2027",
          "description": "Computes the required minimum distribution for 2026 or 2027 from the prior year-end balance and the age or birth year, on the IRS Uniform Lifetime Table, or the Joint and Last Survivor Table when the spouse is the sole beneficiary and more than 10 years younger; returns the divisor, the deadline, the SECURE 2.0 start age (73, or 75 for those born 1960 or later), the first-year April 1 option and the two RMDs it stacks into one year, and a multi-year projection with growth. The same figures as the website's RMD calculator.",
          "inputSchema": {
            "properties": {
              "age": {
                "description": "The age the owner reaches by December 31 of the distribution year.",
                "type": "integer"
              },
              "balance_prior_year_end": {
                "description": "The traditional IRA (or plan) balance on December 31 of the year before the distribution year.",
                "type": "number"
              },
              "birth_year": {
                "description": "The owner's birth year; when given it is used instead of age.",
                "type": "integer"
              },
              "growth_rate_percent": {
                "description": "Annual growth of the balance for the projection and the delayed-first-RMD figure, in percent (5 = 5%). Default 0.",
                "type": "number"
              },
              "projection_years": {
                "description": "Years in the projection, 1-30. Default 10.",
                "type": "integer"
              },
              "spouse_age": {
                "description": "The spouse's age reached in the distribution year, for the Joint and Last Survivor Table: read with spouse_sole_beneficiary.",
                "type": "integer"
              },
              "spouse_sole_beneficiary": {
                "description": "The spouse is the sole beneficiary all year: when the spouse is more than 10 years younger the Joint and Last Survivor Table applies. Needs spouse_age. Default false.",
                "type": "boolean"
              },
              "year": {
                "description": "The distribution year: 2026 or 2027 (the same Uniform Lifetime Table). Default 2026.",
                "type": "integer"
              }
            },
            "required": ["age", "balance_prior_year_end"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9942ad03d29883c347ecbaea940ff7c68af400b6803c7b33ff68f8761b751302"
        },
        {
          "name": "compare_return_assumptions",
          "title": "Compare published return assumptions",
          "description": "Runs the same plan against several published capital market assumption sets and returns the success rate and median outcome under each, showing how far the answer moves with the return forecast used. Every input is optional: omitted plan inputs use an illustrative plan, which the reply states in its first line.",
          "inputSchema": {
            "properties": {
              "allocations": {
                "description": "Percentages summing to 100: [US stocks, international stocks, bonds, real estate, cash]. Default [60,10,25,5,0].",
                "items": {
                  "type": "number"
                },
                "maxItems": 5,
                "minItems": 5,
                "type": "array"
              },
              "annual_spending": {
                "description": "Planned yearly spending in today's dollars, before income tax (this tool runs the standard engine, which does not model tax).",
                "type": "number"
              },
              "bucket_years": {
                "description": "Only with withdrawal_strategy bucket: years of spending held in the cash bucket, 1-10.",
                "type": "integer"
              },
              "current_age": {
                "description": "Current age of the primary person.",
                "type": "integer"
              },
              "current_savings": {
                "description": "Total invested portfolio today, in dollars.",
                "type": "number"
              },
              "inflation_rate": {
                "description": "Annual inflation as a percent, e.g. 2.5. Default 2.5.",
                "type": "number"
              },
              "life_expectancy": {
                "description": "Age the plan must last until. Default 92.",
                "type": "integer"
              },
              "monthly_contribution": {
                "description": "Monthly savings until retirement. Default 0.",
                "type": "number"
              },
              "pension": {
                "description": "Yearly pension income. Default 0.",
                "type": "number"
              },
              "pension_start_age": {
                "description": "Age the pension starts. Default 65.",
                "type": "integer"
              },
              "retirement_age": {
                "description": "Age work income stops. Defaults to current age.",
                "type": "integer"
              },
              "return_model": {
                "description": "How returns are generated. parametric (default): the forward-looking published assumptions. bootstrap (stationary block bootstrap of historical months) and historical (real months from 1926 replayed in order) can be requested, but on this connection the engine runs parametric instead and the result says so.",
                "enum": ["parametric", "bootstrap", "historical"],
                "type": "string"
              },
              "returns_source": {
                "description": "Which published return set to use (see list_return_assumption_sources). Default jpmorgan.",
                "type": "string"
              },
              "social_security": {
                "description": "Yearly Social Security in today's dollars. Default 0 — and 0 is reported as an explicit assumption, not hidden.",
                "type": "number"
              },
              "sources": {
                "description": "Source ids to compare. Defaults to all.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "spending_confidence": {
                "description": "The success rate the 'sustainable spending' answer is solved at: the most this plan can spend each year and still succeed on at least this percentage of paths, with the same answer if every balance were 20% lower or higher today. One of 75, 80, 85, 90, 95. Default 90.",
                "enum": [75, 80, 85, 90, 95],
                "type": "integer"
              },
              "ss_start_age": {
                "description": "Age Social Security starts. Default 67.",
                "type": "integer"
              },
              "withdrawal_strategy": {
                "description": "Spending rule. fixed (default): the planned amount, inflation-adjusted, every year. guyton-klinger: guardrails that cut or raise spending as the portfolio moves. vpw: variable percentage withdrawal. bucket: a cash reserve of bucket_years of spending.",
                "enum": ["fixed", "guyton-klinger", "vpw", "bucket"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
