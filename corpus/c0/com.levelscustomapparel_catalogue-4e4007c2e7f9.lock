{
  "lockfileVersion": 2,
  "subjects": {
    "com.levelscustomapparel/catalogue": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://levelscustomapparel.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "levels-custom-apparel",
        "title": "Levels Custom Apparel",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Levels Custom Apparel: UK custom clothing, embroidered or printed, no minimum order. Search garments, read a garment's facts, get a real price with a logo, read the business facts, then use build_order to set up what the customer wants and give them its link. Orders are finished by the customer on the site, where they add their logo and pay; these tools never take payment or personal details.",
      "tools": [
        {
          "name": "build_order",
          "title": "Build an order",
          "description": "Build the customer's order: one garment, how many of each size in each colour, how the logo is made and where it goes. Checks stock, prices it and gives a link that opens the garment with all of that chosen. The customer adds their logo there, checks it and pays; nothing is ordered until they do.",
          "inputSchema": {
            "properties": {
              "lines": {
                "description": "One entry per colour.",
                "items": {
                  "properties": {
                    "colour": {
                      "description": "A colour name from get_product",
                      "type": "string"
                    },
                    "sizes": {
                      "additionalProperties": {
                        "minimum": 1,
                        "type": "integer"
                      },
                      "description": "How many of each size, e.g. {\"M\": 10, \"L\": 15}",
                      "type": "object"
                    }
                  },
                  "required": ["colour", "sizes"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "method": {
                "description": "How the logo is applied. Default PRINT.",
                "enum": ["PRINT", "EMBROIDERY"],
                "type": "string"
              },
              "position": {
                "description": "Where the logo goes. Default front, the left chest.",
                "enum": ["front", "back"],
                "type": "string"
              },
              "slug": {
                "description": "The product's slug, from search_products",
                "type": "string"
              }
            },
            "required": ["lines", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:01953df53294ae80dd33429c93b6260464274ebe986cefd18f15bea8d55e1000"
        },
        {
          "name": "get_business_facts",
          "title": "Read the business facts",
          "description": "Timings, delivery, minimums, set-up, decoration methods, samples, returns and contact details, as the site states them.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6a5deea0cdd4abfa934afccf4ecde4dfc3460790bca258cbc899877ab3e30336"
        },
        {
          "name": "get_product",
          "title": "Read a garment",
          "description": "The facts of one garment: brand, fabric, fit, every colour with its sizes in stock, what it suits, its price before a logo and its link.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The product's slug, from search_products",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0f8105aa60e679b3a07f8a93e9568185af5aa6d6443784ab5ae7c130f4dae363"
        },
        {
          "name": "get_quote",
          "title": "Price a garment with a logo",
          "description": "A real price from the site's own pricing engine for one garment at a quantity, with one logo on the left chest at a typical size. The product page prices the customer's real artwork exactly.",
          "inputSchema": {
            "properties": {
              "method": {
                "description": "How the logo is applied. Default PRINT.",
                "enum": ["PRINT", "EMBROIDERY"],
                "type": "string"
              },
              "quantity": {
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "The product's slug, from search_products",
                "type": "string"
              }
            },
            "required": ["quantity", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:551402d2a002e3bceca5774ddbc4095dcd101e7d89d5500fa8e76858397f01cd"
        },
        {
          "name": "search_products",
          "title": "Search garments",
          "description": "Search every garment Levels sells by category, brand, trade, colour, fabric, budget and more. Returns how many match, how they spread, and the best 15 with prices before a logo and links.",
          "inputSchema": {
            "properties": {
              "big_sizes": {
                "description": "true when sizes above 3XL are needed"
              },
              "brand": {
                "description": "brand name"
              },
              "budget_max": {
                "description": "number, most per blank garment in pounds"
              },
              "budget_min": {
                "description": "number"
              },
              "category": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                ],
                "description": "one or more of: Accessories, Aprons and tabards, Bags, Chef and catering, Dresses and skirts, Fleeces, Footwear, Gilets and bodywarmers, Headwear, Hi-vis, Hoodies, Jackets, Joggers and leggings, Knitwear, Polos, Shirts and blouses, Shorts, Softshells, Suits and tailoring, Sweatshirts, T-shirts, Towels and home, Trousers, Underwear and nightwear, Workwear overalls"
              },
              "colour": {
                "description": "colour family, one or more of: black, blue, brown, green, grey, multi, natural, navy, orange, pink, purple, red, white, yellow"
              },
              "eco": {
                "description": "recycled | organic | any"
              },
              "fabric": {
                "description": "cotton | poly-cotton | polyester | nylon | wool-and-knit"
              },
              "features": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                ],
                "description": "array of: waterproof, water-repellent, windproof, breathable, moisture-wicking, padded, stretch, hooded, full-zip, quarter-zip, pockets, long-sleeve, short-sleeve, v-neck, hi-vis, hi-vis-class-1, hi-vis-class-2, hi-vis-class-3, reflective, flame-retardant, 60-wash, easy-care, anti-pill, uv-protection, antibacterial, food-safe, rebrandable-label"
              },
              "fit": {
                "description": "regular | slim | relaxed"
              },
              "sort": {
                "description": "best | cheapest | premium"
              },
              "trade": {
                "description": "one of: construction, landscaping, trades-and-engineering, warehouse-and-logistics, cleaning-and-facilities, security, hospitality, catering-and-kitchen, retail, healthcare-and-care, salon-and-beauty, office-and-corporate, schools-and-education, sports-teams, fitness-and-gym, events-and-festivals, charity-and-fundraising, merch-and-gifts, outdoor-and-leisure"
              },
              "weight": {
                "description": "light | mid | heavy"
              },
              "who": {
                "description": "unisex | men | women | mixed | kids (mixed = a team of men and women; then also search women's fits)"
              },
              "words": {
                "description": "words that must appear in the product name, e.g. 'zip' or 'oxford' (use sparingly)"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f4e44a17b8b435ae760cabc939e3c6b625ac3e98ccfa4b7b04918ced5e3aa1f8"
        },
        {
          "name": "start_order",
          "title": "Start an order",
          "description": "The link that takes the customer to a garment to add their logo, choose sizes and pay, and the link to ask for a sample first. Give these to the customer; nothing is ordered until they finish it.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The product's slug, from search_products",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:88f2fe701f6740914dff5c7d1a531cd3efa2330d5f8488c6e717362eb8bfe4c7"
        }
      ],
      "digest": "sha256:50690dd02e2b873fa49ff3873d6b0ae45ed1e5a08ff47c9c5f42457e66d391f0"
    }
  }
}
