                "default": null,
                "description": "Part of the muscle group name.",
                "title": "Muscle Group"
              },
              "query": {
                "anyOf": [
                  {
                    "maxLength": 64,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
