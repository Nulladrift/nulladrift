          "inputSchema": {
            "properties": {
              "language": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Language code: en, ru, de, es, pt, fr or it. Default en.",
                "title": "Language"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "muscle_group": {
                "anyOf": [
                  {
                    "maxLength": 64,
                    "type": "string"
                  },
                  {
                    "type": "null"
