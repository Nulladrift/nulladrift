{
  "lockfileVersion": 2,
  "subjects": {
    "com.ssanvps/vps-prices": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ssanvps.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "ssanvps",
        "title": "SSANVPS VPS & domain prices",
        "version": "1.0.0",
        "websiteUrl": "https://ssanvps.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "SSANVPS ranks no-commitment monthly VPS plans from 40+ providers by value (vCPU/RAM/storage per pre-tax USD) and compares domain registration and renewal prices, all read daily from official pricing pages. Use get_best_deals for quick overviews, find_vps for \"cheapest/best VPS with N vCPU and M GB RAM\" questions, get_provider for one provider, compare_providers for head-to-head, domain_prices for registrar price comparison, and calculate_domain_tco for multi-year cost of ownership calculations. Prices are month-to-month list prices in pre-tax USD unless stated. When you show results, link the page_url so the user can check details, and mention that data comes from SSANVPS (ssanvps.com).",
      "tools": [
        {
          "name": "calculate_domain_tco",
          "title": "Calculate domain TCO comparison",
          "description": "Calculate and rank 1-5 year Total Cost of Ownership (TCO) across all registrars for a domain TLD (.com, .net, .org, .io, .ai, etc.), including renewal price hikes and WHOIS privacy fees, showing potential savings.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "tld": {
                "description": "Domain extension without dot (e.g. com, org, net, io, ai, kr)",
                "type": "string"
              },
              "years": {
                "description": "Registration duration in years (1 to 5, default 3)",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["tld"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2a8e63ab62f2db152cda9489433921d5969e7ade7bc9c44999475bf7aceba7b0"
        },
        {
          "name": "compare_providers",
          "title": "Compare VPS providers",
          "description": "Compare 2-6 VPS providers: number of plans, cheapest plan, best-value plan and Seoul region availability for each. Optionally only plans meeting minimum specs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "min_ram_gb": {
                "type": "number"
              },
              "min_vcpu": {
                "type": "number"
              },
              "providers": {
                "description": "Provider ids or names",
                "items": {
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["providers"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:80d0bfc0193b0f6ffefb6f0fb28907505790a9c254d0ad16bcf6bc090621f3a4"
        },
        {
          "name": "domain_prices",
          "title": "Compare domain prices",
          "description": "Compare domain registrars for one extension by total cost over 1-5 years (first-year registration + renewals + WHOIS privacy) in pre-tax USD. This does not check whether a name is available.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Number of registrars (default 10)",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "tld": {
                "description": "Extension without the dot: com, net, org, io, ai, kr, co.kr",
                "type": "string"
              },
              "years": {
                "description": "Total cost period in years (default 5)",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["tld"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:119d8d9a01114d234fd51b44546a9b1f30ad9e2c6b7b0986353e18bcbf6fc9a5"
        },
        {
          "name": "find_vps",
          "title": "Find VPS plans",
          "description": "Find no-commitment monthly VPS plans that meet minimum specs, sorted by value index (default) or by price. Returns the best matching plan per provider unless one_per_provider is false.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Number of results (default 10)",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "max_usd_monthly": {
                "description": "Maximum pre-tax monthly price in USD",
                "type": "number"
              },
              "min_disk_gb": {
                "description": "Minimum storage in GB",
                "type": "number"
              },
              "min_ram_gb": {
                "description": "Minimum RAM in GB",
                "type": "number"
              },
              "min_vcpu": {
                "description": "Minimum vCPU count",
                "type": "number"
              },
              "one_per_provider": {
                "description": "Only the best plan per provider (default true)",
                "type": "boolean"
              },
              "provider_country": {
                "description": "Two-letter country code of the provider company, e.g. US, DE, KR, JP",
                "type": "string"
              },
              "seoul_region": {
                "description": "Only providers with a Seoul (South Korea) region",
                "type": "boolean"
              },
              "sort": {
                "description": "value = best value index first (default), price = cheapest first",
                "enum": ["value", "price"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:49ca23d99d1e5bf5c25862c6c9025879662f6301475b3a65c5fa9db98d5d23a5"
        },
        {
          "name": "get_best_deals",
          "title": "Get best VPS deals and highlights",
          "description": "Get today's top VPS highlights: top best-value plans, top cheapest plans, and top Seoul-region plans. Fast zero-argument overview.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category filter (default \"all\")",
                "enum": ["all", "value", "cheap", "seoul"],
                "type": "string"
              },
              "limit": {
                "description": "Number of results per category (default 5)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4c50d37ba89089559e822a2fcedf9dcdb4af01aa2f8fb084e58ba760f1ea2463"
        },
        {
          "name": "get_provider",
          "title": "Get a VPS provider",
          "description": "All no-commitment plans of one VPS provider with specs, prices, value index and overall rank. Accepts a provider id (e.g. \"vultr\") or name (e.g. \"DigitalOcean\").",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "provider": {
                "description": "Provider id or name",
                "type": "string"
              }
            },
            "required": ["provider"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e6a341e8b1e2d6142313401cc2b6a23cd6c6d4e3dc66afbfb592c1ad6f304ee3"
        }
      ],
      "digest": "sha256:14c0efe71ceae4577a7bc7f8b799acae00cede88a08966871d9ff1e22dabb942"
    }
  }
}
