{
  "lockfileVersion": 2,
  "subjects": {
    "ai.leadfuzion.mcp/agent-store": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.leadfuzion.ai/api/v1/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "leadfuzion-agent-store",
        "title": "LeadFuzion Agent Store",
        "version": "0.1.0"
      },
      "capabilities": {
        "experimental": {
          "payment": {
            "methods": {
              "stripe": {
                "intents": ["charge"]
              },
              "tempo": {
                "intents": ["charge"]
              }
            },
            "x402": {
              "networks": ["eip155:8453"],
              "version": 2
            }
          }
        },
        "tools": {}
      },
      "instructions": "Free: list_packages, get_package_quote. Paid: buy_package (price shown first; pay by card via MPP, USDC on Base via x402, or Tempo; or pay over HTTPS and pass order_token).",
      "tools": [
        {
          "name": "buy_package",
          "title": "Buy a lead package",
          "description": "Buy one LeadFuzion lead package (one item_id) at its listed price. Call get_package_quote first: it is free and shows the price. Without payment this returns the price and how to pay (x402 USDC on Base, MPP card, or MPP Tempo), and nothing is charged. If your client cannot pay inside MCP, pay at the HTTPS URL given and pass the order_token back here.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accept_terms": {
                "description": "Must be true: you accept the terms at terms_url.",
                "type": "boolean"
              },
              "buyer": {
                "description": "Who is buying: person or company name plus a contact. Recorded with the order.",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              },
              "item_id": {
                "pattern": "^[A-Za-z0-9_-]{1,64}$",
                "type": "string"
              },
              "order_token": {
                "description": "Proof of a purchase already paid at the HTTPS endpoint or in an earlier call. Redelivers that order; no charge, no attestation needed. Valid 7 days.",
                "maxLength": 200,
                "minLength": 20,
                "type": "string"
              },
              "purpose": {
                "description": "What the leads will be used for. Recorded with the order.",
                "maxLength": 500,
                "minLength": 10,
                "type": "string"
              },
              "terms_version": {
                "description": "terms_version from get_package_quote",
                "type": "string"
              }
            },
            "required": ["item_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Buy a lead package"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:62ad74c5cd2e10af573accc3db275ef57e914b3802aaf635e9f8ce0348944774"
        },
        {
          "name": "get_package_quote",
          "title": "Get price and details for one package",
          "description": "Get the price, lead count, record fields, buyer attestation rules and payment options for one package. Free: nothing is charged and no records are returned. Call this before buy_package.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "item_id": {
                "pattern": "^[A-Za-z0-9_-]{1,64}$",
                "type": "string"
              }
            },
            "required": ["item_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get price and details for one package"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:98b2289a5e7b3ad062f37f8d7b2092178d12f1bce9b949735b440ec36386cf09"
        },
        {
          "name": "list_packages",
          "title": "List lead packages for sale",
          "description": "List LeadFuzion lead packages for sale: Historical Probate and FirstUp packages, one county and one month each. Pass state and county (e.g. AZ and Maricopa): the catalog is listed one county at a time. Free; nothing is charged. Each package shows its price and lead count; a lead set costs the same with or without skip tracing. Call get_package_quote for the terms and how to pay.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "county": {
                "description": "County name without the word County",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "lead_type": {
                "enum": ["Probate", "FirstUp"],
                "type": "string"
              },
              "limit": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "state": {
                "description": "Two-letter US state, e.g. AZ",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List lead packages for sale"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f08a3e938ad5dee1bff017be0adae271663be6af9d8b8ef115de1faef8fa3d1a"
        }
      ],
      "digest": "sha256:51f7506cf2434874f9e51821f9740b3e1cb6d35c3fc962b8181a81c538b38813"
    }
  }
}
