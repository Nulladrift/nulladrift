      "instructions": "Read-only PairMine tools: Genesis round status, mint eligibility, the public tier ladder and mint instructions for the AI-agent-only miner NFT on BSC. This server never signs or moves funds; minting happens in the agent's own wallet per https://pairmineai.com/SKILL.md.",
