      },
      "instructions": "FSH Labs laser cuts acrylic, wood and Delrin in metro Atlanta, Georgia, and ships in the US. Use these tools for a person who wants parts cut: get_catalog for materials and limits, quote_laser_file to price their DXF or SVG, create_order to make a payment link they open to pay by card, get_order_status to check on it, and request_custom_quote when the file can't be priced instantly. With no drawing, list_templates and quote_template price a part from its dimensions. For engraved gifts and products, list_products and quote_product price one with the person's text. create_order takes all three kinds. After the person pays: get_order_status says where the order stands and holds its proof, get_proof_image shows the proof (only the person can approve it, from their email), quote_reorder and create_reorder order the same thing again, request_order_change passes the shop a request to cancel or change it, and find_order finds an order from its number and the buyer's email or ZIP. No account or key is needed. Never invent a price; parts are cut exactly as drawn, so confirm sizes with the person. Guide: https://www.fshlabs.com/agents",
      "tools": [
        {
          "name": "create_order",
          "title": "Make a payment link for the person",
          "description": "Saves the priced job as an unpaid order and answers with a pay link for the person. Prices hold for 30 days. They open the link, check the order and pay by card on Stripe; address, phone and sales tax are handled there. Nothing is made, and nobody is charged, until they pay. Takes the same file and options as the quote, so quote first and pass its file_id. With kind laser-template or personalize it orders a template part or a personalized product instead, from the same fields quote_template or quote_product took. For several things in one order (one pay link, one order minimum, one parcel), send `items` instead of one thing's own fields: price the set first with quote_order.",
          "inputSchema": {
            "properties": {
              "contact": {
                "description": "Who the order is for. Optional: Stripe collects the name, email and address when they pay.",
                "properties": {
                  "company": {
                    "maxLength": 160,
                    "type": "string"
                  },
                  "email": {
                    "description": "The person's email, so the shop can reach them about the order",
                    "maxLength": 320,
