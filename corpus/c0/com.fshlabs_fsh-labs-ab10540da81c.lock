        {
          "name": "get_proof_image",
          "title": "The proof, as a picture",
          "description": "The proof the shop sent for an order, as a PNG or JPEG to show the person: the proof itself, or the first page of a PDF proof. Use `proof.image_url` from get_order_status as is. This shows the proof; it can't approve it. The person approves, or asks for changes, from the proof link in the email we sent them.",
          "inputSchema": {
            "properties": {
              "full": {
                "anyOf": [
                  {
                    "const": "1",
                    "type": "string"
                  },
                  {
                    "const": "true",
                    "type": "string"
                  },
                  {
                    "const": true,
                    "type": "boolean"
                  }
                ],
                "description": "Send 1 for the whole proof when it is a PDF. Left out, the answer is always a picture"
              },
              "order_id": {
                "description": "e.g. FSH-20261118-K7M2QX",
                "type": "string"
              },
              "round": {
                "anyOf": [
                  {
                    "maximum": 9999,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "pattern": "^[1-9]\\d{0,3}$",
                    "type": "string"
                  }
                ],
                "description": "The proof round: `proof.round` in get_order_status. Earlier rounds stay available"
              },
              "status_token": {
                "description": "The last part of the status_url that create_order answered with",
                "type": "string"
              }
            },
            "required": ["order_id", "round", "status_token"],
            "type": "object"
