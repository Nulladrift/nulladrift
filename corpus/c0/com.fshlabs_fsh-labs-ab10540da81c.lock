              },
              "file_url": {
                "description": "A public https link to the DXF or SVG, up to 10 MB. We download it.",
                "maxLength": 2000,
                "type": "string"
              },
              "material": {
                "description": "A material slug from the catalog, e.g. birch-125",
                "maxLength": 60,
                "type": "string"
              },
              "qty": {
                "description": "How many. For a file holding several parts, how many sets of the whole file.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "scale": {
