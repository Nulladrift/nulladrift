              },
              "file": {
                "description": "ChatGPT only: a file the person attached to the chat. Other clients use file_url, file_text or file_base64.",
                "properties": {
                  "download_url": {
                    "type": "string"
                  },
                  "file_id": {
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "file_base64": {
                "description": "The file's bytes, base64, up to 4 MB. Send with file_name.",
                "type": "string"
              },
              "file_id": {
                "description": "A file sent in an earlier call (every quote answers with one). Kept 30 days.",
                "maxLength": 40,
