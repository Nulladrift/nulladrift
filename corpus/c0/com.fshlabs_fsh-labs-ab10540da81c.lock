                    "maxLength": 120,
                    "type": "string"
                  },
                  "po": {
                    "description": "Their purchase order number, printed on the receipt",
                    "maxLength": 60,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "file": {
                "description": "ChatGPT only: a file the person attached to the chat. Other clients use file_url, file_text or file_base64.",
