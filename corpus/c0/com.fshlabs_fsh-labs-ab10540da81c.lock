        {
          "name": "quote_order",
          "title": "Price several things as one order",
          "description": "Prices a list of things as one order: each item at its own quantity, ONE order minimum for the lot, and ONE parcel to one ZIP. Send up to 20 items; each is a file you already quoted (by file_id), a template part or a personalized product, with its own material and quantity. The answer says what the whole order costs and what it saves against ordering each item alone. Nothing is stored. To change the order, change the list and call again; when the person is happy, send the same items to create_order.",
          "inputSchema": {
            "properties": {
              "items": {
                "description": "Several things as ONE order: one payment link, one order minimum, one parcel. Up to 20. Each item takes the same fields as an order of one thing (kind, material, qty, template, values, product, text ...), with its own quantity. A laser-file item names its file by file_id: quote the file first with quote_laser_file, which answers with the id. The same file_id may appear in several items, e.g. the same part in two materials.",
                "items": {
                  "properties": {
                    "file_id": {
                      "description": "A file sent in an earlier call (every quote answers with one). Kept 30 days.",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "font": {
                      "description": "A font key from the product's fonts in list_products. Left out, the first is used.",
                      "maxLength": 20,
                      "type": "string"
                    },
                    "kind": {
                      "default": "laser-file",
                      "description": "What is being ordered. laser-file (the default): a DXF or SVG, with the file fields and material. laser-template: template, values and material. personalize: product, variant, text and font.",
                      "enum": ["laser-file", "laser-template", "personalize"],
                      "type": "string"
                    },
                    "material": {
                      "description": "A material slug from get_catalog. Needed for laser-file; optional for laser-template; not used for personalize.",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "names": {
                      "description": "A different name on each piece, one per piece, for products with takes_names. `text` is then the first name.",
                      "items": {
                        "maxLength": 200,
                        "type": "string"
                      },
                      "maxItems": 5000,
                      "type": "array"
                    },
                    "notes": {
                      "description": "Anything the shop should know. A person reads it before making the order.",
                      "maxLength": 500,
                      "type": "string"
                    },
                    "product": {
                      "description": "A product slug from list_products",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "qty": {
                      "description": "How many. For a file holding several parts, how many sets of the whole file.",
                      "maximum": 10000,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "scale": {
                      "default": 1,
                      "description": "Resize the part: 1 is the file's own size, 0.5 is half.",
                      "exclusiveMinimum": 0,
                      "maximum": 100,
                      "type": "number"
                    },
                    "template": {
                      "description": "A template slug from list_templates, e.g. mounting-plate",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "text": {
                      "anyOf": [
                        {
                          "maxLength": 400,
                          "type": "string"
                        },
                        {
                          "items": {
                            "maxLength": 40,
                            "type": "string"
                          },
                          "maxItems": 3,
                          "type": "array"
                        }
                      ],
                      "description": "The text to put on it: up to 3 lines of 40 characters, as an array or one string with line breaks"
                    },
                    "units": {
                      "description": "The units a DXF is drawn in when the file doesn't say. Leave out to let us read the file; the answer says what was assumed.",
                      "enum": ["in", "mm"],
                      "type": "string"
                    },
                    "values": {
                      "additionalProperties": {
                        "type": "number"
                      },
                      "default": {},
                      "description": "The template's parameters by key. Lengths are in inches; a toggle is 1 or 0; a choice is one of its option values. Any left out take the template's default.",
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "variant": {
                      "description": "A variant slug (a colour or size) from list_products. Left out, the first is used; the answer says which.",
                      "maxLength": 60,
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "ship_zip": {
                "description": "The 5-digit US ZIP it would ship to. Given, the answer adds what shipping costs and the total before sales tax, so the person sees the whole price before an order is made.",
                "maxLength": 10,
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
