        {
          "name": "get_order_status",
          "title": "Where an order stands",
          "description": "Where the order stands: whether it is paid, waiting on a proof, in production, shipped (with tracking) or ready for pickup. Use the status_url from create_order as is. Once a proof is sent, `proof` holds its picture link, the shop's note and whether the person has decided; show it to them, but only they can approve it, from the link in their email. `events` is the order's history, so one call after a week says what happened in between, `cancellation` says whether it can still be cancelled, and `check_again_in_s` says when to look again.",
          "inputSchema": {
            "properties": {
              "order_id": {
                "description": "e.g. FSH-20261118-K7M2QX",
                "type": "string"
              },
              "status_token": {
                "description": "The last part of the status_url that create_order answered with",
                "type": "string"
              }
            },
            "required": ["order_id", "status_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
