        {
          "name": "quote_reorder",
          "title": "Price a paid order again",
          "description": "For \"order more of what I got last time\". Prices a paid order's same file or design at a new quantity, at today's prices, with the quantity break for the new quantity. Answers with what the order was, the price, the same job at other quantities, and whether a proof is needed: none when the same art was already approved. Use the reorder_url from create_order as is, or the reorder link from the person's email. Works for an order of one item; nothing is stored and nothing is charged.",
          "inputSchema": {
            "properties": {
              "order_id": {
                "description": "The paid order to repeat, e.g. FSH-20261118-K7M2QX",
                "type": "string"
              },
              "qty": {
                "description": "How many this time. Left out, the same quantity as the original order",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "reorder_token": {
                "description": "The last part of the order's reorder link: the reorder_url create_order answered with, or the reorder link in the person's own email from us",
                "type": "string"
              },
              "ship_zip": {
                "description": "The 5-digit US ZIP it would ship to. Given, the answer adds what shipping costs and the total before sales tax, so the person sees the whole price before an order is made.",
                "maxLength": 10,
                "type": "string"
              }
            },
            "required": ["order_id", "reorder_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
