        {
          "name": "find_order",
          "title": "Find an order whose status link was lost",
          "description": "For a person who has their order number but not the status link. Send the order number and one thing only its buyer knows: the email it was paid with, or the ZIP it shipped to. Answers the same body as get_order_status, plus the status_url to keep. It finds paid orders only, and reveals nothing else: no name, address, pay link or file. Every miss answers the same not-found, whatever was wrong, and each order takes five tries a day. Try the person's emails first: every one we sent about the order has its status link.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "The email the order was paid with",
                "maxLength": 320,
                "type": "string"
              },
              "order_id": {
                "description": "The order number from the person's receipt, e.g. FSH-20261118-K7M2QX",
                "maxLength": 40,
                "type": "string"
              },
              "ship_zip": {
                "description": "The 5-digit ZIP the order shipped to. A pickup order has none: use email",
                "maxLength": 10,
                "type": "string"
              }
            },
            "required": ["order_id"],
            "type": "object"
          },
