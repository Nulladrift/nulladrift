        },
        {
          "name": "request_order_change",
          "title": "Ask the shop to cancel or change an order",
          "description": "Passes the person's request about a paid order to a person at the shop: cancel it, change it, or a question. It changes nothing by itself. The shop replies to the email the order was paid with, and confirms with them before cancelling or changing anything. The answer says what the terms allow right now: a full refund before the order is in production, a refund only if nothing is cut yet once it is, and the remake terms after it is made. Timing matters, so send it as soon as the person asks. POST to the order's status_url with /requests on the end. An unpaid order needs no cancelling: it is never made and lapses on its pay_by date.",
          "inputSchema": {
            "properties": {
              "kind": {
                "description": "cancel: stop the order and refund it. change: a different quantity, file, text or address. question: anything else about the order",
                "enum": ["cancel", "change", "question"],
                "type": "string"
              },
              "message": {
                "description": "What the person wants, in their words where you can: what to change and to what. A person at the shop reads it",
                "maxLength": 1500,
                "minLength": 10,
                "type": "string"
              },
              "order_id": {
                "description": "e.g. FSH-20261118-K7M2QX",
                "type": "string"
              },
              "status_token": {
                "description": "The last part of the status_url that create_order answered with",
                "type": "string"
              }
            },
            "required": ["kind", "message", "order_id", "status_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
