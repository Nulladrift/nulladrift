        {
          "name": "request_custom_quote",
          "title": "Ask a person at the shop for a price",
          "description": "For anything the instant quote can't price: a file with open outlines or engraving artwork, a PDF or sketch, a material that isn't listed, engraving, marking or full-color UV printing, or a run of 500 or more. It reaches the shop's inbox and a person replies to the email given within 24 hours. Hand-quoted work has a $25 minimum. Send one request per job.",
          "inputSchema": {
            "properties": {
              "company": {
                "maxLength": 160,
                "type": "string"
              },
              "details": {
                "description": "What they need: the part, material, thickness, sizes, finish, engraving, and anything the instant quote couldn't handle",
                "maxLength": 3000,
                "minLength": 10,
                "type": "string"
              },
              "email": {
                "description": "The person's email. The shop replies to it; we send nothing to it automatically.",
                "maxLength": 320,
                "type": "string"
              },
              "files": {
                "default": [],
                "description": "Up to 5 files, each sent the same ways as a quote's file. Any of: stl, 3mf, obj, step, stp, svg, dxf, pdf, png, jpg, jpeg, webp, heic, heif, ai, eps, dwg, cdr",
                "items": {
                  "properties": {
                    "file_base64": {
                      "description": "The file's bytes, base64, up to 4 MB. Send with file_name.",
                      "type": "string"
                    },
                    "file_id": {
                      "description": "A file sent in an earlier call (every quote answers with one). Kept 30 days.",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "file_name": {
                      "description": "The file's name with its extension",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "file_text": {
                      "description": "The file's own text (DXF and SVG are both plain text), up to 4 MB. Send with file_name.",
                      "type": "string"
                    },
                    "file_url": {
                      "description": "A public https link to the DXF or SVG, up to 10 MB. We download it.",
                      "maxLength": 2000,
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 5,
                "type": "array"
              },
              "material": {
                "description": "A material slug from the catalog, if they chose one",
                "maxLength": 60,
                "type": "string"
              },
              "name": {
                "description": "The person's name",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "needed_by": {
                "description": "A date, if they have a deadline",
                "maxLength": 40,
                "type": "string"
              },
              "phone": {
                "maxLength": 40,
                "type": "string"
              },
              "po": {
                "maxLength": 60,
                "type": "string"
              },
              "qty": {
                "default": 1,
                "maximum": 1000000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["details", "email", "name"],
            "type": "object"
          },
          "annotations": {
