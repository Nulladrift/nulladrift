        {
          "name": "quote_laser_file",
          "title": "Price a DXF or SVG",
          "description": "Prices one cut file in one material at one quantity, with the same engine the website charges from. Answers with the price, the same job at other quantities (price_breaks), the lead time, the part sizes we read, and any issues with the file. Send compare_materials to price it in other materials in the same call, and ship_zip to add shipping and the total before tax. A file that can't be priced instantly still answers 200, with priceable false and the reasons. Nothing is stored against a person and nothing is charged. Also available as GET with the same fields as query parameters (file_url or file_id only).",
          "inputSchema": {
            "properties": {
              "compare_materials": {
