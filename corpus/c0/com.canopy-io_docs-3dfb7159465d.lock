{
  "lockfileVersion": 2,
  "subjects": {
    "com.canopy-io/docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://canopy-io.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "canopy-docs",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "explain_capability",
          "title": "Explain an administrator capability",
          "description": "What a capability such as env_roles.manage or billing.manage lets someone do, and which pages it opens. The answer to \"why can't I see this button\": a page shows only for someone holding one of its listed capabilities, and its write actions only for the matching manage capability.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "capability": {
                "description": "A capability key, e.g. env_roles.view.",
                "type": "string"
              }
            },
            "required": ["capability"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0ad07b26dae60e2446725cd52562a75f9fbe4061df6c59dfe4cc5019ec53a8ff"
        },
        {
          "name": "find_surface",
          "title": "Find where something is done in the dashboards",
          "description": "Given what someone wants to do (\"rotate a webhook secret\", \"invite an administrator\", \"why can't I see Hierarchy\"), return the pages where it happens, ranked, each with its menu path, the capability that opens it, and its guide.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "query": {
                "description": "What the person wants to do, in their words.",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0838176254b0da984f27849ecfdb7b8e6f592d5511e5e860cd340592e2904d0c"
        },
        {
          "name": "get_guide",
          "title": "Read a guide",
          "description": "A docs page as markdown: for a dashboard guide, the menu path, the exact controls to click in order, and the reasons a control may be missing. Pass the guide URL or path from find_surface or list_surfaces, or a surface id such as console.roles.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "page": {
                "description": "A docs URL, a /docs/... path, or a surface id.",
                "type": "string"
              }
            },
            "required": ["page"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:de1362b12a00e1a629fcabf33f3e34261aea1550c48d470f89d9ceef6e1b3931"
        },
        {
          "name": "list_surfaces",
          "title": "List every page of the Developer Console and Admin Workspace",
          "description": "Every left-nav page of both signed-in applications: the application, the menu path in the labels on screen, the capability that opens it, what must be selected first, and the guide that walks through it. The same data as /ai/ui-map.json.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "application": {
                "description": "Limit to one application.",
                "enum": ["Developer Console", "Admin Workspace"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b83a5b007f294c9d1a9f7c7e5fff931b909de5c95799cde6480490f5c89ed536"
        },
        {
          "name": "search_api",
          "title": "Find the API operation behind a task",
          "description": "Search the published OpenAPI documents by words from the task or the resource. Returns method, path, operation id, and the reference page for each match. Reference pages live at /docs/api-reference/{operationId}; never guess those URLs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "query": {
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6fdbec3c5b6d9e71c21c3361d678e3debfad3777f6619e4904a9e122a52371dc"
        }
      ],
      "digest": "sha256:c3963067ee408f902203befb92f4dd38c0dc30d17404edb85d5228d5fc123c4e"
    }
  }
}
