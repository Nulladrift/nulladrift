{
  "lockfileVersion": 2,
  "subjects": {
    "com.keepbal/keepbal": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://keepbal.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "keepbal",
        "title": "KeepBal",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Search, inspect, then run. Get a key at https://keepbal.com/console. Tool calls require a bearer key; search and inspection are free.",
      "tools": [
        {
          "name": "get_run",
          "description": "Check and settle an existing run by run_id through REST ownership and access controls. No new execution or additional polling fee; the original execution charge may settle. Use after run_tool reports pending.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "run_id": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["run_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6c2ceffd80025f183e13eb815c4a11b42bb41dbee351a2a58914b25e702d6ae8"
        },
        {
          "name": "inspect_tool",
          "description": "Read local public tool metadata, known parameters, pricing metadata and a JSON request example. Fixed tools show the per-call price; variable tools are billed at provider price + 35%. This is not an input-specific quote. Free; does not contact a provider. Unknown input schemas are explicitly marked.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "tool": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a8da09c3de8b404b9c42a9e72a12df0f95056b32b18d4fd9160c115f197bae2f"
        },
        {
          "name": "run_tool",
          "description": "Execute a public tool with your prepaid KeepBal wallet using the REST billing and access controls. Inspect first. Fixed tools charge the per-call price; variable tools are billed at provider price + 35%. Use input.max_cost_usd for a catalog spending cap; it must cover estimated cost and requires sufficient balance. Provider failures are not charged. Pending runs are polled for up to 25 seconds; use get_run to check later without starting another execution. Truncated or unsupported results must not be retried. Models use their documented REST endpoint.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "input": {
                "additionalProperties": true,
                "type": "object"
              },
              "tool": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["input", "tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c31c99839c3415c62d11f9ac8115b1d99d01aac6e8730742b88bd13e910f2e29"
        },
        {
          "name": "search_tools",
          "description": "Search live KeepBal tools and models locally, free of charge. Use 2–200 query characters. Results are ranked and paginated; use category models for models.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:736016f12132e75315609c3b00ebf5cf0a892700764010e10fac67ebb95693dd"
        }
      ],
      "digest": "sha256:5dbf61d022533cf81294a7844c3f22c47f1589cd3e49ea4e325a81bfef9049d9"
    }
  }
}
