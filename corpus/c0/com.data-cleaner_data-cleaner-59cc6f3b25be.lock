                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "http(s) URL of the tabular data; exactly one of url/table_id"
              },
              "wait_seconds": {
                "default": 180,
                "description": "how long to wait for download + cleaning",
                "type": "number"
              },
