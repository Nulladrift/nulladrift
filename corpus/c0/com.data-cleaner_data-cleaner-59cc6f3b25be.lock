              "tags": []
            }
          },
          "digest": "sha256:a0977919b53fcc808b174519ab0af57c97d82297881750c58abfdf4609043ead"
        },
        {
          "name": "export",
          "title": "Download a table as a file",
          "description": "Get a DOWNLOAD LINK for a table, as a file: csv, xlsx (Excel), json or parquet -- the whole table, not a page of it: a cleaned table, or a wrangle / sql_query result. The `download_url` opens in a browser or with curl and needs no key.\n\nThe link works for ONE HOUR, then stops; a new export call gives a fresh one (the table itself stays for as long as its table_id does). Anyone holding the link can download the file during that hour. The link does not reveal the table_id.\n\n`filename` names the downloaded file (letters, digits, dot, dash, underscore); the format's extension is added.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filename": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "name of the downloaded file, without or with the extension"
              },
              "format": {
                "default": "csv",
                "description": "'csv', 'xlsx', 'json' or 'parquet'",
                "type": "string"
              },
              "table_id": {
                "description": "the table to export",
                "type": "string"
              }
            },
            "required": ["table_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
