        {
          "name": "upload_request",
          "title": "Open an upload slot",
          "description": "Get a FILE FROM THE USER -- a file on their computer or phone, or one they attached to this chat. You cannot send a file's bytes yourself: an attachment lives in a sandbox that has no connection to this service, and a file must never be retyped or base64'd into a tool call. Instead the user sends it from their own browser:\n  1. call upload_request -- you get an `upload_page` link and an `upload_id`\n  2. give the user the `upload_page` link, exactly as returned, and ask them to open it, choose the file there, and tell you when it is done\n  3. when they say so, call `upload_confirm(upload_id=...)` -- it cleans the file and returns the table\nThe link is for one file and is private to this conversation; it takes CSV, Excel, JSON, XML, Parquet or a zip of one, of any size. If the data is at a URL, use `fetch` instead -- no upload needed.\n\nWith a shell (a coding agent), the same slot takes the file directly, no page:\n    curl -X PUT --data-binary @/path/to/file '<put_url>'\nThe shell alternative needs a shell that reaches data-cleaner.com directly: one on the user's machine does; the assistant's own sandbox (where chat attachments live, under /mnt/user-data/) does NOT -- its proxy answers 403 host_not_allowed. From a chat, use the upload page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filename": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "original filename, for format inference at confirm"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
