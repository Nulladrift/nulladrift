                "default": 0,
                "description": "zero-based page of rows to return",
                "type": "integer"
              },
              "page_size": {
                "default": 50,
                "description": "rows per page",
                "type": "integer"
              },
              "refresh": {
                "default": false,
                "description": "download and clean again even when the URL was loaded before",
                "type": "boolean"
              },
              "table_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "the id of a table loaded or derived before"
              },
