                "default": null,
                "description": "for a zip/tar, which member to read -- index or filename"
              },
              "compression": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "pin the compression, e.g. 'gzip', 'zip', 'NULL'"
              },
