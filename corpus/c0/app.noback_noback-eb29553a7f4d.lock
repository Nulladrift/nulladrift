{
  "lockfileVersion": 2,
  "subjects": {
    "app.noback/noback": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://apps.noback.page/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "noback",
        "title": "noback",
        "version": "1.0.0",
        "websiteUrl": "https://noback.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "create_app",
          "description": "Publishes a new app with no account or token, from html or zipBase64. It runs the same checks as validate_app (errors make it fail, with the list and how to fix them). The app is deleted if nobody uses it for 30 days, and it can reach the internet only through the services on noback's list. Its link opens your copy: whoever opens it sees what you entered and can leave their own things (comments, sign-ups, orders) without touching anyone else's; if the app asks for sensitive data, everyone starts their own empty copy. Returns appId, version, openUrl, editKey, claimUrl, message and warnings. Tell the person message (\"Your app is ready: <openUrl>\") in the language of the conversation, with no extra explanations. Then ask them once \"Want to save it to your account?\" (in the language of the conversation) and give them claimUrl only if they say yes: it's private, only for that person, and lets them keep the app. Keep appId and editKey to publish changes to THIS same app with update_app; don't create another one. Never put editKey or claimUrl in the HTML, the data or a shared link.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "html": {
                "description": "The complete contents of ONE HTML file, with its CSS and JS inline. Don't add the noback SDK by hand: noback injects window.app. Send html or zipBase64, not both.",
                "type": "string"
              },
              "name": {
                "description": "Optional name for the app, shown to the people who use it (e.g. \"Family groceries\").",
                "type": "string"
              },
              "zipBase64": {
                "description": "A complete .zip package encoded in base64, instead of html: index.html at the root, an optional noback.toml, plus scripts, styles and files. Send html or zipBase64, not both.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a168905d5757fe3972fe95342ca39ad0556618077c0e53066daeb60edc073f3b"
        },
        {
          "name": "get_sdk",
          "description": "Returns noback's guide for writing apps (in English, as Markdown in `markdown`): how to make a single-file HTML app whose data is saved and shared (localStorage, window.storage or app.db), what works inside noback and what doesn't, packages, limits and how to publish. Read it once before writing or changing an app for noback. Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d6760381c678805d2b61900d36411f847820cb42d75cb4f773f85f28dcc5ff5c"
        },
        {
          "name": "update_app",
          "description": "Publishes a new version of the same app without an account, using the appId and editKey from create_app, with the same checks as create_app. The data and the shared link stay as long as you keep the same app.db collections and fields and the same localStorage keys. Returns openUrl, version, message and warnings. Tell the person openUrl in the language of the conversation; give them claimUrl (private) only if they want to save the app to their account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "appId": {
                "description": "The app's short id, as returned by create_app or list_apps (e.g. \"a-x7k2pq\").",
                "type": "string"
              },
              "editKey": {
                "description": "The private edit key returned by create_app. Never put it in the HTML, the data or a shared link.",
                "minLength": 16,
                "type": "string"
              },
              "html": {
                "description": "The complete contents of ONE HTML file, with its CSS and JS inline. Don't add the noback SDK by hand: noback injects window.app. Send html or zipBase64, not both.",
                "type": "string"
              },
              "zipBase64": {
                "description": "A complete .zip package encoded in base64, instead of html: index.html at the root, an optional noback.toml, plus scripts, styles and files. Send html or zipBase64, not both.",
                "type": "string"
              }
            },
            "required": ["appId", "editKey"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:69e0aa4952757d0a88c2084937881af2b26fa69ab1bb7c5cf5eeeb6a3ab7a53c"
        },
        {
          "name": "validate_app",
          "description": "Checks an app (html or zipBase64) against noback's rules, with the limits of an app without an account, without publishing anything or running its code. Use it before create_app or update_app. Returns { ok, errors, warnings }; each item has a code, a message and a fix. Fix every error before publishing; warnings are suggestions and the app works anyway. Without an account, the app can reach the internet only through the services on noback's list. If warnings include NO_APP_DB with certain: true, the app loses what people enter when the page reloads: save it in localStorage (the warning's prompt says what to change) before publishing. If warnings include STATIC_LIST, the content is written by hand in the page: offer to make it editable from the page, with only the owner writing (the warning's prompt says what to ask for). Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "html": {
                "description": "The complete contents of ONE HTML file, with its CSS and JS inline. Don't add the noback SDK by hand: noback injects window.app. Send html or zipBase64, not both.",
                "type": "string"
              },
              "zipBase64": {
                "description": "A complete .zip package encoded in base64, instead of html: index.html at the root, an optional noback.toml, plus scripts, styles and files. Send html or zipBase64, not both.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:11b0337253e1b44047987e74255b5c9fab64fb37cef8da82ee779b962373c4a6"
        }
      ],
      "digest": "sha256:34a21dbbdde3e58e101dfbfafa46f07a519bed51a69f4783b91cd788003b7e06"
    }
  }
}
