      "serverInfo": {
        "name": "noback",
        "title": "noback",
        "version": "1.0.0",
        "websiteUrl": "https://noback.app",
        "icons": [
          {
            "src": "https://noback.app/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "connect",
          "description": "Optional: you don't need it, create_app asks for approval by itself the first time you publish. Asks the person for approval without publishing anything (agent is your name, like \"Claude Code\"). Returns url, code, pollKey and message. Take the person to url yourself: open it in their browser if you can (open on macOS, xdg-open on Linux, start on Windows, or navigate there if you have a browser); if you can't, show them the link in one line in the language of the conversation. Then call connect_status with pollKey and carry on by yourself as soon as it's approved, without asking the person to type anything. Never put pollKey in an app.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agent": {
                "description": "Your name as the person knows you (e.g. \"Claude Code\", \"Codex\", \"ChatGPT\").",
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b535f7eb749e0d5e72dabc0fec4c9c7627d4129184b48a41812090ee5b3bd129"
        },
        {
          "name": "connect_status",
          "description": "Waits (up to 20 seconds) for the person to approve the request that create_app, update_app or connect started, and answers as soon as they do. Returns status: pending (call it again), slow_down (wait a few seconds, then call it again), approved (with token and kind: account or anonymous), denied or expired. The token comes only once: right away call create_app or update_app again with credential: token, and keep sending it on every publish. Never show it to the person or put it in an app.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "pollKey": {
                "description": "The pollKey from connect in create_app's or update_app's answer (or from connect).",
                "type": "string"
              }
            },
            "required": ["pollKey"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:79f4d3aea0ba415775e647ac273ee1cd8008e6f70b6c653cd4bfad424e9a2276"
        },
        {
          "name": "create_app",
          "description": "Publishes a new app from html or zipBase64. The first time you publish, the person approves you once in their browser, with or without a noback account; nothing is needed before. Without credential it doesn't publish: it returns status approval_needed, connect (url, code, pollKey) and next. Then, by yourself: open connect.url in the person's browser (open on macOS, xdg-open on Linux, start on Windows, or navigate there if you have a browser), or if you can't, show them that link in one line in the language of the conversation; call connect_status with pollKey (it waits until they approve; call it again while it says pending); as soon as it says approved, call this tool again with the same content and credential: token. Don't ask the person to type anything. Same checks as validate_app. Once published it returns appId, version, openUrl, message and warnings: tell the person message in the language of the conversation. Keep appId for update_app; don't create another app for changes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "credential": {
                "description": "The token connect_status returned after the person approved you. Send it on every create_app and update_app in this conversation (or as the header Authorization: Bearer <token>). Leave it out the first time: create_app then asks for approval. Never show it to the person or put it in an app.",
                "minLength": 20,
                "type": "string"
              },
              "html": {
                "description": "The complete contents of ONE HTML file, with its CSS and JS inline. Don't add the noback SDK by hand: noback injects window.app. Send html or zipBase64, not both.",
                "type": "string"
              },
              "name": {
                "description": "Optional name for the app, shown to the people who use it (e.g. \"Family groceries\").",
                "type": "string"
              },
              "zipBase64": {
                "description": "A complete .zip package encoded in base64, instead of html: index.html at the root, an optional noback.toml, plus scripts, styles and files. Send html or zipBase64, not both.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e3f4965ada9cd19fc143f97375369c30094d48ef8e47d02fd208e88b6ac99403"
        },
        {
          "name": "get_sdk",
          "description": "Returns noback's guide for writing apps (in English, as Markdown in `markdown`): how to make a single-file HTML app whose data is saved and shared (localStorage, window.storage or app.db), what works inside noback and what doesn't, packages, limits and how to publish. Read it once before writing or changing an app for noback. Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:24e333d5ab3fd844b62c807621dc6c72a88cfeee772c0567ecb7e08c97cb03f5"
        },
        {
          "name": "update_app",
          "description": "Publishes a new version of an app you published, with the same checks as create_app. Send the credential you got from connect_status (or the editKey of an app published before approvals existed). The first time you publish, the person approves you once in their browser, with or without a noback account; nothing is needed before. Without credential it doesn't publish: it returns status approval_needed, connect (url, code, pollKey) and next. Then, by yourself: open connect.url in the person's browser (open on macOS, xdg-open on Linux, start on Windows, or navigate there if you have a browser), or if you can't, show them that link in one line in the language of the conversation; call connect_status with pollKey (it waits until they approve; call it again while it says pending); as soon as it says approved, call this tool again with the same content and credential: token. Don't ask the person to type anything. The data and the link stay as long as you keep the same app.db collections and fields and the same localStorage keys. Returns openUrl, version, message and warnings.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "appId": {
                "description": "The app's short id, as returned by create_app or list_apps (e.g. \"a-x7k2pq\").",
                "type": "string"
              },
              "credential": {
                "description": "The token connect_status returned after the person approved you. Send it on every create_app and update_app in this conversation (or as the header Authorization: Bearer <token>). Leave it out the first time: create_app then asks for approval. Never show it to the person or put it in an app.",
                "minLength": 20,
                "type": "string"
              },
              "editKey": {
                "description": "Only for apps published before connecting existed: the private edit key create_app returned then. Never put it in the HTML, the data or a shared link.",
                "minLength": 16,
                "type": "string"
              },
              "html": {
                "description": "The complete contents of ONE HTML file, with its CSS and JS inline. Don't add the noback SDK by hand: noback injects window.app. Send html or zipBase64, not both.",
                "type": "string"
              },
              "zipBase64": {
                "description": "A complete .zip package encoded in base64, instead of html: index.html at the root, an optional noback.toml, plus scripts, styles and files. Send html or zipBase64, not both.",
                "type": "string"
              }
            },
            "required": ["appId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e11c33c7a51e72dedbe814b34d69830e7cee1411af1fa7651c51890c70f1cbac"
        },
        {
          "name": "validate_app",
          "description": "Checks an app (html or zipBase64) against noback's rules, with the limits of an app without an account, without publishing anything or running its code. Use it before create_app or update_app. Returns { ok, errors, warnings }; each item has a code, a message and a fix. Fix every error before publishing; warnings are suggestions and the app works anyway. Without an account, the app can reach the internet only through the services on noback's list. If warnings include NO_APP_DB with certain: true, the app loses what people enter when the page reloads: save it in localStorage (the warning's prompt says what to change) before publishing. If warnings include STATIC_LIST, the content is written by hand in the page: offer to make it editable from the page, with only the owner writing (the warning's prompt says what to ask for). Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "html": {
                "description": "The complete contents of ONE HTML file, with its CSS and JS inline. Don't add the noback SDK by hand: noback injects window.app. Send html or zipBase64, not both.",
                "type": "string"
              },
              "zipBase64": {
                "description": "A complete .zip package encoded in base64, instead of html: index.html at the root, an optional noback.toml, plus scripts, styles and files. Send html or zipBase64, not both.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:214e375bc50a275903cc9c630a510a04b603ab27e4eb9990e1d4a274c9d6693c"
        }
      ],
      "digest": "sha256:74dab3e35d071d493e6ad0b901bd49aae8b85f1635a191f174607c38f93ce1b7"
    }
  }
