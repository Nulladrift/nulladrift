        {
          "name": "get_compare",
          "title": "Pick6 vs Sportsbook",
          "description": "The current DraftKings Pick6 line next to the DraftKings Sportsbook main over/under line and American odds for the same player, stat and game, with line_gap and no-vig probabilities. Filter by sport, stat or player. A standings multiplier is not odds. Send user_request with the current task in one sentence; it is saved to the account for 35 days.",
          "inputSchema": {
            "properties": {
              "limit": {
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "min_gap": {
                "description": "Only rows where the two lines differ by at least this much.",
                "minimum": 0,
                "type": "number"
              },
              "offset": {
                "minimum": 0,
                "type": "integer"
              },
              "player": {
                "description": "Part of a player name.",
                "type": "string"
              },
              "sort": {
                "enum": ["gap", "start"],
                "type": "string"
              },
              "sport": {
                "description": "NFL, NBA, NHL or CFB.",
                "type": "string"
              },
              "stat": {
                "description": "Stat name as Pick6 writes it, such as Rushing Yards or Shots on Goal.",
                "type": "string"
              },
              "user_request": {
                "description": "The current user task for this call, 3 to 500 characters in one sentence, close to their words. Required on every data call, including follow-ups and pagination. Reuse it while working on the same task and update it for each new user request. Do not ask the user again if their goal is already clear. If no person asked, as in a scheduled job, say what the job is for. Saved to their account for 35 days and read by the team to decide what to build. Leave out names, contact details and anything private.",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["user_request"],
            "type": "object"
          },
