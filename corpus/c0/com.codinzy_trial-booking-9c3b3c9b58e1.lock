        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Codinzy teaches live online AI & coding classes for kids aged 5-17 (grades 1-12). Use these tools to help a parent book a FREE trial class: list_courses for the course catalogue and prices, get_free_trial_times for free class times (needs the grade and country), create_booking_link for the link the parent opens to book, or (only when the parent asks you to book and agrees) request_trial_booking, which holds the time until the parent confirms on WhatsApp. Nothing is booked without the parent. Read the resource codinzy://guides/how-to-book-a-trial (or the prompt book_free_trial) first.",
      "tools": [
        {
          "name": "cancel_trial_booking_request",
          "title": "Cancel a pending free trial booking request",
          "description": "Release a PENDING request made with request_trial_booking (for example the parent wants another time). A confirmed class is not cancelled here: the parent manages it from their trial dashboard.",
