        {
          "name": "request_trial_booking",
          "title": "Request a free trial class (the parent confirms on WhatsApp)",
          "description": "Request a FREE Codinzy trial class for a parent's child at a time from `get_free_trial_times`. Use it only after the parent chose the time and agreed. Nothing is booked yet: the time is held for about 30 minutes and the parent confirms from their own WhatsApp (a Confirm button in a WhatsApp message, or the `confirm_url` you show them, where they enter a code we send to their WhatsApp). Inputs: `phone` (the parent's WhatsApp number in E.164, e.g. +8801712345678), `grade` (1-12), `timezone` (IANA, e.g. Asia/Dhaka), `slot_token` (from the free times), optional `child_name`. Returns `request_id`, `status` (\"pending\"), `expires_at` and `confirmation` (`channel` \"whatsapp\" or \"link\" with `confirm_url`): tell the parent what to do, then poll `get_trial_booking_request` until \"confirmed\", \"expired\" or \"cancelled\". On a refusal, tell the parent the `error` sentence; for `slot_unavailable` or `slot_taken` offer new times. Never ask for passwords, emails or payment details.",
          "inputSchema": {
            "properties": {
              "agent_name": {
                "anyOf": [
                  {
                    "maxLength": 40,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Shown to the parent, e.g. ChatGPT",
                "title": "Agent Name"
              },
              "child_name": {
                "anyOf": [
                  {
                    "maxLength": 60,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The child's first name (optional)",
                "title": "Child Name"
              },
              "grade": {
                "description": "The child's school grade, 1-12",
                "maximum": 12,
                "minimum": 1,
                "title": "Grade",
                "type": "integer"
              },
              "phone": {
                "description": "The parent's WhatsApp number in E.164, e.g. +8801712345678",
                "maxLength": 20,
                "title": "Phone",
                "type": "string"
              },
              "slot_token": {
                "anyOf": [
                  {
                    "maxLength": 400,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The slot_token of the time the parent chose (from get_free_trial_times)",
                "title": "Slot Token"
              },
              "start_time": {
                "anyOf": [
                  {
                    "maxLength": 40,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "ISO 8601 start with offset, only when there is no slot_token",
                "title": "Start Time"
              },
              "timezone": {
                "description": "The parent's IANA time zone, e.g. Asia/Dhaka",
                "maxLength": 64,
                "title": "Timezone",
                "type": "string"
              },
              "utm_source": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Your assistant, e.g. chatgpt.com",
                "title": "Utm Source"
              }
            },
            "required": ["grade", "phone", "timezone"],
            "title": "request_trial_bookingArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Confirmation": {
                "properties": {
                  "channel": {
                    "description": "whatsapp: the parent taps Confirm in WhatsApp; link: show them confirm_url",
                    "enum": ["whatsapp", "link"],
                    "title": "Channel",
                    "type": "string"
                  },
                  "confirm_url": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Only for channel \"link\": show it to the parent",
                    "title": "Confirm Url"
                  },
                  "message_for_parent": {
                    "default": "",
                    "title": "Message For Parent",
                    "type": "string"
                  }
                },
                "required": ["channel"],
                "title": "Confirmation",
                "type": "object"
              },
              "TrialClassTime": {
                "properties": {
                  "child_name": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Child Name"
                  },
                  "display": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "e.g. \"Thu 27 Nov 2026, 4:00 PM (Asia/Dhaka)\"",
                    "title": "Display"
                  },
                  "grade": {
                    "anyOf": [
                      {
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Grade"
                  },
                  "start_time": {
                    "description": "UTC, ISO 8601",
                    "title": "Start Time",
                    "type": "string"
                  },
                  "start_time_local": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "ISO 8601 in the parent's zone",
                    "title": "Start Time Local"
                  },
                  "timezone": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Timezone"
                  }
                },
                "required": ["start_time"],
                "title": "TrialClassTime",
                "type": "object"
              }
            },
            "properties": {
              "booked": {
                "description": "True only once the parent confirmed: the class is booked",
                "title": "Booked",
                "type": "boolean"
              },
              "confirmation": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/Confirmation"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "expires_at": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "UTC; the hold ends then unless the parent confirms",
                "title": "Expires At"
              },
              "message": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Message"
              },
              "next_step": {
                "title": "Next Step",
                "type": "string"
              },
              "reason": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Why it ended (not pending)",
                "title": "Reason"
              },
              "request_id": {
                "description": "Opaque reference (tbr_...): poll get_trial_booking_request with it",
                "title": "Request Id",
                "type": "string"
              },
              "status": {
                "enum": ["pending", "confirmed", "expired", "cancelled"],
                "title": "Status",
                "type": "string"
              },
              "trial_class": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/TrialClassTime"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
            "required": ["booked", "next_step", "request_id", "status"],
            "title": "TrialBookingRequest",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a free trial class"
          },
