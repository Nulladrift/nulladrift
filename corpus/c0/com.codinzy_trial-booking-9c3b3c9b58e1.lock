                    "description": "e.g. \"Friday 28 November 2026\" (local)",
                    "title": "Day Label",
                    "type": "string"
                  },
                  "relative_day": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "\"today\", \"tomorrow\" or null",
                    "title": "Relative Day"
                  },
                  "slot_token": {
                    "description": "Opaque reference to this time (valid 6 hours): pass it to create_booking_link (as slot) or request_trial_booking",
                    "title": "Slot Token",
                    "type": "string"
                  },
                  "start_local": {
                    "description": "Start in the requested time zone, ISO 8601 with offset",
                    "title": "Start Local",
                    "type": "string"
                  },
                  "start_utc": {
                    "description": "Start, UTC, ISO 8601",
                    "title": "Start Utc",
                    "type": "string"
                  },
                  "time_label": {
                    "description": "e.g. \"5:00 PM\" (local)",
                    "title": "Time Label",
                    "type": "string"
                  }
                },
                "required": ["book_url", "day_label", "slot_token", "start_local", "start_utc", "time_label"],
                "title": "FreeTime",
                "type": "object"
              }
            },
            "properties": {
              "count": {
                "title": "Count",
                "type": "integer"
              },
              "country": {
                "title": "Country",
                "type": "string"
              },
              "days": {
                "title": "Days",
                "type": "integer"
              },
              "fits": {
                "description": "What the free class is for this grade",
                "title": "Fits",
                "type": "string"
              },
              "grade": {
                "title": "Grade",
                "type": "integer"
              },
              "grade_band": {
                "description": "\"1-5\" or \"6-12\"",
                "title": "Grade Band",
                "type": "string"
              },
              "how_to_book": {
                "title": "How To Book",
                "type": "string"
              },
              "times": {
                "items": {
                  "$ref": "#/$defs/FreeTime"
                },
                "title": "Times",
                "type": "array"
              },
              "times_page_url": {
                "description": "The same times as a web page",
                "title": "Times Page Url",
                "type": "string"
              },
              "timezone": {
                "title": "Timezone",
                "type": "string"
              }
            },
            "required": ["count", "country", "days", "fits", "grade", "grade_band", "how_to_book", "times", "times_page_url", "timezone"],
            "title": "FreeTimes",
            "type": "object"
