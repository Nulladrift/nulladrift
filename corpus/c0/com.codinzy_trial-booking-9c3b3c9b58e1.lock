        {
          "name": "get_free_trial_times",
          "title": "Free trial class times",
          "description": "The free trial class times a Codinzy tutor has for a child, in the family's time zone: the same times the booking page offers that child. Needs the child's school grade (1-12) and the country the family lives in. Each time has a `slot_token` (valid 6 hours): when the parent picks a time, pass it to create_booking_link (the parent books on the page) or, with the parent's go-ahead, to request_trial_booking. Read only: nothing is booked or held, and times can fill up.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Where the family lives: ISO 3166-1 alpha-2 code (BD, US, GB, IN, AE, ...) or the country name",
                "maxLength": 60,
                "minLength": 2,
                "title": "Country",
                "type": "string"
              },
              "days": {
                "default": 7,
                "description": "How many days ahead, 1-14",
                "maximum": 14,
                "minimum": 1,
                "title": "Days",
                "type": "integer"
              },
              "grade": {
                "description": "The child's school grade, 1-12 (under grade 1: 1)",
                "maximum": 12,
                "minimum": 1,
                "title": "Grade",
                "type": "integer"
              },
              "timezone": {
                "anyOf": [
                  {
                    "maxLength": 64,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "IANA time zone for the times, e.g. Asia/Dhaka (default: the country's main zone)",
                "title": "Timezone"
              },
              "utm_source": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Who is asking, kept in the links for attribution, e.g. chatgpt.com, claude.ai",
                "title": "Utm Source"
              }
            },
            "required": ["country", "grade"],
            "title": "get_free_trial_timesArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "FreeTime": {
                "properties": {
                  "book_url": {
                    "description": "Opens the booking page with this time selected (no phone prefilled)",
                    "title": "Book Url",
                    "type": "string"
