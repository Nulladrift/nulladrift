        {
          "name": "create_booking_link",
          "title": "Make a free trial booking link",
          "description": "A link the PARENT opens to book the free trial class: the Codinzy booking page with the chosen time selected (pass the `slot` from get_free_trial_times) and, if given, their phone number filled in. This tool books NOTHING and holds nothing: tell the parent to open the link, check the details and press \"Book my free class\". Without a phone number the page asks for it first, then shows the time. language \"bn\" gives the Bangla booking page for a Bangla-speaking parent.",
          "inputSchema": {
            "properties": {
              "country": {
                "anyOf": [
                  {
                    "maxLength": 60,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "ISO code or name of the country the family lives in (optional)",
                "title": "Country"
              },
              "grade": {
                "description": "The child's school grade, 1-12",
                "maximum": 12,
                "minimum": 1,
                "title": "Grade",
                "type": "integer"
              },
              "language": {
                "anyOf": [
                  {
                    "enum": ["en", "bn"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The booking page language: en (default) or bn for the Bangla booking page",
                "title": "Language"
              },
              "phone": {
                "anyOf": [
                  {
                    "maxLength": 20,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Parent's mobile number in E.164, e.g. +8801712345678 (optional; used for the class link on WhatsApp)",
                "title": "Phone"
              },
              "slot": {
                "anyOf": [
                  {
                    "maxLength": 600,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The `slot_token` of the time the parent picked (from get_free_trial_times)",
                "title": "Slot"
              },
              "timezone": {
                "anyOf": [
                  {
                    "maxLength": 64,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "IANA time zone the parent uses (optional; the booking page shows times in it)",
                "title": "Timezone"
              },
              "utm_source": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Who is asking, e.g. chatgpt.com",
                "title": "Utm Source"
              }
            },
            "required": ["grade"],
            "title": "create_booking_linkArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "booking_url": {
                "description": "Give this link to the parent; they open it and press Book",
                "title": "Booking Url",
                "type": "string"
              },
              "books_anything": {
                "const": false,
                "default": false,
                "description": "Always false: this tool books nothing",
                "title": "Books Anything",
                "type": "boolean"
              },
              "note": {
                "default": "",
                "title": "Note",
                "type": "string"
              },
              "slot_status": {
                "description": "free: the time is selected on the page; taken/started/invalid: the link has no time, offer other times (call get_free_trial_times again); no_slot: none was given",
                "enum": ["free", "taken", "started", "invalid", "no_slot", "not_checked"],
                "title": "Slot Status",
                "type": "string"
              },
              "what_the_parent_does": {
                "title": "What The Parent Does",
                "type": "string"
              }
            },
            "required": ["booking_url", "slot_status", "what_the_parent_does"],
            "title": "BookingLink",
            "type": "object"
          },
          "annotations": {
