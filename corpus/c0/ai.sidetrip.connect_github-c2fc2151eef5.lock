{
  "lockfileVersion": 2,
  "subjects": {
    "ai.sidetrip.connect/github": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://demo-github.sidetrip.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "github",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only public GitHub data. Use search_repositories to find projects, get_repository for one repo, list_releases for tags, list_open_issues for open issues (pull requests are omitted), get_user_profile for a login, and get_readme for the README. These tools never create, edit, or delete GitHub data. Calls share this server's GitHub quota of 60 unauthenticated requests per hour unless GITHUB_TOKEN is set, so prefer one precise call over several broad ones.",
      "tools": [
        {
          "name": "get_readme",
          "description": "Fetch a public repository README, truncated to a short excerpt. Use this for the maintainer's project overview.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "owner": {
                "description": "GitHub user or organization login.",
                "pattern": "^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$",
                "type": "string"
              },
              "ref": {
                "description": "Git branch, tag, or commit. Defaults to the repository default branch.",
                "pattern": "^[A-Za-z0-9._/-]{1,255}$",
                "type": "string"
              },
              "repo": {
                "description": "Repository name, without the owner.",
                "pattern": "^[A-Za-z0-9._-]{1,100}$",
                "type": "string"
              }
            },
            "required": ["owner", "repo"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7dfbf74f643f8be78b4487d7b0d458811de2138951189e6fecce7a97707e416b"
        },
        {
          "name": "get_repository",
          "description": "Get one public GitHub repository by owner and name. Use this when the repository is already known. Returns stars, forks, license, default branch, topics, and URL. open_issues_count includes pull requests.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "owner": {
                "description": "GitHub user or organization login.",
                "pattern": "^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$",
                "type": "string"
              },
              "repo": {
                "description": "Repository name, without the owner.",
                "pattern": "^[A-Za-z0-9._-]{1,100}$",
                "type": "string"
              }
            },
            "required": ["owner", "repo"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9af66295faa229b4803b4b6b7d358fca21c8561c560f0a4b498f5f3f36f4e23a"
        },
        {
          "name": "get_user_profile",
          "description": "Get a public GitHub user or organization profile by login. Returns name, bio, company, location, follower counts, and URL.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "username": {
                "description": "GitHub user or organization login.",
                "pattern": "^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$",
                "type": "string"
              }
            },
            "required": ["username"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:725d3503918a2d045722e54e3933b5d8ceda7b1c257a457b0d4f6a316895e917"
        },
        {
          "name": "list_open_issues",
          "description": "List open issues for a public GitHub repository. Pull requests are omitted. Use this for current issues, not code or releases.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "How many results to return, from 1 to 10. Defaults to 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "owner": {
                "description": "GitHub user or organization login.",
                "pattern": "^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$",
                "type": "string"
              },
              "repo": {
                "description": "Repository name, without the owner.",
                "pattern": "^[A-Za-z0-9._-]{1,100}$",
                "type": "string"
              }
            },
            "required": ["owner", "repo"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:15a66eac82defc45e9502b70633ca9409ba33c72e8c20e8ea6c20aaf3423fb36"
        },
        {
          "name": "list_releases",
          "description": "List recent releases for a public GitHub repository. Use this for tags and publish dates. Release note bodies are omitted.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "How many results to return, from 1 to 10. Defaults to 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "owner": {
                "description": "GitHub user or organization login.",
                "pattern": "^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$",
                "type": "string"
              },
              "repo": {
                "description": "Repository name, without the owner.",
                "pattern": "^[A-Za-z0-9._-]{1,100}$",
                "type": "string"
              }
            },
            "required": ["owner", "repo"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:626b0d175d087ab0928cd6d025a863cebea997ea6350dac99b5cbc93c1590699"
        },
        {
          "name": "search_repositories",
          "description": "Search public GitHub repositories. Use this to find projects by keywords, language, or star count. Returns a short list with name, description, stars, language, and URL.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "How many results to return, from 1 to 10. Defaults to 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "order": {
                "description": "Sort direction.",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "query": {
                "description": "GitHub repository search query, such as language:typescript stars:>1000.",
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              },
              "sort": {
                "description": "Sort key. Omit it to use GitHub's best-match order.",
                "enum": ["stars", "forks", "updated", "help-wanted-issues"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e515d2879e25c6c68f7de9b88d6b253b450fdf1798fcdf8ce618cde22c01f006"
        }
      ],
      "digest": "sha256:77d7f18b75c268877e9981e699e8aaed8dc0d555af06aa630d181fb07d32e9dd"
    }
  }
}
