{
  "lockfileVersion": 2,
  "subjects": {
    "com.athenrai/offers": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.athenrai.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "athenrai-offers",
        "version": "0.7.10",
        "websiteUrl": "https://athenrai.com"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Athenrai reports offers observed on the public pages of covered online stores: promo codes, automatic discounts, free-shipping thresholds and similar. Call list_covered_stores to see which stores are covered, get_merchant_offers for one or more store domains, or find_offers_for_url with a product or store URL. Offers are observed, not purchase-verified: always tell the user that a code or discount was seen on the store's site at the reported time and may not apply at checkout. Use get_offer_evidence to show the exact captured text.",
      "tools": [
        {
          "name": "find_offers_for_url",
          "description": "Find observed store-level offers for the store that serves a product or page URL,\n        e.g. a product page the user is looking at. Whether an offer applies to that\n        specific product is not evaluated.",
          "inputSchema": {
            "properties": {
              "include_stale": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Include Stale"
              },
              "max_age_seconds": {
                "default": 172800,
                "title": "Max Age Seconds",
                "type": "integer"
              },
              "url": {
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "find_offers_for_urlArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e4fca080a62e3a7a4e4e118ec82c62a61e23275b04b2128d28568f8dc6a678cf"
        },
        {
          "name": "get_merchant_offers",
          "description": "Find observed offers (promo codes, automatic discounts, free-shipping thresholds,\n        bundles) for 1-20 store domains such as \"allbirds.com\". Each offer carries its\n        conditions, the verbatim text seen on the store, its source URL and its freshness.\n        Pass next_cursor back as cursor to page. Offers not seen within max_age_seconds\n        (default 48 hours) are omitted unless include_stale is true. offer_type is one of:\n        code, automatic, discount (no code shown, no minimum stated), threshold (needs a\n        minimum spend), shipping, bogo, bundle. Conditions not listed are unknown.",
          "inputSchema": {
            "properties": {
              "cursor": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Cursor"
              },
              "include_stale": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Include Stale"
              },
              "max_age_seconds": {
                "default": 172800,
                "title": "Max Age Seconds",
                "type": "integer"
              },
              "merchant_domains": {
                "items": {
                  "type": "string"
                },
                "title": "Merchant Domains",
                "type": "array"
              },
              "page_size": {
                "default": 50,
                "title": "Page Size",
                "type": "integer"
              }
            },
            "required": ["merchant_domains"],
            "title": "get_merchant_offersArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cf9d337a9e4b674c441755c844c19f368be77e59096656c37ab315bfec0aa403"
        },
        {
          "name": "get_offer_evidence",
          "description": "Retrieve the captured source evidence for one offer: the exact text, source URL,\n        capture time and page hash. Use the snapshot_id from the lookup that returned it.",
          "inputSchema": {
            "properties": {
              "merchant_domain": {
                "title": "Merchant Domain",
                "type": "string"
              },
              "offer_id": {
                "title": "Offer Id",
                "type": "string"
              },
              "snapshot_id": {
                "title": "Snapshot Id",
                "type": "string"
              }
            },
            "required": ["merchant_domain", "offer_id", "snapshot_id"],
            "title": "get_offer_evidenceArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:16b0b08a77f8199a5eda7b0c602cba56fc272eca99144d505bd581a2d11d3d88"
        },
        {
          "name": "list_covered_stores",
          "description": "List the online stores Athenrai covers, with coverage status, last observation\n        time and offer counts. Call this first to learn which store domains are supported.",
          "inputSchema": {
            "properties": {},
            "title": "list_covered_storesArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e3b7b8c72e0ec9228285678ecabc536c5b8352a4b97f9483e33fb15d817ad375"
        }
      ],
      "digest": "sha256:c68e848a8421dc82d72c315ae1f2857ed08f4b74589d850ed7ba3fa332876a62"
    }
  }
}
