{
  "lockfileVersion": 2,
  "subjects": {
    "com.bonissystems/health-agent": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://healthagentcare.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "health-agent",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Health Agent answers from CMS's 2027 Medicare plan file, CMS's HCPCS file, the X12 denial-code lists and the published appeal rules. Every answer carries its source, the source's date and a Health Agent page; cite the page. Read-only; nothing about a person is stored. Not legal, medical or insurance advice.",
      "tools": [
        {
          "name": "appeal_deadline",
          "title": "Last day to appeal a denial",
          "description": "The last day to file an appeal of a Medicare, Medicare Advantage, Part D or commercial/ACA/employer plan denial, counted the way the rules count it (Medicare presumes receipt 5 days after the notice date), with days remaining, who decides, and the next level. Not legal advice; confirm the exact date with the official source it names.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "level": {
                "default": 1,
                "description": "Appeal level; 1 is the first appeal.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "noticeDate": {
                "description": "Date printed on the denial notice, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "program": {
                "description": "original_medicare, medicare_advantage, part_d, or commercial_aca.",
                "enum": ["original_medicare", "medicare_advantage", "part_d", "commercial_aca"],
                "type": "string"
              },
              "received": {
                "default": false,
                "description": "true if noticeDate is the date the notice was actually received (skips Medicare's 5-day presumption).",
                "type": "boolean"
              }
            },
            "required": ["noticeDate", "program"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Last day to appeal a denial"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:81dfc91a672b5cc2fb95ae62c7284d7bcae3d8c8fc3b1343b04205baba8f2c91"
        },
        {
          "name": "denial_code_lookup",
          "title": "What a claim denial code means",
          "description": "What an insurance or Medicare denial code on an explanation of benefits means: a Claim Adjustment Reason Code (e.g. CO-97, PR-1, 197) or a Remark Code (e.g. M15, N432), from the X12 code lists. With a prefix it says whether the person may owe the amount (CO is the provider's write-off, PR is patient responsibility); for common codes it gives the typical fix and who acts. Not legal or billing advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "The code as printed, e.g. CO-97, PR-204, 50 or N432.",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What a claim denial code means"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5149ef6e3b4cbb13a3e59860b0f97020f813b94f024262cb2d77ede3ae8bc0c3"
        },
        {
          "name": "hcpcs_lookup",
          "title": "What a HCPCS billing code is",
          "description": "What a HCPCS Level II code on a bill, supplier invoice or explanation of benefits describes (a letter and four digits, e.g. E0601, J9271, A4253), with its Medicare coverage status, from CMS's quarterly HCPCS file. CPT codes (five digits) are not covered: their descriptions are copyrighted.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "HCPCS Level II code, e.g. E0601.",
                "pattern": "^[A-Za-z]\\d{4}$",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What a HCPCS billing code is"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c530ce7161f5b34622fe25a23ebbed0f642d0208967185788b45273e588cd49d"
        },
        {
          "name": "medicare_drug_plans_2027",
          "title": "2027 Medicare drug plans for a county",
          "description": "Every 2027 Medicare plan with drug coverage CMS lists for a county: stand-alone drug plans (with Original Medicare) and Medicare Advantage plans, each with company, monthly premium, change from 2026, drug deductible and, for stand-alone plans, the premium with Extra Help. Give a ZIP code, or a state and county. From CMS's 2027 plan file. It does not say which plan covers which drug (the county page it links checks that against CMS's 2027 drug lists) and it is not a recommendation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "county": {
                "description": "County name, e.g. \"Cook County\". Needed with state, or to pick one county when a ZIP crosses county lines.",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code, with county.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "zip": {
                "description": "Five-digit ZIP code.",
                "pattern": "^\\d{5}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "2027 Medicare drug plans for a county"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5dfa929c878c22f45739643ef24e9f0ad769ab5e2346ddc4f161624dc1936232"
        }
      ],
      "digest": "sha256:5ead5d2f98b2cecce92190e7d42ab614e034e400d10370eb274c2b924b35451f"
    }
  }
}
