            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e2552b233185e251ebad28c8c771854a734adb96bd1007c261503e66c70051d6"
        }
      ],
      "digest": "sha256:548e9e5cbb8f446706f7985a93e0549b06057fb7a0e1b86308a9646d2e2aa0dd"
    }
  }
