          },
          "digest": "sha256:f9af01d4edc5f0f30c29c49f91867393f8ed82172a43d9f534a40e50548c54e1"
        },
        {
          "name": "list_causes",
          "title": "List causes",
          "description": "List the causes stories are filed under, with how many stories each has. Use a cause as the filter in a search.",
          "inputSchema": {
            "additionalProperties": false,
