      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "storra-brands",
        "title": "Storra for Brands",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Storra lists real charity stories that a brand can fund and a creator then tells. Use find_campaign_stories to find stories by topic, cause or place, then get_campaign_story for the full detail. Always link the user to the story's url.",
      "tools": [
        {
          "name": "find_campaign_stories",
          "title": "Find campaign stories",
          "description": "Search real charity stories a brand could fund as a cause-marketing campaign. Matches the query against titles, summaries, charities, causes and places, and returns the best matches with a link to each story page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cause": {
                "description": "Only stories for this cause, e.g. \"Health\". Use list_causes for the values.",
                "maxLength": 100,
                "type": "string"
              },
              "limit": {
                "description": "How many stories to return (default 10, at most 25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Only stories in this place, e.g. \"Manchester\".",
                "maxLength": 100,
                "type": "string"
              },
              "query": {
                "description": "Words to look for, e.g. \"children Christmas\" or \"mental health\".",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find campaign stories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a8ddb700fb2a5e6cd591138d7b3d109a0cdbcc789aeb0062b7db128f53308fba"
        },
        {
          "name": "get_campaign_story",
          "title": "Get a campaign story",
          "description": "Get one story in full: the story, what a brand could do with it, and the charity's details.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The story's slug, from a search result.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a campaign story"
          },
          "behavior": {
            "destructive": false,
