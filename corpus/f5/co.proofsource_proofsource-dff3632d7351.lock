      "instructions": "Proofsource measures how AI answer engines (ChatGPT, Perplexity, Claude, Google AI Overviews and others) answer a brand's buyer questions: whether they mention the brand, which competitors they recommend instead, which sources they cite, and whether the fixes you ship move those numbers. Start with list_brands (every other tool takes its brand_id; it may be omitted when the workspace tracks one brand). Is my brand mentioned in AI answers: get_visibility. Who does AI recommend instead of me: get_competitors. Which sources do AI answers cite: get_citations. What changed: get_changes. What to fix: list_fix_opportunities. Did my fix work: get_fix_verification. Writes: create_prompt tracks a new buyer question; mark_fix_shipped dates a fix so its effect can be verified. Percentages carry sample sizes; treat a small sample as low confidence.",
      "tools": [
        {
          "name": "add_brand",
          "title": "Check my brand in AI answers",
          "description": "Start measuring a brand: does ChatGPT, Perplexity, Claude or Google AI mention it, and who does AI recommend instead? Give the brand's website (or its app store, Google Maps, YouTube or Instagram link). It reads the site, picks the buyer questions, and starts the first scan across the AI engines. Reading the site takes 1-2 minutes; if it is still running, call again with the same link and it picks up the same run, never a second one. Returns the brand_id; then use get_scan_status.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "description": {
                "description": "Optional: what the brand sells, in a sentence. Only needed when add_brand says it couldn't read the website.",
                "maxLength": 1000,
                "type": "string"
              },
              "link": {
                "description": "The brand's website, like acme.com, or its app store, Google Maps, YouTube or Instagram link.",
                "maxLength": 2048,
                "type": "string"
              },
              "locations": {
                "description": "Optional: the cities or areas where the brand's buyers are, like [\"Pune\", \"Indiranagar, Bengaluru\"]. Its buyer questions are then split across them and its numbers shown per location. Leave out for a brand with one location.",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 25,
                "type": "array"
              }
            },
            "required": ["link"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Check my brand in AI answers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
