        {
          "name": "get_loop",
          "title": "What happened from question to verified fix?",
          "description": "The brand's loop, oldest first: each buyer question tracked, gap found, content draft created, fix published to the brand's site, fix shipped, change seen on the brand's own pages, and fix checked after it ships: a first check on day 28, re-checks on days 45, 60 and 75 and a final check on day 90 (whether it is still live and how citations, mentions and AI-referral traffic moved, each with its sample size; a horizon appears only once it has been measured). The first page also lists before_window: each question's newest draft, publish and shipped fix from before since, its current state. At most 90 days per call (the last N days is since = today minus N-1, today counted); page with next_cursor.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand_id": {
                "description": "Brand id from list_brands. May be omitted when the workspace tracks a single brand.",
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous call, to continue.",
                "type": "string"
              },
              "limit": {
                "description": "Steps per page. Default 50.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "Window start: RFC 3339 timestamp or YYYY-MM-DD. Default 90 days before until.",
                "type": "string"
              },
              "stages": {
                "description": "Optional: only these stages. Default every stage.",
                "items": {
                  "enum": ["question_tracked", "gap_found", "draft_created", "published", "fix_shipped", "page_changed", "verified"],
                  "type": "string"
                },
                "type": "array"
              },
              "until": {
                "description": "Window end: RFC 3339 timestamp or YYYY-MM-DD (that whole day). Default now. At most 90 days after since.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What happened from question to verified fix?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp.read"],
                "type": "oauth2"
