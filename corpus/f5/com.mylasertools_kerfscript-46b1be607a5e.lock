      "serverInfo": {
        "name": "kerfscript",
        "title": "KerfScript by MyLaserTools",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use KerfScript to build parametric laser-cutting designs and generators. Read the javascript and customizer guides for application integration. Rendering returns files in millimetres; machine settings and physical fit require verification. Tools do not store submitted designs.",
      "tools": [
        {
          "name": "kerfscript_docs",
          "description": "Read KerfScript language and JavaScript integration documentation for building laser-cutting generators. Omit topic to list guides. Long guides are paginated with nextOffset.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "offset": {
                "default": 0,
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "topic": {
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:13a114344a1d29a225a092608e84e51abd89a4a026ce0f3fcc73aea7b89293cf"
        },
        {
          "name": "kerfscript_examples",
          "description": "Find working parametric laser-cutting examples by title, id or tags. Supply an id from the results to get its .kerf source.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "maxLength": 100,
                "type": "string"
              },
              "offset": {
                "default": 0,
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "default": "",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d9827c296c7f89dd764ac29c497c9715a81f1a727bc8e542385aa9c48a6e148e"
        },
        {
          "name": "kerfscript_parameters",
          "description": "Extract editable settings and customizer ranges from .kerf source to build a generator UI. Parses without rendering geometry.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "source": {
                "maxLength": 64000,
                "type": "string"
              }
            },
            "required": ["source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8f5caf52fead39a9840b9d490813c65cbf22119bba25d88bf0afebcc1ac85fa7"
        },
        {
          "name": "kerfscript_render",
          "description": "Render .kerf source to SVG or DXF files, one per sheet, with part sizes, layers and warnings. Uses millimetres and bundled Atkinson font. No filesystem or network imports. Bounded to 100 parts and 10 sheets. For production generators install @mylasertools/kerfscript locally.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "format": {
                "default": "svg",
                "enum": ["svg", "dxf"],
                "type": "string"
              },
              "gap": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "kerf": {
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "layout": {
                "default": "pack",
                "enum": ["pack", "none"],
                "type": "string"
              },
              "libraries": {
                "additionalProperties": {
                  "maxLength": 64000,
                  "type": "string"
                },
                "description": "Optional virtual libraries keyed by the exact use/include path. No files or URLs are fetched.",
                "propertyNames": {
                  "maxLength": 200,
                  "type": "string"
                },
                "type": "object"
              },
              "margin": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "params": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "type": "number"
                    },
                    {
                      "maxLength": 2000,
                      "type": "string"
                    },
                    {
                      "type": "boolean"
                    },
                    {
                      "items": {
                        "type": "number"
                      },
                      "maxItems": 100,
                      "type": "array"
                    }
                  ]
                },
                "propertyNames": {
                  "maxLength": 100,
                  "type": "string"
                },
                "type": "object"
              },
              "sheet": {
                "additionalItems": false,
                "items": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 10000,
                    "type": "number"
                  },
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 10000,
                    "type": "number"
                  }
                ],
                "maxItems": 2,
                "minItems": 2,
                "type": "array"
              },
              "source": {
                "description": "KerfScript program. Lengths are millimetres; angles are degrees.",
                "maxLength": 64000,
                "type": "string"
              }
            },
            "required": ["source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
