        {
          "name": "valuation_cost_approach",
          "title": "Cost Approach",
          "description": "Cost approach: depreciated reproduction cost from a cost breakdown and depreciated replacement cost with equivalent utility, both reduced by obsolescence. Method selects the formula. Use when no income or market evidence exists, or to corroborate income and market indications for internally developed intangibles. For income-based indications use valuation_income_methods; for market evidence use valuation_market_approach. Per method: reproduction_cost needs development_costs (optional: obsolescence_factors); replacement_cost needs current_cost (optional: obsolescence_factors). obsolescence_factors values are decimals that are summed and applied to the cost base; omit them for no obsolescence. Only method is required; all other parameters are method-dependent — supply those the selected method names and omit the rest (defaults apply where defined). Rates and premiums are decimals (0.10 = 10%). Pure arithmetic: no I/O and no external calls, rounded to 2 decimals; parameters belonging to other methods are accepted and ignored. An unknown method, or a missing method-required parameter, returns an error instead of a value.",
          "inputSchema": {
            "properties": {
              "current_cost": {
                "description": "Current cost to replace the asset with equivalent utility, in currency units.",
                "type": "number"
              },
              "development_costs": {
                "description": "Cost breakdown by category, e.g. {\"r_and_d\": 1000000, \"testing\": 250000}, in currency units.",
                "type": "object"
              },
              "method": {
                "description": "Formula to apply. Options: reproduction_cost = Sum of cost categories less total obsolescence.; replacement_cost = Current cost of equivalent utility less obsolescence.",
                "enum": ["reproduction_cost", "replacement_cost"],
                "type": "string"
              },
              "obsolescence_factors": {
                "description": "Obsolescence factors, e.g. {\"functional\": 0.10, \"technological\": 0.15, \"economic\": 0.05}.",
                "type": "object"
              }
            },
            "required": ["method"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "assumptions": {
                "description": "Modelling assumptions applied (list of strings or key/value object)."
