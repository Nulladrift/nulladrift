        {
          "name": "valuation_customer",
          "title": "Customer-Related Assets",
          "description": "Customer-related intangibles: customer relationships with attrition, distribution networks by channel profitability, and non-compete agreements on protected profits. Method selects the formula. Use for customer relationships, distribution networks, and non-compete assets; customer_relationships projects multi-period revenue with a retention rate. For the workforce and key-person assets use valuation_human_capital; for technology assets use valuation_technology. Per method: customer_relationships needs customer_count + avg_revenue_per_customer + retention_rate + profit_margin + discount_rate + projection_period; distribution_network needs channel_count + revenue_per_channel + channel_margin + useful_life + discount_rate; non_compete needs protected_revenue + profit_margin + term + enforcement_probability + discount_rate. retention_rate and enforcement_probability are in [0,1]; projection_period sets the number of discounted periods. Only method is required; all other parameters are method-dependent — supply those the selected method names and omit the rest (defaults apply where defined). Rates and premiums are decimals (0.10 = 10%). Pure arithmetic: no I/O and no external calls, rounded to 2 decimals; parameters belonging to other methods are accepted and ignored. An unknown method, or a missing method-required parameter, returns an error instead of a value.",
          "inputSchema": {
            "properties": {
              "avg_revenue_per_customer": {
                "description": "Average annual revenue per customer, in currency units.",
                "type": "number"
              },
              "channel_count": {
                "description": "Number of distribution channels (integer ≥ 0).",
                "type": "integer"
              },
              "channel_margin": {
                "description": "Channel profit margin as a decimal in [0,1].",
                "type": "number"
              },
              "customer_count": {
                "description": "Number of customers (integer ≥ 0).",
                "type": "integer"
              },
              "discount_rate": {
                "description": "Per-period discount rate as a decimal (0.10 = 10%).",
                "type": "number"
              },
              "enforcement_probability": {
                "description": "Probability the non-compete is enforceable, in [0,1].",
                "type": "number"
              },
              "method": {
                "description": "Formula to apply. Options: customer_relationships = Multi-period revenue net of attrition, discounted.; distribution_network = Channel revenue times margin over the useful life.; non_compete = Protected profit under an enforcement probability, discounted.",
                "enum": ["customer_relationships", "distribution_network", "non_compete"],
                "type": "string"
              },
              "profit_margin": {
                "description": "Profit margin as a decimal (0.20 = 20%).",
                "type": "number"
              },
              "projection_period": {
                "description": "Projection horizon in years (integer ≥ 1).",
                "type": "integer"
              },
              "protected_revenue": {
                "description": "Annual revenue protected by the non-compete, in currency units.",
                "type": "number"
              },
              "retention_rate": {
                "description": "Annual customer retention rate, in [0,1].",
                "type": "number"
              },
              "revenue_per_channel": {
                "description": "Annual revenue per channel, in currency units.",
                "type": "number"
              },
              "term": {
                "description": "Non-compete term in years (≥ 0).",
                "type": "integer"
              },
              "useful_life": {
                "description": "Useful life in years n (integer ≥ 1).",
                "type": "integer"
              }
            },
            "required": ["method"],
            "type": "object"
          },
