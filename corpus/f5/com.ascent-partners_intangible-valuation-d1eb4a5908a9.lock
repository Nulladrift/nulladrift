        {
          "name": "valuation_ip",
          "title": "Intellectual Property",
          "description": "Intellectual property: risk-adjusted patent value, trademark/brand value, copyright income value, and trade-secret value under secrecy risk. Method selects the formula. Use to value a specific IP right; patent weights projected cash flows by probability of success, trademark uses brand strength to set the royalty. For technology, software, data, and platform assets use valuation_technology; for customer and workforce assets use valuation_customer and valuation_human_capital. Per method: patent needs remaining_life + cash_flow_projections + probability_of_success + discount_rate (optional: comparable_license_rates); trademark needs revenue + profit_margin + brand_strength_index + discount_rate + useful_life (optional: brand_method); copyright needs projected_revenue + useful_life + discount_rate + royalty_rate; trade_secret needs development_cost + economic_life + competitive_advantage_period + discount_rate + secrecy_probability. cash_flow_projections for patent run over remaining_life. Only method is required; all other parameters are method-dependent — supply those the selected method names and omit the rest (defaults apply where defined). Rates and premiums are decimals (0.10 = 10%). Pure arithmetic: no I/O and no external calls, rounded to 2 decimals; parameters belonging to other methods are accepted and ignored. An unknown method, or a missing method-required parameter, returns an error instead of a value.",
          "inputSchema": {
            "properties": {
              "brand_method": {
                "description": "Trademark method: relief_from_royalty adjusts the royalty rate by brand strength; excess_earnings capitalizes excess earnings.",
                "enum": ["relief_from_royalty", "excess_earnings"],
                "type": "string"
              },
              "brand_strength_index": {
                "description": "Brand strength index on a 0-100 scale (75 = strong).",
                "type": "number"
              },
              "cash_flow_projections": {
                "description": "Projected after-tax cash flows per period t=1..n, in currency units.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "comparable_license_rates": {
                "description": "Comparable license royalty rates as decimals.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "competitive_advantage_period": {
                "description": "Years the competitive advantage is expected to persist (≥ 0).",
                "type": "integer"
              },
              "development_cost": {
                "description": "Development or acquisition cost, in currency units.",
                "type": "number"
              },
              "discount_rate": {
                "description": "Per-period discount rate as a decimal (0.10 = 10%).",
                "type": "number"
              },
              "economic_life": {
                "description": "Economic life in years (≥ 1).",
                "type": "integer"
              },
              "method": {
                "description": "Formula to apply. Options: patent = Risk-adjusted DCF over the patent's remaining life.; trademark = Brand value by relief-from-royalty or excess earnings.; copyright = PV of expected copyright royalty income.; trade_secret = Value under secrecy risk over the economic life.",
                "enum": ["patent", "trademark", "copyright", "trade_secret"],
                "type": "string"
              },
              "probability_of_success": {
                "description": "Probability of technical and commercial success, in [0,1].",
                "type": "number"
              },
              "profit_margin": {
                "description": "Profit margin as a decimal (0.20 = 20%).",
                "type": "number"
              },
              "projected_revenue": {
                "description": "Projected annual revenue subject to the copyright royalty, in currency units.",
                "type": "number"
              },
              "remaining_life": {
                "description": "Remaining legal/economic life of the patent in years (≥ 0).",
                "type": "integer"
              },
              "revenue": {
                "description": "Annual revenue attributable to the asset, in currency units.",
                "type": "number"
              },
              "royalty_rate": {
                "description": "Royalty rate as a decimal (0.05 = 5% of revenue).",
                "type": "number"
              },
              "secrecy_probability": {
                "description": "Probability the trade secret remains secret, in [0,1].",
                "type": "number"
              },
              "useful_life": {
