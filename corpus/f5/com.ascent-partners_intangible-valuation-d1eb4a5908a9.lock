        {
          "name": "valuation_market_approach",
          "title": "Market Approach",
          "description": "Market approach: value from comparable transaction revenue multiples or capitalize a royalty stream into a perpetuity value. Method selects the formula. Use when reliable comparable transactions or royalty rates exist for the subject asset. For income-based excess earnings use valuation_income_methods; for royalty-rate selection and adjustment use valuation_royalty_analysis. Per method: comparable_transactions needs comparables + subject_revenue (optional: adjustments); royalty_capitalization needs revenue + royalty_rate + discount_rate. Each comparable is {revenue, multiple}; comparable_transactions applies the comparable multiple to subject_revenue. Only method is required; all other parameters are method-dependent — supply those the selected method names and omit the rest (defaults apply where defined). Rates and premiums are decimals (0.10 = 10%). Pure arithmetic: no I/O and no external calls, rounded to 2 decimals; parameters belonging to other methods are accepted and ignored. An unknown method, or a missing method-required parameter, returns an error instead of a value.",
          "inputSchema": {
            "properties": {
              "adjustments": {
                "description": "Optional multiplicative adjustments, e.g. {\"size\": 0.9, \"growth\": 1.1}.",
                "type": "object"
              },
              "comparables": {
                "description": "Comparable transactions, each {revenue, multiple}.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "discount_rate": {
                "description": "Per-period discount rate as a decimal (0.10 = 10%).",
                "type": "number"
              },
              "method": {
                "description": "Formula to apply. Options: comparable_transactions = Subject revenue times the median comparable multiple.; royalty_capitalization = Value = (revenue * royalty rate) / discount rate.",
                "enum": ["comparable_transactions", "royalty_capitalization"],
                "type": "string"
              },
              "revenue": {
                "description": "Annual revenue attributable to the asset, in currency units.",
                "type": "number"
              },
              "royalty_rate": {
                "description": "Royalty rate as a decimal (0.05 = 5% of revenue).",
                "type": "number"
              },
              "subject_revenue": {
                "description": "Subject company revenue, in currency units.",
                "type": "number"
              }
