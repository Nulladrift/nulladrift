        {
          "name": "valuation_income_methods",
          "title": "Income Methods",
          "description": "Income approach: relief from royalty, multi-period and single-period excess earnings, incremental cash flow, and contributory asset charges. Method selects the formula. Use for the income-approach arithmetic: relief_from_royalty for IP with observable royalty rates, and excess earnings (mpeem or single_period_excess_earnings) for the residual intangible. For a complete asset-specific valuation of customer, technology, IP or workforce assets, prefer the dedicated valuation_customer, valuation_technology, valuation_ip and valuation_human_capital tools. For royalty-rate inputs use valuation_royalty_analysis; for asset-specific income valuations use valuation_customer, valuation_technology, valuation_ip or valuation_human_capital; for cost or market indications use valuation_cost_approach and valuation_market_approach. Per method: relief_from_royalty needs revenue_projections + royalty_rate + discount_rate + tax_rate + useful_life (optional: tab_enabled); mpeem needs cash_flow_projections + contributory_asset_charges + discount_rate + tax_rate (optional: tab_enabled); single_period_excess_earnings needs normalized_earnings + contributory_asset_charges + capitalization_rate; incremental_cashflow needs cash_flows_with + cash_flows_without + discount_rate; contributory_asset_charges needs assets. cash_flow_projections and contributory_asset_charges must be period-aligned; cash_flows_with and cash_flows_without must be equal length. Only method is required; all other parameters are method-dependent — supply those the selected method names and omit the rest (defaults apply where defined). Rates and premiums are decimals (0.10 = 10%). Pure arithmetic: no I/O and no external calls, rounded to 2 decimals; parameters belonging to other methods are accepted and ignored. An unknown method, or a missing method-required parameter, returns an error instead of a value.",
          "inputSchema": {
            "properties": {
              "assets": {
                "description": "Contributory assets, each {value, return_rate}.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "capitalization_rate": {
                "description": "Capitalization rate as a decimal (0.15 = 15%).",
                "type": "number"
              },
              "cash_flow_projections": {
                "description": "Projected after-tax cash flows per period t=1..n, in currency units.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "cash_flows_with": {
                "description": "Cash flows per period with the asset, in currency units.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "cash_flows_without": {
                "description": "Cash flows per period without the asset, in currency units.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "contributory_asset_charges": {
                "description": "Contributory asset charge per period t=1..n, in currency units.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "discount_rate": {
                "description": "Per-period discount rate as a decimal (0.10 = 10%).",
                "type": "number"
              },
              "method": {
                "description": "Formula to apply. Options: relief_from_royalty = PV of after-tax royalties avoided by ownership.; mpeem = PV of excess earnings after contributory asset charges.; single_period_excess_earnings = Capitalize one period of excess earnings.; incremental_cashflow = PV of cash flows with the asset minus without it.; contributory_asset_charges = Total contributory asset charges.",
                "enum": ["relief_from_royalty", "mpeem", "single_period_excess_earnings", "incremental_cashflow", "contributory_asset_charges"],
                "type": "string"
              },
              "normalized_earnings": {
                "description": "Single-period normalized earnings, in currency units.",
                "type": "number"
              },
              "revenue_projections": {
                "description": "Projected revenue per period t=1..n, in currency units.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "royalty_rate": {
