        {
          "name": "valuation_goodwill_ppa",
          "title": "Goodwill & Purchase Price Allocation",
          "description": "Goodwill and purchase price allocation: goodwill as the residual, a full PPA waterfall across identified intangibles, and useful-life estimation. Method selects the formula. Use for ASC 805 / IFRS 3 business combinations; purchase_price_allocation allocates consideration to identified intangibles with the remainder to goodwill. For subsequent goodwill and intangible impairment testing use valuation_impairment; for individual intangible fair values feed valuation_ip, valuation_technology or valuation_customer into the allocation. Per method: goodwill needs purchase_price + fair_value_net_identifiable_assets; purchase_price_allocation needs purchase_price + tangible_assets_fv + identified_intangibles (optional: liabilities_fv); useful_life needs asset_type (optional: legal_life, economic_factors, obsolescence_rate). identified_intangibles values are summed before goodwill is taken as the residual; liabilities_fv reduces net identifiable assets. Only method is required; all other parameters are method-dependent — supply those the selected method names and omit the rest (defaults apply where defined). Rates and premiums are decimals (0.10 = 10%). Pure arithmetic: no I/O and no external calls, rounded to 2 decimals; parameters belonging to other methods are accepted and ignored. An unknown method, or a missing method-required parameter, returns an error instead of a value.",
          "inputSchema": {
            "properties": {
              "asset_type": {
                "description": "Asset type, e.g. \"patent\", \"trademark\", \"software\", \"customer_list\".",
                "type": "string"
              },
              "economic_factors": {
                "description": "Economic adjustment factors, e.g. {\"market_growth\": 0.05, \"competition\": 0.4, \"tech_change\": 0.1}.",
                "type": "object"
              },
              "fair_value_net_identifiable_assets": {
                "description": "Fair value of net identifiable assets, in currency units.",
                "type": "number"
              },
              "identified_intangibles": {
                "description": "Identified intangibles, each {name, value} or {name, fair_value}.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "legal_life": {
                "description": "Legal protection period in years (overrides the asset-type default).",
                "type": "number"
              },
              "liabilities_fv": {
                "default": 0,
                "description": "Fair value of assumed liabilities, in currency units.",
                "type": "number"
              },
              "method": {
                "description": "Formula to apply. Options: goodwill = Goodwill = purchase price - fair value of net identifiable assets.; purchase_price_allocation = Allocate consideration across identified intangibles.; useful_life = Estimate economic/legal useful life of an intangible.",
                "enum": ["goodwill", "purchase_price_allocation", "useful_life"],
                "type": "string"
              },
              "obsolescence_rate": {
                "default": 0.05,
                "description": "Annual obsolescence rate as a decimal in [0,1].",
                "type": "number"
              },
              "purchase_price": {
                "description": "Total consideration / purchase price, in currency units.",
                "type": "number"
              },
              "tangible_assets_fv": {
                "description": "Fair value of tangible assets, in currency units.",
                "type": "number"
              }
            },
            "required": ["method"],
