      "instructions": "Intangible asset valuation calculators: 14 tools covering time value, discount rates, cost, market and income approaches, IP, technology, customer and human-capital assets, goodwill and purchase price allocation, impairment, royalty analysis, uncertainty (Monte Carlo / decision trees), and transfer-pricing / litigation. Select a formula with the `method` argument. Read the resource intangible-valuation://methods for every method's required parameters, or use a prompt (purchase_price_allocation, value_ip_asset, impairment_test) for a guided multi-method workflow.",
      "tools": [
        {
          "name": "valuation_compliance",
          "title": "Transfer Pricing & Litigation",
          "description": "Transfer pricing and litigation: the Comparable Uncontrolled Price arm's-length range and patent infringement damages with pre-judgment interest. Method selects the formula. Use for OECD transfer-pricing pricing of intercompany intangibles and for patent infringement damages awards. For royalty-rate benchmarking to set a rate use valuation_royalty_analysis; for the substantive asset valuation use valuation_ip or valuation_income_methods. Per method: cup_transfer_price needs controlled_price + uncontrolled_prices; patent_infringement_damages needs lost_profits_or_royalty + infringement_period + discount_rate + prejudgment_interest_rate. uncontrolled_prices must contain at least one comparable price for the arm's-length range. Only method is required; all other parameters are method-dependent — supply those the selected method names and omit the rest (defaults apply where defined). Rates and premiums are decimals (0.10 = 10%). Pure arithmetic: no I/O and no external calls, rounded to 2 decimals; parameters belonging to other methods are accepted and ignored. An unknown method, or a missing method-required parameter, returns an error instead of a value.",
          "inputSchema": {
            "properties": {
              "controlled_price": {
                "description": "Intercompany (controlled) price, in currency units.",
                "type": "number"
              },
              "discount_rate": {
                "description": "Per-period discount rate as a decimal (0.10 = 10%).",
                "type": "number"
              },
              "infringement_period": {
                "description": "Infringement period in years (≥ 0).",
                "type": "integer"
              },
              "lost_profits_or_royalty": {
                "description": "Annual lost profits or reasonable royalty, in currency units.",
                "type": "number"
              },
              "method": {
                "description": "Formula to apply. Options: cup_transfer_price = Arm's-length range from comparable uncontrolled prices.; patent_infringement_damages = Lost profits or reasonable royalty plus prejudgment interest.",
                "enum": ["cup_transfer_price", "patent_infringement_damages"],
                "type": "string"
              },
              "prejudgment_interest_rate": {
                "description": "Pre-judgment interest rate as a decimal (e.g. 0.05 = 5%).",
                "type": "number"
              },
              "uncontrolled_prices": {
                "description": "Comparable uncontrolled prices, in currency units.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              }
            },
            "required": ["method"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "assumptions": {
                "description": "Modelling assumptions applied (list of strings or key/value object)."
              },
              "defaults_applied": {
                "description": "Optional parameters that were not supplied, so their documented defaults were used.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "error": {
                "description": "Error message when the call fails.",
                "type": "string"
              },
