        {
          "name": "valuation_simulation",
          "title": "Uncertainty & Sensitivity",
          "description": "Uncertainty analysis: Monte Carlo valuation, Monte Carlo sensitivity ranking, decision-tree expected values, and one-at-a-time sensitivity analysis. Method selects the formula. Use to quantify and stress the uncertainty around a point valuation; monte_carlo simulates all listed inputs, monte_carlo_sensitivity ranks the drivers. For a single deterministic point value use the relevant valuation tool; sensitivity_analysis varies one parameter of a core function only. Per method: monte_carlo needs input_distributions (optional: iterations, seed); monte_carlo_sensitivity needs base_params + distributions (optional: iterations, seed); decision_tree needs tree; sensitivity_analysis needs function_name + parameter_name + parameter_range + fixed_parameters. monte_carlo_sensitivity requires iterations between 1000 and 100000. Only method is required; all other parameters are method-dependent — supply those the selected method names and omit the rest (defaults apply where defined). Rates and premiums are decimals (0.10 = 10%). Pure arithmetic: no I/O and no external calls, rounded to 2 decimals; parameters belonging to other methods are accepted and ignored. An unknown method, or a missing method-required parameter, returns an error instead of a value.",
          "inputSchema": {
            "properties": {
              "base_params": {
                "description": "Base values for all parameters, including those held fixed.",
                "type": "object"
              },
              "distributions": {
                "description": "Map of parameter name to {distribution, params} for the simulated inputs.",
                "type": "object"
              },
              "fixed_parameters": {
                "description": "Values for all other parameters, held constant.",
                "type": "object"
              },
              "function_name": {
                "description": "Core function to vary, e.g. \"present_value\", \"capm_discount_rate\", \"wacc\".",
                "type": "string"
              },
              "input_distributions": {
                "description": "Inputs to simulate, each {name, distribution, params}; distribution is normal (mean, std), uniform (low, high) or triangular (low, high, mode).",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "iterations": {
                "default": 10000,
                "description": "Simulation iterations; monte_carlo_sensitivity requires 1000-100000.",
                "type": "integer"
              },
              "method": {
                "description": "Formula to apply. Options: monte_carlo = Simulate all listed inputs, sum-based valuation.; monte_carlo_sensitivity = Rank parameters by their impact on the valuation.; decision_tree = Backward induction over a decision tree.; sensitivity_analysis = One-at-a-time sensitivity of a core function.",
                "enum": ["monte_carlo", "monte_carlo_sensitivity", "decision_tree", "sensitivity_analysis"],
                "type": "string"
              },
              "parameter_name": {
                "description": "Name of the parameter to vary.",
                "type": "string"
              },
              "parameter_range": {
                "description": "Values to test for the varied parameter.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "seed": {
                "description": "Random seed (integer ≥ 0) for reproducible simulations.",
                "type": "integer"
              },
              "tree": {
                "description": "Decision tree {\"nodes\": [...], \"edges\": [...]}; node types decision, chance, terminal.",
                "type": "object"
              }
            },
            "required": ["method"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "assumptions": {
                "description": "Modelling assumptions applied (list of strings or key/value object)."
              },
              "defaults_applied": {
                "description": "Optional parameters that were not supplied, so their documented defaults were used.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "error": {
                "description": "Error message when the call fails.",
                "type": "string"
              },
              "formula_reference": {
                "description": "Mathematical formula or reference applied.",
                "type": "string"
              },
              "method": {
                "description": "Formula / method name that produced the result.",
                "type": "string"
              },
              "steps": {
                "description": "Intermediate calculation steps for traceability (one string per step).",
                "items": {},
                "type": "array"
              },
              "value": {
                "description": "Computed valuation, rate, or metric.",
                "type": "number"
              }
            },
            "required": ["value"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:59cff787ac1950c35d907a0191966df5827ab5276dda6acd1eea722499fd0eab"
        },
        {
          "name": "valuation_technology",
          "title": "Technology Assets",
          "description": "Technology assets: developed technology under life-cycle risk, software under cost and income, data assets with a quality adjustment, and platforms with network effects. Method selects the formula. Use for developed technology, software, data, and platform intangibles; developed_technology and software blend cost and income evidence. For patents, trademarks, copyrights, and trade secrets use valuation_ip; for customer relationships use valuation_customer. Per method: developed_technology needs rd_costs + life_cycle_stage + competitive_advantage + discount_rate + cash_flow_projections; software needs development_cost + maintenance_cost + user_base + revenue_model + useful_life + discount_rate; data_asset needs acquisition_cost + quality_score + revenue_contribution + useful_life + discount_rate; platform needs network_size + network_effects_coefficient + revenue_per_user + growth_rate + discount_rate. cash_flow_projections for developed_technology run over the remaining useful life. Only method is required; all other parameters are method-dependent — supply those the selected method names and omit the rest (defaults apply where defined). Rates and premiums are decimals (0.10 = 10%). Pure arithmetic: no I/O and no external calls, rounded to 2 decimals; parameters belonging to other methods are accepted and ignored. An unknown method, or a missing method-required parameter, returns an error instead of a value.",
          "inputSchema": {
            "properties": {
              "acquisition_cost": {
                "description": "Cost to acquire the data, in currency units.",
                "type": "number"
              },
              "cash_flow_projections": {
                "description": "Projected after-tax cash flows per period t=1..n, in currency units.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "competitive_advantage": {
                "description": "Years of competitive advantage (≥ 0).",
                "type": "integer"
              },
              "development_cost": {
                "description": "Development or acquisition cost, in currency units.",
                "type": "number"
              },
              "discount_rate": {
                "description": "Per-period discount rate as a decimal (0.10 = 10%).",
                "type": "number"
              },
              "growth_rate": {
                "description": "Per-period growth rate as a decimal (0.03 = 3%).",
                "type": "number"
              },
              "life_cycle_stage": {
                "description": "Life-cycle stage, e.g. \"growth\", \"mature\", \"decline\".",
                "type": "string"
              },
              "maintenance_cost": {
                "description": "Annual maintenance cost, in currency units.",
                "type": "number"
              },
              "method": {
                "description": "Formula to apply. Options: developed_technology = Cost and income value adjusted for life-cycle stage.; software = Software value from development, maintenance, and revenue.; data_asset = Quality-adjusted revenue contribution plus acquisition cost.; platform = Network-effect revenue grown and discounted.",
                "enum": ["developed_technology", "software", "data_asset", "platform"],
                "type": "string"
              },
              "network_effects_coefficient": {
                "description": "Network-effects coefficient scaling revenue with network size (typically 0.5–2.0).",
                "type": "number"
              },
              "network_size": {
                "description": "Number of network participants (integer ≥ 0).",
                "type": "integer"
              },
              "quality_score": {
                "description": "Data quality score, in [0,1].",
                "type": "number"
              },
              "rd_costs": {
                "description": "Cumulative research and development costs, in currency units.",
                "type": "number"
              },
              "revenue_contribution": {
                "description": "Annual revenue contribution, in currency units.",
                "type": "number"
              },
              "revenue_model": {
                "description": "Revenue model, e.g. {\"subscription_price\": 20, \"paying_users\": 10000}.",
                "type": "object"
              },
              "revenue_per_user": {
                "description": "Revenue per user, in currency units.",
                "type": "number"
              },
              "useful_life": {
                "description": "Useful life in years n (integer ≥ 1).",
                "type": "integer"
              },
              "user_base": {
                "description": "Number of users (integer ≥ 0).",
                "type": "integer"
              }
            },
            "required": ["method"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "assumptions": {
                "description": "Modelling assumptions applied (list of strings or key/value object)."
              },
              "defaults_applied": {
                "description": "Optional parameters that were not supplied, so their documented defaults were used.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "error": {
                "description": "Error message when the call fails.",
                "type": "string"
              },
              "formula_reference": {
                "description": "Mathematical formula or reference applied.",
                "type": "string"
              },
              "method": {
                "description": "Formula / method name that produced the result.",
                "type": "string"
              },
              "steps": {
                "description": "Intermediate calculation steps for traceability (one string per step).",
                "items": {},
                "type": "array"
              },
              "value": {
                "description": "Computed valuation, rate, or metric.",
                "type": "number"
              }
            },
            "required": ["value"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
