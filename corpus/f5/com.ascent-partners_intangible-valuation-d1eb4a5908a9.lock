        {
          "name": "valuation_discount_rate",
          "title": "Discount & Capitalization Rates",
          "description": "Construct discount and capitalization rates: build-up, CAPM, WACC, tax-amortization benefit, control premium, Finnerty DLOM, and currency/country-risk adjustment. Method selects the formula. Use to derive the rate that feeds every income-based method; build_up and capm estimate cost of equity, wacc blends debt and equity. For a cross-border rate with currency and country premia use method currency_adjusted; for the cash flows the rate discounts use valuation_time_value. Per method: build_up needs risk_free_rate + equity_risk_premium (optional: size_premium, industry_risk_premium, specific_risk_premium); capm needs risk_free_rate + beta + market_return; wacc needs equity_value + debt_value + cost_of_equity + cost_of_debt + tax_rate; tax_amortization_benefit needs discount_rate + useful_life + tax_rate + asset_value; control_premium needs minority_price + control_price; dlom_finnerty needs restricted_period + volatility + risk_free_rate; currency_adjusted needs base_rate (optional: currency_risk_premium, country_risk_premium). All rates and premiums are decimals; wacc requires both equity_value and debt_value, and dlom_finnerty volatility is an annualized decimal. Only method is required; all other parameters are method-dependent — supply those the selected method names and omit the rest (defaults apply where defined). Rates and premiums are decimals (0.10 = 10%). Pure arithmetic: no I/O and no external calls, rounded to 2 decimals; parameters belonging to other methods are accepted and ignored. An unknown method, or a missing method-required parameter, returns an error instead of a value.",
          "inputSchema": {
            "properties": {
              "asset_value": {
                "description": "Asset value the tax amortization benefit is computed on, in currency units.",
                "type": "number"
              },
              "base_rate": {
                "description": "Base discount rate before currency/country adjustment, as a decimal (e.g. 0.12 = 12%).",
                "type": "number"
              },
              "beta": {
                "description": "Systematic risk beta (market = 1.0).",
                "type": "number"
              },
              "control_price": {
                "description": "Controlling-interest share price or value, in currency units.",
                "type": "number"
              },
              "cost_of_debt": {
                "description": "Pre-tax cost of debt Rd as a decimal (e.g. 0.06 = 6%).",
                "type": "number"
              },
              "cost_of_equity": {
                "description": "Cost of equity Re as a decimal (e.g. 0.12 = 12%).",
                "type": "number"
              },
              "country_risk_premium": {
                "default": 0,
                "description": "Country risk premium as a decimal (e.g. 0.03 = 3%).",
                "type": "number"
              },
              "currency_risk_premium": {
                "default": 0,
                "description": "Currency risk premium as a decimal (e.g. 0.02 = 2%).",
                "type": "number"
              },
              "debt_value": {
                "description": "Market value of debt D, in currency units.",
                "type": "number"
              },
              "discount_rate": {
                "description": "Per-period discount rate as a decimal (0.10 = 10%).",
                "type": "number"
              },
              "equity_risk_premium": {
                "description": "Equity risk premium as a decimal (0.06 = 6%).",
                "type": "number"
              },
              "equity_value": {
                "description": "Market value of equity E, in currency units.",
                "type": "number"
              },
              "industry_risk_premium": {
                "default": 0,
                "description": "Industry risk premium as a decimal (e.g. 0.02 = 2%).",
                "type": "number"
              },
              "market_return": {
                "description": "Expected market return as a decimal (0.10 = 10%).",
                "type": "number"
              },
              "method": {
                "description": "Formula to apply. Options: build_up = r = Rf + ERP + size + industry + specific premiums.; capm = r = Rf + beta * (Rm - Rf).; wacc = WACC = (E/V) Re + (D/V) Rd (1 - Tc).; tax_amortization_benefit = PV of the tax shield from amortizing the asset.; control_premium = (Control price - minority price) / minority price.; dlom_finnerty = Finnerty average-strike put option DLOM.; currency_adjusted = r = base rate + currency premium + country premium.",
                "enum": ["build_up", "capm", "wacc", "tax_amortization_benefit", "control_premium", "dlom_finnerty", "currency_adjusted"],
                "type": "string"
              },
              "minority_price": {
                "description": "Minority (pre-control) share price or value, in currency units.",
                "type": "number"
              },
              "restricted_period": {
                "description": "Restricted / marketability period in years t (≥ 0).",
                "type": "number"
              },
              "risk_free_rate": {
                "description": "Risk-free rate as a decimal (0.04 = 4%).",
                "type": "number"
              },
              "size_premium": {
                "default": 0,
                "description": "Small-size premium as a decimal (e.g. 0.03 = 3%).",
                "type": "number"
              },
              "specific_risk_premium": {
                "default": 0,
                "description": "Company-specific risk premium as a decimal (e.g. 0.03 = 3%).",
                "type": "number"
              },
              "tax_rate": {
                "description": "Marginal tax rate as a decimal (0.25 = 25%).",
                "type": "number"
              },
              "useful_life": {
                "description": "Useful life in years n (integer ≥ 1).",
                "type": "integer"
              },
              "volatility": {
                "description": "Annualized volatility sigma as a decimal (0.30 = 30%).",
                "type": "number"
              }
            },
            "required": ["method"],
            "type": "object"
          },
