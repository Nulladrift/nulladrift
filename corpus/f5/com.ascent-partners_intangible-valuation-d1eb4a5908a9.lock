          "digest": "sha256:c71ebf0fd454a37c11715ce2b7854fec9afac24bbe350121160bf9fe1d7a9a11"
        },
        {
          "name": "valuation_time_value",
          "title": "Time Value of Money",
          "description": "Time value of money: discount or compound a single sum, value level and growing annuities and perpetuities, and compute a terminal value by Gordon growth or exit multiple. Method selects the formula. Use to move cash flows through time or to value a terminal value in a DCF; combine with a rate from valuation_discount_rate. For uneven multi-period cash flows use valuation_income_methods; for rate construction use valuation_discount_rate. Per method: present_value needs future_value + discount_rate + periods; future_value needs present_value + discount_rate + periods; annuity_pv needs payment + discount_rate + periods; perpetuity_pv needs payment + discount_rate; growing_annuity_pv needs payment + discount_rate + growth_rate + periods; terminal_value_gordon_growth needs final_year_cashflow + perpetual_growth_rate + discount_rate; terminal_value_exit_multiple needs final_year_cashflow + exit_multiple. Rates and growth are decimals (0.10 = 10%); for terminal_value_gordon_growth the discount rate must exceed the perpetual growth rate. Only method is required; all other parameters are method-dependent — supply those the selected method names and omit the rest (defaults apply where defined). Rates and premiums are decimals (0.10 = 10%). Pure arithmetic: no I/O and no external calls, rounded to 2 decimals; parameters belonging to other methods are accepted and ignored. An unknown method, or a missing method-required parameter, returns an error instead of a value.",
          "inputSchema": {
            "properties": {
              "discount_rate": {
                "description": "Per-period discount rate as a decimal (0.10 = 10%).",
                "type": "number"
              },
              "exit_multiple": {
                "description": "Exit multiple applied to the final-year cash flow (e.g. 8.0 for 8x).",
                "type": "number"
              },
              "final_year_cashflow": {
                "description": "Final-year projected cash flow (FCF), in currency units.",
                "type": "number"
              },
              "future_value": {
                "description": "Future cash amount to discount, in currency units.",
                "type": "number"
              },
              "growth_rate": {
                "description": "Per-period growth rate as a decimal (0.03 = 3%).",
                "type": "number"
              },
              "method": {
                "description": "Formula to apply. Options: present_value = PV = FV / (1 + r)^n.; future_value = FV = PV * (1 + r)^n.; annuity_pv = PV = PMT * [1 - (1 + r)^-n] / r.; perpetuity_pv = PV = PMT / r.; growing_annuity_pv = PV of a constant-growth annuity.; terminal_value_gordon_growth = TV = FCF * (1 + g) / (r - g).; terminal_value_exit_multiple = TV = FCF * exit multiple.",
                "enum": ["present_value", "future_value", "annuity_pv", "perpetuity_pv", "growing_annuity_pv", "terminal_value_gordon_growth", "terminal_value_exit_multiple"],
                "type": "string"
              },
              "payment": {
                "description": "Recurring payment per period, in currency units.",
                "type": "number"
              },
              "periods": {
                "description": "Number of periods n (non-negative).",
                "type": "integer"
              },
              "perpetual_growth_rate": {
                "description": "Perpetual growth rate g as a decimal; must be below discount_rate for Gordon growth.",
                "type": "number"
              },
              "present_value": {
                "description": "Present amount to compound, in currency units.",
                "type": "number"
              }
            },
            "required": ["method"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "assumptions": {
                "description": "Modelling assumptions applied (list of strings or key/value object)."
              },
              "defaults_applied": {
                "description": "Optional parameters that were not supplied, so their documented defaults were used.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "error": {
                "description": "Error message when the call fails.",
                "type": "string"
              },
              "formula_reference": {
                "description": "Mathematical formula or reference applied.",
                "type": "string"
              },
              "method": {
                "description": "Formula / method name that produced the result.",
                "type": "string"
              },
              "steps": {
                "description": "Intermediate calculation steps for traceability (one string per step).",
                "items": {},
                "type": "array"
              },
              "value": {
                "description": "Computed valuation, rate, or metric.",
                "type": "number"
              }
            },
            "required": ["value"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:28e36ac69f5c72a5514e461df4a2dda4392bf3e81a70b68d6c9bcea4ac8671fd"
        }
