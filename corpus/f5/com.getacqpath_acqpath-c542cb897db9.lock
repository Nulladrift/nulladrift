{
  "lockfileVersion": 2,
  "subjects": {
    "com.getacqpath/acqpath": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.getacqpath.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "AcqPath",
        "version": "3.1.0-rc.1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Use acqpath_capabilities for reviewed coverage and gateway services. Existing acqpath_rights_quote prepares a Preflight. Ingestion Gate and Revalidation are paid HTTP operations described in /openapi.json; use the official TS/Python x402 signer plus AcqPath SIWX adapter. No paid MCP execution or generic router compatibility is claimed. No keys, signatures or private checkpoints in prompts.",
      "tools": [
        {
          "name": "acqpath_capabilities",
          "description": "List operator-approved interchangeable capabilities; no payment.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6424a020d248e543c63a6b411c40bef1fa9a7fbbd1a74cf680d8901815862ea9"
        },
        {
          "name": "acqpath_quote",
          "description": "Get an estimated cheaper purchase plan for a verified contract. No payment is made. Quote claim token is sensitive.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "baseline_provider": {
                "type": "string"
              },
              "capability": {
                "type": "string"
              },
              "contract": {
                "type": "string"
              },
              "max_latency_ms": {
                "maximum": 60000,
                "minimum": 100,
                "type": "integer"
              },
              "max_total_micro": {
                "pattern": "^[0-9]+$",
                "type": "string"
              },
              "purpose": {
                "enum": ["ai-input", "ai-train", "search", "crawl"],
                "type": "string"
              },
              "require_declared_rights": {
                "default": true,
                "type": "boolean"
              }
            },
            "required": ["baseline_provider", "capability", "contract", "max_total_micro"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:2556a6601a0b9c9f204164caf2f2dad3e97669b5f348c95f95a2a061c6e3cdcf"
        },
        {
          "name": "acqpath_rights_quote",
          "description": "Prepare a bounded signed report of observed RSL declarations; no payment occurs. This is not a license. Keep the returned claim token private.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "freshness_seconds": {
                "default": 300,
                "maximum": 3600,
                "minimum": 0,
                "type": "integer"
              },
              "geo": {
                "description": "Caller-supplied geographical context. This is not independently verified location.",
                "pattern": "^[A-Z]{2}$",
                "type": ["string", "null"]
              },
              "max_total_micro": {
                "description": "Exact integer micro-USDC budget.",
                "pattern": "^(0|[1-9][0-9]*)$",
                "type": "string"
              },
              "purpose": {
                "enum": ["ai-input", "ai-train", "ai-index", "search"],
                "type": "string"
              },
              "resource": {
                "description": "HTTPS resource on an explicitly reviewed origin; no query, fragment, credentials, IP literal, encoded slash or redirect.",
                "format": "uri",
                "maxLength": 2048,
                "type": "string"
              },
              "tier": {
                "default": "fresh",
                "enum": ["fresh", "deep"],
                "type": "string"
              },
              "user_class": {
                "default": "commercial",
                "enum": ["commercial", "non-commercial", "education", "government", "personal"],
                "type": "string"
              }
            },
            "required": ["max_total_micro", "purpose", "resource"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a8f05b332f77f970a7814f24d8361807196fc654ec0ba62585eee456176c95e2"
        }
      ],
      "digest": "sha256:e7c925575029c1799b14dbb34eddd544a03deea1af53e905e793de8d618da116"
    }
  }
}
