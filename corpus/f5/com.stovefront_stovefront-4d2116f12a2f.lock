      "instructions": "Stovefront hosts online storefronts for independent home cooks and small food businesses in the United States. These tools read published kitchens and their menus. An order is a request: the customer submits it on the kitchen's own storefront and the cook confirms it. The tools do not place orders or take payment; build_order_link returns a storefront link with the cart filled in.",
