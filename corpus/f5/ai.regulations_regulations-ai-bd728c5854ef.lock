        },
        {
          "name": "list_jurisdictions",
          "title": "List jurisdictions",
          "description": "List every jurisdiction covered, with how many regulations each has.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List jurisdictions"
          },
          "behavior": {
