          },
          "digest": "sha256:80f0cc4514d670dde925d1fd056b519b529609d2eb93349e7f1faa4d133bdee4"
        },
        {
          "name": "search_regulations",
          "title": "Search AI regulations",
          "description": "Search AI regulations across 160+ jurisdictions by keyword, jurisdiction, status or type. Returns the key facts and a short snippet for each, with the url of the full record on regulations.ai — always give the user that url.",
          "inputSchema": {
            "properties": {
              "jurisdiction": {
                "description": "Filter to a country/state, e.g. \"France\", \"California\"",
                "type": "string"
              },
              "limit": {
                "description": "Max results (free: up to 5; with an API key: up to 50)",
                "type": "number"
              },
              "query": {
                "description": "Free-text search over title, summary and jurisdiction",
                "type": "string"
              },
              "status": {
                "description": "e.g. In Force, Proposed, Under Review, Repealed",
                "type": "string"
              },
              "type": {
                "description": "Act, Bill, Decree, Regulation, Policy, Guideline, Standard",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search AI regulations"
          },
          "behavior": {
