        {
          "name": "recent_changes",
          "title": "Recent regulation changes",
          "description": "What changed in AI regulation recently: records newly added, records whose status, dates or milestones changed (with the previous and new values), and dated milestones that fell due in the window, such as a law taking effect. Each result carries a `change` saying what happened and when. Rewritten analysis text is not counted as a change.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "Look-back window in days (default 30; free: up to 90, with an API key: up to 365)",
                "type": "number"
              },
              "jurisdiction": {
                "description": "Optional jurisdiction filter",
                "type": "string"
              },
              "limit": {
                "description": "Max results (free: up to 5; with an API key: up to 50)",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recent regulation changes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:306e19a17f971dee09c5419eaef3ca8e8f7958ba980a5012085e22d88e93cd0f"
        },
        {
          "name": "search",
          "title": "Search regulations.ai",
          "description": "Search everything on regulations.ai — AI laws and policies from 160+ jurisdictions, glossary definitions, enforcement actions and litigation, research papers and news. Returns id, title and url for each hit; pass an id to `fetch` for the summary.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "What to look for",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search regulations.ai"
          },
          "behavior": {
            "destructive": false,
