      "serverInfo": {
        "name": "uplinkswitch",
        "title": "UplinkSwitch",
        "version": "2026-10-19",
        "description": "Every AI model as tools on one key: chat, compare, search, embed, transcribe, images, video, speech.",
        "websiteUrl": "https://uplinkswitch.ai",
        "icons": [
          {
            "src": "https://uplinkswitch.ai/brand/uplinkswitch-icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "UplinkSwitch is one API key and one base URL (https://api.uplinkswitch.com/v1) for Claude, GPT, Gemini, Grok, DeepSeek and the open-weight chat models, plus image, video, speech, music and 3D models, priced per million tokens or per unit in USD below the developers' list prices. Prepaid credit, no subscription. Read prices live: list_models and list_media_models need no key and return every model id with its price and the developer's list price. estimate prices a chat request before it is sent. proof reports the daily real-model check per model. Every model on the key is a tool here, so the client can call in whichever model suits each step. chat sends a conversation to any chat model id (system for instructions, image_urls for the models that see images, web_search for live results). compare sends the same messages to 2 to 5 models at once and returns each answer with its cost and time, for a second opinion or to pick a model. search runs one web search. embed turns text into vectors with an embedding model, rerank orders documents by relevance to a query, transcribe turns an audio or video file at a URL into text. list_models returns every text model with its type (chat, embedding, rerank, transcription) and price. Make media here instead of in a separate app: generate runs any image, video, speech, music or 3D model id with its settings ({ model, input }) and waits up to wait_seconds for the files; a video takes minutes, so when it answers still running, call generation with the id to keep waiting. media_model lists one model's settings (params, with the values each takes) and its price per tier; media_quote prices the exact call before it runs. generations lists what the organization has made, newest first. Files are URLs on this API, kept 30 days, returned as resource links; a finished image also comes back inline. Chain the tools by passing an output URL into another model's image_urls (image to video, an edit, image-upscaler). A failed generation is refunded in full. Four prompts hand you a saved chain of these tools with the user's inputs filled in: picture_to_clip, product_shot_set, clip_with_voiceover and upscale_and_animate. chat, compare, search, embed, rerank, transcribe, media_quote, generate, generation and generations need the caller's key in the Authorization header of the MCP request (Bearer sk-uplink-live-...). Keys come from https://uplinkswitch.ai/console.",
      "tools": [
        {
          "name": "chat",
          "title": "Send a chat request",
          "description": "Sends messages to any chat model id through POST /v1/chat/completions and returns the answer, the token usage and what the request cost. system adds instructions, image_urls lets a model that sees images look at them (a file generate made works), web_search lets the model search while it answers. Billed to the key in the MCP request's Authorization header (Bearer sk-uplink-live-...); without one it fails.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "image_urls": {
                "description": "Image URLs attached to the last user message, for the chat models that take images (input_modalities in list_models). A file generate made works.",
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "max_tokens": {
                "description": "Cap on completion tokens.",
                "maximum": 128000,
                "minimum": 1,
                "type": "integer"
              },
              "messages": {
                "description": "The conversation, OpenAI chat format.",
                "items": {
                  "properties": {
                    "content": {
                      "type": "string"
                    },
                    "role": {
                      "enum": ["system", "user", "assistant"],
                      "type": "string"
                    }
                  },
                  "required": ["content", "role"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "model": {
                "description": "A chat model id from list_models.",
                "type": "string"
              },
              "system": {
                "description": "Instructions placed ahead of the conversation as a system message.",
                "maxLength": 100000,
                "type": "string"
              },
              "temperature": {
                "maximum": 2,
                "minimum": 0,
                "type": "number"
              },
              "web_search": {
                "description": "True: the model may search the web while it answers (billed per search, the price in GET /v1/catalog server_tools).",
                "type": "boolean"
              }
            },
            "required": ["messages", "model"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:90b75119a715624e25242ba3998f4cf6c9999ec24e98a7ac3b630efadff3129d"
        },
        {
          "name": "compare",
          "title": "Ask several models the same thing",
          "description": "Sends the same conversation (or one prompt) to 2 to 5 chat model ids at once through POST /v1/chat/completions and returns every answer side by side with its token usage, cost and time, plus the total. For a second opinion from another model, or to pick the model that answers a kind of question best. Completions are capped at max_tokens each (default 1024). Each model is billed to the key in the MCP request's Authorization header; a model that fails is reported and not charged.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "image_urls": {
                "description": "Image URLs attached to the last user message, for the chat models that take images (input_modalities in list_models). A file generate made works.",
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "max_tokens": {
                "description": "Cap on completion tokens per model. Default 1024.",
                "maximum": 32000,
                "minimum": 1,
                "type": "integer"
              },
              "messages": {
                "description": "The conversation, OpenAI chat format.",
                "items": {
                  "properties": {
                    "content": {
                      "type": "string"
                    },
                    "role": {
                      "enum": ["system", "user", "assistant"],
                      "type": "string"
                    }
                  },
                  "required": ["content", "role"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "models": {
                "description": "2 to 5 chat model ids from list_models, asked at the same time.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              },
              "prompt": {
                "description": "One user message, in place of messages.",
                "type": "string"
              },
              "system": {
                "description": "Instructions placed ahead of the conversation as a system message.",
                "maxLength": 100000,
                "type": "string"
              },
              "temperature": {
                "maximum": 2,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["models"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
