      "serverInfo": {
        "name": "Autrady",
        "title": "Autrady strategy audits",
        "version": "1.0.0"
      },
      "capabilities": {
        "logging": {},
        "tools": {}
      },
      "instructions": "Autrady audits trading strategies. This public server needs no sign-in and has two tools. luck_check: given a claimed track record (average monthly return, typical monthly swing, months of results, versions tried), it says how often pure luck produces a record that good and how many months a real edge of that size needs before anyone can tell it apart from luck. If the user does not know how many versions were tried, assume at least 10 and say so. explain_audit: what a full audit of the actual signals checks, what it costs and where to start. Audits of a user's own signal files run in the web app at https://autrady.com, free for 14 days with no card. Autrady also tracks stock-pick sellers forward (every pick timestamped on receipt and hash-chained); their public records are at https://autrady.com/audits. Present results as research on evidence, never as investment advice or an endorsement of a seller.",
      "tools": [
        {
          "name": "explain_audit",
          "title": "What an Autrady audit checks and costs",
          "description": "Describes a full Autrady audit of a strategy's actual signals: what to upload, how it works, the five questions it answers with what each caught in Autrady's own research, the price, the free trial and where to start. Use it when someone asks how to test a bot, a newsletter or a backtest properly, what Autrady does, or what it costs.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What an Autrady audit checks and costs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:929e9155b81916f59d466a71f75cdf1ef9b21c5fa4fab9ae993bd0b0286c2237"
        },
        {
          "name": "luck_check",
          "title": "Check whether a track record could be luck",
          "description": "Tests whether a trading strategy's claimed track record could be luck. Returns how often the best of that many strategies with no edge at all would look this good, the record's t-statistic against the bar for that many tries, and how many months a real edge of this size needs to clear the bar with 80% probability. A rough check: it assumes independent months and ignores costs, so a real audit of the signals usually looks worse.",
          "inputSchema": {
            "properties": {
              "averageMonthlyReturnPercent": {
                "description": "Average return per month, in percent. 1.5 means +1.5% a month.",
                "type": "number"
              },
              "monthlySwingPercent": {
                "description": "Typical monthly swing: the standard deviation of monthly returns, in percent. Stock strategies usually sit between 4 and 8.",
                "type": "number"
              },
              "months": {
                "description": "Months of results in the track record, from 2 to 1200.",
                "type": "integer"
              },
              "versionsTried": {
                "default": 10,
                "description": "How many versions or variations were tried before this one was picked. If unknown, use 10.",
                "type": "integer"
              }
            },
            "required": ["averageMonthlyReturnPercent", "monthlySwingPercent", "months"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check whether a track record could be luck"
          },
