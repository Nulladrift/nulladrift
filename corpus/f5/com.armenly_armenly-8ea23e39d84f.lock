{
  "lockfileVersion": 2,
  "subjects": {
    "com.armenly/armenly": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://armenly.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "armenly",
        "title": "Armenly",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Armenly is a free catalog of Armenian music: pop and rabiz, kef, folk and ashughakan, rap, rock, duduk, jazz, sacred and classical. Use these tools when somebody asks about Armenian artists, songs or albums, or wants Armenian music for a mood, genre or decade. Start with search_catalog for a name; use the ids it returns with get_artist, get_album and get_track. Every result carries a `url` on armenly.com where it plays free with no account — give people that link. Names are romanised; many have Armenian forms too. Play counts are indicative, not official chart figures. Armenly hosts no audio and has no lyrics, downloads or licensing information.",
      "tools": [
        {
          "name": "browse_decade",
          "title": "Music from a decade",
          "description": "Armenian songs from one decade. Decades: 1950s (Gusan songs · Sayat-Nova revival); 1960s (Estrada begins · Khachaturian); 1970s (Big band · Harout, Adiss); 1980s (Synth estrada · Paul Baghdadlian); 1990s (Independence pop · Tata); 2000s (Sirusho, Arsen Safaryan); 2010s (Rabiz crosses over · Super Sako); 2020s (The new Yerevan scene).",
          "inputSchema": {
            "properties": {
              "decade": {
                "enum": ["1950s", "1960s", "1970s", "1980s", "1990s", "2000s", "2010s", "2020s"],
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "How many to return (1–120).",
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["decade"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Music from a decade"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:25c1cccc91441bcc79caa224d84f1abd1893b4ff3ccc44b9662a70a78e079931"
        },
        {
          "name": "browse_genre",
          "title": "Music in a genre",
          "description": "Songs and artists in a genre: modern_hits (pop), kef (party and wedding music, rabiz), traditional (folk, ashughakan, duduk, sacred), urban (rap, rock, electronic) or chill. Narrow it with a style category.",
          "inputSchema": {
            "properties": {
              "category": {
                "enum": ["pop", "rabiz", "folk", "rap", "rock", "jazz", "classical", "sacred", "electronic", "children", "other"],
                "type": "string"
              },
              "genre": {
                "enum": ["modern_hits", "kef", "traditional", "urban", "chill"],
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "How many to return (1–100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["genre"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Music in a genre"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e7dc792bb0e3c1693fb3fa235f1b8b6d60bfa422ba322c78a19673e032450b98"
        },
        {
          "name": "browse_mood",
          "title": "Music for a mood",
          "description": "Songs for a mood or occasion. Moods: kef (Kef Night), wedding (Wedding Hall), dance_floor (Everybody Up), old_kef (Old-School Kef), kef_now (Kef Now), table_toast (Table & Toast), radio_party (Radio Party), rabiz_floor (Rabiz Floor), night_out (After Midnight), romance (Slow Dance), heartache (Played Alone), nostalgia (The Old Tapes), patriotic (For the Homeland), calm (Quiet Hours), kids (Kids & Family), christmas (Christmas & New Year).",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 25,
                "description": "How many to return (1–120).",
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              },
              "mood": {
                "enum": ["kef", "wedding", "dance_floor", "old_kef", "kef_now", "table_toast", "radio_party", "rabiz_floor", "night_out", "romance", "heartache", "nostalgia", "patriotic", "calm", "kids", "christmas"],
                "type": "string"
              },
              "sort": {
                "enum": ["popular", "calmest", "loudest"],
                "type": "string"
              }
            },
            "required": ["mood"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Music for a mood"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:49f0d251debfb50d870edac13b38bf8eaba3686e3e76603fc9307dd7813c61ce"
        },
        {
          "name": "get_album",
          "title": "Get an album",
          "description": "An album, single or EP with its full tracklist and other releases by the same artist.",
          "inputSchema": {
            "properties": {
              "album_id": {
                "description": "The album's catalog id.",
                "pattern": "^[A-Za-z0-9]{22}$",
                "type": "string"
              }
            },
            "required": ["album_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an album"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5da3a4847bae58eb9c84151857aadecf79bcb235297c9e270c5ed29e97c5bbd7"
        },
        {
          "name": "get_artist",
          "title": "Get an artist",
          "description": "An Armenian artist's profile, best-known songs, discography (albums, singles, compilations, appearances) and related artists. Accepts a catalog id from search_catalog, or a lowercase hyphenated name such as 'sirusho' or 'aram-asatryan'.",
          "inputSchema": {
            "properties": {
              "artist": {
                "description": "Catalog id or lowercase hyphenated name.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "track_limit": {
                "default": 20,
                "description": "How many to return (1–80).",
                "maximum": 80,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["artist"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an artist"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a0dfa003c4b39d04f6ba633ba6663643d9ac20b3ea19ff0b06c8826ed390a92a"
        },
        {
          "name": "get_chart",
          "title": "Charts and new releases",
          "description": "The most played Armenian songs of all time (top_tracks), the most played released in a given year (best_of_year), the newest albums, singles and EPs (new_releases), or uploads since the catalog was last crawled (fresh_releases).",
          "inputSchema": {
            "properties": {
              "chart": {
                "enum": ["top_tracks", "new_releases", "best_of_year", "fresh_releases"],
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "How many to return (1–100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "year": {
                "description": "For best_of_year. Defaults to the latest year in the catalog.",
                "type": "integer"
              }
            },
            "required": ["chart"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Charts and new releases"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1348687a2113d6bce2f0a22e727f8d8e1d6fc79ca2cccb06d754561b28372d13"
        },
        {
          "name": "get_track",
          "title": "Get a song",
          "description": "One song: who performs it, the release it is on, its year and length, and more songs by the same artist.",
          "inputSchema": {
            "properties": {
              "track_id": {
                "description": "The track's catalog id.",
                "pattern": "^[A-Za-z0-9]{22}$",
                "type": "string"
              }
            },
            "required": ["track_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a song"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:507292e1e3700f502f50d97782f71f74b8457017cbaabecabef0d8bce6c18d60"
        },
        {
          "name": "list_artists",
          "title": "List Armenian artists",
          "description": "Browse the artist directory, optionally by genre or by style category, sorted by popularity, name or number of songs. Use it to recommend artists in a style.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "A finer style than genre, e.g. rabiz, folk, jazz.",
                "enum": ["pop", "rabiz", "folk", "rap", "rock", "jazz", "classical", "sacred", "electronic", "children", "other"],
                "type": "string"
              },
              "genre": {
                "enum": ["modern_hits", "kef", "traditional", "urban", "chill"],
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "How many to return (1–100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "default": "popular",
                "enum": ["popular", "name", "songs"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Armenian artists"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d3c5468b5a23e9ef0d23f0b767979da0daec37ff815e4344c1bc3d227532bb42"
        },
        {
          "name": "search_catalog",
          "title": "Search Armenian music",
          "description": "Search the Armenly catalog of Armenian music for artists, albums and songs by name. Romanised names work best (e.g. 'Sirusho', 'Aram Asatryan', 'Sari Aghjik'); Armenian script is also matched. Returns ids for the other tools and a playable armenly.com link for each result.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "description": "How many to return (1–50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Artist, album or song name.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Armenian music"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:07f32375a2a0cad7470e52322b76f3e952acb0777b72086a2f7035c6d5baaa84"
        },
        {
          "name": "similar_tracks",
          "title": "Songs like this one",
          "description": "Songs to play after a given song: the same artist, related artists and the same genre, shuffled into a station.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "description": "How many to return (1–50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "track_id": {
                "description": "The seed track's catalog id.",
                "pattern": "^[A-Za-z0-9]{22}$",
                "type": "string"
              }
            },
            "required": ["track_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
