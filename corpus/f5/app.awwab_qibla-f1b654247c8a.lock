      },
      "instructions": "Awwab Qibla finds the Qibla: the direction of the Kaaba in Makkah for Muslim prayer, as the great-circle bearing from true north, plus the distance, for any city of 15,000+ people or any coordinates. Results include an attribution line and live_compass_url, a page with a phone compass that turns to the Qibla. Places are used only to answer the request and aren't logged or stored. A place can be a city name, with the country if it is ambiguous, or coordinates. The start_quiz and check_answer tools run the Awwab Knowledge quiz on Islam: start_quiz returns one round of five questions without their answers, and check_answer grades one answer and returns its explanation and sources.",
      "tools": [
        {
          "name": "check_answer",
          "title": "Check a quiz answer",
          "description": "Grades one answer from a start_quiz round. Returns whether it is correct, the correct answer, the explanation, its sources and the running score; after the last question it also returns the final score. Each question can be graded once.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answer": {
                "description": "multiple_choice and fill_blank: the index of the option, from 0. true_false: true or false. match_pairs: an array with, for each item of lefts in order, the index of its match in rights.",
                "items": {
                  "minimum": 0,
                  "type": "integer"
                },
                "type": ["integer", "boolean", "array"]
              },
              "language": {
                "description": "Language of the questions, options and explanations. Default en.",
                "enum": ["en", "ar", "id", "tr", "ur", "fr", "ms", "ru", "zh", "es", "pt", "uz", "az", "ha"],
                "type": "string"
              },
              "question_id": {
                "description": "The id of the question in the round.",
                "maxLength": 120,
                "type": "string"
              },
              "quiz_id": {
                "description": "The quiz_id from start_quiz.",
                "maxLength": 48,
                "type": "string"
              }
            },
            "required": ["answer", "question_id", "quiz_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "answered": {
                "type": "integer"
              },
              "attribution": {
                "type": "string"
              },
              "correct": {
                "type": "boolean"
              },
              "correct_match": {
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "correct_option": {
                "type": "integer"
              },
              "correct_value": {
                "type": "boolean"
              },
              "explanation": {
                "type": "string"
              },
              "final": {
                "properties": {
                  "accuracy": {
                    "type": ["integer", "null"]
                  },
                  "correct": {
                    "type": ["integer", "null"]
                  },
                  "score": {
                    "type": "integer"
                  },
                  "total": {
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "finished": {
                "type": "boolean"
              },
              "match_results": {
                "items": {
                  "type": "boolean"
                },
                "type": "array"
              },
              "play_url": {
                "type": "string"
              },
              "score": {
                "type": "integer"
              },
              "source_url": {
                "type": ["string", "null"]
              },
              "sources": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "streak": {
                "type": "integer"
              },
              "total": {
                "type": "integer"
              }
            },
            "required": ["attribution", "play_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Check a quiz answer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "icons": [
            {
              "src": "https://awwab.app/icon-180.png",
              "mimeType": "image/png",
              "sizes": ["180x180"]
            }
          ],
          "meta": {
            "openai/toolInvocation/invoked": "Answer checked",
            "openai/toolInvocation/invoking": "Checking the answer…",
            "openai/widgetAccessible": true,
            "ui": {
              "visibility": ["model", "app"]
            }
          },
          "digest": "sha256:15a23a9ffecfc81761c494092f8351687d1d8de440d86b1534c804192c515730"
        },
        {
          "name": "find_qibla",
          "title": "Find the Qibla direction",
          "description": "Get the Qibla direction (the direction Muslims face in prayer, toward the Kaaba in Makkah) for a place: the bearing in degrees clockwise from true north, the compass direction, the magnetic bearing and declination, and the distance to the Kaaba. Use this for any question about the Qibla, the prayer direction, or the direction of Makkah (Mecca) or the Kaaba, including a request to show a Qibla compass. The result includes an attribution line and live_compass_url, a page with a phone compass that points at the Kaaba. The place is used only to answer the request. It isn't logged or stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "The language the user is writing in. Sets the language of the card and of the linked live compass page.",
                "enum": ["en", "ar", "id", "tr", "ur", "fr", "ms", "ru", "zh", "es", "pt", "uz", "az", "ha"],
                "type": "string"
              },
              "place": {
                "description": "The place to find the Qibla from: a city (any city of 15,000+ people, in many languages), with the country if it is ambiguous, e.g. \"Karachi\", \"Hyderabad, India\", \"القاهرة\", or coordinates, e.g. \"40.71, -74.00\".",
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attribution": {
                "type": "string"
              },
              "bearing_magnetic": {
                "description": "Degrees clockwise from magnetic north (for a needle compass), today",
                "type": ["number", "null"]
              },
              "bearing_true": {
                "description": "Degrees clockwise from true north",
                "type": ["number", "null"]
              },
              "cardinal": {
                "type": ["string", "null"]
              },
              "cardinal_name": {
                "type": ["string", "null"]
              },
              "distance_km": {
                "type": "number"
              },
              "distance_mi": {
                "type": "number"
              },
              "language": {
                "description": "The language the card is shown in, when known",
                "type": "string"
              },
              "latitude": {
                "type": "number"
              },
              "live_compass_url": {
                "type": "string"
              },
              "longitude": {
                "type": "number"
              },
              "magnetic_declination": {
                "description": "Degrees, east positive (WMM2025)",
                "type": "number"
              },
              "place_name": {
                "type": "string"
              },
              "sentence": {
                "type": "string"
              }
            },
            "required": ["attribution", "bearing_true", "distance_km", "latitude", "live_compass_url", "longitude"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find the Qibla direction"
