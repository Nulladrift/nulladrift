        {
          "name": "start_quiz",
          "title": "Start an Awwab quiz",
          "description": "Starts one round of the Awwab Knowledge quiz on Islam: five questions in the chosen language, on an optional topic such as the prophets, the Qur'an, the Prophet's life, worship or Islamic history. Use this for a request for an Islamic quiz, test or trivia. Returns the questions and their options without the correct answers, and a quiz_id for check_answer. Question types: multiple_choice, true_false, fill_blank and match_pairs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the questions, options and explanations. Default en.",
                "enum": ["en", "ar", "id", "tr", "ur", "fr", "ms", "ru", "zh", "es", "pt", "uz", "az", "ha"],
                "type": "string"
              },
              "topic": {
                "description": "Optional topic, e.g. \"the prophets\", \"Ramadan\", \"Yusuf\". Without one the round is mixed.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attribution": {
                "type": "string"
              },
              "available_topics": {
                "description": "Present when a topic was asked for and none matched",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "language": {
                "type": "string"
              },
              "play_url": {
                "type": "string"
              },
              "questions": {
                "description": "id, number, type, difficulty, prompt, and template, options or lefts and rights by type. No answers.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "quiz_id": {
                "type": "string"
              },
              "topic": {
                "description": "The matched topic's name, or null for a mixed round",
                "type": ["string", "null"]
              },
              "topic_matched": {
                "type": "boolean"
              },
              "total": {
                "type": "integer"
              }
            },
            "required": ["attribution", "language", "play_url", "questions", "quiz_id", "total"],
            "type": "object"
          },
