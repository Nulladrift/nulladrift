  "subjects": {
    "com.jirventures/sales-agent": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://aiagent.jirventures.com/mcp/sales-agent"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Sales_Agent_MCP",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "prepare_campaign",
          "description": "Prepare a B2B cold-outreach campaign. Finds up to 5 decision makers who match the target role, keywords and location (LinkedIn and Apollo), keeps only people whose work email Apollo has verified, and writes one outreach email template for them in English or Arabic that states only what the offer says. Returns the leads (name, title, organization, work email, LinkedIn URL) and the email (subject, preheader, greeting, intro, highlights, closing, cta_label) with {{first_name}} style placeholders. Takes about 30 to 90 seconds. Public service by JIR Ventures with a daily limit.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": true,
            "properties": {
              "booking_link": {
                "description": "Meeting booking link for the call to action, or empty",
                "type": "string"
              },
              "company_name": {
                "description": "Name of the company that sends the outreach",
                "type": "string"
              },
              "email_language": {
                "description": "en for English or ar for Arabic",
                "type": "string"
              },
              "ideal_customer": {
                "description": "Description of the ideal customer, used for tone, or empty",
                "type": "string"
              },
              "keywords": {
                "description": "Industry or topic keywords that narrow the search, comma separated, for example fintech, SaaS. Can be empty",
                "type": "string"
              },
              "location": {
                "description": "City or country of the people to reach, for example Dubai or Saudi Arabia. Use worldwide for no filter",
                "type": "string"
              },
              "max_leads": {
                "description": "How many leads to return, 1 to 5",
                "type": "number"
              },
              "offer": {
                "description": "What the company sells or offers, in a few sentences. The email states only what is written here",
                "type": "string"
              },
              "requested_by": {
                "description": "Name of the AI assistant or app making this request, if known",
                "type": "string"
              },
              "target_role": {
                "description": "Job titles to reach, comma separated, for example Head of Sales, Sales Director",
                "type": "string"
              }
            },
            "required": ["booking_link", "company_name", "email_language", "ideal_customer", "keywords", "location", "max_leads", "offer", "requested_by", "target_role"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a9d4cb4c08208d42ef93afb73473850798752cdd98f19e9d25e3f197bc733ebc"
        }
      ],
      "digest": "sha256:ff757e75b2c2b79244548f174d875ed479d23e7f410792983e4e649a6b87b740"
    }
  }
