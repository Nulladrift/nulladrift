          "title": "Enlace para escribir a todas las inmobiliarias de una provincia o de España",
          "description": "Cuántas inmobiliarias recibirían un mismo mensaje enviado a todas las de una provincia o de toda España, y el enlace\na la página de InmoRadar donde se prepara ese envío. No envía nada: el mensaje se escribe y se envía en la web.\nPara escribir a una sola inmobiliaria se usa el formulario de su ficha (ver_inmobiliaria).",
