{
  "lockfileVersion": 2,
  "subjects": {
    "ai.name/nameai-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.name.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "nameai-mcp",
        "version": "1.0.0"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Name.ai domain tools: check domain availability (search_domain), look up WHOIS records (whois_lookup), and get TLD registration pricing (tld_registration_price) and registry requirements (tld_requirements). All tools are read-only and work without authentication. Marketplace prices on search_domain are masked for anonymous callers - pass an OAuth Bearer token (see https://name.ai/auth.md) to see them. whois_lookup is rate limited to 10/day per caller IP; cache TLD pricing/requirements, they change rarely.",
      "tools": [
        {
          "name": "search_domain",
          "description": "Check whether a domain is available and, for the same label, whether its\n    common alternate TLDs are too (e.g. querying \"acme.com\" also returns\n    \"acme.ai\", \"acme.io\", ...).\n\n    Backed by POST /api/domain/search — public, no auth required.\n\n    Buy-now (aftermarket/marketplace) prices are hidden unless you're\n    authenticated (see AUTH.md at name.ai for how to get a token) — an\n    unauthenticated call only sees new-registration pricing for a domain\n    that's simply unregistered. Pass a valid OAuth access token as this\n    call's Authorization header and it's forwarded automatically.\n\n    Args:\n        domain: A domain name to check, e.g. \"example.ai\".\n        include_alternates: When true (default), also return sibling TLDs for\n            the same label. When false, only the exact domain is returned.\n    ",
          "inputSchema": {
            "properties": {
              "domain": {
                "title": "Domain",
                "type": "string"
              },
              "include_alternates": {
                "default": true,
                "title": "Include Alternates",
                "type": "boolean"
              }
            },
            "required": ["domain"],
            "title": "search_domainArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://nameai/search-results.html"
            }
          },
          "digest": "sha256:ca53b3dc830b598b012925bed2aa0551c6db35967901755e7d1a4186ec856370"
        },
        {
          "name": "tld_registration_price",
          "description": "Get the current USD price for a domain-lifecycle operation on a TLD\n    (new registration, transfer-in, renewal, or restore from redemption).\n\n    Backed by GET /api/pricing/tld — public, no auth required. This is\n    name.ai's own registration pricing, not an aftermarket/marketplace price,\n    so it is never gated by sign-in status.\n\n    Args:\n        tld: The TLD without a leading dot, e.g. \"ai\" or \"com\".\n        operation: One of \"register\", \"transfer\", \"renew\", \"restore\".\n    ",
          "inputSchema": {
            "properties": {
              "operation": {
                "default": "register",
                "enum": ["register", "transfer", "renew", "restore"],
                "title": "Operation",
                "type": "string"
              },
              "tld": {
                "title": "Tld",
                "type": "string"
              }
            },
            "required": ["tld"],
            "title": "tld_registration_priceArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3f6c94e5fc82def389060ed942a28c99c59d0a1c1bfe2ffba9cb9be6acbbb399"
        },
        {
          "name": "tld_requirements",
          "description": "Get registration requirements for a TLD: allowed registration period\n    range, whether an organization is required, allowed registrant\n    countries, nameserver rules, and similar registry policy.\n\n    Backed by GET /api/tlds/{tld}/metadata — public, no auth required.\n\n    Args:\n        tld: The TLD without a leading dot, e.g. \"ai\" or \"io\".\n    ",
          "inputSchema": {
            "properties": {
              "tld": {
                "title": "Tld",
                "type": "string"
              }
            },
            "required": ["tld"],
            "title": "tld_requirementsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6bbf9a0a7ed67e0aa910fd2c7e9a6cd1f22a96c2097eaef6c136a00b1ae87783"
        },
        {
          "name": "whois_lookup",
          "description": "Look up WHOIS/RDAP registration details for a domain: registrar,\n    registrant, creation/expiration dates, nameservers.\n\n    Backed by POST /api/tools/whois — public, no auth required, but rate\n    limited by name.ai to 10 lookups per day per caller IP. Since every MCP\n    call shares this server's egress IP, that quota is pooled across all of\n    this MCP server's callers, not per end user.\n\n    Args:\n        domain: A domain name to look up, e.g. \"example.com\".\n    ",
          "inputSchema": {
            "properties": {
              "domain": {
                "title": "Domain",
                "type": "string"
              }
            },
            "required": ["domain"],
            "title": "whois_lookupArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8adcea5ec366c58d2f4c8bff1b741745e8557414969d9021a7e8b2410448bccc"
        }
      ],
      "resources": [
        {
          "uri": "nameai://docs/auth",
          "name": "auth",
          "title": "Authenticating to Name.ai",
          "description": "OAuth 2.1 + PKCE flow for unlocking real marketplace prices on search_domain.",
          "mimeType": "text/markdown",
          "digest": "sha256:2d79c429eb16aad1e52caaac007349ceefc6653f55a74ede5084bb152f420b1f"
        },
        {
          "uri": "nameai://docs/overview",
          "name": "overview",
          "title": "Name.ai MCP server overview",
          "description": "What this server does, its tools, and how to get more out of it.",
          "mimeType": "text/markdown",
          "digest": "sha256:73a2ec208e779e7258f496d06da55e6016b643176ab9c8f0ba3583d79b66d499"
        },
        {
          "uri": "ui://nameai/search-results.html",
          "name": "search-results",
          "title": "Domain availability results",
          "description": "Renders search_domain results as availability cards with pricing.",
          "mimeType": "text/html;profile=mcp-app",
          "meta": {
            "ui": {
              "csp": {
                "connectDomains": ["https://mcp.name.ai", "https://nameai-mcp.h.namekart.com", "https://name.ai"],
                "frameDomains": [],
                "resourceDomains": ["https://name.ai"]
              },
              "prefersBorder": true
            }
          },
          "digest": "sha256:1ee842e635739ce5bba4c26f8f6f51091257542944b086a274d2ec6ace609a2e"
        }
      ],
      "digest": "sha256:2ba7709596f1c12c83cae4d7c7ae074fb0b9f4bdb8c32a21952b3eb91b254bd9"
    }
  }
}
