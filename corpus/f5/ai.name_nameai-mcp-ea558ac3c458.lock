{
  "lockfileVersion": 2,
  "subjects": {
    "ai.name/nameai-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.name.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "nameai-mcp",
        "version": "1.0.0"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Name.ai domain tools: find premium domains for sale with prices (search_premium_domains), check domain availability (search_domain), look up WHOIS records (whois_lookup), and get TLD registration pricing (tld_registration_price) and registry requirements (tld_requirements). All tools are read-only and work without authentication. search_premium_domains returns buy-now prices without sign-in; for the price of one for-sale name, call it with that name as keyword and tld=\"\". Marketplace prices on search_domain are masked for anonymous callers - pass an OAuth Bearer token (see https://name.ai/auth.md) to see them there. whois_lookup is rate limited to 10/day per caller IP; cache TLD pricing/requirements, they change rarely.",
      "tools": [
        {
          "name": "search_domain",
          "title": "Check domain availability",
          "description": "Check whether a domain is available and, for the same label, whether its\n    common alternate TLDs are too (e.g. querying \"acme.com\" also returns\n    \"acme.ai\", \"acme.io\", ...).\n\n    Backed by POST /api/domain/search — public, no auth required.\n\n    Buy-now (aftermarket/marketplace) prices are hidden unless you're\n    authenticated (see AUTH.md at name.ai for how to get a token) — an\n    unauthenticated call only sees new-registration pricing for a domain\n    that's simply unregistered. To get the buy-now price of a name that is\n    for sale without signing in, use search_premium_domains with that name as\n    keyword and tld=\"\". Pass a valid OAuth access token as this\n    call's Authorization header and it's forwarded automatically.\n\n    Args:\n        domain: A domain name to check, e.g. \"example.ai\".\n        include_alternates: When true (default), also return sibling TLDs for\n            the same label. When false, only the exact domain is returned.\n    ",
          "inputSchema": {
            "properties": {
              "domain": {
                "title": "Domain",
                "type": "string"
              },
              "include_alternates": {
                "default": true,
                "title": "Include Alternates",
                "type": "boolean"
              }
            },
            "required": ["domain"],
            "title": "search_domainArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://nameai/search-results.html"
            }
          },
          "digest": "sha256:4b1148153ff2d04ff39d8a61c8f74166f407021ca49b70a0f440a01d12726fb1"
        },
        {
          "name": "search_premium_domains",
          "title": "Search premium domains for sale",
          "description": "Search premium domain names for sale on name.ai (domain marketplace):\n    find a domain to buy for a startup, product or brand, with buy-now prices\n    (USD) and a link to each listing, where the purchase happens.\n\n    Use when the user wants a name for a startup, product or brand, or wants\n    to browse domains to buy, optionally within a budget.\n\n    `keyword` matches text inside the domain name, so pass ONE short word\n    (\"legal\", \"pay\", \"health\"), not a sentence. For a business idea, call\n    this several times with different related words, or leave keyword empty\n    to browse the newest premium names. To check whether one specific domain\n    is free to register, use search_domain instead.\n\n    Backed by GET /api/market/listings (public). Read-only: nothing is bought.\n\n    Args:\n        keyword: One short word the domain name should contain. Empty = browse.\n        tld: TLD without the dot, e.g. \"ai\" (default) or \"com\". Empty = any.\n        min_price: Lowest buy-now price in USD.\n        max_price: Highest buy-now price in USD.\n        sort: \"newest\" (default), \"price_asc\" or \"price_desc\".\n        limit: Number of results, 1 to 25 (default 10).\n    ",
          "inputSchema": {
            "properties": {
              "keyword": {
                "default": "",
                "title": "Keyword",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "max_price": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Max Price"
              },
              "min_price": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Min Price"
              },
              "sort": {
                "default": "newest",
                "enum": ["newest", "price_asc", "price_desc"],
                "title": "Sort",
                "type": "string"
              },
              "tld": {
                "default": "ai",
                "title": "Tld",
                "type": "string"
              }
            },
            "title": "search_premium_domainsArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "MarketListing": {
                "properties": {
                  "domain": {
                    "title": "Domain",
                    "type": "string"
                  },
                  "price_usd": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "title": "Price Usd"
                  },
                  "url": {
                    "title": "Url",
                    "type": "string"
                  }
                },
                "required": ["domain", "price_usd", "url"],
                "title": "MarketListing",
                "type": "object"
              }
            },
            "properties": {
              "browse_url": {
                "title": "Browse Url",
                "type": "string"
              },
              "has_more": {
                "title": "Has More",
                "type": "boolean"
              },
              "query": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "type": "string"
                    },
                    {
                      "type": "integer"
                    }
                  ]
                },
                "title": "Query",
                "type": "object"
              },
              "results": {
                "items": {
                  "$ref": "#/$defs/MarketListing"
                },
                "title": "Results",
                "type": "array"
              },
              "total": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "title": "Total"
              }
            },
            "required": ["browse_url", "has_more", "query", "results", "total"],
            "title": "MarketResults",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://nameai/market-results.html"
            }
          },
          "digest": "sha256:9faa742ddcc5b2876783f01461f67b2cc54ebbdb02b74803481113a30cdfd469"
        },
        {
          "name": "tld_registration_price",
          "title": "TLD registration price",
          "description": "Get the current USD price for a domain-lifecycle operation on a TLD\n    (new registration, transfer-in, renewal, or restore from redemption).\n\n    Backed by GET /api/pricing/tld — public, no auth required. This is\n    name.ai's own registration pricing, not an aftermarket/marketplace price,\n    so it is never gated by sign-in status.\n\n    Args:\n        tld: The TLD without a leading dot, e.g. \"ai\" or \"com\".\n        operation: One of \"register\", \"transfer\", \"renew\", \"restore\".\n    ",
          "inputSchema": {
            "properties": {
              "operation": {
                "default": "register",
                "enum": ["register", "transfer", "renew", "restore"],
                "title": "Operation",
                "type": "string"
              },
              "tld": {
                "title": "Tld",
                "type": "string"
              }
            },
            "required": ["tld"],
            "title": "tld_registration_priceArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:258f8975f8ae2a744c90412c54445c87eacbedaca70bb32dc9890e0cb7f90b7e"
        },
        {
          "name": "tld_requirements",
          "title": "TLD registration requirements",
          "description": "Get registration requirements for a TLD: allowed registration period\n    range, whether an organization is required, allowed registrant\n    countries, nameserver rules, and similar registry policy.\n\n    Backed by GET /api/tlds/{tld}/metadata — public, no auth required.\n\n    Args:\n        tld: The TLD without a leading dot, e.g. \"ai\" or \"io\".\n    ",
          "inputSchema": {
            "properties": {
              "tld": {
                "title": "Tld",
                "type": "string"
              }
            },
            "required": ["tld"],
            "title": "tld_requirementsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:68e86407f36fddee06ffcadba573ca34840e9add62f136b98b2e3fa62a4afbe6"
        },
        {
          "name": "whois_lookup",
          "title": "WHOIS lookup",
          "description": "Look up WHOIS/RDAP registration details for a domain: registrar,\n    registrant, creation/expiration dates, nameservers.\n\n    Backed by POST /api/tools/whois — public, no auth required, but rate\n    limited by name.ai to 10 lookups per day per caller IP. Since every MCP\n    call shares this server's egress IP, that quota is pooled across all of\n    this MCP server's callers, not per end user.\n\n    Args:\n        domain: A domain name to look up, e.g. \"example.com\".\n    ",
          "inputSchema": {
            "properties": {
              "domain": {
                "title": "Domain",
                "type": "string"
              }
            },
            "required": ["domain"],
            "title": "whois_lookupArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:39ba04b9620700079209b46126bc438df227161b7d8a52c95e7b79c66f351ee2"
        }
      ],
