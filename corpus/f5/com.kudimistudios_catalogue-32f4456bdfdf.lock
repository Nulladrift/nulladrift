          "name": "recommend",
          "title": "Recommend for a child",
          "description": "The best Kudimi pieces for a child's age and an optional topic (counting, bedtime, letters, tracing, mazes, colouring, first words, songs, calm, riddles). Mixes a video, a free printable and a book where they exist.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age": {
                "description": "The child's age in years (0 to 12).",
                "maximum": 12,
                "minimum": 0,
                "type": "integer"
              },
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "topic": {
                "description": "What the child is into or learning.",
                "type": "string"
              },
              "type": {
