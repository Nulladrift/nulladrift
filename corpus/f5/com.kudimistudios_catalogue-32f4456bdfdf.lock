        {
          "name": "submit_partner_enquiry",
          "title": "Send a partner or licensing enquiry",
          "description": "Send Kudimi Studios a partnership, licensing, wholesale, school or library, press or integration enquiry from an adult or a business. Only on the user's request and with their details. A person replies by email. No payments.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirm_adult": {
                "description": "The sender confirms they are an adult acting for themselves or a business.",
                "type": "boolean"
              },
              "contact_name": {
                "type": "string"
              },
              "country": {
                "type": "string"
              },
              "email": {
                "format": "email",
                "type": "string"
              },
              "enquiry_type": {
                "enum": ["partnership", "licensing", "wholesale", "school_or_library", "press", "integration", "other"],
                "type": "string"
              },
              "message": {
                "type": "string"
              },
