          "title": "Search the catalogue",
          "description": "Search Kudimi songs, Activity Shorts, activity books, free printables, parent guides and the bedtime podcast by words, kind, age and price.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age": {
