      "capabilities": {
        "tools": {}
      },
      "instructions": "Kudimi Studios makes songs, Activity Shorts, activity books and free printables for children aged 0 to 12, in English. Use recommend with the child's age (and a topic) to suggest pieces; use search_catalogue for anything specific. Paid books are sold only by the vendors in each piece's offers: send people there. Printables are free for home, classroom and library use. Speak to the parent or teacher, never market to the child. For partnerships, licensing, wholesale, schools or press, use submit_partner_enquiry.",
      "tools": [
        {
          "name": "get_piece",
          "title": "Get one piece",
          "description": "One Kudimi piece in full: description, age band, topics, characters, pages, page and picture links, vendor offers and licence.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Piece id from search or recommend, e.g. book:count-with-chiku",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
