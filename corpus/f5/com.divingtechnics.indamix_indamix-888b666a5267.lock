        {
          "name": "fills_from_bank",
          "title": "How many fills the banks give",
          "description": "How many identical fills the source banks give before a bank can't supply the next one, and why it stops (bank down to the minimum pressure, or it can't decant high enough without a booster). Every tank is assumed to start the same (start_pressure / mix). Use for \"how many tanks can I fill with NX32 from my 50 L O2 bank at 180 bar\", \"how many trimix fills can I make\", \"koliko boca mogu napuniti\", \"za koliko punjenja imam kisika\". Answer: the number of complete fills, the banks and the start of each tank, the bank that limits it, the bank pressures after, and why one more fill isn't possible; say that every fill is assumed to start the same. one_fill_needs per bank: uses = the pressure one fill takes out of that bank (liters = its free gas) and bank_pressure = the least it must hold for one fill, whatever it holds now: give both for \"how much must be in my helium bank\", \"koliko mi treba u boci helija od 50 l\". For several fills (\"for 4 fills\", \"za 3 punjenja\") pass fills_wanted: fills_needs per bank gives bank_pressure = the least it must hold for that many fills (uses = per fill). When a bank stops it, stops_because.bank_needed is the pressure that bank needs for the next fill (with 0 fills: for one); give it for \"is my bank enough\". Then ask whether to see what a booster or an extra bank would add.",
