                        "minimum": 0,
                        "type": "number"
                      },
                      "volume_l": {
                        "description": "Water volume, litres (a \"50 L\" bank = 50; several linked cylinders = their sum).",
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "top_up": {
                    "additionalProperties": false,
                    "description": "The bank the Top Up supply gas comes from.",
                    "properties": {
                      "pressure": {
                        "description": "Current pressure, in pressure_unit.",
                        "minimum": 0,
