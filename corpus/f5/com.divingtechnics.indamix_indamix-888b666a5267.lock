                      }
                    },
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "depth_unit": {
                "default": "m",
                "description": "Unit of every depth in the question and the answer.",
                "enum": ["m", "ft"],
                "type": "string"
              },
              "dive_mode": {
                "default": "OC",
                "description": "Open circuit (OC) or closed-circuit rebreather (CCR). Sets which defaults apply (from the In Da Mix settings: ppO2, END, density, O2 narcotic). The values used are listed in `assumed`.",
                "enum": ["OC", "CCR"],
