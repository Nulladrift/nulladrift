        {
          "name": "blend",
          "title": "Blend a mix (fill steps)",
          "description": "Use whenever the user asks how to blend, mix, fill or prepare a breathing gas, even if they don't mention In Da Mix. Step-by-step fill plan for blending nitrox, trimix, heliair or heliox into a scuba tank, from what is in it now to the mix and pressure wanted: how much helium and oxygen to add, the order, cooling waits, the O2 test, the air top-up, and booster bars. Partial pressure or continuous, with the app's calculation methods. Use for \"how do I blend 18/45 to 220 bar\", \"how much O2 do I add for EAN32\", \"fill from the gas left in the tank\", \"kako napraviti trimix 12/65\", \"koliko helija trebam za 200 bara\", \"napravi plan punjenja boce\". Needs the target mix and pressure, and what is in the tank now: if the start is unknown, ask; never assume an empty tank. The method, temperature and banks come from the settings. Answer: the start gas, the target, the additions in order with their pressures, the resulting mix, and the key filling and analysis precautions. Then ask whether to calculate the gas this fill takes from the source banks (gas_usage).",
