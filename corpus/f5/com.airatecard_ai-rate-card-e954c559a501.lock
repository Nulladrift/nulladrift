{
  "lockfileVersion": 2,
  "subjects": {
    "com.airatecard/ai-rate-card": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://airatecard.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ai-rate-card",
        "title": "AI Rate Card",
        "version": "1"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AI Rate Card (airatecard.com) is an independent catalog of AI model offers and prices, collected daily from sellers' own pricing pages and APIs. Use search_offers, get_model_prices, cheapest_offers, compare_models and get_card to answer price questions; for \"what is cheapest/dearest/typical for a job\" (not a model type) use cheapest_models_by_task, most_expensive_models_by_task and median_price_by_task with a task (text, vision, image, video, stt, tts, embedding, rerank, moderation) - current prices only, no history tool. Every result carries a card_url and a ready \"cite\" line (\"Source: AI Rate Card, <card URL>, prices checked <date>\"); quote that line and link the card_url of the offer you used, not this server. Prices are USD per 1M tokens unless price_unit says otherwise. An offer with a price_note (batch, flex, regional, free variant) is priced under special conditions - say so, or use get_model_prices' cheapest_standard for the ordinary price. A price_suspect price looks wrong and should not be quoted as fact. A review_reason on a row means the price is under review (it moved more than 10 percent in a day or differs from the provider's page): quote it with that caveat. For \"what is cheapest for my job\" use cheapest_for_workload: pass a preset (chatbot, coding_agent, rag, summarization, long_context, vision, embedding_index, trial - see list_workload_presets) or your own input_tokens / output_tokens a month, plus min_context; it returns the monthly cost per offer, best offer of each model, no free promos or batch/flex prices unless asked. The prompts (prompts/list) are ready-made questions for a user.",
      "tools": [
        {
          "name": "agent_cost",
          "description": "What a coding / tool-using agent costs a month on each model: tasks a day, model calls per task, context tokens per call, answer and reasoning tokens per call, percent of the context read from the prompt cache - priced at the cheapest real-time seller of each model (default: 13 usual coding models), cheapest first, USD, 30 days, with each model's reasoning class. Rows have card_url and cite.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cache_pct": {
                "description": "percent of context from the prompt cache, default 70",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "context": {
                "description": "input tokens per call (the resent context), default 30000",
                "minimum": 0,
                "type": "number"
              },
              "models": {
                "description": "model ids to compare; default the usual coding models",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "output": {
                "description": "answer tokens per call, default 800",
                "minimum": 0,
                "type": "number"
              },
              "reasoning": {
                "description": "reasoning tokens per call (billed as output), default 1500",
                "minimum": 0,
                "type": "number"
              },
              "steps": {
                "description": "model calls per task, default 30",
                "minimum": 1,
                "type": "number"
              },
              "tasks": {
                "description": "tasks a day, default 10",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:34e9fc6f19bb8c8378121123501f3263728fe490a0a4aa46858d18ae810f43ef"
        },
        {
          "name": "budget_fit",
          "description": "What a monthly budget buys: for budget USD a month and a typical request (input and output tokens), how many requests a month and a day each model gives at its cheapest real-time seller (default: 13 usual models), most first, with each model's reasoning class. Rows have card_url and cite.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "budget": {
                "description": "USD a month, default 50",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "input_tokens": {
                "description": "per request, default 2000",
                "minimum": 0,
                "type": "number"
              },
              "models": {
                "description": "model ids; default the usual models",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "output_tokens": {
                "description": "per request, default 500",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["budget"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fca212fd99af47e5b8e80ecc7b92c3353244cb13c6c0cb1609b4d348aaf8b1f9"
        },
        {
          "name": "cache_batch_savings",
          "description": "What prompt caching and batch / flex save on one model: monthly input and output tokens priced at every listed seller plain, with the given share of input read from the cache (the seller's own cache-read price) and, if can_wait, the seller's batch / flex offers. USD, cheapest first; cache write fees are not counted. Each row has card_url and cite.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cache_pct": {
                "description": "percent of input tokens read from the prompt cache, default 50",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "can_wait": {
                "description": "include batch / flex offers (results later, not real-time)",
                "type": "boolean"
              },
              "input_tokens": {
                "description": "input tokens a month, default 100000000",
                "minimum": 0,
                "type": "integer"
              },
              "model": {
                "description": "model id, e.g. anthropic/claude-sonnet-5-5",
                "type": "string"
              },
              "output_tokens": {
                "description": "output tokens a month, default 10000000",
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:adf08a65eb2dfedba189444f2c0ae51b12421a106ee65cd2c2e282382c8ca598"
        },
        {
          "name": "cheapest_for_workload",
          "description": "The cheapest offers for a whole monthly workload, ranked by monthly cost in USD: give a preset (a typical job; see list_workload_presets) and/or your own tokens a month. Best offer of each model; free promos and batch/flex/priority/regional prices left out unless asked. Each row: monthly_cost_usd, prices, context, checked_at, card_url and a ready cite line.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "model type, llm by default",
                "enum": ["llm", "embedding", "rerank", "moderation", "decision", "ocr", "search", "image_generation", "image_editing", "video_generation", "text_to_speech", "speech_to_text", "speech_to_speech", "audio_generation", "3d_generation"],
                "type": "string"
              },
              "include_free": {
                "description": "also free / promo offers (default false)",
                "type": "boolean"
              },
              "include_special": {
                "description": "also batch, flex, priority, regional prices (default false)",
                "type": "boolean"
              },
              "input_modality": {
                "description": "the model must accept this input, e.g. image",
                "type": "string"
              },
              "input_tokens": {
                "description": "input tokens a month, e.g. 10000000",
                "minimum": 0,
                "type": "integer"
              },
              "limit": {
                "description": "rows, 10 by default",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "min_context": {
                "description": "context window needed, tokens, e.g. 128000",
                "minimum": 1,
                "type": "integer"
              },
              "one_per_model": {
                "description": "only the best offer of each model (default true)",
                "type": "boolean"
              },
              "output_tokens": {
                "description": "output tokens a month, e.g. 2000000",
                "minimum": 0,
                "type": "integer"
              },
              "preset": {
                "description": "chatbot | coding_agent | rag | summarization | long_context | vision | embedding_index | trial - fills tokens, min_context, category; your own values win",
                "enum": ["chatbot", "coding_agent", "rag", "summarization", "long_context", "vision", "embedding_index", "trial"],
                "type": "string"
              },
              "query": {
                "description": "only models or providers matching these words, e.g. claude",
                "type": "string"
              },
              "tools": {
                "description": "the model must support tool/function calling",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fa6f91a9857e2e1728a28bf45425df498f7689a0316858405d565e036d1e77b1"
        },
        {
          "name": "cheapest_models_by_task",
