        {
          "name": "save_words",
          "title": "Save words to Talkhao",
          "description": "Save HSK words to the signed-in learner's Talkhao sets, so they come up in practice. Give the words in Chinese characters, up to 20. Supports bracketed headwords (e.g. 花（名词）, 长（动词）) to disambiguate readings. Needs the learner's Talkhao account connected.",
          "inputSchema": {
            "properties": {
              "words": {
                "description": "The words to save, in Chinese characters, up to 20. Supports bracketed headwords (e.g. 花（名词）, 长（动词）) to disambiguate.",
                "items": {
                  "maxLength": 32,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "title": "Words",
                "type": "array"
              }
            },
            "required": ["words"],
            "title": "save_wordsArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "SavedWord": {
                "properties": {
                  "asked": {
                    "description": "The word as asked",
                    "title": "Asked",
                    "type": "string"
                  },
                  "level": {
                    "anyOf": [
                      {
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Its HSK level",
                    "title": "Level"
                  },
                  "pinyin": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Pinyin"
                  },
                  "practise_url": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "The practice of the set it is now in",
                    "title": "Practise Url"
