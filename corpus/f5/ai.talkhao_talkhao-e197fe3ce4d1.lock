      "serverInfo": {
        "name": "ai.talkhao/talkhao",
        "title": "Talkhao",
        "version": "1.0.0",
        "description": "Look up Chinese words with pinyin, meanings, HSK level, strokes and sound; see your HSK progress.",
        "websiteUrl": "https://talkhao.ai",
        "icons": [
          {
            "src": "https://talkhao.ai/logo512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://talkhao.ai/logo192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          }
        ]
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "hsk_words",
          "title": "Words in an HSK list",
          "description": "What is in an HSK list: an HSK level (1-6), an HSK 3.0 band (1-6 or 7-9) or a topic (numbers, food and drink, family, ...). Answers with the number of words, the first five with their pinyin and meaning, the list's Talkhao page and its practice link; when the learner's account is connected, each word's state on their trail. Give exactly one of level, band or topic.",
          "inputSchema": {
            "properties": {
              "band": {
                "anyOf": [
                  {
                    "maxLength": 20,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "An HSK 3.0 band: 1-6 or 7-9",
                "title": "Band"
              },
              "level": {
                "anyOf": [
                  {
                    "maximum": 6,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "An HSK level, 1-6 (HSK 2.0)",
                "title": "Level"
              },
              "topic": {
                "anyOf": [
                  {
                    "maxLength": 60,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A topic, in English: numbers, food and drink, family, animals, ...",
                "title": "Topic"
              }
            },
            "title": "hsk_wordsArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "ListWord": {
                "properties": {
                  "level": {
                    "description": "HSK 2.0 level, 1-6",
                    "title": "Level",
                    "type": "integer"
                  },
                  "meaning": {
                    "description": "In the learner's language when there is a translation, else English",
                    "title": "Meaning",
                    "type": "string"
                  },
                  "meaning_lang": {
                    "title": "Meaning Lang",
                    "type": "string"
                  },
                  "page_url": {
                    "title": "Page Url",
                    "type": "string"
                  },
                  "pinyin": {
                    "title": "Pinyin",
                    "type": "string"
                  },
                  "trail": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Trail"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "The signed-in learner's state for the word; only with a token"
                  },
                  "word": {
                    "title": "Word",
                    "type": "string"
                  }
                },
                "required": ["level", "meaning", "meaning_lang", "page_url", "pinyin", "word"],
                "title": "ListWord",
                "type": "object"
              },
              "Trail": {
                "properties": {
                  "in_my_sets": {
                    "description": "Whether the word is in the learner's sets, so it comes up for review",
                    "title": "In My Sets",
                    "type": "boolean"
                  },
                  "line": {
                    "description": "The line as the plain-text answer shows it",
                    "title": "Line",
                    "type": "string"
                  },
                  "next_review": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "The next review's date (YYYY-MM-DD) in `timezone`; absent when the word is due, not started or not in My sets",
                    "title": "Next Review"
                  },
                  "state": {
                    "description": "not_started, learning, known or due (due today)",
                    "enum": ["not_started", "learning", "known", "due"],
                    "title": "State",
                    "type": "string"
                  },
                  "timezone": {
                    "description": "The zone 'today' and 'tomorrow' are read in: the host's, else UTC",
                    "title": "Timezone",
                    "type": "string"
                  }
                },
                "required": ["in_my_sets", "line", "state", "timezone"],
                "title": "Trail",
                "type": "object"
              }
            },
            "properties": {
              "count": {
                "description": "The list's words, as its page counts them (one per word page)",
                "title": "Count",
                "type": "integer"
              },
              "kind": {
                "description": "level, band or topic",
                "title": "Kind",
                "type": "string"
              },
              "label": {
                "description": "The list's name, in English",
                "title": "Label",
                "type": "string"
              },
              "language": {
                "description": "The language the meanings are in: en, es, id, th or vi",
                "title": "Language",
                "type": "string"
              },
              "language_note": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Set when the learner's locale has no translations",
                "title": "Language Note"
              },
              "practise_url": {
                "description": "Practise the whole list on Talkhao",
                "title": "Practise Url",
                "type": "string"
              },
              "url": {
                "description": "The list's Talkhao page",
                "title": "Url",
                "type": "string"
              },
              "words": {
                "description": "The first five, in the page's order",
                "items": {
                  "$ref": "#/$defs/ListWord"
                },
                "title": "Words",
                "type": "array"
              }
            },
            "required": ["count", "kind", "label", "language", "practise_url", "url", "words"],
            "title": "HskList",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Words in an HSK list"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://talkhao/list.html",
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["account"],
                "type": "oauth2"
              }
            ],
            "ui": {
              "resourceUri": "ui://talkhao/list.html"
            }
          },
          "digest": "sha256:ee7307cb1adfee54670841b49cfa4a78b82a364d71c8d88ca03fb2c561450d59"
        },
        {
          "name": "look_up_word",
          "title": "Look up a Chinese word",
          "description": "Find a Chinese word from its characters, its pinyin (with tone marks, tone numbers or none) or a meaning in English, Spanish, Indonesian, Thai or Vietnamese. Covers the 4,999 words of HSK 1-6. Answers with the word's pinyin, meaning, HSK level and HSK 3.0 band, the meaning and stroke count of each character, an example sentence where there is one, its sound and its Talkhao page, and up to three other words when the question fits more than one.",
          "inputSchema": {
            "properties": {
              "word": {
                "description": "Just the word to look up, not the whole question: characters (反馈), pinyin with tone marks, tone numbers or none (fǎnkuì, fan3kui4, fankui), or a meaning in English, Spanish, Indonesian, Thai or Vietnamese (feedback)",
                "title": "Word",
                "type": "string"
              }
            },
            "required": ["word"],
            "title": "look_up_wordArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Candidate": {
                "properties": {
                  "level": {
                    "title": "Level",
                    "type": "integer"
                  },
                  "meaning": {
                    "title": "Meaning",
                    "type": "string"
                  },
                  "meaning_lang": {
                    "title": "Meaning Lang",
                    "type": "string"
                  },
                  "page_url": {
                    "title": "Page Url",
                    "type": "string"
                  },
                  "pinyin": {
                    "title": "Pinyin",
                    "type": "string"
                  },
                  "word": {
                    "title": "Word",
                    "type": "string"
                  }
                },
                "required": ["level", "meaning", "meaning_lang", "page_url", "pinyin", "word"],
                "title": "Candidate",
                "type": "object"
              },
              "Character": {
                "properties": {
                  "char": {
                    "title": "Char",
                    "type": "string"
                  },
                  "meanings": {
                    "description": "CC-CEDICT's senses, in English in every language",
                    "items": {
                      "type": "string"
                    },
                    "title": "Meanings",
                    "type": "array"
                  },
                  "pinyin": {
                    "title": "Pinyin",
                    "type": "string"
                  },
                  "strokes": {
                    "anyOf": [
                      {
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Strokes"
                  }
                },
                "required": ["char", "meanings", "pinyin"],
                "title": "Character",
                "type": "object"
              },
              "Example": {
                "properties": {
                  "pinyin": {
                    "title": "Pinyin",
                    "type": "string"
                  },
                  "translation": {
                    "title": "Translation",
                    "type": "string"
                  },
                  "translation_lang": {
                    "description": "The translation's language: the learner's, or en when it has none",
                    "title": "Translation Lang",
                    "type": "string"
                  },
                  "zh": {
                    "title": "Zh",
                    "type": "string"
                  }
                },
                "required": ["pinyin", "translation", "translation_lang", "zh"],
                "title": "Example",
                "type": "object"
              },
              "ListLink": {
                "properties": {
                  "kind": {
                    "description": "level, band, topic, measure or write",
                    "title": "Kind",
                    "type": "string"
                  },
                  "label": {
                    "description": "The list's name, in English",
                    "title": "Label",
                    "type": "string"
                  },
                  "practise_url": {
                    "title": "Practise Url",
                    "type": "string"
                  },
                  "url": {
                    "title": "Url",
                    "type": "string"
                  }
                },
                "required": ["kind", "label", "practise_url", "url"],
                "title": "ListLink",
                "type": "object"
              },
              "Trail": {
                "properties": {
                  "in_my_sets": {
                    "description": "Whether the word is in the learner's sets, so it comes up for review",
                    "title": "In My Sets",
                    "type": "boolean"
                  },
                  "line": {
                    "description": "The line as the plain-text answer shows it",
                    "title": "Line",
                    "type": "string"
                  },
                  "next_review": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "The next review's date (YYYY-MM-DD) in `timezone`; absent when the word is due, not started or not in My sets",
                    "title": "Next Review"
                  },
                  "state": {
                    "description": "not_started, learning, known or due (due today)",
                    "enum": ["not_started", "learning", "known", "due"],
                    "title": "State",
                    "type": "string"
                  },
                  "timezone": {
                    "description": "The zone 'today' and 'tomorrow' are read in: the host's, else UTC",
                    "title": "Timezone",
                    "type": "string"
                  }
                },
                "required": ["in_my_sets", "line", "state", "timezone"],
                "title": "Trail",
                "type": "object"
              },
              "WordData": {
                "properties": {
                  "band": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "HSK 3.0 band (1-6 or 7-9); absent when the word is not in HSK 3.0",
                    "title": "Band"
                  },
                  "characters": {
                    "description": "A word of two or more characters: each one's meaning",
                    "items": {
                      "$ref": "#/$defs/Character"
                    },
                    "title": "Characters",
                    "type": "array"
                  },
                  "english": {
                    "title": "English",
                    "type": "string"
                  },
                  "example": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Example"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null
                  },
                  "example_note": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Why there is no example sentence",
                    "title": "Example Note"
                  },
                  "level": {
                    "description": "HSK 2.0 level, 1-6",
                    "title": "Level",
                    "type": "integer"
                  },
                  "lists": {
                    "items": {
                      "$ref": "#/$defs/ListLink"
                    },
                    "title": "Lists",
                    "type": "array"
                  },
                  "meaning": {
                    "description": "In the learner's language when there is a translation, else English",
                    "title": "Meaning",
                    "type": "string"
                  },
                  "meaning_lang": {
                    "title": "Meaning Lang",
                    "type": "string"
                  },
                  "page_url": {
                    "title": "Page Url",
                    "type": "string"
                  },
                  "pinyin": {
                    "title": "Pinyin",
                    "type": "string"
                  },
                  "sound_url": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Sound Url"
                  },
                  "strokes": {
                    "description": "Every character of the word and its stroke count",
                    "items": {
                      "maxItems": 2,
                      "minItems": 2,
                      "prefixItems": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "integer"
                        }
                      ],
                      "type": "array"
                    },
                    "title": "Strokes",
                    "type": "array"
                  },
                  "word": {
                    "title": "Word",
                    "type": "string"
                  }
                },
                "required": ["characters", "english", "level", "lists", "meaning", "meaning_lang", "page_url", "pinyin", "strokes", "word"],
                "title": "WordData",
                "type": "object"
              }
            },
            "properties": {
              "language": {
                "description": "The language the answer is in: en, es, id, th or vi",
                "title": "Language",
                "type": "string"
              },
              "language_note": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Set when the learner's locale has no translations",
                "title": "Language Note"
              },
              "match": {
                "description": "How the word matched: hanzi, pinyin, gloss, sense, pinyin-toneless, ... ; empty when nothing did",
                "title": "Match",
                "type": "string"
              },
              "matched_language": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Set when the word was found through its meaning in another language than English or the answer's: es, id, th or vi (\"say\" is Vietnamese for drunk)",
                "title": "Matched Language"
              },
              "others": {
                "description": "Did you mean: up to three other words",
                "items": {
                  "$ref": "#/$defs/Candidate"
                },
                "title": "Others",
                "type": "array"
              },
              "query": {
                "title": "Query",
                "type": "string"
              },
              "trail": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/Trail"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The signed-in learner's own state for the word (B1c); only with a token, and only when one word was found"
              },
              "word": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/WordData"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
            "required": ["language", "match", "others", "query"],
            "title": "LookUpAnswer",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a Chinese word"
          },
          "behavior": {
