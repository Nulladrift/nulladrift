{
  "lockfileVersion": 2,
  "subjects": {
    "com.homevisto/mcp-server": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.homevisto.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "homevisto-mcp",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "get_mission",
          "description": "Get detailed information about a specific property verification mission by its ID. Returns mission details including property address, bounty amount, status, checklist items, and viewer/scout information.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The mission UUID to retrieve.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Get Mission Details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ffc5742a6b4893af1c64e493852657fe9ccecb118ab8c6a6c1f044c9228d0ea6"
        },
        {
          "name": "get_mission_stats",
          "description": "Get aggregate statistics about missions on the HomeVisto platform. Returns total counts, status breakdown, and average bounty information. Useful for understanding platform activity.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Get Mission Statistics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5a10b6e0dc16fb5554fd5b14565deb03e02a06eda229baaf549a49628ad84a14"
        },
        {
          "name": "get_nearby_missions",
          "description": "Find property verification missions within a geographic radius. Useful for scouts looking for missions near their location or for finding missions in a specific area.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "latitude": {
                "description": "Latitude of the center point (-90 to 90).",
                "type": "number"
              },
              "longitude": {
                "description": "Longitude of the center point (-180 to 180).",
                "type": "number"
              },
              "radiusKm": {
                "description": "Search radius in kilometers. Default: 10km, Maximum: 100km.",
                "type": "number"
              },
              "status": {
                "description": "Filter by mission status. Default: OPEN.",
                "enum": ["OPEN", "ASSIGNED", "IN_PROGRESS", "LIVE", "COMPLETED", "PAID", "CANCELLED"],
                "type": "string"
              }
            },
            "required": ["latitude", "longitude"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Get Nearby Missions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:536d9bcb90402c39ac8da329f7c9bcfb91451647eccd5c5583b87fc9425e93b6"
        },
        {
          "name": "list_missions",
          "description": "List property verification missions with optional filtering. Returns paginated results sorted by creation date (newest first). Use this to browse available missions on the HomeVisto platform.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Maximum number of missions to return. Default: 20, Maximum: 100.",
                "type": "number"
              },
              "offset": {
                "description": "Number of missions to skip for pagination. Default: 0.",
                "type": "number"
              },
              "status": {
                "description": "Filter by mission status. OPEN = available for scouts, COMPLETED = finished missions.",
                "enum": ["OPEN", "ASSIGNED", "IN_PROGRESS", "LIVE", "COMPLETED", "PAID", "CANCELLED"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "List Missions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:01b0d625d25f38925bdcc89bbf1a44228a5fa11c3071defc8ae713d19d758301"
        },
        {
          "name": "search_missions",
          "description": "Search for missions by keyword. Searches across mission title, description, and property address fields. Useful for finding missions in specific locations or with specific requirements.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Maximum results to return. Default: 20, Maximum: 100.",
                "type": "number"
              },
              "query": {
                "description": "Search query to match against title, description, or address. Example: 'apartment Berlin' or 'Dublin 2BR'.",
                "type": "string"
              },
              "status": {
                "description": "Filter results by mission status.",
                "enum": ["OPEN", "ASSIGNED", "IN_PROGRESS", "LIVE", "COMPLETED", "PAID", "CANCELLED"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Search Missions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ee7061fd6a0a77b96c95fac1143979988f72b4b47c1c93a29985a6194b2008bb"
        }
      ],
      "digest": "sha256:f15d860f66ecbd69316ca71620cbe75ce260413edc5179a0fbedfcc570434045"
    }
  }
}
