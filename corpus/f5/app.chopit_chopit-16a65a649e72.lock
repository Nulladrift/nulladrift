        {
          "name": "update_shopping_list",
          "title": "Mark shopping ingredients covered",
          "description": "Ticks off, unticks or partly covers lines on a shopping list ('I already have rice', 'I only need 200g more'). Takes shoppingListId, expectedRevision and changes keyed by line ID (excluded or coveredQuantity), all from get_shopping_list. Changes only what to buy; recipes and pantry are untouched. Repeating the same values is safe; a revision conflict means the list changed and get_shopping_list has the new revision. Requires a linked Chop It account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "changes": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "coveredQuantity": {
                      "description": "Amount already covered, in the list line unit. E.g. 100 of 400g leaves 300g to buy. Never guess unknown stock.",
                      "minimum": 0,
                      "type": "number"
                    },
                    "excluded": {
                      "description": "True means do not buy this line; false restores it.",
                      "type": "boolean"
                    },
