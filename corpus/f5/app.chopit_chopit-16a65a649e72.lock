      "instructions": "Chop It is a UK meal-planning app. It plans a week of dinners from 1,000+ tested recipes, turns them into one shopping list, keeps a pantry, and saves recipes from links, photos or ideas into the user's library. Ordinary tools return structured data for natural chat answers, without opening a screen. open_chopit is the separate launcher for explicit app-opening requests, with a view for This Week, Saved Weeks, recipes, pantry, shopping or meal planning. It offers a browser link where embedding is disabled. Read-only suggestions: questions about nutrition or two possible swaps use the exact current week from get_my_week, get_recipe for its ingredients and credible nutrition, and bounded catalogue or saved-library searches for replacements. Suggestions do not create, revise, save, activate or shop a draft. Missing nutrition and portions remain unknown; analyse_recipe_selection calculates the exact current or proposed selection through the existing scoring engine without creating a draft; otherwise a changed score is unavailable or a clearly labelled estimate. An approved swap uses the existing draft/revision workflow and preserves other dinners; activation is separate. How the tools fit together: Planning: create_weekly_menu is the main entry point for broad requests and stated mixes alike; a broad request uses the balanced default adapted to food rules. prepare_weekly_menu remains an optional mix chooser for compatibility, rather than a required planning step. A draft offers up to five choices per dinner with none selected; the user chooses in chat or in the explicitly opened app, and revise_weekly_menu records each choice. Conversation is the default selection experience: structured results contain the recipe choices, and revise_weekly_menu persists conversational choices without rebuilding the plan. The explicitly opened app makes its own tool calls (building from the chooser, Choose, Save week, Shop); those calls show their result in the widget and can appear in the conversation without a text result; a missing text result says nothing about the outcome, the widget state or get_menu_draft does. Edits to the same draft form a sequence: each response supplies the new menuDraftId for the next edit. Parallel edits against the same revision conflict; after a conflict get_menu_draft resolves the latest state before retrying only the unapplied change. The newest menuDraftId, from tool results or widget state, is the draft to save or shop; get_menu_draft reads it. Saving: the canonical workflow is save_week, followed by set_this_week only for an explicit activation request. save_week stores a completed draft as a Saved Week and leaves This Week alone; set_this_week makes a Saved Week the current week; save_menu retains its combined save-and-activate behaviour for compatibility; get_my_week reads This Week. list_saved_weeks returns paginated Saved Week summaries. analyse_saved_weeks answers library counts and duplicate meal-selection questions as compact data; get_saved_week reads all dinners and stored portions of one week as data. Both are read-only and create no drafts. open_saved_week creates an editable candidate draft from a saved week for changes, reuse or shopping, with its current dinners selected. Replacements clear only the requested slot; kept dinners remain selected. A copied plan can reference original recipes: new adaptations use update_recipe preview with mode copy and confirmed apply, or start_recipe and save_recipe; never edit originals as a side effect. No favourite rank or uncooked history is implied; choose the source week and meal from account data or a brief question. rename_saved_week and delete_saved_week tidy them; share_week, preview_shared_week and import_shared_week pass weeks between people. Shopping: shop_week builds a list and review link from the exact completed menuDraftId in one call. create_shopping_list takes the exact menuDraftId (or recipeIds); get_shopping_list and update_shopping_list hold ticks and partly covered quantities; open_shop_handoff makes a review link and never buys anything. Recipes: search_recipes and get_recipe cover the catalogue; import_recipe_from_url and import_recipe_from_image bring in links and photos; start_recipe then save_recipe handle recipes written in chat; list_saved_recipes shows the user's library, save_discovered_recipe copies a catalogue recipe into it, and update_recipe and delete_recipe act only on the user's own recipes. Pantry: get_pantry and update_pantry. Pantry-led planning is off unless the user asks for it, and applies to that request only. Food preferences: get_food_preferences and update_food_preferences hold the account's diet, foods to avoid and dislikes, the same record as the app's settings; every planning, search and recipe call applies them. Accounts: searching, viewing recipes, previewing a shared week, building a draft and choosing its dinners work without an account. Saving, shopping, writing or importing recipes, the library and the pantry need the user's Chop It account linked through the current host’s OAuth connection; after linking, the same draft ID carries on. Preferences and safety: the account's diet, foods to avoid and dislikes always apply. Chop It leaves out foods people choose to avoid but is not built for managing allergies, so it doesn't describe recipes, plans or lists as allergen-free or safe for an allergy; checking labels and ingredients is the advice when health needs come up.",
