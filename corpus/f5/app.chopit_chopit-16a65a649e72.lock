                          "sourceRecipeTitles": {
                            "items": {
                              "type": "string"
                            },
                            "type": "array"
                          },
                          "status": {
                            "enum": ["buy", "covered", "checkStock"],
                            "type": "string"
                          },
                          "unit": {
                            "type": ["string", "null"]
                          }
                        },
                        "required": ["name", "notes", "quantity", "sourceRecipeTitles", "unit"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "sectionName": {
