            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "leaveOutPantry": {
                "description": "Only when asked to leave out Pantry items. Uses the same reversible stock coverage as Chef IQ Shop, including listed items without comparable amounts. Low or zero stock never covers a line.",
                "type": "boolean"
              },
              "menuDraftId": {
                "description": "A menuDraftId returned by create_weekly_menu.",
                "type": "string"
              },
              "pantryMode": {
                "description": "For recipeIds, use checks your Pantry, ignore leaves it out, and focus does not read stock. For a draft, omit or match its pantryMode; change the draft first otherwise.",
                "enum": ["ignore", "use", "focus"],
                "type": "string"
              },
              "recipeIds": {
