          "name": "read_work_trolley_progress",
          "title": "Read trolley progress",
          "description": "Read the latest status of the current owner’s exact progress card.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
