        {
          "name": "import_recipe_from_image",
          "title": "Import a recipe from a photo",
          "description": "Imports a recipe from a photo (cookbook page, screenshot or handwritten card) given a fetchable http(s) imageUrl, restructures it to Chop it's recipe standard and saves it to the user's library. A needs_review result carries a preview and the issues found, for correction with save_recipe. If the image can't be fetched, the recipe text can be imported as a caption with import_recipe_from_url. Imports that need paid processing require confirmPaidImport after the user agrees. Limited per conversation. Requires a linked Chop it account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "caption": {
                "description": "Optional extra context, e.g. the dish name or text the photo cuts off.",
                "type": "string"
              },
              "confirmPaidImport": {
                "description": "True only after the user explicitly approves 1 credit once the 10 free weekly imports are exhausted.",
                "type": "boolean"
              },
              "imageUrl": {
                "description": "http(s) URL of a photo of the recipe — a cookbook page, screenshot, or handwritten card. Must be a fetchable link; if the fetch fails, fall back to import_recipe_from_url with the recipe text as caption.",
                "format": "uri",
                "type": "string"
              },
              "requestId": {
                "description": "Generate a unique ID before starting a new import. Reuse it until that import completes, including confirmation and recovery; a later new import needs a new ID.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["imageUrl"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "appUrl": {
                "type": "string"
              },
              "failedRules": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "keepUrl": {
                "type": ["string", "null"]
              },
              "message": {
                "type": "string"
              },
              "recipeId": {
                "type": "string"
              },
              "recipePreview": {},
              "status": {
                "enum": ["saved", "needs_review", "failed"],
                "type": "string"
              },
              "title": {
                "type": "string"
              }
            },
            "required": ["message", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
