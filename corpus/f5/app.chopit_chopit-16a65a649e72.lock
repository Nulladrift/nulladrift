        {
          "name": "save_recipe",
          "title": "Save a recipe to the Chop It library",
          "description": "Saves a structured recipe to the user's Chop It library: one read from a cookbook photo, one created with the user, or a corrected import. Takes the recipeDraftToken from start_recipe; the recipe is checked against that brief (UK ingredient names and metric quantities, ingredients in logical sections, a complete method with sensory cues, a plain title). status needs_revision means nothing was saved and fixes lists what to change, with a fresh recipeDraftToken; status saved means it is in the library and appUrl opens it. Requires a linked Chop It account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cookTimeMins": {
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "description": {
                "description": "One-sentence appetising description of the finished dish.",
                "type": "string"
              },
              "fidelity": {
                "description": "'transcription' for a faithful copy of an existing recipe (a cookbook page, pasted text). Honoured ONLY when sourceUrl or sourceNote carries real evidence — otherwise treated as 'generated'.",
                "enum": ["generated", "transcription"],
                "type": "string"
              },
              "finishingTouch": {
                "description": "One vivid sentence describing the plated dish.",
                "type": "string"
              },
              "ingredientSections": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "items": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "name": {
                            "description": "Ingredient name, UK vocabulary (coriander, courgette, mince).",
                            "minLength": 1,
                            "type": "string"
                          },
                          "notes": {
                            "description": "Prep notes, e.g. 'finely sliced'.",
                            "type": "string"
                          },
                          "optional": {
                            "description": "True for a garnish or 'to serve' accompaniment: kept off the shopping list and out of nutrition scoring. Leave unset if unsure.",
                            "type": "boolean"
                          },
                          "quantity": {
                            "description": "Metric quantity as text, e.g. '500 g', '2 tbsp', '1 large'.",
                            "type": "string"
                          }
                        },
                        "required": ["name"],
                        "type": "object"
                      },
                      "minItems": 1,
                      "type": "array"
                    },
                    "title": {
                      "description": "Section label, e.g. 'The crispy chicken' or 'To serve'.",
                      "type": "string"
                    }
                  },
                  "required": ["items"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "prepTimeMins": {
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "recipeDraftToken": {
                "description": "A signed copy of the brief start_recipe just issued, so the server can confirm the recipe was written to the brief it actually gave out. It is not a credential and not a secret: it carries no keys, grants no access to anything, and everything inside it (servings, the excluded ingredients, the attempt count) was already returned to you in this same response, in the clear. The signature stops those constraints being edited in transit, not read. It is safe to show the user. Include the one start_recipe returned so the recipe is checked against that brief.",
                "type": "string"
              },
              "servings": {
                "default": 2,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "sourceNote": {
                "description": "Provenance, e.g. 'photographed from a family cookbook'.",
                "type": "string"
              },
              "sourceUrl": {
                "description": "Where the recipe came from, if a link exists.",
                "type": "string"
              },
              "steps": {
                "description": "Complete numbered method with sensory cues (golden, bubbling).",
                "items": {
                  "minLength": 3,
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "tags": {
                "description": "e.g. cuisine, 'quick', 'family favourite'.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "title": {
                "description": "Recipe title in plain title case, no marketing words.",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["ingredientSections", "steps", "title"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "appUrl": {
                "type": "string"
              },
              "attemptsRemaining": {
                "type": "number"
              },
              "fixes": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "detail": {
                      "type": "string"
                    },
                    "rule": {
                      "type": "string"
                    },
                    "severity": {
                      "enum": ["CRITICAL", "WARNING"],
                      "type": "string"
                    }
                  },
                  "required": ["detail", "rule", "severity"],
                  "type": "object"
                },
                "type": "array"
              },
              "keepUrl": {
                "type": ["string", "null"]
              },
              "message": {
                "type": "string"
              },
              "recipeDraftToken": {
                "description": "The same signed brief, re-issued with the revision count advanced. Not a credential and not a secret; see the description on start_recipe's output.",
                "type": "string"
              },
              "recipeId": {
                "type": "string"
              },
              "savesAfterCap": {
                "type": "boolean"
              },
              "status": {
                "enum": ["saved", "saved_to_chat", "saved_unclaimed", "needs_revision"],
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "warnings": {
                "items": {
                  "$ref": "#/properties/fixes/items"
                },
                "type": "array"
              }
            },
            "required": ["message", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Save a recipe to the Chop It library"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Recipe saved",
            "openai/toolInvocation/invoking": "Saving your recipe…",
            "securitySchemes": [
              {
                "scopes": ["openid", "email", "profile", "offline_access"],
                "type": "oauth2"
              }
            ]
          },
