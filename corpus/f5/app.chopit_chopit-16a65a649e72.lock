        },
        {
          "name": "update_pantry",
          "title": "Update the pantry",
          "description": "Updates the user's Chop It pantry from what they've bought, have or used up: add items (topping up existing ones), remove by name, or change or remove exact rows by pantryItemId. On add, location places stock directly in pantry, fridge or freezer; only compatible items in that location are topped up. Omit unknown quantities or expiry dates rather than guessing. Read back before retrying a top-up, which is additive. An ambiguous item returns its candidates without changing that item; other unambiguous items in the request can still change. Staples such as salt, pepper and oil are skipped. Edits the same pantry the app shows. Requires a linked Chop It account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "add": {
                "description": "Items to add (or top up when already present).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "expiryDate": {
                      "description": "ISO date the item should be used by, if known.",
                      "type": "string"
                    },
                    "location": {
                      "description": "Use the location the user identifies. Omit only when unknown; then the usual storage location is inferred.",
                      "enum": ["pantry", "fridge", "freezer"],
                      "type": "string"
                    },
                    "name": {
                      "description": "Ingredient name, UK vocabulary (coriander, courgette, mince).",
                      "minLength": 1,
                      "type": "string"
                    },
                    "quantity": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "unit": {
                      "description": "e.g. g, kg, ml, tins",
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              },
              "remove": {
                "description": "Ingredient names to remove; matched on the same canonical key the app uses.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "removeItemIds": {
                "description": "Exact pantryItemIds from get_pantry to delete. Preferred for duplicate names.",
                "items": {
                  "format": "uuid",
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "update": {
                "description": "Set fields on an exact row; quantity replaces rather than adds.",
                "items": {
