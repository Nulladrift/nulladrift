          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "delivery": {
                "additionalProperties": false,
                "properties": {
                  "checkedAt": {
                    "description": "UTC instant when Work read this retailer’s live calendar.",
                    "format": "date-time",
                    "type": "string"
                  },
                  "currency": {
                    "pattern": "^[A-Z]{3}$",
                    "type": "string"
                  },
                  "slots": {
                    "description": "Available delivery windows with the full fee quoted in the currency’s minor unit. An empty list means the checked calendar had no matching slots.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "additionalFees": {
                          "description": "All separately quoted mandatory charges for this trolley and window, such as the small-order fee. Send [] only when verified there are none. Omit when unchecked.",
                          "items": {
                            "additionalProperties": false,
                            "properties": {
                              "amountMinor": {
                                "maximum": 1000000000000,
                                "minimum": -9007199254740991,
                                "type": "integer"
                              },
                              "label": {
                                "maxLength": 70,
                                "minLength": 1,
                                "type": "string"
                              }
                            },
                            "required": ["amountMinor", "label"],
                            "type": "object"
                          },
                          "maxItems": 12,
                          "type": "array"
                        },
                        "date": {
                          "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                          "type": "string"
                        },
                        "end": {
                          "pattern": "^(?:(?:[01]\\d|2[0-3]):[0-5]\\d|24:00)$",
                          "type": "string"
                        },
                        "feeMinor": {
                          "maximum": 1000000000000,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        "start": {
                          "pattern": "^(?:[01]\\d|2[0-3]):[0-5]\\d$",
                          "type": "string"
                        }
                      },
                      "required": ["date", "end", "feeMinor", "start"],
                      "type": "object"
                    },
                    "maxItems": 50,
                    "type": "array"
                  },
                  "timeZone": {
                    "maxLength": 100,
                    "type": "string"
                  }
                },
                "required": ["checkedAt", "currency", "slots", "timeZone"],
                "type": "object"
              },
              "lines": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "addition": {
                      "additionalProperties": false,
                      "properties": {
                        "added": {
                          "maximum": 1000,
                          "minimum": 1,
                          "type": "integer"
                        },
                        "after": {
                          "$ref": "#/properties/lines/items/properties/addition/properties/before"
                        },
                        "before": {
                          "maximum": 1000,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "productId": {
                          "maxLength": 240,
                          "minLength": 1,
                          "pattern": "^[^?#@\\s]+$",
                          "type": "string"
                        }
                      },
                      "required": ["added", "after", "before", "productId"],
                      "type": "object"
                    },
                    "found": {
                      "const": true,
                      "description": "A pack check returned an eligible pack for this line; it is not in the trolley yet.",
                      "type": "boolean"
                    },
                    "lineId": {
                      "pattern": "^line_[a-f0-9]{24}$",
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "observedPacks": {
                      "items": {
                        "maxLength": 160,
                        "minLength": 1,
                        "type": "string"
                      },
                      "maxItems": 8,
                      "minItems": 1,
                      "type": "array"
                    },
                    "restored": {
                      "const": true,
                      "type": "boolean"
                    },
                    "status": {
                      "enum": ["pending", "in_trolley", "needs_choice"],
                      "type": "string"
                    }
                  },
                  "required": ["lineId", "name", "status"],
                  "type": "object"
                },
                "type": "array"
              },
              "retailer": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "retailerOrigin": {
                "maxLength": 255,
                "type": "string"
              },
              "revision": {
                "minimum": 0,
                "type": "integer"
              },
              "runId": {
                "format": "uuid",
                "type": "string"
              },
              "shoppingListId": {
                "pattern": "^list_[a-f0-9]+$",
                "type": "string"
              },
              "slotHold": {
                "additionalProperties": false,
                "properties": {
                  "checkedAt": {
                    "format": "date-time",
                    "type": "string"
                  },
                  "expiresAt": {
                    "format": "date-time",
                    "type": "string"
                  },
                  "releaseAvailable": {
                    "type": "boolean"
                  },
                  "status": {
