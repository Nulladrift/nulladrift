        {
          "name": "import_recipe_from_url",
          "title": "Import a recipe from a link",
          "description": "Imports a recipe from a link (TikTok, Instagram or any recipe website), or from pasted caption text when the link can't be read, restructures it to Chop it's recipe standard and saves it to the user's library. A needs_review result carries a preview and the issues found; the corrected recipe can then be saved with save_recipe. Imports that need paid processing require confirmPaidImport after the user agrees. Limited per conversation. Requires a linked Chop it account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "caption": {
                "description": "Pasted caption/recipe text — used alone or to supplement the url.",
                "type": "string"
              },
              "confirmPaidImport": {
                "description": "True only after the user explicitly approves 1 credit once the 10 free weekly imports are exhausted.",
                "type": "boolean"
              },
              "requestId": {
                "description": "Generate a unique ID before starting a new import. Reuse it until that import completes, including confirmation and recovery; a later new import needs a new ID.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "url": {
                "description": "TikTok, Instagram or website link to a recipe.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "appUrl": {
                "type": "string"
              },
              "failedRules": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "keepUrl": {
                "type": ["string", "null"]
              },
              "message": {
                "type": "string"
              },
              "recipeId": {
                "type": "string"
              },
              "recipePreview": {},
              "status": {
                "enum": ["saved", "needs_review", "failed"],
                "type": "string"
              },
              "title": {
                "type": "string"
