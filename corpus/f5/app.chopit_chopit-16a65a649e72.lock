        {
          "name": "start_recipe",
          "title": "Get the rules before writing a recipe",
          "description": "Returns the brief for writing a recipe to Chop It's library standard (structure, UK ingredient names, metric quantities, method detail), pantry context when the user wants to cook from their pantry, and a recipeDraftToken. save_recipe checks a recipe against the brief named by that token, so a recipe written to this brief is accepted first time. The token is a signed copy of the brief the user can see; it holds no secret and grants no access. Makes no AI call and saves nothing. Requires a linked Chop It account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cuisine": {
                "description": "Cuisine the user asked for, if any.",
                "type": "string"
              },
              "dishIdea": {
                "description": "What the user wants to cook, in their words.",
                "minLength": 2,
                "type": "string"
              },
              "exclusions": {
                "description": "Anything ruled out, in plain words: 'no pork', 'dairy-free', 'no peanuts'. Resolved server-side.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "focusIngredients": {
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "maxTimeMins": {
                "description": "Hard ceiling on total time, when the user gave one.",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "pantryMode": {
                "enum": ["ignore", "use", "focus"],
                "type": "string"
              },
              "servings": {
                "default": 2,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["dishIdea"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bannedPhrases": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "dietary": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "excludeFoods": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "excludeProtein": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "maxTimeMins": {
                "type": ["number", "null"]
              },
              "methodRules": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "outputContract": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "pantryMatches": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "recipeDraftToken": {
                "description": "A signed copy of the brief start_recipe just issued, so the server can confirm the recipe was written to the brief it actually gave out. It is not a credential and not a secret: it carries no keys, grants no access to anything, and everything inside it (servings, the excluded ingredients, the attempt count) was already returned to you in this same response, in the clear. The signature stops those constraints being edited in transit, not read. It is safe to show the user.",
                "type": "string"
              },
              "servings": {
                "type": "number"
              },
              "ukVocabulary": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "unrecognisedExclusions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["bannedPhrases", "dietary", "excludeFoods", "excludeProtein", "maxTimeMins", "methodRules", "note", "outputContract", "pantryMatches", "recipeDraftToken", "servings", "ukVocabulary", "unrecognisedExclusions"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the rules before writing a recipe"
