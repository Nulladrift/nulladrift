                      "type": "number"
                    },
                    "minTimeMins": {
                      "exclusiveMinimum": 0,
                      "type": "integer"
                    },
                    "protein": {
                      "enum": ["fish", "chicken", "beef", "pork", "lamb", "veg", "vegetarian", "vegan", "pescatarian"],
                      "type": "string"
                    },
                    "proteins": {
                      "description": "OR choices within this slot, e.g. beef or lamb.",
