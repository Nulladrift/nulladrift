        {
          "name": "get_recipe",
          "title": "Get the full recipe",
          "description": "Returns one complete recipe by recipeId: ingredients with quantities, method steps, timings and photo. Accepts IDs from search_recipes, a menu draft, a week or list_saved_recipes, for catalogue recipes and the user's own saved recipes alike. servings scales simple ingredient amounts (the app's Shop list rounding); scaledFrom holds the written count. If scalingNote is present, amounts embedded in the instructions need review: the whole recipe stays at its returned original servings. Do not claim it was adapted; review ingredients and method together before a separate copy; the returned servings describe the recipe's actual portions. Garnishes and 'to serve' ingredients carry optional: true. nutrition holds per-serving kcal, protein, carbs, fat and fibre when the catalogue can vouch for them (an estimate, not medical advice); nutritionNote says why they are withheld otherwise. Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "recipeId": {
                "description": "Recipe id from search_recipes, create_weekly_menu, or list_saved_recipes.",
                "minLength": 1,
                "type": "string"
              },
              "servings": {
                "description": "Requested servings. Simple ingredient amounts scale using Shop rounding; a scalingNote explains when embedded quantities require keeping the complete written recipe for review. Omit for the recipe's own count.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["recipeId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "appUrl": {
                "type": "string"
              },
              "imageUrl": {
                "type": ["string", "null"]
              },
              "ingredients": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "optional": {
                      "type": "boolean"
                    },
                    "quantity": {
                      "type": "number"
                    },
                    "unit": {
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "type": "array"
              },
              "method": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "nutrition": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "carbsG": {
                        "type": ["number", "null"]
                      },
                      "coveragePercent": {
                        "type": ["number", "null"]
                      },
                      "fatG": {
                        "type": ["number", "null"]
                      },
                      "fibreG": {
                        "type": ["number", "null"]
                      },
                      "kcal": {
                        "type": ["number", "null"]
                      },
                      "proteinG": {
                        "type": ["number", "null"]
                      }
                    },
                    "required": ["carbsG", "coveragePercent", "fatG", "fibreG", "kcal", "proteinG"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "nutritionNote": {
                "type": "string"
              },
              "oneLiner": {
                "type": ["string", "null"]
              },
              "recipeId": {
                "type": "string"
              },
              "scaledFrom": {
                "type": ["number", "null"]
              },
              "scalingNote": {
                "type": "string"
              },
              "servings": {
                "type": ["number", "null"]
              },
              "tags": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "title": {
                "type": "string"
              },
              "totalTimeMins": {
                "type": ["number", "null"]
              }
            },
            "required": ["appUrl", "imageUrl", "ingredients", "method", "oneLiner", "recipeId", "servings", "tags", "title", "totalTimeMins"],
