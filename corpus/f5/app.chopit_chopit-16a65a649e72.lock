          "meta": {
            "openai/toolInvocation/invoked": "Shopping list ready",
            "openai/toolInvocation/invoking": "Consolidating your shopping list…",
            "openai/widgetAccessible": true,
            "securitySchemes": [
              {
                "scopes": ["openid", "email", "profile", "offline_access"],
                "type": "oauth2"
              }
            ],
