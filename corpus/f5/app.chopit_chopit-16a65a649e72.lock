                "required": ["buy", "checkStock", "covered"],
                "type": "object"
              },
              "localStateAvailable": {
                "description": "False for app-week reads: browser-only ticks, extras and serving overrides are unavailable.",
                "type": "boolean"
              },
              "note": {
                "type": "string"
              },
              "readOnly": {
                "type": "boolean"
              },
              "recipeIds": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "recipeServings": {
                "additionalProperties": {
                  "type": "number"
                },
                "type": "object"
              },
              "remainingItemCount": {
                "type": "integer"
              },
              "revision": {
                "type": "integer"
              },
              "sections": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "items": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "coveredQuantity": {
                            "type": "number"
                          },
