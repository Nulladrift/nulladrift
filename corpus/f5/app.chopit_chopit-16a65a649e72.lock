        {
          "name": "create_weekly_menu",
          "title": "Build a weekly dinner menu",
          "description": "Main entry point for planning dinners. Builds a draft week of dinners from Chop It's catalogue, including broad requests such as 'plan five dinners' with a balanced protein mix adapted to food rules. Each dinner slot gets up to five equal recipe choices and none is selected until the user chooses, in chat or in the explicitly opened app; a draft with zero selected (status needs_selections) is the normal starting state. Returns structured dinner choices and a menuDraftId that revise_weekly_menu, get_menu_draft, save_week and create_shopping_list accept. Building a draft works without an account. Parameters: brief is the user's own words; each counted protein ('2 chicken, 1 fish') or slotRequirement is one dinner slot; dietary holds whole-week food rules only (one vegetarian dinner is a slot, not dietary); maxTimeMins caps every dinner, while slotRequirements can mix quick and slower dinners; priority is balanced, quick (30-minute cap), healthy or comfort; pantryMode stays off unless the user wants to cook from their pantry (using account stock needs a linked account); includeRecipeIds are pinned as selected dinners. Dietary rules and time limits are hard constraints, and only dinner mains are offered. slotIssues lists any slot with fewer than five matches and the reason: fewer cards means fewer recipes met that slot's rules, not that the catalogue is short.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brief": {
                "description": "Free-text brief, e.g. 'quick midweek family dinners, no fish'.",
                "minLength": 1,
                "type": "string"
              },
              "configurationId": {
                "description": "Set by the weekly chooser widget: the chooser this week is built from, so the widget can find it again after a reload.",
                "pattern": "^configure_[0-9a-f-]{36}$",
                "type": "string"
              },
              "dietary": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "dinnersCount": {
                "description": "How many dinners to plan. If omitted, the count named in the brief wins, else 5.",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "excludeRecipeIds": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "focusIngredients": {
                "description": "Only ingredients explicitly named for using up; do not fill from remembered inventory.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "includeRecipeIds": {
                "description": "Recipe ids to pin into the week.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "maxTimeMins": {
                "description": "Global hard cap for EVERY dinner. For quick weeknights plus a slower weekend, use slotRequirements instead.",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "mixPreset": {
                "enum": ["balanced", "plants", "family", "variety"],
                "type": "string"
              },
              "pantryMode": {
                "description": "Task only: default ignore for fresh inspiration; use only when explicitly asked to plan from stock; focus prioritises named ingredients. Never changes the diet, foods to avoid or other lasting preferences.",
                "enum": ["ignore", "use", "focus"],
                "type": "string"
              },
              "priority": {
                "description": "quick and speedy are the same criterion: every dinner within 30 minutes of credible total time. healthy uses the documented per-serving nutrition rule; comfort is the curated comfort style. balanced applies no preference.",
                "enum": ["balanced", "healthy", "speedy", "quick", "comfort"],
                "type": "string"
              },
              "recipeSource": {
                "description": "Saved means the linked library. Not recently planned excludes recent MCP draft selections; it does not imply never cooked.",
                "enum": ["mixed", "saved", "not_recently_planned"],
                "type": "string"
              },
              "servings": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "slotRequirements": {
                "description": "One entry per dinner, in display order. Use for mixed briefs: quick slots have maxTimeMins, a slower weekend has minTimeMins and special, and a fish slot has protein fish. Empty entries mean a varied normal dinner.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "cookingMethod": {
                      "enum": ["roast"],
                      "type": "string"
                    },
                    "cuisine": {
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    },
                    "excludeFoods": {
                      "items": {
                        "minLength": 1,
                        "type": "string"
                      },
                      "maxItems": 40,
                      "type": "array"
                    },
                    "excludeProtein": {
                      "items": {
                        "minLength": 1,
                        "type": "string"
                      },
                      "maxItems": 12,
                      "type": "array"
                    },
                    "label": {
                      "maxLength": 40,
                      "type": "string"
                    },
                    "maxTimeMins": {
                      "exclusiveMinimum": 0,
                      "type": "integer"
                    },
                    "minFibreG": {
                      "description": "Hard minimum credible estimated fibre grams per serving. Never relax to fill choices.",
                      "maximum": 100,
                      "minimum": 0,
                      "type": "number"
                    },
                    "minTimeMins": {
                      "exclusiveMinimum": 0,
                      "type": "integer"
                    },
                    "protein": {
                      "enum": ["fish", "chicken", "beef", "pork", "lamb", "veg", "vegetarian", "vegan", "pescatarian"],
                      "type": "string"
                    },
                    "proteins": {
                      "description": "OR choices within this slot, e.g. beef or lamb.",
                      "items": {
                        "enum": ["fish", "chicken", "beef", "pork", "lamb", "veg", "vegan"],
                        "type": "string"
                      },
                      "maxItems": 7,
                      "minItems": 1,
                      "type": "array"
                    },
                    "special": {
                      "type": "boolean"
                    },
                    "style": {
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 14,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["brief"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "allowedNextActions": {
                "items": {
                  "enum": ["select_recipe", "reroll_slot", "change_slot", "undo_last_change", "create_shopping_list", "save_week", "set_this_week", "save_menu"],
