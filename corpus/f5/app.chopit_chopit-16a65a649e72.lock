        {
          "name": "create_shopping_list",
          "title": "Build a consolidated shopping list",
          "description": "Builds one consolidated, aisle-organised shopping list from a completed menu draft (menuDraftId) or a set of recipes (recipeIds: catalogue, the user's own, or both), merging duplicate ingredients and scaling to servings. Returns shoppingListId, the source draft and recipes, and counts: buy, covered (already have) and checkStock (pantry matches to confirm); remainingItemCount includes unresolved stock checks. Any recipe ID that can't be resolved is reported in note, meaning the list is incomplete. Pantry handling follows the draft, or explicit pantryMode for recipeIds: ignore and focus do not read stock; use covers comparable measured stock and leaves unmeasured matches as checkStock. Set leaveOutPantry only when asked to leave out Pantry items, matching Chef IQ Shop coverage. Low and zero stock cover nothing. Whole items round up for buying; measured quantities are recipe amounts. get_shopping_list, update_shopping_list and open_shop_handoff take the returned shoppingListId. Requires a linked Chop it account. For “shop this week” in Work, pass fromCurrentWeek:true alone. This returns the owned list, exact buy targets and quick checks together. Use this same shoppingListId and revision through the shop.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "curatedWeek": {
                "description": "Name or slug of a Chop it featured week, such as Five Nights, Big Flavours. Uses its current published seasonal dinners. Omit menuDraftId and recipeIds.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "fromCurrentWeek": {
                "const": true,
                "description": "Explicitly shop the signed-in shopper’s current week with its saved dinner portions and Pantry. Use alone.",
                "type": "boolean"
              },
              "leaveOutPantry": {
                "description": "Only when asked to leave out Pantry items. Uses the same reversible stock coverage as Chef IQ Shop, including listed items without comparable amounts. Low or zero stock never covers a line.",
                "type": "boolean"
              },
              "menuDraftId": {
                "description": "A menuDraftId returned by create_weekly_menu.",
                "type": "string"
              },
              "pantryMode": {
                "description": "For recipeIds, use checks your Pantry, ignore leaves it out, and focus does not read stock. For a draft, omit or match its pantryMode; change the draft first otherwise.",
                "enum": ["ignore", "use", "focus"],
                "type": "string"
              },
              "recipeIds": {
                "description": "Explicit recipe ids (used when no menuDraftId).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "servings": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "counts": {
                "additionalProperties": false,
                "properties": {
                  "buy": {
                    "type": "integer"
                  },
                  "checkStock": {
                    "type": "integer"
                  },
                  "covered": {
                    "type": "integer"
                  }
                },
                "required": ["buy", "checkStock", "covered"],
                "type": "object"
              },
              "localStateAvailable": {
                "description": "False for app-week reads: browser-only ticks, extras and serving overrides are unavailable.",
                "type": "boolean"
              },
              "note": {
                "type": "string"
              },
              "readOnly": {
                "type": "boolean"
              },
              "recipeIds": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "recipeServings": {
                "additionalProperties": {
                  "type": "number"
                },
                "type": "object"
              },
              "remainingItemCount": {
                "type": "integer"
              },
              "revision": {
                "type": "integer"
              },
              "sections": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "items": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "coveredQuantity": {
                            "type": "number"
                          },
                          "excluded": {
                            "type": "boolean"
                          },
                          "inPantry": {
                            "type": "boolean"
                          },
                          "lineId": {
                            "type": "string"
                          },
                          "name": {
                            "type": "string"
                          },
                          "notes": {
                            "type": ["string", "null"]
                          },
                          "purchaseQuantity": {
                            "type": ["number", "null"]
                          },
                          "quantity": {
                            "type": ["number", "null"]
                          },
                          "remainingQuantity": {
                            "type": ["number", "null"]
                          },
                          "retailerTarget": {
                            "anyOf": [
                              {
                                "additionalProperties": false,
                                "properties": {
                                  "name": {
                                    "type": "string"
                                  },
                                  "quantity": {
                                    "type": "number"
                                  },
                                  "unit": {
                                    "type": "string"
                                  }
                                },
                                "required": ["name", "quantity", "unit"],
                                "type": "object"
                              },
                              {
                                "type": "null"
                              }
                            ]
                          },
                          "sourceRecipeTitles": {
                            "items": {
                              "type": "string"
                            },
                            "type": "array"
                          },
                          "status": {
                            "enum": ["buy", "covered", "checkStock"],
                            "type": "string"
                          },
                          "unit": {
                            "type": ["string", "null"]
                          }
                        },
                        "required": ["name", "notes", "quantity", "sourceRecipeTitles", "unit"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "sectionName": {
                      "type": "string"
                    }
                  },
                  "required": ["items", "sectionName"],
                  "type": "object"
                },
                "type": "array"
              },
              "shopChecks": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "enum": ["poultry", "pork", "eggs", "seafood_form", "cheese_form"],
                      "type": "string"
                    },
                    "label": {
                      "maxLength": 160,
                      "minLength": 1,
                      "type": "string"
                    },
                    "options": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "id": {
                            "maxLength": 20,
                            "minLength": 1,
                            "type": "string"
                          },
                          "label": {
                            "maxLength": 40,
                            "minLength": 1,
                            "type": "string"
                          }
                        },
                        "required": ["id", "label"],
                        "type": "object"
                      },
                      "maxItems": 4,
                      "minItems": 2,
                      "type": "array"
                    },
                    "selected": {
                      "maxLength": 20,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["id", "label", "options", "selected"],
                  "type": "object"
                },
                "type": "array"
              },
              "shopChecksConfirmed": {
                "type": "boolean"
              },
              "shopIntelligence": {},
              "shoppingListId": {
                "type": "string"
              },
              "source": {
                "const": "current_week",
                "type": "string"
              },
              "sourceMenuDraftId": {
                "type": "string"
              }
            },
            "required": ["sections", "shoppingListId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Build a consolidated shopping list"
