        {
          "name": "search_recipes",
          "title": "Search Chop It recipes",
          "description": "Searches Chop It's catalogue of 1,000+ tested recipes and returns recipe cards (title, photo, time, tags, protein) with links into the app. Suits dinner ideas, a named dish, protein, cuisine or dietary need, or ideas built around ingredients the user mentions. Structured filters are hard constraints: 'quick chicken dinners' maps to filters.protein ['chicken'] and filters.maxTimeMins 30. The query text is also parsed for protein, time, dietary and dinner intent as a fallback, and dinner-intent searches leave out sides, dips and starters. limit is the page size (at most 20) and total is every match; pass nextOffset as offset while hasMore is true to read the rest. A query that names nothing in the catalogue returns no recipes and a note. Read-only and available without an account. Search results do not change a menu draft.",
