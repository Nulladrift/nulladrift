                      "dimensions": {
                        "additionalProperties": false,
                        "properties": {
                          "fibre": {
                            "type": "number"
                          },
                          "plants": {
                            "type": "number"
                          },
                          "protein": {
                            "type": "number"
                          }
                        },
                        "required": ["fibre", "plants", "protein"],
                        "type": "object"
                      },
                      "maxScore": {
                        "const": 100,
                        "type": "number"
                      },
                      "rating": {
                        "type": "string"
                      },
                      "score": {
                        "maximum": 100,
                        "minimum": 0,
                        "type": "number"
                      },
                      "warnings": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      }
                    },
                    "required": ["dimensions", "maxScore", "rating", "score", "warnings"],
                    "type": "object"
                  },
                  {
                    "type": "null"
