                    },
                    "unit": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["pantryItemId"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "added": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "ambiguities": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "candidates": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "canonicalName": {
                            "type": "string"
                          },
                          "expiryDate": {
                            "type": ["string", "null"]
                          },
                          "fullness": {
                            "type": ["string", "null"]
                          },
                          "location": {
                            "type": "string"
                          },
                          "name": {
