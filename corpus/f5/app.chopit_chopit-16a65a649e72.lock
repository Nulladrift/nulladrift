        {
          "name": "search_recipes",
          "title": "Search Chop it recipes",
          "description": "Searches Chop it's catalogue of 1,000+ tested recipes and returns recipe cards (title, photo, time, tags, protein) with links into the app. Suits dinner ideas, a named dish, protein, cuisine or dietary need, or ingredients the user mentions. Matches can cover only some ingredients; check the recipe before saying it uses all of them. Structured filters are hard constraints: 'quick chicken dinners' maps to filters.protein ['chicken'] and filters.maxTimeMins 30. The query text is also parsed for protein, time, dietary and dinner intent as a fallback, and dinner-intent searches leave out sides, dips and starters. limit is the page size (at most 20) and total is every match; pass nextOffset as offset while hasMore is true to read the rest. A query that names nothing in the catalogue returns no recipes and a note. Search cards never include method steps. Without an account, results come from the fixed 100-recipe guest preview; a linked account searches the complete catalogue. Read-only and search results do not change a menu draft.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "filters": {
                "additionalProperties": false,
                "properties": {
                  "cuisine": {
                    "type": "string"
                  },
                  "dietary": {
                    "description": "e.g. vegetarian, vegan, gluten-conscious",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "maxTimeMins": {
                    "exclusiveMinimum": 0,
                    "type": "integer"
                  },
                  "minFibreG": {
                    "description": "Minimum credible estimated fibre grams per serving; unknown nutrition is not a match.",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "protein": {
                    "description": "e.g. chicken, beef, fish, veg",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "limit": {
                "default": 8,
                "description": "Page size. total in the result is the whole match count.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Start at 0, then pass nextOffset from the previous page while hasMore is true.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "What to search the Chop it catalogue for, e.g. 'chicken traybake'.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "hasMore": {
                "type": "boolean"
              },
              "nextOffset": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "integer"
