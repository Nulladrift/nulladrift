        {
          "name": "prepare_weekly_menu",
          "title": "Choose a protein mix",
          "description": "Compatibility planning entry point for older callers. create_weekly_menu is the main planner. Returns optional weekly planning configuration as data: the user picks a protein mix (a balanced default is offered, such as 2 chicken, 1 fish and 1 veg for four dinners) and people per dinner, for building the week. The chooser has no priority setting; a priority the user states (quick, healthy, comfort) is passed as the priority parameter. Provides optional mix configuration when the user wants to choose the structure before recipe generation. The default mix is a suggestion shown to the user, not a choice made for them. Returns configuration only: no recipes are chosen and no account is needed; for a signed-in account, its diet (vegetarian, vegan, pescatarian) shapes the mixes offered. When the request already states a counted mix, slotRequirements, a mixPreset or 'surprise me', this tool builds the draft directly, exactly as create_weekly_menu does. Takes the same parameters as create_weekly_menu.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brief": {
                "description": "Free-text brief, e.g. 'quick midweek family dinners, no fish'.",
                "minLength": 1,
                "type": "string"
              },
              "configurationId": {
                "description": "Set by the weekly chooser widget: the chooser this week is built from, so the widget can find it again after a reload.",
                "pattern": "^configure_[0-9a-f-]{36}$",
                "type": "string"
              },
              "dietary": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "dinnersCount": {
                "description": "How many dinners to plan. If omitted, the count named in the brief wins, else 5.",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "excludeRecipeIds": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "focusIngredients": {
                "description": "Only ingredients explicitly named for using up; do not fill from remembered inventory.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "includeRecipeIds": {
                "description": "Recipe ids to pin into the week.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "maxTimeMins": {
                "description": "Global hard cap for EVERY dinner. For quick weeknights plus a slower weekend, use slotRequirements instead.",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "mixPreset": {
                "enum": ["balanced", "plants", "family", "variety"],
                "type": "string"
              },
              "pantryMode": {
                "description": "Task only: default ignore for fresh inspiration; use only when explicitly asked to plan from stock; focus prioritises named ingredients. Never changes the diet, foods to avoid or other lasting preferences.",
                "enum": ["ignore", "use", "focus"],
                "type": "string"
              },
              "priority": {
                "description": "quick and speedy are the same criterion: every dinner within 30 minutes of credible total time. healthy uses the documented per-serving nutrition rule; comfort is the curated comfort style. balanced applies no preference.",
