        {
          "name": "get_shopping_profile",
          "title": "Shopping preferences",
          "description": "Read the household’s opted-in shopping preferences. When given a shopping run, marks verified repeat matches as found on its progress card. In Work, pass search with the supermarket and selected ingredients before browsing. Returns shelf search words for each target. A hint from purchase history applies only to the same named retailer. Pass the delivery country as search.market and the exact siteOrigin. Use the retailer’s local shelf language; preserve original requirements for matching. A line that comes back with ready was bought in an earlier shop at this site and its packs are already worked out for today’s amount: open ready.address directly. If absent, open searchAddress or search ready.title, then try ready.query only if missing. Verify the product ID when supplied, title, size, price and availability, and add ready.packs of it (less any already in the trolley) with no pack check. If that exact product is not on the shelf, or its title or size has changed, shop the line like a new one. When siteGuide.items names a product for a line that is not ready, search its query and pack-check that exact title and size first. Recheck its dated shelf labels and controls against the current website. Keep ready lines in one browser pass, add only each missing quantity, and reconcile the trolley once at the end. For every line that is not ready, recheck products, sizes, prices and stock on the live shelf. Send the shop’s progress reference as runId so its card marks the ready lines found. siteGuide.layout is this supermarket’s page, written by earlier shops: its controls, addresses and notes. Use an address in place of typing or clicking: ready.address opens a ready product directly, and searchAddress opens a line’s first search. If an address fails, use the visible control and correct the page. When siteGuide.pageNeeded is true the supermarket has no page yet: note how it works as you shop and send siteChanges.layout in the shop’s report.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "runId": {
                "description": "The progress reference of this shop. Its card then marks the ready lines found.",
                "format": "uuid",
                "type": "string"
              },
              "search": {
                "additionalProperties": false,
                "properties": {
                  "lines": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "lineId": {
                          "maxLength": 120,
                          "minLength": 1,
                          "type": "string"
                        },
                        "name": {
                          "maxLength": 160,
                          "minLength": 1,
                          "type": "string"
                        },
                        "quantity": {
                          "exclusiveMinimum": 0,
                          "type": "number"
                        },
                        "unit": {
                          "maxLength": 30,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["lineId", "name", "quantity", "unit"],
                      "type": "object"
                    },
                    "maxItems": 100,
                    "minItems": 1,
                    "type": "array"
                  },
                  "market": {
                    "pattern": "^[A-Z]{2}$",
                    "type": "string"
                  },
                  "retailer": {
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["lines", "retailer"],
                "type": "object"
              },
              "siteOrigin": {
                "maxLength": 255,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brands": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "brand": {
                      "type": "string"
                    },
                    "confidence": {
                      "enum": ["confirmed", "inferred", "favourite_only"],
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    }
                  },
                  "required": ["brand", "confidence", "label"],
                  "type": "object"
                },
                "type": "array"
              },
              "learnedAt": {
                "type": "number"
              },
              "learning": {
                "enum": ["unset", "on", "off"],
                "type": "string"
              },
              "learnt": {
                "type": "boolean"
              },
              "message": {
                "type": "string"
              },
              "preferenceCount": {
                "minimum": 0,
                "type": "integer"
              },
              "searches": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "lineId": {
                      "type": "string"
                    },
                    "ready": {
                      "additionalProperties": false,
                      "description": "Bought in an earlier shop at this site, with the packs worked out for today’s amount. Add it without a pack check when the shelf shows exactly this title and size.",
                      "properties": {
                        "address": {
                          "description": "The product’s own page on this site, from the supermarket’s page. Open it instead of searching.",
                          "type": "string"
                        },
                        "approvedBulbForCloves": {
                          "description": "The shopper already chose this single bulb for exactly this clove count. Match its SKU and title. Each, 1 bulb, or a per-item price equal to the selling price with no conflicting pack size all mean that same bulb.",
                          "exclusiveMinimum": 0,
                          "type": "integer"
                        },
                        "packs": {
                          "exclusiveMinimum": 0,
                          "type": "integer"
                        },
                        "productId": {
                          "type": "string"
                        },
                        "query": {
                          "type": "string"
                        },
                        "size": {
                          "type": "string"
                        },
                        "title": {
                          "type": "string"
                        }
                      },
                      "required": ["packs", "query", "size", "title"],
                      "type": "object"
                    },
                    "sameStoreHistory": {
                      "type": "boolean"
                    },
                    "searchAddress": {
                      "description": "The results page for this line’s first search, from the supermarket’s page. Open it instead of typing the search.",
                      "type": "string"
                    },
                    "terms": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["lineId", "sameStoreHistory", "terms"],
                  "type": "object"
                },
                "type": "array"
              },
              "siteGuide": {
                "additionalProperties": false,
                "properties": {
                  "enabled": {
                    "type": "boolean"
                  },
                  "items": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "checkedAt": {
                          "type": "number"
                        },
                        "market": {
                          "pattern": "^[A-Z]{2}$",
                          "type": "string"
                        },
                        "query": {
                          "$ref": "#/properties/siteGuide/properties/layout/properties/notes/items"
                        },
                        "size": {
                          "$ref": "#/properties/siteGuide/properties/layout/properties/notes/items"
                        },
                        "target": {
                          "$ref": "#/properties/siteGuide/properties/layout/properties/notes/items"
                        },
                        "title": {
                          "$ref": "#/properties/siteGuide/properties/layout/properties/notes/items"
                        }
                      },
                      "required": ["checkedAt", "market", "query", "size", "target", "title"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "layout": {
                    "additionalProperties": false,
                    "properties": {
                      "addFromResults": {
                        "description": "True when a pack can be added from the search results without opening the product.",
                        "type": "boolean"
                      },
                      "delivery": {
                        "enum": ["calendar", "day_tabs", "list"],
                        "type": "string"
                      },
                      "favouritesPath": {
                        "description": "The path of the page listing what this account has bought before, when the site has one.",
                        "maxLength": 200,
                        "minLength": 1,
                        "pattern": "^\\/(?!\\/)[A-Za-z0-9\\-._~/?=&%+{}]*$",
                        "type": "string"
                      },
                      "moreResults": {
                        "enum": ["scroll", "pages", "load_more", "single_page"],
                        "type": "string"
                      },
                      "notes": {
                        "description": "Up to six short notes for the next shop here: what slowed you down and how to avoid it. Plain words, no addresses.",
                        "items": {
                          "maxLength": 160,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 6,
                        "type": "array"
                      },
                      "productPath": {
                        "description": "The path of a product page that opens from the product ID alone, marked {productId}. Leave out when the address needs more than the ID.",
                        "maxLength": 200,
                        "minLength": 1,
                        "pattern": "^\\/(?!\\/)[A-Za-z0-9\\-._~/?=&%+{}]*$",
                        "type": "string"
                      },
                      "quantity": {
                        "enum": ["stepper", "select", "field"],
                        "type": "string"
                      },
                      "search": {
                        "enum": ["field", "button", "menu"],
                        "type": "string"
                      },
                      "searchPath": {
                        "description": "The path of a search results page with the search words marked {query}, such as /search?q={query}. Only after opening one this way.",
                        "maxLength": 200,
                        "minLength": 1,
                        "pattern": "^\\/(?!\\/)[A-Za-z0-9\\-._~/?=&%+{}]*$",
                        "type": "string"
                      },
                      "trolley": {
                        "enum": ["link", "button", "menu"],
                        "type": "string"
                      },
                      "trolleyPath": {
                        "description": "The path of the full trolley page.",
                        "maxLength": 200,
                        "minLength": 1,
                        "pattern": "^\\/(?!\\/)[A-Za-z0-9\\-._~/?=&%+{}]*$",
                        "type": "string"
                      }
                    },
                    "required": ["moreResults", "search"],
                    "type": "object"
                  },
                  "pageNeeded": {
                    "description": "True when this supermarket has no page yet: record siteChanges.layout in this shop’s report.",
                    "type": "boolean"
                  },
                  "version": {
                    "format": "uuid",
                    "type": "string"
                  }
                },
                "required": ["enabled"],
                "type": "object"
              },
              "source": {
                "additionalProperties": false,
                "properties": {
                  "coverage": {
                    "maxLength": 160,
                    "minLength": 2,
                    "type": "string"
                  },
                  "retailer": {
                    "maxLength": 40,
                    "minLength": 2,
                    "type": "string"
                  }
                },
                "required": ["coverage", "retailer"],
                "type": "object"
              },
              "standards": {
                "additionalProperties": false,
                "properties": {
                  "beef_lamb": {
                    "enum": ["standard", "organic"],
                    "type": "string"
                  },
                  "dairy": {
                    "enum": ["standard", "organic"],
                    "type": "string"
                  },
                  "eggs": {
                    "enum": ["standard", "free_range", "organic"],
                    "type": "string"
                  },
                  "fish": {
                    "enum": ["standard", "msc", "organic"],
                    "type": "string"
                  },
                  "pork": {
                    "enum": ["standard", "free_range", "outdoor_bred", "organic"],
                    "type": "string"
                  },
                  "poultry": {
                    "enum": ["standard", "free_range", "organic"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "usuals": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "usualsCount": {
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["brands", "learning", "learnt", "message", "preferenceCount", "standards", "usuals", "usualsCount"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Shopping preferences"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
