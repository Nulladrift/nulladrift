        {
          "name": "update_food_preferences",
          "title": "Change food preferences",
          "description": "Changes the account's food preferences: diet, foods to avoid and dislikes, in plain words. Omitted fields keep their current value; a supplied list replaces that list whole, so a change to one item is sent as the full updated list (get_food_preferences gives the current one). Returns the saved preferences. They apply to the next planning, search or recipe call on every surface: recipes that use these foods are left out. Chop It leaves out the foods a person chooses but is not built for managing allergies, and never describes a recipe, plan or list as safe for one. Idempotent. Requires a linked Chop It account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "diet": {
                "description": "The whole-week diet. Omit to keep the current one.",
                "enum": ["none", "vegetarian", "vegan", "pescatarian"],
                "type": "string"
              },
              "dislikes": {
                "description": "The complete list of other foods the household doesn't eat, in plain words ('mushrooms', 'coriander'). Omit to keep the current list; pass [] to clear it.",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "foodsToAvoid": {
                "description": "The complete list of the fourteen common foods to leave out; recipes using them are left out. Omit to keep the current list; pass [] to clear it.",
                "items": {
                  "enum": ["milk", "eggs", "fish", "crustaceans", "molluscs", "peanuts", "tree nuts", "sesame", "soya", "gluten", "celery", "mustard", "lupin", "sulphites"],
                  "type": "string"
                },
                "maxItems": 14,
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "diet": {
                "enum": ["none", "vegetarian", "vegan", "pescatarian"],
                "type": "string"
              },
              "dislikes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "foodsToAvoid": {
                "items": {
                  "enum": ["milk", "eggs", "fish", "crustaceans", "molluscs", "peanuts", "tree nuts", "sesame", "soya", "gluten", "celery", "mustard", "lupin", "sulphites"],
                  "type": "string"
                },
                "type": "array"
              },
              "summary": {
                "type": "string"
              }
            },
            "required": ["diet", "dislikes", "foodsToAvoid", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
