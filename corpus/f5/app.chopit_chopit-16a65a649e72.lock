          "meta": {
            "openai/toolInvocation/invoked": "Saved weeks checked",
            "openai/toolInvocation/invoking": "Looking through your saved weeks…",
            "securitySchemes": [
              {
                "scopes": ["openid", "email", "profile", "offline_access"],
