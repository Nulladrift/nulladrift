                            "type": "boolean"
                          },
                          "lineId": {
                            "type": "string"
                          },
                          "name": {
                            "type": "string"
                          },
                          "notes": {
                            "type": ["string", "null"]
                          },
                          "purchaseQuantity": {
                            "type": ["number", "null"]
                          },
                          "quantity": {
                            "type": ["number", "null"]
                          },
                          "remainingQuantity": {
                            "type": ["number", "null"]
                          },
                          "retailerTarget": {
                            "anyOf": [
                              {
                                "additionalProperties": false,
                                "properties": {
                                  "name": {
                                    "type": "string"
                                  },
                                  "quantity": {
                                    "type": "number"
                                  },
                                  "unit": {
                                    "type": "string"
                                  }
                                },
                                "required": ["name", "quantity", "unit"],
                                "type": "object"
