        {
          "name": "analyse_saved_weeks",
          "title": "Count and compare saved weeks",
          "description": "Answers how many Saved Weeks the user has and how many repeat the same meals in one read-only data response, without opening the app or creating drafts. Compares every stored recipe ID, ignoring week titles and dinner order, and reports serving-setting differences and unknown portions separately. Empty weeks are counted separately. Counts are returned by default. includeGroups adds up to 50 duplicate week references; nextOffset continues those references and expectedRevision accepts the previous analysisRevision to detect changed data. Reads the complete account library on the server, without loading full recipes, images, nutrition or shopping data. Requires a linked Chop It account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "expectedRevision": {
                "description": "analysisRevision from the previous page; a changed analysis is refused so pagination can restart.",
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "includeGroups": {
                "description": "Include a page of duplicate week names and IDs; counts alone are returned by default.",
                "type": "boolean"
              },
              "offset": {
                "description": "Offset over duplicate week references, using nextOffset from the previous page.",
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "analysisRevision": {
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "complete": {
                "const": true,
                "description": "All owner-scoped rows were enumerated and checked against exact counts. This is not a transactional snapshot.",
                "type": "boolean"
              },
              "duplicateGroupCount": {
                "minimum": 0,
                "type": "integer"
              },
              "emptyWeeks": {
                "minimum": 0,
                "type": "integer"
              },
              "extraCopies": {
                "description": "Weeks beyond one per matching meal-selection group; not necessarily identical serving settings.",
                "minimum": 0,
                "type": "integer"
              },
              "groups": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "dinnerCount": {
                      "exclusiveMinimum": 0,
                      "type": "integer"
                    },
                    "groupId": {
                      "type": "string"
                    },
                    "hasUnknownServings": {
                      "type": "boolean"
                    },
                    "servingSettingsMatch": {
                      "description": "The stored week defaults and per-recipe overrides match; unknown values do not prove equal portion sizes.",
                      "type": "boolean"
                    },
                    "weekCount": {
                      "minimum": 2,
                      "type": "integer"
                    },
                    "weeks": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "savedWeekId": {
                            "type": "string"
                          },
                          "title": {
                            "type": "string"
                          }
                        },
                        "required": ["savedWeekId", "title"],
                        "type": "object"
                      },
                      "maxItems": 50,
                      "minItems": 1,
                      "type": "array"
                    }
                  },
                  "required": ["dinnerCount", "groupId", "hasUnknownServings", "servingSettingsMatch", "weekCount", "weeks"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              },
              "groupsIncluded": {
                "type": "boolean"
              },
              "groupsWithDifferentServingSettings": {
                "minimum": 0,
                "type": "integer"
              },
              "groupsWithUnknownServings": {
                "minimum": 0,
                "type": "integer"
              },
              "hasMore": {
                "type": "boolean"
              },
              "nextOffset": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "note": {
                "type": "string"
              },
              "offset": {
                "minimum": 0,
                "type": "integer"
              },
              "pageSize": {
                "const": 50,
