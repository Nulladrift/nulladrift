                "description": "True only after the user explicitly approves 1 credit once the 10 free weekly imports are exhausted.",
                "type": "boolean"
              },
              "imageUrl": {
                "description": "http(s) URL of a photo of the recipe — a cookbook page, screenshot, or handwritten card. Must be a fetchable link; if the fetch fails, fall back to import_recipe_from_url with the recipe text as caption.",
                "format": "uri",
                "type": "string"
              },
              "requestId": {
                "description": "Generate a unique ID before starting a new import. Reuse it until that import completes, including confirmation and recovery; a later new import needs a new ID.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["imageUrl"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
