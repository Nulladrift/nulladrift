        {
          "name": "update_pantry",
          "title": "Update the pantry",
          "description": "Updates the user's Chop it pantry from what they've bought, have or used up: add items (topping up existing ones), remove by name, change or remove exact rows by pantryItemId, or confirm that items are still there. confirm marks a whole location (the fridge, say) or exact rows as checked today, and with freshToday as bought or restocked today; it changes no amounts and needs no get_pantry first. On add, location places stock directly in pantry, fridge or freezer; only compatible items in that location are topped up. Omit unknown quantities or expiry dates rather than guessing. Read back before retrying a top-up, which is additive. An ambiguous item returns its candidates without changing that item; other unambiguous items in the request can still change. Staples such as salt, pepper and oil are skipped. Edits the same pantry the app shows. Requires a linked Chop it account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "add": {
                "description": "Items to add (or top up when already present).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "expiryDate": {
                      "description": "ISO date the item should be used by, if known.",
                      "type": "string"
                    },
                    "location": {
                      "description": "Use the location the user identifies. Omit only when unknown; then the usual storage location is inferred.",
                      "enum": ["pantry", "fridge", "freezer"],
                      "type": "string"
                    },
                    "name": {
                      "description": "Ingredient name, UK vocabulary (coriander, courgette, mince).",
                      "minLength": 1,
                      "type": "string"
                    },
                    "quantity": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "unit": {
                      "description": "e.g. g, kg, ml, tins",
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              },
              "confirm": {
                "additionalProperties": false,
                "description": "Mark items as still there, checked today, as the app’s Check my Pantry does. Use for \"refresh my fridge\" or \"these are all fresh from today\". Changes no amounts.",
                "properties": {
                  "freshToday": {
                    "description": "True when the items were bought or restocked today: their Added date becomes today as well.",
                    "type": "boolean"
                  },
                  "location": {
                    "description": "Every item stored there, such as the whole fridge.",
                    "enum": ["pantry", "fridge", "freezer"],
                    "type": "string"
                  },
                  "pantryItemIds": {
                    "description": "Exact pantryItemIds from get_pantry.",
                    "items": {
                      "format": "uuid",
                      "type": "string"
                    },
                    "maxItems": 300,
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "remove": {
                "description": "Ingredient names to remove; matched on the same canonical key the app uses.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "removeItemIds": {
                "description": "Exact pantryItemIds from get_pantry to delete. Preferred for duplicate names.",
                "items": {
                  "format": "uuid",
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "update": {
                "description": "Set fields on an exact row; quantity replaces rather than adds.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "fullness": {
                      "enum": ["plenty", "some", "low"],
                      "type": "string"
                    },
                    "location": {
                      "enum": ["pantry", "fridge", "freezer"],
                      "type": "string"
                    },
                    "pantryItemId": {
                      "format": "uuid",
                      "type": "string"
                    },
                    "quantity": {
                      "anyOf": [
                        {
                          "minimum": 0,
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "unit": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["pantryItemId"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "added": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "ambiguities": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "candidates": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "canonicalName": {
                            "type": "string"
                          },
                          "expiryDate": {
                            "type": ["string", "null"]
                          },
                          "fullness": {
                            "type": ["string", "null"]
