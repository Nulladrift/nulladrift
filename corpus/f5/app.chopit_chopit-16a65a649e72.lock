          "name": "update_recipe",
          "title": "Review or edit my recipes",
          "description": "For a user-requested food photo, use the chat host’s own image tool and then attach its actual file with recipeId and photo only. Attachment costs no Chop it credits and changes only the photo; never call a paid generation/import route or invent a file URL. Reviews changes to 1–20 recipes with action preview and changes; read every library page first for whole-library work. mode update tidies only titles, descriptions and tags. mode copy creates separate private recipes, protecting originals and all existing plans. Adaptations need complete ingredients and steps together, including serving changes; preserve optional garnishes. Show the exact preview, then action apply with changeSetId and confirmed true only after user approval. Retry the same ID to recover its receipt; never create a fresh batch after an uncertain write. Conflicts change nothing and require a fresh review. Metadata-only batches support confirmed undo for 24 hours if unchanged; undo never deletes copies. Omitting action retains the immediate single-recipe edit for an explicitly requested change to an original. Copies and reviews make no AI call or credit debit. Requires a linked Chop it account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "Preview a bounded batch or separate recipe copies, then apply its changeSetId only after the user approves. Undo a metadata batch only while its results are unchanged. Omit for the existing single-recipe edit.",
                "enum": ["preview", "apply", "undo"],
                "type": "string"
              },
              "changeSetId": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "changes": {
                "description": "Exact recipes and complete requested changes. Update permits only title, description and tags. Culinary changes use copy, preserving every original recipe and plan. Collect the full library before proposing batches.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "cookTimeMins": {
                      "$ref": "#/properties/cookTimeMins"
                    },
                    "description": {
                      "$ref": "#/properties/description"
                    },
                    "finishingTouch": {
                      "$ref": "#/properties/finishingTouch"
                    },
                    "ingredientSections": {
                      "$ref": "#/properties/ingredientSections"
                    },
                    "mode": {
                      "default": "copy",
                      "enum": ["update", "copy"],
                      "type": "string"
                    },
                    "prepTimeMins": {
                      "$ref": "#/properties/prepTimeMins"
                    },
                    "recipeId": {
                      "$ref": "#/properties/recipeId"
                    },
                    "servings": {
                      "$ref": "#/properties/servings"
                    },
                    "steps": {
                      "$ref": "#/properties/steps"
                    },
                    "tags": {
                      "$ref": "#/properties/tags"
                    },
                    "title": {
                      "$ref": "#/properties/title"
                    }
                  },
                  "required": ["recipeId"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "confirmed": {
                "description": "True only after the user approves the displayed preview or undo. A preview itself grants no permission.",
                "type": "boolean"
              },
              "cookTimeMins": {
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "description": {
                "description": "New one-sentence description of the finished dish.",
                "type": "string"
              },
              "finishingTouch": {
                "description": "One vivid sentence describing the plated dish.",
                "type": "string"
              },
              "ingredientSections": {
                "description": "Replaces the WHOLE ingredient list — send every ingredient, not only the changed ones.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "items": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "name": {
                            "description": "Ingredient name, UK vocabulary (coriander, courgette, mince).",
                            "minLength": 1,
                            "type": "string"
                          },
                          "notes": {
                            "description": "Prep notes, e.g. 'finely sliced'.",
                            "type": "string"
                          },
                          "optional": {
                            "description": "True for a garnish or 'to serve' accompaniment: kept off the shopping list and out of nutrition scoring. Leave unset if unsure.",
                            "type": "boolean"
                          },
                          "quantity": {
                            "description": "Metric quantity as text, e.g. '500 g', '2 tbsp', '1 large'.",
                            "type": "string"
                          }
                        },
                        "required": ["name"],
                        "type": "object"
                      },
                      "minItems": 1,
                      "type": "array"
                    },
                    "title": {
                      "description": "Section label, e.g. 'The crispy chicken' or 'To serve'.",
                      "type": "string"
                    }
                  },
                  "required": ["items"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "photo": {
                "additionalProperties": false,
                "description": "Attach the user's chosen or chat-generated food photo to this owned recipe, with no Chop it credit charge. Send recipeId and photo only, not batch actions or text edits. Use the actual file supplied by the host; never invent a download URL.",
                "properties": {
                  "download_url": {
                    "format": "uri",
                    "type": "string"
                  },
                  "file_id": {
                    "maxLength": 512,
                    "minLength": 1,
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "prepTimeMins": {
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "recipeId": {
                "description": "Id of one of the user's own saved recipes (from list_saved_recipes).",
                "type": "string"
              },
              "servings": {
                "description": "New serving count.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "steps": {
                "description": "Replaces the WHOLE method — send every step, not only the changed ones.",
                "items": {
                  "minLength": 3,
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "tags": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "title": {
                "description": "New title, plain title case, no marketing words.",
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
