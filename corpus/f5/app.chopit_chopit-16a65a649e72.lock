                          },
                          "quantity": {
                            "type": ["number", "null"]
                          },
                          "unit": {
                            "type": ["string", "null"]
                          }
                        },
                        "required": ["canonicalName", "expiryDate", "fullness", "location", "name", "pantryItemId", "quantity", "unit"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["candidates", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "appUrl": {
                "type": "string"
              },
              "merged": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
