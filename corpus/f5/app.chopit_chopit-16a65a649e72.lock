                      "type": "boolean"
                    },
                    "nutrition": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "carbsG": {
                              "type": ["number", "null"]
                            },
                            "coveragePercent": {
                              "type": ["number", "null"]
                            },
                            "fatG": {
                              "type": ["number", "null"]
                            },
                            "fibreG": {
                              "type": ["number", "null"]
                            },
                            "kcal": {
                              "type": ["number", "null"]
                            },
                            "proteinG": {
                              "type": ["number", "null"]
                            }
