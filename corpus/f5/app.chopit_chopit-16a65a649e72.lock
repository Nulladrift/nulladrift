          "description": "Returns one complete recipe by recipeId: ingredients with quantities, method steps, timings and photo. Accepts IDs from search_recipes, a menu draft, a week or list_saved_recipes. Without an account, full ingredients and method are available only for the fixed 100-recipe guest preview and are subject to a small hourly detail budget; a linked account can read up to 20 distinct full catalogue recipes per rolling 24 hours, shared across sessions and catalogue copy/share tools. Repeat admitted reads do not use another place. Own saved recipes remain available. Bulk exports require business access. servings scales simple ingredient amounts (the app's Shop list rounding); scaledFrom holds the written count. If scalingNote is present, amounts embedded in the instructions need review: the whole recipe stays at its returned original servings. Do not claim it was adapted; review ingredients and method together before a separate copy; the returned servings describe the recipe's actual portions. Garnishes and 'to serve' ingredients carry optional: true. nutrition holds per-serving kcal, protein, carbs, fat and fibre when the catalogue can vouch for them (an estimate, not medical advice); nutritionNote says why they are withheld otherwise. Read-only.",
