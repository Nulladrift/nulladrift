                          "required": ["carbsG", "coveragePercent", "fatG", "fibreG", "kcal", "proteinG"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "oneLiner": {
                      "type": ["string", "null"]
                    },
                    "plantCount": {
                      "type": ["number", "null"]
                    },
                    "protein": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "recipeId": {
                      "type": "string"
                    },
                    "servings": {
                      "type": ["number", "null"]
                    },
                    "tags": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "title": {
                      "type": "string"
                    },
                    "totalTimeMins": {
                      "type": ["number", "null"]
