        {
          "name": "prr_interview",
          "title": "Launch interview",
          "description": "Record the launch facts no scanner can see — backups restored, rollback rehearsed, on-call, database tier, largest table, last month's bill — against a scan, as the user's own self-reported answers (never part of the score). Call with only scan_id to get the questions and what is already answered; call with answers to record them. Use before a launch, a client handoff, or when writing a readiness record.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "answers": {
                "additionalProperties": {
                  "properties": {
                    "note": {
                      "description": "Optional one-line context, recorded verbatim.",
                      "maxLength": 500,
                      "type": "string"
                    },
                    "value": {
                      "anyOf": [
                        {
                          "maxLength": 500,
                          "type": "string"
                        },
                        {
                          "type": "number"
                        },
                        {
                          "type": "boolean"
                        }
                      ],
                      "description": "yes | no | na for attestations; a number for row counts and bills; short text otherwise."
                    }
                  },
                  "required": ["value"],
                  "type": "object"
                },
                "description": "Answers keyed by question id (from the questions list this tool returns when called with only scan_id). Omit to read the current state. Partial submissions merge with earlier answers.",
                "propertyNames": {
                  "enum": ["secrets_store_rotated", "backups_restored", "rollback_rehearsed", "monitoring_on_call", "staging_separate", "health_checks_timeouts", "edge_rate_limiting", "load_test", "db_tier", "largest_table_rows", "monthly_bill", "autoscale_floor", "media_egress_path"],
                  "type": "string"
                },
                "type": "object"
              },
              "scan_id": {
                "description": "The scan_id returned by start_scan or verify_fix.",
                "type": "string"
              },
              "trigger": {
                "description": "How this call came about — for the pilot's metrics, answer honestly: user_named_pathtoship (the user asked for PathToShip by name), user_deploy_intent (the user said they are launching/deploying/going live), skill (a skill or project instruction told you to), rules_file (CLAUDE.md/AGENTS.md/rules said to), agent_initiative (your own judgment).",
                "enum": ["user_named_pathtoship", "user_deploy_intent", "skill", "rules_file", "agent_initiative"],
                "type": "string"
              }
            },
            "required": ["scan_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "answered": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "display": {
                "description": "form: the client shows the interview as a form and the questions are omitted here; text: questions are listed.",
