      "instructions": "Call check_token with a Base ERC-20 contract address before an agent or app interacts with, lists or accepts a token. Returns SAFE / CAUTION / DANGER with a score; reasons and evidence are on the paid x402 routes.",
      "tools": [
        {
          "name": "check_token",
          "title": "Base ERC-20 token safety check",
          "description": "Safety verdict for a Base (chain 8453) ERC-20 token: SAFE / CAUTION / DANGER with a 0-100 score, from a simulated buy-transfer-sell (honeypot and tax detection), owner powers, proxy, liquidity, holders, verification and age. Free preview tier: verdict, score and flag counts. The paid x402 endpoints /v1/lite ($0.005), /v1/quick ($0.015) and /v1/deep ($0.05) add the reasons and evidence. SAFE is not a guarantee and not financial advice.",
          "inputSchema": {
            "properties": {
              "token": {
                "description": "Base (chain 8453) ERC-20 contract address, e.g. 0x532f27101965dd16442E59d40670FaF5eBB142E4",
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
