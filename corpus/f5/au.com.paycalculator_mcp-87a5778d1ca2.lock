        {
          "name": "inflation",
          "title": "Inflation",
          "description": "Works out what an income needs to become to keep up with inflation (consumer price index) between two months, and what the unchanged income is worth after inflation, as the paycalculator.com.au inflation calculator does. Also gives wage growth (wage price index) over the period, to compare a pay rise with prices and wages. Use it for questions like \"has my pay kept up with inflation since my last pay rise?\" or \"what will $80,000 be worth in 2028?\". Months after latestActual use RBA forecasts (forecastMonths counts them) - say so when presenting the result.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "from": {
                "description": "Start month, e.g. \"Mar 2021\" or \"2021-03\" - e.g. the date of the last pay rise.",
                "type": "string"
              },
              "income": {
                "description": "The income (or any amount) at the \"from\" month.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "to": {
                "description": "End month, after \"from\". Defaults to this month. Can be in the future, up to the end of the RBA forecasts.",
                "type": "string"
              }
            },
            "required": ["from", "income"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "adjustedIncome": {
                "description": "The income needed at \"to\" to buy the same as the income did at \"from\".",
                "type": "number"
              },
              "effectiveIncome": {
                "description": "What the unchanged income buys at \"to\", in \"from\" dollars.",
                "type": "number"
              },
              "forecastMonths": {
                "description": "Number of months in the period that use forecasts.",
                "type": "number"
              },
              "from": {
                "type": "string"
              },
              "income": {
                "type": "number"
              },
              "latestActual": {
                "description": "The latest actual CPI figure; later months are RBA forecasts.",
                "type": "string"
              },
              "priceGrowth": {
                "description": "Total rise in prices over the period (%).",
                "type": "number"
              },
              "source": {
                "type": "string"
              },
              "to": {
                "type": "string"
              },
              "wageGrowth": {
                "description": "Total rise in wages (wage price index) from \"from\" to wageGrowthTo (%).",
                "type": "number"
              },
              "wageGrowthTo": {
                "description": "Wage growth uses actual figures only, so it may stop before \"to\".",
                "type": "string"
              }
