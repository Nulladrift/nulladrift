{
  "lockfileVersion": 2,
  "subjects": {
    "au.com.paycalculator/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.paycalculator.com.au/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "paycalculator",
        "version": "1.0.7"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "calculate_pay",
          "title": "Calculate pay",
          "description": "Calculates Australian take-home pay, income tax, Medicare and superannuation using the paycalculator.com.au engine. Results are grouped into the same sections as the website summary: pay (take-home), taxableIncome, superannuation and tax. Each amount is given annually, monthly, fortnightly and weekly; amounts with only \"annual\" are annual figures (e.g. tax offsets). Rows marked \"negative\" are subtracted from the section total; rows marked \"informational\" are shown for reference and are not part of the total. Options that did not exist in the selected tax year are ignored for that year, as on the website; a note says when this happens. \"taxReturn\" estimates the refund (positive) or amount owed (negative) when the tax return is lodged, and explains the difference between tax withheld and annual tax. \"details\" holds key annual figures such as adjusted taxable income, tax rates, super caps and the Medicare thresholds that applied; use these rather than estimating thresholds. \"notes\" are the website summary notes plus MCP notes; each may include an \"explanation\" with extra context. Pass relevant notes on to the user. Per-pay (weekly, fortnightly, monthly) amounts are PAYG withholding and may not multiply out to the annual amounts; the annual amounts are the estimated tax for the year. Explain any difference rather than presenting them as consistent. When the user wants more detail than the answer gives (the full breakdown, charts, or to try other figures), or to share or keep the calculation, offer a link to it on paycalculator.com.au (shareLink). Offer it when it would help; do not add it to every answer. Results are estimates, not financial advice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "allowances": {
                "description": "Allowances paid by the employer on top of the salary. Added to the take-home pay; taxable allowances are also added to taxable income.",
                "properties": {
                  "amount": {
                    "description": "The allowance paid each period (see frequency).",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "frequency": {
                    "description": "How often the amount is paid. Defaults to \"annually\".",
                    "enum": ["annually", "monthly", "fortnightly", "weekly"],
                    "type": "string"
                  },
                  "taxable": {
                    "description": "Most allowances (e.g. tool, uniform, shift, first aid, car allowances) are taxable: taxed with each pay and part of ordinary time earnings, so super is paid on them. Set false only for allowances that are not taxed, e.g. reasonable travel or overtime meal allowances within the ATO limits. Defaults to true.",
                    "type": "boolean"
                  }
                },
                "required": ["amount"],
                "type": "object"
              },
              "bonus": {
                "description": "Bonus pay. Give amount (with frequency) or percentOfSalary. The bonus details, including any assumed values, are in details.bonus.",
                "properties": {
                  "amount": {
                    "description": "The bonus paid each period (see frequency), e.g. 10000 for a $10,000 annual bonus.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "frequency": {
                    "description": "How often the bonus amount is paid. Defaults to \"annually\". An annual bonus is not part of each pay; a monthly bonus is part of each monthly pay, and so on.",
                    "enum": ["annually", "monthly", "fortnightly", "weekly"],
                    "type": "string"
                  },
                  "includesSuper": {
                    "description": "Whether the bonus includes the Super Guarantee (super is taken out of it) or super is paid on top. Defaults to the same as superannuation.includedInSalary.",
                    "type": "boolean"
                  },
                  "percentOfSalary": {
                    "description": "Instead of amount: the annual bonus as a percentage of the salary (excluding super and overtime), e.g. 10 for 10%. Paid as part of each pay.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "salarySacrifice": {
                    "description": "Set true to salary sacrifice the bonus to super (up to the remaining concessional cap). Defaults to false.",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "deductions": {
                "description": "Annual tax deductions. From 2026-27, Australian residents with work income automatically get a $1,000 standard deduction for work-related expenses with no records needed; it is included without this input. Not available to foreign residents or working holiday makers. The deductions used and the tax saving are in details.deductions.",
                "properties": {
                  "other": {
                    "description": "Other deductions claimed on top, e.g. donations, tax agent fees, union and professional fees, income protection insurance, investment costs.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "workRelated": {
                    "description": "Work-related expenses claimed with records, e.g. car, travel, uniform, laundry, working from home, tools. Only give this if it is more than the standard deduction; the larger amount is used.",
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "familyTaxBenefit": {
                "description": "Family Tax Benefit Part A and Part B: a Centrelink payment worked out from family adjusted taxable income (this person plus the spouse income given in \"spouse\") and the children. It is not part of pay or tax and is shown for reference. Australian residents only. Estimate only - Services Australia works out the actual amount. Do not explain the income tests unless asked. The amounts are in details.familyTaxBenefit.",
                "properties": {
                  "careShare": {
                    "description": "Percentage of the time the children are in this person's care: below 35% there is no FTB, 35-65% is shared care, above 65% is the full rate. Defaults to 100.",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "childSupportReceived": {
                    "description": "Annual child support (maintenance) the family receives; it reduces FTB Part A above a free area. Defaults to 0.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "childrenAges": {
                    "description": "Age of each child, e.g. [3, 7]. Children aged 16 to 19 count only if they are in full-time secondary study.",
                    "items": {
                      "maximum": 19,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": ["childrenAges"],
                "type": "object"
              },
              "fringeBenefits": {
                "description": "Fringe benefits from the employer. The reportable amount is not taxed but is added to adjusted taxable income, which affects the Medicare levy surcharge, student loan repayments, Division 293 and some offsets. Give taxableValue, reportableAmount or both. The values used are in details.fringeBenefits. When salary packaged, super is worked out on the salary after packaging (the legal minimum). Novated leases are not included.",
                "properties": {
                  "frequency": {
                    "description": "How often the taxableValue applies. Defaults to \"annually\".",
                    "enum": ["annually", "monthly", "fortnightly", "weekly"],
                    "type": "string"
                  },
                  "reportableAmount": {
                    "description": "The reportable fringe benefits amount, if known (shown on the income statement). Otherwise it is worked out from taxableValue: the grossed-up value when it is over the $2,000 threshold.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "salaryPackaged": {
                    "description": "Set true when the benefits are paid from the salary (salary packaging, e.g. hospital, public benevolent institution or charity packaging): they are taken off taxable income and the cash pay. Defaults to false (benefits provided on top of the salary).",
                    "type": "boolean"
                  },
                  "taxableValue": {
                    "description": "The taxable value of the fringe benefits for each period (see frequency), before any gross-up.",
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "income": {
                "description": "Base pay.",
                "properties": {
                  "amount": {
                    "description": "Gross pay before tax for the given frequency, excluding super. For \"daily\" it is the day rate and for \"hourly\" the hourly rate.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "frequency": {
                    "description": "How often the amount is paid, or \"daily\" / \"hourly\" for a day or hourly rate. Defaults to \"annually\".",
                    "enum": ["annually", "monthly", "fortnightly", "weekly", "daily", "hourly"],
                    "type": "string"
                  },
                  "payPeriods": {
                    "description": "How an annual or monthly salary is divided into weekly and fortnightly pay. Most payrolls divide by 52 weeks or 26 fortnights (\"standard\"). A year is slightly longer than 52 weeks, so some payroll systems use the average number of weeks or fortnights in a year, allowing for leap years (365.25 days: 52.1786 weeks or 26.0893 fortnights), which gives slightly smaller weekly and fortnightly pays (\"exact\"). Only use \"exact\" if the user says their payroll does this; do not raise or explain it otherwise. Ignored for weekly, fortnightly, daily and hourly pay. Defaults to \"standard\".",
                    "enum": ["standard", "exact"],
                    "type": "string"
                  }
                },
                "required": ["amount"],
                "type": "object"
              },
              "medicare": {
                "description": "Medicare levy, surcharge and family circumstances. Omit for a single person with private hospital cover and no exemption.",
                "properties": {
                  "applyAdjustment": {
                    "description": "Lodge a Medicare levy variation declaration to reduce tax withheld when eligible for a family Medicare levy reduction. Only has an effect when eligible. Defaults to false.",
                    "type": "boolean"
                  },
                  "childSupport": {
                    "description": "Annual child support paid. Only used when there are dependants; reduces adjusted taxable income.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "dependants": {
                    "description": "Number of dependant children. Increases the Medicare levy and surcharge family thresholds. Defaults to 0.",
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "exemption": {
                    "description": "Medicare levy exemption, e.g. for certain foreign residents or people not entitled to Medicare benefits. Defaults to \"none\".",
                    "enum": ["none", "half", "full"],
                    "type": "string"
                  },
                  "privateHealthInsurance": {
                    "description": "Whether there is an appropriate level of private hospital cover. Set false to include the Medicare levy surcharge where income is above the surcharge threshold. Defaults to true.",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "novatedLease": {
                "description": "Novated car lease paid from the salary: mostly before tax, which reduces taxable income. Any FBT is assumed to be passed on through the salary. The amounts before and after tax, FBT and the reportable amount are in details.novatedLease. Do not explain FBT rules unless asked.",
                "properties": {
                  "carValue": {
                    "description": "The car's purchase price including GST, excluding registration and stamp duty (its FBT base value).",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "electric": {
                    "description": "Set true for an eligible zero or low emissions car (battery electric or hydrogen; plug-in hybrids are not eligible from 1 April 2025): exempt from FBT if at or below the luxury car tax threshold, but still reportable. Defaults to false.",
                    "type": "boolean"
                  },
                  "employeeContribution": {
                    "description": "Employee contribution method: part of the cost is paid after tax to remove FBT, as most leases do. Defaults to true.",
                    "type": "boolean"
                  },
                  "leasePayment": {
                    "description": "Lease (finance) payments. If only a total package cost per pay is known, put it here and omit runningCosts.",
                    "properties": {
                      "amount": {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      "frequency": {
                        "description": "Defaults to \"annually\".",
                        "enum": ["annually", "monthly", "fortnightly", "weekly"],
                        "type": "string"
                      }
                    },
                    "required": ["amount"],
                    "type": "object"
                  },
                  "notForProfit": {
                    "description": "Not-for-profit employer with an FBT exemption cap ($30,000 for public benevolent institutions and health promotion charities, $17,000 for hospitals and ambulance services).",
                    "enum": ["publicBenevolentInstitution", "healthPromotionCharity", "hospital", "ambulance"],
                    "type": "string"
                  },
                  "runningCosts": {
                    "description": "Running costs paid through the lease: fuel or charging, insurance, servicing, tyres, registration.",
                    "properties": {
                      "amount": {
                        "minimum": 0,
                        "type": "number"
                      },
                      "frequency": {
                        "description": "Defaults to \"annually\".",
                        "enum": ["annually", "monthly", "fortnightly", "weekly"],
                        "type": "string"
                      }
                    },
                    "required": ["amount"],
                    "type": "object"
                  },
                  "superOnFullSalary": {
                    "description": "Set true if the employer pays super on the salary before the lease is taken out. Defaults to false: super is worked out on the reduced salary (the legal minimum).",
                    "type": "boolean"
                  }
                },
                "required": ["carValue", "leasePayment"],
                "type": "object"
              },
              "otherIncome": {
                "description": "Annual income other than salary. It is not part of each pay, so no tax is withheld on it: the extra tax (or the reduction for a loss) shows in taxReturn as an amount owed or refunded. Each type is shown in the taxableIncome rows.",
                "properties": {
                  "business": {
                    "properties": {
                      "includesGST": {
                        "description": "Set true if the income includes GST; it is taken off. Defaults to false.",
                        "type": "boolean"
                      },
                      "income": {
                        "description": "Net business income (profit) of a sole trader or small business.",
                        "minimum": 0,
                        "type": "number"
                      },
                      "loss": {
                        "description": "Business loss from this year or carried forward.",
                        "minimum": 0,
                        "type": "number"
                      },
                      "smallBusinessOffset": {
                        "description": "Small business income tax offset: 16% of the income tax on the net small business income, up to $1,000 a year. Applied by default. Set false if the business has an aggregated turnover of $5 million or more, or the income is personal services income (e.g. a contractor paid mainly for their own skills who is not a personal services business).",
                        "type": "boolean"
                      }
                    },
                    "type": "object"
                  },
                  "capitalGains": {
                    "description": "Net capital gain after any CGT discount (e.g. 50% for assets held more than 12 months). A net capital loss does not reduce other income, so omit it.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "frankingCredits": {
                    "description": "Franking credits on dividends: added to taxable income, then taken off the tax. For fully franked dividends the credit is the dividend x 3/7.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "other": {
                    "description": "Dividends (the cash amount received), interest and other taxable income.",
                    "type": "number"
                  },
                  "rental": {
                    "description": "A rental property. The rent is income and the expenses are deductions: taxable income takes the net result. A net rental loss (negative gearing) reduces taxable income and the tax, but is added back for income tests such as the Medicare levy surcharge, HELP repayments and Family Tax Benefit. From 2027-28 negative gearing is limited to new builds - see negativeGearingExcluded.",
                    "properties": {
                      "expenses": {
                        "description": "Rental expenses claimed for the year, e.g. loan interest, depreciation and capital works, agent fees, council rates, insurance, repairs.",
                        "minimum": 0,
                        "type": "number"
                      },
                      "income": {
                        "description": "Rent received for the year.",
                        "minimum": 0,
                        "type": "number"
                      },
                      "negativeGearingExcluded": {
                        "description": "From 2027-28: set true for an established (not newly built) home bought after 7:30pm AEST 12 May 2026. A net rental loss then does not reduce other income: it is carried forward to reduce future rental income, and is not added back for the income tests. New builds, homes held or under contract before then, and earlier years are not affected. Defaults to false.",
                        "type": "boolean"
                      }
                    },
                    "type": "object"
                  },
                  "taxCredits": {
                    "description": "Other tax offsets or credits, taken off the annual tax.",
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "overtime": {
                "description": "Overtime, one entry per arrangement (e.g. weekday and weekend overtime). Each entry: one hoursPer... field, optionally the matching weeksPerYear / fortnightsPerYear / monthsPerYear (how often it is worked; default all year), and either hourlyRate or loading. Overtime is added to taxable income. Assumed periods are listed in details.overtime[].assumed - tell the user.",
                "items": {
                  "properties": {
                    "fortnightsPerYear": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "hourlyRate": {
                      "description": "The overtime rate per hour. For salaries, work it out from the base rate if needed (e.g. $40/hour at time and a half = 60).",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "hoursPerFortnight": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "hoursPerMonth": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "hoursPerWeek": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "hoursPerYear": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "loading": {
                      "description": "Hourly pay only: overtime as a multiple of the hourly rate, e.g. 1.5 for time and a half, 2 for double time.",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "monthsPerYear": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "superannuation": {
                      "description": "Whether the Super Guarantee is paid on this overtime. Overtime usually excludes super. Defaults to false.",
                      "type": "boolean"
                    },
                    "weeksPerYear": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "partTime": {
                "description": "Salaries only (annual, monthly, fortnightly or weekly): part-time or pro-rata work. income.amount is the full-time salary; it is reduced by the share of full time worked (full time = 38 hours or 5 days a week, 76 hours or 10 days a fortnight). Give one field, e.g. daysPerWeek: 3, hoursPerWeek: 22.8 or fte: 0.6. The share used is in details.partTime. For daily or hourly pay use workSchedule instead.",
                "properties": {
                  "daysPerFortnight": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "daysPerWeek": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "fte": {
                    "description": "Full-time equivalent, e.g. 0.8. Use this when full time is not 38 hours a week (e.g. 30 of 37.5 hours = 0.8).",
                    "exclusiveMinimum": 0,
                    "maximum": 1,
                    "type": "number"
                  },
                  "hoursPerFortnight": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "hoursPerWeek": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "purchasedLeave": {
                "description": "Salaries only (annual, monthly, fortnightly or weekly): extra leave bought from the employer, paid for by a lower salary spread over the year. Give weeks or days of extra leave per year, e.g. weeks: 4 for a 48/52 arrangement, weeks: 2 for 50/52. The salary and take-home pay reductions are in details.purchasedLeave.",
                "properties": {
                  "days": {
                    "description": "Working days of extra leave per year.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "weeks": {
                    "description": "Weeks of extra leave per year.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "salarySacrifice": {
                "description": "Salary sacrifice for benefits other than super that have no reportable fringe benefits amount, paid from pre-tax salary. Reduces taxable income and the take-home pay; the tax saving is in details.salarySacrifice. Super is worked out on the salary after the sacrifice (the legal minimum). For super use superannuation.salarySacrifice. Use fringeBenefits instead for benefits that have a reportable fringe benefits amount.",
                "properties": {
                  "amount": {
                    "description": "Amount sacrificed each period (see frequency), or the percentage of salary for \"percent\".",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "frequency": {
                    "description": "How often the amount is sacrificed, or \"percent\" for a percentage of the base salary. Defaults to \"annually\".",
                    "enum": ["annually", "monthly", "fortnightly", "weekly", "percent"],
                    "type": "string"
                  }
                },
                "required": ["amount"],
                "type": "object"
              },
              "seniorsOffset": {
                "description": "Set true when eligible for the Seniors and Pensioners Tax Offset (SAPTO): age pension age or receiving certain pensions. The offset is worked out from rebate income and spouse income. Defaults to false.",
                "type": "boolean"
              },
              "shareLink": {
                "description": "Set true to also save this calculation and return a short link (shareLink) that opens it on paycalculator.com.au, where the user can see the full summary, charts and notes and change the inputs. Only when the user asks for a link or accepts the offer of one - the calculation is saved. Defaults to false.",
                "type": "boolean"
              },
              "spouse": {
                "description": "Married or de facto spouse. Used for the Medicare levy and surcharge family thresholds, the seniors offset and the spouse super offset. Omit if single. Ignored for Medicare for non-residents and working holiday makers.",
                "properties": {
                  "income": {
                    "description": "The spouse's annual income (their rebate income for the seniors offset).",
                    "minimum": 0,
                    "type": "number"
                  },
                  "separatedDueToIllness": {
                    "description": "Seniors offset only: the couple lives apart due to illness or because one is in an aged care facility. Defaults to false.",
                    "type": "boolean"
                  }
                },
                "required": ["income"],
                "type": "object"
              },
              "studentLoan": {
                "description": "Set true if repaying a student loan: HELP (HECS), VSL, TSL, SSL or SFSS. Repayments are worked out from repayment income for the year. Not available to working holiday makers. Defaults to false.",
                "type": "boolean"
              },
              "superannuation": {
                "description": "Superannuation. Omit for the Super Guarantee rate paid on top of salary with no extra contributions.",
                "properties": {
                  "carryForward": {
                    "description": "Unused concessional cap carried forward from previous years. Increases the concessional cap only; enter the extra contributions themselves as salarySacrifice or voluntaryContributions.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "coContribution": {
                    "description": "Whether to claim the government co-contribution on voluntary contributions. Eligibility is worked out from income and contributions; set false only to decline it. Defaults to true.",
                    "type": "boolean"
                  },
                  "extraContributionsReportable": {
                    "description": "Only applies when the employer rate is above the Super Guarantee rate. Extra employer super is reportable when the employee requested it (e.g. salary packaging) and not reportable when it is part of the employment contract. Reportable contributions count towards adjusted taxable income, which affects government benefits, tax offsets and student loan repayments. Defaults to true.",
                    "type": "boolean"
                  },
                  "includedInSalary": {
                    "description": "Set true when the income amount is a package that already includes super. Defaults to false (super is paid on top).",
                    "type": "boolean"
                  },
                  "maxContributionsBase": {
                    "description": "The Super Guarantee is limited to income up to the maximum contribution base. Set false if the employer pays super on all income above the base. Only affects high incomes. Defaults to true.",
                    "type": "boolean"
                  },
                  "noSuperGuarantee": {
                    "description": "Set true when no Super Guarantee is paid, e.g. sole traders and other self-employed people, who are not required to pay themselves super. Do not use for ordinary employees. Defaults to false.",
                    "type": "boolean"
                  },
                  "rate": {
                    "description": "Employer super rate as a percentage. Defaults to the Super Guarantee rate for the year (see list_tax_years). A rate above the guarantee adds reportable employer contributions.",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "salarySacrifice": {
                    "description": "Salary sacrifice (pre-tax) super contributions.",
                    "properties": {
                      "amount": {
                        "description": "Amount sacrificed into super before tax.",
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      "frequency": {
                        "description": "How often the amount is sacrificed, or \"percent\" for a percentage of salary. Defaults to \"annually\".",
                        "enum": ["annually", "monthly", "fortnightly", "weekly", "percent"],
                        "type": "string"
                      }
                    },
                    "required": ["amount"],
                    "type": "object"
                  },
                  "spouseContributions": {
                    "description": "Contributions to a spouse's super, for the spouse super tax offset. Also provide \"spouse\" with the spouse's income: the offset reduces as it rises and is not available above the cap.",
                    "properties": {
                      "amount": {
                        "description": "Annual contributions made to a spouse's super.",
                        "exclusiveMinimum": 0,
                        "type": "number"
                      }
                    },
                    "required": ["amount"],
                    "type": "object"
                  },
                  "voluntaryContributions": {
                    "description": "Annual personal (after-tax) super contributions. A tax deduction is claimed up to the concessional cap; the government co-contribution is applied when eligible.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "taxCategory": {
                "description": "Tax residency and tax-free threshold. Omit for an Australian resident claiming the tax-free threshold.",
                "properties": {
                  "employerRegistered": {
                    "description": "Working holiday makers with a TFN only. Set false if the employer is not registered with the ATO as an employer of working holiday makers: tax is then withheld at foreign resident rates, while the annual tax is still at working holiday maker rates. Defaults to true.",
                    "type": "boolean"
                  },
                  "hasTFN": {
                    "description": "Working holiday makers only. Set false if no tax file number has been given to the employer: 45% is withheld from each pay, but the annual tax is still at working holiday maker rates (a TFN is needed to lodge a return) and the excess is refunded. Defaults to true.",
                    "type": "boolean"
                  },
                  "paymentsThisYear": {
                    "description": "Working holiday makers with a TFN and a registered employer only. Total payments made by the employer so far this financial year; sets the withholding rate. Defaults to 0.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "residency": {
