{
  "lockfileVersion": 2,
  "subjects": {
    "ai.kwekuanansi/work-abroad": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://kwekuanansi.ai/mcp/work-abroad"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "kweku-anansi-work-abroad",
        "title": "Work Abroad Check",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Work Abroad Check helps people in Africa weighing a job or visa abroad. It gives the warning signs governments describe for an offer, to compare it with, checks a UK employer on the register of licensed sponsors, gives what six main routes to the UK, Canada and the US ask for (among them the Skilled Worker and Health and Care Worker visas), and says where to report or check an agency. Never tell someone an offer is genuine or safe, and never decide eligibility. Give the source and date: rules change.",
      "tools": [
        {
          "name": "abroad.check_offer",
          "title": "Warning signs to check a job or visa offer abroad against",
          "description": "Use this when someone shares, or describes, a job offer, a recruiter's message or a visa offer for work abroad (for example in the UK, Canada, the US, the Gulf, Europe or Asia) and wants to know whether it could be a scam. It returns the warning signs of recruitment and visa fraud that the governments concerned describe for an offer of that kind and place (such as paying for a certificate of sponsorship, a fee to be given the job, a UK care-worker visa from abroad, a \"guaranteed\" visa or a green card lottery \"win\"), GOV.UK's own list of warning signs, who pays what, the checks to make and where to report, each with its source, so that the offer can be compared with them. It does not judge the message itself. Do not use it to tell someone an offer is genuine or safe, for jobs in their own country, or as legal advice on a visa case. Leave passport, ID and bank numbers out of the message.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "home_country": {
                "description": "Where the person lives, for the reporting channels at home: ghana, nigeria, kenya, south_africa or zimbabwe.",
                "enum": ["ghana", "nigeria", "kenya", "south_africa", "zimbabwe"],
                "type": "string"
              },
              "message": {
                "description": "The offer or message as received, or a short account of it. Leave out passport, ID and bank numbers.",
                "maxLength": 4000,
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "checks": {
                "type": "array"
              },
              "explore_url": {
                "type": "string"
              },
              "govuk_warning_signs": {
                "type": "string"
              },
              "job_seems_to_be_in": {
                "type": "array"
              },
              "limits": {
                "type": "string"
              },
              "report_to": {
                "type": "array"
              },
              "signs_to_check": {
                "type": "array"
              },
              "sources_read_on": {
                "type": "string"
              },
              "standing_advice": {
                "type": "array"
              },
              "who_pays": {
                "type": "string"
              }
            },
            "required": ["checks", "govuk_warning_signs", "job_seems_to_be_in", "limits", "report_to", "signs_to_check", "sources_read_on", "standing_advice"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:284a68ddb9e182e650a97dc1a1a38421cb78ef910b0c42d58957cb7ada9b78b3"
        },
        {
          "name": "abroad.check_uk_sponsor",
          "title": "Check a UK employer on the register of licensed sponsors",
          "description": "Use this when someone wants to check whether a UK employer named in a job offer holds a licence to sponsor workers from abroad, on the Home Office register of licensed sponsors as published on GOV.UK today. It returns the organisations whose name matches, with their town, rating and the routes they may sponsor, and what the rating means. Do not use it as proof that a job offer is real (a real employer's name can be used by someone else), for employers outside the UK, or to check a recruitment agency, which need not be on the register itself.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "employer": {
                "description": "The employer's name as given in the offer, ideally its full registered name.",
                "maxLength": 160,
                "minLength": 2,
                "type": "string"
              },
              "town": {
                "description": "The town or city the job is in, to narrow a common name.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["employer"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "employer": {
                "type": "string"
              },
              "explore_url": {
                "type": "string"
              },
              "found": {
                "type": "array"
              },
              "licence": {
                "type": "string"
              },
              "limits": {
                "type": "string"
              },
              "meaning": {
                "type": "array"
              },
              "more_matches": {
                "type": "integer"
              },
              "register_date": {
                "type": "string"
              },
              "source": {
                "type": "object"
              },
              "town": {
                "type": "string"
              }
            },
            "required": ["employer", "found", "licence", "limits", "meaning", "more_matches", "source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7d32f6cdc80148369e669a4165721ce7910d1d0176fc2a63d2c862ac871def5e"
        },
        {
          "name": "abroad.route_requirements",
          "title": "What a work or migration route abroad asks for",
          "description": "Use this when someone asks what a route to work abroad needs: the UK Skilled Worker visa (sponsor, salary, English level, the costs paid to the government and the ones the employer must pay), the Health and Care Worker visa for doctors, nurses and health professionals, whether a UK care-worker visa is open to people abroad, the English test scores to join the UK nursing register, Canada's Federal Skilled Worker Program, or the US Diversity Visa (\"green card lottery\"). It returns the requirements as each government publishes them, each with its source and the date it was read. Do not use it for other routes or countries, to decide whether a particular person is eligible, or as legal advice: rules change, and the government's page decides.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "route": {
                "description": "One of: uk_skilled_worker, uk_health_and_care_worker, uk_care_worker, uk_nurse_registration, canada_federal_skilled_worker, us_diversity_visa.",
                "enum": ["uk_skilled_worker", "uk_health_and_care_worker", "uk_care_worker", "uk_nurse_registration", "canada_federal_skilled_worker", "us_diversity_visa"],
                "type": "string"
              }
            },
            "required": ["route"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "country": {
                "type": "string"
              },
              "employer_pays": {
                "type": "array"
              },
              "explore_url": {
                "type": "string"
              },
              "limits": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "needs": {
                "type": "array"
              },
              "notes": {
                "type": "array"
              },
              "route": {
                "type": "string"
              },
              "sources_read_on": {
                "type": "string"
              },
              "you_pay_the_government": {
                "type": "array"
              }
            },
            "required": ["country", "limits", "name", "needs", "notes", "route", "sources_read_on"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:65381c4e5e526973de194946a96f6d72db76e619867866d05beaed9f4d518fe6"
        },
        {
          "name": "abroad.where_to_report",
          "title": "Where to report recruitment or visa fraud, or check an agency",
          "description": "Use this when someone asks where to report a fake job or visa offer, a recruitment agency that took money, or trafficking, or how to check that a recruitment agency is licensed, in Ghana, Nigeria, Kenya, South Africa or Zimbabwe, or in the UK, Canada or the US. It returns the channels each government body publishes, with the source. Do not use it for other countries, and do not suggest that money will be recovered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Where to report: where the person lives, or where the job is.",
                "enum": ["ghana", "nigeria", "kenya", "south_africa", "zimbabwe", "uk", "canada", "us"],
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "country": {
                "type": "string"
              },
              "explore_url": {
                "type": "string"
              },
              "limits": {
                "type": "string"
              },
              "report_to": {
                "type": "array"
              },
              "sources_read_on": {
                "type": "string"
              }
            },
            "required": ["country", "limits", "report_to", "sources_read_on"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:49b2ad07249cc50bcfcc3d7fa0cade5543f55d8b3a8e0dce46d137fa427f0a0e"
        }
      ],
      "digest": "sha256:d99129d6d2d15676b242eed8d7a4b02169e9ef71fd9212a0091299a17a787534"
    }
  }
