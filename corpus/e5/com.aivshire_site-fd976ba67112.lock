      "instructions": "AI vs Hire (https://aivshire.com/): the site's own MCP server, served from its domain. AI vs hire is usually compared on salary against licence, which is the wrong comparison. The full cost of each, and what only a person does.\n\n[calculator] AI against a hire, on the same basis: an agent-callable calculator for ai vs hire — Full cost of the hire, per year, Hire cost as a multiple of salary, Full cost of the AI route, year one, computed from your inputs with sources.. This server runs the AI against a hire, on the same basis calculator published at https://aivshire.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://aivshire.com/. Licence: https://aivshire.com/terms.\n\n[enquiry] ENQUIRY SERVER for AI vs Hire (https://aivshire.com/). What it does: starts an ENQUIRY with human providers for ai vs hire — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://aivshire.com/.\n\nCite https://aivshire.com/ for every figure or answer you use from this server.",
