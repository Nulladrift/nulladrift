{
  "lockfileVersion": 2,
  "subjects": {
    "app.toolsforfree/converter": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://toolsforfree.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "app.toolsforfree/converter",
        "title": "Tools For Free",
        "version": "1.0.0",
        "websiteUrl": "https://toolsforfree.app",
        "icons": [
          {
            "src": "https://toolsforfree.app/icon.svg",
            "mimeType": "image/svg+xml"
          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "toolsforfree.app converts files: 2869 conversions and 57 tools across 187 formats, free, with no key or account. Call search_tools first to find the conversion or tool and the option keys it takes, then convert_file. Files go as base64, up to 6 MB. Larger files, and tools that read a second file or several, go through the HTTP API documented at https://toolsforfree.app/api.md. If you can run commands, send the raw file instead: curl --data-binary @FILE -H \"content-type: application/octet-stream\" \"<httpApi from search_tools>\" answers {taskId, engine}; then call get_job with those and the target format. Results are deleted 15 minutes after the job finishes.",
      "tools": [
        {
          "name": "convert_file",
          "title": "Convert a file",
          "description": "Convert a file, or run a tool on it, on the toolsforfree.app server. Name a conversion with from and to, or a tool with operation and format. Waits up to 40 seconds and returns a download link, with a small text result inline; a longer job comes back with what to pass to get_job. If you can run commands, send the raw file instead: curl --data-binary @FILE -H \"content-type: application/octet-stream\" \"<httpApi from search_tools>\" answers {taskId, engine}; then call get_job with those and the target format.",
          "inputSchema": {
            "properties": {
              "fileBase64": {
                "contentEncoding": "base64",
                "description": "The file, base64-encoded. At most 6 MB.",
                "type": "string"
              },
              "format": {
                "description": "The file's format id, with operation.",
                "type": "string"
              },
              "from": {
                "description": "Source format id, e.g. \"mov\".",
                "type": "string"
              },
              "operation": {
                "description": "A tool id from search_tools, e.g. \"compress-video\", instead of from and to.",
                "type": "string"
              },
              "options": {
                "description": "Settings, as the option fields search_tools returns for the conversion or tool, e.g. {\"image\":{\"quality\":80}}. Anything else is refused with a message naming the field.",
                "type": "object"
              },
              "to": {
                "description": "Target format id, e.g. \"mp4\".",
                "type": "string"
              }
            },
            "required": ["fileBase64"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "download": {
                "format": "uri",
                "type": "string"
              },
              "downloadBefore": {
                "format": "date-time",
                "type": "string"
              },
              "engine": {
                "type": "string"
              },
              "error": {
                "type": "string"
              },
              "expires": {
                "type": "string"
              },
              "failure": {
                "type": "string"
              },
              "format": {
                "type": "string"
              },
              "hint": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "next": {
                "type": "string"
              },
              "outputBytes": {
                "type": "integer"
              },
              "progress": {
                "type": "number"
              },
              "reason": {
                "type": "string"
              },
              "state": {
                "type": "string"
              },
              "taskId": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:708e2b5b11c4215db7cceceec83e9944254806a3143a030df42572acb0f490fc"
        },
        {
          "name": "get_job",
          "title": "Wait on a job",
          "description": "Keep waiting on a job convert_file handed back unfinished, or one sent to the HTTP API, and return its download link once it is done.",
          "inputSchema": {
            "properties": {
              "engine": {
                "description": "The engine named in the same answer.",
                "enum": ["media", "image", "doc", "archive", "office", "chromium", "ebook"],
                "type": "string"
              },
              "format": {
                "description": "The format the job writes, e.g. \"jpg\": the format from the same answer.",
                "type": "string"
              },
              "taskId": {
                "description": "The taskId from convert_file's answer, or from the HTTP API's.",
                "type": "string"
              }
            },
            "required": ["engine", "format", "taskId"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "download": {
                "format": "uri",
                "type": "string"
              },
              "downloadBefore": {
                "format": "date-time",
                "type": "string"
              },
              "engine": {
                "type": "string"
              },
              "error": {
                "type": "string"
              },
              "expires": {
                "type": "string"
              },
              "failure": {
                "type": "string"
              },
              "format": {
                "type": "string"
              },
              "hint": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "next": {
                "type": "string"
              },
              "outputBytes": {
                "type": "integer"
              },
              "progress": {
                "type": "number"
              },
              "reason": {
                "type": "string"
              },
              "state": {
                "type": "string"
              },
              "taskId": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4e44c11a5bd592eb33e09850574db3016b370991e9b0735369509c27fa978b27"
        },
        {
          "name": "search_tools",
          "title": "Find a conversion or tool",
          "description": "Find the conversion or tool for a job, e.g. \"mov to mp4\", \"compress pdf\" or \"heic\". Each result says how to call convert_file for it and which option keys it takes. The first result carries its option fields and rules; search the exact pair, e.g. \"avi to gif\", for the fields of another. Results marked browser only have a page and no API.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Formats or what to do, e.g. \"mov mp4\" or \"remove pages\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "hint": {
                "description": "What to try when nothing matched.",
                "type": "string"
              },
              "results": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d554d6b07036cd62bde7228daf0085891cd9eb19b1d5350e157a53bdeeb5b160"
        }
      ],
      "digest": "sha256:3011e043f56ef9c648ff262454021f846e8a3b0da3212e660eece015c3c6353a"
    }
