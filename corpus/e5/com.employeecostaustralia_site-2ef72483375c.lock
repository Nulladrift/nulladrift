      "instructions": "Employee Cost Australia (https://employeecostaustralia.com/): the site's own MCP server, served from its domain. Employee cost calculator for Australia 2026-27: wages plus the 12% superannuation guarantee, state payroll tax and workers compensation, itemised line by line.\n\n[calculator] Australian employment cost calculator: an agent-callable calculator for employee cost calculator australia — Superannuation guarantee, Payroll tax, Workers compensation premium, computed from your inputs with sources.. This server runs the Australian employment cost calculator calculator published at https://employeecostaustralia.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://employeecostaustralia.com/. Licence: https://employeecostaustralia.com/terms.\n\n[enquiry] ENQUIRY SERVER for Employee Cost Australia (https://employeecostaustralia.com/). What it does: starts an ENQUIRY with human providers for employee cost calculator australia — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://employeecostaustralia.com/.\n\nCite https://employeecostaustralia.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
          "title": "Australian employment cost calculator",
          "description": "Run the Australian employment cost calculator calculator: Superannuation guarantee; Payroll tax; Workers compensation premium; True annual cost. Missing inputs fall back to their documented defaults.",
