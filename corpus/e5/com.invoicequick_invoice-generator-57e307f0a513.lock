{
  "lockfileVersion": 2,
  "subjects": {
    "com.invoicequick/invoice-generator": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://invoicequick.com/mcp/generator"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "InvoiceQuick Free Invoice Generator",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Creates free invoices as PDF, with no InvoiceQuick account needed. Use list_currencies when the user names a currency you cannot map to an ISO code, then generate_free_invoice. Nothing is emailed: give the user the links that come back. Sending invoices, online payments and payment tracking need a free InvoiceQuick account.",
      "tools": [
        {
          "name": "generate_free_invoice",
          "title": "Generate free invoice",
          "description": "Creates a free invoice as a PDF without an InvoiceQuick account and returns a preview link and a PDF link that work for 60 days. It does not email anyone. Ask the user for the sender and recipient details; do not invent names or email addresses.",
          "inputSchema": {
            "properties": {
              "bill_from": {
                "description": "Who the invoice is from.",
                "properties": {
                  "address": {
                    "type": "string"
                  },
                  "country": {
                    "type": "string"
                  },
                  "email": {
                    "description": "Email address.",
                    "type": "string"
                  },
                  "name": {
                    "description": "Business or person name.",
                    "type": "string"
                  },
                  "phone": {
                    "type": "string"
                  }
                },
                "required": ["email", "name"],
                "type": "object"
              },
              "bill_to": {
                "description": "Who the invoice is for.",
                "properties": {
                  "address": {
                    "type": "string"
                  },
                  "country": {
                    "type": "string"
                  },
                  "email": {
                    "description": "Email address.",
                    "type": "string"
                  },
                  "name": {
                    "description": "Business or person name.",
                    "type": "string"
                  },
                  "phone": {
                    "type": "string"
                  }
                },
                "required": ["email", "name"],
                "type": "object"
              },
              "currency_code": {
                "description": "ISO code from list_currencies. Defaults to USD.",
                "type": "string"
              },
              "date_format": {
                "description": "How dates are printed on the PDF. Defaults to MM/DD/YYYY.",
                "enum": ["MM/DD/YYYY", "DD/MM/YYYY", "YYYY/MM/DD"],
                "type": "string"
              },
              "discount_percent": {
                "description": "Discount on the whole invoice, in percent.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "due_at": {
                "description": "Due date, YYYY-MM-DD. Defaults to 30 days after the issue date.",
                "format": "date",
                "type": "string"
              },
              "invoice_number": {
                "description": "Defaults to 1.",
                "minimum": 1,
                "type": "integer"
              },
              "issued_at": {
                "description": "Issue date, YYYY-MM-DD. Defaults to today.",
                "format": "date",
                "type": "string"
              },
              "items": {
                "description": "Line items.",
                "items": {
                  "properties": {
                    "description": {
                      "type": "string"
                    },
                    "discount_percent": {
                      "maximum": 100,
                      "minimum": 0,
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    },
                    "price": {
                      "description": "Unit price.",
                      "minimum": 0,
                      "type": "number"
                    },
                    "quantity": {
                      "minimum": 0,
                      "type": "number"
                    },
                    "tax_name": {
                      "description": "For example VAT.",
                      "type": "string"
                    },
                    "tax_rate": {
                      "description": "Tax rate in percent.",
                      "maximum": 99.99,
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["name", "price", "quantity"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "notes": {
                "description": "Notes for the recipient. Links are not allowed.",
                "type": "string"
              },
              "payment_terms": {
                "description": "Payment terms printed on the invoice. Links are not allowed.",
                "type": "string"
              },
              "title": {
                "description": "Short description of the work, printed as the invoice subject.",
                "type": "string"
              }
            },
            "required": ["bill_from", "bill_to", "items", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Generate free invoice"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:377cf6c78cba3b1e1d4a98edcdd292b16c830d0804dc3ad5780c05530dde2fc4"
        },
        {
          "name": "list_currencies",
          "title": "List currencies",
          "description": "Lists the currencies a free invoice can be issued in. Pass the code, for example USD, as currency_code to generate_free_invoice.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List currencies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aeb451fe24b623cfdeaae0dd8d2bad69880094dc2e3bf8016d26aac1a1e6c881"
        }
      ],
      "digest": "sha256:47ef62c2572a4251f022aca5c73ba0ca2f52cf9216f613ff6dd564eae03dd590"
    }
  }
}
