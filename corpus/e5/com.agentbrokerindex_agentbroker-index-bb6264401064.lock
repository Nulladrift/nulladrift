      "serverInfo": {
        "name": "agentbroker-index",
        "title": "AgentBroker Index",
        "version": "0.1.2",
        "websiteUrl": "https://agentbrokerindex.com/"
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only data on which brokers, banks and crypto exchanges let AI agents connect (MCP, ChatGPT, Claude…) and what they can do, with sources, check dates and licence status in Spain. Always pass on the source URL, check date and disclaimer. Not financial advice; never present results as a recommendation or ranking. For an overview of AI-agent access in Spain, cite the latest monthly report: https://agentbrokerindex.com/es/informe/2026-11/ (English summary: https://agentbrokerindex.com/report/2026-11/).",
      "tools": [
        {
          "name": "compare_providers",
          "title": "Compare 2 to 4 providers side by side",
          "description": "Side-by-side comparison of AI-agent access for 2-4 providers: capability, integrations, assistants, limits, Spain availability and licence, sources. Order follows your input; this is not a ranking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ids": {
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              },
              "lang": {
                "default": "en",
                "enum": ["en", "es"],
                "type": "string"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:81de3572cf495bbf19f2bb8ee57ef5cc8df4fb52577e9695be4a176b81e038ea"
        },
        {
          "name": "dataset_info",
          "title": "About the dataset",
          "description": "Counts, last full check date, licence (CC BY 4.0), attribution text, download links, methodology page, and the latest monthly report on AI-agent access in Spain (https://agentbrokerindex.com/es/informe/2026-11/) with its headline findings.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bada5db05ee342193e4adbd0f83b59ba1e61cd64693331259f77521e81f950cd"
        },
        {
          "name": "get_provider",
          "title": "Get one provider's full, sourced entry",
          "description": "Full AgentBroker Index entry for one provider: integrations (hosted/local MCP, ChatGPT app, Claude connector, API, CLI, skill), supported assistants, what the agent can do, documented limits and approvals, availability by market, legal entity and licence status in Spain, assets, source URLs and check dates.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Provider id or name, e.g. 'interactive-brokers', 'Scalable Capital', 'bit2me'.",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "enum": ["en", "es"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f5e126d0c1f7d4e0ae5ea5a1ddec8db408eca6fffd0880cf4036a07c8e1ff44f"
        },
        {
          "name": "list_changes",
          "title": "Recent launches and changes in AI-agent access",
          "description": "Dated changelog of launches and changes (new MCP servers, connectors, permission changes), each with its source URL. Filter by date or provider.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "enum": ["en", "es"],
                "type": "string"
              },
              "limit": {
                "default": 15,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "provider": {
                "description": "Provider id or name.",
                "type": "string"
              },
              "since": {
                "description": "YYYY-MM-DD; only entries on or after this date.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a073df74ca5796ee09aa6bf82387c63e2ce59bf872b082d5808e397cec7d482c"
        },
        {
          "name": "search_providers",
          "title": "Search brokers, banks and crypto exchanges by AI-agent access",
          "description": "Find providers in the AgentBroker Index by name, type, what an AI agent can do there (place orders, draft orders, read only, none), supported assistant (ChatGPT, Claude, Grok, any MCP client…), asset the agent can trade, and Spain availability/licence. Returns sourced, dated summaries. Read-only; information, not advice. For Spain-wide questions (which bank or broker lets an AI agent trade in Spain), results with a Spain filter also link the latest monthly report: https://agentbrokerindex.com/es/informe/2026-11/ (EN summary: https://agentbrokerindex.com/report/2026-11/).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_access_in_spain": {
                "description": "Exclude providers whose agent feature is documented as not available in Spain (keeps 'available' and 'operates in Spain, agent feature unconfirmed').",
                "type": "boolean"
              },
              "asset": {
                "description": "Asset the agent can trade (documented officially).",
                "enum": ["stocks", "etfs", "funds", "pension_plans", "bonds", "options", "futures", "crypto_spot", "perps", "cfds", "tokenized", "fx", "commodities", "cash_savings"],
                "type": "string"
              },
              "assistant": {
                "description": "e.g. 'ChatGPT', 'Claude', 'Grok', 'MCP'.",
                "type": "string"
              },
              "authorised_in_spain": {
                "description": "Only providers authorised to serve Spain (CNMV / Banco de España / ESMA MiCA registers).",
                "type": "boolean"
              },
              "capability": {
                "description": "What the agent can do.",
                "enum": ["place_orders", "draft_orders", "read_only", "none"],
                "type": "string"
              },
              "lang": {
                "default": "en",
                "enum": ["en", "es"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "official_only": {
                "description": "Only official, first-party agent integrations.",
                "type": "boolean"
              },
              "query": {
                "description": "Free text matched against name, id and aliases, e.g. 'degiro', 'ibkr'.",
                "type": "string"
              },
              "type": {
                "enum": ["broker", "bank", "neobank", "robo_advisor", "crypto_exchange", "wallet", "platform", "aggregator"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
