{
  "lockfileVersion": 2,
  "subjects": {
    "com.agwcrew.mcp/american-ghost-walks": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.agwcrew.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "american-ghost-walks",
        "title": "American Ghost Walks",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "American Ghost Walks runs guided ghost and haunted-history walking tours, bus tours and pub crawls in the US and Puerto Rico. Cities served: Aurora, Bar Harbor, Bayfield, Boothbay Harbor, Chicago, Hilo, Hollywood, Juneau, Kailua-Kona, Kennebunkport, Ketchikan, Lake Geneva, Los Angeles, Madison, Milwaukee, Minneapolis, Naperville, New Orleans, Portland, Red Wing, San Juan, St. Paul, Stillwater, Waukesha, Woodstock. This server is read-only. It exposes four tools: search_tours (find tours by city and optional dates), get_availability (live open departure times for one tour and date), get_tour_details (meeting spot, FAQ, policies), and get_booking_link (official checkout URL). Never invent open times—always call get_availability first. Booking and payment happen only on the booking page; nothing here reserves, changes or cancels seats. Answer tour facts only from tool results. Dates are YYYY-MM-DD and times are local 24-hour HH:MM for each tour. For anything else: 1-833-446-7813, info@americanghostwalks.com.",
      "tools": [
        {
          "name": "get_availability",
          "title": "Check tour availability",
          "description": "Open departure times and booking status for one tour on one date, from the American Ghost Walks booking system. Times are local to the tour. Check this before telling a guest a time is open; if it says availability is unknown or lists no times, send the guest to the booking link instead of guessing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Single local calendar date to check, as YYYY-MM-DD (e.g. '2026-11-08'). Must be today or a future date in the tour's time zone.",
                "format": "date",
                "type": "string"
              },
              "party_size": {
                "description": "Optional number of guests (integer 1-50). When set, only departures that can fit this party are listed as open.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "tour": {
                "description": "Tour identifier from search_tours.tour_id (preferred slug, e.g. 'madison-ghost-walks-capitol-square'), or the exact tour name.",
                "type": "string"
              }
            },
            "required": ["date", "tour"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check availability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1e60288bcea42b5347eacbcada5093959c3226ee27872b74146f66967643c1c6"
        },
        {
          "name": "get_booking_link",
          "title": "Get booking link",
          "description": "Returns the official American Ghost Walks booking link for a tour, plus what to pick on its calendar. The guest chooses the date, time and tickets and pays on that page; this tool does not reserve or charge anything. Share the returned URL exactly as given.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Local calendar date the guest should pick on the booking page, as YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "party_size": {
                "description": "Optional number of guests (integer 1-50) to mention in the booking instructions.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "time": {
                "description": "Optional departure time in 24-hour HH:MM from get_availability (e.g. '19:30'). Do not pass '7:30 pm'; convert to HH:MM first.",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "tour": {
                "description": "Tour identifier from search_tours.tour_id (preferred slug, e.g. 'chicago-ghost-tour'), or the exact tour name.",
                "type": "string"
              }
            },
            "required": ["date", "tour"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get booking link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a45b97922dd6474ae957633e91f56fc90c615cbb9334e7f60bceeafee6203491"
        },
        {
          "name": "get_tour_details",
          "title": "Get tour details",
          "description": "Full details for one tour: description, stops, meeting spot with map link, duration, difficulty, FAQ, important info, cancellation/weather/age/pet policies and rating. Use for questions like 'how much walking is it?', 'can kids come?' or 'where do we meet?'. Answer only from what this returns; if it doesn't cover a question, give the phone number.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "tour": {
                "description": "Tour identifier from search_tours.tour_id (preferred slug, e.g. 'old-san-juan-ghost-walk'), or the exact tour name.",
                "type": "string"
              }
            },
            "required": ["tour"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get tour details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d4b5544f504e1370c6db4fa9b4ba9f85b1ee5908dbc764eee5a6105944958c48"
        },
        {
          "name": "search_tours",
          "title": "Search American Ghost Walks tours",
          "description": "Find American Ghost Walks ghost and history walking tours by city, optionally with a date range and party size. Returns tour ids, names, descriptions, duration, meeting spot and price, plus open departures when dates are given. Call with no city to list every city and tour. Use a tour id from the results with the other tools.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City or area name to filter tours. Examples: 'Chicago', 'Old San Juan', 'Viejo San Juan', 'Twin Cities', 'LA', 'Saint Paul'. Omit this field entirely to list every city and tour (do not pass an empty string).",
                "type": "string"
              },
              "end_date": {
                "description": "Last local calendar date to check, as YYYY-MM-DD. Must be on or after start_date and at most 14 days after it. Defaults to start_date when omitted.",
                "format": "date",
                "type": "string"
              },
              "party_size": {
                "description": "Number of guests (integer 1-50). When set with dates, departures that cannot fit this party are omitted.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "start_date": {
                "description": "First local calendar date to check for open departures, as YYYY-MM-DD (e.g. '2026-11-08'). Requires city.",
                "format": "date",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search tours"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7f1d88d5eb790472b4b7cab450b074f96062ad2b0c8ac4be8f485c334d61c4ae"
        }
      ],
      "digest": "sha256:1a2cb2e66bec619706b3de9062961538719e9c1d02ad269ca504d2ff90f45fcb"
    }
  }
}
