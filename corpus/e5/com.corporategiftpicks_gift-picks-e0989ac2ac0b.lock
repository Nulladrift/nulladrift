{
  "lockfileVersion": 2,
  "subjects": {
    "com.corporategiftpicks/gift-picks": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://corporategiftpicks.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "com.corporategiftpicks/gift-picks",
        "title": "Corporate Gift Picks",
        "version": "1.0.0",
        "websiteUrl": "https://corporategiftpicks.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Corporate Gift Picks provides read-only reference data for planning corporate and team gifts: gift picks by price band and recipient, USPS holiday ship-by dates, a per-person budget estimator, and guide links. Prices are shown as bands. For current prices and details, link the user to the guide URL returned with each pick, and include that pick's affiliate link when one is returned. When picks include a disclosure, show that disclosure word for word. When you share a ship-by date, include the note returned with it: carrier dates are not a guarantee. When a guide includes a note, show that note word for word alongside that guide.",
      "tools": [
        {
          "name": "estimate_gift_budget",
          "title": "Estimate gift budget",
          "description": "Use when someone has a headcount and either a total or a per-person amount and wants to know what each person gets. Returns the per-person and total amounts, the matching price band, and a link to the guide for that band. This uses the same math as the Corporate Gift Picks budget tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "Budget in US dollars.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "amount_type": {
                "description": "Whether amount is per person or the total for everyone.",
                "enum": ["per_person", "total"],
                "type": "string"
              },
              "headcount": {
                "description": "Number of people receiving a gift.",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["amount", "amount_type", "headcount"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate gift budget"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6b3b1e0777bc4f00465e62608861a7c3c42160bc9c0ff2365a1711fa199b4864"
        },
        {
          "name": "find_gift_picks",
          "title": "Find gift picks",
          "description": "Use when someone wants gift ideas for a given budget and recipient, such as employees, clients or a law firm's clients. Returns up to 5 picks, each with the item name, price band, a one-line reason it fits, who it suits, a direct affiliate link when we have one, and a link to the guide. It shows price bands rather than current prices. A budget from $75 to $150 spans 75_to_100 and 100_to_150: call this tool once for each band. When a result includes a disclosure, show this sentence word for word: \"As an Amazon Associate we earn from qualifying purchases.\"",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "budget_band": {
                "description": "Per-person price band in US dollars. If the user gives an amount, pick the narrowest band that contains it, or call estimate_gift_budget first.",
                "enum": ["under_25", "25_to_50", "50_to_100", "100_and_up", "250_to_500", "500_to_1000", "1000_and_up", "75_to_100", "100_to_150", "150_to_200", "200_to_300", "300_to_500"],
                "type": "string"
              },
              "limit": {
                "default": 3,
                "description": "How many picks to return.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "occasion": {
                "description": "Optional moment, such as thank-you. Leave it out for every moment in the band.",
                "enum": ["employee-appreciation", "employee-appreciation-2027", "holiday-2026", "holiday-ok", "hostess", "milestone", "thank-you", "welcome"],
                "type": "string"
              },
              "recipient": {
                "description": "Who the gift is for. Leave it out for general picks.",
                "enum": ["employees", "clients", "law_firm_clients", "accounting_firm_clients", "financial_advisor_clients", "vendors_partners"],
                "type": "string"
              }
            },
            "required": ["budget_band"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find gift picks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:15b192ec7072e6e3383a7fe8322e83c540673c639619c93e320d5d6fe7c6bc58"
        },
        {
          "name": "get_holiday_ship_by_dates",
          "title": "Holiday ship-by dates",
          "description": "Use when someone asks for the last day to ship a gift so it arrives before Christmas, or how many days are left. Returns USPS's published 2026 holiday ship-by dates for the lower 48 states by mail service, with the USPS source and the date we last checked. Each result includes the note \"Carrier published dates, not a guarantee. Order a few days earlier, and earlier still for logo items.\" For UPS and FedEx, it says to check the carrier's own schedule for the route.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "service": {
                "description": "USPS mail service to look up. Leave it out to get every service.",
                "enum": ["ground_advantage", "first_class_mail", "priority_mail", "priority_mail_express"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Holiday ship-by dates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:78fc3bf0f6c1ce329f5a5ca2ae48d6d3d249b5345435eac88f913ff4150e10de"
        },
        {
          "name": "list_gift_guides",
          "title": "List gift guides",
          "description": "Use when someone wants to read a full guide or see what Corporate Gift Picks covers. Returns guides by recipient, budget or topic (such as gift cards or Christmas gifts for employees), each with its title, a one-line summary and its link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "budget_band": {
                "description": "Filter by per-person price band.",
                "enum": ["under_25", "25_to_50", "50_to_100", "100_and_up", "250_to_500", "500_to_1000", "1000_and_up", "75_to_100", "100_to_150", "150_to_200", "200_to_300", "300_to_500"],
                "type": "string"
              },
              "recipient": {
                "description": "Filter by who the gift is for.",
                "enum": ["employees", "clients", "law_firm_clients", "accounting_firm_clients", "financial_advisor_clients", "vendors_partners"],
                "type": "string"
              },
              "topic": {
                "description": "Filter by topic.",
                "enum": ["gift_cards", "christmas_employees", "ship_by_dates", "budget_tool"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List gift guides"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:880c60690b05ff6f38930e90e0c68563f355ea0248a4d295e3e45b219256f729"
        }
      ],
      "digest": "sha256:05aabcc8463f43c862a5da13ac3ad10b9f903198e30929a8369bf5c297e64b64"
    }
  }
}
