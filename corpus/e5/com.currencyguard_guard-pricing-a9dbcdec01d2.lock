        {
          "name": "get_spot_rate",
          "title": "Get Spot FX Rate",
          "description": "Get an indicative spot FX rate for a currency pair. Returns a rounded indicative mid rate, for illustration purposes only — not for execution. Example: base=GBP, quote=USD returns the GBPUSD rate.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "base": {
                "description": "Base currency ISO code, e.g. GBP",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "quote": {
                "description": "Quote currency ISO code, e.g. USD",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["base", "quote"],
