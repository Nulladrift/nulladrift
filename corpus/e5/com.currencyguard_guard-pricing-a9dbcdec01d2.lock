                "description": "Amount in foreign currency to protect",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "foreignCurrency": {
                "description": "Foreign currency ISO code, e.g. USD",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "forwardMarginPct": {
                "description": "Margin a provider embeds in a forward rate, as a percentage. Used only when providerForwardRate is absent. Default 1. Only set it if the user knows theirs.",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "guardCurrency": {
                "description": "Home/base currency ISO code, e.g. GBP",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "initialMarginPct": {
                "description": "Deposit a provider demands at the start, as a percentage of the forward amount. Ask for it. Pass 0 when the provider gives the customer an unsecured line with no deposit. Default 5 when the customer does not know.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "marginCallThresholdPct": {
                "description": "The adverse move, as a percentage, at which the provider starts to demand more cash. Ask for it. Below it the scenarios show no cash call on the forward. Leave empty when the customer does not know; the comparison then shows a call on every move, which is the conservative reading.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "payReceive": {
                "description": "PAY if paying foreign currency, RECEIVE if receiving it",
                "enum": ["PAY", "RECEIVE"],
                "type": "string"
              },
              "providerForwardRate": {
                "description": "The forward rate the customer's own provider last quoted them, as foreign currency per unit of home currency, e.g. 1.3122 for GBPUSD. Ask for it. When given, it replaces the market curve estimate and forwardMarginPct is ignored, because a provider's quote already has the margin inside it.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "scenarioMovesPct": {
                "description": "Adverse market moves to show, as percentages. Default 3, 5, 10.",
                "items": {
                  "exclusiveMinimum": 0,
                  "maximum": 100,
                  "type": "number"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "settlementDate": {
                "description": "Settlement date in ISO format YYYY-MM-DD",
                "type": "string"
              }
            },
            "required": ["foreignAmount", "foreignCurrency", "guardCurrency", "payReceive", "settlementDate"],
            "type": "object"
