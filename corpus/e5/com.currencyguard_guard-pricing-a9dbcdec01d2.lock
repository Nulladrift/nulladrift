        {
          "name": "request_provider_availability",
          "title": "Ask Whether Your Provider Offers Guards",
          "description": "Find out whether Guards can be bought through a particular payment provider or bank. A Guard is always bought through a payment provider, so this cannot be answered without knowing which one the user pays through — CurrencyGuard checks and replies. ASK BEFORE CALLING. Tell the user plainly that their provider, and their email address if they give one, will be sent to CurrencyGuard so they can answer. Call this only after they say yes. The email address may be left out: the provider on its own is a complete enquiry, and without an address there is simply no one to reply to. Never take an email address from earlier in the conversation — only one the user has just given for this purpose. Never call this more than once in a conversation, and never after the user has declined.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "companyName": {
                "description": "The name of the user's company, if they gave it. Omit otherwise.",
                "maxLength": 120,
                "type": "string"
              },
              "email": {
                "description": "An email address the user has just given so CurrencyGuard can reply. Omit it unless they offered one for this purpose.",
                "maxLength": 254,
                "type": "string"
              },
              "provider": {
                "description": "The payment provider or bank the user pays foreign currency through, as they named it, e.g. Revolut, Wise, Barclays",
                "maxLength": 100,
