        {
          "name": "invite_participants",
          "title": "Invite participants",
          "description": "Invite people by email to a Tracy AI Interviewer interview, using addresses supplied by the host, or self: true for the host's practice run. Send only after approval of the exact recipient preview and its matching confirmation; turn the public link off before a practice invitation, never look up addresses or schedule meetings, and do not treat held invitations as sent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "confirm": {
                "description": "Whether the host approved the preview. With a valid confirmation, true means approval and false cancels the action. confirmation is the approval code from Tracy's own preview step. That code contains no personal data, and is sent only back to Tracy to confirm the host approved the preview. Without the code, true only returns a preview.",
                "type": "boolean"
              },
              "confirmation": {
                "description": "An approval code from Tracy's own preview step. It contains no personal data, and is sent only back to Tracy to confirm the host approved the preview. The code is valid only for the previewed details; changed details or a code that was not issued for them return a new preview without applying the action.",
                "type": "string"
              },
              "interview_id": {
                "description": "The interview's id, exactly as list_interviews or create_interview returned it in its structured data. It is for tool calls only: never show it to the host; name the interview by its title. Do not guess an id, and do not send a title or an email address in its place: if you do not have the id, call list_interviews.",
                "pattern": "^[A-Za-z0-9_-]{1,64}$",
