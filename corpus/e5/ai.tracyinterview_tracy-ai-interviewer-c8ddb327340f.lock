        {
          "name": "set_open_link",
          "title": "Set the public link",
          "description": "Use this when the host wants to turn an interview's public link on or off, or change its join limit or expiry. Do not use this to invite named people by email (invite_participants does that), to schedule a meeting, send a calendar invitation or share a meeting link, or to make an interview public when the host has not asked for a public link. The public link is a public address (anyone with the link can join): nobody needs an invitation until the limit or expiry is reached (20 people and 14 days unless set here; the expiry is 7, 14 or 30 days). An enablement request without a matching confirmation changes nothing and returns a preview with a confirmation. Enabling the public link publishes the interview to anyone with its address and needs the host's approval of the preview and its matching confirmation. The address is available through get_open_link. A confirmation only works for exactly the same arguments. confirm on its own does nothing. Turning it off, or changing only the limit or expiry, needs no confirmation. When a change is saved, the reply also carries the balance and says what to do when credits are low or used up. The confirmation value matches the preview's exact arguments; a changed value or changed arguments produce a new preview without applying the action.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "confirm": {
                "description": "Whether the host approved the preview. With a valid confirmation, true means approval and false cancels the action. confirmation is the approval code from Tracy's own preview step. That code contains no personal data, and is sent only back to Tracy to confirm the host approved the preview. Without the code, true only returns a preview.",
                "type": "boolean"
              },
              "confirmation": {
                "description": "An approval code from Tracy's own preview step. It contains no personal data, and is sent only back to Tracy to confirm the host approved the preview. The code is valid only for the previewed details; changed details or a code that was not issued for them return a new preview without applying the action.",
                "type": "string"
              },
              "enabled": {
                "description": "true to turn the public link on, false to turn it off. Example: true.",
                "type": "boolean"
              },
              "expiry_days": {
                "anyOf": [
                  {
                    "const": 7,
                    "type": "number"
                  },
                  {
                    "const": 14,
                    "type": "number"
                  },
                  {
                    "const": 30,
                    "type": "number"
                  }
                ],
                "description": "Days the link works, counted from the first time it was turned on: 7, 14 or 30. 14 unless set. Example: 30."
              },
              "interview_id": {
                "description": "The interview's id, exactly as list_interviews or create_interview returned it in its structured data. It is for tool calls only: never show it to the host; name the interview by its title. Do not guess an id, and do not send a title or an email address in its place: if you do not have the id, call list_interviews.",
                "pattern": "^[A-Za-z0-9_-]{1,64}$",
                "type": "string"
              },
              "join_cap": {
                "description": "How many people may join through the link, a whole number of 1 or more. 20 unless set. Example: 50.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["interview_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Set the public link"
          },
