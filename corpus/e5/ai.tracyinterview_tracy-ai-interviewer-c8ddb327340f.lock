      "serverInfo": {
        "name": "Tracy AI Interviewer",
        "title": "Tracy AI Interviewer: AI video and audio interviews",
        "version": "1.0.0",
        "description": "Tracy AI Interviewer runs AI interviews, on video or audio, in nine languages, for screening candidates, customer and user research, reference checks and employee check-ins.",
        "websiteUrl": "https://tracyinterview.ai",
        "icons": [
          {
            "src": "https://tracyinterview.ai/brand/logo/tracy-symbol.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://tracyinterview.ai/brand/logo/png/tracy-symbol-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use this when the host wants to run an AI interview, on video or audio: to screen candidates, research customers or users, check references or check in with employees, or to try one out first in a practice run.\nCreating an interview, sending invitations and enabling the public link (anyone with the link can join) require the host's approval of a preview and its matching confirmation value.\nTracy AI Interviewer does not score, rank or reject participants and only reports what they said.\nInvitations go only to email addresses the host supplies; Tracy AI Interviewer does not look up or collect addresses.\nTracy AI Interviewer does not join meetings, transcribe uploads, schedule calendar calls, look up emails, change account notification settings or send proactive alerts.\nTool replies report errors, whether an action happened and any applicable credits notice.\nHosts can run interviews in English, German, Spanish, French, Indonesian, Japanese, Korean, Dutch, and Vietnamese: pass language to suggest_interview, create_interview or update_interview. English is the default.\nA video interview runs integrity signals unless they are turned off: a full-screen window, a face on camera and a pop-up if the face leaves the frame, and Tracy AI Interviewer only reports. After suggest_interview, ask the host whether to keep them on or turn them off before create_interview, and send integritySignals false only when the host turns them off. An audio interview has none.\nAn interview's id is for tool calls only: never show it to the host. Name an interview by its title, and tell two with the same title apart by their purpose or date.\nA new interview starts with its public link on (anyone with the link can join, up to 20 people for 14 days) and nobody invited; set_open_link with enabled false turns the link off and needs no confirmation.\nFor a practice, mock or test run, where the host takes the interview themselves: create the interview as usual, then turn the public link off with set_open_link (enabled false, no confirmation needed) before offering the host's own invite, invite nobody else, and offer to invite the host's own email address with invite_participants self: true, which uses the address the account signed up with, so the host is not asked for it; the preview names it, and the host may name another address instead. The invite reply carries their personal link to open at once. The invitation still needs the host's confirmation. A finished practice session is a result like any other and uses the account's interview allowance.",
      "tools": [
        {
          "name": "create_interview",
          "title": "Create an interview",
          "description": "Create and save an approved AI video or audio interview with Tracy AI Interviewer for candidate screening, research or a practice run. Creation requires the host's approval of the exact draft, including video integritySignals, and its matching confirmation; the public link starts on for up to 20 people for 14 days, and nobody is emailed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "confirm": {
                "description": "Whether the host approved the preview. With a valid confirmation, true means approval and false cancels the action. confirmation is the approval code from Tracy's own preview step. That code contains no personal data, and is sent only back to Tracy to confirm the host approved the preview. Without the code, true only returns a preview.",
                "type": "boolean"
              },
              "confirmation": {
                "description": "An approval code from Tracy's own preview step. It contains no personal data, and is sent only back to Tracy to confirm the host approved the preview. The code is valid only for the previewed details; changed details or a code that was not issued for them return a new preview without applying the action.",
                "type": "string"
              },
              "context": {
                "description": "Anything else Tracy should know for this interview: job description, company, product, tone. Include only what bears on the interview, and leave it out when there is nothing to add. Do not paste in unrelated or personal details. On update_interview, null clears what is saved.",
                "type": ["string", "null"]
              },
              "goal": {
                "description": "What the host wants to find out, as a topic, e.g. \"How candidates approach debugging a production incident\" or \"Why customers cancelled\". Do not phrase it as a decision about the people, such as whether to hire someone.",
                "type": "string"
              },
              "integritySignals": {
                "description": "Whether integrity signals run for this video interview, true or false. Optional: they are on by default, so send false only when the host chooses to turn them off, and ask the host to keep them or turn them off first. Tracy only reports what happened. An audio interview has none, so sending this for one is refused. It is carried into createWith, and changing it needs a new confirmation.",
                "type": "boolean"
              },
              "intro": {
                "description": "The first message Tracy says, such as \"Hello, I'm Tracy. I'll ask a few questions about your experience.\" Left out, the standard first message is used. Tracy always opens with a fixed notice that she is an AI interviewer. It comes before your first message and cannot be changed.",
                "type": ["string", "null"]
              },
              "language": {
                "description": "The language the interview is held in: en (English), de (German), es (Spanish), fr (French), id (Indonesian), ja (Japanese), ko (Korean), nl (Dutch), vi (Vietnamese). Send the code, e.g. es for Spanish, not the name. Optional: en (English) is the default. It does not translate questions you send: write them in this language. On update_interview, changing it leaves the saved questions as they are, so send them again in the new language.",
                "enum": ["en", "de", "es", "fr", "id", "ja", "ko", "nl", "vi"],
                "type": "string"
              },
              "mode": {
                "description": "How the participant joins: video (the default) or audio, where they need only a microphone and no camera. Send audio when the host asks for an audio interview or one without a camera; otherwise leave it out. Optional: video is the default.",
                "enum": ["video", "audio"],
                "type": "string"
              },
              "outro": {
                "description": "The closing message, such as \"Thank you for your time. That was everything I wanted to ask.\" Left out, the standard closing message is used.",
                "type": ["string", "null"]
              },
              "participants": {
                "description": "Who is being interviewed, as a group described in the host's words, e.g. \"Backend engineers applying for the platform team\" or \"Customers who cancelled in the last 3 months\". It is an audience, not a recipient list: do not put email addresses here, invite_participants takes those.",
                "type": "string"
              },
              "questions": {
                "description": "The questions in the order Tracy asks them, as the host has reviewed them.",
                "items": {
                  "properties": {
                    "source": {
                      "description": "suggested: as suggest_interview wrote it. edited: a suggestion the host changed. own: written by the host. Defaults to own. Do not leave a question marked suggested once its text has changed: use edited.",
                      "enum": ["suggested", "edited", "own"],
                      "type": "string"
                    },
                    "text": {
                      "description": "One question, worded as Tracy should ask it, e.g. \"What was the hardest part of your last project?\". Keep the host's wording when they gave it.",
                      "type": "string"
                    }
                  },
                  "required": ["text"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "ref": {
                "description": "The host's own reference for this interview, such as an ATS job id like JOB-1042.",
                "type": ["string", "null"]
              },
              "result_fields": {
                "description": "The fields the result reports, as the host has reviewed them. An empty list is allowed.",
                "items": {
                  "properties": {
                    "from_question": {
                      "anyOf": [
                        {
                          "maximum": 9007199254740991,
                          "minimum": 0,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "The 0-based position of the question this field comes from, in the questions list sent with it: 0 is the first question, 2 the third. The replies number questions from 1, so \"from question 3\" is 2 here. Leave it out for a field that comes from no single question."
                    },
                    "hint": {
                      "description": "How to read the answer, if the name alone is not clear, e.g. Whole years, not counting internships.",
                      "type": ["string", "null"]
                    },
                    "name": {
                      "description": "What the result reports, e.g. Years of experience.",
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "type": "array"
              },
              "template": {
                "description": "Copy from createWith.",
                "type": ["string", "null"]
              },
              "title": {
                "description": "The interview's title, such as Senior backend engineer screening.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["goal", "participants", "questions", "result_fields", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create an interview"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
