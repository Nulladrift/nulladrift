            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["tracy"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:59925d8bcd70f9f3bc31f45dddbcaf0e4bd2569c76e408447ea9c35ab3867b25"
        },
        {
          "name": "update_interview",
          "title": "Update an interview",
          "description": "Use this when the host wants to change an interview that already exists: its title, purpose, mode, language, first or closing message, questions, result fields, the integrity signals or the warm-up. Do not use it to make a new interview (suggest_interview, then create_interview) or to read the current setup (get_interview), or for an existing meeting or recording, an uploaded file, a contact lookup, scoring or ranking participants, or advice alone. Change an existing interview using its current setup from get_interview and the host's edits. Changes to questions or result_fields replace the complete list. Any edit to the setup (title, purpose, mode, language, intro, outro, questions or result_fields) needs both complete lists, questions and result_fields, because they replace what is saved. title, purpose, mode, language, intro and outro are optional and stay as they are when left out; null or an empty value clears the purpose context, intro or outro. Saving makes a new version of the interview. mode is video or audio: an audio interview needs only a microphone from the participant. integritySignals turns the integrity signals of a video interview on or off and needs no lists; an audio interview has no integrity signals, so asking for one is refused and nothing is changed. warmup turns the warm-up before the first question on or off, for a video or an audio interview, and needs no lists. A new language does not translate the questions: send them in that language with the complete lists.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "integritySignals": {
                "description": "Whether the integrity signals run for this video interview, such as false to turn them off. Optional: it stays as it is when left out. It is saved on its own, without questions or result_fields. An audio interview has no integrity signals: sending this for one is refused and nothing is changed.",
                "type": "boolean"
              },
              "interview_id": {
                "description": "The interview's id, exactly as list_interviews or create_interview returned it in its structured data. It is for tool calls only: never show it to the host; name the interview by its title. Do not guess an id, and do not send a title or an email address in its place: if you do not have the id, call list_interviews.",
                "pattern": "^[A-Za-z0-9_-]{1,64}$",
                "type": "string"
              },
              "intro": {
                "description": "The first message, such as \"Hello, I'm Tracy. I'll ask a few questions about your experience.\" Null or empty clears it. Tracy always opens with a fixed notice that she is an AI interviewer. It comes before your first message and cannot be changed.",
                "type": ["string", "null"]
              },
              "language": {
                "description": "The language the interview is held in: en (English), de (German), es (Spanish), fr (French), id (Indonesian), ja (Japanese), ko (Korean), nl (Dutch), vi (Vietnamese). Send the code, e.g. es for Spanish, not the name. Optional: en (English) is the default. It does not translate questions you send: write them in this language. On update_interview, changing it leaves the saved questions as they are, so send them again in the new language.",
                "enum": ["en", "de", "es", "fr", "id", "ja", "ko", "nl", "vi"],
                "type": "string"
              },
              "mode": {
                "description": "How the participant joins: video (the default) or audio, where they need only a microphone and no camera. Send audio when the host asks for an audio interview or one without a camera; otherwise leave it out. Optional: video is the default.",
                "enum": ["video", "audio"],
                "type": "string"
              },
              "outro": {
                "description": "The closing message, such as \"Thank you for your time. That was everything I wanted to ask.\" Null or empty clears it.",
                "type": ["string", "null"]
              },
              "purpose": {
                "description": "The host's answers, if they change. Both participants and goal are needed.",
                "properties": {
                  "context": {
                    "description": "Extra context. Null or empty clears it.",
                    "type": ["string", "null"]
                  },
                  "goal": {
                    "description": "What the host wants to find out.",
                    "type": "string"
                  },
                  "participants": {
                    "description": "Who is being interviewed.",
                    "type": "string"
                  }
                },
                "required": ["goal", "participants"],
                "type": "object"
              },
              "questions": {
                "description": "The complete list of questions, in the order Tracy asks them. It replaces the saved list: a question left out is removed, so send every question that stays again, unchanged ones exactly as get_interview shows them (text and source).",
                "items": {
                  "properties": {
                    "source": {
                      "description": "suggested: as suggest_interview wrote it. edited: a suggestion the host changed. own: written by the host. Defaults to own. Do not leave a question marked suggested once its text has changed: use edited.",
                      "enum": ["suggested", "edited", "own"],
                      "type": "string"
                    },
                    "text": {
                      "description": "One question, worded as Tracy should ask it, e.g. \"What was the hardest part of your last project?\". Keep the host's wording when they gave it.",
                      "type": "string"
                    }
                  },
                  "required": ["text"],
                  "type": "object"
                },
                "type": "array"
              },
              "result_fields": {
                "description": "The complete list of fields the result reports, in the order the result shows them. It replaces the saved list: a field left out is removed, so send every field that stays again, unchanged ones as get_interview shows them. If the questions are reordered or removed, check each from_question against the new list.",
                "items": {
                  "properties": {
                    "from_question": {
                      "anyOf": [
                        {
                          "maximum": 9007199254740991,
                          "minimum": 0,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "The 0-based position of the question this field comes from, in the questions list sent with it: 0 is the first question, 2 the third. The replies number questions from 1, so \"from question 3\" is 2 here. Leave it out for a field that comes from no single question."
                    },
                    "hint": {
                      "description": "How to read the answer, if the name alone is not clear, e.g. Whole years, not counting internships.",
                      "type": ["string", "null"]
                    },
                    "name": {
                      "description": "What the result reports, e.g. Years of experience.",
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "type": "array"
              },
              "title": {
                "description": "A new title, such as Senior backend engineer screening.",
                "type": "string"
              },
              "warmup": {
                "description": "Whether the warm-up runs before the first question, such as true to turn it on. Optional: it stays as it is when left out. It is saved on its own, without questions or result_fields, and applies to a video and an audio interview alike.",
                "type": "boolean"
              }
            },
            "required": ["interview_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Update an interview"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
