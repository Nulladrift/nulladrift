        },
        {
          "name": "enquiry_describe",
          "title": "What you get: an ENQUIRY with a human (not a purchase, not a guaranteed quote)",
          "description": "Read first. States plainly what submit_enquiry does on Data Forward Flow: it starts an enquiry with Data Forward Flow, whose team reads it and replies directly. Nothing is bought, ordered or paid; no quote is guaranteed; it is free. Also returns who receives the details, the consent wording, and how the person confirms.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9f0149173de7424109aa6dc0adac982a7318f270a12d8b9c5b30171e5455eec1"
        },
        {
          "name": "enquiry_fields",
          "title": "The questions the enquiry asks",
          "description": "Every field of the Data Forward Flow enquiry: key, label, type, whether required, help text and the allowed options where there are any. Pass answers to submit_enquiry keyed by field key. With form, the questions of that guide's own form.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "form": {
                "description": "a guide's own form, for a different reader (for-ai-developers-recurring-data-feed); omit for the site's main form",
                "enum": ["for-ai-developers-recurring-data-feed"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5323998cc5000e6e903776c8acd794e7ed4ac00e1670de761f1debccedfe9250"
        },
        {
          "name": "submit_enquiry",
          "title": "Submit an ENQUIRY to Data Forward Flow (two steps; not a purchase)",
          "description": "Submits an enquiry to Data Forward Flow: NOT a purchase, NOT a guaranteed quote. Step 1: call with the answers (keyed by field key from enquiry_fields) and consent=true; it validates and returns a summary, the consent line and a confirmation token; show the person the summary and the consent line. Step 2: only if the person agrees, call again with the same answers, consent=true and the confirmation token; the enquiry is then submitted, and the person receives an email with a link they must click before the Data Forward Flow team sees it. Consent means the person has read and agreed to: \"I agree the people behind this forward flow site may read this and contact me by email.\" (with form, that guide's own consent line, which enquiry_fields returns)",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "answers": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean"]
                },
                "description": "the person's answers, keyed by field key",
                "type": "object"
              },
              "confirmation": {
                "description": "the confirmation token from step 1, after the person has approved the summary",
                "type": "string"
              },
              "consent": {
                "description": "true only when the person has agreed to: I agree the people behind this forward flow site may read this and contact me by email. (or the chosen form's own consent line)",
                "type": "boolean"
              },
              "form": {
                "description": "a guide's own form, for a different reader (for-ai-developers-recurring-data-feed); omit for the site's main form",
                "enum": ["for-ai-developers-recurring-data-feed"],
                "type": "string"
              }
            },
            "required": ["answers", "consent"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
