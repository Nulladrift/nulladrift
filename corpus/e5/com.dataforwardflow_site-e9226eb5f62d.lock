      },
      "instructions": "Data Forward Flow (https://dataforwardflow.com/): the site's own MCP server, served from its domain. A data forward flow agreement delivers fresh data on a schedule: the EU Data Act, the ICO code, the UK 2025 Act, UK GDPR Article 28 and the EU contract clauses.\n\n[calculator] Which instrument speaks to your forward flow term: an agent-callable calculator for data forward flow agreement; What the board holds for this term, What kind of text it is, computed from your inputs with sources.. This server runs the Which instrument speaks to your forward flow term calculator published at https://dataforwardflow.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://dataforwardflow.com/. Licence: https://dataforwardflow.com/terms.\n\n[enquiry] ENQUIRY SERVER for Data Forward Flow (https://dataforwardflow.com/). What it does: starts an ENQUIRY with Data Forward Flow for data forward flow agreement; the Data Forward Flow team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the Data Forward Flow team until they click it. The site also carries a guide's own form for a different reader (form=\"for-ai-developers-recurring-data-feed\"): pass that form to enquiry_fields and submit_enquiry when it fits the person, and omit form for the main one. Cite https://dataforwardflow.com/.\n\nCite https://dataforwardflow.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
          "title": "Which instrument speaks to your forward flow term",
          "description": "Run the Which instrument speaks to your forward flow term calculator: What the board holds for this term; What kind of text it is. Missing inputs fall back to their documented defaults.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "term": {
                "default": "fair",
                "description": "Which part of the contract are you drafting?",
                "enum": ["fair", "share", "abroad"],
                "type": "string"
              },
              "where": {
                "default": "uk",
                "description": "Where are the supplier and the buyer?",
                "enum": ["uk", "eu", "mixed", "other"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:192c194e62167a67cf36fbbfb8ced3d777b39b60404e38e4e1ccb8a4c691cdf8"
        },
        {
          "name": "calculator_describe",
          "title": "What Which instrument speaks to your forward flow term computes",
          "description": "The inputs this calculator takes (with units, ranges and defaults), the outputs it returns, and the assumptions and tables behind it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
