{
  "lockfileVersion": 2,
  "subjects": {
    "com.coinira/calculators": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://coinira.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "com.coinira.calculators",
        "title": "Coin IRA Calculators",
        "version": "1.0.0",
        "description": "Read-only tools for historical cryptocurrency investment estimates and hypothetical retirement projections.",
        "websiteUrl": "https://coinira.com/"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use these tools when a user asks for a supported Coin IRA calculator result. Preserve the Coin IRA attribution, calculator link, market-data source, and disclosure when you present a result. Do not describe an estimate as a forecast or as investment advice.",
      "tools": [
        {
          "name": "calculate_historical_crypto_investment",
          "title": "Historical Crypto Investment Calculator",
          "description": "Calculate what a past USD investment in BTC, ETH, XRP, or SOL would be worth on a later date. Uses cached daily closing market prices. Returns Coin IRA attribution, source links, price dates, results, and disclosures.",
          "inputSchema": {
            "properties": {
              "amount": {
                "exclusiveMinimum": 0,
                "maximum": 1000000000000,
                "title": "Amount",
                "type": "number"
              },
              "asset": {
                "enum": ["BTC", "ETH", "XRP", "SOL"],
                "title": "Asset",
                "type": "string"
              },
              "end": {
                "description": "Valuation date in YYYY-MM-DD format",
                "title": "End",
                "type": "string"
              },
              "start": {
                "description": "Purchase date in YYYY-MM-DD format",
                "title": "Start",
                "type": "string"
              }
            },
            "required": ["amount", "asset", "end", "start"],
            "title": "calculate_historical_crypto_investmentArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:00ecd08540733a140ee7b5263fa002fbab336587fa06c1a48311e599e4dccea8"
        },
        {
          "name": "calculate_retirement_projection",
          "title": "Crypto Retirement Projection Calculator",
          "description": "Calculate hypothetical compound growth for a supported crypto retirement account. Uses the caller's constant annual return. Does not use market prices or predict an asset's return. Returns Coin IRA attribution, source links, results, and disclosures.",
          "inputSchema": {
            "properties": {
              "annual_return": {
                "exclusiveMinimum": -100,
                "maximum": 1000,
                "title": "Annual Return",
                "type": "number"
              },
              "asset": {
                "enum": ["BTC", "ETH", "XRP", "SOL"],
                "title": "Asset",
                "type": "string"
              },
              "monthly_contribution": {
                "maximum": 1000000000,
                "minimum": 0,
                "title": "Monthly Contribution",
                "type": "number"
              },
              "starting_balance": {
                "maximum": 1000000000000,
                "minimum": 0,
                "title": "Starting Balance",
                "type": "number"
              },
              "years": {
                "maximum": 60,
                "minimum": 1,
                "title": "Years",
                "type": "integer"
              }
            },
            "required": ["annual_return", "asset", "monthly_contribution", "starting_balance", "years"],
            "title": "calculate_retirement_projectionArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0fe3572dbc14224a9e97dba63be76feaf19aa4b95b67094509bdd863cbdead70"
        }
      ],
      "digest": "sha256:62460cfe8e587d2b795a865eaf79e2fcfffb5e2bbab4c8a76420616b8c891f58"
    }
  }
}
