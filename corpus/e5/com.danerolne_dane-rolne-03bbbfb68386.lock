        {
          "name": "zglos_brak",
          "title": "Zgłoś brak w danych",
          "description": "Użyj, gdy w danych Dane Rolne zabrakło czegoś, czego użytkownik szukał, a Ty znalazłeś to na publicznej stronie (np. dokument z BIP, utrudnienie na drodze, wydarzenie, nabór). Po zgodzie użytkownika zapisuje rodzaj sprawy z listy, krótki temat i link do źródła, żeby redakcja Dane Rolne mogła to sprawdzić i dodać, a przy następnym pytaniu było już w danych. Przyjmujemy tylko sprawy publiczne z linkiem do źródła; bez danych osobowych i bez treści rozmowy. Zapis trafia do kolejki redakcji, nie od razu na stronę. Co przyjmujemy: https://danerolne.com/braki. Ze zgłoszeń powstaje wspólny serwis dla społeczności lokalnej, rolników i turystów. Użyj też, gdy użytkownik sam przynosi lokalną wiadomość z publicznym linkiem (wydarzenie, ogłoszenie, sukces drużyny albo zespołu) i chce, żeby trafiła do danych gminy albo do lokalnych aktualności. Najpierw pokaż, co zapiszesz, i zapisz po zgodzie.",
