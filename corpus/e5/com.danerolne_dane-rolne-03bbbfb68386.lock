          "title": "Terminy: przetargi na ziemię (KOWR i gminy)",
          "description": "Przetargi Krajowego Ośrodka Wsparcia Rolnictwa na dzierżawę i sprzedaż ziemi, z harmonogramów oddziałów terenowych: data i godzina, gmina i obręb, działki, powierzchnia i użytki rolne, czynsz wywoławczy w dt pszenicy albo cena wywoławcza w zł, przetarg ograniczony czy nie, odległość od podanej gminy i link do harmonogramu. Oddziały, których harmonogramów jeszcze nie rozbieramy na wiersze, są w polu oddzialy_tylko_harmonogram z linkami do plików. Do tego ogłoszenia gmin z BIP o sprzedaży, dzierżawie i najmie nieruchomości gminnych (gminy z serwisu Moja Gmina) w polu przetargi_gmin: tytuł, data publikacji, termin, odległość i link do ogłoszenia.",
