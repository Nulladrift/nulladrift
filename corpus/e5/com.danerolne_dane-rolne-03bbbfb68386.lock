          "title": "Targ Rolny: Ogłoszenie rolnicze",
          "description": "Co dokładnie jest w jednym ogłoszeniu i gdzie jest kontakt do sprzedawcy. Karta jednego ogłoszenia po identyfikatorze: cena z datą, ilość, gmina, opis, status sprzedawcy i link do strony ogłoszenia. Telefon i e-mail są na stronie ogłoszenia, a nie w karcie. [Moduł wiedzy Targ Rolny, https://targrolny.com; hub przekazuje pytanie do jego serwera]",
