                    "max_procent": {
                      "description": "Największy udział w %; zastępuje zalecane maksimum, a ponad nie wynik dostaje ostrzeżenie o zdrowiu ptaków",
                      "maximum": 100,
                      "minimum": 0.1,
                      "type": "number"
                    },
                    "min_procent": {
                      "description": "Najmniejszy udział tego surowca w %, np. 40, gdy ma być głównym składnikiem. Premiks lub dodatek w stałej dawce: min_procent i max_procent równe dawce z etykiety",
                      "maximum": 100,
                      "minimum": 0,
                      "type": "number"
                    },
                    "nazwa": {
                      "description": "Nazwa surowca, najlepiej dokładnie jak w skladniki_paszy, np. \"Pszenica\", \"Śruta sojowa\", \"Kreda pastewna\"",
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["nazwa"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
