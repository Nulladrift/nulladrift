        {
          "name": "pasze_szukaj_dodatkow",
          "title": "Moja Pasza: Szukaj dodatków paszowych",
          "description": "Poultry feed supplement products sold in Poland, where to buy (dodatki paszowe, czym uzupełnić brak, gdzie kupić): premix (premiks), concentrates (koncentrat), feed chalk (kreda pastewna), grit, oyster shell (muszle), phosphate (fosforan), salt, yeast, amino acids and complete ready feeds (gotowa pasza dla niosek). Search by what the feed lacks (brakuje: calcium wapn, phosphorus fosfor, protein bialko, methionine metionina), species or name. Returns producer, label dosage, nutrient content, cheapest shop offer with price per kg, price date, link and shop location, and cost per hen for 30 days (koszt na kurę). Field zapytanie takes Polish words, e.g. \"kreda\", \"pasza dla niosek\". [Moduł wiedzy Moja Pasza, https://mojapasza.com; hub przekazuje pytanie do jego serwera]",
