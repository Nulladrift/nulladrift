                "description": "Dla kogo według etykiety; produkty bez zawężenia na etykiecie też pasują. Pasze dla innych zwierząt (trzoda, bydło, konie, króliki) pokazujemy tylko, gdy gatunek, słowa albo nazwa o nie proszą. Gdy słowa zapytania nazywają inne ptaki albo sama nazwa wskazuje produkt dla jednego innego gatunku, wygrywają słowa, a odpowiedź mówi o tym w polu uwaga_o_gatunku",
                "enum": ["nioski", "odchow", "brojlery", "kaczki", "gesi", "indyki", "przepiorki", "trzoda", "bydlo", "konie", "kroliki"],
                "type": "string"
