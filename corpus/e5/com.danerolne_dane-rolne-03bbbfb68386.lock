                "description": "Czego brakuje w paszy, np. fosfor, wapn, sod, bialko, metionina",
                "enum": ["bialko", "energia", "wapn", "fosfor", "sod", "lizyna", "metionina", "treonina", "tryptofan", "mangan", "cynk", "zelazo", "selen", "jod", "miedz", "witamina_a", "witamina_d3", "witamina_e"],
                "type": "string"
              },
              "dawka_g": {
                "description": "Pasza na ptaka dziennie w g, do kosztu na kurę; bez niej dla niosek typowa z poradnika rasy",
                "maximum": 400,
                "minimum": 5,
                "type": "number"
