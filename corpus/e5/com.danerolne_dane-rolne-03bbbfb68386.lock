        {
          "name": "pasze_dobierz_proporcje",
          "title": "Moja Pasza: Dobierz proporcje mieszanki",
          "description": "W jakich proporcjach zmieszać posiadane surowce, żeby pasza dla drobiu spełniała normę albo była najtańsza. Z podanych surowców dobiera proporcje pod normę dla gatunku i okresu, tym samym algorytmem co kalkulator pasz na mojapasza.com (cel \"normy\"), albo szuka najtańszej mieszanki bliskiej normie (cel \"najtaniej\", wymaga cen). Dobiera pod energię, białko, wapń i fosfor; resztę parametrów liczy i ocenia. Każdy surowiec trzyma się zalecanego maksimum dla gatunku i wieku (np. groch: pisklęta 10%, nioski 20%), a min_procent i max_procent przy składniku pozwalają ustawić własne granice. Dodatki spoza bazy (zioła, susze) rezerwuje parametr inne_proc. Zwraca proporcje, wynik wobec normy, czego brakuje, sugestie i surowce, które doszły do limitu; z parametrem stado także kg paszy i surowców na dzień, tydzień i 30 dni. [Moduł wiedzy Moja Pasza, https://mojapasza.com; hub przekazuje pytanie do jego serwera]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
