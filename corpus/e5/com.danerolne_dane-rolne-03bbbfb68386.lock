                "enum": ["Koncentraty", "Premiksy", "Dodatki mineralne", "Produkty uboczne, śruty i oleje", "Aminokwasy i dodatki paszowe", "Mieszanki do osobnego karmidła", "Ziarna, nasiona i strączkowe", "Gotowe mieszanki (pełnoporcjowe)", "Pasze uzupełniające"],
