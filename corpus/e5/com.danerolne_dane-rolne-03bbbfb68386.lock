        {
          "name": "gmina_informacje",
          "title": "Moja Gmina: Informacje o gminie: aktualności, przetargi, dojazd, noclegi, jedzenie, kultura, atrakcje, urząd i msze",
          "description": "Polish municipality guide (gmina, informacje o gminie, co się dzieje) for residents and visitors, over 800 gminy in all 16 voivodeships. Returns local news (aktualności, ogłoszenia, BIP), events this week (wydarzenia), municipal land and property for sale or lease (przetargi, sprzedaż działki, dzierżawa, nieruchomości), public procurement and investment plots (zamówienia publiczne), bus connections (jak dojechać autobusem, dojazd), accommodation (noclegi), where to eat (gdzie zjeść, restauracje), cultural centre events and workshops (dom kultury, w domu kultury, GOK, zajęcia), tourist attractions (atrakcje, turystyka, zabytki, jeziora), town hall contacts and opening hours (urząd gminy, godziny otwarcia), waste collection (odpady, śmieci, wywóz), council sessions (sesja rady gminy, uchwały); in Gietrzwałd also sanctuary mass times (msza, msze, Sanktuarium, pielgrzymi). Most gminy so far have town hall news, events and grants (nabory); no accommodation prices or availability. Each item has its official source and date; what sources lack is listed in brakuje. Field gmina takes a Polish municipality or village name, e.g. \"Gietrzwałd\", \"Stawiguda\". [Moduł wiedzy Moja Gmina, https://mojagmina.org; hub przekazuje pytanie do jego serwera]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "gmina": {
                "description": "Nazwa gminy albo miejscowości z gminy; gminy z całej Polski (ponad 800 gmin we wszystkich 16 województwach), pełna lista na https://mojagmina.org. Wielkość liter i polskie znaki bez znaczenia. Bez wskazania gminy odpowiedź zawiera tylko listę dostępnych gmin",
                "maxLength": 80,
                "type": "string"
              },
              "temat": {
                "description": "Czego dotyczy pytanie, jedno z: wszystko (wszystko naraz), aktualnosci (aktualności: ogłoszenia gminy, BIP (obwieszczenia, zarządzenia, komunikaty) i wpisy domu kultury od publikacji do dnia, którego dotyczą, oraz wydarzenia z najbliższego tygodnia), przetargi (przetargi, sprzedaż i dzierżawa nieruchomości gminy (z BIP i ze zgłoszeń)), gospodarka (dla firm: zamówienia publiczne gminy, przetargi i oferta inwestycyjna (działki)), dojazd (dojazd autobusem z Olsztyna), noclegi (noclegi w gminie), jedzenie (gdzie zjeść i wypić kawę: restauracje, kawiarnie, pizzerie i piekarnia), kultura (dom kultury: adres, godziny, co jest w budynku, zaproszenia, wydarzenia i zajęcia), urzad (urząd gminy, informacja turystyczna, odpady, woda i kanalizacja oraz lokalna grupa działania), rada (rada gminy: najbliższe i ostatnie sesje (dzień, godzina, miejsce, zawiadomienie) i uchwały z ostatnich sesji), turystyka (atrakcje i ciekawostki: jeziora, rezerwaty, zabytki i historia miejsc, każda ze źródłem), msze (dla pielgrzymów: msze, nabożeństwa i spowiedź w Sanktuarium), uroczystosci (dla pielgrzymów: odpusty i najbliższe uroczystości), grupy (pielgrzymki i grupy), historia (historia objawień i jubileusz 2027). Inne słowa (np. wydarzenia, imprezy, autobus, dzierżawa) są dopasowywane do tych tematów. Bez tego pola: wszystko naraz",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
