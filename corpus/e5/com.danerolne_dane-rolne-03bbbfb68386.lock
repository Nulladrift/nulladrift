              },
              "rodzaj": {
                "description": "Rodzaj sprawy: drogi (Drogi i utrudnienia w ruchu); odpady_woda (Wywóz odpadów, woda, kanalizacja); urzad (Ogłoszenia urzędu i BIP); nieruchomosci (Nieruchomości i przetargi gminy); wydarzenia (Wydarzenia i zajęcia); nabory (Nabory, dotacje i konkursy); szkolenia (Szkolenia i doradztwo); miejsca (Gospodarstwo, sklep, agroturystyka albo instytucja z własną stroną); ceny (Ceny rolne i oferty sprzedaży)",
                "enum": ["drogi", "odpady_woda", "urzad", "nieruchomosci", "wydarzenia", "nabory", "szkolenia", "miejsca", "ceny"],
