        {
          "name": "ceny_historia",
          "title": "Ceny rolne: historia",
          "description": "Farm price history in Poland (historia cen): grain monthly since 2006 (wheat and dry corn also weekly since 2022), raw milk since 2004, diesel and bread since 2010 (GUS), US wheat and corn for the last 24 months. Returns points (default last 36 months or 52 weeks) and a summary: lowest and highest price with dates, year-on-year change. Nominal PLN, not adjusted for inflation. Field co takes Polish names, e.g. \"pszenica konsumpcyjna\", \"mleko\".",
          "inputSchema": {
            "properties": {
              "co": {
                "description": "Towar, np. \"pszenica konsumpcyjna\", \"kukurydza\", \"żyto\", \"mleko\", \"olej napędowy\", \"chleb\"",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "co_tydzien": {
                "description": "true: ceny co tydzień (tylko pszenica konsumpcyjna i kukurydza sucha, od 2022). Domyślnie co miesiąc.",
                "type": "boolean"
              },
              "od": {
                "description": "Od kiedy pokazać punkty: rok \"2020\" albo miesiąc \"2024-07\". Bez tego ostatnie 36 miesięcy albo 52 tygodnie.",
                "pattern": "^\\d{4}(-(0[1-9]|1[0-2]))?$",
                "type": "string"
              }
            },
            "required": ["co"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Ceny rolne: historia"
          },
          "behavior": {
            "destructive": false,
