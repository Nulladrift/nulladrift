          "description": "Answers to common laying hen keeper questions (pytania hodowców kur niosek): how many hens to start with (od ilu kur zacząć), selling eggs (sprzedaż jaj), profitability (opłacalność), which feed, hens not laying in winter (kury nie niosą zimą). Each answer has sources, a breeder's own practice and a guide link. Field pytanie takes the question in Polish. [Moduł wiedzy Moja Pasza, https://mojapasza.com; hub przekazuje pytanie do jego serwera]",
