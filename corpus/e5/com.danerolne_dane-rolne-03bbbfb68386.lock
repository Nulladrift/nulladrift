        {
          "name": "pasze_dobierz_proporcje",
          "title": "Moja Pasza: Dobierz proporcje mieszanki",
          "description": "Feed mix calculator (kalkulator paszy, jak zrobić mieszankę paszy, receptura, przepis na paszę z własnego zboża) for laying hens (kury nioski), broilers, ducks, geese and turkeys: from the farmer's own grain, peas or beans (pszenica, jęczmień, owies, pszenżyto, kukurydza, groch, bobik, łubin, śruta sojowa, kreda) returns proportions in % that meet the norm, or the cheapest mix (cel \"najtaniej\"). Returns what is missing, what to add, safe ingredient limits for the age and, with stado, kg per day and 30 days. Field nazwa takes Polish ingredient names. [Moduł wiedzy Moja Pasza, https://mojapasza.com; hub przekazuje pytanie do jego serwera]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cel": {
                "description": "normy (domyślnie) albo najtaniej",
                "enum": ["normy", "najtaniej"],
                "type": "string"
              },
              "drob": {
                "description": "Gatunek drobiu",
                "enum": ["kury-nioski-lekkie", "kury-nioski-ciezkie", "brojlery", "kaczki", "gesi", "indyki"],
                "type": "string"
              },
              "inne_proc": {
                "description": "Udział w % dodatków spoza bazy o nieznanym składzie (zioła, susze), np. 10, najwyżej 15. Liczą się jako zero: rezerwują miejsce, a energię ocenia się tylko za resztę paszy. Surowce z bazy podawaj jako składniki",
                "maximum": 15,
                "minimum": 0,
                "type": "number"
              },
              "okres": {
                "description": "Okres, np. \"Niesienie (powyżej 45%)\" albo \"starter\"",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "skladniki": {
                "description": "Surowce do użycia, bez udziałów, od 1 do 20 pozycji. Jeden składnik liczy się jako 100% mieszanki, a sugestie mówią, czym go uzupełnić",
                "items": {
                  "properties": {
                    "cena": {
                      "description": "Cena w zł za kg, potrzebna do kosztu i do celu \"najtaniej\"",
                      "exclusiveMinimum": 0,
                      "maximum": 1000,
                      "type": "number"
                    },
                    "max_procent": {
                      "description": "Największy udział w %; zastępuje zalecane maksimum, a ponad nie wynik dostaje ostrzeżenie o zdrowiu ptaków",
                      "maximum": 100,
                      "minimum": 0.1,
                      "type": "number"
                    },
                    "min_procent": {
                      "description": "Najmniejszy udział tego surowca w %, np. 40, gdy ma być głównym składnikiem. Premiks lub dodatek w stałej dawce: min_procent i max_procent równe dawce z etykiety",
                      "maximum": 100,
                      "minimum": 0,
                      "type": "number"
                    },
                    "nazwa": {
                      "description": "Nazwa surowca, najlepiej dokładnie jak w skladniki_paszy, np. \"Pszenica\", \"Śruta sojowa\", \"Kreda pastewna\"",
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["nazwa"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "sklep": {
                "description": "Tylko oferty i propozycje z jednego sklepu: sklep_id z huba Dane Rolne, czyli domena sklepu, np. specdrob.pl. Nieznany sklep daje odmowę z listą dostępnych w polu dostepne_sklepy. Gdy sklep nie ma czegoś, co uzupełnia brak, wynik podaje produkt innego sklepu albo surowiec wzorcowy z polem spoza_sklepu: true. Bez parametru oferty wszystkich sklepów",
                "maxLength": 80,
                "minLength": 3,
                "type": "string"
              },
              "stado": {
                "description": "Stado, dla którego liczy się ilość paszy na dzień, tydzień i 30 dni",
                "properties": {
                  "dawka_g": {
                    "description": "Pasza na sztukę dziennie w g; bez niej typowa dla okresu z normy_drobiu (pole dawka_typowa_g_na_sztuke)",
                    "maximum": 1000,
                    "minimum": 5,
                    "type": "number"
                  },
                  "sztuk": {
                    "description": "Liczba ptaków",
                    "maximum": 100000,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "required": ["sztuk"],
                "type": "object"
              },
              "wojewodztwo": {
                "description": "Województwo użytkownika, gdy pyta, gdzie kupić blisko (np. Olsztyn: warminsko-mazurskie). Zaznacza oferty z niego (w_twoim_wojewodztwie) i adresy odbioru osobistego; kolejności nie zmienia",
                "enum": ["dolnoslaskie", "kujawsko-pomorskie", "lubelskie", "lubuskie", "lodzkie", "malopolskie", "mazowieckie", "opolskie", "podkarpackie", "podlaskie", "pomorskie", "slaskie", "swietokrzyskie", "warminsko-mazurskie", "wielkopolskie", "zachodniopomorskie"],
                "type": "string"
