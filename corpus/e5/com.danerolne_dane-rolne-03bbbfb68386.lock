        {
          "name": "szukaj_gospodarstw_i_sklepow",
          "title": "Gospodarstwa, agroturystyki i sklepy w okolicy",
          "description": "Gdzie kupić od rolnika i gdzie przyjechać na wieś: jajka, warzywa, sery, miód, mięso, drób i zwierzęta od gospodarza, agroturystyka, noclegi i warsztaty w gospodarstwach, koła gospodyń, rzemieślnicy. Do tego sklepy i firmy zaopatrujące rolnika (np. pasze, dodatki paszowe, sprzęt). Zasięg: województwo warmińsko-mazurskie z gminami, wsiami i odległością, gospodarstwa z reszty Polski z województwem, sklepy z całej Polski. Zwraca wpisy z ofertą, sposobem zakupu, odległością od podanej gminy, poziomem zaufania, datą potwierdzenia danych i linkiem, a gdy pasuje, także moduły wiedzy na ten temat. Każde słowo z pola co musi pasować do oferty, opisu albo nazwy, więc wystarczy jedno albo dwa słowa. Katalog nie ma cen ani stanów magazynu.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "co": {
                "description": "Czego szukasz, jedno albo dwa słowa, np. \"ser\", \"jaja\", \"miód\", \"pasza\", \"nocleg\", \"warsztaty serowarskie\", \"ser kozi\"",
                "maxLength": 200,
                "type": "string"
              },
              "dzien": {
                "description": "Dzień tygodnia zakupu: pon, wt, sr, czw, pt, sob, ndz",
                "enum": ["pon", "wt", "sr", "czw", "pt", "sob", "ndz"],
                "type": "string"
              },
              "gdzie": {
                "description": "Gmina albo miasto, od którego liczyć odległość, np. \"Olsztyn\", \"Gietrzwałd\", \"Ostróda\", albo 7-cyfrowy kod TERYT gminy",
                "maxLength": 80,
                "type": "string"
              },
              "kategoria": {
                "description": "Kategoria oferty: ser, mleko, jaja, miod (miód), mieso_i_wedliny (mięso i wędliny), warzywa_i_owoce (warzywa i owoce), przetwory, ziola (zioła), pieczywo, rekodzielo (rękodzieło), zwierzeta (żywe zwierzęta (pisklęta, kurki, drób ozdobny)), pasze, dodatki_paszowe (dodatki paszowe i premiksy), kultury_i_podpuszczki (kultury i podpuszczki), sprzet (sprzęt), inne",
                "enum": ["ser", "mleko", "jaja", "miod", "mieso_i_wedliny", "warzywa_i_owoce", "przetwory", "ziola", "pieczywo", "rekodzielo", "zwierzeta", "pasze", "dodatki_paszowe", "kultury_i_podpuszczki", "sprzet", "inne"],
                "type": "string"
              },
              "limit": {
                "description": "Ile wyników zwrócić, domyślnie 10",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "promien_km": {
                "description": "Największa odległość od gminy z pola gdzie, w km. Bez tego pola wyniki są z całej Polski, od najbliższego; z nim tylko wpisy w tej odległości.",
                "minimum": 1,
                "type": "number"
              },
              "typ": {
                "description": "Rodzaj działalności, np. agroturystyka, kgw, rzemieslnik",
                "enum": ["producent", "rzemieslnik", "kgw", "agroturystyka", "sklep", "miejsce_sprzedazy", "stowarzyszenie", "zaopatrzenie", "instytucja"],
                "type": "string"
