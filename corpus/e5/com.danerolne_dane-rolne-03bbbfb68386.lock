        {
          "name": "targ_szukaj_ogloszen",
          "title": "Targ Rolny: Szukaj ogłoszeń rolniczych",
          "description": "Gdzie kupić albo komu sprzedać owies, siano, jaja i inne towary rolne, i po ile. Ogłoszenia rolnicze pogrupowane według rodzaju towaru: najniższa cena za kilogram albo sztukę z datą, liczba ofert, odległość od podanej miejscowości i linki. Oferty sprzedaży i ogłoszenia „kupię” są w osobnych grupach. Pole gospodarstwa zawiera pasujące oferty ze stron gospodarstw: nazwa, gmina, odległość, pozycje z ceną i datą oraz link, a uwaga_oferta mówi, gdy towaru teraz nie ma. Kontakt gospodarstwa zwraca narzędzie gospodarstwo. Pole sprawdz_tez, gdy towar jest w słowniku, to linki do innych serwisów, których Targ Rolny nie przeszukuje. [Moduł wiedzy Targ Rolny, https://targrolny.com; hub przekazuje pytanie do jego serwera]",
