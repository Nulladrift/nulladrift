        {
          "name": "gmina_dla_przyjezdnych",
          "title": "Gietrzwałd: dojazd, noclegi, jedzenie, kultura i msze",
          "description": "Gmina Gietrzwałd na Warmii dla przyjezdnych: dojazd autobusem z Olsztyna (linie i trasy), noclegi w gminie z katalogu (z liczbą miejsc i obsługą grup), gdzie zjeść i wypić kawę (restauracje, kawiarnie, pizzerie i piekarnia z adresem i godzinami, z listy gminnej informacji turystycznej), dom kultury (Centrum Kulturalno-Biblioteczne): adres, telefon, godziny otwarcia, co jest w budynku (biblioteka, galeria rękodzieła, informacja turystyczna), filie w innych wsiach gminy oraz ostatnie zaproszenia i wydarzenia, a także urząd gminy, informacja turystyczna i lokalna grupa działania. Osobno dla pielgrzymów: msze i uroczystości w Sanktuarium, pielgrzymki grupowe, Dom Pielgrzyma, historia objawień i jubileusz 2027. Dane ze stron gminy, informacji turystycznej, domu kultury i Sanktuarium, sprawdzane codziennie, każde ze źródłem i datą; czego żadne oficjalne źródło nie podaje (na przykład parkingi), jest w polu brakuje. Bez cen i wolnych terminów noclegów.",
          "inputSchema": {
