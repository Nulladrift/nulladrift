              "inne_proc": {
                "description": "Udział w % dodatków spoza bazy, których składu nie znamy (zioła, susze), np. 10; najwyżej 15. Liczą się jako zero: miejsce w mieszance jest zarezerwowane, a energia oceniana tylko za resztę paszy. Surowce z bazy wchodzą zwykłym składnikiem",
                "maximum": 15,
                "minimum": 0,
                "type": "number"
              },
              "okres": {
                "description": "Okres, np. \"Niesienie (powyżej 45%)\" albo \"starter\"",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "skladniki": {
                "description": "Surowce do użycia, bez udziałów, od 1 do 20 pozycji. Jeden składnik liczy się jako 100% mieszanki, a sugestie mówią, czym go uzupełnić",
                "items": {
                  "properties": {
                    "cena": {
                      "description": "Cena w zł za kg, potrzebna do kosztu i do celu \"najtaniej\"",
