        {
          "name": "estimate_quote",
          "title": "Estimate a project price",
          "description": "Get an indicative price range and suggested ongoing services (hosting, maintenance) for an app, web or interactive installation project by Lunar Creative/Technology, from the same questions as its quote request. Nothing is sent to the studio; answer as many questions as are known. Use request_quote to get a tailored quote.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "budget": {
                "description": "Budget. Options: \"under-10k\" (Under €10k), \"10k-25k\" (€10k – €25k), \"25k-50k\" (€25k – €50k), \"50k-100k\" (€50k – €100k), \"100k-plus\" (€100k+), \"unsure\" (Not sure yet).",
                "enum": ["under-10k", "10k-25k", "25k-50k", "50k-100k", "100k-plus", "unsure"],
                "type": "string"
              },
              "designs": {
                "description": "Designs. Options: \"ready\" (Designs are ready), \"partial\" (Partially designed), \"needed\" (Designs to be provided).",
                "enum": ["ready", "partial", "needed"],
                "type": "string"
              },
              "hosting": {
                "description": "Hosting. Options: \"self\" (Self-hosting), \"managed\" (Managed hosting), \"unsure\" (Not sure — advise me).",
                "enum": ["self", "managed", "unsure"],
                "type": "string"
              },
              "project": {
                "description": "Project type. Select one or more. Options: \"app\" (App), \"web\" (Web), \"installation\" (Interactive installation).",
                "items": {
                  "enum": ["app", "web", "installation"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
