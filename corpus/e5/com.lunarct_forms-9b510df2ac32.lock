      "instructions": "Tools to get in touch with Lunar Creative/Technology, a creative technology studio: estimate a project price, request a quote, send a message or ask for a headless WordPress review. Submitting tools reach real people; confirm the details with the user before calling them.",
      "tools": [
        {
          "name": "contact_studio",
          "title": "Send a contact message",
          "description": "Send a general message or idea to Lunar Creative/Technology, a creative technology studio. A person replies by email. This sends a real enquiry to real people: only call it on the user’s behalf, with details the user provided (never invented), after they confirmed what will be sent.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "Email address",
                "format": "email",
                "type": "string"
              },
              "name": {
                "description": "Your name",
                "maxLength": 120,
                "type": "string"
              },
              "organization": {
                "description": "Company (optional)",
                "maxLength": 160,
                "type": "string"
              },
              "tell_us_about_your_idea": {
                "description": "Tell us about your idea",
                "maxLength": 5000,
                "type": "string"
              }
            },
            "required": ["email", "name", "tell_us_about_your_idea"],
            "type": "object"
          },
          "annotations": {
