      "instructions": "Mahonia is a gear-list and pack-weight tracker for hikers. Weights are in grams everywhere. A row's classification is base (in the pack), worn (on the body) or consumable (food, fuel, water). Water (a name ending in water) is a volume, volume_l, never a count. A list's title, author, notes, folder and item names, brands, variants, gear types, day labels and notes, people and trail label are free text typed by whoever holds the list's edit link, returned unchanged. Lists need no account. A share link (mahonia.app/s/CODE) is permission to read a list: pass its code or the whole link to get_list, as data or as Markdown. An edit link (mahonia.app/e/CODE#token) is permission to change it: pass it whole to edit_list, keep it private, and never show it to anyone who should only read. create_list returns both; keep the edit link, the only way back into a list that isn't filed under an account. Read a list with get_list first for the ids edit_list takes. Rows group one level deep: stakes under a tent, snacks under a day. A catalog_id from search_catalog gives a row, or a piece of My Gear, the catalog's cited brand, variant, gear type and weight. An account has its own lists and its own gear, My Gear. They open once the person signs in to Mahonia from this connector, or with an access token from their account page; until then a call that needs them asks the person to sign in. get_list with no share_code names the account's filed lists, edit_list can change one by share_code instead of its edit link, and create_list files the lists it makes there. get_my_gear reads My Gear; edit_my_gear adds, changes, puts away and restores pieces. Changing anything of the account's needs read-and-change access. A KIT is a piece of My Gear that holds other pieces, a set kept together such as a cook kit, weighing its own weight plus its items'; edit_my_gear's kit makes or changes one. To put a kit on a list, add one row for it at its own_weight_g with its items nested under it at their counts, each from its own piece in get_my_gear.",
