        {
          "name": "search_catalog",
          "title": "Search the gear catalog",
          "description": "Mahonia's cited gear catalog. With query: a fuzzy search by brand, product or kind of gear (\"duplex\", \"zpacks\", \"quilt\"), best first, each result a catalog row with its id, the cited weight in grams and whether it is verified. With product_id (a row id from a search), or brand and name: every variant of that one product (sizes, lengths, temperature ratings) with the weight and source of each. A row on a list that names a catalog_id takes the catalog's brand, variant, gear type and weight.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "With name, instead of a query: the product's maker.",
                "type": "string"
              },
              "limit": {
                "description": "Matches to return, up to 25. Default 12.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "With brand, instead of a query: the product name without brand or variant.",
                "type": "string"
              },
              "product_id": {
                "description": "Instead of a query: a catalog row id, for that product's variants.",
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to search for: two characters or more, or a single Chinese character.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
