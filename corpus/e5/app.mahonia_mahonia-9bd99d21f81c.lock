                "required": ["brand", "category", "gear_type", "name"],
                "type": "object"
              },
              "query": {
                "description": "The query as searched: trimmed, at most 100 characters. On a search.",
                "type": "string"
              },
              "results": {
                "description": "A search's matches, best first; or a product's variants, in variant order.",
                "items": {
                  "properties": {
                    "brand": {
                      "type": ["string", "null"]
                    },
                    "category": {
                      "description": "The catalog's category: shelter, sleep, pack, and so on.",
