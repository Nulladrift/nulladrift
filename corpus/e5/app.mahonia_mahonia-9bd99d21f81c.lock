        {
          "name": "get_my_gear",
          "title": "Read My Gear",
          "description": "The gear the connector's account owns, most recently used first: for each piece its brand, name, variant, gear type, the kind the gear page files it under, grams for one, classification, calories, price, and product link, each left out when the piece has none; unweighed marks a piece never weighed. A kit says what it holds (kit: its own weight and its items, each a piece by id, with a count) and a piece in a kit says which (in_kits). A query ranks by a search instead. A page stops at limit or at about 64 KB, whichever comes first, and next_offset says where the next begins. Needs the person signed in to Mahonia from this connector, or an access token from their account page. Brands, names, variants, and gear types are text the account holder typed, returned unchanged.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "At most 1000; 300 when omitted. A page that would pass about 64 KB stops sooner.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "How many matches to skip, for the next page.",
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Two characters or more (one is enough in Chinese). Ranks by brand, name, variant, and gear type instead of by recent use.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
