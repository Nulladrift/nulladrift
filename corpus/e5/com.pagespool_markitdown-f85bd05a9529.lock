{
  "lockfileVersion": 2,
  "subjects": {
    "com.pagespool/markitdown": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.pagespool.com/mcp/markitdown/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "pagespool-markitdown",
        "version": "1",
        "websiteUrl": "https://pagespool.com/connect#markitdown"
      },
      "capabilities": {
        "experimental": {},
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "logging": {},
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": false
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "convert_document",
          "title": "Convert a document to Markdown with MarkItDown",
          "description": "Convert a document up to 8 MB to Markdown with MarkItDown and return it.\n\nPass the file as base64 in `content_base64`, or as a download link in\n`file`, and its name in `filename`. The extension decides the type: .pdf,\n.docx, .pptx, .xlsx, .html, .htm or .txt. Returns `markdown` and `meta`\n(`filename`, `length` in characters). PDFs come back as the text of\ntheir text layer, without headings and without OCR. Works without an\nAPI key at the anonymous rate limit.\n\nCredits: 1 per call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "content_base64": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The file content, base64-encoded. Up to 8 MB before encoding."
              },
              "file": {
                "default": null,
                "description": "The file as a download link, instead of `content_base64`. In ChatGPT, pass the user's uploaded file here. Other clients can set `download_url` to a public https URL.",
                "properties": {
                  "download_url": {
                    "description": "A public https URL of the file.",
                    "type": "string"
                  },
                  "file_id": {
                    "description": "An identifier for the file. ChatGPT sets it; other clients may pass any label, such as the file name.",
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "filename": {
                "description": "The file name with its extension (.pdf, .docx, .pptx, .xlsx, .html, .htm or .txt). The extension decides how the file is read.",
                "type": "string"
              }
            },
            "required": ["filename"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Convert a document to Markdown with MarkItDown"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            },
            "openai/fileParams": ["file"],
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:0a616b3da94c3a6310621f89b3acaa3a3f41c82822e8e8797cc4ededd8e938b4"
        }
      ],
      "digest": "sha256:685d3ae182edccf47a55ca00b6b40e8c7d1b6a5a9a1b4a8be32907c708a678f3"
    }
  }
}
