{
  "lockfileVersion": 2,
  "subjects": {
    "com.coawp/internships": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://coawp.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "coawp",
        "title": "coawp",
        "version": "2.0.1",
        "description": "Search open internships, co-ops and student jobs from employers' own job boards. No account needed.",
        "websiteUrl": "https://coawp.com",
        "icons": [
          {
            "src": "https://coawp.com/icon-192.png?v=2",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          },
          {
            "src": "https://coawp.com/icon-512.png?v=2",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://coawp.com/favicon.svg?v=2",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "coawp lists open internships, co-ops and student jobs from employers' own job boards, refreshed every 2 hours.\nsearch_roles finds them, get_roles reads full postings (to check one against a resume), and list_filters shows the values filters take, with counts.\nSearches match a person best with their majors and main skills, and where and when they can work. A role's applyUrl is the link to give people.",
      "tools": [
        {
          "name": "get_roles",
          "title": "Get roles",
          "description": "Everything about up to 5 roles by id from search_roles: all skills, majors, other boards and the employer's full posting text (hiring boilerplate left out), for checking a role against a resume or answering questions about it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "context": {
                "description": "A few words on why you are calling this tool, for the server developer's analytics. Describe people and things by role, such as \"a customer\". Do not quote the user or include names, emails, or other personal details.",
                "type": "string"
              },
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "ids": {
                "description": "Up to 5 role ids from search_roles (or their applyUrls).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "llm_model": {
                "description": "The model identifier you are running as, for example \"claude-opus-4-8\" or \"gpt-5.2\". Pass \"unknown\" if you are not certain. Recorded for the server developer's analytics.",
                "type": "string"
              }
            },
            "required": ["context", "ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get roles"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:83f4ec437db45086f713ea662ca3da5fdf3ca0ac337ab482b3d2d742b5ccfbe4"
        },
        {
          "name": "list_filters",
          "title": "List filters",
          "description": "The values search_roles filters by, each with how many open roles have it. show \"overview\" (default): types, fields, categories, majors, required languages, work terms and term lengths. show \"companies\", \"skills\" or \"places\", with an optional query, looks those up by name.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "context": {
                "description": "A few words on why you are calling this tool, for the server developer's analytics. Describe people and things by role, such as \"a customer\". Do not quote the user or include names, emails, or other personal details.",
                "type": "string"
              },
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "llm_model": {
                "description": "The model identifier you are running as, for example \"claude-opus-4-8\" or \"gpt-5.2\". Pass \"unknown\" if you are not certain. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "query": {
                "description": "Part of a company, skill or place name, like \"bank\", \"python\", \"London\".",
                "type": "string"
              },
              "show": {
                "description": "What to list: overview, companies, skills or places.",
                "enum": ["overview", "companies", "skills", "places"],
                "type": "string"
              }
            },
            "required": ["context"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List filters"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:efab0aadd0b89eb49221d084f5963f53f156b3e83232726062ba2924477797d0"
        },
        {
          "name": "search_roles",
          "title": "Search roles",
          "description": "Search open internships, co-ops and student jobs. Every argument is optional and they combine; a list matches any of its values. Newest first, except that roles with the query in their title or skills, and with more of the asked skills, come first. Returns the total, a page of roles (summary, places, terms, required skills, matched, applyUrl) and nextCursor. get_roles has the full posting.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "categories": {
                "description": "Finer areas than fields.",
                "items": {
                  "enum": ["software_engineering", "data_analytics", "ai_ml", "it_infrastructure", "cybersecurity", "product_project", "design", "quantitative_finance", "capital_markets", "investments", "accounting", "corporate_finance", "banking_advisory", "risk_compliance", "actuarial_insurance", "consulting_strategy", "business_operations", "marketing_communications", "sales_business_development", "human_resources", "legal", "engineering", "science_research", "healthcare", "education", "other"],
                  "type": "string"
                },
                "type": "array"
              },
              "companies": {
                "description": "Up to 10 company names, like [\"RBC\", \"Shopify\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "context": {
                "description": "A few words on why you are calling this tool, for the server developer's analytics. Describe people and things by role, such as \"a customer\". Do not quote the user or include names, emails, or other personal details.",
                "type": "string"
              },
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "cursor": {
                "description": "nextCursor from the previous page, with the same arguments.",
                "type": "string"
              },
              "exclude_languages": {
                "description": "Leave out roles that require these, like [\"French\"] for someone who only speaks English.",
                "items": {
                  "enum": ["English", "French", "Spanish", "Portuguese", "German", "Italian", "Mandarin", "Cantonese", "Japanese", "Korean", "Hindi", "Punjabi", "Arabic", "Other"],
                  "type": "string"
                },
                "type": "array"
              },
              "fields": {
                "description": "Broad areas of work.",
                "items": {
                  "enum": ["software", "data", "it_security", "product_design", "finance", "insurance", "business", "engineering", "science_health", "legal", "education", "other"],
                  "type": "string"
                },
                "type": "array"
              },
              "languages": {
                "description": "Only roles that require one of these languages.",
                "items": {
                  "enum": ["English", "French", "Spanish", "Portuguese", "German", "Italian", "Mandarin", "Cantonese", "Japanese", "Korean", "Hindi", "Punjabi", "Arabic", "Other"],
                  "type": "string"
                },
                "type": "array"
              },
              "lengths": {
                "description": "Term lengths in months, 1 to 24, like [4, 8].",
                "items": {
                  "maximum": 24,
                  "minimum": 1,
                  "type": "integer"
                },
                "type": "array"
              },
              "limit": {
                "description": "Roles per page, 1 to 25, default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "llm_model": {
                "description": "The model identifier you are running as, for example \"claude-opus-4-8\" or \"gpt-5.2\". Pass \"unknown\" if you are not certain. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "location": {
                "description": "A town (\"Waterloo\", \"London, ON\"), province or state (\"Ontario\", \"BC\"), country (\"Canada\"), or \"remote\". \"Toronto or remote\" adds remote roles.",
                "type": "string"
              },
              "majors": {
                "description": "Up to 10 of the person's majors: roles asking for any of them or open to any major.",
                "items": {
                  "enum": ["computer_science", "software_engineering", "computer_engineering", "electrical_engineering", "mechanical_engineering", "civil_engineering", "other_engineering", "mathematics", "statistics", "actuarial_science", "data_science", "physics", "chemistry", "biology", "health_sciences", "economics", "finance", "accounting", "business", "marketing", "human_resources", "law", "communications", "design", "arts_humanities", "social_sciences", "education"],
                  "type": "string"
                },
                "type": "array"
              },
              "posted_within_days": {
                "description": "Only roles posted in the last n days, 1 to 365.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words that must all appear (title, text, skills, company, places): \"data analyst\", \"rbc\", \"swe\". Short forms like swe, ml, pm, qa work. Also \"exact phrase\", a or b, -word.",
                "type": "string"
              },
              "radius_km": {
                "description": "How far around a town, in km: 1 to 500, default 50.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "remote": {
                "description": "Add remote roles anywhere to a location; alone, only remote roles.",
                "type": "boolean"
              },
              "skills": {
                "description": "Up to 10 skills or tools, like [\"python\", \"sql\", \"excel\"]: roles asking for any of them, those with more first.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "terms": {
                "description": "Up to 6 work terms, matched within the name: [\"Summer 2027\"], [\"fall\"], [\"2027\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "types": {
                "description": "Kinds of role.",
                "items": {
                  "enum": ["internship", "co_op", "student_job"],
                  "type": "string"
                },
                "type": "array"
              },
              "work_modes": {
                "description": "How the role is worked.",
                "items": {
                  "enum": ["onsite", "hybrid", "remote"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["context"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search roles"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:69b52c137c86ae97f3ab5b369b6d30b1f5ccf6b0c82983c1eb39cf5cbfb165ab"
        },
        {
          "name": "send_feedback",
          "description": "Send feedback about this server to its developers: a capability you needed that no tool provides, a tool that failed or misled you, or something that worked well. Records the feedback; it does not add or change tools. Leave out personal or sensitive details.",
          "inputSchema": {
            "properties": {
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "details": {
                "description": "Optional longer context: what you tried, exact parameter values, the error text you saw, and any workaround you used. Omit when the summary says it all.",
                "type": "string"
              },
              "feedback_type": {
                "description": "What kind of feedback this is. Use 'missing_capability' when the tool you needed does not exist in the tool list - nothing failed, the capability is absent. Use 'issue' when an existing tool behaved badly: it failed, returned a confusing error, or its description or schema misled you. Use 'praise' when something worked notably well. Use 'other' for anything else.",
                "enum": ["missing_capability", "issue", "praise", "other"],
                "type": "string"
              },
              "friction_points": {
                "description": "Optional: the specific moments that slowed you down, as short bullet-like sentences, quoting exact tool names, parameters, or error text.",
                "type": "string"
              },
              "llm_model": {
                "description": "The model identifier you are running as, for example \"claude-opus-4-8\" or \"gpt-5.2\". Pass \"unknown\" if you are not certain. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "sentiment": {
                "description": "Optional: how the experience felt overall.",
                "enum": ["positive", "neutral", "negative", "mixed"],
                "type": "string"
              },
              "suggested_improvement": {
                "description": "Optional: the concrete change that would have helped, e.g. the tool to add, the description to reword, or the error message to improve.",
                "type": "string"
              },
              "summary": {
                "description": "One self-contained sentence. For 'missing_capability': the capability you needed, e.g. 'No tool to delete multiple cohorts in one call.' For 'issue': the tool and the problem, e.g. 'query-trends rejects relative date ranges with an unclear error.'",
                "type": "string"
              },
              "task_completed": {
                "description": "Optional: whether you still completed the user's task despite the problem.",
                "type": "boolean"
              },
              "tool_name": {
                "description": "Optional: the existing tool this feedback is about (for 'issue' or 'praise'). Leave empty for 'missing_capability' - the point is that no tool fits.",
                "type": "string"
              }
            },
            "required": ["feedback_type", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:55ee644c4fa879c828c60bb281636338a96bb1903908c150362a4e0be5d89e4e"
        }
      ],
      "prompts": [
        {
          "name": "find_roles",
          "title": "Find roles for me",
          "description": "Find open internships, co-ops or student jobs that fit you.",
          "arguments": [
            {
              "name": "about",
              "description": "Your program and year, main skills, and the kind of work you want",
              "required": true
            },
            {
              "name": "location",
              "description": "Where you can work, or remote"
            },
            {
              "name": "term",
              "description": "When, like Summer 2027 or an 8-month co-op"
            }
          ],
          "digest": "sha256:ec806ad9280b380aff3dc1249c8831be525ae834153bf0db12a6a562cb29a753"
        },
        {
          "name": "match_resume",
          "title": "Match my resume",
          "description": "Rank open roles against your resume, with what fits and what is missing.",
          "arguments": [
            {
              "name": "resume",
              "description": "Your resume, as text",
              "required": true
            },
            {
              "name": "location",
              "description": "Where you can work, or remote"
            },
            {
              "name": "term",
              "description": "When, like Summer 2027"
            }
          ],
          "digest": "sha256:61ae2a22b05358f3869ab6215d5c3fe5568d51505130f1bd87aed66c2be51b22"
        }
      ],
      "digest": "sha256:3ecd8a50a77d70bfd9a4a8648bf5562425f6df710714496b0f8a716bb98795e8"
    }
  }
}
