      },
      "instructions": "Before the Lot is a free car-buying planner built on one method: see the dealer's four-square for what it is; lock three squares at home, in order, each backed by a document (trade-in offers in writing, a down payment, a loan pre-approval); leave the price open and talk only about the out-the-door total; set a budget ceiling, a fair price and a walk line before any dealer speaks; ask dealers for itemized quotes in writing and compare them line by line; and at the desk, take the trade-in last and treat the finance office's products as optional and separately priced. get_method returns the stages. The tools run the planner's own tested math and the sourced state rules (tax, doc-fee caps). They describe and compare numbers; they don't recommend a choice, and every result is an educational estimate, not financial, legal or tax advice. Most results include a planner link that opens with those numbers filled in. Send numbers and short labels only: names, phone numbers and email addresses are refused and nothing is stored.",
      "tools": [
        {
          "name": "check_quote",
          "title": "Check a dealer's quote",
          "description": "Reads a dealer's out-the-door quote, pasted as text (up to 8 KB) or given as line items, and checks it line by line: the out-the-door total, the doc fee against the state's cap (and capped service fees such as Ohio's $50 convenience fee), the tax line against the state's rate, finance-office add-ons with typical prices, the trade allowance against written trade-in offers, the trade equity and amount financed, and the walk line. Lines with an email address or phone number are removed before reading and never returned. Nothing is stored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "best_trade_offer": {
                "description": "The best written trade-in offer still open (CarMax, Carvana...), to compare with the allowance",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "lines": {
                "description": "The quote as line items, instead of text",
                "properties": {
                  "add_ons": {
                    "default": [],
                    "description": "Dealer add-ons and their prices (paint protection, VIN etching, a service contract)",
                    "items": {
                      "properties": {
                        "amount": {
                          "description": "Its price",
                          "maximum": 100000,
                          "minimum": 0,
                          "type": "number"
                        },
                        "name": {
                          "description": "What the dealer calls the add-on",
                          "maxLength": 60,
                          "minLength": 1,
                          "pattern": "^[^\\r\\n]*$",
                          "type": "string"
                        }
                      },
                      "required": ["amount", "name"],
                      "type": "object"
                    },
                    "maxItems": 12,
                    "type": "array"
                  },
                  "dealer": {
                    "description": "The dealership's name (a business, never a person)",
                    "maxLength": 60,
                    "minLength": 1,
                    "pattern": "^[^\\r\\n]*$",
                    "type": "string"
                  },
                  "doc_fee": {
                    "default": 0,
                    "description": "Doc fee",
                    "maximum": 5000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "other_fees": {
                    "default": 0,
                    "description": "Any other fee",
                    "maximum": 50000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "rebates": {
                    "default": 0,
                    "description": "Rebates or discounts shown below the price",
                    "maximum": 1000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "sales_tax": {
                    "default": 0,
                    "description": "The quote's sales tax line",
                    "maximum": 200000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "title_reg": {
                    "default": 0,
                    "description": "Title, registration and other government fees",
                    "maximum": 10000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "vehicle_price": {
                    "description": "Selling price before rebates, fees and tax",
                    "maximum": 1000000,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": ["vehicle_price"],
                "type": "object"
              },
              "state": {
                "description": "Two-letter state code (DC included), like PA",
                "enum": ["AK", "AL", "AR", "AZ", "CA", "CO", "CT", "DC", "DE", "FL", "GA", "HI", "IA", "ID", "IL", "IN", "KS", "KY", "LA", "MA", "MD", "ME", "MI", "MN", "MO", "MS", "MT", "NC", "ND", "NE", "NH", "NJ", "NM", "NV", "NY", "OH", "OK", "OR", "PA", "RI", "SC", "SD", "TN", "TX", "UT", "VA", "VT", "WA", "WI", "WV", "WY"],
                "type": "string"
              },
              "tax_rate": {
                "description": "Combined sales tax rate as a decimal; leave out to use the state's rate",
                "maximum": 0.25,
                "minimum": 0,
                "type": "number"
              },
              "text": {
                "description": "The quote as pasted (an email or a buyer's order). Leave out to send lines instead.",
                "maxLength": 8192,
                "type": "string"
              },
              "trade_allowance": {
                "description": "The trade-in allowance on the quote, when sending lines (read from text otherwise)",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "trade_offers": {
                "description": "Written trade-in offers, to compare the best open one with the allowance",
                "items": {
                  "properties": {
                    "amount": {
                      "description": "The offer",
                      "maximum": 1000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "expires": {
                      "description": "Its last day, yyyy-mm-dd",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "source": {
                      "description": "Who made the offer: CarMax, Carvana, a dealer. Never a person.",
                      "maxLength": 60,
                      "minLength": 1,
                      "pattern": "^[^\\r\\n]*$",
                      "type": "string"
                    }
                  },
                  "required": ["amount", "source"],
                  "type": "object"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              },
              "walk_line": {
                "description": "The walk line, out the door",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["state"],
            "type": "object"
          },
