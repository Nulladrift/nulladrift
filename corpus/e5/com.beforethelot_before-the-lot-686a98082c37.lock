        },
        {
          "name": "lease_check",
          "title": "Check a lease",
          "description": "Works a lease quote from the MSRP, selling price, residual and money factor (or the lease's APR): the depreciation and rent charges, the monthly payment with the state's lease tax, the money factor as an APR, and the total cost, including any tax charged once at the start (Texas, Ohio and others). With a loan APR and term, it also compares leasing with buying the same car over the lease's months. Use it to check a lease offer's numbers; for buying, use out_the_door.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "buy_apr": {
                "description": "A loan APR, to compare with buying",
                "maximum": 40,
                "minimum": 0,
                "type": "number"
              },
              "buy_down": {
                "default": 0,
                "description": "Down payment when buying",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "buy_out_the_door": {
                "description": "Out-the-door price when buying; leave out to estimate it",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "buy_term_months": {
                "description": "Loan term, to compare with buying",
                "maximum": 120,
                "minimum": 6,
                "type": "integer"
              },
              "city": {
                "description": "City or county in the state's rate table (23 states; state_rules says which), like Pittsburgh or Allegheny County: sets the combined rate from the state's own rate file. Where a city is in several counties (Chicago, Milwaukee), give county too. A place name only, never an address or ZIP",
                "maxLength": 60,
                "minLength": 1,
                "pattern": "^[^\\r\\n]*$",
                "type": "string"
              },
              "county": {
                "description": "County from the state's list (Pennsylvania, Nevada, Wisconsin; state_rules lists them), like Allegheny County: sets the combined rate. A county name only, never an address or ZIP",
                "maxLength": 60,
                "minLength": 1,
                "pattern": "^[^\\r\\n]*$",
                "type": "string"
              },
              "disposition_fee": {
                "default": 0,
                "description": "Turn-in fee at the end",
                "maximum": 5000,
                "minimum": 0,
                "type": "number"
              },
              "doc_fee": {
                "description": "Doc fee when buying, for the estimated out-the-door; leave out to assume the state's cap, or a typical $450 where there is none",
                "maximum": 5000,
                "minimum": 0,
                "type": "number"
              },
              "due_at_signing": {
                "default": 0,
                "description": "Cash down, lease rebates and trade equity that lower the price",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "fees": {
                "default": 0,
                "description": "Acquisition and other fees rolled into the lease",
                "maximum": 20000,
                "minimum": 0,
                "type": "number"
              },
              "lease_apr": {
                "description": "The lease's rate as an APR, instead of the money factor",
                "maximum": 40,
                "minimum": 0,
                "type": "number"
              },
              "money_factor": {
                "description": "Money factor, e.g. 0.0025",
                "maximum": 0.01,
                "minimum": 0,
                "type": "number"
              },
              "msrp": {
                "description": "MSRP (sticker price)",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "residual_percent": {
                "description": "Residual as a percent of MSRP (58 for 58%)",
                "maximum": 95,
                "minimum": 5,
                "type": "number"
              },
              "selling_price": {
                "description": "The negotiated price the lease is built on",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "state": {
                "description": "Two-letter state code (DC included), like PA",
                "enum": ["AK", "AL", "AR", "AZ", "CA", "CO", "CT", "DC", "DE", "FL", "GA", "HI", "IA", "ID", "IL", "IN", "KS", "KY", "LA", "MA", "MD", "ME", "MI", "MN", "MO", "MS", "MT", "NC", "ND", "NE", "NH", "NJ", "NM", "NV", "NY", "OH", "OK", "OR", "PA", "RI", "SC", "SD", "TN", "TX", "UT", "VA", "VT", "WA", "WI", "WV", "WY"],
