        {
          "name": "get_method",
          "title": "Get the Before the Lot method",
          "description": "The Before the Lot method for buying a car: an overview and its seven stages, from setting the budget at home to signing. Each stage says what to collect, what it produces, which guides, tools and email templates apply, and when it's done. Use it to plan a purchase step by step or to see where a step fits; pass a stage id for that stage alone. Returns text with a link to the method's page.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "stage": {
                "description": "One stage id; leave out for the whole method",
                "enum": ["see-the-four-square", "lock-three-squares", "price-as-out-the-door", "set-your-numbers", "dealers-compete", "at-the-desk", "after-the-lot"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the Before the Lot method"
