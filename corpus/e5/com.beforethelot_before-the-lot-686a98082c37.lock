                "description": "Which email: request-quote, make-offer, competing-quote, confirm-deal, decline, lender-deal",
                "enum": ["request-quote", "make-offer", "competing-quote", "confirm-deal", "decline", "lender-deal"],
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
