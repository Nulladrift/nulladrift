                    "description": "Dealer name",
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  "decide_by": {
                    "description": "A date or \"Friday\"",
                    "maxLength": 40,
                    "type": "string"
                  },
                  "down_payment": {
                    "description": "Cash down payment",
                    "maximum": 1000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "lender": {
                    "description": "Lender name",
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  "offer": {
                    "description": "The out-the-door price offered",
                    "maximum": 1000000,
                    "minimum": 0,
                    "type": "number"
