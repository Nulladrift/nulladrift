        {
          "name": "state_rules",
          "title": "State rules for buying a car",
          "description": "A state's car-buying rules: the dealer doc-fee cap or rule, sales tax (state rate, local add-on range, any cap), whether a trade-in lowers the taxed price, how a maker's rebate is taxed, and cancellation rights where on file. Each comes with its source, as-of date and confidence, plus the link to the state's page. Use it for the rules themselves; for a price with a city's local tax, use out_the_door.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "state": {
                "description": "Two-letter state code, like PA",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "State rules for buying a car"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1c06deb0133a2ff252885c3ba82f3b5aac0c949ab72b07874cc7b138cb832266"
        },
        {
          "name": "trade_in_position",
          "title": "Trade-in position",
          "description": "Sizes up a trade-in from written offers (CarMax, Carvana, dealers) and what's still owed: the best offer still open, which is the floor a dealer's trade number is compared with, the equity or negative equity, and, with a state and vehicle price, the sales tax the trade saves where the state credits it. Use it before visiting dealers; check_quote compares a quote's trade allowance with these offers.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "city": {
                "description": "City or county in the state's rate table (23 states; state_rules says which), like Pittsburgh or Allegheny County: sets the combined rate from the state's own rate file. Where a city is in several counties (Chicago, Milwaukee), give county too. A place name only, never an address or ZIP",
                "maxLength": 60,
                "minLength": 1,
                "pattern": "^[^\\r\\n]*$",
                "type": "string"
              },
              "county": {
                "description": "County from the state's list (Pennsylvania, Nevada, Wisconsin; state_rules lists them), like Allegheny County: sets the combined rate. A county name only, never an address or ZIP",
                "maxLength": 60,
                "minLength": 1,
                "pattern": "^[^\\r\\n]*$",
                "type": "string"
              },
              "doc_fee": {
                "description": "Doc fee; leave out to assume the state's cap, or a typical $450 where there is none",
                "maximum": 5000,
                "minimum": 0,
                "type": "number"
              },
              "offers": {
                "description": "Written trade-in offers, each with who made it, the amount and its last day",
                "items": {
                  "properties": {
                    "amount": {
                      "description": "The offer",
                      "maximum": 1000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "expires": {
                      "description": "Its last day, yyyy-mm-dd",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "source": {
                      "description": "Who made the offer: CarMax, Carvana, a dealer. Never a person.",
                      "maxLength": 60,
                      "minLength": 1,
                      "pattern": "^[^\\r\\n]*$",
                      "type": "string"
                    }
                  },
                  "required": ["amount", "source"],
                  "type": "object"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              },
              "payoff": {
                "default": 0,
                "description": "What is still owed on the car being traded",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "state": {
                "description": "Two-letter state code, for the tax the trade saves",
                "enum": ["AK", "AL", "AR", "AZ", "CA", "CO", "CT", "DC", "DE", "FL", "GA", "HI", "IA", "ID", "IL", "IN", "KS", "KY", "LA", "MA", "MD", "ME", "MI", "MN", "MO", "MS", "MT", "NC", "ND", "NE", "NH", "NJ", "NM", "NV", "NY", "OH", "OK", "OR", "PA", "RI", "SC", "SD", "TN", "TX", "UT", "VA", "VT", "WA", "WI", "WV", "WY"],
                "type": "string"
              },
              "tax_rate": {
                "description": "Combined sales tax rate as a decimal, local tax included (0.07 for 7%); leave out to use the state's rate",
                "maximum": 0.25,
                "minimum": 0,
                "type": "number"
              },
              "vehicle_price": {
                "description": "The price of the car being bought, for the tax the trade saves",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["offers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Trade-in position"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6a178644285b4176c4be1be324e786cfa1d9799eca59c98827a1e19cbf128aaf"
        },
        {
          "name": "what_can_i_afford",
          "title": "What can I afford",
          "description": "Works out a car budget from the monthly payment someone is comfortable with: the most that can be financed, the highest out-the-door price after the trade-in tax credit, that ceiling as dealers quote it (before the credit), and the vehicle price it leaves after the state's tax and typical fees. With a fair price from research, it also gives an opening offer and a walk line. Use it before shopping, when the starting point is a payment rather than a price. Numbers only; nothing is stored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "apr": {
                "description": "Loan APR in percent (6.49 means 6.49%); a pre-approval rate if they have one",
                "maximum": 40,
                "minimum": 0,
                "type": "number"
              },
              "city": {
                "description": "City or county in the state's rate table (23 states; state_rules says which), like Pittsburgh or Allegheny County: sets the combined rate from the state's own rate file. Where a city is in several counties (Chicago, Milwaukee), give county too. A place name only, never an address or ZIP",
                "maxLength": 60,
                "minLength": 1,
                "pattern": "^[^\\r\\n]*$",
                "type": "string"
              },
              "condition": {
                "default": "new",
                "description": "New or used: a state's tax can differ by condition",
                "enum": ["new", "used"],
                "type": "string"
              },
              "county": {
                "description": "County from the state's list (Pennsylvania, Nevada, Wisconsin; state_rules lists them), like Allegheny County: sets the combined rate. A county name only, never an address or ZIP",
                "maxLength": 60,
                "minLength": 1,
                "pattern": "^[^\\r\\n]*$",
                "type": "string"
              },
              "doc_fee": {
                "description": "Expected doc fee; leave out to assume the state's cap, or a typical $450 where there is none",
                "maximum": 5000,
                "minimum": 0,
                "type": "number"
              },
              "down": {
                "default": 0,
                "description": "Cash down payment",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "fair_price": {
                "description": "A fair vehicle price from research, before tax and fees",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "invoice": {
                "description": "Dealer invoice, for a new car, if known",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "max_payment": {
                "description": "The highest monthly payment the person is comfortable with",
                "maximum": 20000,
                "minimum": 0,
                "type": "number"
              },
              "state": {
                "description": "Two-letter state code (DC included), like PA",
                "enum": ["AK", "AL", "AR", "AZ", "CA", "CO", "CT", "DC", "DE", "FL", "GA", "HI", "IA", "ID", "IL", "IN", "KS", "KY", "LA", "MA", "MD", "ME", "MI", "MN", "MO", "MS", "MT", "NC", "ND", "NE", "NH", "NJ", "NM", "NV", "NY", "OH", "OK", "OR", "PA", "RI", "SC", "SD", "TN", "TX", "UT", "VA", "VT", "WA", "WI", "WV", "WY"],
                "type": "string"
              },
              "tax_rate": {
                "description": "Combined sales tax rate as a decimal (0.08 for 8%); leave out to use the state's rate",
                "maximum": 0.25,
                "minimum": 0,
                "type": "number"
              },
              "term_months": {
                "description": "Loan term in months",
                "maximum": 120,
                "minimum": 6,
                "type": "integer"
              },
              "title_reg": {
                "description": "Expected title and registration",
                "maximum": 10000,
                "minimum": 0,
                "type": "number"
              },
              "trade_offer": {
                "default": 0,
                "description": "Best written trade-in offer, if any",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "trade_payoff": {
                "default": 0,
                "description": "What is still owed on the trade-in",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["apr", "max_payment", "state", "term_months"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What can I afford"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0c2aae6989ce30510aac816c0395dfc8357262f329b9607d93c7a551b5308119"
        }
