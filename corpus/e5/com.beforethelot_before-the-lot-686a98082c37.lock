        {
          "name": "refinance_check",
          "title": "Check a refinance",
          "description": "Compares a car loan as it stands with a new loan at a quoted rate, by default over the same months left so a lower payment cannot hide a longer loan, with any fees counted: the new payment, the monthly difference and the total interest saved or added.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "balance": {
                "description": "What is owed today",
                "maximum": 2000000,
                "minimum": 0,
                "type": "number"
              },
              "current_apr": {
                "description": "Current APR in percent",
                "maximum": 40,
                "minimum": 0,
                "type": "number"
              },
              "current_payment": {
                "description": "Current monthly payment",
                "maximum": 50000,
                "minimum": 0,
                "type": "number"
              },
              "fees": {
                "default": 0,
                "description": "Fees for the new loan",
                "maximum": 10000,
                "minimum": 0,
                "type": "number"
              },
              "new_apr": {
                "description": "The APR a lender quoted for the new loan",
                "maximum": 40,
                "minimum": 0,
                "type": "number"
              },
              "new_term_months": {
                "description": "New term; leave out to keep the months left",
                "maximum": 120,
                "minimum": 6,
                "type": "integer"
              }
            },
            "required": ["balance", "current_apr", "current_payment", "new_apr"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a refinance"
