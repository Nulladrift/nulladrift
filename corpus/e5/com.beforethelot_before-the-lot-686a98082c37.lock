            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "details": {
                "additionalProperties": false,
                "default": {},
                "description": "What the email needs: the car, dealer, prices and loan terms. Leave out what does not apply",
                "properties": {
                  "amount_to_finance": {
                    "description": "The amount to finance, for a lender",
                    "maximum": 1000000,
                    "minimum": 0,
