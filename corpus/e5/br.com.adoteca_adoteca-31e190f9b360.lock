        },
        {
          "uri": "ui://adoteca/rescuers.html",
          "name": "ui://adoteca/rescuers.html",
          "title": "ONGs da Adoteca",
          "description": "ONGs e protetores com pets para adoção.",
          "mimeType": "text/html;profile=mcp-app",
          "meta": {
            "ui": {
              "csp": {
                "resourceDomains": ["https://media.adoteca.com.br"]
              }
            }
          },
