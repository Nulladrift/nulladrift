                "default": null,
                "description": "Raio em km (1 a 100) para `area=radius`. Mandar só `radius_km` já significa raio.",
                "title": "Radius Km"
              },
              "rescuer": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Restringe a busca a UMA ONG ou protetor: o código curto do link ou o @ do Instagram da ONG. Combina com os outros filtros ('gatos filhotes desta ONG'). Sem ele a busca cobre o catálogo inteiro.",
                "title": "Rescuer"
              },
              "sex": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Sexo: 'male'/'macho' ou 'female'/'femea'.",
                "title": "Sex"
              },
              "size": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Porte: 'small'/'pequeno', 'medium'/'medio', 'large'/'grande'.",
                "title": "Size"
              },
              "special_needs": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "true devolve somente pets com cuidados especiais; false devolve somente os que não têm nenhum registrado.",
                "title": "Special Needs"
              },
              "species": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Espécie: 'dog'/'cachorro' ou 'cat'/'gato'.",
                "title": "Species"
              },
              "state": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Sigla de duas letras da UF (SP, MG), apenas para desambiguar `city`. Busca só por estado NÃO é suportada: sempre envie `city` junto.",
                "title": "State"
              },
              "vaccinated": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "true devolve somente pets vacinados. `false` é IGNORADO: a maioria dos anúncios não informa vacinação, então filtrar por 'não vacinado' esconderia quase todo o catálogo. O valor de cada pet está em `vaccinated` (null = a ONG não informou).",
                "title": "Vaccinated"
              },
              "widen_if_empty": {
                "default": false,
                "description": "Se a área pedida não tiver pets disponíveis com os filtros, amplia a partir dela: cidades vizinhas, depois raio de 50 km, depois 100 km, parando no primeiro passo com pets. `searched_area` diz o que foi usado.",
                "title": "Widen If Empty",
                "type": "boolean"
              }
            },
