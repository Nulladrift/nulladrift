                },
                "required": ["ambiguous", "cities", "found"],
                "title": "AgentFindCityResponse",
                "type": "object"
              },
              "AgentToolError": {
                "description": "The error branch of every tool's return type.\n\nErrors are DATA, never a raised exception: a raised one aborts the calling\nmodel's tool loop, while this arrives as a normal result the model can read\nand act on. It is part of the declared output schema so a client sees the\nbranch exists before it ever hits one.",
