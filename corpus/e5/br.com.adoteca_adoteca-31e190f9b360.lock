                    "description": "Pets já anunciados nessa cidade, de qualquer data. Inclui os já adotados e anúncios antigos, então pode ser bem maior que o número disponível agora. Não prometa à pessoa que são recentes.",
                    "title": "Pet Count",
                    "type": "integer"
