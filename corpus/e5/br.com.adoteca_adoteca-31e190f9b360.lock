                  "rescuer_count": {
                    "description": "ONGs e protetores com pets anunciados nessa cidade.",
                    "title": "Rescuer Count",
                    "type": "integer"
                  },
                  "slug": {
                    "description": "Slug oficial do município no catálogo, ex.: 'santa-luzia-mg'.",
                    "title": "Slug",
                    "type": "string"
                  },
                  "state": {
                    "description": "Sigla da UF, ex.: 'MG'.",
                    "title": "State",
                    "type": "string"
                  }
                },
                "required": ["name", "pet_count", "rescuer_count", "slug", "state"],
                "title": "AgentCityMatch",
                "type": "object"
              },
              "AgentFindCityResponse": {
                "properties": {
                  "ambiguous": {
                    "description": "true = mais de uma cidade corresponde. Escolha pelo contexto da conversa ou pergunte à pessoa; NUNCA chute.",
                    "title": "Ambiguous",
                    "type": "boolean"
                  },
                  "cities": {
                    "description": "Cidades correspondentes, mais pets primeiro.",
